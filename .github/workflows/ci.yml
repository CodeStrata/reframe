name: CI

on:
  pull_request:
    branches: [main, develop, v2]
  push:
    branches: [main, develop, v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: python -m pip install -e .
      - name: Run offline tests
        run: PYTHONPATH=tests python -m unittest discover -s tests
      - name: Check the CLI
        run: reframe --help

  package:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the distribution
        run: |
          python -m pip install build
          python -m build
      - name: Check packaged modules
        run: |
          python - <<'PY'
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          root = Path('.')
          modules = tomllib.loads((root / 'pyproject.toml').read_text())['tool']['setuptools']['py-modules']
          wheel = next((root / 'dist').glob('*.whl'))
          sdist = next((root / 'dist').glob('*.tar.gz'))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              entry = archive.read(next(name for name in names if name.endswith('entry_points.txt'))).decode()
              metadata = archive.read(next(name for name in names if name.endswith('METADATA'))).decode()
          missing = [module for module in modules if f'{module}.py' not in names]
          if missing:
              raise SystemExit(f'wheel missing modules: {missing}')
          if 'reframe = reframe:main' not in entry:
              raise SystemExit('wheel is missing the reframe console script')
          if 'License: MIT' not in metadata and 'License-Expression: MIT' not in metadata:
              raise SystemExit('wheel metadata does not declare MIT')
          if not any(name.endswith('LICENSE') for name in names):
              raise SystemExit('wheel is missing LICENSE')
          with tarfile.open(sdist) as archive:
              members = archive.getmembers()
              packaged = {member.name.split('/')[-1] for member in members}
              pkg_info = next(member for member in members if member.name.endswith('PKG-INFO'))
              info = archive.extractfile(pkg_info).read().decode()
          missing = [f'{module}.py' for module in modules if f'{module}.py' not in packaged]
          if missing:
              raise SystemExit(f'sdist missing modules: {missing}')
          if 'LICENSE' not in packaged:
              raise SystemExit('sdist is missing LICENSE')
          if 'License: MIT' not in info and 'License-Expression: MIT' not in info:
              raise SystemExit('sdist metadata does not declare MIT')
          print(f'validated {wheel.name} and {sdist.name} ({len(modules)} modules)')
          PY
      - name: Install the wheel and check the CLI
        run: |
          python -m venv "${RUNNER_TEMP}/dist-check"
          "${RUNNER_TEMP}/dist-check/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/dist-check/bin/reframe" --help

  v2:
    name: v2 tests and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/pyproject.toml
      - name: Install the v2 package
        run: python -m pip install -e v2
      - name: Install Terraform for the validate test (no AWS credentials, nothing applied)
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Run v2 offline tests
        run: python -m unittest discover -s v2/tests
      - name: Check the v2 CLI
        run: reframe --help
      - name: Build and check the v2 distribution
        run: |
          python -m pip install build
          python -m build v2 --outdir "${RUNNER_TEMP}/v2-dist"
          python - "${RUNNER_TEMP}/v2-dist" <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path(sys.argv[1])
          wheel = next(dist.glob('*.whl'))
          sdist = next(dist.glob('*.tar.gz'))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              entry = archive.read(next(name for name in names if name.endswith('entry_points.txt'))).decode()
              metadata = archive.read(next(name for name in names if name.endswith('METADATA'))).decode()
          schemas = ['common', 'project_policy', 'source_snapshot', 'claim_evidence', 'human_input', 'context_map',
                     'canonical_design', 'findings_assumptions', 'operations_ledger', 'artifact_graph', 'readiness',
                     'package_manifest', 'provenance', 'resources_file']
          required_files = ['reframe_v2/__init__.py', 'reframe_v2/cli.py', 'reframe_v2/__main__.py',
                            'reframe_v2/model/store.py', 'reframe_v2/terraform/README.md', 'reframe_v2/terraform/bootstrap/main.tf',
                            'reframe_v2/terraform/project/main.tf', 'reframe_v2/terraform/modules/repo/main.tf',
                            'reframe_v2/terraform/modules/state_bucket/main.tf', 'reframe_v2/terraform/modules/bedrock_invoke/main.tf',
                            'reframe_v2/terraform/modules/neptune_graph/main.tf', 'reframe_v2/terraform/modules/reimagine_role/main.tf',
                            ] + [f'reframe_v2/schemas/{name}.schema.json' for name in schemas]
          for required in required_files:
              if required not in names:
                  raise SystemExit(f'wheel missing {required}')
          leaked = sorted(name for name in names if name.endswith('.py') and not name.startswith('reframe_v2/'))
          if leaked:
              raise SystemExit(f'wheel contains modules outside reframe_v2: {leaked}')
          if 'reframe = reframe_v2.cli:main' not in entry.splitlines():
              raise SystemExit('wheel is missing the reframe console script')
          if 'License-Expression: MIT' not in metadata and 'License: MIT' not in metadata:
              raise SystemExit('wheel metadata does not declare MIT')
          if not any(name.endswith('LICENSE') for name in names):
              raise SystemExit('wheel is missing LICENSE')
          with tarfile.open(sdist) as archive:
              if not any(member.name.endswith('/LICENSE') for member in archive.getmembers()):
                  raise SystemExit('sdist is missing LICENSE')
          print(f'validated {wheel.name} and {sdist.name}')
          PY
          python -m venv "${RUNNER_TEMP}/v2-check"
          "${RUNNER_TEMP}/v2-check/bin/python" -m pip install "${RUNNER_TEMP}"/v2-dist/*.whl
          "${RUNNER_TEMP}/v2-check/bin/reframe" --version
          "${RUNNER_TEMP}/v2-check/bin/python" -c "from reframe_v2.model import catalog; names = catalog(); assert len(names) == 14, names; print('installed schemas:', ', '.join(names))"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan with pinned gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}" \
            --output "${RUNNER_TEMP}/${asset}"
          echo "${expected}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
          "${RUNNER_TEMP}/gitleaks" detect --source . --redact --exit-code 1
