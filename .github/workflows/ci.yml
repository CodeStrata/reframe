name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Offline tests
        run: python -m unittest discover -s tests -t .
      - name: CLI
        run: reframe --help

  package:
    name: The built package installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install build && python -m build
      - name: Install the wheel in a clean environment
        run: python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
      - name: Run it, with its templates
        run: |
          cd /tmp
          /tmp/clean/bin/reframe --version
          /tmp/clean/bin/reframe --help
          /tmp/clean/bin/python -c "from reframe.report import build, compare; from reframe.design import prototype; from pathlib import Path; assert build.TEMPLATE and compare.TEMPLATE and Path(prototype.__file__).with_name('prototype.html').is_file()"
