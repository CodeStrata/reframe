<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--muted:#62625d;--line:#e2e1dc;--accent:#2f5d8a;--accent-soft:#e6eef6;--good:#2f7a4b;--warn:#9a6a12;--bad:#a33a2c;--code:#f0efea}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#ecebe6;--muted:#a3a29c;--line:#34342f;--accent:#8db6df;--accent-soft:#22303d;--good:#7cc79a;--warn:#e0b85c;--bad:#e8897b;--code:#2a2a27}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 24px 0}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;color:var(--muted);padding:10px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:20px 24px 60px}section{display:none}section.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.card b{display:block;font-size:24px}.card span{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-weight:600;cursor:pointer;white-space:nowrap}.scroll{overflow-x:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input[type=search]{flex:1;min-width:220px}.count{color:var(--muted);font-size:13px;align-self:center}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;margin:1px 2px 1px 0}
.captured{color:var(--good)}.not_applicable{color:var(--muted)}.ERROR{color:var(--bad)}.WARNING{color:var(--warn)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px}.list{max-height:75vh;overflow:auto}.list a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
.list a.on,.list a:hover{background:var(--accent-soft)}.list small{color:var(--muted)}.doc h2{font-size:18px}.doc h3{font-size:16px}.doc code{background:var(--code);padding:1px 4px;border-radius:4px}
a{color:var(--accent)}.muted{color:var(--muted)}
@media (max-width:820px){.layout{grid-template-columns:1fr}header,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <nav id="tabs"></nav>
</header>
<main>
  <section id="overview"></section>
  <section id="functions"><div class="layout"><div class="panel list" id="fnlist"></div><div class="panel doc" id="fndoc"></div></div></section>
  <section id="requirements"><div class="panel"><div class="tools"><input type="search" id="rq" placeholder="Search requirements"><select id="rdomain"></select><select id="rtype"></select><span class="count" id="rcount"></span></div><div class="scroll"><table id="rtable"></table></div></div></section>
  <section id="rules"><div class="panel"><div class="tools"><input type="search" id="bq" placeholder="Search business rules"><select id="bdomain"></select><select id="bdisp"></select><span class="count" id="bcount"></span></div><div class="scroll"><table id="btable"></table></div></div></section>
  <section id="questions"><div class="panel"><div class="tools"><input type="search" id="qq" placeholder="Search open questions"><span class="count" id="qcount"></span></div><div class="scroll"><table id="qtable"></table></div></div></section>
  <section id="datamodel"><div class="panel doc" id="dm"></div></section>
  <section id="assessment"></section>
  <section id="decisions"><div class="panel"><div class="scroll"><table id="dtable"></table></div></div></section>
</main>
<script id="data" type="application/json">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs = [['overview','Overview'],['functions','Domains and functions'],['requirements','Requirements'],['rules','Business rules'],['questions','Open questions'],['datamodel','Data model'],['assessment','Assessment'],['decisions','Decisions']];
$('title').textContent = 'Reframe assessment' + (D.project ? ': ' + D.project : '');
$('subtitle').textContent = 'Run ' + D.run + ' · source ' + (D.source.name || '') + (D.source.commit ? ' @ ' + D.source.commit.slice(0, 12) : '') + ' · report built ' + D.generated_at;
function show(id){ for (const [t] of tabs){ $(t).classList.toggle('on', t === id); document.querySelector('[data-t="'+t+'"]').classList.toggle('on', t === id);} try { history.replaceState(null, '', '#' + id); } catch (e) {} }
$('tabs').innerHTML = tabs.map(([id, label]) => '<button data-t="'+id+'">'+label+'</button>').join('');
$('tabs').addEventListener('click', e => { if (e.target.dataset.t) show(e.target.dataset.t); });

function count(list, key){ const m = {}; for (const x of list) m[x[key]] = (m[x[key]] || 0) + 1; return m; }
function table(el, cols, rows, render){
  el.innerHTML = '<thead><tr>' + cols.map(c => '<th>'+esc(c)+'</th>').join('') + '</tr></thead><tbody>' + rows.map(render).join('') + '</tbody>';
}
function options(el, label, values){ el.innerHTML = '<option value="">' + esc(label) + '</option>' + values.map(v => '<option>'+esc(v)+'</option>').join(''); }

// Overview
(function(){
  const types = count(D.requirements, 'type');
  const disp = count(D.rules, 'disposition');
  const programs = new Set(); D.functions.forEach(f => f.programs.forEach(p => programs.add(p.name)));
  const domains = new Set(D.functions.map(f => f.domain));
  const cards = [[domains.size,'business domains'],[D.functions.length,'business functions'],[programs.size,'programs in functions'],[D.requirements.length,'requirements'],
    [types.F || 0,'functional'],[types.N || 0,'non-functional'],[D.rules.length,'business rules'],[disp.captured || 0,'rules captured'],[D.questions.length,'open questions']];
  let h = '<div class="cards">' + cards.map(([n, l]) => '<div class="card"><b>'+n+'</b><span>'+l+'</span></div>').join('') + '</div>';
  h += '<div class="panel"><h3>Source</h3><p>' + esc(D.source.name) + ' (' + esc(D.source.form) + ')' + (D.source.commit ? ', commit <code>' + esc(D.source.commit) + '</code>' : '') + ', ' + esc(D.source.files) + ' files, SHA-256 <code>' + esc((D.source.sha256 || '').slice(0, 16)) + '…</code>. Neptune graph: ' + esc(D.graph || 'new') + '.</p>';
  const links = [];
  if (D.links.coverage) links.push('<a href="'+esc(D.links.coverage)+'">AWS coverage report</a>');
  if (D.links.catalog) links.push('<a href="'+esc(D.links.catalog)+'">AWS business function catalog</a> (open with app/serve.py if your browser blocks local scripts)');
  if (links.length) h += '<p>AWS\'s own pages: ' + links.join(' · ') + '</p>';
  h += '</div><div class="panel"><h3>Functions</h3><div class="scroll"><table><thead><tr><th>Domain</th><th>Function</th><th>Requirements</th><th>Rules</th><th>Captured</th><th>Open questions</th><th>Programs</th></tr></thead><tbody>';
  for (const f of D.functions) h += '<tr><td>'+esc(f.domain)+'</td><td>'+esc(f.function)+'</td><td>'+f.requirements+'</td><td>'+esc(f.summary.total_rules ?? '')+'</td><td>'+esc(f.summary.captured ?? '')+'</td><td>'+f.open_questions+'</td><td>'+f.programs.length+'</td></tr>';
  $('overview').innerHTML = h + '</tbody></table></div></div>';
})();

// Functions
(function(){
  const list = $('fnlist'); let current = 0;
  list.innerHTML = D.functions.map((f, i) => '<a href="#" data-i="'+i+'"><small>'+esc(f.domain)+'</small><br>'+esc(f.function)+' <small>· '+f.requirements+' req.</small></a>').join('');
  function open(i){
    current = i; const f = D.functions[i]; if (!f) return;
    list.querySelectorAll('a').forEach(a => a.classList.toggle('on', +a.dataset.i === i));
    const chips = (label, xs) => xs.length ? '<p><b>'+label+':</b> ' + xs.map(x => '<span class="tag">'+esc(x)+'</span>').join('') + '</p>' : '';
    $('fndoc').innerHTML = '<p class="muted">'+esc(f.domain)+'</p>' + chips('Programs', f.programs.map(p => p.name + (p.execution ? ' (' + p.execution + ')' : ''))) +
      chips('Batch jobs', f.jobs) + chips('Screens', f.screens) + chips('Data stores', f.data_stores) + f.markdown;
  }
  list.addEventListener('click', e => { const a = e.target.closest('a'); if (a){ e.preventDefault(); open(+a.dataset.i); } });
  open(0);
})();

// Requirements
(function(){
  options($('rdomain'), 'All domains', [...new Set(D.requirements.map(r => r.domain))].sort());
  options($('rtype'), 'All types', [...new Set(D.requirements.map(r => r.type))].sort());
  function draw(){
    const q = $('rq').value.toLowerCase(), d = $('rdomain').value, t = $('rtype').value;
    const rows = D.requirements.filter(r => (!d || r.domain === d) && (!t || r.type === t) && (!q || (r.id + ' ' + r.text + ' ' + r.function + ' ' + r.capability + ' ' + r.programs.join(' ')).toLowerCase().includes(q)));
    $('rcount').textContent = rows.length + ' of ' + D.requirements.length;
    table($('rtable'), ['ID', 'Domain', 'Function', 'Capability', 'Requirement', 'Programs'], rows.slice(0, 2000),
      r => '<tr><td><code>'+esc(r.id)+'</code></td><td>'+esc(r.domain)+'</td><td>'+esc(r.function)+'</td><td>'+esc(r.capability)+'</td><td>'+(r.pattern ? '<span class="tag">'+esc(r.pattern)+'</span> ' : '')+esc(r.text)+'</td><td>'+r.programs.map(p => '<span class="tag">'+esc(p)+'</span>').join('')+'</td></tr>');
  }
  ['rq', 'rdomain', 'rtype'].forEach(id => $(id).addEventListener('input', draw)); draw();
})();

// Business rules
(function(){
  options($('bdomain'), 'All domains', [...new Set(D.rules.map(r => r.domain))].sort());
  options($('bdisp'), 'All dispositions', [...new Set(D.rules.map(r => r.disposition))].sort());
  function draw(){
    const q = $('bq').value.toLowerCase(), d = $('bdomain').value, s = $('bdisp').value;
    const rows = D.rules.filter(r => (!d || r.domain === d) && (!s || r.disposition === s) && (!q || (r.name + ' ' + r.text + ' ' + r.program + ' ' + r.function + ' ' + r.requirements.join(' ')).toLowerCase().includes(q)));
    $('bcount').textContent = rows.length + ' of ' + D.rules.length;
    table($('btable'), ['Function', 'Program', 'Rule', 'Disposition', 'Backs'], rows.slice(0, 3000),
      r => '<tr><td>'+esc(r.function)+'<br><small class="muted">'+esc(r.domain)+'</small></td><td>'+esc(r.program)+'</td><td><b>'+esc(r.name)+'</b><br>'+esc(r.text)+'</td><td class="'+esc(r.disposition)+'">'+esc(r.disposition)+'</td><td>'+r.requirements.map(x => '<span class="tag">'+esc(x)+'</span>').join('')+'</td></tr>');
  }
  ['bq', 'bdomain', 'bdisp'].forEach(id => $(id).addEventListener('input', draw)); draw();
})();

// Open questions
(function(){
  function draw(){
    const q = $('qq').value.toLowerCase();
    const rows = D.questions.filter(x => !q || (x.text + ' ' + x.function + ' ' + x.capability).toLowerCase().includes(q));
    $('qcount').textContent = rows.length + ' of ' + D.questions.length;
    table($('qtable'), ['Domain', 'Function', 'Capability', 'Question'], rows, x => '<tr><td>'+esc(x.domain)+'</td><td>'+esc(x.function)+'</td><td>'+esc(x.capability)+'</td><td>'+esc(x.text)+'</td></tr>');
  }
  $('qq').addEventListener('input', draw); draw();
})();

$('dm').innerHTML = D.data_model || '<p class="muted">AWS wrote no data model.</p>';

// Assessment
(function(){
  let h = '<div class="panel"><h3>Source files by type</h3><div class="scroll"><table><thead><tr><th>Type</th><th>Files</th></tr></thead><tbody>' +
    D.classification.map(([t, n]) => '<tr><td>'+esc(t)+'</td><td>'+n+'</td></tr>').join('') + '</tbody></table></div></div>';
  h += '<div class="panel"><h3>Codebase issues</h3><div class="scroll"><table><thead><tr><th>Severity</th><th>Issue</th><th>What to do</th></tr></thead><tbody>' +
    D.issues.map(i => '<tr><td class="'+esc(i.severity)+'">'+esc(i.severity)+'</td><td><b>'+esc(i.name)+'</b><br>'+esc(i.description)+'</td><td>'+esc(i.action)+'</td></tr>').join('') + '</tbody></table></div></div>';
  if (D.unclassified.length) h += '<div class="panel"><h3>Files AWS could not classify</h3><div class="scroll"><table><thead><tr><th>File</th><th>Reason</th></tr></thead><tbody>' +
    D.unclassified.map(u => '<tr><td>'+esc(u.path)+'</td><td>'+esc(u.reason)+'</td></tr>').join('') + '</tbody></table></div></div>';
  $('assessment').innerHTML = h;
})();

table($('dtable'), ['When', 'AWS asked', 'Reframe answered', 'Why'], D.decisions,
  d => '<tr><td>'+esc(d.at)+'</td><td>'+esc(d.question)+'</td><td>'+esc(typeof d.answer === 'string' ? d.answer : JSON.stringify(d.answer))+'</td><td>'+esc(d.reason)+'</td></tr>');

show((location.hash || '#overview').slice(1).split('?')[0] in Object.fromEntries(tabs) ? (location.hash || '#overview').slice(1) : 'overview');
</script>
</body>
</html>
