<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d1d1b;--muted:#5f5f5a;--line:#e1e0da;--accent:#2f5d8a;--accent-soft:#e7eef6;
  --agree:#2f7a4b;--agree-soft:#e6f3ea;--change:#a8620c;--change-soft:#fbf0e1;--ask:#7a3fa8;--ask-soft:#f1e9f8;--warn:#9a6a12;--bad:#a33a2c;--code:#f0efea;--quote:#f3f6f9}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--panel:#1e1e1c;--ink:#ecebe6;--muted:#a5a49e;--line:#33332f;--accent:#8db6df;--accent-soft:#223040;
  --agree:#7cc79a;--agree-soft:#1d2e23;--change:#e3a95b;--change-soft:#33281a;--ask:#c39be6;--ask-soft:#2c2236;--warn:#e0b85c;--bad:#e8897b;--code:#2a2a27;--quote:#1f262d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{flex:1;min-width:240px}.brand h1{font-size:18px;margin:0}.brand div{color:var(--muted);font-size:13px}
.bar input[type=search]{width:300px;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.views{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:4px}
.views a{padding:8px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}.views a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:18px 24px 80px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}.crumbs a{text-decoration:none}.crumbs span{margin:0 6px}
h2{font-size:24px;margin:4px 0 6px}h3{font-size:17px;margin:22px 0 10px}
.lead{color:var(--muted);max-width:820px;margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.numbers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.numbers div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.numbers b{display:block;font-size:24px}.numbers span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--accent)}.card h4{margin:0 0 4px;font-size:16px}.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.counts{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.counts b{color:var(--ink)}
.progress{margin-top:10px;font-size:12px;color:var(--muted)}.progress i{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.progress i b{display:block;height:100%;background:var(--agree)}
.caprow{display:flex;gap:14px;align-items:flex-start}.caprow .num{font-weight:700;color:var(--accent);min-width:26px}
.story{background:var(--quote);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:8px 0 12px}
.fields{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px;margin:0 0 12px}.fields dt{color:var(--muted)}.fields dd{margin:0}
.item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.item.agree{border-left-color:var(--agree)}.item.change{border-left-color:var(--change)}.item.question{border-left-color:var(--ask)}
.item .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:13px;color:var(--muted)}
.item .text{font-size:15px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12px}
.tag.grey{background:var(--code);color:var(--muted)}.tag.warn{background:var(--change-soft);color:var(--change)}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.marks button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:4px 10px;border-radius:16px;font-size:13px}
.marks button[aria-pressed=true].agree{background:var(--agree-soft);color:var(--agree);border-color:var(--agree)}
.marks button[aria-pressed=true].change{background:var(--change-soft);color:var(--change);border-color:var(--change)}
.marks button[aria-pressed=true].question{background:var(--ask-soft);color:var(--ask);border-color:var(--ask)}
.marks textarea{flex-basis:100%;min-height:54px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent);font-size:14px}
.rules{margin:8px 0 0 10px;padding-left:12px;border-left:2px solid var(--line)}.rules .item{margin-top:8px}
.pager{display:flex;justify-content:space-between;gap:12px;margin:18px 0}
.muted{color:var(--muted)}.small{font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--panel);font-weight:600}
.scroll{overflow-x:auto}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.tools input{flex:1;min-width:220px}.doc h2{font-size:18px}.doc h3,.doc h4{font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs a{padding:6px 12px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--muted);font-size:14px}.tabs a.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:520px;width:92vw;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.35)}dialog label{display:block;font-size:14px;margin:10px 0 4px}dialog input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.note{background:var(--change-soft);color:var(--change);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
@media (max-width:720px){.bar,.views,main{padding-left:16px;padding-right:16px}.bar input[type=search]{width:100%}}
@media print{header .bar input,header .bar .btn,.views,.marks button,.pager{display:none}header{position:static}.item{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><h1 id="title"></h1><div id="subtitle"></div></div>
    <input type="search" id="search" placeholder="Search requirements, rules, questions" aria-label="Search">
    <button class="btn primary" id="reviewButton">Your review</button>
  </div>
  <nav class="views"><a href="#/" id="vReview">Business review</a><a href="#/tech/requirements" id="vTech">Technical detail</a></nav>
</header>
<main id="main"></main>

<dialog id="reviewDialog">
  <h3 style="margin-top:0">Your review</h3>
  <p class="small muted" id="storageNote">Your marks are kept in this browser only. Download them and send the file to whoever leads the review.</p>
  <label for="reviewer">Your name</label><input id="reviewer" autocomplete="name">
  <p id="reviewCounts"></p>
  <div class="row">
    <button class="btn primary" id="downloadCsv">Download for a spreadsheet (CSV)</button>
    <button class="btn" id="downloadJson">Download as JSON</button>
  </div>
  <div class="row"><button class="btn" id="clearMarks">Clear all my marks</button><span style="flex:1"></span><button class="btn" id="closeDialog">Close</button></div>
</dialog>

<script id="data" type="application/json">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
// AWS writes names in backticks (`TCATBAL-FILE`); show them as code, escaped like everything else.
const prose = v => esc(v).replace(/`([^`]+)`/g, '<code>$1</code>');

// ---- indexes ----------------------------------------------------------------------------------------
const fnById = {}, capById = {}, reqByKey = {}, ruleByKey = {}, qByKey = {}, domByKey = {};
D.functions.forEach((f, i) => { f.index = i; fnById[f.id] = f; });
D.capabilities.forEach((c, i) => { c.index = i; capById[c.id] = c; });
D.requirements.forEach(r => reqByKey[r.key] = r);
D.rules.forEach(r => ruleByKey[r.key] = r);
D.questions.forEach(q => qByKey[q.key] = q);
D.domains.forEach((d, i) => { d.index = i; domByKey[d.key] = d; });
const business = D.rules.filter(r => r.disposition === 'captured');

function capItems(c){
  const keys = new Set();
  c.requirements.forEach(k => { keys.add(k); (reqByKey[k].rules || []).forEach(r => { if (ruleByKey[r] && ruleByKey[r].disposition === 'captured') keys.add(r); }); });
  c.questions.forEach(k => keys.add(k));
  return keys;
}
function fnItems(f){ const keys = new Set(); f.capabilities.forEach(id => capItems(capById[id]).forEach(k => keys.add(k))); f.other_rules.forEach(k => keys.add(k)); return keys; }
function domItems(d){ const keys = new Set(); d.functions.forEach(id => fnItems(fnById[id]).forEach(k => keys.add(k))); return keys; }
function countsOf(keys){ let req = 0, rule = 0, q = 0; keys.forEach(k => { if (reqByKey[k]) req++; else if (ruleByKey[k]) rule++; else if (qByKey[k]) q++; }); return {req, rule, q}; }

// ---- review marks, kept in this browser ---------------------------------------------------------------
const STORE = 'reframe-review:' + (D.project || '') + ':' + D.run + ':' + String(D.source.sha256 || '').slice(0, 16);
let marks = {}, stored = true;
try { marks = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { stored = false; }
let reviewer = ''; try { reviewer = localStorage.getItem('reframe-reviewer') || ''; } catch (e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch (e) { stored = false; } }
function reviewed(keys){ let n = 0; keys.forEach(k => { if (marks[k] && marks[k].status) n++; }); return n; }
function progress(keys){
  const total = keys.size, done = reviewed(keys), pct = total ? Math.round(100 * done / total) : 0;
  return '<div class="progress">' + done + ' of ' + total + ' reviewed<i><b style="width:' + pct + '%"></b></i></div>';
}
const STATUSES = [['agree', '✓ Agree'], ['change', '✎ Needs change'], ['question', '? Question']];
function markControls(key, hint){
  const m = marks[key] || {};
  return '<div class="marks" data-key="' + esc(key) + '">' + STATUSES.map(([s, label]) =>
    '<button class="' + s + '" aria-pressed="' + (m.status === s) + '" data-status="' + s + '">' + label + '</button>').join('') +
    (m.status ? '<textarea placeholder="' + esc(hint || 'Comment (optional): what should change, or what you want to ask') + '">' + esc(m.comment || '') + '</textarea>' : '') + '</div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('.marks button'); if (!b) return;
  const box = b.closest('.marks'), key = box.dataset.key, status = b.dataset.status;
  const m = marks[key] || {};
  if (m.status === status) delete marks[key]; else marks[key] = {status, comment: m.comment || '', at: new Date().toISOString()};
  save();
  const item = box.closest('.item'); if (item) item.className = 'item ' + ((marks[key] || {}).status || '');
  box.outerHTML = markControls(key);
});
document.addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const key = e.target.closest('.marks').dataset.key;
  if (marks[key]) { marks[key].comment = e.target.value; marks[key].at = new Date().toISOString(); save(); }
});

// ---- small pieces -----------------------------------------------------------------------------------
const PATTERN = {'Ubiquitous': 'Always', 'Event-driven': 'When something happens', 'State-driven': 'While a condition holds',
  'Unwanted': 'If something goes wrong', 'Optional': 'Where a feature applies', 'Complex': 'Combined conditions'};
function crumbs(parts){ return '<div class="crumbs">' + parts.map(([label, href]) => href ? '<a href="' + href + '">' + esc(label) + '</a>' : '<b>' + esc(label) + '</b>').join('<span>›</span>') + '</div>'; }
function numbers(list){ return '<div class="numbers">' + list.map(([n, l]) => '<div><b>' + n + '</b><span>' + esc(l) + '</span></div>').join('') + '</div>'; }
function countLine(c, extra){ return '<div class="counts">' + (extra || '') + '<span><b>' + c.req + '</b> requirements</span><span><b>' + c.rule + '</b> business rules</span><span><b>' + c.q + '</b> open questions</span></div>'; }
function ruleCard(key){
  const r = ruleByKey[key]; if (!r) return '';
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><span class="tag grey">Business rule</span><span>' + esc(r.program) + '</span></div>' +
    '<div class="text"><b>' + prose(r.name) + '</b><br>' + prose(r.text) + '</div>' + markControls(key) + '</div>';
}
function requirementCard(key){
  const r = reqByKey[key];
  const rules = (r.rules || []).filter(k => ruleByKey[k] && ruleByKey[k].disposition === 'captured');
  const kind = r.kind === 'N' ? 'Non-functional' : 'Functional';
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><code>' + esc(r.code) + '</code><span class="tag">' + esc(PATTERN[r.pattern] || r.pattern || kind) + '</span>' +
    (r.kind === 'N' ? '<span class="tag grey">Non-functional</span>' : '') + '</div><div class="text">' + prose(r.text) + '</div>' + markControls(key) +
    (rules.length ? '<details><summary>' + plural(rules.length, 'business rule') + ' behind it</summary><div class="rules">' + rules.map(ruleCard).join('') + '</div></details>' : '') + '</div>';
}
function questionCard(key){
  const q = qByKey[key];
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><code>' + esc(q.code) + '</code>' +
    (q.unverified ? '<span class="tag warn">Unverified requirement: please confirm</span>' : '<span class="tag">Open question</span>') +
    (q.owner ? '<span>For: ' + esc(q.owner) + '</span>' : '') + '</div><div class="text">' + prose(q.text) + '</div>' +
    markControls(key, 'Your answer, or what is missing') + '</div>';
}
function anchor(key){ return 'i-' + key.replace(/[^A-Za-z0-9_-]/g, '_'); }

// ---- the business review, top down ------------------------------------------------------------------
function overview(){
  const biz = D.domains.filter(d => d.kind === 'business');
  const all = new Set(); D.domains.forEach(d => domItems(d).forEach(k => all.add(k)));
  let h = '<h2>What AWS Transform found in ' + esc(D.source.name || D.project || 'the source') + '</h2>' +
    '<p class="lead">AWS Transform read ' + esc(D.source.files || 'the') + ' source files and describes what the system does as business domains, business functions, ' +
    'capabilities, requirements and business rules. Please check that this matches how the business works. Start with a domain, go down to its functions and capabilities, ' +
    'and mark each requirement, rule and question: <b>Agree</b>, <b>Needs change</b> or <b>Question</b>. When you are done, open <b>Your review</b> to download your marks.</p>';
  h += numbers([[biz.length, 'business domains'], [D.functions.length, 'business functions'], [D.capabilities.length, 'capabilities'],
    [D.requirements.length, 'requirements'], [business.length, 'business rules'], [D.questions.length, 'open questions']]);
  h += '<div class="panel">' + progress(all) + '</div>';
  h += '<h3>Business domains</h3><div class="grid">' + biz.map(domainCard).join('') + '</div>';
  const other = D.domains.filter(d => d.kind !== 'business');
  if (other.length) h += '<h3>Also assessed</h3><div class="grid">' + other.map(domainCard).join('') + '</div>';
  h += '<p class="small muted" style="margin-top:22px">Source: ' + esc(D.source.name) + (D.source.commit ? ', commit ' + esc(String(D.source.commit).slice(0, 12)) : '') +
    ', SHA-256 ' + esc(String(D.source.sha256 || '').slice(0, 16)) + '… · results retrieved ' + esc(D.retrieved_at || '') + ' · page built ' + esc(D.generated_at) + '</p>';
  return h;
}
function domainCard(d){
  const keys = domItems(d);
  return '<a class="card" href="#/d/' + d.index + '"><h4>' + esc(d.name) + '</h4><p>' + esc(d.description || '') + '</p>' +
    countLine(countsOf(keys), '<span><b>' + d.functions.length + '</b> functions</span>') + progress(keys) + '</a>';
}
function domainPage(d){
  let h = crumbs([['Overview', '#/'], [d.name]]) + '<h2>' + esc(d.name) + '</h2><p class="lead">' + esc(d.description || '') + '</p>';
  h += '<h3>' + plural(d.functions.length, 'business function') + '</h3><div class="grid">' + d.functions.map(id => {
    const f = fnById[id], keys = fnItems(f);
    return '<a class="card" href="#/f/' + f.index + '"><h4>' + esc(f.name) + '</h4><p>' + esc(f.description || '') + '</p>' +
      countLine(countsOf(keys), '<span><b>' + f.capabilities.length + '</b> capabilities</span>') + progress(keys) + '</a>';
  }).join('') + '</div>';
  return h;
}
function functionPage(f){
  const d = domByKey[f.domain];
  let h = crumbs([['Overview', '#/'], [d.name, '#/d/' + d.index], [f.name]]) + '<h2>' + esc(f.name) + '</h2><p class="lead">' + esc(f.description || '') + '</p>';
  h += '<div class="panel">' + countLine(countsOf(fnItems(f))) + progress(fnItems(f)) + '</div>';
  h += '<h3>' + plural(f.capabilities.length, 'capability', 'capabilities') + '</h3>';
  h += f.capabilities.map(id => {
    const c = capById[id], keys = capItems(c);
    return '<a class="card" style="margin-bottom:10px" href="#/c/' + c.index + '"><div class="caprow"><span class="num">' + c.number + '</span><div style="flex:1"><h4>' + esc(c.title) + '</h4>' +
      '<p>' + esc(c.story.length > 260 ? c.story.slice(0, 257) + '…' : c.story) + '</p>' + countLine(countsOf(keys)) + progress(keys) + '</div></div></a>';
  }).join('');
  const notes = f.notes.filter(n => !n.technical);
  if (notes.length) h += '<h3>Notes for the whole function</h3>' + notes.map(n => '<details class="panel doc"><summary>' + esc(n.heading) + '</summary>' + n.html + '</details>').join('');
  if (f.other_rules.length) h += '<h3>Other business rules</h3><p class="small muted">Rules AWS kept for this function that no requirement cites.</p>' + f.other_rules.map(ruleCard).join('');
  if (f.set_aside.length) h += '<details class="panel"><summary>' + plural(f.set_aside.length, 'technical step') + ' AWS set aside</summary><p class="small muted">AWS judged these not to be business rules (for example opening a file). They are not part of the review.</p>' +
    f.set_aside.map(k => { const r = ruleByKey[k]; return '<p><b>' + prose(r.name) + '</b> <span class="muted small">' + esc(r.program) + ' · ' + esc(r.reason) + '</span><br>' + prose(r.text) + '</p>'; }).join('') + '</details>';
  const t = f.technical, chips = (label, xs) => xs.length ? '<p><b>' + label + ':</b> ' + xs.map(x => '<span class="tag grey">' + esc(x) + '</span> ').join('') + '</p>' : '';
  h += '<details class="panel"><summary>Programs, jobs, screens and data stores</summary>' + chips('Programs', t.programs.map(p => p.name + (p.execution ? ' (' + p.execution + ')' : ''))) +
    chips('Batch jobs', t.jobs) + chips('Screens', t.screens) + chips('Data stores', t.data_stores) + '</details>';
  return h;
}
function capabilityPage(c, focus){
  const f = fnById[c.function], d = domByKey[f.domain];
  let h = crumbs([['Overview', '#/'], [d.name, '#/d/' + d.index], [f.name, '#/f/' + f.index], [c.number + '. ' + c.title]]);
  h += '<h2>' + c.number + '. ' + esc(c.title) + '</h2>';
  if (c.story) h += '<div class="story">' + prose(c.story) + '</div>';
  const fields = Object.entries(c.fields || {});
  if (fields.length) h += '<dl class="fields">' + fields.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + prose(v) + '</dd>').join('') + '</dl>';
  h += '<div class="panel">' + countLine(countsOf(capItems(c))) + progress(capItems(c)) + '</div>';
  const fr = c.requirements.filter(k => reqByKey[k].kind !== 'N'), nf = c.requirements.filter(k => reqByKey[k].kind === 'N');
  if (fr.length) h += '<h3>Requirements</h3>' + fr.map(requirementCard).join('');
  if (nf.length) h += '<h3>Non-functional requirements</h3>' + nf.map(requirementCard).join('');
  if (c.questions.length) h += '<h3>Open questions for the business</h3>' + c.questions.map(questionCard).join('');
  if (c.other) h += '<details class="panel doc"><summary>More from AWS</summary>' + c.other + '</details>';
  const siblings = f.capabilities, at = siblings.indexOf(c.id), prev = capById[siblings[at - 1]], next = capById[siblings[at + 1]];
  h += '<div class="pager"><span>' + (prev ? '<a class="btn" href="#/c/' + prev.index + '">← ' + prev.number + '. ' + esc(prev.title) + '</a>' : '') + '</span>' +
    '<span>' + (next ? '<a class="btn" href="#/c/' + next.index + '">' + next.number + '. ' + esc(next.title) + ' →</a>' : '<a class="btn" href="#/f/' + f.index + '">Back to ' + esc(f.name) + '</a>') + '</span></div>';
  return h;
}

// ---- search -----------------------------------------------------------------------------------------
function where(fid, cid){ const f = fnById[fid], c = capById[cid]; return esc(f ? f.name : '') + (c ? ' › ' + c.number + '. ' + esc(c.title) : ''); }
function capOfRule(key){ const r = D.requirements.find(x => (x.rules || []).includes(key)); return r ? r.capability : null; }
function searchPage(q){
  const t = q.toLowerCase(), hits = [];
  for (const r of D.requirements) if ((r.code + ' ' + r.text).toLowerCase().includes(t)) hits.push(['Requirement', r.code, r.text, r.function, r.capability, r.key]);
  for (const r of business) if ((r.name + ' ' + r.text + ' ' + r.program).toLowerCase().includes(t)) hits.push(['Business rule', r.program, r.name + ': ' + r.text, r.function, null, r.key]);
  for (const x of D.questions) if ((x.code + ' ' + x.text + ' ' + x.owner).toLowerCase().includes(t)) hits.push(['Open question', x.code, x.text, x.function, x.capability, x.key]);
  for (const c of D.capabilities) if ((c.title + ' ' + c.story).toLowerCase().includes(t)) hits.push(['Capability', c.number + '.', c.title, c.function, c.id, null]);
  let h = crumbs([['Overview', '#/'], ['Search']]) + '<h2>' + plural(hits.length, 'match', 'matches') + ' for “' + esc(q) + '”</h2>';
  h += hits.slice(0, 300).map(([type, code, text, fid, cid, key]) => {
    const cap = cid || (key ? capOfRule(key) : null), c = capById[cap];
    const href = c ? '#/c/' + c.index + (key ? '/' + encodeURIComponent(key) : '') : '#/f/' + fnById[fid].index;
    return '<a class="card" style="margin-bottom:8px" href="' + href + '"><div class="head small muted"><span class="tag">' + type + '</span> ' + esc(code) + ' · ' + where(fid, cap) + '</div><div>' + esc(text.length > 300 ? text.slice(0, 297) + '…' : text) + '</div></a>';
  }).join('');
  if (hits.length > 300) h += '<p class="muted">Showing the first 300. Add words to narrow the search.</p>';
  return h;
}

// ---- technical detail -------------------------------------------------------------------------------
const TECH = [['requirements', 'All requirements'], ['rules', 'All rules'], ['questions', 'Open questions'], ['datamodel', 'Data model'], ['assessment', 'Assessment'], ['decisions', "Reframe's answers to AWS"], ['aws', "AWS's own pages"]];
function techPage(tab){
  let h = '<h2>Technical detail</h2><div class="tabs">' + TECH.map(([id, label]) => '<a href="#/tech/' + id + '" class="' + (id === tab ? 'on' : '') + '">' + label + '</a>').join('') + '</div>';
  const fname = id => esc((fnById[id] || {}).name || id);
  if (tab === 'requirements') h += filtered('All requirements', D.requirements, r => r.code + ' ' + r.text + ' ' + (fnById[r.function] || {}).name + ' ' + r.programs.join(' '),
    ['ID', 'Function', 'Capability', 'When', 'Requirement', 'Programs'], r => '<tr><td><code>' + esc(r.code) + '</code></td><td>' + fname(r.function) + '</td><td>' + esc((capById[r.capability] || {}).title) +
      '</td><td>' + esc(PATTERN[r.pattern] || r.pattern) + '</td><td>' + esc(r.text) + '</td><td>' + esc(r.programs.join(', ')) + '</td></tr>');
  if (tab === 'rules') h += filtered('All rules', D.rules, r => r.name + ' ' + r.text + ' ' + r.program + ' ' + r.disposition + ' ' + (fnById[r.function] || {}).name,
    ['Function', 'Program', 'Rule', 'AWS kept it as', 'Backs'], r => '<tr><td>' + fname(r.function) + '</td><td>' + esc(r.program) + '</td><td><b>' + esc(r.name) + '</b><br>' + esc(r.text) +
      '</td><td>' + (r.disposition === 'captured' ? 'business rule' : esc(r.disposition.replace(/_/g, ' ')) + (r.reason ? '<br><span class="small muted">' + esc(r.reason) + '</span>' : '')) + '</td><td>' + esc(r.requirements.join(', ')) + '</td></tr>');
  if (tab === 'questions') h += filtered('Open questions', D.questions, x => x.code + ' ' + x.text + ' ' + x.owner + ' ' + (fnById[x.function] || {}).name,
    ['ID', 'Function', 'Capability', 'Question', 'For'], x => '<tr><td><code>' + esc(x.code) + '</code></td><td>' + fname(x.function) + '</td><td>' + esc((capById[x.capability] || {}).title) +
      '</td><td>' + (x.unverified ? '<span class="tag warn">Unverified requirement</span> ' : '') + esc(x.text) + '</td><td>' + esc(x.owner) + '</td></tr>');
  if (tab === 'datamodel') h += '<div class="panel doc">' + (D.data_model || '<p class="muted">AWS wrote no data model.</p>') + '</div>';
  if (tab === 'assessment') {
    h += '<div class="panel"><h3 style="margin-top:0">Source files by type</h3><table><tbody>' + D.classification.map(([t, n]) => '<tr><td>' + esc(t) + '</td><td>' + n + '</td></tr>').join('') + '</tbody></table></div>';
    h += '<div class="panel"><h3 style="margin-top:0">Codebase issues</h3><div class="scroll"><table><thead><tr><th>Severity</th><th>Issue</th><th>What to do</th></tr></thead><tbody>' +
      D.issues.map(i => '<tr><td>' + esc(i.severity) + '</td><td><b>' + esc(i.name) + '</b><br>' + esc(i.description) + '</td><td>' + esc(i.action) + '</td></tr>').join('') + '</tbody></table></div></div>';
    if (D.unclassified.length) h += '<div class="panel"><h3 style="margin-top:0">Files AWS could not classify</h3><div class="scroll"><table><tbody>' +
      D.unclassified.map(u => '<tr><td>' + esc(u.path) + '</td><td>' + esc(u.reason) + '</td></tr>').join('') + '</tbody></table></div></div>';
  }
  if (tab === 'decisions') h += '<div class="panel scroll"><table><thead><tr><th>When</th><th>AWS asked</th><th>Reframe answered</th><th>Why</th></tr></thead><tbody>' +
    D.decisions.map(d => '<tr><td>' + esc(d.at) + '</td><td>' + esc(d.question) + '</td><td>' + esc(typeof d.answer === 'string' ? d.answer : JSON.stringify(d.answer)) + '</td><td>' + esc(d.reason) + '</td></tr>').join('') +
    '</tbody></table>' + (D.decisions.length ? '' : '<p class="muted">Reframe gave no answers on anyone\'s behalf (an interactive run).</p>') + '</div>';
  if (tab === 'aws') h += '<div class="panel">' + (D.links.coverage ? '<p><a href="' + esc(D.links.coverage) + '">AWS coverage report</a></p>' : '') +
    (D.links.catalog ? '<p><a href="' + esc(D.links.catalog) + '">AWS business function catalog</a> <span class="small muted">(if your browser blocks it, run app/serve.py in its folder)</span></p>' : '') +
    (D.links.coverage || D.links.catalog ? '' : '<p class="muted">AWS gave no pages of its own for this run.</p>') + '</div>';
  return h;
}
let filters = {};
function filtered(name, rows, text, cols, render){
  const q = (filters[name] || '').toLowerCase(), hits = rows.filter(r => !q || text(r).toLowerCase().includes(q));
  return '<div class="panel"><div class="tools"><input type="search" data-filter="' + esc(name) + '" value="' + esc(filters[name] || '') + '" placeholder="Filter"><span class="muted small" style="align-self:center">' +
    hits.length + ' of ' + rows.length + (hits.length > 500 ? ', showing 500' : '') + '</span></div><div class="scroll"><table><thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') +
    '</tr></thead><tbody>' + hits.slice(0, 500).map(render).join('') + '</tbody></table></div></div>';
}
document.addEventListener('input', e => {
  const name = e.target.dataset && e.target.dataset.filter; if (!name) return;
  filters[name] = e.target.value; const at = e.target.selectionStart; route();
  const again = document.querySelector('[data-filter="' + name + '"]'); if (again) { again.focus(); again.setSelectionRange(at, at); }
});

// ---- routing ----------------------------------------------------------------------------------------
function route(){
  const parts = (location.hash || '#/').slice(2).split('/'), [kind, a] = parts;
  let h, tech = kind === 'tech', focus = null;
  if (kind === 'd' && D.domains[+a]) h = domainPage(D.domains[+a]);
  else if (kind === 'f' && D.functions[+a]) h = functionPage(D.functions[+a]);
  else if (kind === 'c' && D.capabilities[+a]) { focus = parts[2] ? decodeURIComponent(parts.slice(2).join('/')) : null; h = capabilityPage(D.capabilities[+a], focus); }
  else if (kind === 'search' && a) { const q = decodeURIComponent(parts.slice(1).join('/')); if (document.activeElement !== $('search')) $('search').value = q; h = searchPage(q); }
  else if (tech) h = techPage(a || 'requirements');
  else h = overview();
  $('main').innerHTML = h;
  $('vReview').classList.toggle('on', !tech); $('vTech').classList.toggle('on', tech);
  if (focus) { const el = document.getElementById(anchor(focus)); if (el) { const det = el.closest('details'); if (det) det.open = true; el.scrollIntoView({block: 'center'}); el.style.outline = '2px solid var(--accent)'; } }
  else if (!(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.filter)) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
let searchTimer;
$('search').addEventListener('input', e => { clearTimeout(searchTimer); const v = e.target.value.trim(); searchTimer = setTimeout(() => { location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/'; }, 250); });

// ---- the review dialog and downloads ---------------------------------------------------------------
function allKeys(){ const keys = new Set(); D.domains.forEach(d => domItems(d).forEach(k => keys.add(k))); return keys; }
function describe(key){
  const r = reqByKey[key], b = ruleByKey[key], q = qByKey[key];
  const fid = (r || b || q).function, f = fnById[fid] || {}, d = domByKey[f.domain] || {};
  const cid = r ? r.capability : q ? q.capability : capOfRule(key), c = capById[cid] || {};
  return {key, type: r ? 'requirement' : b ? 'business rule' : 'open question', domain: d.name || '', business_function: f.name || '',
    capability: c.title ? c.number + '. ' + c.title : '', id: r ? r.code : q ? q.code : b.program + ' ' + b.id, text: r ? r.text : q ? q.text : b.name + ': ' + b.text};
}
function rows(){ return Object.entries(marks).filter(([k, m]) => m && m.status && (reqByKey[k] || ruleByKey[k] || qByKey[k]))
  .map(([k, m]) => ({...describe(k), status: {agree: 'Agree', change: 'Needs change', question: 'Question'}[m.status], comment: m.comment || '', marked_at: m.at || ''})); }
function download(name, type, body){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function fileName(ext){ return 'review-' + (D.project || 'run') + '-' + (reviewer || 'reviewer').replace(/[^A-Za-z0-9_-]+/g, '-') + '-' + new Date().toISOString().slice(0, 10) + '.' + ext; }
function updateCounts(){
  const keys = allKeys(), c = countsOf(keys), done = reviewed(keys), by = {agree: 0, change: 0, question: 0};
  Object.values(marks).forEach(m => { if (m && by[m.status] != null) by[m.status]++; });
  $('reviewCounts').innerHTML = '<b>' + done + ' of ' + keys.size + '</b> items marked (' + c.req + ' requirements, ' + c.rule + ' business rules, ' + c.q + ' open questions in all).<br>' +
    'Agree ' + by.agree + ' · Needs change ' + by.change + ' · Question ' + by.question;
}
$('reviewButton').addEventListener('click', () => { $('reviewer').value = reviewer; updateCounts(); if (!stored) $('storageNote').className = 'note'; $('reviewDialog').showModal(); });
$('closeDialog').addEventListener('click', () => $('reviewDialog').close());
$('reviewer').addEventListener('input', e => { reviewer = e.target.value.trim(); try { localStorage.setItem('reframe-reviewer', reviewer); } catch (err) {} });
$('downloadCsv').addEventListener('click', () => {
  const cols = ['domain', 'business_function', 'capability', 'type', 'id', 'text', 'status', 'comment', 'reviewer', 'marked_at', 'project', 'run', 'source_sha256'];
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const body = [cols.join(',')].concat(rows().map(r => cols.map(c => cell(c === 'reviewer' ? reviewer : c === 'project' ? D.project : c === 'run' ? D.run : c === 'source_sha256' ? D.source.sha256 : r[c])).join(','))).join('\r\n');
  download(fileName('csv'), 'text/csv;charset=utf-8', '﻿' + body);
});
$('downloadJson').addEventListener('click', () => {
  download(fileName('json'), 'application/json', JSON.stringify({format: 'reframe-review/1', project: D.project, run: D.run,
    source: {name: D.source.name, commit: D.source.commit, sha256: D.source.sha256}, reviewer, exported_at: new Date().toISOString(), marks: rows()}, null, 2));
});
$('clearMarks').addEventListener('click', () => { if (confirm('Clear every mark you made on this page? Download them first if you want to keep them.')) { marks = {}; save(); updateCounts(); route(); } });

$('title').textContent = 'Business review' + (D.project ? ': ' + D.project : '');
$('subtitle').textContent = 'AWS Transform assessment of ' + (D.source.name || 'the source') + (D.source.commit ? ' @ ' + String(D.source.commit).slice(0, 12) : '');
route();
</script>
