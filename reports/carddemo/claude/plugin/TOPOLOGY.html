<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

const DATA = /*__TOPOLOGY_DATA__*/ {"system": "CardDemo (carddemo-p2)", "root": {"id": "sys", "name": "CardDemo", "kind": "system", "children": [{"id": "dom:signon", "name": "Sign-on \u0026 Navigation", "kind": "domain", "children": [{"id": "COADM01C", "name": "COADM01C", "kind": "module", "language": "cobol", "loc": 189, "file": "app/cbl/COADM01C.cbl"}, {"id": "COMEN01C", "name": "COMEN01C", "kind": "module", "language": "cobol", "loc": 213, "file": "app/cbl/COMEN01C.cbl"}, {"id": "COSGN00C", "name": "COSGN00C", "kind": "module", "language": "cobol", "loc": 172, "file": "app/cbl/COSGN00C.cbl"}, {"id": "scr:COADM01", "name": "COADM01", "kind": "screen", "language": "bms", "loc": 146, "file": "app/bms/COADM01.bms"}, {"id": "scr:COMEN01", "name": "COMEN01", "kind": "screen", "language": "bms", "loc": 146, "file": "app/bms/COMEN01.bms"}, {"id": "scr:COSGN00", "name": "COSGN00", "kind": "screen", "language": "bms", "loc": 189, "file": "app/bms/COSGN00.bms"}]}, {"id": "dom:useradmin", "name": "User Administration", "kind": "domain", "children": [{"id": "COUSR00C", "name": "COUSR00C", "kind": "module", "language": "cobol", "loc": 531, "file": "app/cbl/COUSR00C.cbl", "description": "COUSR00C is a CICS COBOL program in the User Administration domain, started by transaction CU00, that lists all users from the USRSEC file. It shows users on the COUSR00 screen one page at a time. An operator can page through the list and select a user by entering U or D. It reads USRSEC and both reads and writes the COUSR00 screen. COADM01C dispatches it, and it passes control to COUSR02C or COUSR03C, back to COADM01C, or to COSGN00C."}, {"id": "COUSR01C", "name": "COUSR01C", "kind": "module", "language": "cobol", "loc": 198, "file": "app/cbl/COUSR01C.cbl"}, {"id": "COUSR02C", "name": "COUSR02C", "kind": "module", "language": "cobol", "loc": 303, "file": "app/cbl/COUSR02C.cbl", "description": "COUSR02C is a CICS COBOL program in the User Administration domain, started by transaction CU02, that updates an existing user in the USRSEC file. It looks up a user by ID and shows the first name, last name, password and user type on the COUSR02 screen. It checks that no field is empty and saves only the values that changed. COADM01C and COUSR00C dispatch to it, and it dispatches back to COADM01C or to COSGN00C. It reads and writes both the COUSR02 screen and the USRSEC store."}, {"id": "COUSR03C", "name": "COUSR03C", "kind": "module", "language": "cobol", "loc": 251, "file": "app/cbl/COUSR03C.cbl", "description": "COUSR03C is a CICS COBOL program in the User Administration domain, started by transaction CU03. It deletes a user from the USRSEC file. It takes a user ID, reads the matching USRSEC record and shows the user's first name, last name and type on the COUSR03 screen. PF5 confirms the deletion. COADM01C and COUSR00C dispatch to it. It dispatches back to COADM01C or to COSGN00C, and it reads and writes both COUSR03 and USRSEC."}, {"id": "scr:COUSR00", "name": "COUSR00", "kind": "screen", "language": "bms", "loc": 442, "file": "app/bms/COUSR00.bms", "description": "COUSR00 is the CardDemo List Users screen in the User Administration domain. It is a 24 by 80 BMS map (COUSR0A) that shows a paged list of users with Sel, First Name, Last Name and Type columns. It also has a search input field (USRIDIN), a page number field and header fields for the transaction, program, date and time. In the dependency map, its only connection is the program COUSR00C, which both reads from and writes to this screen. No other programs, stores or screens are linked."}, {"id": "scr:COUSR01", "name": "COUSR01", "kind": "screen", "language": "bms", "loc": 143, "file": "app/bms/COUSR01.bms"}, {"id": "scr:COUSR02", "name": "COUSR02", "kind": "screen", "language": "bms", "loc": 147, "file": "app/bms/COUSR02.bms"}, {"id": "scr:COUSR03", "name": "COUSR03", "kind": "screen", "language": "bms", "loc": 131, "file": "app/bms/COUSR03.bms"}]}, {"id": "dom:account", "name": "Account \u0026 Customer", "kind": "domain", "children": [{"id": "COACTUPC", "name": "COACTUPC", "kind": "module", "language": "cobol", "loc": 3368, "file": "app/cbl/COACTUPC.cbl", "description": "COACTUPC is a 3,368-line COBOL business-logic module in the Account \u0026 Customer domain. It starts as CICS transaction CAUP and accepts and processes ACCOUNT UPDATE requests. It shows an account and its customer details on the COACTUP screen, checks what the user types in, asks the user to confirm the changes and then saves them. It reads ACCTDATA, CUSTDATA and CARDXREF, and it writes updates back to ACCTDATA and CUSTDATA. It also reads and writes the COACTUP screen. COMEN01C dispatches to it, and it dispatches back to COMEN01C."}, {"id": "COACTVWC", "name": "COACTVWC", "kind": "module", "language": "cobol", "loc": 703, "file": "app/cbl/COACTVWC.cbl", "description": "COACTVWC is a 703-line COBOL business-logic module in the Account \u0026 Customer domain. It is entered through CICS transaction CAVW and accepts and processes an Account View request: it checks the user's input, reads the matching account and shows the details on screen, sending the user back to the calling program or menu on exit. It reads ACCTDATA, CARDXREF and CUSTDATA, both reads and writes the COACTVW screen, and dispatches to COMEN01C, which also dispatches back to COACTVWC."}, {"id": "scr:COACTUP", "name": "COACTUP", "kind": "screen", "language": "bms", "loc": 491, "file": "app/bms/COACTUP.bms", "description": "COACTUP is the CardDemo Account Update Screen, a BMS map (CACTUPA) in the Account \u0026 Customer domain. It shows an Update Account form. The user enters an Account Number of up to 11 characters and can edit the Active Y/N status, the Opened date, the Credit Limit and the Expiry date. Header fields show the transaction, program, date and time. In the dependency map, its only connections are to the program COACTUPC, which both reads from and writes to this screen."}, {"id": "scr:COACTVW", "name": "COACTVW", "kind": "screen", "language": "bms", "loc": 357, "file": "app/bms/COACTVW.bms", "description": "COACTVW is the CardDemo Account Viewer Screen, a 357-line BMS map in the Account \u0026 Customer domain. Its map CACTVWA is a 24x80 \"View Account\" screen. The user types an 11-digit Account Number, and the screen shows the account's Active Y/N status, Opened, Expiry and Reissue dates, and its Credit Limit and Cash credit Limit, along with the transaction name, program name, date and time. In the dependency map, only the program COACTVWC connects to it, and it both reads and writes this screen."}]}, {"id": "dom:card", "name": "Card Management", "kind": "domain", "children": [{"id": "COCRDLIC", "name": "COCRDLIC", "kind": "module", "language": "cobol", "loc": 1093, "file": "app/cbl/COCRDLIC.cbl", "description": "COCRDLIC is the Card Management program behind CICS transaction CCLI. It lists credit cards: all cards when no context is passed and the user is an admin, otherwise only the cards tied to the account in the COMMAREA. It pages through results with PFK07 and PFK08, and PFK03 returns to the menu. It reads CARDDATA, reads and writes the COCRDLI screen, and dispatches to COCRDSLC, COCRDUPC and COMEN01C. COMEN01C also dispatches back to COCRDLIC."}, {"id": "COCRDSLC", "name": "COCRDSLC", "kind": "module", "language": "cobol", "loc": 642, "file": "app/cbl/COCRDSLC.cbl", "description": "COCRDSLC is a Card Management COBOL program, started as CICS transaction CCDL, that accepts and processes a credit card detail request. It takes an account ID and card number, either passed in by the card list program or entered on screen. It then looks up the card and displays its details, and returns control to the calling program when PFK03 is pressed. It reads CARDDATA, reads and writes the COCRDSL screen, and dispatches to COMEN01C. COCRDLIC and COMEN01C both dispatch to it."}, {"id": "COCRDUPC", "name": "COCRDUPC", "kind": "module", "language": "cobol", "loc": 1194, "file": "app/cbl/COCRDUPC.cbl", "description": "COCRDUPC is a COBOL program in the Card Management domain. It starts from CICS transaction CCUP and accepts and processes credit card detail requests. It reads a card's details, shows them on the COCRDUP screen, and lets the user confirm changes, which are then saved. It reads and writes both CARDDATA and the COCRDUP screen. COCRDLIC and COMEN01C both hand control to it, and when it finishes it can pass control back to COMEN01C."}, {"id": "scr:COCRDLI", "name": "COCRDLI", "kind": "screen", "language": "bms", "loc": 323, "file": "app/bms/COCRDLI.bms", "description": "COCRDLI is the BMS map for the CardDemo Card Listing Screen in the Card Management domain. Its CCRDLIA map, sized 24 by 80, shows a \"List Credit Cards\" page with a page number. It has input fields for Account Number and Credit Card Number, and lists rows under Select, Account Number, Card Number and Active columns. The map shows only one connection: COCRDLIC both reads from and writes to this screen. No other program calls it."}, {"id": "scr:COCRDSL", "name": "COCRDSL", "kind": "screen", "language": "bms", "loc": 136, "file": "app/bms/COCRDSL.bms"}, {"id": "scr:COCRDUP", "name": "COCRDUP", "kind": "screen", "language": "bms", "loc": 151, "file": "app/bms/COCRDUP.bms"}]}, {"id": "dom:transactions", "name": "Transactions, Bill Pay \u0026 Reports", "kind": "domain", "children": [{"id": "COBIL00C", "name": "COBIL00C", "kind": "module", "language": "cobol", "loc": 420, "file": "app/cbl/COBIL00C.cbl", "description": "COBIL00C is the CICS Bill Payment program, entered through transaction CB00, that lets a user pay an account balance in full online. After the user enters an Acct ID and confirms with Y, it records a 'BILL PAYMENT - ONLINE' transaction for the current balance and reduces the account balance accordingly. It reads ACCTDATA, CARDXREF and TRANSACT, writes ACCTDATA and TRANSACT, and reads and writes the COBIL00 screen. It is dispatched from COMEN01C and dispatches to COMEN01C and COSGN00C."}, {"id": "CORPT00C", "name": "CORPT00C", "kind": "module", "language": "cobol", "loc": 498, "file": "app/cbl/CORPT00C.cbl", "description": "CORPT00C is the CICS program behind transaction CR00 that lets an online user print Transaction reports by submitting a batch job through an extra partition TDQ. The user picks a Monthly, Yearly or custom Start/End Date range, and the program works out the report dates. It reads and writes the CORPT00 screen, calls CSUTLDTC, writes to TDQ JOBS to dispatch the TRANREPT job, and is dispatched from COMEN01C, returning to COMEN01C or COSGN00C."}, {"id": "COTRN00C", "name": "COTRN00C", "kind": "module", "language": "cobol", "loc": 529, "file": "app/cbl/COTRN00C.cbl", "description": "COTRN00C is a CICS COBOL program, started by transaction CT00, that lists transactions from the TRANSACT file on the COTRN00 screen. Users page through the list with PF7 and PF8, filter it by a numeric Tran ID, and mark a row with 'S' to select it. It reads TRANSACT and both reads and writes the COTRN00 screen. It dispatches to COTRN01C for a selected transaction, to COMEN01C on PF3, or to COSGN00C when there is no COMMAREA. COMEN01C and COTRN01C dispatch back to it."}, {"id": "COTRN01C", "name": "COTRN01C", "kind": "module", "language": "cobol", "loc": 231, "file": "app/cbl/COTRN01C.cbl", "description": "COTRN01C is a CICS COBOL program, started as transaction CT01, that lets a user view a single transaction from the TRANSACT file. Given a transaction ID, it looks up the record and displays its card number, type and category codes, source, amount, description, timestamps and merchant details. If the ID is empty, it shows an error. It reads TRANSACT and both reads and writes the COTRN01 screen. COMEN01C and COTRN00C dispatch to it, and it dispatches to COMEN01C, COTRN00C and COSGN00C."}, {"id": "COTRN02C", "name": "COTRN02C", "kind": "module", "language": "cobol", "loc": 614, "file": "app/cbl/COTRN02C.cbl", "description": "COTRN02C is a CICS COBOL program, started as transaction CT02, that adds a new Transaction to the TRANSACT file. On the COTRN02 screen it takes an account or card number, checks that the number is numeric, rejects empty fields such as Type CD and Category CD, and asks for Y/N confirmation before adding. COMEN01C dispatches to it. It calls CSUTLDTC, reads CARDXREF and TRANSACT, writes TRANSACT, reads and writes the COTRN02 screen, and dispatches to COMEN01C or COSGN00C."}, {"id": "scr:COBIL00", "name": "COBIL00", "kind": "screen", "language": "bms", "loc": 119, "file": "app/bms/COBIL00.bms"}, {"id": "scr:CORPT00", "name": "CORPT00", "kind": "screen", "language": "bms", "loc": 210, "file": "app/bms/CORPT00.bms"}, {"id": "scr:COTRN00", "name": "COTRN00", "kind": "screen", "language": "bms", "loc": 442, "file": "app/bms/COTRN00.bms", "description": "COTRN00 is the CardDemo Transaction List screen, a BMS map of 442 lines in the Transactions, Bill Pay \u0026 Reports domain. Titled List Transactions, it shows a paged list with Sel, Transaction ID, Date, Description and Amount columns, a Page number, and a Search Tran ID input field, alongside header fields for transaction name, program name, date and time. In the map, its only connection is the COTRN00C program, which both reads and writes this screen; no other callers or stores are recorded."}, {"id": "scr:COTRN01", "name": "COTRN01", "kind": "screen", "language": "bms", "loc": 252, "file": "app/bms/COTRN01.bms", "description": "COTRN01 is the CardDemo Transaction View screen in the Transactions, Bill Pay \u0026 Reports domain. Its single 24 by 80 map, COTRN1A, titled \"View Transaction\", has a field for entering a Tran ID. It then shows details such as Transaction ID, Card Number, Type CD and Category CD, with a header for date, time and program name. In the dependency map, the program COTRN01C both reads and writes this screen, which means it receives the user's input and sends the results back. No other connections are recorded."}, {"id": "scr:COTRN02", "name": "COTRN02", "kind": "screen", "language": "bms", "loc": 286, "file": "app/bms/COTRN02.bms", "description": "COTRN02 is the CardDemo Transaction Add screen, a 286-line BMS mapset in the Transactions, Bill Pay \u0026 Reports domain. Its map, COTRN2A, shows an Add Transaction form. The user enters an account (Acct #) or a Card #, then transaction details such as Type CD, Category CD and Source. Header fields show the date, time and program name. In the dependency map, the program COTRN02C both reads from and writes to this screen, and no other connections are recorded."}]}, {"id": "dom:batch", "name": "Batch Cycle", "kind": "domain", "children": [{"id": "CBACT04C", "name": "CBACT04C", "kind": "module", "language": "cobol", "loc": 552, "file": "app/cbl/CBACT04C.cbl", "description": "CBACT04C is a Batch Cycle COBOL interest calculator program in CardDemo. It reads transaction category balance records from TCATBALF, looks up each account in ACCTDATA and its cross-reference in CARDXREF, and fetches the interest rate from DISCGRP by account group, transaction category and type code; where the rate is not zero it computes interest and fees, then updates the account. It reads ACCTDATA, CARDXREF, DISCGRP and TCATBALF, writes ACCTDATA and SYSTRAN, and is called by the INTCALC job."}, {"id": "CBSTM03A", "name": "CBSTM03A", "kind": "module", "language": "cobol", "loc": 784, "file": "app/cbl/CBSTM03A.CBL", "description": "CBSTM03A is a 784-line batch COBOL program in the Batch Cycle domain. It prints account statements from transaction data in two formats, plain text and HTML. For each cross-reference record, it looks up the matching customer and account, creates a statement and then adds the transactions. It calls the subroutine CBSTM03B to read XREFFILE, CUSTFILE and ACCTFILE, and it writes its output to STATEMNT and STATEMNT.HTML. The CREASTMT job calls it."}, {"id": "CBSTM03B", "name": "CBSTM03B", "kind": "module", "language": "cobol", "loc": 162, "file": "app/cbl/CBSTM03B.CBL"}, {"id": "CBTRN01C", "name": "CBTRN01C", "kind": "module", "language": "cobol", "loc": 415, "file": "app/cbl/CBTRN01C.cbl", "description": "CBTRN01C is a 415-line batch COBOL program in the Batch Cycle domain. Its header says its job is to post the records from the daily transaction file. For each DALYTRAN-FILE record, it looks up the card number in XREF-FILE and then reads ACCOUNT-FILE. If a card number could not be verified, it skips that transaction. The map shows no connections: it calls, reads and writes nothing in the map. Nothing calls or runs it either, so it is flagged as a dead-end candidate."}, {"id": "CBTRN02C", "name": "CBTRN02C", "kind": "module", "language": "cobol", "loc": 619, "file": "app/cbl/CBTRN02C.cbl", "description": "CBTRN02C is a Batch Cycle COBOL program that posts the records from the daily transaction file. Each DALYTRAN record is validated; valid transactions are posted, while failures are counted and written as reject records, and the program sets return code 4 when any are rejected. It reads DALYTRAN, CARDXREF, ACCTDATA and TCATBALF, and writes TRANSACT, DALYREJS, ACCTDATA and TCATBALF. It is called by the POSTTRAN job."}, {"id": "CBTRN03C", "name": "CBTRN03C", "kind": "module", "language": "cobol", "loc": 545, "file": "app/cbl/CBTRN03C.cbl", "description": "CBTRN03C is a Batch Cycle COBOL program that prints the transaction detail report. It reads a reporting date range from DATEPARM, then works through transaction records, looking up each card in CARDXREF and each transaction's type and category in TRANTYPE and TRANCATG. It keeps running page, account and grand totals. It reads CARDXREF, DATEPARM, TRANCATG, TRANSACT.DALY and TRANTYPE, writes the report to TRANREPT, and is called by the TRANREPT job."}, {"id": "job:CLOSEFIL", "name": "CLOSEFIL", "kind": "job", "language": "jcl", "loc": 12, "file": "app/jcl/CLOSEFIL.jcl"}, {"id": "job:COMBTRAN", "name": "COMBTRAN", "kind": "job", "language": "jcl", "loc": 27, "file": "app/jcl/COMBTRAN.jcl"}, {"id": "job:CREASTMT", "name": "CREASTMT", "kind": "job", "language": "jcl", "loc": 68, "file": "app/jcl/CREASTMT.JCL"}, {"id": "job:INTCALC", "name": "INTCALC", "kind": "job", "language": "jcl", "loc": 22, "file": "app/jcl/INTCALC.jcl"}, {"id": "job:OPENFIL", "name": "OPENFIL", "kind": "job", "language": "jcl", "loc": 12, "file": "app/jcl/OPENFIL.jcl"}, {"id": "job:POSTTRAN", "name": "POSTTRAN", "kind": "job", "language": "jcl", "loc": 22, "file": "app/jcl/POSTTRAN.jcl"}, {"id": "job:PRTCATBL", "name": "PRTCATBL", "kind": "job", "language": "jcl", "loc": 38, "file": "app/jcl/PRTCATBL.jcl"}, {"id": "job:TRANBKP", "name": "TRANBKP", "kind": "job", "language": "jcl", "loc": 40, "file": "app/jcl/TRANBKP.jcl"}, {"id": "job:TRANIDX", "name": "TRANIDX", "kind": "job", "language": "jcl", "loc": 30, "file": "app/jcl/TRANIDX.jcl"}, {"id": "job:TRANREPT", "name": "TRANREPT", "kind": "job", "language": "jcl", "loc": 52, "file": "app/jcl/TRANREPT.jcl"}, {"id": "job:TXT2PDF1", "name": "TXT2PDF1", "kind": "job", "language": "jcl", "loc": 14, "file": "app/jcl/TXT2PDF1.JCL"}, {"id": "job:WAITSTEP", "name": "WAITSTEP", "kind": "job", "language": "jcl", "loc": 8, "file": "app/jcl/WAITSTEP.jcl"}]}, {"id": "dom:provisioning", "name": "Data Provisioning \u0026 Utilities", "kind": "domain", "children": [{"id": "CBACT01C", "name": "CBACT01C", "kind": "module", "language": "cobol", "loc": 358, "file": "app/cbl/CBACT01C.cbl", "description": "CBACT01C is a batch COBOL program in the Data Provisioning \u0026 Utilities domain that reads the account file one record at a time and writes each account into several output files. For each record it displays the account fields and builds a reformatted account record, an array record with hardcoded balance values, and variable-length records. It abends if a read or write fails. It calls COBDATFT to convert the reissue date, reads ACCTDATA, writes ACCTDATA.PSCOMP, ACCTDATA.ARRYPS and ACCTDATA.VBPS, and is called by the READACCT job."}, {"id": "CBACT02C", "name": "CBACT02C", "kind": "module", "language": "cobol", "loc": 129, "file": "app/cbl/CBACT02C.cbl"}, {"id": "CBACT03C", "name": "CBACT03C", "kind": "module", "language": "cobol", "loc": 130, "file": "app/cbl/CBACT03C.cbl"}, {"id": "CBCUS01C", "name": "CBCUS01C", "kind": "module", "language": "cobol", "loc": 130, "file": "app/cbl/CBCUS01C.cbl"}, {"id": "CBEXPORT", "name": "CBEXPORT", "kind": "module", "language": "cobol", "loc": 396, "file": "app/cbl/CBEXPORT.cbl", "description": "CBEXPORT is a batch COBOL program in the Data Provisioning \u0026 Utilities domain that exports customer data for a branch migration. It reads full customer profiles from the normalized CardDemo files. From them it builds one export file with several record types: customer, account, cross-reference, transaction and card. Each record carries a timestamp and a sequence number, and the program reports export statistics. The CBEXPORT job runs it. It reads ACCTDATA, CARDDATA, CARDXREF, CUSTDATA and TRANSACT, and writes EXPORT."}, {"id": "CBIMPORT", "name": "CBIMPORT", "kind": "module", "language": "cobol", "loc": 337, "file": "app/cbl/CBIMPORT.cbl", "description": "CBIMPORT is a batch COBOL program for Branch Migration Import. It reads a multi-record export file and checks each record's type: customer, account, card cross-reference, transaction or card. It then splits the records into separate normalized target files, and the program stops abnormally on any file open, read or write error. The CBIMPORT job calls it. It reads EXPORT and writes CUSTDATA.IMPORT, ACCTDATA.IMPORT, CARDXREF.IMPORT, TRANSACT.IMPORT and IMPORT.ERRORS."}, {"id": "COBSWAIT", "name": "COBSWAIT", "kind": "module", "language": "cobol", "loc": 13, "file": "app/cbl/COBSWAIT.cbl"}, {"id": "job:ACCTFILE", "name": "ACCTFILE", "kind": "job", "language": "jcl", "loc": 36, "file": "app/jcl/ACCTFILE.jcl"}, {"id": "job:CARDFILE", "name": "CARDFILE", "kind": "job", "language": "jcl", "loc": 82, "file": "app/jcl/CARDFILE.jcl"}, {"id": "job:CBADMCDJ", "name": "CBADMCDJ", "kind": "job", "language": "jcl", "loc": 122, "file": "app/jcl/CBADMCDJ.jcl"}, {"id": "job:CBEXPORT", "name": "CBEXPORT", "kind": "job", "language": "jcl", "loc": 34, "file": "app/jcl/CBEXPORT.jcl"}, {"id": "job:CBIMPORT", "name": "CBIMPORT", "kind": "job", "language": "jcl", "loc": 34, "file": "app/jcl/CBIMPORT.jcl"}, {"id": "job:CUSTFILE", "name": "CUSTFILE", "kind": "job", "language": "jcl", "loc": 48, "file": "app/jcl/CUSTFILE.jcl"}, {"id": "job:DALYREJS", "name": "DALYREJS", "kind": "job", "language": "jcl", "loc": 10, "file": "app/jcl/DALYREJS.jcl"}, {"id": "job:DEFCUST", "name": "DEFCUST", "kind": "job", "language": "jcl", "loc": 24, "file": "app/jcl/DEFCUST.jcl"}, {"id": "job:DEFGDGB", "name": "DEFGDGB", "kind": "job", "language": "jcl", "loc": 41, "file": "app/jcl/DEFGDGB.jcl"}, {"id": "job:DEFGDGD", "name": "DEFGDGD", "kind": "job", "language": "jcl", "loc": 54, "file": "app/jcl/DEFGDGD.jcl"}, {"id": "job:DISCGRP", "name": "DISCGRP", "kind": "job", "language": "jcl", "loc": 36, "file": "app/jcl/DISCGRP.jcl"}, {"id": "job:DUSRSECJ", "name": "DUSRSECJ", "kind": "job", "language": "jcl", "loc": 49, "file": "app/jcl/DUSRSECJ.jcl"}, {"id": "job:ESDSRRDS", "name": "ESDSRRDS", "kind": "job", "language": "jcl", "loc": 69, "file": "app/jcl/ESDSRRDS.jcl"}, {"id": "job:FTPJCL", "name": "FTPJCL", "kind": "job", "language": "jcl", "loc": 13, "file": "app/jcl/FTPJCL.JCL"}, {"id": "job:INTRDRJ1", "name": "INTRDRJ1", "kind": "job", "language": "jcl", "loc": 14, "file": "app/jcl/INTRDRJ1.JCL"}, {"id": "job:INTRDRJ2", "name": "INTRDRJ2", "kind": "job", "language": "jcl", "loc": 9, "file": "app/jcl/INTRDRJ2.JCL"}, {"id": "job:READACCT", "name": "READACCT", "kind": "job", "language": "jcl", "loc": 28, "file": "app/jcl/READACCT.jcl"}, {"id": "job:READCARD", "name": "READCARD", "kind": "job", "language": "jcl", "loc": 9, "file": "app/jcl/READCARD.jcl"}, {"id": "job:READCUST", "name": "READCUST", "kind": "job", "language": "jcl", "loc": 9, "file": "app/jcl/READCUST.jcl"}, {"id": "job:READXREF", "name": "READXREF", "kind": "job", "language": "jcl", "loc": 9, "file": "app/jcl/READXREF.jcl"}, {"id": "job:REPTFILE", "name": "REPTFILE", "kind": "job", "language": "jcl", "loc": 10, "file": "app/jcl/REPTFILE.jcl"}, {"id": "job:TCATBALF", "name": "TCATBALF", "kind": "job", "language": "jcl", "loc": 36, "file": "app/jcl/TCATBALF.jcl"}, {"id": "job:TRANCATG", "name": "TRANCATG", "kind": "job", "language": "jcl", "loc": 36, "file": "app/jcl/TRANCATG.jcl"}, {"id": "job:TRANFILE", "name": "TRANFILE", "kind": "job", "language": "jcl", "loc": 81, "file": "app/jcl/TRANFILE.jcl"}, {"id": "job:TRANTYPE", "name": "TRANTYPE", "kind": "job", "language": "jcl", "loc": 36, "file": "app/jcl/TRANTYPE.jcl"}, {"id": "job:XREFFILE", "name": "XREFFILE", "kind": "job", "language": "jcl", "loc": 68, "file": "app/jcl/XREFFILE.jcl"}]}, {"id": "dom:txntype", "name": "Transaction Types (DB2)", "kind": "domain", "children": [{"id": "COBTUPDT", "name": "COBTUPDT", "kind": "module", "language": "cobol", "loc": 177, "file": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl"}, {"id": "COTRTLIC", "name": "COTRTLIC", "kind": "module", "language": "cobol", "loc": 1597, "file": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl", "description": "COTRTLIC is a CICS COBOL program, started by transaction CTLI, that lists transaction types so users can pick them to update or delete. It pages through the TRANSACTION_TYPE table in DB2 using cursors and handles simple select, delete and update cases. It reads and writes the TRANSACTION_TYPE table and the COTRTLI screen. COADM01C dispatches to COTRTLIC, and COTRTLIC dispatches back to COADM01C and also to COTRTUPC."}, {"id": "COTRTUPC", "name": "COTRTUPC", "kind": "module", "language": "cobol", "loc": 1241, "file": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl", "description": "COTRTUPC is the CICS online program behind transaction CTTU in the Transaction Types (DB2) domain, and its header says it accepts and processes a transaction type update. It lets an administrator view a transaction type and change it. When no details are found, the administrator can create a new record instead. The administrator can also confirm and delete a transaction type. COADM01C and COTRTLIC both dispatch to it, and it dispatches back to COADM01C. It reads and writes the COTRTUP screen and the TRANSACTION_TYPE DB2 table."}, {"id": "job:CREADB21", "name": "CREADB21", "kind": "job", "language": "jcl", "loc": 40, "file": "app/app-transaction-type-db2/jcl/CREADB21.jcl"}, {"id": "job:MNTTRDB2", "name": "MNTTRDB2", "kind": "job", "language": "jcl", "loc": 12, "file": "app/app-transaction-type-db2/jcl/MNTTRDB2.jcl"}, {"id": "job:TRANEXTR", "name": "TRANEXTR", "kind": "job", "language": "jcl", "loc": 83, "file": "app/app-transaction-type-db2/jcl/TRANEXTR.jcl"}, {"id": "scr:COTRTLI", "name": "COTRTLI", "kind": "screen", "language": "bms", "loc": 320, "file": "app/app-transaction-type-db2/bms/COTRTLI.bms", "description": "COTRTLI is the BMS map for the CardDemo Tran Type Listing Screen in the Transaction Types (DB2) domain. Headed \"Maintain Transaction Type\", it shows the current date, time, program name and page number. Users can filter by type and by description, and the screen lists transaction types in rows with Select, Type and Description columns. Its only connection in the map is COTRTLIC, which both reads from and writes to this screen. The map links no other callers or data stores to it."}, {"id": "scr:COTRTUP", "name": "COTRTUP", "kind": "screen", "language": "bms", "loc": 119, "file": "app/app-transaction-type-db2/bms/COTRTUP.bms"}]}, {"id": "dom:mqinquiry", "name": "Account/Date Inquiry (MQ)", "kind": "domain", "children": [{"id": "COACCT01", "name": "COACCT01", "kind": "module", "language": "cobol", "loc": 500, "file": "app/app-vsam-mq/cbl/COACCT01.cbl", "description": "COACCT01 is a 500-line COBOL module in the Account/Date Inquiry (MQ) domain. It starts as CICS transaction CDRA and handles account inquiries that arrive over MQ. It retrieves the trigger message and opens its input queue, the CARD.DEMO.REPLY.ACCT reply queue and the CARD.DEMO.ERROR queue. It then processes requests until no messages remain, taking a SYNCPOINT between messages. The map shows that its MQ trigger queue starts it, that it reads ACCTDATA, and that it writes replies to CARD.DEMO.REPLY.ACCT and errors to CARD.DEMO.ERROR."}, {"id": "CODATE01", "name": "CODATE01", "kind": "module", "language": "cobol", "loc": 409, "file": "app/app-vsam-mq/cbl/CODATE01.cbl", "description": "CODATE01 is a COBOL module started by the CICS transaction CDRD in the Account/Date Inquiry (MQ) domain. It retrieves its MQ trigger message and opens the input queue named in that message. It then gets and processes request messages until none remain, taking a SYNCPOINT between messages. The excerpt does not show how the date reply is built. It reads from the MQ trigger queue (CODATE01), writes replies to CARD.DEMO.REPLY.DATE and reports retrieve or queue-open failures to CARD.DEMO.ERROR."}]}, {"id": "dom:pendauth", "name": "Pending Authorization (IMS/DB2/MQ)", "kind": "domain", "children": [{"id": "CBPAUP0C", "name": "CBPAUP0C", "kind": "module", "language": "cobol", "loc": 266, "file": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl", "description": "CBPAUP0C is a batch IMS COBOL program that deletes expired pending authorization messages. It reads each pending authorization summary and its detail records. Any detail whose age meets the expiry days (5 by default) is deleted, and the summary's approved or declined counts and amounts are reduced. A summary is deleted once its count reaches zero, and checkpoints are taken along the way. It reads from and writes to the DBPAUTP0 IMS database and is called by job CBPAUP0J."}, {"id": "COPAUA0C", "name": "COPAUA0C", "kind": "module", "language": "cobol", "loc": 771, "file": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl", "description": "COPAUA0C is the CardDemo Card Authorization Decision Program. It is a CICS COBOL IMS MQ entry point that runs under transaction CP00. When its MQ trigger queue fires, it reads authorization request messages one at a time. It splits each message into card number, amount, merchant and transaction details, makes the authorization decision and takes a SYNCPOINT. It reads ACCTDATA, CARDXREF and CUSTDATA, and both reads and writes the DBPAUTP0 IMS database. It also writes to its MQ reply-to queue and to TDQ CSSL."}, {"id": "COPAUS0C", "name": "COPAUS0C", "kind": "module", "language": "cobol", "loc": 792, "file": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl", "description": "COPAUS0C is the CICS entry point for transaction CPVS and shows a summary of pending authorization messages for an account. A user enters an Acct Id, pages through the results with PF7 and PF8, and types S next to an entry to see its details. It reads ACCTDATA, CARDXREF, CUSTDATA and the IMS database DBPAUTP0, and it both reads and writes the COPAU00 screen. COMEN01C and COPAUS1C pass control to it, and it passes control to COPAUS1C, COMEN01C and COSGN00C."}, {"id": "COPAUS1C", "name": "COPAUS1C", "kind": "module", "language": "cobol", "loc": 461, "file": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl", "description": "COPAUS1C is the CICS COBOL program behind transaction CPVD that shows the detail view of a single pending authorization message for an account. Users can press PF8 to page to the next authorization, PF5 to flag the authorization as fraud or remove a confirmed fraud flag, and PF3 to return to the summary. It is dispatched from COPAUS0C and dispatches back to COPAUS0C and on to COPAUS2C. It reads and writes the COPAU01 screen and the IMS database DBPAUTP0."}, {"id": "COPAUS2C", "name": "COPAUS2C", "kind": "module", "language": "cobol", "loc": 201, "file": "app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl"}, {"id": "DBUNLDGS", "name": "DBUNLDGS", "kind": "module", "language": "cobol", "loc": 198, "file": "app/app-authorization-ims-db2-mq/cbl/DBUNLDGS.CBL"}, {"id": "PAUDBLOD", "name": "PAUDBLOD", "kind": "module", "language": "cobol", "loc": 251, "file": "app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL", "description": "PAUDBLOD is a 251-line COBOL module in the Pending Authorization (IMS/DB2/MQ) domain that loads the pending authorization IMS database. It reads root records (PENDING-AUTH-SUMMARY) and inserts them as root segments. It then reads child records (PENDING-AUTH-DETAILS), finds each parent root by key and inserts the child segment under it. It abends on any status other than success or 'II' (already in DB). The LOADPADB job calls it. It reads PAUTDB.ROOT.FILEO and PAUTDB.CHILD.FILEO, and both reads and writes DBPAUTP0."}, {"id": "PAUDBUNL", "name": "PAUDBUNL", "kind": "module", "language": "cobol", "loc": 207, "file": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL"}, {"id": "job:CBPAUP0J", "name": "CBPAUP0J", "kind": "job", "language": "jcl", "loc": 22, "file": "app/app-authorization-ims-db2-mq/jcl/CBPAUP0J.jcl"}, {"id": "job:DBPAUTP0", "name": "DBPAUTP0", "kind": "job", "language": "jcl", "loc": 32, "file": "app/app-authorization-ims-db2-mq/jcl/DBPAUTP0.jcl"}, {"id": "job:LOADPADB", "name": "LOADPADB", "kind": "job", "language": "jcl", "loc": 19, "file": "app/app-authorization-ims-db2-mq/jcl/LOADPADB.JCL"}, {"id": "job:UNLDGSAM", "name": "UNLDGSAM", "kind": "job", "language": "jcl", "loc": 23, "file": "app/app-authorization-ims-db2-mq/jcl/UNLDGSAM.JCL"}, {"id": "job:UNLDPADB", "name": "UNLDPADB", "kind": "job", "language": "jcl", "loc": 35, "file": "app/app-authorization-ims-db2-mq/jcl/UNLDPADB.JCL"}, {"id": "scr:COPAU00", "name": "COPAU00", "kind": "screen", "language": "bms", "loc": 496, "file": "app/app-authorization-ims-db2-mq/bms/COPAU00.bms", "description": "COPAU00 is the CardDemo Pending Authorization Screen, a BMS map (COPAU0A) in the Pending Authorization (IMS/DB2/MQ) domain titled \"View Authorizations\". The user enters a Search Acct Id, and the screen shows the customer's Name, Customer Id, address, phone, Acct Status, Approval # and Decline # counts, and Credit Lim. A header shows the transaction, program, date and time. The screen calls nothing itself. The map records that COPAUS0C both reads from and writes to COPAU00."}, {"id": "scr:COPAU01", "name": "COPAU01", "kind": "screen", "language": "bms", "loc": 276, "file": "app/app-authorization-ims-db2-mq/bms/COPAU01.bms", "description": "COPAU01 is the CardDemo Pending Authorization Details Screen in the Pending Authorization (IMS/DB2/MQ) domain, a BMS map titled View Authorization Details. Its COPAU1A map displays protected fields for an authorization: Card #, Auth Date, Auth Time, Auth Resp, Resp Reason, Auth Code and Amount, with the transaction name, program name, date and time in its header. In the dependency map, its only connection is COPAUS1C, which both reads from and writes to this screen. No other program is recorded as using it."}]}, {"id": "dom:common", "name": "Common Services", "kind": "domain", "children": [{"id": "CSUTLDTC", "name": "CSUTLDTC", "kind": "module", "language": "cobol", "loc": 114, "file": "app/cbl/CSUTLDTC.cbl"}, {"id": "COBDATFT", "name": "COBDATFT", "kind": "module", "language": "hlasm", "loc": 61, "file": "app/asm/COBDATFT.asm"}, {"id": "MVSWAIT", "name": "MVSWAIT", "kind": "module", "language": "hlasm", "loc": 14, "file": "app/asm/MVSWAIT.asm"}]}, {"id": "dom:data", "name": "Data stores", "kind": "domain", "children": [{"id": "ds:ACCTDATA", "name": "ACCTDATA", "kind": "datastore"}, {"id": "ds:ACCTDATA.ARRYPS", "name": "ACCTDATA.ARRYPS", "kind": "datastore"}, {"id": "ds:ACCTDATA.IMPORT", "name": "ACCTDATA.IMPORT", "kind": "datastore"}, {"id": "ds:ACCTDATA.PSCOMP", "name": "ACCTDATA.PSCOMP", "kind": "datastore"}, {"id": "ds:ACCTDATA.VBPS", "name": "ACCTDATA.VBPS", "kind": "datastore"}, {"id": "ds:CARDDATA", "name": "CARDDATA", "kind": "datastore"}, {"id": "ds:CARD   const gen = ++flyGen; // a newer flyTo (or Escape) cancels this one
  const vw = innerWidth, vh = innerHeight, cur = transform;
  const from = [(vw / 2 - cur.x) / cur.k, (vh / 2 - cur.y) / cur.k, Math.min(vw, vh) / cur.k];
  const targetW = Math.max(n.r * 2.6, Math.min(vw, vh) / MAX_K); // respect scaleExtent
  const interp = d3.interpolateZoom(from, [n.x, n.y, targetW]);
  const dur = Math.max(400, interp.duration * 0.55), t0 = performance.now();
  (function step() {
    if (gen !== flyGen) return;
    const t = Math.min(1, (performance.now() - t0) / dur);
    const [cx, cy, w] = interp(d3.easeCubicInOut(t));
    const k = Math.min(vw, vh) / w;
    sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - cx * k, vh / 2 - cy * k).scale(k));
    if (t < 1) requestAnimationFrame(step);
  })();
}
canvas.addEventListener("mousemove", e => {
  const h = hit(e.offsetX, e.offsetY);
  const id = h ? h.id : null;
  if (id !== hovered) { hovered = id; canvas.style.cursor = h ? "pointer" : "grab"; requestDraw(); }
});
canvas.addEventListener("click", e => {
  const h = hit(e.offsetX, e.offsetY);
  if (activeFlow && h) setFlow(""); // leave the walkthrough to inspect a node
  selected = h ? h.id : null;
  resultsEl.innerHTML = "";
  renderSidebar(); requestDraw();
});
canvas.addEventListener("dblclick", e => { const h = hit(e.offsetX, e.offsetY); if (h) flyTo(h); });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Escape inside the search box or flow select should only affect that
  // control, not reset the whole viewport.
  if (e.target === searchEl || (e.target && e.target.tagName === "SELECT")) return;
  flyGen++; selected = null; resultsEl.innerHTML = "";
  setFlow(""); flyTo(nodes[0]); renderSidebar();
});
addEventListener("resize", requestDraw);

// ── Sidebar ─────────────────────────────────────────────────────────────
const sidebar = document.getElementById("sidebar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderSidebar() {
  if (activeFlow) return renderFlowSidebar();
  if (!selected) { sidebar.classList.remove("open"); return; }
  const n = byId.get(selected);
  const neighbors = [];
  for (const e of edges) {
    if (e.source === n.id) neighbors.push({ id: e.target, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "→" });
    else if (e.target === n.id) neighbors.push({ id: e.source, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "←" });
  }
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.kind)}${n.language ? " · " + esc(n.language) : ""}${n.loc ? " · " + n.loc.toLocaleString() + " LOC" : ""}</div>${n.description ? `<p class="desc">${esc(n.description)}<span class="cap">written by Claude from a source excerpt and the node's connections</span></p>` : ""}
    <div>${entrySet.has(n.id) ? '<span class="badge entry">entry point</span>' : ""}
      ${deadSet.has(n.id) ? '<span class="badge">dead-end candidate</span>' : ""}
      <span class="badge">fan-in ${fanIn.get(n.id) || 0}</span>
      <span class="badge">fan-out ${fanOut.get(n.id) || 0}</span></div>
    ${n.file ? `<h3>Source</h3><div class="meta">${esc(n.file)}</div>` : ""}
    ${neighbors.length ? `<h3>Connections (${neighbors.length})</h3>` +
      neighbors.slice(0, 40).map(x => `<span class="link" data-id="${esc(x.id)}">${x.dir} ${esc(byId.get(x.id)?.name || x.id)} <span class="kind">${esc(x.rel)}</span></span>`).join("") +
      (neighbors.length > 40 ? `<div class="meta">…and ${neighbors.length - 40} more</div>` : "") : ""}`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => { selected = null; renderSidebar(); requestDraw(); };
  sidebar.querySelectorAll(".link").forEach(el => el.onclick = () => {
    const t = byId.get(el.dataset.id);
    if (t) { selected = t.id; flyTo(t); renderSidebar(); requestDraw(); }
  });
}
function renderFlowSidebar() {
  const f = activeFlow;
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(f.name)}</h2>
    <div class="meta">${f.persona ? "Persona: " + esc(f.persona) : ""}</div>
    ${f.description ? `<p style="font-size:13px">${esc(f.description)}</p>` : ""}
    <h3>Steps</h3>
    <ol>${f.steps.map(s => `<li>${esc(s.label)}${(s.nodes || []).length ?
      `<div class="meta">${s.nodes.map(id => esc(byId.get(id)?.name || id)).join(" → ")}</div>` : ""}</li>`).join("")}</ol>`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => setFlow("");
}

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
