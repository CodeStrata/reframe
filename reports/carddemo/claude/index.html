LE-262"], "sources": ["app/cbl/CBCUS01C.cbl:74-96"], "programs": ["CBCUS01C"]}, {"key": "claude/provisioning/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall print the whole customer record, including any personal data in it, to the job log unmasked.", "capability": "claude/provisioning/04#3", "function": "claude/provisioning/04", "rules": ["claude/RULE-262"], "sources": ["app/cbl/CBCUS01C.cbl:74-96"], "programs": ["CBCUS01C"]}, {"key": "claude/provisioning/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "State-driven", "text": "While the customer master file is empty, the system shall print only the START and END banners.", "capability": "claude/provisioning/04#3", "function": "claude/provisioning/04", "rules": ["claude/RULE-262"], "sources": ["app/cbl/CBCUS01C.cbl:74-96"], "programs": ["CBCUS01C"]}, {"key": "claude/provisioning/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall continue processing when a file open, read or close returns status '00'.", "capability": "claude/provisioning/04#4", "function": "claude/provisioning/04", "rules": ["claude/RULE-165"], "sources": ["app/cbl/CBACT02C.cbl:92-158"], "programs": ["CBACT02C"]}, {"key": "claude/provisioning/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When a read returns status '10', the system shall set end-of-file, close the file and end the job normally.", "capability": "claude/provisioning/04#4", "function": "claude/provisioning/04", "rules": ["claude/RULE-165"], "sources": ["app/cbl/CBACT02C.cbl:92-158", "app/cbl/CBACT03C.cbl:92-158", "app/cbl/CBCUS01C.cbl:92-158"], "programs": ["CBACT02C"]}, {"key": "claude/provisioning/04/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If a file open, read or close returns any other status (including '10' on open or close), then the system shall print an error message and the file status as 4 digits and abend immediately with code 999.", "capability": "claude/provisioning/04#4", "function": "claude/provisioning/04", "rules": ["claude/RULE-165"], "sources": ["app/cbl/CBACT02C.cbl:92-158", "app/cbl/CBACT03C.cbl:92-158", "app/cbl/CBCUS01C.cbl:92-158"], "programs": ["CBACT02C"]}, {"key": "claude/provisioning/04/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If a read error occurs mid-file, then the system shall leave records already printed in the log, with no rollback or restart point.", "capability": "claude/provisioning/04#4", "function": "claude/provisioning/04", "rules": ["claude/RULE-165"], "sources": ["app/cbl/CBACT02C.cbl:92-158"], "programs": ["CBACT02C"]}, {"key": "claude/txntype/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read each input record as an action code (1 char), a transaction type code (2 chars) and a description (50 chars).", "capability": "claude/txntype/01#1", "function": "claude/txntype/01", "rules": ["claude/RULE-048"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:71-77"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the action code is 'A', the system shall run the insert; when it is 'U', the system shall run the description update; and when it is 'D', the system shall run the delete.", "capability": "claude/txntype/01#1", "function": "claude/txntype/01", "rules": ["claude/RULE-048"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the action code is '*', the system shall write 'IGNORING COMMENTED LINE' and do nothing else with the record.", "capability": "claude/txntype/01#1", "function": "claude/txntype/01", "rules": ["claude/RULE-048"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the action code is any other value (including a blank or lowercase 'a', 'u' or 'd'), then the system shall write 'ERROR: TYPE NOT VALID', set return code 4 and carry on with the next record.", "capability": "claude/txntype/01#1", "function": "claude/txntype/01", "rules": ["claude/RULE-048"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall pass the 2-character type code and the description to DB2 without checking them, so blank or non-numeric codes and blank descriptions are not rejected by the batch.", "capability": "claude/txntype/01#1", "function": "claude/txntype/01", "rules": ["claude/RULE-048"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When an 'A' record is processed, the system shall insert a row into CARDDEMO.TRANSACTION_TYPE with TR_TYPE set to the 2-character code and TR_DESCRIPTION set to the 50-character description, and display 'RECORD INSERTED SUCCESSFULLY'.", "capability": "claude/txntype/01#2", "function": "claude/txntype/01", "rules": ["claude/RULE-156"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:132-164"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the insert returns a negative SQLCODE (for example because the code already exists), then the system shall display 'Error accessing: TRANSACTION_TYPE table. SQLCODE:<code>' and set the return code to 4.", "capability": "claude/txntype/01#2", "function": "claude/txntype/01", "rules": ["claude/RULE-156"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:132-164"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall rely on DB2 to reject duplicate codes on insert rather than checking for duplicates itself, and shall ignore a positive SQLCODE other than 0 (a warning).", "capability": "claude/txntype/01#2", "function": "claude/txntype/01", "rules": ["claude/RULE-156"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:132-164"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall store the inserted description padded with trailing spaces to 50 characters.", "capability": "claude/txntype/01#2", "function": "claude/txntype/01", "rules": ["claude/RULE-156"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:132-164"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a 'U' record is processed, the system shall replace TR_DESCRIPTION of the row with the matching TR_TYPE and display 'RECORD UPDATED SUCCESSFULLY'.", "capability": "claude/txntype/01#3", "function": "claude/txntype/01", "rules": ["claude/RULE-157"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall allow only the description to change through an update; the type code itself cannot be changed.", "capability": "claude/txntype/01#3", "function": "claude/txntype/01", "rules": ["claude/RULE-157"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If no row has the code (SQLCODE +100), then the system shall display 'No records found.' and set the return code to 4.", "capability": "claude/txntype/01#3", "function": "claude/txntype/01", "rules": ["claude/RULE-157"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the update returns a negative SQLCODE, then the system shall display the 'Error accessing...' message and set the return code to 4.", "capability": "claude/txntype/01#3", "function": "claude/txntype/01", "rules": ["claude/RULE-157"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When a 'U' record has a blank description, the system shall overwrite the stored description with spaces.", "capability": "claude/txntype/01#3", "function": "claude/txntype/01", "rules": ["claude/RULE-157"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When a 'D' record is processed, the system shall permanently delete the row with the matching TR_TYPE, ignore the record's description, and display 'RECORD DELETED SUCCESSFULLY'.", "capability": "claude/txntype/01#4", "function": "claude/txntype/01", "rules": ["claude/RULE-158"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If no row exists for the code (SQLCODE +100), then the system shall display 'No records found.' and set RC=4.", "capability": "claude/txntype/01#4", "function": "claude/txntype/01", "rules": ["claude/RULE-158"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the delete returns a negative SQLCODE (for example an RI violation if other tables reference the type), then the system shall display the 'Error accessing...' message and set RC=4.", "capability": "claude/txntype/01#4", "function": "claude/txntype/01", "rules": ["claude/RULE-158"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not itself check whether transactions or category records still use the type; any protection depends on DB2 referential constraints.", "capability": "claude/txntype/01#4", "function": "claude/txntype/01", "rules": ["claude/RULE-158"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If any record fails, then the system shall display the error, set job return code 4 and keep processing later records.", "capability": "claude/txntype/01#5", "function": "claude/txntype/01", "rules": ["claude/RULE-221"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:230-233"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall keep successful changes from a partially failed file, issuing no explicit COMMIT or ROLLBACK and relying on the implicit commit at normal program end.", "capability": "claude/txntype/01#5", "function": "claude/txntype/01", "rules": ["claude/RULE-221"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:230-233"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "State-driven", "text": "While the return code is 4, the system shall keep it at 4 for the rest of the run, whether later records succeed or more errors occur, without counting the errors.", "capability": "claude/txntype/01#5", "function": "claude/txntype/01", "rules": ["claude/RULE-221"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:230-233"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Unwanted", "text": "If the input file fails to open (status not '00'), then the system shall display 'OPEN FILE NOT OK'.", "capability": "claude/txntype/01#5", "function": "claude/txntype/01", "rules": ["claude/RULE-221"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:82-89"], "programs": ["COBTUPDT"]}, {"key": "claude/txntype/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show at most 7 transaction types per page (WS-MAX-SCREEN-LINES = 7), sorted by type code.", "capability": "claude/txntype/02#1", "function": "claude/txntype/02", "rules": ["claude/RULE-020"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:60", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:338-352"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall decide whether a next page exists by trying to read an 8th record, and shall record that record's code as the last key.", "capability": "claude/txntype/02#1", "function": "claude/txntype/02", "rules": ["claude/RULE-020"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1723"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8, the system shall add 1 to the page number and read TR_TYPE >= the last key in TR_TYPE order.", "capability": "claude/txntype/02#1", "function": "claude/txntype/02", "rules": ["claude/RULE-020"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:770", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:338-352"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF7, the system shall subtract 1 from the page number and read TR_TYPE < the first key in descending order, filling rows 7 down to 1.", "capability": "claude/txntype/02#1", "function": "claude/txntype/02", "rules": ["claude/RULE-020"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:354-368", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:780-790"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF7 on page 1, then the system shall re-read the current page and show 'No previous pages to display'.", "capability": "claude/txntype/02#1", "function": "claude/txntype/02", "rules": ["claude/RULE-020"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:726-734", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1532-1535"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF8 when no next page exists, then the system shall show 'No more pages to display' or 'No more pages for these search conditions'.", "capability": "claude/txntype/02#1", "function": "claude/txntype/02", "rules": ["claude/RULE-020"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1536-1549"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If page 1 returns no records, then the system shall show 'No records found for this search condition.'.", "capability": "claude/txntype/02#1", "function": "claude/txntype/02", "rules": ["claude/RULE-020"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1702-1705"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the user pages with PF7 or PF8, the system shall clear page and row selections, and when any key other than PF8 is pressed, the system shall reset the last-page-shown flag.", "capability": "claude/txntype/02#1", "function": "claude/txntype/02", "rules": ["claude/RULE-020"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:657-661", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:773", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:787"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Optional", "text": "Where a type-code filter is supplied, the system shall require it to be a 2-digit number and list only the type with exact TR_TYPE equality.", "capability": "claude/txntype/02#2", "function": "claude/txntype/02", "rules": ["claude/RULE-068"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1096-1123", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:344-346"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat a blank, LOW-VALUES or '00' type-code filter as no filter.", "capability": "claude/txntype/02#2", "function": "claude/txntype/02", "rules": ["claude/RULE-068"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1096-1123"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If the type-code filter is not numeric (for example 'A1' or a one-digit entry like '5 '), then the system shall show 'TYPE CODE FILTER,IF SUPPLIED MUST BE A 2 DIGIT NUMBER', highlight the field red, protect row selection and not re-read the list.", "capability": "claude/txntype/02#2", "function": "claude/txntype/02", "rules": ["claude/RULE-068"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1096-1123"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Optional", "text": "Where a non-blank description filter is supplied, the system shall wrap it as %text% and match it with TR_DESCRIPTION LIKE, so any type whose description contains the text is listed.", "capability": "claude/txntype/02#2", "function": "claude/txntype/02", "rules": ["claude/RULE-040"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1142-1164"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat a blank or LOW-VALUES description filter as no description filter, apply no upper-casing to it, and combine the type and description filters with AND.", "capability": "claude/txntype/02#2", "function": "claude/txntype/02", "rules": ["claude/RULE-040"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:344-350"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When a valid type or description filter is supplied, the system shall count matching records (COUNT(1)) before reading the list.", "capability": "claude/txntype/02#2", "function": "claude/txntype/02", "rules": ["claude/RULE-069"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1801-1836"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If no records match the supplied filters, or the count query returns a DB2 error, then the system shall set an input error ('No Records found for these filter conditions' when none match), flag the supplied filter field(s) red and protect row selection.", "capability": "claude/txntype/02#2", "function": "claude/txntype/02", "rules": ["claude/RULE-069"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1239-1268", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1822-1831"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the type or description filter differs from the one used for the previous screen, the system shall re-initialize the paging variables (first/last key, page number, next-page flag), clear the row selection flags and show the filtered list from the start.", "capability": "claude/txntype/02#2", "function": "claude/txntype/02", "rules": ["claude/RULE-159"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1125-1178", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:991-994"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept 'D' (delete) or 'U' (update) as the action code on a listed row.", "capability": "claude/txntype/02#3", "function": "claude/txntype/02", "rules": ["claude/RULE-070"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:58-59", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:183-185"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If any other non-blank code (for example 'X') is entered on a row, then the system shall show 'Action code selected is invalid' and flag that row.", "capability": "claude/txntype/02#3", "function": "claude/txntype/02", "rules": ["claude/RULE-070"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1034-1038"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If more than one row is actioned, then the system shall flag the actioned rows red, show 'Please select only 1 action' and not offer confirmation.", "capability": "claude/txntype/02#3", "function": "claude/txntype/02", "rules": ["claude/RULE-070"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:982-1057"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When the selected row differs from the last selected row, the system shall set the row-selection-changed flag, which cancels a pending F10 confirmation.", "capability": "claude/txntype/02#3", "function": "claude/txntype/02", "rules": ["claude/RULE-070"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:982-1057"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When a row is marked for update, the system shall require the new description ('Transaction Desc', max length 50) to differ from the stored one, not be blank, and contain only letters, digits and spaces (A-Z a-z 0-9 space).", "capability": "claude/txntype/02#4", "function": "claude/txntype/02", "rules": ["claude/RULE-067"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1237"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Unwanted", "text": "If the new description contains any other character (for example 'Purchase-Online'), then the system shall show 'Transaction Desc can have numbers or alphabets only.' and show the description field red.", "capability": "claude/txntype/02#4", "function": "claude/txntype/02", "rules": ["claude/RULE-067"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1237"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If the new description is blank or '*', then the system shall show 'Transaction Desc must be supplied.' and redisplay '*'.", "capability": "claude/txntype/02#4", "function": "claude/txntype/02", "rules": ["claude/RULE-067"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:945-947", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1186-1205"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Unwanted", "text": "If the new description matches the stored one after trimming and ignoring case (for example 'PURCHASE' vs 'Purchase'), then the system shall show 'No change detected with respect to database values.'.", "capability": "claude/txntype/02#4", "function": "claude/txntype/02", "rules": ["claude/RULE-067"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1064-1073"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall keep only the first error message when several validation errors occur.", "capability": "claude/txntype/02#4", "function": "claude/txntype/02", "rules": ["claude/RULE-067"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1237"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Event-driven", "text": "When exactly one valid row action is marked, the filters are unchanged and the user presses Enter, the system shall highlight the row, set the delete- or update-requested flag and show 'Delete HIGHLIGHTED row ? Press F10 to confirm' or 'Update HIGHLIGHTED row. Press F10 to save'.", "capability": "claude/txntype/02#5", "function": "claude/txntype/02", "rules": ["claude/RULE-139"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1391-1411", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1514-1531"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "State-driven", "text": "While a delete- or update-requested flag is set, the system shall execute the requested delete or update when the user presses F10.", "capability": "claude/txntype/02#5", "function": "claude/txntype/02", "rules": ["claude/RULE-139"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:574-678"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept only Enter, PF2, PF3, PF7 and PF8, plus PF10 when the delete- or update-requested flag is set, and shall treat invalid keys as Enter.", "capability": "claude/txntype/02#5", "function": "claude/txntype/02", "rules": ["claude/RULE-139"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:574-678"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Unwanted", "text": "If F10 is pressed without a pending request, or after a filter or the selected row has changed, then the system shall treat it as Enter so that re-confirmation is required.", "capability": "claude/txntype/02#5", "function": "claude/txntype/02", "rules": ["claude/RULE-139", "claude/RULE-159"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:666-678"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Event-driven", "text": "When a confirmed update is executed with F10, the system shall run UPDATE TRANSACTION_TYPE SET TR_DESCRIPTION WHERE TR_TYPE equals the selected code, commit, re-read the list and show 'HIGHLIGHTED row was updated'.", "capability": "claude/txntype/02#6", "function": "claude/txntype/02", "rules": ["claude/RULE-202"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall allow only the description to be updated; the type code is the key and cannot change here.", "capability": "claude/txntype/02#6", "function": "claude/txntype/02", "rules": ["claude/RULE-202"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Unwanted", "text": "If the update returns SQLCODE +100, then the system shall show 'Record not found. Deleted by others ? '; if it returns -911, then the system shall show 'Deadlock. Someone else updating ?' as an input error; and if it returns any other negative code, then the system shall show 'Update failed with'.", "capability": "claude/txntype/02#6", "function": "claude/txntype/02", "rules": ["claude/RULE-202"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Unwanted", "text": "If the update fails, then the system shall keep the update-requested flag so the user can retry with F10.", "capability": "claude/txntype/02#6", "function": "claude/txntype/02", "rules": ["claude/RULE-202"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Event-driven", "text": "When a confirmed delete is executed with F10 and succeeds, the system shall remove the transaction type by code, take a SYNCPOINT, show 'HIGHLIGHTED row deleted.Hit Enter to continue' and reset the program context and paging to the first page.", "capability": "claude/txntype/02#7", "function": "claude/txntype/02", "rules": ["claude/RULE-203"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1896-1940", "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:810-834"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Unwanted", "text": "If DB2 returns SQLCODE -532 because the type is still referenced by dependent records, then the system shall keep the delete pending and show 'Please delete associated child records first:' plus the DB2 message.", "capability": "claude/txntype/02#7", "function": "claude/txntype/02", "rules": ["claude/RULE-203"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1896-1940"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-036", "code": "REQ-F-036", "kind": "F", "pattern": "Unwanted", "text": "If the delete returns any other SQL error, then the system shall show 'Delete failed with message:'.", "capability": "claude/txntype/02#7", "function": "claude/txntype/02", "rules": ["claude/RULE-203"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1896-1940"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-037", "code": "REQ-F-037", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3, the system shall take a SYNCPOINT and transfer control to the calling program, or to the admin menu COADM01C (tran CA00) if called directly.", "capability": "claude/txntype/02#8", "function": "claude/txntype/02", "rules": ["claude/RULE-194"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:591-652"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-038", "code": "REQ-F-038", "kind": "F", "pattern": "State-driven", "text": "While the user is already on the list screen, the system shall honour PF2 by transferring to the add-transaction-type screen COTRTUPC (CTTU).", "capability": "claude/txntype/02#8", "function": "claude/txntype/02", "rules": ["claude/RULE-194"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:591-652"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-039", "code": "REQ-F-039", "kind": "F", "pattern": "Event-driven", "text": "When control returns via PF3 from the add screen (CTTU), the system shall restart the list afresh.", "capability": "claude/txntype/02#8", "function": "claude/txntype/02", "rules": ["claude/RULE-194"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:544-554"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/02/REQ-F-040", "code": "REQ-F-040", "kind": "F", "pattern": "Event-driven", "text": "When transaction CTLI is started with no commarea, the system shall set CDEMO-USRTYP-ADMIN, letting the user list, update and delete transaction types, without checking the signed-on user's type.", "capability": "claude/txntype/02#9", "function": "claude/txntype/02", "rules": ["claude/RULE-222"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:515-532"], "programs": ["COTRTLIC"]}, {"key": "claude/txntype/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the administrator enters a type code and presses Enter with no record fetched yet, the system shall trim the input and require it to be supplied, numeric and not zero.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-049"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:820-976", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:671"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the code is blank, '*' or all spaces, then the system shall show 'Tran Type code must be supplied.'; if it is non-numeric (for example 'AB'), then 'Tran Type code must be numeric.'; and if it is '0' or '00', then 'Tran Type code must not be zero.'.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-049"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:820-976", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:667-673"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a valid code is entered, the system shall normalise it to a 2-digit zero-padded code (for example '5' becomes '05') and use it for the database lookup.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-049"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:834-842"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the code is blank and no other message is set, then the system shall return to the not-fetched state with 'No input received'; if the code is invalid, then the system shall set the invalid-search-keys state 'K'; and the system shall keep only the first error message.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-049"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:720-732"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "State-driven", "text": "While the record is being created or changes are awaiting confirmation, the system shall not validate the key again.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-049"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:712-714"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the lookup on CARDDEMO.TRANSACTION_TYPE finds the code (SQLCODE 0), the system shall save the original type and description as the 'old' values and set state Show Details 'S'.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-160"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1469-1514"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the lookup does not find the code (SQLCODE +100), the system shall set state Details Not Found 'X' and show 'No record found for this key in database' with the prompt 'Press F05 to add. F12 to cancel'.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-160"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1469-1514"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the lookup returns a DB error (SQLCODE < 0), then the system shall flag the input as an error and show the SQLCODE and message.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-160"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1469-1514"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "State-driven", "text": "While in state X, if the user re-enters the same code without pressing F5, the system shall return to not-fetched and run the lookup again.", "capability": "claude/txntype/03#1", "function": "claude/txntype/03", "rules": ["claude/RULE-160"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:698-707", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:654-658"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat an edit as 'no change' if the type code and the description match the stored values after trimming spaces and ignoring upper or lower case.", "capability": "claude/txntype/03#2", "function": "claude/txntype/03", "rules": ["claude/RULE-224"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:783-816"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If no change is detected, then the system shall show 'No change detected with respect to values fetched.', keep the state at Show Details and not offer the save step.", "capability": "claude/txntype/03#2", "function": "claude/txntype/03", "rules": ["claude/RULE-224"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:746-751", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1023-1030"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "State-driven", "text": "While a new record is being created, the system shall treat any description as a change because the old values are blank.", "capability": "claude/txntype/03#2", "function": "claude/txntype/03", "rules": ["claude/RULE-224"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:783-816"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When a change from the stored values is detected, the system shall require the description to be present and to contain only letters (A-Z, a-z), digits (0-9) and spaces, up to 50 characters.", "capability": "claude/txntype/03#2", "function": "claude/txntype/03", "rules": ["claude/RULE-071"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:849-905", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:230-237"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the description contains punctuation such as '-', '/', '&' or '.', then the system shall show 'Transaction Desc can have numbers or alphabets only.' and set state Changes Not OK 'E'.", "capability": "claude/txntype/03#2", "function": "claude/txntype/03", "rules": ["claude/RULE-071"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:849-905"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the description is blank, '*' or spaces, then the system shall show 'Transaction Desc must be supplied.'.", "capability": "claude/txntype/03#2", "function": "claude/txntype/03", "rules": ["claude/RULE-071"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:678-684"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the description passes validation, the system shall set state Changes OK Not Confirmed 'N' and show 'Changes validated.Press F5 to save'.", "capability": "claude/txntype/03#2", "function": "claude/txntype/03", "rules": ["claude/RULE-071"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:753-776"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "State-driven", "text": "While changes are validated (state N), when the user presses F5 the system shall run UPDATE TRANSACTION_TYPE SET TR_DESCRIPTION WHERE TR_TYPE equals the code.", "capability": "claude/txntype/03#3", "function": "claude/txntype/03", "rules": ["claude/RULE-140"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1623", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:514-520"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the update succeeds, the system shall commit (SYNCPOINT), set state C and show 'Changes committed to database'.", "capability": "claude/txntype/03#3", "function": "claude/txntype/03", "rules": ["claude/RULE-140"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1623"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the update finds no row (SQLCODE +100), the system shall INSERT (TR_TYPE, TR_DESCRIPTION) and commit.", "capability": "claude/txntype/03#3", "function": "claude/txntype/03", "rules": ["claude/RULE-140"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1623"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When the user presses F5 in state not found 'X', the system shall set state R and show 'Enter new transaction type details.' so that a description can be entered, validated and saved with F5.", "capability": "claude/txntype/03#3", "function": "claude/txntype/03", "rules": ["claude/RULE-140"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1623"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the save hits a lock timeout (-911), then the system shall set state L with 'Could not lock record for update'.", "capability": "claude/txntype/03#3", "function": "claude/txntype/03", "rules": ["claude/RULE-140"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1623"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Unwanted", "text": "If the update or the INSERT fails with any other error, then the system shall set state F (Changes Okayed But Failed) with 'Changes unsuccessful' and the SQL error text.", "capability": "claude/txntype/03#3", "function": "claude/txntype/03", "rules": ["claude/RULE-140"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1623"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When the state is C, L or F, the system shall start the next interaction fresh at the search prompt, and after a successful save from a direct (no caller) entry, the system shall clear the account ID and card number in the commarea.", "capability": "claude/txntype/03#3", "function": "claude/txntype/03", "rules": ["claude/RULE-140"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:410-418", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1065-1072"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When a record is displayed (state S) and the user presses F4, the system shall ask 'Delete this record ? Press F4 to confirm'.", "capability": "claude/txntype/03#4", "function": "claude/txntype/03", "rules": ["claude/RULE-141"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1666", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:482-498"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When the user presses F4 again to confirm, the system shall run DELETE FROM TRANSACTION_TYPE WHERE TR_TYPE equals the OLD (fetched) type code and, on success, commit, set state 7 and show 'Delete successful.'.", "capability": "claude/txntype/03#4", "function": "claude/txntype/03", "rules": ["claude/RULE-141"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1666"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If the delete returns SQLCODE -532 (child records still exist), then the system shall show 'Please delete associated child records first'.", "capability": "claude/txntype/03#4", "function": "claude/txntype/03", "rules": ["claude/RULE-141"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1666"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Unwanted", "text": "If the delete returns any other error, then the system shall set state 6 'Delete failed'.", "capability": "claude/txntype/03#4", "function": "claude/txntype/03", "rules": ["claude/RULE-141"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1666"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Event-driven", "text": "When the state is 7 or 6, the system shall return the next interaction to the search prompt.", "capability": "claude/txntype/03#4", "function": "claude/txntype/03", "rules": ["claude/RULE-141"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1666"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "State-driven", "text": "While a delete is being confirmed, the system shall not accept Enter, and F12 shall cancel with 'Delete was cancelled'.", "capability": "claude/txntype/03#4", "function": "claude/txntype/03", "rules": ["claude/RULE-141"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:583", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1000-1002"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Event-driven", "text": "When the user presses F12 with pending edits or a pending delete, the system shall read the record again from TRANSACTION_TYPE and show its stored values (state S), or set not-found X if the record is gone.", "capability": "claude/txntype/03#5", "function": "claude/txntype/03", "rules": ["claude/RULE-161"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:978-1010", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:524-533"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Unwanted", "text": "If the key cannot be used on F12, then the system shall show 'Update was cancelled' (state B) or 'Delete was cancelled' (back to not-fetched).", "capability": "claude/txntype/03#5", "function": "claude/txntype/03", "rules": ["claude/RULE-161"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:978-1010"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Event-driven", "text": "When F12 is pressed in state S, R or X, the system shall restart from the search prompt.", "capability": "claude/txntype/03#5", "function": "claude/txntype/03", "rules": ["claude/RULE-161"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:406-409", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:417-418"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "State-driven", "text": "While in backed-out state B, the system shall reset to a fresh entry when there are no old details, and return to Changes Not OK 'E' when old details exist.", "capability": "claude/txntype/03#5", "function": "claude/txntype/03", "rules": ["claude/RULE-161"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:412-414", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1041-1042"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall always allow F3; allow Enter except while confirming a delete (9); allow F4 in S or 9; allow F5 in N, X or 6-9; and allow F12 in N, S, X, 9 or R.", "capability": "claude/txntype/03#6", "function": "claude/txntype/03", "rules": ["claude/RULE-223"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:577-623"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed, then the system shall reject it with 'Invalid key pressed' and show the screen again unchanged.", "capability": "claude/txntype/03#6", "function": "claude/txntype/03", "rules": ["claude/RULE-223"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:539-542"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-036", "code": "REQ-F-036", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall highlight the key labels on screen from the same matrix of allowed keys.", "capability": "claude/txntype/03#6", "function": "claude/txntype/03", "rules": ["claude/RULE-223"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1397-1426"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-037", "code": "REQ-F-037", "kind": "F", "pattern": "Event-driven", "text": "When the user presses F3, the system shall issue SYNCPOINT and transfer control to the calling program, or to COADM01C (transaction CA00) as an admin user if there was no caller.", "capability": "claude/txntype/03#7", "function": "claude/txntype/03", "rules": ["claude/RULE-257"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:429-460", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:209-212"], "programs": ["COTRTUPC"]}, {"key": "claude/txntype/03/REQ-F-038", "code": "REQ-F-038", "kind": "F", "pattern": "Event-driven", "text": "When the screen is entered from the admin menu (COADM01C) or the transaction type list (COTRTLIC) without re-entry, the system shall reset all screen context.", "capability": "claude/txntype/03#7", "function": "claude/txntype/03", "rules": ["claude/RULE-257"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:366-374", "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:465-478"], "programs": ["COTRTUPC"]}, {"key": "claude/mqinquiry/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read each account inquiry request as function (4 chars) + account id (11 digits) + filler (985 chars).", "capability": "claude/mqinquiry/01#1", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-050"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-457"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a request message is processed, the system shall treat it as an account lookup only if its first 4 characters are the function code 'INQA' and the following 11-digit account id is greater than zero.", "capability": "claude/mqinquiry/01#1", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-050"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-457"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall match the function code 'INQA' exactly and case-sensitively, so that 'inqa' is rejected.", "capability": "claude/mqinquiry/01#1", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-050"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-457"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the function code is not 'INQA' or the account id is not greater than zero, then the system shall put the reply 'INVALID REQUEST PARAMETERS ACCT ID : <account id>FUNCTION : <function>' on the normal reply queue, read no account record, and continue with the next message.", "capability": "claude/mqinquiry/01#1", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-050"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-457"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset the request buffer (numeric fields to zero) before each GET, so that a short message leaves the account id as zero and is rejected.", "capability": "claude/mqinquiry/01#1", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-050"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-457"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a valid 'INQA' request is processed, the system shall read the account by account id from the account master file (ACCTDAT).", "capability": "claude/mqinquiry/01#2", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-204"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:396-427"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the account is found, the system shall put a reply on the reply queue with account id, active status, current balance, credit limit, cash credit limit, open date, expiration date, reissue date, current cycle credit, current cycle debit and group id, labelled 'ACCOUNT ID : ', 'ACCOUNT STATUS : ', 'BALANCE : ', 'CREDIT LIMIT : ', 'CASH LIMIT : ', 'OPEN DATE : ', 'EXPR DATE : ', 'REIS DATE : ', 'CREDIT BAL : ', 'DEBIT BAL : ' and 'GROUP ID : '.", "capability": "claude/mqinquiry/01#2", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-204"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:396-427"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall copy amounts and dates from the account record as-is, with no calculation and no derived value such as available credit.", "capability": "claude/mqinquiry/01#2", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-204"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:396-427"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return the active status as the raw 1-char code and shall return inactive accounts as well, with no status-based eligibility check.", "capability": "claude/mqinquiry/01#2", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-204"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:396-427"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall leave the account ZIP code and record filler out of the reply.", "capability": "claude/mqinquiry/01#2", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-204"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:396-427"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If no record exists on ACCTDAT for the requested account id (CICS response NOTFND), then the system shall put the reply 'INVALID REQUEST PARAMETERS ACCT ID : <account id>' on the reply queue and continue with the next message.", "capability": "claude/mqinquiry/01#3", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-072"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:428-435"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall put every account inquiry reply on the fixed queue CARD.DEMO.REPLY.ACCT, ignoring the requester's own reply-to queue.", "capability": "claude/mqinquiry/01#4", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-225", "claude/RULE-162"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:462-478"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall give each account inquiry reply the original request's message id and correlation id.", "capability": "claude/mqinquiry/01#4", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-225"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:462-478"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall put each account inquiry reply as a string message (MQSTR) in the queue manager's CCSID, under syncpoint, with a fixed length of 1000 bytes padded with spaces.", "capability": "claude/mqinquiry/01#4", "function": "claude/mqinquiry/01", "rules": ["claude/RULE-225"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:462-478"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a request message is processed, the system shall reply with 'SYSTEM DATE : ' followed by the CICS system date as MM-DD-YYYY (dash-separated) and then 'SYSTEM TIME : ' followed by the system time as HH:MM:SS, with no separator or space between the date value and the 'SYSTEM TIME' label.", "capability": "claude/mqinquiry/02#1", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-005"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:339-364"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall pad the date/time reply with spaces to 1000 bytes.", "capability": "claude/mqinquiry/02#1", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-005"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:339-364"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall take the date and time from the CICS region clock (ASKTIME ABSTIME, region local time), with no UTC conversion.", "capability": "claude/mqinquiry/02#1", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-005"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:339-364"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset the reply buffer and date fields before each message, so that values from an earlier message are never carried over.", "capability": "claude/mqinquiry/02#1", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-005"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:339-364"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send the normal date/time reply for any request message, including an empty or malformed one, without validating or using the function code (4 characters) or the 11-digit key.", "capability": "claude/mqinquiry/02#1", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-073", "claude/RULE-005"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:109-112"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall put every date/time reply on the fixed queue CARD.DEMO.REPLY.DATE, ignoring the reply-to queue named in the request.", "capability": "claude/mqinquiry/02#2", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-226"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:366-403"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall give each date/time reply the request's message ID and correlation ID.", "capability": "claude/mqinquiry/02#2", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-226"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:366-403"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/02/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall put each date/time reply with format MQSTR and the queue manager's CCSID, under syncpoint.", "capability": "claude/mqinquiry/02#2", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-226"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:366-403"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the date/time reply put fails, then the system shall send an error record to the error queue and terminate.", "capability": "claude/mqinquiry/02#2", "function": "claude/mqinquiry/02", "rules": ["claude/RULE-226", "claude/RULE-227"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:366-403", "app/app-vsam-mq/cbl/CODATE01.cbl:405-440"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the CICS transaction is started by the MQ trigger monitor, the system shall take the input queue name from the trigger message and open the error, input and reply queues.", "capability": "claude/mqinquiry/03#1", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-162", "claude/RULE-164"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218", "app/app-vsam-mq/cbl/CODATE01.cbl:283-337"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "State-driven", "text": "While the queues are open, the system shall repeatedly take one request at a time under syncpoint, reply to it, and commit the request and its reply together by CICS SYNCPOINT.", "capability": "claude/mqinquiry/03#1", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-162", "claude/RULE-164"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218", "app/app-vsam-mq/cbl/CODATE01.cbl:283-337"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall open the input queue as INPUT-SHARED, wait up to 5000 ms for each request, and get requests of up to 1000 bytes with the options SYNCPOINT, FAIL-IF-QUIESCING, CONVERT and WAIT.", "capability": "claude/mqinquiry/03#1", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-162", "claude/RULE-164"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218", "app/app-vsam-mq/cbl/CODATE01.cbl:283-337"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When no message arrives within 5 seconds (MQRC-NO-MSG-AVAILABLE), the system shall end the loop, close the queues that were opened and return to CICS.", "capability": "claude/mqinquiry/03#1", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-162", "claude/RULE-164"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218", "app/app-vsam-mq/cbl/CODATE01.cbl:283-337"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the CICS RETRIEVE of the trigger message fails, then the system shall log an error and terminate before opening the input queue.", "capability": "claude/mqinquiry/03#1", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-162"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the input or reply queue cannot be opened, a GET fails for any reason other than no message available, or the reply PUT fails, then the system shall put an error record on the error queue and terminate.", "capability": "claude/mqinquiry/03#1", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-162", "claude/RULE-164", "claude/RULE-227"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218", "app/app-vsam-mq/cbl/CODATE01.cbl:283-337"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If a request message is over 1000 bytes, then the system shall fail the GET without accepting truncation and terminate the service.", "capability": "claude/mqinquiry/03#1", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-164"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:283-337"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the queue manager is quiescing, then the system shall fail its MQ calls and terminate.", "capability": "claude/mqinquiry/03#1", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-162"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When termination runs, the system shall close only the queues it opened, using per-queue open flags, in the order input queue, reply queue, error queue, with close option MQCO-NONE, and then return control to CICS.", "capability": "claude/mqinquiry/03#2", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-195", "claude/RULE-162"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:442-523", "app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If an account file read has any outcome other than found or not-found, then the system shall put an error record (paragraph, message 'ERROR WHILE READING ACCTFILE', response code, reason code, input queue name) on CARD.DEMO.ERROR, close the open queues and return, sending no reply to the requester.", "capability": "claude/mqinquiry/03#3", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-163"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:437-445"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the service terminates on an account file error, then the system shall leave the remaining messages on the input queue to wait for the next trigger.", "capability": "claude/mqinquiry/03#3", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-163"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:437-445"], "programs": ["COACCT01"]}, {"key": "claude/mqinquiry/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If a trigger retrieve, queue open, get or put fails, then the system shall put a structured error record on CARD.DEMO.ERROR under syncpoint and then stop.", "capability": "claude/mqinquiry/03#4", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-227", "claude/RULE-258"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:405-440", "app/app-vsam-mq/cbl/COACCT01.cbl:501-536"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall write each error record as a 1000-byte MQSTR message laid out as paragraph X(25), message X(25), condition 9(02), reason 9(05) and queue name X(48), separated by 2 spaces.", "capability": "claude/mqinquiry/03#4", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-258", "claude/RULE-227"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:501-536", "app/app-vsam-mq/cbl/CODATE01.cbl:405-440"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use the error message texts 'CICS RETRIEVE', 'INP MQOPEN ERR', 'OUT MQOPEN ERR', 'INP MQGET ERR:', 'MQPUT ERR' and 'MQCLOSE ERR' for the matching failures.", "capability": "claude/mqinquiry/03#4", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-227"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:405-440"], "programs": ["CODATE01"]}, {"key": "claude/mqinquiry/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the error queue cannot be opened or written, then the system shall only DISPLAY the error to the job log and end the program.", "capability": "claude/mqinquiry/03#4", "function": "claude/mqinquiry/03", "rules": ["claude/RULE-227", "claude/RULE-258", "claude/RULE-162"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:405-440", "app/app-vsam-mq/cbl/COACCT01.cbl:501-536"], "programs": ["COACCT01", "CODATE01"]}, {"key": "claude/pendauth/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the program is triggered, the system shall read authorization requests from the request queue one at a time and commit (SYNCPOINT) each message on its own.", "capability": "claude/pendauth/01#1", "function": "claude/pendauth/01", "rules": ["claude/RULE-214"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-344"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the queue is empty after a 5-second wait (MQGET wait interval 5000 ms), the system shall stop the triggered run.", "capability": "claude/pendauth/01#1", "function": "claude/pendauth/01", "rules": ["claude/RULE-214"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-344"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Event-driven", "text": "When more than 500 messages (WS-REQSTS-PROCESS-LIMIT = 500, check is processed > 500) have been processed in a run, the system shall stop the run and leave the remaining messages for the next trigger.", "capability": "claude/pendauth/01#1", "function": "claude/pendauth/01", "rules": ["claude/RULE-214"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-344"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If an MQGET error other than no-message-available occurs, then the system shall treat it as a critical error (M003).", "capability": "claude/pendauth/01#1", "function": "claude/pendauth/01", "rules": ["claude/RULE-214", "claude/RULE-216"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-344"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When an authorization request is processed, the system shall look up the card number in the card cross-reference (CCXREF) to find its account and customer.", "capability": "claude/pendauth/01#2", "function": "claude/pendauth/01", "rules": ["claude/RULE-060"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:438-513"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the card is found in the cross-reference, the system shall read the account master (ACCTDAT, 11-digit account ID), the customer master (CUSTDAT, 9-digit customer ID) and the account's pending-authorization summary.", "capability": "claude/pendauth/01#2", "function": "claude/pendauth/01", "rules": ["claude/RULE-060"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:438-513"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the card is not found in the cross-reference, then the system shall log the warning 'CARD NOT FOUND IN XREF' (A001), mark the account not-found, send a reply, and write no summary or detail record.", "capability": "claude/pendauth/01#2", "function": "claude/pendauth/01", "rules": ["claude/RULE-060"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:438-513"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the account is not found in the account master, then the system shall log warning A002 and base the decision on the pending-authorization summary if one is found, otherwise decline.", "capability": "claude/pendauth/01#2", "function": "claude/pendauth/01", "rules": ["claude/RULE-060", "claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:438-513"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the customer is not found in the customer master, then the system shall log warning A003 only and shall not decline the request for that reason on its own.", "capability": "claude/pendauth/01#2", "function": "claude/pendauth/01", "rules": ["claude/RULE-060", "claude/RULE-061"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:438-513"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If an IMS summary read returns 'GE', then the system shall treat the account as having no summary yet; any other non-OK status shall be critical (I002).", "capability": "claude/pendauth/01#2", "function": "claude/pendauth/01", "rules": ["claude/RULE-060"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:438-513"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If a read of the cross-reference, account or customer file fails with any error other than not-found, then the system shall treat it as critical (C001/C002/C003) and end the run.", "capability": "claude/pendauth/01#2", "function": "claude/pendauth/01", "rules": ["claude/RULE-060", "claude/RULE-216"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:438-513"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Optional", "text": "Where a pending-authorization summary exists for the account, the system shall calculate available credit as PA-CREDIT-LIMIT - PA-CREDIT-BALANCE.", "capability": "claude/pendauth/01#3", "function": "claude/pendauth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Optional", "text": "Where no pending-authorization summary exists but the account is found, the system shall calculate available credit as ACCT-CREDIT-LIMIT - ACCT-CURR-BAL from the account master.", "capability": "claude/pendauth/01#3", "function": "claude/pendauth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the requested amount is greater than the available credit, then the system shall decline the request with reason insufficient funds.", "capability": "claude/pendauth/01#3", "function": "claude/pendauth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the requested amount is equal to or less than the available credit, including zero or negative amounts (credits or reversals), the system shall approve the request.", "capability": "claude/pendauth/01#3", "function": "claude/pendauth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If neither a summary nor the account is found, then the system shall decline the request without setting the insufficient-funds flag.", "capability": "claude/pendauth/01#3", "function": "claude/pendauth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not check the cash limit or cash balance, so cash and purchase requests are treated the same.", "capability": "claude/pendauth/01#3", "function": "claude/pendauth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When a request is approved, the system shall return response code '00' and approve the full requested amount (PA-RQ-TRANSACTION-AMT).", "capability": "claude/pendauth/01#4", "function": "claude/pendauth/01", "rules": ["claude/RULE-215"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When a request is declined, the system shall return response code '05' and an approved amount of $0.00.", "capability": "claude/pendauth/01#4", "function": "claude/pendauth/01", "rules": ["claude/RULE-215"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the authorization ID code to the request's auth time (PA-RQ-AUTH-TIME).", "capability": "claude/pendauth/01#4", "function": "claude/pendauth/01", "rules": ["claude/RULE-215"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When a request is approved, the system shall set the reason code to '0000'.", "capability": "claude/pendauth/01#4", "function": "claude/pendauth/01", "rules": ["claude/RULE-061"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:698-718"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When a request is declined, the system shall set the reason code from the first matching cause in this order: 3100 not found (card, account or customer), 4100 insufficient funds, 4200 card not active, 4300 account closed, 5100 card fraud, 5200 merchant fraud, 9000 other.", "capability": "claude/pendauth/01#4", "function": "claude/pendauth/01", "rules": ["claude/RULE-061"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:698-718"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build the response as a comma-delimited string of card number, transaction ID, auth ID code, response code, reason code and approved amount (formatted -zzzzzzzzz9.99).", "capability": "claude/pendauth/01#4", "function": "claude/pendauth/01", "rules": ["claude/RULE-215"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696"], "pr
