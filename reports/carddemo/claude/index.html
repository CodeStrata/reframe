ured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-N-001"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN01C.cbl:144-192", "plain": "To view a transaction the user must enter a non-blank Transaction ID; the system reads that exact ID from the TRANSACT file and shows all its details, or shows an error if the ID is blank, not on file, or cannot be read.", "defect": "The read at lines 269-278 is issued with the UPDATE option (exclusive record lock) although this is a view-only screen and no REWRITE/UNLOCK follows; the lock is held until task end, which can block concurrent updates. Also on success PROCESS-ENTER-KEY sends the screen (line 191) and on first entry with a preselected transaction MAIN-PARA sends it again (line 109) - duplicate send."}, {"key": "claude/RULE-123", "function": "claude/transactions/03", "id": "RULE-123", "name": "All transaction detail fields are mandatory", "text": "Given A valid card/account is entered and Merchant City is blank, all other fields filled\nWhen Enter is pressed\nThen 'Merchant City can NOT be empty...' is shown, cursor placed on Merchant City, and no transaction is written", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:251-320", "plain": "Type code, category code, source, description, amount, origination date, processing date, merchant ID, merchant name, merchant city and merchant ZIP must all be entered.", "defect": ""}, {"key": "claude/RULE-124", "function": "claude/transactions/03", "id": "RULE-124", "name": "Numeric code fields: transaction type, category and merchant ID", "text": "Given Type CD 'AB', Category CD '0001'\nWhen Enter is pressed\nThen 'Type CD must be Numeric...' is shown and nothing is added", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:322-337", "plain": "Transaction Type Code, Transaction Category Code and Merchant ID must be entirely numeric.", "defect": "No referential check of type/category codes against TRANTYPE/TRANCATG reference data, so invalid but numeric codes can be stored."}, {"key": "claude/RULE-125", "function": "claude/transactions/03", "id": "RULE-125", "name": "Origination and processing dates must be valid calendar dates in YYYY-MM-DD", "text": "Given Orig Date '2024-02-30'\nWhen Enter is pressed\nThen Layout check passes but the date utility CSUTLDTC rejects it and 'Orig Date - Not a valid date...' is shown", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COTRN02C.cbl:353-427", "plain": "Both the origination date and processing date must be in YYYY-MM-DD layout and must be real calendar dates per the date-validation utility.", "defect": "Ignoring error 2513 lets out-of-range dates through; no ordering check between orig and proc dates."}, {"key": "claude/RULE-126", "function": "claude/useradmin/01", "id": "RULE-126", "name": "Row action selection routes to Update or Delete user", "text": "Given The list shows user USER0003 in row 3 and the admin types 'd' in row 3's selection field and 'U' in row 5\nWhen Enter is pressed\nThen Only row 3 is used (first non-blank selection from row 1 to row 10). Control passes to COUSR03C (delete user) with selected user USER0003, selection flag 'd', from-program COUSR00C and context 0. 'U'/'u' would go to COUSR02C (update user)", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020", "REQ-F-021", "REQ-F-022", "REQ-F-023", "REQ-F-024"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COUSR00C.cbl:151-216", "plain": "An admin picks one listed user by typing U (update) or D (delete) in that row's selection column. The first selected row from the top wins, and any other code is rejected.", "defect": "An invalid selection code does not set WS-ERR-FLG, so processing goes on to reload page 1 and clears the filter field. A later 'reached the bottom/top' message from the file read can overwrite the 'Invalid selection' message."}, {"key": "claude/RULE-127", "function": "claude/useradmin/01", "id": "RULE-127", "name": "User ID filter sets where the list starts and resets paging", "text": "Given The admin types 'ADMIN05' in the User ID search field\nWhen Enter is pressed (no row action taken)\nThen The USRSEC browse starts at key 'ADMIN05' (CICS STARTBR uses key-equal-or-greater by default). Page number is reset to 0 and then becomes 1 after the page loads. The search field is cleared unless an error happened", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR00C.cbl:218-232", "plain": "If the admin enters a User ID in the search field, the list starts at that ID (or the next higher one). If the field is blank, it starts at the first user. In both cases the page counter goes back to 1.", "defect": ""}, {"key": "claude/RULE-128", "function": "claude/useradmin/01", "id": "RULE-128", "name": "Forward paging blocked at last page", "text": "Given The current page was the last one (next-page flag = N)\nWhen PF8 is pressed\nThen No file read is done, 'You are already at the bottom of the page...' is shown, and the screen is redrawn without erase so the current rows stay", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR00C.cbl:260-277", "plain": "PF8 only moves forward when the previous page showed that more users exist. Otherwise the admin is told they are already at the bottom.", "defect": ""}, {"key": "claude/RULE-129", "function": "claude/useradmin/02", "id": "RULE-129", "name": "New user requires all five profile fields, checked in fixed order", "text": "Given An administrator on the Add User screen (transaction CU01) enters First Name 'JANE', Last Name blank, User ID blank, Password 'Pa55', User Type 'U'\nWhen Enter is pressed\nThen The message 'Last Name can NOT be empty...' is shown with the cursor on Last Name, only that first error is reported, and no record is written to USRSEC", "program": "COUSR01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR01C.cbl:115-160", "plain": "A new user can only be added when First Name, Last Name, User ID, Password and User Type are all filled in; the first missing one (in that order) is reported and nothing is saved.", "defect": "User Type is only checked for presence. Any character is accepted, although the program header says users are 'Regular/Admin' (expected values A/U). There is no password strength rule."}, {"key": "claude/RULE-130", "function": "claude/useradmin/02", "id": "RULE-130", "name": "User ID must be unique when adding a user; record stored as entered", "text": "Given User ID 'ADMIN001' already exists in USRSEC\nWhen An administrator submits a valid Add User form with User ID 'ADMIN001'\nThen The add is rejected with 'User ID already exist...' and the cursor on User ID; if the ID were new (for example 'USER0099'), the record would be written, all fields cleared, and the green message 'User USER0099 has been added ...' shown", "program": "COUSR01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-N-001"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR01C.cbl:238-274", "plain": "A new user is saved to the user security file under the User ID as its key; if that User ID already exists the add is rejected, and on success the form is cleared and a confirmation is shown.", "defect": "The password is saved exactly as typed, in plain text (SEC-USR-PWD set at COUSR01C.cbl:157), with no hashing."}, {"key": "claude/RULE-131", "function": "claude/useradmin/03", "id": "RULE-131", "name": "User lookup by ID loads the current profile for editing", "text": "Given An administrator enters User ID 'XYZ00001' that does not exist in USRSEC\nWhen They press Enter\nThen 'User ID NOT found...' is shown with cursor on User ID and the detail fields are left blank; for an existing ID the stored First Name, Last Name, Password and User Type are displayed with 'Press PF5 key to save your updates ...'", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR02C.cbl:143-172", "plain": "Pressing Enter with a User ID looks the user up in the user security file; if found, their names, password and type are shown for editing with a prompt to press PF5 to save, and if not found an error is shown.", "defect": "The stored password is moved into the screen field (line 169); although the map field is dark (non-display), the clear-text password is transmitted to the terminal."}, {"key": "claude/RULE-132", "function": "claude/useradmin/03", "id": "RULE-132", "name": "All user profile fields are mandatory before an update can be saved", "text": "Given An administrator on the Update User screen with User ID 'JDOE0001', First Name 'John', Last Name blank, Password '********', User Type 'U'\nWhen They press PF5 (save) or PF3 (save and exit)\nThen The save is refused with 'Last Name can NOT be empty...', the cursor is placed on Last Name, and the USRSEC record is not rewritten", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR02C.cbl:177-213", "plain": "A user record can only be saved when User ID, First Name, Last Name, Password and User Type are all filled in; the first empty field (in that order) is reported and the save is blocked.", "defect": "User Type is not checked against the allowed values (admin/regular), so an invalid role code can be saved to the security file."}, {"key": "claude/RULE-133", "function": "claude/batch/05", "id": "RULE-133", "name": "Date parameter record must be readable", "text": "Given The DATEPARM file is empty\nWhen the date parameter is read\nThen the end-of-file flag is set, no transactions are processed, and the report file is created empty", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P2", "category": "Validation", "confidence": "High", "source": "app/cbl/CBTRN03C.cbl:220-243", "plain": "The program reads one date-parameter record before reporting. If the file is empty, it produces no report content. Any other read error stops the batch.", "defect": ""}, {"key": "claude/RULE-134", "function": "claude/card/01", "id": "RULE-134", "name": "Selection field protection for empty rows and filter errors", "text": "Given Page shows 4 cards, rows 5-7 empty\nWhen The screen is sent\nThen The selection fields for rows 1-4 can be typed in and rows 5-7 are protected", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-020"], "priority": "P2", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COCRDLIC.cbl:748-832", "plain": "A row's selection field can be typed in only when the row holds a card and there is no filter error. Otherwise it is protected.", "defect": "Line 790 has a stray token 'I', so the protected attribute byte is also moved into subscript variable I."}, {"key": "claude/RULE-135", "function": "claude/card/02", "id": "RULE-135", "name": "No search criteria received (cross-field)", "text": "Given Both the account and card fields are blank or '*' on re-entry\nWhen The inputs are edited\nThen The return message is set to 'No input received' (overwriting 'Account number not provided'), both fields are marked '*' in red, and no file read takes place", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005"], "priority": "P2", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDSLC.cbl:636-640", "plain": "If both the account and the card number are empty, the user is told no input was received, and this message replaces the individual 'not provided' prompts.", "defect": ""}, {"key": "claude/RULE-136", "function": "claude/pendauth/03", "id": "RULE-136", "name": "Toggle fraud flag on a pending authorization", "text": "Given Account 00000012345 with selected authorization whose fraud flag PA-AUTH-FRAUD is blank (never tagged)\nWhen The user presses PF5\nThen PA-AUTH-FRAUD is set to 'F' (fraud confirmed), the action 'F' (report fraud) plus account ID, customer ID and the full 200-byte detail record are sent to COPAUS2C. If the flag had been 'F' it becomes 'R' (fraud removed) and action 'R' is sent.", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266", "plain": "When the user presses PF5 on an authorization, the fraud status flips: an authorization already confirmed as fraud is marked fraud-removed, and any other authorization is marked fraud-confirmed. The fraud service COPAUS2C is then called with the matching action (report or remove).", "defect": "MARK-AUTH-FRAUD runs READ-AUTH-RECORD but never checks AUTHS-EOF or ERR-FLG before toggling the flag and calling COPAUS2C. If the read fails or finds nothing, a stale or empty detail buffer can be tagged and sent to the fraud service."}, {"key": "claude/RULE-137", "function": "claude/pendauth/03", "id": "RULE-137", "name": "Record or reverse fraud flag on an authorization", "text": "Given Authorization for card 4111111111111111 at 25-04-30 14.05.22.123 with action 'F' (report fraud) and account 00000012345 / customer 000000789\nWhen COPAUS2C is invoked from the authorization detail screen\nThen a row is inserted into CARDDEMO.AUTHFRDS with AUTH_FRAUD='F', FRAUD_RPT_DATE=CURRENT DATE, plus all authorization, merchant, account and customer fields; status 'S' and message 'ADD SUCCESS'. If the same card+timestamp already exists (SQLCODE -803), AUTH_FRAUD and FRAUD_RPT_DATE are updated instead (status 'S', 'UPDT SUCCESS'). Any other DB error sets status 'F' with the SQLCODE/SQLSTATE in the message.", "program": "COPAUS2C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-F-008"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244", "plain": "When an operator reports fraud on (or removes fraud from) an authorization, a snapshot of the authorization is written to the fraud table with the fraud action and today's date; if that authorization is already in the fraud table, only its fraud flag and report date are updated.", "defect": ""}, {"key": "claude/RULE-138", "function": "claude/pendauth/05", "id": "RULE-138", "name": "Reload each detail under its parent summary by account ID", "text": "Given The child extract INFILE2 has a record with packed root key 12345 and a 200-byte detail, and summary 12345 exists in the database\nWhen PAUDBLOD processes the child file, after the whole root file has loaded\nThen A qualified GU on PAUTSUM0(ACCNTID EQ 12345) puts the job on the parent, and an ISRT of PAUTDTL1 adds the detail under it. Status II logs 'CHILD SEGMENT ALREADY IN DB' and the job continues. Any other insert status abends with return code 16.", "program": "PAUDBLOD", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:269-336", "plain": "Each detail record in the child extract carries its parent account ID. The reload looks up that account's summary in the database and inserts the detail under it. Records with a non-numeric account key are skipped, and duplicate details are accepted without error.", "defect": "In 3100-INSERT-CHILD-SEG (lines 305-314), the check for a failed GU is nested inside the 'GU succeeded' branch because there is no END-IF after the PERFORM at line 309. A failed parent lookup, such as an orphan detail with status GE, is therefore never reported, and the detail is lost without notice. The nested check only tests the status from the child ISRT, which 3200 already handled."}, {"key": "claude/RULE-139", "function": "claude/txntype/02", "id": "RULE-139", "name": "Two-step confirmation for delete and update", "text": "Given Row 3 (type '03') marked 'D' with no other changes\nWhen The user presses Enter, then F10\nThen Enter shows 'Delete HIGHLIGHTED row ? Press F10 to confirm' and sets the delete-requested flag; F10 then deletes type '03'", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-026", "REQ-F-027", "REQ-F-028", "REQ-F-029"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:574-678", "plain": "A delete or update is only executed when the user first marks the row and presses Enter (which highlights the row and asks for confirmation) and then presses F10 without changing filters or the selected row.", "defect": ""}, {"key": "claude/RULE-140", "function": "claude/txntype/03", "id": "RULE-140", "name": "Two-step save: validate, then confirm with F5 (update, or insert if missing)", "text": "Given Type '07' with a new description 'Retail Purchase' has passed validation (state N)\nWhen The user presses F5\nThen The system runs UPDATE TRANSACTION_TYPE SET TR_DESCRIPTION WHERE TR_TYPE='07'. On success it commits (SYNCPOINT), sets state C and shows 'Changes committed to database'. If no row exists (SQLCODE +100), it INSERTs (TR_TYPE, TR_DESCRIPTION) and commits. Lock timeout (-911) sets state L with 'Could not lock record for update'. Any other error sets state F with 'Changes unsuccessful' and the SQL error text", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021", "REQ-F-022", "REQ-F-023"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1623", "plain": "Changes are saved only after they pass validation and the user presses F5 to confirm. The save updates the description of an existing type, or inserts a new row if the type does not exist yet, and commits.", "defect": "(1) The stored description length is set to FUNCTION LENGTH of the untrimmed 50-byte field (lines 1541-1542), so every saved description is padded to 50 characters even though the text is trimmed. (2) The optimistic-concurrency check DATA-WAS-CHANGED-BEFORE-UPDATE (lines 1585-1586) is never set anywhere, and the row is not re-read before the update, so a change someone else made between fetch and save is silently overwritten (last write wins)."}, {"key": "claude/RULE-141", "function": "claude/txntype/03", "id": "RULE-141", "name": "Two-step delete with F4 confirmation; delete blocked by child records", "text": "Given Type '07' is displayed (state S)\nWhen The user presses F4, sees 'Delete this record ? Press F4 to confirm', and presses F4 again\nThen The system runs DELETE FROM TRANSACTION_TYPE WHERE TR_TYPE='07'. On success it commits, sets state 7 and shows 'Delete successful.'. On SQLCODE -532 (child records still exist) it shows 'Please delete associated child records first'. On any other error it sets state 6 'Delete failed'. After state 7 or 6, the next interaction goes back to the search prompt", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-024", "REQ-F-025", "REQ-F-026", "REQ-F-027", "REQ-F-028", "REQ-F-029"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1666", "plain": "A displayed transaction type is deleted only after the user presses F4 twice: once to ask for the delete and once to confirm. The delete fails if child records still refer to the type.", "defect": "On SQLCODE -532 the code sets RECORD-DELETE-FAILED but never TTUP-DELETE-FAILED, so the state stays '8' (start delete). The 'reset after delete failed' logic (lines 415-418) does not fire, and the next pass can reach WHEN OTHER in 2000-DECIDE-ACTION and abend 'UNEXPECTED DATA SCENARIO'. The SQLERRM is also added to the message twice (lines 1645-1646)."}, {"key": "claude/RULE-142", "function": "claude/provisioning/03", "id": "RULE-142", "name": "Sequential account read: process on success, stop at end of file, abend on any other status", "text": "Given An account master file with 3 accounts\nWhen The batch runs\nThen Each of the 3 accounts produces 1 fixed extract record, 1 array record and 2 variable-length records; the 4th read returns status '10' and the run ends normally\nAnd If a read returns any status other than '00' or '10' (for example '23' or '9x'), the program shows the file status and abends with code 999", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CBACT01C.cbl:147-198", "plain": "The batch reads every account in key order and writes all four outputs for each; it stops normally at end of file and terminates abnormally on any other read error.", "defect": "OUT-FILE, ARRY-FILE and VBRC-FILE are opened (lines 143-145) but never CLOSEd; the program relies on runtime cleanup at GOBACK."}, {"key": "claude/RULE-143", "function": "claude/batch/03", "id": "RULE-143", "name": "Account cycle close-out: post total interest and reset cycle totals", "text": "Given Account 00000000001 with current balance $1,000.00, cycle credit $200.00, cycle debit $350.00 and two category balances generating interest of $19.27 and $5.10, followed by category balances for account 00000000002\nWhen The batch reads the first record of account 00000000002\nThen Account 00000000001 is rewritten with current balance $1,024.37, cycle credit $0.00, cycle debit $0.00; total interest is reset to 0 and account 00000000002 plus its card cross-reference are loaded", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CBACT04C.cbl:188-222", "plain": "Category balances are processed in account order; when the account number changes, the previous account's current balance is increased by its total cycle interest and its current-cycle credit and debit totals are reset to zero, then the account is saved.", "defect": "The final account in the file is never updated: when the read hits end-of-file inside the loop, END-OF-FILE becomes 'Y' and the PERFORM UNTIL exits before the ELSE branch (lines 219-220) that calls 1050-UPDATE-ACCOUNT can run. The last account's interest is written as transactions but never added to its balance, and its cycle totals are not reset."}, {"key": "claude/RULE-144", "function": "claude/account/02", "id": "RULE-144", "name": "Account update screen lifecycle (fetch, edit, validate, confirm, save)", "text": "Given A user on the Account Update screen (CAUP). The stage is ACUP-CHANGE-ACTION: blank = details not fetched, S = details shown, E = changes have errors, N = changes OK but not confirmed, C = saved, L = lock error, F = save failed\nWhen The user presses Enter, F5 or F12\nThen Not fetched with a valid account ID: read the account and go to S. S with no errors and some change: go to N and prompt 'Changes validated.Press F5 to save'. E: stay and show the error. N with F5: try the save. Success goes to C, an account lock failure goes to L, a rewrite failure goes to F, and a concurrent change goes back to S. N without F5: stay. Any other combination ends the program with abend code 0001", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-040", "REQ-F-041", "REQ-F-042", "REQ-F-043", "REQ-F-046", "REQ-F-049", "REQ-F-051", "REQ-F-053", "REQ-F-054", "REQ-F-055", "REQ-F-058", "REQ-F-059"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COACTUPC.cbl:2562-2642", "plain": "An account update goes through fixed stages: enter an account number, see the current details, edit them, have the edits checked, then confirm with F5 before anything is saved.", "defect": ""}, {"key": "claude/RULE-145", "function": "claude/account/02", "id": "RULE-145", "name": "Save outcome and rollback handling", "text": "Given Changes validated (stage N) and the user presses F5\nWhen The account lock fails\nThen The stage becomes L and the message is 'Could not lock account record for update'. If a rewrite fails, the stage becomes F ('Update of record failed'). On full success the stage becomes C ('Changes committed to database')", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-052", "REQ-F-053", "REQ-F-054", "REQ-N-001", "REQ-F-055"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:3888-4104", "plain": "The save locks the account, then the customer, then rewrites the account, then the customer. If the customer rewrite fails, the account change is rolled back.", "defect": "When the customer lock fails (COULD-NOT-LOCK-CUST-FOR-UPDATE), 2000-DECIDE-ACTION has no branch for it, so WHEN OTHER marks the update as done (C) and shows 'Changes committed to database' although nothing was written. The same false success happens for any failure when an earlier error message is already set, because the failure flag is only set if WS-RETURN-MSG is empty."}, {"key": "claude/RULE-146", "function": "claude/transactions/01", "id": "RULE-146", "name": "Payment posting is not atomic: balance is reduced even if the transaction write fails", "text": "Given A confirmed payment on an account with balance $500.00, where the TRANSACT write returns DUPREC (or the XREF lookup returns NOTFND)\nWhen The confirmed payment is processed\nThen The error message is set ('Tran ID already exist...' or 'Account ID NOT found...'), but the code still computes balance = $500.00 - $500.00 and rewrites the account to $0.00, so the balance is reduced without a recorded payment transaction (or with a blank card number)", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-N-002"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COBIL00C.cbl:208-244", "plain": "Confirmed payment posting looks up the card cross-reference, generates a transaction ID, writes the payment transaction, then subtracts the amount from the account and rewrites it; none of those steps checks whether the earlier step failed before continuing.", "defect": "No ERR-FLG check between XREF read, transaction write and account rewrite; a failed transaction write or XREF lookup still reduces the account balance. Screen may also be sent twice in one task."}, {"key": "claude/RULE-147", "function": "claude/card/03", "id": "RULE-147", "name": "Card update workflow state machine", "text": "Given Change-action states: blank=details not fetched, S=show details, E=changes not OK, N=validated awaiting confirmation, C=saved, L=lock error, F=write failed\nWhen The operator presses Enter/PF5/PF12 in each state\nThen Not fetched + valid keys -> read card -> S. S + valid changes -> N ('Changes validated.Press F5 to save'). Any field error -> E. N + PF5 -> write: success -> C ('Changes committed to database'); lock failure -> L; rewrite failure -> F ('Changes unsuccessful. Please try again'); concurrent change -> back to S with fresh data. N without PF5 -> stays N. C -> S and clears context keys if not entered from another transaction. Any other combination -> abend code 0001 'UNEXPECTED DATA SCENARIO'.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-022", "REQ-F-024", "REQ-F-025", "REQ-F-026", "REQ-F-027", "REQ-F-029", "REQ-F-030", "REQ-F-031", "REQ-F-034"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COCRDUPC.cbl:948-1027", "plain": "A card update progresses through fetch, edit, validate, confirm (PF5) and save, with explicit failure states for lock errors, write failures and concurrent changes.", "defect": ""}, {"key": "claude/RULE-148", "function": "claude/transactions/04", "id": "RULE-148", "name": "Transaction report batch job submission", "text": "Given Monthly report confirmed for 2024-02-01 to 2024-02-29\nWhen Submission runs\nThen JCL lines for job TRNRPT00 (PROC TRANREPT) with PARM-START-DATE 2024-02-01 and PARM-END-DATE 2024-02-29 are written one 80-byte record at a time to TD queue 'JOBS' until the '/*EOF' or a blank line; the batch selects TRAN-PROC-DT >= start AND <= end (app/proc/TRANREPT.prc:45-46); on success screen shows 'Monthly report submitted for printing ...' in green and fields are reset", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-016"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CORPT00C.cbl:81-127", "plain": "A confirmed report request submits the TRANREPT batch job via the JOBS internal-reader queue, filtering transactions whose processing date falls between the start and end dates inclusive.", "defect": "A mid-stream TDQ write failure leaves a partially written job in the JOBS queue with no compensation."}, {"key": "claude/RULE-149", "function": "claude/useradmin/04", "id": "RULE-149", "name": "Deleting a user is a two-step look-up-then-confirm action (PF5)", "text": "Given User 'USER0001' (Jane Doe, type U) exists in USRSEC\nWhen The administrator enters 'USER0001' and presses Enter, then presses PF5\nThen After Enter, the screen shows first name, last name and type with 'Press PF5 key to delete this user ...'. After PF5, the record is read again for update and deleted, the screen is cleared, and the green message 'User USER0001 has been deleted ...' is shown", "program": "COUSR03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COUSR03C.cbl:142-192", "plain": "To delete a user, the administrator first looks up the User ID (Enter), checks the displayed name and type, and then presses PF5 to permanently remove the record from the user security file.", "defect": "In DELETE-USER-INFO (lines 188-191) the DELETE runs right after the READ, without checking the read's error flag. If the READ fails (for example, user not found), the program still tries the delete. That causes a second error response and sends the screen twice."}, {"key": "claude/RULE-150", "function": "claude/pendauth/04", "id": "RULE-150", "name": "Purge expired authorization details", "text": "Given Account summary 00000012345 with three details aged 7, 6 and 2 days and expiry period 5\nWhen the nightly purge batch walks the account's details\nThen the 7- and 6-day details are deleted (details-deleted counter +2) and the 2-day detail remains", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-007", "REQ-F-008", "REQ-N-002"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167", "plain": "For every account summary in the pending authorization database, each child authorization detail that has expired is physically deleted; non-expired details are left in place.", "defect": ""}, {"key": "claude/RULE-151", "function": "claude/pendauth/04", "id": "RULE-151", "name": "Delete account summary when no pending authorizations remain", "text": "Given Account summary whose approved count falls to 0 after purge while declined count is still 2 (two declined details not yet expired)\nWhen the purge finishes the account's details\nThen the summary root is deleted (summaries-deleted counter +1), which in IMS also removes the remaining child details", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:156-158", "plain": "After purging an account's expired details, the account's pending-authorization summary is deleted when its pending authorization count has dropped to zero or below.", "defect": "Condition reads 'PA-APPROVED-AUTH-CNT <= 0 AND PA-APPROVED-AUTH-CNT <= 0' - the approved count is tested twice and the declined count never; the intent was almost certainly approved AND declined both <= 0. As written, accounts with live declined authorizations lose the summary and (by IMS cascade) their unexpired declined details."}, {"key": "claude/RULE-152", "function": "claude/pendauth/01", "id": "RULE-152", "name": "Authorization detail record creation and match status", "text": "Given An approved $75.00 request for a known card\nWhen The authorization is written to the database\nThen A detail record (PAUTDTL1) is inserted under summary ACCNTID = account ID with response '00', approved amount $75.00, match status 'P' and blank fraud flag and fraud report date.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-028", "REQ-F-029", "REQ-F-033"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:854-919", "plain": "Each authorization for a known card is stored as a detail record under the account's summary, copying the request fields and decision. Its match status starts as Pending ('P') if approved or Declined ('D') if declined, and the fraud flag starts blank.", "defect": ""}, {"key": "claude/RULE-153", "function": "claude/pendauth/02", "id": "RULE-153", "name": "Page backward (PF7) guard and repositioning", "text": "Given The user is on page 2 of the authorization list\nWhen The user presses PF7\nThen The page number drops to 1. The saved start key for page 1 is used to re-read the summary and reposition to that detail record, and 5 rows are listed from there. On page 1, PF7 instead shows 'You are already at the top of the page...'.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-020", "REQ-F-021", "REQ-N-002"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:362-385", "plain": "PF7 goes back one page only when the current page number is above 1. Otherwise the user is told they are already at the top.", "defect": "After repositioning, PROCESS-PAGE-FORWARD adds 1 to the page number again when it reaches row 2 (lines 436-441), and overwrites PREV-PG(page) with the reloaded start key. So after PF7 the page counter reads one higher than the page shown. Example: after two PF8s (page 3), a PF7 shows page 2 but the counter says 3 and PREV-PG(3) is now page 2's key. A second PF7 shows page 2 again, so the user can never get back to page 1 or see the 'top of page' message by paging back."}, {"key": "claude/RULE-154", "function": "claude/pendauth/02", "id": "RULE-154", "name": "Page forward (PF8) guard", "text": "Given The current page showed 5 rows, the next-page flag is 'Y', and the last key shown is K5\nWhen The user presses PF8\nThen The summary is re-read, the list is repositioned at K5, and the next 5 records after K5 are listed. If the next-page flag is 'N', the message 'You are already at the bottom of the page...' is shown and the list is unchanged.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-N-002"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:388-412", "plain": "PF8 moves to the next 5 authorizations only when the previous display found more records. Otherwise the user is told they are already at the bottom.", "defect": ""}, {"key": "claude/RULE-155", "function": "claude/pendauth/02", "id": "RULE-155", "name": "Authorization list paging: 5 per page with next-page look-ahead", "text": "Given An account with 7 pending authorization detail records under its summary segment\nWhen The account is first displayed (Enter)\nThen Rows 1-5 are shown and the page number becomes 1. The first key on the page is saved as page 1's start key, and the 5th key is saved as the last key. A sixth record is read ahead and found, so the next-page flag is set to 'Y'. The user then presses PF8: rows 6-7 are shown, the page number becomes 2, end-of-data is reached and the next-page flag is not set to 'Y'.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:415-454", "plain": "Pending authorizations for the account are listed 5 at a time in database order. The system remembers the first key of each page and the last key shown, and reads one record ahead to decide whether a next page exists.", "defect": ""}, {"key": "claude/RULE-156", "function": "claude/txntype/01", "id": "RULE-156", "name": "Add a new transaction type", "text": "Given An input record 'A','07','Adjustment' and no existing TRANSACTION_TYPE row with TR_TYPE '07'\nWhen The record is processed\nThen A row (TR_TYPE='07', TR_DESCRIPTION='Adjustment') is inserted and 'RECORD INSERTED SUCCESSFULLY' is displayed. If code '07' already exists, or any other negative SQLCODE occurs, the message 'Error accessing: TRANSACTION_TYPE table. SQLCODE:<code>' is displayed and the return code is set to 4", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:132-164", "plain": "An 'A' record creates a new row in the transaction type reference table, made up of the 2-character code and the 50-character description; any database error, such as a duplicate code, is reported as an error.", "defect": ""}, {"key": "claude/RULE-157", "function": "claude/txntype/01", "id": "RULE-157", "name": "Update the description of an existing transaction type", "text": "Given An existing TRANSACTION_TYPE row TR_TYPE='01' and an input record 'U','01','Purchase - Retail'\nWhen The record is processed\nThen TR_DESCRIPTION for '01' becomes 'Purchase - Retail' and 'RECORD UPDATED SUCCESSFULLY' is displayed. If no row has code '01' (SQLCODE +100), 'No records found.' is displayed and the return code is set to 4. On a negative SQLCODE the 'Error accessing...' message is displayed and the return code is set to 4", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195", "plain": "A 'U' record replaces the description of the transaction type with the matching code; only the description can change, and an unknown code is reported as an error.", "defect": ""}, {"key": "claude/RULE-158", "function": "claude/txntype/01", "id": "RULE-158", "name": "Delete a transaction type", "text": "Given An existing TRANSACTION_TYPE row TR_TYPE='07' and an input record 'D','07',<any description>\nWhen The record is processed\nThen The row is deleted and 'RECORD DELETED SUCCESSFULLY' is displayed. If no row exists (SQLCODE +100), 'No records found.' is displayed and RC=4. On a negative SQLCODE (for example an RI violation if other tables reference the type) the 'Error accessing...' message is displayed and RC=4", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226", "plain": "A 'D' record permanently removes the transaction type with the matching code; an unknown code is reported as an error.", "defect": ""}, {"key": "claude/RULE-159", "function": "claude/txntype/02", "id": "RULE-159", "name": "Changing a filter resets paging and selections", "text": "Given Previous screen used no filter and the user had typed 'D' on row 3\nWhen The user also enters type filter '05' and presses Enter\nThen Paging variables (first/last key, page number, next-page flag) are re-initialized, the row selection flags are cleared and the filtered list is shown from the start", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ- aptured", "reason": "", "requirements": ["REQ-F-030", "REQ-F-031", "REQ-F-032", "REQ-F-033"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:978-1010", "plain": "Pressing F12 throws away pending edits or a pending delete and shows the record again as it is in the database. From an initial display, a not-found result or a new-record entry, it returns to the search prompt.", "defect": ""}, {"key": "claude/RULE-162", "function": "claude/mqinquiry/01", "id": "RULE-162", "name": "Triggered message-processing lifecycle (drain queue with 5-second wait, commit per message)", "text": "Given A trigger message naming input queue Q1 and three requests waiting on Q1\nWhen The CICS transaction is started by the trigger monitor\nThen States run Starting -> Queues open -> Processing (GET under syncpoint, reply, SYNCPOINT, repeat) -> after 5 s with no message (MQRC-NO-MSG-AVAILABLE) -> Terminating (close input, reply and error queues that were opened) -> CICS RETURN", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-001", "REQ-F-002", "REQ-N-001", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-007", "REQ-F-008", "REQ-F-013"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:178-218", "plain": "The program is started by an MQ trigger, opens the error, input and reply queues, then repeatedly takes one request at a time, replies to it, commits, and stops once no message arrives within 5 seconds, closing all opened queues on exit.", "defect": "Opening the input queue sets the REPLY-QUEUE-OPEN flag (line 245), which termination uses to close the input queue; it works but the naming is misleading. Close-failure paths call 8000-TERMINATION again (lines 572, 594, 618), which can re-enter the close logic in a loop. Line 202 moves RESP2 onto itself so the displayed RESP2 is always zero."}, {"key": "claude/RULE-163", "function": "claude/mqinquiry/03", "id": "RULE-163", "name": "Unexpected account file error stops the server", "text": "Given ACCTDAT is disabled or returns an I/O error\nWhen An 'INQA' request with a positive account id is processed\nThen An error record (paragraph, message 'ERROR WHILE READING ACCTFILE', response code, reason code, input queue name) is put to CARD.DEMO.ERROR, open queues are closed and the CICS task returns; the requester gets no reply", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:437-445", "plain": "Any account file read outcome other than found or not-found is logged to the error queue as 'ERROR WHILE READING ACCTFILE' and the program terminates without replying to the requester.", "defect": "No rollback before EXEC CICS RETURN; the consumed request and any prior work in the unit of work are committed while the requester receives nothing."}, {"key": "claude/RULE-164", "function": "claude/mqinquiry/03", "id": "RULE-164", "name": "Message processing loop and unit-of-work commit", "text": "Given The service was triggered by CARD.DEMO input queue trigger data and three messages are queued\nWhen The loop runs\nThen Each message is read (GET under syncpoint, wait 5000 ms, convert), answered, and committed by CICS SYNCPOINT (lines 274-280). After the third, a 5-second wait with no message (MQRC-NO-MSG-AVAILABLE) ends the loop and the service closes the queues and returns", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-N-001", "REQ-F-003", "REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:283-337", "plain": "Once triggered, the service keeps reading requests under syncpoint, waits up to 5 seconds for each one, commits each request and its reply together, and ends when no message arrives within the wait.", "defect": ""}, {"key": "claude/RULE-165", "function": "claude/provisioning/04", "id": "RULE-165", "name": "File status outcome classification and abend policy", "text": "Given A listing job processing its indexed master file\nWhen An open, read or close returns a file status\nThen '00' continues processing (result 0); '10' on read sets end-of-file and the job closes the file and ends normally (result 16); any other status (e.g., '23', '35', '9x') prints an error message and file status as 4 digits, then abends with code 999 (immediate, timing 0); an open failure abends before any records are printed", "program": "CBACT02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-011"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBACT02C.cbl:92-158", "plain": "For each file operation, status '00' means success, status '10' on a read means normal end of file and ends the run cleanly, and any other status stops the job right away with user abend code 999.", "defect": ""}, {"key": "claude/RULE-166", "function": "claude/provisioning/01", "id": "RULE-166", "name": "Fixed export order and record type codes", "text": "Given Customer, account, cross-reference, transaction and card master files that can all be opened\nWhen the CBEXPORT batch runs\nThen the export file holds all 'C' (customer) records first, then 'A' (account), 'X' (cross-reference), 'T' (transaction) and 'D' (card) records. Within each type, records come out in that input file's primary-key order (CUST-ID, ACCT-ID, XREF-CARD-NUM, TRAN-ID, CARD-NUM).", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:149-158", "plain": "A migration export run copies the whole CardDemo book in a fixed order, customers then accounts then card-to-account cross-references then transactions then cards, and tags each output record with a one-letter type code.", "defect": ""}, {"key": "claude/RULE-167", "function": "claude/provisioning/02", "id": "RULE-167", "name": "Account and card status carried over unchanged from the source branch", "text": "Given An account export record with ACTIVE-STATUS 'N' and expiration date 2020-01-31, and a card export record with ACTIVE-STATUS 'Y' and expiration date 2019-06-30\nWhen The import runs on 2026-11-23\nThen The account is written with status 'N' and expiration 2020-01-31. The card is written with status 'Y' even though it has expired. No status change or expiry check happens", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBIMPORT.cbl:325-334", "plain": "Migrated accounts and cards keep the active/inactive status, open date, expiration date and reissue date they had at the source branch. The import does not reset, derive or check any lifecycle state.", "defect": ""}, {"key": "claude/RULE-168", "function": "claude/batch/04", "id": "RULE-168", "name": "Statement run processing sequence", "text": "Given WS-FL-DD starts as 'TRNXFILE'\nWhen The program starts\nThen Phases run TRNXFILE (open + priming read) -> READTRNX (load all transactions) -> XREFFILE (open) -> CUSTFILE (open) -> ACCTFILE (open) -> MAINLINE (statements) -> close TRNX, XREF, CUST, ACCT, statement files", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-013"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBSTM03A.CBL:296-314", "plain": "The run moves through fixed phases: open and fully load transactions, then open xref, customer and account files, then produce statements, then close all files; the phase is tracked in WS-FL-DD and dispatched via ALTER/GO TO.", "defect": ""}, {"key": "claude/RULE-169", "function": "claude/batch/04", "id": "RULE-169", "name": "File status returned to caller as outcome code", "text": "Given The transaction file has been opened and all its records have been read\nWhen The caller asks for another sequential read\nThen The return code is '10' (end of file). A successful open, read or close returns '00'. A keyed read for a missing customer or account returns '23'.", "program": "CBSTM03B", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CBSTM03B.CBL:151-226", "plain": "After every open, read or close on a recognised file, the 2-character file status is passed back to the calling statement program. The caller uses it to detect success, end of file or record not found.", "defect": ""}, {"key": "claude/RULE-170", "function": "claude/batch/01", "id": "RULE-170", "name": "Process daily transactions sequentially until end of file", "text": "Given A daily transaction file with 3 records\nWhen The batch run reads them one by one (1000-DALYTRAN-GET-NEXT, lines 202-225)\nThen Status '00' marks a normal record, status '10' sets the end-of-file flag to 'Y' and ends the loop, and any other status abends the run", "program": "CBTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBTRN01C.cbl:164-186", "plain": "The batch reads every record in the daily transaction file in order and stops when the file reports end-of-file (status '10').", "defect": "The cross-reference lookup and account read (lines 170-184) sit outside the 'IF END-OF-DAILY-TRANS-FILE = N' guard at line 167. After the EOF read, the last record (or an empty record) is verified a second time, so its log messages appear twice."}, {"key": "claude/RULE-171", "function": "claude/batch/02", "id": "RULE-171", "name": "Route each daily transaction to posting or to the rejects file", "text": "Given A daily file of 100 transactions, 3 of which fail validation\nWhen The nightly posting batch runs to the end of the file\nThen 97 are posted. 3 reject records are written, each holding the original 350-byte transaction plus an 80-byte trailer (4-digit reason code and 76-character description). The run reports 100 processed and 3 rejected, and the job ends with return code 4", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBTRN02C.cbl:202-231", "plain": "Each daily transaction is counted and validated. If it passes every check it is posted; otherwise it goes to the rejects file with its reason code and description. If any transaction was rejected, the job ends with return code 4.", "defect": ""}, {"key": "claude/RULE-172", "function": "claude/batch/02", "id": "RULE-172", "name": "Create the posted transaction record with a processing timestamp", "text": "Given A valid daily transaction with ID 0000000000001234 and origination timestamp 2025-04-28-14.02.11.000000\nWhen It is posted on 2025-04-29 at 01:30:05.12\nThen A transaction record is written with the same ID, type, category, source, description, amount, merchant details, card number and origination timestamp, and processing timestamp 2025-04-29-01.30.05.120000", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-021", "REQ-F-022", "REQ-F-023"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CBTRN02C.cbl:424-444", "plain": "A validated daily transaction becomes a posted transaction. It keeps all of its original fields and origination timestamp, and gets a processing timestamp set to the batch run time.", "defect": ""}, {"key": "claude/RULE-173", "function": "claude/account/01", "id": "RULE-173", "name": "Pseudo-conversational screen state: first entry vs re-entry", "text": "Given User arrives from COMEN01C without the re-enter flag\nWhen The transaction starts\nThen The shared commarea is reset (account/customer/card ids cleared), the empty screen is sent, the state is set to re-enter, and control returns with TRANSID CAVW. On the next Enter, inputs are edited: if there is an error the screen is redisplayed with the message, otherwise the account is read and the screen is redisplayed with the data", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COACTVWC.cbl:282-406", "plain": "The screen has two states. On first entry (no commarea, or arriving fresh from the main menu) the context is reset and an empty search screen is shown. Each later Enter is a re-entry: the input is validated and, if valid, the account is looked up and displayed. Either way the program returns under transaction CAVW to wait for the next key.", "defect": ""}, {"key": "claude/RULE-174", "function": "claude/account/01", "id": "RULE-174", "name": "Account View navigation: PF3 returns to caller or main menu; any other key acts as Enter", "text": "Given User on Account View came from program COMEN01C / transaction CM00 (or no caller recorded)\nWhen The user presses PF3 (or PF15, which is mapped to PF3)\nThen Control transfers to CDEMO-FROM-PROGRAM/TRANID, or to COMEN01C/CM00 if those are blank or low-values. FROM is set to COACTVWC/CAVW, user type is set to 'User', program context is set to first-entry, and last map is set to COACTVW/CACTVWA", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022", "REQ-F-023", "REQ-F-024", "REQ-F-025"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COACTVWC.cbl:306-352", "plain": "Only Enter and PF3 are valid on this screen, and any other key is treated as Enter. PF3 returns to the program that called this screen, or to the main menu if no caller is recorded, and marks this program as the sender.", "defect": "On exit, line 344 always sets CDEMO-USRTYP-USER, which may demote an admin user's session type when returning to the caller."}, {"key": "claude/RULE-175", "function": "claude/signon/03", "id": "RULE-175", "name": "Admin Menu dispatch and not-installed handling", "text": "Given A valid admin option number\nWhen Enter is processed\nThen If the target program name does not start with 'DUMMY', the from-transaction is set to CA00, the from-program to COADM01C, the context is reset to 0 (ENTER), and the session is transferred to the target. If the name starts with 'DUMMY', or the target program does not exist (the CICS PGMIDERR handler, COADM01C.cbl:270-283), the menu is shown again with the green message 'This option is not installed ...'.", "program": "COADM01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COADM01C.cbl:140-158", "plain": "After a valid admin choice the session is handed to the chosen admin program with a fresh context; placeholder or missing programs show 'This option is not installed ...'.", "defect": ""}, {"key": "claude/RULE-176", "function": "claude/transactions/01", "id": "RULE-176", "name": "Two-step confirmation workflow for bill payment", "text": "Given Account 00000000001 with balance $300.00 entered on the bill pay screen\nWhen The user presses Enter with Confirm = blank, then again with Confirm = 'Y'\nThen First Enter: balance $300.00 displayed with 'Confirm to make a bill payment...' and cursor on Confirm (236-240); second Enter: payment posted", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-  and exit lifecycle", "text": "Given A user reaches the Main Menu (transaction CM00) or Admin Menu (transaction CA00)\nWhen The program is invoked\nThen If no session data is passed (communication area length 0) the user is transferred to the sign-on program COSGN00C. If session data is present and the program context is 'enter' (0), the context is set to 're-enter' (1) and a blank menu is shown. If context is already 're-enter', Enter processes the selected option, PF3 transfers to COSGN00C, and any other key re-shows the menu with the standard invalid-key message. The program then returns control to CICS with its own transaction id and the session data, so the next key press comes back to the same menu.", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-016", "REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:82-110", "plain": "A menu can only be used inside a signed-on session: with no session it sends the user to sign-on, on first arrival it shows the menu, on later turns it acts on Enter, sends PF3 to sign-on, and rejects any other key.", "defect": ""}, {"key": "claude/RULE-183", "function": "claude/signon/01", "id": "RULE-183", "name": "Session context established on successful sign-on", "text": "Given User ADMIN001 of type 'A' authenticates\nWhen The password matches\nThen Session commarea is set: from-transaction 'CC00', from-program 'COSGN00C', user ID 'ADMIN001', user type 'A', program context 0 (CDEMO-PGM-ENTER = first entry) before transfer", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:224-228", "plain": "A successful sign-on creates the shared session record carrying the signed-on user ID, the user's role, the originating transaction/program, and a 'first entry' context flag for the next program.", "defect": ""}, {"key": "claude/RULE-184", "function": "claude/signon/01", "id": "RULE-184", "name": "Sign-on screen interaction lifecycle (first display, Enter, PF3 exit, invalid key)", "text": "Given A terminal user at transaction CC00\nWhen Started with no commarea / presses Enter / presses PF3 / presses any other key\nThen Blank screen with cursor on User ID / authentication flow runs / plain-text thank-you message sent and the conversation ends without re-arming CC00 / screen redisplayed with CCDA-MSG-INVALID-KEY and error flag set", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-016"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:80-102", "plain": "On first entry (no session data) a blank sign-on screen is shown; Enter attempts sign-on, PF3 ends the session with a thank-you message, and any other key redisplays the screen with an invalid-key error; the screen re-arms transaction CC00 for the next interaction.", "defect": ""}, {"key": "claude/RULE-185", "function": "claude/transactions/02", "id": "RULE-185", "name": "Transaction list screen entry and key routing", "text": "Given A user reaches transaction CT00\nWhen There is no session context (EIBCALEN = 0), or the program is entered for the first time, or the user presses a key\nThen No context: the user is sent to sign-on (COSGN00C). First entry: the program marks the session as re-entered and shows the first page from the start of the TRANSACT file. Enter: filter or selection is processed. PF3: control passes to the main menu (COMEN01C). PF7: previous page. PF8: next page. Any other key: error flag set and CCDA-MSG-INVALID-KEY shown.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-021", "REQ-F-022", "REQ-F-023", "REQ-F-026", "REQ-F-027"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:107-136", "plain": "The transaction list can only be used inside a signed-on session. On first entry it shows page 1. After that, Enter applies the filter or selection, PF3 goes back to the main menu, PF7 and PF8 page up and down, and any other key gives an invalid-key error.", "defect": ""}, {"key": "claude/RULE-186", "function": "claude/transactions/02", "id": "RULE-186", "name": "View Transaction screen navigation and session flow", "text": "Given A user session arriving at program COTRN01C (transaction CT01)\nWhen The program is invoked or a key is pressed on its screen\nThen No session data (commarea length 0) -> transfer to sign-on COSGN00C; first entry with a selected transaction ID passed from the list (CDEMO-CT01-TRN-SELECTED not blank) -> that ID is pre-filled and looked up automatically; Enter -> look up the entered ID; PF3 -> return to the calling program, or main menu COMEN01C if caller unknown; PF4 -> clear all fields and message; PF5 -> transfer to transaction list COTRN00C; any other key -> error message 'invalid key' (CCDA-MSG-INVALID-KEY) and screen redisplayed\nAnd On every transfer the target defaults to sign-on COSGN00C if blank, and the session records CT01/COTRN01C as the origin and resets the program context to zero (lines 197-208)", "program": "COTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-021", "REQ-F-024", "REQ-F-025", "REQ-F-026", "REQ-F-027"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COTRN01C.cbl:94-134", "plain": "The View Transaction screen requires an active session, auto-displays a transaction pre-selected from the transaction list, and routes the user by function key: Enter looks up, PF3 goes back, PF4 clears, PF5 goes to the transaction list, anything else is rejected.", "defect": ""}, {"key": "claude/RULE-187", "function": "claude/transactions/03", "id": "RULE-187", "name": "Explicit Y/N confirmation required before adding a transaction", "text": "Given All fields valid and Confirm left blank\nWhen Enter is pressed\nThen 'Confirm to add this transaction...' is shown and nothing is written; on re-submission with Confirm 'Y' the transaction is added", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:164-188", "plain": "After all inputs validate, the transaction is only written if the operator has entered 'Y' (or 'y') in the Confirm field.", "defect": ""}, {"key": "claude/RULE-188", "function": "claude/transactions/03", "id": "RULE-188", "name": "Transaction record composition on add", "text": "Given Validated input with card 4111111111111111 and dates 2024-05-01 / 2024-05-02\nWhen The transaction is confirmed with 'Y'\nThen A TRANSACT record is created with TRAN-CARD-NUM 4111111111111111, TRAN-ORIG-TS '2024-05-01' and TRAN-PROC-TS '2024-05-02' (remainder of the 26-char timestamp blank); on success the screen is cleared and 'Transaction added successfully.  Your Tran ID is <id>.' is shown in green", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020", "REQ-F-021", "REQ-F-022"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:450-466", "plain": "A confirmed transaction is written to the transaction file with the generated ID, the entered type, category, source, description, amount, merchant details, the resolved card number, and the entered dates as origination/processing timestamps.", "defect": ""}, {"key": "claude/RULE-189", "function": "claude/useradmin/01", "id": "RULE-189", "name": "Function-key navigation on the user list", "text": "Given The user list screen is displayed and the user presses a key\nWhen The key is Enter, PF3, PF7, PF8 or another key\nThen Enter runs selection/search; PF3 transfers to COADM01C; PF7 shows the previous page; PF8 shows the next page; any other key sets the error flag, shows the shared invalid-key message and puts the cursor on the User ID filter", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-025", "REQ-F-026", "REQ-F-027", "REQ-F-028"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COUSR00C.cbl:120-137", "plain": "On the user list, Enter applies the selection or filter, PF3 goes back to the admin menu, PF7 pages back, PF8 pages forward, and any other key gives an invalid-key error.", "defect": ""}, {"key": "claude/RULE-190", "function": "claude/useradmin/03", "id": "RULE-190", "name": "Update is only written when at least one field actually changed", "text": "Given Stored user 'JDOE0001' with first name 'John', last name 'Doe', password on file, type 'U'\nWhen The administrator changes User Type to 'A' and presses PF5\nThen Only the changed fields are copied into the record, the record is rewritten to USRSEC, and 'User JDOE0001 has been updated ...' is shown in green; if nothing had changed the message 'Please modify to update ...' is shown in red and no write occurs", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COUSR02C.cbl:215-245", "plain": "After locking and re-reading the stored user, the system compares each editable field (first name, last name, password, user type) with what is on file and rewrites the record only if at least one differs; otherwise it tells the user to modify something.", "defect": "Lines 217-237 do not check ERR-FLG after READ-USER-SEC-FILE; on a failed read the program still compares and may issue a REWRITE, producing a second (overwriting) error message. Also on a successful read the 'Press PF5 key to save' screen is sent before the update result screen (double send)."}, {"key": "claude/RULE-191", "function": "claude/useradmin/03", "id": "RULE-191", "name": "Outcome of saving the user security record", "text": "Given A changed user record for 'JDOE0001' is rewritten to USRSEC\nWhen The file update returns NORMAL\nThen Message 'User JDOE0001 has been updated ...' is displayed in green", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COUSR02C.cbl:358-390", "plain": "After the rewrite of the user record, success shows a green confirmation naming the user, a missing record shows 'User ID NOT found...', and any other failure shows 'Unable to Update User...'.", "defect": ""}, {"key": "claude/RULE-192", "function": "claude/pendauth/02", "id": "RULE-192", "name": "Screen key navigation and exit routing", "text": "Given The user is on the pending authorization summary screen\nWhen The user presses PF3, then on a later visit presses PF5\nThen PF3 transfers to COMEN01C with from-program COPAUS0C, from-tranid CPVS and context 0. PF5 sets the error flag and shows the standard invalid-key message (CCDA-MSG-INVALID-KEY).", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-029", "REQ-F-030", "REQ-F-031", "REQ-F-032", "REQ-F-033", "REQ-F-034"], "priority": "P2", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:224-250", "plain": "On the summary screen, Enter runs the inquiry or selection, PF3 returns to the main menu, PF7 and PF8 page through the list, and any other key is rejected as invalid.", "defect": ""}, {"key": "claude/RULE-193", "function": "claude/pendauth/02", "id": "RULE-193", "name": "Move to the next authorization for the account", "text": "Given An account with authorizations K1, K2, K3 and K2 currently selected\nWhen The user presses PF8\nThen K3 becomes the selected authorization and its details are displayed", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-042", "REQ-F-043", "REQ-F-044", "REQ-F-045"], "priority": "P2", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289", "plain": "PF8 moves to the next pending authorization under the same account, in IMS key order. At the last one, the user sees 'Already at the last Authorization...' and the current screen stays.", "defect": ""}, {"key": "claude/RULE-194", "function": "claude/txntype/02", "id": "RULE-194", "name": "Navigation exits (PF3 back, PF2 add)", "text": "Given The list was reached from the admin menu\nWhen The user presses PF3\nThen A SYNCPOINT is taken and control transfers to COADM01C (tran CA00)", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-037", "REQ-F-038", "REQ-F-039"], "priority": "P2", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:591-652", "plain": "PF3 returns to the calling program (or the admin menu COADM01C if called directly) after a commit; PF2 transfers to the add-transaction-type screen COTRTUPC.", "defect": "PF2 sets CDEMO-USRTYP-USER (line 634) before transferring to the add screen, downgrading the user type from admin, while every other path sets admin."}, {"key": "claude/RULE-195", "function": "claude/mqinquiry/03", "id": "RULE-195", "name": "Queue shutdown on termination", "text": "Given The input, reply and error queues were all opened\nWhen Termination runs\nThen The input queue, reply queue and error queue are closed in that order, then CICS RETURN", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008"], "priority": "P2", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:442-523", "plain": "On termination the service closes only the queues
