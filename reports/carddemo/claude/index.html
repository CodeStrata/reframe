"F", "pattern": "Event-driven", "text": "When the user selects Yearly and confirms, the system shall set the start date to YYYY-01-01 and the end date to YYYY-12-31, where YYYY is the current system year.", "capability": "claude/report/01#2", "function": "claude/report/01", "rules": ["claude/RULE-027"], "sources": ["app/cbl/CORPT00C.cbl:239-255"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "State-driven", "text": "While Custom is selected, the system shall require a start date and an end date, each entered as month, day and year.", "capability": "claude/report/01#3", "function": "claude/report/01", "rules": ["claude/RULE-110"], "sources": ["app/cbl/CORPT00C.cbl:258-426"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall check the Custom date fields in the order start MM, DD, YYYY, then end MM, DD, YYYY, and report only the first error found without submitting the job.", "capability": "claude/report/01#3", "function": "claude/report/01", "rules": ["claude/RULE-110"], "sources": ["app/cbl/CORPT00C.cbl:258-426"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If a Custom date field is blank, then the system shall show '<Start/End> Date - <Month/Day/Year> can NOT be empty...' and not submit the job.", "capability": "claude/report/01#3", "function": "claude/report/01", "rules": ["claude/RULE-110"], "sources": ["app/cbl/CORPT00C.cbl:258-426"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If a Custom month is greater than '12' or a day is greater than '31', then the system shall report the error and not submit the job.", "capability": "claude/report/01#3", "function": "claude/report/01", "rules": ["claude/RULE-110"], "sources": ["app/cbl/CORPT00C.cbl:258-426"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the Custom start date in 'YYYY-MM-DD' format is not a valid calendar date, then the system shall show 'Start Date - Not a valid date...', put the cursor on the start month field and not submit the job.", "capability": "claude/report/01#3", "function": "claude/report/01", "rules": ["claude/RULE-110"], "sources": ["app/cbl/CORPT00C.cbl:258-426"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the date utility returns message number '2513' (unsupported range) for a Custom date, the system shall treat the date as valid.", "capability": "claude/report/01#3", "function": "claude/report/01", "rules": ["claude/RULE-110"], "sources": ["app/cbl/CORPT00C.cbl:258-426"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall submit a report job for any of the three report types only after the user enters 'Y' or 'y' in the Confirm field.", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-111"], "sources": ["app/cbl/CORPT00C.cbl:464-494"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the Confirm field is blank, then the system shall show 'Please confirm to print the <report type> report...', put the cursor on Confirm and submit nothing.", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-111"], "sources": ["app/cbl/CORPT00C.cbl:464-494"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the user enters 'N' or 'n' in the Confirm field, the system shall clear all fields and show the screen again with no message, without submitting the job.", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-111"], "sources": ["app/cbl/CORPT00C.cbl:464-494"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If the Confirm field holds a value other than Y, y, N or n, then the system shall show '\"<value>\" is not a valid value to confirm...'.", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-111"], "sources": ["app/cbl/CORPT00C.cbl:464-494"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When a report request is confirmed, the system shall build batch job TRNRPT00, running proc TRANREPT, that filters transactions by processing date between the start and end dates.", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-176"], "sources": ["app/cbl/CORPT00C.cbl:496-535"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall pass the start and end dates to the report job in SYMNAMES (PARM-START-DATE / PARM-END-DATE) and in DATEPARM (for example '2024-02-01 2024-02-29').", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-176"], "sources": ["app/cbl/CORPT00C.cbl:496-535"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Event-driven", "text": "When the report job is submitted, the system shall write each 80-byte job line to the transient data queue 'JOBS', up to and including '/*EOF' or the first blank line, with at most 1000 lines.", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-176"], "sources": ["app/cbl/CORPT00C.cbl:496-535"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When every job line has been written, the system shall clear the fields and show '<report type> report submitted for printing ...' in green.", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-176"], "sources": ["app/cbl/CORPT00C.cbl:496-535"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Unwanted", "text": "If a write to the JOBS queue fails, then the system shall stop writing and show 'Unable to Write TDQ (JOBS)...'.", "capability": "claude/report/01#4", "function": "claude/report/01", "rules": ["claude/RULE-176"], "sources": ["app/cbl/CORPT00C.cbl:496-535"], "programs": ["CORPT00C"]}, {"key": "claude/report/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the report start date (chars 1-10) and end date (chars 12-21) from the date-parameter file.", "capability": "claude/report/02#1", "function": "claude/report/02", "rules": ["claude/RULE-084"], "sources": ["app/cbl/CBTRN03C.cbl:122-125"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall include on the transaction detail report only transactions whose processing date (first 10 characters of the processing timestamp, YYYY-MM-DD) falls inclusively between the start and end dates.", "capability": "claude/report/02#1", "function": "claude/report/02", "rules": ["claude/RULE-084"], "sources": ["app/cbl/CBTRN03C.cbl:168-178"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall hold the report dates in ISO YYYY-MM-DD format, because the date range is compared as text.", "capability": "claude/report/02#1", "function": "claude/report/02", "rules": ["claude/RULE-084"], "sources": ["app/cbl/CBTRN03C.cbl:168-178"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the date-parameter file is empty, then the system shall process no transactions, giving an empty report with no headers or totals.", "capability": "claude/report/02#1", "function": "claude/report/02", "rules": ["claude/RULE-084"], "sources": ["app/cbl/CBTRN03C.cbl:235-236"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If any other date-parameter read error occurs, then the system shall abend the job with code 999.", "capability": "claude/report/02#1", "function": "claude/report/02", "rules": ["claude/RULE-084"], "sources": ["app/cbl/CBTRN03C.cbl:168-178"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the card number changes, the system shall look up the account ID in the card cross-reference by card number.", "capability": "claude/report/02#2", "function": "claude/report/02", "rules": ["claude/RULE-085", "claude/RULE-021"], "sources": ["app/cbl/CBTRN03C.cbl:484-512"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a transaction is reported, the system shall look up the transaction type by type code and the category by type code plus category code.", "capability": "claude/report/02#2", "function": "claude/report/02", "rules": ["claude/RULE-085"], "sources": ["app/cbl/CBTRN03C.cbl:484-512"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the card number is not in the card cross-reference file, then the system shall display 'INVALID CARD NUMBER' with status 23 and abend the report job with code 999.", "capability": "claude/report/02#2", "function": "claude/report/02", "rules": ["claude/RULE-085"], "sources": ["app/cbl/CBTRN03C.cbl:484-512", "app/cbl/CBTRN03C.cbl:626-630"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the transaction type or the type and category combination is not found, then the system shall abend the report job with code 999.", "capability": "claude/report/02#2", "function": "claude/report/02", "rules": ["claude/RULE-085"], "sources": ["app/cbl/CBTRN03C.cbl:484-512", "app/cbl/CBTRN03C.cbl:626-630"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When a transaction detail line is written, the system shall show the transaction ID, the account ID from the card cross-reference, the type code and description, the category code and description, the transaction source and the amount.", "capability": "claude/report/02#2", "function": "claude/report/02", "rules": ["claude/RULE-244", "claude/RULE-085"], "sources": ["app/cbl/CBTRN03C.cbl:361-374"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall write 133-character report records using layout TRANSACTION-DETAIL-REPORT.", "capability": "claude/report/02#2", "function": "claude/report/02", "rules": ["claude/RULE-244"], "sources": ["app/cbl/CBTRN03C.cbl:361-374"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the first detail line is about to be printed, the system shall print the headers with the start and end dates from the parameter file.", "capability": "claude/report/02#3", "function": "claude/report/02", "rules": ["claude/RULE-243"], "sources": ["app/cbl/CBTRN03C.cbl:274-290"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the next detail line is about to be printed and the line counter is an exact multiple of 20, the system shall write a page-total line and header separator, then the report name header, a blank line and two column headers.", "capability": "claude/report/02#3", "function": "claude/report/02", "rules": ["claude/RULE-243"], "sources": ["app/cbl/CBTRN03C.cbl:274-290"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall count headers as 4 lines, a detail as 1 line, a page total as 2 lines and an account total as 2 lines.", "capability": "claude/report/02#3", "function": "claude/report/02", "rules": ["claude/RULE-243"], "sources": ["app/cbl/CBTRN03C.cbl:131-132"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the page total even when the page's total is zero.", "capability": "claude/report/02#3", "function": "claude/report/02", "rules": ["claude/RULE-243"], "sources": ["app/cbl/CBTRN03C.cbl:274-290"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall subtotal transactions per card number (TRAN-CARD-NUM), with input sorted by card number.", "capability": "claude/report/02#4", "function": "claude/report/02", "rules": ["claude/RULE-021"], "sources": ["app/cbl/CBTRN03C.cbl:181-188"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the card number changes from the previous transaction, the system shall write an account-total line for the previous card and reset the account total to zero.", "capability": "claude/report/02#4", "function": "claude/report/02", "rules": ["claude/RULE-021"], "sources": ["app/cbl/CBTRN03C.cbl:181-188", "app/cbl/CBTRN03C.cbl:306-316"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the very first card is read, the system shall not write an account total.", "capability": "claude/report/02#4", "function": "claude/report/02", "rules": ["claude/RULE-021"], "sources": ["app/cbl/CBTRN03C.cbl:181-188"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When a transaction amount is printed, the system shall add it to the running page total and the account total.", "capability": "claude/report/02#4", "function": "claude/report/02", "rules": ["claude/RULE-022", "claude/RULE-021"], "sources": ["app/cbl/CBTRN03C.cbl:282-304"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When a page total is printed, the system shall add it to the grand total and reset the page total to zero.", "capability": "claude/report/02#4", "function": "claude/report/02", "rules": ["claude/RULE-022"], "sources": ["app/cbl/CBTRN03C.cbl:282-304"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the end of file is reached, the system shall write the last page total and then write the grand total line once.", "capability": "claude/report/02#4", "function": "claude/report/02", "rules": ["claude/RULE-022"], "sources": ["app/cbl/CBTRN03C.cbl:197-203", "app/cbl/CBTRN03C.cbl:318-322"], "programs": ["CBTRN03C"]}, {"key": "claude/report/02/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall hold the page, account and grand totals as signed amounts up to 999,999,999.99 and print them with the edit mask +ZZZ,ZZZ,ZZZ.ZZ.", "capability": "claude/report/02#4", "function": "claude/report/02", "rules": ["claude/RULE-022", "claude/RULE-021"], "sources": ["app/cbl/CBTRN03C.cbl:282-304"], "programs": ["CBTRN03C"]}, {"key": "claude/posting/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If a daily transaction's card number is not found in the card-to-account cross-reference, then the system shall reject the transaction with reason code 0100 'INVALID CARD NUMBER FOUND', skip the account lookup, and post nothing.", "capability": "claude/posting/01#1", "function": "claude/posting/01", "rules": ["claude/RULE-081"], "sources": ["app/cbl/CBTRN02C.cbl:370-392"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the account ID resolved from the card is not on the account master, then the system shall reject the transaction with reason code 0101 'ACCOUNT RECORD NOT FOUND' without evaluating the credit-limit and expiration checks.", "capability": "claude/posting/01#1", "function": "claude/posting/01", "rules": ["claude/RULE-082"], "sources": ["app/cbl/CBTRN02C.cbl:393-399"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the account's current-cycle credit minus current-cycle debit plus the transaction amount exceeds the account's credit limit, then the system shall reject the transaction with reason code 0102 'OVERLIMIT TRANSACTION', allowing a projection exactly equal to the limit to pass.", "capability": "claude/posting/01#1", "function": "claude/posting/01", "rules": ["claude/RULE-043"], "sources": ["app/cbl/CBTRN02C.cbl:403-413"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the first 10 characters of the transaction's origination timestamp are later than the account's expiration date (YYYY-MM-DD), then the system shall reject the transaction with reason code 0103 'TRANSACTION RECEIVED AFTER ACCT EXPIRATION', accepting a transaction originated on the expiration date itself.", "capability": "claude/posting/01#1", "function": "claude/posting/01", "rules": ["claude/RULE-083"], "sources": ["app/cbl/CBTRN02C.cbl:414-420"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a transaction fails both the over-limit and the expiration checks, the system shall record only reason code 103 for that reject, because the expiration check runs after the over-limit check and overwrites the reason.", "capability": "claude/posting/01#1", "function": "claude/posting/01", "rules": ["claude/RULE-043", "claude/RULE-083"], "sources": ["app/cbl/CBTRN02C.cbl:403-420"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a daily transaction fails validation, the system shall count it as a reject and write the unchanged 350-byte transaction record with an 80-byte trailer holding a 4-digit reason code and a 76-character description to the daily rejects file, and continue processing the remaining transactions.", "capability": "claude/posting/01#2", "function": "claude/posting/01", "rules": ["claude/RULE-218"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the posting batch completes, the system shall report the number of transactions processed (including rejected ones) and the number rejected, and set return code 4 if any transaction was rejected, otherwise 0.", "capability": "claude/posting/01#2", "function": "claude/posting/01", "rules": ["claude/RULE-218"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If any unexpected file status occurs on open, read, write or close during posting, then the system shall abend the whole run with user code 999 rather than rejecting the record.", "capability": "claude/posting/01#2", "function": "claude/posting/01", "rules": ["claude/RULE-218"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When a valid transaction posts, the system shall add its amount to the running balance keyed by account ID, transaction type code and category code, and if no such record exists (status 23) create it with the transaction amount as its opening balance.", "capability": "claude/posting/01#3", "function": "claude/posting/01", "rules": ["claude/RULE-020"], "sources": ["app/cbl/CBTRN02C.cbl:467-542"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Unwanted", "text": "If reading the transaction-category balance returns any status other than 00 or 23, then the system shall abend the run.", "capability": "claude/posting/01#3", "function": "claude/posting/01", "rules": ["claude/RULE-020"], "sources": ["app/cbl/CBTRN02C.cbl:467-542"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When a valid transaction posts, the system shall add its signed amount to the account's current balance and to the current-cycle credit if the amount is zero or positive, or to the current-cycle debit if the amount is negative.", "capability": "claude/posting/01#3", "function": "claude/posting/01", "rules": ["claude/RULE-004"], "sources": ["app/cbl/CBTRN02C.cbl:545-560"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the account rewrite fails with an invalid key, then the system shall set reason code 109 while still writing the transaction to the transaction file, with the category balance already updated and the transaction not counted as a reject.", "capability": "claude/posting/01#3", "function": "claude/posting/01", "rules": ["claude/RULE-004"], "sources": ["app/cbl/CBTRN02C.cbl:545-560"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When a validated daily transaction is posted, the system shall, after updating the category balance and the account, write a transaction master record copying all its fields and stamped with the batch's current date-time as the processing timestamp in format YYYY-MM-DD-HH.MM.SS.hh0000.", "capability": "claude/posting/01#4", "function": "claude/posting/01", "rules": ["claude/RULE-165"], "sources": ["app/cbl/CBTRN02C.cbl:424-444"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall move each daily transaction either to posted (transaction master) or to rejected (rejects file), with no pending or retry state.", "capability": "claude/posting/01#4", "function": "claude/posting/01", "rules": ["claude/RULE-165", "claude/RULE-218"], "sources": ["app/cbl/CBTRN02C.cbl:424-444"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Unwanted", "text": "If writing a posted transaction fails because of a duplicate transaction ID, then the system shall abend the batch.", "capability": "claude/posting/01#4", "function": "claude/posting/01", "rules": ["claude/RULE-165"], "sources": ["app/cbl/CBTRN02C.cbl:424-444"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall open the transaction master for output in each posting run, so that each run recreates the file rather than appending to existing posted history.", "capability": "claude/posting/01#4", "function": "claude/posting/01", "rules": ["claude/RULE-165"], "sources": ["app/cbl/CBTRN02C.cbl:424-444"], "programs": ["CBTRN02C"]}, {"key": "claude/posting/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a daily transaction is read, the system shall look up its 16-character card number in the card cross-reference by exact key and, if found, take the linked account ID and customer ID and run the account lookup.", "capability": "claude/posting/02#1", "function": "claude/posting/02", "rules": ["claude/RULE-079"], "sources": ["app/cbl/CBTRN01C.cbl:170-184"], "programs": ["CBTRN01C"]}, {"key": "claude/posting/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the card number is not found in the cross-reference, then the system shall set the read status to 4, write 'CARD NUMBER <card> COULD NOT BE VERIFIED. SKIPPING TRANSACTION ID-<id>' to the job log, and do no account lookup, without writing to a reject file or setting a return code.", "capability": "claude/posting/02#1", "function": "claude/posting/02", "rules": ["claude/RULE-079"], "sources": ["app/cbl/CBTRN01C.cbl:170-184"], "programs": ["CBTRN01C"]}, {"key": "claude/posting/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset the cross-reference read status to 0 before every lookup, so that an earlier failure does not carry over to the next transaction.", "capability": "claude/posting/02#1", "function": "claude/posting/02", "rules": ["claude/RULE-079"], "sources": ["app/cbl/CBTRN01C.cbl:170-184"], "programs": ["CBTRN01C"]}, {"key": "claude/posting/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When a card is verified, the system shall read the account master by the cross-referenced account ID and log 'SUCCESSFUL READ OF ACCOUNT FILE' if found, or set the read status to 4 and log 'ACCOUNT <id> NOT FOUND' if not found.", "capability": "claude/posting/02#1", "function": "claude/posting/02", "rules": ["claude/RULE-080"], "sources": ["app/cbl/CBTRN01C.cbl:173-179"], "programs": ["CBTRN01C"]}, {"key": "claude/posting/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not post, reject or count any transaction as a result of the card and account verification.", "capability": "claude/posting/02#1", "function": "claude/posting/02", "rules": ["claude/RULE-080"], "sources": ["app/cbl/CBTRN01C.cbl:173-179"], "programs": ["CBTRN01C"]}, {"key": "claude/posting/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the daily transaction file one record at a time, processing each record read with status '00' and ending the loop when status '10' (end-of-file) sets the end-of-file flag to 'Y'.", "capability": "claude/posting/02#2", "function": "claude/posting/02", "rules": ["claude/RULE-164"], "sources": ["app/cbl/CBTRN01C.cbl:164-225"], "programs": ["CBTRN01C"]}, {"key": "claude/posting/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If reading the daily transaction file returns any status other than '00' or '10', then the system shall set the result code to 12, write 'ERROR READING DAILY TRANSACTION FILE' and the file status, and abend with code 999.", "capability": "claude/posting/02#2", "function": "claude/posting/02", "rules": ["claude/RULE-164"], "sources": ["app/cbl/CBTRN01C.cbl:164-225"], "programs": ["CBTRN01C"]}, {"key": "claude/posting/02/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Unwanted", "text": "If opening or closing any of the daily transaction, customer, cross-reference, card, account or transaction master files returns a status other than '00', then the system shall write the error message and the 4-digit file status, set result code 12, and abend with code 999.", "capability": "claude/posting/02#2", "function": "claude/posting/02", "rules": ["claude/RULE-242", "claude/RULE-164"], "sources": ["app/cbl/CBTRN01C.cbl:271-359"], "programs": ["CBTRN01C"]}, {"key": "claude/posting/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the interest batch processes a transaction-category balance, the system shall find the rate by the account's group ID, transaction type and category, and if no record exists for that group (status 23) use the 'DEFAULT' group rate for the same type and category.", "capability": "claude/posting/03#1", "function": "claude/posting/03", "rules": ["claude/RULE-210"], "sources": ["app/cbl/CBACT04C.cbl:415-460"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If the 'DEFAULT' disclosure-group record is also missing, or any other read error occurs on the rate lookup, then the system shall abend the job with code 999.", "capability": "claude/posting/03#1", "function": "claude/posting/03", "rules": ["claude/RULE-210"], "sources": ["app/cbl/CBACT04C.cbl:415-460"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "State-driven", "text": "While the resolved disclosure-group rate is not zero, the system shall calculate monthly interest as the category balance times the annual rate divided by 1200, truncated to cents (not rounded).", "capability": "claude/posting/03#1", "function": "claude/posting/03", "rules": ["claude/RULE-003", "claude/RULE-070"], "sources": ["app/cbl/CBACT04C.cbl:462-470", "app/cbl/CBACT04C.cbl:210-217"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate interest for each category of the same account separately and add the amounts up into the account's total interest for the cycle.", "capability": "claude/posting/03#1", "function": "claude/posting/03", "rules": ["claude/RULE-003"], "sources": ["app/cbl/CBACT04C.cbl:462-470"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the resolved disclosure-group rate is zero, then the system shall calculate no interest, write no interest transaction and add nothing to the account's interest total for that category balance.", "capability": "claude/posting/03#1", "function": "claude/posting/03", "rules": ["claude/RULE-070"], "sources": ["app/cbl/CBACT04C.cbl:210-217"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When interest is calculated for a category balance with a non-zero rate, the system shall run the fee-calculation step, which calculates and posts no fee.", "capability": "claude/posting/03#1", "function": "claude/posting/03", "rules": ["claude/RULE-240"], "sources": ["app/cbl/CBACT04C.cbl:518-520"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When an interest amount is calculated, the system shall write a transaction with type '01', category '05', source 'System', description 'Int. for a/c ' followed by the account ID, the interest amount, merchant ID 0 with blank merchant name/city/zip, the account's cross-referenced card, and original and processed timestamps set to the current system timestamp.", "capability": "claude/posting/03#2", "function": "claude/posting/03", "rules": ["claude/RULE-159", "claude/RULE-003"], "sources": ["app/cbl/CBACT04C.cbl:473-515"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set each interest transaction ID to the run parameter date followed by a 6-digit sequence number that starts at 000001 in each run and increases by 1 per transaction.", "capability": "claude/posting/03#2", "function": "claude/posting/03", "rules": ["claude/RULE-159"], "sources": ["app/cbl/CBACT04C.cbl:473-515"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the interest batch posts an account's interest total, the system shall set the account's current-cycle credit and current-cycle debit to 0.00 and rewrite the account record together with the updated current balance.", "capability": "claude/posting/03#3", "function": "claude/posting/03", "rules": ["claude/RULE-158"], "sources": ["app/cbl/CBACT04C.cbl:350-370"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset cycle totals only for accounts that have at least one category-balance record.", "capability": "claude/posting/03#3", "function": "claude/posting/03", "rules": ["claude/RULE-158"], "sources": ["app/cbl/CBACT04C.cbl:350-370"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Unwanted", "text": "If the account rewrite fails, then the system shall abend the job with code 999.", "capability": "claude/posting/03#3", "function": "claude/posting/03", "rules": ["claude/RULE-158"], "sources": ["app/cbl/CBACT04C.cbl:350-370"], "programs": ["CBACT04C"]}, {"key": "claude/posting/03/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Unwanted", "text": "If an account in the category-balance file is not on the account master or has no card cross-reference, then the system shall display 'ACCOUNT NOT FOUND' and abend the whole interest batch with code 999, leaving interest already posted to earlier accounts rewritten.", "capability": "claude/posting/03#3", "function": "claude/posting/03", "rules": ["claude/RULE-071"], "sources": ["app/cbl/CBACT04C.cbl:372-413"], "programs": ["CBACT04C"]}, {"key": "claude/stmt/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall move through a fixed sequence of phases driven by a phase code starting at 'TRNXFILE': TRNXFILE (open and priming read) -> READTRNX (load all transactions) -> XREFFILE open -> CUSTFILE open -> ACCTFILE open -> main statement loop -> close all files.", "capability": "claude/stmt/01#1", "function": "claude/stmt/01", "rules": ["claude/RULE-161"], "sources": ["app/cbl/CBSTM03A.CBL:296-314"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall load all transactions fully before it produces any statement.", "capability": "claude/stmt/01#1", "function": "claude/stmt/01", "rules": ["claude/RULE-161", "claude/RULE-216"], "sources": ["app/cbl/CBSTM03A.CBL:296-314", "app/cbl/CBSTM03A.CBL:818-853"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the main statement loop ends, the system shall close the TRNX, XREF, CUST and ACCT files and the two output files.", "capability": "claude/stmt/01#1", "function": "claude/stmt/01", "rules": ["claude/RULE-161"], "sources": ["app/cbl/CBSTM03A.CBL:331-339"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the phase code is not recognized, then the system shall end the program quietly (GOBACK) without an error.", "capability": "claude/stmt/01#1", "function": "claude/stmt/01", "rules": ["claude/RULE-161"], "sources": ["app/cbl/CBSTM03A.CBL:296-314"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the card cross-reference file sequentially and, for each card, look up the owning customer and account and produce one statement (text and HTML) holding that card's transactions.", "capability": "claude/stmt/01#2", "function": "claude/stmt/01", "rules": ["claude/RULE-162"], "sources": ["app/cbl/CBSTM03A.CBL:316-329"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the cross-reference file reaches end of file (status '10'), the system shall end the statement run.", "capability": "claude/stmt/01#2", "function": "claude/stmt/01", "rules": ["claude/RULE-162"], "sources": ["app/cbl/CBSTM03A.CBL:345-362"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "State-driven", "text": "While an account has several cards in the cross-reference file, the system shall produce a separate statement for each card, each showing the same account balance and FICO score but only the transactions of its own card, with no account-level consolidated total.", "capability": "claude/stmt/01#2", "function": "claude/stmt/01", "rules": ["claude/RULE-162"], "sources": ["app/cbl/CBSTM03A.CBL:316-329"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall produce statements in cross-reference file order.", "capability": "claude/stmt/01#2", "function": "claude/stmt/01", "rules": ["claude/RULE-162"], "sources": ["app/cbl/CBSTM03A.CBL:316-329"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall load all transactions once into memory, grouped by card number (TRNX-CARD-NUM), from a transaction extract sorted by card number then transaction ID.", "capability": "claude/stmt/01#3", "function": "claude/stmt/01", "rules": ["claude/RULE-216"], "sources": ["app/cbl/CBSTM03A.CBL:818-853"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall list on each statement only the transactions whose card number equals the card on the cross-reference record, in transaction-ID order.", "capability": "claude/stmt/01#3", "function": "claude/stmt/01", "rules": ["claude/RULE-216"], "sources": ["app/cbl/CBSTM03A.CBL:416-432"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When looking up a card's transactions, the system shall stop early when it reaches a table card number greater than the requested card.", "capability": "claude/stmt/01#3", "function": "claude/stmt/01", "rules": ["claude/RULE-216"], "sources": ["app/cbl/CBSTM03A.CBL:416-432"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "State-driven", "text": "While a cross-reference card has no matching transactions, the system shall produce a statement with no detail lines.", "capability": "claude/stmt/01#3", "function": "claude/stmt/01", "rules": ["claude/RULE-216", "claude/RULE-019"], "sources": ["app/cbl/CBSTM03A.CBL:818-853"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If a transaction's card has no cross-reference record, then the system shall load the transaction but never print it, with no exception report.", "capability": "claude/stmt/01#3", "function": "claude/stmt/01", "rules": ["claude/RULE-216"], "sources": ["app/cbl/CBSTM03A.CBL:818-853"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the input is not sorted by card number, then the system shall split one card's transactions into several groups, and the early-exit lookup can miss groups so that transactions are silently left off statements.", "capability": "claude/stmt/01#3", "function": "claude/stmt/01", "rules": ["claude/RULE-216"], "sources": ["app/cbl/CBSTM03A.CBL:416-432"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall hold at most 51 distinct card numbers and at most 10 transactions per card for the whole run, and nothing checks these limits.", "capability": "claude/stmt/01#3", "function": "claude/stmt/01", "rules": ["claude/RULE-214"], "sources": ["app/cbl/CBSTM03A.CBL:225-233"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Unwanted", "text": "If the transaction extract has more than 10 transactions for one card or more than 51 distinct cards, then the system shall go past the table bounds without any check, so data overwrites neighboring storage or the job abends, and statements may show wrong or missing transactions, with no error, warning or reject file.", "capability": "claude/stmt/01#3", "function": "claude/stmt/01", "rules": ["claude/RULE-214"], "sources": ["app/cbl/CBSTM03A.CBL:818-830"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show on each statement the customer's name (first, middle, last), three address lines (line 3 combined with state, country and ZIP), the account ID, the account's current balance from the account master (not recomputed) and the customer's FICO score, in both the text and HTML statements.", "capability": "claude/stmt/01#4", "function": "claude/stmt/01", "rules": ["claude/RULE-215"], "sources": ["app/cbl/CBSTM03A.CBL:458-504"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall print the current balance as ST-CURR-BAL PIC 9(9).99- (zero-filled, trailing minus), for example 'Current Balance : 000000250.00-'.", "capability": "claude/stmt/01#4", "function": "claude/stmt/01", "rules": ["claude/RULE-215"], "sources": ["app/cbl/CBSTM03A.CBL:458-504"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If name parts or address-line-3/state/country/ZIP values contain embedded spaces, then the system shall cut them off at the first space (e.g. 'Mary Ann' prints as 'Mary', 'New York' as 'New').", "capability": "claude/stmt/01#4", "function": "claude/stmt/01", "rules": ["claude/RULE-215"], "sources": ["app/cbl/CBSTM03A.CBL:458-504"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the middle name is empty, then the system shall leave a double space in the printed name.", "capability": "claude/stmt/01#4", "function": "claude/stmt/01", "rules": ["claude/RULE-215"], "sources": ["app/cbl/CBSTM03A.CBL:458-504"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the HTML statement header is written, the system shall show the fixed issuer block 'Bank of XYZ', '410 Terry Ave N', 'Seattle WA 99999' exactly as the hardcoded literals.", "capability": "claude/stmt/01#4", "function": "claude/stmt/01", "rules": ["claude/RULE-241"], "sources": ["app/cbl/CBSTM03A.CBL:167-172"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write each account's HTML output as a full HTML document (DOCTYPE through <\/html>), all appended into one file.", "capability": "claude/stmt/01#4", "function": "claude/stmt/01", "rules": ["claude/RULE-241"], "sources": ["app/cbl/CBSTM03A.CBL:167-172"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall print each transaction on its own line and show a 'Total EXP' line that is the plain signed sum of the amounts of every transaction printed on that statement.", "capability": "claude/stmt/01#5", "function": "claude/stmt/01", "rules": ["claude/RULE-019"], "sources": ["app/cbl/CBSTM03A.CBL:416-437"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When a new statement starts, the system shall reset the total to 0.00.", "capability": "claude/stmt/01#5", "function": "claude/stmt/01", "rules": ["claude/RULE-019"], "sources": ["app/cbl/CBSTM03A.CBL:325"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reduce the total by credits/refunds (negative amounts), sum amounts exactly in cents without rounding, and print the total through ST-TOTAL-TRAMT PIC Z(9).99- (trailing minus sign).", "capability": "claude/stmt/01#5", "function": "claude/stmt/01", "rules": ["claude/RULE-019"], "sources": ["app/cbl/CBSTM03A.CBL:416-437"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Unwanted", "text": "If the total exceeds 999,999,999.99, then the system shall silently truncate it (no ON SIZE ERROR).", "capability": "claude/stmt/01#5", "function": "claude/stmt/01", "rules": ["claude/RULE-019"], "sources": ["app/cbl/CBSTM03A.CBL:429"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not reconcile the statement total against the account's Current Balance shown on the same statement.", "capability": "claude/stmt/01#5", "function": "claude/stmt/01", "rules": ["claude/RULE-019", "claude/RULE-215"], "sources": ["app/cbl/CBSTM03A.CBL:416-437"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall look up, for each card, the owning customer (by XREF-CUST-ID) and account (by XREF-ACCT-ID) by key, accepting only return code '00' as success.", "capability": "claude/stmt/01#6", "function": "claude/stmt/01", "rules": ["claude/RULE-076"], "sources": ["app/cbl/CBSTM03A.CBL:368-414"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Unwanted", "text": "If the customer or account lookup returns anything other than success, then the system shall display the error (e.g. 'ERROR READING CUSTFILE') and the return code and abend the whole statement run through CEE3ABD, producing no further statements.", "capability": "claude/stmt/01#6", "function": "claude/stmt/01", "rules": ["claude/RULE-076"], "sources": ["app/cbl/CBSTM03A.CBL:368-414", "app/cbl/CBSTM03A.CBL:921-923"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "State-driven", "text": "While the run abends after a failure, the system shall leave statements already written before the failure in the output files.", "capability": "claude/stmt/01#6", "function": "claude/stmt/01", "rules": ["claude/RULE-076"], "sources": ["app/cbl/CBSTM03A.CBL:368-414"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept opens and closes on return code '00' or '04', and sequential reads on '00', with '10' meaning end of file.", "capability": "claude/stmt/01#6", "function": "claude/stmt/01", "rules": ["claude/RULE-077"], "sources": ["app/cbl/CBSTM03A.CBL:730-762"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Unwanted", "text": "If an open, read or close returns any other code, then the system shall abend the run (9999-ABEND-PROGRAM).", "capability": "claude/stmt/01#6", "function": "claude/stmt/01", "rules": ["claude/RULE-077"], "sources": ["app/cbl/CBSTM03A.CBL:730-762"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Event-driven", "text": "When the priming read of the transaction file returns '04', the system shall accept it and load the record as a valid transaction.", "capability": "claude/stmt/01#6", "function": "claude/stmt/01", "rules": ["claude/RULE-077"], "sources": ["app/cbl/CBSTM03A.CBL:730-762"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/01/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Unwanted", "text": "If the transaction extract file is empty (the priming read returns '10'), then the system shall display 'ERROR READING TRNXFILE' and abend, producing no statements.", "capability": "claude/stmt/01#6", "function": "claude/stmt/01", "rules": ["claude/RULE-077"], "sources": ["app/cbl/CBSTM03A.CBL:730-762"], "programs": ["CBSTM03A"]}, {"key": "claude/stmt/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall let the statement program open, read and close four data sets (TRNXFILE, XREFFILE, CUSTFILE, ACCTFILE), all opened INPUT only, so that the file-access routine never changes data.", "capability": "claude/stmt/02#1", "function": "claude/stmt/02", "rules": ["claude/RULE-217"], "sources": ["app/cbl/CBSTM03B.CBL:114-229"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept O, R and C for TRNXFILE and XREFFILE, reading sequentially in key order (card number + transaction id for transactions, card number for xref).", "capability": "claude/stmt/02#1", "function": "claude/stmt/02", "rules": ["claude/RULE-217"], "sources": ["app/cbl/CBSTM03B.CBL:114-229"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept O, K and C for CUSTFILE and ACCTFILE (random keyed read) and return the record read in the 1000-byte data area.", "capability": "claude/stmt/02#1", "function": "claude/stmt/02", "rules": ["claude/RULE-217"], "sources": ["app/cbl/CBSTM03B.CBL:114-229"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the routine receives an unsupported operation (R for CUSTFILE/ACCTFILE, K for TRNXFILE/XREFFILE, or the declared but unimplemented W and Z codes), then the system shall do nothing and return the file's last status.", "capability": "claude/stmt/02#1", "function": "claude/stmt/02", "rules": ["claude/RULE-217"], "sources": ["app/cbl/CBSTM03B.CBL:114-229"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the routine receives an unrecognised file name, then the system shall return right away without setting the return code, so the caller sees whatever was in LK-M03B-RC before the call.", "capability": "claude/stmt/02#1", "function": "claude/stmt/02", "rules": ["claude/RULE-217"], "sources": ["app/cbl/CBSTM03B.CBL:127-128"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a keyed-read request (K) is made for CUSTFILE or ACCTFILE, the system shall move Key(1:length) into the customer id (X(9)) or account id (9(11)), using the key length the caller passes, and read the record randomly.", "capability": "claude/stmt/02#2", "function": "claude/stmt/02", "rules": ["claude/RULE-078"], "sources": ["app/cbl/CBSTM03B.CBL:188-218"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the keyed record is found, the system shall return status '00' and the data.", "capability": "claude/stmt/02#2", "function": "claude/stmt/02", "rules": ["claude/RULE-078"], "sources": ["app/cbl/CBSTM03B.CBL:188-218"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the key is missing, then the system shall return status '23' (record not found) in LK-M03B-RC.", "capability": "claude/stmt/02#2", "function": "claude/stmt/02", "rules": ["claude/RULE-078"], "sources": ["app/cbl/CBSTM03B.CBL:188-218"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall make no check on the key, including its length, before the read.", "capability": "claude/stmt/02#2", "function": "claude/stmt/02", "rules": ["claude/RULE-078"], "sources": ["app/cbl/CBSTM03B.CBL:188-218"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the key length is shorter than the field, then the system shall pad the key: spaces for the customer id, zero-fill/alignment for the numeric account id.", "capability": "claude/stmt/02#2", "function": "claude/stmt/02", "rules": ["claude/RULE-078"], "sources": ["app/cbl/CBSTM03B.CBL:188-218"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When an open, read or close on one of the four files completes, the system shall copy the file's 2-character status code (for example '00' success, '10' end of file on a sequential read, '23' key not found) to LK-M03B-RC.", "capability": "claude/stmt/02#3", "function": "claude/stmt/02", "rules": ["claude/RULE-163"], "sources": ["app/cbl/CBSTM03B.CBL:151-226"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall signal the end of the transaction/xref data only by status '10' and shall not track end of file itself.", "capability": "claude/stmt/02#3", "function": "claude/stmt/02", "rules": ["claude/RULE-163"], "sources": ["app/cbl/CBSTM03B.CBL:151-226"], "programs": ["CBSTM03B"]}, {"key": "claude/stmt/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If a file is read before an open or opened twice, then the system shall return the runtime error status without blocking the operation.", "capability": "claude/stmt/02#3", "function": "claude/stmt/02", "rules": ["claude/RULE-163"], "sources": ["app/cbl/CBSTM03B.CBL:151-226"], "programs": ["CBSTM03B"]}, {"key": "claude/auth/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When an authorization request message is received, the system shall parse it as a comma-delimited string of 18 fields in this order: auth date, auth time, card number, auth type, card expiry, message type, message source, processing code, transaction amount, MCC, acquirer country, POS entry mode, merchant id, name, city, state, zip, transaction id.", "capability": "claude/auth/01#1", "function": "claude/auth/01", "rules": ["claude/RULE-049"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:351-380"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall convert the transaction amount text to a number with NUMVAL.", "capability": "claude/auth/01#1", "function": "claude/auth/01", "rules": ["claude/RULE-049"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:351-380"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall accept authorization request messages of up to 500 bytes.", "capability": "claude/auth/01#1", "function": "claude/auth/01", "rules": ["claude/RULE-049"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:351-380"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the program is triggered, the system shall keep processing authorization requests until the queue is empty (after waiting up to 5 seconds) or until it has processed more than 500 messages.", "capability": "claude/auth/01#1", "function": "claude/auth/01", "rules": ["claude/RULE-235"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-345"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall commit (SYNCPOINT) after each processed authorization request.", "capability": "claude/auth/01#1", "function": "claude/auth/01", "rules": ["claude/RULE-235"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-345"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "State-driven", "text": "While messages remain on the request queue after the processing limit is reached, the system shall leave them for the next trigger.", "capability": "claude/auth/01#1", "function": "claude/auth/01", "rules": ["claude/RULE-235"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-345"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When an authorization request is processed, the system shall look up the card number in the card cross-reference to find the account and customer.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-050"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:445-465"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the card is not found in the cross-reference, then the system shall log warning A001 'CARD NOT FOUND IN XREF', skip reading account, customer and summary data, and decline the authorization ('05', reason 3100).", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-050", "claude/RULE-051"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:445-465"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate available credit as the pending-authorization summary's credit limit minus its credit balance, or as the account master's credit limit minus its current balance when no summary exists yet.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-001"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the requested transaction amount is greater than the available amount, then the system shall decline the authorization with reason INSUFFICIENT-FUND, approving a request for exactly the available amount because the check is strictly greater-than.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-001"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If neither a pending-authorization summary nor an account master record exists, then the system shall decline the authorization without setting the insufficient-funds flag.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-001"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the account is not found (A002), then the system shall decline the authorization.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-050"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:445-465"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If the customer is not found (A003), then the system shall log it only and shall not decline the authorization for that reason alone.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-050", "claude/RULE-001"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:445-465"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When an authorization is approved, the system shall return response code '00' with the full requested amount approved and reason '0000'.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-193", "claude/RULE-051"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696", "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:698-718"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When an authorization is declined, the system shall return response code '05' with an approved amount of zero.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-193"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall approve either the full requested amount or 0, without partial approvals.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-193"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the auth ID code to the request's auth time (PA-RQ-AUTH-TIME).", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-193"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When an authorization is declined, the system shall assign the reason code from the first matching cause: card, account or customer not found 3100; insufficient funds 4100; card not active 4200; account closed 4300; card fraud 5100; merchant fraud 5200; anything else 9000.", "capability": "claude/auth/01#2", "function": "claude/auth/01", "rules": ["claude/RULE-051"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:698-718"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the decision has been made, the system shall put the reply on the requester's reply-to queue with the request's correlation id, even when the card was not found in the cross-reference.", "capability": "claude/auth/01#3", "function": "claude/auth/01", "rules": ["claude/RULE-194", "claude/RULE-050"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:738-766"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall send each reply as a non-persistent message, outside syncpoint, that expires after 5 seconds (MQMD-EXPIRY = 50 tenths of a second).", "capability": "claude/auth/01#3", "function": "claude/auth/01", "rules": ["claude/RULE-194"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:738-766"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send the reply before the result is written to the pending-authorization database.", "capability": "claude/auth/01#3", "function": "claude/auth/01", "rules": ["claude/RULE-194"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:738-766"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall format the reply as CSV with card, txn-id, auth-id, resp-code, reason and approved-amt (display format -zzzzzzzzz9.99).", "capability": "claude/auth/01#3", "function": "claude/auth/01", "rules": ["claude/RULE-193"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When an authorization for a card found in the cross-reference has been decided, the system shall update the account's pending-auth summary, or insert a new one if none exists.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When a new pending-auth summary is created, the system shall initialize its numerics to 0 and set the account id and customer id from the cross-reference.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall refresh the summary's credit and cash limits from the account master on each authorization.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When an approved authorization is recorded, the system shall increase the approved count and approved amount, add the approved amount to the credit balance, and set the cash balance to 0.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When a declined authorization is recorded, the system shall increase the declined count and declined amount.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-002"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When an authorization for a card found in the cross-reference is processed, the system shall store a detail record holding the request data and the decision under the account's summary.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-141"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:877-919"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set a new detail record's match status to Pending ('P') when approved or Auth-Declined ('D') when declined, and set its fraud flag and fraud report date to blank.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-141"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:877-919"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Unwanted", "text": "If the card is not found in the cross-reference, then the system shall write nothing to the pending-authorization database.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-050"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:445-465"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Unwanted", "text": "If the summary update failed critically, then the system shall end before the detail insert.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-141", "claude/RULE-195"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:877-919"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build the detail record key from the processing timestamp subtracted from all-nines (date key = 99999 - YYDDD; time key = 999999999 - (HHMMSS*1000 + ms)), so that the newest authorizations sort first.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-008"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:857-875"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall store the original request date and time separately in PA-AUTH-ORIG-DATE/TIME.", "capability": "claude/auth/01#4", "function": "claude/auth/01", "rules": ["claude/RULE-008"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:857-875"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-N-004", "code": "REQ-N-004", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall log every error to the CSSL transient data queue with transaction CP00, the program name, date and time.", "capability": "claude/auth/01#5", "function": "claude/auth/01", "rules": ["claude/RULE-195"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1023"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Unwanted", "text": "If a critical error occurs (MQ open/get/put, file I/O, or IMS schedule/read/update/insert failure), then the system shall end the run immediately by terminating the PSB, closing the request queue and returning, leaving remaining queued messages for the next trigger.", "capability": "claude/auth/01#5", "function": "claude/auth/01", "rules": ["claude/RULE-195", "claude/RULE-050"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1023"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Unwanted", "text": "If a warning occurs (record not found or queue close failure), then the system shall continue processing.", "capability": "claude/auth/01#5", "function": "claude/auth/01", "rules": ["claude/RULE-195"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1023"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/01/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Unwanted", "text": "If the PSB is already scheduled ('TC'), then the system shall terminate it and reschedule it once.", "capability": "claude/auth/01#5", "function": "claude/auth/01", "rules": ["claude/RULE-195"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1023"], "programs": ["COPAUA0C"]}, {"key": "claude/auth/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the pending-authorization summary screen, the system shall require the Account ID field to be filled in and to contain only digits.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-052"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the Account ID is blank or non-numeric, then the system shall show 'Please enter Acct Id...' or 'Acct Id must be Numeric ...' respectively, clear the working account, set the error flag, place the cursor on Account ID and leave the list empty.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-052"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a valid Account ID is entered, the system shall save it as the current account (also into the shared session area) and reload the account details and list.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-052"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When account details are gathered, the system shall find the card/customer link through the card cross-reference by account, then read the account master and the customer master.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-054"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the customer name as 'First M Last', address line 1 as 'Addr1,Addr2', address line 2 as 'Addr3,State,Zip5', and the credit limit and cash credit limit from the account master in the header.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-054"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the account is not found in the cross-reference, account or customer file, then the system shall show 'Account:<id> not found in XREF/ACCT file' or 'Customer:<id> not found in CUST file'.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-054"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If any other file error occurs, then the system shall set the error flag, show 'System error while reading ... file' with response/reason codes, and suppress the authorization list.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-054"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the account's approved and declined authorization counts and amounts plus credit and cash balances from the pending-authorization summary record for that account.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-010"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:785-807"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the account has no summary record, then the system shall show all six figures as zero.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-010"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:785-807"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If an IMS error other than not-found occurs reading the summary, then the system shall set the error flag and show 'System error while reading AUTH Summary'.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-010"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:785-807"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the screen is first entered, the system shall mark the session as re-entered and load the account passed from the caller and its list.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-142"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:190-257"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the screen is first entered from another program with a non-numeric account ID in the session area, the system shall blank it without raising an error and do no lookup.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-052"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3, the system shall transfer to the main menu COMEN01C.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-142"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:190-257"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the user presses any key other than Enter, PF3, PF7 or PF8, then the system shall show the standard invalid-key message and set the error flag.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-142"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:190-257"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If there is no session data at all, then the system shall show an empty screen.", "capability": "claude/auth/02#1", "function": "claude/auth/02", "rules": ["claude/RULE-142"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:190-257"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show each listed authorization as Approved ('A') only when its response code is '00', and as Declined ('D') for any other response code.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-009"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:536-540"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the approved amount (PA-APPROVED-AMT) for each listed authorization and its match status as stored.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-009"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:536-540"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the stored authorization date (YYMMDD) as MM/DD/YY and the stored time (HHMMSS) as HH:MM:SS.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-034"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:525-534"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF7, the system shall show the previous page by repositioning to the saved first-record key of that page and showing five records.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-143", "claude/RULE-142"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:361-385"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF7 on page 1, then the system shall show 'You are already at the top of the pa
