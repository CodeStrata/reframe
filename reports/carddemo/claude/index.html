ude/vsammq/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If a queue open, get or reply put fails, then the system shall put a fixed-layout error record (para X(25), message X(25), condition 9(2), reason 9(5), queue X(48), separated by 2 spaces) to 'CARD.DEMO.ERROR' under syncpoint, then close its open queues and return.", "capability": "claude/vsammq/02#4", "function": "claude/vsammq/02", "rules": ["claude/RULE-209"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:405-440"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use the error messages 'INP MQOPEN ERR', 'OUT MQOPEN ERR', 'ERR MQOPEN ERR', 'INP MQGET ERR:', 'MQPUT ERR', 'MQCLOSE ERR' and 'CICS RETRIEVE' for the corresponding failures.", "capability": "claude/vsammq/02#4", "function": "claude/vsammq/02", "rules": ["claude/RULE-209"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:405-440"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the error queue cannot be opened or the error put fails, then the system shall write the error only to the console (DISPLAY).", "capability": "claude/vsammq/02#4", "function": "claude/vsammq/02", "rules": ["claude/RULE-209"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:405-440"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When termination runs, the system shall close with MQCO-NONE each of the input, reply and error queues that it marked as successfully opened, and then issue CICS RETURN.", "capability": "claude/vsammq/02#5", "function": "claude/vsammq/02", "rules": ["claude/RULE-184"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:442-523"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall open the error queue first, then retrieve the trigger, then open the input queue, then the reply queue.", "capability": "claude/vsammq/02#5", "function": "claude/vsammq/02", "rules": ["claude/RULE-184"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:442-523"], "programs": ["CODATE01"]}, {"key": "claude/util/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the CBEXPORT batch runs, the system shall export every customer, account, card cross-reference, transaction and card record, with no status or date filter, in this order: customers, accounts, cross-references, transactions, cards.", "capability": "claude/util/01#1", "function": "claude/util/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall mark each export record with its record type code: C=Customer, A=Account, X=Card cross-reference, T=Transaction, D=Card.", "capability": "claude/util/01#1", "function": "claude/util/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read each input file sequentially in its primary key order (CUST-ID, ACCT-ID, XREF-CARD-NUM, TRAN-ID, CARD-NUM) and write fixed-length 500-byte export records.", "capability": "claude/util/01#1", "function": "claude/util/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall include inactive accounts and expired or inactive cards as-is, copying fields with no transformation and passing status flags such as ACCT-ACTIVE-STATUS and CARD-ACTIVE-STATUS through unchanged.", "capability": "claude/util/01#1", "function": "claude/util/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If an input file is empty, then the system shall write zero records of that type and carry on with the run.", "capability": "claude/util/01#1", "function": "claude/util/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall export records without referential checks, so a transaction whose card has no xref, or an xref whose account is missing, is still exported.", "capability": "claude/util/01#1", "function": "claude/util/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall give each exported record a sequence number that starts at 1 and goes up by 1 across all record types for the whole run, and shall use it as the key of the export file.", "capability": "claude/util/01#2", "function": "claude/util/01", "rules": ["claude/RULE-018"], "sources": ["app/cbl/CBEXPORT.cbl:276-277"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When an export run starts, the system shall start the sequence counter again at 0, so sequence numbers are unique only within one export file.", "capability": "claude/util/01#2", "function": "claude/util/01", "rules": ["claude/RULE-018"], "sources": ["app/cbl/CBEXPORT.cbl:276-277"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the run starts, the system shall read the system clock once and put that one timestamp, in the form 'YYYY-MM-DD HH:MM:SS.00', on every exported record.", "capability": "claude/util/01#2", "function": "claude/util/01", "rules": ["claude/RULE-038"], "sources": ["app/cbl/CBEXPORT.cbl:172-195"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall always write the hundredths of a second as '00' and leave the rest of the 26-character EXPORT-TIMESTAMP field blank.", "capability": "claude/util/01#2", "function": "claude/util/01", "rules": ["claude/RULE-038"], "sources": ["app/cbl/CBEXPORT.cbl:172-195"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall label every exported record with EXPORT-BRANCH-ID '0001' and EXPORT-REGION-CODE 'NORTH', whatever the actual customer, account or address.", "capability": "claude/util/01#2", "function": "claude/util/01", "rules": ["claude/RULE-211"], "sources": ["app/cbl/CBEXPORT.cbl:278-279"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall copy the customer's SSN, government-issued ID, date of birth, EFT account ID and FICO score, plus each card's CVV, into the migration file with no masking or encryption.", "capability": "claude/util/01#3", "function": "claude/util/01", "rules": ["claude/RULE-212"], "sources": ["app/cbl/CBEXPORT.cbl:294-298"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall export the card number in full in the X, T and D records.", "capability": "claude/util/01#3", "function": "claude/util/01", "rules": ["claude/RULE-212"], "sources": ["app/cbl/CBEXPORT.cbl:294-298"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall count the records written for each record type, adding to each count only after a successful write.", "capability": "claude/util/01#4", "function": "claude/util/01", "rules": ["claude/RULE-039"], "sources": ["app/cbl/CBEXPORT.cbl:554-573"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the export finishes, the system shall report the counts for Customers, Accounts, XRefs, Transactions and Cards and a Total equal to the sum of the five counts to the job log.", "capability": "claude/util/01#4", "function": "claude/util/01", "rules": ["claude/RULE-039"], "sources": ["app/cbl/CBEXPORT.cbl:554-573"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When a read returns end-of-file status '10', the system shall end that file's loop normally.", "capability": "claude/util/01#4", "function": "claude/util/01", "rules": ["claude/RULE-072"], "sources": ["app/cbl/CBEXPORT.cbl:198-240"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If any input or output file cannot be opened, or any read or write returns a status other than '00' (or '10' on a read), then the system shall display an error with the file status and abend at once through CEE3ABD, without retrying or skipping the failing record.", "capability": "claude/util/01#4", "function": "claude/util/01", "rules": ["claude/RULE-072"], "sources": ["app/cbl/CBEXPORT.cbl:198-240"], "programs": ["CBEXPORT"]}, {"key": "claude/util/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the export abends, then the system shall leave the records already written in the partial export file, with no cleanup or rollback.", "capability": "claude/util/01#4", "function": "claude/util/01", "rules": ["claude/RULE-072"], "sources": ["app/cbl/CBEXPORT.cbl:198-240"], "programs": ["CBEXPORT"]}, {"key": "claude/util/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the CBIMPORT batch reads an export record, the system shall write it to exactly one target file by its record type: 'C' to CUSTOUT, 'A' to ACCTOUT, 'X' to XREFOUT, 'T' to TRNXOUT and 'D' to CARDOUT, and add 1 to the matching per-type import counter.", "capability": "claude/util/02#1", "function": "claude/util/02", "rules": ["claude/RULE-213"], "sources": ["app/cbl/CBIMPORT.cbl:270-285"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall process export records in ascending EXPORT-SEQUENCE-NUM key order and treat record type codes as case-sensitive.", "capability": "claude/util/02#1", "function": "claude/util/02", "rules": ["claude/RULE-213"], "sources": ["app/cbl/CBIMPORT.cbl:270-285"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not carry the export header fields EXPORT-BRANCH-ID, EXPORT-REGION-CODE and EXPORT-TIMESTAMP into any target record.", "capability": "claude/util/02#1", "function": "claude/util/02", "rules": ["claude/RULE-213"], "sources": ["app/cbl/CBIMPORT.cbl:270-285"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall move customer, account, cross-reference, transaction and card data field-for-field into the target files without any check on values such as IDs, SSN, FICO score, balances, credit limits, dates, status flags or card numbers.", "capability": "claude/util/02#1", "function": "claude/util/02", "rules": ["claude/RULE-073"], "sources": ["app/cbl/CBIMPORT.cbl:288-422"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall pass account and card active-status values through unchanged and shall not check that an XREF, card or transaction references an existing account, customer or card.", "capability": "claude/util/02#1", "function": "claude/util/02", "rules": ["claude/RULE-073"], "sources": ["app/cbl/CBIMPORT.cbl:288-422"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If a record's type code is not C, A, X, T or D, then the system shall not import it and shall write an error line (timestamp | record type | sequence number | 'Unknown record type encountered') to the error file.", "capability": "claude/util/02#2", "function": "claude/util/02", "rules": ["claude/RULE-074", "claude/RULE-213"], "sources": ["app/cbl/CBIMPORT.cbl:425-446"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When an unknown record type is rejected, the system shall add 1 to the unknown-type and error counters and continue with the next record.", "capability": "claude/util/02#2", "function": "claude/util/02", "rules": ["claude/RULE-074"], "sources": ["app/cbl/CBIMPORT.cbl:425-446"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If a write to the error file fails, then the system shall only display a message and shall not abend.", "capability": "claude/util/02#2", "function": "claude/util/02", "rules": ["claude/RULE-074", "claude/RULE-160"], "sources": ["app/cbl/CBIMPORT.cbl:425-446"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the import completes successfully, the system shall report total records read, counts per type (customers, accounts, xrefs, transactions, cards), errors written and unknown record types.", "capability": "claude/util/02#3", "function": "claude/util/02", "rules": ["claude/RULE-040"], "sources": ["app/cbl/CBIMPORT.cbl:455-478"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When step 3000-VALIDATE-IMPORT runs after all records are processed, the system shall print 'Import validation completed' and 'No validation errors detected' without performing any checksum, record-count reconciliation or cross-file integrity check.", "capability": "claude/util/02#3", "function": "claude/util/02", "rules": ["claude/RULE-075"], "sources": ["app/cbl/CBIMPORT.cbl:449-452"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the export file read returns end-of-file status '10', the system shall end the import normally.", "capability": "claude/util/02#4", "function": "claude/util/02", "rules": ["claude/RULE-160"], "sources": ["app/cbl/CBIMPORT.cbl:341-347"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the export file cannot be opened or read, or any target file cannot be opened or written, then the system shall display the status and abend immediately through CEE3ABD.", "capability": "claude/util/02#4", "function": "claude/util/02", "rules": ["claude/RULE-160"], "sources": ["app/cbl/CBIMPORT.cbl:341-347"], "programs": ["CBIMPORT"]}, {"key": "claude/util/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the import abends, then the system shall leave the records already written in the output files, with no partial rollback and no final statistics.", "capability": "claude/util/02#4", "function": "claude/util/02", "rules": ["claude/RULE-160"], "sources": ["app/cbl/CBIMPORT.cbl:341-347"], "programs": ["CBIMPORT"]}, {"key": "claude/util/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the batch job runs, the system shall open the account file and three output files, read every account in key order until end of file, and write all extract records for each account.", "capability": "claude/util/03#1", "function": "claude/util/03", "rules": ["claude/RULE-157"], "sources": ["app/cbl/CBACT01C.cbl:141-198"], "programs": ["CBACT01C"]}, {"key": "claude/util/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "For an account file holding N records, the system shall write N records to OUTFILE and ARRYFILE and 2N to VBRCFILE.", "capability": "claude/util/03#1", "function": "claude/util/03", "rules": ["claude/RULE-157"], "sources": ["app/cbl/CBACT01C.cbl:141-198"], "programs": ["CBACT01C"]}, {"key": "claude/util/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If any of the 4 files fails to open, or a read returns a status other than '00' or '10', then the system shall abend with code 999.", "capability": "claude/util/03#1", "function": "claude/util/03", "rules": ["claude/RULE-157"], "sources": ["app/cbl/CBACT01C.cbl:141-198"], "programs": ["CBACT01C"]}, {"key": "claude/util/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If a write to OUTFILE, ARRYFILE or VBRCFILE returns a status other than '00' or '10', then the system shall display the status and abend with code 999.", "capability": "claude/util/03#1", "function": "claude/util/03", "rules": ["claude/RULE-067"], "sources": ["app/cbl/CBACT01C.cbl:242-251"], "programs": ["CBACT01C"]}, {"key": "claude/util/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the extract record is built for an account with ACCT-CURR-CYC-DEBIT = 0.00, the system shall set OUT-ACCT-CURR-CYC-DEBIT = 2525.00.", "capability": "claude/util/03#2", "function": "claude/util/03", "rules": ["claude/RULE-017"], "sources": ["app/cbl/CBACT01C.cbl:236-238"], "programs": ["CBACT01C"]}, {"key": "claude/util/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the extract record is built for an account with a non-zero cycle debit, the system shall not copy the real cycle debit into the extract, so the output field keeps whatever was in the record buffer.", "capability": "claude/util/03#2", "function": "claude/util/03", "rules": ["claude/RULE-017"], "sources": ["app/cbl/CBACT01C.cbl:236-238"], "programs": ["CBACT01C"]}, {"key": "claude/util/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the extract record is built, the system shall convert the account reissue date from YYYY-MM-DD to YYYYMMDD by calling COBDATFT with input type '2'.", "capability": "claude/util/03#2", "function": "claude/util/03", "rules": ["claude/RULE-016"], "sources": ["app/asm/COBDATFT.asm:35-54"], "programs": ["COBDATFT"]}, {"key": "claude/util/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the array record is built, the system shall write the account ID and 5 balance/debit slots: slots 1 and 2 hold the real current balance with fixed debits of 1,005.00 and 1,525.00, slot 3 holds fixed -1,025.00 / -2,500.00, and slots 4 and 5 are zero.", "capability": "claude/util/03#2", "function": "claude/util/03", "rules": ["claude/RULE-036"], "sources": ["app/cbl/CBACT01C.cbl:253-261"], "programs": ["CBACT01C"]}, {"key": "claude/util/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write two variable-length records for each account: a 12-byte status record (ID + active status) and a 39-byte balance record (ID, current balance, credit limit and reissue year).", "capability": "claude/util/03#2", "function": "claude/util/03", "rules": ["claude/RULE-037"], "sources": ["app/cbl/CBACT01C.cbl:276-315"], "programs": ["CBACT01C"]}, {"key": "claude/util/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall take the reissue year from the first 4 characters of the raw reissue date, not the converted date.", "capability": "claude/util/03#2", "function": "claude/util/03", "rules": ["claude/RULE-037"], "sources": ["app/cbl/CBACT01C.cbl:276-315"], "programs": ["CBACT01C"]}, {"key": "claude/util/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a listing utility runs, the system shall open one master file read-only and print every record from first to last in key order between the 'START OF EXECUTION' and 'END OF EXECUTION' banner lines.", "capability": "claude/util/04#1", "function": "claude/util/04", "rules": ["claude/RULE-238"], "sources": ["app/cbl/CBACT02C.cbl:70-87"], "programs": ["CBACT02C"]}, {"key": "claude/util/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall provide listings of the card master file CARDFILE (CBACT02C), the cross-reference file XREFFILE (CBACT03C) and the customer file CUSTFILE (CBCUS01C).", "capability": "claude/util/04#1", "function": "claude/util/04", "rules": ["claude/RULE-238"], "sources": ["app/cbl/CBACT02C.cbl:70-87"], "programs": ["CBACT02C"]}, {"key": "claude/util/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not filter, change or calculate anything and shall produce no record selection, totals or record counts.", "capability": "claude/util/04#1", "function": "claude/util/04", "rules": ["claude/RULE-238"], "sources": ["app/cbl/CBACT02C.cbl:70-87"], "programs": ["CBACT02C"]}, {"key": "claude/util/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the file is empty, then the system shall print only the banner lines, with no records and no error.", "capability": "claude/util/04#1", "function": "claude/util/04", "rules": ["claude/RULE-238"], "sources": ["app/cbl/CBACT02C.cbl:70-87"], "programs": ["CBACT02C"]}, {"key": "claude/util/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall print each record twice in the cross-reference (CBACT03C) and customer (CBCUS01C) dumps, and once in the card dump (CBACT02C).", "capability": "claude/util/04#1", "function": "claude/util/04", "rules": ["claude/RULE-239"], "sources": ["app/cbl/CBACT03C.cbl:92-96"], "programs": ["CBACT03C"]}, {"key": "claude/util/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a read returns file status '00', the system shall process the record, and when it returns '10', the system shall end the loop normally.", "capability": "claude/util/04#2", "function": "claude/util/04", "rules": ["claude/RULE-069"], "sources": ["app/cbl/CBACT02C.cbl:92-116"], "programs": ["CBACT02C"]}, {"key": "claude/util/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If a read returns any other status, including '04' or other '0x' warning statuses, then the system shall print 'ERROR READING' with the file name and the 4-digit file status and abend with code 999 through CEE3ABD.", "capability": "claude/util/04#2", "function": "claude/util/04", "rules": ["claude/RULE-069"], "sources": ["app/cbl/CBACT02C.cbl:92-116"], "programs": ["CBACT02C"]}, {"key": "claude/util/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the master file open or close returns a status other than '00', then the system shall print 'ERROR OPENING' or 'ERROR CLOSING' with the file name and 'FILE STATUS IS:' and abend with code 999.", "capability": "claude/util/04#2", "function": "claude/util/04", "rules": ["claude/RULE-068"], "sources": ["app/cbl/CBACT02C.cbl:118-152"], "programs": ["CBACT02C"]}, {"key": "claude/util/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall display numeric file statuses as 00nn, and a non-numeric status or a status starting with '9' as the first byte followed by the binary value of the second byte as 3 digits.", "capability": "claude/util/04#2", "function": "claude/util/04", "rules": ["claude/RULE-068"], "sources": ["app/cbl/CBACT02C.cbl:118-152"], "programs": ["CBACT02C"]}, {"key": "claude/util/05/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When COBDATFT is called with input type '1', the system shall convert a YYYYMMDD date to YYYY-MM-DD by rearranging characters.", "capability": "claude/util/05#1", "function": "claude/util/05", "rules": ["claude/RULE-016"], "sources": ["app/asm/COBDATFT.asm:35-54"], "programs": ["COBDATFT"]}, {"key": "claude/util/05/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When COBDATFT is called with input type '2', the system shall convert a YYYY-MM-DD date to YYYYMMDD using year chars 1-4, month chars 6-7 and day chars 9-10.", "capability": "claude/util/05#1", "function": "claude/util/05", "rules": ["claude/RULE-016"], "sources": ["app/asm/COBDATFT.asm:35-54"], "programs": ["COBDATFT"]}, {"key": "claude/util/05/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not check that year, month or day are numeric or in range, and shall write only the first 10 output bytes.", "capability": "claude/util/05#1", "function": "claude/util/05", "rules": ["claude/RULE-016"], "sources": ["app/asm/COBDATFT.asm:35-54"], "programs": ["COBDATFT"]}, {"key": "claude/util/05/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the input type is neither '1' nor '2', a type-1 date appears to contain a dash, or the output type is the opposite code of the input type, then the system shall not convert the date and shall set the error message field to 'INVALID INPUT'.", "capability": "claude/util/05#1", "function": "claude/util/05", "rules": ["claude/RULE-127"], "sources": ["app/asm/COBDATFT.asm:29-56"], "programs": ["COBDATFT"]}, {"key": "claude/util/05/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall always return register 15 = 0, so errors are visible only through the error message field.", "capability": "claude/util/05#1", "function": "claude/util/05", "rules": ["claude/RULE-016"], "sources": ["app/asm/COBDATFT.asm:35-54"], "programs": ["COBDATFT"]}, {"key": "claude/util/05/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When CSUTLDTC is called with a 10-byte date and 10-byte mask, the system shall treat the date as valid only if CEEDAYS can convert it under the mask to a Lilian day number, and then set the result text to 'Date is valid'.", "capability": "claude/util/05#2", "function": "claude/util/05", "rules": ["claude/RULE-126"], "sources": ["app/cbl/CSUTLDTC.cbl:103-149"], "programs": ["CSUTLDTC"]}, {"key": "claude/util/05/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If CEEDAYS returns a non-zero feedback token, then the system shall treat the date as invalid and set a specific result text such as 'Datevalue error', 'Insufficient', 'Invalid Era', 'Unsupp. Range', 'Invalid month', 'Bad Pic String', 'Nonnumeric data', 'YearInEra is 0' or, for any other token, 'Date is invalid'.", "capability": "claude/util/05#2", "function": "claude/util/05", "rules": ["claude/RULE-126"], "sources": ["app/cbl/CSUTLDTC.cbl:103-149"], "programs": ["CSUTLDTC"]}, {"key": "claude/util/05/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return only the pass/fail verdict to the caller and shall not return the converted Lilian day number.", "capability": "claude/util/05#2", "function": "claude/util/05", "rules": ["claude/RULE-126"], "sources": ["app/cbl/CSUTLDTC.cbl:103-149"], "programs": ["CSUTLDTC"]}, {"key": "claude/util/05/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return an 80-character result whose first 4 characters are the severity and characters 16-19 are the message number, and shall set the program return code to the severity.", "capability": "claude/util/05#2", "function": "claude/util/05", "rules": ["claude/RULE-234"], "sources": ["app/cbl/CSUTLDTC.cbl:88-100"], "programs": ["CSUTLDTC"]}, {"key": "claude/util/05/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the validator returns, callers shall accept the date when severity is '0000', and otherwise accept it only when the message number is '2513' (unsupported range).", "capability": "claude/util/05#2", "function": "claude/util/05", "rules": ["claude/RULE-234"], "sources": ["app/cbl/CSUTLDTC.cbl:88-100", "CORPT00C.cbl:396-399", "COTRN02C.cbl:397-400"], "programs": ["CSUTLDTC"]}, {"key": "claude/util/06/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the wait step (COBSWAIT, calling MVSWAIT) runs, the system shall pause for the number of hundredths of a second given in the SYSIN parameter and then end normally with return code 0.", "capability": "claude/util/06#1", "function": "claude/util/06", "rules": ["claude/RULE-248"], "sources": ["app/cbl/COBSWAIT.cbl:34-40"], "programs": ["COBSWAIT"]}, {"key": "claude/util/06/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "State-driven", "text": "While the SYSIN value is 0, the system shall not wait.", "capability": "claude/util/06#1", "function": "claude/util/06", "rules": ["claude/RULE-248"], "sources": ["app/cbl/COBSWAIT.cbl:34-40"], "programs": ["COBSWAIT"]}, {"key": "claude/util/06/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept a pause of up to 99,999,999 centiseconds and shall not validate a non-numeric or blank SYSIN value before using it.", "capability": "claude/util/06#1", "function": "claude/util/06", "rules": ["claude/RULE-248"], "sources": ["app/cbl/COBSWAIT.cbl:34-40"], "programs": ["COBSWAIT"]}], "rules": [{"key": "claude/RULE-001", "function": "claude/auth/01", "id": "RULE-001", "name": "Available credit check (insufficient funds decline)", "text": "Given Card is in the cross-reference, the account has a pending-auth summary with credit limit $5,000.00 and credit balance $4,800.00\nWhen An authorization request for $250.00 is processed\nThen Available amount = 5,000.00 - 4,800.00 = $200.00. Since 250.00 > 200.00 the auth is declined with reason INSUFFICIENT-FUND. A request for exactly $200.00 would be approved, because the check is strictly greater-than.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-011"], "priority": "P0", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683", "plain": "An authorization is declined for insufficient funds when the requested amount is greater than available credit. Available credit is the pending-authorization summary's credit limit minus its credit balance, or the account master's credit limit minus its current balance when no summary exists yet.", "defect": "WS-PAUT-SMRY-SEG-FLG, WS-CUST-MASTER-READ-FLG and WS-DECLINE-REASON-FLG are never reset between messages in the 500-message loop. When the card is not in the xref, 5500 is skipped, so FOUND-PAUT-SMRY-SEG can still be set from the previous message. The decision then uses the previous account's summary limit and balance, and could APPROVE a card that is not in the cross-reference. Those auths are also never persisted (8000 is skipped)."}, {"key": "claude/RULE-002", "function": "claude/auth/01", "id": "RULE-002", "name": "Pending authorization summary update", "text": "Given Existing summary: credit balance $1,000.00, approved count 3, approved amount $600.00. Account master credit limit $5,000.00\nWhen A $200.00 auth is approved\nThen Credit limit is set to 5,000.00. Approved count becomes 4, approved amount 800.00, credit balance 1,200.00, cash balance 0. The segment is replaced (REPL).", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-020", "REQ-F-021", "REQ-F-022", "REQ-F-023", "REQ-F-024"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834", "plain": "After each authorization for a known card, the account's pending-auth summary is updated or created. Its credit and cash limits are refreshed from the account master. Approved auths increase the approved count and amount and add the approved amount to the credit balance. Declined auths increase the declined count and amount.", "defect": "On decline the code adds PA-TRANSACTION-AMT (the detail-segment field) to PA-DECLINED-AUTH-AMT. That field is only filled for the current request later, in 8500, so the declined amount is the PREVIOUS message's transaction amount (or uninitialized on the first message). It should probably use WS-TRANSACTION-AMT. Also, resetting PA-CASH-BALANCE to 0 on every approval looks unintended."}, {"key": "claude/RULE-003", "function": "claude/posting/03", "id": "RULE-003", "name": "Monthly interest per transaction-category balance", "text": "Given An account's transaction-category balance (type 01, category 0001) of $1,000.00, with a disclosure-group annual rate of 24.99\nWhen The interest calculation batch processes that category balance record\nThen Monthly interest = 1000.00 x 24.99 / 1200 = 20.825, stored as $20.82 (truncated to cents, not rounded, because there is no ROUNDED clause). The amount is added to the account's running total and written as a separate interest transaction.", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-003", "REQ-F-006"], "priority": "P0", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBACT04C.cbl:462-470", "plain": "For each transaction-category balance of an account, monthly interest equals the category balance times the annual rate (a percentage) divided by 1200, and the amounts are added up into the account's total interest for the cycle.", "defect": "No ROUNDED clause, so fractions of a cent are always dropped. That may not match the disclosed APR calculation method. Negative balances also earn negative interest (credit), which may not be intended."}, {"key": "claude/RULE-004", "function": "claude/posting/01", "id": "RULE-004", "name": "Post transaction amount to account balance and cycle credit/debit", "text": "Given An account with current balance $1,200.00, cycle credit $300.00, cycle debit -$50.00\nWhen A transaction of $75.25 posts, followed by a transaction of -$100.00\nThen After the first: balance $1,275.25, cycle credit $375.25; after the second: balance $1,175.25, cycle debit -$150.00 (the negative amount is added, so the debit bucket grows more negative)", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"], "priority": "P0", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBTRN02C.cbl:545-560", "plain": "For each valid transaction, the signed amount is added to the account's current balance, and also to the current-cycle credit bucket if zero or positive or to the current-cycle debit bucket if negative.", "defect": "Reason 109 on account rewrite failure is set after posting decisions are made and is never acted on: the category balance and transaction record are still committed, leaving the account master out of sync with no reject recorded."}, {"key": "claude/RULE-005", "function": "claude/account/02", "id": "RULE-005", "name": "Persisted record formatting and account record layout", "text": "Given An operator changes the account group ID to 'GOLD' on an account whose ZIP is '10001'\nWhen The update is saved\nThen Because the local ACCT-UPDATE-RECORD has no ACCT-ADDR-ZIP field, 'GOLD' is written into the account ZIP position and the real group-ID position is filled from FILLER", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-049", "REQ-F-050"], "priority": "P0", "category": "Calculation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:418-433", "plain": "On save, entered dates are stored as 'YYYY-MM-DD', phones as '(AAA)BBB-CCCC', and amounts as signed 2-decimal values. The account record is rebuilt from a local layout that is supposed to match the account master.", "defect": "The account record layout is misaligned. Every save shifts the group ID into the account ZIP field and loses the original ACCT-ADDR-ZIP and the group ID in its proper slot. This is data corruption on every account update."}, {"key": "claude/RULE-006", "function": "claude/txn/01", "id": "RULE-006", "name": "Bill payment pays the full current account balance", "text": "Given Account 00000000011 has a current balance of $1,250.75 and the user has confirmed payment with 'Y'\nWhen The bill payment is processed\nThen A payment transaction for $1,250.75 is written, and the account's current balance is rewritten as $1,250.75 - $1,250.75 = $0.00", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-016", "REQ-F-017", "REQ-N-001"], "priority": "P0", "category": "Calculation", "confidence": "High", "source": "app/cbl/COBIL00C.cbl:224-235", "plain": "An online bill payment always pays the account's entire current balance. The payment amount equals the balance, and the balance is then reduced by that amount, so it becomes zero.", "defect": "TRAN-AMT (9 integer digits) is narrower than ACCT-CURR-BAL (10 integer digits), so balances of $1 billion or more are silently truncated in the payment record and the balance is not fully cleared."}, {"key": "claude/RULE-007", "function": "claude/auth/04", "id": "RULE-007", "name": "Reverse summary totals for purged authorizations", "text": "Given An account summary with approved count 3 and approved amount $450.00, and an expired detail with response code '00' and approved amount $120.00\nWhen The detail qualifies for purge\nThen The approved count becomes 2 and the approved amount becomes $330.00. If the response code had been '51' with a transaction amount of $80.00, the declined count would drop by 1 and the declined amount by $80.00.", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:287-293", "plain": "When an expired authorization is purged, it is removed from its account's pending summary. An approved one reduces the approved count by 1 and the approved amount by its approved amount. A declined one reduces the declined count by 1 and the declined amount by its transaction amount.", "defect": "The summary segment is changed only in working storage and is never written back (there is no DLI REPL). So when the summary is kept, the reduced counts and amounts are never saved, and the stored totals still include purged authorizations."}, {"key": "claude/RULE-008", "function": "claude/auth/01", "id": "RULE-008", "name": "Inverted date/time key for detail records (newest first)", "text": "Given The system clock reads Julian date 26327 (YYDDD) and time 14:30:15.123\nWhen The detail key is computed\nThen Date key = 99999 - 26327 = 73672. Time key = 999999999 - (143015*1000 + 123) = 999999999 - 143015123 = 856984876.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-029", "REQ-F-030"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:857-875", "plain": "The detail record key is built from the processing timestamp subtracted from all-nines, so that the newest authorizations sort first.", "defect": ""}, {"key": "claude/RULE-009", "function": "claude/auth/02", "id": "RULE-009", "name": "Authorization approved/declined indicator derived from response code", "text": "Given Two pending authorizations with response codes '00' and '05'\nWhen They are displayed in the list\nThen The first shows approval status 'A' and the second shows 'D'.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:536-540", "plain": "Each listed authorization is shown as Approved ('A') only when its response code is '00'; any other response code is shown as Declined ('D').", "defect": ""}, {"key": "claude/RULE-010", "function": "claude/auth/02", "id": "RULE-010", "name": "Account pending-authorization totals come from the summary record, defaulting to zero", "text": "Given Account 00000000001 has a summary with 3 approved ($450.00), 1 declined ($75.00), credit balance $1,200.00, cash balance $50.00\nWhen The account details are gathered\nThen Approved count 003, declined count 001, approved amount 450.00, declined amount 75.00, credit balance 1200.00 and cash balance 50.00 are displayed; with no summary record all are 0.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:785-807", "plain": "The screen shows the account's approved and declined authorization counts and amounts plus credit and cash balances straight from the pending-authorization summary record for that account; if the account has no summary record, all six figures show zero.", "defect": "Display fields are smaller than the stored values: counts are S9(4) shown in 9(03), so 1,000 or more drops the leading digit; approved/declined amounts and cash balance are S9(9)V99 shown in -zzzz9.99, so amounts of $100,000.00 or more lose their high-order digits (e.g. 123,456.78 shows as 23456.78)."}, {"key": "claude/RULE-011", "function": "claude/auth/02", "id": "RULE-011", "name": "Decline reason code to description lookup", "text": "Given An authorization with reason code PA-AUTH-RESP-REASON = '4100'\nWhen The authorization details are displayed\nThen The reason field shows '4100-INSUFFICNT FUND'. A reason code '7777' (not in the table) shows '9999-ERROR'.", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-032", "REQ-F-033", "REQ-N-003"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:319-328", "plain": "The 4-digit authorization reason code is translated into a short description from a fixed table; codes not in the table are shown as '9999-ERROR'.", "defect": ""}, {"key": "claude/RULE-012", "function": "claude/auth/03", "id": "RULE-012", "name": "Rebuild the authorization timestamp from the inverted IMS key", "text": "Given PA-AUTH-ORIG-DATE = '250209' and PA-AUTH-TIME-9C = 856984876\nWhen The fraud record is prepared\nThen The time = 999999999 - 856984876 = 143015123, giving AUTH_TS text '25-02-09 14.30.15123000', which is parsed with 'YY-MM-DD HH24.MI.SSNNNNNN'", "program": "COPAUS2C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:103-114", "plain": "The authorization timestamp used as the fraud record key is built from the original authorization date (YYMMDD) and the time recovered from the inverted IMS key: time = 999999999 - stored time key, in HHMMSSmmm format.", "defect": ""}, {"key": "claude/RULE-013", "function": "claude/trantype/01", "id": "RULE-013", "name": "Description filter is a substring (contains) match", "text": "Given The description filter is 'Pay'\nWhen The list is read\nThen The forward, backward and count queries use TR_DESCRIPTION LIKE '%Pay%', so 'Payment' and 'Bill Pay' match", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-005"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1142-1178", "plain": "A description filter finds transaction types whose description contains the entered text, using SQL LIKE '%text%'.", "defect": ""}, {"key": "claude/RULE-014", "function": "claude/trantype/01", "id": "RULE-014", "name": "Paging through transaction types, 7 rows per page in type-code order", "text": "Given There are 10 type codes 01-10 and page 1 shows 01-07\nWhen The user presses F8\nThen Page 2 starts at the stored last key (TR_TYPE >= '08') and shows 08-10, the next-page indicator is off, and a further F8 shows 'No more pages to display'. F7 reads TR_TYPE < first key in descending order and fills rows 7 down to 1", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1799", "plain": "The list shows 7 transaction types per page in ascending type-code order. F8 pages forward, F7 pages back, and the program reads one extra row to find out whether a next page exists.", "defect": "The page counter is PIC 9(1), so it wraps after page 9. Also, if a backward read finds fewer than 7 rows, rows 1..n stay low-values and WS-CA-FIRST-TR-CODE is not refreshed."}, {"key": "claude/RULE-015", "function": "claude/vsammq/02", "id": "RULE-015", "name": "System date/time inquiry reply content", "text": "Given A request message is on the triggering input queue and the CICS clock reads 23 Nov 2026 14:05:09\nWhen The service processes the request\nThen The reply text is 'SYSTEM DATE : 11-23-2026SYSTEM TIME : 14:05:09' padded with spaces to 1000 bytes (no separator between the date and the no cycle debit", "text": "Given An account with ACCT-CURR-CYC-DEBIT = 0.00\nWhen The extract record is built\nThen OUT-ACCT-CURR-CYC-DEBIT = 2525.00", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBACT01C.cbl:236-238", "plain": "If the account's current-cycle debit is zero, the extract writes a hardcoded 2,525.00 as the cycle debit; otherwise the program never copies the real cycle debit into the extract.", "defect": "There is no ELSE branch that moves ACCT-CURR-CYC-DEBIT to OUT-ACCT-CURR-CYC-DEBIT, so accounts with a non-zero debit get a stale or uninitialized value. Substituting 2,525.00 for zero also looks like test-data seeding, not a business rule."}, {"key": "claude/RULE-018", "function": "claude/util/01", "id": "RULE-018", "name": "Global export sequence number across all record types", "text": "Given There are 50 customers and 60 accounts\nWhen The export writes the first account record\nThen Its EXPORT-SEQUENCE-NUM is 51 (it carries on after the last customer, number 50). The last account gets 110", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:276-277", "plain": "Each exported record gets a unique sequence number. The number starts at 1 and goes up by 1 across all record types for the whole run. It is the key of the export file.", "defect": ""}, {"key": "claude/RULE-019", "function": "claude/stmt/01", "id": "RULE-019", "name": "Statement total = signed sum of the card's transaction amounts", "text": "Given A card 4111000011112222 with three transactions in the extract: $120.50, $45.25 and a refund of -$20.00\nWhen The statement for that card cross-reference record is produced\nThen Each transaction is printed on its own line and the total line shows rements": ["REQ-F-005", "REQ-F-014", "REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-N-003"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBTRN03C.cbl:181-188", "plain": "Transactions are subtotaled per card number; when the card number changes from the previous transaction, the accumulated total for the previous card is printed and reset to zero.", "defect": "The final card's account subtotal is never printed at end of file; also the subtotal is keyed by card number rather than account ID despite the 'account total' label."}, {"key": "claude/RULE-022", "function": "claude/report/02", "id": "RULE-022", "name": "Page total and grand total accumulation", "text": "Given Page 1 transactions sum to $1,000.00 and page 2 transactions sum to $250.00\nWhen Page totals are written at each page break and at end of file\nThen Page total lines show +1,000.00 and +250.00 and the grand total line shows +1,250.00", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-N-003"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBTRN03C.cbl:282-304", "plain": "Each printed transaction amount is added to the running page total; whenever a page total is printed it is rolled into the grand total and reset to zero, so the grand total equals the sum of all printed page totals.", "defect": "EOF branch line 200-201 'ADD TRAN-AMT TO WS-PAGE-TOTAL WS-ACCOUNT-TOTAL' re-adds the last transaction amount (TRAN-AMT still holds the last record after the EOF read), overstating the final page total and the grand total by that amount."}, {"key": "claude/RULE-023", "function": "claude/account/02", "id": "RULE-023", "name": "Monetary amount entry parsing and validation", "text": "Given An account fetched for edit\nWhen The operator enters a credit limit of '$5,000.00', a cash limit of '-100', or a balance of '12a'\nThen '$5,000.00' -> 5000.00; '-100' -> -100.00 (accepted, because there is no sign or range check); '12a' -> 'Credit Limit is not valid'-style error ('<field> is not valid'); blank or '*' -> '<field> must be supplied.'", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1072-1140", "plain": "Credit limit, cash credit limit, current balance, and current-cycle credit and debit totals are entered as free text, accepted in any currency-style numeric format, and stored as signed amounts with 2 decimals. Each is required.", "defect": "Operators can overwrite the current balance and cycle credit/debit totals directly, with no matching transaction record and no range or relationship checks (for example cash limit greater than credit limit, or a negative limit)."}, {"key": "claude/RULE-024", "function": "claude/card/01", "id": "RULE-024", "name": "Forward paging: 7 cards per page with look-ahead for next page", "text": "Given 12 matching cards and the user is on page 1\nWhen The user presses PF8 (next page exists)\nThen Page number becomes 2, browsing starts at the last-remembered key (greater than or equal), and up to 7 matching cards are shown; next-page flag is set only if another record follows the 7th.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-011"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:1123-1263", "plain": "The list shows up to 7 matching cards per page starting at the saved key; after filling 7 rows it reads one more record to decide whether a next page exists, and remembers the first and last keys for paging.", "defect": "The look-ahead record (lines 1197-1214) is not passed through the filter, so with a filter active the system may advertise another page that turns out empty."}, {"key": "claude/RULE-025", "function": "claude/card/01", "id": "RULE-025", "name": "Backward paging and first-page guard", "text": "Given The user is on page 2 whose first card is 4111000000000008\nWhen They press PF7\nThen Page number becomes 1; the record at the first key is skipped, the previous 7 matching cards are placed in rows 7 down to 1, and the first-card key is updated to row 1's card.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-015"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COCRDLIC.cbl:501-513", "plain": "PF7 goes back one page by reading backwards from the current page's first card and filling the 7 rows bottom-up; on page 1 it simply redisplays page 1 with 'NO PREVIOUS PAGES TO DISPLAY'.", "defect": "READPREV end-of-file is treated as a generic file error (lines 1361-1369), and the screen number can be decremented independently of what records are actually found."}, {"key": "claude/RULE-026", "function": "claude/report/01", "id": "RULE-026", "name": "Monthly report date range = current calendar month", "text": "Given Today's system date is 2024-02-14\nWhen The user selects Monthly and confirms\nThen The batch job gets start date 2024-02-01 and end date 2024-02-29. The end date is found by taking the first day of the next month and subtracting one day. In December the next month rolls over to January of the next year, so 2024-12-10 gives 2024-12-01 to 2024-12-31", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CORPT00C.cbl:213-238", "plain": "The Monthly report covers the whole current calendar month, from the 1st to the last day of the month, based on the system date when the request is made.", "defect": ""}, {"key": "claude/RULE-027", "function": "claude/report/01", "id": "RULE The user presses PF8\nThen The browse restarts at ID 10, skips that already-shown record, fills rows with IDs 11-20, page number becomes 2, and a look-ahead read finds ID 21 so next-page flag stays Y. Another PF8 shows IDs 21-25, page 3, with rows 6-10 blank and next-page flag N.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COTRN00C.cbl:279-328", "plain": "The list shows transactions in transaction-ID order, 10 per page; the page number goes up by one for each page shown, and the system reads one extra record to decide whether a next page exists.", "defect": ""}, {"key": "claude/RULE-030", "function": "claude/txn/03", "id": "RULE-030", "name": "Transaction amount format and conversion", "text": "Given Amount entered as '+00000125.50'\nWhen The screen is validated and the transaction is built\nThen The amount is accepted and stored as 125.50 (TRAN-AMT, S9(9)V99). An entry of '125.50' is rejected with 'Amount should be in format -99999999.99'", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:339-386", "plain": "The amount must be entered as a sign, 8 digits, a decimal point and 2 decimals (for example -00000050.00 or +00001234.56). It is then converted to a signed number with two decimal places.", "defect": ""}, {"key": "claude/RULE-031", "function": "claude/txn/01", "id": "RULE-031", "name": "New transaction ID = highest existing ID + 1", "text": "Given The highest key in TRANSACT is '0000000000001234'\nWhen A confirmed transaction is added\nThen The new transaction ID is 0000000000001235 (16-digit numeric, zero-padded)", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-023", "REQ-F-022", "REQ-F-025", "REQ-F-026", "REQ-N-001"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COTRN02C.cbl:442-451", "plain": "The new transaction's ID is the last (highest) transaction ID in the transaction file plus one. If the file is empty, the first ID is 1.", "defect": "Computing the next ID as max+1 without a lock is a race condition: concurrent adds collide and the user must re-submit. The ID space is also limited to 16 digits with no overflow check."}, {"key": "claude/RULE-032", "function": "claude/useradmin/01", "id": "RULE-032", "name": "Backward paging with top-of-list guard and page decrement", "text": "Given The operator is on page 3, showing users 21-23\nWhen The operator presses PF7\nThen Browse starts at user 21, reads backward skipping it, fills rows 10 down to 1 with users 20..11, then a further backward read finds user 10, so page becomes 2 (if that read hits start-of-file, page is set to 1); next-page is set to Y", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015", "REQ-F-016"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COUSR00C.cbl:237-255", "plain": "PF7 shows the 10 users before the current page and decreases the page number, but is refused on page 1 with 'You are already at the top of the page...'.", "defect": "If fewer than 10 earlier records exist, the page number is not corrected and the shown rows are shifted toward the bottom with blank top rows. The first-user anchor can also be wrong because slot 1 may not be filled."}, {"key": "claude/RULE-033", "function": "claude/useradmin/01", "id": "RULE-033", "name": "Forward paging: 10 users per page with look-ahead next-page flag", "text": "Given The user file holds 23 users and the operator is on page 1 (last shown user is the 10th)\nWhen The operator presses PF8\nThen Browse restarts at the 10th user ID, skips it, shows users 11-20, page becomes 2, and one extra read finds user 21 so next-page = Y; a further PF8 shows users 21-23, page becomes 3, next-page = N", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COUSR00C.cbl:282-331", "plain": "Each page shows up to 10 users in user ID order; the page number goes up by 1 when a page has at least one user, and a look-ahead read decides whether a next page exists.", "defect": "If PF8 reaches a page with zero records, the page number stays the same and the earlier row contents may stay on screen. The end-of-file paragraph also sends the screen before the final send, so the screen can be sent twice."}, {"key": "claude/RULE-034", "function": "claude/auth/02", "id": "RULE-034", "name": "Authorization origin date and time display conversion", "text": "Given An authorization with original date '251123' and time '143005'\nWhen It is listed\nThen Date shows '11/23/25' and time shows '14:30:05'.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:525-534", "plain": "The stored authorization date (YYMMDD) is shown as MM/DD/YY and the stored time (HHMMSS) as HH:MM:SS.", "defect": ""}, {"key": "claude/RULE-035", "function": "claude/auth/02", "id": "RULE-035", "name": "Authorization detail display formatting (dates, time, amount, expiry, fraud status)", "text": "Given An authorization with orig date '251123', orig time '143005', approved amount 1250.50, expiry '0927' and fraud flag 'F' reported '11/23/25'\nWhen The details are displayed\nThen Date '11/23/25', time '14:30:05', amount '    1250.50', expiry '09/27', fraud 'F-11/23/25'; an authorization with no fraud flag shows fraud '-'.", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-030", "REQ-F-031"], "priority": "P2", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:294-357", "plain": "Stored authorization values are reformatted for display: original date YYMMDD becomes MM/DD/YY, time HHMMSS becomes HH:MM:SS, card expiry MMYY becomes MM/YY, the approved amount (not the requested amount) is shown signed with 2 decimals, and the fraud field shows the fraud flag and report date or '-' if never tagged.", "defect": ""}, {"key": "claude/RULE-036", "function": "claude/util/03", "id": "RULE-036", "name": "Balance array record built with fixed test amounts", "text": "Given An account ID 00000000001 with current balance 1,250.00\nWhen The array record is built (after INITIALIZE)\nThen Slot1 = (1250.00, 1005.00), Slot2 = (1250.00, 1525.00), Slot3 = (-1025.00, -2500.00), Slots 4-5 = (0, 0)", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008"], "priority": "P2", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBACT01C.cbl:253-261", "plain": "For each account, an array-format record is written with the account ID and 5 balance/debit slots: slots 1 and 2 hold the real current balance with fixed debits of 1,005.00 and 1,525.00, slot 3 holds fixed -1,025.00 / -2,500.00, and slots 4 and 5 are zero.", "defect": "The amounts are hardcoded constants, not derived from account data. This looks like sample-data generation for testing OCCURS and COMP-3 layouts."}, {"key": "claude/RULE-037", "function": "claude/util/03", "id": "RULE-037", "name": "Split account into two variable-length records", "text": "Given Account 00000000001, status 'Y', balance 1,250.00, limit 5,000.00, reissue date '2025-03-15'\nWhen The variable-length records are produced\nThen Record 1 (length 12) = ID + 'Y'; Record 2 (length 39) = ID + 1250.00 + 5000.00 + '2025'", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBACT01C.cbl:276-315", "plain": "For each account, two variable-length records are written: a 12-byte status record (ID + active status) and a 39-byte balance record (ID, current balance, credit limit, and reissue year).", "defect": ""}, {"key": "claude/RULE-038", "function": "claude/util/01", "id": "RULE-038", "name": "Single run timestamp stamped on every export record", "text": "Given The job starts on 2025-10-16 at 14:07:18.57\nWhen Export records are built\nThen Every record has EXPORT-TIMESTAMP = '2025-10-16 14:07:18.00'. The hundredths are always written as '00', and the rest of the 26-character field is blank", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:172-195", "plain": "The system clock is read once when the run starts. That one timestamp, in the form 'YYYY-MM-DD HH:MM:SS.00', goes on every exported record.", "defect": ""}, {"key": "claude/RULE-039", "function": "claude/util/01", "id": "RULE-039", "name": "Export reconciliation counts per record type and in total", "text": "Given 50 customers, 60 accounts, 70 xrefs, 10,000 transactions and 70 cards are written\nWhen The export finishes\nThen The report shows Customers=50, Accounts=60, XRefs=70, Transactions=10,000, Cards=70 and Total=10,250. The total also equals the last sequence number", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:554-573", "plain": "The export counts the records written for each type, and the grand total equals the sum of the five counts. Both are reported at the end for reconciliation.", "defect": ""}, {"key": "claude/RULE-040", "function": "claude/util/02", "id": "RULE-040", "name": "Import run statistics and reconciliation counts", "text": "Given An export file with 10 C, 12 A, 15 X, 40 T, 15 D and 2 unknown records\nWhen The import completes\nThen Displayed totals are Read=94, Customers=10, Accounts=12, XRefs=15, Transactions=40, Cards=15, Errors=2, Unknown=2", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBIMPORT.cbl:455-478", "plain": "At the end of a successful run the job reports total records read and counts per type (customers, accounts, xrefs, transactions, cards), plus errors written and unknown record types; total read should equal the sum of the five imported counts plus unknown types.", "defect": ""}, {"key": "claude/RULE-041", "function": "claude/txn/02", "id": "RULE-041", "name": "Transaction row display format (date and amount)", "text": "Given A transaction with origination timestamp '2022-07-19-23.12.34.000000' and amount -125.50\nWhen It is placed on the list\nThen The date shows as 07/19/22 and the amount shows as -00000125.50", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-N-001"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:381-388", "plain": "Each listed transaction shows its ID, its origination date as MM/DD/YY, its description, and its amount as a signed number with 2 decimals.", "defect": "TRAN-AMT holds up to 9 integer digits but the display mask has only 8, so amounts of 100,000,000.00 or more lose the leading digit on screen."}, {"key": "claude/RULE-042", "function": "claude/txn/02", "id": "RULE-042", "name": "Transaction amount displayed as signed value with 8 integer digits", "text": "Given A transaction with stored amount -125.50\nWhen The transaction is displayed\nThen The amount field shows -00000125.50 (edit mask +99999999.99)", "program": "COTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001", "REQ-F-028"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/COTRN01C.cbl:176-183", "plain": "The stored transaction amount is shown on screen with an explicit sign and two decimals, e.g. +00000125.50.", "defect": "High-order truncation: a stored amount of 123,456,789.00 would display as +23456789.00."}, {"key": "claude/RULE-043", "function": "claude/posting/01", "id": "RULE-043", "name": "Over-credit-limit rejection", "text": "Given An account with credit limit $5,000.00, current-cycle credit $4,800.00, current-cycle debit $0.00, and a daily transaction of $250.00\nWhen The posting batch validates the transaction\nThen Projected balance = 4,800.00 - 0.00 + 250.00 = $5,050.00 > $5,000.00, so the transaction is rejected with reason 0102 'OVERLIMIT TRANSACTION'. With a $200.00 transaction the projection is exactly $5,000.00 and it passes (limit >= projection).", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-005"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CBTRN02C.cbl:403-413", "plain": "A transaction is rejected as over-limit when the account's current-cycle credits minus current-cycle debits plus the transaction amount would exceed the account's credit limit.", "defect": "Cycle debits are accumulated as negative values (line 551), so 'CYC-CREDIT - CYC-DEBIT' adds payments to exposure rather than subtracting them. Also WS-TEMP-BAL (S9(09)V99) is one digit narrower than the account fields (S9(10)V99), so balances >= $1,000,000,000 would be silently truncated in the comparison."}, {"key": "claude/RULE-044", "function": "claude/signon/03", "id": "RULE-044", "name": "Admin menu does not itself verify that the user is an admin", "text": "Given Session data where CDEMO-USER-TYPE = 'U' (regular user) and the user reaches transaction CA00\nWhen The Admin Menu runs and the user selects option 1 (user list)\nThen The program does not check the user type and transfers to the user-security maintenance program COUSR00C", "program": "COADM01C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COADM01C.cbl:86-109", "plain": "The Admin Menu accepts any caller that has session data. It never checks that the user type is 'A', so admin-only access depends entirely on sign-on routing only admins to it.", "defect": "There is no authorization check in the admin menu. A regular user with a valid session who starts CA00 directly, or is routed to it, could reach user maintenance and transaction-type maintenance."}, {"key": "claude/RULE-045", "function": "claude/card/02", "id": "RULE-045", "name": "Card lookup is by card number only; account is not matched", "text": "Given Validated account 00000000001 and card number 4111111111111111 that actually belongs to account 00000000099\nWhen The card master (CARDDAT) is read by the 16-digit card number\nThen Found: message '   Displaying requested details' and the screen shows embossed name, expiry month and year, and active status. Not found: input error, both fields red, 'Did not find cards for this search condition'. Other read failure: input error and 'File Error: READ on CARDDAT returned RESP ...,RESP2 ...'", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P0", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDSLC.cbl:736-773", "plain": "Once inputs pass, the card is fetched from the card master by card number alone, and the details are shown even if the card belongs to a different account than the one entered.", "defect": "No check that the found card's account matches the account entered, so a user can view a card under any account number; the account criterion is effectively ignored. | Account id on the screen is never validated against CARD-ACCT-ID, and 9200 writes CC-ACCT-ID-N into CARD-UPDATE-ACCT-ID (line 1463), so a card can be silently re-pointed to a different (possibly non-existent) account."}, {"key": "claude/RULE-046", "function": "claude/signon/03", "id": "RULE-046", "name": "Regular users cannot run admin-only menu options", "text": "Given Session user type CDEMO-USER-TYPE = 'U' and the selected Main Menu option has user type 'A'\nWhen The user presses Enter on that option\nThen The error flag is set, 'No access - Admin Only option... ' is shown and no transfer happens. Admin users (type 'A') can select any option", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002"], "priority": "P0", "category": "Validation", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:136-143", "plain": "A regular user (type 'U') who picks a Main Menu option marked admin-only ('A') gets 'No access - Admin Only option...' and is not taken to that function.", "defect": "The admin-only check is not skipped when the option number is invalid. For option 00 or a value above the table size, it reads CDEMO-MENU-OPT-USRTYPE out of bounds and can send the screen twice. Also, no option is flagged 'A', so the control is effectively dormant."}, {"key": "claude/RULE-047", "function": "claude/signon/01", "id": "RULE-047", "name": "Credential authentication against the user security file (case-insensitive)", "text": "Given User 'admin01' enters password 'pass1234' and the USRSEC record for key 'ADMIN01' has password 'PASS1234'\nWhen Enter is pressed and both fields are non-blank\nThen The User ID is upper-cased to 'ADMIN01' and used as the file key; the entered password is upper-cased to 'PASS1234' and matches, so sign-on succeeds", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-N-001", "REQ-N-003"], "priority": "P0", "category": "Validation", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:209-257", "plain": "The user is signed on only if a record with the entered User ID exists in the USRSEC file and its stored password equals the entered password, with both entered values converted to upper case first.", "defect": "Passwords are stored and compared in clear text, and upper-casing the input makes passwords case-insensitive (and makes any stored lower-case password unusable). Also no attempt counter or lockout exists (see separate rule)."}, {"key": "claude/RULE-048", "function": "claude/useradmin/02", "id": "RULE-048", "name": "User ID must be unique when adding a user", "text": "Given User ID 'ADMIN001' already exists in the USRSEC file\nWhen an administrator submits a new user with User ID 'ADMIN001'\nThen the write is rejected, the message 'User ID already exist...' is shown, the cursor goes to User ID, and the existing record is unchanged; for a new ID the record is written, the form is cleared and 'User <id> has been added ...' is shown in green", "program": "COUSR01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P0", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR01C.cbl:238-274", "plain": "A user is created only if no existing security record has the same user ID; a duplicate is rejected without overwriting the existing user.", "defect": ""}, {"key": "claude/RULE-049", "function": "claude/auth/01", "id": "RULE-049", "name": "Inbound authorization request format", "text": "Given A message '261123,143015,4000123412341234,...,125.75,5411,...,TXN0001'\nWhen The message is parsed\nThen Transaction amount = 125.75, and every other field is mapped to the request layout", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-N-001"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:351-380", "plain": "Each request message is a comma-delimited string of 18 fields, in this order: auth date, auth time, card number, auth type, card expiry, message type, message source, processing code, transaction amount, MCC, acquirer country, POS entry mode, merchant id, name, city, state, zip, transaction id. The amount text is converted with NUMVAL.", "defect": "No input validation at all. Expiry date and negative amounts are accepted."}, {"key": "claude/RULE-050", "function": "claude/auth/01", "id": "RULE-050", "name": "Card must exist in the cross-reference to be authorized and recorded", "text": "Given A request for card 4000000000000099 that is not in CCXREF\nWhen The authorization is processed\nThen Warning A001 'CARD NOT FOUND IN XREF' is logged. The decision normally declines it ('05', reason 3100). The reply is sent, and no summary update or detail insert happens.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-010", "REQ-F-011", "REQ-F-017", "REQ-F-027", "REQ-F-031"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:445-465", "plain": "The card number is looked up in the card cross-reference to find the account and customer. If it is not found, account, customer and summary data are not read, the auth should be declined with reason 3100, a warning is logged, and nothing is written to the pending-authorization database. A reply is still sent.", "defect": ""}, {"key": "claude/RULE-051", "function": "claude/auth/01", "id": "RULE-051", "name": "Decline reason code mapping", "text": "Given A declined authorization where the card was not found in the cross-reference\nWhen The reason code is assigned\nThen PA-RL-AUTH-RESP-REASON = '3100'", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-012", "REQ-F-016"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:698-718", "plain": "Approved auths get reason '0000'. A declined auth gets a reason code from the first matching cause: card, account or customer not found 3100; insufficient funds 4100; card not active 4200; account closed 4300; card fraud 5100; merchant fraud 5200; anything else 9000.", "defect": "WS-DECLINE-REASON-FLG and WS-CUST-MASTER-READ-FLG are not reset per message, so a stale INSUFFICIENT-FUND or NFOUND-CUST value from an earlier message can change the reason code on a later decline."}, {"key": "claude/RULE-052", "function": "claude/auth/02", "id": "RULE-052", "name": "Account ID must be entered and numeric before authorizations are listed", "text": "Given The pending authorization summary screen is displayed\nWhen The user presses Enter with Account ID blank, or with Account ID '12A45678901'\nThen Blank shows 'Please enter Acct Id...'; non-numeric shows 'Acct Id must be Numeric ...'; the working account is cleared, the error flag is set, the cursor goes to Account ID, and the list stays empty. A valid value such as '00000000001' is saved as the current account (also into the shared session area) and the account details and list are reloaded.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-012"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284", "plain": "When the user presses Enter on the pending-authorization summary screen, the Account ID field must be filled in and contain only digits, otherwise an error is shown and no account or authorization data is loaded.", "defect": ""}, {"key": "claude/RULE-053", "function": "claude/auth/02", "id": "RULE-053", "name": "Selecting an authorization opens its detail view", "text": "Given Page shows 5 authorizations and the user types 'S' next to row 3\nWhen Enter is pressed with a valid Account ID\nThen Control passes to the authorization detail program COPAUS1C with row 3's authorization key, the session marked as coming from COPAUS0C/CPVS. If 'X' was typed, the message 'Invalid selection. Valid value is S' is shown and the list is redisplayed.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022", "REQ-F-023", "REQ-F-024"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332", "plain": "The user may mark one listed authorization with 'S' (either case) to open its detail screen; the first marked row from top to bottom wins, and any other selection code is rejected.", "defect": ""}, {"key": "claude/RULE-054", "function": "claude/auth/02", "id": "RULE-054", "name": "Account context resolution: card cross-reference, then account, then customer", "text": "Given A valid numeric Account ID 00000000001 linked to customer 000000001 and card 4111111111111111\nWhen Account details are gathered\nThen Customer ID and card number are saved to the session; name is shown as 'First M Last' (middle initial only); address line 1 is 'Addr1,Addr2', line 2 is 'Addr3,State,Zip5'; credit limit and cash credit limit come from the account master.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963", "plain": "For the entered account, the system finds the card/customer link through the card cross-reference (by account), then reads the account master and the customer master, and shows customer name, address, phone, credit limit and cash credit limit in the header.", "defect": "On NOTFND the error flag is not set, so the program continues to read the account/customer files and the
