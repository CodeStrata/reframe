e system shall accept a blank middle name.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-091"], "sources": ["app/cbl/COACTUPC.cbl:1560-1582"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If a name contains a character other than a letter or space (for example the apostrophe in 'O'Brien', a hyphen or an accented letter), then the system shall reject it with a message such as 'Last Name can have alphabets only.'", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-091"], "sources": ["app/cbl/COACTUPC.cbl:1560-1582"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require address line 1 (50 characters, any characters), a city of letters only, a valid 2-letter US state code, a zip whose first 5 characters are numeric and not zero, and a 3-letter country, and shall not validate address line 2.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-092"], "sources": ["app/cbl/COACTUPC.cbl:1584-1630"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Unwanted", "text": "If the state is not in VALID-US-STATE-CODE (for example 'XX'), then the system shall reject it with 'State: is not a valid state code'.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-092"], "sources": ["app/cbl/COACTUPC.cbl:1584-1630"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Event-driven", "text": "When the state and zip each pass their own edits, the system shall check the state code plus the first 2 zip digits against VALID-US-STATE-ZIP-CD2-COMBO.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-098"], "sources": ["app/cbl/COACTUPC.cbl:2535-2560"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Unwanted", "text": "If the first two zip digits do not belong to the state (for example state 'NY' and zip '90210'), then the system shall reject them with 'Invalid zip code for state' and flag both state and zip.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-098"], "sources": ["app/cbl/COACTUPC.cbl:2535-2560"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the EFT account ID to be a 10-digit number that is not zero, and shall not validate the government-issued ID.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-093"], "sources": ["app/cbl/COACTUPC.cbl:1648-1655"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Unwanted", "text": "If the EFT account ID is not all numeric across its 10 characters (for example '12345' with trailing spaces), then the system shall reject it with 'EFT Account Id must be all numeric.'", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-093"], "sources": ["app/cbl/COACTUPC.cbl:1648-1655"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the Primary Card Holder indicator to be exactly 'Y' or 'N'.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-095"], "sources": ["app/cbl/COACTUPC.cbl:1657-1662"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Optional", "text": "Where Phone Number 1 or Phone Number 2 is entered, the system shall require an area code in the North American general-purpose code list (VALID-GENERAL-PURP-CODE), a non-zero 3-digit prefix and a non-zero 4-digit line number.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-096"], "sources": ["app/cbl/COACTUPC.cbl:2225-2429"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Unwanted", "text": "If the area code is not a valid general-purpose code (for example 123), then the system shall reject it with 'Phone Number 1: Not valid North America general purpose area code' (or the same message for Phone Number 2).", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-096"], "sources": ["app/cbl/COACTUPC.cbl:2225-2429"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-036", "code": "REQ-F-036", "kind": "F", "pattern": "Unwanted", "text": "If only some parts of a phone number are blank, then the system shall report each blank part as must be supplied.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-096"], "sources": ["app/cbl/COACTUPC.cbl:2225-2429"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-037", "code": "REQ-F-037", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the SSN in three numeric, non-zero parts: part 1 of 3 digits that is not 000, 666 or 900-999, part 2 of 2 digits that is not 00, and part 3 of 4 digits that is not 0000.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-097"], "sources": ["app/cbl/COACTUPC.cbl:2431-2491"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-038", "code": "REQ-F-038", "kind": "F", "pattern": "Unwanted", "text": "If SSN part 1 is 000, 666 or between 900 and 999, then the system shall reject it with 'SSN: First 3 chars: should not be 000, 666, or between 900 and 999', and if a part is all zeros or non-numeric, then the system shall reject it as 'must not be zero' or 'must be all numeric'.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-097"], "sources": ["app/cbl/COACTUPC.cbl:2431-2491"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-039", "code": "REQ-F-039", "kind": "F", "pattern": "State-driven", "text": "While an error message is already set by an earlier edit, the system shall keep that first message and only mark later failures as input errors.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-095"], "sources": ["app/cbl/COACTUPC.cbl:1856-1893"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-040", "code": "REQ-F-040", "kind": "F", "pattern": "Event-driven", "text": "When no details have been fetched and a valid account ID is entered, the system shall read the account and move to stage S (details shown).", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-041", "code": "REQ-F-041", "kind": "F", "pattern": "State-driven", "text": "While in stage S, when the edits find no errors and some change, the system shall move to stage N and prompt 'Changes validated.Press F5 to save'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-042", "code": "REQ-F-042", "kind": "F", "pattern": "State-driven", "text": "While in stage E (changes have errors), the system shall stay in that stage and show the error.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-043", "code": "REQ-F-043", "kind": "F", "pattern": "Complex", "text": "While in stage N, when the user presses F5, the system shall attempt the save, and when any other key is pressed, the system shall stay in stage N.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-044", "code": "REQ-F-044", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept F5 (save) only in stage N, F12 (cancel) only when account details are fetched, and PF3 at any time, and shall treat any other key as Enter.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-238"], "sources": ["app/cbl/COACTUPC.cbl:905-916"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-045", "code": "REQ-F-045", "kind": "F", "pattern": "Unwanted", "text": "If F5 is pressed outside stage N (for example in stage E), then the system shall treat it as Enter, run the edits again and save nothing.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-238"], "sources": ["app/cbl/COACTUPC.cbl:905-916"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-046", "code": "REQ-F-046", "kind": "F", "pattern": "Event-driven", "text": "When F12 is pressed while an account is loaded, the system shall re-read the account and discard pending edits.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-144", "claude/RULE-238"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-047", "code": "REQ-F-047", "kind": "F", "pattern": "Event-driven", "text": "When PF3 is pressed, the system shall take a SYNCPOINT and transfer control to the calling program, or to the main menu COMEN01C/CM00 if there is no caller.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-238"], "sources": ["app/cbl/COACTUPC.cbl:927-959"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-048", "code": "REQ-F-048", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall highlight the F5 and F12 labels only when those keys apply.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-238"], "sources": ["app/cbl/COACTUPC.cbl:3390-3408"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-049", "code": "REQ-F-049", "kind": "F", "pattern": "Unwanted", "text": "If the stage and key are in any combination not listed, then the system shall end the program with abend code 0001 'UNEXPECTED DATA SCENARIO'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-050", "code": "REQ-F-050", "kind": "F", "pattern": "Event-driven", "text": "When the user presses F5 to save, the system shall lock the account and customer records and check that nobody has changed them since they were shown, comparing account status, balance, limits, cycle totals, dates and group ID, and customer names, address, state, country, zip, phones, SSN, government ID, DOB, EFT ID, primary flag and FICO.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-208"], "sources": ["app/cbl/COACTUPC.cbl:4109-4192"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-051", "code": "REQ-F-051", "kind": "F", "pattern": "Unwanted", "text": "If the account or customer record was changed by someone else since it was shown, then the system shall abandon the save with 'Record changed by some one else. Please review' and return to stage S with the latest values.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-208", "claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:4109-4192"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-052", "code": "REQ-F-052", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall save by locking the account, then locking the customer, then rewriting the account, then rewriting the customer (ACCTDAT and CUSTDAT read with UPDATE).", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-145"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-053", "code": "REQ-F-053", "kind": "F", "pattern": "Unwanted", "text": "If the account lock fails, then the system shall move to stage L with the message 'Could not lock account record for update'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-145", "claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104", "app/cbl/COACTUPC.cbl:2606-2615"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-054", "code": "REQ-F-054", "kind": "F", "pattern": "Unwanted", "text": "If a rewrite fails, then the system shall move to stage F with the message 'Update of record failed'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-145", "claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104", "app/cbl/COACTUPC.cbl:2606-2615"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If the customer rewrite fails, then the system shall roll back the account change (SYNCPOINT ROLLBACK).", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-145"], "sources": ["app/cbl/COACTUPC.cbl:4099-4101"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-055", "code": "REQ-F-055", "kind": "F", "pattern": "Event-driven", "text": "When both rewrites succeed, the system shall move to stage C with the message 'Changes committed to database'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-145", "claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-056", "code": "REQ-F-056", "kind": "F", "pattern": "Event-driven", "text": "When the record is saved, the system shall store dates as YYYY-MM-DD, phones as (AAA)BBB-CCCC, amounts as signed 10.2 numbers and the customer ID unchanged (for example open date 2020/05/01 as '2020-05-01' and phone 212/555/0100 as '(212)555-0100').", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-029", "claude/RULE-096"], "sources": ["app/cbl/COACTUPC.cbl:3956-4059"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-057", "code": "REQ-F-057", "kind": "F", "pattern": "Event-driven", "text": "When the record is saved, the system shall first copy the reissue date from the stored record and then overwrite it with the screen value.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-029"], "sources": ["app/cbl/COACTUPC.cbl:3993-4000"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-058", "code": "REQ-F-058", "kind": "F", "pattern": "State-driven", "text": "While the update is in stage C, L or F, the system shall clear the stage and CDEMO-ACCT-ID on the next interaction and ask for a new account.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:979-989"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-059", "code": "REQ-F-059", "kind": "F", "pattern": "Event-driven", "text": "When an update reaches stage C and there is no calling transaction, the system shall clear the account ID, card number and account status from the commarea.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-144"], "sources": ["app/cbl/COACTUPC.cbl:2625-2632"], "programs": ["COACTUPC"]}, {"key": "claude/card/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat the account ID filter as optional, treating blank (low-values, spaces) or all zeros ('00000000000') as no filter.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-104"], "sources": ["app/cbl/COCRDLIC.cbl:1003-1030"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If a supplied account ID filter is not an 11-digit number, then the system shall raise an input error, flag the filter invalid in red with the cursor on it, protect the selection column, set CDEMO-ACCT-ID to 0, and show 'ACCOUNT FILTER,IF SUPPLIED MUST BE A 11 DIGIT NUMBER'.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-104"], "sources": ["app/cbl/COCRDLIC.cbl:1003-1030"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat the card number filter as optional, treating blank or all zeros ('0000000000000000') as no filter.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-105"], "sources": ["app/cbl/COCRDLIC.cbl:1036-1071"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If a supplied card number filter is not a 16-digit number, then the system shall raise an input error, flag the filter invalid in red with the cursor on it, protect the selection rows, set CDEMO-CARD-NUM to 0, and show 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER' unless an earlier error message is already set.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-105"], "sources": ["app/cbl/COCRDLIC.cbl:1036-1071"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the card file is browsed, the system shall include only cards whose CARD-ACCT-ID equals the account filter (when one is given) and whose card number equals the card filter (when one is given), and skipped cards shall not count toward the page.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-244"], "sources": ["app/cbl/COCRDLIC.cbl:1382-1411"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "State-driven", "text": "While the account and card filters are both blank, the system shall list cards from all accounts in CARDDAT, whatever the signed-on user's type.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-210", "claude/RULE-244"], "sources": ["app/cbl/COCRDLIC.cbl:1382-1407"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When Enter or PF8 triggers a forward read, the system shall fill up to 7 rows in card-number order from the page's start key, save the first card key, and read one more record so that its key becomes the next-page start key and CA-NEXT-PAGE-EXISTS is set to 'Y'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-031"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If end of file is reached after the 7th record, then the system shall set next page to not-exists and show 'NO MORE RECORDS TO SHOW'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-031"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If end of file is reached with 0 rows on page 1, then the system shall show 'NO RECORDS FOUND FOR THIS SEARCH CONDITION.'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-031"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When PF7 is pressed on a page after page 1, the system shall subtract 1 from the page number and show up to 7 earlier matching cards before the current first card.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-031", "claude/RULE-177"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263", "app/cbl/COCRDLIC.cbl:363-583"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When PF7 is pressed on page 1, the system shall redisplay page 1 with 'NO PREVIOUS PAGES TO DISPLAY'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-177"], "sources": ["app/cbl/COCRDLIC.cbl:363-583"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When PF8 is pressed and no next page exists, the system shall redisplay the current page, showing the S/U prompt the first time and 'NO MORE PAGES TO DISPLAY' after that.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-177"], "sources": ["app/cbl/COCRDLIC.cbl:363-583"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall honour only Enter, PF3, PF7 and PF8 on the card list, and shall treat any other key as Enter.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-177"], "sources": ["app/cbl/COCRDLIC.cbl:363-583"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When PF3 is pressed on the card list, the system shall transfer to the main menu COMEN01C with the message 'PF03 PRESSED.EXITING'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-177"], "sources": ["app/cbl/COCRDLIC.cbl:363-583"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the card list starts cold or is entered from another program, the system shall clear the saved first and last keys, set the page to 1, set last-page-shown to not-shown, and read the list from the start of the card file.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-196", "claude/RULE-177"], "sources": ["app/cbl/COCRDLIC.cbl:315-343"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "State-driven", "text": "While the user is returning to the card list from the card list itself, the system shall keep the saved paging context in the COMMAREA.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-196"], "sources": ["app/cbl/COCRDLIC.cbl:315-343"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept only 'S' (view) or 'U' (update) as a row action code, and at most one selected row among the 7 rows.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-106"], "sources": ["app/cbl/COCRDLIC.cbl:1073-1121"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If more than one row is selected, then the system shall raise an input error with 'PLEASE SELECT ONLY ONE RECORD TO VIEW OR UPDATE', highlight the selected rows in red, and not navigate.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-106"], "sources": ["app/cbl/COCRDLIC.cbl:1073-1121"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If a row holds an action code other than 'S' or 'U', then the system shall flag that row in red and show 'INVALID ACTION CODE' unless another message is already set.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-106"], "sources": ["app/cbl/COCRDLIC.cbl:1073-1121"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "State-driven", "text": "While a row holds no card or an account or card filter error exists, the system shall protect that row's selection field.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-134"], "sources": ["app/cbl/COCRDLIC.cbl:748-832"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed on re-entry with a single valid 'S' selection and no input errors, the system shall transfer to the Card Detail program COCRDSLC, passing that row's account and card number.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-178"], "sources": ["app/cbl/COCRDLIC.cbl:514-569"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed on re-entry with a single valid 'U' selection and no input errors, the system shall transfer to the Card Update program COCRDUPC with CDEMO-ACCT-ID and CDEMO-CARD-NUM from that row, from-program COCRDLIC and PGM-ENTER set.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-178"], "sources": ["app/cbl/COCRDLIC.cbl:514-569"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed with no row selected, the system shall redisplay the current page.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-178"], "sources": ["app/cbl/COCRDLIC.cbl:514-569"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Unwanted", "text": "If a selection error occurs while both filters are valid, then the system shall show the error and re-read the list from the start of the file (filtered), while the page number shown stays unchanged.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-197"], "sources": ["app/cbl/COCRDLIC.cbl:418-438"], "programs": ["COCRDLIC"]}, {"key": "claude/card/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the card detail screen is first entered from the card list COCRDLIC, the system shall take the account and card from the commarea without re-validating them, read the card, and show its details with the account and card fields protected.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-180"], "sources": ["app/cbl/COCRDSLC.cbl:304-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the card detail screen is first entered from another program or started fresh from the menu, the system shall show the empty screen with 'Please enter Account and Card Number'.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-180", "claude/RULE-045"], "sources": ["app/cbl/COCRDSLC.cbl:304-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user re-enters the card detail screen with their own input, the system shall validate the inputs and read the card only if there are no errors.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-180"], "sources": ["app/cbl/COCRDSLC.cbl:304-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the program starts in any other state, then the system shall send plain text 'UNEXPECTED DATA SCENARIO' and abend with code '0001'.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-180"], "sources": ["app/cbl/COCRDSLC.cbl:304-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If both the account and card fields are blank or '*', then the system shall set the message to 'No input received', mark both fields '*' in red, and not read the file.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-135"], "sources": ["app/cbl/COCRDSLC.cbl:636-640"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the card file CARDDAT by the 16-digit card number alone, without checking that the card belongs to the entered account.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-211"], "sources": ["app/cbl/COCRDSLC.cbl:736-773"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the card number is not found, then the system shall raise an input error, flag both fields red, and show 'Did not find cards for this search condition' unless an earlier message is already set.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-211"], "sources": ["app/cbl/COCRDSLC.cbl:736-773"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the card read returns any other error, then the system shall flag the account field and show 'File Error: READ on CARDDAT returned RESP <n> ,RESP2 <n>'.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-211"], "sources": ["app/cbl/COCRDSLC.cbl:736-773"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the card lookup succeeds, the system shall show ' Displaying requested details' together with the embossed name, the expiry month and year taken from the stored YYYY-MM-DD expiry date, and the active status code.", "capability": "claude/card/02#2", "function": "claude/card/02", "rules": ["claude/RULE-045", "claude/RULE-211"], "sources": ["app/cbl/COCRDSLC.cbl:457-497", "app/cbl/COCRDSLC.cbl:736-773"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not display the CVV or the expiry day, and shall show a zero account or card in the commarea as blank.", "capability": "claude/card/02#2", "function": "claude/card/02", "rules": ["claude/RULE-045"], "sources": ["app/cbl/COCRDSLC.cbl:457-497"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall recognise only Enter and PF3 on the card detail screen, and shall treat any other key as Enter without raising an error.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-179"], "sources": ["app/cbl/COCRDSLC.cbl:291-334"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When PF3 is pressed, the system shall transfer to the calling program and transaction, or to COMEN01C/CM00 if the from-program or from-transaction is blank or low-values, and set the user type to USER.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-179"], "sources": ["app/cbl/COCRDSLC.cbl:291-334"], "programs": ["COCRDSLC"]}, {"key": "claude/card/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the card number is blank, '*' or all zeros, then the system shall raise an input error, highlight the field red, and show 'Card number not provided'.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-108"], "sources": ["app/cbl/COCRDUPC.cbl:762-800"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the card number contains non-digits, then the system shall raise an input error, highlight the field red, and show 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER'.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-108"], "sources": ["app/cbl/COCRDUPC.cbl:762-800"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall validate both search keys even if the first fails, and the first error message shall win.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-108"], "sources": ["app/cbl/COCRDUPC.cbl:762-800"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the card for update from CARDDAT by the 16-character card number alone, without verifying that the card belongs to the entered account.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-055"], "sources": ["app/cbl/COCRDUPC.cbl:1376-1413"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the card number does not exist, then the system shall show 'Did not find cards for this search condition' and flag both keys in error.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-055"], "sources": ["app/cbl/COCRDUPC.cbl:1376-1413"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the card read returns any other file error, then the system shall show 'File Error: READ on CARDDAT returned RESP ...' and flag only the account field.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-055"], "sources": ["app/cbl/COCRDUPC.cbl:1376-1413"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the update screen is entered from the card list COCRDLIC, the system shall fetch the selected card automatically.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-198"], "sources": ["app/cbl/COCRDUPC.cbl:435-476"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "State-driven", "text": "While card details are not yet fetched, the system shall allow only the search keys to be edited.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-267"], "sources": ["app/cbl/COCRDUPC.cbl:1168-1208"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "State-driven", "text": "While the update is in state S or E, the system shall protect the account and card fields and leave name, status, expiry month and expiry year unprotected.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-267"], "sources": ["app/cbl/COCRDUPC.cbl:1168-1208"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "State-driven", "text": "While the update is in state N or C, the system shall protect all fields.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-267"], "sources": ["app/cbl/COCRDUPC.cbl:1168-1208"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall never offer the expiry day for editing.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-267", "claude/RULE-012"], "sources": ["app/cbl/COCRDUPC.cbl:1168-1208"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the edited name, expiry and status are identical, case-insensitively, to the values fetched, then the system shall show 'No change detected with respect to values fetched.', skip field edits, and stay in 'show details' without a confirmation prompt.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-107"], "sources": ["app/cbl/COCRDUPC.cbl:667-693"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the embossed name is blank, '*' or zeros, then the system shall show 'Card name not provided' and highlight the field red with '*'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-109"], "sources": ["app/cbl/COCRDUPC.cbl:806-840"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the embossed name contains any character other than A-Z, a-z or space, then the system shall show 'Card name can only contain alphabets and spaces' and highlight the field red.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-109"], "sources": ["app/cbl/COCRDUPC.cbl:806-840"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the card active status is not 'Y' or 'N' (case-sensitive), then the system shall show 'Card Active Status must be Y or N' and highlight the field red.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-110"], "sources": ["app/cbl/COCRDUPC.cbl:845-873"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the expiry month is blank, non-numeric or outside 1 to 12, then the system shall show 'Card expiry month must be between 1 and 12' and highlight the field red.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-111"], "sources": ["app/cbl/COCRDUPC.cbl:877-908"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the expiry year is blank or outside 1950 to 2099, then the system shall show 'Invalid card expiry year' and highlight the field red, without comparing the year against today's date.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-112"], "sources": ["app/cbl/COCRDUPC.cbl:913-944"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When valid keys are entered and details are not yet fetched, the system shall read the card and move to state S (show details).", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When valid changes are submitted in state S, the system shall move to state N and show 'Changes validated.Press F5 to save'.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If any field edit fails, then the system shall move the update to state E (changes not OK).", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "State-driven", "text": "While the update is not in state N, the system shall treat PF5 as Enter and not write the record.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-245"], "sources": ["app/cbl/COCRDUPC.cbl:413-424"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "State-driven", "text": "While the update is in state N, the system shall remain in state N until PF5 is pressed.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall honour Enter, PF3, PF5 (only in state N) and PF12 (only when details are fetched), and shall treat any other key as Enter.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-245"], "sources": ["app/cbl/COCRDUPC.cbl:413-424"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When PF12 is pressed with valid keys, the system shall re-read the card and discard the edits.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-147", "claude/RULE-245"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When PF5 is pressed in state N, the system shall re-read the card record with a lock and compare CVV, embossed name (up-cased), expiry year, month, day and active status with the values originally shown.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-056", "claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:1420-1457"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If the record cannot be locked, then the system shall show 'Could not lock record for update' and move to state L.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-056", "claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:1420-1457"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Unwanted", "text": "If the locked record differs from the values originally shown, then the system shall abort the save, show 'Record changed by some one else. Please review', refresh the displayed values from the file, and return to state S.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-056", "claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:1420-1457"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Event-driven", "text": "When the rewrite is performed, the system shall build the card record from the card number, the account id from the screen search key, the CVV, the embossed name as typed, the expiry date formatted as YYYY-MM-DD using the non-editable day, and the active status.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-012"], "sources": ["app/cbl/COCRDUPC.cbl:1461-1492"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Event-driven", "text": "When the rewrite succeeds, the system shall move to state C and show 'Changes committed to database'.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Unwanted", "text": "If the rewrite fails, then the system shall set 'Update of record failed', move to state F, and show 'Changes unsuccessful. Please try again'.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-012", "claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:1461-1492", "app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Unwanted", "text": "If any other state and key combination occurs, then the system shall abend with code 0001 'UNEXPECTED DATA SCENARIO'.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Event-driven", "text": "When PF3 is pressed, or the next interaction occurs after an update started from the card list completes or fails, the system shall take a syncpoint and transfer to the calling program, or to COMEN01C/CM00 if there is none.", "capability": "claude/card/03#4", "function": "claude/card/03", "rules": ["claude/RULE-198", "claude/RULE-245"], "sources": ["app/cbl/COCRDUPC.cbl:435-476"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Event-driven", "text": "When returning to the card list after an update, the system shall reset the account and card ids to zero.", "capability": "claude/card/03#4", "function": "claude/card/03", "rules": ["claude/RULE-198"], "sources": ["app/cbl/COCRDUPC.cbl:435-476"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Event-driven", "text": "When the next interaction occurs after state C, L or F and the update was not entered from another transaction, the system shall reset to a fresh search screen and clear the context keys.", "capability": "claude/card/03#4", "function": "claude/card/03", "rules": ["claude/RULE-147"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Event-driven", "text": "When exiting the update screen, the system shall set the user type to regular user.", "capability": "claude/card/03#4", "function": "claude/card/03", "rules": ["claude/RULE-198"], "sources": ["app/cbl/COCRDUPC.cbl:435-476"], "programs": ["COCRDUPC"]}, {"key": "claude/transactions/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a cardholder confirms an online bill payment, the system shall set the payment amount to the account's entire current balance (ACCT-CURR-BAL), with no partial payment, no over-payment and no user-entered amount.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-011"], "sources": ["app/cbl/COBIL00C.cbl:224-235"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the payment transaction has been written, the system shall rewrite the account's current balance as ACCT-CURR-BAL - TRAN-AMT, so that it becomes $0.00.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-011"], "sources": ["app/cbl/COBIL00C.cbl:224-235"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If the current balance is $1,000,000,000.00 or more, then the system shall record a payment amount with the high-order digit truncated, because TRAN-AMT (PIC S9(09)V99) has one fewer integer digit than ACCT-CURR-BAL (PIC S9(10)V99), so the transaction understates the payment and leaves a residual balance (the plugin flags this as a defect).", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-011"], "sources": ["app/cpy/CVACT01Y.cpy:7", "app/cpy/CVTRA05Y.cpy:10"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a confirmed payment is posted, the system shall look up the card cross-reference, generate a transaction ID, write the payment transaction, then subtract the amount from the account and rewrite the account, which was read for update.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-146"], "sources": ["app/cbl/COBIL00C.cbl:208-244", "app/cbl/COBIL00C.cbl:345-354"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the payment transaction write returns DUPREC or the cross-reference lookup returns NOTFND, then the system shall set the error message ('Tran ID already exist...' or 'Account ID NOT found...') but still reduce and rewrite the account balance, so the balance is reduced with no recorded payment transaction or with a blank card number (the plugin flags this as a defect because posting is not atomic).", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-146"], "sources": ["app/cbl/COBIL00C.cbl:208-244"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the account REWRITE fails after a successful transaction write, then the system shall leave the payment transaction on file with the balance unchanged, with no compensating action in the program.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-146"], "sources": ["app/cbl/COBIL00C.cbl:377-403"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the payment transaction is written successfully, the system shall clear the screen and show 'Payment successful. Your Transaction ID is <id>.' in green.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-146"], "sources": ["app/cbl/COBIL00C.cbl:522-532"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When a confirmed bill payment is posted, the system shall assign the new transaction ID by reading the last (highest-key) transaction in the transaction file and adding 1.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-030"], "sources": ["app/cbl/COBIL00C.cbl:212-219"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If reading for the last transaction hits ENDFILE because the transaction file is empty, then the system shall set the transaction ID to zeros so that the first ID is 0000000000000001.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-030"], "sources": ["app/cbl/COBIL00C.cbl:487-488"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Unwanted", "text": "If concurrent payments compute the same next transaction ID, then the system shall fail the second write with DUPKEY/DUPREC 'Tran ID already exist...', because max+1 ID generation is not concurrency-safe.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-030", "claude/RULE-146"], "sources": ["app/cbl/COBIL00C.cbl:533-539"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When a bill payment transaction record is built, the system shall set transaction type '02', category 2, source 'POS TERM', description 'BILL PAYMENT - ONLINE', merchant ID 999999999, merchant name 'BILL PAYMENT', city 'N/A' and ZIP 'N/A'.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-243"], "sources": ["app/cbl/COBIL00C.cbl:218-233"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a bill payment transaction record is built, the system shall set both the origination and processing timestamps to the current time in the format YYYY-MM-DD HH:MM:SS with microseconds zeroed.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-243"], "sources": ["app/cbl/COBIL00C.cbl:249-267"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When a bill payment transaction record is built, the system shall record it against the card number from the account's card cross-reference (alternate index CXACAIX keyed by account ID), using only the card the AIX read returns if the account has several cards.", "capability": "claude/transactions/01#1", "function": "claude/transactions/01", "rules": ["claude/RULE-243"], "sources": ["app/cbl/COBIL00C.cbl:218-233"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the Account ID is blank or low-values when the user presses Enter, then the system shall show 'Acct ID can NOT be empty...', place the cursor on the Account ID field and perform no lookup.", "capability": "claude/transactions/01#2", "function": "claude/transactions/01", "rules": ["claude/RULE-102"], "sources": ["app/cbl/COBIL00C.cbl:158-171"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the account is not found on the account file (ACCTDAT) or, for a confirmed payment, in the card cross-reference (CXACAIX), then the system shall show 'Account ID NOT found...'.", "capability": "claude/transactions/01#2", "function": "claude/transactions/01", "rules": ["claude/RULE-102"], "sources": ["app/cbl/COBIL00C.cbl:359-364", "app/cbl/COBIL00C.cbl:423-428"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If any other error occurs reading the account file or the cross-reference file, then the system shall show 'Unable to lookup Account...' or 'Unable to lookup XREF AIX file...' respectively.", "capability": "claude/transactions/01#2", "function": "claude/transactions/01", "rules": ["claude/RULE-102"], "sources": ["app/cbl/COBIL00C.cbl:365-371", "app/cbl/COBIL00C.cbl:430-435"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the account's current balance is zero or negative (ACCT-CURR-BAL <= 0), then the system shall show 'You have nothing to pay...', place the cursor on Account ID, and write no transaction and make no balance change, for both preview and confirmed requests.", "capability": "claude/transactions/01#2", "function": "claude/transactions/01", "rules": ["claude/RULE-103"], "sources": ["app/cbl/COBIL00C.cbl:197-206"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with the Confirm field blank or low-values, the system shall display the account's current balance with 'Confirm to make a bill payment...' and place the cursor on Confirm.", "capability": "claude/transactions/01#3", "function": "claude/transactions/01", "rules": ["claude/RULE-176"], "sources": ["app/cbl/COBIL00C.cbl:236-240"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with Confirm 'Y' or 'y', the system shall post the payment.", "capability": "claude/transactions/01#3", "function": "claude/transactions/01", "rules": ["claude/RULE-176"], "sources": ["app/cbl/COBIL00C.cbl:173-191"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with Confirm 'N' or 'n', the system shall cancel the payment, clear all fields and perform no account lookup.", "capability": "claude/transactions/01#3", "function": "claude/transactions/01", "rules": ["claude/RULE-176", "claude/RULE-102"], "sources": ["app/cbl/COBIL00C.cbl:560-566"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If the Confirm field holds any other value, then the system shall show 'Invalid value. Valid values are (Y/N)...'.", "capability": "claude/transactions/01#3", "function": "claude/transactions/01", "rules": ["claude/RULE-176"], "sources": ["app/cbl/COBIL00C.cbl:173-191"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If the bill payment screen is entered with no session context (EIBCALEN=0), then the system shall transfer to sign-on COSGN00C.", "capability": "claude/transactions/01#4", "function": "claude/transactions/01", "rules": ["claude/RULE-266"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When the bill payment screen is entered for the first time with a pre-selected value in CDEMO-CB00-TRN-SELECTED, the system shall place that value in the Account ID field and process it as if Enter were pressed (balance preview).", "capability": "claude/transactions/01#4", "function": "claude/transactions/01", "rules": ["claude/RULE-266"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter, PF3 or PF4 on the bill payment screen, the system shall respectively process the request, return to the calling program (or COMEN01C if there is none), or clear the screen.", "capability": "claude/transactions/01#4", "function": "claude/transactions/01", "rules": ["claude/RULE-266"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed on the bill payment screen, then the system shall reject it with CCDA-MSG-INVALID-KEY.", "capability": "claude/transactions/01#4", "function": "claude/transactions/01", "rules": ["claude/RULE-266"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/transactions/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show up to 10 transactions per page in ascending transaction ID order.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-032"], "sources": ["app/cbl/COTRN00C.cbl:279-328"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8, the system shall start the browse at the last ID shown, skip that already-shown record, fill the rows with the following transactions, and increase the page number by one when at least one record is read.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-032"], "sources": ["app/cbl/COTRN00C.cbl:279-328"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a forward page is loaded, the system shall set 'more pages' only if a look-ahead read finds at least one more transaction after the 10th row.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-032"], "sources": ["app/cbl/COTRN00C.cbl:279-328"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When a page is loaded, the system shall save the row 1 ID as the first key and the row 10 ID as the last key for the next paging request.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-032"], "sources": ["app/cbl/COTRN00C.cbl:279-328"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF7, the system shall skip the first ID shown, read the 10 transactions before it into rows 10 down to 1, and lower the page number by one but never below 1.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-033"], "sources": ["app/cbl/COTRN00C.cbl:333-376"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the start of the file is reached before 10 rows are filled while paging back, then the system shall leave the page number unchanged and the top rows cleared or stale (the plugin flags this as a defect).", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-033"], "sources": ["app/cbl/COTRN00C.cbl:333-376"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF7 on page 1 or PF8 when the next-page flag is No, then the system shall show 'You are already at the top of the page...' or 'You are already at the bottom of the page...' and redisplay the screen without erase and without reading the file.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-121"], "sources": ["app/cbl/COTRN00C.cbl:234-274"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the browse start returns NOTFND, or a forward or backward read returns ENDFILE, then the system shall show 'You are at the top of the page...', 'You have reached the bottom of the page...' or 'You have reached the top of the page...' respectively.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-268"], "sources": ["app/cbl/COTRN00C.cbl:602-687"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the transaction file browse returns any other response, then the system shall set the error flag and show 'Unable to lookup transaction...'.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-268"], "sources": ["app/cbl/COTRN00C.cbl:602-687"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show each listed transaction with its ID, its origination date as MM/DD/YY (2-digit year from TRAN-ORIG-TS), its description and its amount in the edit picture +99999999.99.", "capability": "claude/transactions/02#1", "function": "claude/transactions/02", "rules": ["claude/RULE-046"], "sources": ["app/cbl/COTRN00C.cbl:381-445"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If the Tran ID filter is not numeric, then the system shall set the error flag, display 'Tran ID must be Numeric ...' and load no page.", "capability": "claude/transactions/02#2", "function": "claude/transactions/02", "rules": ["claude/RULE-120"], "sources": ["app/cbl/COTRN00C.cbl:206-229"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with a numeric Tran ID filter, the system shall start the list at the first transaction with ID >= that value, reset the page number to 1 and clear the filter field on the redisplayed screen.", "capability": "claude/transactions/02#2", "function": "claude/transactions/02", "rules": ["claude/RULE-120"], "sources": ["app/cbl/COTRN00C.cbl:206-229"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with the Tran ID filter blank, the system shall start the list at the first transaction in the file.", "capability": "claude/transactions/02#2", "function": "claude/transactions/02", "rules": ["claude/RULE-120"], "sources": ["app/cbl/COTRN00C.cbl:206-229"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the user types 'S' or 's' in a row's select field and presses Enter, the system shall store that row's transaction ID in the session and pass control to COTRN01C with context 0.", "capability": "claude/transactions/02#3", "function": "claude/transactions/02", "rules": ["claude/RULE-119"], "sources": ["app/cbl/COTRN00C.cbl:148-204"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall act only on the first row, top to bottom, where both the selection flag and the transaction ID are non-blank, and ignore selections in later rows.", "capability": "claude/transactions/02#3", "function": "claude/transactions/02", "rules": ["claude/RULE-119"], "sources": ["app/cbl/COTRN00C.cbl:148-204"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the selection code is anything other than 'S' or 's', then the system shall show 'Invalid selection. Valid value is S' and redisplay the list.", "capability": "claude/transactions/02#3", "function": "claude/transactions/02", "rules": ["claude/RULE-119"], "sources": ["app/cbl/COTRN00C.cbl:148-204"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the Transaction ID is blank or low-values, then the system shall show 'Tran ID can NOT be empty...' and perform no lookup.", "capability": "claude/transactions/02#4", "function": "claude/transactions/02", "rules": ["claude/RULE-122"], "sources": ["app/cbl/COTRN01C.cbl:146-152"], "programs": ["COTRN01C"]}, {"key": "claude/transactions/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with a Transaction ID, the system shall clear the detail fields and read TRANSACT by that exact key.", "capability": "claude/transactions/02#4", "function": "claude/transactions/02", "rules": ["claude/RULE-122"], "sources": ["app/cbl/COTRN01C.cbl:144-192"], "programs": ["COTRN01C"]}, {"key": "claude/transactions/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If the transaction is not found, or the read fails for any other reason, then the system shall show 'Transaction ID NOT found...' or 'Unable to lookup Transaction...' respectively, place the cursor on the Transaction ID field and display no detail data.", "capability": "claude/transactions/02#4", "function": "claude/transactions/02", "rules": ["claude/RULE-122"], "sources": ["app/cbl/COTRN01C.cbl:283-295"], "programs": ["COTRN01C"]}, {"key": "claude/transactions/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When the transaction is found, the system shall show the Tran ID, card number, type code, category code, source, amount (signed, 2 decimals, e.g. '+00000050.47'), description, original and processed timestamps, merchant ID, name, city and ZIP.", "capability": "claude/transactions/02#4", "function": "claude/transactions/02", "rules": ["claude/RULE-122"], "sources": ["app/cbl/COTRN01C.cbl:144-192"], "programs": ["COTRN01C"]}, {"key": "claude/transactions/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall read the transaction for viewing with the UPDATE option (exclusive record lock) held until task end, although no update follows, which can block concurrent updates (the plugin flags this as a defect).", "capability": "claude/transactions/02#4", "function": "claude/transactions/02", "rules": ["claude/RULE-122"], "sources": ["app/cbl/COTRN01C.cbl:269-278"], "programs": ["COTRN01C"]}, {"key": "claude/transactions/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the transaction list (CT00) or the View Transaction screen (CT01) is entered with no session context, then the system shall transfer to sign-on COSGN00C.", "capability": "claude/transactions/02#5", "function": "claude/transactions/02", "rules": ["claude/RULE-185", "claude/RULE-186"], "sources": ["app/cbl/COTRN00C.cbl:107-136", "app/cbl/COTRN01C.cbl:94-134"], "programs": ["COTRN00C", "COTRN01C"]}, {"key": "claude/transactions/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the transaction list is entered for the first time, the system shall show the first page from the start of the TRANSACT file.", "capability": "claude/transactions/02#5", "function": "claude/transactions/02", "rules": ["claude/RULE-185"], "sources": ["app/cbl/COTRN00C.cbl:107-136"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter, PF3, PF7 or PF8 on the transaction list, the system shall respectively process the filter or selection, pass control to the main menu COMEN01C, show the previous page, or show the next page.", "capability": "claude/transactions/02#5", "function": "claude/transactions/02", "rules": ["claude/RULE-185"], "sources": ["app/cbl/COTRN00C.cbl:107-136"], "programs": ["COTRN00C"]}, {"key": "claude/transactions/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When the View Transaction screen is entered for the first time with a transaction ID selected on the list (CDEMO-CT01-TRN-SELECTED not blank), the system shall pre-fill that ID and look it up automatically.", "capability": "claude/transactions/02#5", "function": "claude/transactions/02", "rules": ["claude/RULE-186"], "sources": ["app/cbl/COTRN01C.cbl:94-134"], "programs": ["COTRN01C"]}, {"key": "claude/transactions/02/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter, PF3, PF4 or PF5 on the View Transaction screen, the system shall respectively look up the entered ID, return to the calling program (or COMEN01C if unknown), clear all fields and the message, or transfer to the transaction list COTRN00C.", "capability": "claude/transactions/02#5", "function": "claude/transactions/02", "rules": ["claude/RULE-186"], "sources": ["app/cbl/COTRN01C.cbl:94-134", "app/cbl/COTRN01C.cbl:309-326"], "programs": ["COTRN01C"]}, {"key": "claude/transactions/02/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed on the transaction list or the View Transaction screen, then the system shall show CCDA-MSG-INVALID-KEY.", "capability": "claude/transactions/02#5", "function": "claude/transactions/02", "rules": ["claude/RULE-185", "claude/RULE-186"], "sources": ["app/cbl/COTRN00C.cbl:107-136", "app/cbl/COTRN01C.cbl:94-134"], "programs": ["COTRN00C", "COTRN01C"]}, {"key": "claude/transactions/02/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When control is transferred from either screen, the system shall reset the program context to 0 and default a blank target program to COSGN00C.", "capability": "claude/transactions/02#5", "function": "claude/transactions/02", "rules": ["claude/RULE-185", "claude/RULE-186"], "sources": ["app/cbl/COTRN00C.cbl:512-517", "app/cbl/COTRN01C.cbl:197-208"], "programs": ["COTRN00C", "COTRN01C"]}, {"key": "claude/transactions/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If neither an Account ID nor a Card Number is entered, then the system shall show 'Account or Card Number must be entered...' and add nothing.", "capability": "claude/transactions/03#1", "function": "claude/transactions/03", "rules": ["claude/RULE-058"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the Account ID or the Card Number entered is not numeric, then the system shall show 'Account ID must be Numeric...' or 'Card Number must be Numeric...' respectively.", "capability": "claude/transactions/03#1", "function": "claude/transactions/03", "rules": ["claude/RULE-058"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When an Account ID is entered, the system shall look it up in the account-to-card alternate index (CXACAIX), fill in the card number from that cross-reference record and ignore any Card Number entered.", "capability": "claude/transactions/03#1", "function": "claude/transactions/03", "rules": ["claude/RULE-058"], "sources": ["app/cbl/COTRN02C.cbl:196-209"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When only a Card Number is entered, the system shall look it up in the card cross-reference (CCXREF) and fill in the account from that record.", "capability": "claude/transactions/03#1", "function": "claude/transactions/03", "rules": ["claude/RULE-058"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the account or card is not in the cross-reference, then the system shall show 'Account ID NOT found...' or 'Card Number NOT found...' and add nothing.", "capability": "claude/transactions/03#1", "function": "claude/transactions/03", "rules": ["claude/RULE-058"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If an unexpected file error occurs during the lookup, then the system shall show 'Unable to lookup Acct in XREF AIX file...' or 'Unable to lookup Card # in XREF file...'.", "capability": "claude/transactions/03#1", "function": "claude/transactions/03", "rules": ["claude/RULE-058"], "sources": ["app/cbl/COTRN02C.cbl:576-637"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If any of Type CD, Category CD, Source, Description, Amount, Orig Date, Proc Date, Merchant ID, Merchant Name, Merchant City or Merchant Zip is empty, then the system shall report the first empty field in that order (e.g. 'Merchant City can NOT be empty...'), place the cursor on it and write no transaction.", "capability": "claude/transactions/03#2", "function": "claude/transactions/03", "rules": ["claude/RULE-123"], "sources": ["app/cbl/COTRN02C.cbl:251-320"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If Transaction Type Code, Transaction Category Code or Merchant ID is not entirely numeric, then the system shall show 'Type CD must be Numeric...', 'Category CD must be Numeric...' or 'Merchant ID must be Numeric...' and add nothing.", "capability": "claude/transactions/03#2", "function": "claude/transactions/03", "rules": ["claude/RULE-124"], "sources": ["app/cbl/COTRN02C.cbl:322-337", "app/cbl/COTRN02C.cbl:430-436"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept any numeric type and category code without checking it against the transaction type/category reference tables (the plugin flags this as a defect).", "capability": "claude/transactions/03#2", "function": "claude/transactions/03", "rules": ["claude/RULE-124"], "sources": ["app/cbl/COTRN02C.cbl:322-337"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the amount is not in the format -99999999.99 / +99999999.99 (mandatory sign, 8 digits, decimal point, 2 decimals), then the system shall show 'Amount should be in format -99999999.99'.", "capability": "claude/transactions/03#2", "function": "claude/transactions/03", "rules": ["claude/RULE-014"], "sources": ["app/cbl/COTRN02C.cbl:339-386"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the amount passes the format check, the system shall convert it to a signed monetary value with 2 decimal places (PIC S9(9)V99), redisplay it in the same format and store it as TRAN-AMT, accepting a zero amount.", "capability": "claude/transactions/03#2", "function": "claude/transactions/03", "rules": ["claude/RULE-014"], "sources": ["app/cbl/COTRN02C.cbl:339-386", "app/cbl/COTRN02C.cbl:456-458"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the origination or processing date is not in YYYY-MM-DD layout, then the system shall show 'Orig Date should be in format YYYY-MM-DD' or 'Proc Date should be in format YYYY-MM-DD'.", "capability": "claude/transactions/03#2", "function": "claude/transactions/03", "rules": ["claude/RULE-125"], "sources": ["app/cbl/COTRN02C.cbl:353-427"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the date utility CSUTLDTC does not report success (severity '0000') or message number '2513' for a date, then the system shall reject it with 'Orig Date - Not a valid date...' or the matching processing-date message.", "capability": "claude/transactions/03#2", "function": "claude/transactions/03", "rules": ["claude/RULE-125"], "sources": ["app/cbl/COTRN02C.cbl:353-427"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not check that the processing date is on or after the origination date, nor against the current date.", "capability": "claude/transactions/03#2", "function": "claude/transactions/03", "rules": ["claude/RULE-125"], "sources": ["app/cbl/COTRN02C.cbl:353-427"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When all
