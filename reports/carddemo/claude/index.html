ograms": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall put the reply to the requester's reply-to queue carrying the request's correlation ID, as non-persistent, with expiry 50 (tenths of a second, so 5 seconds), outside syncpoint.", "capability": "claude/pendauth/01#4", "function": "claude/pendauth/01", "rules": ["claude/RULE-255"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:738-766"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If the reply put fails, then the system shall treat it as critical (M004) and end the run before the database write.", "capability": "claude/pendauth/01#4", "function": "claude/pendauth/01", "rules": ["claude/RULE-255", "claude/RULE-216"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:738-766"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When a decision is made for a card found in the cross-reference, the system shall update the account's pending-authorization summary, refreshing the credit limit and cash limit from the account master.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-003"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When a request is approved, the system shall add 1 to PA-APPROVED-AUTH-CNT, add the approved amount to PA-APPROVED-AUTH-AMT and PA-CREDIT-BALANCE, set PA-CASH-BALANCE to 0, and replace (REPL) the summary.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-003"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Event-driven", "text": "When a request is declined, the system shall add 1 to PA-DECLINED-AUTH-CNT and add the transaction amount to PA-DECLINED-AUTH-AMT.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-003"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Unwanted", "text": "If no summary exists for the account, then the system shall create one with numerics set to zero and account and customer IDs taken from the cross-reference, apply this authorization's effect, and insert (ISRT) it.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-003"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Event-driven", "text": "When an authorization for a known card is written, the system shall insert a detail record (PAUTDTL1) under the summary with ACCNTID = account ID, copying the request fields and the decision.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-152"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:854-919"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the new detail's match status to Pending ('P') if approved or Declined ('D') if declined, and leave the fraud flag and fraud report date blank.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-152"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:854-919"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall key each detail record so the newest sorts first, with PA-AUTH-DATE-9C = 99999 minus the current YYDDD and PA-AUTH-TIME-9C = 999999999 minus the time of day with milliseconds, taken from the system clock.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-036"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:857-875"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall store the request's own auth date and time separately as PA-AUTH-ORIG-DATE/TIME.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-036"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:857-875"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Unwanted", "text": "If the IMS summary update or insert fails, then the system shall treat it as critical (I003) and end the run.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-003"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Unwanted", "text": "If the detail insert fails, then the system shall treat it as critical (I004) and end the run.", "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rules": ["claude/RULE-152"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:854-919"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall log every error with program, transaction, date and time to the TD queue 'CSSL' under application ID 'CP00'.", "capability": "claude/pendauth/01#6", "function": "claude/pendauth/01", "rules": ["claude/RULE-216"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1010"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Event-driven", "text": "When a warning (A001-A003, M005) is logged, the system shall continue processing.", "capability": "claude/pendauth/01#6", "function": "claude/pendauth/01", "rules": ["claude/RULE-216"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1010"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Unwanted", "text": "If a critical error (M001, M003, M004, C001-C003, I001-I004) occurs, then the system shall terminate the run (PSB released, queue closed) and return without processing more messages.", "capability": "claude/pendauth/01#6", "function": "claude/pendauth/01", "rules": ["claude/RULE-216"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1010"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-036", "code": "REQ-F-036", "kind": "F", "pattern": "Unwanted", "text": "If the IMS PSB is already scheduled ('TC'), then the system shall terminate and reschedule once before failing.", "capability": "claude/pendauth/01#6", "function": "claude/pendauth/01", "rules": ["claude/RULE-216"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1010"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/01/REQ-F-037", "code": "REQ-F-037", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat IMS status 'FW' as OK.", "capability": "claude/pendauth/01#6", "function": "claude/pendauth/01", "rules": ["claude/RULE-216"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1010"], "programs": ["COPAUA0C"]}, {"key": "claude/pendauth/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the user presses Enter with the account ID blank (spaces or low-values), then the system shall show 'Please enter Acct Id...', clear the working account ID and set the error flag.", "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rules": ["claude/RULE-062"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the user presses Enter with a non-numeric account ID, then the system shall show 'Acct Id must be Numeric ...', clear the working account ID and set the error flag.", "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rules": ["claude/RULE-062"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with a numeric account ID, the system shall save it as both the working account ID and the commarea account ID (CDEMO-ACCT-ID).", "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rules": ["claude/RULE-062"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the screen is first entered from another program, the system shall pre-fill the account ID from the commarea only if it is numeric, otherwise blank the field and load no details.", "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rules": ["claude/RULE-062"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When account details are gathered, the system shall find the card cross-reference by account ID through the alternate index (CXACAIX), save its customer ID and card number to the commarea, and read the account (ACCTDAT) and customer (CUSTDAT) records using its account and customer IDs.", "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rules": ["claude/RULE-064"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the account has no card cross-reference, then the system shall show 'Account:<account ID> not found in XREF file. Resp:... Reas:...'.", "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rules": ["claude/RULE-064"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If a cross-reference, account or customer read fails with an error other than not-found, then the system shall set the error flag and show a 'System error while reading ... file' message.", "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rules": ["claude/RULE-064"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the customer name as first name, middle initial and last name, and the address as line1, line2 and line3, state, zip (first 5).", "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rules": ["claude/RULE-064"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the account's credit limit and cash limit from the account master in the screen header.", "capability": "claude/pendauth/02#2", "function": "claude/pendauth/02", "rules": ["claude/RULE-017"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:780-807"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the approved and declined authorization counts and amounts, plus the credit and cash balances, as stored in the account's pending authorization summary, without recomputing them from the detail records.", "capability": "claude/pendauth/02#2", "function": "claude/pendauth/02", "rules": ["claude/RULE-017"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:780-807"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If the account has no summary segment (IMS 'GE'), then the system shall show the counts, amounts and balances as 0.", "capability": "claude/pendauth/02#2", "function": "claude/pendauth/02", "rules": ["claude/RULE-017"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:780-807"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall look up the summary using the account ID the user entered (CDEMO-ACCT-ID).", "capability": "claude/pendauth/02#2", "function": "claude/pendauth/02", "rules": ["claude/RULE-017"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:780-807"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall display counts as 3 digits, credit limit and credit balance edited as -zzzzzzz9.99, and cash limit, cash balance, approved amount and declined amount edited as -zzzz9.99.", "capability": "claude/pendauth/02#2", "function": "claude/pendauth/02", "rules": ["claude/RULE-017"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:780-807"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When an account is displayed, the system shall list its pending authorizations 5 per page in database order, saving the first key of each page and the last key shown.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-155"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:415-454"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read one record ahead and set the next-page flag to 'Y' only when another record exists after the page.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-155"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:415-454"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter or selects a new account, the system shall reset the page number to 0 before listing.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-155"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:415-454"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "State-driven", "text": "While an error is already flagged, the system shall skip paging.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-155"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:415-454"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If an authorization detail read returns an IMS status other than OK, 'GE' or 'GB', then the system shall set the error flag and show 'System error while reading AUTH Details'.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-155"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:415-454"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8 and the next-page flag is 'Y', the system shall re-read the summary, reposition at the last key shown, and list the next 5 records.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-154"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:388-412"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF8 and the next-page flag is 'N', then the system shall show 'You are already at the bottom of the page...' and leave the list unchanged.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-154"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:388-412"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF7 and the current page number is above 1, the system shall reduce the page number by 1, use that page's saved start key to reposition, and list 5 rows from there.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-153"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:362-385"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF7 on page 1, then the system shall show 'You are already at the top of the page...'.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-153"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:362-385"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall send the screen without erase when paging so the header fields are kept.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-153", "claude/RULE-154"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:362-412"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show each listed authorization's original date as MM/DD/YY, converted from the stored YYMMDD, and its original time as HH:MM:SS, converted from HHMMSS.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-037"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:525-534"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show a listed authorization's approval status as 'A' only when its response code is exactly '00', and as 'D' for any other response code, including blank or unknown codes.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-004"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:536-540"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the approved amount (PA-APPROVED-AMT) on every listed row whatever its approval status.", "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rules": ["claude/RULE-004"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:536-540"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter and the first non-blank selection is 'S' or 's' on a row whose stored auth key is non-blank, the system shall make that row's key the selected key and transfer (XCTL) to COPAUS1C with from-program COPAUS0C, from-tranid CPVS, context 0 and enter mode.", "capability": "claude/pendauth/02#4", "function": "claude/pendauth/02", "rules": ["claude/RULE-063"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If the first non-blank selection is not 'S' or 's', then the system shall show 'Invalid selection. Valid value is S' and refresh the list.", "capability": "claude/pendauth/02#4", "function": "claude/pendauth/02", "rules": ["claude/RULE-063"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When no row is selected, the system shall clear the selection flag and selected key to spaces.", "capability": "claude/pendauth/02#4", "function": "claude/pendauth/02", "rules": ["claude/RULE-063"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall protect the selection field on empty rows and leave it unprotected only on rows that hold data.", "capability": "claude/pendauth/02#4", "function": "claude/pendauth/02", "rules": ["claude/RULE-063"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the summary screen, the system shall run the inquiry or selection.", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-192"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:224-250"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the summary screen, the system shall transfer to COMEN01C with from-program COPAUS0C, from-tranid CPVS and context 0.", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-192"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:224-250"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Unwanted", "text": "If the user presses any key other than Enter, PF3, PF7 or PF8 on the summary screen, then the system shall set the error flag and show the standard invalid-key message (CCDA-MSG-INVALID-KEY).", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-192"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:224-250"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Unwanted", "text": "If no target program is set on return, then the system shall return to sign-on COSGN00C.", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-192"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:224-250"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Event-driven", "text": "When the summary program is first invoked with no commarea, the system shall start with an empty screen and enter re-entry mode.", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-192"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:224-250"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall always end the task with RETURN TRANSID CPVS so the conversation continues.", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-192"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:224-250"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Event-driven", "text": "When the authorization summary is requested, the system shall schedule the PSB PSBPAUTB before reading pending authorization data.", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-256"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:1001-1031"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-N-004", "code": "REQ-N-004", "kind": "N", "pattern": "Unwanted", "text": "If the PSB schedule returns 'TC', then the system shall issue DLI TERM and schedule once more, and if that also fails, set the error flag and show 'System error while scheduling PSB: Code:xx'.", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-256"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:1001-1031"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-N-005", "code": "REQ-N-005", "kind": "N", "pattern": "Event-driven", "text": "When the screen is sent, the system shall take a SYNCPOINT and mark the PSB unscheduled.", "capability": "claude/pendauth/02#5", "function": "claude/pendauth/02", "rules": ["claude/RULE-256"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:1001-1031"], "programs": ["COPAUS0C"]}, {"key": "claude/pendauth/02/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Event-driven", "text": "When the detail screen is first entered or the user presses Enter, and the account ID is numeric and a selected authorization key is present, the system shall read the account's pending-authorization summary root and then the detail child whose key matches the selected key, and display it.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-065"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-036", "code": "REQ-F-036", "kind": "F", "pattern": "Unwanted", "text": "If the account ID is not numeric or the selected key is spaces or low-values, then the system shall set the error flag and send the screen with blank detail fields and no message.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-065"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-037", "code": "REQ-F-037", "kind": "F", "pattern": "Unwanted", "text": "If the detail program is started with no commarea (EIBCALEN=0), then the system shall return control to the summary program COPAUS0C.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-065"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-038", "code": "REQ-F-038", "kind": "F", "pattern": "Unwanted", "text": "If the summary or detail is not found (GE/GB), then the system shall treat it as end of data, and for any other IMS status show a system-error message with the IMS code.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-065"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-039", "code": "REQ-F-039", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall translate the 4-digit reason code into a description from the fixed table 0000 APPROVED, 3100 INVALID CARD, 4100 INSUFFICNT FUND, 4200 CARD NOT ACTIVE, 4300 ACCOUNT CLOSED, 4400 EXCED DAILY LMT, 5100 CARD FRAUD, 5200 MERCHANT FRAUD, 5300 LOST CARD, 9000 UNKNOWN, shown as '<code>-<description>'.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-018"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:319-328"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-040", "code": "REQ-F-040", "kind": "F", "pattern": "Unwanted", "text": "If the reason code is not in the table, then the system shall show '9999-ERROR'.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-018"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:319-328"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-N-006", "code": "REQ-N-006", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall keep the reason code table in ascending code order, because the lookup uses a binary search (SEARCH ALL).", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-018"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:319-328"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-041", "code": "REQ-F-041", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the fraud field as the fraud flag and report date ('F-<date>' or 'R-<date>') when the flag is 'F' or 'R', and as '-' for any other flag value.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-038"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:344-350"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-042", "code": "REQ-F-042", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8 on the detail screen, the system shall make the next pending authorization under the same account, in IMS key order (GNP on PAUTDTL1), the selected one and display its details.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-193"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-043", "code": "REQ-F-043", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF8 on the last authorization, then the system shall resend the current screen without erasing and show 'Already at the last Authorization...'.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-193"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-044", "code": "REQ-F-044", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the detail screen, the system shall return to the summary program COPAUS0C.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-193"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/02/REQ-F-045", "code": "REQ-F-045", "kind": "F", "pattern": "Unwanted", "text": "If the user presses any other unsupported key on the detail screen, then the system shall reload the current record and show the invalid-key message.", "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rules": ["claude/RULE-193"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF5 on an authorization whose fraud flag is 'F', the system shall set the flag to 'R' (fraud removed) and call COPAUS2C with action 'R' (remove).", "capability": "claude/pendauth/03#1", "function": "claude/pendauth/03", "rules": ["claude/RULE-136"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF5 on an authorization whose fraud flag is anything other than 'F', the system shall set the flag to 'F' (fraud confirmed) and call COPAUS2C with action 'F' (report).", "capability": "claude/pendauth/03#1", "function": "claude/pendauth/03", "rules": ["claude/RULE-136"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send the fraud action together with the account ID, customer ID and the full 200-byte detail record to COPAUS2C.", "capability": "claude/pendauth/03#1", "function": "claude/pendauth/03", "rules": ["claude/RULE-136"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When COPAUS2C is invoked, the system shall insert a row into CARDDEMO.AUTHFRDS with AUTH_FRAUD set to the fraud action, FRAUD_RPT_DATE = CURRENT DATE, and all authorization, merchant, account and customer fields, returning status 'S' and message 'ADD SUCCESS'.", "capability": "claude/pendauth/03#2", "function": "claude/pendauth/03", "rules": ["claude/RULE-137"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244"], "programs": ["COPAUS2C"]}, {"key": "claude/pendauth/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the same card and timestamp already exist in the fraud table (SQLCODE -803), then the system shall update only AUTH_FRAUD and FRAUD_RPT_DATE and return status 'S' and 'UPDT SUCCESS'.", "capability": "claude/pendauth/03#2", "function": "claude/pendauth/03", "rules": ["claude/RULE-137"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244"], "programs": ["COPAUS2C"]}, {"key": "claude/pendauth/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If any other database error occurs, then the system shall return status 'F' with the SQLCODE/SQLSTATE in the message.", "capability": "claude/pendauth/03#2", "function": "claude/pendauth/03", "rules": ["claude/RULE-137"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244"], "programs": ["COPAUS2C"]}, {"key": "claude/pendauth/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build the fraud record's authorization timestamp (AUTH-TS) from PA-AUTH-ORIG-DATE (YYMMDD) and the time 999999999 - PA-AUTH-TIME-9C, padded with '000' microseconds and parsed with 'YY-MM-DD HH24.MI.SSNNNNNN'.", "capability": "claude/pendauth/03#2", "function": "claude/pendauth/03", "rules": ["claude/RULE-019"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:103-114"], "programs": ["COPAUS2C"]}, {"key": "claude/pendauth/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall identify fraud table rows uniquely by CARD_NUM + AUTH_TS.", "capability": "claude/pendauth/03#2", "function": "claude/pendauth/03", "rules": ["claude/RULE-137", "claude/RULE-019"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244"], "programs": ["COPAUS2C"]}, {"key": "claude/pendauth/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When COPAUS2C returns with EIBRESP NORMAL and update status 'S', the system shall replace the detail segment from the record COPAUS2C returned, commit with a syncpoint, and show 'AUTH MARKED FRAUD...' or, if the new state is 'R', 'AUTH FRAUD REMOVED...'.", "capability": "claude/pendauth/03#3", "function": "claude/pendauth/03", "rules": ["claude/RULE-217"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:253-262"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the call to COPAUS2C returns abnormally, then the system shall roll back the unit of work (syncpoint rollback).", "capability": "claude/pendauth/03#3", "function": "claude/pendauth/03", "rules": ["claude/RULE-217"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:253-262"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If COPAUS2C returns status 'F', then the system shall roll back and show COPAUS2C's 50-character message.", "capability": "claude/pendauth/03#3", "function": "claude/pendauth/03", "rules": ["claude/RULE-217"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:253-262"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the IMS replace of the detail fails (status not blank or 'FW'), then the system shall roll back, set the error flag and show a system-error message with the IMS code.", "capability": "claude/pendauth/03#3", "function": "claude/pendauth/03", "rules": ["claude/RULE-217"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:253-262"], "programs": ["COPAUS1C"]}, {"key": "claude/pendauth/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the purge batch starts, the system shall take the expiry days from the SYSIN parameter card (P-EXPIRY-DAYS).", "capability": "claude/pendauth/04#1", "function": "claude/pendauth/04", "rules": ["claude/RULE-213", "claude/RULE-001"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-200"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the expiry days on the parameter card are not numeric, then the system shall use 5 days.", "capability": "claude/pendauth/04#1", "function": "claude/pendauth/04", "rules": ["claude/RULE-213"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-200"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall accept an expiry period of up to 99 days (P-EXPIRY-DAYS PIC 9(02)).", "capability": "claude/pendauth/04#1", "function": "claude/pendauth/04", "rules": ["claude/RULE-213"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-200"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the debug flag to 'N' unless the parameter is exactly 'Y'.", "capability": "claude/pendauth/04#1", "function": "claude/pendauth/04", "rules": ["claude/RULE-213"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-200"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the nightly purge batch runs, the system shall walk every account summary in the pending authorization database and physically delete each child authorization detail that has expired, leaving non-expired details in place.", "capability": "claude/pendauth/04#2", "function": "claude/pendauth/04", "rules": ["claude/RULE-150"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall qualify a detail for deletion when today's date (YYDDD) minus its auth date (99999 - PA-AUTH-DATE-9C) is greater than or equal to the expiry days.", "capability": "claude/pendauth/04#2", "function": "claude/pendauth/04", "rules": ["claude/RULE-001"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:280-296"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall apply the expiry test regardless of match status (P, D, E, M) and fraud flag (F/R).", "capability": "claude/pendauth/04#2", "function": "claude/pendauth/04", "rules": ["claude/RULE-001"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:280-296"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the end of an account's children is reached ('GE'/'GB'), the system shall move to the next summary.", "capability": "claude/pendauth/04#2", "function": "claude/pendauth/04", "rules": ["claude/RULE-150"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If an unexpected IMS status is returned on a read or delete, then the system shall end the run with return code 16.", "capability": "claude/pendauth/04#2", "function": "claude/pendauth/04", "rules": ["claude/RULE-150"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall report run totals of summaries read and deleted and details read and deleted.", "capability": "claude/pendauth/04#2", "function": "claude/pendauth/04", "rules": ["claude/RULE-150"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When an expired detail with response code '00' qualifies for deletion, the system shall subtract 1 from the approved count and its approved amount (PA-APPROVED-AMT) from the approved amount.", "capability": "claude/pendauth/04#3", "function": "claude/pendauth/04", "rules": ["claude/RULE-016"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:287-293"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When an expired detail with any response code other than '00' qualifies for deletion, the system shall subtract 1 from the declined count and its transaction amount (PA-TRANSACTION-AMT) from the declined amount.", "capability": "claude/pendauth/04#3", "function": "claude/pendauth/04", "rules": ["claude/RULE-016"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:287-293"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the purge finishes an account's details and its pending authorization count is zero or below (count <= 0), the system shall delete the account's pending-authorization summary.", "capability": "claude/pendauth/04#3", "function": "claude/pendauth/04", "rules": ["claude/RULE-151"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:156-158"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Event-driven", "text": "When more than the checkpoint frequency (P-CHKP-FREQ, default 5 when spaces, zero or low-values) of account summaries have been processed since the last checkpoint, the system shall take an IMS checkpoint with ID prefix 'RMAD'.", "capability": "claude/pendauth/04#4", "function": "claude/pendauth/04", "rules": ["claude/RULE-254"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:160-164"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-N-004", "code": "REQ-N-004", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall display a progress message every display-frequency successful checkpoints (default 10).", "capability": "claude/pendauth/04#4", "function": "claude/pendauth/04", "rules": ["claude/RULE-254"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:160-164"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-N-005", "code": "REQ-N-005", "kind": "N", "pattern": "Event-driven", "text": "When the purge run ends, the system shall always take a final checkpoint.", "capability": "claude/pendauth/04#4", "function": "claude/pendauth/04", "rules": ["claude/RULE-254"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:160-164"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/04/REQ-N-006", "code": "REQ-N-006", "kind": "N", "pattern": "Unwanted", "text": "If a checkpoint fails, then the system shall end the run with return code 16.", "capability": "claude/pendauth/04#4", "function": "claude/pendauth/04", "rules": ["claude/RULE-254"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:160-164"], "programs": ["CBPAUP0C"]}, {"key": "claude/pendauth/05/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the unload reads each summary root in sequence (GN, unqualified SSA PAUTSUM0) and its account ID (PA-ACCT-ID) is numeric, the system shall write the summary to OPFILE1 as a 100-byte record and write its details (PAUTDTL1) to OPFILE2.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-047"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:223-238"], "programs": ["PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If a summary's account ID is not numeric, then the system shall skip the summary and all its details without any message and move to the next root.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-047"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:223-238"], "programs": ["PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write each unloaded detail record with its parent summary's account ID as ROOT-SEG-KEY (PIC S9(11) COMP-3), followed by the 200-byte detail segment image.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-219", "claude/RULE-047"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:228-230"], "programs": ["PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When a summary has no details (the first GNP returns GE), the system shall write nothing to OPFILE2 for that account.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-219"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:228-230"], "programs": ["PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall unload every summary with a numeric account ID, however old it is, without applying any expiry filter.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-039"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:264-272"], "programs": ["PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the root read returns GB (end of database), the system shall end the unload normally, and when a child read returns GE, it shall end the detail loop for the current summary.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-218", "claude/RULE-220"], "sources": ["app/app-authorization-ims-db2-mq/cbl/DBUNLDGS.CBL:249-294", "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:239-247"], "programs": ["DBUNLDGS", "PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If a root read returns a status other than blank or GB, a child read returns a status other than blank or GE, or a GSAM insert returns any other non-blank status, then the system shall display the status and key feedback area and end the program with RETURN-CODE 16.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-218", "claude/RULE-220"], "sources": ["app/app-authorization-ims-db2-mq/cbl/DBUNLDGS.CBL:249-294", "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:239-247"], "programs": ["DBUNLDGS", "PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If OPFILE1 or OPFILE2 fails to open with a status other than blank or '00', then the system shall end the job with return code 16.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-220"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:239-247"], "programs": ["PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If closing the output files fails, then the system shall display the error without changing the return code.", "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rules": ["claude/RULE-220"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:239-247"], "programs": ["PAUDBUNL"]}, {"key": "claude/pendauth/05/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the reload reads a root record from INFILE1, the system shall insert it as summary segment PAUTSUM0 (ISRT, unqualified SSA) and log 'ROOT INSERT SUCCESS'.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-066"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:222-265"], "programs": ["PAUDBLOD"]}, {"key": "claude/pendauth/05/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If a summary already exists (status II), then the system shall log 'ROOT SEGMENT ALREADY IN DB', leave the existing record unchanged and continue.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-066"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:222-265"], "programs": ["PAUDBLOD"]}, {"key": "claude/pendauth/05/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If a summary insert returns any other status, then the system shall abend with return code 16.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-066"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:222-265"], "programs": ["PAUDBLOD"]}, {"key": "claude/pendauth/05/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall load every summary from INFILE1 before processing any detail from INFILE2.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-066", "claude/RULE-138"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:222-265"], "programs": ["PAUDBLOD"]}, {"key": "claude/pendauth/05/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If INFILE1 or INFILE2 cannot be opened, then the system shall abend the job.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-066"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:222-265"], "programs": ["PAUDBLOD"]}, {"key": "claude/pendauth/05/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When a child record from INFILE2 has a numeric root key, the system shall position on the parent with a qualified GU on PAUTSUM0(ACCNTID EQ <key>) and insert the detail as PAUTDTL1 under it.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-138"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:269-336"], "programs": ["PAUDBLOD"]}, {"key": "claude/pendauth/05/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If a child record's root key is not numeric, then the system shall skip the record.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-138"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:269-336"], "programs": ["PAUDBLOD"]}, {"key": "claude/pendauth/05/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If a detail already exists (status II), then the system shall log 'CHILD SEGMENT ALREADY IN DB' and continue, and for any other insert status it shall abend with return code 16.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-138"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:269-336"], "programs": ["PAUDBLOD"]}, {"key": "claude/pendauth/05/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reload detail dates and times unchanged.", "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rules": ["claude/RULE-138"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:269-336"], "programs": ["PAUDBLOD"]}, {"key": "claude/common/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a caller calls COBDATFT with input type '1', an 8-digit input date such as '20240315' and an output type other than '2', the system shall return the output date '2024-03-15' built as YYYY + '-' + MM + '-' + DD.", "capability": "claude/common/01#1", "function": "claude/common/01", "rules": ["claude/RULE-021"], "sources": ["app/asm/COBDATFT.asm:27-54"], "programs": ["COBDATFT"]}, {"key": "claude/common/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a caller calls COBDATFT with input type '2', a dashed input date such as '2024-03-15' and an output type other than '1', the system shall return the output date '20240315' taken from input positions 1-4, 6-7 and 9-10.", "capability": "claude/common/01#1", "function": "claude/common/01", "rules": ["claude/RULE-021"], "sources": ["app/asm/COBDATFT.asm:27-54"], "programs": ["COBDATFT"]}, {"key": "claude/common/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall exchange the conversion request and result through the CODATECN record with in-type CL1, in-date CL20, out-type CL1, out-date CL20 and error message CL38, where type '1' means YYYYMMDD input and type '2' means YYYY-MM-DD input.", "capability": "claude/common/01#1", "function": "claude/common/01", "rules": ["claude/RULE-021"], "sources": ["app/asm/COBDATFT.asm:27-54"], "programs": ["COBDATFT"]}, {"key": "claude/common/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall convert the date by moving characters only, without checking month and day values (so '20241399' becomes '2024-13-99') and, for type 2, without checking that the separators are present.", "capability": "claude/common/01#1", "function": "claude/common/01", "rules": ["claude/RULE-021"], "sources": ["app/asm/COBDATFT.asm:27-54"], "programs": ["COBDATFT"]}, {"key": "claude/common/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write only the first 8 or 10 bytes of the 20-byte output date field, leaving the rest of the field as the caller left it.", "capability": "claude/common/01#1", "function": "claude/common/01", "rules": ["claude/RULE-021"], "sources": ["app/asm/COBDATFT.asm:27-54"], "programs": ["COBDATFT"]}, {"key": "claude/common/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If a request has an input type other than '1' or '2', or input type '1' with output type '2', or input type '2' with output type '1', then the system shall set COERMSG to 'INVALID INPUT' and write no output date.", "capability": "claude/common/01#2", "function": "claude/common/01", "rules": ["claude/RULE-074"], "sources": ["app/asm/COBDATFT.asm:30-56"], "programs": ["COBDATFT"]}, {"key": "claude/common/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return register 15 (return code) as 0 even when the request is rejected, so callers must check COERMSG to detect an error.", "capability": "claude/common/01#2", "function": "claude/common/01", "rules": ["claude/RULE-074"], "sources": ["app/asm/COBDATFT.asm:30-56"], "programs": ["COBDATFT"]}, {"key": "claude/common/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept output type values other than '1' and '2' (for example a blank).", "capability": "claude/common/01#2", "function": "claude/common/01", "rules": ["claude/RULE-074"], "sources": ["app/asm/COBDATFT.asm:30-56"], "programs": ["COBDATFT"]}, {"key": "claude/common/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If a type 1 input already has a dash at position 5, then the system shall reject it, a check that is intended at line 36 but that the plugin reports almost never fires because the comparison takes its length from COINPDT (20 bytes) rather than 1 byte.", "capability": "claude/common/01#2", "function": "claude/common/01", "rules": ["claude/RULE-074"], "sources": ["app/asm/COBDATFT.asm:36"], "programs": ["COBDATFT"]}, {"key": "claude/common/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a caller passes a date and a format mask (each PIC X(10)) to CSUTLDTC, the system shall call CEEDAYS to convert the date to a Lilian day number and accept the date only if the feedback is all zeros.", "capability": "claude/common/02#1", "function": "claude/common/02", "rules": ["claude/RULE-059"], "sources": ["app/cbl/CSUTLDTC.cbl:103-151"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall pass the full 10-byte date and mask fields as the string length, so trailing spaces are part of the date and the mask.", "capability": "claude/common/02#1", "function": "claude/common/02", "rules": ["claude/RULE-059"], "sources": ["app/cbl/CSUTLDTC.cbl:103-151"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the CEEDAYS feedback is all zeros (for example for '2024-02-29' with mask 'YYYY-MM-DD'), the system shall return severity '0000' and the verdict 'Date is valid'.", "capability": "claude/common/02#1", "function": "claude/common/02", "rules": ["claude/RULE-059"], "sources": ["app/cbl/CSUTLDTC.cbl:103-151"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the CEEDAYS feedback is not all zeros (for example for '2024-02-30' with mask 'YYYY-MM-DD'), then the system shall return a non-zero severity, the message number and its verdict text (2507 Insufficient, 2508 Datevalue error, 2509 Invalid Era, 2513 Unsupp. Range, 2517 Invalid month, 2518 Bad Pic String), with the date and mask echoed back.", "capability": "claude/common/02#1", "function": "claude/common/02", "rules": ["claude/RULE-059"], "sources": ["app/cbl/CSUTLDTC.cbl:103-151"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return an 80-byte result laid out as severity(4) + 'Mesg Code:' + msg no(4) + verdict(15) + 'TstDate:' + date(10) + 'Mask used:' + mask(10).", "capability": "claude/common/02#1", "function": "claude/common/02", "rules": ["claude/RULE-059"], "sources": ["app/cbl/CSUTLDTC.cbl:103-151"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not return the Lilian day number to the caller; only the verdict is used.", "capability": "claude/common/02#1", "function": "claude/common/02", "rules": ["claude/RULE-059"], "sources": ["app/cbl/CSUTLDTC.cbl:103-151"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "State-driven", "text": "While checking a CSUTLDTC result, callers (for example CORPT00C) shall treat severity '0000' and message 2513 (unsupported range) as not-an-error, so dates outside the CEEDAYS supported range (before 1582-10-15 or after 9999-12-31) are accepted at the caller level.", "capability": "claude/common/02#1", "function": "claude/common/02", "rules": ["claude/RULE-059"], "sources": ["app/cbl/CORPT00C.cbl:396-405"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When CSUTLDTC returns to its caller, the system shall move the severity (WS-SEVERITY-N PIC 9(4)) into RETURN-CODE and into LS-RESULT(1:4), so that severity 3 gives RETURN-CODE 3 and '0003' and a valid date gives RETURN-CODE 0 and '0000'.", "capability": "claude/common/02#2", "function": "claude/common/02", "rules": ["claude/RULE-253"], "sources": ["app/cbl/CSUTLDTC.cbl:88-100"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset the result message area before every call, so results from an earlier call do not carry over.", "capability": "claude/common/02#2", "function": "claude/common/02", "rules": ["claude/RULE-253"], "sources": ["app/cbl/CSUTLDTC.cbl:88-100"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall echo the tested date into the result after the call, taken from the CEEDAYS variable-length string structure, so the echoed text may include the 2-byte length prefix and be shifted by 2 bytes.", "capability": "claude/common/02#2", "function": "claude/common/02", "rules": ["claude/RULE-253"], "sources": ["app/cbl/CSUTLDTC.cbl:122"], "programs": ["CSUTLDTC"]}, {"key": "claude/common/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When COBSWAIT reads a SYSIN delay value such as '00000500' and calls MVSWAIT with it as a fullword binary taken from PIC 9(8) COMP, the system shall wait that many centiseconds (500 centiseconds = 5 seconds) via the ASMWAIT macro and then return with return code 0.", "capability": "claude/common/03#1", "function": "claude/common/03", "rules": ["claude/RULE-259"], "sources": ["app/asm/MVSWAIT.asm:19-27", "app/cbl/COBSWAIT.cbl:5"], "programs": ["MVSWAIT"]}, {"key": "claude/common/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not validate the SYSIN delay value, so non-numeric or blank input goes straight into the timer and can produce a wrong wait time or an abend.", "capability": "claude/common/03#1", "function": "claude/common/03", "rules": ["claude/RULE-259"], "sources": ["app/asm/MVSWAIT.asm:19-27"], "programs": ["MVSWAIT"]}], "rules": [{"key": "claude/RULE-001", "function": "claude/pendauth/04", "id": "RULE-001", "name": "Pending authorization expiry qualification", "text": "Given Today is Julian 25120 (YYDDD), expiry period 5 days, and an authorization detail whose key date PA-AUTH-DATE-9C is stored as 74884 (i.e. 99999 - 25115)\nWhen the purge batch CBPAUP0C evaluates the detail\nThen auth date = 99999 - 74884 = 25115; day difference = 25120 - 25115 = 5; since 5 >= 5 the detail is QUALIFIED-FOR-DELETE (a detail authorized on 25116, difference 4, is kept)", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-005", "REQ-F-006"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:280-296", "plain": "A pending authorization detail is eligible for purge when the number of days since it was authorized is at least the configured expiry period.", "defect": "Day difference subtracts YYDDD values directly, so across a year boundary the result is wrong: on 26001 an authorization from 25364 yields 637 and is purged after 2 real days (premature deletion); difference also uses 2-digit years (Y2K-style century rollover at 00)."}, {"key": "claude/RULE-002", "function": "claude/pendauth/01", "id": "RULE-002", "name": "Available-credit check decides approve or decline", "text": "Given An account whose pending-auth summary has credit limit $5,000.00 and credit balance $4,800.00 (available $200.00)\nWhen A request for $250.00 is processed\nThen The decision is DECLINE with reason insufficient funds. A request for exactly $200.00 is APPROVED because the check is strictly greater-than.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-011", "REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-016"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:657-683", "plain": "An authorization is declined for insufficient funds when the requested amount is more than the available credit. Available credit is credit limit minus balance, taken from the pending-authorization summary if one exists, otherwise from the account master.", "defect": "WS-PAUT-SMRY-SEG-FLG is never reset between messages, and 5500 is skipped when the card is not in the cross-reference file. So a request for an unknown card can be judged against the previous message's summary limit and balance, and may be APPROVED (see the unknown-card rule)."}, {"key": "claude/RULE-003", "function": "claude/pendauth/01", "id": "RULE-003", "name": "Pending-authorization summary running totals update", "text": "Given A summary with credit balance $300.00, approved count 4 and approved amount $300.00\nWhen A $50.00 request is approved\nThen Approved count becomes 5, approved amount $350.00, credit balance $350.00, cash balance reset to $0.00, and the credit limit and cash limit are copied from the account master. The summary is replaced (REPL).", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-024", "REQ-F-025", "REQ-F-026", "REQ-F-027", "REQ-F-032"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:798-834", "plain": "After each decision, the account's pending-authorization summary is updated. Limits are refreshed from the account master. Approvals increase the approved count, approved amount and credit balance. Declines increase the declined count and declined amount. A new summary is created if none exists.", "defect": "On decline, the code adds PA-TRANSACTION-AMT from the detail segment, which is only filled in later in 8500 (line 885). So it adds the previous message's amount (or zero or garbage on the first message), not the current one; it should use WS-TRANSACTION-AMT. Each approval also resets PA-CASH-BALANCE to 0, wiping any cash balance. If the account master was not found, ACCT-CREDIT-LIMIT and ACCT-CASH-CREDIT-LIMIT copied into the summary are stale or uninitialized."}, {"key": "claude/RULE-004", "function": "claude/pendauth/02", "id": "RULE-004", "name": "Authorization approval status derived from response code", "text": "Given A pending authorization detail record with PA-AUTH-RESP-CODE = '00' (a second record has '05', a third has spaces)\nWhen The record is listed on the pending authorization summary screen\nThen The first record shows approval status 'A'. The second and third show 'D'. The rule is binary, so blank or unknown codes also count as declined.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-023", "REQ-F-024"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:536-540", "plain": "A pending authorization shows as Approved ('A') only when its response code is exactly '00'. Any other response code shows as Declined ('D').", "defect": ""}, {"key": "claude/RULE-005", "function": "claude/mqinquiry/02", "id": "RULE-005", "name": "Date/time inquiry reply content", "text": "Given A request message is on the triggering input queue and the CICS system clock reads 23 Nov 2026 14:05:09\nWhen The service processes the message\nThen The reply buffer is 'SYSTEM DATE : 11-23-2026SYSTEM TIME : 14:05:09', padded with spaces to 1000 bytes (date and time are joined with no separator or space)", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-N-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:339-364", "plain": "For every request message received, the service replies with the current CICS system date (MM-DD-YYYY, dash-separated) and system time (HH:MM:SS, default separator), whatever the request contains.", "defect": ""}, {"key": "claude/RULE-006", "function": "claude/batch/03", "id": "RULE-006", "name": "Monthly interest per transaction-category balance", "text": "Given An account with a category balance (type 01, category 0001) of $1,250.00 and a disclosure-group annual rate of 18.50\nWhen The interest calculation batch processes that category balance record\nThen Monthly interest = 1250.00 * 18.50 / 1200 = 19.270833 -> stored as $19.27 (truncated to 2 decimals, no ROUNDED clause), and $19.27 is added to the account's running total interest", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBACT04C.cbl:462-470", "plain": "For every transaction-category balance of an account, monthly interest equals the category balance times the annual percentage rate divided by 1200, and these amounts are summed into the account's total interest for the cycle.", "defect": "Truncation instead of rounding consistently under-charges by up to $0.009 per category per cycle; confirm this is intended rounding policy."}, {"key": "claude/RULE-007", "function": "claude/provisioning/01", "id": "RULE-007", "name": "Global export sequence number", "text": "Given An input with 3 customers, 2 accounts, 2 xrefs, 5 transactions and 2 cards\nWhen the export runs\nThen customers get sequence numbers 1-3, accounts 4-5, xrefs 6-7, transactions 8-12 and cards 13-14. The number never resets between record types.", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-N-001", "REQ-F-024"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBEXPORT.cbl:276-277", "plain": "Every export record gets a sequence number that starts at 1 and goes up by 1 across all record types in the run. This number is the export file's unique key.", "defect": "The EXPFILE SELECT names EXPORT-SEQUENCE-NUM as its RECORD KEY, but that field is in the working-storage copybook, not in the file's FD record (EXPORT-OUTPUT-RECORD PIC X(500)). Standard COBOL requires the key to be inside the FD record, so the file definition looks inconsistent. The comments and copybook call it a sequential file, but the code defines it as INDEXED."}, {"key": "claude/RULE-008", "function": "claude/batch/04", "id": "RULE-008", "name": "Statement total equals sum of the card's transaction amounts", "text": "Given Card 4111000000000001 has three loaded transactions of $120.50, $35.25 and -$20.00 (a credit)\nWhen The statement for that card's cross-reference record is produced\nThen Three detail lines are printed and the 'Total EXP:' line shows $135.75 (120.50 + 35.25 - 20.00); the running total is reset to 0 before each card, so a card with no transactions prints a total of $0.00", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBSTM03A.CBL:416-437", "plain": "For each card on the cross-reference file, the statement lists every transaction loaded for that card and prints a 'Total EXP' line that is the signed sum of those transaction amounts.", "defect": ""}, {"key": "claude/RULE-009", "function": "claude/batch/02", "id": "RULE-009", "name": "Update the account balance and cycle totals when a transaction posts", "text": "Given An account with current balance $1,000.00, cycle credit $1,000.00 and cycle debit -$200.00\nWhen A purchase of $150.00 posts, and then a payment of -$300.00 posts\nThen After the purchase: balance $1,150.00, cycle credit $1,150.00. After the payment: balance $850.00, cycle debit -$500.00", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015", "REQ-F-016", "REQ-F-017"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBTRN02C.cbl:545-560", "plain": "When a transaction posts, its amount is added to the account's current balance. It is also added to the current-cycle credit total if the amount is zero or positive, or to the current-cycle debit total if it is negative.", "defect": "If the account rewrite fails (INVALID KEY), reason 109 is set but never checked. The transaction is still written to the transaction file and the category balance has already been updated, so the books can end up inconsistent with no reject record. The 109 value is also left in place until the next transaction resets it."}, {"key": "claude/RULE-010", "function": "claude/batch/05", "id": "RULE-010", "name": "Transaction amount accumulation into page, account and grand totals", "text": "Given Card 4111000000000001 has transactions of $100.00 and -$25.50 on the same page, and the grand total so far is $1,000.00\nWhen both detail lines are written and the page then closes\nThen page total = $74.50 and account total = $74.50; when the page closes, grand total = $1,000.00 + $74.50 = $1,074.50 and page total resets to $0.00", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBTRN03C.cbl:287-298", "plain": "Every reported transaction's amount is added to the running page total and the running account (card) total. When a page closes, its total is added to the grand total and the page total goes back to zero, so the grand total is the sum of all page totals.", "defect": ""}, {"key": "claude/RULE-011", "function": "claude/transactions/01", "id": "RULE-011", "name": "Online bill payment always pays the full current balance", "text": "Given Account 00000000001 with current balance $1,250.75 and a card cross-reference to card 4111111111111111\nWhen The user enters the account ID, confirms with 'Y' and presses Enter\nThen A payment transaction for $1,250.75 is written and the account's current balance is rewritten as $1,250.75 - $1,250.75 = $0.00", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-N-001"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COBIL00C.cbl:224-235", "plain": "When a cardholder confirms an online bill payment, the payment amount is the account's entire current balance and the account balance is then reduced by that amount (to zero).", "defect": "TRAN-AMT has one fewer integer digit than ACCT-CURR-BAL, so balances >= 1,000,000,000.00 would be truncated on the transaction and the post-payment balance would not be zero."}, {"key": "claude/RULE-012", "function": "claude/card/03", "id": "RULE-012", "name": "Composition of the updated card record", "text": "Given Edited values name 'Mary Lee', year 2028, month 07, day 31 (hidden), status 'N', account entered 00000000001\nWhen The rewrite is performed\nThen Record written with expiry '2028-07-31', name 'Mary Lee' (as typed), status 'N', account id 00000000001; a rewrite failure sets 'Update of record failed' (state F).", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-028", "REQ-F-030"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COCRDUPC.cbl:1461-1492", "plain": "The saved card record is rebuilt from the edited values: card number, account id from the screen, CVV, embossed name, expiry date formatted as YYYY-MM-DD, and active status.", "defect": "CCUP-NEW-CVV-CD is never populated (CCUP-NEW-DETAILS is INITIALIZEd at line 586 and no input maps to it), so the CVV written at lines 1464-1465 is derived from spaces and is likely to overwrite the real CVV with zeros/invalid data. Account id is overwritten from user input (line 1463)."}, {"key": "claude/RULE-013", "function": "claude/transactions/04", "id": "RULE-013", "name": "Report period derivation by report type (Monthly / Yearly)", "text": "Given Today's system date is 2024-02-14\nWhen The user selects Monthly (or Yearly) and confirms\nThen Monthly: start date 2024-02-01, end date 2024-02-29 (first day of next month 2024-03-01 minus 1 day via INTEGER-OF-DATE/DATE-OF-INTEGER, so leap years are honored). Yearly: start 2024-01-01, end 2024-12-31. Dates are formatted YYYY-MM-DD and passed to the batch job as PARM-START-DATE / PARM-END-DATE", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CORPT00C.cbl:212-255", "plain": "A Monthly report covers the 1st through the last calendar day of the current month; a Yearly report covers January 1 through December 31 of the current year. Both are based on the system date when the request is made.", "defect": ""}, {"key": "claude/RULE-014", "function": "claude/transactions/03", "id": "RULE-014", "name": "Transaction amount format and conversion", "text": "Given Amount entered as '-00000125.50'\nWhen Enter is pressed\nThen The amount passes the format check, is converted to -125.50, redisplayed as '-00000125.50', and stored as TRAN-AMT -125.50", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COTRN02C.cbl:339-386", "plain": "Amount must be entered as a signed fixed-format value (sign, 8 digits, decimal point, 2 decimals) and is converted to a signed monetary value with 2 decimal places that is stored on the transaction.", "defect": ""}, {"key": "claude/RULE-015", "function": "claude/transactions/03", "id": "RULE-015", "name": "New transaction ID = highest existing ID + 1", "text": "Given The last transaction on TRANSACT has ID 0000000000001234\nWhen A confirmed transaction is added\nThen The new transaction is written with ID 0000000000001235", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-N-001", "REQ-F-018"], "priority": "P0", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COTRN02C.cbl:442-451", "plain": "The new transaction's ID is assigned by reading the highest transaction ID currently on file and adding 1; if the file is empty the first ID is 1.", "defect": "Read-max-plus-one is not concurrency-safe; two simultaneous adds can compute the same ID and the second fails with 'Tran ID already exist...'. Also START
