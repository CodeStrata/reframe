hot of the account (ID, active status, current balance, credit limit, cash credit limit, open/expiry/reissue dates, current-cycle credit and debit, group ID); if not found, the reply says the request parameters are invalid for that account ID.", "defect": ""}, {"key": "claude/RULE-206", "function": "claude/vsammq/01", "id": "RULE-206", "name": "Reply routing and correlation", "text": "Given A request with message ID M1, correlation ID C1 and a ReplyToQ of MY.REPLY.Q\nWhen The reply is put\nThen The reply goes to CARD.DEMO.REPLY.ACCT (not MY.REPLY.Q) with MQMD-MSGID = M1, MQMD-CORRELID = C1, format MQSTR, CCSID of the queue manager, under syncpoint; a put failure is logged to the error queue and the transaction terminates.", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-N-001", "REQ-F-012"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:462-499", "plain": "Every reply is sent to the fixed queue CARD.DEMO.REPLY.ACCT as a string-format message carrying the original request's message ID and correlation ID so the requester can match it.", "defect": "The request's ReplyToQ is saved but ignored; replies always go to the hardcoded CARD.DEMO.REPLY.ACCT queue, so requesters that specify a different reply queue will never receive the answer."}, {"key": "claude/RULE-207", "function": "claude/vsammq/01", "id": "RULE-207", "name": "Fatal error reporting to error queue and termination", "text": "Given The account file read returns a response other than NORMAL or NOTFND (e.g. file disabled)\nWhen The inquiry is processed\nThen An error record (paragraph/source, message 'ERROR WHILE READING ACCTFILE', condition code, reason code, queue name) is put to CARD.DEMO.ERROR under syncpoint, open queues are closed, and CICS RETURN ends the task (no reply is sent to the requester).", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-020"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:501-550", "plain": "Technical failures (trigger retrieve, queue open/get/put/close, account file errors other than not-found) are written as a formatted error record to the CARD.DEMO.ERROR queue and the transaction stops after closing any open queues.", "defect": "Line 202 moves WS-CICS-RESP2-CD to itself instead of to WS-CICS-RESP2-CD-D, so the RESP2 value in the trigger-retrieve error message is always zero; 5100-CLOSE-OUTPUT-QUEUE reports INPUT-QUEUE-NAME instead of the reply queue name (line 592); the input queue's open flag is named REPLY-QUEUE-OPEN (line 245) - misleading but functionally consistent; recursive PERFORM of 8000-TERMINATION on close failure (lines 572, 594, 618) risks a loop."}, {"key": "claude/RULE-208", "function": "claude/vsammq/02", "id": "RULE-208", "name": "Reply correlation and routing to fixed reply queue", "text": "Given A request with MsgId X, CorrelId Y and ReplyToQ 'CLIENT.Q' arrives\nWhen The reply is put\nThen The reply is put on CARD.DEMO.REPLY.DATE with MsgId X and CorrelId Y as a string-format message in the queue manager's code page, inside the unit of work", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-N-001"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:366-381", "plain": "Each reply copies the request's message ID and correlation ID so the requester can match it. The reply always goes to the fixed queue CARD.DEMO.REPLY.DATE, not to the reply-to queue the requester named.", "defect": "The requester-specified reply-to queue is ignored. The reply also echoes the request CorrelId rather than setting CorrelId to the request MsgId, which breaks the usual MQ request/reply correlation pattern."}, {"key": "claude/RULE-209", "function": "claude/vsammq/02", "id": "RULE-209", "name": "MQ failure reporting to error queue and termination", "text": "Given The reply MQPUT fails with condition code 2 and reason 2053\nWhen The failure is detected\nThen An error record (paragraph/context, message 'MQPUT ERR', condition 02, reason 02053, queue name) is put to CARD.DEMO.ERROR under syncpoint, and the transaction closes its open queues and returns", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:405-440", "plain": "Any failure to open, read, or reply on a queue is reported as a fixed-layout text message on CARD.DEMO.ERROR, and then the transaction ends. If the error queue itself cannot be used, the error is only written to the console.", "defect": "Line 151 'MOVE WS-CICS-RESP2-CD TO WS-CICS-RESP2-CD' should target WS-CICS-RESP2-CD-D, so the reported RESP2 is always zero. Termination also commits instead of rolling back, so a failed request can be lost."}, {"key": "claude/RULE-210", "function": "claude/posting/03", "id": "RULE-210", "name": "Interest rate lookup by disclosure group with DEFAULT fallback", "text": "Given An account in group 'PLATINUM' with a category balance of type '01', category 0001, and no disclosure-group record for key PLATINUM/01/0001\nWhen The batch looks up the interest rate\nThen It tries the key DEFAULT/01/0001 and uses that rate. If the DEFAULT record is also missing, the job abends (code 999).", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-N-001"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBACT04C.cbl:415-460", "plain": "The interest rate is found using the account's group ID plus the transaction type and category. If no rate exists for that group, the rate for the 'DEFAULT' group with the same type and category is used instead.", "defect": ""}, {"key": "claude/RULE-211", "function": "claude/util/01", "id": "RULE-211", "name": "Hardcoded source branch and region on every export record", "text": "Given A customer whose address is in California\nWhen That customer's 'C' record is exported\nThen EXPORT-BRANCH-ID='0001' and EXPORT-REGION-CODE='NORTH'", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBEXPORT.cbl:278-279", "plain": "Every exported record is labelled as coming from branch '0001' in region 'NORTH', whatever the actual customer, account or address.", "defect": "With the branch and region hardcoded, a multi-branch migration would label every record with the same wrong origin."}, {"key": "claude/RULE-212", "function": "claude/util/01", "id": "RULE-212", "name": "Sensitive customer and card data exported in clear", "text": "Given A customer with an SSN on file and a card with a 3-digit CVV\nWhen The 'C' and 'D' export records are written\nThen EXP-CUST-SSN holds the full 9-digit SSN, and EXP-CARD-CVV-CD (line 537) holds the CVV in binary form. Neither is masked", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001", "REQ-N-002"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:294-298", "plain": "The export copies the customer's SSN, government-issued ID, date of birth, EFT account ID and FICO score, plus each card's CVV, into the migration file with no masking or encryption.", "defect": "Card security rules generally forbid keeping or sending the CVV after authorisation, and exporting SSNs unmasked increases the privacy risk. A rewrite should confirm whether these fields should be dropped or encrypted."}, {"key": "claude/RULE-213", "function": "claude/util/02", "id": "RULE-213", "name": "Route each export record to its target master file by record type", "text": "Given An export file (indexed, read sequentially by EXPORT-SEQUENCE-NUM) containing records with type codes 'C', 'A', 'X', 'T', 'D' and 'Z'\nWhen The CBIMPORT batch reads each record\nThen 'C' is written to CUSTOUT, 'A' to ACCTOUT, 'X' to XREFOUT, 'T' to TRNXOUT, 'D' to CARDOUT, and 'Z' goes to the unknown-record error path; the matching per-type import counter is incremented by 1", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-006"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBIMPORT.cbl:270-285", "plain": "Each record in the branch-migration export file is sent to exactly one target file depending on its one-character record type: C=Customer, A=Account, X=Card cross-reference, T=Transaction, D=Card; anything else is treated as an unknown record.", "defect": ""}, {"key": "claude/RULE-214", "function": "claude/stmt/01", "id": "RULE-214", "name": "In-memory capacity limit of 51 cards x 10 transactions per card", "text": "Given A transaction extract with 12 transactions for one card, or 52 distinct cards\nWhen The transaction file is loaded into the in-memory table (lines 818-830)\nThen Subscripts go past the table bounds without any check; data overwrites neighboring storage or the job abends, and statements may show wrong or missing transactions", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001", "REQ-N-002"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBSTM03A.CBL:225-233", "plain": "The statement run can hold at most 51 distinct card numbers and at most 10 transactions per card for the whole run, and nothing checks these limits.", "defect": "There is no bounds check on CR-CNT (>51) or TR-CNT (>10). Real transaction volumes would exceed these limits and corrupt statements without any error. The rewrite should drop the fixed limits or enforce them explicitly."}, {"key": "claude/RULE-215", "function": "claude/stmt/01", "id": "RULE-215", "name": "Statement header content comes from customer and account master data", "text": "Given Customer 'John A Smith', 12 Main St, Apt 4, 'Austin TX USA 78701', account 00000000011 with current balance -250.00 and FICO 720\nWhen The statement header is written\nThen It shows name 'John A Smith', address lines as given, 'Account ID : 00000000011', 'Current Balance : 000000250.00-' and 'FICO Score : 720' in both the text and HTML statements", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018", "REQ-F-025"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBSTM03A.CBL:458-504", "plain": "Each statement shows the customer's name (first, middle, last), three address lines (line 3 combined with state, country and ZIP), the account ID, the account's current balance from the account master (not recomputed), and the customer's FICO score.", "defect": "STRING ... DELIMITED BY ' ' cuts multi-word first, middle and last names and multi-word city/address-line-3 values down to the first word."}, {"key": "claude/RULE-216", "function": "claude/stmt/01", "id": "RULE-216", "name": "Transactions are assigned to a statement by exact card-number match against a card-sorted extract", "text": "Given A transaction extract sorted by card number then transaction ID, containing 3 rows for card A and 2 rows for card B\nWhen The transaction file is loaded and then the statement for card B is built\nThen Card A and card B occupy separate table slots with counts 3 and 2; the card-B statement prints exactly its 2 transactions in transaction-ID order. The lookup (lines 416-432) stops early when it reaches a table card number greater than the requested card.", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBSTM03A.CBL:818-853", "plain": "All transactions are loaded once into memory grouped by card number (the input is pre-sorted by card number then transaction ID), and each statement lists only the transactions whose card number equals the card on the cross-reference record.", "defect": ""}, {"key": "claude/RULE-217", "function": "claude/stmt/02", "id": "RULE-217", "name": "Statement data access: allowed operations per file", "text": "Given The statement program (CBSTM03A) calls the routine with a file name (TRNXFILE, XREFFILE, CUSTFILE or ACCTFILE) and an operation code (O=open, R=sequential read, K=keyed read, C=close)\nWhen The routine handles the request\nThen TRNXFILE and XREFFILE accept O, R and C (sequential read in key order: card number + transaction id for transactions, card number for xref). CUSTFILE and ACCTFILE accept O, K and C (random keyed read). All files are opened INPUT only, so this routine never changes data. The record read is returned in the 1000-byte data area.", "program": "CBSTM03B", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBSTM03B.CBL:114-229", "plain": "The statement file-access routine lets the statement program open, read and close four data sets, all read-only: transactions and card cross-references are read in key order one after another, and customers and accounts are looked up by key.", "defect": "Operations that are not supported, including the declared WRITE/REWRITE codes, fail silently. The routine returns the last file status, which may be '00' from an earlier successful call, so the caller can think the operation worked. An unknown file name leaves the return code unchanged."}, {"key": "claude/RULE-218", "function": "claude/posting/01", "id": "RULE-218", "name": "Rejected transactions are written to the daily rejects file with a reason trailer", "text": "Given A daily file of 120 transactions of which 3 fail validation\nWhen The posting batch completes\nThen 117 are posted, 3 reject records are written (350-byte original record + 80-byte trailer of 4-digit reason code and 76-char description), the job reports 120 processed / 3 rejected, and sets RETURN-CODE 4", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-N-001", "REQ-F-012"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBTRN02C.cbl:202-231", "plain": "Every daily transaction is counted; those failing validation are counted as rejects and written unchanged to the rejects file with a 4-digit reason code and description, and the job ends with return code 4 if any were rejected.", "defect": ""}, {"key": "claude/RULE-219", "function": "claude/account/02", "id": "RULE-219", "name": "Function key eligibility and exit routing", "text": "Given The update screen is displayed\nWhen The operator presses PF5 before the changes have been validated, or presses PF7\nThen The key is treated as Enter. PF3 sets the target to the caller's transaction and program (default CM00/COMEN01C), issues SYNCPOINT, and transfers control", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-038", "REQ-F-040", "REQ-F-041", "REQ-F-042"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:905-959", "plain": "Only Enter, PF3 (exit), PF5 (save, only after changes are validated) and PF12 (cancel/refresh, only after an account is fetched) are honoured. Any other key is treated as Enter. PF3 commits and returns to the calling program, or to the main menu if there was none.", "defect": ""}, {"key": "claude/RULE-220", "function": "claude/account/01", "id": "RULE-220", "name": "Account and customer details displayed only when found in master files", "text": "Given Account 00000012345 was found in ACCTDAT and its customer 000000001 in CUSTDAT\nWhen The screen is built\nThen All account fields and all customer fields are populated; if no info message is set the info line reads 'Enter or update id of account to display'.\nAnd On first entry with no commarea (EIBCALEN=0) only the prompt is shown.", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-016", "REQ-F-017", "REQ-F-018", "REQ-F-019"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COACTVWC.cbl:460-535", "plain": "Account financial details (status, balance, credit limit, cash limit, cycle credits/debits, open/expiry/reissue dates, group) are shown when the account or customer was found, and customer personal details (name, address, phones, SSN, FICO, DOB, government ID, EFT account, primary cardholder flag) are shown only when the customer was found.", "defect": "Success info message is never set; after a successful lookup the user still sees the input prompt (9000-READ-ACCT clears info msg at line 689, then line 528-530 re-sets the prompt)."}, {"key": "claude/RULE-221", "function": "claude/account/01", "id": "RULE-221", "name": "Customer SSN displayed in full in NNN-NN-NNNN format", "text": "Given Customer record with SSN 123456789\nWhen The account view screen is displayed\nThen The SSN field shows '123-45-6789' (full value, no masking).", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-020"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COACTVWC.cbl:493-507", "plain": "The customer's Social Security Number is shown on the account view screen unmasked, formatted with dashes as 3-2-4 digits.", "defect": ""}, {"key": "claude/RULE-222", "function": "claude/txn/01", "id": "RULE-222", "name": "Standard attributes of an online bill payment transaction", "text": "Given A confirmed payment for account 00000000011, whose linked card is 4111111111111111, at 2026-11-23 10:15:30\nWhen The transaction record is built\nThen TRAN-TYPE-CD='02', TRAN-CAT-CD=2, TRAN-SOURCE='POS TERM', TRAN-DESC='BILL PAYMENT - ONLINE', TRAN-CARD-NUM=4111111111111111, MERCHANT-ID=999999999, MERCHANT-NAME='BILL PAYMENT', MERCHANT-CITY='N/A', MERCHANT-ZIP='N/A', TRAN-ORIG-TS=TRAN-PROC-TS='2026-11-23 10:15:30.000000'", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021", "REQ-F-022"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COBIL00C.cbl:218-232", "plain": "Every online bill payment is recorded as transaction type '02' with category 2 and source 'POS TERM'. It uses the description 'BILL PAYMENT - ONLINE', the account's linked card number, a fixed pseudo-merchant, and the current timestamp as both the origination and processing time.", "defect": ""}, {"key": "claude/RULE-223", "function": "claude/card/01", "id": "RULE-223", "name": "Card list filter by account and/or card number", "text": "Given The card file holds cards 4111000000000001 (acct 00000000010), 4111000000000002 (acct 00000000010), 4111000000000003 (acct 00000000020)\nWhen The user enters account filter 00000000010 and leaves card filter blank\nThen Only the two cards on account 00000000010 are listed. Entering card filter 4111000000000003 as well would list nothing ('NO RECORDS FOUND FOR THIS SEARCH CONDITION.'), because both filters must match (AND).", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-N-001", "REQ-F-006", "REQ-F-010"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COCRDLIC.cbl:1382-1407", "plain": "A card appears on the list only if it matches the account number filter (when one was entered and is valid) and the card number filter (when one was entered and is valid). With no valid filter, every card in the card file is listed.", "defect": ""}, {"key": "claude/RULE-224", "function": "claude/card/03", "id": "RULE-224", "name": "Allowed function keys depend on update state", "text": "Given State 'details shown' (S) with no validated changes\nWhen The user presses PF5\nThen PF5 is treated as Enter, so nothing is saved; only in state 'N' (changes OK, not confirmed) does PF5 trigger the save", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-014"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:413-424", "plain": "Enter and PF3 are always accepted; PF5 (save) is only accepted when edits have been validated and await confirmation; PF12 (cancel/re-read) is only accepted once card details have been fetched; any other key is treated as Enter.", "defect": ""}, {"key": "claude/RULE-225", "function": "claude/signon/02", "id": "RULE-225", "name": "Optional pending-authorization module is offered only if installed", "text": "Given A valid, permitted Main Menu option 11 whose program is COPAUS0C\nWhen The user selects it\nThen The system asks CICS whether COPAUS0C is defined. If yes, it records where the user came from and transfers control. If not, it shows a red 'This option <option name> is not installed...' and the menu again", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:145-168", "plain": "When the user picks the pending-authorization function (program COPAUS0C), the system first checks that the module is installed. If it is, the user is taken there. If not, a red 'This option <name> is not installed...' message is shown.", "defect": ""}, {"key": "claude/RULE-226", "function": "claude/report/01", "id": "RULE-226", "name": "Report type selection and precedence", "text": "Given The transaction report screen has Monthly = 'X', Yearly = 'X' and Custom blank\nWhen The user presses Enter\nThen Only the Monthly report is processed. If all three selectors are blank or low-values, the message 'Select a report type to print report...' is shown and the cursor goes to the Monthly field", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CORPT00C.cbl:212-256", "plain": "The user picks one of three transaction report types (Monthly, Yearly, Custom). If more than one is marked, Monthly wins over Yearly and Yearly wins over Custom. If none is marked, the request is rejected.", "defect": ""}, {"key": "claude/RULE-227", "function": "claude/signon/01", "id": "RULE-227", "name": "No limit on failed sign-on attempts", "text": "Given A user has entered a wrong password 10 times in a row\nWhen They submit the 11th attempt\nThen The password is checked again exactly as on the first attempt; no lockout or logging occurs", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-002", "REQ-N-003"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COSGN00C.cbl:241-256", "plain": "Failed sign-on attempts (wrong password or unknown user) simply redisplay the screen; there is no attempt counter, lockout, delay, or audit record.", "defect": "Absence of lockout and distinct not-found/wrong-password messages allow brute-force and user enumeration; likely needs a defined policy in the target system."}, {"key": "claude/RULE-228", "function": "claude/txn/02", "id": "RULE-228", "name": "Transaction list visible to any signed-on user (no account scoping)", "text": "Given A regular (non-admin) user whose commarea holds account 00000000001\nWhen The user opens the transaction list\nThen Transactions from all accounts and cards are listed in transaction-ID order; nothing in the program limits results to the user's account or checks user type", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COTRN00C.cbl:591-600", "plain": "The list browses the whole TRANSACT file by transaction ID with no filter on the user's account, card or customer, so every user sees all transactions.", "defect": ""}, {"key": "claude/RULE-229", "function": "claude/txn/03", "id": "RULE-229", "name": "Explicit confirmation required before posting", "text": "Given All fields are valid and Confirm = 'N'\nWhen Enter is pressed\nThen The message 'Confirm to add this transaction...' is shown and nothing is written. With Confirm = 'Y' or 'y', the transaction is added. With Confirm = 'X', the message 'Invalid value. Valid values are (Y/N)...' is shown", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:164-188", "plain": "A transaction is written only after every validation passes and the operator types Y in the Confirm field. A blank or N asks for confirmation, and any other value is rejected.", "defect": ""}, {"key": "claude/RULE-230", "function": "claude/useradmin/01", "id": "RULE-230", "name": "Start-from user ID filter resets list to page 1", "text": "Given The operator types 'ADMIN' in the 'Search User ID' field\nWhen Enter is pressed (and no valid U/D selection transferred control)\nThen The page counter is set to 0, a browse starts at key 'ADMIN' on the USRSEC file, and up to 10 users from that key onward are shown as page 1; the search field is cleared after a successful load", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COUSR00C.cbl:218-232", "plain": "On Enter, the list starts at the user ID typed in the search field, or at the beginning of the user file if the field is blank, and page numbering restarts.", "defect": ""}, {"key": "claude/RULE-231", "function": "claude/useradmin/02", "id": "RULE-231", "name": "Passwords are stored exactly as entered (plaintext, max 8 chars)", "text": "Given An administrator enters password 'Pa****' for a new user\nWhen the user is added\nThen the 8-character password field of the USRSEC record holds the same characters as entered", "program": "COUSR01C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COUSR01C.cbl:154-159", "plain": "The password typed by the administrator is copied directly into the user security record without hashing, encryption or strength rules.", "defect": "Credentials stored in clear text with no strength policy."}, {"key": "claude/RULE-232", "function": "claude/useradmin/03", "id": "RULE-232", "name": "Update User screen function-key actions", "text": "Given An admin on the Update User screen (transaction CU02)\nWhen the admin presses a key\nThen Enter -> fetch user; PF5 -> validate and save; PF3 -> validate and save, then go back to the calling program (Admin menu COADM01C if no caller is recorded); PF4 -> clear all fields and the message; PF12 -> go to Admin menu COADM01C without saving; other keys -> invalid-key message", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COUSR02C.cbl:108-131", "plain": "On the Update User screen, Enter fetches the user, PF5 saves, PF3 saves and then leaves, PF4 clears the screen, PF12 cancels back to the Admin menu, and any other key is rejected as invalid.", "defect": "PF3 (Save & Exit) always transfers control after UPDATE-USER-INFO without checking the error flag. A failed or rejected save exits silently instead of keeping the admin on the screen."}, {"key": "claude/RULE-233", "function": "claude/useradmin/02", "id": "RULE-233", "name": "No role check inside user add/delete programs", "text": "Given A session invokes transaction CU03 (or CU01) with no communication area\nWhen the program starts\nThen control is transferred to the sign-on program COSGN00C; when a communication area is present the program proceeds without checking CDEMO-USER-TYPE = 'A'", "program": "COUSR03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-006"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COUSR03C.cbl:90-132", "plain": "The add and delete user programs do not verify that the caller is an Admin; access control relies on these screens only being reachable from the admin menu, and a session without context is sent back to sign-on.", "defect": "Authorization not enforced at the program that mutates the user security file."}, {"key": "claude/RULE-234", "function": "claude/util/05", "id": "RULE-234", "name": "Date validation result contract: severity becomes return code, message number drives caller acceptance", "text": "Given CSUTLDTC validates a date and CEEDAYS reports severity 3, message 2508\nWhen The routine returns to the caller\nThen LS-RESULT = '0003Mesg Code:2508 Datevalue error TstDate:<date> Mask used:YYYY-MM-DD', RETURN-CODE = 3, and the caller (CORPT00C/COTRN02C) treats the date as invalid because severity is not '0000' and message is not '2513'", "program": "CSUTLDTC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CSUTLDTC.cbl:88-100", "plain": "The validator returns an 80-character result whose first 4 characters are the severity and characters 16-19 are the message number, and also sets the program return code to the severity; callers accept a date when severity is '0000', and otherwise still accept it only when the message number is '2513' (unsupported range).", "defect": ""}, {"key": "claude/RULE-235", "function": "claude/auth/01", "id": "RULE-235", "name": "Per-trigger processing limit and queue wait", "text": "Given The request queue holds 800 messages\nWhen The program is triggered\nThen It processes 501 messages (the check is > 500), committing (SYNCPOINT) after each, then stops. The rest waits for the next trigger.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-N-002", "REQ-F-004"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-345", "plain": "One triggered run keeps processing authorization requests until the queue is empty (after waiting up to 5 seconds) or until it has processed more than 500 messages. It commits after each message.", "defect": ""}, {"key": "claude/RULE-236", "function": "claude/trantype/02", "id": "RULE-236", "name": "Navigation: PF3 returns to the caller or admin menu, PF2 opens the add screen", "text": "Given The user reached this screen from the admin menu\nWhen The user presses PF3\nThen The program issues SYNCPOINT and transfers control (XCTL) to COADM01C", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022", "REQ-F-023", "REQ-F-024"], "priority": "P2", "category": "Policy", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:591-652", "plain": "PF3 commits and returns to the calling program, or to the Admin menu (COADM01C / CA00) when there is no other caller. PF2 transfers to the transaction-type add/update program COTRTUPC.", "defect": "PF2 sets CDEMO-USRTYP-USER (line 634) before transferring, whereas every other path sets ADMIN. This may downgrade the user type passed to the add screen."}, {"key": "claude/RULE-237", "function": "claude/trantype/03", "id": "RULE-237", "name": "Function keys allowed depend on screen state", "text": "Given The screen is in a given maintenance state\nWhen The operator presses a key\nThen F3 always allowed (exit); Enter allowed except during delete confirmation; F4 only when details shown or delete confirm pending; F5 only when changes are validated, record not found, or delete in progress; F12 when changes validated, details shown, not found, delete confirm, or creating new; otherwise 'Invalid key pressed'", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-023", "REQ-F-024"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:577-618", "plain": "Each function key is only accepted in certain states; any other key shows 'Invalid key pressed' and redisplays the screen.", "defect": ""}, {"key": "claude/RULE-238", "function": "claude/util/04", "id": "RULE-238", "name": "Full sequential dump of master file in key order", "text": "Given The card master file (CARDFILE, keyed by a 16-character card number) holds 3 records\nWhen Batch job READCARD runs CBACT02C\nThen All 3 card records are printed once each, in ascending card-number order, between the 'START OF EXECUTION' and 'END OF EXECUTION' banner lines, and the file is never updated", "program": "CBACT02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBACT02C.cbl:70-87", "plain": "Each utility opens one master file read-only and prints every record from first to last in key order. It does not filter, change or calculate anything.", "defect": ""}, {"key": "claude/RULE-239", "function": "claude/util/04", "id": "RULE-239", "name": "Each record is printed twice in the cross-reference and customer dumps", "text": "Given XREFFILE has 2 cross-reference records\nWhen CBACT03C runs\nThen The output has 4 record lines (each record twice in a row). CBCUS01C does the same for customer records. CBACT02C has the extra display commented out, so it prints each record once", "program": "CBACT03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005"], "priority": "P2", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBACT03C.cbl:92-96", "plain": "In CBACT03C and CBCUS01C each record is printed once inside the read routine and again in the main loop, so every record appears twice in the output. CBACT02C prints each record once.", "defect": "Records are printed twice: the DISPLAY at line 96 inside the read routine of CBACT03C and CBCUS01C duplicates the main-loop DISPLAY at line 78. CBACT02C has the same line commented out, which suggests this is a leftover debug statement."}, {"key": "claude/RULE-240", "function": "claude/posting/03", "id": "RULE-240", "name": "Fee assessment not implemented", "text": "Given A category balance with a non-zero interest rate\nWhen Interest is computed and the fee step runs\nThen No fee is calculated or posted", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBACT04C.cbl:518-520", "plain": "A fee-calculation step runs whenever interest is calculated, but it is an empty stub, so no fees are charged.", "defect": ""}, {"key": "claude/RULE-241", "function": "claude/stmt/01", "id": "RULE-241", "name": "Issuer branding and address hardcoded on HTML statements", "text": "Given Any account statement\nWhen The HTML statement header is written (lines 537-544)\nThen The issuer name and address lines appear exactly as the hardcoded literals", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBSTM03A.CBL:167-172", "plain": "Every HTML statement carries a fixed issuer block, 'Bank of XYZ, 410 Terry Ave N, Seattle WA 99999', coded as literals.", "defect": ""}, {"key": "claude/RULE-242", "function": "claude/posting/02", "id": "RULE-242", "name": "Any master-file open or close failure stops the batch (fail-fast)", "text": "Given The account master file is unavailable and its OPEN returns status '35'\nWhen The batch starts and opens its files\nThen The batch writes 'ERROR OPENING ACCOUNT FILE' and 'FILE STATUS IS: NNNN0035', then abends with code 999. No transactions are processed.", "program": "CBTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-002"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBTRN01C.cbl:271-359", "plain": "Every input file (daily transactions, customer, cross-reference, card, account, transaction master) must open and close with status '00'. Any other status stops the job abnormally with code 999.", "defect": "In 9000-DALYTRAN-CLOSE (lines 372-373), a close failure on the daily transaction file writes 'ERROR CLOSING CUSTOMER FILE' and shows CUSTFILE-STATUS instead of DALYTRAN-STATUS, so the diagnostic points at the wrong file."}, {"key": "claude/RULE-243", "function": "claude/report/02", "id": "RULE-243", "name": "Report pagination every 20 lines", "text": "Given Page size 20 and the line counter currently at 20\nWhen The next transaction detail is about to be printed\nThen A page-total line and header separator are written, followed by report name header, blank line and two column headers, and then the detail line", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P2", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBTRN03C.cbl:274-290", "plain": "The report prints headers (with the report period) before the first detail line and then starts a new page, preceded by a page-total line, whenever the running line count is an exact multiple of 20.", "defect": "Exact-modulo check MOD(WS-LINE-COUNTER, 20) = 0 can be skipped when 2-line total blocks straddle a multiple of 20, producing irregular page lengths."}, {"key": "claude/RULE-244", "function": "claude/report/02", "id": "RULE-244", "name": "Transaction detail line content", "text": "Given Transaction T1 on a card linked to account 00000000011, type 01 'Purchase', category 0001 'Regular Sales Draft', source POS TERM, amount 50.00\nWhen The detail line is written\nThen The line shows T1, 00000000011, 01-Purchase, 0001-Regular Sales Draft, POS TERM, 50.00", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-N-002"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBTRN03C.cbl:361-374", "plain": "Each report detail line shows transaction ID, the account ID derived from the card cross-reference, transaction type code and description, category code and description, transaction source, and amount.", "defect": ""}, {"key": "claude/RULE-245", "function": "claude/account/02", "id": "RULE-245", "name": "Editable versus protected fields", "text": "Given An account in state 'S' or 'E'\nWhen The screen is displayed\nThen Status, limits, balance, cycle totals, dates, group, SSN, FICO, DOB, names, address, state, ZIP, phones, government ID, EFT and primary flag are unprotected; customer ID and country are protected; in states 'N' and 'C' all fields are protected", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-039"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:3500-3560", "plain": "When account details are shown for editing, all account and customer fields can be edited except customer ID and country, which are protected. Before a fetch, only the account number can be edited.", "defect": ""}, {"key": " , "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/COUSR03C.cbl:108-130", "plain": "On the user admin screens, Enter processes the form, PF3 goes back, PF4 clears the form, and any other unsupported key shows an invalid-key message; on the delete screen PF5 confirms delete and PF12 returns to the admin menu.", "defect": ""}], "questions": [{"key": "claude/signon/01/OQ-001", "code": "OQ-001", "text": "Is there an external control (e.g., RACF/ESM or CICS sign-on) enforcing lockout, or should the modernized system introduce a failed-attempt limit and a single generic failure message?", "owner": "Security officer", "unverified": false, "capability": "claude/signon/01#4", "function": "claude/signon/01", "rule": "RULE-227"}, {"key": "claude/signon/02/OQ-001", "code": "OQ-001", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (The code matches the rule. At COMEN01C.cbl:82-84, when EIBCALEN = 0 the program does RETURN-TO-SIGNON-SCREEN. That paragraph (lines 196-203) sets CDEMO-TO-PROGRAM to 'COSGN00C' when it is blank or low-values, which it is on a fresh start, and then does XCTL to it. No menu is sent. When session data\u2026", "owner": "Business owner", "unverified": false, "capability": "claude/signon/02#1", "function": "claude/signon/02", "rule": "RULE-174"}, {"key": "claude/signon/03/OQ-001", "code": "OQ-001", "text": "Is it intended that only sign-on (COSGN00C) enforces admin-only access to the Admin Menu? Should the rewrite enforce user type 'A' on every admin function?", "owner": "Security officer", "unverified": false, "capability": "claude/signon/03#2", "function": "claude/signon/03", "rule": "RULE-044"}, {"key": "claude/useradmin/01/OQ-001", "code": "OQ-001", "text": "Should the search field find the first user ID greater than or equal to the value typed (partial match), or only an exact match? The GTEQ option is commented out at line 592, so the result depends on the CICS default.", "owner": "Business analyst", "unverified": false, "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rule": "RULE-230"}, {"key": "claude/useradmin/01/OQ-002", "code": "OQ-002", "text": "When paging back from a page that has fewer than 10 earlier users, should the list reset to the true first page (users 1-10) instead of showing a partly blank page?", "owner": "Product owner", "unverified": false, "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rule": "RULE-032"}, {"key": "claude/useradmin/01/OQ-003", "code": "OQ-003", "text": "The P0 panel split on whether this rule is critical to the system's core purpose or costly if wrong; the rule card matches the code, but one reviewer judged it does not warrant P0. Should it be treated as P0?", "owner": "Product owner", "unverified": false, "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rule": "RULE-121"}, {"key": "claude/useradmin/02/OQ-001", "code": "OQ-001", "text": "Should User Type be limited to 'A' (Admin) and 'U' (Regular), and is any validation of this field enforced by the BMS map COUSR01 rather than the program?", "owner": "Security officer", "unverified": false, "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rule": "RULE-123"}, {"key": "claude/useradmin/02/OQ-002", "code": "OQ-002", "text": "Is admin-only access to user add/delete enforced elsewhere (CICS transaction security, menu COADM01C), and must the new system enforce an explicit Admin role check on these operations?", "owner": "Security officer", "unverified": false, "capability": "claude/useradmin/02#3", "function": "claude/useradmin/02", "rule": "RULE-233"}, {"key": "claude/useradmin/03/OQ-001", "code": "OQ-001", "text": "This program does not check that the session belongs to an Admin user type; is admin-only access enforced only by 0-READ-ACCT reads CXACAIX by account\u2026", "owner": "Account servicing subject-matter expert", "unverified": false, "capability": "claude/account/01#2", "function": "claude/account/01", "rule": "RULE-097"}, {"key": "claude/account/01/OQ-002", "code": "OQ-002", "text": "Should account financials be displayed when only the customer record was found (account master missing), and should a success message ('Displaying details of given Account') be shown after a successful lookup instead of the input prompt?", "owner": "Customer service operations lead", "unverified": false, "capability": "claude/account/01#3", "function": "claude/account/01", "rule": "RULE-220"}, {"key": "claude/account/01/OQ-003", "code": "OQ-003", "text": "Is displaying the full unmasked SSN to all users of the account view acceptable under privacy policy, or should the modernized system mask all but the last 4 digits / restrict by role?", "owner": "Privacy and compliance officer", "unverified": false, "capability": "claude/account/01#3", "function": "claude/account/01", "rule": "RULE-221"}, {"key": "claude/account/02/OQ-001", "code": "OQ-001", "text": "P0 panel doubts spec fidelity: P0 is justified. Paragraph 9600-WRITE-PROCESSING (COACTUPC.cbl:3888-4104) is the only place this program saves the account and customer records. It rewrites financial fields: current balance, credit limit, cash credit limit, and cycle credit and debit (3964-3974). It also rewrites regulated customer data: SSN, government ID, date of birth, EFT account and FICO score\u2026", "owner": "Account servicing subject-matter expert", "unverified": false, "capability": "claude/account/02#5", "function": "claude/account/02", "rule": "RULE-134"}, {"key": "claude/card/01/OQ-001", "code": "OQ-001", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (Faithful: 9500-FILTER-RECORDS (COCRDLIC.cbl:1382-1407) starts with \"do not exclude\". It excludes a record when the account filter is valid and CARD-ACCT-ID differs from CC-ACCT-ID, or when the card filter is valid and CARD-NUM differs from CC-CARD-NUM-N. The two filters combine with AND, and with no\u2026", "owner": "Card operations subject-matter expert", "unverified": false, "capability": "claude/card/01#1", "function": "claude/card/01", "rule": "RULE-223"}, {"key": "claude/card/01/OQ-002", "code": "OQ-002", "text": "When paging back hits the start of the file before filling 7 rows (e.g. after filtering), should the screen show a partial page without a file error? Currently any non-normal response, including end-of-file, produces a 'File Error' message.", "owner": "Card operations subject-matter expert", "unverified": false, "capability": "claude/card/01#2", "function": "claude/card/01", "rule": "RULE-025"}, {"key": "claude/card/01/OQ-003", "code": "OQ-003", "text": "Is the two-step behaviour on the last page (first PF8 shows the action prompt, the second shows 'NO MORE PAGES TO DISPLAY') intended?", "owner": "Card operations subject-matter expert", "unverified": false, "capability": "claude/card/01#2", "function": "claude/card/01", "rule": "RULE-249"}, {"key": "claude/card/01/OQ-004", "code": "OQ-004", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (Not P0, though the card mostly matches the code. COCRDLIC.cbl:517-569 does what it says. When the user presses Enter, a row is selected and CDEMO-FROM-PROGRAM = 'COCRDLIC' (the previous screen was this list), 'S' transfers control to COCRDSLC and 'U' to COCRDUPC. The literals are COCRDSL/CCRDSLA for\u2026", "owner": "Card operations subject-matter expert", "unverified": false, "capability": "claude/card/01#3", "function": "claude/card/01", "rule": "RULE-170"}, {"key": "claude/card/02/OQ-001", "code": "OQ-001", "text": "Should exiting the card detail screen keep the signed-on user's type (admin or regular) instead of always resetting it to regular user? / Line 344 forces the session user type to 'U' (regular user) on exit, even for an admin user; is this intentional demotion or a defect?", "owner": "Security and access-control owner", "unverified": false, "capability": "claude/card/02#3", "function": "claude/card/02", "rule": "RULE-172"}, {"key": "claude/card/03/OQ-001", "code": "OQ-001", "text": "Should the expiry date be required to be in the future (or no earlier than the current expiry), and should day-of-month be recomputed (e.g. last day of month) rather than carried from a hidden screen field?", "owner": "Card operations subject-matter expert", "unverified": false, "capability": "claude/card/03#1", "function": "claude/card/03", "rule": "RULE-107"}, {"key": "claude/card/03/OQ-002", "code": "OQ-002", "text": "Is forcing the user type to 'regular user' on exit from card update intentional, or should the signed-on user type be preserved?", "owner": "Security and access-control owner", "unverified": false, "capability": "claude/card/03#3", "function": "claude/card/03", "rule": "RULE-252"}, {"key": "claude/txn/01/OQ-001", "code": "OQ-001", "text": "Citation was corrected by referee: the cited lines 158-171 of COBIL00C.cbl cover just the blank check; the 'must exist' check and the other error messages are elsewhere. Please confirm the full account-ID validation behaviour.", "owner": "Legacy application SME", "unverified": false, "capability": "claude/txn/01#2", "function": "claude/txn/01", "rule": "RULE-098"}, {"key": "claude/txn/01/OQ-002", "code": "OQ-002", "text": "Entering 'Y' on the very first submission posts the payment immediately without a separate preview step. Should a preview of the balance always be shown before a payment can be confirmed?", "owner": "Payments business owner", "unverified": false, "capability": "claude/txn/01#4", "function": "claude/txn/01", "rule": "RULE-135"}, {"key": "claude/txn/01/OQ-003", "code": "OQ-003", "text": "Type '02' / category 2 is hardcoded here. Does it match the payment type and category in the transaction-type reference data, and should the payment amount be stored positive or negative relative to purchases?", "owner": "Payments business owner", "unverified": false, "capability": "claude/txn/01#6", "function": "claude/txn/01", "rule": "RULE-222"}, {"key": "claude/txn/01/OQ-004", "code": "OQ-004", "text": "Is 'max existing ID + 1' the required numbering scheme for payments, or should a central sequence or counter be used to avoid collisions with concurrent postings and batch-generated transactions?", "owner": "Solution architect", "unverified": false, "capability": "claude/txn/01#6", "function": "claude/txn/01", "rule": "RULE-031"}, {"key": "claude/txn/02/OQ-001", "code": "OQ-001", "text": "Is it intended that any signed-on user (including regular users) can list and open every transaction in the system, or should the list be restricted to the user's own account/cards?", "owner": "Security/compliance officer", "unverified": false, "capability": "claude/txn/02#2", "function": "claude/txn/02", "rule": "RULE-228"}, {"key": "claude/txn/02/OQ-002", "code": "OQ-002", "text": "Should a Tran ID that does not exist position the list at the next higher transaction (current CICS default GTEQ behaviour), or should it be reported as 'not found'?", "owner": "Product owner", "unverified": false, "capability": "claude/txn/02#3", "function": "claude/txn/02", "rule": "RULE-114"}, {"key": "claude/txn/02/OQ-003", "code": "OQ-003", "text": "When fewer than 10 earlier transactions exist, should the previous page be re-anchored to the start of the file (rows 1-10 filled from the top) instead of leaving blank top rows?", "owner": "Product owner", "unverified": false, "capability": "claude/txn/02#4", "function": "claude/txn/02", "rule": "RULE-028"}, {"key": "claude/txn/02/OQ-004", "code": "OQ-004", "text": "The P0 panel split on whether forward paging is critical to the system's core purpose or a costly-if-wrong rule. Please confirm its priority.", "owner": "Product owner", "unverified": false, "capability": "claude/txn/02#4", "function": "claude/txn/02", "rule": "RULE-029"}, {"key": "claude/txn/02/OQ-005", "code": "OQ-005", "text": "Is the READ ... UPDATE on a view-only screen intentional (e.g., to guarantee a consistent read) or an oversight that the new system should replace with a non-locking read?", "owner": "Solution architect", "unverified": false, "capability": "claude/txn/02#7", "function": "claude/txn/02", "rule": "RULE-117"}, {"key": "claude/txn/03/OQ-001", "code": "OQ-001", "text": "On first entry, is the pre-selected value (CDEMO-CT02-TRN-SELECTED) meant to be a card number? It is placed into the Card Number field, although the field name suggests a transaction ID.", "owner": "Legacy application SME", "unverified": false, "capability": "claude/txn/03#1", "function": "claude/txn/03", "rule": "RULE-186"}, {"key": "claude/txn/03/OQ-002", "code": "OQ-002", "text": "Is it intended to accept dates the date utility flags as outside its supported range (message 2513)? Should the processing date be required to be on or after the origination date, and should future dates be blocked?", "owner": "Product owner", "unverified": false, "capability": "claude/txn/03#3", "function": "claude/txn/03", "rule": "RULE-120"}, {"key": "claude/txn/03/OQ-003", "code": "OQ-003", "text": "Is 'max existing ID + 1' the required numbering scheme, or should a central sequence or counter be used to avoid collisions with concurrent postings and batch-generated transactions?", "owner": "Solution architect", "unverified": false, "capability": "claude/txn/03#5", "function": "claude/txn/03", "rule": "RULE-031"}, {"key": "claude/txn/03/OQ-004", "code": "OQ-004", "text": "Should PF5 copy the last transaction for the selected card or account, rather than the last transaction in the whole file?", "owner": "Product owner", "unverified": false, "capability": "claude/txn/03#6", "function": "claude/txn/03", "rule": "RULE-255"}, {"key": "claude/report/01/OQ-001", "code": "OQ-001", "text": "Should the Monthly report cover the current, still-open month (as the code does), or the previous month that has already closed?", "owner": "Reporting business owner", "unverified": false, "capability": "claude/report/01#2", "function": "claude/report/01", "rule": "RULE-026"}, {"key": "claude/report/01/OQ-002", "code": "OQ-002", "text": "Should a Custom report be rejected when the start date is after the end date? And should dates outside the supported range (CEEDAYS msg 2513) really be accepted?", "owner": "Reporting business owner", "unverified": false, "capability": "claude/report/01#3", "function": "claude/report/01", "rule": "RULE-110"}, {"key": "claude/report/01/OQ-003", "code": "OQ-003", "text": "The P0 panel split on whether report job submission is critical to the system's core purpose or a costly-if-wrong rule. Lines already written to the JOBS queue are not rolled back when a later write fails, so a partial job may reach the internal reader. How critical is this rule?", "owner": "Batch operations lead", "unverified": false, "capability": "claude/report/01#4", "function": "claude/report/01", "rule": "RULE-176"}, {"key": "claude/report/02/OQ-001", "code": "OQ-001", "text": "Out-of-range records hit NEXT SENTENCE, which in IBM COBOL exits the whole read loop (no further records, no grand total). Is the in-program filter meant to skip a record, and is it safe to rely solely on the JCL SORT INCLUDE pre-filter (TRANREPT.jcl:47-48) for the date range?", "owner": "Batch operations lead", "unverified": false, "capability": "claude/report/02#1", "function": "claude/report/02", "rule": "RULE-084"}, {"key": "claude/report/02/OQ-002", "code": "OQ-002", "text": "Is 20 lines per page a required business layout, and should page breaks be guaranteed (>= threshold) rather than exact-multiple based?", "owner": "Reporting business owner", "unverified": false, "capability": "claude/report/02#3", "function": "claude/report/02", "rule": "RULE-243"}, {"key": "claude/report/02/OQ-003", "code": "OQ-003", "text": "The P0 panel split on whether page and grand total accumulation is critical to the system's core purpose or a costly-if-wrong rule. At end of file the last transaction amount is added again, which overstates the final page total and the grand total. How critical is this rule?", "owner": "Finance reporting SME", "unverified": false, "capability": "claude/report/02#4", "function": "claude/report/02", "rule": "RULE-022"}, {"key": "claude/posting/01/OQ-001", "code": "OQ-001", "text": "Is the intended exposure measure cycle credits minus cycle debits (with debits stored as negatives, this effectively adds payments), or should it be the current balance plus the transaction amount? Should cash transactions be checked against the cash credit limit?", "owner": "Credit risk / card product owner", "unverified": false, "capability": "claude/posting/01#1", "function": "claude/posting/01", "rule": "RULE-043"}, {"key": "claude/posting/01/OQ-002", "code": "OQ-002", "text": "Is opening the transaction master with OPEN OUTPUT (which replaces existing contents each run) intended, or should posted transactions accumulate across days?", "owner": "Card operations / batch operations owner", "unverified": false, "capability": "claude/posting/01#4", "function": "claude/posting/01", "rule": "RULE-165"}, {"key": "claude/posting/02/OQ-001", "code": "OQ-001", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (The Given/When/Then matches the code at legacy/aws-carddemo/app/cbl/CBTRN01C.cbl:170-184 and the lookup paragraph at :227-239. The status is reset to 0 and the card number is moved into the lookup key. On INVALID KEY the status becomes 4, the \"CARD NUMBER ... COULD NOT BE VERIFIED. SKIPPING TRANSACT\u2026", "owner": "Business analyst / card operations owner", "unverified": false, "capability": "claude/posting/02#1", "function": "claude/posting/02", "rule": "RULE-079"}, {"key": "claude/posting/03/OQ-001", "code": "OQ-001", "text": "Is the interest batch meant to be the official cycle-close event that resets cycle credits and debits, and should accounts with no category balances also have their cycle totals reset?", "owner": "Card product / finance owner", "unverified": false, "capability": "claude/posting/03#3", "function": "claude/posting/03", "rule": "RULE-158"}, {"key": "claude/stmt/01/OQ-001", "code": "OQ-001", "text": "Is one statement per card (rather than one per account combining all its cards) the intended business policy, or an artifact of driving the run from the card cross-reference file?", "owner": "Card servicing business owner", "unverified": false, "capability": "claude/stmt/01#2", "function": "claude/stmt/01", "rule": "RULE-162"}, {"key": "claude/stmt/01/OQ-002", "code": "OQ-002", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (I read the cited code in legacy/aws-carddemo/app/cbl/CBSTM03A.CBL. The rule card matches it. - Line 325 resets WS-TOTAL-AMT to zero for each new cross-reference record, so each new statement starts from 0.00. - Lines 416-432 loop over the transactions for the matching card. Each one is printed (6000\u2026", "owner": "Finance / statements business owner", "unverified": false, "capability": "claude/stmt/01#5", "function": "claude/stmt/01", "rule": "RULE-019"}, {"key": "claude/stmt/02/OQ-001", "code": "OQ-001", "text": "Does the caller always pass key length 9 for customer and 11 for account? Should the new system check the key length and that the account key is numeric before the lookup?", "owner": "Application architect", "unverified": false, "capability": "claude/stmt/02#2", "function": "claude/stmt/02", "rule": "RULE-078"}, {"key": "claude/auth/01/OQ-001", "code": "OQ-001", "text": "Were the card-status, account-closed and fraud decline reasons (4200/4300/5100/5200) meant to be implemented in 5600-READ-PROFILE-DATA? What source data should drive them?", "owner": "Card authorization product owner", "unverified": false, "capability": "claude/auth/01#2", "function": "claude/auth/01", "rule": "RULE-051"}, {"key": "claude/auth/01/OQ-002", "code": "OQ-002", "text": "Should the declined-amount total use the current request's amount? And should an approval really set the cash balance to zero?", "owner": "Card authorization product owner", "unverified": false, "capability": "claude/auth/01#4", "function": "claude/auth/01", "rule": "RULE-002"}, {"key": "claude/auth/01/OQ-003", "code": "OQ-003", "text": "Is losing an in-flight request (consumed with NO-SYNCPOINT, already replied to, then a DB failure) acceptable, or should the authorization be reconciled?", "owner": "Card authorization operations lead", "unverified": false, "capability": "claude/auth/01#5", "function": "claude/auth/01", "rule": "RULE-195"}, {"key": "claude/auth/02/OQ-001", "code": "OQ-001", "text": "Should an account that is missing from the cross-reference, account or customer file stop the inquiry (no authorization list shown), or is showing whatever authorization data exists for the typed account ID the intended behavior?", "owner": "Customer service operations lead", "unverified": false, "capability": "claude/auth/02#1", "function": "claude/auth/02", "rule": "RULE-054"}, {"key": "claude/auth/02/OQ-002", "code": "OQ-002", "text": "Is it confirmed in production that PF7 cannot go back more than one page (page counter re-incremented), and how many pages should be supported for accounts with more than 100 pending authorizations?", "owner": "Customer service operations lead", "unverified": false, "capability": "claude/auth/02#2", "function": "claude/auth/02", "rule": "RULE-143"}, {"key": "claude/auth/02/OQ-003", "code": "OQ-003", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (The card matches the code. In COPAUS0C.cbl:536-540, PA-AUTH-RESP-CODE = '00' sets WS-AUTH-APRV-STAT to 'A' and every other code sets it to 'D'. COPAUS1C.cbl:311-317 does the same for the detail screen's AUTHRSPO field and colours it green or red. So the Given/When/Then is accurate: '00' shows 'A' an\u2026", "owner": "Card authorization product owner", "unverified": false, "capability": "claude/auth/02#2", "function": "claude/auth/02", "rule": "RULE-009"}, {"key": "claude/auth/02/OQ-004", "code": "OQ-004", "text": "Should the detail screen show the approved amount (current behavior) or the requested transaction amount, particularly for declined or partially approved authorizations? Is the expiry field stored as MMYY?", "owner": "Customer service operations lead", "unverified": false, "capability": "claude/auth/02#3", "function": "claude/auth/02", "rule": "RULE-035"}, {"key": "claude/auth/04/OQ-001", "code": "OQ-001", "text": "Should the summary be deleted only when both the approved and declined counts are zero, and only when no unexpired details remain under it?", "owner": "Authorization operations manager", "unverified": false, "capability": "claude/auth/04#1", "function": "claude/auth/04", "rule": "RULE-140"}, {"key": "claude/auth/05/OQ-001", "code": "OQ-001", "text": "The program declares an expiry-days parameter and checkpoint frequencies but never reads them (SYSIN accept is commented out). Should the unload be a full backup of all pending authorizations, or was it intended to exclude/purge authorizations older than N expiry days?", "owner": "Authorization operations manager", "unverified": false, "capability": "claude/auth/05#1", "function": "claude/auth/05", "rule": "RULE-199"}, {"key": "claude/auth/05/OQ-002", "code": "OQ-002", "text": "When a pending-authorization detail has no matching summary, or has a non-numeric account key, should the reload reject the record, report it, or stop the job? Today the record is dropped without any message.", "owner": "Authorization operations manager", "unverified": false, "capability": "claude/auth/05#2", "function": "claude/auth/05", "rule": "RULE-056"}, {"key": "claude/trantype/01/OQ-001", "code": "OQ-001", "text": "Can the transaction-type table ever need more than 9 pages (63 or more types), and how should a short backward page be handled?", "owner": "Business SME (transaction type reference data)", "unverified": false, "capability": "claude/trantype/01#2", "function": "claude/trantype/01", "rule": "RULE-014"}, {"key": "claude/trantype/02/OQ-001", "code": "OQ-001", "text": "The P0 panel split on whether the two-step F10 confirmation rule is critical to the system's core purpose or a costly-if-wrong rule; please confirm its priority.", "owner": "Business SME (transaction type reference data)", "unverified": false, "capability": "claude/trantype/02#3", "function": "claude/trantype/02", "rule": "RULE-151"}, {"key": "claude/trantype/02/OQ-002", "code": "OQ-002", "text": "The P0 panel split on whether the list-screen description update rule is critical to the system's core purpose or a costly-if-wrong rule; please confirm its priority.", "owner": "Business SME (transaction type reference data)", "unverified": false, "capability": "claude/trantype/02#4", "function": "claude/trantype/02", "rule": "RULE-149"}, {"key": "claude/trantype/02/OQ-003", "code": "OQ-003", "text": "The P0 panel split on whether the list-screen delete rule is critical to the system's core purpose or a costly-if-wrong rule; please confirm its priority.", "owner": "Business SME (transaction type reference data)", "unverified": false, "capability": "claude/trantype/02#5", "function": "claude/trantype/02", "rule": "RULE-150"}, {"key": "claude/trantype/02/OQ-004", "code": "OQ-004", "text": "Is access to transaction CTLI restricted to administrators by CICS/RACF transaction security, or should the program check the user type?", "owner": "Security officer", "unverified": false, "capability": "claude/trantype/02#6", "function": "claude/trantype/02", "rule": "RULE-203"}, {"key": "claude/trantype/02/OQ-005", "code": "OQ-005", "text": "Should the
