inputs validate and Confirm is 'N', 'n', space or low-values, the system shall show 'Confirm to add this transaction...' and write nothing.", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-187"], "sources": ["app/cbl/COTRN02C.cbl:164-188"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If Confirm holds any value other than 'Y', 'y', 'N', 'n', space or low-values, then the system shall show 'Invalid value. Valid values are (Y/N)...'.", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-187"], "sources": ["app/cbl/COTRN02C.cbl:164-188"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When a transaction is confirmed with 'Y' or 'y', the system shall assign its ID by reading the highest transaction ID on file and adding 1, starting from 1 if the file is empty.", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-187", "claude/RULE-015"], "sources": ["app/cbl/COTRN02C.cbl:442-451", "app/cbl/COTRN02C.cbl:685-689"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If two adds compute the same transaction ID, then the system shall fail the second with 'Tran ID already exist...', because read-max-plus-one is not concurrency-safe.", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-015"], "sources": ["app/cbl/COTRN02C.cbl:735-741"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the browse start returns NOTFND on an empty file, then the system shall show 'Transaction ID NOT found...', which blocks the very first add (the plugin flags this as a defect).", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-015"], "sources": ["app/cbl/COTRN02C.cbl:652-660"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When a transaction is confirmed, the system shall write it to TRANSACT with the generated ID, the entered type, category, source, description, amount and merchant details, the resolved card number, and the entered dates as the origination and processing timestamps.", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-188"], "sources": ["app/cbl/COTRN02C.cbl:450-466"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When the transaction is written successfully, the system shall clear the screen and show 'Transaction added successfully.  Your Tran ID is <id>.' in green.", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-188"], "sources": ["app/cbl/COTRN02C.cbl:450-466"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the write fails for a reason other than a duplicate key, then the system shall show 'Unable to Add Transaction...'.", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-188"], "sources": ["app/cbl/COTRN02C.cbl:450-466"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not update the account balance, the cycle credit/debit or the card status when adding a transaction.", "capability": "claude/transactions/03#3", "function": "claude/transactions/03", "rules": ["claude/RULE-188"], "sources": ["app/cbl/COTRN02C.cbl:450-466"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses PF5 and the entered account or card validates, the system shall copy type, category, source, amount, description, dates and merchant fields from the last transaction on file (highest TRAN-ID, regardless of card) and run the normal validation and confirmation flow against the entered card.", "capability": "claude/transactions/03#4", "function": "claude/transactions/03", "rules": ["claude/RULE-269"], "sources": ["app/cbl/COTRN02C.cbl:471-495"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "State-driven", "text": "While Confirm is already 'Y', the system shall add a copy of the last transaction immediately when the operator presses PF5.", "capability": "claude/transactions/03#4", "function": "claude/transactions/03", "rules": ["claude/RULE-269"], "sources": ["app/cbl/COTRN02C.cbl:471-495"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Unwanted", "text": "If the key fields fail validation when the operator presses PF5, then the system shall send the error screen and copy nothing.", "capability": "claude/transactions/03#4", "function": "claude/transactions/03", "rules": ["claude/RULE-269"], "sources": ["app/cbl/COTRN02C.cbl:471-495"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If transaction CT02 starts with no session context (no commarea), then the system shall transfer to sign-on COSGN00C.", "capability": "claude/transactions/03#5", "function": "claude/transactions/03", "rules": ["claude/RULE-200"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When the screen is entered for the first time with CDEMO-CT02-TRN-SELECTED populated, the system shall place that value in the Card Number field and run validation immediately.", "capability": "claude/transactions/03#5", "function": "claude/transactions/03", "rules": ["claude/RULE-200"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses PF3 or PF4, the system shall respectively return to the calling program (COMEN01C if there is none) or clear the screen.", "capability": "claude/transactions/03#5", "function": "claude/transactions/03", "rules": ["claude/RULE-200"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/03/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed, then the system shall reject it with CCDA-MSG-INVALID-KEY.", "capability": "claude/transactions/03#5", "function": "claude/transactions/03", "rules": ["claude/RULE-200"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/transactions/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the user selects Monthly and confirms, the system shall set the report period from the 1st through the last calendar day of the current month, based on the system date and honouring leap years.", "capability": "claude/transactions/04#1", "function": "claude/transactions/04", "rules": ["claude/RULE-013"], "sources": ["app/cbl/CORPT00C.cbl:212-255"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the user selects Yearly and confirms, the system shall set the report period from January 1 through December 31 of the current year.", "capability": "claude/transactions/04#1", "function": "claude/transactions/04", "rules": ["claude/RULE-013"], "sources": ["app/cbl/CORPT00C.cbl:212-255"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall format the start and end dates as YYYY-MM-DD and pass them to the batch job as PARM-START-DATE / PARM-END-DATE.", "capability": "claude/transactions/04#1", "function": "claude/transactions/04", "rules": ["claude/RULE-013"], "sources": ["app/cbl/CORPT00C.cbl:212-255"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall check Monthly first, then Yearly, then Custom, so that only the first non-blank selection is used.", "capability": "claude/transactions/04#1", "function": "claude/transactions/04", "rules": ["claude/RULE-013"], "sources": ["app/cbl/CORPT00C.cbl:212-255"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If no report type is selected, then the system shall show 'Select a report type to print report...'.", "capability": "claude/transactions/04#1", "function": "claude/transactions/04", "rules": ["claude/RULE-013"], "sources": ["app/cbl/CORPT00C.cbl:212-255"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If any custom date part is blank (checked in the order start MM, start DD, start YYYY, end MM, end DD, end YYYY), then the system shall report the first missing part (e.g. 'Start Date - Day can NOT be empty...'), place the cursor on it and submit no job.", "capability": "claude/transactions/04#2", "function": "claude/transactions/04", "rules": ["claude/RULE-114"], "sources": ["app/cbl/CORPT00C.cbl:256-303"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If a custom month is not numeric or is above 12, a day is not numeric or is above 31, or a year is not numeric, then the system shall show the matching error (e.g. 'Start Date - Not a valid Month...'), place the cursor on that field and submit no job.", "capability": "claude/transactions/04#2", "function": "claude/transactions/04", "rules": ["claude/RULE-115"], "sources": ["app/cbl/CORPT00C.cbl:305-379"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the shared date utility does not report success ('0000') or message number '2513' for a custom date in YYYY-MM-DD form, then the system shall show 'Start Date - Not a valid date...' or 'End Date - Not a valid date...' and submit no job.", "capability": "claude/transactions/04#2", "function": "claude/transactions/04", "rules": ["claude/RULE-116"], "sources": ["app/cbl/CORPT00C.cbl:388-426", "app/cbl/CSUTLDTC.cbl:66"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not reject a custom range whose start date is later than its end date (the plugin flags this as a defect).", "capability": "claude/transactions/04#2", "function": "claude/transactions/04", "rules": ["claude/RULE-116"], "sources": ["app/cbl/CORPT00C.cbl:388-426"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the confirm field is blank, the system shall show 'Please confirm to print the <type> report...' (e.g. 'Please confirm to print the Yearly report...') and place the cursor on confirm.", "capability": "claude/transactions/04#3", "function": "claude/transactions/04", "rules": ["claude/RULE-247"], "sources": ["app/cbl/CORPT00C.cbl:464-494"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the user enters 'N' or 'n', the system shall clear all input fields and the message and submit nothing.", "capability": "claude/transactions/04#3", "function": "claude/transactions/04", "rules": ["claude/RULE-247"], "sources": ["app/cbl/CORPT00C.cbl:464-494"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the confirm field holds any value other than Y/y, N/n or blank, then the system shall show '\"<value>\" is not a valid value to confirm...'.", "capability": "claude/transactions/04#3", "function": "claude/transactions/04", "rules": ["claude/RULE-247"], "sources": ["app/cbl/CORPT00C.cbl:464-494"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the user confirms with 'Y' or 'y', the system shall submit job TRNRPT00 (PROC TRANREPT) with PARM-START-DATE and PARM-END-DATE by writing its JCL one 80-byte record at a time to TD queue 'JOBS' until the '/*EOF' line or a blank line, up to 1000 lines.", "capability": "claude/transactions/04#3", "function": "claude/transactions/04", "rules": ["claude/RULE-247", "claude/RULE-148"], "sources": ["app/cbl/CORPT00C.cbl:81-127", "app/cbl/CORPT00C.cbl:496-535"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall select for the report the transactions whose processing date (TRAN-PROC-DT) is between the start and end dates inclusive.", "capability": "claude/transactions/04#3", "function": "claude/transactions/04", "rules": ["claude/RULE-148"], "sources": ["app/proc/TRANREPT.prc:45-46"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the job is submitted successfully, the system shall show '<type> report submitted for printing ...' (e.g. 'Monthly report submitted for printing ...') in green and reset the fields.", "capability": "claude/transactions/04#3", "function": "claude/transactions/04", "rules": ["claude/RULE-148"], "sources": ["app/cbl/CORPT00C.cbl:445-456"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If writing to the JOBS queue fails, then the system shall show 'Unable to Write TDQ (JOBS)...' and stop, leaving any lines already written in the queue with no compensation.", "capability": "claude/transactions/04#3", "function": "claude/transactions/04", "rules": ["claude/RULE-148"], "sources": ["app/cbl/CORPT00C.cbl:515-535"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the report screen (CR00) is entered with no session context, then the system shall transfer control to COSGN00C.", "capability": "claude/transactions/04#4", "function": "claude/transactions/04", "rules": ["claude/RULE-199"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the report screen is entered for the first time, the system shall show the blank report screen.", "capability": "claude/transactions/04#4", "function": "claude/transactions/04", "rules": ["claude/RULE-199"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter or PF3, the system shall respectively process the request or transfer to the main menu COMEN01C with from-program CORPT00C.", "capability": "claude/transactions/04#4", "function": "claude/transactions/04", "rules": ["claude/RULE-199"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/transactions/04/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed, then the system shall show CCDA-MSG-INVALID-KEY.", "capability": "claude/transactions/04#4", "function": "claude/transactions/04", "rules": ["claude/RULE-199"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/batch/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a daily transaction is read, the system shall look up its 16-character card number in the card-to-account cross-reference file.", "capability": "claude/batch/01#1", "function": "claude/batch/01", "rules": ["claude/RULE-052"], "sources": ["app/cbl/CBTRN01C.cbl:170-184"], "programs": ["CBTRN01C"]}, {"key": "claude/batch/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the card number is not found in the cross-reference file, then the system shall set the status to 4, report 'CARD NUMBER <card number> COULD NOT BE VERIFIED. SKIPPING TRANSACTION ID-<transaction ID>' and read the next record.", "capability": "claude/batch/01#1", "function": "claude/batch/01", "rules": ["claude/RULE-052"], "sources": ["app/cbl/CBTRN01C.cbl:170-184"], "programs": ["CBTRN01C"]}, {"key": "claude/batch/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the card number is found, the system shall resolve the linked account ID (11 digits) and customer ID and read the linked account from the account master by key.", "capability": "claude/batch/01#1", "function": "claude/batch/01", "rules": ["claude/RULE-052", "claude/RULE-082"], "sources": ["app/cbl/CBTRN01C.cbl:170-184", "app/cbl/CBTRN01C.cbl:173-179"], "programs": ["CBTRN01C"]}, {"key": "claude/batch/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the linked account is not found in the account master, then the system shall set the status to 4 and report 'ACCOUNT <account ID> NOT FOUND'.", "capability": "claude/batch/01#1", "function": "claude/batch/01", "rules": ["claude/RULE-082"], "sources": ["app/cbl/CBTRN01C.cbl:173-179"], "programs": ["CBTRN01C"]}, {"key": "claude/batch/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset the verification status to 0 before every lookup, so that one failure does not carry over to the next record.", "capability": "claude/batch/01#1", "function": "claude/batch/01", "rules": ["claude/RULE-052"], "sources": ["app/cbl/CBTRN01C.cbl:170-184"], "programs": ["CBTRN01C"]}, {"key": "claude/batch/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read every record in the daily transaction file in order and stop when the file reports end-of-file (status '10').", "capability": "claude/batch/01#2", "function": "claude/batch/01", "rules": ["claude/RULE-170"], "sources": ["app/cbl/CBTRN01C.cbl:164-186"], "programs": ["CBTRN01C"]}, {"key": "claude/batch/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If a read of the daily transaction file returns a status other than '00' or '10', then the system shall abend the run.", "capability": "claude/batch/01#2", "function": "claude/batch/01", "rules": ["claude/RULE-170", "claude/RULE-235"], "sources": ["app/cbl/CBTRN01C.cbl:164-186", "app/cbl/CBTRN01C.cbl:469-473"], "programs": ["CBTRN01C"]}, {"key": "claude/batch/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If any of the six files fails to open or fails to close with a status other than '00', then the system shall report the error and the file status and abend immediately with code 999.", "capability": "claude/batch/01#2", "function": "claude/batch/01", "rules": ["claude/RULE-235"], "sources": ["app/cbl/CBTRN01C.cbl:469-473"], "programs": ["CBTRN01C"]}, {"key": "claude/batch/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If a daily transaction's card number cannot be found in the card-to-account cross-reference file, then the system shall reject it with reason code 100 'INVALID CARD NUMBER FOUND', skip the remaining validations and write it to the daily rejects file.", "capability": "claude/batch/02#1", "function": "claude/batch/02", "rules": ["claude/RULE-083"], "sources": ["app/cbl/CBTRN02C.cbl:380-392"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use the account ID from the cross-reference, not from the transaction, for every later validation and posting step.", "capability": "claude/batch/02#1", "function": "claude/batch/02", "rules": ["claude/RULE-083"], "sources": ["app/cbl/CBTRN02C.cbl:380-392"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the account linked to the transaction's card cannot be found in the account master file, then the system shall reject the transaction with reason code 101 'ACCOUNT RECORD NOT FOUND' and write it to the rejects file.", "capability": "claude/batch/02#1", "function": "claude/batch/02", "rules": ["claude/RULE-084"], "sources": ["app/cbl/CBTRN02C.cbl:393-399"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the account's current-cycle credit minus current-cycle debit plus the transaction amount exceeds the account's credit limit, then the system shall reject the transaction with reason code 102 'OVERLIMIT TRANSACTION'.", "capability": "claude/batch/02#1", "function": "claude/batch/02", "rules": ["claude/RULE-053"], "sources": ["app/cbl/CBTRN02C.cbl:403-413"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the projected balance is exactly equal to the credit limit, the system shall pass the credit limit check.", "capability": "claude/batch/02#1", "function": "claude/batch/02", "rules": ["claude/RULE-053"], "sources": ["app/cbl/CBTRN02C.cbl:403-413"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the first 10 characters of the transaction's origination timestamp are later than the account's expiration date, then the system shall reject the transaction with reason 103 'TRANSACTION RECEIVED AFTER ACCT EXPIRATION'.", "capability": "claude/batch/02#1", "function": "claude/batch/02", "rules": ["claude/RULE-085"], "sources": ["app/cbl/CBTRN02C.cbl:414-420"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When a transaction's origination date equals the account's expiration date, the system shall pass the expiration check.", "capability": "claude/batch/02#1", "function": "claude/batch/02", "rules": ["claude/RULE-085"], "sources": ["app/cbl/CBTRN02C.cbl:414-420"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall count and validate each daily transaction and post it if it passes every check.", "capability": "claude/batch/02#2", "function": "claude/batch/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If a daily transaction fails validation, then the system shall write a reject record holding the original 350-byte transaction plus an 80-byte trailer with a 4-digit reason code and a 76-character description.", "capability": "claude/batch/02#2", "function": "claude/batch/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset the reason code and description before each transaction.", "capability": "claude/batch/02#2", "function": "claude/batch/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the end of the daily file is reached, the system shall report the number of transactions processed (including rejected ones) and the number rejected.", "capability": "claude/batch/02#2", "function": "claude/batch/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the run ends, the system shall set return code 4 if the reject count is greater than 0, otherwise return code 0.", "capability": "claude/batch/02#2", "function": "claude/batch/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If any file open, read or write error occurs, then the system shall stop the program with abend code 999 rather than reject the transaction.", "capability": "claude/batch/02#2", "function": "claude/batch/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/CBTRN02C.cbl:202-231"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When a transaction posts, the system shall add its amount to the account's current balance.", "capability": "claude/batch/02#3", "function": "claude/batch/02", "rules": ["claude/RULE-009"], "sources": ["app/cbl/CBTRN02C.cbl:545-560"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When a posting transaction's amount is zero or positive, the system shall add it to the account's current-cycle credit total.", "capability": "claude/batch/02#3", "function": "claude/batch/02", "rules": ["claude/RULE-009"], "sources": ["app/cbl/CBTRN02C.cbl:545-560"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When a posting transaction's amount is negative, the system shall add it to the account's current-cycle debit total as a negative value.", "capability": "claude/batch/02#3", "function": "claude/batch/02", "rules": ["claude/RULE-009"], "sources": ["app/cbl/CBTRN02C.cbl:545-560"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the account rewrite fails, then the system shall set reason code 109 'ACCOUNT RECORD NOT FOUND'.", "capability": "claude/batch/02#3", "function": "claude/batch/02", "rules": ["claude/RULE-009"], "sources": ["app/cbl/CBTRN02C.cbl:545-560"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When a transaction posts, the system shall add its amount to the running balance kept for its account ID, transaction type and transaction category.", "capability": "claude/batch/02#3", "function": "claude/batch/02", "rules": ["claude/RULE-026"], "sources": ["app/cbl/CBTRN02C.cbl:467-542"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If no balance record exists for that account, type and category (file status '23'), then the system shall create one starting from zero.", "capability": "claude/batch/02#3", "function": "claude/batch/02", "rules": ["claude/RULE-026"], "sources": ["app/cbl/CBTRN02C.cbl:467-542"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If any other read or write failure occurs on the category balance file, then the system shall stop the job.", "capability": "claude/batch/02#3", "function": "claude/batch/02", "rules": ["claude/RULE-026"], "sources": ["app/cbl/CBTRN02C.cbl:467-542"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When a validated daily transaction posts, the system shall write a transaction record with the same ID, type, category, source, description, amount, merchant details, card number and origination timestamp.", "capability": "claude/batch/02#4", "function": "claude/batch/02", "rules": ["claude/RULE-172"], "sources": ["app/cbl/CBTRN02C.cbl:424-444"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When a transaction record is written, the system shall set its processing timestamp from the system clock in the format YYYY-MM-DD-HH.MM.SS.hh0000.", "capability": "claude/batch/02#4", "function": "claude/batch/02", "rules": ["claude/RULE-172"], "sources": ["app/cbl/CBTRN02C.cbl:424-444"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall post each transaction in the order category balance, then account, then transaction file.", "capability": "claude/batch/02#4", "function": "claude/batch/02", "rules": ["claude/RULE-172", "claude/RULE-026"], "sources": ["app/cbl/CBTRN02C.cbl:424-444", "app/cbl/CBTRN02C.cbl:467-542"], "programs": ["CBTRN02C"]}, {"key": "claude/batch/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate monthly interest for every transaction-category balance as the category balance times the annual percentage rate divided by 1200, truncated to 2 decimals without rounding.", "capability": "claude/batch/03#1", "function": "claude/batch/03", "rules": ["claude/RULE-006"], "sources": ["app/cbl/CBACT04C.cbl:462-470"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall add each category's monthly interest to the account's running total interest for the cycle.", "capability": "claude/batch/03#1", "function": "claude/batch/03", "rules": ["claude/RULE-006"], "sources": ["app/cbl/CBACT04C.cbl:462-470"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a category balance's applicable rate is zero, the system shall compute no interest, write no interest transaction and leave the account's total interest unchanged.", "capability": "claude/batch/03#1", "function": "claude/batch/03", "rules": ["claude/RULE-075"], "sources": ["app/cbl/CBACT04C.cbl:213-217"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When interest is computed for a category balance with a non-zero rate, the system shall invoke the fee step, which calculates, posts and writes no fee.", "capability": "claude/batch/03#1", "function": "claude/batch/03", "rules": ["claude/RULE-043", "claude/RULE-075"], "sources": ["app/cbl/CBACT04C.cbl:518-520", "app/cbl/CBACT04C.cbl:213-217"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall look up the interest rate by the account's group ID, transaction type and transaction category in the disclosure group file.", "capability": "claude/batch/03#2", "function": "claude/batch/03", "rules": ["claude/RULE-229"], "sources": ["app/cbl/CBACT04C.cbl:415-460"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If no rate is defined for the account's group, type and category (status 23), then the system shall use the rate defined for the 'DEFAULT' group with the same type and category.", "capability": "claude/batch/03#2", "function": "claude/batch/03", "rules": ["claude/RULE-229"], "sources": ["app/cbl/CBACT04C.cbl:415-460"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the 'DEFAULT' rate is also missing, or the primary lookup fails with any other read error, then the system shall abend with code 999.", "capability": "claude/batch/03#2", "function": "claude/batch/03", "rules": ["claude/RULE-229"], "sources": ["app/cbl/CBACT04C.cbl:415-460"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When a non-zero-rate interest amount is calculated, the system shall write a system-generated transaction of type '01', category '05', source 'System' and description 'Int. for a/c ' followed by the account ID, against the account's cross-referenced card.", "capability": "claude/batch/03#3", "function": "claude/batch/03", "rules": ["claude/RULE-230"], "sources": ["app/cbl/CBACT04C.cbl:473-515"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build each interest transaction ID from the run parameter date (10 characters) plus a 6-digit sequential counter starting at 1 per run.", "capability": "claude/batch/03#3", "function": "claude/batch/03", "rules": ["claude/RULE-230"], "sources": ["app/cbl/CBACT04C.cbl:473-515"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write each interest transaction with merchant ID 0, blank merchant name, city and zip, and origination and processing timestamps set to the current system time.", "capability": "claude/batch/03#3", "function": "claude/batch/03", "rules": ["claude/RULE-230"], "sources": ["app/cbl/CBACT04C.cbl:473-515"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the account number changes between category balance records, the system shall add the previous account's total cycle interest to its current balance, reset its current-cycle credit and debit totals to zero and rewrite the account.", "capability": "claude/batch/03#4", "function": "claude/batch/03", "rules": ["claude/RULE-143"], "sources": ["app/cbl/CBACT04C.cbl:188-222"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When a new account is reached, the system shall reset total interest to 0 and load the new account and its card cross-reference.", "capability": "claude/batch/03#4", "function": "claude/batch/03", "rules": ["claude/RULE-143"], "sources": ["app/cbl/CBACT04C.cbl:188-222"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the account rewrite fails, then the system shall abend with code 999.", "capability": "claude/batch/03#4", "function": "claude/batch/03", "rules": ["claude/RULE-143"], "sources": ["app/cbl/CBACT04C.cbl:188-222"], "programs": ["CBACT04C"]}, {"key": "claude/batch/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If an account referenced by a category balance does not exist in the account master or has no card cross-reference, then the system shall display 'ACCOUNT NOT FOUND' and abend with code 999.", "capability": "claude/batch/03#4", "function": "claude/batch/03", "rules": ["claude/RULE-076"], "sources": ["app/cbl/CBACT04C.cbl:372-413"], "programs": ["CBACT04C"]}, {"key": "claude/batch/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall produce one statement, in text and HTML, for every record on the card cross-reference file.", "capability": "claude/batch/04#1", "function": "claude/batch/04", "rules": ["claude/RULE-233"], "sources": ["app/cbl/CBSTM03A.CBL:316-329"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use the cross-reference's customer ID (9 digits) to fetch the customer and its account ID (11 digits) to fetch the account.", "capability": "claude/batch/04#1", "function": "claude/batch/04", "rules": ["claude/RULE-233"], "sources": ["app/cbl/CBSTM03A.CBL:316-329"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the cross-reference read returns end-of-file '10', the system shall stop producing statements.", "capability": "claude/batch/04#1", "function": "claude/batch/04", "rules": ["claude/RULE-233", "claude/RULE-079"], "sources": ["app/cbl/CBSTM03A.CBL:316-329", "app/cbl/CBSTM03A.CBL:345-414"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If a customer or account lookup returns a status other than '00', then the system shall display the error (e.g. 'ERROR READING CUSTFILE') and the return code and abend, producing no further statements.", "capability": "claude/batch/04#1", "function": "claude/batch/04", "rules": ["claude/RULE-079"], "sources": ["app/cbl/CBSTM03A.CBL:345-414"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read all transactions before any statement is written and group them by card number into a table of at most 51 cards with at most 10 transactions each, starting a new group whenever the card number changes from the previous record.", "capability": "claude/batch/04#2", "function": "claude/batch/04", "rules": ["claude/RULE-207", "claude/RULE-168"], "sources": ["app/cbl/CBSTM03A.CBL:818-853", "app/cbl/CBSTM03A.CBL:296-314"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the first transaction read returns end-of-file '10', then the system shall abend the job.", "capability": "claude/batch/04#2", "function": "claude/batch/04", "rules": ["claude/RULE-207"], "sources": ["app/cbl/CBSTM03A.CBL:818-853"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When gathering a cross-reference card's transactions, the system shall scan the card table from the start and stop as soon as it reaches a card number greater than the one being printed.", "capability": "claude/batch/04#2", "function": "claude/batch/04", "rules": ["claude/RULE-080"], "sources": ["app/cbl/CBSTM03A.CBL:417-432"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall list every transaction loaded for the card and print a 'Total EXP' line that is the signed sum of those transaction amounts.", "capability": "claude/batch/04#2", "function": "claude/batch/04", "rules": ["claude/RULE-008"], "sources": ["app/cbl/CBSTM03A.CBL:416-437"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset the running total to 0 before each card, so that a card with no transactions prints a total of $0.00.", "capability": "claude/batch/04#2", "function": "claude/batch/04", "rules": ["claude/RULE-008"], "sources": ["app/cbl/CBSTM03A.CBL:416-437"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show on each statement the customer's name (first, middle, last), three address lines (line 3 = city/line-3, state, country, ZIP), account ID, current balance and FICO score, followed by a transaction list of ID, description and amount.", "capability": "claude/batch/04#3", "function": "claude/batch/04", "rules": ["claude/RULE-263"], "sources": ["app/cbl/CBSTM03A.CBL:458-504"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write each statement as an 80-column text file and as an HTML file branded with the fixed bank header 'Bank of XYZ', '410 Terry Ave N', 'Seattle WA 99999'.", "capability": "claude/batch/04#3", "function": "claude/batch/04", "rules": ["claude/RULE-263"], "sources": ["app/cbl/CBSTM03A.CBL:458-504"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall print transaction descriptions truncated to 49 of their 100 characters.", "capability": "claude/batch/04#3", "function": "claude/batch/04", "rules": ["claude/RULE-263"], "sources": ["app/cbl/CBSTM03A.CBL:458-504"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall run the statement job in fixed phases: open and fully load transactions, then open the cross-reference, customer and account files, then produce statements, then close all files.", "capability": "claude/batch/04#4", "function": "claude/batch/04", "rules": ["claude/RULE-168"], "sources": ["app/cbl/CBSTM03A.CBL:296-314"], "programs": ["CBSTM03A"]}, {"key": "claude/batch/04/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall give the statement program read-only access to four files, with TRNXFILE and XREFFILE read only in sequence and CUSTFILE and ACCTFILE read only by key.", "capability": "claude/batch/04#4", "function": "claude/batch/04", "rules": ["claude/RULE-234"], "sources": ["app/cbl/CBSTM03B.CBL:116-229"], "programs": ["CBSTM03B"]}, {"key": "claude/batch/04/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return transaction records in the order of the composite key card number (16 chars) plus transaction id (16 chars).", "capability": "claude/batch/04#4", "function": "claude/batch/04", "rules": ["claude/RULE-234"], "sources": ["app/cbl/CBSTM03B.CBL:116-229"], "programs": ["CBSTM03B"]}, {"key": "claude/batch/04/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Optional", "text": "Where an operation is not supported for a file or the file name is not recognised, the system shall perform no I/O.", "capability": "claude/batch/04#4", "function": "claude/batch/04", "rules": ["claude/RULE-234"], "sources": ["app/cbl/CBSTM03B.CBL:116-229"], "programs": ["CBSTM03B"]}, {"key": "claude/batch/04/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When a customer or account is looked up, the system shall take the first N characters of the caller's key, where N is the key length the caller passes, and read the record that matches that ID.", "capability": "claude/batch/04#4", "function": "claude/batch/04", "rules": ["claude/RULE-081"], "sources": ["app/cbl/CBSTM03B.CBL:188-218"], "programs": ["CBSTM03B"]}, {"key": "claude/batch/04/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When an open, read or close is performed on a recognised file, the system shall pass the 2-character file status back to the calling statement program ('00' success, '10' end of file, '23' record not found).", "capability": "claude/batch/04#4", "function": "claude/batch/04", "rules": ["claude/RULE-169"], "sources": ["app/cbl/CBSTM03B.CBL:151-226"], "programs": ["CBSTM03B"]}, {"key": "claude/batch/05/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read one date-parameter record before reporting.", "capability": "claude/batch/05#1", "function": "claude/batch/05", "rules": ["claude/RULE-133"], "sources": ["app/cbl/CBTRN03C.cbl:220-243"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the date parameter read returns status 00, the system shall log 'Reporting from <start> to <end>' and continue.", "capability": "claude/batch/05#1", "function": "claude/batch/05", "rules": ["claude/RULE-133"], "sources": ["app/cbl/CBTRN03C.cbl:220-243"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the date parameter file is empty (status 10), then the system shall process no transactions and create the report file empty.", "capability": "claude/batch/05#1", "function": "claude/batch/05", "rules": ["claude/RULE-133"], "sources": ["app/cbl/CBTRN03C.cbl:220-243"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the date parameter read returns any other status, then the system shall display an error and abend with code 999.", "capability": "claude/batch/05#1", "function": "claude/batch/05", "rules": ["claude/RULE-133"], "sources": ["app/cbl/CBTRN03C.cbl:220-243"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall report only transactions whose processing date (first 10 characters of the processing timestamp) falls between the start and end dates in the DATEPARM file, inclusive.", "capability": "claude/batch/05#1", "function": "claude/batch/05", "rules": ["claude/RULE-086"], "sources": ["app/cbl/CBTRN03C.cbl:170-178"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall look up each transaction's card in the card cross-reference, its type code in the transaction-type file, and its type code plus category code in the transaction-category file.", "capability": "claude/batch/05#2", "function": "claude/batch/05", "rules": ["claude/RULE-087"], "sources": ["app/cbl/CBTRN03C.cbl:484-512"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the card number changes, the system shall look up the new card in the card cross-reference to get its account ID.", "capability": "claude/batch/05#2", "function": "claude/batch/05", "rules": ["claude/RULE-027"], "sources": ["app/cbl/CBTRN03C.cbl:181-188"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If a card, type or category lookup fails, then the system shall display 'INVALID CARD NUMBER', 'INVALID TRANSACTION TYPE' or 'INVALID TRAN CATG KEY' respectively and abend with code 999.", "capability": "claude/batch/05#2", "function": "claude/batch/05", "rules": ["claude/RULE-087"], "sources": ["app/cbl/CBTRN03C.cbl:484-512"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If any file open, read, write or close fails, then the system shall abend with code 999.", "capability": "claude/batch/05#2", "function": "claude/batch/05", "rules": ["claude/RULE-087"], "sources": ["app/cbl/CBTRN03C.cbl:484-512"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show on each detail line the transaction ID, the account ID from the card cross-reference, the type code and description, the category code and description, the source and the amount edited as -ZZZ,ZZZ,ZZZ.ZZ.", "capability": "claude/batch/05#3", "function": "claude/batch/05", "rules": ["claude/RULE-264"], "sources": ["app/cbl/CBTRN03C.cbl:361-374"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the first detail line is about to be written, the system shall print the report header with the date range.", "capability": "claude/batch/05#3", "function": "claude/batch/05", "rules": ["claude/RULE-264"], "sources": ["app/cbl/CBTRN03C.cbl:361-374"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When a detail line is about to be written and the report line count is an exact multiple of the 20-line page size, the system shall print the page total and a separator, add the page total to the grand total, reset the page total and print the page headers again.", "capability": "claude/batch/05#3", "function": "claude/batch/05", "rules": ["claude/RULE-236", "claude/RULE-010"], "sources": ["app/cbl/CBTRN03C.cbl:282-285", "app/cbl/CBTRN03C.cbl:287-298"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall add every reported transaction's amount to the running page total and the running account (card) total.", "capability": "claude/batch/05#4", "function": "claude/batch/05", "rules": ["claude/RULE-010"], "sources": ["app/cbl/CBTRN03C.cbl:287-298"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build the grand total only as the sum of page totals.", "capability": "claude/batch/05#4", "function": "claude/batch/05", "rules": ["claude/RULE-010"], "sources": ["app/cbl/CBTRN03C.cbl:287-298"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the card number changes, the system shall write the previous card's account-total line and a dashed separator line and reset the account total to zero.", "capability": "claude/batch/05#4", "function": "claude/batch/05", "rules": ["claude/RULE-027"], "sources": ["app/cbl/CBTRN03C.cbl:181-188"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the very first card is processed, the system shall write no account total.", "capability": "claude/batch/05#4", "function": "claude/batch/05", "rules": ["claude/RULE-027"], "sources": ["app/cbl/CBTRN03C.cbl:181-188"], "programs": ["CBTRN03C"]}, {"key": "claude/batch/05/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the end of the transaction file is reached, the system shall close the last page and print the final page total and the grand total.", "capability": "claude/batch/05#4", "function": "claude/batch/05", "rules": ["claude/RULE-028"], "sources": ["app/cbl/CBTRN03C.cbl:197-204"], "programs": ["CBTRN03C"]}, {"key": "claude/provisioning/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the CBEXPORT batch runs, the system shall write all 'C' (customer) records first, then 'A' (account), 'X' (cross-reference), 'T' (transaction) and 'D' (card) records to the export file.", "capability": "claude/provisioning/01#1", "function": "claude/provisioning/01", "rules": ["claude/RULE-166"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the records of each type in that input file's primary-key order (CUST-ID, ACCT-ID, XREF-CARD-NUM, TRAN-ID, CARD-NUM).", "capability": "claude/provisioning/01#1", "function": "claude/provisioning/01", "rules": ["claude/RULE-166"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write each export record as a fixed 500 bytes with a 45-byte common header and 460 bytes of type data.", "capability": "claude/provisioning/01#1", "function": "claude/provisioning/01", "rules": ["claude/RULE-166"], "sources": ["app/cpy/CVEXPORT.cpy:9-19"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "State-driven", "text": "While an input file is empty, the system shall write no records of that type and go on to the next type.", "capability": "claude/provisioning/01#1", "function": "claude/provisioning/01", "rules": ["claude/RULE-166"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall export orphan records as they are, without checking that cross-reference, account and customer records agree with each other.", "capability": "claude/provisioning/01#1", "function": "claude/provisioning/01", "rules": ["claude/RULE-166"], "sources": ["app/cbl/CBEXPORT.cbl:149-158"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall export every record in every source file with no eligibility filter, including inactive accounts and cards and every transaction in history.", "capability": "claude/provisioning/01#1", "function": "claude/provisioning/01", "rules": ["claude/RULE-205"], "sources": ["app/cbl/CBEXPORT.cbl:522-541"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall copy customer SSNs, government IDs, EFT account IDs, FICO scores and card CVV codes into the export without masking or encryption.", "capability": "claude/provisioning/01#1", "function": "claude/provisioning/01", "rules": ["claude/RULE-205"], "sources": ["app/cbl/CBEXPORT.cbl:294-299", "app/cbl/CBEXPORT.cbl:537"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall give every export record a sequence number that starts at 1 and goes up by 1 across all record types in the run, never resetting between record types.", "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rules": ["claude/RULE-007"], "sources": ["app/cbl/CBEXPORT.cbl:276-277"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use the export sequence number as the export file's unique key.", "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rules": ["claude/RULE-007"], "sources": ["app/cbl/CBEXPORT.cbl:65-68"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a new export run starts, the system shall start the sequence number at 1 again.", "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rules": ["claude/RULE-007"], "sources": ["app/cbl/CBEXPORT.cbl:123"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall support a maximum of 999,999,999 export records per run, with no guard against the counter wrapping or truncating past that.", "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rules": ["claude/RULE-007"], "sources": ["app/cbl/CBEXPORT.cbl:123"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the job starts, the system shall read the system date and time once and stamp that same timestamp on every exported record, formatted as 'YYYY-MM-DD HH:MM:SS.00'.", "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rules": ["claude/RULE-023"], "sources": ["app/cbl/CBEXPORT.cbl:172-195"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the timestamp fraction to the literal '.00' and pad the 22-character value with spaces in the 26-character field.", "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rules": ["claude/RULE-023"], "sources": ["app/cbl/CBEXPORT.cbl:172-195"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "State-driven", "text": "While a run crosses midnight, the system shall still carry the start date on every record.", "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rules": ["claude/RULE-023"], "sources": ["app/cbl/CBEXPORT.cbl:172-195"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall assign every exported record, whatever its type or the customer's address, to branch '0001' in region 'NORTH'.", "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rules": ["claude/RULE-231"], "sources": ["app/cbl/CBEXPORT.cbl:278-279"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall copy each source record's business fields one-for-one into the export layout for its record type.", "capability": "claude/provisioning/01#3", "function": "claude/provisioning/01", "rules": ["claude/RULE-024"], "sources": ["app/cbl/CBEXPORT.cbl:338-362"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When an export record is built, the system shall first clear the whole export record so that no data carries over from the previous record type.", "capability": "claude/provisioning/01#3", "function": "claude/provisioning/01", "rules": ["claude/RULE-024"], "sources": ["app/cbl/CBEXPORT.cbl:338-362"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When an 'A' export record is built, the system shall store the balance as signed packed decimal S9(10)V99 COMP-3, the credit limit as zoned S9(10)V99, the cash credit limit as COMP-3 and the cycle debit as binary COMP, keeping two decimal places.", "capability": "claude/provisioning/01#3", "function": "claude/provisioning/01", "rules": ["claude/RULE-024"], "sources": ["app/cbl/CBEXPORT.cbl:351-362", "app/cpy/CVEXPORT.cpy:24-100"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the export job finishes, the system shall report the number of records written for customers, accounts, xrefs, transactions and cards plus a grand total.", "capability": "claude/provisioning/01#4", "function": "claude/provisioning/01", "rules": ["claude/RULE-025"], "sources": ["app/cbl/CBEXPORT.cbl:554-573"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall increase each type counter only after a successful write, so that the grand total equals the sum of the per-type counts and the last sequence number.", "capability": "claude/provisioning/01#4", "function": "claude/provisioning/01", "rules": ["claude/RULE-025"], "sources": ["app/cbl/CBEXPORT.cbl:309-310"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall only display the totals and shall not write them as a trailer or control record in the export file.", "capability": "claude/provisioning/01#4", "function": "claude/provisioning/01", "rules": ["claude/RULE-025"], "sources": ["app/cbl/CBEXPORT.cbl:554-573"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If any input or output file cannot be opened, read or written, then the system shall display an error with the status code and abend at once through CEE3ABD.", "capability": "claude/provisioning/01#5", "function": "claude/provisioning/01", "rules": ["claude/RULE-077"], "sources": ["app/cbl/CBEXPORT.cbl:198-240", "app/cbl/CBEXPORT.cbl:576-579"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall continue processing only on status '00' (success) or, on reads, '10' (end of file).", "capability": "claude/provisioning/01#5", "function": "claude/provisioning/01", "rules": ["claude/RULE-077"], "sources": ["app/cbl/CBEXPORT.cbl:100-116"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If the export abends, then the system shall not report the record counts and shall leave any export records already written in EXPFILE.", "capability": "claude/provisioning/01#5", "function": "claude/provisioning/01", "rules": ["claude/RULE-077", "claude/RULE-025"], "sources": ["app/cbl/CBEXPORT.cbl:198-240"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When the export is rerun, the system shall start again at sequence 1 and recreate the output, because there is no restart or checkpoint.", "capability": "claude/provisioning/01#5", "function": "claude/provisioning/01", "rules": ["claude/RULE-077", "claude/RULE-007"], "sources": ["app/cbl/CBEXPORT.cbl:198-240"], "programs": ["CBEXPORT"]}, {"key": "claude/provisioning/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write each export record to exactly one target file chosen by its one-character record type: C=Customer (CUSTOUT), A=Account (ACCTOUT), X=Card cross-reference (XREFOUT), T=Transaction (TRNXOUT), D=Card (CARDOUT).", "capability": "claude/provisioning/02#1", "function": "claude/provisioning/02", "rules": ["claude/RULE-206"], "sources": ["app/cbl/CBIMPORT.cbl:270-285"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a record of a known type is written, the system shall increase the matching imported counter by 1.", "capability": "claude/provisioning/02#1", "function": "claude/provisioning/02", "rules": ["claude/RULE-206"], "sources": ["app/cbl/CBIMPORT.cbl:270-285"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall process records in ascending export sequence number, not by type, with no requirement that a customer comes before its accounts or cards.", "capability": "claude/provisioning/02#1", "function": "claude/provisioning/02", "rules": ["claude/RULE-206"], "sources": ["app/cbl/CBIMPORT.cbl:37-41"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat type codes as case-sensitive, so that 'c' counts as unknown.", "capability": "claude/provisioning/02#1", "function": "claude/provisioning/02", "rules": ["claude/RULE-206"], "sources": ["app/cbl/CBIMPORT.cbl:270-285"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall copy records of known types field by field into the target layouts with no checks on required fields, ranges, formats, duplicate keys or links between records.", "capability": "claude/provisioning/02#2", "function": "claude/provisioning/02", "rules": ["claude/RULE-051"], "sources": ["app/cbl/CBIMPORT.cbl:288-422"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall have the 'validate import' step always report 'Import validation completed' and 'No validation errors detected', whatever the data contains.", "capability": "claude/provisioning/02#2", "function": "claude/provisioning/02", "rules": ["claude/RULE-051"], "sources": ["app/cbl/CBIMPORT.cbl:448-452"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall drop the export header fields EXPORT-BRANCH-ID, EXPORT-REGION-CODE and EXPORT-TIMESTAMP so that they do not reach any target record.", "capability": "claude/provisioning/02#2", "function": "claude/provisioning/02", "rules": ["claude/RULE-051"], "sources": ["app/cpy/CVEXPORT.cpy:11-18"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall copy card CVV and customer SSN into the plain sequential output files with no masking.", "capability": "claude/provisioning/02#2", "function": "claude/provisioning/02", "rules": ["claude/RULE-051"], "sources": ["app/cbl/CBIMPORT.cbl:288-422"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall carry over each migrated account's and card's active/inactive status, open date, expiration date and reissue date unchanged from the source branch, without resetting, deriving or checking any lifecycle state.", "capability": "claude/provisioning/02#2", "function": "claude/provisioning/02", "rules": ["claude/RULE-167"], "sources": ["app/cbl/CBIMPORT.cbl:325-334", "app/cbl/CBIMPORT.cbl:411-412"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall carry over account cycle credit and debit amounts as they are, without resetting them to start a new billing cycle.", "capability": "claude/provisioning/02#2", "function": "claude/provisioning/02", "rules": ["claude/RULE-167"], "sources": ["app/cbl/CBIMPORT.cbl:336-337"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If a record has an unrecognised type code, then the system shall write nothing to any target file and shall write an error line holding a timestamp, the type code, the sequence number and the text 'Unknown record type encountered'.", "capability": "claude/provisioning/02#3", "function": "claude/provisioning/02", "rules": ["claude/RULE-078", "claude/RULE-206"], "sources": ["app/cbl/CBIMPORT.cbl:424-446"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall lay out each error line as timestamp X(26) | type X(1) | sequence 9(7) | message X(50) plus 43 spaces, for 132 bytes.", "capability": "claude/provisioning/02#3", "function": "claude/provisioning/02", "rules": ["claude/RULE-078"], "sources": ["app/cbl/CBIMPORT.cbl:152-160"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When an unknown record type is rejected, the system shall increase the unknown-type count and the errors-written count by 1 and move on to the next record without stopping the run.", "capability": "claude/provisioning/02#3", "function": "claude/provisioning/02", "rules": ["claude/RULE-078"], "sources": ["app/cbl/CBIMPORT.cbl:424-446"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the error-file write itself fails, then the system shall only show a message, not abend, and still increase the errors-written counter.", "capability": "claude/provisioning/02#3", "function": "claude/provisioning/02", "rules": ["claude/RULE-078", "claude/RULE-232"], "sources": ["app/cbl/CBIMPORT.cbl:441-444"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the import finishes, the system shall report the total records read and the counts of customers, accounts, xrefs, transactions and cards imported, plus errors written and unknown types.", "capability": "claude/provisioning/02#4", "function": "claude/provisioning/02", "rules": ["claude/RULE-044"], "sources": ["app/cbl/CBIMPORT.cbl:454-478"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall increase the total-read count for each record read, so that total read equals the sum of the five imported counts and the unknown count.", "capability": "claude/provisioning/02#4", "function": "claude/provisioning/02", "rules": ["claude/RULE-044"], "sources": ["app/cbl/CBIMPORT.cbl:253"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send the statistics and the run date and time only to the job log, without saving them to a control file or stamping them on any record.", "capability": "claude/provisioning/02#4", "function": "claude/provisioning/02", "rules": ["claude/RULE-044"], "sources": ["app/cbl/CBIMPORT.cbl:178-188", "app/cbl/CBIMPORT.cbl:454-478"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall hold each import counter as an unsigned 9-digit field with a maximum of 999,999,999.", "capability": "claude/provisioning/02#4", "function": "claude/provisioning/02", "rules": ["claude/RULE-044"], "sources": ["app/cbl/CBIMPORT.cbl:139-147"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If any input or target file cannot be opened, or a read or a customer/account/xref/transaction/card write fails, then the system shall show the error and status and abend at once through CEE3ABD.", "capability": "claude/provisioning/02#5", "function": "claude/provisioning/02", "rules": ["claude/RULE-232"], "sources": ["app/cbl/CBIMPORT.cbl:312-320", "app/cbl/CBIMPORT.cbl:481-484"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If the import abends, then the system shall leave records already written in the target files and shall not report statistics.", "capability": "claude/provisioning/02#5", "function": "claude/provisioning/02", "rules": ["claude/RULE-232"], "sources": ["app/cbl/CBIMPORT.cbl:312-320"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "State-driven", "text": "While the export file is empty, the system shall end normally with all counts at zero.", "capability": "claude/provisioning/02#5", "function": "claude/provisioning/02", "rules": ["claude/RULE-232"], "sources": ["app/cbl/CBIMPORT.cbl:259-267"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When the import is rerun, the system shall start from the beginning and overwrite the outputs, because there is no checkpoint or restart.", "capability": "claude/provisioning/02#5", "function": "claude/provisioning/02", "rules": ["claude/RULE-232"], "sources": ["app/cbl/CBIMPORT.cbl:196-245"], "programs": ["CBIMPORT"]}, {"key": "claude/provisioning/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the account extract batch runs, the system shall read every account in key order and produce 1 fixed extract record, 1 array record and 2 variable-length records for each account.", "capability": "claude/provisioning/03#1", "function": "claude/provisioning/03", "rules": ["claude/RULE-142"], "sources": ["app/cbl/CBACT01C.cbl:147-198"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When an account read returns status '10', the system shall end the run normally.", "capability": "claude/provisioning/03#1", "function": "claude/provisioning/03", "rules": ["claude/RULE-142"], "sources": ["app/cbl/CBACT01C.cbl:147-198"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If an account read returns any status other than '00' or '10', then the system shall show the file status and abend with code 999.", "capability": "claude/provisioning/03#1", "function": "claude/provisioning/03", "rules": ["claude/RULE-142"], "sources": ["app/cbl/CBACT01C.cbl:406-410"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "State-driven", "text": "While the input account file is empty, the system shall write no outputs and end normally.", "capability": "claude/provisioning/03#1", "function": "claude/provisioning/03", "rules": ["claude/RULE-142"], "sources": ["app/cbl/CBACT01C.cbl:147-198"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When an account's current-cycle debit amount is zero, the system shall show a fixed cycle debit of 2,525.00 in the extract.", "capability": "claude/provisioning/03#2", "function": "claude/provisioning/03", "rules": ["claude/RULE-022"], "sources": ["app/cbl/CBACT01C.cbl:235-238"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When an account's current-cycle debit amount is non-zero (including negative), the system shall not copy the real amount into the extract, so the output keeps the prior record's value or the initial buffer contents for the first record.", "capability": "claude/provisioning/03#2", "function": "claude/provisioning/03", "rules": ["claude/RULE-022"], "sources": ["app/cbl/CBACT01C.cbl:235-238"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the array record is built for an account, the system shall set slot 1 to the account's current balance with cycle debit 1,005.00, slot 2 to the current balance with 1,525.00, slot 3 to (-1,025.00, -2,500.00), and slots 4 and 5 to zero.", "capability": "claude/provisioning/03#3", "function": "claude/provisioning/03", "rules": ["claude/RULE-041"], "sources": ["app/cbl/CBACT01C.cbl:253-261"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall clear the array record before each account and shall not use the account's real cycle debit in the array.", "capability": "claude/provisioning/03#3", "function": "claude/provisioning/03", "rules": ["claude/RULE-041"], "sources": ["app/cbl/CBACT01C.cbl:169"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When an account is processed, the system shall write a 12-byte record with the account ID and active status, then a 39-byte record with the account ID, current balance, credit limit and the four-digit year of the reissue date.", "capability": "claude/provisioning/03#4", "function": "claude/provisioning/03", "rules": ["claude/RULE-042"], "sources": ["app/cbl/CBACT01C.cbl:276-315"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall take the reissue year from the first 4 characters of the original reissue date.", "capability": "claude/provisioning/03#4", "function": "claude/provisioning/03", "rules": ["claude/RULE-042"], "sources": ["app/cbl/CBACT01C.cbl:276-315"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If the account file or an output file cannot be opened, an output record cannot be written, or the account file cannot be closed, then the system shall show the file status and abend with code 999, processing no further accounts.", "capability": "claude/provisioning/03#5", "function": "claude/provisioning/03", "rules": ["claude/RULE-228"], "sources": ["app/cbl/CBACT01C.cbl:242-251", "app/cbl/CBACT01C.cbl:406-410"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat an output write as successful when the status is '00' or '10'.", "capability": "claude/provisioning/03#5", "function": "claude/provisioning/03", "rules": ["claude/RULE-228"], "sources": ["app/cbl/CBACT01C.cbl:245"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the extract abends, then the system shall leave records written before the abend in the output files.", "capability": "claude/provisioning/03#5", "function": "claude/provisioning/03", "rules": ["claude/RULE-228"], "sources": ["app/cbl/CBACT01C.cbl:242-251"], "programs": ["CBACT01C"]}, {"key": "claude/provisioning/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the CBACT02C batch job runs, the system shall print a START banner, each 150-byte card record exactly once in ascending card-number order with no filtering or selection, then an END banner.", "capability": "claude/provisioning/04#1", "function": "claude/provisioning/04", "rules": ["claude/RULE-260"], "sources": ["app/cbl/CBACT02C.cbl:70-87"], "programs": ["CBACT02C"]}, {"key": "claude/provisioning/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "State-driven", "text": "While the card master file is empty, the system shall print only the START and END banners.", "capability": "claude/provisioning/04#1", "function": "claude/provisioning/04", "rules": ["claude/RULE-260"], "sources": ["app/cbl/CBACT02C.cbl:70-87"], "programs": ["CBACT02C"]}, {"key": "claude/provisioning/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the CBACT03C batch job runs, the system shall read every cross-reference record in card-number order and print it to the job log, where the current code prints each record twice.", "capability": "claude/provisioning/04#2", "function": "claude/provisioning/04", "rules": ["claude/RULE-261"], "sources": ["app/cbl/CBACT03C.cbl:74-96"], "programs": ["CBACT03C"]}, {"key": "claude/provisioning/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "State-driven", "text": "While the cross-reference file is empty, the system shall print only the START and END banners.", "capability": "claude/provisioning/04#2", "function": "claude/provisioning/04", "rules": ["claude/RULE-261"], "sources": ["app/cbl/CBACT03C.cbl:74-96"], "programs": ["CBACT03C"]}, {"key": "claude/provisioning/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the CBCUS01C batch job runs, the system shall read every customer record in customer-ID order and print the full record to the job log, where the current code prints each customer twice.", "capability": "claude/provisioning/04#3", "function": "claude/provisioning/04", "rules": ["claude/RU
