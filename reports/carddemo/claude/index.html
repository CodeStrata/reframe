upsert to the fraud table)", "text": "Given Authorization for card 4111111111111111 at 25-02-09 14.30.15.123, account 00000012345, customer 000000789, with action 'F'\nWhen COPAUS2C is called from the authorization detail screen\nThen A row is inserted into CARDDEMO.AUTHFRDS with AUTH_FRAUD = 'F' and FRAUD_RPT_DATE = CURRENT DATE, and the result is status 'S' with 'ADD SUCCESS'. If the row already exists (SQLCODE -803), AUTH_FRAUD and FRAUD_RPT_DATE are updated, giving 'S' with 'UPDT SUCCESS'. Any other DB2 error gives status 'F' with a message containing the SQLCODE and SQLSTATE.", "program": "COPAUS2C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244", "plain": "When a user reports fraud ('F') or removes a fraud flag ('R') on an authorization, a full snapshot of the authorization is inserted into the fraud table with the action and today's date. If a record already exists for the same card and authorization timestamp, only its fraud flag and report date are updated.", "defect": ""}, {"key": "claude/RULE-134", "function": "claude/account/02", "id": "RULE-134", "name": "Atomic two-record update with locking and rollback", "text": "Given Validated changes in state 'N'\nWhen The operator presses PF5\nThen Account lock fails -> 'Could not lock account record for update' (state 'L'); customer lock fails -> 'Could not lock customer record for update'; account rewrite fails -> 'Update of record failed' (state 'F'); customer rewrite fails -> SYNCPOINT ROLLBACK and 'F'; otherwise both are rewritten and the state becomes 'C'", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-043", "REQ-F-045", "REQ-F-046", "REQ-F-047", "REQ-N-002", "REQ-F-048"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COACTUPC.cbl:3888-4104", "plain": "Saving locks the account record, then the customer record, and rewrites both. If the customer rewrite fails, the account change is rolled back so the two records stay consistent.", "defect": "A customer lock failure is mapped to success ('Changes committed to database') because the 2000-DECIDE-ACTION EVALUATE has no branch for COULD-NOT-LOCK-CUST-FOR-UPDATE (see 2606-2615)."}, {"key": "claude/RULE-135", "function": "claude/txn/01", "id": "RULE-135", "name": "Two-step confirmation before payment is posted", "text": "Given The user has entered account 00000000011 (balance $500.00)\nWhen The confirm field is blank, 'Y'/'y', 'N'/'n', or another value such as 'X'\nThen Blank: the balance $500.00 is displayed with 'Confirm to make a bill payment...' and nothing is posted. 'Y'/'y': payment is posted. 'N'/'n': all fields are cleared and nothing is posted. 'X': 'Invalid value. Valid values are (Y/N)...' and nothing is posted.", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-015"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COBIL00C.cbl:173-191", "plain": "Bill payment is a two-step flow. The first submission shows the current balance and asks for confirmation. The payment is posted only when the confirm field is 'Y' or 'y'. 'N' or 'n' cancels and clears the screen, and any other value is rejected.", "defect": ""}, {"key": "claude/RULE-136", "function": "claude/txn/01", "id": "RULE-136", "name": "Payment posting is not atomic: balance is cleared even if transaction write fails", "text": "Given A confirmed payment for $300.00 where the transaction write fails with a duplicate key (or the cross-reference lookup fails)\nWhen The posting sequence runs\nThen Intended behaviour: nothing is posted. Actual code: the error message is set, but the balance is still reduced by TRAN-AMT and the account is rewritten, so the balance can be cleared without a payment transaction on file.", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-023", "REQ-F-024", "REQ-F-025", "REQ-F-026", "REQ-F-027"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COBIL00C.cbl:208-244", "plain": "After confirmation the program writes the payment transaction, then reduces and rewrites the account balance. These steps run in sequence without checking whether the earlier steps failed.", "defect": "WS-ERR-FLG is not re-checked between READ-CXACAIX-FILE, WRITE-TRANSACT-FILE and UPDATE-ACCTDAT-FILE (lines 211-235), so the balance can be zeroed after a failed transaction write and transactions can be written without a valid card. The legacy code relies on CICS unit-of-work rollback only on abend, not on these handled errors."}, {"key": "claude/RULE-137", "function": "claude/card/03", "id": "RULE-137", "name": "Card update screen lifecycle (search, edit, confirm, save)", "text": "Given A card update conversation whose state flag (CCUP-CHANGE-ACTION) is one of: blank/low-values = details not fetched; 'S' = details shown; 'E' = changes not OK; 'N' = changes OK, not confirmed; 'C' = changes saved; 'L' = lock error; 'F' = update failed\nWhen The user submits the screen (Enter, PF5 or PF12)\nThen Not fetched + valid keys -> read card, go to 'S'; 'S' + valid non-identical edits -> 'N' (prompt 'Changes validated.Press F5 to save'); edit errors -> 'E'; 'N' + PF5 -> attempt update: lock failure -> 'L', rewrite failure -> 'F', record changed by someone else -> back to 'S' with fresh data, success -> 'C' ('Changes committed to database'); 'N' without PF5 stays 'N'; 'C'/'L'/'F' on next interaction reset the screen and clear account/card keys, returning to 'not fetched'. Any other combination abends with code 0001 'UNEXPECTED DATA SCENARIO'.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-013", "REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021", "REQ-F-022", "REQ-F-024"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:948-1027", "plain": "A card update moves through fixed states: keys not yet entered, details shown, edits rejected, edits validated awaiting PF5 confirmation, saved, or failed; only a validated change followed by PF5 is written to the card file.", "defect": ""}, {"key": "claude/RULE-138", "function": "claude/txn/03", "id": "RULE-138", "name": "Create and persist the online transaction record", "text": "Given Valid input for card 4111111111111111, amount +00000050.00, Confirm = Y, and next ID 0000000000001235\nWhen The record is written to TRANSACT\nThen TRANSACT gains record 0000000000001235. The screen is cleared and shows, in green, 'Transaction added successfully.  Your Tran ID is 0000000000001235.'", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-023", "REQ-F-024", "REQ-F-025"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:442-466", "plain": "When confirmed, the program builds a new transaction record from the screen (type, category, source, description, amount, card, merchant details, origination and processing dates) and writes it to the transaction file. On success, the screen is cleared and the new ID is shown.", "defect": "No authorization checks (account status, credit limit, card expiry) are made before the transaction is recorded."}, {"key": "claude/RULE-139", "function": "claude/useradmin/04", "id": "RULE-139", "name": "User deletion is a two-step lookup-then-confirm (PF5) process", "text": "Given User 'JDOE0001' (John Doe, type U) exists in USRSEC\nWhen the administrator enters 'JDOE0001' and presses Enter, then presses PF5\nThen after Enter the screen shows the first name, last name and type with 'Press PF5 key to delete this user ...'; after PF5 the record is read for update and deleted, the screen is cleared and 'User JDOE0001 has been deleted ...' appears in green", "program": "COUSR03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COUSR03C.cbl:142-192", "plain": "To delete a user, the administrator first looks the user up by ID (Enter) to see their name and type, and only pressing PF5 actually removes the record.", "defect": "In DELETE-USER-INFO (lines 188-192) DELETE-USER-SEC-FILE runs even when READ-USER-SEC-FILE set the error flag (e.g. NOTFND), so a failed lookup is followed by a delete attempt without a held record and a second screen send; the delete-failure message also says 'Update' instead of 'Delete'."}, {"key": "claude/RULE-140", "function": "claude/auth/04", "id": "RULE-140", "name": "Delete account pending-authorization summary when no approved authorizations remain", "text": "Given An account summary whose approved count falls from 1 to 0 after purging, while the declined count is still 2\nWhen The purge finishes processing that account's details\nThen The summary segment PAUTSUM0 is deleted, even though declined counts remain (this is the coded behaviour)", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-N-001", "REQ-F-006"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167", "plain": "After an account's expired details are purged, the account's pending-authorization summary root is deleted if its approved-authorization count is zero or less.", "defect": "Line 156 tests PA-APPROVED-AUTH-CNT twice. The intended rule is probably 'approved count <= 0 AND declined count <= 0'. As coded, a summary can be deleted, together with any declined or unexpired details still under it, as soon as approved authorizations reach zero."}, {"key": "claude/RULE-141", "function": "claude/auth/01", "id": "RULE-141", "name": "Pending authorization detail record and match-status lifecycle", "text": "Given An approved $75.00 auth for account 00000000012\nWhen The detail is written\nThen PAUTDTL1 is inserted under PAUTSUM0 (ACCNTID=00000000012) with match status 'P', the response code, reason and approved amount from the reply, and fraud flag set to space", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-025", "REQ-F-026", "REQ-F-028"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:877-919", "plain": "Every authorization for a card found in the cross-reference is stored as a detail record under the account's summary. It holds the request data and the decision. Its match status starts as Pending ('P') when approved or Auth-Declined ('D') when declined, and the fraud flag and fraud report date start blank.", "defect": ""}, {"key": "claude/RULE-142", "function": "claude/auth/02", "id": "RULE-142", "name": "Summary screen navigation and session lifecycle", "text": "Given The user arrives from the menu with account 00000000001 in the session\nWhen The program is first entered, then the user presses PF3 or PF5\nThen First entry marks the session as re-entered, loads the account and list; PF3 transfers to COMEN01C; PF5 shows the standard invalid-key message and sets the error flag. With no session data at all, an empty screen is shown.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-019", "REQ-F-021"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:190-257", "plain": "On first arrival the screen loads the account passed from the caller; afterwards Enter reloads, PF3 returns to the main menu, PF7/PF8 page, and any other key shows an invalid-key message.", "defect": ""}, {"key": "claude/RULE-143", "function": "claude/auth/02", "id": "RULE-143", "name": "Backward paging to previous authorization page", "text": "Given The user is on page 2 of an account's authorization list\nWhen The user presses PF7\nThen The page number decreases to 1, the list is repositioned to the saved first key of page 1 and five records are shown; on page 1, PF7 shows 'You are already at the top of the page...'.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020", "REQ-N-001"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:361-385", "plain": "PF7 shows the previous page by returning to the saved first-record key of that page; on page 1 the user is told they are already at the top.", "defect": "After repositioning, the forward-fill routine adds 1 to the page number again when it reads the first row (lines 436-441) and overwrites that slot with the current page's first key. After PF7 from page 3 the counter reads 3 while page 2 is shown, so further PF7 presses keep showing page 2 and the user cannot go back to page 1. Also, there is no guard at 20 pages: going past page 20 writes outside the saved-key table."}, {"key": "claude/RULE-144", "function": "claude/auth/02", "id": "RULE-144", "name": "Step to the next authorization of the same account (PF8)", "text": "Given Account 00000012345 with pending authorizations K1, K2 and the currently selected key K1\nWhen The user presses PF8\nThen K1 is re-read, the next detail segment under the same account (K2) is fetched, K2 becomes the selected key and its details are displayed. If K2 is the last and PF8 is pressed again, the message 'Already at the last Authorization...' is shown and the screen is sent without erasing.", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-034", "REQ-F-035", "REQ-F-036"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289", "plain": "PF8 moves the detail view to the next pending authorization under the same account; at the last one the user is told so and the current view stays.", "defect": ""}, {"key": "claude/RULE-145", "function": "claude/auth/05", "id": "RULE-145", "name": "Reload inserts all summaries before any details", "text": "Given The root file INFILE1 holds 100 summary records and the child file INFILE2 holds 450 detail records keyed by account ID\nWhen The PAUDBLOD load batch runs\nThen All 100 summaries are inserted until end of file (status 10). After that, each of the 450 details is inserted under the summary whose account ID matches its key.", "program": "PAUDBLOD", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:175-183", "plain": "When the pending-authorization database is rebuilt from the unload files, every summary is loaded first. Details are loaded only after that, so each detail's parent summary already exists.", "defect": ""}, {"key": "claude/RULE-146", "function": "claude/trantype/04", "id": "RULE-146", "name": "Add a new transaction type", "text": "Given Transaction type table does not contain code '08' and the input record is 'A08Interest adjustment'\nWhen The record is processed\nThen Row (TR_TYPE='08', TR_DESCRIPTION='Interest adjustment') is inserted into CARDDEMO.TRANSACTION_TYPE and 'RECORD INSERTED SUCCESSFULLY' is displayed. If '08' already exists, DB2 rejects the insert (negative SQLCODE, e.g. -803 duplicate key, per primary key on TR_TYPE in ddl/TRNTYPE.ddl:1-4) and 'Error accessing: TRANSACTION_TYPE table. SQLCODE:-803' is displayed with return code 4.", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:132-164", "plain": "An 'A' record creates a new transaction type in the reference table using the 2-character code and the 50-character description from the input; any database error (including a duplicate code) is reported and sets return code 4.", "defect": ""}, {"key": "claude/RULE-147", "function": "claude/trantype/04", "id": "RULE-147", "name": "Update a transaction type description", "text": "Given Transaction type '01' exists with description 'Purchase' and the input record is 'U01Retail purchase'\nWhen The record is processed\nThen TR_DESCRIPTION for TR_TYPE='01' becomes 'Retail purchase' and 'RECORD UPDATED SUCCESSFULLY' is displayed. For 'U99New desc' where '99' does not exist, SQLCODE +100 yields 'No records found.' and return code 4.", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195", "plain": "A 'U' record replaces the description of an existing transaction type; the type code itself cannot be changed, and if no type with that code exists the record is reported as 'No records found.' with return code 4.", "defect": ""}, {"key": "claude/RULE-148", "function": "claude/trantype/04", "id": "RULE-148", "name": "Delete a transaction type (blocked while categories reference it)", "text": "Given Transaction type '02' exists and has rows in CARDDEMO.TRANSACTION_TYPE_CATEGORY, and the input record is 'D02'\nWhen The record is processed\nThen DB2 rejects the delete because of the ON DELETE RESTRICT foreign key (ddl/TRNTYCAT.ddl:6-7), a negative SQLCODE is returned, 'Error accessing: TRANSACTION_TYPE table. SQLCODE:<n>' is displayed and return code is 4. If '02' had no categories it would be deleted with 'RECORD DELETED SUCCESSFULLY'; if '02' did not exist, SQLCODE +100 gives 'No records found.' and return code 4.", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226", "plain": "A 'D' record removes a transaction type by code; if the code does not exist it is reported as 'No records found.', and if transaction type categories still reference it the database refuses the delete and the program reports an access error with return code 4.", "defect": ""}, {"key": "claude/RULE-149", "function": "claude/trantype/02", "id": "RULE-149", "name": "Update transaction type description", "text": "Given Row 2 (type '02', description 'Payment') is marked 'U' and the user typed 'Bill Payment'\nWhen The user presses F10 to save\nThen TR_DESCRIPTION for TR_TYPE '02' is set to 'Bill Payment' and committed, the message is 'HIGHLIGHTED row was updated', and the page is re-read starting from the first code on the current page. SQLCODE +100: 'Record not found. Deleted by others ?'. SQLCODE -911: 'Deadlock. Someone else updating ?' and an input error. Other negative codes: 'Update failed with'. In every failure case the update stays pending", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894", "plain": "After F10 confirmation, the description of the selected type code is overwritten with the new value the user typed, and the change is committed.", "defect": "The stored VARCHAR length (DCL-TR-DESCRIPTION-LEN) is FUNCTION LENGTH of the untrimmed 50-byte field, so it is always 50 (line 1843-1844). Descriptions are saved padded with trailing spaces or LOW-VALUES instead of at their trimmed length."}, {"key": "claude/RULE-150", "function": "claude/trantype/02", "id": "RULE-150", "name": "Delete transaction type, blocked when child records exist", "text": "Given Type code '05' is selected for delete and confirmed with F10\nWhen The DELETE ... WHERE TR_TYPE = '05' runs\nThen SQLCODE 0: the program commits (SYNCPOINT), shows 'HIGHLIGHTED row deleted.Hit Enter to continue' and resets the list to page 1 (lines 817-833). SQLCODE -532 (referential-integrity violation): nothing is deleted, the request stays pending and the message is 'Please delete associated child records first:'. Any other error: 'Delete failed with message:'", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-020"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1896-1940", "plain": "After F10 confirmation, the selected transaction type is deleted from TRANSACTION_TYPE and committed. If the database reports dependent child records, the delete is refused and the user is told to delete the child records first.", "defect": ""}, {"key": "claude/RULE-151", "function": "claude/trantype/02", "id": "RULE-151", "name": "Two-step confirmation required before deleting or updating a transaction type", "text": "Given On the previous screen the user marked row 3 (type code '05') with 'D' and pressed Enter, which showed 'Delete HIGHLIGHTED row ? Press F10 to confirm' and saved the delete-requested flag 'Y'\nWhen The user presses F10 without changing the type filter, the description filter or the selected row\nThen The delete runs. If the user had changed a filter or picked a different row, or if no delete/update request was pending, F10 is treated as Enter and the list is just shown again", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:574-678", "plain": "A delete or update only runs when the user presses F10 on the screen after the one where they marked the row and pressed Enter, and only if nothing on the screen changed in between. Otherwise F10 counts as Enter.", "defect": ""}, {"key": "claude/RULE-152", "function": "claude/trantype/03", "id": "RULE-152", "name": "Save is an upsert: update the description, insert the type if it does not exist", "text": "Given Validated changes are awaiting confirmation (state N) for type '07' description 'Refund adjustment'\nWhen The operator presses F5\nThen UPDATE TRANSACTION_TYPE SET TR_DESCRIPTION where TR_TYPE='07'; SQLCODE 0 -> commit, state C 'Changes committed to database'; SQLCODE +100 -> INSERT ('07','Refund adjustment') and commit; SQLCODE -911 (deadlock/timeout) -> state L 'Could not lock record for update'; other negative SQLCODE or insert failure -> state F 'Update of record failed' with SQL error text", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-016"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1592", "plain": "When the operator confirms with F5, the system updates the description of the transaction type; if no row exists for that code it inserts a new transaction type instead, and commits on success.", "defect": "Stored description length is set to FUNCTION LENGTH of the untrimmed 50-byte field (lines 1541-1542), so every description is saved padded with trailing spaces to 50 characters. Also there is no optimistic-concurrency check: the update does not compare the fetched old description, so a concurrent change by another user is silently overwritten despite a message existing for that case."}, {"key": "claude/RULE-153", "function": "claude/trantype/03", "id": "RULE-153", "name": "Deleting a transaction type requires two-step F4 confirmation and is blocked by child records", "text": "Given Type '03' is displayed (state S)\nWhen The operator presses F4, sees 'Delete this record ? Press F4 to confirm', then presses F4 again\nThen Row with TR_TYPE='03' (the originally fetched key) is deleted; SQLCODE 0 -> commit, state 7 'Delete successful.'; SQLCODE -532 (referential constraint) -> message 'Please delete associated child records first...'; any other error -> state 6 'Changes unsuccessful' with 'Delete failed with message...'", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021", "REQ-F-022"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1663", "plain": "A displayed transaction type can be deleted only by pressing F4 once to request and F4 again to confirm; the database delete is refused if dependent records (e.g. transaction categories) still reference the type.", "defect": "On SQLCODE -532 the state is left at '8' (start delete) instead of '6' (delete failed) and the error message concatenates SQLERRM twice (lines 1645-1646); the screen then has no matching info-message/state handling for '8', and the field will not be highlighted red."}, {"key": "claude/RULE-154", "function": "claude/trantype/03", "id": "RULE-154", "name": "Transaction type maintenance screen state machine", "text": "Given States: blank=not fetched, K=invalid search key, X=not found, S=show details, R=create new, V=review new, E=changes not OK, N=changes OK not confirmed, C=saved, L=lock error, F=save failed, B=backed out, 9/8/7/6=delete confirm/start/done/failed\nWhen The operator submits input or a function key\nThen Not fetched + valid key -> read table: found -> S, not found -> X ('Press F05 to add. F12 to cancel'); X + F5 -> R ('Enter new transaction type details.'); S + valid change -> N; N + F5 -> save (C/L/F); N + F12 -> B 'Update was cancelled'; B -> E on next pass; C -> S, and next interaction resets to search; unexpected state -> abend code 0001 'UNEXPECTED DATA SCENARIO'", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-009", "REQ-F-011", "REQ-F-017", "REQ-F-025", "REQ-F-026", "REQ-F-027"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:978-1082", "plain": "The screen moves through defined states: not fetched -> shown / not found -> (create new / changes not OK / changes OK awaiting F5) -> saved / lock error / failed, plus delete-confirm and delete outcomes, with any unexpected combination aborting the transaction.", "defect": ""}, {"key": "claude/RULE-155", "function": "claude/vsammq/01", "id": "RULE-155", "name": "Queue-driven request processing loop with per-message commit", "text": "Given The transaction is started by an MQ trigger naming the input queue and three requests are waiting\nWhen The program runs\nThen Each message is got under syncpoint, processed and replied to; a CICS SYNCPOINT commits the get and reply together before the next get (lines 325-331); after the third message, a 5-second wait with no message (reason MQRC-NO-MSG-AVAILABLE) ends the loop, queues are closed and control returns to CICS.", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-N-002", "REQ-F-015", "REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:178-218", "plain": "The program is triggered by MQ, opens the error, input and reply queues, then repeatedly reads requests (waiting up to 5 seconds for each), answers each one, and commits after each message; it ends when no message arrives within the wait interval.", "defect": ""}, {"key": "claude/RULE-156", "function": "claude/vsammq/02", "id": "RULE-156", "name": "Triggered drain-the-queue processing loop with per-message commit", "text": "Given The trigger message names the input queue and 3 requests are queued\nWhen The transaction runs\nThen All 3 requests get replies, each get+reply pair is committed by a CICS SYNCPOINT, and after 5 seconds with no new message (MQRC-NO-MSG-AVAILABLE) the loop ends and the transaction closes its queues and returns", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-N-002", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:274-337", "plain": "When the MQ trigger starts the transaction, it reads the input queue named in the trigger message and keeps processing requests until no message arrives within 5 seconds. The get and the reply for each message are committed together.", "defect": ""}, {"key": "claude/RULE-157", "function": "claude/util/03", "id": "RULE-157", "name": "Sequential extract run lifecycle and end-of-file handling", "text": "Given An account file holding N records\nWhen The batch job runs\nThen N records go to OUTFILE and ARRYFILE and 2N to VBRCFILE. File status '10' sets end-of-file and ends the loop normally. Any other non-'00' read status abends with code 999.", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBACT01C.cbl:141-198", "plain": "The batch opens the account file and three output files, reads every account in key order until end of file, and writes all four extract records for each account. A read error ends the run with an abend.", "defect": "The three output files are never closed (only 9000-ACCTFILE-CLOSE runs), so the run relies on runtime cleanup at GOBACK."}, {"key": "claude/RULE-158", "function": "claude/posting/03", "id": "RULE-158", "name": "Reset current-cycle credit and debit totals at interest posting", "text": "Given An account with current-cycle credit $300.00 and current-cycle debit $1,200.00\nWhen The interest batch posts the account's interest total\nThen ACCT-CURR-CYC-CREDIT = 0.00 and ACCT-CURR-CYC-DEBIT = 0.00, and the record is rewritten together with the updated current balance", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-N-002"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CBACT04C.cbl:350-370", "plain": "When interest is posted to an account, the account's current-cycle credit and debit totals are set back to zero, which closes the billing cycle.", "defect": ""}, {"key": "claude/RULE-159", "function": "claude/posting/03", "id": "RULE-159", "name": "Interest transaction record generation", "text": "Given Run parameter date '2025-04-30', the 3rd interest charge in this run, account 00000000001 with card 4111111111111111, and interest $20.82\nWhen The interest transaction is written\nThen TRAN-ID = '2025-04-30000003', TYPE='01', CAT='05', SOURCE='System', DESC='Int. for a/c 00000000001', AMT=20.82, merchant ID 0 and merchant name/city/zip blank, CARD=4111111111111111, and original and processed timestamps = the current system timestamp", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBACT04C.cbl:473-515", "plain": "Every interest charge is written as a system-generated transaction with type 01 and category 05. It is charged to the account's cross-referenced card, and its ID is the run date followed by a 6-digit sequence number.", "defect": "Transaction IDs are unique only within one run date, so a rerun on the same date creates duplicate IDs. For multi-card accounts the card is chosen arbitrarily by the cross-reference ose all files.", "defect": ""}, {"key": "claude/RULE-162", "function": "claude/stmt/01", "id": "RULE-162", "name": "One statement is produced per card cross-reference record", "text": "Given An account 00000000011 with two cards in the cross-reference file\nWhen The statement batch runs\nThen Two separate statements are produced for account 00000000011, each showing the same account balance and FICO score but only the transactions of its own card", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CBSTM03A.CBL:316-329", "plain": "The run walks the card cross-reference file sequentially and, for each card, looks up the owning customer and account and produces one statement (text and HTML) holding that card's transactions; the run ends when the cross-reference file reaches end of file.", "defect": ""}, {"key": "claude/RULE-163", "function": "claude/stmt/02", "id": "RULE-163", "name": "File status passed back to the caller as the outcome code", "text": "Given Any handled operation on one of the four files\nWhen The operation completes\nThen The file status (for example '00' success, '10' end of file on a sequential read, '23' key not found) is copied to LK-M03B-RC. Each file goes through its own lifecycle: closed, then open (input), then read repeatedly, then closed.", "program": "CBSTM03B", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBSTM03B.CBL:151-226", "plain": "After every open, read or close it handles, the routine passes the file's 2-character status code back to the caller, which uses it to decide on success, end of file, or error.", "defect": ""}, {"key": "claude/RULE-164", "function": "claude/posting/02", "id": "RULE-164", "name": "Daily transaction file is processed sequentially until end-of-file; any other read error stops the job", "text": "Given A daily transaction file with 3 records\nWhen The batch reads each record in turn\nThen Status '00' means the record is processed. Status '10' (end-of-file) sets the end-of-file flag to 'Y' and ends the loop. Any other status sets the result code to 12, writes 'ERROR READING DAILY TRANSACTION FILE' and the file status, and abends the program with code 999 (CEE3ABD).", "program": "CBTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-N-001", "REQ-N-002"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CBTRN01C.cbl:164-225", "plain": "The batch reads the daily transaction file one record at a time. A normal read continues processing, end-of-file ends the loop, and any other read error ends the job abnormally with code 999.", "defect": "When the read hits end-of-file, the loop body still continues: lines 170-184 run the cross-reference and account lookups again using the card number left over from the last record. The last transaction is therefore checked twice, with duplicate log messages. On an empty file the lookup runs once with an uninitialized card number and logs a spurious 'COULD NOT BE VERIFIED' message."}, {"key": "claude/RULE-165", "function": "claude/posting/01", "id": "RULE-165", "name": "Create posted transaction record with processing timestamp", "text": "Given Daily transaction ID 0000000000001234 originated 2025-03-01-09.30.00.000000\nWhen It passes validation and the batch runs at 2025-03-02 02:15:07.42\nThen A transaction record with the same ID, type, category, source, description, amount, merchant and card data, original timestamp, and processing timestamp '2025-03-02-02.15.07.420000' is written", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-N-003", "REQ-F-013"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CBTRN02C.cbl:424-444", "plain": "A validated daily transaction moves to 'posted' by copying all its fields to the transaction master and stamping it with the batch's current date-time as the processing timestamp, after the category balance and account are updated.", "defect": "TRANSACT-FILE is opened OUTPUT (line 256), which would discard previously posted transactions each nightly run."}, {"key": "claude/RULE-166", "function": "claude/account/02", "id": "RULE-166", "name": "Account update screen lifecycle (change-action state machine)", "text": "Given State codes: blank/low-values=not fetched, 'S'=show details, 'E'=changes not OK, 'N'=changes OK not confirmed, 'C'=done, 'L'=lock error, 'F'=update failed\nWhen The operator submits the screen\nThen Not fetched or PF12 -> re-read the account; if the customer is found -> 'S'. 'S' plus valid changes -> 'N' ('Changes validated.Press F5 to save'). 'N' plus PF5 -> write. A write that cannot lock the account -> 'L'; a lock that succeeds but the rewrite fails -> 'F'; a record changed by someone else -> back to 'S'; otherwise 'C' ('Changes committed to database'). 'N' without PF5 -> stays 'N'. On the next interaction after 'C', 'L' or 'F', all data is cleared and the operator is asked for a new account number", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-036", "REQ-F-037", "REQ-F-038", "REQ-N-001", "REQ-F-045", "REQ-F-047", "REQ-F-048", "REQ-F-051", "REQ-F-052"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:2562-2642", "plain": "An account update moves through these states: not fetched, details shown, changes invalid, changes validated awaiting confirmation, then committed, lock error or failed. A save happens only when the operator confirms with PF5.", "defect": "COULD-NOT-LOCK-CUST-FOR-UPDATE is not mapped in the outcome EVALUATE (2606-2615). It falls to WHEN OTHER, which sets 'C' (success) even though nothing was written. The same happens for an account lock failure when an earlier message was already set, because the lock message is only set under WS-RETURN-MSG-OFF."}, {"key": "claude/RULE-167", "function": "claude/account/01", "id": "RULE-167", "name": "Screen conversation state: first entry vs re-entry", "text": "Given The program is invoked from COMEN01C with program context ENTER (0)\nWhen The transaction starts\nThen Session commarea is initialized, the empty search screen is sent, context is set to REENTER (1) and the program returns pseudo-conversationally under transaction CAVW; on the next submission (REENTER) inputs are edited and, if valid, the account is read and the screen redisplayed.", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-009"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COACTVWC.cbl:282-393", "plain": "The account view tracks whether it is being entered fresh (show empty search screen) or re-entered after the user submitted the screen (validate input and look up the account); entering fresh from the main menu or with no session data resets the session context.", "defect": ""}, {"key": "claude/RULE-168", "function": "claude/card/01", "id": "RULE-168", "name": "Session context reset on entry from another program", "text": "Given The user comes to the card list from the main menu with context 'enter'\nWhen The list program starts\nThen First/last card keys are cleared, page number is set to 1, the last-page flag is set to 'not shown', and the first page of cards is listed from the beginning of the file; screen input is not read.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-026", "REQ-F-027", "REQ-F-028", "REQ-F-029"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:315-343", "plain": "When the list is opened fresh (no session data) or from another program, paging state is cleared and the list starts again at page 1 with no filters edited.", "defect": ""}, {"key": "claude/RULE-169", "function": "claude/card/01", "id": "RULE-169", "name": "Function key handling and exit to main menu", "text": "Given The user is on the card list screen\nWhen They press PF3\nThen Control transfers to the main menu program COMEN01C with context 'enter' and message 'PF03 PRESSED.EXITING'. Pressing PF5 instead is treated as Enter and the list is refreshed.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-030", "REQ-F-031", "REQ-F-032", "REQ-F-033"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:370-414", "plain": "Only Enter, PF3, PF7 and PF8 are recognised; any other key behaves like Enter. PF3 from this screen returns the user to the main menu.", "defect": ""}, {"key": "claude/RULE-170", "function": "claude/card/01", "id": "RULE-170", "name": "Selected card routes to view or update program", "text": "Given Row 3 shows account 00000000010, card 4111000000000003, and the previous screen was this list\nWhen The user types 'U' on row 3 and presses Enter\nThen Control transfers to COCRDUPC (transaction CCUP, map CCRDUPA) with CDEMO-ACCT-ID=00000000010 and CDEMO-CARD-NUM=4111000000000003, from-program COCRDLIC, context set to 'enter'. 'S' would transfer to COCRDSLC (CCDL, CCRDSLA) the same way.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022", "REQ-F-023", "REQ-F-024", "REQ-F-025"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COCRDLIC.cbl:517-569", "plain": "After a valid single selection on Enter, 'S' sends the user to the card detail screen and 'U' sends them to the card update screen, passing that row's account and card number.", "defect": ""}, {"key": "claude/RULE-171", "function": "claude/card/02", "id": "RULE-171", "name": "Card detail screen entry routing and context reset", "text": "Given The card detail program (transaction CCDL) is invoked\nWhen (a) there is no carried context, or the caller is the main menu COMEN01C and this is not a re-entry; (b) it is a first entry from the card list COCRDLIC; (c) it is a first entry from any other program; (d) it is a re-entry (user pressed Enter on this screen)\nThen (a) the shared context is cleared and the empty search screen is shown with 'Please enter Account and Card Number'; (b) the account and card number passed by the list are trusted as already valid, the card is read and details shown; (c) the empty search screen is shown; (d) the inputs are checked, and only if they pass is the card read; in every case the screen is sent with the state set to re-entry so the next interaction is handled as (d)", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-F-020"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COCRDSLC.cbl:268-381", "plain": "The card detail inquiry decides what to do from where the user came from: a fresh start or arrival from the main menu clears the context and prompts for criteria; arrival from the card list displays the selected card right away without re-checking it; a return from the user's own screen checks the typed criteria and then looks up the card.", "defect": ""}, {"key": "claude/RULE-172", "function": "claude/card/02", "id": "RULE-172", "name": "PF3 returns to the calling program or the main menu", "text": "Given The user on the card detail screen came from the card list (COCRDLIC / CCLI)\nWhen The user presses PF3\nThen Control transfers to COCRDLIC with transaction CCLI; the context records COCRDSLC/CCDL as the sender, sets user type to regular user, and marks the target's next entry as a first entry", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022", "REQ-F-023", "REQ-F-024"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COCRDSLC.cbl:305-334", "plain": "Pressing PF3 sends the user back to whichever screen opened card details, or to the main menu if no caller is recorded.", "defect": "CDEMO-USRTYP-USER is set unconditionally on exit, which would downgrade an admin user's session type when returning to the caller. | SET CDEMO-USRTYP-USER at line 344 overwrites the signed-on user type, potentially demoting an admin to a regular user for the rest of the session."}, {"key": "claude/RULE-173", "function": "claude/signon/02", "id": "RULE-173", "name": "Navigating from a menu records the origin and resets the target screen's context", "text": "Given A regular user selects valid Main Menu option 1 (program COACTVWC)\nWhen Enter is pressed\nThen CDEMO-FROM-TRANID = 'CM00', CDEMO-FROM-PROGRAM = 'COMEN01C', CDEMO-PGM-CONTEXT = 0, and control passes to COACTVWC with the session data", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-F-015"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:177-188", "plain": "When a user picks a valid option, the menu records its own transaction and program as where the user came from, sets the context so the next screen starts fresh, and passes control and session data to the chosen function.", "defect": ""}, {"key": "claude/RULE-174", "function": "claude/signon/02", "id": "RULE-174", "name": "Menus require an active session or the user is sent back to sign-on", "text": "Given A terminal starts the Main Menu (transaction CM00) or the Admin Menu (transaction CA00) directly, so no session data (commarea length 0) is passed in\nWhen The menu program starts\nThen No menu is shown. Control goes to the sign-on program COSGN00C. If session data is present, it is loaded and the menu goes on to its first-display or re-entry logic", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COMEN01C.cbl:82-105", "plain": "If a menu is started without any session data passed in from sign-on or another screen, the user is sent straight to the sign-on screen instead of seeing the menu.", "defect": ""}, {"key": "claude/RULE-175", "function": "claude/signon/02", "id": "RULE-175", "name": "Menu first display versus re-entry state", "text": "Given Session data with the program-context flag CDEMO-PGM-CONTEXT = 0 (enter), for example right after sign-on or after coming back from a function screen\nWhen The menu program runs\nThen The context is set to 1 (re-enter), the screen is cleared and the menu is sent. On the next key press (context = 1), the screen is read and the key is handled. Every path ends by returning to CICS with transaction CM00 (or CA00 for the admin menu) and the session data", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:87-110", "plain": "The first time a user reaches a menu, a blank menu is shown and the session is marked as re-entering. On later interactions the screen input is read and acted on. Each step ends by waiting for the user's next action under the same menu transaction.", "defect": ""}, {"key": "claude/RULE-176", "function": "claude/report/01", "id": "RULE-176", "name": "Report request submission via batch job to internal reader", "text": "Given A Monthly request for 2024-02-01 to 2024-02-29 has been confirmed with 'Y'\nWhen The job is submitted\nThen Each 80-byte JCL line, up to and including '/*EOF', is written to TDQ 'JOBS'. The dates go into SYMNAMES (PARM-START-DATE / PARM-END-DATE) and into DATEPARM ('2024-02-01 2024-02-29'). The fields are cleared and the message 'Monthly report submitted for printing ...' is shown in green", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-024", "REQ-F-025", "REQ-F-026", "REQ-F-027", "REQ-F-028"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/CORPT00C.cbl:496-535", "plain": "A confirmed report request is turned into a batch job (TRNRPT00, which runs proc TRANREPT) that filters transactions by processing date between the start and end dates. The job lines are written one at a time to the JOBS transient data queue for submission, and a success message is shown only if every line was written.", "defect": "A failed TDQ write after some lines have been queued is not compensated, so a partial or corrupt job stream may reach the internal reader."}, {"key": "claude/RULE-177", "function": "claude/signon/01", "id": "RULE-177", "name": "Role-based routing and session context set-up after successful sign-on", "text": "Given Authentication succeeded for user 'ADMIN01' whose USRSEC user type is 'A'\nWhen The password matches\nThen Commarea is set: from-transaction 'CC00', from-program 'COSGN00C', user ID 'ADMIN01', user type 'A', program context 0 (first entry); control transfers (XCTL) to COADM01C. A user with type 'U' would transfer to COMEN01C", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-003"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:223-240", "plain": "After a successful sign-on the session is stamped with the user's ID and type, and administrators (type 'A') go to the Admin menu while everyone else goes to the regular user main menu.", "defect": ""}, {"key": "claude/RULE-178", "function": "claude/signon/01", "id": "RULE-178", "name": "Sign-on screen session lifecycle and key handling", "text": "Given A terminal user interacts with transaction CC00\nWhen There is no commarea (first entry), or the user presses Enter, PF3, or another key\nThen First entry: cleared screen with cursor on User ID. Enter: run validation and authentication. PF3: send plain-text thank-you message and end the CICS task without re-arming CC00. Other key: error flag set, CCDA-MSG-INVALID-KEY shown on the redisplayed screen. In all non-exit cases control returns with TRANSID CC00 and the CardDemo commarea", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:80-102", "plain": "On first arrival the blank sign-on screen is shown; afterwards Enter attempts sign-on, PF3 ends the session with a thank-you message, and any other key redisplays the screen with an invalid-key error, staying in pseudo-conversation on transaction CC00.", "defect": ""}, {"key": "claude/RULE-179", "function": "claude/txn/02", "id": "RULE-179", "name": "Transaction list screen navigation and session routing", "text": "Given A CICS task for transaction CT00 is started\nWhen There is no commarea (EIBCALEN = 0), or the program is entered for the first time (context not 1), or the user presses a key on the redisplayed screen\nThen No commarea: transfer to COSGN00C (sign-on). First entry: set context to re-enter (1), clear the screen and load page 1 from the start of the file. Re-entry: ENTER runs search/selection, PF3 transfers to COMEN01C, PF7 pages back, PF8 pages forward, any other key shows the generic invalid-key message and re-sends the screen. The program always returns to transaction CT00 with the commarea so state survives between screens.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:107-141", "plain": "The transaction list screen sends users with no session back to sign-on, shows the first page on first entry, and after that responds to Enter (search/select), PF3 (back to main menu), PF7 (previous page), PF8 (next page), and rejects any other key.", "defect": ""}, {"key": "claude/RULE-180", "function": "claude/txn/02", "id": "RULE-180", "name": "Auto-display of transaction pre-selected on the transaction list", "text": "Given The session context carries a selected transaction ID '0000000000000123' from the transaction list\nWhen The Transaction View program is entered for the first time (not a re-entry)\nThen The ID is copied into the input field and looked up and displayed immediately; if no selection exists an empty view screen is shown", "program": "COTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022", "REQ-F-023", "REQ-F-024"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COTRN01C.cbl:94-109", "plain": "When the user arrives from the transaction list having picked a transaction, the view screen opens with that transaction already looked up and shown; without session context the user is sent to sign-on.", "defect": ""}, {"key": "claude/RULE-181", "function": "claude/useradmin/01", "id": "RULE-181", "name": "User list session entry and key routing", "text": "Given An operator reaches transaction CU00 (program COUSR00C)\nWhen The program is invoked with no commarea (EIBCALEN = 0), or for the first time in a session (re-enter flag off), or re-entered with an attention key\nThen No commarea -> transfer to sign-on COSGN00C; first entry -> set re-enter flag, load the first page from the start of the user file; re-entry: Enter -> process selection/filter, PF3 -> transfer to Admin menu COADM01C, PF7 -> previous page, PF8 -> next page, any other key -> error message 'invalid key' (CCDA-MSG-INVALID-KEY) and screen redisplayed; the screen then returns to transaction CU00 with the commarea preserved", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COUSR00C.cbl:110-139", "plain": "The user list can only be used inside an established CardDemo session; first entry shows the first page, and afterwards Enter refreshes or selects, PF3 returns to the Admin menu, PF7/PF8 page, and any other key is rejected.", "defect": ""}, {"key": "claude/RULE-182", "function": "claude/useradmin/03", "id": "RULE-182", "name": "Save writes the user record only when at least one field actually changed", "text": "Given Stored user 'JSMITH01' with First Name 'John', Last Name 'Smith', Password 'pass1234', Type 'U', and the screen shows the same values except Type 'A'\nWhen the admin presses PF5 and all required fields are present\nThen the record is rewritten with Type 'A' (other fields unchanged) and the message 'User JSMITH01 has been updated ...' is shown in green; if no field had differed the message 'Please modify to update ...' is shown in red and nothing is written", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COUSR02C.cbl:215-245", "plain": "On save, the stored user record is re-read and compared field by field with the screen; changed fields are copied over and the record is rewritten only if something differs, otherwise the admin is told to modify something first.", "defect": "The result of the re-read is not checked before the comparison (lines 217-219). If the user no longer exists, the code still compares against leftover data and attempts a REWRITE without a successful READ UPDATE, so the 'User ID NOT found...' message is replaced by a generic update-failure message."}, {"key": "claude/RULE-183", "function": "claude/useradmin/03", "id": "RULE-183", "name": "Update User requires an active session and auto-fetches a user preselected from the list", "text": "Given An admin selected user 'JSMITH01' for update on the User List screen (COUSR00C)\nWhen the Update User program is entered for the first time in that flow\nThen User ID is pre-filled with 'JSMITH01' and that user's details are fetched and shown. If no session context exists (empty communication area), control goes to sign-on program COSGN00C", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COUSR02C.cbl:90-105", "plain": "If the program is started without session context, the user is sent to the sign-on screen. On first entry, if a user was already selected on the User List screen, that user's details are fetched automatically.", "defect": ""}, {"key": "claude/RULE-184", "function": "claude/vsammq/02", "id": "RULE-184", "name": "Queue open/close resource lifecycle at termination", "text": "Given The error, input and reply queues were all opened successfully\nWhen Termination runs\nThen The input, reply and error queues are each closed with MQCO-NONE, and CICS RETURN is issued", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015"], "priority": "P2", "category": "Lifecycle", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:442-523", "plain": "At termination the program closes only the queues it marked as successfully opened (input, reply, error) and then returns control to CICS.", "defect": "Recursive termination on close failure (flags are not reset before the close), the wrong queue name in the output-close error, and an error-queue close failure that tries to write to the queue being closed."}, {"key": "claude/RULE-185", "function": "claude/report/01", "id": "RULE-185", "name": "Report screen navigation and session guard", "text": "Given The program is started with no communication area\nWhen Transaction CR00 runs\nThen Control passes to sign-on program COSGN00C. On first entry with context, an empty report screen is shown. On later entries, PF3 transfers to COMEN01C, Enter runs report processing, and other keys show the invalid-key message", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P2", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CORPT00C.cbl:172-197", "plain": "The report screen can only be reached from within a signed-on session. A call without session context goes to sign-on. PF3 returns to the main menu, Enter processes the request, and any other key is rejected.", "defect": ""}, {"key": "claude/RULE-186", "function": "claude/txn/03", "id": "RULE-186", "name": "Screen entry, pre-selection and navigation", "text": "Given The program is entered from the menu for the first time with no selected transaction\nWhen The screen is displayed and the user later presses PF3\nThen Control returns to the calling program (COMEN01C if no caller is recorded)", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P2", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COTRN02C.cbl:115-154", "plain": "With no session context, the user is sent to sign-on. On first entry, a transaction selected on the previous screen is pre-filled and processed. PF3 returns to the calling program (the main menu by default), PF4 clears the screen, PF5 copies the last transaction, Enter processes the entry, and any other key is rejected.", "defect": "If the pre-selected value is a transaction ID, the card lookup will fail ('Card Number NOT found...')."}, {"key": "claude/RULE-187", "function": "claude/auth/04", "id": "RULE-187", "name": "Pending authorization expiry (purge eligibility)", "text": "Given Expiry days = 5 (the default), today's Julian date (YYDDD) = 25040, and an authorization whose stored inverted date key PA-AUTH-DATE-9C = 74964 (99999 - 25035)\nWhen The purge batch CBPAUP0C checks that authorization detail\nThen The authorization date is 99999 - 74964 = 25035. The day difference is 25040 - 25035 = 5, which is >= 5, so the detail qualifies for deletion and is removed from the IMS PAUTDTL1 segment. At 25036 (difference 4) it would be kept.", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-007"], "priority": "P0", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:277-296", "plain": "A pending authorization detail is deleted by the nightly purge once the number of days since it was authorized reaches or exceeds the expiry-days setting. The response code does not matter: approved and declined authorizations both qualify.", "defect": "Subtracting YYDDD values directly is wrong across a year boundary. For example, 25001 - 24365 = 636, so an authorization from 31 Dec is purged on 1 Jan after only 1 day, whatever the expiry setting."}, {"key": "claude/RULE-188", "function": "claude/auth/03", "id": "RULE-188", "name": "Fraud update is all-or-nothing across the Db2 fraud register and the IMS authorization record", "text": "Given The user pressed PF5 and COPAUS2C returned update status 'S' (success)\nWhen The program replaces the IMS pending authorization detail segment (PAUTDTL1) with the updated record\nThen If the IMS replace returns OK (status blank or 'FW'), a SYNCPOINT commits both Db2 and IMS changes and a success message is shown; for any other IMS status, SYNCPOINT ROLLBACK undoes the Db2 fraud row as well, the error flag is set and ' System error while FRAUD Tagging, ROLLBACK||<code>' is shown.", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001", "REQ-N-002", "REQ-N-003"], "priority": "P0", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:520-552", "plain": "A fraud tag is committed only when both the Db2 fraud register write and the IMS authorization detail replace succeed; if either fails, everything is rolled back.", "defect": ""}, {"key": "claude/RULE-189", "function": "claude/util/01", "id": "RULE-189", "name": "Full unfiltered export of all five master files in fixed order", "text": "Given Customer file has 50 records (some inactive), account file 60 (5 with ACCT-ACTIVE-STATUS='N'), xref 70, transaction file 10,000, card file 70 (3 expired)\nWhen The CBEXPORT batch runs\nThen The export file gets 10,250 records: 50 'C' first, then 60 'A', 70 'X', 10,000 'T', 70 'D'. Inactive accounts and expired or inactive cards are included as-is", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P0", "category": "Policy", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:149-158", "plain": "For branch migration, every customer, account, card cross-reference, transaction and card record is exported, with no status or date filter, in this order: customers, accounts, cross-references, transactions, cards.", "defect": ""}, {"key": "claude/RULE-190", "function": "claude/account/02", "id": "RULE-190", "name": "Optimistic concurrency check before saving", "text": "Given Account 12345 was displayed with credit limit 5000.00, and another user then changed it to 6000.00\nWhen The first operator confirms their changes with PF5\nThen No write occurs, the message 'Record changed by some one else. Please review' is shown, and the state returns to 'show details'", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-044", "REQ-N-001"], "priority": "P0", "category": "Policy", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:4109-4192", "plain": "Before saving, the system re-reads the account and customer under lock and compares them with the snapshot taken when they were displayed. If anyone else changed either record in between, the save is abandoned.", "defect": "After a conflict the stored snapshot (ACUP-OLD-*) is not refreshed and the screen shows the stale original values. Retrying the save fails again until the operator presses PF12 to reload."}, {"key": "claude/RULE-191", "function": "claude/card/03", "id": "RULE-191", "name": "Optimistic concurrency check before card rewrite", "text": "Given User fetched card with name 'JOHN SMITH', status 'Y', expiry 2025-12-31, CVV 123, and another user then changed the status to 'N'\nWhen The first user presses PF5 to save\nThen No write occurs; message 'Record changed by some one else. Please review'; the displayed old values are refreshed from file and state returns to 'details shown'. If the locked read fails -> 'Could not lock record for update' (state L); if the rewrite fails -> 'Update of record failed' (state F); otherwise the record is rewritten and committed", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018", "REQ-F-019"], "priority": "P0", "category": "Policy", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:1420-1523", "plain": "Before saving, the card record is re-read with a lock and compared to the values originally shown; if anyone changed it in between, the save is abandoned and the user is shown the current values to review.", "defect": "CCUP-NEW-CVV-CD is never populated (CCUP-NEW-DETAILS is initialized at line 586 and never set), so the rewrite moves spaces through a numeric redefinition into CARD-UPDATE-CVV-CD (lines 1464-1465), likely overwriting the stored CVV with zeros/invalid data. Also the rewrite builds the record from a local layout (CARD-UPDATE-RECORD) rather than the read record, so any fields not explicitly mapped are reset."}, {"key": "claude/RULE-192", "function": "claude/auth/04", "id": "RULE-192", "name": "Purge run parameter defaults", "text": "Given A SYSIN control card whose expiry-days field is non-numeric (e.g. blank) and whose checkpoint frequency fields are blank\nWhen The purge batch initializes\nThen Expiry days = 5, checkpoint frequency = 5, checkpoint display frequency = 10, and debug flag = 'N' unless it was exactly 'Y'", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-209", "plain": "If the purge job's control card leaves out or garbles a parameter, defaults apply: 5 days to expire, checkpoint every 5 summaries, a checkpoint message on every 10th checkpoint, and debug off.", "defect": ""}, {"key": "claude/RULE-193", "function": "claude/auth/01", "id": "RULE-193", "name": "Authorization response code and approved amount", "text": "Given A request for $120.50 that passed the credit check\nWhen The decision is finalized\nThen The reply has response code '00' and approved amount 120.50. If it had been declined, the reply would have code '05' and approved amount 0.00.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-019"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696", "plain": "An approved authorization returns response code '00' with the full requested amount approved. A declined one returns '05' with an approved amount of zero. Partial approvals are not supported.", "defect": ""}, {"key": "claude/RULE-194", "function": "claude/auth/01", "id": "RULE-194", "name": "Authorization reply delivery", "text": "Given A request with correlation id X and reply-to queue R\nWhen The decision has been made\nThen A non-persistent reply with correlation id X is put on R, with expiry 50 (tenths of a second = 5 seconds)", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-N-003", "REQ-F-018"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:738-766", "plain": "Each decision is sent back to the requester's reply-to queue with the request's correlation id. The message is non-persistent and expires after 5 seconds. It is sent before the result is written to the database.", "defect": ""}, {"key": "claude/RULE-195", "function": "claude/auth/01", "id": "RULE-195", "name": "Critical errors end processing", "text": "Given The IMS summary update returns a non-OK status\nWhen Error I003 is logged as critical\nThen The PSB is terminated, the request queue is closed, and the transaction returns. Remaining queued messages are left for the next trigger.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-028", "REQ-N-004", "REQ-F-031", "REQ-F-032", "REQ-F-033"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1023", "plain": "Every error is logged to the CSSL transient data queue with transaction CP00, the program name, date and time. Critical errors (MQ open/get/put, file I/O, IMS schedule/read/update/insert failures) end the run immediately. Warnings (record not found, queue close failure) let processing continue.", "defect": ""}, {"key": "claude/RULE-196", "function": "claude/auth/02", "id": "RULE-196", "name": "Authorization detail screen key handling and navigation", "text": "Given The user is on the authorization detail screen (transaction CPVD)\nWhen The user presses a key\nThen Enter re-reads and displays the selected authorization; PF3 transfers control to COPAUS0C (summary list); PF5 runs the fraud toggle; PF8 shows the next authorization; any other key re-displays the details with the standard invalid-key message.", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-025", "REQ-F-034", "REQ-F-037", "REQ-F-038", "REQ-F-039", "REQ-F-040"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:157-206", "plain": "The detail screen supports Enter (refresh), PF3 (back to the authorization summary), PF5 (toggle fraud) and PF8 (next authorization); any other key re-displays the authorization with an invalid-key message, and starting the screen with no context sends the user back to the summary.", "defect": ""}, {"key": "claude/RULE-197", "function": "claude/auth/05", "id": "RULE-197", "name": "The unload stops with return code 16 on any unexpected database or output status", "text": "Given The unload is part way through the database\nWhen A GN root read returns a status other than blank or GB, a GNP child read returns a status other than blank or GE, or a GSAM insert returns any non-blank status\nThen The program prints the status and key feedback, sets RETURN-CODE to 16 and ends, which leaves the backup partly written", "program": "DBUNLDGS", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/DBUNLDGS.CBL:249-294", "plain": "The unload treats only 'segment returned', 'end of database' (GB) and 'no more children' (GE) as normal. Any other status from reading the database or writing the backup files stops the job with return code 16.", "defect": ""}, {"key": "claude/RULE-198", "function": "claude/auth/05", "id": "RULE-198", "name": "The reload accepts records that are already in the database (duplicates are tolerated)", "text": "Given Summary for account 00000012345 is already in the IMS database\nWhen PAUDBLOD inserts the same summary again from INFILE1\nThen IMS returns status II. The program displays 'ROOT SEGMENT ALREADY IN DB', keeps the existing segment unchanged and moves to the next record.", "program": "PAUDBLOD", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:253-262", "plain": "If a summary or detail being reloaded is already in the database, the job logs 'already in DB' and continues. The existing record is not replaced or updated. Any other insert failure stops the job.", "defect": ""}, {"key": "claude/RULE-199", "function": "claude/auth/05", "id": "RULE-199", "name": "Full unload of pending authorizations with no expiry or status filter", "text": "Given The pending authorization IMS database holds account 00000012345 with a summary record and 3 detail records (one approved '00', one declined, one match status 'E' expired)\nWhen The PAUDBUNL unload batch runs\nThen The summary is written to the root output file (100 bytes) and all 3 details are written to the child output file, each prefixed with account id 12345; processing ends when IMS returns 'GB' (end of database)", "program": "PAUDBUNL", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:207-247", "plain": "The unload job exports every pending-authorization summary (one per account) and every authorization detail under it, without filtering by age, match status, fraud flag or response code.", "defect": "Expiry-days and checkpoint parameters are dead code; any expected expiry-based filtering does not happen."}, {"key": "claude/RULE-200", "function": "claude/auth/05", "id": "RULE-200", "name": "Unload aborts on any unexpected database or file-open status", "text": "Given The unload is in progress\nWhen A summary read returns a status other than blank or 'GB', or a detail read returns a status other than blank or 'GE', or OUTFIL1/OUTFIL2 open status is not blank/'00'\nThen The program displays the status and key feedback and ends with RETURN-CODE 16 (files left unclosed); a non-'00' close status is displayed but does not change the return code", "program": "PAUDBUNL", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-006"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:239-283", "plain": "The unload stops with return code 16 if either output file cannot be opened or if reading the authorization database returns anything other than success or the normal end condition; file close errors are only reported.", "defect": "Detail reads increment the summary counters (WS-NO-SUMRY-READ, WS-AUTH-SMRY-PROC-CNT) instead of detail counters (lines 268-269); counters are never reported, so no record-count reconciliation exists."}, {"key": "claude/RULE-201", "function": "claude/auth/05", "id": "RULE-201", "name": "Unload output layout links each detail to its parent account", "text": "Given Account 12345 summary with credit limit 5,000.00 and one detail of 125.50\nWhen The unload writes output\nThen OUTFIL1 gets the 100-byte summary image as-is; OUTFIL2 gets one record = account id 12345 (packed, 6 bytes) + 206-byte total containing the 200-byte detail image", "program": "PAUDBUNL", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:43-48", "plain": "The unload produces two files: a summary file with one 100-byte record per account, and a detail file in which each 200-byte authorization detail is preceded by its parent account id so the hierarchy can be rebuilt on reload.", "defect": ""}, {"key": "claude/RULE-202", "function": "claude/trantype/04", "id": "RULE-202", "name": "Batch run outcome signalled by return code 4 on any rejected record", "text": "Given An input file of 3 records where record 2 has an invalid action code\nWhen The batch job runs\nThen Records 1 and 3 are applied, record 2 is reported, and the job ends with return code 4.", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:82-99", "plain": "The maintenance file is processed record by record to end of file; any rejected record sets the job return code to 4 but the run is not stopped, and an input-file open failure is only displayed, not treated as an error.", "defect": "Open-file failure does not set a non-zero return code or stop processing (lines 84-88); 9999-ABEND is named as an abend but does not terminate."}, {"key": "claude/RULE-203", "function": "claude/trantype/02", "id": "RULE-203", "name": "Screen assumes admin user type without checking", "text": "Given A user starts transaction CTLI directly with no commarea\nWhen The program initialises\nThen CDEMO-USRTYP-ADMIN is set and the full list/update/delete function is available", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-021"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:515-532", "plain": "When the screen is started without a commarea (a direct transaction start), the program marks the session as an admin user itself and does no authorization check.", "defect": "There is no authorization check in this program, so any user who can start CTLI can update or delete transaction types (unless CICS transaction security restricts it)."}, {"key": "claude/RULE-204", "function": "claude/trantype/03", "id": "RULE-204", "name": "Exit (F3) returns to caller or Admin menu and commits work", "text": "Given The operator arrived from the Transaction Type list (COTRTLIC)\nWhen The operator presses F3\nThen A SYNCPOINT is issued and control transfers to COTRTLIC; if no calling program/transaction was recorded, control goes to COADM01C with transaction CA00", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-028", "REQ-F-029"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:429-460", "plain": "Pressing F3 commits any pending work and returns to the calling program, defaulting to the Admin menu (COADM01C / CA00) when no caller is recorded; the user is flagged as an admin user on the way out.", "defect": "Exit unconditionally sets the user type to Admin in the shared commarea; any caller trusting that flag would grant admin rights to whoever reached this screen."}, {"key": "claude/RULE-205", "function": "claude/vsammq/01", "id": "RULE-205", "name": "Account inquiry lookup and reply content", "text": "Given A request with function 'INQA' and account key 00000012345\nWhen The account file is read with that key\nThen If the account exists, the reply contains 'ACCOUNT ID : 00000012345', 'ACCOUNT STATUS : <Y/N>', 'BALANCE : ', 'CREDIT LIMIT : ', 'CASH LIMIT : ', 'OPEN DATE : ', 'EXPR DATE : ', 'REIS DATE : ', 'CREDIT BAL : ', 'DEBIT BAL : ', 'GROUP ID : ' with the stored values copied unchanged; if NOTFND the reply is 'INVALID REQUEST PARAMETERS ACCT ID : 00000012345'; on any other file error the error is posted to the error queue and the transaction terminates.", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-019"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:393-435", "plain": "For a valid inquiry the account master file (ACCTDAT) is read by the 11-digit account ID; if found, the reply returns a labelled snaps
