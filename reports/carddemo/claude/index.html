file.", "defect": "The INPUT-ERROR branch does not set WS-CARD-RID-CARDNUM from WS-CA-FIRST-CARD-NUM before calling 9000-READ-FORWARD, unlike the other branches. The displayed page can then differ from the page number shown."}, {"key": "claude/RULE-198", "function": "claude/card/03", "id": "RULE-198", "name": "Exit and return navigation after update", "text": "Given Update completed (state C) and the user arrived from the card list screen COCRDLI\nWhen The next interaction occurs\nThen A syncpoint is taken and control transfers to the calling program (default COMEN01C / CM00), with account and card ids reset to zero.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-032", "REQ-F-033", "REQ-F-035"], "priority": "P2", "category": "Lifecycle", "confidence": "Medium", "source": "app/cbl/COCRDUPC.cbl:435-476", "plain": "PF3, or completion/failure of an update started from the card list, commits work and returns to the calling program (or main menu if none), clearing selected keys when returning to the card list.", "defect": ""}, {"key": "claude/RULE-199", "function": "claude/transactions/04", "id": "RULE-199", "name": "Report screen navigation and key handling", "text": "Given An active session re-entering the report screen\nWhen User presses PF3\nThen Control transfers to COMEN01C (main menu) with from-program CORPT00C; with no commarea control goes to COSGN00C; other keys show CCDA-MSG-INVALID-KEY", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-F-020"], "priority": "P2", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/CORPT00C.cbl:172-197", "plain": "Without a session context the user is sent to sign-on; on first entry the blank report screen is shown; Enter processes the request, PF3 returns to the main menu, and any other key shows an invalid-key error.", "defect": ""}, {"key": "claude/RULE-200", "function": "claude/transactions/03", "id": "RULE-200", "name": "Screen navigation and entry from transaction list", "text": "Given Program invoked with no commarea\nWhen The transaction CT02 starts\nThen Control transfers to sign-on program COSGN00C", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-026", "REQ-F-027", "REQ-F-028", "REQ-F-029"], "priority": "P2", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:115-154", "plain": "Without a session context the user is sent to sign-on; on first entry a transaction selected on the previous screen pre-fills the card number; PF3 returns to the calling program (default main menu), PF4 clears the screen, other keys are rejected.", "defect": ""}, {"key": "claude/RULE-201", "function": "claude/useradmin/03", "id": "RULE-201", "name": "Preselected user from the user list is auto-loaded on entry", "text": "Given The user list screen passes selected user 'JDOE0001' in the shared session area\nWhen The Update User program is entered for the first time in this conversation\nThen The program marks itself as re-entered, places 'JDOE0001' in User ID, performs the lookup, and shows the profile", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"], "priority": "P2", "category": "Lifecycle", "confidence": "High", "source": "app/cbl/COUSR02C.cbl:95-105", "plain": "When the Update User screen is opened for the first time from the user list with a user already selected, that user is looked up and displayed immediately without the administrator retyping the ID.", "defect": ""}, {"key": "claude/RULE-202", "function": "claude/txntype/02", "id": "RULE-202", "name": "Update transaction type description", "text": "Given Row 1 type '01', new description 'Retail Purchase', update confirmed\nWhen The user presses F10\nThen UPDATE TRANSACTION_TYPE SET TR_DESCRIPTION='Retail Purchase' WHERE TR_TYPE='01' runs, is committed, the list re-reads and shows 'HIGHLIGHTED row was updated'", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-030", "REQ-F-031", "REQ-F-032", "REQ-F-033"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894", "plain": "Confirmed update replaces the description of the selected transaction type code and commits; not-found and lock conflicts are reported and the update stays pending.", "defect": "DCL-TR-DESCRIPTION-LEN is set to FUNCTION LENGTH of the untrimmed 50-char field (line 1843-1844), so the stored VARCHAR length is always 50 with trailing spaces, not the trimmed length."}, {"key": "claude/RULE-203", "function": "claude/txntype/02", "id": "RULE-203", "name": "Delete transaction type with child-record protection", "text": "Given Type '03' is referenced by transaction category rows\nWhen The user confirms the delete with F10\nThen DB2 returns -532, the delete stays pending and 'Please delete associated child records first:' plus the DB2 message is shown", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-034", "REQ-F-035", "REQ-F-036"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1896-1940", "plain": "Confirmed delete removes the transaction type by code and commits; if the type is still referenced by dependent records the delete is refused.", "defect": "CA-DELETE-SUCCEEDED and CA-DELETE-NOT-REQUESTED share the same value (LOW-VALUES, lines 411-414), so 'succeeded' cannot be distinguished from 'never requested'; correctness relies on F10 only being accepted when the flag is 'Y'."}, {"key": "claude/RULE-204", "function": "claude/mqinquiry/01", "id": "RULE-204", "name": "Account inquiry reply content", "text": "Given Account 00000012345 exists on ACCTDAT with status 'Y', balance 1250.00, credit limit 5000.00, cash limit 1000.00, open date 2020-01-15, expiry 2025-01-15, reissue 2023-01-15, cycle credit 200.00, cycle debit 450.00, group 'GOLD'\nWhen An 'INQA00000012345' request is processed\nThen A reply 'ACCOUNT ID : 00000012345ACCOUNT STATUS : YBALANCE : <balance>CREDIT LIMIT : ...CASH LIMIT : ...OPEN DATE : 2020-01-15EXPR DATE : 2025-01-15REIS DATE : 2023-01-15CREDIT BAL : ...DEBIT BAL : ...GROUP ID : GOLD' is put to the reply queue; amounts are copied as-is with no calculation", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:396-427", "plain": "For a valid inquiry, the account is read by account id from the account master file (ACCTDAT) and a labelled reply is returned with account id, active status, current balance, credit limit, cash credit limit, open date, expiration date, reissue date, current cycle credit, current cycle debit and group id.", "defect": "Signed amounts are emitted in zoned display format with overpunched sign and no decimal point, so a negative balance shows as a trailing letter/brace character in the text reply; consumers must decode it."}, {"key": "claude/RULE-205", "function": "claude/provisioning/01", "id": "RULE-205", "name": "Unfiltered full export including inactive records and sensitive data", "text": "Given A card with active status 'N' and CVV 123, and a customer with an SSN and a FICO score of 720\nWhen the export runs\nThen the card is exported as a 'D' record with its CVV and status 'N', and the customer is exported as a 'C' record with the SSN, government ID, DOB, EFT account and FICO 720 in clear", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBEXPORT.cbl:522-541", "plain": "Every record in every source file is exported with no eligibility filter. That includes inactive accounts and cards and every transaction in history, and also customer SSNs, government IDs, EFT account IDs, FICO scores and card CVV codes.", "defect": "PCI DSS forbids storing CVV codes after authorization, yet this export writes CARD-CVV-CD to the migration file. SSNs and other PII also go out with no masking."}, {"key": "claude/RULE-206", "function": "claude/provisioning/02", "id": "RULE-206", "name": "Route export records to target files by record-type code", "text": "Given An export file with 5 records whose types are C, A, X, T, D, read in sequence-number order\nWhen The import batch processes the file\nThen One record each is written to CUSTOUT, ACCTOUT, XREFOUT, TRNXOUT and CARDOUT, and the matching imported counter goes up by 1", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-011"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBIMPORT.cbl:270-285", "plain": "Each record in the branch-migration export file goes to exactly one target file, chosen by its one-character record type: C=Customer, A=Account, X=Card cross-reference, T=Transaction, D=Card; any other code is rejected as unknown.", "defect": ""}, {"key": "claude/RULE-207", "function": "claude/batch/04", "id": "RULE-207", "name": "Transactions are grouped by card in a fixed-size in-memory table", "text": "Given The transaction file holds, in order, 2 transactions for card A, then 3 for card B\nWhen The transaction load step runs\nThen Card slot 1 = A with count 2, card slot 2 = B with count 3; the final group's count is saved on end-of-file (RC '10')", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBSTM03A.CBL:818-853", "plain": "All transactions are read up front and grouped by card number into a table of at most 51 cards with at most 10 transactions each; a new card group starts whenever the card number changes from the previous record.", "defect": "No capacity guard: the 52nd card or the 11th transaction for a card writes past the table bounds (storage overlay or unpredictable output), so statements could be wrong without any error. Limits of 51 cards / 10 transactions are far below realistic production volumes."}, {"key": "claude/RULE-208", "function": "claude/account/02", "id": "RULE-208", "name": "Optimistic concurrency check before save", "text": "Given User A loaded account 12345 with credit limit 5000.00, and user B has since changed it to 6000.00\nWhen User A presses F5 to save\nThen The save is abandoned with 'Record changed by some one else. Please review' and the stage goes back to S (details shown)", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-050", "REQ-F-051"], "priority": "P0", "category": "Policy", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:4109-4192", "plain": "Before saving, the system locks the account and customer records and checks that nobody changed them since they were shown. If anyone did, the save is abandoned and the latest values are shown again.", "defect": ""}, {"key": "claude/RULE-209", "function": "claude/signon/03", "id": "RULE-209", "name": "Admin Menu performs no user-type authorization", "text": "Given A session whose user type is 'U' (regular) arrives at COADM01C with session data\nWhen The program runs\nThen The admin menu is shown and every admin option (user add, update and delete, transaction-type maintenance) can be selected. CDEMO-USER-TYPE is never tested in this program.", "program": "COADM01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COADM01C.cbl:86-109", "plain": "The Admin Menu itself never checks that the signed-in user is an admin, so access depends entirely on the sign-on program sending only admins there.", "defect": "Admin functions (security user maintenance) are gated only by routing at sign-on. Any path that transfers a non-admin session to COADM01C, or a direct start of transaction CA00 with a forged session area, grants admin options."}, {"key": "claude/RULE-210", "function": "claude/card/01", "id": "RULE-210", "name": "Card list visibility is not restricted by user role (admin vs regular user)", "text": "Given A signed-on regular user (CDEMO-USRTYP-USER) whose context account is 00000000001, with the account and card filters left blank\nWhen The card list screen is displayed\nThen Cards from all accounts in CARDDAT are listed, 7 per page. The only filtering is by the account and card filters typed on screen (9500-FILTER-RECORDS).", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COCRDLIC.cbl:1382-1407", "plain": "The header says admins see all cards and regular users see only cards on their own account, but the code never checks the user type. Every user sees every card in the card file unless they type an account or card filter themselves.", "defect": "The authorization behavior in the header comment (admin sees all, user sees only own account) is not in the code. Any user can browse all card numbers. The program also forces the user type to 'U', which throws away the caller's admin flag."}, {"key": "claude/RULE-211", "function": "claude/card/02", "id": "RULE-211", "name": "Card lookup uses card number only; account number is not checked against the card", "text": "Given A user enters account 00000000001 and card number 4111111111111111, and that card actually belongs to account 00000000099\nWhen Enter is pressed and both fields pass format validation\nThen The card file (CARDDAT) is read by card number 4111111111111111 alone. The read succeeds, and the card's details are shown with the message 'Displaying requested details', even though the account does not match.", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P0", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COCRDSLC.cbl:736-773", "plain": "Card details are retrieved from the card master file using only the 16-digit card number. The account number the user enters is validated but never used to confirm that the card belongs to that account.", "defect": "The account/card combination is never cross-checked, so any valid card can be viewed under any non-zero account number. The screen message 'Did not find cards for this search condition' suggests the designers intended a combined account+card match. This may be an authorization or data-exposure gap."}, {"key": "claude/RULE-212", "function": "claude/signon/02", "id": "RULE-212", "name": "Admin-only menu options blocked for regular users", "text": "Given A signed-on user whose type is 'U' and a Main Menu option whose required user type is 'A'\nWhen The user selects that option and presses Enter\nThen The error flag is set, the message 'No access - Admin Only option... ' is shown, and the user is not transferred. Admin users ('A') and options flagged 'U' are not blocked.", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-005", "REQ-F-006"], "priority": "P0", "category": "Policy", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:136-143", "plain": "A regular user ('U') who picks a Main Menu option flagged for admins only ('A') is refused with 'No access - Admin Only option...'.", "defect": "The admin-only check is not skipped when the option number has already failed validation. An option of 00 or above 11 reads CDEMO-MENU-OPT-USRTYPE outside the populated table: slot 12 is uninitialised and slots 13 to 99 are past the end of the array. The same request can also send the menu screen twice."}, {"key": "claude/RULE-213", "function": "claude/pendauth/04", "id": "RULE-213", "name": "Purge expiry period default", "text": "Given SYSIN parameter card whose first two characters are '  ' (non-numeric)\nWhen the purge batch initializes\nThen expiry days is set to 5; if the card starts with '03' expiry days is 3", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-N-001", "REQ-F-003"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-200", "plain": "The number of days after which pending authorizations expire comes from the job parameter card and defaults to 5 days when not supplied as a number.", "defect": ""}, {"key": "claude/RULE-214", "function": "claude/pendauth/01", "id": "RULE-214", "name": "Per-run message limit and per-message commit", "text": "Given A request queue holding 800 messages\nWhen The program is triggered\nThen Each message is processed and committed (SYNCPOINT) on its own, and the run stops after 501 messages because the check is processed > 500. The rest wait for the next trigger.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-N-001", "REQ-F-003"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:323-344", "plain": "A triggered run reads authorization requests from the queue one at a time, commits after each, and stops when the queue is empty (after a 5-second wait) or after about 500 messages.", "defect": ""}, {"key": "claude/RULE-215", "function": "claude/pendauth/01", "id": "RULE-215", "name": "Authorization response code and approved amount", "text": "Given A request for $120.50 that passes the available-credit check\nWhen The decision is finalized\nThen Response code is '00' and approved amount is $120.50. If it had been declined, the response code would be '05' and the approved amount $0.00.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-F-022"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:685-696", "plain": "An approved request returns response code '00' and approves the full requested amount. A declined request returns '05' and approves $0. Partial approvals do not exist.", "defect": "WS-RESP-LENGTH (the STRING pointer, starting at 1) is never reset between messages, so the reply buffer may be built at a growing offset after the first message. The reply length sent (W02-BUFFLEN = WS-RESP-LENGTH) is also the pointer position, which is one byte past the data."}, {"key": "claude/RULE-216", "function": "claude/pendauth/01", "id": "RULE-216", "name": "Error severity determines whether processing continues", "text": "Given A failed account file read with a response other than NORMAL or NOTFND\nWhen The error is logged\nThen Error C002 is written to the CSSL log as critical, the run is terminated (PSB released, queue closed) and the transaction returns without processing more messages.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-010", "REQ-F-023", "REQ-N-003", "REQ-F-034", "REQ-F-035", "REQ-F-036", "REQ-F-037"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:983-1010", "plain": "Every error is logged with program, transaction, date and time. Warnings (data not found) let processing continue. Critical errors (system read or write failures) stop the whole run immediately.", "defect": ""}, {"key": "claude/RULE-217", "function": "claude/pendauth/03", "id": "RULE-217", "name": "Fraud tag is saved only after the fraud service succeeds; otherwise everything is rolled back", "text": "Given An authorization being tagged as fraud via PF5\nWhen COPAUS2C returns with EIBRESP NORMAL and update status 'S'\nThen The detail segment is replaced from the record COPAUS2C returned (REPL, lines 520-528), a syncpoint commits it, and the message 'AUTH MARKED FRAUD...' is shown ('AUTH FRAUD REMOVED...' if the new state is 'R')", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:253-262", "plain": "The new fraud status is written to the IMS authorization detail record only when the call to the fraud service completes normally and that service reports success. Any failure rolls back the unit of work and shows a message.", "defect": "When the LINK fails or the fraud service fails, the rollback restores the database, but POPULATE-AUTH-DETAILS still shows the toggled in-memory fraud flag, so the screen can show a fraud state that was never saved."}, {"key": "claude/RULE-218", "function": "claude/pendauth/05", "id": "RULE-218", "name": "Unload stops on end of database and fails fast on any other database or extract error", "text": "Given An unload is running\nWhen The root read returns status GB, or a child read returns GE, or any read or GSAM insert returns any other non-blank status\nThen GB ends the root loop normally and the job closes. GE ends the detail loop for the current summary. Any other status displays the status and key feedback, sets RETURN-CODE to 16 and ends the program.", "program": "DBUNLDGS", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/DBUNLDGS.CBL:249-294", "plain": "The unload treats 'end of database' as a normal finish and 'no more children' as the end of the current summary. Any other status from reading the database or writing an extract record stops the job with return code 16.", "defect": ""}, {"key": "claude/RULE-219", "function": "claude/pendauth/05", "id": "RULE-219", "name": "Every unloaded authorization detail carries its parent account ID as the key", "text": "Given Summary with PA-ACCT-ID 00000012345 has 2 authorization detail segments\nWhen The details are read under their parent (GNP, unqualified SSA PAUTDTL1) and written to OPFILE2\nThen Both OPFILE2 records have ROOT-SEG-KEY = 12345 (packed decimal, 11 digits) followed by the 200-byte detail segment image", "program": "PAUDBUNL", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:228-230", "plain": "Each detail record in the unload is prefixed with the account ID of its parent summary, so the parent-child hierarchy can be rebuilt when the data is reloaded.", "defect": ""}, {"key": "claude/RULE-220", "function": "claude/pendauth/05", "id": "RULE-220", "name": "The unload stops with return code 16 on any unexpected database status", "text": "Given The unload is running\nWhen A root read returns a status other than blank or GB, or a child read returns a status other than blank or GE, or OPFILE1/OPFILE2 fails to open with a status other than blank/'00'\nThen The status and key feedback area are displayed and the program ends with RETURN-CODE 16. Files already written are left partly complete (no close is performed)", "program": "PAUDBUNL", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:239-247", "plain": "The unload treats only 'record found', 'end of database' (for summaries) and 'no more details under this parent' (for details) as normal. Any other IMS status, or a failure to open an output file, ends the job with return code 16.", "defect": "Line 243 has no END-IF and is ended only by the period on line 247. That works, but it is fragile. An abend leaves partial output files open, and nothing is written to them to mark the run as incomplete."}, {"key": "claude/RULE-221", "function": "claude/txntype/01", "id": "RULE-221", "name": "Errors set return code 4, but the batch keeps going and commits the rest", "text": "Given A file of three records: 'A','10',... (works), 'U','99',... (code not found), 'D','10',... (works)\nWhen The batch runs\nThen Records 1 and 3 are applied, record 2 displays 'No records found.', and the job ends with return code 4. No explicit COMMIT or ROLLBACK is issued, so the outcome rests on the implicit commit at normal program end", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020", "REQ-F-021", "REQ-F-022"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:230-233", "plain": "When any record fails, the batch displays the error and sets job return code 4, then keeps processing later records. Successful changes are kept, because nothing rolls them back.", "defect": "The paragraph 9999-ABEND does not abend: processing continues after invalid or failed records, and the open failure at lines 84-88 neither sets a return code nor stops the run. With no explicit COMMIT/ROLLBACK, a partially failed file still applies its successful changes."}, {"key": "claude/RULE-222", "function": "claude/txntype/02", "id": "RULE-222", "name": "Admin role assumed without authorization check", "text": "Given A user starts transaction CTLI directly with no commarea\nWhen The program initializes\nThen CDEMO-USRTYP-ADMIN is set and the user can list, update and delete transaction types", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-040"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:515-532", "plain": "When the program is started with no context it marks the session as an admin user rather than verifying the user's role.", "defect": "Direct invocation grants admin capability to maintain reference data."}, {"key": "claude/RULE-223", "function": "claude/txntype/03", "id": "RULE-223", "name": "Allowed function keys depend on the screen state", "text": "Given A record is displayed (state S)\nWhen The user presses F5\nThen F5 is rejected as invalid, because F5 is allowed only when changes are validated (N), a record was not found (X) or a delete is in progress", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-034", "REQ-F-035", "REQ-F-036"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:577-623", "plain": "Each step of the workflow accepts only certain keys. Any other key is rejected with 'Invalid key pressed' and the screen is shown again unchanged.", "defect": "F5 is marked valid when a delete is in progress (line 591) but has no matching action; the key list on the screen (line 1411) does not show it. This looks like a mismatch."}, {"key": "claude/RULE-224", "function": "claude/txntype/03", "id": "RULE-224", "name": "Change detection ignores letter case and leading or trailing spaces", "text": "Given The stored description is 'Purchase' and the user changes it to 'PURCHASE'\nWhen They press Enter\nThen The message 'No change detected with respect to values fetched.' is shown, the state stays Show Details, and the save step is not offered", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:783-816", "plain": "The system treats an edit as 'no change' if the type code and the description match the stored values after trimming spaces and ignoring upper or lower case, so a change of case alone cannot be saved.", "defect": ""}, {"key": "claude/RULE-225", "function": "claude/mqinquiry/01", "id": "RULE-225", "name": "Reply routing and correlation", "text": "Given A request with MsgId M1, CorrelId C1 and ReplyToQ 'MY.REPLY.Q'\nWhen The reply is put\nThen The reply is put to CARD.DEMO.REPLY.ACCT (not MY.REPLY.Q) with MsgId M1, CorrelId C1, format MQSTR, queue-manager CCSID, under syncpoint, fixed length 1000 bytes", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-N-001"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:462-478", "plain": "Every reply goes to the fixed queue CARD.DEMO.REPLY.ACCT as a string message carrying the original request's message id and correlation id so the requester can match it; the requester's own reply-to queue is ignored.", "defect": ""}, {"key": "claude/RULE-226", "function": "claude/mqinquiry/02", "id": "RULE-226", "name": "Reply correlation and fixed reply destination", "text": "Given A request with MsgId M1, CorrelId C1 and ReplyToQ 'CLIENT.Q'\nWhen The reply is put\nThen The reply goes to CARD.DEMO.REPLY.DATE (set at line 147) with MsgId=M1, CorrelId=C1, format MQSTR and the queue manager's CCSID, under syncpoint", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-N-002", "REQ-F-007"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:366-403", "plain": "Each reply is put on the fixed queue CARD.DEMO.REPLY.DATE and carries the request's message ID and correlation ID so the requester can match it; the reply-to queue named in the request is ignored.", "defect": "The request's ReplyToQ is captured but ignored, so requesters that name their own reply queue never get the answer there."}, {"key": "claude/RULE-227", "function": "claude/mqinquiry/02", "id": "RULE-227", "name": "Error reporting to error queue", "text": "Given The reply MQPUT fails with condition 2, reason 2053 (queue full)\nWhen The failure is handled\nThen A record containing the failing step, 'MQPUT ERR', condition code 02, reason code 02053 and queue name CARD.DEMO.REPLY.DATE is put on CARD.DEMO.ERROR under syncpoint, and termination closes any open queues and returns", "program": "CODATE01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-005", "REQ-F-011", "REQ-N-002", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/CODATE01.cbl:405-440", "plain": "Any failure (trigger retrieve, queue open, get or put) is written as a structured error record to CARD.DEMO.ERROR and the service then stops; if the error queue itself cannot be written, the error is only written to the job log.", "defect": "In the RETRIEVE failure path, line 151 moves WS-CICS-RESP2-CD to itself instead of to WS-CICS-RESP2-CD-D, so the reported RESP2 is always zero. The 'CICS RETRIEVE' failure path also goes on to open the input queue (line 161) because 8000-TERMINATION ends with RETURN; whether that line is reached depends on how CICS RETURN behaves."}, {"key": "claude/RULE-228", "function": "claude/provisioning/03", "id": "RULE-228", "name": "Output write acceptance and fatal I/O failure policy", "text": "Given An output write that returns file status '34' (out of space)\nWhen The extract, array or variable-length record is written\nThen The program shows 'FILE STATUS IS: NNNN0034' and abends with code 999; no further accounts are processed", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBACT01C.cbl:242-251", "plain": "Any failure to open the account file or an output file, to write an output record, or to close the account file stops the whole batch with abend code 999. Writes are treated as successful when the status is '00' or '10'.", "defect": "Treating status '10' as a successful write is unusual and could hide a real problem."}, {"key": "claude/RULE-229", "function": "claude/batch/03", "id": "RULE-229", "name": "Interest rate lookup by disclosure group with DEFAULT fallback", "text": "Given An account in group 'GOLD' with a category balance of type '01', category 0005, and no disclosure-group record for GOLD/01/0005 but a record DEFAULT/01/0005 with rate 24.00\nWhen The batch looks up the interest rate for that balance\nThen The GOLD lookup returns not-found (status 23), the key's group is replaced by 'DEFAULT', and the rate 24.00 is used", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBACT04C.cbl:415-460", "plain": "The interest rate is looked up by the account's group, transaction type and category; if no rate is defined for that group combination, the rate defined for the 'DEFAULT' group with the same type and category is used, and if that is also missing the batch stops.", "defect": ""}, {"key": "claude/RULE-230", "function": "claude/batch/03", "id": "RULE-230", "name": "Interest transaction generation", "text": "Given Run parameter date '2025-04-29', it is the 3rd interest transaction of the run, account 00000000001 with cross-referenced card 4111111111111111, monthly interest $19.27\nWhen The interest transaction is written\nThen A transaction is written with ID '2025-04-29000003', type '01', category '05', source 'System', description 'Int. for a/c 00000000001', amount 19.27, merchant ID 0 and blank merchant name/city/zip, card 4111111111111111, origination and processing timestamps = current system time", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBACT04C.cbl:473-515", "plain": "Each non-zero-rate interest amount is recorded as a system-generated transaction of type 01 / category 05 against the account's card, with an ID built from the run date plus a sequential counter.", "defect": ""}, {"key": "claude/RULE-231", "function": "claude/provisioning/01", "id": "RULE-231", "name": "Hard-coded branch and region for all exported records", "text": "Given A customer whose address state is 'TX'\nWhen the customer and their accounts, cards and transactions are exported\nThen every one of those records has EXPORT-BRANCH-ID '0001' and EXPORT-REGION-CODE 'NORTH'", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBEXPORT.cbl:278-279", "plain": "Every exported record, whatever its type or the customer's address, is assigned to branch '0001' in region 'NORTH'.", "defect": ""}, {"key": "claude/RULE-232", "function": "claude/provisioning/02", "id": "RULE-232", "name": "Fail-fast abend on any target-file open, read or write failure (no rollback)", "text": "Given An export file of 10,000 records where the account write for record 5,001 fails with status '34' (out of space)\nWhen The import reaches that record\nThen The program shows the error and status, calls CEE3ABD to abend, and stops. Records 1-5,000 remain in the target files and no statistics are reported", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBIMPORT.cbl:312-320", "plain": "If any input or target file cannot be opened, or a read or a customer/account/xref/transaction/card write fails, the whole import stops at once with an abend. Records already written stay in the output files.", "defect": ""}, {"key": "claude/RULE-233", "function": "claude/batch/04", "id": "RULE-233", "name": "One statement per card cross-reference record, enriched with its customer and account", "text": "Given The xref file has cards C1 and C2 both linked to account 00000000011 and customer 000000001\nWhen The statement batch runs\nThen Two separate statements are produced, one per card, each showing the same account ID, current balance and FICO score, but each listing only its own card's transactions", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBSTM03A.CBL:316-329", "plain": "The run produces one statement (text and HTML) for every record on the card cross-reference file, using the xref's customer ID to fetch the customer and its account ID to fetch the account.", "defect": ""}, {"key": "claude/RULE-234", "function": "claude/batch/04", "id": "RULE-234", "name": "Statement file access dispatch and permitted operations per file", "text": "Given The caller passes file name 'TRNXFILE' with operation 'R'\nWhen The subroutine is called\nThen The next transaction record in key order (card number 16 chars + transaction id 16 chars) is returned in the 1000-byte data area. Passing 'K' for TRNXFILE does nothing. Passing 'R' for CUSTFILE or ACCTFILE also does nothing. A file name such as 'XYZFILE' returns at once and leaves the return code unchanged.", "program": "CBSTM03B", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001", "REQ-F-014", "REQ-F-015"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBSTM03B.CBL:116-229", "plain": "The statement subroutine gives the statement-creation program read-only access to four files. Transactions and card cross-references can only be read one after another in sequence. Customers and accounts can only be looked up by key. Any other file name is ignored.", "defect": "Unsupported operations, including the declared but unimplemented W/Z, and unknown file names do not return an error code. A caller may read a stale '00' status as success."}, {"key": "claude/RULE-235", "function": "claude/batch/01", "id": "RULE-235", "name": "Abend the batch on any file open, read or close failure", "text": "Given The account file returns status '35' (file not found) on open\nWhen 0400-ACCTFILE-OPEN runs\nThen 'ERROR OPENING ACCOUNT FILE' and 'FILE STATUS IS: NNNN0035' are reported and the program abends immediately with code 999 via CEE3ABD", "program": "CBTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CBTRN01C.cbl:469-473", "plain": "If any of the six files fails to open, the daily file fails to read with anything other than OK or end-of-file, or any file fails to close, the whole run stops with abend code 999 instead of skipping the record.", "defect": "9000-DALYTRAN-CLOSE (lines 372-373) uses the customer file's message and status, so a failure closing the daily file is reported against the wrong file."}, {"key": "claude/RULE-236", "function": "claude/batch/05", "id": "RULE-236", "name": "Page break every 20 report lines with page subtotal", "text": "Given Page size is 20 and the report line counter is 20\nWhen the next detail line is about to be written\nThen a page-total line and separator are written (counter 22), headers are written again (counter 26), the page total is added to the grand total and reset, and the detail line follows", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CBTRN03C.cbl:282-285", "plain": "Before each detail line, if the report line count is an exact multiple of the 20-line page size, the page total and a separator are printed and the page headers are printed again.", "defect": "An exact-modulo check on a counter that can rise by 2 at a time (account totals) can miss page breaks, so some pages run longer than 20 lines."}, {"key": "claude/RULE-237", "function": "claude/account/02", "id": "RULE-237", "name": "Editable versus protected fields", "text": "Given An account is loaded and in stage S\nWhen The screen is shown\nThen Customer ID and country are protected and all other fields can be edited", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:2986-3005", "plain": "Before an account is loaded only the account number can be edited. After loading, every account and customer field can be edited except customer ID and country. While waiting for confirmation, or after saving, nothing can be edited.", "defect": ""}, {"key": "claude/RULE-238", "function": "claude/account/02", "id": "RULE-238", "name": "Function key eligibility by stage", "text": "Given Account details are loaded and the stage is E (changes have errors)\nWhen The user presses F5\nThen The key is treated as invalid and handled as Enter, so the edits are run again and nothing is saved", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-044", "REQ-F-045", "REQ-F-046", "REQ-F-047", "REQ-F-048"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:905-916", "plain": "F5 (save) only works after the changes have been validated, F12 (cancel) only works once an account is loaded, and any other key counts as Enter.", "defect": ""}, {"key": "claude/RULE-239", "function": "claude/account/01", "id": "RULE-239", "name": "Account fields shown when either the account or the customer was found", "text": "Given An account lookup in which the account master read failed but the customer read succeeded\nWhen The screen is built\nThen Account fields are filled from an account record buffer that was never read successfully (initialized or stale values), and the customer fields are filled from the customer record", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-F-015"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COACTVWC.cbl:460-535", "plain": "The account section of the screen (status, current balance, credit limit, cash credit limit, current-cycle credit/debit, open/expiry/reissue dates, group id) is filled when the account OR the customer record was found. The customer section (id, SSN, FICO, DOB, name, address, phones, government id, EFT account, primary-holder flag) is filled only when the customer was found.", "defect": "Using OR means account data can show even though the account read failed. The condition probably should be FOUND-ACCT-IN-MASTER alone."}, {"key": "claude/RULE-240", "function": "claude/account/01", "id": "RULE-240", "name": "Customer SSN displayed in full with NNN-NN-NNNN formatting", "text": "Given Customer record with SSN 123456789\nWhen The account view screen is displayed\nThen The SSN field shows '123-45-6789'. The FICO score (3 digits) and DOB are shown unmasked as well", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COACTVWC.cbl:493-507", "plain": "The customer's 9-digit SSN is shown on the Account View screen in full, formatted as 3-2-4 digits with hyphens. It is not masked.", "defect": "Full SSN and other PII are shown to any user who can run the view. The target system may need masking (e.g. ***-**-6789) or role-based access."}, {"key": "claude/RULE-241", "function": "claude/account/01", "id": "RULE-241", "name": "Account view lookup chain: card cross-reference, then account master, then customer master", "text": "Given Account id 00000000001 passed validation\nWhen The account view lookup runs (9000-READ-ACCT)\nThen Read CXACAIX by account id -> CDEMO-CUST-ID and CDEMO-CARD-NUM are set from the xref record; read ACCTDAT by the same account id -> account found flag set; read CUSTDAT by the xref customer id -> customer found flag set; account and customer details are then shown with info message cleared", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-011"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COACTVWC.cbl:687-772", "plain": "A valid account number is first resolved through the card cross-reference (by account alternate index) to get the owning customer id and card number; the account master is then read by account id, and the customer master by the customer id taken from the cross-reference.", "defect": "Only one cross-reference record is read for an account. If an account has several cards or customers, which customer appears depends on the order of the alternate index."}, {"key": "claude/RULE-242", "function": "claude/signon/03", "id": "RULE-242", "name": "Admin Menu option catalogue", "text": "Given The admin option table in COADM02Y\nWhen The admin menu is displayed\nThen These options are listed: 1 User List (COUSR00C), 2 User Add (COUSR01C), 3 User Update (COUSR02C), 4 User Delete (COUSR03C), 5 Transaction Type List/Update (Db2) (COTRTLIC), 6 Transaction Type Maintenance (Db2) (COTRTUPC).", "program": "COADM01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-003"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COADM01C.cbl:229-266", "plain": "The Admin Menu offers 6 fixed security and reference-data functions, each tied to a target program.", "defect": ""}, {"key": "claude/RULE-243", "function": "claude/transactions/01", "id": "RULE-243", "name": "Bill payment transaction record standard attributes", "text": "Given A confirmed payment for account 00000000001 whose XREF card number is 4111111111111111, at 2026-11-23 10:15:30\nWhen The transaction record is built\nThen TRAN-TYPE-CD='02', TRAN-CAT-CD=2, TRAN-SOURCE='POS TERM', TRAN-DESC='BILL PAYMENT - ONLINE', TRAN-CARD-NUM=4111111111111111, MERCHANT-ID=999999999, MERCHANT-NAME='BILL PAYMENT', CITY='N/A', ZIP='N/A', ORIG-TS=PROC-TS='2026-11-23 10:15:30.000000'", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010", "REQ-F-011"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COBIL00C.cbl:218-233", "plain": "Every online bill payment is recorded as transaction type 02, category 2, source 'POS TERM', description 'BILL PAYMENT - ONLINE', against the account's cross-referenced card, with a fixed dummy merchant and the current timestamp as both origination and processing time.", "defect": ""}, {"key": "claude/RULE-244", "function": "claude/card/01", "id": "RULE-244", "name": "Record filter by account and card number", "text": "Given Account filter = 00000000005 (valid) and the card filter is blank\nWhen The card file is browsed\nThen Only cards with CARD-ACCT-ID = 00000000005 fill the 7 screen rows. Other cards are skipped and do not count toward the page.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:1382-1411", "plain": "A card is shown only if it matches every valid filter entered: same account ID when an account filter is given, and same card number when a card filter is given.", "defect": ""}, {"key": "claude/RULE-245", "function": "claude/card/03", "id": "RULE-245", "name": "Save requires explicit PF5 confirmation; only certain keys are honored per state", "text": "Given State 'show details' (changes not yet validated)\nWhen The operator presses PF5\nThen PF5 is treated as Enter (re-validates), no write occurs. In state N, PF5 triggers the save. PF3 always exits.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-021", "REQ-F-023", "REQ-F-024", "REQ-F-032"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:413-424", "plain": "PF5 (save) is only accepted when changes have been validated and await confirmation, PF12 (cancel) only once card details have been fetched, and any other key is treated as Enter.", "defect": ""}, {"key": "claude/RULE-246", "function": "claude/signon/02", "id": "RULE-246", "name": "Main Menu option catalogue and required roles", "text": "Given The option table in COMEN02Y\nWhen The menu is displayed\nThen These options are listed: 1 Account View (COACTVWC), 2 Account Update (COACTUPC), 3 Credit Card List (COCRDLIC), 4 Credit Card View (COCRDSLC), 5 Credit Card Update (COCRDUPC), 6 Transaction List (COTRN00C), 7 Transaction View (COTRN01C), 8 Transaction Add (COTRN02C), 9 Transaction Reports (CORPT00C), 10 Bill Payment (COBIL00C), 11 Pending Authorization View (COPAUS0C). All are flagged 'U'.", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:262-303", "plain": "The Main Menu offers a fixed list of 11 functions, each tied to a target program and the user type allowed to use it, and shows each one as 'NN. Name'.", "defect": ""}, {"key": "claude/RULE-247", "function": "claude/transactions/04", "id": "RULE-247", "name": "Explicit print confirmation required before job submission", "text": "Given User selected Yearly report with confirm field blank\nWhen Enter is pressed\nThen Message 'Please confirm to print the Yearly report...' shown, cursor on confirm; on resubmit with 'Y' or 'y' the job is submitted; with 'N'/'n' all fields are cleared and nothing is submitted; with 'X' error '\"X\" is not a valid value to confirm...'", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/CORPT00C.cbl:464-494", "plain": "A report job is only submitted when the user types Y in the confirm field; N cancels and clears the screen, blank prompts for confirmation, anything else is rejected.", "defect": ""}, {"key": "claude/RULE-248", "function": "claude/signon/01", "id": "RULE-248", "name": "Role-based routing after successful sign-on", "text": "Given A successfully authenticated user\nWhen SEC-USR-TYPE = 'A'\nThen Control transfers to COADM01C; otherwise (including 'U' or any unexpected value) control transfers to COMEN01C", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-010"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:223-240", "plain": "After a successful sign-on, users whose security record type is 'A' (Admin) are sent to the Admin menu (COADM01C); every other user type is sent to the regular user main menu (COMEN01C).", "defect": ""}, {"key": "claude/RULE-249", "function": "claude/useradmin/01", "id": "RULE-249", "name": "No admin-role check inside the user list program", "text": "Given A session commarea is present whose user type is regular user ('U'), not admin\nWhen Transaction CU00 runs with that commarea\nThen The full user list (IDs, names, types) is shown and Update/Delete routing is allowed. This program checks no role", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-002"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COUSR00C.cbl:110-139", "plain": "This program does not check that the caller is an administrator; it relies on being reached only from the admin menu (COADM01C).", "defect": "No in-program authorization. Any session that can start CU00 with a commarea can list users and get to the update and delete screens."}, {"key": "claude/RULE-250", "function": "claude/useradmin/01", "id": "RULE-250", "name": "User list requires an active session, otherwise route to sign-on", "text": "Given The user list transaction CU00 starts with no communication area (EIBCALEN = 0), for example typed straight at a terminal\nWhen The program starts\nThen Control passes to sign-on program COSGN00C with from-tranid CU00, from-program COUSR00C and program context reset to 0. When context is present on first entry, the program marks it as re-entered, clears the screen and shows the first page of users", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001", "REQ-F-029", "REQ-F-030"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COUSR00C.cbl:110-139", "plain": "The user list screen only works when called with session context; with no context the person goes back to the sign-on screen.", "defect": ""}, {"key": "claude/RULE-251", "function": "claude/useradmin/03", "id": "RULE-251", "name": "Function-key navigation and save semantics on the Update User screen", "text": "Given An administrator has edited a user's last name on the Update User screen, which was reached from the user list\nWhen They press PF3\nThen The update is attempted and control returns to the calling program (the user list); pressing PF12 instead would discard the change and go to the Admin Menu (COADM01C)", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "app/cbl/COUSR02C.cbl:108-131", "plain": "Enter looks up a user, PF5 saves, PF3 saves and then exits to the calling screen (or Admin Menu), PF4 clears the screen, PF12 exits to the Admin Menu without saving, and any other key is rejected as invalid.", "defect": "PF3 transfers control after UPDATE-USER-INFO regardless of the error flag, so a failed or rejected save silently exits without informing the administrator."}, {"key": "claude/RULE-252", "function": "claude/useradmin/02", "id": "RULE-252", "name": "User add and delete screens have no authorization check of their own", "text": "Given A session reaches transaction CU03 (or CU01) with a COMMAREA whose user type is 'U' (regular)\nWhen The user enters a User ID and presses PF5\nThen The delete goes ahead. Neither program checks CDEMO-USER-TYPE or compares the target ID with the signed-on user ID", "program": "COUSR03C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-002", "REQ-N-001", "REQ-N-002"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COUSR03C.cbl:90-132", "plain": "The add-user and delete-user programs require only an active session (a COMMAREA passed in); they do not check that the caller is an administrator or prevent an admin from deleting their own account.", "defect": "Admin-only access is enforced only by menu navigation. Nothing in these programs blocks a direct transaction start with a valid COMMAREA."}, {"key": "claude/RULE-253", "function": "claude/common/02", "id": "RULE-253", "name": "Date validation outcome reported as the program return code", "text": "Given A date check that comes back with CEEDAYS severity 3\nWhen CSUTLDTC returns to its caller\nThen RETURN-CODE is 3 and LS-RESULT(1:4) is '0003'. A valid date gives RETURN-CODE 0 and '0000'.", "program": "CSUTLDTC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "app/cbl/CSUTLDTC.cbl:88-100", "plain": "The severity of the date check goes into the program's return code as well as the result text, so callers can test either one.", "defect": "Line 122 moves the whole WS-DATE-TO-TEST group (binary length prefix plus text) into WS-DATE X(10). The echoed date is therefore shifted by 2 bytes and starts with binary length bytes rather than the date text."}, {"key": "claude/RULE-254", "function": "claude/pendauth/04", "id": "RULE-254", "name": "Purge batch checkpoint frequency", "text": "Given Checkpoint frequency parameter blank and display frequency blank\nWhen the 6th summary since the last checkpoint has been processed\nThen a checkpoint 'RMAD' is taken; a progress message is displayed every 10th successful checkpoint; a final checkpoint is always taken at end", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-003", "REQ-N-004", "REQ-N-005", "REQ-N-006"], "priority": "P2", "category": "Policy", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:160-164", "plain": "The purge job commits its work (IMS checkpoint) after more than a configured number of account summaries have been processed, and at end of run.", "defect": ""}, {"key": "claude/RULE-255", "function": "claude/pendauth/01", "id": "RULE-255", "name": "Reply message delivery policy", "text": "Given A request with correlation ID X and reply-to queue R\nWhen The response is sent\nThen A reply is put to R with correlation ID X, non-persistent, expiry 50 (tenths of a second, so 5 seconds), outside syncpoint.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-002", "REQ-F-023"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:738-766", "plain": "The decision is sent to the requester's reply-to queue as a non-persistent reply. It carries the request's correlation ID and expires after 5 seconds if not consumed.", "defect": ""}, {"key": "claude/RULE-256", "function": "claude/pendauth/02", "id": "RULE-256", "name": "IMS PSB scheduling with one retry on duplicate schedule", "text": "Given A PSB schedule returns status 'TC' (scheduled more than once)\nWhen The authorization summary is requested\nThen The program issues DLI TERM and schedules again. If the second attempt is OK the read goes ahead. Otherwise the error flag is set and the message is 'System error while scheduling PSB: Code:xx'.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-003", "REQ-N-004", "REQ-N-005"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:1001-1031", "plain": "Before reading pending authorization data, the program schedules the PSB (PSBPAUTB). If it is already scheduled, it terminates and reschedules once, and any other failure is reported as a system error. Work is committed before each screen send.", "defect": ""}, {"key": "claude/RULE-257", "function": "claude/txntype/03", "id": "RULE-257", "name": "Exit with F3 returns to the calling program or the admin menu", "text": "Given The update screen was opened directly with no calling program recorded\nWhen The user presses F3\nThen The system issues SYNCPOINT and transfers control to COADM01C (transaction CA00) as an admin user", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-037", "REQ-F-038"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:429-460", "plain": "F3 commits any open work and returns to the program that called this screen, or to the admin menu if there was no caller.", "defect": ""}, {"key": "claude/RULE-258", "function": "claude/mqinquiry/03", "id": "RULE-258", "name": "Error reporting record format", "text": "Given An MQGET fails with condition 2, reason 2016 on input queue Q1\nWhen The error handler runs\nThen A 1000-byte MQSTR message is put to CARD.DEMO.ERROR under syncpoint with layout para(25) + msg 'INP MQGET ERR:'(25) + cond 02 + reason 02016 + queue name(48), separated by 2 spaces", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-N-002", "REQ-F-013"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:501-536", "plain": "Technical failures are reported as a fixed-layout text record on CARD.DEMO.ERROR containing the failing step, a short message, condition code, reason code and queue name; if the error queue itself cannot be written, the record is only displayed and the program ends.", "defect": ""}, {"key": "claude/RULE-259", "function": "claude/common/03", "id": "RULE-259", "name": "Batch wait interval in centiseconds", "text": "Given COBSWAIT reads SYSIN value '00000500'\nWhen MVSWAIT is called with that binary value\nThen The job waits 500 centiseconds (5 seconds) and then returns with return code 0", "program": "MVSWAIT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002"], "priority": "P2", "category": "Policy", "confidence": "Medium", "source": "app/asm/MVSWAIT.asm:19-27", "plain": "A batch step can pause for a set time. The delay is read from SYSIN (in centiseconds) by COBSWAIT and passed to MVSWAIT, which starts an interval timer for that long before returning.", "defect": "The input is never validated. An 8-byte alphanumeric value is moved straight into an unsigned binary field, so input that is not zero-padded digits can produce a wrong wait time or an abend. Also, the header comment says the wait comes from 'PARM', but the code reads it from SYSIN."}, {"key": "claude/RULE-260", "function": "claude/provisioning/04", "id": "RULE-260", "name": "Card master full-file sequential listing", "text": "Given A card master file (indexed by 16-character card number) holding 3 cards: 4000000000000001, 4000000000000002, 4000000000000003\nWhen The CBACT02C batch job (driven by READCARD) runs\nThen The job log shows START banner, the 3 full 150-byte card records in ascending card-number order (each once), then END banner", "program": "CBACT02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBACT02C.cbl:70-87", "plain": "The card listing utility reads every record in the card master file in card-number order and prints each card record exactly once, with no filtering or selection.", "defect": ""}, {"key": "claude/RULE-261", "function": "claude/provisioning/04", "id": "RULE-261", "name": "Card cross-reference full-file listing (duplicated output)", "text": "Given A cross-reference file (keyed by 16-character card number, 50-byte records) with 2 records\nWhen The CBACT03C batch job (driven by READXREF) runs\nThen The job log shows 4 record lines: each cross-reference record printed once by the read routine (line 96) and once more by the main loop (line 78)", "program": "CBACT03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBACT03C.cbl:74-96", "plain": "The cross-reference listing utility reads every card-to-account/customer cross-reference record in card-number order and prints it, but the current code prints each record twice.", "defect": "Each record is DISPLAYed twice (1000-XREFFILE-GET-NEXT line 96 and main loop line 78). CBACT02C has the equivalent line commented out, which suggests the duplicate is unintended."}, {"key": "claude/RULE-262", "function": "claude/provisioning/04", "id": "RULE-262", "name": "Customer master full-file listing (duplicated output)", "text": "Given A customer master file (keyed by 9-digit numeric customer ID, 500-byte records) with customers 000000001 and 000000002\nWhen The CBCUS01C batch job (driven by READCUST) runs\nThen The job log shows 4 customer lines: each record printed once in the read routine (line 96) and again by the main loop (line 78)", "program": "CBCUS01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBCUS01C.cbl:74-96", "plain": "The customer listing utility reads every customer record in customer-ID order and prints it, but the current code prints each customer twice.", "defect": "Duplicate DISPLAY of CUSTOMER-RECORD (lines 78 and 96). Also full customer records are printed unmasked to SYSOUT, which could expose PII."}, {"key": "claude/RULE-263", "function": "claude/batch/04", "id": "RULE-263", "name": "Statement content and customer name/address composition", "text": "Given Customer John Q Public, address line 3 'Seattle', state WA, country USA, ZIP 98101, balance 1250.00, FICO 720\nWhen The statement header is built\nThen Name line 'John Q Public', address line 3 'Seattle WA USA 98101', 'Current Balance : 000001250.00', 'FICO Score : 720'", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBSTM03A.CBL:458-504", "plain": "Each statement shows the customer's name (first, middle, last), three address lines (line 3 = city/line-3, state, country, ZIP), account ID, current balance, FICO score, then a transaction list (ID, description, amount), in both an 80-column text file and an HTML file branded with a fixed bank name and address.", "defect": "STRING ... DELIMITED BY ' ' truncates multi-word first/middle/last names and multi-word city names at the first space; transaction descriptions longer than 49 characters are cut off."}, {"key": "claude/RULE-264", "function": "claude/batch/05", "id": "RULE-264", "name": "Transaction detail line content and header", "text": "Given Transaction T1 on a card linked to account 00000000011, with type 01 'Purchase' and category 0001\nWhen its detail line is written\nThen the line shows T1, 00000000011, 01-Purchase, 0001-<category description>, the source and the amount edited as -ZZZ,ZZZ,ZZZ.ZZ", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/CBTRN03C.cbl:361-374", "plain": "Each detail line shows the transaction ID, the account ID from the card cross-reference, the type code and description, the category code and description, the source and the amount. The report header with the date range prints before the first detail line.", "defect": ""}, {"key": "claude/RULE-265", "function": "claude/account/01", "id": "RULE-265", "name": "First error message wins", "text": "Given An earlier step has already put a message in the return-message area\nWhen A later validation or not-found condition occurs\nThen The original message is kept. Unexpected file errors (RESP other than NORMAL/NOTFND) are the exception: they always overwrite with 'File Error: READ on <file> returned RESP ...'", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/COACTVWC.cbl:657-674", "plain": "Once an error message is set during a request, later checks do not overwrite it, so the user sees the first problem found.", "defect": ""}, {"key": "claude/RULE-266", "function": "claude/transactions/01", "id": "RULE-266", "name": "Bill pay screen navigation and entry conditions", "text": "Given A user arrives from the main menu with a pre-selected value in CDEMO-CB00-TRN-SELECTED\nWhen The program is entered for the first time\nThen The selected value is placed in the Account ID field and processed as if Enter were pressed (balance preview)", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-020", "REQ-F-021", "REQ-F-022", "REQ-F-023"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/COBIL00C.cbl:107-144", "plain": "The bill pay screen requires an active session (otherwise goes to sign-on), auto-loads an account passed from a prior selection, and supports Enter (process), PF3 (return to caller or main menu), PF4 (clear); any other key is rejected.", "defect": ""}, {"key": "claude/RULE-267", "function": "claude/card/03", "id": "RULE-267", "name": "Editable fields depend on workflow state (expiry day never editable)", "text": "Given State S or E\nWhen The screen is displayed\nThen Account and card fields are protected; name, status, expiry month, year are unprotected; in states N and C all fields are protected.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-011"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:1168-1208", "plain": "Only search keys are editable before a fetch; once details are shown only name, status, expiry month and year are editable; after validation everything is locked; expiry day is never offered for edit.", "defect": ""}, {"key": "claude/RULE-268", "function": "claude/transactions/02", "id": "RULE-268", "name": "Transaction file browse outcome handling", "text": "Given A browse of the TRANSACT file\nWhen Start-browse returns NOTFND, read-next or read-previous returns ENDFILE, or any other response is returned\nThen NOTFND: end-of-file flag set, 'You are at the top of the page...' shown. ENDFILE forward: 'You have reached the bottom of the page...' shown. ENDFILE backward: 'You have reached the top of the page...' shown. Any other response: error flag set and 'Unable to lookup transaction...' shown.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:602-687", "plain": "When the transaction file browse runs out of records or the key is not found, the user gets a top or bottom-of-list notice. Any other file error stops the listing with 'Unable to lookup transaction...'.", "defect": ""}, {"key": "claude/RULE-269", "function": "claude/transactions/03", "id": "RULE-269", "name": "PF5 copies the most recent transaction on file as a template", "text": "Given Operator enters card 4111111111111111 and presses PF5\nWhen The last transaction on file belongs to a different card\nThen Type, category, source, amount, description, dates and merchant fields are copied from that last transaction (regardless of card), and the normal validation/confirmation flow runs against the entered card", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-023", "REQ-F-024", "REQ-F-025"], "priority": "P2", "category": "Policy", "confidence": "Medium", "source": "app/cbl/COTRN02C.cbl:471-495", "plain": "Pressing PF5 validates the entered account/card and then pre-fills all transaction detail fields from the last transaction in the file, then runs the normal add process.", "defect": "The 'last transaction' is the last in the whole file, not the last for the entered card/account, despite the operator having entered a card/account first."}, {"key": "claude/RULE-270", "function": "claude/useradmin/02", "id": "RULE-270", "name": "User administration screen navigation keys", "text": "Given An administrator is on the Delete User screen, reached from the user list program\nWhen PF3 is pressed\nThen Control returns to the calling program (CDEMO-FROM-PROGRAM), or to admin menu COADM01C if no caller is recorded. On the Add User screen, PF3 always returns to COADM01C", "program": "COUSR01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "app/cbl/COUSR ount/02", "rule": "RULE-088"}, {"key": "claude/account/02/OQ-003", "code": "OQ-003", "text": "P0 panel doubts spec fidelity: P0 is justified. 2000-DECIDE-ACTION (COACTUPC.cbl:2562-2642) is the gate that decides when account and customer master records get rewritten. It requires F5 confirmation before 9600-WRITE-PROCESSING and handles lock failures, rewrite failures and the \"record changed by someone else\" check (DATA-WAS-CHANGED-BEFORE-UPDATE). This rule protects the integrity of the mast\u2026", "owner": "Business analyst", "unverified": false, "capability": "claude/account/02#5", "function": "claude/account/02", "rule": "RULE-144"}, {"key": "claude/card/01/OQ-001", "code": "OQ-001", "text": "Should non-admin users see only cards for their own account, as the program header says? If so, where is that restriction meant to be enforced, given that COCRDLIC never checks the user type?", "owner": "Security and compliance officer", "unverified": false, "capability": "claude/card/01#1", "function": "claude/card/01", "rule": "RULE-210"}, {"key": "claude/card/01/OQ-002", "code": "OQ-002", "text": "Should 'next page exists' consider only records that match the active filters, and how should paging behave past page 9, given the one-digit page counter?", "owner": "Card operations business owner", "unverified": false, "capability": "claude/card/01#2", "function": "claude/card/01", "rule": "RULE-031"}, {"key": "claude/card/01/OQ-003", "code": "OQ-003", "text": "After a selection error, should the user see the same page they were on? Today the browse restarts from the first matching card.", "owner": "Card operations business owner", "unverified": false, "capability": "claude/card/01#3", "function": "claude/card/01", "rule": "RULE-197"}, {"key": "claude/card/01/OQ-004", "code": "OQ-004", "text": "Line 790 has a stray 'I' after MOVE DFHBMPRO TO CRDSEL4A, which makes it also move the attribute into subscript I. Is that intended, and was the different attribute for row 1 (DFHBMPRF) /provisioning/01", "rule": "RULE-007"}, {"key": "claude/provisioning/01/OQ-003", "code": "OQ-003", "text": "Is every branch-migration export meant to target branch 0001 / region NORTH? Or should branch and region come from run parameters or from customer/account attributes (such as state or ACCT-GROUP-ID)?", "owner": "Branch operations manager", "unverified": false, "capability": "claude/provisioning/01#2", "function": "claude/provisioning/01", "rule": "RULE-231"}, {"key": "claude/provisioning/01/OQ-004", "code": "OQ-004", "text": "Does the downstream import program expect these mixed encodings exactly (for example credit limit zoned but balance packed, cycle debit binary)? Is the inconsistency intended, or should all monetary fields share one format?", "owner": "Data migration lead", "unverified": false, "capability": "claude/provisioning/01#3", "function": "claude/provisioning/01", "rule": "RULE-024"}, {"key": "claude/provisioning/02/OQ-001", "code": "OQ-001", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Data migration lead", "unverified": false, "capability": "claude/provisioning/02#1", "function": "claude/provisioning/02", "rule": "RULE-206"}, {"key": "claude/provisioning/02/OQ-002", "code": "OQ-002", "text": "Should the target system enforce integrity checks during branch-migration import (checksums, links such as xref to existing account and customer, FICO range 300-850, date formats, duplicate keys)? Or is verbatim pass-through the intended contract, with validation done downstream?", "owner": "Data migration lead", "unverified": false, "capability": "claude/provisioning/02#2", "function": "claude/provisioning/02", "rule": "RULE-051"}, {"key": "claude/provisioning/03/OQ-001", "code": "OQ-001", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Batch operations lead", "unverified": false, "capability": "claude/provisioning/03#1", "function": "claude/provisioning/03", "rule": "RULE-142"}, {"key": "claude/provisioning/03/OQ-002", "code": "OQ-002", "text": "Is the 2,525.00 substitution a deliberate test-data rule, and should non-zero cycle debits be copied to the extract as-is (that is, should an ELSE branch be added)?", "owner": "Account operations SME", "unverified": false, "capability": "claude/provisioning/03#2", "function": "claude/provisioning/03", "rule": "RULE-022"}, {"key": "claude/provisioning/03/OQ-003", "code": "OQ-003", "text": "Does any downstream process consume the ARRYFILE output as real data, or is it only a test fixture for array and COMP-3 handling?", "owner": "Account operations SME", "unverified": false, "capability": "claude/provisioning/03#3", "function": "claude/provisioning/03", "rule": "RULE-041"}, {"key": "claude/txntype/01/OQ-001", "code": "OQ-001", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business subject-matter expert", "unverified": false, "capability": "claude/txntype/01#1", "function": "claude/txntype/01", "rule": "RULE-048"}, {"key": "claude/txntype/01/OQ-002", "code": "OQ-002", "text": "Do DB2 referential-integrity constraints stop a transaction type from being deleted while transaction categories or transactions still reference it, or is deleting a type that is in use allowed?", "owner": "Database administrator", "unverified": false, "capability": "claude/txntype/01#4", "function": "claude/txntype/01", "rule": "RULE-158"}, {"key": "claude/txntype/01/OQ-003", "code": "OQ-003", "
