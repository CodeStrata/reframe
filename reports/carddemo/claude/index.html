td><\/tr><tr><td>P-CHKP-FREQ<\/td><td>PIC X(05)<\/td><td>line 101<\/td><\/tr><tr><td>P-CHKP-DIS-FREQ<\/td><td>PIC X(05)<\/td><td>line 103<\/td><\/tr><tr><td>P-DEBUG-FLAG<\/td><td>PIC X(01)<\/td><td>line 105<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Purge run parameter defaults, Pending authorization expiry (purge eligibility)<\/p><h3>WS-ACCT-RESPONSE (MQ account inquiry reply)<\/h3><p>Source: <code>legacy/aws-carddemo/app/app-vsam-mq/cbl/COACCT01.cbl:130<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>WS-ACCT-ID<\/td><td>PIC 9(11)<\/td><td>line 134, preceded by label literal<\/td><\/tr><tr><td>WS-ACCT-ACTIVE-STATUS<\/td><td>PIC X(01)<\/td><td>line 137<\/td><\/tr><tr><td>WS-ACCT-CURR-BAL / CREDIT-LIMIT / CASH-CREDIT-LIMIT<\/td><td>PIC S9(10)V99<\/td><td>lines 140-148<\/td><\/tr><tr><td>WS-ACCT-OPEN-DATE / EXPIRAION-DATE / REISSUE-DATE<\/td><td>PIC X(10)<\/td><td>lines 152-158<\/td><\/tr><tr><td>WS-ACCT-CURR-CYC-CREDIT / -DEBIT<\/td><td>PIC S9(10)V99<\/td><td>lines 161-165<\/td><\/tr><tr><td>WS-ACCT-GROUP-ID<\/td><td>PIC X(10)<\/td><td>line 169. Each value interleaved with a fixed text label field<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Account inquiry request eligibility (function code and account key), Account inquiry lookup and reply content, Reply routing and correlation<\/p>", "sections": [{"title": "Assessment: summary", "html": "<h2>Assessment: aws-carddemo<\/h2>\n<p>Assessed 2026-11-23 from the read-only snapshot at <code>legacy/aws-carddemo<\/code> (a directory, not a symlink; SHA-256 <code>d9a77d54\u2026402541a<\/code>). Analysis only: nothing in the source was changed. Paths below are relative to <code>legacy/aws-carddemo/<\/code>.<\/p>", "open": true}, {"title": "Assessment: Executive Summary", "html": "<p>CardDemo is an IBM z/OS credit-card management application: CICS/BMS online screens for sign-on, accounts, cards, transactions, bill pay and user admin; a nightly batch cycle for posting, interest, statements and reports over VSAM; and three optional sub-apps using IMS DB, Db2 and IBM MQ. It is <strong>42.7 KSLOC<\/strong> of mainframe source (44 COBOL programs, 62 copybooks, 21 BMS maps, 61 JCL/PROC members), with <strong>no automated tests<\/strong> and no CI. Risk is <strong>high on security and moderate on structure<\/strong>. Security risks: any ordinary user can rewrite any account's balance and credit limit, passwords are stored in clear and shared by all seeded users, Db2 grants <code>DBADM<\/code> to PUBLIC, and CVVs are stored and exported. Structurally, the code splits cleanly into 10 domains over well-defined VSAM files, but complexity is concentrated in a few god programs (<code>COACTUPC<\/code> alone is 3.4k code lines). Recommendation: <strong>Refactor<\/strong>, a piece-by-piece rewrite through <code>/code-modernization:modernize-transform<\/code>, starting with the batch cycle. Treat the authorization model as a deliberate redesign, not a port. Harden first if the system will keep running while it is modernized.<\/p>", "open": false}, {"title": "Assessment: System Inventory", "html": "<p>Tool: <code>scc<\/code> and <code>cloc<\/code> are not installed, so lines were counted with a Python walk (<code>find<\/code> + <code>wc<\/code> equivalent). Code lines exclude blank lines and fixed-format comment lines (column 7 <code><em><\/code>/<code>/<\/code>, JCL <code>//<\/em><\/code>). Complexity is measured as COBOL decision keywords (<code>IF<\/code>/<code>EVALUATE<\/code>/<code>PERFORM<\/code>/<code>WHEN<\/code>/<code>UNTIL<\/code>/<code>GO TO<\/code>).<\/p>\n<div class='scroll'><table><thead><tr><th>Type<\/th><th>Files<\/th><th>Lines<\/th><th>Code lines<\/th><\/tr><\/thead><tbody><tr><td>COBOL programs (<code>.cbl<\/code>/<code>.CBL<\/code>)<\/td><td>44<\/td><td>30,175<\/td><td>23,636<\/td><\/tr><tr><td>Copybooks (<code>.cpy<\/code>)<\/td><td>62<\/td><td>10,651<\/td><td>9,589<\/td><\/tr><tr><td>BMS maps (<code>.bms<\/code>)<\/td><td>21<\/td><td>5,756<\/td><td>5,754<\/td><\/tr><tr><td>JCL (<code>.jcl<\/code>/<code>.JCL<\/code>)<\/td><td>55<\/td><td>3,388<\/td><td>1,796<\/td><\/tr><tr><td>CSD (CICS resource definitions)<\/td><td>4<\/td><td>685<\/td><td>685<\/td><\/tr><tr><td>PROCs (<code>.prc<\/code>)<\/td><td>6<\/td><td>588<\/td><td>354<\/td><\/tr><tr><td>Control cards (<code>.ctl<\/code>)<\/td><td>8<\/td><td>253<\/td><td>232<\/td><\/tr><tr><td>DCLGEN / DDL<\/td><td>3 / 6<\/td><td>192 / 53<\/td><td>191 / 53<\/td><\/tr><tr><td>IMS DBD / PSB<\/td><td>4 / 4<\/td><td>135 / 88<\/td><td>135 / 88<\/td><\/tr><tr><td>HLASM (<code>.asm<\/code> + <code>.mac<\/code>)<\/td><td>2 + 2<\/td><td>157<\/td><td>157<\/td><\/tr><tr><td><strong>Source total<\/strong><\/td><td><\/td><td><\/td><td><strong>42,670<\/strong><\/td><\/tr><tr><td>Also present<\/td><td>CA-7 and Control-M schedules, 9 shell scripts, <code>LISTCAT.txt<\/code>, 6 Markdown docs, 11 PNG diagrams, sample data (ASCII and EBCDIC), and two packaged runtimes (<code>samples/m2/*.zip<\/code>, excluded)<\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Most complex programs<\/strong> (decision keywords / code lines):<\/p>\n<div class='scroll'><table><thead><tr><th>Program<\/th><th>Keywords<\/th><th>Code lines<\/th><th>Domain<\/th><\/tr><\/thead><tbody><tr><td><code>app/cbl/COACTUPC.cbl<\/code><\/td><td>587<\/td><td>3,368<\/td><td>Account/customer update<\/td><\/tr><tr><td><code>app/app-transaction-type-db2/cbl/COTRTLIC.cbl<\/code><\/td><td>370<\/td><td>1,861<\/td><td>Transaction types (Db2)<\/td><\/tr><tr><td><code>app/app-transaction-type-db2/cbl/COTRTUPC.cbl<\/code><\/td><td>291<\/td><td>1,429<\/td><td>Transaction types (Db2)<\/td><\/tr><tr><td><code>app/cbl/COCRDUPC.cbl<\/code><\/td><td>269<\/td><td>1,195<\/td><td>Card update<\/td><\/tr><tr><td><code>app/cbl/COCRDLIC.cbl<\/code><\/td><td>233<\/td><td>1,093<\/td><td>Card list<\/td><\/tr><tr><td><code>app/cbl/COTRN02C.cbl<\/code><\/td><td>178<\/td><td>614<\/td><td>Add transaction<\/td><\/tr><tr><td><code>app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl<\/code><\/td><td>168<\/td><td>792<\/td><td>Authorizations<\/td><\/tr><tr><td><code>app/cbl/COTRN00C.cbl<\/code><\/td><td>168<\/td><td>529<\/td><td>Transaction list<\/td><\/tr><tr><td><code>app/cbl/COUSR00C.cbl<\/code><\/td><td>167<\/td><td>531<\/td><td>User list<\/td><\/tr><tr><td><code>app/cbl/CBTRN02C.cbl<\/code><\/td><td>159<\/td><td>619<\/td><td>Batch posting<\/td><\/tr><\/tbody><\/table><\/div>\n<p>COBOL totals: 4,950 decision keywords over 23.6 KSLOC, about <strong>209 per KSLOC<\/strong>.<\/p>\n<h4>Technology fingerprint<\/h4>\n<div class='scroll'><table><thead><tr><th>Area<\/th><th>Evidence<\/th><\/tr><\/thead><tbody><tr><td>Language and compiler<\/td><td>Enterprise COBOL 6.3 (<code>IGY.SIGYCOMP.V63<\/code>, <code>scripts/compile_batch.jcl.template<\/code>); HLASM (<code>app/asm/MVSWAIT.asm<\/code>, <code>app/maclib/<\/code>)<\/td><\/tr><tr><td>Online runtime<\/td><td>CICS TS 5.6 (<code>OEM.CICSTS.V05R06M0<\/code>, <code>samples/proc/BLDCIDB2.prc<\/code>); BMS maps <code>app/bms/<\/code>, symbolic maps <code>app/cpy-bms/<\/code>; resources in <code>app/csd/CARDDEMO.CSD<\/code> plus 3 sub-app CSDs<\/td><\/tr><tr><td>Batch<\/td><td>55 JCL jobs <code>app/jcl/<\/code>, PROCs <code>app/proc/<\/code>, control cards <code>app/ctl/<\/code>; schedules <code>app/scheduler/CardDemo.ca7<\/code> and <code>CardDemo.controlm<\/code><\/td><\/tr><tr><td>Data stores<\/td><td>VSAM KSDS/AIX/GDG (record layouts in <code>app/cpy/CV*.cpy<\/code>, catalog in <code>app/catlg/LISTCAT.txt<\/code>); Db2 (<code>app/app-<em>/ddl<\/code>, <code>dcl<\/code>, <code>ctl/DB2CREAT.ctl<\/code>); IMS DB 15.1 (<code>app/app-authorization-ims-db2-mq/ims/<\/em>.dbd<\/code>, <code>*.psb<\/code>)<\/td><\/tr><tr><td>Integration points<\/td><td>3270 screens (21 BMS maps); IBM MQ request/reply (<code>COPAUA0C<\/code>, <code>app/app-vsam-mq/cbl/COACCT01.cbl<\/code>, <code>CODATE01.cbl<\/code>); CICS-to-batch through the extrapartition TDQ <code>JOBS<\/code> \u2192 internal reader (<code>CORPT00C<\/code>); FTP file transfer (<code>app/jcl/FTPJCL.JCL<\/code>); export/import files (<code>CBEXPORT<\/code>/<code>CBIMPORT<\/code>)<\/td><\/tr><tr><td>Build<\/td><td>Mainframe JCL compile procs (<code>samples/proc/BUILD*.prc<\/code>, <code>samples/jcl/<em>CMP.jcl<\/code>); bespoke FTP-over-tunnel submit scripts (<code>scripts/remote_<\/em>.sh<\/code>). <code>remote_compile.sh<\/code> calls a <code>Makefile<\/code> that is not in the tree. No CI.<\/td><\/tr><tr><td>Tests<\/td><td><strong>None.<\/strong> No unit, characterization or regression tests. <code>samples/jcl/REPRTEST.jcl<\/code> and <code>SORTTEST.jcl<\/code> are utility smoke jobs. The only executable oracle is the sample data in <code>app/data/<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "Assessment: Architecture at a Glance", "html": "<p>Ten domains, with the three optional sub-apps grouped as D10. Diagram: [<code>ARCHITECTURE.mmd<\/code>](ARCHITECTURE.mmd).<\/p>\n<div class='scroll'><table><thead><tr><th>#<\/th><th>Domain<\/th><th>Key programs / files<\/th><th>Data stores<\/th><th>Depends on<\/th><\/tr><\/thead><tbody><tr><td>D1<\/td><td>Sign-on and navigation<\/td><td><code>COSGN00C<\/code>, <code>COMEN01C<\/code>, <code>COADM01C<\/code>; menu tables <code>app/cpy/COMEN02Y.cpy<\/code>, <code>COADM02Y.cpy<\/code><\/td><td>USRSEC<\/td><td>Dispatches to D2\u2013D6 and D10 (XCTL)<\/td><\/tr><tr><td>D2<\/td><td>User admin<\/td><td><code>COUSR00C<\/code>\u2013<code>COUSR03C<\/code>, <code>app/jcl/DUSRSECJ.jcl<\/code><\/td><td>USRSEC<\/td><td>D1<\/td><\/tr><tr><td>D3<\/td><td>Account and customer (online)<\/td><td><code>COACTVWC<\/code>, <code>COACTUPC<\/code><\/td><td>ACCTDAT, CUSTDAT, CCXREF/CXACAIX<\/td><td>D1<\/td><\/tr><tr><td>D4<\/td><td>Card management<\/td><td><code>COCRDLIC<\/code>, <code>COCRDSLC<\/code>, <code>COCRDUPC<\/code><\/td><td>CARDDAT, CARDAIX<\/td><td>D1<\/td><\/tr><tr><td>D5<\/td><td>Online transactions and bill pay<\/td><td><code>COTRN00C<\/code>/<code>01C<\/code>/<code>02C<\/code>, <code>COBIL00C<\/code><\/td><td>TRANSACT, ACCTDAT, CXACAIX<\/td><td>D1; shares TRANSACT with D7<\/td><\/tr><tr><td>D6<\/td><td>Reporting (online submits batch)<\/td><td><code>CORPT00C<\/code> \u2192 TDQ <code>JOBS<\/code> \u2192 <code>app/proc/TRANREPT.prc<\/code> \u2192 <code>CBTRN03C<\/code><\/td><td>TRANSACT, CARDXREF, TRANTYPE, TRANCATG, TRANREPT GDG<\/td><td>D1, D7 data, D9<\/td><\/tr><tr><td>D7<\/td><td>Batch posting and interest<\/td><td><code>CBTRN02C<\/code> (<code>POSTTRAN.jcl<\/code>), <code>CBACT04C<\/code> (<code>INTCALC.jcl<\/code>), <code>COMBTRAN.jcl<\/code>, <code>TRANBKP<\/code><\/td><td>DALYTRAN, DALYREJS, TRANSACT, ACCTDAT, CARDXREF, TCATBALF, DISCGRP, SYSTRAN<\/td><td>D9<\/td><\/tr><tr><td>D8<\/td><td>Statements<\/td><td><code>CBSTM03A<\/code> \u2192 <code>CBSTM03B<\/code>, <code>CREASTMT.JCL<\/code><\/td><td>TRANSACT, CARDXREF, ACCTDAT, CUSTDAT<\/td><td>D7 output<\/td><\/tr><tr><td>D9<\/td><td>Data provisioning and utilities<\/td><td>VSAM define/load JCL, <code>OPENFIL<\/code>/<code>CLOSEFIL<\/code>, <code>CBACT01-03C<\/code>, <code>CBCUS01C<\/code>, <code>CBEXPORT<\/code>/<code>CBIMPORT<\/code>, <code>CSUTLDTC<\/code>, <code>COBSWAIT<\/code> \u2192 <code>MVSWAIT.asm<\/code><\/td><td>All base VSAM<\/td><td>Foundation<\/td><\/tr><tr><td>D10a<\/td><td>Optional: authorizations (IMS + Db2 + MQ)<\/td><td><code>COPAUA0C<\/code>, <code>COPAUS0C<\/code>\u2013<code>2C<\/code>, <code>CBPAUP0C<\/code>, <code>PAUDB*<\/code>, <code>DBUNLDGS<\/code><\/td><td>IMS PAUT DB, Db2 AUTHFRDS, MQ, CCXREF, ACCTDAT<\/td><td>D1 (option 11), D3/D4 data<\/td><\/tr><tr><td>D10b<\/td><td>Optional: transaction types (Db2)<\/td><td><code>COTRTLIC<\/code>, <code>COTRTUPC<\/code>, <code>COBTUPDT<\/code>, <code>TRANEXTR<\/code><\/td><td>Db2 TRANSACTION_TYPE(_CATEGORY)<\/td><td>D1 (admin); feeds TRANTYPE/TRANCATG used by D6/D7<\/td><\/tr><tr><td>D10c<\/td><td>Optional: VSAM-MQ<\/td><td><code>COACCT01<\/code>, <code>CODATE01<\/code><\/td><td>ACCTDAT, MQ<\/td><td>D3 data<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The seams are good. Domains share data through VSAM files with copybook record layouts, not through shared code. Control flow is XCTL from a table-driven menu, and batch is chained by the scheduler.<\/p>\n<p><strong>Dangling references and anomalies (verified):<\/strong><\/p>\n<ul><li><code>PROGRAM(COCRDSEC)<\/code> and transaction <code>CDV1<\/code> are defined at <code>app/csd/CARDDEMO.CSD:211,390<\/code>, but no source exists.<\/li><li><code>TRANSID(CC00)<\/code> is declared on both COCRDLIC (<code>CSD:207<\/code>) and COSGN00C (<code>CSD:253<\/code>).<\/li><li><code>CBPAUP0C.cbl:156<\/code> tests <code>PA-APPROVED-AUTH-CNT &lt;= 0<\/code> twice. The second test was probably meant for the declined count.<\/li><li><code>app/jcl/CREASTMT.JCL:90<\/code> is a corrupted DD line.<\/li><li><code>CBTRN02C.cbl:256<\/code> opens <code>TRANSACT-FILE<\/code> for <code>OUTPUT<\/code> with <code>ACCESS RANDOM<\/code> against a loaded KSDS. Behaviour depends on the cluster's REUSE attribute and needs confirmation.<\/li><li>The DATEPARM data set is read by <code>TRANREPT<\/code>, but no job creates it.<\/li><li>Sub-app menu targets (<code>COPAUS0C<\/code>, <code>COTRTLIC<\/code>, <code>COTRTUPC<\/code>) are absent from the base CSD and are guarded at runtime.<\/li><\/ul>", "open": false}, {"title": "Assessment: Production Runtime Profile", "html": "<p><strong>No telemetry available.<\/strong> No APM MCP server is connected, and there are no SMF records, batch job logs or runtime exports. The snapshot has no git history, so change frequency is unknown too. Supplying batch job logs (POSTTRAN, INTCALC, CREASTMT, TRANREPT elapsed times) or CICS transaction statistics would let a later pass rank domains by wall-clock cost and variance.<\/p>", "open": false}, {"title": "Assessment: Technical Debt", "html": "<p>Top 10 by remediation value. Credential values are masked.<\/p>\n<div class='scroll'><table><thead><tr><th>#<\/th><th>Category<\/th><th>Location<\/th><th>Evidence<\/th><th>Remediation<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Hardcoded credentials<\/td><td><code>app/jcl/FTPJCL.JCL:33-35<\/code><\/td><td>FTP host <code>172.<strong><\/code>, user <code>ca<\/strong><\/code>, password <code>ft**<\/code> in clear text in SYSIN<\/td><td>Rotate the password; use a RACF-protected NETRC or SFTP keys; pass the host as a symbolic<\/td><\/tr><tr><td>2<\/td><td>Missing security control<\/td><td><code>app/cpy/CSUSR01Y.cpy:21<\/code>, <code>app/cbl/COSGN00C.cbl:135,223<\/code>, <code>COUSR01C.cbl:157<\/code><\/td><td><code>SEC-USR-PWD PIC X(08)<\/code> holds the clear password; sign-on upper-cases it, user create does not<\/td><td>Delegate to RACF (<code>EXEC CICS VERIFY PASSWORD<\/code>/<code>SIGNON<\/code>)<\/td><\/tr><tr><td>3<\/td><td>Missing error handling<\/td><td><code>app/cbl/CBTRN02C.cbl:554-559<\/code> (called from :441)<\/td><td>Account <code>REWRITE \u2026 INVALID KEY<\/code> sets a reason code after validation; the transaction is still written<\/td><td>Reject or abend on rewrite failure and skip the transaction write. Accounts and transactions can drift silently.<\/td><\/tr><tr><td>4<\/td><td>Hardcoded config<\/td><td>639 <code>AWS.M2.CARDDEMO.*<\/code> references in 41 JCL/PROCs (e.g. <code>app/jcl/POSTTRAN.jcl:25-31<\/code>); CICS region <code>CICSAWSA<\/code> in 5 JCLs (e.g. <code>CLOSEFIL.jcl:26<\/code>)<\/td><td>Fixed HLQ and APPLID<\/td><td>PROC symbolics or <code>SET<\/code> variables driven by the scheduler<\/td><\/tr><tr><td>5<\/td><td>Fragile orchestration<\/td><td><code>scripts/run_full_batch.sh:3-14,29,48,55<\/code><\/td><td>Jobs chained by <code>sleep<\/code>, not by completion codes; tunnel on <code>localhost 2121<\/code>; <code>TRANBKP<\/code> submitted twice<\/td><td>Chain jobs in the scheduler with condition codes (<code>app/scheduler/<\/code> exists)<\/td><\/tr><tr><td>6<\/td><td>Deprecated constructs<\/td><td><code>app/cbl/CBSTM03A.CBL:300-314<\/code><\/td><td><code>ALTER \u2026 TO PROCEED TO<\/code> and <code>GO TO<\/code> (15 in CBSTM03A, 13 in CBSTM03B)<\/td><td><code>EVALUATE<\/code>/<code>PERFORM<\/code>. May be a deliberate demo artefact; confirm.<\/td><\/tr><tr><td>7<\/td><td>God object<\/td><td><code>app/cbl/COACTUPC.cbl<\/code> (4,236 lines, 51 <code>GO TO<\/code>, 23\u00d7 <code>COPY CSSETATY REPLACING<\/code> at :3208-3340)<\/td><td>Screen I/O, field edits and two-file updates in one program; COTRTLIC and COCRDUPC follow the same pattern<\/td><td>Split into edit, persistence and screen modules; make field attributes table-driven<\/td><\/tr><tr><td>8<\/td><td>Duplication (batch)<\/td><td><code>9910-DISPLAY-IO-STATUS<\/code> in 6 programs, <code>9999-ABEND-PROGRAM<\/code> in 9 (e.g. <code>CBTRN02C.cbl:707-727<\/code>)<\/td><td>Same block after every I/O verb; abend code is always 999<\/td><td>Shared copybook or utility with a distinct abend code per failure<\/td><\/tr><tr><td>9<\/td><td>Duplication and unchecked RESP (online)<\/td><td><code>POPULATE-HEADER-INFO<\/code> in 14 programs; hand-coded date edits <code>CORPT00C.cbl:329-419<\/code>; <code>COSGN00C.cbl:110-115<\/code>; <code>COADM01C.cbl:78<\/code><\/td><td>RECEIVE <code>RESP<\/code> never tested; magic <code>WHEN 0<\/code>/<code>WHEN 13<\/code>; <code>HANDLE CONDITION<\/code><\/td><td>Shared header and date routines (<code>CSUTLDPY<\/code>); <code>DFHRESP()<\/code> checks<\/td><\/tr><tr><td>10<\/td><td>Dead code hiding missing error handling<\/td><td><code>app/app-authorization-ims-db2-mq/cbl/DBUNLDGS.CBL:196-209<\/code><\/td><td>OPEN status checks commented out (42 commented statements; PAUDBUNL/PAUDBLOD 14 each)<\/td><td>Restore the checks; delete the commented debug code<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Also stubs: <code>CBACT04C.cbl:518-520<\/code> (<code>1400-COMPUTE-FEES<\/code>, \"To be implemented\") and <code>COPAUA0C.cbl:647-651<\/code> (<code>5600-READ-PROFILE-DATA<\/code> is <code>CONTINUE<\/code>). The run date is hardcoded at <code>INTCALC.jcl:22<\/code>.<\/p>", "open": false}, {"title": "Assessment: Security Findings", "html": "<p>Credential inventory in <code>SECRETS.local.md<\/code> (gitignored; not for sharing). The scan was Claude-derived only (no COBOL SAST tool exists in this environment). Findings 1 and 8 were re-verified against source for this report.<\/p>\n<div class='scroll'><table><thead><tr><th>#<\/th><th>Sev<\/th><th>CWE<\/th><th>Title<\/th><th>file:line<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Critical<\/td><td>CWE-285<\/td><td>Any ordinary user can set any account's credit limit and current balance (menu option flagged <code>U<\/code>; screen values go straight to REWRITE)<\/td><td><code>app/cbl/COACTUPC.cbl:1073-1105,3964-3966<\/code>; <code>app/cpy/COMEN02Y.cpy:34-35<\/code><\/td><\/tr><tr><td>2<\/td><td>Critical<\/td><td>CWE-798 / CWE-521<\/td><td>Ten seeded accounts (five admins) share one 8-character dictionary-word default password; the README publishes the admin pair<\/td><td><code>app/jcl/DUSRSECJ.jcl:35-44<\/code>; <code>app/jcl/ESDSRRDS.jcl:36-45<\/code>; <code>app/app-transaction-type-db2/README.md:95<\/code><\/td><\/tr><tr><td>3<\/td><td>Critical<\/td><td>CWE-256<\/td><td>Passwords stored and compared in clear text<\/td><td><code>app/cpy/CSUSR01Y.cpy:21<\/code>; <code>COSGN00C.cbl:223<\/code>; <code>COUSR01C.cbl:157<\/code>; <code>COUSR02C.cbl:228<\/code><\/td><\/tr><tr><td>4<\/td><td>High<\/td><td>CWE-862 / CWE-602<\/td><td>Admin and user-maintenance programs check only <code>EIBCALEN<\/code>; role gating lives in the menu; all transactions <code>RESSEC(NO) CMDSEC(NO)<\/code><\/td><td><code>COADM01C.cbl:86<\/code>; <code>COUSR00C<\/code>\u2013<code>03C<\/code>; <code>app/csd/CARDDEMO.CSD:314-486<\/code><\/td><\/tr><tr><td>5<\/td><td>High<\/td><td>CWE-639<\/td><td>IDOR: account, card and transaction IDs typed on screen are read directly; users are not linked to customers<\/td><td><code>COACTVWC.cbl:628-632<\/code>; <code>COCRDSLC.cbl:615-626<\/code>; <code>COCRDUPC<\/code>, <code>COTRN01C<\/code>, <code>COBIL00C<\/code><\/td><\/tr><tr><td>6<\/td><td>High<\/td><td>CWE-840 / CWE-20<\/td><td>Negative authorization amounts pass the limit check and raise available credit<\/td><td><code>COPAUA0C.cbl:376-377,668,817<\/code>; <code>COTRN02C.cbl:340<\/code><\/td><\/tr><tr><td>7<\/td><td>High<\/td><td>CWE-345<\/td><td>Authorization trusts any queued message (no expiry, status or CVV check) and replies to any named reply-to queue<\/td><td><code>COPAUA0C.cbl:354-377,413,438-466,657-683<\/code><\/td><\/tr><tr><td>8<\/td><td>High<\/td><td>CWE-732 / CWE-250<\/td><td><code>GRANT DBADM ON DATABASE CARDDEMO TO PUBLIC<\/code>, plus table rights to PUBLIC, run as SYSADM<\/td><td><code>app/app-transaction-type-db2/ctl/DB2CREAT.ctl:15,52-59,72-73,103-105<\/code><\/td><\/tr><tr><td>9<\/td><td>High<\/td><td>CWE-312 (PCI DSS 3.2.1)<\/td><td>CVV kept on the card file and exported; card numbers and SSNs unencrypted<\/td><td><code>app/cpy/CVACT02Y.cpy:7<\/code>; <code>CVCUS01Y.cpy:17-18<\/code>; <code>CBEXPORT.cbl:294,537<\/code>; <code>CBIMPORT.cbl:305,409<\/code><\/td><\/tr><tr><td>10<\/td><td>High<\/td><td>CWE-798 / CWE-319<\/td><td>FTP login in JCL, sent over plain FTP<\/td><td><code>app/jcl/FTPJCL.JCL:33-35<\/code><\/td><\/tr><tr><td>11<\/td><td>Medium<\/td><td>CWE-359<\/td><td>Full SSN shown on screen<\/td><td><code>COACTVWC.cbl:497-501<\/code>; <code>COACTUPC.cbl:2829-2831,2923-2925<\/code><\/td><\/tr><tr><td>12<\/td><td>Medium<\/td><td>CWE-532<\/td><td>Card number, CVV and SSN in batch DISPLAYs and the CICS log queue CSSL<\/td><td><code>CBACT02C.cbl:78<\/code>; <code>CBCUS01C.cbl:78,96<\/code>; <code>CBTRN01C.cbl:168,181,236<\/code>; <code>COPAUA0C.cbl:428,499,638<\/code><\/td><\/tr><tr><td>13<\/td><td>Medium<\/td><td>CWE-200<\/td><td>Stored password sent to the terminal in a dark field<\/td><td><code>COUSR02C.cbl:169<\/code>; <code>app/bms/COUSR02.bms:130<\/code><\/td><\/tr><tr><td>14<\/td><td>Medium<\/td><td>CWE-307 / CWE-204<\/td><td>No lockout; separate \"wrong password\" and \"user not found\" messages allow user enumeration<\/td><td><code>COSGN00C.cbl:221-257<\/code><\/td><\/tr><tr><td>15<\/td><td>Medium<\/td><td>CWE-319<\/td><td>Deploy scripts submit JCL over plain FTP<\/td><td><code>scripts/remote_submit.sh:20<\/code>; <code>remote_compile.sh:35<\/code>; <code>upld_module.sh:35<\/code>; <code>run_full_batch.sh:9<\/code><\/td><\/tr><tr><td>16<\/td><td>Medium<\/td><td>CWE-77<\/td><td>FTP and shell command injection through unquoted script arguments in heredocs and <code>sed<\/code><\/td><td><code>scripts/remote_submit.sh:9,23<\/code>; <code>upld_module.sh:8,37<\/code>; <code>remote_compile.sh:27,38<\/code><\/td><\/tr><tr><td>17<\/td><td>Medium<\/td><td>CWE-359<\/td><td>Sample data carries full card records (PAN, CVV, expiry) and identity data (SSN, DOB); it looks synthetic, but the PAN ranges are unconfirmed<\/td><td><code>app/data/ASCII/carddata.txt<\/code>, <code>custdata.txt<\/code> and the EBCDIC copies<\/td><\/tr><tr><td>18<\/td><td>Low<\/td><td>CWE-521<\/td><td>8-character limit; upper-casing on sign-on only, so users created with lower-case passwords can never sign on<\/td><td><code>COSGN00C.cbl:135<\/code>; <code>COUSR01C.cbl:157<\/code><\/td><\/tr><tr><td>19<\/td><td>Low<\/td><td>CWE-129<\/td><td>Invalid menu option still indexes the option table<\/td><td><code>COMEN01C.cbl:127-137<\/code><\/td><\/tr><tr><td>20<\/td><td>Low<\/td><td>CWE-155<\/td><td><code>%<\/code> and <code>_<\/code> typed by the user act as <code>LIKE<\/code> wildcards (static SQL; <strong>not<\/strong> SQL injection)<\/td><td><code>COTRTLIC.cbl:348,364,1812<\/code><\/td><\/tr><tr><td>21<\/td><td>Low<\/td><td>CWE-377<\/td><td>Predictable <code>/tmp<\/code> file name; the script also deletes every git tag<\/td><td><code>scripts/git-addSrcVersionInfo.sh:30-35,75-99<\/code><\/td><\/tr><tr><td>22<\/td><td>Low<\/td><td>CWE-250<\/td><td>Scheduled jobs run as a personal TSO ID<\/td><td><code>app/scheduler/CardDemo.controlm:4<\/code><\/td><\/tr><tr><td>23<\/td><td>Low<\/td><td>CWE-1104<\/td><td>Product versions hardwired into library DSNs (COBOL 6.3, CICS TS 5.6, IMS 15.1); support dates not checked offline<\/td><td><code>scripts/compile_batch.jcl.template:11<\/code>; <code>samples/proc/BLDCIDB2.prc:31<\/code>; <code>app/app-authorization-ims-db2-mq/jcl/DBPAUTP0.jcl:33<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Checked clean: no dynamic SQL (<code>PREPARE<\/code>/<code>EXECUTE IMMEDIATE<\/code>), so no SQL injection. The report JCL built in <code>CORPT00C<\/code> validates its dates numerically before submission (<code>:306-373<\/code>).<\/p>", "open": false}, {"title": "Assessment: Documentation Gaps", "html": "<p>Top 5 things a new engineer would need explained, where code and docs disagree or the docs are silent:<\/p>\n<ol><li><strong>Security is application-level, not RACF.<\/strong> The README lists RACF (<code>README.md:47<\/code>). Sign-on actually compares a clear, upper-cased password against the USRSEC VSAM record and routes on a one-byte user type (<code>COSGN00C.cbl:132-136,211-239<\/code>). Per-option admin gating is effectively off: every main-menu option is flagged <code>U<\/code>, and the \"(Admin Only)\" label is commented out (<code>COMEN02Y.cpy:69<\/code>).<\/li><li><strong>The batch-cycle rules exist only in code.<\/strong><\/li><\/ol>\n<ul><li>Posting reject codes are 100\u2013103, and a later reject overwrites an earlier one (<code>CBTRN02C.cbl:380-420<\/code>).<\/li><li>The credit test uses cycle credit minus cycle debit, not the balance.<\/li><li>Interest is <code>balance \u00d7 rate / 1200<\/code>, with a <code>DEFAULT<\/code> disclosure-group fallback, and the interest job also zeroes the cycle counters (<code>CBACT04C.cbl:352-354,415-465<\/code>).<\/li><li>Interest transactions reach TRANSACT only through COMBTRAN's SORT/REPRO.<\/li><li>The run order and dependencies live in the scheduler files and in a <code>sleep<\/code>-based script, not in any doc.<\/li><\/ul>\n<ol><li><strong>\"Transaction Reports\" is CICS submitting batch.<\/strong> <code>CORPT00C<\/code> assembles JCL in WORKING-STORAGE (<code>:81-127<\/code>) and writes it to the TDQ <code>JOBS<\/code> \u2192 internal reader (<code>CARDDEMO.CSD:499-503<\/code>). This needs the CNTL library (<code>REPROCT<\/code>) and a DATEPARM data set, neither of which is in the README install table (<code>README.md:111-119<\/code>).<\/li><li><strong>Authorization decisioning and MQ contracts.<\/strong><\/li><\/ol>\n<ul><li>The only approval rule is available credit.<\/li><li>Queue names come from trigger data and from the MQMD reply-to queue, not from the queue names the README gives (<code>COACCT01.cbl:191-198<\/code> hardcodes <code>CARD.DEMO.REPLY.ACCT<\/code>).<\/li><li>Each trigger processes at most 500 messages.<\/li><li>PF5 <em>toggles<\/em> fraud on and off.<\/li><li>The purge job's YYDDD date arithmetic is likely wrong across a year boundary (<code>CBPAUP0C.cbl:280-282<\/code>).<\/li><li>The sub-app README swaps the online and batch PSBs.<\/li><\/ul>\n<ol><li><strong>Bill pay semantics.<\/strong> It always pays the full balance, with no amount input. The new transaction ID is the highest key + 1 via <code>STARTBR<\/code>/<code>READPREV<\/code> (<code>COBIL00C.cbl:212-235<\/code>), which is not safe if two users pay at once.<\/li><\/ol>\n<p>Also undocumented: the real build path (an FTP tunnel to a hosted mainframe, and a <code>Makefile<\/code> that is missing), and the orphan <code>COCRDSEC<\/code>/<code>CDV1<\/code> definition.<\/p>", "open": false}, {"title": "Assessment: Relative Scale", "html": "<div class='scroll'><table><thead><tr><th>Measure<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Source KSLOC (COBOL, copybooks, BMS, JCL, PROC, CSD, control cards, DDL/DCLGEN, DBD/PSB, HLASM)<\/td><td>42.67<\/td><\/tr><tr><td>Complexity index (<code>2.94 \u00d7 KSLOC^1.10<\/code>)<\/td><td><strong>182.6<\/strong><\/td><\/tr><tr><td>COBOL decision keywords per KSLOC<\/td><td>209<\/td><\/tr><tr><td>Most complex file<\/td><td><code>app/cbl/COACTUPC.cbl<\/code> (587 keywords, 3,368 code lines)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The index is a <strong>relative size measure for ranking this system against others<\/strong> measured the same way. It is not a timeline, an effort estimate or a cost, and none should be derived from it.<\/p>", "open": false}, {"title": "Assessment: Recommended Modernization Pattern", "html": "<p><strong>Refactor, routed to <code>/code-modernization:modernize-transform<\/code>.<\/strong> Rewrite domain by domain into a modern stack, with characterization tests pinning each slice. The target technology and version are not chosen yet (<code>INTENT.md<\/code>); a person decides, and the version is then looked up, never assumed.<\/p>\n<p>Why Refactor:<\/p>\n<ul><li>The structure suits a piece-by-piece rewrite. There are ten domains with clean seams through VSAM record layouts (copybooks map directly to entities), a table-driven menu, and scheduler-chained batch.<\/li><li>It is small enough to transform rather than redesign wholesale (42.7 KSLOC; 44 programs).<\/li><li>The business logic sits in a handful of programs (<code>CBTRN02C<\/code>, <code>CBACT04C<\/code>, <code>CBSTM03A/B<\/code>, <code>COACTUPC<\/code>, <code>COPAUA0C<\/code>), so per-module equivalence testing is tractable.<\/li><\/ul>\n<p>Why not the others:<\/p>\n<ul><li><strong>Rehost or Replatform<\/strong> would carry the critical authorization and PCI defects across unchanged.<\/li><li><strong>Rearchitect or Rebuild<\/strong> is not justified by the size or by any scaling need (no telemetry suggests one).<\/li><\/ul>\n<p>The one area that must be treated as a redesign inside the transform is <strong>identity and authorization<\/strong>: plaintext passwords, menu-only role checks and missing customer-to-user ownership. Specify it from the extracted rules, not port it.<\/p>\n<p>Suggested order:<\/p>\n<ol><li>Batch posting, interest and statements (D7/D8): deterministic file-in/file-out, easiest to prove equivalent with the sample data.<\/li><li>The read-only online screens.<\/li><li>The update screens.<\/li><li>The optional sub-apps last, or replaced if the Db2/IMS/MQ showcases are not needed.<\/li><\/ol>\n<p>There are no tests today, so every slice starts with characterization tests. If the legacy system stays in service during the program, run <code>/code-modernization:modernize-harden<\/code> first, for Critical findings 1\u20133 and High findings 4, 8 and 9 and the FTP credential rotation.<\/p>", "open": false}, {"title": "Business flows", "html": "<h3>Service rep looks up and corrects a customer&#x27;s account<\/h3><p><b>Customer service representative<\/b>: A service rep signs on, opens a customer&#x27;s account, checks the details and fixes the balance or contact data.<\/p><ol><li>Signs on with user ID and password<\/li><li>Picks &#x27;Account View&#x27; from the main menu<\/li><li>Sees the account, its card link and the customer<\/li><li>Edits and saves account and customer details<\/li><\/ol><h3>Cardholder pays the card balance<\/h3><p><b>Cardholder (through a service rep)<\/b>: The full outstanding balance is paid online; a payment transaction is recorded and the balance drops to zero.<\/p><ol><li>Chooses &#x27;Bill Payment&#x27; from the menu<\/li><li>Account and card are looked up<\/li><li>Payment is recorded as a new transaction<\/li><li>Account balance is updated<\/li><\/ol><h3>Nightly cycle turns the day&#x27;s card activity into statements<\/h3><p><b>Cardholder receiving a monthly statement<\/b>: Each night the day&#x27;s transactions are validated and posted, interest is charged, and statements are produced.<\/p><ol><li>Online files are closed for the batch window<\/li><li>Daily transactions are validated and posted; rejects set aside<\/li><li>Interest and fees are calculated from category balances<\/li><li>Transaction master is backed up and combined<\/li><li>Statements are printed in text and HTML<\/li><li>Online files are reopened<\/li><\/ol><h3>A merchant&#x27;s card authorization is approved or declined<\/h3><p><b>Merchant / cardholder at the point of sale<\/b>: An authorization request arrives over MQ, is checked against the account&#x27;s credit, recorded, answered, and later reviewed for fraud.<\/p><ol><li>Authorization request arrives on the request queue<\/li><li>Card, account and customer are looked up<\/li><li>Decision is recorded in the pending-authorization database<\/li><li>Approve/decline reply is sent back<\/li><li>A rep reviews pending authorizations and flags fraud<\/li><li>Expired authorizations are purged nightly<\/li><\/ol>"}, {"title": "The map's observations", "html": "<ul><li>TRANSACT is the most-written store: 6 writers (CBTRN02C, COBIL00C, COMBTRAN, COTRN02C, TRANBKP, TRANFILE). Next: IMS:DBPAUTP0 (5) and ACCTDATA (5). Every writer must move together, or a sync layer is needed during cut-over.<\/li><li>Navigation is a hub-and-spoke: COMEN01C dispatches to 12 programs through the menu table in COMEN02Y (XCTL on a table entry), and COADM01C does the same through COADM02Y. These are dispatch edges resolved from copybook VALUE literals, not static calls.<\/li><li>Every XCTL/LINK/CALL through a variable resolved to at least one program: menu tables (COMEN02Y, COADM02Y), LIT-* VALUE constants and MOVE literals into CDEMO-TO-PROGRAM. &#x27;Return to caller&#x27; XCTLs go through CDEMO-FROM-PROGRAM, which is set at run time; they only return to a program that already called this one, so they cannot make an unreachable program live. Unresolved sites: 0.<\/li><li>Gaps to resolve before extraction: CSD defines program(s) COCRDSEC (transaction CDV1) with no source in the tree; batch program(s) CBTRN01C are run by no JCL, PROC or scheduler (dead-end candidate; its data access is not mapped because there is no DD join); stores read but never written in the tree (external feeds or missing jobs): CARDEMO.FTP.TEST, DALYTRAN, DALYTRAN.PS.INIT, DATEPARM, INPFILE; DDs that no program SELECTs: INTCALC:XREFFIL1-&gt;CARDXREF.AIX, UNLDGSAM:PADFILOP-&gt;PAUTDB.CHILD.GSAM, UNLDGSAM:PASFILOP-&gt;PAUTDB.ROOT.GSAM.<\/li><li>The MQ-triggered programs (COACCT01, CODATE01, COPAUA0C) read a queue named by the trigger message (MQTM-QNAME), and COPAUA0C replies to the message&#x27;s reply-to queue. Those queue names are in MQ trigger and process definitions that are not in the tree, so they appear here as per-program request/reply placeholders.<\/li><li>Online-to-batch coupling: CORPT00C writes JCL records to TDQ JOBS (internal reader), which runs PROC TRANREPT. Online programs and the nightly jobs share TRANSACT, ACCTDATA and CARDXREF. The batch window depends on CLOSEFIL issuing CEMT SET FIL(...) CLO through SDSF, and on OPENFIL reopening the files, so the CICS files and the batch jobs have to move as one unit (or move behind one data-access service).<\/li><li>Schedule ordering risk: in the CA-7/Control-M definitions CLOSEFIL fans out to parallel chains (CBPAUP0J -&gt; POSTTRAN; INTCALC -&gt; COMBTRAN; CREASTMT -&gt; TXT2PDF1; TRANBKP) that rejoin at WAITSTEP before OPENFIL. No dependency makes INTCALC or CREASTMT wait for POSTTRAN, although both read what posting writes (TCATBALF, TRANSACT). Confirm the real run order before relying on it in a rewrite.<\/li><\/ul>"}, {"title": "Preflight: summary", "html": "<h2>Preflight: aws-carddemo<\/h2>\n<p>Run 2026-11-23. <code>legacy/aws-carddemo<\/code> is <strong>a directory in this workspace<\/strong> (not a symlink), read-only on disk (<code>dr-xr-xr-x<\/code>), 329 files. Intent (<code>INTENT.md<\/code>): understanding only. Assess, map and extract rules; nothing is rebuilt and the target is not chosen.<\/p>"}, {"title": "Preflight: Answers", "html": "<p>Collected before this run by Reframe in autonomous mode. The question pop-up was not available. Recorded verbatim.<\/p>\n<p><strong>1. Scope:<\/strong> Is this code the complete system, or one slice of a larger codebase? If a slice: what <em>outside<\/em> it depends on code <em>inside<\/em> it, and is breaking those consumers acceptable?<\/p>\n<p>&gt; The complete source as Reframe snapshotted it (SHA-256 d9a77d549248727883ce64930d337dd6518322d4dead65a418eafd1eb402541a); nothing outside it is in scope for this assessment.<\/p>\n<p>Answered by: Reframe (autonomous mode)<\/p>\n<p><strong>2. Build &amp; test locally:<\/strong> Can this environment restore, build, and run the tests? Roughly how long does the full CI pipeline take?<\/p>\n<p>&gt; No. This pass is analysis only: nothing is built or run.<\/p>\n<p>Answered by: Reframe (autonomous mode)<\/p>\n<p><strong>3. Bespoke build infrastructure:<\/strong> Is there organization-specific build or dependency machinery (an internal package feed, a code generator, a wrapper around the standard build tool) a newcomer would not guess? Where is it documented?<\/p>\n<p>&gt; Don't know.<\/p>\n<p>Answered by: Reframe (autonomous mode) <strong>Open item for a person:<\/strong> confirm the bespoke machinery Check 3a found in the source: an FTP-over-tunnel submit path to a hosted mainframe, and a <code>Makefile<\/code> that is referenced but missing. Say whether it is still the real build path.<\/p>\n<p><strong>4. Prior attempts:<\/strong> Has anyone tried to modernize this before? What went wrong?<\/p>\n<p>&gt; An AWS Transform assessment of the same snapshot was made; its results are kept apart and are not given to this assessment.<\/p>\n<p>Answered by: Reframe (autonomous mode)<\/p>\n<p><strong>5. Off limits:<\/strong> Is anything in this code not allowed to change in this pass (a component another team owns, a frozen branch, generated code)?<\/p>\n<p>&gt; Everything: this pass is analysis only, and nothing in the source may change.<\/p>\n<p>Answered by: Reframe (autonomous mode)<\/p>"}, {"title": "Preflight: Check 6: Scope boundary", "html": "<p><strong>Standalone: <code>aws-carddemo<\/code> is the whole system for this assessment.<\/strong> No repository, solution or reactor root of its own sits above it. The only git root above it is the user's home directory, and that repository does not track <code>legacy/<\/code> and has nothing to do with this system. Every application copybook, DCLGEN and BMS map that a program references resolves inside the tree. Nothing inside reaches outside except vendor runtime libraries (CICS, Db2, IMS, MQ, LE: see Check 4), which are platform, not consumers. There are no inbound consumers to account for. The three sub-applications under <code>app/<\/code> (<code>app-authorization-ims-db2-mq<\/code>, <code>app-transaction-type-db2<\/code>, <code>app-vsam-mq<\/code>) are inside the scope, not siblings outside it. This matches Answer 1.<\/p>"}, {"title": "Preflight: Results", "html": "<div class='scroll'><table><thead><tr><th>#<\/th><th>Check<\/th><th>Status<\/th><th>Found<\/th><th>Fix<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Human answers<\/td><td>\u26a0\ufe0f<\/td><td>All five recorded (autonomous). Q3 is \"Don't know\".<\/td><td>A person confirms the bespoke build path (see Answer 3).<\/td><\/tr><tr><td>1<\/td><td>Stack<\/td><td>\u2705<\/td><td>IBM z/OS mainframe: Enterprise COBOL (44 programs, ~30.2k lines), 62 copybooks (~10.7k), CICS (25 programs, 21 BMS maps ~5.8k, CSD), JCL/PROC (55 jobs + 6 procs, ~4.0k), VSAM (IDCAMS), Db2 (4 programs, 6 DDL, 3 DCLGEN), IMS DB (7 programs, DBD/PSB), IBM MQ, HLASM (2 .asm + 2 .mac), CA-7 and Control-M schedules.<\/td><td>none<\/td><\/tr><tr><td>2<\/td><td>Analysis tooling<\/td><td>\u26a0\ufe0f<\/td><td><code>python3<\/code> 3.12.2 \u2705. <code>scc<\/code>, <code>cloc<\/code>, <code>lizard<\/code> missing (lizard is not importable either).<\/td><td><code>brew install scc<\/code> and <code>python3 -m pip install lizard<\/code> (optional: <code>brew install cloc<\/code>). Without them, LOC falls back to <code>find<\/code>+<code>wc<\/code> and complexity to keyword counts.<\/td><\/tr><tr><td>3<\/td><td>Build toolchain<\/td><td>\u26a0\ufe0f<\/td><td><strong>3a:<\/strong> No CI. Build is mainframe JCL: <code>scripts/compile_batch.jcl.template<\/code> (IGYCRCTL from <code>IGY.SIGYCOMP.V63<\/code>, i.e. Enterprise COBOL 6.3, then HEWL link), <code>samples/proc/BUILDBAT/BUILDONL/BUILDBMS/BLDCIDB2.prc<\/code>, <code>samples/jcl/IMSMQCMP.jcl<\/code>. Pinned platform libraries: <code>OEM.CICSTS.V05R06M0<\/code> (CICS TS 5.6), <code>OEMA.DB2.VERSIONA.SDSNLOAD<\/code>, <code>OEMA.IMS.IMSP.SDFSRESL.V151<\/code> (IMS 15.1). <strong>Bespoke:<\/strong> <code>scripts/remote_*.sh<\/code>, <code>run_*.sh<\/code> and <code>upld_module.sh<\/code> submit through <code>tnftp localhost 2121<\/code> (an \"FTP Tunnel to Ensono\", a hosted mainframe). <code>remote_compile.sh<\/code> calls <code>make -f Makefile<\/code>, but there is no Makefile in the tree. <code>scripts/local_compile.sh<\/code> shows a GnuCOBOL call (<code>cobc -I ../cpy/ --std=ibm-strict<\/code>) against a file that does not exist (<code>sample/cobol/SIZING.cbl<\/code>). <strong>3b:<\/strong> <code>cobc<\/code> not installed, so Level 1 was not possible. Level 2 is impossible: no local runtime for CICS, IMS, Db2 or MQ. Per Answer 2, nothing is built in this pass anyway.<\/td><td>For later equivalence work only: <code>brew install gnucobol<\/code> enables Level 1 syntax checks of batch programs with <code>-I app/cpy --std=ibm-strict<\/code>. CICS, SQL and DLI programs still need vendor precompilers. Until then, equivalence relies on recorded traces.<\/td><\/tr><tr><td>4<\/td><td>Source completeness<\/td><td>\u2705<\/td><td>355 COPY/INCLUDE references. All 63 application members resolve. The 10 unresolved names are all vendor-supplied: <code>DFHAID<\/code>, <code>DFHBMSCA<\/code> (CICS, 21 refs each), <code>CMQV<\/code>, <code>CMQMDV<\/code>, <code>CMQODV<\/code>, <code>CMQGMOV<\/code>, <code>CMQPMOV<\/code>, <code>CMQTML<\/code> (MQ), <code>SQLCA<\/code> (Db2), plus <code>REPLACING<\/code>, which is a parser artifact. JCL <code>PGM=<\/code> targets are 11 in-source programs plus IBM utilities only. External CALLs are <code>CBLTDLI<\/code>, <code>CEE3ABD<\/code>, <code>MQ*<\/code> (vendor). Descriptors are present: CSD (<code>app/csd/CARDDEMO.CSD<\/code> + 3 sub-app CSDs), JCL/PROCs, <code>app/catlg/LISTCAT.txt<\/code>, CA-7 and Control-M schedules. Data definitions are present: DDL, DCLGEN, DBD/PSB, record-layout copybooks, sample data (ASCII and EBCDIC). <strong>Binary-only:<\/strong> <code>samples/m2/mf/CardDemo_runtime.zip<\/code> (30 <code>.so<\/code> and 17 <code>.MOD<\/code> compiled modules, Micro Focus) and <code>samples/m2/unikix/UniKix_CardDemo_runtime_v1.zip<\/code> (<code>.cl2<\/code>, <code>.idx<\/code>, <code>.dta<\/code>). Both are packaged runtimes of the same source, not code missing from the tree.<\/td><td>none. Exclude the two zips from LOC and dependency maps.<\/td><\/tr><tr><td>5<\/td><td>Optional context<\/td><td>\u26a0\ufe0f<\/td><td>No APM MCP server is connected, and there are no batch run logs or runtime exports (only compile listings inside the UniKix zip). Version control: not under git with real history. The snapshot is untracked, so there is no change-frequency signal.<\/td><td>Optional: supply SMF or batch job logs, or the upstream git history, if change frequency or runtime ranking is wanted.<\/td><\/tr><tr><td>6<\/td><td>Scope boundary<\/td><td>\u2705<\/td><td>Standalone (see above).<\/td><td>none<\/td><\/tr><tr><td>7<\/td><td>Source edit protection<\/td><td>\u2705<\/td><td>Project <code>.claude/settings.json<\/code> <code>permissions.deny<\/code> contains <code>Edit(/~/.reframe/projects/aws-carddemo/runs/fa1f61/claude/legacy/**)<\/code> (and a matching <code>Write(...)<\/code> rule, which does not count on its own). <code>legacy/aws-carddemo<\/code> is a real directory, not a link, so no target rule is needed. The directory is also read-only on disk.<\/td><td>none<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Note on Check 7: a permission rule covers Claude's file tools and the shell commands it recognizes (<code>sed<\/code>, <code>tee<\/code>, <code>&gt; file<\/code>), not a script that opens files itself. The hard guarantee is the operating system: a read-only mount or a sandbox that blocks shell writes. The <code>dr-xr-xr-x<\/code> mode here helps, but the owner can still <code>chmod<\/code> it. Managed (organization) settings were not read.<\/p>\n<p>Housekeeping: preflight left a scratch helper at <code>analysis/aws-carddemo/.preflight-scratch/copies.py<\/code> (the copybook, PGM and CALL resolver). Deleting it needed an approval this run did not have. It is safe to remove.<\/p>"}, {"title": "Preflight: Verdict per command", "html": "<div class='scroll'><table><thead><tr><th>Command<\/th><th>Verdict<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>assess<\/code><\/td><td><strong>Ready-with-gaps<\/strong><\/td><td>Stack is clear and source is complete. <code>scc<\/code> and <code>lizard<\/code> are missing, so metrics and complexity are coarser. No history or telemetry overlay.<\/td><\/tr><tr><td><code>map<\/code><\/td><td><strong>Ready<\/strong><\/td><td><code>python3<\/code> is present. Every application copybook and program resolves. Descriptors (CSD, JCL, schedules, LISTCAT) are present for entry points and data joins.<\/td><\/tr><tr><td><code>extract-rules<\/code><\/td><td><strong>Ready<\/strong><\/td><td>Complete source and <code>python3<\/code>.<\/td><\/tr><tr><td><code>brief<\/code><\/td><td><strong>Ready<\/strong> (after discovery)<\/td><td>Needs only the assess, map and extract-rules artifacts. No inbound consumers to decide on.<\/td><\/tr><tr><td><code>transform<\/code>, <code>reimagine<\/code><\/td><td><strong>Ready-with-gaps<\/strong> (out of scope this pass)<\/td><td>No target was chosen, so the target toolchain is unproven. The legacy toolchain cannot run locally, so equivalence would fall back to recorded traces. Answer 5 forbids changes in this pass.<\/td><\/tr><tr><td><code>harden<\/code><\/td><td><strong>Ready-with-gaps<\/strong><\/td><td><code>python3<\/code> is present. No COBOL/JCL-specific SAST tool was found, so the scan is Claude-derived only.<\/td><\/tr><tr><td><code>uplift<\/code><\/td><td><strong>Not applicable<\/strong><\/td><td>No version target. Answer 5 forbids changes in this pass.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Nothing is red. The most useful fix: <code>brew install scc &amp;&amp; python3 -m pip install lizard<\/code>, for sharper metrics in assess.<\/p>\n<p>Next step: <code>/code-modernization:modernize-assess aws-carddemo<\/code><\/p>"}, {"title": "How the requirements were generated", "html": "<p>The business functions, capabilities and requirements on this page were generated by Reframe from Claude&#x27;s results, outside the plugin. The rule cards and the open questions are as the plugin wrote them.<\/p><p>Reframe asked Claude once per domain, with only the plugin's results for that domain. Every requirement cites a rule card or a file and line that exist; 0 proposed requirements cited neither and were dropped. 257 of 257 rule cards are cited by a requirement.<\/p>"}], "classification": [], "unclassified": [], "issues": [], "decisions": [{"answer": "The complete source as Reframe snapshotted it (SHA-256 d9a77d549248727883ce64930d337dd6518322d4dead65a418eafd1eb402541a); nothing outside it is in scope for this assessment.", "at": "2026-11-23T19:21:59Z", "question": "claude-preflight-1", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "No. This pass is analysis only: nothing is built or run.", "at": "2026-11-23T19:21:59Z", "question": "claude-preflight-2", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "Don't know.", "at": "2026-11-23T19:21:59Z", "question": "claude-preflight-3", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "An AWS Transform assessment of the same snapshot was made; its results are kept apart and are not given to this assessment.", "at": "2026-11-23T19:21:59Z", "question": "claude-preflight-4", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "Everything: this pass is analysis only, and nothing in the source may change.", "at": "2026-11-23T19:21:59Z", "question": "claude-preflight-5", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "run 37 shards", "at": "2026-11-23T19:43:44Z", "question": "claude-estimate", "reason": "the upper estimate (555 agents) is within the agent limit (900)", "step": "claude rule extraction"}, {"answer": "load", "at": "2026-11-23T20:28:50Z", "question": "claude-graph-load", "reason": "the run created this graph", "step": "claude graph"}, {"answer": "run 37 shards", "at": "2026-11-23T21:54:19Z", "question": "claude-estimate", "reason": "the upper estimate (555 agents) is within the agent limit (900)", "step": "claude rule extraction"}, {"answer": "run 37 shards", "at": "2026-11-24T00:45:07Z", "question": "claude-estimate", "reason": "the upper estimate (555 agents) is within the agent limit (900)", "step": "claude rule extraction"}], "links": {"pages": [["The plugin's own report", "plugin/REPORT.html", "REPORT.html"], ["The plugin's interactive map", "plugin/TOPOLOGY.html", "TOPOLOGY.html"]]}, "nav": [["AWS Transform's review", "../aws/index.html"], ["AWS Transform and Claude compared", "../comparison/index.html"], ["Reconciled review", "../reconciled/index.html"]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
// AWS writes names in backticks (`TCATBAL-FILE`); show them as code, escaped like everything else.
const prose = v => esc(v).replace(/`([^`]+)`/g, '<code>$1</code>');
// Which assessment this page shows: AWS Transform's (pipeline 1) or Claude's (pipeline 2, with generated requirements).
const TOOL = D.tool || {key: 'aws', name: 'AWS Transform', short: 'AWS', generated: false};
const GEN = TOOL.generated ? '<span class="tag warn" title="' + esc(TOOL.generated_note || '') + '">Generated by Reframe</span>' : '';

// ---- indexes ----------------------------------------------------------------------------------------
const fnById = {}, capById = {}, reqByKey = {}, ruleByKey = {}, qByKey = {}, domByKey = {};
D.functions.forEach((f, i) => { f.index = i; fnById[f.id] = f; });
D.capabilities.forEach((c, i) => { c.index = i; capById[c.id] = c; });
D.requirements.forEach(r => reqByKey[r.key] = r);
D.rules.forEach(r => ruleByKey[r.key] = r);
D.questions.forEach(q => qByKey[q.key] = q);
D.domains.forEach((d, i) => { d.index = i; domByKey[d.key] = d; });
const business = D.rules.filter(r => r.disposition === 'captured');
const ruleCap = {}; D.requirements.forEach(r => (r.rules || []).forEach(k => { if (!ruleCap[k]) ruleCap[k] = r.capability; }));

function capItems(c){
  const keys = new Set();
  c.requirements.forEach(k => { keys.add(k); (reqByKey[k].rules || []).forEach(r => { if (ruleByKey[r] && ruleByKey[r].disposition === 'captured') keys.add(r); }); });
  c.questions.forEach(k => keys.add(k));
  return keys;
}
function fnItems(f){ const keys = new Set(); f.capabilities.forEach(id => capItems(capById[id]).forEach(k => keys.add(k))); f.other_rules.forEach(k => keys.add(k)); return keys; }
function domItems(d){ const keys = new Set(); d.functions.forEach(id => fnItems(fnById[id]).forEach(k => keys.add(k))); return keys; }
function countsOf(keys){ let req = 0, rule = 0, q = 0; keys.forEach(k => { if (reqByKey[k]) req++; else if (ruleByKey[k]) rule++; else if (qByKey[k]) q++; }); return {req, rule, q}; }

// ---- review marks, kept in this browser ---------------------------------------------------------------
const STORE = 'reframe-review:' + (D.project || '') + ':' + D.run + ':' + String(D.source.sha256 || '').slice(0, 16) + (TOOL.key === 'aws' ? '' : ':' + TOOL.key);
let marks = {}, stored = true;
try { marks = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { stored = false; }
let reviewer = ''; try { reviewer = localStorage.getItem('reframe-reviewer') || ''; } catch (e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch (e) { stored = false; } }
function reviewed(keys){ let n = 0; keys.forEach(k => { if (marks[k] && marks[k].status) n++; }); return n; }
function progress(keys){
  const total = keys.size, done = reviewed(keys), pct = total ? Math.round(100 * done / total) : 0;
  return '<div class="progress">' + done + ' of ' + total + ' reviewed<i><b style="width:' + pct + '%"></b></i></div>';
}
const STATUSES = [['agree', '✓ Agree'], ['change', '✎ Needs change'], ['question', '? Question']];
function markControls(key, hint){
  const m = marks[key] || {};
  return '<div class="marks" data-key="' + esc(key) + '">' + STATUSES.map(([s, label]) =>
    '<button class="' + s + '" aria-pressed="' + (m.status === s) + '" data-status="' + s + '">' + label + '</button>').join('') +
    (m.status ? '<textarea placeholder="' + esc(hint || 'Comment (optional): what should change, or what you want to ask') + '">' + esc(m.comment || '') + '</textarea>' : '') + '</div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('.marks button'); if (!b) return;
  const box = b.closest('.marks'), key = box.dataset.key, status = b.dataset.status;
  const m = marks[key] || {};
  if (m.status === status) delete marks[key]; else marks[key] = {status, comment: m.comment || '', at: new Date().toISOString()};
  save();
  const item = box.closest('.item'); if (item) item.className = 'item ' + ((marks[key] || {}).status || '');
  box.outerHTML = markControls(key);
});
document.addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const key = e.target.closest('.marks').dataset.key;
  if (marks[key]) { marks[key].comment = e.target.value; marks[key].at = new Date().toISOString(); save(); }
});

// ---- small pieces -----------------------------------------------------------------------------------
const PATTERN = {'Ubiquitous': 'Always', 'Event-driven': 'When something happens', 'State-driven': 'While a condition holds',
  'Unwanted': 'If something goes wrong', 'Optional': 'Where a feature applies', 'Complex': 'Combined conditions'};
function crumbs(parts){ return '<div class="crumbs">' + parts.map(([label, href]) => href ? '<a href="' + href + '">' + esc(label) + '</a>' : '<b>' + esc(label) + '</b>').join('<span>›</span>') + '</div>'; }
function numbers(list){ return '<div class="numbers">' + list.map(([n, l]) => '<div><b>' + n + '</b><span>' + esc(l) + '</span></div>').join('') + '</div>'; }
function countLine(c, extra){ return '<div class="counts">' + (extra || '') + '<span><b>' + c.req + '</b> requirements</span><span><b>' + c.rule + '</b> business rules</span><span><b>' + c.q + '</b> open questions</span></div>'; }
// Pipeline 3: what kind of rule (docs/pipeline-3.md, section 8.6); business, validation and compliance rules come first.
const KIND = {business: 'Business rule', validation: 'Validation', compliance: 'Compliance', error_handling: 'Error handling', display: 'Display',
  technical: 'Technical step', side_effect: 'Side effect', leftover: 'Leftover'};
const KIND_ORDER = Object.keys(KIND);
const kindRank = key => { const r = ruleByKey[key]; const i = r && r.kind ? KIND_ORDER.indexOf(r.kind) : -1; return i < 0 ? KIND_ORDER.length : i; };
const byKind = keys => keys.slice().sort((a, b) => kindRank(a) - kindRank(b));
// Agree keeps a rule (section 8.11): who agreed, from the review downloads the last round read.
function agreedTag(x){ return x && x.agreed_by && x.agreed_by.length ? '<span class="tag" title="Kept as agreed in later rounds">✓ Agreed by ' +
  esc(x.agreed_by.map(a => (a.reviewer || 'a reviewer') + (a.at ? ', ' + String(a.at).slice(0, 10) : '')).join('; ')) + '</span>' : ''; }
function ruleCard(key){
  const r = ruleByKey[key]; if (!r) return '';
  const extra = (r.priority ? '<span class="tag' + (r.priority === 'P0' ? ' warn' : '') + '">' + esc(r.priority) + '</span>' : '') + (r.category ? '<span class="tag grey">' + esc(r.category) + '</span>' : '') +
    (r.confidence ? '<span class="tag ' + (r.decision && r.confidence !== 'high' ? 'warn' : 'grey') + '"' + (r.confidence_why ? ' title="' + esc(r.confidence_why) + '"' : '') + '>Confidence: ' + esc(r.confidence) + '</span>' : '') + (r.source ? '<code>' + esc(r.source) + '</code>' : '');
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><span class="tag grey">' + esc(r.kind ? KIND[r.kind] || r.kind : 'Business rule') + '</span>' + (r.id && TOOL.key !== 'aws' ? '<code>' + esc(r.id) + '</code>' : '') +
    '<span>' + esc(r.program) + '</span>' + extra + agreedTag(r) + '</div>' +
    '<div class="text"><b>' + prose(r.name) + '</b>' + (r.plain ? '<br>' + prose(r.plain) : '') + '<br>' + prose(r.text).replace(/\n/g, '<br>') + '</div>' +
    (r.examples && r.examples.length ? '<div class="small" style="margin:6px 0 0"><b>For example</b><ul style="margin:2px 0 0 18px;padding:0">' + r.examples.map(x =>
      '<li>' + (x.given.length ? x.given.map(g => esc(g.field) + ' ' + prose(g.value)).join(', ') + ' → ' : '') + prose(x.then) + '</li>').join('') + '</ul></div>' : '') +
    (r.decision ? decisionBlock(r) : '') +
    (r.defect && !(r.decision && r.n > 1) ? defectBlock(r) : '') + markControls(key) + '</div>';
}
// A possible defect belongs to the decision that found it: shown once, on its first rule (docs/pipeline-3.md, section 8.8).
function defectBlock(r){
  if (!r.decision) return '<p class="small" style="margin:6px 0 0"><span class="tag warn">Suspected defect</span> ' + prose(r.defect) + '</p>';
  return '<div class="small" style="margin:6px 0 0"><span class="tag warn">Possible defect</span>' +
    (r.defect_call ? '<span class="tag grey">' + (r.defect_call === 'deliberate' ? 'Looks deliberate' : 'Looks unintended') + '</span>' : '') +
    (r.unit_rules > 1 ? '<span class="muted">applies to the ' + r.unit_rules + ' rules of this decision</span>' : '') + '<br>' + prose(r.defect) +
    ((r.defect_evidence || []).length ? '<details><summary>The lines that show it</summary>' + r.defect_evidence.map(excerpt).join('') + '</details>' : '') + '</div>';
}
// Pipeline 3: how a recommended rule was decided, the rules it came from and the source lines behind it.
const DECISION = {agreed: 'Agreed by both tools', merged: 'Merged from both tools', aws: 'AWS Transform was right', claude: "Claude's plugin was right",
  rewritten: 'Rewritten from the code', kept: 'Kept: the code supports it', rejected: 'Rejected: the code does not support it', needs_sme: 'Waiting for an SME'};
function excerpt(cite){
  const e = (D.evidence || {})[cite];
  if (!e) return '<p><code>' + esc(cite) + '</code></p>';
  return '<p class="small" style="margin:8px 0 2px"><code>' + esc(cite) + '</code></p><pre class="code">' + e.lines.map((l, i) => '<span class="ln">' + (e.start + i) + '</span>' + esc(l)).join('\n') +
    (e.cut ? '\n<span class="muted">… ' + (e.end - e.start + 1 - e.lines.length) + ' more lines</span>' : '') + '</pre>';
}
function decisionBlock(r){
  const side = tool => r.originals.filter(o => o.tool === tool).map(o => '<div class="orig"><b>' + (o.link ? '<a href="' + esc(o.link) + '">' + prose(o.name || o.id) + '</a>' : prose(o.name || o.id)) +
    '</b> <span class="small muted">' + esc(o.program) + '</span><br>' + prose(o.text).replace(/\n/g, '<br>') + '</div>').join('') || '<p class="small muted">None</p>';
  return '<div class="decision"><span class="tag">' + esc(DECISION[r.decision] || r.decision) + '</span>' + (r.changed && r.decision === 'kept' ? '<span class="tag grey">Corrected</span>' : '') +
    '<span class="small muted">Round ' + esc(r.round || 0) + '</span><p class="small" style="margin:6px 0 0">' + prose(r.why) + '</p>' +
    (r.confidence_why ? '<p class="small muted" style="margin:4px 0 0">Confidence ' + esc(r.confidence) + ': ' + esc(r.confidence_why) + '</p>' : '') +
    (r.depends ? '<p class="small muted" style="margin:4px 0 0">Depends on: ' + prose(r.depends) + '</p>' : '') +
    (r.context && r.context.length ? '<p class="small muted" style="margin:4px 0 0">Context used: ' + r.context.map(esc).join('; ') + '</p>' : '') +
    '<details><summary>' + plural(r.originals.length, 'original rule') + ' and ' + plural(r.evidence.length, 'cited source range') + '</summary>' +
    '<div class="sides"><div><h4>AWS Transform</h4>' + side('aws') + '</div><div><h4>Claude\'s plugin</h4>' + side('claude') + '</div></div>' +
    '<h4>Evidence in the source</h4>' + r.evidence.map(excerpt).join('') +
    (r.reachable ? '<h4>' + esc({yes: 'How the code is reached', no: 'The code never runs', unknown: 'Whether the code runs is not shown'}[r.reachable] || '') + '</h4>' +
      (r.entry || []).map(excerpt).join('') : '') + '</details></div>';
}
function requirementCard(key){
  const r = reqByKey[key];
  const rules = (r.rules || []).filter(k => ruleByKey[k] && ruleByKey[k].disposition === 'captured');
  const kind = r.kind === 'N' ? 'Non-functional' : 'Functional';
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><code>' + esc(r.code) + '</code>' + GEN + '<span class="tag">' + esc(PATTERN[r.pattern] || r.pattern || kind) + '</span>' +
    (r.kind === 'N' ? '<span class="tag grey">Non-functional</span>' : '') + agreedTag(r) + '</div><div class="text">' + prose(r.text) + '</div>' + markControls(key) +
    (rules.length ? '<details><summary>' + plural(rules.length, 'business rule') + ' behind it</summary><div class="rules">' + byKind(rules).map(ruleCard).join('') + '</div></details>' : '') + '</div>';
}
function questionCard(key){
  const q = qByKey[key];
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><code>' + esc(q.code) + '</code>' +
    (q.unverified ? '<span class="tag warn">Unverified requirement: please confirm</span>' : q.status && q.status !== 'open' ? '<span class="tag grey">' + esc(q.status === 'answered' ? 'Answered' : 'Settled by your context') + '</span>' : '<span class="tag">Open question</span>') +
    (q.owner ? '<span>For: ' + esc(q.owner) + '</span>' : '') + '</div><div class="text">' + prose(q.text) + '</div>' +
    markControls(key, 'Your answer, or what is missing') + '</div>';
}
function anchor(key){ return 'i-' + key.replace(/[^A-Za-z0-9_-]/g, '_'); }

// ---- the business review, top down ------------------------------------------------------------------

  const biz = D.domains.filter(d => d.kind === 'business');
  const all = new Set(); D.domains.forEach(d => domItems(d).forEach(k => all.add(k)));
  let h = '<h2>What ' + esc(TOOL.name) + ' found in ' + esc(D.source.name || D.project || 'the source') + '</h2>' +
    (TOOL.generated ? '<p class="note">' + esc(TOOL.generated_note) + '</p>' : '') +

    'against the source code into one set of recommended rules, each showing how it was decided, the rules it came from and the lines of code behind it, and wrote ' +
    'recommended requirements from them in AWS Transform\'s domains and business functions. Please check that this matches how the business works.' :
    '<p class="lead">' + esc(TOOL.name) + ' read ' + esc(D.source.files || 'the') + ' source files and describes what the system does as business domains, business functions, ' +
    'capabilities, requirements and business rules. Please check that this matches how the business works.') + ' Start with a domain, go down to its functions and capabilities, ' +
    'and mark each requirement, rule and question: <b>Agree</b>, <b>Needs change</b> or <b>Question</b>. When you are done, open <b>Your review</b> to download your marks.</p>';
  h += numbers([[biz.length, 'business domains'], [D.functions.length, 'business functions'], [D.capabilities.length, 'capabilities'],
    [D.requirements.length, 'requirements'], [business.length, 'business rules'], [D.questions.length, 'open questions']]);
  if (D.reconcile) {
    const R = D.reconcile, u = R.units || {}, n = k => (R.rules[k] || 0);
    h += '<h3>How the recommended rules were decided</h3>' + numbers([[n('agreed'), 'agreed by both tools'], [n('merged'), 'merged'], [n('aws'), 'AWS Transform right'],
      [n('claude'), "Claude's plugin right"], [n('rewritten'), 'rewritten from the code'], [n('kept'), 'kept (one tool found it)']]);
    h += numbers([[u.rejected || 0, 'one-sided rules rejected'], [u.needs_sme || 0, 'waiting for an SME'], [R.defects || 0, 'possible defects'],
      [(R.sme || {}).questions || 0, 'questions on the SME list'], [R.dropped || 0, 'requirements dropped (no rule)'], [Object.keys(R.rounds || {}).length, 'rounds that decided them']]);
    const risk = R.risk || {};
    if (Object.keys(risk).length) h += numbers([[risk.high || 0, 'high-risk functions'], [risk.medium || 0, 'medium-risk functions'], [risk.low || 0, 'low-risk functions'], [R.tables || 0, 'decision tables']]);
    const conf = R.confidence || {};
    h += numbers([[conf.high || 0, 'high confidence'], [conf.medium || 0, 'medium: check these'], [conf.low || 0, 'low: check these first']]) +
      '<p class="small muted">Reframe sets confidence from what it checked: high when an agent decided the rule against the code with both tools\' rules and the code is shown to run; ' +
      'medium when one tool found it, no agent decided it, or the source does not show that the code runs; low when the code never runs.</p>';
    h += '<p><a class="btn primary" href="#/first">Review first: what to check before the rest</a> ' + (D.sme ? '<a class="btn" href="#/tech/sme">Open the SME list</a>' : '') + '</p>';
  }
  h += '<div class="panel">' + progress(all) + '</div>';
  h += '<h3>Business domains</h3><div class="grid">' + biz.map(domainCard).join('') + '</div>';
  const other = D.domains.filter(d => d.kind !== 'business');
  if (other.length) h += '<h3>Also assessed</h3><div class="grid">' + other.map(domainCard).join('') + '</div>';
  h += '<p class="small muted" style="margin-top:22px">Source: ' + esc(D.source.name) + (D.source.commit ? ', commit ' + esc(String(D.source.commit).slice(0, 12)) : '') +
    ', SHA-256 ' + esc(String(D.source.sha256 || '').slice(0, 16)) + '… · results retrieved ' + esc(D.retrieved_at || '') + ' · page built ' + esc(D.generated_at) + '</p>';
  return h;

// Pipeline 3: risk per capability and function, and decision tables (docs/pipeline-3.md, section 8.9).

function domainCard(d){

document.addEventListener('click', e => {
  const sign = e.target.closest('[data-sign]'), unsign = e.target.closest('[data-unsign]');
  if (!sign && !unsign) return;
  if (sign) {
    if (!reviewer) { const name = (prompt('Your name, for the sign-off') || '').trim(); if (!name) return; reviewer = name; try { localStorage.setItem('reframe-reviewer', reviewer); } catch (err) {} }
    marks['signoff:' + sign.dataset.sign] = {status: 'signoff', comment: '', at: new Date().toISOString()};
  } else delete marks['signoff:' + unsign.dataset.unsign];
  save(); route();
});
document.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.signoff; if (!id) return;
  const m = marks['signoff:' + id]; if (m) { m.comment = e.target.value; save(); }
});

  if (f.set_aside.length) h += '<details class="panel"><summary>' + plural(f.set_aside.length, 'technical step') + ' AWS set aside</summary><p class="small muted">AWS judged these not to be business rules (for example opening a file). They are not part of the review.</p>' +

  const t = f.technical, chips = (label, xs) => xs.length ? '<p><b>' + label + ':</b> ' + xs.map(x => '<span class="tag grey">' + esc(x) + '</span> ').join('') + '</p>' : '';
  h += '<details class="panel"><summary>Programs, jobs, screens and data stores</summary>' + chips('Programs', t.programs.map(p => p.name + (p.execution ? ' (' + p.execution + ')' : ''))) +

  return h;

// ---- review first (docs/pipeline-3.md, section 8.10): what an SME should check before the rest ---------------------
const RISK_RANK = {high: 0, medium: 1, low: 2};
// An item's risk is its capability's: a rule's is that of the first capability whose requirements cite it, else its
// function's. Functions take their riskiest capability, so on a card system nearly all are high; capabilities tell apart.
function itemCap(x){ return capById[x.capability || capOfRule(x.key)] || null; }
function itemRisk(x){ const c = itemCap(x); return (c && c.risk) || (fnById[x.function] || {}).risk || ''; }
function riskRank(x){ const r = itemRisk(x); return r in RISK_RANK ? RISK_RANK[r] : 3; }
const FIRST = [
  ['never', 'The code never runs', 'Rules both tools describe the same way, about code that no menu, transaction or job step reaches. They are probably not rules of the system.', r => r.confidence === 'low'],
  ['conflict', 'Conflicts', 'The two tools said different things; an agent decided against the code.', r => r.conflict],
  ['rewritten', 'Rewritten from the code', 'Both tools were partly wrong; the agent wrote what the code does.', r => r.decision === 'rewritten'],
  ['sme', 'Waiting for a subject-matter expert', 'The code could not settle these.', null],
  ['defect', 'Possible defects that look unintended', 'Behaviour in the code that may be a mistake. Confirm or dismiss each one.', r => r.defect && r.defect_call !== 'deliberate' && !(r.n > 1)],
  ['kept', 'Kept from one tool', 'Only one tool found these; the agent checked them against the code.', r => r.decision === 'kept'],
  ['medium', 'Other medium confidence', 'Not shown to run, depending on something outside the source, or not decided by an agent.', r => r.confidence === 'medium']];
let firstFilter = {decision: '', kind: '', confidence: '', risk: ''};
function firstGroups(){
  const seen = new Set(), out = [];
  const keep = r => (!firstFilter.decision || r.decision === firstFilter.decision) && (!firstFilter.kind || r.kind === firstFilter.kind) &&
    (!firstFilter.confidence || r.confidence === firstFilter.confidence) && (!firstFilter.risk || itemRisk(r) === firstFilter.risk);
  const order = (a, b) => riskRank(a) - riskRank(b) || kindRank(a.key) - kindRank(b.key) || (a.function > b.function ? 1 : -1);
  for (const [id, title, note, test] of FIRST) {
    let keys;
    if (!test) keys = (firstFilter.decision || firstFilter.kind || firstFilter.confidence) ? [] : D.questions.filter(q => !firstFilter.risk || itemRisk(q) === firstFilter.risk)
      .sort((a, b) => riskRank(a) - riskRank(b)).map(q => q.key);
    else keys = D.rules.filter(r => r.decision && !seen.has(r.key) && test(r) && keep(r)).sort(order).map(r => r.key);
    keys.forEach(k => seen.add(k));
    out.push({id, title, note, keys});
  }
  return out;
}
function firstSelect(id, label, options){
  return '<select data-first="' + id + '" aria-label="' + esc(label) + '"><option value="">' + esc(label) + '</option>' +
    options.map(([v, l]) => '<option value="' + esc(v) + '"' + (firstFilter[id] === v ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
}
function firstPage(){
  const groups = firstGroups(), all = new Set(groups.flatMap(g => g.keys));
  let h = crumbs([['Overview', '#/'], ['Review first']]) + '<h2>Review first</h2><p class="lead">The items to check before the rest, in order: code that never runs, conflicts, ' +
    'rules rewritten from the code, what waits for a subject-matter expert, possible defects, rules only one tool found, and the other medium-confidence rules. ' +
    'High-risk capabilities and business rules come first. The other ' + Math.max(0, business.length - groups.reduce((n, g) => n + (g.id === 'sme' ? 0 : g.keys.length), 0)) +
    ' rules were decided against the code with both tools\' rules and the code shown to run.</p>';
  h += '<div class="panel">' + progress(all) + '<div class="tools" style="margin:10px 0 0">' +
    firstSelect('decision', 'Every decision', Object.entries(DECISION).filter(([k]) => k !== 'needs_sme')) +
    firstSelect('kind', 'Every kind of rule', KIND_ORDER.map(k => [k, KIND[k]])) +
    firstSelect('confidence', 'Every confidence', [['high', 'High'], ['medium', 'Medium'], ['low', 'Low']]) +
    firstSelect('risk', 'Every risk', [['high', 'High-risk capabilities'], ['medium', 'Medium-risk capabilities'], ['low', 'Low-risk capabilities']]) + '</div></div>';
  firstShown = {};
  for (const g of groups) {
    const done = reviewed(new Set(g.keys)), open = g.keys.length && g.keys.length <= 30;
    firstShown[g.id] = g.keys;
    h += '<details class="panel" data-first-group="' + g.id + '"' + (open ? ' open' : '') + '><summary><b>' + esc(g.title) + '</b> <span class="muted small">' + g.keys.length + ' · ' + done + ' marked</span></summary>' +
      '<p class="small muted">' + esc(g.note) + '</p><div class="first-items">' + (open ? firstItems(g.keys) : g.keys.length ? '' : '<p class="muted">None.</p>') + '</div></details>';
  }

}
// A group's cards are drawn when it is opened: the whole list of a large run is several megabytes of HTML.
let firstShown = {};
function firstItems(keys){
  return keys.slice(0, 200).map(k => {
    const r = ruleByKey[k] || qByKey[k], f = fnById[r.function] || {}, c = itemCap(r);
    return '<p class="small muted" style="margin:12px 0 2px">' + esc(f.name || '') + (c ? ' › ' + c.number + '. ' + esc(c.title) : '') + ' ' + riskTag(c || f) + '</p>' +
      (ruleByKey[k] ? ruleCard(k) : questionCard(k));

function searchPage(q){

  for (const r of business) if ((r.name + ' ' + r.text + ' ' + r.program).toLowerCase().includes(t)) hits.push(['Business rule', r.program, r.name + ': ' + r.text, r.function, null, r.key]);
  for (const x of D.questions) if ((x.code + ' ' + x.text + ' ' + x.owner).toLowerCase().includes(t)) hits.push(['Open question', x.code, x.text, x.function, x.capability, x.key]);
  for (const c of D.capabilities) if ((c.title + ' ' + c.story).toLowerCase().includes(t)) hits.push(['Capability', c.number + '.', c.title, c.function, c.id, null]);

  h += hits.slice(0, 300).map(([type, code, text, fid, cid, key]) => {

    return '<a class="card" style="margin-bottom:8px" href="' + href + '"><div class="head small muted"><span class="tag">' + type + '</span> ' + esc(code) + ' · ' + where(fid, cap) + '</div><div>' + esc(text.length > 300 ? text.slice(0, 297) + '…' : text) + '</div></a>';
  }).join('');
  if (hits.length > 300) h += '<p class="muted">Showing the first 300. Add words to narrow the search.</p>';
  return h;
}

let filters = {};
// One table with a text filter and dropdowns. A dropdown whose options depend on another (capability on function)
// is disabled until that one is chosen.
function filtered(name, rows, spec){
  const st = filters[name] || (filters[name] = {q: ''});
  const q = st.q.toLowerCase();
  const hits = rows.filter(r => (!q || spec.text(r).toLowerCase().includes(q)) && spec.selects.every(([id, , value]) => !st[id] || String(value(r)) === st[id]));
  const selects = spec.selects.map(([id, label, , options]) => {
    const list = options(rows, st);
    return '<select data-table="' + name + '" data-select="' + id + '"' + (list ? '' : ' disabled') + ' aria-label="' + esc(label) + '"><option value="">' +
      esc(list ? label : 'Choose a function first') + '</option>' + (list || []).map(([v, l]) => '<option value="' + esc(v) + '"' + (st[id] === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
  }).join('');
  const any = st.q || spec.selects.some(([id]) => st[id]);
  return '<div class="panel"><div class="tools"><input type="search" data-table="' + name + '" data-select="q" value="' + esc(st.q) + '" placeholder="Filter by words or ID">' + selects +
    (any ? '<button class="btn" data-clear="' + name + '">Clear filters</button>' : '') + '<span class="muted small" style="align-self:center">' + hits.length + ' of ' + rows.length + '</span></div>' +
    '<div class="tablebox"><table class="datatable"><colgroup>' + spec.cols.map(([, w]) => '<col' + (w ? ' style="width:' + w + '"' : '') + '>').join('') + '</colgroup><thead><tr>' +
    spec.cols.map(([c]) => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + hits.map(spec.render).join('') + '</tbody></table>' +
    (hits.length ? '' : '<p class="muted" style="padding:12px">Nothing matches these filters.</p>') + '</div></div>';
}
function refilter(target){
  const name = target.dataset.table, id = target.dataset.select, st = filters[name] || (filters[name] = {q: ''});
  st[id] = target.value;
  if (id === 'fn') st.cap = '';
  const typing = id === 'q', at = target.selectionStart;
  route();
  if (typing) { const again = document.querySelector('input[data-table="' + name + '"]'); if (again) { again.focus(); again.setSelectionRange(at, at); } }
}
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.table && e.target.tagName === 'INPUT') refilter(e.target); });
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.table && e.target.tagName === 'SELECT') refilter(e.target); });
document.addEventListener('click', e => { const b = e.target.closest('[data-clear]'); if (b) { filters[b.dataset.clear] = {q: ''}; route(); } });

// ---- routing ----------------------------------------------------------------------------------------
function route(){
  const parts = (location.hash || '#/').slice(2).split('/'), [kind, a] = parts;
  let h, tech = kind === 'tech', focus = null;
  if (D.reconcile && (kind === 'first' || !location.hash)) h = firstPage();
  else if (kind === 'd' && D.domains[+a]) h = domainPage(D.domains[+a]);
  else if (kind === 'f' && D.functions[+a]) h = functionPage(D.functions[+a]);
  else if (kind === 'c' && D.capabilities[+a]) { focus = parts[2] ? decodeURIComponent(parts.slice(2).join('/')) : null; h = capabilityPage(D.capabilities[+a], focus); }
  else if (kind === 'search' && a) { const q = decodeURIComponent(parts.slice(1).join('/')); if (document.activeElement !== $('search')) $('search').value = q; h = searchPage(q); }
  else if (tech) h = techPage(a || 'requirements');
  else h = overview();
  $('main').innerHTML = h;
  const first = D.reconcile && (kind === 'first' || !location.hash);
  $('vFirst').hidden = !D.reconcile; $('vFirst').classList.toggle('on', first);
  $('vReview').classList.toggle('on', !tech && !first); $('vTech').classList.toggle('on', tech);
  if (focus) { const el = document.getElementById(anchor(focus)); if (el) { const det = el.closest('details'); if (det) det.open = true; el.scrollIntoView({block: 'center'}); el.style.outline = '2px solid var(--accent)'; } }
  else if (!(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.table)) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
let searchTimer;
$('search').addEventListener('input', e => { clearTimeout(searchTimer); const v = e.target.value.trim(); searchTimer = setTimeout(() => { location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/'; }, 250); });
