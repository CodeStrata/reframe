a card only if it matches every valid filter (account filter compared to CARD-ACCT-ID, card filter compared to CARD-NUM, combined with AND).", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-223"], "sources": ["app/cbl/COCRDLIC.cbl:1382-1407"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the account filter and the card number filter are both blank, spaces, low-values or all zeros, the system shall treat them as no filter and list every card in the card file.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-223", "claude/RULE-100", "claude/RULE-101"], "sources": ["app/cbl/COCRDLIC.cbl:1382-1407"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall browse the card file CARDDAT in card-number order by its primary key, so that an account filter is applied by a sequential scan of the file rather than through the CARDAIX account index.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-223"], "sources": ["app/cbl/COCRDLIC.cbl:1382-1407"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If an account filter is supplied that is not numeric, then the system shall raise an input error with message 'ACCOUNT FILTER,IF SUPPLIED MUST BE A 11 DIGIT NUMBER', set the session account to 0, show the field in red with the cursor on it, and protect all selection fields.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-100"], "sources": ["app/cbl/COCRDLIC.cbl:1003-1030"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When a numeric account filter such as '00000000010' is entered, the system shall accept it and store it as the session account.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-100"], "sources": ["app/cbl/COCRDLIC.cbl:1003-1030"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If a card number filter is supplied that is not numeric, then the system shall raise an input error with message 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER' (only if no account error message is already set), set the session card number to 0, show the field in red and protect the selection rows.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-101"], "sources": ["app/cbl/COCRDLIC.cbl:1036-1071"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If either filter is invalid, then the system shall not refresh the list and shall redisplay the screen with the error instead of applying the invalid filter.", "capability": "claude/card/01#1", "function": "claude/card/01", "rules": ["claude/RULE-101", "claude/RULE-223"], "sources": ["app/cbl/COCRDLIC.cbl:1036-1071"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show up to 7 matching cards per page (WS-MAX-SCREEN-LINES = 7), starting with page number 1, and remember the first and last card keys of the page for paging.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-024"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8 and a next page exists, the system shall increase the page number by 1, start browsing at the last-remembered key (greater than or equal), and show up to 7 matching cards.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-024"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When 7 rows have been filled, the system shall read one more record and set the next-page flag only if another record follows the 7th.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-024"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If end of file is reached while reading forward, then the system shall set next page as not available and show 'NO MORE RECORDS TO SHOW', or 'NO RECORDS FOUND FOR THIS SEARCH CONDITION.' when page 1 has zero matches.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-024", "claude/RULE-223"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If any other file response is returned while reading the card file, then the system shall stop the browse and show 'File Error: READ on CARDDAT returned RESP ...'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-024"], "sources": ["app/cbl/COCRDLIC.cbl:1123-1263"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF7 on a page after page 1, the system shall decrease the page number by 1, read backwards from the current page's first card skipping the record at the first key, place the previous 7 matching cards in rows 7 down to 1, and update the first-card key to row 1's card.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-025"], "sources": ["app/cbl/COCRDLIC.cbl:501-513"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When a backward read completes, the system shall set the next-page flag to available.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-025"], "sources": ["app/cbl/COCRDLIC.cbl:501-513"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF7 on page 1, the system shall reread forward from the first key, redisplay page 1 and show 'NO PREVIOUS PAGES TO DISPLAY'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-025", "claude/RULE-249"], "sources": ["app/cbl/COCRDLIC.cbl:501-513", "app/cbl/COCRDLIC.cbl:895-935"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If start-of-file is hit before 7 matches are found while paging back, then the system shall end the backward read with a file error message and partly filled rows.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-025"], "sources": ["app/cbl/COCRDLIC.cbl:501-513"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the last page is reached for the first time, the system shall show the action prompt 'TYPE S FOR DETAIL, U TO UPDATE ANY RECORD' and set the last-page flag to 'shown'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-249"], "sources": ["app/cbl/COCRDLIC.cbl:895-935"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8 again on a last page that has already been shown, the system shall show 'NO MORE PAGES TO DISPLAY'.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-249"], "sources": ["app/cbl/COCRDLIC.cbl:895-935"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If a filter error exists or 'NO RECORDS FOUND' is set, then the system shall suppress the paging and guidance messages.", "capability": "claude/card/01#2", "function": "claude/card/01", "rules": ["claude/RULE-249"], "sources": ["app/cbl/COCRDLIC.cbl:895-935"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept only 'S' (view detail) or 'U' (update) as a row action code, with at most one selected row per page.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-102"], "sources": ["app/cbl/COCRDLIC.cbl:1073-1121"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If more than one row is marked, then the system shall raise the input error 'PLEASE SELECT ONLY ONE RECORD TO VIEW OR UPDATE', highlight the marked rows in red and not navigate.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-102"], "sources": ["app/cbl/COCRDLIC.cbl:1073-1121"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If a row is marked with any code other than 'S' or 'U', then the system shall show 'INVALID ACTION CODE' and flag that row in red.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-102"], "sources": ["app/cbl/COCRDLIC.cbl:1073-1121"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "State-driven", "text": "While a filter error exists, the system shall skip the row selection edit and ignore any selection.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-102", "claude/RULE-170"], "sources": ["app/cbl/COCRDLIC.cbl:1073-1121", "app/cbl/COCRDLIC.cbl:517-569"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with a single valid 'S' selection and the previous program was the card list, the system shall transfer control to COCRDSLC (transaction CCDL, map CCRDSLA) passing that row's account and card number, with from-program COCRDLIC and context 'enter'.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-170"], "sources": ["app/cbl/COCRDLIC.cbl:517-569"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with a single valid 'U' selection and the previous program was the card list, the system shall transfer control to COCRDUPC (transaction CCUP, map CCRDUPA) passing that row's account and card number, with from-program COCRDLIC and context 'enter'.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-170"], "sources": ["app/cbl/COCRDLIC.cbl:517-569"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When control is transferred to the view or update program, the system shall set the user type to 'U'.", "capability": "claude/card/01#3", "function": "claude/card/01", "rules": ["claude/RULE-170"], "sources": ["app/cbl/COCRDLIC.cbl:517-569"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Event-driven", "text": "When the card list is opened with no session data or from another program, the system shall clear the first and last card keys, set the page number to 1, set the last-page flag to 'not shown', list the first page of cards from the beginning of the file, and not read screen input.", "capability": "claude/card/01#4", "function": "claude/card/01", "rules": ["claude/RULE-168"], "sources": ["app/cbl/COCRDLIC.cbl:315-343"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When there is no session data at all, the system shall also set user type 'U' and context 'enter'.", "capability": "claude/card/01#4", "function": "claude/card/01", "rules": ["claude/RULE-168"], "sources": ["app/cbl/COCRDLIC.cbl:315-343"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Event-driven", "text": "When the user returns from the detail or update screen with context 're-enter', the system shall reset paging and list from the start.", "capability": "claude/card/01#4", "function": "claude/card/01", "rules": ["claude/RULE-168"], "sources": ["app/cbl/COCRDLIC.cbl:315-343"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "State-driven", "text": "While the user is not coming from the main menu, the system shall prefill the filter fields from the session account and card.", "capability": "claude/card/01#4", "function": "claude/card/01", "rules": ["claude/RULE-168"], "sources": ["app/cbl/COCRDLIC.cbl:315-343"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall recognise only Enter, PF3, PF7 and PF8 on the card list screen and treat any other key as Enter.", "capability": "claude/card/01#4", "function": "claude/card/01", "rules": ["claude/RULE-169"], "sources": ["app/cbl/COCRDLIC.cbl:370-414"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the card list screen, the system shall transfer control to the main menu program COMEN01C with context 'enter' and message 'PF03 PRESSED.EXITING'.", "capability": "claude/card/01#4", "function": "claude/card/01", "rules": ["claude/RULE-169"], "sources": ["app/cbl/COCRDLIC.cbl:370-414"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Event-driven", "text": "When PF3 is pressed while arriving from another program, the system shall reset and redisplay the list instead of exiting.", "capability": "claude/card/01#4", "function": "claude/card/01", "rules": ["claude/RULE-169"], "sources": ["app/cbl/COCRDLIC.cbl:370-414"], "programs": ["COCRDLIC"]}, {"key": "claude/card/01/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Event-driven", "text": "When any key other than PF8 is pressed, the system shall reset the 'last page shown' flag.", "capability": "claude/card/01#4", "function": "claude/card/01", "rules": ["claude/RULE-169"], "sources": ["app/cbl/COCRDLIC.cbl:370-414"], "programs": ["COCRDLIC"]}, {"key": "claude/card/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the account number is blank, '*', spaces or 00000000000, then the system shall raise an input error, flag the account as blank, show 'Account number not provided' and reset the saved account to 0.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-103"], "sources": ["app/cbl/COCRDSLC.cbl:647-679"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the account number contains a non-digit (including an entry shorter than 11 characters padded with spaces), then the system shall raise an input error, flag the account as invalid (red), show 'ACCOUNT FILTER,IF SUPPLIED MUST BE A 11 DIGIT NUMBER' and reset the saved account to 0.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-103"], "sources": ["app/cbl/COCRDSLC.cbl:647-679"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a valid 11-digit non-zero account number such as 00000000001 is entered, the system shall save it into the shared context.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-103"], "sources": ["app/cbl/COCRDSLC.cbl:647-679"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the card number is blank, '*', spaces or all zeros, then the system shall raise an input error, flag the card as blank, show 'Card number not provided' (if no earlier message) and reset the saved card number to 0.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-104"], "sources": ["app/cbl/COCRDSLC.cbl:685-720"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the card number contains a non-digit, then the system shall raise an input error, flag the card as invalid (red) and show 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER'.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-104"], "sources": ["app/cbl/COCRDSLC.cbl:685-720"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a valid 16-digit non-zero card number is entered, the system shall save it into the shared context.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-104"], "sources": ["app/cbl/COCRDSLC.cbl:685-720"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall keep only the first error message raised by the search criteria edits.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-103", "claude/RULE-104"], "sources": ["app/cbl/COCRDSLC.cbl:647-679"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If both the account field and the card field are blank or '*' when the user presses Enter, then the system shall show 'No input received', mark both fields with '*' in red, and not perform a card lookup.", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-129"], "sources": ["app/cbl/COCRDSLC.cbl:636-640"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "State-driven", "text": "While the user did not arrive from the card list, the system shall show the account and card fields as editable, show any field flagged invalid or blank in red, and place the cursor on the first problem field (account before card).", "capability": "claude/card/02#1", "function": "claude/card/02", "rules": ["claude/RULE-251"], "sources": ["app/cbl/COCRDSLC.cbl:502-531"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the search criteria pass validation, the system shall read the card master (CARDDAT) by the 16-digit card number only, without comparing the entered account to the card record's account.", "capability": "claude/card/02#2", "function": "claude/card/02", "rules": ["claude/RULE-045"], "sources": ["app/cbl/COCRDSLC.cbl:736-773"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the card is found, the system shall show the message '   Displaying requested details' with the embossed name, expiry month and year, and active status.", "capability": "claude/card/02#2", "function": "claude/card/02", "rules": ["claude/RULE-045"], "sources": ["app/cbl/COCRDSLC.cbl:736-773"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the card is not found, then the system shall raise an input error, show both fields in red and show 'Did not find cards for this search condition'.", "capability": "claude/card/02#2", "function": "claude/card/02", "rules": ["claude/RULE-045"], "sources": ["app/cbl/COCRDSLC.cbl:736-773"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the card read fails for any other reason, then the system shall raise an input error and show 'File Error: READ on CARDDAT returned RESP ...,RESP2 ...'.", "capability": "claude/card/02#2", "function": "claude/card/02", "rules": ["claude/RULE-045"], "sources": ["app/cbl/COCRDSLC.cbl:736-773"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the detail screen is sent and the last screen was the card list mapset COCRDLI with caller program COCRDLIC, the system shall show the account and card fields protected (not editable) in the default colour.", "capability": "claude/card/02#2", "function": "claude/card/02", "rules": ["claude/RULE-251"], "sources": ["app/cbl/COCRDSLC.cbl:502-531"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the card detail program (CCDL) is invoked with no carried context, or from the main menu COMEN01C on a non-re-entry, the system shall clear the shared context and show the empty search screen with 'Please enter Account and Card Number'.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/COCRDSLC.cbl:268-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the card detail program is first entered from the card list COCRDLIC, the system shall trust the passed account and card number as already validated, read the card and show its details.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/COCRDSLC.cbl:268-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the card detail program is first entered from any other program, the system shall show the empty search screen.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/COCRDSLC.cbl:268-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the user re-enters the card detail screen, the system shall check the inputs and read the card only if they pass.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-171", "claude/RULE-103", "claude/RULE-104"], "sources": ["app/cbl/COCRDSLC.cbl:268-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send the card detail screen with the state set to re-entry so the next interaction is handled as a re-entry.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/COCRDSLC.cbl:268-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If the program state matches no expected branch, then the system shall show plain text 'UNEXPECTED DATA SCENARIO' and end the conversation.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-171"], "sources": ["app/cbl/COCRDSLC.cbl:268-381"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept only Enter and PF3 on the card detail screen and treat any other key, without an error, as Enter so that the input is re-validated and searched again.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-250"], "sources": ["app/cbl/COCRDSLC.cbl:291-299"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 (or PF15, which is remapped to PF3) on the card detail screen, the system shall transfer control to the calling program and transaction, recording COCRDSLC/CCDL as the sender and marking the target's next entry as a first entry.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-172", "claude/RULE-250"], "sources": ["app/cbl/COCRDSLC.cbl:305-334"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If the caller program or caller transaction is blank or low-values, then the system shall fall back independently to COMEN01C or CM00 respectively.", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-172"], "sources": ["app/cbl/COCRDSLC.cbl:305-334"], "programs": ["COCRDSLC"]}, {"key": "claude/card/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When the user exits the card detail screen, the system shall set the user type to regular user ('U').", "capability": "claude/card/02#3", "function": "claude/card/02", "rules": ["claude/RULE-172"], "sources": ["app/cbl/COCRDSLC.cbl:305-334"], "programs": ["COCRDSLC"]}, {"key": "claude/card/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the embossed card name contains characters other than A-Z, a-z and spaces, then the system shall raise an input error 'Card name can only contain alphabets and spaces'.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-105"], "sources": ["app/cbl/COCRDUPC.cbl:806-843"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the embossed card name is blank, '*' or zeros, then the system shall raise an input error 'Card name not provided'.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-105"], "sources": ["app/cbl/COCRDUPC.cbl:806-843"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall store the embossed name as typed (mixed case allowed, max 50 chars) and upper-case the existing name on read for display and comparison.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-105"], "sources": ["app/cbl/COCRDUPC.cbl:806-843"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the card active status is anything other than uppercase 'Y' or 'N' (including 'y', 'X' or blank), then the system shall raise the input error 'Card Active Status must be Y or N'.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-106"], "sources": ["app/cbl/COCRDUPC.cbl:845-876"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the expiry month is not between 1 and 12 or is blank/zero, then the system shall raise the error 'Card expiry month must be between 1 and 12'.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-107"], "sources": ["app/cbl/COCRDUPC.cbl:877-947"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the expiry year is not between 1950 and 2099 or is blank/zero, then the system shall raise the error 'Invalid card expiry year'.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-107"], "sources": ["app/cbl/COCRDUPC.cbl:877-947"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not allow the expiry day to be edited, keeping it hidden on screen.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-107"], "sources": ["app/cbl/COCRDUPC.cbl:877-947"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the edited name, expiry and status are identical, ignoring case, to the values fetched, the system shall show 'No change detected with respect to values fetched.', skip field edits and not advance to confirmation.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-130"], "sources": ["app/cbl/COCRDUPC.cbl:679-693"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "State-driven", "text": "While the update state is 'N' or 'C', the system shall skip the field edits.", "capability": "claude/card/03#1", "function": "claude/card/03", "rules": ["claude/RULE-130"], "sources": ["app/cbl/COCRDUPC.cbl:679-693"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "State-driven", "text": "While the update state is not fetched and valid keys are entered, the system shall read the card and move to state 'S' (details shown).", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "State-driven", "text": "While in state 'S', when valid non-identical edits are submitted, the system shall move to state 'N' and prompt 'Changes validated.Press F5 to save'; when edits have errors it shall move to state 'E'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept Enter and PF3 in any state, PF5 only when the state is 'N' (changes OK, not confirmed), and PF12 only once card details have been fetched, and treat any other key as Enter.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-224"], "sources": ["app/cbl/COCRDUPC.cbl:413-424"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "State-driven", "text": "While in state 'N', if the user submits without PF5, the system shall stay in state 'N'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF12 after details have been fetched, the system shall discard edits and re-read the card from file.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-224"], "sources": ["app/cbl/COCRDUPC.cbl:413-424"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF5 in state 'N', the system shall re-read the card record with a lock and compare CVV, embossed name (upper-cased), expiry year/month/day and active status to the values originally shown.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-191", "claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:1420-1523"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the record was changed by someone else since it was shown, then the system shall not write, show 'Record changed by some one else. Please review', refresh the displayed old values from file and return to state 'S'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-191", "claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:1420-1523"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the locked read fails, then the system shall show 'Could not lock record for update' and move to state 'L'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-191", "claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:1420-1523"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the rewrite fails, then the system shall show 'Update of record failed' and move to state 'F'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-191", "claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:1420-1523"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the record is unchanged and the rewrite succeeds, the system shall rewrite the card with the expiry written as 'YYYY-MM-DD', commit it, show 'Changes committed to database' and move to state 'C'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-191", "claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:1420-1523", "app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "State-driven", "text": "While in state 'C', 'L' or 'F', on the next interaction the system shall reset the screen and clear the account and card keys, returning to 'not fetched'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the state and key combination matches no defined transition, then the system shall abend with code 0001 'UNEXPECTED DATA SCENARIO'.", "capability": "claude/card/03#2", "function": "claude/card/03", "rules": ["claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3, or the update has completed or failed and the user came from the card list, the system shall commit work with a syncpoint and transfer control to the calling program, defaulting to COMEN01C / CM00 if no caller is known.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-252", "claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:435-476"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When exiting to the caller and the last screen was the card list mapset COCRDLI, the system shall clear the selected account and card.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-252"], "sources": ["app/cbl/COCRDUPC.cbl:435-476"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When changes are saved and there is no calling transaction, the system shall clear the account id, card number and account status in the shared context.", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-137"], "sources": ["app/cbl/COCRDUPC.cbl:948-1027"], "programs": ["COCRDUPC"]}, {"key": "claude/card/03/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When the user exits card update, the system shall set the user type to regular user (CDEMO-USRTYP-USER).", "capability": "claude/card/03#3", "function": "claude/card/03", "rules": ["claude/RULE-252"], "sources": ["app/cbl/COCRDUPC.cbl:435-476"], "programs": ["COCRDUPC"]}, {"key": "claude/txn/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the bill-pay transaction is started with no commarea (session context), then the system shall transfer the user to the COSGN00C sign-on screen.", "capability": "claude/txn/01#1", "function": "claude/txn/01", "rules": ["claude/RULE-247"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the bill-pay screen, the system shall process the payment.", "capability": "claude/txn/01#1", "function": "claude/txn/01", "rules": ["claude/RULE-247"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the bill-pay screen, the system shall return to CDEMO-FROM-PROGRAM, or to COMEN01C if it is blank.", "capability": "claude/txn/01#1", "function": "claude/txn/01", "rules": ["claude/RULE-247"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF4 on the bill-pay screen, the system shall clear all fields.", "capability": "claude/txn/01#1", "function": "claude/txn/01", "rules": ["claude/RULE-247"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the user presses any key other than Enter, PF3 or PF4 on the bill-pay screen, then the system shall show the invalid-key message.", "capability": "claude/txn/01#1", "function": "claude/txn/01", "rules": ["claude/RULE-247"], "sources": ["app/cbl/COBIL00C.cbl:107-144"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When another program passes a pre-selected account in the commarea (CDEMO-CB00-TRN-SELECTED) on first entry, the system shall process that account automatically and show the payment preview.", "capability": "claude/txn/01#1", "function": "claude/txn/01", "rules": ["claude/RULE-135"], "sources": ["app/cbl/COBIL00C.cbl:173-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the account ID field is blank, then the system shall show 'Acct ID can NOT be empty...' and make no payment.", "capability": "claude/txn/01#2", "function": "claude/txn/01", "rules": ["claude/RULE-098"], "sources": ["app/cbl/COBIL00C.cbl:158-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the account ID is not found in the account master or the card cross-reference, then the system shall show 'Account ID NOT found...' and make no payment.", "capability": "claude/txn/01#2", "function": "claude/txn/01", "rules": ["claude/RULE-098"], "sources": ["app/cbl/COBIL00C.cbl:158-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If any other read failure occurs on the account master or the cross-reference, then the system shall show 'Unable to lookup Account...' or 'Unable to lookup XREF AIX file...' and make no payment.", "capability": "claude/txn/01#2", "function": "claude/txn/01", "rules": ["claude/RULE-098"], "sources": ["app/cbl/COBIL00C.cbl:158-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the payment is confirmed, the system shall look up the card cross-reference alternate index CXACAIX by account ID to obtain the card number.", "capability": "claude/txn/01#2", "function": "claude/txn/01", "rules": ["claude/RULE-098", "claude/RULE-222"], "sources": ["app/cbl/COBIL00C.cbl:158-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If the account's current balance is zero or negative (ACCT-CURR-BAL <= 0), then the system shall create no transaction, leave the balance unchanged, and show 'You have nothing to pay...'.", "capability": "claude/txn/01#3", "function": "claude/txn/01", "rules": ["claude/RULE-099", "claude/RULE-006"], "sources": ["app/cbl/COBIL00C.cbl:197-206"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the account is valid and the confirm field is blank, the system shall display the current balance with 'Confirm to make a bill payment...' and post nothing.", "capability": "claude/txn/01#4", "function": "claude/txn/01", "rules": ["claude/RULE-135"], "sources": ["app/cbl/COBIL00C.cbl:173-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the confirm field is 'Y' or 'y', the system shall post the payment.", "capability": "claude/txn/01#4", "function": "claude/txn/01", "rules": ["claude/RULE-135"], "sources": ["app/cbl/COBIL00C.cbl:173-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the confirm field is 'N' or 'n', the system shall clear all fields and post nothing.", "capability": "claude/txn/01#4", "function": "claude/txn/01", "rules": ["claude/RULE-135"], "sources": ["app/cbl/COBIL00C.cbl:173-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the confirm field holds any value other than Y, y, N, n or blank, then the system shall show 'Invalid value. Valid values are (Y/N)...' and post nothing.", "capability": "claude/txn/01#4", "function": "claude/txn/01", "rules": ["claude/RULE-135"], "sources": ["app/cbl/COBIL00C.cbl:173-191"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When a confirmed bill payment is processed, the system shall write a payment transaction whose amount equals the account's current balance (ACCT-CURR-BAL), with no partial or user-entered amount.", "capability": "claude/txn/01#5", "function": "claude/txn/01", "rules": ["claude/RULE-006"], "sources": ["app/cbl/COBIL00C.cbl:224-235"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the payment transaction has been written, the system shall rewrite the account's current balance as ACCT-CURR-BAL - TRAN-AMT.", "capability": "claude/txn/01#5", "function": "claude/txn/01", "rules": ["claude/RULE-006", "claude/RULE-136"], "sources": ["app/cbl/COBIL00C.cbl:224-235", "app/cbl/COBIL00C.cbl:208-244"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall store the payment amount without losing any digit of the account balance, including balances of $1,000,000,000.00 or more (ACCT-CURR-BAL holds 10 integer digits but TRAN-AMT holds only 9).", "capability": "claude/txn/01#5", "function": "claude/txn/01", "rules": ["claude/RULE-006"], "sources": ["app/cbl/COBIL00C.cbl:224-235"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When a bill payment transaction record is built, the system shall set type code '02', category 2, source 'POS TERM' and description 'BILL PAYMENT - ONLINE'.", "capability": "claude/txn/01#6", "function": "claude/txn/01", "rules": ["claude/RULE-222"], "sources": ["app/cbl/COBIL00C.cbl:218-232"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When a bill payment transaction record is built, the system shall set merchant ID 999999999, merchant name 'BILL PAYMENT', and merchant city and zip 'N/A'.", "capability": "claude/txn/01#6", "function": "claude/txn/01", "rules": ["claude/RULE-222"], "sources": ["app/cbl/COBIL00C.cbl:218-232"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When a bill payment transaction record is built, the system shall use the account's linked card number from the first cross-reference record found for the account via the alternate index.", "capability": "claude/txn/01#6", "function": "claude/txn/01", "rules": ["claude/RULE-222"], "sources": ["app/cbl/COBIL00C.cbl:218-232"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When a bill payment transaction record is built, the system shall set both the origination and processing timestamps to the current time formatted YYYY-MM-DD HH:MM:SS with microseconds zeroed.", "capability": "claude/txn/01#6", "function": "claude/txn/01", "rules": ["claude/RULE-222"], "sources": ["app/cbl/COBIL00C.cbl:218-232"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall store the bill payment amount as a positive value equal to the balance.", "capability": "claude/txn/01#6", "function": "claude/txn/01", "rules": ["claude/RULE-222"], "sources": ["app/cbl/COBIL00C.cbl:218-232"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When the bill payment transaction is built, the system shall assign it the next transaction ID after the last transaction ID on file.", "capability": "claude/txn/01#6", "function": "claude/txn/01", "rules": ["claude/RULE-136", "claude/RULE-031"], "sources": ["app/cbl/COBIL00C.cbl:208-244"], "programs": ["COBIL00C", "COTRN02C"]}, {"key": "claude/txn/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When a confirmed payment is posted, the system shall read the cross-reference, find the last transaction ID, build the record, write it to TRANSACT, reduce the balance by the amount, and rewrite ACCTDAT, in that sequence.", "capability": "claude/txn/01#7", "function": "claude/txn/01", "rules": ["claude/RULE-136"], "sources": ["app/cbl/COBIL00C.cbl:208-244"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Unwanted", "text": "If the payment transaction write fails (for example with a duplicate key) or the cross-reference lookup fails, then the system shall post nothing and leave the account balance unchanged.", "capability": "claude/txn/01#7", "function": "claude/txn/01", "rules": ["claude/RULE-136"], "sources": ["app/cbl/COBIL00C.cbl:208-244"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If the account rewrite fails, then the system shall show 'Unable to Update Account...'.", "capability": "claude/txn/01#7", "function": "claude/txn/01", "rules": ["claude/RULE-136"], "sources": ["app/cbl/COBIL00C.cbl:208-244"], "programs": ["COBIL00C"]}, {"key": "claude/txn/01/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When the payment is posted successfully, the system shall clear the screen fields and show 'Payment successful.  Your Transaction ID is <id>.' in green.", "capability": "claude/txn/01#7", "function": "claude/txn/01", "rules": ["claude/RULE-136"], "sources": ["app/cbl/COBIL00C.cbl:208-244"], "programs": ["COBIL00C"]}, {"key": "claude/txn/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the transaction list (CT00) is started with no commarea (EIBCALEN = 0), then the system shall transfer the user to COSGN00C sign-on.", "capability": "claude/txn/02#1", "function": "claude/txn/02", "rules": ["claude/RULE-179"], "sources": ["app/cbl/COTRN00C.cbl:107-141"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the transaction list is entered for the first time, the system shall set the context to re-enter (1), clear the screen and load page 1 from the start of the file.", "capability": "claude/txn/02#1", "function": "claude/txn/02", "rules": ["claude/RULE-179"], "sources": ["app/cbl/COTRN00C.cbl:107-141"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses a key on the redisplayed list, the system shall run search/selection on Enter, transfer to COMEN01C on PF3, page back on PF7 and page forward on PF8.", "capability": "claude/txn/02#1", "function": "claude/txn/02", "rules": ["claude/RULE-179"], "sources": ["app/cbl/COTRN00C.cbl:107-141"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed on the transaction list, then the system shall show the generic invalid-key message, re-send the screen and leave paging state unchanged.", "capability": "claude/txn/02#1", "function": "claude/txn/02", "rules": ["claude/RULE-179"], "sources": ["app/cbl/COTRN00C.cbl:107-141"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall preserve the first and last transaction ID on the page, the page number and the next-page flag between screens of the transaction list.", "capability": "claude/txn/02#1", "function": "claude/txn/02", "rules": ["claude/RULE-179"], "sources": ["app/cbl/COTRN00C.cbl:107-141"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall list transactions from the TRANSACT file in transaction-ID order to any signed-on user, with no filter on the user's account, card, customer or user type.", "capability": "claude/txn/02#2", "function": "claude/txn/02", "rules": ["claude/RULE-228"], "sources": ["app/cbl/COTRN00C.cbl:591-600"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the search Tran ID field is blank, the system shall start the list at the beginning of the transaction file.", "capability": "claude/txn/02#3", "function": "claude/txn/02", "rules": ["claude/RULE-114"], "sources": ["app/cbl/COTRN00C.cbl:206-229"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When a numeric Tran ID is entered and Enter is pressed, the system shall start the browse at that key (or the next higher key), reset the page number and show the first page as page 1.", "capability": "claude/txn/02#3", "function": "claude/txn/02", "rules": ["claude/RULE-114"], "sources": ["app/cbl/COTRN00C.cbl:206-229"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the search Tran ID is not numeric, then the system shall show 'Tran ID must be Numeric ...' and load no list.", "capability": "claude/txn/02#3", "function": "claude/txn/02", "rules": ["claude/RULE-114"], "sources": ["app/cbl/COTRN00C.cbl:206-229"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show transactions in transaction-ID order, 10 per page.", "capability": "claude/txn/02#4", "function": "claude/txn/02", "rules": ["claude/RULE-029"], "sources": ["app/cbl/COTRN00C.cbl:279-328"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8 and the next-page flag is Y, the system shall show the next 10 transactions after the last one shown and increase the page number by one.", "capability": "claude/txn/02#4", "function": "claude/txn/02", "rules": ["claude/RULE-029"], "sources": ["app/cbl/COTRN00C.cbl:279-328"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When a page is loaded, the system shall read one extra record to decide whether a next page exists and set the next-page flag to Y or N accordingly.", "capability": "claude/txn/02#4", "function": "claude/txn/02", "rules": ["claude/RULE-029"], "sources": ["app/cbl/COTRN00C.cbl:279-328"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the page has exactly 10 rows and the look-ahead finds end-of-file, the system shall set the next-page flag to N and show 'You have reached the bottom of the page...'.", "capability": "claude/txn/02#4", "function": "claude/txn/02", "rules": ["claude/RULE-029"], "sources": ["app/cbl/COTRN00C.cbl:279-328"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF8 while the next-page flag is N, then the system shall perform no browse, show 'You are already at the bottom of the page...' and redisplay the screen without erasing the current rows.", "capability": "claude/txn/02#4", "function": "claude/txn/02", "rules": ["claude/RULE-115"], "sources": ["app/cbl/COTRN00C.cbl:257-274"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF7 on a page above page 1, the system shall show the previous 10 transactions, lower the page number by one (never below 1) and set the next-page flag to Y.", "capability": "claude/txn/02#4", "function": "claude/txn/02", "rules": ["claude/RULE-028"], "sources": ["app/cbl/COTRN00C.cbl:234-376"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the user presses PF7 on page 1 (or page 0), then the system shall show 'You are already at the top of the page...' without erasing the screen.", "capability": "claude/txn/02#4", "function": "claude/txn/02", "rules": ["claude/RULE-028"], "sources": ["app/cbl/COTRN00C.cbl:234-376"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If start-of-file is hit while filling a previous page, then the system shall show 'You have reached the top of the page...'.", "capability": "claude/txn/02#4", "function": "claude/txn/02", "rules": ["claude/RULE-028"], "sources": ["app/cbl/COTRN00C.cbl:234-376"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show each listed transaction with its ID, its origination date as MM/DD/YY, its description, and its amount as a signed number with 2 decimals (edit mask +99999999.99).", "capability": "claude/txn/02#5", "function": "claude/txn/02", "rules": ["claude/RULE-041"], "sources": ["app/cbl/COTRN00C.cbl:381-388"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall display transaction amounts of 100,000,000.00 or more without losing the leading digit.", "capability": "claude/txn/02#5", "function": "claude/txn/02", "rules": ["claude/RULE-041", "claude/RULE-042"], "sources": ["app/cbl/COTRN00C.cbl:381-388", "app/cbl/COTRN01C.cbl:176-183"], "programs": ["COTRN00C", "COTRN01C"]}, {"key": "claude/txn/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the user types 'S' or 's' next to a listed row that holds a transaction ID and presses Enter, the system shall store the selected transaction ID and transfer to the transaction detail view (COTRN01C).", "capability": "claude/txn/02#6", "function": "claude/txn/02", "rules": ["claude/RULE-113"], "sources": ["app/cbl/COTRN00C.cbl:148-204"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When more than one row is marked, the system shall act only on the first marked row (lowest row number).", "capability": "claude/txn/02#6", "function": "claude/txn/02", "rules": ["claude/RULE-113"], "sources": ["app/cbl/COTRN00C.cbl:148-204"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the selection code is anything other than 'S' or 's', then the system shall show 'Invalid selection. Valid value is S' and redisplay the list.", "capability": "claude/txn/02#6", "function": "claude/txn/02", "rules": ["claude/RULE-113"], "sources": ["app/cbl/COTRN00C.cbl:148-204"], "programs": ["COTRN00C"]}, {"key": "claude/txn/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the view screen is entered for the first time with a selected transaction ID from the transaction list, the system shall copy the ID into the input field and look up and display it immediately.", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-180"], "sources": ["app/cbl/COTRN01C.cbl:94-109"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When the view screen is entered for the first time with no selected transaction ID, the system shall show an empty view screen.", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-180"], "sources": ["app/cbl/COTRN01C.cbl:94-109"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Unwanted", "text": "If the view screen is entered with no session context (EIBCALEN = 0), then the system shall transfer the user to COSGN00C sign-on.", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-180"], "sources": ["app/cbl/COTRN01C.cbl:94-109"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Unwanted", "text": "If the user presses Enter with the Transaction ID field blank, then the system shall perform no lookup, show 'Tran ID can NOT be empty...' and place the cursor on the Transaction ID field.", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-116"], "sources": ["app/cbl/COTRN01C.cbl:144-156"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Event-driven", "text": "When a non-blank Transaction ID is entered, the system shall clear previously displayed detail fields before the lookup.", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-116"], "sources": ["app/cbl/COTRN01C.cbl:144-156"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When the Transaction ID is found in TRANSACT by exact key, the system shall show transaction ID, card number, type code, category code, source, amount, description, original and processed timestamps, and merchant ID/name/city/zip.", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-117"], "sources": ["app/cbl/COTRN01C.cbl:267-296"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the transaction amount with an explicit sign and two decimals (edit mask +99999999.99).", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-042"], "sources": ["app/cbl/COTRN01C.cbl:176-183"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Unwanted", "text": "If the Transaction ID is not found, then the system shall show 'Transaction ID NOT found...' and leave the detail fields blank.", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-117"], "sources": ["app/cbl/COTRN01C.cbl:267-296"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Unwanted", "text": "If any other file error occurs on lookup, then the system shall show 'Unable to lookup Transaction...' and write the RESP/RESP2 codes to the system log.", "capability": "claude/txn/02#7", "function": "claude/txn/02", "rules": ["claude/RULE-117"], "sources": ["app/cbl/COTRN01C.cbl:267-296"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the view screen, the system shall return to the calling program, or to the COMEN01C main menu if the caller is unknown.", "capability": "claude/txn/02#8", "function": "claude/txn/02", "rules": ["claude/RULE-254"], "sources": ["app/cbl/COTRN01C.cbl:110-134"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF4 on the view screen, the system shall clear all input/display fields and the message.", "capability": "claude/txn/02#8", "function": "claude/txn/02", "rules": ["claude/RULE-254"], "sources": ["app/cbl/COTRN01C.cbl:110-134"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF5 on the view screen, the system shall transfer to the COTRN00C transaction list.", "capability": "claude/txn/02#8", "function": "claude/txn/02", "rules": ["claude/RULE-254"], "sources": ["app/cbl/COTRN01C.cbl:110-134"], "programs": ["COTRN01C"]}, {"key": "claude/txn/02/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed on the view screen, then the system shall show 'Invalid key pressed. Please see below...'.", "capability": "claude/txn/02#8", "function": "claude/txn/02", "rules": ["claude/RULE-254"], "sources": ["app/cbl/COTRN01C.cbl:110-134"], "programs": ["COTRN01C"]}, {"key": "claude/txn/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the add-transaction screen (CT02) is entered with a commarea length of 0, then the system shall redirect the user to COSGN00C sign-on.", "capability": "claude/txn/03#1", "function": "claude/txn/03", "rules": ["claude/RULE-186"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the screen is entered for the first time with a selected value (CDEMO-CT02-TRN-SELECTED), the system shall pre-fill it into the Card Number field and process the entry.", "capability": "claude/txn/03#1", "function": "claude/txn/03", "rules": ["claude/RULE-186"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3, the system shall return to the calling program (COMEN01C if no caller is recorded).", "capability": "claude/txn/03#1", "function": "claude/txn/03", "rules": ["claude/RULE-186"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF4, the system shall clear the screen.", "capability": "claude/txn/03#1", "function": "claude/txn/03", "rules": ["claude/RULE-186"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If any key other than Enter, PF3, PF4 or PF5 is pressed, then the system shall reject it with the invalid-key message.", "capability": "claude/txn/03#1", "function": "claude/txn/03", "rules": ["claude/RULE-186"], "sources": ["app/cbl/COTRN02C.cbl:115-154"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If both the Account ID and Card Number are blank, then the system shall show 'Account or Card Number must be entered...'.", "capability": "claude/txn/03#2", "function": "claude/txn/03", "rules": ["claude/RULE-118"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When an Account ID is entered, the system shall look it up in the card cross-reference by account (CXACAIX) and fill the card number field with the linked card number, even if a card number was also typed.", "capability": "claude/txn/03#2", "function": "claude/txn/03", "rules": ["claude/RULE-118"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When only a Card Number is entered, the system shall look it up in the card cross-reference (CCXREF) and fill in the account ID.", "capability": "claude/txn/03#2", "function": "claude/txn/03", "rules": ["claude/RULE-118"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the Account ID is not numeric, then the system shall show 'Account ID must be Numeric...'; if the Card Number is not numeric, then it shall show 'Card Number must be Numeric...'.", "capability": "claude/txn/03#2", "function": "claude/txn/03", "rules": ["claude/RULE-118"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the Account ID is not found in the cross-reference, then the system shall show 'Account ID NOT found...' and save nothing.", "capability": "claude/txn/03#2", "function": "claude/txn/03", "rules": ["claude/RULE-118"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If any other file error occurs on the lookup, then the system shall show 'Unable to lookup Acct in XREF AIX file...' or 'Unable to lookup Card # in XREF file...'.", "capability": "claude/txn/03#2", "function": "claude/txn/03", "rules": ["claude/RULE-118"], "sources": ["app/cbl/COTRN02C.cbl:193-230"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If any of Type CD, Category CD, Source, Description, Amount, Orig Date, Proc Date, Merchant ID, Merchant Name, Merchant City or Merchant Zip is empty, then the system shall report the first empty field in that order, place the cursor on it and save nothing.", "capability": "claude/txn/03#3", "function": "claude/txn/03", "rules": ["claude/RULE-119"], "sources": ["app/cbl/COTRN02C.cbl:251-337"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If Type CD, Category CD or Merchant ID is not numeric, then the system shall report the error and save nothing.", "capability": "claude/txn/03#3", "function": "claude/txn/03", "rules": ["claude/RULE-119"], "sources": ["app/cbl/COTRN02C.cbl:251-337"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the amount is not entered as a sign, 8 digits, a decimal point and 2 decimals, then the system shall show 'Amount should be in format -99999999.99'.", "capability": "claude/txn/03#3", "function": "claude/txn/03", "rules": ["claude/RULE-030"], "sources": ["app/cbl/COTRN02C.cbl:339-386"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When a correctly formatted amount is entered, the system shall convert it to a signed number with two decimal places and redisplay it with the +99999999.99 edit pattern.", "capability": "claude/txn/03#3", "function": "claude/txn/03", "rules": ["claude/RULE-030"], "sources": ["app/cbl/COTRN02C.cbl:339-386"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the original date or processing date is not in the form YYYY-MM-DD or is not a real calendar date according to the shared date utility (CSUTLDTC), then the system shall show the date error (for example 'Orig Date - Not a valid date...') and save nothing.", "capability": "claude/txn/03#3", "function": "claude/txn/03", "rules": ["claude/RULE-120"], "sources": ["app/cbl/COTRN02C.cbl:353-427"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the date utility reports a date as outside its supported range (message 2513), the system shall accept the date.", "capability": "claude/txn/03#3", "function": "claude/txn/03", "rules": ["claude/RULE-120"], "sources": ["app/cbl/COTRN02C.cbl:353-427"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall run all validations before the confirmation check, so a data error is reported even if Confirm = Y.", "capability": "claude/txn/03#4", "function": "claude/txn/03", "rules": ["claude/RULE-229"], "sources": ["app/cbl/COTRN02C.cbl:164-188"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When all fields are valid and Confirm is 'N', 'n', blank or low-values, the system shall show 'Confirm to add this transaction...' and write nothing.", "capability": "claude/txn/03#4", "function": "claude/txn/03", "rules": ["claude/RULE-229"], "sources": ["app/cbl/COTRN02C.cbl:164-188"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When all fields are valid and Confirm is 'Y' or 'y', the system shall add the transaction.", "capability": "claude/txn/03#4", "function": "claude/txn/03", "rules": ["claude/RULE-229"], "sources": ["app/cbl/COTRN02C.cbl:164-188"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If Confirm holds any other value, then the system shall show 'Invalid value. Valid values are (Y/N)...'.", "capability": "claude/txn/03#4", "function": "claude/txn/03", "rules": ["claude/RULE-229"], "sources": ["app/cbl/COTRN02C.cbl:164-188"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When a confirmed transaction is added, the system shall assign the highest existing transaction ID plus one as a 16-digit, zero-padded ID, or 0000000000000001 if the file is empty.", "capability": "claude/txn/03#5", "function": "claude/txn/03", "rules": ["claude/RULE-031"], "sources": ["app/cbl/COTRN02C.cbl:442-451"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When confirmed, the system shall build a new transaction record from the screen (type, category, source, description, amount, card, merchant details, origination and processing dates) and write it to TRANSACT.", "capability": "claude/txn/03#5", "function": "claude/txn/03", "rules": ["claude/RULE-138"], "sources": ["app/cbl/COTRN02C.cbl:442-466"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When the record is written successfully, the system shall clear the screen and show, in green, 'Transaction added successfully.  Your Tran ID is <id>.'", "capability": "claude/txn/03#5", "function": "claude/txn/03", "rules": ["claude/RULE-138"], "sources": ["app/cbl/COTRN02C.cbl:442-466"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Unwanted", "text": "If the write fails with DUPKEY/DUPREC, then the system shall show 'Tran ID already exist...'; on any other write error it shall show 'Unable to Add Transaction...'.", "capability": "claude/txn/03#5", "function": "claude/txn/03", "rules": ["claude/RULE-138", "claude/RULE-031"], "sources": ["app/cbl/COTRN02C.cbl:442-466"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If the transaction-file browse start fails with NOTFND while finding the last ID, then the system shall show 'Transaction ID NOT found...'.", "capability": "claude/txn/03#5", "function": "claude/txn/03", "rules": ["claude/RULE-031"], "sources": ["app/cbl/COTRN02C.cbl:442-451"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall assign transaction IDs so that two users adding at the same time do not compute the same ID.", "capability": "claude/txn/03#5", "function": "claude/txn/03", "rules": ["claude/RULE-031"], "sources": ["app/cbl/COTRN02C.cbl:442-451"], "programs": ["COTRN02C"]}, {"key": "claude/txn/03/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses PF5, the system shall validate the key fields, copy the detail fields (type, category, source, amount, description, dates, merchant) of the highest TRAN-ID in TRANSACT into the screen, keep the card or account on the screen, and run normal Enter processing (posting only if Confirm = Y).", "capability": "claude/txn/03#6", "function": "claude/txn/03", "rules": ["claude/RULE-255"], "sources": ["app/cbl/COTRN02C.cbl:471-495"], "programs": ["COTRN02C"]}, {"key": "claude/report/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the report screen (transaction CR00) is started without a communication area, then the system shall pass control to the sign-on program COSGN00C.", "capability": "claude/report/01#1", "function": "claude/report/01", "rules": ["claude/RULE-185"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the report screen is first entered with session context, the system shall show an empty report screen.", "capability": "claude/report/01#1", "function": "claude/report/01", "rules": ["claude/RULE-185"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the report screen, the system shall transfer control to the main menu program COMEN01C.", "capability": "claude/report/01#1", "function": "claude/report/01", "rules": ["claude/RULE-185"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the report screen, the system shall run report processing.", "capability": "claude/report/01#1", "function": "claude/report/01", "rules": ["claude/RULE-185"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the user presses any key other than Enter or PF3 on the report screen, then the system shall show the invalid-key message.", "capability": "claude/report/01#1", "function": "claude/report/01", "rules": ["claude/RULE-185"], "sources": ["app/cbl/CORPT00C.cbl:172-197"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If no target program is set when returning from the report screen, then the system shall default to COSGN00C.", "capability": "claude/report/01#1", "function": "claude/report/01", "rules": ["claude/RULE-185"], "sources": ["app/cbl/CORPT00C.cbl:542-544"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall let the user select one of three transaction report types: Monthly, Yearly or Custom.", "capability": "claude/report/01#2", "function": "claude/report/01", "rules": ["claude/RULE-226"], "sources": ["app/cbl/CORPT00C.cbl:212-256"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat a report type selector that holds any non-blank character as selected.", "capability": "claude/report/01#2", "function": "claude/report/01", "rules": ["claude/RULE-226"], "sources": ["app/cbl/CORPT00C.cbl:212-256"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter with more than one report type marked, the system shall process only the first one in the order Monthly, Yearly, Custom.", "capability": "claude/report/01#2", "function": "claude/report/01", "rules": ["claude/RULE-226"], "sources": ["app/cbl/CORPT00C.cbl:212-256"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If all three report type selectors are blank or low-values, then the system shall show 'Select a report type to print report...' and put the cursor on the Monthly field.", "capability": "claude/report/01#2", "function": "claude/report/01", "rules": ["claude/RULE-226"], "sources": ["app/cbl/CORPT00C.cbl:212-256"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the user selects Monthly and confirms, the system shall set the start date to the 1st of the current calendar month and the end date to the last day of that month, based on the system date.", "capability": "claude/report/01#2", "function": "claude/report/01", "rules": ["claude/RULE-026"], "sources": ["app/cbl/CORPT00C.cbl:213-238"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the system calculates the Monthly end date, it shall take the first day of the next month and subtract one day, rolling December over to January of the next year.", "capability": "claude/report/01#2", "function": "claude/report/01", "rules": ["claude/RULE-026"], "sources": ["app/cbl/CORPT00C.cbl:213-238"], "programs": ["CORPT00C"]}, {"key": "claude/report/01/REQ-F-013", "code": "REQ-F-013", "kind":
