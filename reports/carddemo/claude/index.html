expert", "unverified": false, "capability": "claude/txntype/03#5", "function": "claude/txntype/03", "rule": "RULE-161"}, {"key": "claude/mqinquiry/01/OQ-001", "code": "OQ-001", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business SME", "unverified": false, "capability": "claude/mqinquiry/01#1", "function": "claude/mqinquiry/01", "rule": "RULE-050"}, {"key": "claude/mqinquiry/01/OQ-002", "code": "OQ-002", "text": "Should inactive/closed accounts (ACCT-ACTIVE-STATUS not 'Y') still be disclosed through this MQ inquiry, and do consumers expect amounts in raw zoned-decimal form (implied 2 decimals, overpunched sign)?", "owner": "Business SME", "unverified": false, "capability": "claude/mqinquiry/01#2", "function": "claude/mqinquiry/01", "rule": "RULE-204"}, {"key": "claude/mqinquiry/01/OQ-003", "code": "OQ-003", "text": "Should replies honour the requester's ReplyToQ (MQMD-REPLYTOQ), or is the fixed CARD.DEMO.REPLY.ACCT queue the intended contract for all callers?", "owner": "Integration architect", "unverified": false, "capability": "claude/mqinquiry/01#4", "function": "claude/mqinquiry/01", "rule": "RULE-225"}, {"key": "claude/mqinquiry/02/OQ-001", "code": "OQ-001", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business SME", "unverified": false, "capability": "claude/mqinquiry/02#1", "function": "claude/mqinquiry/02", "rule": "RULE-005"}, {"key": "claude/mqinquiry/02/OQ-002", "code": "OQ-002", "text": "Should the date service check the function code (for example accept only one value) or the account key before replying, or is an unconditional date/time reply the intended contract? Was the unused ACCTDAT reference meant to become an account lookup?", "owner": "Business SME", "unverified": false, "capability": "claude/mqinquiry/02#1", "function": "claude/mqinquiry/02", "rule": "RULE-073"}, {"key": "claude/mqinquiry/02/OQ-003", "code": "OQ-003", "text": "Should replies honor the requester's ReplyToQ, or is the single fixed reply queue CARD.DEMO.REPLY.DATE the agreed contract? Do consumers match replies on CorrelId or on MsgId?", "owner": "Integration architect", "unverified": false, "capability": "claude/mqinquiry/02#2", "function": "claude/mqinquiry/02", "rule": "RULE-226"}, {"key": "claude/mqinquiry/03/OQ-001", "code": "OQ-001", "text": "Is it acceptable that a close failure re-enters termination without resetting the open flags (possible recursion), and should close errors for the reply queue name the reply queue?", "owner": "Technical lead", "unverified": false, "capability": "claude/mqinquiry/03#2", "function": "claude/mqinquiry/03", "rule": "RULE-195"}, {"key": "claude/mqinquiry/03/OQ-002", "code": "OQ-002", "text": "On a file error, should the request be backed out (rolled back to the input queue) or should the requester receive an error reply? Currently the normal RETURN appears to commit the GET, losing the request.", "owner": "Business SME", "unverified": false, "capability": "claude/mqinquiry/03#3", "function": "claude/mqinquiry/03", "rule": "RULE-163"}, {"key": "claude/mqinquiry/03/OQ-003", "code": "OQ-003", "text": "When a reply cannot be sent, should the request be backed out (rolled back to the input queue) rather than committed along with the error record?", "owner": "Business SME", "unverified": false, "capability": "claude/mqinquiry/03#4", "function": "claude/mqinquiry/03", "rule": "RULE-227"}, {"key": "claude/pendauth/01/OQ-001", "code": "OQ-001", "text": "Should an unknown card always be declined (05/3100)? Can production show approvals for cards not in the cross-reference when they follow a valid message in the same run?", "owner": "Card authorization product owner", "unverified": false, "capability": "claude/pendauth/01#2", "function": "claude/pendauth/01", "rule": "RULE-060"}, {"key": "claude/pendauth/01/OQ-002", "code": "OQ-002", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business rules reviewer", "unverified": false, "capability": "claude/pendauth/01#3", "function": "claude/pendauth/01", "rule": "RULE-002"}, {"key": "claude/pendauth/01/OQ-003", "code": "OQ-003", "text": "Is resetting the cash balance to 0 on every approval intended? Should the declined amount be the current request amount?", "owner": "Credit risk manager", "unverified": false, "capability": "claude/pendauth/01#5", "function": "claude/pendauth/01", "rule": "RULE-003"}, {"key": "claude/pendauth/02/OQ-001", "code": "OQ-001", "text": "Should an account, cross-reference or customer not found stop the inquiry and block the authorization list, the way system errors do?", "owner": "Customer service operations lead", "unverified": false, "capability": "claude/pendauth/02#1", "function": "claude/pendauth/02", "rule": "RULE-064"}, {"key": "claude/pendauth/02/OQ-002", "code": "OQ-002", "text": "Is PF7 supposed to return reliably to earlier pages, including page 1? Has the page counter or loop behaviour been seen in production, or should the rewrite fix the off-by-one?", "owner": "Customer service operations lead", "unverified": false, "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rule": "RULE-153"}, {"key": "claude/pendauth/02/OQ-003", "code": "OQ-003", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business rules reviewer", "unverified": false, "capability": "claude/pendauth/02#3", "function": "claude/pendauth/02", "rule": "RULE-004"}, {"key": "claude/pendauth/02/OQ-004", "code": "OQ-004", "text": "COPAUS1C never sets PA-FRAUD-RPT-DATE. Is it filled by COPAUS2C on the returned record, and when fraud is removed should the date be the removal date or the original report date?", "owner": "Fraud operations lead", "unverified": false, "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rule": "RULE-038"}, {"key": "claude/pendauth/02/OQ-005", "code": "OQ-005", "text": "The detail key is made of packed date/time fields named '-9C' (CIPAUDTY.cpy:19-21), which suggests a complement value that sorts newest first. Does 'next' mean the next older authorization?", "owner": "Customer service operations lead", "unverified": false, "capability": "claude/pendauth/02#6", "function": "claude/pendauth/02", "rule": "RULE-193"}, {"key": "claude/pendauth/03/OQ-001", "code": "OQ-001", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business rules reviewer", "unverified": false, "capability": "claude/pendauth/03#1", "function": "claude/pendauth/03", "rule": "RULE-136"}, {"key": "claude/pendauth/03/OQ-002", "code": "OQ-002", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business rules reviewer", "unverified": false, "capability": "claude/pendauth/03#2", "function": "claude/pendauth/03", "rule": "RULE-137"}, {"key": "claude/pendauth/04/OQ-001", "code": "OQ-001", "text": "Should expiry be measured in true calendar days (handling year rollover), and should matched, declined or fraud-flagged authorizations be retained longer than pending ones?", "owner": "Credit risk manager", "unverified": false, "capability": "claude/pendauth/04#2", "function": "claude/pendauth/04", "rule": "RULE-001"}, {"key": "claude/pendauth/04/OQ-002", "code": "OQ-002", "text": "Should the summary segment be rewritten with the reduced approved/declined counts and amounts after expired details are purged, or are these totals recalculated elsewhere?", "owner": "Credit risk manager", "unverified": false, "capability": "claude/pendauth/04#3", "function": "claude/pendauth/04", "rule": "RULE-016"}, {"key": "claude/pendauth/04/OQ-003", "code": "OQ-003", "text": "Confirm the summary should be deleted only when both approved and declined pending counts are zero.", "owner": "Credit risk manager", "unverified": false, "capability": "claude/pendauth/04#3", "function": "claude/pendauth/04", "rule": "RULE-151"}, {"key": "claude/pendauth/04/OQ-004", "code": "OQ-004", "text": "Is the checkpoint interval intended to be every N summaries (>=) rather than N+1 (>), and is the alphanumeric/numeric comparison of P-CHKP-FREQ behaving as intended on the target compiler?", "owner": "Batch operations lead", "unverified": false, "capability": "claude/pendauth/04#4", "function": "claude/pendauth/04", "rule": "RULE-254"}, {"key": "claude/pendauth/05/OQ-001", "code": "OQ-001", "text": "Should the unload apply any expiry or age filter (P-EXPIRY-DAYS), and should it report reconciled summary and detail counts (including skipped non-numeric accounts) as an audit control?", "owner": "Data operations lead", "unverified": false, "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rule": "RULE-039"}, {"key": "claude/pendauth/05/OQ-002", "code": "OQ-002", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business rules reviewer", "unverified": false, "capability": "claude/pendauth/05#1", "function": "claude/pendauth/05", "rule": "RULE-047"}, {"key": "claude/pendauth/05/OQ-003", "code": "OQ-003", "text": "Should a detail whose parent summary is not in the database (an orphan) stop the reload, go to a reject file, or be skipped silently as it is today? And should duplicate details (status II) be skipped, or replace the existing record?", "owner": "Data operations lead", "unverified": false, "capability": "claude/pendauth/05#2", "function": "claude/pendauth/05", "rule": "RULE-138"}, {"key": "claude/common/01/OQ-001", "code": "OQ-001", "text": "What do the output-type codes mean? The guard rejects type-1-in/type-2-out and type-2-in/type-1-out, which reads as 'output type must not equal the opposite code'. Is the output type meant to be the target format (in which case these pairs are the valid conversions and the logic is inverted) or the source format echoed back?", "owner": "Business analyst / application SME", "unverified": false, "capability": "claude/common/01#2", "function": "claude/common/01", "rule": "RULE-074"}, {"key": "claude/common/02/OQ-001", "code": "OQ-001", "text": "P0 panel produced no verdict for this rule (run capacity exhausted or judges unavailable) \u2014 confirm it is critical (core purpose, money, regulation, data integrity, safety), and that the Given/When/Then matches the cited code.", "owner": "Business rules owner / application SME", "unverified": false, "capability": "claude/common/02#1", "function": "claude/common/02", "rule": "RULE-059"}, {"key": "claude/common/02/OQ-002", "code": "OQ-002", "text": "Do any callers depend on RETURN-CODE rather than the '0000' severity text? Is the echoed 'TstDate' value in the result (taken from the variable-length structure, length prefix included) ever shown to users or parsed?", "owner": "Application SME", "unverified": false, "capability": "claude/common/02#2", "function": "claude/common/02", "rule": "RULE-253"}, {"key": "claude/common/03/OQ-001", "code": "OQ-001", "text": "Is the wait a business requirement (for example letting another file or job finish before the next step), or only a technical pacing step? What is the largest allowed delay?", "owner": "Batch operations / business SME", "unverified": false, "capability": "claude/common/03#1", "function": "claude/common/03", "rule": "RULE-259"}, {"key": "claude/common/03/OQ-002", "code": "OQ-002", "text": "Does the job always supply an 8-digit, zero-padded centisecond value on SYSIN, and what upper limit (if any) should the rewrite enforce? Should non-numeric or blank input stop the job with an error instead of passing an und\u2026", "owner": "Batch operations", "unverified": false, "capability": "claude/common/03#1", "function": "claude/common/03", "rule": "RULE-259"}], "data_model": "", "sections": [{"title": "Assessment: summary", "html": "<h2>Assessment: carddemo-p2<\/h2>\n<p><em>Assessed 2026-11-23 from the read-only snapshot at <code>legacy/carddemo-p2<\/code> (SHA-256 <code>d9a77d54\u2026b402541a<\/code>, per <code>INTENT.md<\/code>). Paths below are relative to <code>legacy/carddemo-p2/<\/code>.<\/em><\/p>", "open": true}, {"title": "Assessment: Executive Summary", "html": "<p>carddemo-p2 is a mainframe credit-card management system: COBOL, CICS online screens, VSAM files and JCL batch, plus three optional extensions on DB2, IMS DB and IBM MQ. It holds <strong>43.5 KSLOC in 239 source files<\/strong> across 9 functional domains with clean boundaries. The risk is security and correctness, not size. Several online transactions run <strong>without sign-on<\/strong>, and one of them grants admin rights. Passwords and card CVVs are stored in plaintext. Two batch programs can corrupt account balances: one silently skips the last account's interest, the other commits partially when a rewrite fails. <strong>Recommendation: Refactor.<\/strong> Move it domain by domain to a modern stack with <code>/code-modernization:modernize-transform<\/code>, starting with the batch cycle. Do not carry the authentication model or the two balance defects forward as-is, and fix the security issues first.<\/p>", "open": false}, {"title": "Assessment: System Inventory", "html": "<p>Measured with <code>find<\/code> + line counts (neither <code>scc<\/code> nor <code>cloc<\/code> is installed). SLOC = non-blank, non-comment lines. Comment rules: column 7 <code><em><\/code>/<code>/<\/code> for COBOL and copybooks, <code>//<\/em><\/code> for JCL and PROCs.<\/p>\n<div class='scroll'><table><thead><tr><th>Artifact<\/th><th>Files<\/th><th>Lines<\/th><th>SLOC<\/th><\/tr><\/thead><tbody><tr><td>COBOL programs (<code>.cbl<\/code>/<code>.CBL<\/code>)<\/td><td>44<\/td><td>30,175<\/td><td>23,636<\/td><\/tr><tr><td>Copybooks (<code>.cpy<\/code>/<code>.CPY<\/code>)<\/td><td>62<\/td><td>10,651<\/td><td>9,589<\/td><\/tr><tr><td>BMS maps<\/td><td>21<\/td><td>5,756<\/td><td>5,754<\/td><\/tr><tr><td>JCL<\/td><td>55<\/td><td>3,388<\/td><td>1,796<\/td><\/tr><tr><td>CICS CSD<\/td><td>4<\/td><td>685<\/td><td>685<\/td><\/tr><tr><td>Scheduler (CA-7, Control-M)<\/td><td>2<\/td><td>664<\/td><td>518<\/td><\/tr><tr><td>JCL PROCs<\/td><td>6<\/td><td>588<\/td><td>354<\/td><\/tr><tr><td>Shell / awk<\/td><td>10<\/td><td>413<\/td><td>331<\/td><\/tr><tr><td>DB2 DDL / DCLGEN<\/td><td>9<\/td><td>245<\/td><td>244<\/td><\/tr><tr><td>Control cards<\/td><td>8<\/td><td>253<\/td><td>232<\/td><\/tr><tr><td>IMS DBD / PSB<\/td><td>8<\/td><td>223<\/td><td>223<\/td><\/tr><tr><td>Assembler + macros<\/td><td>4<\/td><td>157<\/td><td>157<\/td><\/tr><tr><td><strong>Total (excl. 6 Markdown docs)<\/strong><\/td><td><strong>233<\/strong><\/td><td><strong>53,198<\/strong><\/td><td><strong>43,519<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>The tree also holds 329 files in total, including EBCDIC/ASCII sample data, 11 diagrams and two runtime bundles (<code>samples/m2/mf/CardDemo_runtime.zip<\/code>, <code>samples/m2/unikix/UniKix_CardDemo_runtime_v1.zip<\/code>).<\/p>\n<p><strong>Complexity<\/strong> is counted as COBOL decision keywords (<code>IF<\/code>, <code>EVALUATE<\/code>, <code>WHEN<\/code>, <code>PERFORM<\/code>, <code>UNTIL<\/code>, <code>SEARCH<\/code>). There are 4,796 across 23.6 KSLOC of COBOL, which is <strong>203 per KSLOC<\/strong>. The most complex programs are below.<\/p>\n<div class='scroll'><table><thead><tr><th>Program<\/th><th>Decision keywords<\/th><th>SLOC<\/th><\/tr><\/thead><tbody><tr><td><code>app/cbl/COACTUPC.cbl<\/code> (account/customer update)<\/td><td>541<\/td><td>3,368<\/td><\/tr><tr><td><code>app/app-transaction-type-db2/cbl/COTRTLIC.cbl<\/code><\/td><td>342<\/td><td>1,861<\/td><\/tr><tr><td><code>app/app-transaction-type-db2/cbl/COTRTUPC.cbl<\/code><\/td><td>283<\/td><td>1,429<\/td><\/tr><tr><td><code>app/cbl/COCRDUPC.cbl<\/code> (card update)<\/td><td>253<\/td><td>1,195<\/td><\/tr><tr><td><code>app/cbl/COCRDLIC.cbl<\/code> (card list)<\/td><td>218<\/td><td>1,093<\/td><\/tr><tr><td><code>app/cbl/COTRN02C.cbl<\/code> (add transaction)<\/td><td>178<\/td><td>614<\/td><\/tr><tr><td><code>app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl<\/code><\/td><td>168<\/td><td>792<\/td><\/tr><tr><td><code>app/cbl/CBTRN02C.cbl<\/code> (daily posting)<\/td><td>159<\/td><td>619<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Technology fingerprint<\/h4>\n<ul><li><strong>Languages:<\/strong> IBM Enterprise COBOL, BMS (3270 maps), HLASM (<code>app/asm/COBDATFT.asm<\/code> for date formatting, <code>MVSWAIT.asm<\/code> for a timer wait), JCL, and a little shell and awk. Runtime versions (CICS TS, DB2, IMS, MQ, the COBOL compiler) <strong>cannot be determined from the repo<\/strong>. The only stated version is the README badge (1.0.0).<\/li><li><strong>Build:<\/strong> there is no manifest. The build is driven by scripts: <code>scripts/local_compile.sh<\/code>, <code>remote_compile.sh<\/code>, <code>compile_batch.jcl.template<\/code> and <code>upld_module.sh<\/code> (FTP over a local tunnel). CICS resources are defined in <code>app/csd/CARDDEMO.CSD<\/code>, with the extensions in <code>CRDDEMOD.csd<\/code>, <code>CRDDEMOM.csd<\/code> and the auth module's CSD.<\/li><li><strong>Data stores:<\/strong><\/li><li>VSAM KSDS with alternate indexes (AIX): <code>ACCTDAT<\/code>, <code>CUSTDAT<\/code>, <code>CARDDAT<\/code>, <code>CCXREF<\/code>, <code>TRANSACT<\/code> and <code>USRSEC<\/code>, plus ESDS/RRDS and GDGs. Layouts are in <code>app/cpy/CV*.cpy<\/code> and <code>CSUSR01Y.cpy<\/code>.<\/li><li>DB2: <code>CARDDEMO.TRANSACTION_TYPE<\/code>, <code>TRANSACTION_TYPE_CATEGORY<\/code> and <code>AUTHFRDS<\/code> (DDL in <code>app/app-*/ddl<\/code>).<\/li><li>IMS: HIDAM database <code>DBPAUTP0<\/code> (<code>ims/<em>.dbd<\/code>, <code><\/em>.psb<\/code>).<\/li><li><strong>Integration points:<\/strong> 3270 terminals through 21 BMS maps. Job submission from CICS through the internal reader (TDQ <code>JOBS<\/code>, <code>app/cbl/CORPT00C.cbl:517<\/code>). MQ request/reply on <code>CARD.DEMO.REPLY.ACCT<\/code>, <code>.DATE<\/code> and <code>.ERROR<\/code>, plus the pending-auth queues. FTP (<code>app/jcl/FTPJCL.JCL<\/code>). DSNTIAUL unload from DB2 to VSAM. Scheduling in CA-7 and Control-M (<code>app/scheduler/<\/code>).<\/li><li><strong>Tests:<\/strong> none. There are no unit, characterization or regression tests. <code>samples/jcl/SORTTEST.jcl<\/code> and <code>REPRTEST.jcl<\/code> are utility samples, not tests. The coverage signal is zero, so behavior has to be pinned with characterization tests before any rewrite.<\/li><\/ul>", "open": false}, {"title": "Assessment: Architecture at a Glance", "html": "<p>The diagram is in [<code>ARCHITECTURE.mmd<\/code>](ARCHITECTURE.mmd).<\/p>\n<div class='scroll'><table><thead><tr><th>#<\/th><th>Domain<\/th><th>Key files<\/th><th>Data<\/th><\/tr><\/thead><tbody><tr><td>D1<\/td><td>Sign-on &amp; Navigation<\/td><td><code>app/cbl/COSGN00C<\/code>, <code>COMEN01C<\/code>, <code>COADM01C<\/code>; menu tables <code>app/cpy/COMEN02Y<\/code>, <code>COADM02Y<\/code><\/td><td>USRSEC<\/td><\/tr><tr><td>D2<\/td><td>User Administration<\/td><td><code>app/cbl/COUSR00C<\/code>\u2013<code>COUSR03C<\/code>; <code>app/jcl/DUSRSECJ.jcl<\/code><\/td><td>USRSEC<\/td><\/tr><tr><td>D3<\/td><td>Account &amp; Customer (online)<\/td><td><code>app/cbl/COACTVWC<\/code>, <code>COACTUPC<\/code><\/td><td>ACCTDAT, CUSTDAT, CXACAIX, CARDAIX<\/td><\/tr><tr><td>D4<\/td><td>Card Management<\/td><td><code>app/cbl/COCRDLIC<\/code>, <code>COCRDSLC<\/code>, <code>COCRDUPC<\/code><\/td><td>CARDDAT, CARDAIX<\/td><\/tr><tr><td>D5<\/td><td>Transactions, Bill Pay, Report Request<\/td><td><code>app/cbl/COTRN00C<\/code>\u2013<code>02C<\/code>, <code>COBIL00C<\/code>, <code>CORPT00C<\/code><\/td><td>TRANSACT, ACCTDAT, CCXREF; TDQ JOBS<\/td><\/tr><tr><td>D6<\/td><td>Batch Cycle<\/td><td><code>CBTRN02C<\/code> (POSTTRAN), <code>CBACT04C<\/code> (INTCALC), <code>CBTRN03C<\/code> (TRANREPT), <code>CBSTM03A/B<\/code> (CREASTMT)<\/td><td>DALYTRAN, TRANSACT, TCATBALF, DISCGRP, ACCTFILE, XREFFILE<\/td><\/tr><tr><td>D7<\/td><td>Data Provisioning &amp; Utilities<\/td><td>Define/load JCL, <code>CBACT01C<\/code>\u2013<code>03C<\/code>, <code>CBCUS01C<\/code>, <code>CBEXPORT<\/code>/<code>CBIMPORT<\/code>, <code>COBSWAIT<\/code><\/td><td>all VSAM<\/td><\/tr><tr><td>D8<\/td><td>Optional subsystems<\/td><td>D8a Transaction Type on DB2 (<code>COTRTLIC<\/code>, <code>COTRTUPC<\/code>, <code>COBTUPDT<\/code>); D8b VSAM-MQ inquiry (<code>COACCT01<\/code>, <code>CODATE01<\/code>); D8c Pending Authorization on IMS/DB2/MQ (<code>COPAUA0C<\/code>, <code>COPAUS0C<\/code>\u2013<code>2C<\/code>, <code>CBPAUP0C<\/code>)<\/td><td>DB2, IMS DBPAUTP0, MQ<\/td><\/tr><tr><td>D9<\/td><td>Common Services<\/td><td><code>app/cpy/COCOM01Y<\/code> (COMMAREA), <code>CSDAT01Y<\/code>, <code>CSMSG0xY<\/code>, <code>app/cbl/CSUTLDTC<\/code>, asm utilities<\/td><td>none<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Control flows from D1 to the online domains through <code>XCTL<\/code> driven by the menu tables. The batch domains interact only through shared VSAM files. The online side reaches batch in one place: CORPT00C submits the TRANREPT job through the TDQ.<\/p>\n<p><strong>Dangling references:<\/strong><\/p>\n<ul><li>Program <code>COCRDSEC<\/code> / transaction <code>CDV1<\/code> is defined in <code>app/csd/CARDDEMO.CSD:211,388-390<\/code>, but there is no source for it.<\/li><li>CA-7 triggers jobs <code>CLOSEFIL1<\/code> and <code>CLOSEFIL2<\/code> (<code>app/scheduler/CardDemo.ca7:216-217<\/code>), which do not exist.<\/li><li><code>app/cbl/CBIMPORT.cbl:63<\/code> opens DD <code>CARDOUT<\/code>, which <code>app/jcl/CBIMPORT.jcl<\/code> does not define, so the job fails at open.<\/li><\/ul>\n<p><strong>Orphans:<\/strong><\/p>\n<ul><li><code>app/cbl/CBTRN01C.cbl<\/code>: nothing runs it.<\/li><li><code>app/cpy/UNUSED1Y.cpy<\/code>: nothing copies it.<\/li><li>DD <code>XREFFIL1<\/code> in <code>app/jcl/INTCALC.jcl:31<\/code>: the program never reads it.<\/li><li><code>app/data/EBCDIC/AWS.M2.CARDDEMO.ACCDATA.PS<\/code>: no JCL uses it.<\/li><\/ul>", "open": false}, {"title": "Assessment: Production Runtime Profile", "html": "<p><strong>No telemetry available.<\/strong> There is no APM server, no batch run logs and no SMF/runtime export in the repo or the session. Wall-clock cost and p50/p95/p99 by domain cannot be stated. If job logs or SMF type 30 records for POSTTRAN, INTCALC and CREASTMT can be supplied, rerun this step to rank domains by operational risk.<\/p>", "open": false}, {"title": "Assessment: Technical Debt", "html": "<p>Top 10 by remediation value.<\/p>\n<div class='scroll'><table><thead><tr><th>#<\/th><th>file:line<\/th><th>Category<\/th><th>Finding<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><code>app/cbl/CBACT04C.cbl:188-221<\/code><\/td><td>Logic defect / dead code<\/td><td>The loop exits as soon as EOF is <code>'Y'<\/code>, so its <code>ELSE PERFORM 1050-UPDATE-ACCOUNT<\/code> branch can never run. <strong>The last account's interest is never written back.<\/strong> Verified by reading the code. A rewrite must decide whether to copy the bug or fix it before parallel-run comparison.<\/td><\/tr><tr><td>2<\/td><td><code>app/cbl/CBTRN02C.cbl:440-442, 554-558<\/code><\/td><td>Missing error handling<\/td><td>When the account <code>REWRITE<\/code> hits INVALID KEY, the program only sets reason 109. The category balance is already updated and the transaction is still written, so the commit is partial and there is no reject record.<\/td><\/tr><tr><td>3<\/td><td><code>app/jcl/FTPJCL.JCL:31-40<\/code><\/td><td>Hardcoded config / credential<\/td><td>Inline FTP login (<code>ca**<strong><\/code>/<code>ft<\/strong>**<\/code>) to a hardcoded private IP, sent over plain FTP. The DSN is misspelled (<code>CARDEMO<\/code>), so the job is probably broken.<\/td><\/tr><tr><td>4<\/td><td><code>app/cbl/COSGN00C.cbl:135, 223<\/code>; <code>app/cpy/CSUSR01Y.cpy:21<\/code><\/td><td>Security debt<\/td><td>Plaintext passwords of 8 characters, upper-cased before comparison. Shared seed passwords (<code>PA****<\/code>) in <code>app/jcl/DUSRSECJ.jcl:35-44<\/code>.<\/td><\/tr><tr><td>5<\/td><td>629 occurrences across 46 files<\/td><td>Hardcoded HLQ<\/td><td><code>AWS.M2.CARDDEMO.\u2026<\/code> is hardcoded instead of symbolic <code>&amp;HLQ<\/code> parameters, which blocks promotion between environments.<\/td><\/tr><tr><td>6<\/td><td><code>app/cpy/CUSTREC.cpy<\/code> vs <code>app/cpy/CVCUS01Y.cpy<\/code><\/td><td>Duplicate data model<\/td><td>Both define <code>01 CUSTOMER-RECORD<\/code>; they differ only in one DOB field name. A rewrite would end up with two Customer entities.<\/td><\/tr><tr><td>7<\/td><td><code>POPULATE-HEADER-INFO<\/code> (14 programs), <code>9910-DISPLAY-IO-STATUS<\/code> (8), abend routines<\/td><td>Duplication<\/td><td>About 30 cloned paragraphs, and their names have already drifted (<code>9999-<\/code> vs <code>Z-<\/code>).<\/td><\/tr><tr><td>8<\/td><td><code>app/cbl/COACTUPC.cbl<\/code> (4,236 lines, 88 paragraphs)<\/td><td>God program<\/td><td>Screen I/O, generic validators (:1856-2105) and account plus customer updates all live in one program. It is the highest-complexity unit.<\/td><\/tr><tr><td>9<\/td><td><code>app/cbl/CBACT01C.cbl:236-260<\/code><\/td><td>Magic numbers / test residue<\/td><td>Writes fixed amounts (<code>2525.00<\/code>, <code>-2500.00<\/code>\u2026) into the output. Likely test scaffolding that a rewrite would keep as if it were a rule.<\/td><\/tr><tr><td>10<\/td><td><code>app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:400-404, 558<\/code>; <code>app/cbl/CBACT04C.cbl:518-520<\/code><\/td><td>Unchecked RESP / stubs<\/td><td><code>RECEIVE MAP \u2026 NOHANDLE<\/code> and <code>SYNCPOINT<\/code> with no RESP check. <code>1400-COMPUTE-FEES<\/code> is an empty \"To be implemented\" stub that still gets called.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Lower-value items:<\/p>\n<ul><li>25 CICS file names are hardcoded as literals.<\/li><li>The interest divisor is the literal <code>/1200<\/code> (<code>CBACT04C.cbl:465<\/code>).<\/li><li><code>COPAUS2C.cbl:199-216<\/code> returns after a DB2 failure without a rollback.<\/li><\/ul>", "open": false}, {"title": "Assessment: Security Findings", "html": "<p>22 findings: 3 Critical, 9 High, 7 Medium, 3 Low. Credential inventory in <code>SECRETS.local.md<\/code> (gitignored; not for sharing).<\/p>\n<div class='scroll'><table><thead><tr><th>#<\/th><th>CWE<\/th><th>Finding<\/th><th>file:line<\/th><th>Severity<\/th><\/tr><\/thead><tbody><tr><td>SEC-001<\/td><td>CWE-306<\/td><td>Typing <code>CTLI<\/code> or <code>CTTU<\/code> with no session data sets <code>CDEMO-USRTYP-ADMIN<\/code>, giving DB2 transaction-type admin without sign-on (verified)<\/td><td><code>app/app-transaction-type-db2/cbl/COTRTLIC.cbl:515-520<\/code>; <code>COTRTUPC.cbl:366-373<\/code><\/td><td>Critical<\/td><\/tr><tr><td>SEC-002<\/td><td>CWE-306<\/td><td>Account and card transactions (<code>CAUP<\/code>, <code>CAVW<\/code>, <code>CCLI<\/code>, <code>CCUP<\/code>, <code>CCDL<\/code>) run with no session data and never redirect to sign-on<\/td><td><code>app/cbl/COACTUPC.cbl:880-886<\/code>, <code>COACTVWC.cbl:282<\/code>, <code>COCRDLIC.cbl:315-320<\/code>, <code>COCRDUPC.cbl:388<\/code>, <code>COCRDSLC.cbl:268<\/code><\/td><td>Critical<\/td><\/tr><tr><td>SEC-003<\/td><td>CWE-285 / CWE-602<\/td><td>Admin role checked only in the menu. <code>COADM01C<\/code> and <code>COUSR0xC<\/code> trust the passed COMMAREA. Every transaction has <code>RESSEC(NO) CMDSEC(NO)<\/code><\/td><td><code>app/cbl/COADM01C.cbl:86-90<\/code>; <code>app/csd/CARDDEMO.CSD:314-486<\/code><\/td><td>High<\/td><\/tr><tr><td>SEC-004<\/td><td>CWE-256 / CWE-312<\/td><td>Passwords stored in plaintext<\/td><td><code>app/cpy/CSUSR01Y.cpy:21<\/code>; <code>app/cbl/COUSR01C.cbl:157<\/code><\/td><td>High<\/td><\/tr><tr><td>SEC-005<\/td><td>CWE-798<\/td><td>Shared seed passwords (<code>PA****<\/code>) for 5 admin and 5 user accounts, also published in the README<\/td><td><code>app/jcl/DUSRSECJ.jcl:35-44<\/code>; <code>README.md:203-204<\/code><\/td><td>High<\/td><\/tr><tr><td>SEC-006<\/td><td>CWE-798 / CWE-319<\/td><td>Hardcoded FTP login over cleartext FTP<\/td><td><code>app/jcl/FTPJCL.JCL:33-35<\/code><\/td><td>High<\/td><\/tr><tr><td>SEC-007<\/td><td>CWE-307 / CWE-204 / CWE-521<\/td><td>No lockout; separate messages for wrong password and unknown user (user enumeration); case-insensitive 8-character passwords; no <code>EXEC CICS SIGNON<\/code><\/td><td><code>app/cbl/COSGN00C.cbl:132-136, 223, 242, 249<\/code><\/td><td>High<\/td><\/tr><tr><td>SEC-008<\/td><td>CWE-639<\/td><td>No link between users and accounts: any user can view, update or pay any account or card (IDOR)<\/td><td><code>app/cpy/COMEN02Y.cpy:28-83<\/code> + D3/D4/D5 programs<\/td><td>High<\/td><\/tr><tr><td>SEC-009<\/td><td>CWE-359<\/td><td>Full SSN and PAN shown on screen; SSN is editable<\/td><td><code>app/cbl/COACTVWC.cbl:497-501<\/code>; <code>app/bms/COACTUP.bms:264-280<\/code><\/td><td>High<\/td><\/tr><tr><td>SEC-010<\/td><td>CWE-312 (PCI DSS 3.2)<\/td><td>CVV stored at rest<\/td><td><code>app/cpy/CVACT02Y.cpy:7<\/code><\/td><td>High<\/td><\/tr><tr><td>SEC-011<\/td><td>CWE-20 / CWE-840<\/td><td>Authorization accepts negative amounts; no checks on expiry, CVV or card status<\/td><td><code>app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:354-377, 666-695<\/code><\/td><td>High<\/td><\/tr><tr><td>SEC-012<\/td><td>CWE-532<\/td><td>Batch jobs <code>DISPLAY<\/code> full records (SSN, PAN, CVV) to SYSOUT<\/td><td><code>app/cbl/CBCUS01C.cbl:78<\/code>; <code>CBACT02C.cbl:78<\/code>; others<\/td><td>Medium<\/td><\/tr><tr><td>SEC-013<\/td><td>CWE-549<\/td><td>The current password is sent to the terminal in a dark field<\/td><td><code>app/cbl/COUSR02C.cbl:169<\/code><\/td><td>Medium<\/td><\/tr><tr><td>SEC-014<\/td><td>CWE-20<\/td><td>User type not validated (any character accepted)<\/td><td><code>app/cbl/COUSR01C.cbl:142<\/code><\/td><td>Medium<\/td><\/tr><tr><td>SEC-015<\/td><td>CWE-306<\/td><td>MQ account inquiry has no check on who is asking<\/td><td><code>app/app-vsam-mq/cbl/COACCT01.cbl:352-408<\/code><\/td><td>Medium<\/td><\/tr><tr><td>SEC-016<\/td><td>CWE-312<\/td><td>Bulk export written in clear (SSN, PAN)<\/td><td><code>app/cbl/CBEXPORT.cbl<\/code><\/td><td>Medium<\/td><\/tr><tr><td>SEC-017<\/td><td>CWE-78 / CWE-88<\/td><td>Unquoted arguments in <code>sed<\/code> and FTP command scripts<\/td><td><code>scripts/remote_compile.sh:20,27,38<\/code>; <code>scripts/upld_module.sh:24-37<\/code><\/td><td>Medium<\/td><\/tr><tr><td>SEC-018<\/td><td>CWE-284<\/td><td>Online code submits batch jobs under the region ID with no check of who asked. JCL injection is blocked today because the dates are numeric-checked<\/td><td><code>app/cbl/CORPT00C.cbl:81-120, 517<\/code><\/td><td>Medium<\/td><\/tr><tr><td>SEC-019<\/td><td>CWE-359<\/td><td>Synthetic PAN, CVV and SSN data in the repo<\/td><td><code>app/data/ASCII/<em>.txt<\/code>, <code>app/data/EBCDIC/<\/em>.PS<\/code><\/td><td>Low<\/td><\/tr><tr><td>SEC-020<\/td><td>CWE-1104<\/td><td>No dependency manifests; runtime versions unknown<\/td><td>whole repo<\/td><td>Low<\/td><\/tr><tr><td>SEC-021<\/td><td>CWE-615<\/td><td>A comment calls the FTP server a placeholder, but the code holds real private IPs<\/td><td><code>app/jcl/FTPJCL.JCL:23,31<\/code><\/td><td>Low<\/td><\/tr><tr><td>SEC-022<\/td><td>CWE-209<\/td><td>APPLID and SYSID shown on the sign-on screen<\/td><td><code>app/cbl/COSGN00C.cbl:198-204<\/code><\/td><td>Low<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Checked and clean: no dynamic SQL (all static SQL with host variables) and no RACF commands in the repo.<\/p>", "open": false}, {"title": "Assessment: Documentation Gaps", "html": "<p>The top 5 things a new engineer would need explained. The README covers the inventory and the install steps, but not these.<\/p>\n<ol><li><strong>The session and trust model.<\/strong> The COMMAREA (<code>app/cpy/COCOM01Y.cpy<\/code>) carries user identity and role between programs. Each program decides on its own what to do when <code>EIBCALEN = 0<\/code>, and some grant admin. Nothing documents that security depends entirely on users entering through <code>COSGN00C<\/code>.<\/li><li><strong>Which batch jobs actually run, and in what order.<\/strong><\/li><\/ol>\n<ul><li>The README lists the jobs but not the dependency chain, which is split between CA-7 and Control-M.<\/li><li>It does not say that <code>CBTRN01C<\/code> is never run, that <code>TRANREPT<\/code> runs only on demand from CORPT00C, or that CA-7 refers to <code>CLOSEFIL1<\/code> and <code>CLOSEFIL2<\/code>, which do not exist.<\/li><\/ul>\n<ol><li><strong>The interest and fee rules.<\/strong> The README says only \"Run interest calculations\" (<code>README.md:226<\/code>). The real behavior is undocumented:<\/li><\/ol>\n<ul><li>the monthly divisor <code>/1200<\/code>;<\/li><li>DISCGRP rate lookup with a default-group fallback;<\/li><li>the fee step that is still a stub;<\/li><li>the last-account defect.<\/li><\/ul>\n<ol><li><strong>The MQ message contracts.<\/strong> The VSAM-MQ README defines <code>CARDDEMO.REQUEST.QUEUE<\/code> and <code>CARDDEMO.RESPONSE.QUEUE<\/code> (<code>app/app-vsam-mq/README.md:53-54<\/code>). The code replies on <code>CARD.DEMO.REPLY.ACCT<\/code>, <code>CARD.DEMO.REPLY.DATE<\/code> and <code>CARD.DEMO.ERROR<\/code>, and takes its input queue from the trigger message. The message layouts are not documented, and neither are the trigger/process definitions for the auth module.<\/li><li><strong>How DB2 reference data syncs back to VSAM.<\/strong> Transaction types are maintained in DB2 (D8a), but batch posting reads the VSAM <code>TRANTYPE<\/code>/<code>TRANCATG<\/code> files. <code>TRANEXTR<\/code> gets one line in the README. Nothing explains when it must run, or what happens to posting when DB2 and VSAM drift apart.<\/li><\/ol>", "open": false}, {"title": "Assessment: Relative Scale", "html": "<div class='scroll'><table><thead><tr><th>Measure<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>KSLOC (all source, excl. Markdown)<\/td><td>43.5<\/td><\/tr><tr><td>COBOL KSLOC<\/td><td>23.6<\/td><\/tr><tr><td>Complexity index (<code>2.94 \u00d7 KSLOC^1.10<\/code>)<\/td><td><strong>186.6<\/strong><\/td><\/tr><tr><td>Decision keywords per COBOL KSLOC<\/td><td>203<\/td><\/tr><\/tbody><\/table><\/div>\n<p>This index is a <strong>relative size measure for ranking this system against others<\/strong> measured the same way. It is <strong>not a timeline or a cost<\/strong>: the formula assumes a human team's productivity and does not apply to agentic modernization.<\/p>", "open": false}, {"title": "Assessment: Recommended Modernization Pattern", "html": "<p><strong>Refactor.<\/strong> Move to a modern stack domain by domain, using <code>/code-modernization:modernize-transform<\/code>.<\/p>\n<ul><li><strong>Why Refactor fits.<\/strong> The system is small (43.5 KSLOC) and splits into 9 domains with clean boundaries: online programs reach each other only through menu-driven <code>XCTL<\/code>, and batch couples only through VSAM files. That makes a piece-by-piece rewrite with characterization tests practical.<\/li><li><strong>Batch cycle first (D6).<\/strong> It has the clearest inputs and outputs, so parallel-run comparison is easy. It also holds the two balance-corruption defects, which must be settled as business decisions (copy the bug or fix it) before any equivalence testing.<\/li><li><strong>Fix security before any move.<\/strong><\/li><li>The authentication and authorization model (SEC-001 to SEC-008) must be redesigned around an external identity provider and per-request role and ownership checks.<\/li><li>Plaintext passwords and stored CVVs must go.<\/li><li>Porting these as-is would carry Critical findings into the new platform, so run <code>/code-modernization:modernize-harden<\/code> first.<\/li><li><strong>Why not Replatform.<\/strong> The bundled Micro Focus and UniKix runtime packages (<code>samples/m2/<\/code>) show that a Replatform/Rehost path exists. It would carry every security finding and the hardcoded HLQs along unchanged.<\/li><li><strong>Why not Rearchitect.<\/strong> A full rebuild (<code>reimagine<\/code>) is not justified at this size. The domain boundaries are already sound.<\/li><\/ul>\n<p>The target stack has not been chosen yet (<code>INTENT.md<\/code>), so this assessment names no target version.<\/p>", "open": false}, {"title": "Business flows", "html": "<h3>Agent views and updates a cardholder&#x27;s account<\/h3><p><b>Customer service agent<\/b>: An agent signs on, opens a customer&#x27;s account and corrects their details or credit limit.<\/p><ol><li>Sign on with user ID and password<\/li><li>Choose an option from the main menu<\/li><li>Look up the account and its customer<\/li><li>Edit and save account and customer details<\/li><li>Return to the menu<\/li><\/ol><h3>Cardholder pays their balance<\/h3><p><b>Cardholder (served by an agent)<\/b>: A cardholder pays off their account balance and the payment is recorded as a transaction.<\/p><ol><li>Agent signs on and opens Bill Payment<\/li><li>Find the account and its current balance<\/li><li>Record the payment transaction<\/li><li>Reduce the account balance<\/li><\/ol><h3>Nightly posting, interest and statements<\/h3><p><b>Cardholder<\/b>: Overnight, the day&#x27;s card purchases are posted to the cardholder&#x27;s account, interest is charged and a statement is produced.<\/p><ol><li>Close the online files for the batch window<\/li><li>Post the day&#x27;s transactions, reject the invalid ones, update balances<\/li><li>Calculate monthly interest by category and disclosure group<\/li><li>Merge interest transactions into the transaction master<\/li><li>Produce text and HTML statements<\/li><li>Convert the statements to PDF<\/li><li>Reopen the online files<\/li><\/ol><h3>Card purchase is authorized and reviewed<\/h3><p><b>Cardholder at a merchant<\/b>: A cardholder&#x27;s purchase is approved or declined in real time, held as a pending authorization, and can be flagged as fraud.<\/p><ol><li>Authorization request arrives on a queue<\/li><li>Check the card, account and customer<\/li><li>Store the decision as a pending authorization<\/li><li>Send the approve or decline reply<\/li><li>Agent reviews pending authorizations for the account<\/li><li>Flag an authorization as fraud<\/li><li>Purge expired pending authorizations nightly<\/li><\/ol>"}, {"title": "The map's observations", "html": "<ul><li>Account balance and transaction history are shared hotspots. ACCTDATA has 5 writers (online COACTUPC and COBIL00C, batch CBTRN02C and CBACT04C, load job ACCTFILE) and 12 readers. TRANSACT has 7 writers, including online COTRN02C and COBIL00C and batch CBTRN02C and COMBTRAN. Only the CLOSEFIL/OPENFIL jobs keep online and batch apart: they close and reopen 5 CICS files (TRANSACT, CCXREF, ACCTDAT, CXACAIX, USRSEC) through CEMT. A modern design needs one owner per store.<\/li><li>Online navigation runs through one hub. COMEN01C and COSGN00C each receive 12 dispatch (XCTL) edges and COADM01C receives 7. The targets come from the menu tables COMEN02Y and COADM02Y (resolved here) and from CDEMO-TO-PROGRAM in the COMMAREA. That makes them single points of failure, and the natural place for a front-end router or API gateway.<\/li><li>Pending Authorization (IMS DBPAUTP0, DB2 AUTHFRDS, MQ) and Transaction Types (DB2 TRANSACTION_TYPE) are the cleanest extraction candidates. Their only links into the core are reads of ACCTDATA, CUSTDATA and CARDXREF, menu dispatches and scheduler links. Neither writes a core VSAM store.<\/li><li>Online reaches batch in exactly one place. CORPT00C writes inline JCL to TDQ JOBS, and that JCL runs PROC TRANREPT (CBTRN03C). The map draws this as a dispatch edge to job TRANREPT, whose member runs the same steps.<\/li><li>Some dynamic targets are left unresolved. COACCT01, CODATE01 and COPAUA0C take their request queue name from the MQ trigger message (MQTM-QNAME), and COPAUA0C replies to the reply-to queue named in the request. Those queue names are not in the repo, so they appear as per-program placeholder stores. Every XCTL/LINK/CALL variable was resolved through VALUE clauses, MOVE statements or the menu tables.<\/li><li>Some wiring is broken or dangling. Transaction CDV1 points to COCRDSEC, which has no source. CA-7 triggers CLOSEFIL1 and CLOSEFIL2, which have no JCL. CBIMPORT opens DD CARDOUT, which its job does not define. MNTTRDB2 points COBTUPDT&#x27;s INPFILE at a placeholder DSN. CBTRN01C is the only dead-end program: no job runs it. 25 of 46 jobs sit on no scheduler; they are provisioning and ad-hoc utilities.<\/li><\/ul>"}, {"title": "Preflight: summary", "html": "<h2>Preflight: carddemo-p2<\/h2>\n<p>Run 2026-11-23. <code>legacy/carddemo-p2<\/code> is <strong>a directory in this workspace<\/strong> (not a symlink). Its files have read-only permission bits (<code>dr-xr-xr-x<\/code> / <code>-r--r--r--<\/code>). Nothing under it was modified.<\/p>"}, {"title": "Preflight: Answers", "html": "<p>The answers were collected before this run. The question pop-up was not available. Each answer is written here verbatim.<\/p>\n<p><strong>1. Scope.<\/strong> Is this code the complete system, or one slice of a larger codebase? If a slice: what <em>outside<\/em> it depends on code <em>inside<\/em> it, and is breaking those consumers acceptable?<\/p>\n<p>&gt; The complete source as Reframe snapshotted it (SHA-256 d9a77d549248727883ce64930d337dd6518322d4dead65a418eafd1eb402541a); nothing outside it is in scope for this assessment. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>\n<p><strong>2. Build &amp; test locally.<\/strong> Can this environment restore, build, and run the tests? Roughly how long does the full CI pipeline take?<\/p>\n<p>&gt; No. This pass is analysis only: nothing is built or run. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>\n<p><strong>3. Bespoke build infrastructure.<\/strong> Is there organization-specific build or dependency machinery (an internal package feed, a code generator, a wrapper around the standard build tool) a newcomer would not guess? Where is it documented?<\/p>\n<p>&gt; Don't know. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>\n<p><em>Open item for a person:<\/em> the source has hints of a bespoke build (see Check 3a: an FTP tunnel to Ensono, and a <code>Makefile<\/code> that is not in the tree). Someone who knows the system should confirm or deny this.<\/p>\n<p><strong>4. Prior attempts.<\/strong> Has anyone tried to modernize this before? What went wrong?<\/p>\n<p>&gt; An AWS Transform assessment of the same snapshot was made; its results are kept apart and are not given to this assessment. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>\n<p><strong>5. Off limits.<\/strong> Is anything in this code not allowed to change in this pass (a component another team owns, a frozen branch, generated code)?<\/p>\n<p>&gt; Everything: this pass is analysis only, and nothing in the source may change. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>"}, {"title": "Preflight: Check 6: scope boundary", "html": "<p><strong>Standalone snapshot. No repository, solution or reactor root above it reaches into it.<\/strong><\/p>\n<ul><li><code>legacy/carddemo-p2<\/code> is a plain directory, not a link. The nearest git root above it is the user's home-directory repository (<code>~<\/code>). There the tree is untracked, so that repository has nothing to do with this system.<\/li><li>There is no parent build file, and no project or module references to code outside the tree.<\/li><li><strong>Outbound:<\/strong> every application copybook resolves inside the tree. The only references that leave the tree go to IBM product libraries: CICS <code>SDFHCOB<\/code>/<code>SDFHMAC<\/code>, Db2 <code>SDSNLOAD<\/code>, MQ <code>SCSQCOBC<\/code>. JCL also references runtime datasets (<code>AWS.M2.CARDDEMO.*<\/code>). None of these is application source that the map would miss.<\/li><li><strong>Inbound:<\/strong> the source shows no outside consumers. Answer 1 puts everything outside the snapshot out of scope. No shared nodes need a transition decision.<\/li><\/ul>"}, {"title": "Preflight: Readiness table", "html": "<div class='scroll'><table><thead><tr><th>#<\/th><th>Check<\/th><th>Status<\/th><th>Found<\/th><th>Fix<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Human answers<\/td><td>\u26a0\ufe0f<\/td><td>All 5 answered (autonomous). Q3 is \"Don't know\".<\/td><td>A person should confirm the bespoke-build question (see Check 3a).<\/td><\/tr><tr><td>1<\/td><td>Stack<\/td><td>\u2705<\/td><td>IBM z/OS mainframe: Enterprise COBOL (CICS, batch, Db2, IMS DB, MQ), BMS, JCL, HLASM<\/td><td>\u2014<\/td><\/tr><tr><td>2<\/td><td>Analysis tooling<\/td><td>\u26a0\ufe0f<\/td><td><code>python3<\/code> 3.12.2 \u2705. <code>scc<\/code>, <code>cloc<\/code> and <code>lizard<\/code> are missing.<\/td><td><code>brew install scc<\/code> and <code>pip3 install lizard<\/code><\/td><\/tr><tr><td>3<\/td><td>Build toolchain<\/td><td>\u26a0\ufe0f<\/td><td>No <code>cobc<\/code>, and no local CICS, Db2, IMS or MQ. The Level 1 and Level 2 compiles were not run because Answer 2 rules them out. This is a fact, not a failure.<\/td><td>Optional for later passes: <code>brew install gnucobol<\/code>. That covers batch programs only; CICS, Db2 and IMS code needs the mainframe preprocessors.<\/td><\/tr><tr><td>4<\/td><td>Source completeness<\/td><td>\u2705<\/td><td>0 application copybooks missing. 10 IBM-supplied members are absent, as expected. All descriptors are present. There are 2 binary-only runtime zips.<\/td><td>\u2014<\/td><\/tr><tr><td>5<\/td><td>Optional context<\/td><td>\u26a0\ufe0f<\/td><td>No APM MCP server and no batch logs (<code>app/catlg/LISTCAT.txt<\/code> is only a static catalog listing). No git history.<\/td><td>Supply runtime or batch logs and real VCS history if they exist.<\/td><\/tr><tr><td>6<\/td><td>Scope boundary<\/td><td>\u2705<\/td><td>Standalone. No inbound or outbound source dependencies.<\/td><td>\u2014<\/td><\/tr><tr><td>7<\/td><td>Source edit protection<\/td><td>\u2705<\/td><td><code>.claude/settings.json<\/code> <code>permissions.deny<\/code>: <code>Edit(/~/.reframe/projects/carddemo-p2/runs/bcc1e3/claude/legacy/**)<\/code><\/td><td>\u2014<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Check 1: stack (329 files)<\/h4>\n<div class='scroll'><table><thead><tr><th>Kind<\/th><th>Files<\/th><th>Lines<\/th><\/tr><\/thead><tbody><tr><td>COBOL programs (<code>.cbl<\/code>)<\/td><td>44: 31 core <code>app/cbl<\/code>, 8 <code>app-authorization-ims-db2-mq<\/code>, 3 <code>app-transaction-type-db2<\/code>, 2 <code>app-vsam-mq<\/code><\/td><td>30,175<\/td><\/tr><tr><td>Copybooks (<code>.cpy<\/code>)<\/td><td>62 (including BMS-generated map copybooks in <code>cpy-bms<\/code>)<\/td><td>10,650<\/td><\/tr><tr><td>BMS mapsets<\/td><td>21<\/td><td>5,756<\/td><\/tr><tr><td>JCL (<code>.jcl<\/code>)<\/td><td>55 (38 <code>app/jcl<\/code>, 9 <code>samples/jcl<\/code>, 8 in the optional modules)<\/td><td>3,385<\/td><\/tr><tr><td>Assembler (<code>.asm<\/code>, <code>.mac<\/code>)<\/td><td>4<\/td><td>156<\/td><\/tr><tr><td>Procs / control cards<\/td><td>6 <code>.prc<\/code>, 8 <code>.ctl<\/code><\/td><td>\u2014<\/td><\/tr><tr><td>CICS CSD<\/td><td>4 (<code>CARDDEMO.CSD<\/code>, <code>CRDDEMO2<\/code>, <code>CRDDEMOD<\/code>, <code>CRDDEMOM<\/code>)<\/td><td>\u2014<\/td><\/tr><tr><td>Db2 DDL / DCLGEN<\/td><td>6 / 3<\/td><td>\u2014<\/td><\/tr><tr><td>IMS DBD / PSB<\/td><td>4 / 4<\/td><td>\u2014<\/td><\/tr><tr><td>Scheduler<\/td><td><code>CardDemo.ca7<\/code>, <code>CardDemo.controlm<\/code><\/td><td>\u2014<\/td><\/tr><tr><td>Data<\/td><td>9 ASCII, 13 EBCDIC <code>.PS<\/code> sample files<\/td><td>\u2014<\/td><\/tr><tr><td>Other<\/td><td>9 shell scripts, 11 PNG diagrams, 2 runtime zips, docs<\/td><td>\u2014<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Check 3a: build definition<\/h4>\n<ul><li>There is no CI pipeline in the tree. The README says \"Use your standard mainframe compilation procedures\", and sample procs are provided: <code>samples/proc/BUILDBAT.prc<\/code>, <code>BUILDONL.prc<\/code>, <code>BUILDBMS.prc<\/code>, <code>BLDCIDB2.prc<\/code> and <code>samples/jcl/IMSMQCMP.jcl<\/code>.<\/li><li><strong>Pinned toolchain:<\/strong> Enterprise COBOL <strong>6.3<\/strong> (<code>IGY.SIGYCOMP.V63<\/code> in <code>scripts/compile_batch.jcl.template<\/code>). The JCL uses <code>PARM=(APOST,LIST,MAP,NUMBER)<\/code> and the binder <code>HEWL<\/code> with <code>AMODE(31)<\/code>.<\/li><li><strong>Preprocessors:<\/strong> Db2 <code>DSNHPC<\/code> and the CICS translator <code>DFHECP1$<\/code> with <code>PARM='CICS,DLI,COBOL3'<\/code>. Copybook sources are <code>AWS.M2.CARDDEMO.CPY<\/code> plus the IBM product libraries.<\/li><li>\u26a0\ufe0f <strong>Bespoke or broken hints:<\/strong><\/li><li><code>scripts/remote_compile.sh<\/code> checks for an <strong>FTP tunnel to Ensono<\/strong> on port 2121, runs <code>make -f Makefile<\/code> (<strong>no Makefile in the tree<\/strong>), then submits the JCL through <code>tnftp<\/code> with <code>filetype=JES<\/code>.<\/li><li><code>scripts/local_compile.sh<\/code> runs <code>cobc -I ../cpy/ --std=ibm-strict sample/cobol/SIZING.cbl<\/code>, but that file does not exist.<\/li><li><code>BLDCIDB2.prc<\/code> hard-codes site datasets (<code>OEM.DB2.DAZ1.SDSNEXIT<\/code>, <code>OEMA.DB2.VERSIONA.SDSNLOAD<\/code>).<\/li><\/ul>\n<h4>Check 3b: smoke test<\/h4>\n<ul><li><strong>Level 1<\/strong> is impossible here: there is no <code>cobc<\/code> (GnuCOBOL). It is also out of scope under Answer 2. Even with <code>cobc<\/code>, only the batch programs would syntax-check. The CICS, Db2 and IMS programs need the IBM translators first.<\/li><li><strong>Level 2<\/strong> is impossible: there is no mainframe runtime. Equivalence for any later move would fall back to recorded traces.<\/li><li>No target was given, so no throwaway target project was built.<\/li><\/ul>\n<h4>Check 4: completeness<\/h4>\n<ul><li><strong>Missing includes:<\/strong> none from the application. The absent members are all IBM-supplied: <code>DFHAID<\/code> and <code>DFHBMSCA<\/code> (21 programs each), <code>SQLCA<\/code> (4), and <code>CMQV<\/code>, <code>CMQODV<\/code>, <code>CMQMDV<\/code>, <code>CMQGMOV<\/code>, <code>CMQPMOV<\/code>, <code>CMQTML<\/code> (3\u20134 each). The regex also turned up <code>03220012<\/code>, <code>03500000<\/code> and <code>REPLACING<\/code>; these are false positives from data names and comments.<\/li><li><strong>Descriptors:<\/strong> CSD, JCL, procs, CA-7 and Control-M schedules, and the IMS DBD/PSB definitions are all present.<\/li><li><strong>Data definitions:<\/strong> Db2 DDL and DCLGEN, IMS DBDs, and record-layout copybooks are present.<\/li><li><strong>Binary-only artifacts:<\/strong><\/li><li><code>samples/m2/mf/CardDemo_runtime.zip<\/code>: 112 entries, including 30 <code>.so<\/code> and 17 <code>.MOD<\/code> compiled modules.<\/li><li><code>samples/m2/unikix/UniKix_CardDemo_runtime_v1.zip<\/code>: 381 entries.<\/li><li>Both are AWS M2 replatform runtimes, not source. They should be excluded from metrics.<\/li><\/ul>\n<h4>Check 7: note<\/h4>\n<p>The deny rule covers Claude's file tools and the shell commands it recognises. It does not cover a script that opens the files itself. The read-only permission bits on the tree give some OS-level protection, but the owner can still <code>chmod<\/code> them. The hard guarantee is a read-only mount or a write-blocking sandbox. Managed (organisation) settings were not read.<\/p>"}, {"title": "Preflight: Verdict per command", "html": "<div class='scroll'><table><thead><tr><th>Command<\/th><th>Verdict<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>assess<\/code><\/td><td><strong>Ready-with-gaps<\/strong><\/td><td>Without <code>scc<\/code> or <code>cloc<\/code>, LOC falls back to <code>find<\/code> + <code>wc<\/code>, and the COCOMO estimate is coarser.<\/td><\/tr><tr><td><code>map<\/code><\/td><td><strong>Ready<\/strong><\/td><td><code>python3<\/code> is present and every application copybook resolves.<\/td><\/tr><tr><td><code>extract-rules<\/code><\/td><td><strong>Ready<\/strong><\/td><td>The source is complete and <code>python3<\/code> is present.<\/td><\/tr><tr><td><code>brief<\/code><\/td><td><strong>Ready<\/strong> (after discovery)<\/td><td>It needs only the discovery artifacts.<\/td><\/tr><tr><td><code>transform<\/code> / <code>reimagine<\/code><\/td><td><strong>Ready-with-gaps<\/strong> (not in this pass)<\/td><td>No target has been chosen. There is no legacy runtime, so equivalence would rely on recorded traces. Answer 5 forbids changes in this pass.<\/td><\/tr><tr><td><code>harden<\/code><\/td><td><strong>Ready-with-gaps<\/strong><\/td><td><code>python3<\/code> is present, but there is no COBOL or JCL SAST tool (<code>semgrep<\/code> is absent too). The scan would be Claude-derived.<\/td><\/tr><tr><td><code>uplift<\/code><\/td><td><strong>Not applicable<\/strong><\/td><td>No version target is given. Any same-stack uplift would need z/OS tooling that is not available here.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Most important fix:<\/strong> nothing is red. The most useful fix is <code>brew install scc &amp;&amp; pip3 install lizard<\/code>, so that the assess metrics are measured rather than estimated.<\/p>\n<p><strong>Next step:<\/strong> <code>/code-modernization:modernize-assess carddemo-p2<\/code><\/p>"}, {"title": "How the requirements were generated", "html": "<p>The business functions, capabilities and requirements on this page were generated by Reframe from Claude&#x27;s results, outside the plugin. The rule cards and the open questions are as the plugin wrote them.<\/p><p>Reframe asked Claude once per domain, with only the plugin's results for that domain. Every requirement cites a rule card or a file and line that exist; 0 proposed requirements cited neither and were dropped. 270 of 270 rule cards are cited by a requirement.<\/p>"}], "classification": [], "unclassified": [], "issues": [], "decisions": [{"answer": "The complete source as Reframe snapshotted it (SHA-256 d9a77d549248727883ce64930d337dd6518322d4dead65a418eafd1eb402541a); nothing outside it is in scope for this assessment.", "at": "2026-11-23T05:33:13Z", "question": "claude-preflight-1", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "No. This pass is analysis only: nothing is built or run.", "at": "2026-11-23T05:33:13Z", "question": "claude-preflight-2", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "Don't know.", "at": "2026-11-23T05:33:13Z", "question": "claude-preflight-3", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "An AWS Transform assessment of the same snapshot was made; its results are kept apart and are not given to this assessment.", "at": "2026-11-23T05:33:13Z", "question": "claude-preflight-4", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "Everything: this pass is analysis only, and nothing in the source may change.", "at": "2026-11-23T05:33:13Z", "question": "claude-preflight-5", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "run 38 shards", "at": "2026-11-23T09:19:54Z", "question": "claude-estimate", "reason": "the upper estimate (570 agents) is within the agent limit (600)", "step": "claude rule extraction"}, {"answer": "run 38 shards", "at": "2026-11-23T13:02:06Z", "question": "claude-estimate", "reason": "the upper estimate (570 agents) is within the agent limit (600)", "step": "claude rule extraction"}, {"answer": "load", "at": "2026-11-23T13:24:14Z", "question": "claude-graph-load", "reason": "the run created this graph", "step": "claude graph"}], "links": {"pages": [["The plugin's own report", "plugin/REPORT.html", "REPORT.html"], ["The plugin's interactive map", "plugin/TOPOLOGY.html", "TOPOLOGY.html"]]}, "nav": [["AWS Transform's review", "../aws/index.html"], ["AWS Transform and Claude compared", "../comparison/index.html"]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
// AWS writes names in backticks (`TCATBAL-FILE`); show them as code, escaped like everything else.
const prose = v => esc(v).replace(/`([^`]+)`/g, '<code>$1</code>');
// Which assessment this page shows: AWS Transform's (pipeline 1) or Claude's (pipeline 2, with generated requirements).
const TOOL = D.tool || {key: 'aws', name: 'AWS Transform', short: 'AWS', generated: false};
const GEN = TOOL.generated ? '<span class="tag warn" title="' + esc(TOOL.generated_note || '') + '">Generated by Reframe</span>' : '';

// ---- indexes ----------------------------------------------------------------------------------------
const fnById = {}, capById = {}, reqByKey = {}, ruleByKey = {}, qByKey = {}, domByKey = {};
D.functions.forEach((f, i) => { f.index = i; fnById[f.id] = f; });
D.capabilities.forEach((c, i) => { c.index = i; capById[c.id] = c; });
D.requirements.forEach(r => reqByKey[r.key] = r);
D.rules.forEach(r => ruleByKey[r.key] = r);
D.questions.forEach(q => qByKey[q.key] = q);
D.domains.forEach((d, i) => { d.index = i; domByKey[d.key] = d; });
const business = D.rules.filter(r => r.disposition === 'captured');
const ruleCap = {}; D.requirements.forEach(r => (r.rules || []).forEach(k => { if (!ruleCap[k]) ruleCap[k] = r.capability; }));

function capItems(c){
  const keys = new Set();
  c.requirements.forEach(k => { keys.add(k); (reqByKey[k].rules || []).forEach(r => { if (ruleByKey[r] && ruleByKey[r].disposition === 'captured') keys.add(r); }); });
  c.questions.forEach(k => keys.add(k));
  return keys;
}
function fnItems(f){ const keys = new Set(); f.capabilities.forEach(id => capItems(capById[id]).forEach(k => keys.add(k))); f.other_rules.forEach(k => keys.add(k)); return keys; }
function domItems(d){ const keys = new Set(); d.functions.forEach(id => fnItems(fnById[id]).forEach(k => keys.add(k))); return keys; }
function countsOf(keys){ let req = 0, rule = 0, q = 0; keys.forEach(k => { if (reqByKey[k]) req++; else if (ruleByKey[k]) rule++; else if (qByKey[k]) q++; }); return {req, rule, q}; }

// ---- review marks, kept in this browser ---------------------------------------------------------------
const STORE = 'reframe-review:' + (D.project || '') + ':' + D.run + ':' + String(D.source.sha256 || '').slice(0, 16) + (TOOL.key === 'aws' ? '' : ':' + TOOL.key);
let marks = {}, stored = true;
try { marks = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { stored = false; }
let reviewer = ''; try { reviewer = localStorage.getItem('reframe-reviewer') || ''; } catch (e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch (e) { stored = false; } }
function reviewed(keys){ let n = 0; keys.forEach(k => { if (marks[k] && marks[k].status) n++; }); return n; }
function progress(keys){
  const total = keys.size, done = reviewed(keys), pct = total ? Math.round(100 * done / total) : 0;
  return '<div class="progress">' + done + ' of ' + total + ' reviewed<i><b style="width:' + pct + '%"></b></i></div>';
}
const STATUSES = [['agree', '✓ Agree'], ['change', '✎ Needs change'], ['question', '? Question']];
function markControls(key, hint){
  const m = marks[key] || {};
  return '<div class="marks" data-key="' + esc(key) + '">' + STATUSES.map(([s, label]) =>
    '<button class="' + s + '" aria-pressed="' + (m.status === s) + '" data-status="' + s + '">' + label + '</button>').join('') +
    (m.status ? '<textarea placeholder="' + esc(hint || 'Comment (optional): what should change, or what you want to ask') + '">' + esc(m.comment || '') + '</textarea>' : '') + '</div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('.marks button'); if (!b) return;
  const box = b.closest('.marks'), key = box.dataset.key, status = b.dataset.status;
  const m = marks[key] || {};
  if (m.status === status) delete marks[key]; else marks[key] = {status, comment: m.comment || '', at: new Date().toISOString()};
  save();
  const item = box.closest('.item'); if (item) item.className = 'item ' + ((marks[key] || {}).status || '');
  box.outerHTML = markControls(key);
});
document.addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const key = e.target.closest('.marks').dataset.key;
  if (marks[key]) { marks[key].comment = e.target.value; marks[key].at = new Date().toISOString(); save(); }
});

// ---- small pieces -----------------------------------------------------------------------------------
const PATTERN = {'Ubiquitous': 'Always', 'Event-driven': 'When something happens', 'State-driven': 'While a condition holds',
  'Unwanted': 'If something goes wrong', 'Optional': 'Where a feature applies', 'Complex': 'Combined conditions'};
function crumbs(parts){ return '<div class="crumbs">' + parts.map(([label, href]) => href ? '<a href="' + href + '">' + esc(label) + '</a>' : '<b>' + esc(label) + '</b>').join('<span>›</span>') + '</div>'; }
function numbers(list){ return '<div class="numbers">' + list.map(([n, l]) => '<div><b>' + n + '</b><span>' + esc(l) + '</span></div>').join('') + '</div>'; }
function countLine(c, extra){ return '<div class="counts">' + (extra || '') + '<span><b>' + c.req + '</b> requirements</span><span><b>' + c.rule + '</b> business rules</span><span><b>' + c.q + '</b> open questions</span></div>'; }
function ruleCard(key){
  const r = ruleByKey[key]; if (!r) return '';
  const extra = (r.priority ? '<span class="tag' + (r.priority === 'P0' ? ' warn' : '') + '">' + esc(r.priority) + '</span>' : '') + (r.category ? '<span class="tag grey">' + esc(r.category) + '</span>' : '') +
    (r.confidence ? '<span class="tag grey">Confidence: ' + esc(r.confidence) + '</span>' : '') + (r.source ? '<code>' + esc(r.source) + '</code>' : '');
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><span class="tag grey">Business rule</span>' + (r.id && TOOL.key !== 'aws' ? '<code>' + esc(r.id) + '</code>' : '') +
    '<span>' + esc(r.program) + '</span>' + extra + '</div>' +
    '<div class="text"><b>' + prose(r.name) + '</b>' + (r.plain ? '<br>' + prose(r.plain) : '') + '<br>' + prose(r.text).replace(/\n/g, '<br>') + '</div>' +
    (r.defect ? '<p class="small" style="margin:6px 0 0"><span class="tag warn">Suspected defect</span> ' + prose(r.defect) + '</p>' : '') + markControls(key) + '</div>';
}
function requirementCard(key){
  const r = reqByKey[key];
  const rules = (r.rules || []).filter(k => ruleByKey[k] && ruleByKey[k].disposition === 'captured');
  const kind = r.kind === 'N' ? 'Non-functional' : 'Functional';
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><code>' + esc(r.code) + '</code>' + GEN + '<span class="tag">' + esc(PATTERN[r.pattern] || r.pattern || kind) + '</span>' +
    (r.kind === 'N' ? '<span class="tag grey">Non-functional</span>' : '') + '</div><div class="text">' + prose(r.text) + '</div>' + markControls(key) +
    (rules.length ? '<details><summary>' + plural(rules.length, 'business rule') + ' behind it</summary><div class="rules">' + rules.map(ruleCard).join('') + '</div></details>' : '') + '</div>';
}
function questionCard(key){
  const q = qByKey[key];
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><code>' + esc(q.code) + '</code>' +
    (q.unverified ? '<span class="tag warn">Unverified requirement: please confirm</span>' : '<span class="tag">Open question</span>') +

let filters = {};
// One table with a text filter and dropdowns. A dropdown whose options depend on another (capability on function)
// is disabled until that one is chosen.
function filtered(name, rows, spec){
  const st = filters[name] || (filters[name] = {q: ''});
  const q = st.q.toLowerCase();
  const hits = rows.filter(r => (!q || spec.text(r).toLowerCase().includes(q)) && spec.selects.every(([id, , value]) => !st[id] || String(value(r)) === st[id]));
  const selects = spec.selects.map(([id, label, , options]) => {
    const list = options(rows, st);
    return '<select data-table="' + name + '" data-select="' + id + '"' + (list ? '' : ' disabled') + ' aria-label="' + esc(label) + '"><option value="">' +
      esc(list ? label : 'Choose a function first') + '</option>' + (list || []).map(([v, l]) => '<option value="' + esc(v) + '"' + (st[id] === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
  }).join('');
  const any = st.q || spec.selects.some(([id]) => st[id]);
  return '<div class="panel"><div class="tools"><input type="search" data-table="' + name + '" data-select="q" value="' + esc(st.q) + '" placeholder="Filter by words or ID">' + selects +
    (any ? '<button class="btn" data-clear="' + name + '">Clear filters</button>' : '') + '<span class="muted small" style="align-self:center">' + hits.length + ' of ' + rows.length + '</span></div>' +
    '<div class="tablebox"><table class="datatable"><colgroup>' + spec.cols.map(([, w]) => '<col' + (w ? ' style="width:' + w + '"' : '') + '>').join('') + '</colgroup><thead><tr>' +
    spec.cols.map(([c]) => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + hits.map(spec.render).join('') + '</tbody></table>' +
    (hits.length ? '' : '<p class="muted" style="padding:12px">Nothing matches these filters.</p>') + '</div></div>';
}
function refilter(target){
  const name = target.dataset.table, id = target.dataset.select, st = filters[name] || (filters[name] = {q: ''});
  st[id] = target.value;
  if (id === 'fn') st.cap = '';
  const typing = id === 'q', at = target.selectionStart;

document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.table && e.target.tagName === 'INPUT') refilter(e.target); });

// ---- routing ----------------------------------------------------------------------------------------
function route(){
  const parts = (location.hash || '#/').slice(2).split('/'), [kind, a] = parts;
  let h, tech = kind === 'tech', focus = null;
  if (kind === 'd' && D.domains[+a]) h = domainPage(D.domains[+a]);
  else if (kind === 'f' && D.functions[+a]) h = functionPage(D.functions[+a]);
  else if (kind === 'c' && D.capabilities[+a]) { focus = parts[2] ? decodeURIComponent(parts.slice(2).join('/')) : null; h = capabilityPage(D.capabilities[+a], focus); }
  else if (kind === 'search' && a) { const q = decodeURIComponent(parts.slice(1).join('/')); if (document.activeElement !== $('search')) $('search').value = q; h = searchPage(q); }
  else if (tech) h = techPage(a || 'requirements');
  else h = overview();
  $('main').innerHTML = h;
  $('vReview').classList.toggle('on', !tech); $('vTech').classList.toggle('on', tech);
  if (focus) { const el = document.getElementById(anchor(focus)); if (el) { const det = el.closest('details'); if (det) det.open = true; el.scrollIntoView({block: 'center'}); el.style.outline = '2px solid var(--accent)'; } }
  else if (!(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.table)) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

$('search').addEventListener('input', e => { clearTimeout(searchTimer); const v = e.target.value.trim(); searchTimer = setTimeout(() => { location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/'; }, 250); });

    capability: c.title ? c.number + '. ' + c.title : '', id: r ? r.code : q ? q.code : b.program + ' ' + b.id, text: r ? r.text : q ? q.text : b.name + ': ' + b.text};

function updateCounts(){
  const keys = allKeys(), c = countsOf(keys), done = reviewed(keys), by = {agree: 0, change: 0, question: 0};
  Object.values(marks).forEach(m => { if (m && by[m.status] != null) by[m.status]++; });
  $('reviewCounts').innerHTML = '<b>' + done + ' of ' + keys.size + '</b> items marked (' + c.req + ' requirements, ' + c.rule + ' business rules, ' + c.q + ' open questions in all).<br>' +
    'Agree ' + by.agree + ' · Needs change ' + by.change + ' · Question ' + by.question;
}
$('reviewButton').addEventListener('click', () => { $('reviewer').value = reviewer; updateCounts(); if (!stored) $('storageNote').className = 'note'; $('reviewDialog').showModal(); });
$('closeDialog').addEventListener('click', () => $('reviewDialog').close());
$('reviewer').addEventListener('input', e => { reviewer = e.target.value.trim(); try { localStorage.setItem('reframe-reviewer', reviewer); } catch (err) {} });
$('downloadCsv').addEventListener('click', () => {
  const cols = ['tool', 'domain', 'business_function', 'capability', 'type', 'id', 'text', 'status', 'comment', 'reviewer', 'marked_at', 'project', 'run', 'source_sha256'];
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const body = [cols.join(',')].concat(rows().map(r => cols.map(c => cell(c === 'tool' ? TOOL.name : c === 'reviewer' ? reviewer : c === 'project' ? D.project : c === 'run' ? D.run : c === 'source_sha256' ? D.source.sha256 : r[c])).join(','))).join('\r\n');
  download(fileName('csv'), 'text/csv;charset=utf-8', '﻿' + body);
});
$('downloadJson').addEventListener('click', () => {
  download(fileName('json'), 'application/json', JSON.stringify({format: 'reframe-review/1', tool: TOOL.name, project: D.project, run: D.run,
    source: {name: D.source.name, commit: D.source.commit, sha256: D.source.sha256}, reviewer, exported_at: new Date().toISOString(), marks: rows()}, null, 2));
});
$('clearMarks').addEventListener('click', () => { if (confirm('Clear every mark you made on this page? Download them first if you want to keep them.')) { marks = {}; save(); updateCounts(); route(); } });

$('title').textContent = 'Business review' + (D.project ? ': ' + D.project : '');
$('subtitle').textContent = TOOL.name + ' assessment of ' + (D.source.name || 'the source') + (D.source.commit ? ' @ ' + String(D.source.commit).slice(0, 12) : '');
$('others').innerHTML = (D.nav || []).map(([label, href]) => '<a href="' + esc(href) + '">' + esc(label) + '</a>').join('');
route();
</script>
</body>
</html>
