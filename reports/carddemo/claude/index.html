laude/util/05/REQ-F-006", "claude/util/05/REQ-F-007", "claude/util/05/REQ-F-008", "claude/util/05/REQ-F-009", "claude/util/05/REQ-F-010"], "questions": ["claude/util/05/OQ-002"]}, {"id": "claude/util/06#1", "function": "claude/util/06", "number": 1, "title": "Pause a batch step for a set time", "story": "As a batch operator, I want a job step to wait for a given number of centiseconds, so that the job can pause before its next step runs.", "fields": {}, "other": "", "requirements": ["claude/util/06/REQ-F-001", "claude/util/06/REQ-F-002", "claude/util/06/REQ-F-003"], "questions": ["claude/util/06/OQ-001"]}], "requirements": [{"key": "claude/signon/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When transaction CC00 starts with no commarea (first entry), the system shall show a cleared sign-on screen with the cursor on User ID.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-178"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the sign-on screen, the system shall run validation and authentication.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-178"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the sign-on screen, the system shall send the plain-text thank-you message (CCDA-MSG-THANK-YOU) and end the CICS task without re-arming CC00, so that the user leaves the application entirely.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-178"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the user presses any key other than Enter or PF3 on the sign-on screen, then the system shall set the error flag and redisplay the screen with CCDA-MSG-INVALID-KEY.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-178"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall, in all non-exit cases on the sign-on screen, return control with TRANSID CC00 and the CardDemo commarea.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-178"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the sign-on screen is submitted with Enter and the User ID is blank (spaces or low-values), then the system shall set the error flag, redisplay the screen with 'Please enter User ID ...' and the cursor on User ID, and not read the user security file.", "capability": "claude/signon/01#2", "function": "claude/signon/01", "rules": ["claude/RULE-112"], "sources": ["app/cbl/COSGN00C.cbl:117-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the sign-on screen is submitted with Enter and the User ID is filled in but the Password is blank (spaces or low-values), then the system shall set the error flag, redisplay the screen with 'Please enter Password ...' and the cursor on Password, and not read the user security file.", "capability": "claude/signon/01#2", "function": "claude/signon/01", "rules": ["claude/RULE-112"], "sources": ["app/cbl/COSGN00C.cbl:117-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If both the User ID and the Password are blank, then the system shall show only the 'Please enter User ID ...' message.", "capability": "claude/signon/01#2", "function": "claude/signon/01", "rules": ["claude/RULE-112"], "sources": ["app/cbl/COSGN00C.cbl:117-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall upper-case the typed User ID and copy it into the session commarea field CDEMO-USER-ID even after a validation failure, before control returns.", "capability": "claude/signon/01#2", "function": "claude/signon/01", "rules": ["claude/RULE-112"], "sources": ["app/cbl/COSGN00C.cbl:117-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed and both the User ID and Password are non-blank, the system shall upper-case the User ID, use it as the key to read the USRSEC file (8-character user ID), and upper-case the entered password before comparing it.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-047"], "sources": ["app/cbl/COSGN00C.cbl:209-257"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When a USRSEC record exists for the entered User ID and its stored password equals the upper-cased entered password by plain equality, the system shall sign the user on.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-047"], "sources": ["app/cbl/COSGN00C.cbl:209-257"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the stored password does not match the entered password, then the system shall redisplay the screen with 'Wrong Password. Try again ...' and the cursor on Password, without setting the error flag.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-047"], "sources": ["app/cbl/COSGN00C.cbl:209-257"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If no USRSEC record exists for the entered User ID (RESP 13 NOTFND), then the system shall show 'User not found. Try again ...' with the cursor on User ID.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-047"], "sources": ["app/cbl/COSGN00C.cbl:209-257"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the USRSEC read returns any other response (for example file closed or I/O error), then the system shall show 'Unable to verify the User ...' with the cursor on User ID.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-047"], "sources": ["app/cbl/COSGN00C.cbl:209-257"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall store and compare passwords in clear text and treat them as case-insensitive, so that a stored password containing lower-case letters can never match.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-047"], "sources": ["app/cbl/COSGN00C.cbl:209-257"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Event-driven", "text": "When a sign-on attempt fails with a wrong password or unknown user, the system shall redisplay the screen and check the next attempt exactly as the first, with no attempt counter, lockout, delay or audit record.", "capability": "claude/signon/01#4", "function": "claude/signon/01", "rules": ["claude/RULE-227"], "sources": ["app/cbl/COSGN00C.cbl:241-256"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall show distinct messages for 'User not found' and 'Wrong Password', which reveal which user IDs exist.", "capability": "claude/signon/01#4", "function": "claude/signon/01", "rules": ["claude/RULE-227", "claude/RULE-047"], "sources": ["app/cbl/COSGN00C.cbl:241-256"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the password matches, the system shall set the commarea with from-transaction 'CC00', from-program 'COSGN00C', the user's ID, the user's type and program context 0 (first entry).", "capability": "claude/signon/01#5", "function": "claude/signon/01", "rules": ["claude/RULE-177"], "sources": ["app/cbl/COSGN00C.cbl:223-240"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the password matches and the USRSEC user type is 'A', the system shall transfer control (XCTL) to the Admin menu COADM01C.", "capability": "claude/signon/01#5", "function": "claude/signon/01", "rules": ["claude/RULE-177"], "sources": ["app/cbl/COSGN00C.cbl:223-240"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the password matches and the user type is anything other than 'A' (including blank, 'U', or an unexpected code), the system shall transfer control to the regular user menu COMEN01C.", "capability": "claude/signon/01#5", "function": "claude/signon/01", "rules": ["claude/RULE-177"], "sources": ["app/cbl/COSGN00C.cbl:223-240"], "programs": ["COSGN00C"]}, {"key": "claude/signon/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the Main Menu (CM00) or the Admin Menu (CA00) is started with no session data (commarea length 0), then the system shall show no menu and transfer control to the sign-on program COSGN00C.", "capability": "claude/signon/02#1", "function": "claude/signon/02", "rules": ["claude/RULE-174"], "sources": ["app/cbl/COMEN01C.cbl:82-105", "app/cbl/COADM01C.cbl:86-109"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a menu is started with session data present, the system shall load it and continue with the menu's first-display or re-entry logic.", "capability": "claude/signon/02#1", "function": "claude/signon/02", "rules": ["claude/RULE-174"], "sources": ["app/cbl/COMEN01C.cbl:82-105"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the target program is blank or low-values when returning to the sign-on screen, then the system shall fall back to COSGN00C.", "capability": "claude/signon/02#1", "function": "claude/signon/02", "rules": ["claude/RULE-174"], "sources": ["app/cbl/COMEN01C.cbl:82-105"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "State-driven", "text": "While the program-context flag CDEMO-PGM-CONTEXT is 0 (enter), the system shall set the context to 1 (re-enter), clear the screen and send the menu.", "capability": "claude/signon/02#2", "function": "claude/signon/02", "rules": ["claude/RULE-175"], "sources": ["app/cbl/COMEN01C.cbl:87-110", "app/cbl/COADM01C.cbl:91-114"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "State-driven", "text": "While the program-context flag is 1 (re-enter), the system shall read the screen and handle the key pressed.", "capability": "claude/signon/02#2", "function": "claude/signon/02", "rules": ["claude/RULE-175"], "sources": ["app/cbl/COMEN01C.cbl:87-110"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall end every menu path by returning to CICS with transaction CM00 (or CA00 for the admin menu) and the session data.", "capability": "claude/signon/02#2", "function": "claude/signon/02", "rules": ["claude/RULE-175"], "sources": ["app/cbl/COMEN01C.cbl:87-110"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the Main Menu or Admin Menu, the system shall process the typed option number.", "capability": "claude/signon/02#3", "function": "claude/signon/02", "rules": ["claude/RULE-109"], "sources": ["app/cbl/COMEN01C.cbl:93-103"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the Main Menu or Admin Menu, the system shall transfer the user to the sign-on program COSGN00C.", "capability": "claude/signon/02#3", "function": "claude/signon/02", "rules": ["claude/RULE-109"], "sources": ["app/cbl/COMEN01C.cbl:93-103", "app/cbl/COADM01C.cbl:97-107"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the user presses any other attention key (for example PF5) on a menu, then the system shall set the error flag, show the shared message CCDA-MSG-INVALID-KEY and send the menu again.", "capability": "claude/signon/02#3", "function": "claude/signon/02", "rules": ["claude/RULE-109"], "sources": ["app/cbl/COMEN01C.cbl:93-103"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall trim the typed option, pad it with leading zeros to two digits and show the normalised 2-digit value on the redisplayed option field.", "capability": "claude/signon/02#4", "function": "claude/signon/02", "rules": ["claude/RULE-108"], "sources": ["app/cbl/COMEN01C.cbl:115-134"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the normalised option is numeric and between 1 and the menu's option count (11 on the Main Menu, 6 on the Admin Menu), the system shall accept and select that option.", "capability": "claude/signon/02#4", "function": "claude/signon/02", "rules": ["claude/RULE-108"], "sources": ["app/cbl/COMEN01C.cbl:115-134", "app/cbl/COADM01C.cbl:119-138"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the option is non-numeric, zero (including blank input, which becomes '00') or greater than the menu's option count, then the system shall show 'Please enter a valid option number...' and select nothing.", "capability": "claude/signon/02#4", "function": "claude/signon/02", "rules": ["claude/RULE-108"], "sources": ["app/cbl/COMEN01C.cbl:115-134"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When a user picks a valid option, the system shall record the menu's own transaction and program as the origin ('CM00'/'COMEN01C' for the Main Menu, 'CA00'/'COADM01C' for the Admin Menu), set CDEMO-PGM-CONTEXT to 0 and pass control and session data to the chosen program.", "capability": "claude/signon/02#5", "function": "claude/signon/02", "rules": ["claude/RULE-173"], "sources": ["app/cbl/COMEN01C.cbl:177-188", "app/cbl/COADM01C.cbl:141-148"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall map Main Menu options 1-11 to COACTVWC, COACTUPC, COCRDLIC, COCRDSLC, COCRDUPC, COTRN00C, COTRN01C, COTRN02C, CORPT00C, COBIL00C and COPAUS0C, and Admin Menu options 1-6 to COUSR00C, COUSR01C, COUSR02C, COUSR03C, COTRTLIC and COTRTUPC.", "capability": "claude/signon/02#5", "function": "claude/signon/02", "rules": ["claude/RULE-173"], "sources": ["app/cbl/COMEN01C.cbl:177-188"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall carry the user ID and user type over from sign-on in the session data without setting them again at the menu.", "capability": "claude/signon/02#5", "function": "claude/signon/02", "rules": ["claude/RULE-173"], "sources": ["app/cbl/COMEN01C.cbl:177-188"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When a user selects a valid Main Menu option whose program name begins with 'DUMMY', the system shall not transfer and shall show the green message 'This option <name>is coming soon ...' on the menu.", "capability": "claude/signon/02#6", "function": "claude/signon/02", "rules": ["claude/RULE-253"], "sources": ["app/cbl/COMEN01C.cbl:169-176"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the user selects Main Menu option 11 (program COPAUS0C), the system shall first ask CICS whether COPAUS0C is defined and, if it is, record where the user came from and transfer control.", "capability": "claude/signon/02#6", "function": "claude/signon/02", "rules": ["claude/RULE-225"], "sources": ["app/cbl/COMEN01C.cbl:145-168"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If COPAUS0C is not defined, then the system shall show the red message 'This option <option name> is not installed...' and the menu again.", "capability": "claude/signon/02#6", "function": "claude/signon/02", "rules": ["claude/RULE-225"], "sources": ["app/cbl/COMEN01C.cbl:145-168"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If an admin selects a valid Admin Menu option whose program name starts with 'DUMMY', or the transfer fails because the program is not defined (PGMIDERR), then the system shall show the Admin Menu again with the green message 'This option is not installed ...'.", "capability": "claude/signon/02#6", "function": "claude/signon/02", "rules": ["claude/RULE-246"], "sources": ["app/cbl/COADM01C.cbl:140-158"], "programs": ["COADM01C"]}, {"key": "claude/signon/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If a user of type 'U' presses Enter on a Main Menu option whose user type is 'A', then the system shall set the error flag, show 'No access - Admin Only option... ' and not transfer.", "capability": "claude/signon/03#1", "function": "claude/signon/03", "rules": ["claude/RULE-046"], "sources": ["app/cbl/COMEN01C.cbl:136-143"], "programs": ["COMEN01C"]}, {"key": "claude/signon/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a user of type 'A' selects a Main Menu option, the system shall allow any option to be selected.", "capability": "claude/signon/03#1", "function": "claude/signon/03", "rules": ["claude/RULE-046"], "sources": ["app/cbl/COMEN01C.cbl:136-143"], "programs": ["COMEN01C"]}, {"key": "claude/signon/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send only users of type 'A' to the Admin Menu at sign-on.", "capability": "claude/signon/03#2", "function": "claude/signon/03", "rules": ["claude/RULE-177"], "sources": ["app/cbl/COSGN00C.cbl:223-240"], "programs": ["COSGN00C"]}, {"key": "claude/signon/03/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The Admin Menu shall accept any caller that has session data (commarea length > 0) without checking that the user type is 'A'.", "capability": "claude/signon/03#2", "function": "claude/signon/03", "rules": ["claude/RULE-044"], "sources": ["app/cbl/COADM01C.cbl:86-109"], "programs": ["COADM01C"]}, {"key": "claude/useradmin/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the user list (transaction CU00) is invoked with no session context (no communication area), then the system shall transfer control to the sign-on program COSGN00C.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COUSR00C.cbl:110-139"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the user list is entered for the first time in a session, the system shall load the first page of users from the start of the user file.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COUSR00C.cbl:110-139"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF3 on the user list, the system shall transfer control to the Admin menu COADM01C, recording CU00/COUSR00C as the originating transaction and program.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COUSR00C.cbl:110-139"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the administrator presses a key other than Enter, PF3, PF7 or PF8 on the user list, then the system shall show the invalid-key message (CCDA-MSG-INVALID-KEY) and redisplay the screen.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COUSR00C.cbl:110-139"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses Enter and no valid U/D selection transfers control, the system shall reset the page counter and show up to 10 users starting at the user ID typed in the 'Search User ID' field as page 1.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-230"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Optional", "text": "Where the 'Search User ID' field is blank, the system shall start the list at the beginning of the user file.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-230"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the list has loaded successfully from the search value, the system shall clear the 'Search User ID' field.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-230"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If no user record matches the start key, then the system shall show the message 'You are at the top of the page...'.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-230"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If any other user file error occurs while starting the list, then the system shall show the message 'Unable to lookup User...'.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-230"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show up to 10 users per page in user ID order, each row showing the user ID, first name, last name and user type from the user security record.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-033", "claude/RULE-256"], "sources": ["app/cbl/COUSR00C.cbl:282-331", "app/cbl/COUSR00C.cbl:384-441"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall never display the user's password in the user list.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-256"], "sources": ["app/cbl/COUSR00C.cbl:384-441"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF8 and a next page exists, the system shall show the next up to 10 users after the last user shown and increase the page number by 1 if at least one user is shown.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-033"], "sources": ["app/cbl/COUSR00C.cbl:282-331"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When a page has been filled with 10 users, the system shall perform a look-ahead read and set the next-page indicator to Y if a further user exists and to N otherwise.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-033"], "sources": ["app/cbl/COUSR00C.cbl:282-331"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the administrator presses PF8 while the next-page indicator is N, then the system shall not read the user file and shall show 'You are already at the bottom of the page...' without erasing the screen.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-131"], "sources": ["app/cbl/COUSR00C.cbl:260-277"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF7 and the page number is greater than 1, the system shall show the 10 users before the current page and decrease the page number.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-032"], "sources": ["app/cbl/COUSR00C.cbl:237-255"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the administrator presses PF7 on page 1, then the system shall not read the user file and shall show 'You are already at the top of the page...' without erasing the screen.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-032"], "sources": ["app/cbl/COUSR00C.cbl:237-255"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the start of the user file is reached while filling a previous page, then the system shall show 'You have reached the top of the page...'.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-032"], "sources": ["app/cbl/COUSR00C.cbl:237-255"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses Enter with 'U' or 'u' in a row's selection field, the system shall pass that row's user ID to the Update User program COUSR02C and transfer control to it.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-121"], "sources": ["app/cbl/COUSR00C.cbl:149-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses Enter with 'D' or 'd' in a row's selection field, the system shall pass that row's user ID to the Delete User program COUSR03C and transfer control to it.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-121"], "sources": ["app/cbl/COUSR00C.cbl:149-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If the selection code is not U, u, D or d, then the system shall show 'Invalid selection. Valid values are U and D' and redisplay the list.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-121"], "sources": ["app/cbl/COUSR00C.cbl:149-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Optional", "text": "Where more than one row is marked, the system shall act only on the first marked row (lowest row number).", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-121"], "sources": ["app/cbl/COUSR00C.cbl:149-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If a selection is made on a row whose user ID is blank, then the system shall ignore that selection.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-121"], "sources": ["app/cbl/COUSR00C.cbl:149-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses Enter on the Add User screen (transaction CU01), the system shall check First Name, Last Name, User ID, Password and User Type in that order and report only the first blank field (for example 'Last Name can NOT be empty...') with the cursor on that field.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-122"], "sources": ["app/cbl/COUSR01C.cbl:115-160"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If any of the five profile fields is blank (all spaces or low-values), then the system shall not write a user record.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-122"], "sources": ["app/cbl/COUSR01C.cbl:115-160"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If a user with the same User ID already exists in the USRSEC file, then the system shall reject the add, show 'User ID already exist...', place the cursor on User ID and leave the existing record unchanged.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-048"], "sources": ["app/cbl/COUSR01C.cbl:238-274"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When all five fields are filled and the User ID is new, the system shall write the user security record, clear the form and show 'User <id> has been added ...' in green.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-048", "claude/RULE-122"], "sources": ["app/cbl/COUSR01C.cbl:238-274", "app/cbl/COUSR01C.cbl:115-160"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If writing the new user fails for any reason other than a duplicate user ID, then the system shall show 'Unable to Add User...'.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-048"], "sources": ["app/cbl/COUSR01C.cbl:238-274"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept and store any single non-blank character as User Type, with only 'A' treated as Admin elsewhere in the system.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-123"], "sources": ["app/cbl/COUSR01C.cbl:142-158"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall store the password exactly as entered in the 8-character password field of the USRSEC record, without hashing, encryption or strength rules.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-231"], "sources": ["app/cbl/COUSR01C.cbl:154-159"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF3 on the Add User screen, the system shall return to the Admin menu COADM01C.", "capability": "claude/useradmin/02#2", "function": "claude/useradmin/02", "rules": ["claude/RULE-257"], "sources": ["app/cbl/COUSR01C.cbl:90-103"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF4 on the Add User screen, the system shall clear the form.", "capability": "claude/useradmin/02#2", "function": "claude/useradmin/02", "rules": ["claude/RULE-257"], "sources": ["app/cbl/COUSR01C.cbl:90-103"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the administrator presses any key other than Enter, PF3 or PF4 on the Add User screen, then the system shall show the invalid-key message.", "capability": "claude/useradmin/02#2", "function": "claude/useradmin/02", "rules": ["claude/RULE-257"], "sources": ["app/cbl/COUSR01C.cbl:90-103"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If transaction CU01 is invoked with no communication area, then the system shall transfer control to the sign-on program COSGN00C.", "capability": "claude/useradmin/02#3", "function": "claude/useradmin/02", "rules": ["claude/RULE-233"], "sources": ["app/cbl/COUSR01C.cbl:78-105"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the Update User program is started with no session context (empty communication area), then the system shall transfer control to the sign-on program COSGN00C.", "capability": "claude/useradmin/03#1", "function": "claude/useradmin/03", "rules": ["claude/RULE-183"], "sources": ["app/cbl/COUSR02C.cbl:90-105"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the Update User program is entered for the first time with a user preselected on the User List screen, the system shall pre-fill User ID with that user and fetch and show the user's details.", "capability": "claude/useradmin/03#1", "function": "claude/useradmin/03", "rules": ["claude/RULE-183"], "sources": ["app/cbl/COUSR02C.cbl:90-105"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the preselected user ID is blank or low-values, then the system shall show an empty screen with the cursor on User ID.", "capability": "claude/useradmin/03#1", "function": "claude/useradmin/03", "rules": ["claude/RULE-183"], "sources": ["app/cbl/COUSR02C.cbl:90-105"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses Enter with a User ID that exists in the USRSEC file, the system shall show the user's first name, last name, password and type and the message 'Press PF5 key to save your updates ...'.", "capability": "claude/useradmin/03#2", "function": "claude/useradmin/03", "rules": ["claude/RULE-124"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the User ID is blank when Enter is pressed, then the system shall show 'User ID can NOT be empty...' and not look up the user.", "capability": "claude/useradmin/03#2", "function": "claude/useradmin/03", "rules": ["claude/RULE-124"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the User ID is not in the USRSEC file, then the system shall show 'User ID NOT found...' and return the cursor to User ID.", "capability": "claude/useradmin/03#2", "function": "claude/useradmin/03", "rules": ["claude/RULE-124"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If any other file error occurs during the lookup, then the system shall show 'Unable to lookup User...'.", "capability": "claude/useradmin/03#2", "function": "claude/useradmin/03", "rules": ["claude/RULE-124"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF5 (Save) or PF3 (Save & Exit), the system shall check User ID, First Name, Last Name, Password and User Type in that order and report only the first blank field with its message (for example 'Last Name can NOT be empty...') and the cursor on that field.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-125"], "sources": ["app/cbl/COUSR02C.cbl:179-213"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If any required field is blank, then the system shall not write an update.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-125"], "sources": ["app/cbl/COUSR02C.cbl:179-213"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When all required fields are present, the system shall compare first name, last name, password and user type with the stored record (exact, case-sensitive), copy over the changed fields, rewrite the record and show 'User <id> has been updated ...' in green.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COUSR02C.cbl:215-245"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If no field differs from the stored record, then the system shall write nothing and show 'Please modify to update ...' in red.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COUSR02C.cbl:215-245"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the rewrite finds no record, then the system shall show 'User ID NOT found...'; for any other rewrite failure it shall show 'Unable to Update User...'.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COUSR02C.cbl:215-245"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not change a user's User ID, which is the record key, through an update.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COUSR02C.cbl:215-245"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept any single non-blank character as User Type on update, although the screen hint says '(A=Admin, U=User)'.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-125"], "sources": ["app/cbl/COUSR02C.cbl:179-213"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF3 on the Update User screen, the system shall validate and save, then return to the calling program, or to the Admin menu COADM01C if no caller is recorded.", "capability": "claude/useradmin/03#4", "function": "claude/useradmin/03", "rules": ["claude/RULE-232"], "sources": ["app/cbl/COUSR02C.cbl:108-131"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF4 on the Update User screen, the system shall clear all fields and the message.", "capability": "claude/useradmin/03#4", "function": "claude/useradmin/03", "rules": ["claude/RULE-232"], "sources": ["app/cbl/COUSR02C.cbl:108-131"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF12 on the Update User screen, the system shall go to the Admin menu COADM01C without saving.", "capability": "claude/useradmin/03#4", "function": "claude/useradmin/03", "rules": ["claude/RULE-232"], "sources": ["app/cbl/COUSR02C.cbl:108-131"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the administrator presses any key other than Enter, PF3, PF4, PF5 or PF12 on the Update User screen, then the system shall show the invalid-key message (CCDA-MSG-INVALID-KEY).", "capability": "claude/useradmin/03#4", "function": "claude/useradmin/03", "rules": ["claude/RULE-232"], "sources": ["app/cbl/COUSR02C.cbl:108-131"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the administrator enters a User ID and presses Enter on the Delete User screen (transaction CU03), the system shall show the user's first name, last name and type with 'Press PF5 key to delete this user ...'.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-139"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF5, the system shall delete the user record for the User ID in the input field from USRSEC, clear the screen and show 'User <id> has been deleted ...' in green.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-139"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Optional", "text": "Where the administrator arrives from the user list with a preselected user ID, the system shall look up that user automatically on first display.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-139"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the User ID is blank when Enter or PF5 is pressed, then the system shall show 'User ID can NOT be empty...'.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-139"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the User ID is unknown, then the system shall show 'User ID NOT found...'; for other read errors it shall show 'Unable to lookup User...' and for other delete errors 'Unable to Update User...'.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-139"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If transaction CU03 is invoked with no communication area, then the system shall transfer control to the sign-on program COSGN00C.", "capability": "claude/useradmin/04#2", "function": "claude/useradmin/04", "rules": ["claude/RULE-233"], "sources": ["app/cbl/COUSR03C.cbl:90-132"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF3 on the Delete User screen, the system shall return to the calling program, or to the Admin menu COADM01C if no caller is recorded.", "capability": "claude/useradmin/04#3", "function": "claude/useradmin/04", "rules": ["claude/RULE-257"], "sources": ["app/cbl/COUSR03C.cbl:108-130"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF4 on the Delete User screen, the system shall clear the form.", "capability": "claude/useradmin/04#3", "function": "claude/useradmin/04", "rules": ["claude/RULE-257"], "sources": ["app/cbl/COUSR03C.cbl:108-130"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the administrator presses PF12 on the Delete User screen, the system shall return to the Admin menu COADM01C.", "capability": "claude/useradmin/04#3", "function": "claude/useradmin/04", "rules": ["claude/RULE-257"], "sources": ["app/cbl/COUSR03C.cbl:108-130"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the administrator presses any key other than Enter, PF3, PF4, PF5 or PF12 on the Delete User screen, then the system shall show the invalid-key message.", "capability": "claude/useradmin/04#3", "function": "claude/useradmin/04", "rules": ["claude/RULE-257"], "sources": ["app/cbl/COUSR03C.cbl:108-130"], "programs": ["COUSR03C"]}, {"key": "claude/account/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the account view is entered from the main menu with program context ENTER, or with no session data, the system shall reset the session context, show the empty search screen and set the context to REENTER.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-167"], "sources": ["app/cbl/COACTVWC.cbl:282-393"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the operator submits the account view screen, the system shall edit the inputs and, if they are valid, read the account and redisplay the screen.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-167"], "sources": ["app/cbl/COACTVWC.cbl:282-393"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the account number is blank or '*', then the system shall reject the request as not supplied with 'Account number not provided', highlight the account field in red with the cursor on it, and read no file.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-096"], "sources": ["app/cbl/COACTVWC.cbl:649-681"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the account number is not exactly 11 digits or is all zeros, then the system shall reject it with 'Account Filter must  be a non-zero 11 digit number', set the session account ID to 0 and read no file.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-096"], "sources": ["app/cbl/COACTVWC.cbl:649-681"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a valid account number such as '00000012345' is entered, the system shall accept it and copy it to the session account ID.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-096"], "sources": ["app/cbl/COACTVWC.cbl:649-681"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall keep only the first error message raised in a request, so that later errors do not overwrite it.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-096", "claude/RULE-091"], "sources": ["app/cbl/COACTVWC.cbl:649-681", "app/cbl/COACTUPC.cbl:1783-1818"], "programs": ["COACTUPC", "COACTVWC"]}, {"key": "claude/account/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall recognise only Enter (look up) and PF3 (exit) on the account view screen, with PF13-PF24 mapped to PF1-PF12 so that PF15 also exits.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-128"], "sources": ["app/cbl/COACTVWC.cbl:299-314"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If any other key (for example PF7, Clear or PA1) is pressed on the account view screen, then the system shall treat it as Enter.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-128"], "sources": ["app/cbl/COACTVWC.cbl:299-314"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the program context is neither ENTER (0) nor REENTER (1), then the system shall end the task with abend code '0001' and the message 'UNEXPECTED DATA SCENARIO'.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-167"], "sources": ["app/cbl/COACTVWC.cbl:375-382"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a valid account number is entered, the system shall read the card cross-reference by account ID, then the account master by account ID, then the customer master by the customer ID from the cross-reference.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-097"], "sources": ["app/cbl/COACTVWC.cbl:687-722"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the account is found in the card cross-reference, the system shall store its customer ID and card number in the session.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-097"], "sources": ["app/cbl/COACTVWC.cbl:687-722"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the account is not in the card cross-reference, then the system shall stop the lookup without reading the account or customer and show 'Account:<id> not found in Cross ref file. Resp:.. Reas:..'.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-097"], "sources": ["app/cbl/COACTVWC.cbl:687-722"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the account is not found in the account master, then the system shall raise an input error with 'Account:<id> not found in Acct Master file.Resp:..'.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-097"], "sources": ["app/cbl/COACTVWC.cbl:687-722"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the customer is not found in the customer master, then the system shall raise an input error with 'CustId:<id> not found in customer master.Resp: ..'.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-097"], "sources": ["app/cbl/COACTVWC.cbl:687-722"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If a file read returns any other response, then the system shall raise an input error with 'File Error: READ on <file> returned RESP .. ,RESP2 ..'.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-097"], "sources": ["app/cbl/COACTVWC.cbl:687-722"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the account or the customer was found, the system shall display the account financial details: status, balance, credit limit, cash limit, cycle credits and debits, open, expiry and reissue dates, and group.", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-220"], "sources": ["app/cbl/COACTVWC.cbl:460-535"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the customer was found, the system shall display the customer personal details: name, address, phones, SSN, FICO, date of birth, government ID, EFT account and primary cardholder flag.", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-220"], "sources": ["app/cbl/COACTVWC.cbl:460-535"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "State-driven", "text": "While no info message is set, the system shall show the info line 'Enter or update id of account to display'.", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-220"], "sources": ["app/cbl/COACTVWC.cbl:460-535"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the account view is first entered with no commarea, the system shall show only the prompt.", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-220"], "sources": ["app/cbl/COACTVWC.cbl:460-535"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall display the customer's SSN in full, without masking, formatted as 3-2-4 digits with dashes (for example '123-45-6789').", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-221"], "sources": ["app/cbl/COACTVWC.cbl:493-507"], "programs": ["COACTVWC"]}, {"key": "claude/account/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the account number is blank or '*' when no account has been fetched, then the system shall show 'Account number not provided', flag the search as blank and read nothing.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-091"], "sources": ["app/cbl/COACTUPC.cbl:1783-1818"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the account number is non-numeric or all zeros, then the system shall show 'Account Number if supplied must be a 11 digit Non-Zero Number', reset the context account ID to zeros and read nothing.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-091"], "sources": ["app/cbl/COACTUPC.cbl:1783-1818"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a numeric, non-zero account number such as '00000012345' is entered, the system shall accept it and store it as the context account ID.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-091"], "sources": ["app/cbl/COACTUPC.cbl:1783-1818"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When no account has been fetched or the operator presses PF12, the system shall re-read the account and, if the customer is found, show the details (state 'S').", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "State-driven", "text": "While no account has been fetched, the system shall allow only the account number to be edited.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-245"], "sources": ["app/cbl/COACTUPC.cbl:3500-3560"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "State-driven", "text": "While an account is in state 'S' or 'E', the system shall allow all account and customer fields to be edited except customer ID and country, which shall be protected.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-245"], "sources": ["app/cbl/COACTUPC.cbl:3500-3560"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "State-driven", "text": "While an account is in state 'N' or 'C', the system shall protect all fields.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-245"], "sources": ["app/cbl/COACTUPC.cbl:3500-3560"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the credit limit, cash credit limit, current balance and current-cycle credit and debit totals, and accept each in any currency-style numeric format (for example '$5,000.00' -> 5000.00).", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-023"], "sources": ["app/cbl/COACTUPC.cbl:1072-1140"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If an amount is blank or '*', then the system shall show '<field> must be supplied.', and if it is not a valid number (for example '12a'), then the system shall show '<field> is not valid'.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-023"], "sources": ["app/cbl/COACTUPC.cbl:1072-1140"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall store each amount as a signed value with 2 decimals (maximum 9,999,999,999.99), truncating rather than rounding extra decimals (for example 10.999 -> 10.99).", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-023", "claude/RULE-005"], "sources": ["app/cbl/COACTUPC.cbl:1072-1140"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the account active status to be exactly 'Y' or 'N'.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-092"], "sources": ["app/cbl/COACTUPC.cbl:1856-1893"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the account status is blank, low-values or '0', then the system shall show 'Account Status must be supplied.', and if it is any other value than 'Y' or 'N', then the system shall show 'Account Status must be Y or N.'.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-092"], "sources": ["app/cbl/COACTUPC.cbl:1856-1893"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the open, expiry and reissue dates to be complete real calendar dates (YYYY, MM, DD) with century 19 or 20, month 1-12, correct month lengths and leap years.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-086"], "sources": ["app/cbl/COACTUPC.cbl:1478-1543"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If a date is not a real calendar date, then the system shall reject it with the matching message, such as 'Not a leap year.Cannot have 29 days in this month.', 'Century is not valid.' or 'Cannot have 31 days in this month.'.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-086"], "sources": ["app/cbl/COACTUPC.cbl:1478-1543"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the year, month or day of a date is missing, then the system shall show '<field> : Year/Month/Day must be supplied.'.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-086"], "sources": ["app/cbl/COACTUPC.cbl:1478-1543"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When a date passes the calendar checks, the system shall finally check it with the CSUTLDTC date service.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-086"], "sources": ["app/cbl/COACTUPC.cbl:1478-1543"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require first name, last name, city and country, and allow them to contain only letters and spaces.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-089"], "sources": ["app/cbl/COACTUPC.cbl:1560-1662"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If a name or city contains characters other than letters and spaces (for example \"O'Brien\" or 'St. Louis'), then the system shall show '<field> can have alphabets only.', and if a required one is blank, then the system shall show '<field> must be supplied.'.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-089"], "sources": ["app/cbl/COACTUPC.cbl:1560-1662"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Optional", "text": "Where a middle name is entered, the system shall allow letters only.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-089"], "sources": ["app/cbl/COACTUPC.cbl:1560-1662"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require address line 1 with any characters, and shall not validate address line 2 or the government ID.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-089"], "sources": ["app/cbl/COACTUPC.cbl:1560-1662"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the ZIP (first 5 characters) and the 10-character EFT account ID to be numeric and not zero, showing 'EFT Account Id must not be zero.' for an all-zero EFT account ID.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-089"], "sources": ["app/cbl/COACTUPC.cbl:1560-1662"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the state to be a valid US state or territory code, showing 'State: is not a valid state code' otherwise.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-095"], "sources": ["app/cbl/COACTUPC.cbl:2493-2560"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When both the state and the ZIP pass their own edits, the system shall check that the first two ZIP digits match a known prefix for that state, and otherwise show 'Invalid zip code for state' with both fields flagged.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-095"], "sources": ["app/cbl/COACTUPC.cbl:2493-2560"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Optional", "text": "Where phone number 1 or 2 is entered, the system shall require the area code (3 digits), prefix (3 digits) and line number (4 digits) to each be numeric and non-zero, and the area code to be a valid North American general-purpose area code.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-093"], "sources": ["app/cbl/COACTUPC.cbl:2225-2429"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Unwanted", "text": "If a phone part is invalid, then the system shall show the matching message, such as 'Phone Number 1: Not valid North America general purpose area code', 'Prefix code cannot be zero', or a 'must be supplied' message for each missing part.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-093"], "sources": ["app/cbl/COACTUPC.cbl:2225-2429"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the SSN in three parts (3-2-4 digits), each numeric and not zero, with the first part not 000, 666 or 900-999.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-094"], "sources": ["app/cbl/COACTUPC.cbl:2431-2491"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Unwanted", "text": "If an SSN part is invalid, then the system shall show the matching message, such as 'SSN: First 3 chars: should not be 000, 666, or between 900 and 999', 'SSN 4th & 5th chars must not be zero.' or 'must be all numeric.'.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-094"], "sources": ["app/cbl/COACTUPC.cbl:2431-2491"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the date of birth to be a complete real calendar date in the 1900s or 2000s that is strictly earlier than today's date.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-086", "claude/RULE-087"], "sources": ["app/cbl/COACTUPC.cbl:1478-1543", "app/cbl/COACTUPC.cbl:1533-1543"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Unwanted", "text": "If the date of birth is today or in the future, then the system shall reject it with 'Date of Birth:cannot be in the future '.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-087"], "sources": ["app/cbl/COACTUPC.cbl:1533-1543"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the FICO score as a 3-digit number between 300 and 850 inclusive.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-088"], "sources": ["app/cbl/COACTUPC.cbl:1545-1556"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Unwanted", "text": "If the FICO score is outside 300-850, then the system shall show 'FICO Score: should be between 300 and 850', if it is blank 'FICO Score must be supplied.', and if it is non-numeric 'must be all numeric.'.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-088"], "sources": ["app/cbl/COACTUPC.cbl:1545-1556", "app/cbl/COACTUPC.cbl:2514-2530"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the primary-cardholder indicator to be exactly 'Y' or 'N'.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-092"], "sources": ["app/cbl/COACTUPC.cbl:1856-1893"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Event-driven", "text": "When the operator submits the update screen, the system shall run the field edits only if at least one account or customer value differs from what was fetched.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-090"], "sources": ["app/cbl/COACTUPC.cbl:1681-1775"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall compare status, group ID, customer ID, names, address lines, state, country, zip, government ID and primary holder flag ignoring case and surrounding spaces, and compare amounts, dates, phone parts, SSN, EFT ID and FICO exactly.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-090"], "sources": ["app/cbl/COACTUPC.cbl:1681-1775"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Unwanted", "text": "If no value differs from what was fetched, then the system shall show 'No change detected with respect to values fetched.' and validate and save nothing.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-090"], "sources": ["app/cbl/COACTUPC.cbl:1681-1775"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-036", "code": "REQ-F-036", "kind": "F", "pattern": "Unwanted", "text": "If any edit fails, then the system shall set the state to 'E' and keep the operator on the edit screen with the cursor on the first bad field.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-037", "code": "REQ-F-037", "kind": "F", "pattern": "Event-driven", "text": "When all edits pass, the system shall set the state to 'N' and show 'Changes validated.Press F5 to save'.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-038", "code": "REQ-F-038", "kind": "F", "pattern": "State-driven", "text": "While changes are validated but not confirmed (state 'N'), the system shall save only when the operator presses PF5 and otherwise keep the state at 'N'.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-166", "claude/RULE-219"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-039", "code": "REQ-F-039", "kind": "F", "pattern": "State-driven", "text": "While confirmation is pending, the system shall highlight the PF5 and PF12 prompts.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-245"], "sources": ["app/cbl/COACTUPC.cbl:3500-3560"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-040", "code": "REQ-F-040", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall honour only Enter, PF3, PF5 (only after changes are validated) and PF12 (only after an account is fetched) on the update screen.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-219"], "sources": ["app/cbl/COACTUPC.cbl:905-959"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-041", "code": "REQ-F-041", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed, or PF5 or PF12 is pressed when not eligible, then the system shall treat it as Enter.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-219"], "sources": ["app/cbl/COACTUPC.cbl:905-959"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-042", "code": "REQ-F-042", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses PF3, the system shall commit and return to the calling program, or to the main menu (COMEN01C, transaction CM00) if there was none.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-219"], "sources": ["app/cbl/COACTUPC.cbl:905-959"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-043", "code": "REQ-F-043", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses PF5 on validated changes, the system shall lock the account record, then the customer record, and rewrite both.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-134"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-044", "code": "REQ-F-044", "kind": "F", "pattern": "Event-driven", "text": "When the records are locked, the system shall re-read the account and customer and compare them with the snapshot taken when they were displayed, covering account status, balance, limits, cycle totals, dates and group ID, and customer names, addresses, state, country, ZIP, phones, SSN, government ID, DOB, EFT, primary flag and FICO.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-190"], "sources": ["app/cbl/COACTUPC.cbl:4109-4192"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If another user changed either record since it was displayed, then the system shall write nothing, show 'Record changed by some one else. Please review' and return the state to 'show details'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-190", "claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:4109-4192"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-045", "code": "REQ-F-045", "kind": "F", "pattern": "Unwanted", "text": "If the account record cannot be locked, then the system shall show 'Could not lock account record for update' and set the state to 'L'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-134", "claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-046", "code": "REQ-F-046", "kind": "F", "pattern": "Unwanted", "text": "If the customer record cannot be locked, then the system shall show 'Could not lock customer record for update'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-134"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-047", "code": "REQ-F-047", "kind": "F", "pattern": "Unwanted", "text": "If the account rewrite fails, then the system shall show 'Update of record failed' and set the state to 'F'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-134", "claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Unwanted", "text": "If the customer rewrite fails, then the system shall roll back the account change and set the state to 'F', so that the two records stay consistent.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-134"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-048", "code": "REQ-F-048", "kind": "F", "pattern": "Event-driven", "text": "When both records are rewritten, the system shall set the state to 'C' and show 'Changes committed to database'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-134", "claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:3888-4104", "app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-049", "code": "REQ-F-049", "kind": "F", "pattern": "Event-driven", "text": "When the update is saved, the system shall store entered dates as 'YYYY-MM-DD', phones as '(AAA)BBB-CCCC' and amounts as signed 2-decimal values.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-005", "claude/RULE-093"], "sources": ["app/cbl/COACTUPC.cbl:3976-4059"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-050", "code": "REQ-F-050", "kind": "F", "pattern": "Event-driven", "text": "When the update is saved, the system shall rebuild the account record so that it matches the account master layout, with the account ZIP and the group ID each in its own position.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-005"], "sources": ["app/cbl/COACTUPC.cbl:418-433"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-051", "code": "REQ-F-051", "kind": "F", "pattern": "Event-driven", "text": "When the operator interacts after the state is 'C', 'L' or 'F', the system shall clear all data and ask for a new account number.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-052", "code": "REQ-F-052", "kind": "F", "pattern": "Unwanted", "text": "If the update state is not one of the expected values, then the system shall abend with code '0001' and 'UNEXPECTED DATA SCENARIO'.", "capability": "claude/account/02#5", "function": "claude/account/02", "rules": ["claude/RULE-166"], "sources": ["app/cbl/COACTUPC.cbl:2562-2642"], "programs": ["COACTUPC"]}, {"key": "claude/card/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "State-driven", "text": "While a valid account filter and/or a valid card number filter is entered, the system shall list
