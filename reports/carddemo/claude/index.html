ge...'.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-143"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:361-385"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8, the system shall show the next page of authorizations.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-142"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:190-257"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall keep saved first-record keys for up to 20 pages.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-143"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:361-385"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the user marks a listed authorization with 'S' (either case) and presses Enter with a valid Account ID, the system shall pass control to the authorization detail program COPAUS1C with that row's authorization key, marking the session as coming from COPAUS0C/CPVS.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-053"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "State-driven", "text": "While several rows are marked, the system shall use the first marked row from top to bottom and ignore the rest.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-053"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Unwanted", "text": "If any selection code other than 'S' or 's' is entered, then the system shall show 'Invalid selection. Valid value is S' and redisplay the list.", "capability": "claude/auth/02#2", "function": "claude/auth/02", "rules": ["claude/RULE-053"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332"], "programs": ["COPAUS0C"]}, {"key": "claude/auth/02/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When the detail screen is first entered or the user presses Enter, the system shall load the authorization only when the account id passed from the summary screen is numeric and an authorization key has been selected.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-055", "claude/RULE-196"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If the account id is not numeric or no authorization key is selected, then the system shall set the error flag and show the screen with all detail fields blank.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-055"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the pending authorization summary for the account, then the detail segment matching the selected key under that account, and display the details.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-055"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Unwanted", "text": "If the summary or detail is not found ('GE') or the end of database ('GB') is reached, then the system shall treat it as end-of-data, not an error.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-055"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Unwanted", "text": "If any other IMS status is returned, then the system shall set the error flag and show ' System error while reading Auth Summary/Details: Code:<status>'.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-055"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Event-driven", "text": "When the authorization has been read successfully, the system shall release the PSB with a SYNCPOINT.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-055"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall display the original date YYMMDD as MM/DD/YY, the time HHMMSS as HH:MM:SS, the card expiry MMYY as MM/YY, and the approved amount (not the requested amount) signed with 2 decimals (-zzzzzzz9.99).", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-035"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:294-357"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the fraud field as the fraud flag and report date (for example 'F-11/23/25' or 'R-<date>') when the flag is 'F' or 'R', or '-' if never tagged.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-035"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:294-357"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall translate the 4-digit reason code into a description from a fixed table (0000 APPROVED; 3100 INVALID CARD; 4100 INSUFFICNT FUND; 4200 CARD NOT ACTIVE; 4300 ACCOUNT CLOSED; 4400 EXCED DAILY LMT; 5100 CARD FRAUD; 5200 MERCHANT FRAUD; 5300 LOST CARD; 9000 UNKNOWN).", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-011"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:319-328"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Unwanted", "text": "If the reason code is not in the table, then the system shall show '9999-ERROR'.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-011"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:319-328"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall keep the reason code table in ascending code order.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-011"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:319-328"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF8, the system shall fetch the next pending authorization under the same account, make it the selected key and display its details.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-144", "claude/RULE-196"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Unwanted", "text": "If the current authorization is the last one and PF8 is pressed, then the system shall show 'Already at the last Authorization...' and keep the current view.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-144"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-036", "code": "REQ-F-036", "kind": "F", "pattern": "Unwanted", "text": "If an IMS error other than not-found or end occurs reading the next authorization, then the system shall set the error flag and show ' System error while reading next Auth: Code:<status>'.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-144"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:268-289"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-037", "code": "REQ-F-037", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the detail screen, the system shall transfer control to COPAUS0C (summary list).", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-196"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:157-206"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-038", "code": "REQ-F-038", "kind": "F", "pattern": "Unwanted", "text": "If any key other than Enter, PF3, PF5 or PF8 is pressed, then the system shall re-display the details with the standard invalid-key message.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-196"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:157-206"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-039", "code": "REQ-F-039", "kind": "F", "pattern": "Unwanted", "text": "If the detail screen is started with no context (EIBCALEN = 0), then the system shall initialize the context and transfer the user to COPAUS0C.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-196"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:157-206"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/02/REQ-F-040", "code": "REQ-F-040", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall clear the fraud data area in the commarea on every entry to the detail screen.", "capability": "claude/auth/02#3", "function": "claude/auth/02", "rules": ["claude/RULE-196"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:157-206"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF5 on an authorization, the system shall change its fraud flag to 'R' (fraud removed) if it is 'F' (fraud confirmed), and otherwise set it to 'F'.", "capability": "claude/auth/03#1", "function": "claude/auth/03", "rules": ["claude/RULE-132"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the fraud flag is toggled, the system shall send the action ('F' report, 'R' remove) with the full auth record, account id and customer id to the fraud register program COPAUS2C before saving the change to the authorization record.", "capability": "claude/auth/03#1", "function": "claude/auth/03", "rules": ["claude/RULE-132"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When COPAUS2C succeeds, the system shall save the detail segment with the new flag and the fraud report date and show 'AUTH MARKED FRAUD...' or 'AUTH FRAUD REMOVED...'.", "capability": "claude/auth/03#1", "function": "claude/auth/03", "rules": ["claude/RULE-132"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the fraud action is complete, the system shall refresh the screen with the same authorization key.", "capability": "claude/auth/03#1", "function": "claude/auth/03", "rules": ["claude/RULE-132"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a user reports fraud ('F') or removes a fraud flag ('R'), the system shall insert a full snapshot of the authorization into CARDDEMO.AUTHFRDS with AUTH_FRAUD set to the action and FRAUD_RPT_DATE = CURRENT DATE, returning status 'S' with 'ADD SUCCESS'.", "capability": "claude/auth/03#2", "function": "claude/auth/03", "rules": ["claude/RULE-133"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244"], "programs": ["COPAUS2C"]}, {"key": "claude/auth/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If a record already exists for the same card and authorization timestamp (SQLCODE -803), then the system shall update only AUTH_FRAUD and FRAUD_RPT_DATE, returning status 'S' with 'UPDT SUCCESS'.", "capability": "claude/auth/03#2", "function": "claude/auth/03", "rules": ["claude/RULE-133"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244"], "programs": ["COPAUS2C"]}, {"key": "claude/auth/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If any other DB2 error occurs, then the system shall return status 'F' with a message containing the SQLCODE and SQLSTATE.", "capability": "claude/auth/03#2", "function": "claude/auth/03", "rules": ["claude/RULE-133"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244"], "programs": ["COPAUS2C"]}, {"key": "claude/auth/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When a fraud flag is removed ('R'), the system shall keep the fraud register row with flag 'R' rather than delete it.", "capability": "claude/auth/03#2", "function": "claude/auth/03", "rules": ["claude/RULE-133"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:137-244"], "programs": ["COPAUS2C"]}, {"key": "claude/auth/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build the fraud record's authorization timestamp (AUTH_TS) from the original authorization date (YYMMDD) and the time recovered from the inverted IMS key (999999999 - stored time key, HHMMSSmmm), padding milliseconds with '000' and parsing with 'YY-MM-DD HH24.MI.SSNNNNNN'.", "capability": "claude/auth/03#2", "function": "claude/auth/03", "rules": ["claude/RULE-012"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:103-114"], "programs": ["COPAUS2C"]}, {"key": "claude/auth/03/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Event-driven", "text": "When COPAUS2C returns 'S' and the IMS replace of the authorization detail returns OK (status blank or 'FW'), the system shall commit both the Db2 and IMS changes with a SYNCPOINT and show a success message.", "capability": "claude/auth/03#3", "function": "claude/auth/03", "rules": ["claude/RULE-188"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:520-552"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/03/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Unwanted", "text": "If the IMS replace returns any other status, then the system shall issue SYNCPOINT ROLLBACK to undo the Db2 fraud row as well, set the error flag and show ' System error while FRAUD Tagging, ROLLBACK||<code>'.", "capability": "claude/auth/03#3", "function": "claude/auth/03", "rules": ["claude/RULE-188"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:520-552"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/03/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Unwanted", "text": "If the LINK to COPAUS2C fails or COPAUS2C reports failure, then the system shall roll back the change and show COPAUS2C's message where one is returned.", "capability": "claude/auth/03#3", "function": "claude/auth/03", "rules": ["claude/RULE-188", "claude/RULE-132"], "sources": ["app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266", "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:520-552"], "programs": ["COPAUS1C"]}, {"key": "claude/auth/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the nightly purge runs, the system shall delete a pending authorization detail once the number of days since it was authorized reaches or exceeds the expiry-days setting, whether it was approved or declined.", "capability": "claude/auth/04#1", "function": "claude/auth/04", "rules": ["claude/RULE-187"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:277-296"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall compute the authorization date as 99999 - PA-AUTH-DATE-9C (YYDDD) and compare its difference from today's date (YYDDD) with the expiry days.", "capability": "claude/auth/04#1", "function": "claude/auth/04", "rules": ["claude/RULE-187"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:277-296"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When an approved authorization (response code '00') is purged, the system shall reduce the account summary's approved count by 1 and approved amount by its approved amount.", "capability": "claude/auth/04#1", "function": "claude/auth/04", "rules": ["claude/RULE-007"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:287-293"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When an authorization with any other response code is purged, the system shall reduce the declined count by 1 and the declined amount by its transaction amount.", "capability": "claude/auth/04#1", "function": "claude/auth/04", "rules": ["claude/RULE-007"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:287-293"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When an account's expired details have been purged, the system shall delete the account's pending-authorization summary if its approved-authorization count is zero or less, which also removes any remaining child details under it.", "capability": "claude/auth/04#1", "function": "claude/auth/04", "rules": ["claude/RULE-140"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall take an IMS checkpoint when the processed summary count exceeds the checkpoint frequency, plus a final checkpoint.", "capability": "claude/auth/04#1", "function": "claude/auth/04", "rules": ["claude/RULE-140"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If any IMS error occurs on read or delete, then the system shall end the job with return code 16.", "capability": "claude/auth/04#1", "function": "claude/auth/04", "rules": ["claude/RULE-140"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:142-167"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the expiry days (max 99), checkpoint frequency, checkpoint display frequency and debug flag from the SYSIN control card.", "capability": "claude/auth/04#2", "function": "claude/auth/04", "rules": ["claude/RULE-192", "claude/RULE-187"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-209"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the control card leaves out or garbles a parameter, then the system shall apply the defaults of 5 days to expire, a checkpoint every 5 summaries, a checkpoint message on every 10th checkpoint, and debug off.", "capability": "claude/auth/04#2", "function": "claude/auth/04", "rules": ["claude/RULE-192"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-209"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall turn debug on only if the debug flag is exactly 'Y'.", "capability": "claude/auth/04#2", "function": "claude/auth/04", "rules": ["claude/RULE-192"], "sources": ["app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:196-209"], "programs": ["CBPAUP0C"]}, {"key": "claude/auth/05/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall export every pending-authorization summary (one per account) and every authorization detail under it, without filtering by age, match status, fraud flag or response code.", "capability": "claude/auth/05#1", "function": "claude/auth/05", "rules": ["claude/RULE-199"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:207-247"], "programs": ["PAUDBUNL"]}, {"key": "claude/auth/05/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If a summary's account id is not a valid number, then the system shall skip that summary and all of its authorization details without raising an error and continue with the next summary.", "capability": "claude/auth/05#1", "function": "claude/auth/05", "rules": ["claude/RULE-057"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:223-238"], "programs": ["PAUDBUNL"]}, {"key": "claude/auth/05/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write a summary file with one 100-byte record per account, and a detail file in which each 200-byte authorization detail is preceded by its parent account id.", "capability": "claude/auth/05#1", "function": "claude/auth/05", "rules": ["claude/RULE-201"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:43-48"], "programs": ["PAUDBUNL"]}, {"key": "claude/auth/05/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If either output file cannot be opened, a summary read returns a status other than blank or 'GB', or a detail read returns a status other than blank or 'GE', then the system shall display the status and key feedback and end with return code 16.", "capability": "claude/auth/05#1", "function": "claude/auth/05", "rules": ["claude/RULE-200", "claude/RULE-197"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:239-283", "app/app-authorization-ims-db2-mq/cbl/DBUNLDGS.CBL:249-294"], "programs": ["DBUNLDGS", "PAUDBUNL"]}, {"key": "claude/auth/05/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If a GSAM insert to the backup files returns any non-blank status, then the system shall print the status and key feedback and end with return code 16.", "capability": "claude/auth/05#1", "function": "claude/auth/05", "rules": ["claude/RULE-197"], "sources": ["app/app-authorization-ims-db2-mq/cbl/DBUNLDGS.CBL:249-294"], "programs": ["DBUNLDGS"]}, {"key": "claude/auth/05/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If an output file close returns a non-'00' status, then the system shall display it without changing the return code.", "capability": "claude/auth/05#1", "function": "claude/auth/05", "rules": ["claude/RULE-200"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:239-283"], "programs": ["PAUDBUNL"]}, {"key": "claude/auth/05/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the database is rebuilt from the unload files, the system shall insert every summary first and only then insert the details.", "capability": "claude/auth/05#2", "function": "claude/auth/05", "rules": ["claude/RULE-145"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:175-183"], "programs": ["PAUDBLOD"]}, {"key": "claude/auth/05/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert a reloaded detail under the summary whose account ID matches its key, only if that key is numeric and the summary can be found.", "capability": "claude/auth/05#2", "function": "claude/auth/05", "rules": ["claude/RULE-056"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:272-314"], "programs": ["PAUDBLOD"]}, {"key": "claude/auth/05/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If a reloaded detail has a non-numeric account key, then the system shall skip the record.", "capability": "claude/auth/05#2", "function": "claude/auth/05", "rules": ["claude/RULE-056"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:272-314"], "programs": ["PAUDBLOD"]}, {"key": "claude/auth/05/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If a summary or detail being reloaded is already in the database (status II), then the system shall log 'already in DB', keep the existing record unchanged and continue with the next record.", "capability": "claude/auth/05#2", "function": "claude/auth/05", "rules": ["claude/RULE-198"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:253-262"], "programs": ["PAUDBLOD"]}, {"key": "claude/auth/05/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If any other insert failure occurs, then the system shall stop the job with return code 16.", "capability": "claude/auth/05#2", "function": "claude/auth/05", "rules": ["claude/RULE-198"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:253-262"], "programs": ["PAUDBLOD"]}, {"key": "claude/auth/05/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If an input file fails to open (status other than blank or '00'), then the system shall stop the job with return code 16.", "capability": "claude/auth/05#2", "function": "claude/auth/05", "rules": ["claude/RULE-145"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:175-183"], "programs": ["PAUDBLOD"]}, {"key": "claude/auth/05/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If a file close error occurs, then the system shall display it without stopping the job.", "capability": "claude/auth/05#2", "function": "claude/auth/05", "rules": ["claude/RULE-145"], "sources": ["app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:175-183"], "programs": ["PAUDBLOD"]}, {"key": "claude/trantype/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Optional", "text": "Where a description filter is entered, the system shall list only transaction types whose description contains the entered text, using the pattern '%' + TRIM(input) + '%' in the forward, backward and count queries.", "capability": "claude/trantype/01#1", "function": "claude/trantype/01", "rules": ["claude/RULE-013"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1142-1178"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall match the description filter case-sensitively and pass any '%' or '_' the user types into the match pattern unescaped.", "capability": "claude/trantype/01#1", "function": "claude/trantype/01", "rules": ["claude/RULE-013"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1142-1178"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Optional", "text": "Where a type code filter is entered, the system shall list only the transaction type with that code, treating a blank (LOW-VALUES, SPACES) or '00' value as no filter.", "capability": "claude/trantype/01#1", "function": "claude/trantype/01", "rules": ["claude/RULE-060"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1096-1140"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the type code filter is supplied and is not a 2-digit number, then the system shall show 'TYPE CODE FILTER,IF SUPPLIED MUST BE A 2 DIGIT NUMBER', show the field in red and lock row selection.", "capability": "claude/trantype/01#1", "function": "claude/trantype/01", "rules": ["claude/RULE-060"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1096-1140"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the type or description filter differs from the value previously used, the system shall reset paging and mark the filter as changed.", "capability": "claude/trantype/01#1", "function": "claude/trantype/01", "rules": ["claude/RULE-013", "claude/RULE-060"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1096-1140"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If a type or description filter is supplied and no transaction type matches it, then the system shall show 'No Records found for these filter conditions', show the offending filter in red and lock row selection instead of showing an empty list.", "capability": "claude/trantype/01#1", "function": "claude/trantype/01", "rules": ["claude/RULE-061"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1239-1271"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "State-driven", "text": "While both filters are blank, the system shall skip the matching-record count check.", "capability": "claude/trantype/01#1", "function": "claude/trantype/01", "rules": ["claude/RULE-061"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1239-1271"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the filter count query returns a SQL error, then the system shall treat it as an input error.", "capability": "claude/trantype/01#1", "function": "claude/trantype/01", "rules": ["claude/RULE-061"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1239-1271"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show 7 transaction types per page in ascending type-code order.", "capability": "claude/trantype/01#2", "function": "claude/trantype/01", "rules": ["claude/RULE-014"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1799"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the user presses F8, the system shall show the next page starting at the stored last key, reading one extra row to determine whether a further page exists.", "capability": "claude/trantype/01#2", "function": "claude/trantype/01", "rules": ["claude/RULE-014"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1799"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If the user presses F8 when no further page exists, then the system shall show 'No more pages to display'.", "capability": "claude/trantype/01#2", "function": "claude/trantype/01", "rules": ["claude/RULE-014"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1799"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the user presses F7, the system shall read type codes below the first key on the page in descending order and fill rows 7 down to 1.", "capability": "claude/trantype/01#2", "function": "claude/trantype/01", "rules": ["claude/RULE-014"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1799"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the user presses F7 on page 1, then the system shall re-read page 1 and show 'No previous pages to display'.", "capability": "claude/trantype/01#2", "function": "claude/trantype/01", "rules": ["claude/RULE-014"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1799"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If no transaction types match the search, then the system shall show 'No records found for this search condition.'.", "capability": "claude/trantype/01#2", "function": "claude/trantype/01", "rules": ["claude/RULE-014"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1799"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept only blank, 'U' (update) or 'D' (delete) in each row's select field.", "capability": "claude/trantype/02#1", "function": "claude/trantype/02", "rules": ["claude/RULE-062"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:982-1053"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If a row's select field holds any other code, then the system shall show 'Action code selected is invalid'.", "capability": "claude/trantype/02#1", "function": "claude/trantype/02", "rules": ["claude/RULE-062"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:982-1053"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If more than one row carries an action, then the system shall highlight those rows in red and show 'Please select only 1 action'.", "capability": "claude/trantype/02#1", "function": "claude/trantype/02", "rules": ["claude/RULE-062"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:982-1053"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When either filter has changed, the system shall discard all row selections and skip the action edits.", "capability": "claude/trantype/02#1", "function": "claude/trantype/02", "rules": ["claude/RULE-062"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:982-1053"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If a row marked 'U' has a blank description (or '*'), then the system shall show 'Transaction Desc must be supplied.' and flag an input error.", "capability": "claude/trantype/02#2", "function": "claude/trantype/02", "rules": ["claude/RULE-059"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1094"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If a row marked 'U' has a description containing characters other than A-Z, a-z, 0-9 and space, then the system shall show 'Transaction Desc can have numbers or alphabets only.', flag an input error and show the description in red.", "capability": "claude/trantype/02#2", "function": "claude/trantype/02", "rules": ["claude/RULE-059"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1094"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall limit the transaction type description to 50 characters.", "capability": "claude/trantype/02#2", "function": "claude/trantype/02", "rules": ["claude/RULE-059"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1094"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the new description equals the stored description after trimming both and ignoring case, then the system shall show 'No change detected with respect to database values.'.", "capability": "claude/trantype/02#2", "function": "claude/trantype/02", "rules": ["claude/RULE-059"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1094"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When exactly one valid action is entered and neither filter changed, the system shall prompt 'Delete HIGHLIGHTED row ? Press F10 to confirm' or 'Update HIGHLIGHTED row. Press F10 to save' and record the request as pending.", "capability": "claude/trantype/02#3", "function": "claude/trantype/02", "rules": ["claude/RULE-151"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:574-678"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "State-driven", "text": "While a delete or update request is pending, the system shall run it when the user presses F10 without changing the type filter, the description filter or the selected row.", "capability": "claude/trantype/02#3", "function": "claude/trantype/02", "rules": ["claude/RULE-151"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:574-678"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If F10 is pressed with no pending request, or after a filter or the selected row changed, then the system shall treat F10 as Enter and redisplay the list.", "capability": "claude/trantype/02#3", "function": "claude/trantype/02", "rules": ["claude/RULE-151", "claude/RULE-062"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:574-678"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept only Enter, PF2, PF3, PF7, PF8 and (while a request is pending) PF10, treating any other key as Enter.", "capability": "claude/trantype/02#3", "function": "claude/trantype/02", "rules": ["claude/RULE-151"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:574-678"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When an update is confirmed with F10, the system shall overwrite only the description of the selected type code, commit the change, show 'HIGHLIGHTED row was updated' and re-read the page from the first code on the current page.", "capability": "claude/trantype/02#4", "function": "claude/trantype/02", "rules": ["claude/RULE-149"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the input edits fail, then the system shall not attempt the update.", "capability": "claude/trantype/02#4", "function": "claude/trantype/02", "rules": ["claude/RULE-149"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the update finds no row (SQLCODE +100), then the system shall show 'Record not found. Deleted by others ?' and keep the update pending.", "capability": "claude/trantype/02#4", "function": "claude/trantype/02", "rules": ["claude/RULE-149"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the update hits a deadlock (SQLCODE -911), then the system shall show 'Deadlock. Someone else updating ?', flag an input error and keep the update pending.", "capability": "claude/trantype/02#4", "function": "claude/trantype/02", "rules": ["claude/RULE-149"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the update fails with any other negative SQLCODE, then the system shall show 'Update failed with' and keep the update pending.", "capability": "claude/trantype/02#4", "function": "claude/trantype/02", "rules": ["claude/RULE-149"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1837-1894"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When a delete is confirmed with F10 and succeeds, the system shall commit, show 'HIGHLIGHTED row deleted.Hit Enter to continue' and reset the list to page 1.", "capability": "claude/trantype/02#5", "function": "claude/trantype/02", "rules": ["claude/RULE-150"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1896-1940"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If the database reports dependent child records (SQLCODE -532), then the system shall delete nothing, keep the request pending and show 'Please delete associated child records first:'.", "capability": "claude/trantype/02#5", "function": "claude/trantype/02", "rules": ["claude/RULE-150"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1896-1940"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If the delete fails with any other error, then the system shall show 'Delete failed with message:'.", "capability": "claude/trantype/02#5", "function": "claude/trantype/02", "rules": ["claude/RULE-150"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1896-1940"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When transaction CTLI is started without a commarea, the system shall mark the session as an admin user and make the full list, update and delete function available.", "capability": "claude/trantype/02#6", "function": "claude/trantype/02", "rules": ["claude/RULE-203"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:515-532"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3, the system shall commit and return to the calling program, or to the Admin menu (COADM01C / CA00) when there is no other caller.", "capability": "claude/trantype/02#6", "function": "claude/trantype/02", "rules": ["claude/RULE-236"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:591-652"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF2, the system shall transfer to the transaction-type add/update program COTRTUPC (transaction CTTU).", "capability": "claude/trantype/02#6", "function": "claude/trantype/02", "rules": ["claude/RULE-236"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:591-652"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When the user returns with PF3 from COTRTUPC, the system shall reset the list to page 1.", "capability": "claude/trantype/02#6", "function": "claude/trantype/02", "rules": ["claude/RULE-236"], "sources": ["app/app-transaction-type-db2/cbl/COTRTLIC.cbl:591-652"], "programs": ["COTRTLIC"]}, {"key": "claude/trantype/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the transaction type code is blank (spaces, low-values or '*'), then the system shall show 'Tran Type code must be supplied.' and stay in search mode.", "capability": "claude/trantype/03#1", "function": "claude/trantype/03", "rules": ["claude/RULE-065"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:907-973"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the transaction type code is not numeric, then the system shall show 'Tran Type code must be numeric.' and mark the search key as invalid.", "capability": "claude/trantype/03#1", "function": "claude/trantype/03", "rules": ["claude/RULE-065"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:907-973"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the transaction type code is '00', then the system shall show 'Tran Type code must not be zero.'.", "capability": "claude/trantype/03#1", "function": "claude/trantype/03", "rules": ["claude/RULE-065"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:907-973"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When a valid code is entered, the system shall normalise it to a 2-digit zero-padded code (for example '5' becomes '05') and use it as the lookup key.", "capability": "claude/trantype/03#1", "function": "claude/trantype/03", "rules": ["claude/RULE-065"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:834-842"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a valid key is entered and no record is fetched yet, the system shall read the table and show the details if found, or show 'Press F05 to add. F12 to cancel' if not found.", "capability": "claude/trantype/03#1", "function": "claude/trantype/03", "rules": ["claude/RULE-154"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:978-1082"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the type code and the trimmed description equal the stored values ignoring upper/lower case, then the system shall show 'No change detected with respect to values fetched.', keep the record in show-details state and offer no save.", "capability": "claude/trantype/03#2", "function": "claude/trantype/03", "rules": ["claude/RULE-063"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:783-812"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If a changed or new description is blank, then the system shall show 'Transaction Desc must be supplied.' and set state 'changes not OK'.", "capability": "claude/trantype/03#2", "function": "claude/trantype/03", "rules": ["claude/RULE-064"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:849-902"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If a changed or new description contains characters other than A-Z, a-z, 0-9 and space, then the system shall show 'Transaction Desc can have numbers or alphabets only.' and set state 'changes not OK'.", "capability": "claude/trantype/03#2", "function": "claude/trantype/03", "rules": ["claude/RULE-064"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:849-902"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When a changed description of up to 50 characters passes validation, the system shall set state 'changes OK, not confirmed' and prompt 'Changes validated.Press F5 to save'.", "capability": "claude/trantype/03#2", "function": "claude/trantype/03", "rules": ["claude/RULE-064", "claude/RULE-154"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:849-902"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall keep only the first validation error message.", "capability": "claude/trantype/03#2", "function": "claude/trantype/03", "rules": ["claude/RULE-064"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:849-902"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When a looked-up code is not found and the operator presses F5, the system shall enter create-new mode and show 'Enter new transaction type details.'.", "capability": "claude/trantype/03#3", "function": "claude/trantype/03", "rules": ["claude/RULE-154"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:978-1082"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses F5 with validated changes awaiting confirmation, the system shall update the description for the type code and commit, showing 'Changes committed to database'.", "capability": "claude/trantype/03#3", "function": "claude/trantype/03", "rules": ["claude/RULE-152"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1592"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If no row exists for the type code on save (SQLCODE +100), then the system shall insert a new transaction type with that code and description and commit.", "capability": "claude/trantype/03#3", "function": "claude/trantype/03", "rules": ["claude/RULE-152"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1592"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the save hits a deadlock or timeout (SQLCODE -911), then the system shall set the lock-error state with 'Could not lock record for update'.", "capability": "claude/trantype/03#3", "function": "claude/trantype/03", "rules": ["claude/RULE-152"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1592"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the save fails with any other negative SQLCODE or the insert fails, then the system shall set the failed state with 'Update of record failed' and the SQL error text.", "capability": "claude/trantype/03#3", "function": "claude/trantype/03", "rules": ["claude/RULE-152"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1592"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall never change the type code of an existing transaction type; only the description is updatable.", "capability": "claude/trantype/03#3", "function": "claude/trantype/03", "rules": ["claude/RULE-152"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1531-1592"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses F12 with validated changes awaiting confirmation, the system shall cancel with 'Update was cancelled'.", "capability": "claude/trantype/03#3", "function": "claude/trantype/03", "rules": ["claude/RULE-154"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:978-1082"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses F4 on a displayed transaction type, the system shall ask 'Delete this record ? Press F4 to confirm'.", "capability": "claude/trantype/03#4", "function": "claude/trantype/03", "rules": ["claude/RULE-153"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1663"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses F4 again to confirm, the system shall delete the row with the originally fetched key, commit and show 'Delete successful.'.", "capability": "claude/trantype/03#4", "function": "claude/trantype/03", "rules": ["claude/RULE-153"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1663"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If dependent records still reference the type (SQLCODE -532), then the system shall refuse the delete and show 'Please delete associated child records first...'.", "capability": "claude/trantype/03#4", "function": "claude/trantype/03", "rules": ["claude/RULE-153"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1663"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the delete fails with any other error, then the system shall show 'Changes unsuccessful' with 'Delete failed with message...'.", "capability": "claude/trantype/03#4", "function": "claude/trantype/03", "rules": ["claude/RULE-153"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1624-1663"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses F12 during delete confirmation, the system shall cancel with 'Delete was cancelled' and return to search mode.", "capability": "claude/trantype/03#4", "function": "claude/trantype/03", "rules": ["claude/RULE-153"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1000-1002"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall always accept F3, accept Enter except during delete confirmation, accept F4 only when details are shown or delete confirmation is pending, accept F5 only when changes are validated, the record was not found or a delete is in progress, and accept F12 when changes are validated, details are shown, the record was not found, delete is pending confirmation or a new record is being created.", "capability": "claude/trantype/03#5", "function": "claude/trantype/03", "rules": ["claude/RULE-237"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:577-618"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Unwanted", "text": "If a key is pressed that the current state does not allow, then the system shall show 'Invalid key pressed' and redisplay the screen.", "capability": "claude/trantype/03#5", "function": "claude/trantype/03", "rules": ["claude/RULE-237"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:577-618"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When a save, lock error, save failure or delete outcome has been shown, the system shall return the screen to search mode on the next interaction.", "capability": "claude/trantype/03#5", "function": "claude/trantype/03", "rules": ["claude/RULE-154"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:978-1082"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If an unexpected state combination occurs, then the system shall abend with code 0001 'UNEXPECTED DATA SCENARIO'.", "capability": "claude/trantype/03#5", "function": "claude/trantype/03", "rules": ["claude/RULE-154"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:1073-1080"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When the screen is first entered from the Admin menu (COADM01C) or the Transaction Type list (COTRTLIC), the system shall clear the previous context.", "capability": "claude/trantype/03#5", "function": "claude/trantype/03", "rules": ["claude/RULE-154"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:366-374"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Event-driven", "text": "When the operator presses F3, the system shall commit pending work and return to the calling program, or to the Admin menu (COADM01C / CA00) when no caller is recorded.", "capability": "claude/trantype/03#6", "function": "claude/trantype/03", "rules": ["claude/RULE-204"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:429-460"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/03/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Event-driven", "text": "When the operator exits with F3, the system shall flag the user as an admin user in the shared context.", "capability": "claude/trantype/03#6", "function": "claude/trantype/03", "rules": ["claude/RULE-204"], "sources": ["app/app-transaction-type-db2/cbl/COTRTUPC.cbl:448"], "programs": ["COTRTUPC"]}, {"key": "claude/trantype/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read each input record as action code (1 char), transaction type code (2 chars) and description (50 chars).", "capability": "claude/trantype/04#1", "function": "claude/trantype/04", "rules": ["claude/RULE-058"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a record's action code is '*', the system shall skip it and display 'IGNORING COMMENTED LINE'.", "capability": "claude/trantype/04#1", "function": "claude/trantype/04", "rules": ["claude/RULE-058"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If a record's action code is not 'A', 'U', 'D' or '*' (including lowercase or blank), then the system shall display 'ERROR: TYPE NOT VALID', not apply the record and set return code 4.", "capability": "claude/trantype/04#1", "function": "claude/trantype/04", "rules": ["claude/RULE-058"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall process the maintenance file record by record to end of file, continuing after any rejected record and ending with return code 4 if any record was rejected.", "capability": "claude/trantype/04#1", "function": "claude/trantype/04", "rules": ["claude/RULE-202", "claude/RULE-058"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:82-99"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the input file fails to open, then the system shall display 'OPEN FILE NOT OK'.", "capability": "claude/trantype/04#1", "function": "claude/trantype/04", "rules": ["claude/RULE-202"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:84-88"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When an 'A' record is processed, the system shall insert the 2-character code and 50-character description into CARDDEMO.TRANSACTION_TYPE and display 'RECORD INSERTED SUCCESSFULLY'.", "capability": "claude/trantype/04#2", "function": "claude/trantype/04", "rules": ["claude/RULE-146"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:132-164"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the insert fails with a database error (including a duplicate code), then the system shall display 'Error accessing: TRANSACTION_TYPE table. SQLCODE:<n>' and set return code 4.", "capability": "claude/trantype/04#2", "function": "claude/trantype/04", "rules": ["claude/RULE-146"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:132-164"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When a 'U' record is processed, the system shall replace the description of the transaction type with that code and display 'RECORD UPDATED SUCCESSFULLY', without changing the type code.", "capability": "claude/trantype/04#3", "function": "claude/trantype/04", "rules": ["claude/RULE-147"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If no transaction type with that code exists (SQLCODE +100), then the system shall display 'No records found.' and set return code 4.", "capability": "claude/trantype/04#3", "function": "claude/trantype/04", "rules": ["claude/RULE-147"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the update returns a negative SQLCODE, then the system shall display 'Error accessing: TRANSACTION_TYPE table. SQLCODE:<n>' and set return code 4.", "capability": "claude/trantype/04#3", "function": "claude/trantype/04", "rules": ["claude/RULE-147"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:166-195"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When a 'D' record is processed for a type with no referencing categories, the system shall delete it and display 'RECORD DELETED SUCCESSFULLY'.", "capability": "claude/trantype/04#4", "function": "claude/trantype/04", "rules": ["claude/RULE-148"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If transaction type categories still reference the type, then the system shall refuse the delete, display 'Error accessing: TRANSACTION_TYPE table. SQLCODE:<n>' and set return code 4.", "capability": "claude/trantype/04#4", "function": "claude/trantype/04", "rules": ["claude/RULE-148"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226"], "programs": ["COBTUPDT"]}, {"key": "claude/trantype/04/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the code does not exist (SQLCODE +100), then the system shall display 'No records found.' and set return code 4.", "capability": "claude/trantype/04#4", "function": "claude/trantype/04", "rules": ["claude/RULE-148"], "sources": ["app/app-transaction-type-db2/cbl/COBTUPDT.cbl:196-226"], "programs": ["COBTUPDT"]}, {"key": "claude/vsammq/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a request message is read from the input queue, the system shall treat it as an account inquiry only if its 4-character function code (positions 1-4) is exactly 'INQA' (case-sensitive) and its 11-digit numeric account key (positions 5-15) is greater than zero.", "capability": "claude/vsammq/01#1", "function": "claude/vsammq/01", "rules": ["claude/RULE-066"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:390-457"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the function code is not 'INQA' or the account key is not greater than zero, then the system shall not read the account file and shall put a reply to the reply queue with the text 'INVALID REQUEST PARAMETERS ACCT ID : <account key>FUNCTION : <function code>' (fields concatenated with no separator).", "capability": "claude/vsammq/01#1", "function": "claude/vsammq/01", "rules": ["claude/RULE-066"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:390-457"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If a request message is shorter than the request layout, then the system shall treat the missing account key as zero and reject the request, because the request copy is re-initialised (numerics to zero) before each GET.", "capability": "claude/vsammq/01#1", "function": "claude/vsammq/01", "rules": ["claude/RULE-066"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:390-457"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If a request is rejected as invalid, then the system shall still answer it on the reply queue (not route it to the error queue) and shall continue processing further messages.", "capability": "claude/vsammq/01#1", "function": "claude/vsammq/01", "rules": ["claude/RULE-066"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:390-457"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a valid inquiry (function 'INQA' with key > 0) is processed, the system shall read the account master file 'ACCTDAT' by the 11-digit account ID.", "capability": "claude/vsammq/01#2", "function": "claude/vsammq/01", "rules": ["claude/RULE-205", "claude/RULE-066"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-435"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the account is found, the system shall reply with 'ACCOUNT ID : ', 'ACCOUNT STATUS : <Y/N>', 'BALANCE : ', 'CREDIT LIMIT : ', 'CASH LIMIT : ', 'OPEN DATE : ', 'EXPR DATE : ', 'REIS DATE : ', 'CREDIT BAL : ', 'DEBIT BAL : ' and 'GROUP ID : ' with the stored values copied unchanged, in a 1000-byte reply buffer.", "capability": "claude/vsammq/01#2", "function": "claude/vsammq/01", "rules": ["claude/RULE-205"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-435"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return inactive or closed accounts the same as active ones, reporting the status flag only, and shall pass balance, limits and cycle totals through as stored without computing any values such as available credit.", "capability": "claude/vsammq/01#2", "function": "claude/vsammq/01", "rules": ["claude/RULE-205"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-435"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall move monetary fields (S9(10)V99) into the reply as raw signed zoned decimal without decimal point or sign formatting, and shall truncate or pad the group ID to 10 characters.", "capability": "claude/vsammq/01#2", "function": "claude/vsammq/01", "rules": ["claude/RULE-205"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-435"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the account is not found (NOTFND), then the system shall reply 'INVALID REQUEST PARAMETERS ACCT ID : <account ID>' as a business reply rather than an error-queue event.", "capability": "claude/vsammq/01#2", "function": "claude/vsammq/01", "rules": ["claude/RULE-205"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:393-435"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall put every account inquiry reply to the fixed queue 'CARD.DEMO.REPLY.ACCT' as a string-format (MQSTR) message in the queue manager's CCSID, with the request's message ID and correlation ID copied into MQMD-MSGID and MQMD-CORRELID.", "capability": "claude/vsammq/01#3", "function": "claude/vsammq/01", "rules": ["claude/RULE-206"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:462-499"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send the reply to 'CARD.DEMO.REPLY.ACCT' regardless of the ReplyToQ named in the request.", "capability": "claude/vsammq/01#3", "function": "claude/vsammq/01", "rules": ["claude/RULE-206"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:462-499"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall put replies under syncpoint with put options SYNCPOINT+DEFAULT-CONTEXT+FAIL-IF-QUIESCING and a buffer length of 1000.", "capability": "claude/vsammq/01#3", "function": "claude/vsammq/01", "rules": ["claude/RULE-206"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:462-499"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the reply put fails, then the system shall log the failure to the error queue and terminate the transaction.", "capability": "claude/vsammq/01#3", "function": "claude/vsammq/01", "rules": ["claude/RULE-206"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:462-499"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the transaction is started by an MQ trigger, the system shall open the error, input and reply queues, taking the input queue name from the trigger message (MQTM-QNAME).", "capability": "claude/vsammq/01#4", "function": "claude/vsammq/01", "rules": ["claude/RULE-155"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall repeatedly get requests from the input queue, waiting up to 5000 ms for each, with a maximum message size of 1000 bytes and GET options SYNCPOINT+FAIL-IF-QUIESCING+CONVERT+WAIT, and answer each one.", "capability": "claude/vsammq/01#4", "function": "claude/vsammq/01", "rules": ["claude/RULE-155"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall commit the get and the reply of each message together with a CICS SYNCPOINT before the next get, with the last message's work committed implicitly by CICS RETURN.", "capability": "claude/vsammq/01#4", "function": "claude/vsammq/01", "rules": ["claude/RULE-155"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When no message arrives within the wait interval (MQRC-NO-MSG-AVAILABLE), the system shall end the loop, close the queues and return control to CICS.", "capability": "claude/vsammq/01#4", "function": "claude/vsammq/01", "rules": ["claude/RULE-155"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the CICS RETRIEVE of the trigger message fails, then the system shall log the error and terminate before reading any message.", "capability": "claude/vsammq/01#4", "function": "claude/vsammq/01", "rules": ["claude/RULE-155"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If an MQGET fails for any reason other than 'no message available', then the system shall post the failure to the error queue and terminate the transaction.", "capability": "claude/vsammq/01#4", "function": "claude/vsammq/01", "rules": ["claude/RULE-155"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:178-218"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If a technical failure occurs (trigger retrieve, queue open/get/put/close, or an account file response other than NORMAL or NOTFND), then the system shall put a formatted error record (paragraph X(25), message X(25), condition 9(2), reason 9(5), queue X(48)) to 'CARD.DEMO.ERROR' under syncpoint, close any open queues and end the task with CICS RETURN.", "capability": "claude/vsammq/01#5", "function": "claude/vsammq/01", "rules": ["claude/RULE-207"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:501-550"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If the account file read returns a response other than NORMAL or NOTFND, then the system shall report the message 'ERROR WHILE READING ACCTFILE' and shall send no reply to the requester.", "capability": "claude/vsammq/01#5", "function": "claude/vsammq/01", "rules": ["claude/RULE-207", "claude/RULE-205"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:501-550", "app/app-vsam-mq/cbl/COACCT01.cbl:393-435"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If the error queue itself cannot be opened, then the system shall only DISPLAY the error and end the task.", "capability": "claude/vsammq/01#5", "function": "claude/vsammq/01", "rules": ["claude/RULE-207"], "sources": ["app/app-vsam-mq/cbl/COACCT01.cbl:501-550"], "programs": ["COACCT01"]}, {"key": "claude/vsammq/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a request message is processed, the system shall reply with 'SYSTEM DATE : ' followed by the CICS system date in MM-DD-YYYY format and 'SYSTEM TIME : ' followed by the time in HH:MM:SS format, with no separator between the date and the 'SYSTEM TIME' label, padded with spaces to 1000 bytes.", "capability": "claude/vsammq/02#1", "function": "claude/vsammq/02", "rules": ["claude/RULE-015"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:339-364"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall take the date and time from the CICS region clock (CICS ASKTIME), not from any business date or account record.", "capability": "claude/vsammq/02#1", "function": "claude/vsammq/02", "rules": ["claude/RULE-015"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:339-364"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return the same date/time reply regardless of request content, including empty or invalid content.", "capability": "claude/vsammq/02#1", "function": "claude/vsammq/02", "rules": ["claude/RULE-015"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:339-364"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall clear the date and time fields before each request so that values do not carry over.", "capability": "claude/vsammq/02#1", "function": "claude/vsammq/02", "rules": ["claude/RULE-015"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:339-364"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall put every date/time reply to the fixed queue 'CARD.DEMO.REPLY.DATE' with the request's MsgId and CorrelId, as a string-format (MQFMT-STRING) message with CCSID MQCCSI-Q-MGR, inside the unit of work.", "capability": "claude/vsammq/02#2", "function": "claude/vsammq/02", "rules": ["claude/RULE-208"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:366-381"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send the reply to 'CARD.DEMO.REPLY.DATE' regardless of the ReplyToQ named in the request.", "capability": "claude/vsammq/02#2", "function": "claude/vsammq/02", "rules": ["claude/RULE-208"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:366-381"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall put replies with put options SYNCPOINT + DEFAULT-CONTEXT + FAIL-IF-QUIESCING.", "capability": "claude/vsammq/02#2", "function": "claude/vsammq/02", "rules": ["claude/RULE-208"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:366-381"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the MQ trigger starts the transaction, the system shall read the input queue named in the trigger message and keep processing requests until no message arrives within 5000 ms.", "capability": "claude/vsammq/02#3", "function": "claude/vsammq/02", "rules": ["claude/RULE-156"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:274-337"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall get requests with a maximum buffer of 1000 bytes and get options SYNCPOINT + FAIL-IF-QUIESCING + CONVERT + WAIT, and shall commit each get and reply pair together with a CICS SYNCPOINT, the last message's unit of work being committed at CICS RETURN.", "capability": "claude/vsammq/02#3", "function": "claude/vsammq/02", "rules": ["claude/RULE-156"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:274-337"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When no new message arrives within 5 seconds (MQRC-NO-MSG-AVAILABLE), the system shall end the loop, close its queues and return.", "capability": "claude/vsammq/02#3", "function": "claude/vsammq/02", "rules": ["claude/RULE-156"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:274-337"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the CICS RETRIEVE of the trigger message fails, then the system shall report an error and end the transaction before any queue is read.", "capability": "claude/vsammq/02#3", "function": "claude/vsammq/02", "rules": ["claude/RULE-156"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:274-337"], "programs": ["CODATE01"]}, {"key": "claude/vsammq/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If a get fails with any reason other than MQRC-NO-MSG-AVAILABLE, including a message longer than 1000 bytes, then the system shall report the failure to the error queue and end the transaction.", "capability": "claude/vsammq/02#3", "function": "claude/vsammq/02", "rules": ["claude/RULE-156"], "sources": ["app/app-vsam-mq/cbl/CODATE01.cbl:274-337"], "programs": ["CODATE01"]}, {"key": "cla
