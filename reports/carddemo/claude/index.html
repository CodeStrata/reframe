ude/pendauth/02/REQ-F-042", "claude/pendauth/02/REQ-F-043", "claude/pendauth/02/REQ-F-044", "claude/pendauth/02/REQ-F-045"], "questions": ["claude/pendauth/02/OQ-004", "claude/pendauth/02/OQ-005"]}, {"id": "claude/pendauth/03#1", "function": "claude/pendauth/03", "number": 1, "title": "Toggle the fraud flag", "story": "As a fraud operator, I want to press PF5 on an authorization to mark it as fraud or remove the fraud mark, so that suspected fraud is recorded or corrected.", "fields": {}, "other": "", "requirements": ["claude/pendauth/03/REQ-F-001", "claude/pendauth/03/REQ-F-002", "claude/pendauth/03/REQ-F-003"], "questions": ["claude/pendauth/03/OQ-001"]}, {"id": "claude/pendauth/03#2", "function": "claude/pendauth/03", "number": 2, "title": "Record fraud in the fraud table", "story": "As a fraud operator, I want each fraud report or removal written to the fraud table with today's date, so that there is a record of fraud decisions on authorizations.", "fields": {}, "other": "", "requirements": ["claude/pendauth/03/REQ-F-004", "claude/pendauth/03/REQ-F-005", "claude/pendauth/03/REQ-F-006", "claude/pendauth/03/REQ-F-007", "claude/pendauth/03/REQ-F-008"], "questions": ["claude/pendauth/03/OQ-002"]}, {"id": "claude/pendauth/03#3", "function": "claude/pendauth/03", "number": 3, "title": "Save the fraud tag only when the fraud service succeeds", "story": "As a fraud operator, I want the authorization's fraud status saved only when the fraud record was written successfully, so that the authorization and the fraud table stay consistent.", "fields": {}, "other": "", "requirements": ["claude/pendauth/03/REQ-F-009", "claude/pendauth/03/REQ-F-010", "claude/pendauth/03/REQ-F-011", "claude/pendauth/03/REQ-F-012"], "questions": []}, {"id": "claude/pendauth/04#1", "function": "claude/pendauth/04", "number": 1, "title": "Set the expiry period", "story": "As a batch operations lead, I want to set the number of days after which pending authorizations expire on the job parameter card, data operations lead, I want the pending-authorization summaries and their details written to extract files with each detail keyed by its parent account, so that the database can be rebuilt from them.", "fields": {}, "other": "", "requirements": ["claude/pendauth/05/REQ-F-001", "claude/pendauth/05/REQ-F-002", "claude/pendauth/05/REQ-F-003", "claude/pendauth/05/REQ-F-004", "claude/pendauth/05/REQ-F-005", "claude/pendauth/05/REQ-F-006", "claude/pendauth/05/REQ-F-007", "claude/pendauth/05/REQ-F-008", "claude/pendauth/05/REQ-F-009"], "questions": ["claude/pendauth/05/OQ-001", "claude/pendauth/05/OQ-002"]}, {"id": "claude/pendauth/05#2", "function": "claude/pendauth/05", "number": 2, "title": "Reload pending authorizations", "story": "As a data operations lead, I want the extracted summaries and details reloaded into the authorization database with each detail under its parent summary, so that the pending authorization data is restored.", "fields": {}, "other": "", "requirements": ["claude/pendauth/05/REQ-F-010", "claude/pendauth/05/REQ-F-011", "claude/pendauth/05/REQ-F-012", "claude/pendauth/05/REQ-F-013", "claude/pendauth/05/REQ-F-014", "claude/pendauth/05/REQ-F-015", "claude/pendauth/05/REQ-F-016", "claude/pendauth/05/REQ-F-017", "claude/pendauth/05/REQ-F-018"], "questions": ["claude/pendauth/05/OQ-003"]}, {"id": "claude/common/01#1", "function": "claude/common/01", "number": 1, "title": "Convert a compact date to ISO form and back", "story": "As a calling program such as CBACT01C, I want to convert a date between YYYYMMDD and YYYY-MM-DD by passing a CODATECN record, so that each program can use the date format it needs.", "fields": {}, "other": "", "requirements": ["claude/common/01/REQ-F-001", "claude/common/01/REQ-F-002", "claude/common/01/REQ-F-003", "claude/common/01/REQ-F-004", "claude/common/01/REQ-F-005"], "questions": []}, {"id": "claude/common/01#2", "function": "claude/common/01", "number": 2, "title": "Reject invalid conversion requests", "story": "As a calling program, I want requests with an unsupported input type or an incompatible output type to be refused with an error message, so that I do not receive a wrongly formatted date.", "fields": {}, "other": "", "requirements": ["claude/common/01/REQ-F-006", "claude/common/01/REQ-F-007", "claude/common/01/REQ-F-008", "claude/common/01/REQ-F-009"], "questions": ["claude/common/01/OQ-001"]}, {"id": "claude/common/02#1", "function": "claude/common/02", "number": 1, "title": "Validate a date against a format mask", "story": "As a calling program such as CORPT00C, I want to check a date against the format mask I supply, so that only real calendar dates are accepted.", "fields": {}, "other": "", "requirements": ["claude/common/02/REQ-F-001", "claude/common/02/REQ-F-002", "claude/common/02/REQ-F-003", "claude/common/02/REQ-F-004", "claude/common/02/REQ-F-005", "claude/common/02/REQ-F-006", "claude/common/02/REQ-F-007"], "questions": ["claude/common/02/OQ-001"]}, {"id": "claude/common/02#2", "function": "claude/common/02", "number": 2, "title": "Report the validation outcome as a return code", "story": "As a calling program, I want the severity of the date check returned both in the result text and in the program return code, so that I can test either one.", "fields": {}, "other": "", "requirements": ["claude/common/02/REQ-F-008", "claude/common/02/REQ-F-009", "claude/common/02/REQ-F-010"], "questions": ["claude/common/02/OQ-002"]}, {"id": "claude/common/03#1", "function": "claude/common/03", "number": 1, "title": "Pause a batch job for a configured interval", "story": "As a batch operator, I want a job step to wait for a delay I supply on SYSIN, so that the job pauses for that long before continuing.", "fields": {}, "other": "", "requirements": ["claude/common/03/REQ-F-001", "claude/common/03/REQ-F-002"], "questions": ["claude/common/03/OQ-001", "claude/common/03/OQ-002"]}], "requirements": [{"key": "claude/signon/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the sign-on screen is submitted with Enter and the User ID is blank (spaces or low-values), then the system shall set the error flag, redisplay the screen with 'Please enter User ID ...' and the cursor on User ID, and not read the user security file.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-117"], "sources": ["app/cbl/COSGN00C.cbl:117-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the sign-on screen is submitted with Enter and the User ID is filled but the Password is blank (spaces or low-values), then the system shall set the error flag, redisplay the screen with 'Please enter Password ...' and the cursor on Password, and not read the user security file.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-117"], "sources": ["app/cbl/COSGN00C.cbl:117-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If both the User ID and the Password are blank, then the system shall show only the 'Please enter User ID ...' message.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-117"], "sources": ["app/cbl/COSGN00C.cbl:117-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When a sign-on is attempted with a User ID and Password present, the system shall convert the entered User ID and Password to upper case and use the upper-cased User ID (8 characters) as the key to read the USRSEC user security record.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-057"], "sources": ["app/cbl/COSGN00C.cbl:132-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the USRSEC record is found, the system shall sign the user on only if the stored password exactly equals the upper-cased entered password.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-057"], "sources": ["app/cbl/COSGN00C.cbl:132-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the stored password does not equal the upper-cased entered password, then the system shall show 'Wrong Password. Try again ...' with the cursor on Password.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-057"], "sources": ["app/cbl/COSGN00C.cbl:132-140"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the USRSEC read returns response 13 (NOTFND), then the system shall show 'User not found. Try again ...', set the error flag, place the cursor on User ID and not transfer the user.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-118"], "sources": ["app/cbl/COSGN00C.cbl:221-257"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the USRSEC read returns any other non-zero response, then the system shall show 'Unable to verify the User ...', set the error flag, place the cursor on User ID and not transfer the user.", "capability": "claude/signon/01#1", "function": "claude/signon/01", "rules": ["claude/RULE-118"], "sources": ["app/cbl/COSGN00C.cbl:221-257"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the password matches, the system shall set the session record with from-transaction 'CC00', from-program 'COSGN00C', the signed-on user ID, the user type, and program context 0 (first entry) before transfer.", "capability": "claude/signon/01#2", "function": "claude/signon/01", "rules": ["claude/RULE-183"], "sources": ["app/cbl/COSGN00C.cbl:224-228"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a user authenticates successfully and the security record type SEC-USR-TYPE is 'A' (Admin), the system shall transfer control to the Admin menu (COADM01C).", "capability": "claude/signon/01#2", "function": "claude/signon/01", "rules": ["claude/RULE-248"], "sources": ["app/cbl/COSGN00C.cbl:223-240"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When a user authenticates successfully and the security record type is anything other than 'A' (including 'U' or any unexpected value such as blank), the system shall transfer control to the regular user Main Menu (COMEN01C).", "capability": "claude/signon/01#2", "function": "claude/signon/01", "rules": ["claude/RULE-248"], "sources": ["app/cbl/COSGN00C.cbl:223-240"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When transaction CC00 is started with no session data (commarea), the system shall display a blank sign-on screen with the cursor on User ID.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-184"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the sign-on screen, the system shall run the authentication flow.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-184", "claude/RULE-057"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 on the sign-on screen, the system shall send the plain-text thank-you message (CCDA-MSG-THANK-YOU) and end the conversation without re-arming CC00.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-184"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the user presses any key other than Enter or PF3 on the sign-on screen, then the system shall redisplay the screen with the invalid-key message (CCDA-MSG-INVALID-KEY) and set the error flag.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-184"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall re-arm transaction CC00 for the next interaction after redisplaying the sign-on screen.", "capability": "claude/signon/01#3", "function": "claude/signon/01", "rules": ["claude/RULE-184"], "sources": ["app/cbl/COSGN00C.cbl:80-102"], "programs": ["COSGN00C"]}, {"key": "claude/signon/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the Main Menu is displayed, the system shall list the 11 options as 'NN. Name': 1 Account View (COACTVWC), 2 Account Update (COACTUPC), 3 Credit Card List (COCRDLIC), 4 Credit Card View (COCRDSLC), 5 Credit Card Update (COCRDUPC), 6 Transaction List (COTRN00C), 7 Transaction View (COTRN01C), 8 Transaction Add (COTRN02C), 9 Transaction Reports (CORPT00C), 10 Bill Payment (COBIL00C), 11 Pending Authorization View (COPAUS0C).", "capability": "claude/signon/02#1", "function": "claude/signon/02", "rules": ["claude/RULE-246"], "sources": ["app/cbl/COMEN01C.cbl:262-303", "app/cpy/COMEN02Y.cpy:19-98"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall tie each Main Menu option to a target program and to the user type allowed to use it, with all 11 options flagged 'U'.", "capability": "claude/signon/02#1", "function": "claude/signon/02", "rules": ["claude/RULE-246", "claude/RULE-212"], "sources": ["app/cbl/COMEN01C.cbl:262-303"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the Main Menu, the system shall trim trailing blanks from the option, right-align it in two characters and turn any remaining blanks into zeros (for example ' 3' becomes 03).", "capability": "claude/signon/02#2", "function": "claude/signon/02", "rules": ["claude/RULE-113"], "sources": ["app/cbl/COMEN01C.cbl:117-134"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the resulting option is not numeric or is not between 1 and the Main Menu option count (11), including 0, 00, blank, 12 or 'AB', then the system shall set the error flag and show 'Please enter a valid option number...'.", "capability": "claude/signon/02#2", "function": "claude/signon/02", "rules": ["claude/RULE-113"], "sources": ["app/cbl/COMEN01C.cbl:117-134"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If a signed-on user whose type is 'U' selects a Main Menu option whose required user type is 'A' and presses Enter, then the system shall set the error flag, show 'No access - Admin Only option... ' and not transfer the user.", "capability": "claude/signon/02#3", "function": "claude/signon/02", "rules": ["claude/RULE-212"], "sources": ["app/cbl/COMEN01C.cbl:136-143"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not block admin users ('A') from any Main Menu option, nor any user from options flagged 'U'.", "capability": "claude/signon/02#3", "function": "claude/signon/02", "rules": ["claude/RULE-212"], "sources": ["app/cbl/COMEN01C.cbl:136-143"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When a valid, authorised option targets COPAUS0C, the system shall first ask CICS whether the program is installed and transfer the session to it if it is.", "capability": "claude/signon/02#4", "function": "claude/signon/02", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COMEN01C.cbl:145-191"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the target COPAUS0C is not installed, then the system shall show in red 'This option <name> is not installed...' on the menu.", "capability": "claude/signon/02#4", "function": "claude/signon/02", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COMEN01C.cbl:145-191"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When a valid, authorised option's target program name starts with 'DUMMY', the system shall show in green 'This option <name>is coming soon ...' on the menu.", "capability": "claude/signon/02#4", "function": "claude/signon/02", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COMEN01C.cbl:145-191"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a valid, authorised option targets any other program, the system shall transfer the session to the target program.", "capability": "claude/signon/02#4", "function": "claude/signon/02", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COMEN01C.cbl:145-191"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the from-transaction to CM00, the from-program to COMEN01C and the program context to 0 (ENTER) before any transfer from the Main Menu, so that the target shows its first screen.", "capability": "claude/signon/02#4", "function": "claude/signon/02", "rules": ["claude/RULE-181"], "sources": ["app/cbl/COMEN01C.cbl:145-191"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the Main Menu (transaction CM00) is invoked with no session data (communication area length 0), then the system shall transfer the user to the sign-on program COSGN00C.", "capability": "claude/signon/02#5", "function": "claude/signon/02", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COMEN01C.cbl:82-110"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "State-driven", "text": "While the program context is 'enter' (0), the system shall set the context to 're-enter' (1) and show a blank Main Menu.", "capability": "claude/signon/02#5", "function": "claude/signon/02", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COMEN01C.cbl:82-110"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "State-driven", "text": "While the program context is 're-enter' (1), the system shall process the selected option on Enter and transfer to COSGN00C on PF3.", "capability": "claude/signon/02#5", "function": "claude/signon/02", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COMEN01C.cbl:82-110"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If any key other than Enter or PF3 is pressed while the context is 're-enter', then the system shall re-show the Main Menu with the standard invalid-key message (CCDA-MSG-INVALID-KEY).", "capability": "claude/signon/02#5", "function": "claude/signon/02", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COMEN01C.cbl:82-110"], "programs": ["COMEN01C"]}, {"key": "claude/signon/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return control to CICS with transaction CM00 and the session data after each Main Menu interaction, so that the next key press comes back to the Main Menu.", "capability": "claude/signon/02#5", "function": "claude/signon/02", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COMEN01C.cbl:82-110"], "programs": ["COMEN01C"]}, {"key": "claude/signon/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the Admin Menu is displayed, the system shall list the 6 options: 1 User List (COUSR00C), 2 User Add (COUSR01C), 3 User Update (COUSR02C), 4 User Delete (COUSR03C), 5 Transaction Type List/Update (Db2) (COTRTLIC), 6 Transaction Type Maintenance (Db2) (COTRTUPC).", "capability": "claude/signon/03#1", "function": "claude/signon/03", "rules": ["claude/RULE-242"], "sources": ["app/cbl/COADM01C.cbl:229-266", "app/cpy/COADM02Y.cpy:21-22"], "programs": ["COADM01C"]}, {"key": "claude/signon/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter on the Admin Menu, the system shall trim trailing blanks from the option, right-align it in two characters and turn any remaining blanks into zeros.", "capability": "claude/signon/03#2", "function": "claude/signon/03", "rules": ["claude/RULE-113"], "sources": ["app/cbl/COADM01C.cbl:121-138"], "programs": ["COMEN01C"]}, {"key": "claude/signon/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the resulting option is not numeric or is not between 1 and the Admin Menu option count (6), then the system shall set the error flag and show 'Please enter a valid option number...'.", "capability": "claude/signon/03#2", "function": "claude/signon/03", "rules": ["claude/RULE-113", "claude/RULE-242"], "sources": ["app/cbl/COADM01C.cbl:121-138"], "programs": ["COADM01C", "COMEN01C"]}, {"key": "claude/signon/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When a valid admin option is processed and the target program name does not start with 'DUMMY', the system shall set the from-transaction to CA00, the from-program to COADM01C and the context to 0 (ENTER), and transfer the session to the target program.", "capability": "claude/signon/03#3", "function": "claude/signon/03", "rules": ["claude/RULE-175"], "sources": ["app/cbl/COADM01C.cbl:140-158"], "programs": ["COADM01C"]}, {"key": "claude/signon/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the target program name starts with 'DUMMY' or the target program does not exist (PGMIDERR), then the system shall show the Admin Menu again with the green message 'This option is not installed ...'.", "capability": "claude/signon/03#3", "function": "claude/signon/03", "rules": ["claude/RULE-175"], "sources": ["app/cbl/COADM01C.cbl:140-158", "app/cbl/COADM01C.cbl:270-283"], "programs": ["COADM01C"]}, {"key": "claude/signon/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the Admin Menu (transaction CA00) is invoked with no session data (communication area length 0), then the system shall transfer the user to the sign-on program COSGN00C.", "capability": "claude/signon/03#4", "function": "claude/signon/03", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COADM01C.cbl:86-114"], "programs": ["COMEN01C"]}, {"key": "claude/signon/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "State-driven", "text": "While the program context is 'enter' (0), the system shall set the context to 're-enter' (1) and show a blank Admin Menu.", "capability": "claude/signon/03#4", "function": "claude/signon/03", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COADM01C.cbl:86-114"], "programs": ["COMEN01C"]}, {"key": "claude/signon/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "State-driven", "text": "While the program context is 're-enter' (1), the system shall process the selected option on Enter, transfer to COSGN00C on PF3, and re-show the Admin Menu with the standard invalid-key message for any other key.", "capability": "claude/signon/03#4", "function": "claude/signon/03", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COADM01C.cbl:86-114"], "programs": ["COMEN01C"]}, {"key": "claude/signon/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall return control to CICS with transaction CA00 and the session data after each Admin Menu interaction, so that the next key press comes back to the Admin Menu.", "capability": "claude/signon/03#4", "function": "claude/signon/03", "rules": ["claude/RULE-182"], "sources": ["app/cbl/COADM01C.cbl:86-114"], "programs": ["COMEN01C"]}, {"key": "claude/signon/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the Admin Menu and allow every admin option to be selected for any session that arrives with session data, without testing the user type (CDEMO-USER-TYPE), relying on sign-on routing to send only users of type 'A' there.", "capability": "claude/signon/03#5", "function": "claude/signon/03", "rules": ["claude/RULE-209", "claude/RULE-248"], "sources": ["app/cbl/COADM01C.cbl:86-109", "app/cbl/COSGN00C.cbl:223-240"], "programs": ["COADM01C", "COSGN00C"]}, {"key": "claude/useradmin/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed with a User ID in the search field and no row action taken, the system shall start the USRSEC browse at that key or the next higher one (key-equal-or-greater) and reset the page number so that it becomes 1 after the page loads.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-127"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed with a blank search field, the system shall start the list at the first user (LOW-VALUES start key) and reset the page number to 1.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-127"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the list page has loaded without an error, the system shall clear the search field.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-127"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If no key at or above the start value exists, then the system shall show 'You are at the top of the page...'.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-127"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If any other file error occurs while starting the browse, then the system shall set the error flag and show 'Unable to lookup User...'.", "capability": "claude/useradmin/01#1", "function": "claude/useradmin/01", "rules": ["claude/RULE-127"], "sources": ["app/cbl/COUSR00C.cbl:218-232"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show up to 10 users per page in user-ID order, with user ID, first name, last name and user type in each row.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-035"], "sources": ["app/cbl/COUSR00C.cbl:282-331"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When PF8 is pressed and the next-page flag is Y, the system shall restart the browse at the last saved user ID, skip that record, fill rows 1-10 with the following users and add 1 to the page number.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-035"], "sources": ["app/cbl/COUSR00C.cbl:282-331"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When a page has been filled, the system shall read one record past the page and set the next-page flag to Y if a further user exists, or to N if it does not.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-035"], "sources": ["app/cbl/COUSR00C.cbl:282-331"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall save the first and last user IDs on the page (CDEMO-CU00-USRID-FIRST/LAST) in the commarea as paging anchors.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-035"], "sources": ["app/cbl/COUSR00C.cbl:282-331"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "State-driven", "text": "While the look-ahead read reaches end-of-file, the system shall set next-page to N and show 'You have reached the bottom of the page...'.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-035"], "sources": ["app/cbl/COUSR00C.cbl:282-331"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Complex", "text": "When a partial last page (1-9 rows) is shown, the system shall still add 1 to the page number, and where the result is empty, the system shall not add to the page number.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-035"], "sources": ["app/cbl/COUSR00C.cbl:282-331"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If PF8 is pressed while the next-page flag is N, then the system shall do no file read, show 'You are already at the bottom of the page...' and redraw the screen without erase so the current rows stay.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-128"], "sources": ["app/cbl/COUSR00C.cbl:260-277"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "State-driven", "text": "While no last user ID is saved, the system shall use HIGH-VALUES as the forward-paging start key.", "capability": "claude/useradmin/01#2", "function": "claude/useradmin/01", "rules": ["claude/RULE-128"], "sources": ["app/cbl/COUSR00C.cbl:260-277"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When PF7 is pressed and the page number is above 1, the system shall start the browse at the saved first user ID, skip it, and fill rows 10 down to 1 with the 10 users before it.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-034"], "sources": ["app/cbl/COUSR00C.cbl:237-255"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the backward page has been filled, the system shall reduce the page number by 1 if one more earlier record exists, otherwise set the page number to 1, and set next-page to Y.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-034"], "sources": ["app/cbl/COUSR00C.cbl:237-255"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If PF7 is pressed on page 1 or lower, then the system shall do no read, show 'You are already at the top of the page...' and redraw the screen without erase.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-034"], "sources": ["app/cbl/COUSR00C.cbl:237-255"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "State-driven", "text": "While no first user ID is saved, the system shall start the backward browse at LOW-VALUES.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-034"], "sources": ["app/cbl/COUSR00C.cbl:237-255"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the backward read reaches the start of the file, then the system shall show 'You have reached the top of the page...'.", "capability": "claude/useradmin/01#3", "function": "claude/useradmin/01", "rules": ["claude/RULE-034"], "sources": ["app/cbl/COUSR00C.cbl:237-255"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed, the system shall use only the first non-blank selection from row 1 to row 10 and ignore selections on later rows without warning.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-126"], "sources": ["app/cbl/COUSR00C.cbl:151-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Event-driven", "text": "When the selection code is U or u, the system shall pass control to the Update User program (COUSR02C) with the selected user ID, the selection flag, from-program COUSR00C and context 0.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-126"], "sources": ["app/cbl/COUSR00C.cbl:151-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When the selection code is D or d, the system shall pass control to the Delete User program (COUSR03C) with the selected user ID, the selection flag, from-program COUSR00C and context 0.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-126"], "sources": ["app/cbl/COUSR00C.cbl:151-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Unwanted", "text": "If any other selection code is entered, then the system shall show 'Invalid selection. Valid values are U and D' and refresh the list from the filter.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-126"], "sources": ["app/cbl/COUSR00C.cbl:151-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If a selection is made on a row with a blank user ID, then the system shall treat it as a plain refresh.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-126"], "sources": ["app/cbl/COUSR00C.cbl:151-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When no row is selected, the system shall clear the saved selection flag and selected user ID in the commarea.", "capability": "claude/useradmin/01#4", "function": "claude/useradmin/01", "rules": ["claude/RULE-126"], "sources": ["app/cbl/COUSR00C.cbl:151-216"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed on the user list, the system shall run the selection or search.", "capability": "claude/useradmin/01#5", "function": "claude/useradmin/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/COUSR00C.cbl:120-137"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Event-driven", "text": "When PF3 is pressed on the user list, the system shall transfer control to the admin menu (COADM01C).", "capability": "claude/useradmin/01#5", "function": "claude/useradmin/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/COUSR00C.cbl:120-137"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When PF7 is pressed on the user list, the system shall show the previous page, and when PF8 is pressed, the system shall show the next page.", "capability": "claude/useradmin/01#5", "function": "claude/useradmin/01", "rules": ["claude/RULE-189", "claude/RULE-034", "claude/RULE-035"], "sources": ["app/cbl/COUSR00C.cbl:120-137"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed on the user list, then the system shall set the error flag, show the shared invalid-key message (CCDA-MSG-INVALID-KEY), put the cursor on the User ID filter and redisplay the screen without reading the file again.", "capability": "claude/useradmin/01#5", "function": "claude/useradmin/01", "rules": ["claude/RULE-189"], "sources": ["app/cbl/COUSR00C.cbl:120-137"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If transaction CU00 starts with no communication area, then the system shall pass control to the sign-on program COSGN00C with from-tranid CU00, from-program COUSR00C and program context reset to 0.", "capability": "claude/useradmin/01#6", "function": "claude/useradmin/01", "rules": ["claude/RULE-250"], "sources": ["app/cbl/COUSR00C.cbl:110-139"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Event-driven", "text": "When the user list is entered for the first time with session context, the system shall mark the program as re-entered, clear the screen and show the first page of users starting at the lowest user ID.", "capability": "claude/useradmin/01#6", "function": "claude/useradmin/01", "rules": ["claude/RULE-250"], "sources": ["app/cbl/COUSR00C.cbl:110-139"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "State-driven", "text": "While no target program is set when returning to the previous screen, the system shall default the target to COSGN00C.", "capability": "claude/useradmin/01#6", "function": "claude/useradmin/01", "rules": ["claude/RULE-250"], "sources": ["app/cbl/COUSR00C.cbl:110-139"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "State-driven", "text": "While a session commarea is present, the system shall show the full user list (IDs, names, types) and allow Update/Delete routing without checking the session's user type, relying on access through the admin menu (COADM01C).", "capability": "claude/useradmin/01#6", "function": "claude/useradmin/01", "rules": ["claude/RULE-249"], "sources": ["app/cbl/COUSR00C.cbl:110-139"], "programs": ["COUSR00C"]}, {"key": "claude/useradmin/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If First Name, Last Name, User ID, Password or User Type is empty (all spaces or low-values) when Enter is pressed on the Add User screen, then the system shall report only the first empty field in that order with its message (for example 'Last Name can NOT be empty...'), place the cursor on that field and write no record to USRSEC.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-129"], "sources": ["app/cbl/COUSR01C.cbl:115-160"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall apply no format, length or allowed-value checks to the Add User fields beyond presence, and shall cut off values longer than the record field (ID X(8), first/last name X(20), password X(8), type X(1)) without a warning.", "capability": "claude/useradmin/02#1", "function": "claude/useradmin/02", "rules": ["claude/RULE-129"], "sources": ["app/cbl/COUSR01C.cbl:115-160"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a valid Add User form is submitted with a new User ID, the system shall write the record to USRSEC keyed by the User ID, clear all fields and show the green message 'User <id> has been added ...'.", "capability": "claude/useradmin/02#2", "function": "claude/useradmin/02", "rules": ["claude/RULE-130"], "sources": ["app/cbl/COUSR01C.cbl:238-274"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the User ID already exists in USRSEC (DUPKEY or DUPREC), then the system shall reject the add with 'User ID already exist...' and place the cursor on User ID.", "capability": "claude/useradmin/02#2", "function": "claude/useradmin/02", "rules": ["claude/RULE-130"], "sources": ["app/cbl/COUSR01C.cbl:238-274"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If any other write failure occurs, then the system shall show 'Unable to Add User...' and keep the form values.", "capability": "claude/useradmin/02#2", "function": "claude/useradmin/02", "rules": ["claude/RULE-130"], "sources": ["app/cbl/COUSR01C.cbl:238-274"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall store the password exactly as entered.", "capability": "claude/useradmin/02#2", "function": "claude/useradmin/02", "rules": ["claude/RULE-130"], "sources": ["app/cbl/COUSR01C.cbl:157"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed on the Add User screen, the system shall process the add; when PF3 is pressed, the system shall return to the admin menu COADM01C; and when PF4 is pressed, the system shall clear the form.", "capability": "claude/useradmin/02#3", "function": "claude/useradmin/02", "rules": ["claude/RULE-270"], "sources": ["app/cbl/COUSR01C.cbl:90-103"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed on the Add User screen, then the system shall show the invalid-key message CCDA-MSG-INVALID-KEY.", "capability": "claude/useradmin/02#3", "function": "claude/useradmin/02", "rules": ["claude/RULE-270"], "sources": ["app/cbl/COUSR01C.cbl:90-103"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/02/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Unwanted", "text": "If the Add User transaction (CU01) starts with no COMMAREA, then the system shall send the user to the sign-on program COSGN00C; with a COMMAREA, the system shall allow the add without checking the caller's user type.", "capability": "claude/useradmin/02#3", "function": "claude/useradmin/02", "rules": ["claude/RULE-252"], "sources": ["app/cbl/COUSR01C.cbl:78-80"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed with an existing User ID on the Update User screen, the system shall display the stored First Name, Last Name, Password and User Type with 'Press PF5 key to save your updates ...'.", "capability": "claude/useradmin/03#1", "function": "claude/useradmin/03", "rules": ["claude/RULE-131"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the User ID is blank, then the system shall show 'User ID can NOT be empty...' before any file access.", "capability": "claude/useradmin/03#1", "function": "claude/useradmin/03", "rules": ["claude/RULE-131"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the User ID does not exist in USRSEC, then the system shall show 'User ID NOT found...' with the cursor on User ID and leave the detail fields blank.", "capability": "claude/useradmin/03#1", "function": "claude/useradmin/03", "rules": ["claude/RULE-131"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If any other file error occurs during the lookup, then the system shall show 'Unable to lookup User...'.", "capability": "claude/useradmin/03#1", "function": "claude/useradmin/03", "rules": ["claude/RULE-131"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall clear the detail fields before the lookup so stale data never shows for a missing user.", "capability": "claude/useradmin/03#1", "function": "claude/useradmin/03", "rules": ["claude/RULE-131"], "sources": ["app/cbl/COUSR02C.cbl:143-172"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the Update User program is entered for the first time with a selected user in the shared session area (CDEMO-CU02-USR-SELECTED), the system shall mark itself as re-entered, place that ID in User ID, perform the lookup and show the profile.", "capability": "claude/useradmin/03#2", "function": "claude/useradmin/03", "rules": ["claude/RULE-201"], "sources": ["app/cbl/COUSR02C.cbl:95-105"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "State-driven", "text": "While no user was selected (spaces/low-values), the system shall show an empty Update User screen with the cursor on User ID.", "capability": "claude/useradmin/03#2", "function": "claude/useradmin/03", "rules": ["claude/RULE-201"], "sources": ["app/cbl/COUSR02C.cbl:95-105"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If User ID, First Name, Last Name, Password or User Type is empty (all spaces or all low-values) when PF5 or PF3 is pressed, then the system shall report only the first empty field in that order with its message, place the cursor on that field and not rewrite the USRSEC record.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-132"], "sources": ["app/cbl/COUSR02C.cbl:177-213"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall check User Type only for non-blank and Password only for non-blank, accepting any single-character user type.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-132"], "sources": ["app/cbl/COUSR02C.cbl:177-213"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a save is requested, the system shall re-read the stored user with UPDATE (lock), compare first name, last name, password and user type exactly (case-sensitive, space-padded), copy only the changed fields and rewrite the record only if at least one differs.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-190"], "sources": ["app/cbl/COUSR02C.cbl:215-245"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If no field has changed, then the system shall show 'Please modify to update ...' in red and perform no write.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-190"], "sources": ["app/cbl/COUSR02C.cbl:215-245"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not allow the User ID to be changed on the Update User screen, because it is the record key.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-190"], "sources": ["app/cbl/COUSR02C.cbl:215-245"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the rewrite of the user record returns NORMAL, the system shall show 'User <id> has been updated ...' in green, with the User ID trimmed at the first space.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-191"], "sources": ["app/cbl/COUSR02C.cbl:358-390"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the record is missing at rewrite, then the system shall show 'User ID NOT found...', and if any other failure occurs, then the system shall show 'Unable to Update User...' and log the RESP/RESP2 codes to the job log.", "capability": "claude/useradmin/03#3", "function": "claude/useradmin/03", "rules": ["claude/RULE-191"], "sources": ["app/cbl/COUSR02C.cbl:358-390"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed on the Update User screen, the system shall look up the user; when PF5 is pressed, the system shall save; and when PF4 is pressed, the system shall blank all fields and the message line.", "capability": "claude/useradmin/03#4", "function": "claude/useradmin/03", "rules": ["claude/RULE-251"], "sources": ["app/cbl/COUSR02C.cbl:108-131"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When PF3 is pressed on the Update User screen, the system shall attempt the update and then return to the calling program (CDEMO-FROM-PROGRAM), or to the Admin Menu COADM01C if no caller is recorded, even when validation fails or nothing changed.", "capability": "claude/useradmin/03#4", "function": "claude/useradmin/03", "rules": ["claude/RULE-251"], "sources": ["app/cbl/COUSR02C.cbl:108-131"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When PF12 is pressed on the Update User screen, the system shall discard changes and go to the Admin Menu (COADM01C).", "capability": "claude/useradmin/03#4", "function": "claude/useradmin/03", "rules": ["claude/RULE-251"], "sources": ["app/cbl/COUSR02C.cbl:108-131"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed on the Update User screen, then the system shall reject it with the invalid-key message CCDA-MSG-INVALID-KEY.", "capability": "claude/useradmin/03#4", "function": "claude/useradmin/03", "rules": ["claude/RULE-251"], "sources": ["app/cbl/COUSR02C.cbl:108-131"], "programs": ["COUSR02C"]}, {"key": "claude/useradmin/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed with an existing User ID on the Delete User screen, the system shall show the user's first name, last name and type with 'Press PF5 key to delete this user ...'.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-149"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When PF5 is pressed on the Delete User screen, the system shall read the record again with UPDATE, delete it from USRSEC, clear the screen and show the green message 'User <id> has been deleted ...'.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-149"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall remove the user record physically, with no undo, soft-delete or audit trail.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-149"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the User ID is blank on Enter or PF5, then the system shall show 'User ID can NOT be empty...'.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-149"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the User ID is unknown, then the system shall show 'User ID NOT found...'; if another lookup error occurs, the system shall show 'Unable to lookup User...'; and if the delete fails, the system shall show 'Unable to Update User...'.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-149"], "sources": ["app/cbl/COUSR03C.cbl:142-192"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the Delete User screen is opened from the user list with a user already selected (CDEMO-CU03-USR-SELECTED), the system shall run the lookup automatically on first display.", "capability": "claude/useradmin/04#1", "function": "claude/useradmin/04", "rules": ["claude/RULE-149"], "sources": ["app/cbl/COUSR03C.cbl:99-104"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When PF3 is pressed on the Delete User screen, the system shall return to the calling program (CDEMO-FROM-PROGRAM), or to admin menu COADM01C if no caller is recorded.", "capability": "claude/useradmin/04#2", "function": "claude/useradmin/04", "rules": ["claude/RULE-270"], "sources": ["app/cbl/COUSR03C.cbl:108-130"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When Enter is pressed on the Delete User screen, the system shall look up the user; when PF4 is pressed, the system shall clear the form; when PF5 is pressed, the system shall delete; and when PF12 is pressed, the system shall return to admin menu COADM01C.", "capability": "claude/useradmin/04#2", "function": "claude/useradmin/04", "rules": ["claude/RULE-270"], "sources": ["app/cbl/COUSR03C.cbl:108-130"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If any other key is pressed on the Delete User screen, then the system shall show the invalid-key message CCDA-MSG-INVALID-KEY.", "capability": "claude/useradmin/04#2", "function": "claude/useradmin/04", "rules": ["claude/RULE-270"], "sources": ["app/cbl/COUSR03C.cbl:108-130"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/04/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reset the program context to zero on every transfer from the user maintenance screens, and use COSGN00C as the target if none is set.", "capability": "claude/useradmin/04#2", "function": "claude/useradmin/04", "rules": ["claude/RULE-270"], "sources": ["app/cbl/COUSR01C.cbl:90-103", "app/cbl/COUSR03C.cbl:108-130"], "programs": ["COUSR01C"]}, {"key": "claude/useradmin/04/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If the Delete User transaction (CU03) starts with no COMMAREA, then the system shall send the user to the sign-on program COSGN00C.", "capability": "claude/useradmin/04#3", "function": "claude/useradmin/04", "rules": ["claude/RULE-252"], "sources": ["app/cbl/COUSR03C.cbl:90-92"], "programs": ["COUSR03C"]}, {"key": "claude/useradmin/04/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "State-driven", "text": "While a session with a COMMAREA reaches the Delete User transaction, the system shall allow the delete without checking the caller's user type (CDEMO-USER-TYPE) or comparing the target ID with the signed-on user ID.", "capability": "claude/useradmin/04#3", "function": "claude/useradmin/04", "rules": ["claude/RULE-252"], "sources": ["app/cbl/COUSR03C.cbl:90-132"], "programs": ["COUSR03C"]}, {"key": "claude/account/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the account number field on the Account View screen contains '*' or spaces when Enter is pressed, then the system shall treat it as not supplied, show the error 'Account number not provided', mark the field blank and set CDEMO-ACCT-ID to 0.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-100"], "sources": ["app/cbl/COACTVWC.cbl:622-681"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the account number is non-numeric or 00000000000, then the system shall show the error 'Account Filter must  be a non-zero 11 digit number', flag the field not-OK (shown in red), set CDEMO-ACCT-ID to 0 and read nothing.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-100"], "sources": ["app/cbl/COACTVWC.cbl:622-681"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When an account number made of 11 digits that are not all zeros (for example '00000000001') is entered and Enter is pressed, the system shall copy it to CDEMO-ACCT-ID and go on with the lookup.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-100"], "sources": ["app/cbl/COACTVWC.cbl:622-681"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "State-driven", "text": "While the screen is in re-entry, the system shall redisplay a blank account number field as '*' in red.", "capability": "claude/account/01#1", "function": "claude/account/01", "rules": ["claude/RULE-100"], "sources": ["app/cbl/COACTVWC.cbl:561-565"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When an account number passes validation, the system shall read the card cross-reference (CXACAIX) by account id and set CDEMO-CUST-ID and CDEMO-CARD-NUM from the cross-reference record.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-241"], "sources": ["app/cbl/COACTVWC.cbl:687-772"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the cross-reference record is found, the system shall read the account master (ACCTDAT) by the same account id and the customer master (CUSTDAT) by the customer id taken from the cross-reference, not from the account record.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-241"], "sources": ["app/cbl/COACTVWC.cbl:687-772"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use only the first cross-reference record matched on the account alternate index, so when an account has several cards only one card and customer is used.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-241"], "sources": ["app/cbl/COACTVWC.cbl:687-772"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the account is not in the cross-reference, then the system shall stop the lookup and show 'Account:<id> not found in Cross ref file. Resp:<r> Reas:<r2>'.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-241"], "sources": ["app/cbl/COACTVWC.cbl:687-772"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the account master read returns NOTFND, then the system shall set an input error with the message 'Account:<id> not found in Acct Master file.Resp:... Reas:...' and still read the customer master by the cross-reference customer id.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-101"], "sources": ["app/cbl/COACTVWC.cbl:701-715"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the customer is missing in CUSTDAT, then the system shall show 'CustId:<id> not found in customer master.Resp: <r> REAS:<r2>' and set the customer-filter flag not-OK.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-101"], "sources": ["app/cbl/COACTVWC.cbl:701-715"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If a file read returns a response other than NORMAL or NOTFND, then the system shall show 'File Error: READ on <file> returned RESP <r>,RESP2 <r2>', replacing any message already set.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-241", "claude/RULE-265"], "sources": ["app/cbl/COACTVWC.cbl:687-772", "app/cbl/COACTVWC.cbl:657-674"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "State-driven", "text": "While an error message is already set during a request, the system shall keep that first message when a later validation or not-found condition occurs.", "capability": "claude/account/01#2", "function": "claude/account/01", "rules": ["claude/RULE-265", "claude/RULE-101"], "sources": ["app/cbl/COACTVWC.cbl:657-674"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the account master record or the customer master record was found, the system shall fill the account section of the screen (status, current balance, credit limit, cash credit limit, current-cycle credit/debit, open/expiry/reissue dates, group id).", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-239"], "sources": ["app/cbl/COACTVWC.cbl:460-535"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the customer master record was found, the system shall fill the customer section of the screen (id, SSN, FICO, DOB, name, address, phones, government id, EFT account, primary-holder flag).", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-239"], "sources": ["app/cbl/COACTVWC.cbl:460-535"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the account view is entered for the first time with no commarea, the system shall show only the prompt 'Enter or update id of account to display'.", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-239"], "sources": ["app/cbl/COACTVWC.cbl:460-535"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the customer's 9-digit SSN in full, unmasked, formatted as 3-2-4 digits with hyphens (for example '123-45-6789').", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-240"], "sources": ["app/cbl/COACTVWC.cbl:493-507"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall show the FICO score, DOB, government-issued id and EFT account id unmasked.", "capability": "claude/account/01#3", "function": "claude/account/01", "rules": ["claude/RULE-240"], "sources": ["app/cbl/COACTVWC.cbl:493-507"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the user arrives from COMEN01C without the re-enter flag, or with no commarea, the system shall reset the shared commarea (account/customer/card ids cleared), send the empty search screen and set the state to re-enter.", "capability": "claude/account/01#4", "function": "claude/account/01", "rules": ["claude/RULE-173"], "sources": ["app/cbl/COACTVWC.cbl:282-406"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the user arrives from any program other than the menu, the system shall keep the passed commarea, such as a pre-selected account context.", "capability": "claude/account/01#4", "function": "claude/account/01", "rules": ["claude/RULE-173"], "sources": ["app/cbl/COACTVWC.cbl:282-406"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Complex", "text": "While the screen is in re-entry, when the user presses Enter, the system shall edit the inputs and redisplay the screen with the error message if there is an error, or otherwise read the account and redisplay the screen with the data.", "capability": "claude/account/01#4", "function": "claude/account/01", "rules": ["claude/RULE-173"], "sources": ["app/cbl/COACTVWC.cbl:282-406"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the state to re-enter every time it sends the screen and return under transaction CAVW to wait for the next key.", "capability": "claude/account/01#4", "function": "claude/account/01", "rules": ["claude/RULE-173"], "sources": ["app/cbl/COACTVWC.cbl:282-406"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3 (or PF15, which is mapped to PF3), the system shall transfer control to CDEMO-FROM-PROGRAM/TRANID, or to COMEN01C/CM00 if those are blank or low-values.", "capability": "claude/account/01#4", "function": "claude/account/01", "rules": ["claude/RULE-174"], "sources": ["app/cbl/COACTVWC.cbl:306-352"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When PF3 transfers control, the system shall set FROM to COACTVWC/CAVW, user type to 'User', program context to first-entry and last map to COACTVW/CACTVWA.", "capability": "claude/account/01#4", "function": "claude/account/01", "rules": ["claude/RULE-174"], "sources": ["app/cbl/COACTVWC.cbl:306-352"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Unwanted", "text": "If any key other than Enter or PF3 is pressed (for example PF1, PF2, CLEAR, PA1 or PA2), then the system shall treat it as Enter.", "capability": "claude/account/01#4", "function": "claude/account/01", "rules": ["claude/RULE-174"], "sources": ["app/cbl/COACTVWC.cbl:306-352"], "programs": ["COACTVWC"]}, {"key": "claude/account/01/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Unwanted", "text": "If the context is anything other than PF3, first-entry or re-entry, then the system shall send 'UNEXPECTED DATA SCENARIO' as plain text and record abend code 0001.", "capability": "claude/account/01#4", "function": "claude/account/01", "rules": ["claude/RULE-174"], "sources": ["app/cbl/COACTVWC.cbl:306-352"], "programs": ["COACTVWC"]}, {"key": "claude/account/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall allow an account to be updated only if it has a card cross-reference record (CXACAIX), an account master record (ACCTDAT) and a linked customer master record (CUSTDAT).", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-099"], "sources": ["app/cbl/COACTUPC.cbl:3608-3644"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the customer master using the customer ID from the first cross-reference row for the account.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-099"], "sources": ["app/cbl/COACTUPC.cbl:3608-3644"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the account has no row in the card cross-reference, then the system shall fail the fetch with 'Account:... not found in Cross ref file' and not show the details.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-099"], "sources": ["app/cbl/COACTUPC.cbl:3608-3644"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the account master record is missing, then the system shall show 'not found in Acct Master file'.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-099"], "sources": ["app/cbl/COACTUPC.cbl:3716-3734"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the customer master record is missing, then the system shall show 'CustId: not found in customer master'.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-099"], "sources": ["app/cbl/COACTUPC.cbl:3766-3784"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If any other read error occurs, then the system shall show the generic message 'File Error: READ on <file> returned RESP ...'.", "capability": "claude/account/02#1", "function": "claude/account/02", "rules": ["claude/RULE-099"], "sources": ["app/cbl/COACTUPC.cbl:3608-3644"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "State-driven", "text": "While no account is loaded, the system shall allow only the account number to be edited.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-237"], "sources": ["app/cbl/COACTUPC.cbl:2986-3005"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "State-driven", "text": "While an account is loaded and in stage S, the system shall allow every account and customer field to be edited except customer ID and country.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-237", "claude/RULE-092"], "sources": ["app/cbl/COACTUPC.cbl:2986-3005", "app/cbl/COACTUPC.cbl:3500-3562"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "State-driven", "text": "While the update is in stage N (waiting for confirmation) or stage C (saved), the system shall protect all fields.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-237"], "sources": ["app/cbl/COACTUPC.cbl:2986-3005"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter and nothing on the screen differs from the stored values, the system shall run no edits and show 'No change detected with respect to values fetched.'", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-094"], "sources": ["app/cbl/COACTUPC.cbl:1681-1775"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall detect changes by comparing group ID, customer ID, names, address lines, state, country, zip, government ID and primary holder flag trimmed and ignoring case, and by comparing monetary fields, dates, phone parts, SSN, EFT ID and FICO by exact match.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-094"], "sources": ["app/cbl/COACTUPC.cbl:1681-1775"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the only change to a text field is in letter case, then the system shall treat it as no change and not save it.", "capability": "claude/account/02#2", "function": "claude/account/02", "rules": ["claude/RULE-094"], "sources": ["app/cbl/COACTUPC.cbl:1681-1775"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require credit limit, cash credit limit, current balance, current cycle credit and current cycle debit to be supplied as valid currency amounts (TEST-NUMVAL-C / NUMVAL-C) and convert them to signed 10.2 values (PIC S9(10)V99) before saving.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-054"], "sources": ["app/cbl/COACTUPC.cbl:1484-1527", "app/cbl/COACTUPC.cbl:1072-1140"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If a monetary field is blank or '*', then the system shall reject it with '<field> must be supplied.'", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-054"], "sources": ["app/cbl/COACTUPC.cbl:1484-1527"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If a monetary field is not a valid currency amount (for example a cash credit limit of 'abc'), then the system shall reject it with a message such as 'Cash Credit Limit is not valid'.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-054"], "sources": ["app/cbl/COACTUPC.cbl:1484-1527"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the open, expiry and reissue dates each to be a real calendar date in CCYYMMDD form with century 19 or 20, month 1-12, day 1-31, 31 days allowed only in months 1,3,5,7,8,10,12, and February checked for leap years.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-088"], "sources": ["app/cbl/COACTUPC.cbl:1478-1507"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If an account date is not a valid calendar date (for example expiry date 2025-02-29) or its year is before 1900 or 2100 or later, then the system shall reject it.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-088"], "sources": ["app/cbl/COACTUPC.cbl:1478-1507"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require Account Active Status to be exactly 'Y' or 'N' in uppercase.", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-095"], "sources": ["app/cbl/COACTUPC.cbl:1856-1893"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Unwanted", "text": "If Account Active Status is not 'Y' or 'N' (for example lowercase 'y'), then the system shall reject it with 'Account Status must be Y or N.', and if it is blank, low-values or '0', then the system shall reject it with 'Account Status must be supplied.'", "capability": "claude/account/02#3", "function": "claude/account/02", "rules": ["claude/RULE-095"], "sources": ["app/cbl/COACTUPC.cbl:1856-1893"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the customer date of birth to be a valid date strictly earlier than today.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-089"], "sources": ["app/cbl/COACTUPC.cbl:1533-1543"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If a date of birth that passes the calendar edit is not earlier than today, then the system shall reject it with 'Date of Birth:cannot be in the future'.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-089"], "sources": ["app/cbl/COACTUPC.cbl:1533-1543"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require the FICO credit score to be a 3-digit number from 300 to 850.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-090"], "sources": ["app/cbl/COACTUPC.cbl:1545-1556"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If the FICO score is blank, non-numeric or 000, then the system shall fail the numeric check before the range check, and if it is outside 300-850, then the system shall reject it with 'FICO Score: should be between 300 and 850'.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-090"], "sources": ["app/cbl/COACTUPC.cbl:1545-1556", "app/cbl/COACTUPC.cbl:2514-2533"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require first name and last name (25 characters each) and allow only letters A-Z, a-z and space in them.", "capability": "claude/account/02#4", "function": "claude/account/02", "rules": ["claude/RULE-091"], "sources": ["app/cbl/COACTUPC.cbl:1560-1582"], "programs": ["COACTUPC"]}, {"key": "claude/account/02/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Optional", "text": "Where a middle name is entered, the system shall allow only letters and spaces in it, and th
