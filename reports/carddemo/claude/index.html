BR NOTFND on an empty file blocks the very first add."}, {"key": "claude/RULE-016", "function": "claude/pendauth/04", "id": "RULE-016", "name": "Reverse summary totals for expired authorizations", "text": "Given Account summary with approved count 3 / approved amount $300.00 and declined count 1 / declined amount $50.00, and an expired detail with response code '00', approved amount $120.00\nWhen the detail qualifies for deletion\nThen approved count becomes 2 and approved amount $180.00; had the response code been '05' with transaction amount $50.00, declined count would become 0 and declined amount $0.00", "program": "CBPAUP0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl:287-293", "plain": "When an expired authorization is purged, its count and amount are removed from the account's approved or declined pending totals depending on whether it was approved.", "defect": "The adjusted summary totals are only changed in working storage; the program never issues a REPL on the summary segment, so when the summary is not deleted the reduced counts/amounts are never saved and the stored totals stay overstated."}, {"key": "claude/RULE-017", "function": "claude/pendauth/02", "id": "RULE-017", "name": "Account authorization totals shown from the summary segment, or zero if none", "text": "Given Account 00000000001 has credit limit 5000.00, cash limit 1000.00, and a pending authorization summary with 3 approved (250.00), 1 declined (75.00), credit balance 250.00 and cash balance 0.00\nWhen The account details are gathered\nThen The header shows credit limit 5000.00, cash limit 1000.00, approved count 003, declined count 001, approved amount 250.00, declined amount 75.00, credit balance 250.00 and cash balance 0.00. For an account with no summary segment (IMS 'GE'), the counts, amounts and balances show 0.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-N-001"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:780-807", "plain": "The screen header shows the account's credit and cash limits from the account master. It also shows approved and declined authorization counts and amounts, plus credit and cash balances, taken from the account's pending authorization summary. All of these show as zero when no summary exists.", "defect": ""}, {"key": "claude/RULE-018", "function": "claude/pendauth/02", "id": "RULE-018", "name": "Decline reason code lookup", "text": "Given An authorization with reason code '4100'\nWhen The details are displayed\nThen The reason field shows '4100-INSUFFICNT FUND'", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-039", "REQ-F-040", "REQ-N-006"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:319-328", "plain": "The 4-digit reason code on the authorization is translated into a description using a fixed table. A code not in the table shows as '9999-ERROR'.", "defect": ""}, {"key": "claude/RULE-019", "function": "claude/pendauth/03", "id": "RULE-019", "name": "Reconstruct authorization timestamp for fraud record key", "text": "Given PA-AUTH-ORIG-DATE '250430' and PA-AUTH-TIME-9C 857944876\nWhen the fraud record is built\nThen time = 999999999 - 857944876 = 142055123 -> HH 14, MI 20, SS 55, millis 123; AUTH-TS = '25-04-30 14.20.55123000', parsed with 'YY-MM-DD HH24.MI.SSNNNNNN'", "program": "COPAUS2C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS2C.cbl:103-114", "plain": "The authorization timestamp stored in the fraud table is rebuilt from the original authorization date (YYMMDD) and the inverted authorization time in the IMS key.", "defect": ""}, {"key": "claude/RULE-020", "function": "claude/txntype/02", "id": "RULE-020", "name": "Transaction type list page size and paging cursor", "text": "Given The TRANSACTION_TYPE table holds codes 01..10 and no filters are set\nWhen The user opens the list (first page) and then presses PF8\nThen Page 1 shows codes 01-07; a lookahead fetch finds 08 so next-page-exists is set and the last key becomes 08; PF8 reads TR_TYPE >= 08 and shows 08-10 on page 2 with next-page-not-exists", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1603-1723", "plain": "The list shows at most 7 transaction types per page, sorted by type code, and decides whether a next page exists by trying to read an 8th record.", "defect": "Page number is a single digit (PIC 9(1)); moving past page 9 truncates to 0. Backward read treats SQLCODE +100 (fewer than 7 prior rows, e.g. rows deleted by another user) as a DB2 error rather than a short page (lines 1777-1789)."}, {"key": "claude/RULE-021", "function": "claude/common/01", "id": "RULE-021", "name": "Date format conversion between YYYYMMDD and YYYY-MM-DD", "text": "Given Input type '1' with input date '20240315' and output type other than '2'; or input type '2' with input date '2024-03-15' and output type other than '1'\nWhen A caller (CBACT01C) calls COBDATFT with the CODATECN record\nThen Type 1 gives output date '2024-03-15' (YYYY + '-' + MM + '-' + DD). Type 2 gives output date '20240315' (input positions 1-4, 6-7 and 9-10).", "program": "COBDATFT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/asm/COBDATFT.asm:27-54", "plain": "The routine turns a compact 8-digit date into a dashed ISO date (type 1), or a dashed ISO date into the compact 8-digit form (type 2). It does this by moving characters, with no check that the date is real.", "defect": ""}, {"key": "claude/RULE-022", "function": "claude/provisioning/03", "id": "RULE-022", "name": "Default cycle debit of 2,525.00 when the account has no cycle debit", "text": "Given Account A with ACCT-CURR-CYC-DEBIT = 0.00, followed by account B with ACCT-CURR-CYC-DEBIT = 300.00\nWhen Both records are written to the account extract\nThen Account A's extract shows cycle debit 2,525.00; account B's extract also shows 2,525.00 (left over from account A) instead of 300.00, because no move of the real value happens", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBACT01C.cbl:235-238", "plain": "When an account's current-cycle debit amount is zero, the extract shows a fixed cycle debit of 2,525.00; when it is non-zero, the program never copies the real amount into the extract.", "defect": "There is no ELSE branch moving ACCT-CURR-CYC-DEBIT to OUT-ACCT-CURR-CYC-DEBIT, so real non-zero cycle debits never reach the extract. Substituting a made-up 2,525.00 for a true zero also misstates the account's activity. This looks like test-data seeding, not a business rule."}, {"key": "claude/RULE-023", "function": "claude/provisioning/01", "id": "RULE-023", "name": "Single run timestamp stamped on all export records", "text": "Given The job starts at 14:07:18.53 on 2025-10-16\nWhen records are exported, including ones written minutes later\nThen every record has EXPORT-TIMESTAMP = '2025-10-16 14:07:18.00'", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:172-195", "plain": "The system date and time are read once when the job starts. Every exported record carries that same timestamp, formatted as 'YYYY-MM-DD HH:MM:SS.00'.", "defect": "The comment says this is a '26-character timestamp', but the code builds only 22 meaningful characters and throws away the hundredths that were captured."}, {"key": "claude/RULE-024", "function": "claude/provisioning/01", "id": "RULE-024", "name": "Export field mapping and numeric re-encoding per record type", "text": "Given An account with current balance 1,250.75, credit limit 5,000.00 and current-cycle debit 300.00\nWhen its 'A' export record is built\nThen the balance is stored as signed packed decimal S9(10)V99 COMP-3, the credit limit as zoned S9(10)V99, the cash credit limit as COMP-3 and the cycle debit as binary COMP. Two decimal places are kept, and unused bytes are initialized (spaces or zeros).", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBEXPORT.cbl:338-362", "plain": "Each source record's business fields are copied one-for-one into the export layout. Some numeric fields change storage format along the way, such as packed decimal or binary, and the 460-byte data area is cleared first.", "defect": ""}, {"key": "claude/RULE-025", "function": "claude/provisioning/01", "id": "RULE-025", "name": "Export control totals", "text": "Given 3 customers, 2 accounts, 2 xrefs, 5 transactions and 2 cards are exported\nWhen the job finishes\nThen it reports Customers 3, Accounts 2, XRefs 2, Transactions 5, Cards 2 and Total 14", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-023"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:554-573", "plain": "The job counts records written for each type plus a grand total and reports them at the end for reconciliation. The grand total equals the sum of the per-type counts and the last sequence number.", "defect": ""}, {"key": "claude/RULE-026", "function": "claude/batch/02", "id": "RULE-026", "name": "Add each posted transaction to the balance for its account, type and category", "text": "Given Account 00000012345 has an existing balance record for type '01', category 0001 of $400.00, and no record for type '02', category 0003\nWhen A $50.00 transaction of type 01 / category 0001 posts, and then a -$20.00 transaction of type 02 / category 0003 posts\nThen The type 01 / category 0001 balance becomes $450.00. A new record for type 02 / category 0003 is created with balance -$20.00", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-023"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBTRN02C.cbl:467-542", "plain": "Each posted transaction's amount is added to a running balance kept per account, transaction type and transaction category. If no balance record exists yet for that combination, one is created starting from zero.", "defect": ""}, {"key": "claude/RULE-027", "function": "claude/batch/05", "id": "RULE-027", "name": "Account (card) control break with account subtotal", "text": "Given The previous transaction was for card A (account total $74.50) and the next transaction is for card B\nWhen the card B transaction is processed\nThen an account-total line showing +74.50 and a dashed separator line are written, the account total resets to $0.00, and card B is looked up in the card cross-reference to get its account ID", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-015", "REQ-F-016"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBTRN03C.cbl:181-188", "plain": "The report is grouped by card number. When the card number changes, the previous card's account total is printed and reset to zero, then the new card is looked up to find its account.", "defect": ""}, {"key": "claude/RULE-028", "function": "claude/batch/05", "id": "RULE-028", "name": "End-of-report final totals", "text": "Given The last transaction read was $50.00, already counted, and the current page total is $200.00\nWhen the next read hits end of file\nThen $50.00 is added again (page total $250.00), then the page-total line and the grand-total line are printed, so the grand total includes the last transaction twice", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBTRN03C.cbl:197-204", "plain": "At the end of the transaction file the program closes the last page and prints the final page total and the grand total.", "defect": "The extra ADD TRAN-AMT at end of file counts the last transaction twice in the final page and grand totals, and the last card's account total is never printed."}, {"key": "claude/RULE-029", "function": "claude/account/02", "id": "RULE-029", "name": "Composition of saved account and customer records", "text": "Given Open date entered as year 2020, month 05, day 01, and phone 1 as 212 / 555 / 0100\nWhen The record is saved\nThen ACCT-OPEN-DATE is stored as '2020-05-01' and CUST-PHONE-NUM-1 as '(212)555-0100'", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-056", "REQ-F-057"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:3956-4059", "plain": "Screen values are rebuilt into stored formats: dates become YYYY-MM-DD, phones become (AAA)BBB-CCCC, amounts become signed 10.2 numbers, and the customer ID is carried over unchanged.", "defect": "ACCT-UPDATE-RECORD leaves out ACCT-ADDR-ZIP (X(10)), which sits before ACCT-GROUP-ID in CVACT01Y. On rewrite, the group ID lands in the ACCT-ADDR-ZIP position and ACCT-GROUP-ID is blanked. That corrupts both fields on every save."}, {"key": "claude/RULE-030", "function": "claude/transactions/01", "id": "RULE-030", "name": "Bill payment transaction ID is the highest existing ID plus one", "text": "Given The highest existing transaction ID in TRANSACT is 0000000000000512\nWhen A confirmed bill payment is posted\nThen The new transaction is written with ID 0000000000000513", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-N-002"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COBIL00C.cbl:212-219", "plain": "A new payment transaction's ID is assigned by finding the last (highest-key) transaction in the transaction file and adding 1.", "defect": "Max+1 ID generation is not concurrency-safe; collision is only detected at write time and (per the posting rule) the balance is still reduced."}, {"key": "claude/RULE-031", "function": "claude/card/01", "id": "RULE-031", "name": "Paging: 7 cards per page with forward/back browse and look-ahead", "text": "Given The page starts at card key K, and 10 cards at or after K match the filters\nWhen Enter or PF8 triggers a forward read\nThen Rows 1-7 are filled, the first card key is saved, the 8th record's key becomes the next-page start key, CA-NEXT-PAGE-EXISTS='Y', and the page number becomes 1 if it was 0", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COCRDLIC.cbl:1123-1263", "plain": "The list shows up to 7 matching cards per page in card-number order. After filling a page the program reads one more record to decide whether a next page exists, and stores the first and next-start keys for paging.", "defect": "The look-ahead read (lines 1197-1214) ignores the filters, so PF8 can lead to an empty page. Page back (9100) has no end-of-file/start-of-file branch, so reaching the start of the file is reported as a file error. The one-digit page number wraps after 9."}, {"key": "claude/RULE-032", "function": "claude/transactions/02", "id": "RULE-032", "name": "Forward paging: 10 transactions per page with look-ahead for more", "text": "Given The current page is 2, the last ID shown is 0000000000000020, and 25 transactions exist\nWhen The user presses PF8\nThen The browse starts at ID 20 and skips it because it was already shown. Rows 1-10 show IDs 21-30 when that many exist. With 25 records, rows 21-25 are shown, rows 6-10 are blank, the page number becomes 3, and next-page = No.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:279-328", "plain": "Each page shows up to 10 transactions in ascending transaction ID order. The page number goes up by one when a page is shown. 'More pages' is set only if at least one more transaction exists after the 10th row.", "defect": ""}, {"key": "claude/RULE-033", "function": "claude/transactions/02", "id": "RULE-033", "name": "Backward paging and page-number decrement", "text": "Given Page 3 is shown and its first ID is 0000000000000021\nWhen The user presses PF7\nThen The program skips ID 21 and reads IDs 20 down to 11 into rows 10 down to 1. It then does a look-ahead read. If that read succeeds and the page is above 1, the page number becomes 2. If the look-ahead hits the start of the file, the page number is set to 1.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/COTRN00C.cbl:333-376", "plain": "Paging back reads the 10 transactions just before the first one shown and fills the rows from bottom to top. The page number drops by one, but never below 1.", "defect": "When the start of the file is hit during the 10-row fill, the page number is not decremented or reset. The screen can show page N while showing the first records of the file, with blank top rows."}, {"key": "claude/RULE-034", "function": "claude/useradmin/01", "id": "RULE-034", "name": "Backward paging and page-number decrement", "text": "Given The admin is on page 3, with first user ID USER0021 saved\nWhen PF7 is pressed\nThen The browse starts at USER0021 and skips it. The 10 users before it fill rows 10 down to 1. If one more earlier record exists, the page number drops by 1 (to 2). If not, the page number is set to 1. Next-page is set to Y", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018", "REQ-F-027"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COUSR00C.cbl:237-255", "plain": "PF7 shows the previous 10 users before the first user on the current page, but only if the current page number is above 1. Otherwise the admin is told they are already at the top.", "defect": "With fewer than 10 earlier records, the rows fill from the bottom up and leave blank rows at the top. CDEMO-CU00-USRID-FIRST is also not refreshed, so later PF7/PF8 anchors can be wrong. The page number goes down only when a record before the page exists, so the page count can drift from the real position."}, {"key": "claude/RULE-035", "function": "claude/useradmin/01", "id": "RULE-035", "name": "Forward paging: 10 users per page with look-ahead for a next page", "text": "Given USRSEC holds 23 users, the admin is on page 1 (users 1-10), and the last ID shown is saved\nWhen PF8 is pressed\nThen The browse restarts at the last saved ID and skips that record. Users 11-20 fill rows 1-10. Page number becomes 2. A look-ahead read finds user 21, so next-page = Y. A second PF8 shows users 21-23, page 3, next-page = N", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-027"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "app/cbl/COUSR00C.cbl:282-331", "plain": "The list shows up to 10 users per page in user-ID order. The page number goes up by one per page shown, and a 'next page exists' flag is set by reading one record past the page.", "defect": "When the read hits end-of-file or an error, READNEXT sends the screen from inside the read routine (line 640), and the page routine then sends it again (line 329). The screen is sent twice in one task. Also, if fewer than 10 rows load, CDEMO-CU00-USRID-LAST keeps the old page's value because only row 10 sets it."}, {"key": "claude/RULE-036", "function": "claude/pendauth/01", "id": "RULE-036", "name": "Inverted date/time key for newest-first ordering", "text": "Given Processing on 2026 day 327 at 14:30:15.250\nWhen The detail key is calculated\nThen PA-AUTH-DATE-9C = 99999 - 26327 = 73672; time-with-ms = 143015*1000 + 250 = 143015250; PA-AUTH-TIME-9C = 999999999 - 143015250 = 856984749.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-030", "REQ-F-031"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:857-875", "plain": "Each detail record is keyed by a reversed timestamp so the newest authorizations sort first: the date key is 99999 minus the current YYDDD, and the time key is 999999999 minus the time of day in milliseconds.", "defect": ""}, {"key": "claude/RULE-037", "function": "claude/pendauth/02", "id": "RULE-037", "name": "Authorization timestamp display format", "text": "Given An authorization with original date '261123' and time '143005'\nWhen It is listed\nThen The date shows as 11/23/26 and the time as 14:30:05.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:525-534", "plain": "Each listed authorization shows its original date as MM/DD/YY, converted from the stored YYMMDD, and its original time as HH:MM:SS, converted from HHMMSS.", "defect": ""}, {"key": "claude/RULE-038", "function": "claude/pendauth/02", "id": "RULE-038", "name": "Fraud status display", "text": "Given An authorization with fraud flag 'F' and fraud report date '11/23/26'\nWhen The details are displayed\nThen The fraud field shows 'F-11/23/26'", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-041"], "priority": "P2", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:344-350", "plain": "If an authorization was ever tagged for fraud, the screen shows the fraud flag and the date it was reported. Otherwise it shows a dash.", "defect": ""}, {"key": "claude/RULE-039", "function": "claude/pendauth/05", "id": "RULE-039", "name": "Unload counters and unused purge parameters", "text": "Given An unload of 2 summaries with 3 details each\nWhen The run finishes\nThen WS-NO-SUMRY-READ and WS-AUTH-SMRY-PROC-CNT both end at 8 (2 roots + 6 children). WS-NO-DTL-READ stays at 0, and no counter is displayed or reconciled", "program": "PAUDBUNL", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005"], "priority": "P2", "category": "Calculation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:264-272", "plain": "The program counts records as it reads them, but adds detail reads to the summary counter. It also declares expiry-days and checkpoint parameters that it never reads or uses.", "defect": "Detail reads are added to the summary counters (lines 268-269) instead of WS-NO-DTL-READ. The working storage looks copied from the expiry-purge program and is left over."}, {"key": "claude/RULE-040", "function": "claude/txntype/02", "id": "RULE-040", "name": "Description filter is a contains-match", "text": "Given Description filter 'Purch'\nWhen The list is read\nThen The query uses TR_DESCRIPTION LIKE '%Purch%' and returns e.g. 'Purchase' rows", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1142-1164", "plain": "A non-blank description filter is wrapped as %text% and matched with SQL LIKE, so any type whose description contains the text is listed.", "defect": ""}, {"key": "claude/RULE-041", "function": "claude/provisioning/03", "id": "RULE-041", "name": "Balance-history array record seeded with fixed amounts", "text": "Given An account with ACCT-ID 00000000001 and current balance 1,250.00\nWhen The array record is built\nThen Slot 1 = (balance 1,250.00, cycle debit 1,005.00); slot 2 = (1,250.00, 1,525.00); slot 3 = (-1,025.00, -2,500.00); slots 4 and 5 = (0.00, 0.00); 4-byte filler is spaces", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008"], "priority": "P2", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBACT01C.cbl:253-261", "plain": "For each account, a five-slot balance/debit array record is written in which slots 1 and 2 hold the account's real current balance with fixed debits, slot 3 holds fixed negative amounts, and slots 4 and 5 are zero.", "defect": "The array values are hardcoded literals unrelated to the account's real data, so the file looks like a demo or test fixture, not a business output."}, {"key": "claude/RULE-042", "function": "claude/provisioning/03", "id": "RULE-042", "name": "Variable-length account summary records (status record and balance record)", "text": "Given An account with ID 00000000001, status 'Y', balance 1,250.00, credit limit 5,000.00, reissue date '2023-06-30'\nWhen The variable-length records are written\nThen Record 1 (length 12) = ID + 'Y'; record 2 (length 39) = ID + 1,250.00 + 5,000.00 + '2023'", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBACT01C.cbl:276-315", "plain": "For each account, two variable-length records are written: a 12-byte record with the account ID and active status, then a 39-byte record with the account ID, current balance, credit limit and the four-digit year of the reissue date.", "defect": ""}, {"key": "claude/RULE-043", "function": "claude/batch/03", "id": "RULE-043", "name": "Fee computation not implemented", "text": "Given A category balance with a non-zero interest rate\nWhen Interest is computed\nThen The fee step is invoked but no fee is calculated, posted, or written", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004"], "priority": "P2", "category": "Calculation", "confidence": "Medium", "source": "app/cbl/CBACT04C.cbl:518-520", "plain": "A fee calculation step exists in the interest cycle but performs nothing, so no fees are charged by this batch.", "defect": ""}, {"key": "claude/RULE-044", "function": "claude/provisioning/02", "id": "RULE-044", "name": "Import reconciliation statistics", "text": "Given An export file with 3 C, 5 A, 5 X, 20 T, 5 D and 2 records of type 'Q'\nWhen The import finishes\nThen The report shows Total Read 40, Customers 3, Accounts 5, XRefs 5, Transactions 20, Cards 5, Errors Written 2, Unknown Types 2", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-N-001"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/CBIMPORT.cbl:454-478", "plain": "At the end of the run the program reports the total records read and counts by type: customers, accounts, xrefs, transactions and cards imported, plus errors written and unknown types. Total read should equal the sum of the five imported counts and the unknown count.", "defect": ""}, {"key": "claude/RULE-045", "function": "claude/card/02", "id": "RULE-045", "name": "Card detail display content", "text": "Given Card record with embossed name 'JOHN DOE', expiration date '2027-08-31' and active status 'Y'\nWhen The lookup succeeds\nThen The screen shows name JOHN DOE, expiry month 08, expiry year 2027, and status Y", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-009", "REQ-F-010"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/COCRDSLC.cbl:457-497", "plain": "When a card is found, the screen shows the embossed name, the expiry month and year (taken from the stored YYYY-MM-DD expiry date, with the day dropped), and the active status code.", "defect": ""}, {"key": "claude/RULE-046", "function": "claude/transactions/02", "id": "RULE-046", "name": "Transaction row display format", "text": "Given A transaction with origination timestamp 2022-07-19-... and amount -125.50\nWhen It is placed on a list row\nThen The date shows as 07/19/22 and the amount as -00000125.50 (edit picture +99999999.99).", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:381-445", "plain": "Each listed transaction shows its ID, its origination date as MM/DD/YY, its description and a signed amount.", "defect": ""}, {"key": "claude/RULE-047", "function": "claude/pendauth/05", "id": "RULE-047", "name": "Only pending-authorization summaries with a numeric account ID are unloaded, together with their detail records", "text": "Given The pending-authorization IMS database holds summary A with PA-ACCT-ID 00000012345 and 3 detail segments, and summary B whose PA-ACCT-ID holds non-numeric data (for example spaces)\nWhen The unload batch reads each root segment in sequence (GN, unqualified SSA PAUTSUM0)\nThen Summary A is written to OPFILE1 (100-byte record) and its 3 details are written to OPFILE2. Summary B is not written to either file, nothing is logged for it, and processing moves on to the next root", "program": "PAUDBUNL", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:223-238", "plain": "Each pending-authorization summary (root) is written to the summary unload file, and its authorization details (children) are unloaded, only if the summary's account ID is numeric. Otherwise the summary and all its details are skipped without any message.", "defect": "Records with an invalid account ID are dropped silently, and nothing in the output files or log lets anyone reconcile them. | Lines 278-279 add 1 to WS-NO-SUMRY-READ and WS-AUTH-SMRY-PROC-CNT for every detail as well as every summary, so the counters would be wrong if they were ever reported. They are never displayed. Separately, the detail GSAM output has no parent account key, so the reload (PAUDBLOD) can only rebuild parentage if some other step adds the key before reload."}, {"key": "claude/RULE-048", "function": "claude/txntype/01", "id": "RULE-048", "name": "Transaction type maintenance action is chosen by the record's action code", "text": "Given An input file of fixed records laid out as action code (1 char), transaction type code (2 chars) and description (50 chars), e.g. 'A' + '01' + 'Purchase'\nWhen The batch reads each record in turn\nThen 'A' runs the insert, 'U' runs the description update, 'D' runs the delete, '*' writes 'IGNORING COMMENTED LINE' and does nothing else, and any other code (e.g. 'X' or a blank) writes 'ERROR: TYPE NOT VALID' and sets return code 4", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130", "plain": "Each input line carries a one-character action code: 'A' adds a transaction type, 'U' updates its description, 'D' deletes it, '*' marks a comment line that is skipped, and any other code is rejected as an invalid type.", "defect": ""}, {"key": "claude/RULE-049", "function": "claude/txntype/03", "id": "RULE-049", "name": "Transaction type code must be a non-zero 2-digit number, stored zero-padded", "text": "Given An administrator is on the Transaction Type Update screen with no record fetched yet\nWhen They enter a type code and press Enter\nThen Blank, '*' or all-spaces gives 'Tran Type code must be supplied.'; non-numeric (e.g. 'AB') gives 'Tran Type code must be numeric.'; '0' or '00' gives 'Tran Type code must not be zero.'; a valid entry such as '5' is normalised to '05' and used for the database lookup", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:820-976", "plain": "The transaction type code used to look up a record must be entered, must be numeric, must not be zero, and is stored as a 2-digit zero-padded code.", "defect": "Signed or decimal numeric input passes TEST-NUMVAL and is quietly changed when moved into an unsigned 2-digit field (for example '-1' becomes '01', '1.5' becomes '01')."}, {"key": "claude/RULE-050", "function": "claude/mqinquiry/01", "id": "RULE-050", "name": "Account inquiry request eligibility (function INQA with positive account id)", "text": "Given A request message on the triggering input queue laid out as function (4 chars) + account id (11 digits) + filler (985 chars)\nWhen The message is processed, e.g. 'INQA00000000000' or 'INQB00000012345'\nThen 'INQA' with account id 12345 proceeds to the account file read; 'INQA' with account id 0 or any other function code (e.g. 'INQB') is rejected with the reply text 'INVALID REQUEST PARAMETERS ACCT ID : 00000000000FUNCTION : INQB' sent to the reply queue, and no account file read happens", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:393-457", "plain": "A request message is only treated as an account lookup when its first 4 characters are the function code 'INQA' and the following 11-digit account number is greater than zero; anything else gets an 'invalid request' reply.", "defect": ""}, {"key": "claude/RULE-051", "function": "claude/provisioning/02", "id": "RULE-051", "name": "Import copies fields verbatim with no business-field validation; the validation step is a stub", "text": "Given A customer export record with FICO score 999, SSN 000000000 and DOB 'ABCD-EF-GH', and an xref record pointing to account 99999999999 that does not exist in the export\nWhen The import runs\nThen All of these values are written unchanged to the target files, and the run log says 'Import validation completed' and 'No validation errors detected'", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CBIMPORT.cbl:448-452", "plain": "Records of known types are copied field by field into the target layouts with no checks at all: no required fields, ranges, formats, duplicate keys or links between records. The 'validate import' step always reports success, even though the program header promises checksum-based integrity checks.", "defect": "The program's stated purpose (validation and checksums, lines 9-11 and 31) is not implemented. 3000-VALIDATE-IMPORT always reports 'No validation errors detected' whatever the data contains, so a corrupt or orphaned record is imported without any notice."}, {"key": "claude/RULE-052", "function": "claude/batch/01", "id": "RULE-052", "name": "Daily transaction card must be verified against the card cross-reference", "text": "Given A daily transaction with ID 'TX00000000000001' and card number '4111111111111111'\nWhen The card number is looked up by key in the cross-reference file (2000-LOOKUP-XREF, lines 227-239)\nThen If found, the linked account ID (XREF-ACCT-ID, 11 digits) and customer ID are resolved and the account check runs; if not found, the status is set to 4 and 'CARD NUMBER 4111111111111111 COULD NOT BE VERIFIED. SKIPPING TRANSACTION ID-TX00000000000001' is reported and the next record is read", "program": "CBTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-005"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CBTRN01C.cbl:170-184", "plain": "Each daily transaction is accepted for further processing only if its 16-character card number exists in the card-to-account cross-reference file; otherwise it is skipped and reported.", "defect": ""}, {"key": "claude/RULE-053", "function": "claude/batch/02", "id": "RULE-053", "name": "Credit limit check (overlimit rejection)", "text": "Given An account with credit limit $5,000.00, current-cycle credit $4,800.00, current-cycle debit $0.00, and an incoming transaction of $250.00\nWhen The posting batch validates the transaction\nThen The projected balance is 4,800.00 - 0.00 + 250.00 = $5,050.00. That is above $5,000.00, so the transaction is rejected with reason 102 'OVERLIMIT TRANSACTION'. A projected balance of exactly $5,000.00 would pass (limit >= projected)", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CBTRN02C.cbl:403-413", "plain": "A transaction is rejected as overlimit if the account's current-cycle credits minus current-cycle debits plus the transaction amount would exceed the account's credit limit.", "defect": "The posting step (lines 548-552) adds negative amounts to ACCT-CURR-CYC-DEBIT, so the debit field holds a negative total. Subtracting it in the limit formula therefore adds the size of past payments and credits to the projected balance. A customer who has made payments this cycle looks closer to the limit, not further from it. Also, the projected balance is held in a field one digit smaller (S9(09)V99) than the account fields (S9(10)V99), so very large values could be cut off without warning."}, {"key": "claude/RULE-054", "function": "claude/account/02", "id": "RULE-054", "name": "Monetary account fields required and must be valid signed amounts", "text": "Given Credit limit is entered as '5,000.00' and cash credit limit as 'abc'\nWhen The edits run\nThen The credit limit is accepted as 5000.00 (NUMVAL-C). The cash credit limit fails with 'Cash Credit Limit is not valid'", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-F-015"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COACTUPC.cbl:1484-1527", "plain": "Credit limit, cash credit limit, current balance, current cycle credit and current cycle debit must all be supplied as valid currency amounts. They are converted to signed 10.2 values before saving.", "defect": "Credit limit, cash limit and balance can be overwritten with any value, including negative ones, with no limit or cross-field check. The balance and cycle totals can be edited by hand."}, {"key": "claude/RULE-055", "function": "claude/card/03", "id": "RULE-055", "name": "Card is located by card number only; account number is not cross-checked", "text": "Given Account 00000000001 and card 4111111111111111, where the card actually belongs to account 00000000099\nWhen The card is fetched for update\nThen The card is found and displayed (no mismatch error). If the card number does not exist, the message 'Did not find cards for this search condition' is shown and both keys are flagged in error; other file errors show 'File Error: READ on CARDDAT returned RESP ...'.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COCRDUPC.cbl:1376-1413", "plain": "The card to update is read from the card master file using the card number alone; the account number entered is not used to verify that the card belongs to that account.", "defect": "Account/card ownership is never verified (account key move commented out at line 1379). Combined with the rewrite using the screen account id (line 1463), a card could be re-linked to whatever account number was entered."}, {"key": "claude/RULE-056", "function": "claude/card/03", "id": "RULE-056", "name": "Optimistic concurrency check before rewrite", "text": "Given Operator fetched card with name 'JOHN SMITH', status 'Y', and another user changed status to 'N' meanwhile\nWhen The operator presses PF5 to save\nThen Save is aborted with 'Record changed by some one else. Please review', the displayed 'old' values are refreshed from the file and the state returns to S. If the record cannot be locked, 'Could not lock record for update' and state L.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-025", "REQ-F-026", "REQ-F-027"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COCRDUPC.cbl:1420-1457", "plain": "Before saving, the card record is re-read with a lock and compared field-by-field with the values originally shown; if anyone else changed it, the save is aborted and the latest values are shown for review.", "defect": ""}, {"key": "claude/RULE-057", "function": "claude/signon/01", "id": "RULE-057", "name": "Credential authentication against the user security file (case-insensitive input)", "text": "Given User ID 'admin001' and Password 'passw0rd' entered; USRSEC holds record ADMIN001 with stored password 'PASSW0RD'\nWhen Enter is pressed\nThen Lookup key becomes 'ADMIN001', entered password becomes 'PASSW0RD', comparison matches and the user is signed on; if the stored password were different the screen shows 'Wrong Password. Try again ...' with cursor on Password", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-F-013"], "priority": "P0", "category": "Validation", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:132-140", "plain": "The entered User ID and Password are converted to upper case, the User ID is used as the key to read the USRSEC user security record, and sign-on succeeds only if the stored password exactly equals the upper-cased entered password.", "defect": "Passwords are stored and compared in plain text and the comparison is effectively case-insensitive on input only; a mixed-case stored password is unreachable. No failed-attempt counter or lockout exists."}, {"key": "claude/RULE-058", "function": "claude/transactions/03", "id": "RULE-058", "name": "Transaction must be tied to a known card/account via the cross-reference", "text": "Given Operator enters Account ID 00000000001 and leaves Card Number blank\nWhen Enter is pressed on the Add Transaction screen\nThen The account is looked up in the account-to-card alternate index (CXACAIX); if found, the card number from that cross-reference record is filled in and used for the transaction; if not found, 'Account ID NOT found...' is shown and nothing is added", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COTRN02C.cbl:193-230", "plain": "Before a transaction can be added, the operator must enter either an Account ID or a Card Number; it must be numeric and exist in the card cross-reference, and the system fills in the other half of the pair from the cross-reference.", "defect": "An account with several cards resolves to whichever card the alternate index returns first; the operator cannot choose the card when entering by account. No account status, card active status, expiry, or credit-limit check is performed before adding a transaction."}, {"key": "claude/RULE-059", "function": "claude/common/02", "id": "RULE-059", "name": "Calendar date validity check against a caller-supplied format mask", "text": "Given A caller passes date '2024-02-30' with format mask 'YYYY-MM-DD' (each padded to 10 characters)\nWhen CSUTLDTC calls CEEDAYS to convert the date to a Lilian day number\nThen The feedback is not all zeros, so the result is a non-zero severity, a message number (for example 2510 'Datevalue error') and the date and mask echoed back. A good date such as '2024-02-29' returns severity '0000' and 'Date is valid'.", "program": "CSUTLDTC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-F-007"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CSUTLDTC.cbl:103-151", "plain": "A date is accepted only if the Language Environment date service (CEEDAYS) can turn it into a real calendar day under the format mask the caller supplies. The result is a severity code, a message number and a short verdict text.", "defect": "Callers ignore message 2513 ('Unsupp. Range'), so dates outside the CEEDAYS supported range (before 1582-10-15 or after 9999-12-31) are accepted as valid at the caller. Also, the condition name FC-INVALID-DATE means success, which invites mistakes in a rewrite."}, {"key": "claude/RULE-060", "function": "claude/pendauth/01", "id": "RULE-060", "name": "Card must exist in cross-reference before authorization is recorded", "text": "Given A request for card 4111111111111111 that is not in the CCXREF file\nWhen The request is processed\nThen A warning 'CARD NOT FOUND IN XREF' (A001) is logged, the account is marked not-found, a reply is sent, and no summary or detail record is written.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:438-513", "plain": "The card number is looked up in the card cross-reference to find its account and customer. Only when the card is found are the account, customer and pending-summary reads done and the authorization written to the database. Unknown cards get a response but no record is saved.", "defect": "For an unknown card, 5500 is skipped but the summary-found flag keeps its value from the previous message. If the previous message found a summary, the unknown card is checked against that other account's limit and balance and can be APPROVED with code '00'. It should be declined with 3100."}, {"key": "claude/RULE-061", "function": "claude/pendauth/01", "id": "RULE-061", "name": "Decline reason code assignment", "text": "Given A declined request where the account was not found in the account master\nWhen The reason code is assigned\nThen The reason is '3100'. A request declined only for insufficient funds gets '4100'.", "program": "COPAUA0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-020", "REQ-F-021"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl:698-718", "plain": "Every response carries a 4-digit reason: '0000' when approved. When declined, the first matching cause sets the reason: card, account or customer not found gives 3100, insufficient funds 4100, card not active 4200, account closed 4300, card fraud 5100, merchant fraud 5200, anything else 9000.", "defect": "Card status, account active status, card expiry date and fraud screening are never checked: the reason codes exist but nothing sets them. WS-DECLINE-REASON-FLG and WS-CUST-MASTER-READ-FLG are never reset per message, so stale flags from an earlier message can change the reason reported."}, {"key": "claude/RULE-062", "function": "claude/pendauth/02", "id": "RULE-062", "name": "Account ID required and numeric before inquiry", "text": "Given The summary screen is shown and the user enters account ID '' (blank), then 'ABC12345678', then '00000000001'\nWhen The user presses Enter\nThen Blank gives 'Please enter Acct Id...'. 'ABC12345678' gives 'Acct Id must be Numeric ...'. In both cases the working account ID is cleared and the error flag is set. '00000000001' is accepted and saved as both the working account ID and the commarea account ID (CDEMO-ACCT-ID).", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:264-284", "plain": "When the user presses Enter, the account ID must be filled in and numeric. Otherwise the inquiry is refused with an error message and no account data is loaded.", "defect": ""}, {"key": "claude/RULE-063", "function": "claude/pendauth/02", "id": "RULE-063", "name": "Selecting an authorization for detail view", "text": "Given A valid account is displayed with 5 authorization rows, and the user types 'S' on row 3 and 'X' on row 4\nWhen The user presses Enter\nThen Row 3 wins because it is the first non-blank selection. Its stored authorization key (CDEMO-CPVS-AUTH-KEYS(3)) becomes the selected key. Control transfers (XCTL) to COPAUS1C with from-program COPAUS0C, from-tranid CPVS, context 0 and enter mode.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-025", "REQ-F-026", "REQ-F-027", "REQ-F-028"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:285-332", "plain": "A user can open one listed authorization in the detail program (COPAUS1C) by typing 'S' or 's' next to it. Only the first marked row among the five counts, and any other selection code is rejected.", "defect": ""}, {"key": "claude/RULE-064", "function": "claude/pendauth/02", "id": "RULE-064", "name": "Account lookup chain: card cross-reference, then account, then customer", "text": "Given The user enters account ID 00000000099, which has no card cross-reference\nWhen The account details are gathered\nThen The message reads 'Account:00000000099 not found in XREF file. Resp:... Reas:...'. When the cross-reference is found, its customer ID and card number are saved to the commarea, and the account (ACCTDAT) and customer (CUSTDAT) records are read using its account and customer IDs.", "program": "COPAUS0C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl:750-963", "plain": "To show an account, the system finds the card cross-reference by account ID through the alternate index. It then reads the account master and the customer master using the IDs from the cross-reference, 'ROOT SEGMENT ALREADY IN DB' and keeps going, leaving the existing record unchanged. Any other status abends with return code 16.", "program": "PAUDBLOD", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:222-265", "plain": "The reload job inserts each summary record from the root extract file into the authorization database. A summary that already exists is accepted as-is and is not an error. Any other insert failure stops the job.", "defect": "A read status other than 00, blank or 10 at lines 234-236 only displays 'ERROR READING ROOT SEG INFILE'. The end-of-file flag is never set, so the loop retries the read and can run forever or skip records without failing."}, {"key": "claude/RULE-067", "function": "claude/txntype/02", "id": "RULE-067", "name": "Updated description validation", "text": "Given Row 1 type '01' stored description 'Purchase', user marks 'U' and types 'Purchase-Online'\nWhen The user presses Enter\nThen Input error 'Transaction Desc can have numbers or alphabets only.' and the description field is shown red", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-021", "REQ-F-022", "REQ-F-023", "REQ-F-024", "REQ-F-025"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1237", "plain": "When a row is marked for update, the new description must differ from the stored one, must not be blank, and may contain only letters, digits and spaces.", "defect": "The 'no change detected' path sets a message but not INPUT-ERROR, so a subsequent F10 can still issue an UPDATE with an unchanged description."}, {"key": "claude/RULE-068", "function": "claude/txntype/02", "id": "RULE-068", "name": "Type code filter must be a 2-digit number", "text": "Given The s 55", "plain": "The EFT account ID is required and must be a 10-digit number that is not zero. Government-issued ID is not validated.", "defect": ""}, {"key": "claude/RULE-094", "function": "claude/account/02", "id": "RULE-094", "name": "Change detection before validation", "text": "Given The stored last name is 'Smith' and the user enters 'SMITH '\nWhen The user presses Enter\nThen No change is detected, because text fields are compared trimmed and ignoring case, and the message 'No change detected with respect to values fetched.' is shown", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1681-1775", "plain": "If nothing on the screen differs from the stored values, no edits run and the user is told no change was found.", "defect": ""}, {"key": "claude/RULE-095", "function": "claude/account/02", "id": "RULE-095", "name": "Account status and primary cardholder flag must be Y or N", "text": "Given The user changes Account Status to 'y' (lowercase)\nWhen The edits run\nThen It is rejected with 'Account Status must be Y or N.' Blank, low-values or '0' gives 'Account Status must be supplied.'", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019", "REQ-F-033", "REQ-F-039"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1856-1893", "plain": "Account Active Status and the Primary Card Holder indicator are required and must be exactly 'Y' or 'N'.", "defect": ""}, {"key": "claude/RULE-096", "function": "claude/account/02", "id": "RULE-096", "name": "US phone number validation", "text": "Given Phone 1 entered as area code 123, prefix 555, line 0100\nWhen The edits run\nThen It is rejected with 'Phone Number 1: Not valid North America general purpose area code' (lookup VALID-GENERAL-PURP-CODE)", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-034", "REQ-F-035", "REQ-F-036", "REQ-F-056"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:2225-2429", "plain": "Phone numbers are optional. If entered, the area code must be a valid North American general-purpose code, and the prefix (3 digits) and line number (4 digits) must be numeric and non-zero.", "defect": "The 'all blank' test at line 2238 checks the area code (NUMA) where it should check the line number (NUMC). If area code and prefix are blank but a line number is entered, the phone is treated as blank and valid, and the result is saved as '()-CCCC'."}, {"key": "claude/RULE-097", "function": "claude/account/02", "id": "RULE-097", "name": "US SSN validation", "text": "Given SSN entered as 666-12-3456\nWhen The edits run\nThen It is rejected with 'SSN: First 3 chars: should not be 000, 666, or between 900 and 999'", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-037", "REQ-F-038"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:2431-2491", "plain": "The SSN is entered in three parts that must be numeric and non-zero. The first part cannot be 000, 666 or 900-999.", "defect": ""}, {"key": "claude/RULE-098", "function": "claude/account/02", "id": "RULE-098", "name": "State and zip code consistency", "text": "Given State 'NY' and zip '90210'\nWhen The edits run\nThen It is rejected with 'Invalid zip code for state', and both state and zip are flagged", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-029", "REQ-F-030"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:2535-2560", "plain": "When both state and zip are individually valid, the first two digits of the zip must belong to that state.", "defect": ""}, {"key": "claude/RULE-099", "function": "claude/account/02", "id": "RULE-099", "name": "Account lookup chain: card cross-reference, then account, then customer", "text": "Given Account 00000012345 exists in the account master but has no row in the card cross-reference (CXACAIX)\nWhen The user fetches it\nThen The fetch fails with 'Account:... not found in Cross ref file' and the details are not shown. The customer ID used for the customer read comes from the cross-reference", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:3608-3644", "plain": "An account can be updated only if it has a card cross-reference record, an account master record and a linked customer master record.", "defect": ""}, {"key": "claude/RULE-100", "function": "claude/account/01", "id": "RULE-100", "name": "Account number search key must be a non-zero 11-digit number", "text": "Given The user is on the Account View screen (re-entry) and types an account id into the search field\nWhen Enter is pressed and the input is edited\nThen '*' or spaces are treated as not supplied -> error 'Account number not provided', field marked blank, CDEMO-ACCT-ID set to 0; non-numeric or 00000000000 -> error 'Account Filter must  be a non-zero 11 digit number', field flagged not-OK (shown in red), CDEMO-ACCT-ID set to 0; otherwise e.g. '00000000001' is accepted, copied to CDEMO-ACCT-ID and the lookup proceeds", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COACTVWC.cbl:622-681", "plain": "Before any lookup, the account number typed on the Account View screen must be present, all digits across its 11 positions, and not all zeros; otherwise the screen is redisplayed with an error and nothing is read.", "defect": "Two 88-level message constants for zero/non-numeric account (lines 125-128) are never used; the live literal at line 672 has different wording ('Account Filter must  be...' with a double space). Port the live wording, or agree a standard one."}, {"key": "claude/RULE-101", "function": "claude/account/01", "id": "RULE-101", "name": "Not-found handling in the lookup chain does not stop at the account master", "text": "Given Account 00000000099 exists in the card cross-reference but not in the account master\nWhen The lookup runs\nThen ACCTDAT returns NOTFND, so an input error is set with message 'Account:00000000099 not found in Acct Master file.Resp:... Reas:...'. The DID-NOT-FIND-ACCT-IN-ACCTDAT check never matches, so CUSTDAT is still read by the xref customer id. Because the first message is kept, the account-not-found message is the one displayed", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010", "REQ-F-012"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COACTVWC.cbl:701-715", "plain": "The code is written to stop when the account or customer master record is missing, but the flags it checks are never set, so a missing account still goes on to the customer read.", "defect": "Lines 704 and 713 test 88-levels whose SET statements are commented out (lines 792, 842), so the early exits are dead code."}, {"key": "claude/RULE-102", "function": "claude/transactions/01", "id": "RULE-102", "name": "Account ID is required and must exist on the account file", "text": "Given The bill pay screen with Account ID left blank\nWhen The user presses Enter\nThen Error 'Acct ID can NOT be empty...' is shown and the cursor is placed on the Account ID field; no lookup is performed", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-018"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COBIL00C.cbl:158-171", "plain": "A bill payment cannot proceed unless an account ID is entered and that account is found in the account master (and, for confirmed payments, in the card cross-reference).", "defect": ""}, {"key": "claude/RULE-103", "function": "claude/transactions/01", "id": "RULE-103", "name": "Payment rejected when there is nothing to pay", "text": "Given Account 00000000002 with current balance $0.00 (or -$25.00 credit)\nWhen The user enters the account ID (with or without confirmation) and presses Enter\nThen Message 'You have nothing to pay...' is shown, cursor on Account ID, and no transaction is written nor balance changed", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COBIL00C.cbl:197-206", "plain": "If the account's current balance is zero or negative (credit), no payment is allowed.", "defect": ""}, {"key": "claude/RULE-104", "function": "claude/card/01", "id": "RULE-104", "name": "Account ID filter validation", "text": "Given The user types '1234567890A' in the Account ID filter\nWhen The screen is submitted\nThen An input error is raised, the filter is flagged invalid (shown in red with the cursor on it), the selection column is protected, CDEMO-ACCT-ID is set to 0, and the message reads 'ACCOUNT FILTER,IF SUPPLIED MUST BE A 11 DIGIT NUMBER'", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:1003-1030", "plain": "The optional account filter must be an 11-digit number. Blank or all zeros means no filter. Anything non-numeric is rejected with an error, and row selection is locked.", "defect": ""}, {"key": "claude/RULE-105", "function": "claude/card/01", "id": "RULE-105", "name": "Card number filter validation", "text": "Given The user types '4111-1111-1111' in the Card Number filter and the account filter is valid\nWhen The screen is submitted\nThen An input error is raised, the card filter is flagged invalid (red, cursor on it), the selection rows are protected, CDEMO-CARD-NUM is set to 0, and the message reads 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER' (only if no earlier error message is already set)", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:1036-1071", "plain": "The optional card number filter must be a 16-digit number. Blank or all zeros means no filter. Non-numeric input is rejected, and row selection is locked.", "defect": ""}, {"key": "claude/RULE-106", "function": "claude/card/01", "id": "RULE-106", "name": "Row selection action codes: one record at a time, S or U only", "text": "Given The user enters 'S' on row 2 and 'U' on row 5, with valid filters\nWhen The screen is submitted\nThen An input error is raised with 'PLEASE SELECT ONLY ONE RECORD TO VIEW OR UPDATE', rows 2 and 5 are highlighted in red, and no navigation happens", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018", "REQ-F-019"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:1073-1121", "plain": "In the 7-row list the user can mark only one row, and only with 'S' (view detail) or 'U' (update). Any other code, or more than one marked row, is an error.", "defect": ""}, {"key": "claude/RULE-107", "function": "claude/card/03", "id": "RULE-107", "name": "No-change detection blocks a pointless update", "text": "Given Card fetched with name 'JOHN SMITH', expiry 2027-05, status 'Y'\nWhen The operator submits 'john smith', 2027, 05, 'Y'\nThen Message 'No change detected with respect to values fetched.' is shown, field edits are skipped and the state stays at 'show details' (no confirmation prompt).", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:667-693", "plain": "If the edited name, expiry and status are identical (case-insensitively) to the values originally fetched, the system reports that nothing changed and does not proceed to confirmation.", "defect": ""}, {"key": "claude/RULE-108", "function": "claude/card/03", "id": "RULE-108", "name": "Card number search key must be a non-zero 16-digit number", "text": "Given Details not yet fetched\nWhen Card number entered is blank, '*', all zeros, or contains non-digits (e.g. '4111-1111-1111')\nThen Input error; 'Card number not provided' for blank/zero or 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER' for non-numeric; field highlighted red. A valid value like '4111111111111111' becomes the session card number.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:762-800", "plain": "The operator must supply a 16-digit numeric, non-zero card number to locate the card to update.", "defect": ""}, {"key": "claude/RULE-109", "function": "claude/card/03", "id": "RULE-109", "name": "Embossed card name must be non-blank and contain only letters and spaces", "text": "Given Card details shown and changes submitted\nWhen Name is blank/'*'/zeros, or contains characters such as 'O'BRIEN' or 'JOHN 2'\nThen Blank: 'Card name not provided'; invalid characters: 'Card name can only contain alphabets and spaces'; field highlighted red (blank also shows '*'). 'Mary Ann Lee' passes.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:806-840", "plain": "The name embossed on the card is required and may contain only alphabetic characters A-Z/a-z and spaces.", "defect": ""}, {"key": "claude/RULE-110", "function": "claude/card/03", "id": "RULE-110", "name": "Card active status must be Y or N", "text": "Given Changes submitted\nWhen Status entered is blank, 'X' or 'y'\nThen Error 'Card Active Status must be Y or N' and field highlighted red; 'Y' or 'N' passes.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:845-873", "plain": "The card active status may only be set to 'Y' (active) or 'N' (inactive).", "defect": ""}, {"key": "claude/RULE-111", "function": "claude/card/03", "id": "RULE-111", "name": "Card expiry month must be 1 to 12", "text": "Given Changes submitted\nWhen Expiry month is blank, '00', '13' or non-numeric\nThen Error 'Card expiry month must be between 1 and 12' and field highlighted red; '05' passes.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-016"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:877-908", "plain": "The expiry month must be supplied and lie between 01 and 12.", "defect": ""}, {"key": "claude/RULE-112", "function": "claude/card/03", "id": "RULE-112", "name": "Card expiry year must be between 1950 and 2099", "text": "Given Changes submitted\nWhen Expiry year is blank, '0000', '1949' or '2100'\nThen Error 'Invalid card expiry year', field highlighted red; '2027' passes, and so does a past year like '1999'.", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:913-944", "plain": "The expiry year must be a 4-digit year from 1950 through 2099; it is not compared against today's date.", "defect": "Expired expiry dates are accepted; the year window is a fixed hardcoded range."}, {"key": "claude/RULE-113", "function": "claude/signon/02", "id": "RULE-113", "name": "Menu option number validation", "text": "Given The Main Menu has 11 options and the user types ' 3' in the option field\nWhen The user presses Enter\nThen Trailing blanks are trimmed, the value is right-aligned in two characters, and any remaining blanks become zeros, which gives 03. That is numeric and between 1 and 11, so it is accepted. Entering 0, 00, blank, 12 or 'AB' sets the error flag and shows 'Please enter a valid option number...'.", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:117-134", "plain": "The option the user types must be a whole number from 1 up to the number of options on that menu; anything else gets 'Please enter a valid option number...'.", "defect": ""}, {"key": "claude/RULE-114", "function": "claude/transactions/04", "id": "RULE-114", "name": "Custom report date range - all six date parts required", "text": "Given User selects Custom with start month 03, start day blank, start year 2024 and a full end date\nWhen Enter is pressed\nThen Error 'Start Date - Day can NOT be empty...' is shown, cursor placed on the start-day field, no job submitted", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CORPT00C.cbl:256-303", "plain": "For a Custom report, start month, start day, start year, end month, end day and end year must all be entered; the first missing one is reported and the request stops.", "defect": ""}, {"key": "claude/RULE-115", "function": "claude/transactions/04", "id": "RULE-115", "name": "Custom report date parts - numeric and range checks", "text": "Given User enters custom start month 13, day 05, year 2024\nWhen Enter is pressed\nThen Error 'Start Date - Not a valid Month...' is shown with cursor on start month; no job submitted", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CORPT00C.cbl:305-379", "plain": "Custom start and end dates are converted to numbers, and each month must be numeric and not above 12, each day numeric and not above 31, and each year numeric.", "defect": "No lower-bound check (00 month/day) here; relies on downstream calendar validation."}, {"key": "claude/RULE-116", "function": "claude/transactions/04", "id": "RULE-116", "name": "Custom report dates must be real calendar dates (unsupported-range tolerated)", "text": "Given User enters custom start date 2023-02-30\nWhen Enter is pressed\nThen Error 'Start Date - Not a valid date...' is shown, cursor on start month, no job submitted; same for end date with 'End Date - Not a valid date...'", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CORPT00C.cbl:388-426", "plain": "Each custom date is validated as a real calendar date in YYYY-MM-DD form via the shared date utility; it is rejected unless the utility reports success or the specific 'unsupported range' code 2513.", "defect": "Start date later than end date is not rejected; the job would run and produce an empty report. Accepting msg 2513 lets out-of-range years through."}, {"key": "claude/RULE-117", "function": "claude/signon/01", "id": "RULE-117", "name": "User ID and password are both required before sign-on is attempted", "text": "Given The sign-on screen is submitted with Enter\nWhen User ID is blank (spaces or low-values), or User ID is filled but Password is blank\nThen The error flag is set, the screen is redisplayed with 'Please enter User ID ...' (cursor on User ID) or 'Please enter Password ...' (cursor on Password), and the user security file is not read", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:117-140", "plain": "A sign-on attempt is rejected without looking up the user if the User ID or the Password is blank; the User ID is checked first.", "defect": ""}, {"key": "claude/RULE-118", "function": "claude/signon/01", "id": "RULE-118", "name": "Sign-on lookup failure outcomes", "text": "Given User ID 'GHOST01' with a non-blank password\nWhen The USRSEC read returns response 13 (NOTFND) or any other non-zero response\nThen NOTFND -> 'User not found. Try again ...'; other -> 'Unable to verify the User ...'; error flag set, cursor on User ID, no transfer", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:221-257", "plain": "If the user ID is not on the security file the user is told 'User not found'; any other file error yields 'Unable to verify the User'; in both cases the sign-on screen is redisplayed with the cursor on User ID.", "defect": "Distinguishing 'User not found' from 'Wrong Password' allows user ID enumeration; usually a single generic message is required by security policy."}, {"key": "claude/RULE-119", "function": "claude/transactions/02", "id": "RULE-119", "name": "Transaction row selection for detail view", "text": "Given A page of 10 transactions with 'S' typed in row 3's select field next to transaction ID 0000000000000123\nWhen The user presses Enter\nThen Selected transaction 0000000000000123 is stored in the session and control passes to COTRN01C with context 0. If the code had been 'X', the message 'Invalid selection. Valid value is S' would appear and the list would be redisplayed.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015", "REQ-F-016"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:148-204", "plain": "A user picks one transaction on the page by typing 'S' (or 's') next to it. The program then opens the transaction detail screen for that transaction ID. Any other selection code is rejected.", "defect": "Invalid selection does not set WS-ERR-FLG. Processing goes on to reload page 1, so a browse message (for example the end-of-file message) can replace the validation message."}, {"key": "claude/RULE-120", "function": "claude/transactions/02", "id": "RULE-120", "name": "Starting transaction ID filter must be numeric", "text": "Given The user enters '12AB' in the Tran ID filter field\nWhen Enter is pressed\nThen The error flag is set, 'Tran ID must be Numeric ...' is displayed, and no page is loaded. If '0000000000000500' were entered, the list would start at the first transaction with ID >= that value (browse at key, default GTEQ positioning), and the page number would reset to 1.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COTRN00C.cbl:206-229", "plain": "A user can type a transaction ID to start the list from. It must be numeric. If it is blank, the list starts at the first transaction in the file.", "defect": "After a non-numeric error the paragraph does not exit. PROCESS-PAGE-FORWARD still issues STARTBR using the old or stale TRAN-ID before the error flag stops further reads, and the browse is not ended (no ENDBR) on that path."}, {"key": "claude/RULE-121", "function": "claude/transactions/02", "id": "RULE-121", "name": "Paging boundary guards (top and bottom of
