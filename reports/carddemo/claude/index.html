IMS authorization summary using stale or empty keys and may send the screen several times in one transaction; the last message wins and leftover data from previous records may display."}, {"key": "claude/RULE-055", "function": "claude/auth/02", "id": "RULE-055", "name": "Authorization detail can only be shown for a numeric account and a selected authorization", "text": "Given Commarea with account id '00000012345' (numeric) and selected authorization key not blank\nWhen The detail screen is first entered or the user presses Enter (or any unsupported key)\nThen The pending authorization summary for the account is read, then the detail segment matching the selected key under that account; the details are displayed. If the account is not numeric or no key is selected (spaces or low-values), the error flag is set and the screen is shown with all detail fields blank.", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-025", "REQ-F-026", "REQ-F-027", "REQ-F-028", "REQ-F-029", "REQ-N-002"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:208-228", "plain": "The detail screen loads an authorization only when the account id passed from the summary screen is numeric and an authorization key has been selected; otherwise nothing is shown.", "defect": "When the validation fails, the error flag is set but no message is put on screen, so the user sees a blank detail screen with no explanation. Also when the detail is not found (EOF) the error flag is not set, so POPULATE-AUTH-DETAILS may display stale/uninitialised segment data."}, {"key": "claude/RULE-056", "function": "claude/auth/05", "id": "RULE-056", "name": "A detail record is attached to its summary by account ID and needs a numeric key", "text": "Given A child-file record with ROOT-SEG-KEY = 00000012345, where summary 00000012345 exists, and a second record with a non-numeric ROOT-SEG-KEY\nWhen PAUDBLOD processes the child file\nThen The first record is positioned with GU PAUTSUM0(ACCNTID EQ 00000012345) and inserted as a PAUTDTL1 child. The second record is skipped without any message.", "program": "PAUDBLOD", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBLOD.CBL:272-314", "plain": "Each reloaded detail record carries its parent account ID. The record is loaded only if that ID is numeric and a summary with that account ID can be found. Then the detail is inserted under that summary.", "defect": "In 3100-INSERT-CHILD-SEG, the IF at line 305 has no END-IF, so the error check at line 310 is nested inside the success branch. A failed GU (for example GE, meaning no matching summary) therefore does not abend, and the detail is lost with no message. Also, in 2000 and 3000, a read status other than '00' or '10' never sets the end-of-file flag, so a persistent read error could loop forever."}, {"key": "claude/RULE-057", "function": "claude/auth/05", "id": "RULE-057", "name": "Account id must be numeric for a summary and its details to be unloaded", "text": "Given Two summary segments: one with PA-ACCT-ID packed value 12345 and one with corrupted non-numeric packed data, each with 2 details\nWhen The unload batch reads each summary\nThen The first summary and its 2 details are written; the corrupted summary and its 2 details are not written, no error is raised, and the job continues to the next summary", "program": "PAUDBUNL", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/PAUDBUNL.CBL:223-238", "plain": "A pending-authorization summary is exported only if its account id is a valid number; otherwise the summary and all of its authorization details are silently skipped.", "defect": "Records with invalid account ids are dropped without any log or reject file, which can cause silent data loss if this unload feeds a reload. | Hierarchies with non-numeric account IDs are dropped from the backup with no message. The program also has no reconciliation counts: detail reads go into the summary-read counter and no totals are reported."}, {"key": "claude/RULE-058", "function": "claude/trantype/04", "id": "RULE-058", "name": "Batch maintenance action code dispatch (Add / Update / Delete / Comment)", "text": "Given An input file record laid out as action code (1 char), transaction type code (2 chars), description (50 chars), e.g. 'X01Purchase'\nWhen The batch job MNTTRDB2 runs COBTUPDT and processes the record\nThen Action 'X' is not one of A/U/D/*, so the message 'ERROR: TYPE NOT VALID' is displayed and the job return code is set to 4; the record is not applied. A record '*01Purchase' is skipped with 'IGNORING COMMENTED LINE'.", "program": "COBTUPDT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COBTUPDT.cbl:109-130", "plain": "Each line of the batch input file starts with a 1-character action code: 'A' adds a transaction type, 'U' updates its description, 'D' deletes it, '*' marks a comment line that is skipped, and any other code is rejected as an error.", "defect": "9999-ABEND (lines 230-233) does not terminate the program; it only displays the message and sets RETURN-CODE 4, so processing continues after a 'fatal' error and later successful records may mask the earlier failure in operational interpretation."}, {"key": "claude/RULE-059", "function": "claude/trantype/02", "id": "RULE-059", "name": "Updated description must be supplied, alphanumeric, and actually changed", "text": "Given Row 2 has stored description 'Payment'\nWhen The user marks it 'U' and enters 'payment', '' or 'Pay-ment'\nThen 'payment' gives 'No change detected with respect to database values.'. A blank value (or '*') gives 'Transaction Desc must be supplied.' and an input error. 'Pay-ment' gives 'Transaction Desc can have numbers or alphabets only.' and an input error. Invalid descriptions are shown in red", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1060-1094", "plain": "For a row marked 'U', the new description must differ from the database value, cannot be blank, and may contain only letters, digits and spaces (up to 50 characters).", "defect": "Because the comparison ignores case, users cannot correct only the capitalization of a description."}, {"key": "claude/RULE-060", "function": "claude/trantype/01", "id": "RULE-060", "name": "Type code filter must be a 2-digit number", "text": "Given The user enters 'A1' in the type filter\nWhen Enter is pressed\nThen The message 'TYPE CODE FILTER,IF SUPPLIED MUST BE A 2 DIGIT NUMBER' appears, the field is shown in red and row selection is locked. With '05' the list shows only type 05", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1096-1140", "plain": "The type-code search filter is optional. If it is entered, it must be a 2-digit number. A blank or '00' value means no filter.", "defect": ""}, {"key": "claude/RULE-061", "function": "claude/trantype/01", "id": "RULE-061", "name": "Filters must match at least one record", "text": "Given The type filter is '99' and no type 99 exists\nWhen Enter is pressed\nThen 'No Records found for these filter conditions' is shown, the offending filter is shown in red and row selection is locked", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:1239-1271", "plain": "When a type or description filter is supplied, the program counts the matching rows first. If there are none, it reports an error instead of showing an empty list.", "defect": ""}, {"key": "claude/RULE-062", "function": "claude/trantype/02", "id": "RULE-062", "name": "Only one row action (U or D) per submission", "text": "Given The 7-row screen has 'D' on row 1 and 'U' on row 4\nWhen The user presses Enter\nThen Both rows are highlighted in red and the message is 'Please select only 1 action'. A code such as 'X' gives 'Action code selected is invalid'", "program": "COTRTLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-011"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTLIC.cbl:982-1053", "plain": "Each row's select field may be blank, 'U' (update) or 'D' (delete). Any other code is rejected, and only one row can carry an action at a time.", "defect": "WS-ACTIONS-REQUESTED is derived from the TALLYING count of spaces and low-values in the 7-byte flag field. WS-NO-ACTIONS-SELECTED is not reset before the INSPECT on every path, but it is zeroed at line 984, so the count is probably correct. No defect confirmed."}, {"key": "claude/RULE-063", "function": "claude/trantype/03", "id": "RULE-063", "name": "Change detection ignores letter case and leading/trailing spaces", "text": "Given Stored type '01' with description 'Purchase'\nWhen The operator re-submits description 'PURCHASE' or '  Purchase  '\nThen The message 'No change detected with respect to values fetched.' is shown, the record stays in show-details state and no save is offered; submitting 'Purchases' marks a change and triggers description validation", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:783-812", "plain": "An edit is only treated as a change if the type code or the trimmed description differs from the stored value ignoring upper/lower case; otherwise the operator is told no change was detected and nothing is saved.", "defect": "Case-only description corrections are impossible because they are classified as 'no change'."}, {"key": "claude/RULE-064", "function": "claude/trantype/03", "id": "RULE-064", "name": "Transaction type description is required and may contain only letters, digits and spaces", "text": "Given A transaction type record is displayed (or a new one is being created) and the operator has changed the description\nWhen The operator presses Enter to validate the changes\nThen Blank description -> 'Transaction Desc must be supplied.' and state 'changes not OK' (E); description 'Cash-back' -> 'Transaction Desc can have numbers or alphabets only.' and state E; description 'Cash back 2' -> valid, state becomes 'changes OK, not confirmed' (N) with prompt 'Changes validated.Press F5 to save'", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:849-902", "plain": "When a description is being changed or entered for a new type, it must be supplied (up to 50 characters) and may contain only A-Z, a-z, 0-9 and spaces.", "defect": ""}, {"key": "claude/RULE-065", "function": "claude/trantype/03", "id": "RULE-065", "name": "Transaction type code must be a non-zero 2-digit number, stored zero-padded", "text": "Given The operator is on the Transaction Type Update screen with no record shown yet\nWhen The operator types a code into the Transaction Type field and presses Enter\nThen Blank (spaces, low-values or '*') -> 'Tran Type code must be supplied.' and the screen stays in search mode; non-numeric (e.g. 'AB') -> 'Tran Type code must be numeric.' and the state becomes invalid-search-key; '00' -> 'Tran Type code must not be zero.'; valid '5' -> normalised to '05' (NUMVAL into PIC 99, spaces replaced by zeros) and used as the lookup key", "program": "COTRTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/app-transaction-type-db2/cbl/COTRTUPC.cbl:907-973", "plain": "The transaction type code an operator enters to find or create a record is required, must be numeric, must not be zero, and is stored as a 2-digit code with leading zero (e.g. '5' becomes '05').", "defect": "TEST-NUMVAL accepts signs and decimals; a negative or fractional value would pass the numeric check and be silently converted (sign dropped, fraction truncated) rather than rejected."}, {"key": "claude/RULE-066", "function": "claude/vsammq/01", "id": "RULE-066", "name": "Account inquiry request eligibility (function code and account key)", "text": "Given An MQ request message whose layout is function code (positions 1-4) followed by an 11-digit numeric account key (positions 5-15)\nWhen The message is read from the input queue, e.g. function 'INQB' with key 00000000123, or function 'INQA' with key 00000000000\nThen No account file read happens. A reply is put to the reply queue with the text 'INVALID REQUEST PARAMETERS ACCT ID : 00000000123FUNCTION : INQB' (fields concatenated with no separator). Only 'INQA' with key > 0 continues to the account lookup.", "program": "COACCT01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/app-vsam-mq/cbl/COACCT01.cbl:390-457", "plain": "A request message is processed as an account inquiry only when its 4-character function code is exactly 'INQA' and its 11-digit account ID is greater than zero; otherwise the caller gets an 'invalid request parameters' reply echoing the account ID and function code.", "defect": ""}, {"key": "claude/RULE-067", "function": "claude/util/03", "id": "RULE-067", "name": "Output write status acceptance", "text": "Given A write to OUTFILE, ARRYFILE or VBRCFILE\nWhen The file status is '00' or '10'\nThen Processing continues. Any other status displays the status and abends with code 999.", "program": "CBACT01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBACT01C.cbl:242-251", "plain": "After every write to an output file, status '00' or '10' is accepted and any other status abends the run.", "defect": ""}, {"key": "claude/RULE-068", "function": "claude/util/04", "id": "RULE-068", "name": "Open and close must succeed or the job abends", "text": "Given CARDFILE is missing or locked, so OPEN INPUT returns status '35' (or another non-'00' status)\nWhen The job starts and runs the open step\nThen It prints 'ERROR OPENING CARDFILE' and 'FILE STATUS IS: NNNN0035', then abends with code 999. A non-'00' status on CLOSE likewise prints 'ERROR CLOSING ...' and abends with code 999", "program": "CBACT02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBACT02C.cbl:118-152", "plain": "The job ends abnormally with code 999 if the master file cannot be opened or closed cleanly (status other than '00'). It never skips the file or finishes with a partial success.", "defect": ""}, {"key": "claude/RULE-069", "function": "claude/util/04", "id": "RULE-069", "name": "Read outcome classification: success, end of file, or fatal error", "text": "Given CBACT02C is reading CARDFILE one record at a time\nWhen A read returns file status '00', '10', or something else (for example '23' or '9x')\nThen '00' sets the result to 0 and the record is processed. '10' sets the result to 16 and ends the loop normally. Any other status sets the result to 12, prints 'ERROR READING CARDFILE' and the 4-digit file status, then abends with code 999 through CEE3ABD (timing 0)", "program": "CBACT02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBACT02C.cbl:92-116", "plain": "After each read, file status '00' means the record is good, '10' means the end of the file was reached normally, and any other status stops the job with abend code 999.", "defect": ""}, {"key": "claude/RULE-070", "function": "claude/posting/03", "id": "RULE-070", "name": "Zero-rate categories accrue no interest", "text": "Given A category balance of $500.00 whose resolved disclosure-group rate is 0.00\nWhen The batch evaluates that category balance\nThen No interest is calculated, no interest transaction is written, and nothing is added to the account's interest total", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBACT04C.cbl:210-217", "plain": "A category balance only accrues interest, and only gets an interest transaction, when its disclosure-group rate is not zero.", "defect": "A zero balance with a non-zero rate still generates a $0.00 interest transaction record."}, {"key": "claude/RULE-071", "function": "claude/posting/03", "id": "RULE-071", "name": "Account and card cross-reference must exist for every category balance", "text": "Given A category-balance record for account 00000000099, which is not on the account master file\nWhen The batch reaches that account\nThen 'ACCOUNT NOT FOUND' is displayed and the program abends with code 999. Interest already posted to earlier accounts stays rewritten.", "program": "CBACT04C", "disposition": "captured", "reason": "", "requirements": ["REQ-N-003"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBACT04C.cbl:372-413", "plain": "Each account that appears in the category-balance file must exist on the account master and have a card cross-reference. Otherwise the whole interest batch stops with an abend.", "defect": ""}, {"key": "claude/RULE-072", "function": "claude/util/01", "id": "RULE-072", "name": "Fail-fast abend on any file open, read or write error", "text": "Given The account file read returns status '23', or a write to the export file fails (for example a duplicate key)\nWhen The export is running\nThen An error with the file status is displayed and CEE3ABD is called. Nothing is retried and the failing record is not skipped. Records already written stay in the partial export file", "program": "CBEXPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015", "REQ-F-016"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBEXPORT.cbl:198-240", "plain": "If any input or output file cannot be opened, or any read or write returns a status other than success (or end-of-file on a read), the export stops at once with an abend. No records are skipped.", "defect": ""}, {"key": "claude/RULE-073", "function": "claude/util/02", "id": "RULE-073", "name": "Imported records are copied verbatim with no business validation", "text": "Given An 'A' export record with ACCT-ACTIVE-STATUS = 'Q', ACCT-CURR-BAL = 9,999.00 and ACCT-CREDIT-LIMIT = 500.00\nWhen The record is imported\nThen The account record is written exactly as received (status 'Q', balance over limit) and counted as imported; no rejection or error record is produced", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CBIMPORT.cbl:288-422", "plain": "Customer, account, cross-reference, transaction and card data are moved field-for-field from the export into the target files without any check on values such as IDs, SSN, FICO score, balances, credit limits, dates, status flags or card numbers.", "defect": ""}, {"key": "claude/RULE-074", "function": "claude/util/02", "id": "RULE-074", "name": "Reject unknown record types to the import error file", "text": "Given An export record with EXPORT-REC-TYPE = 'Q' and EXPORT-SEQUENCE-NUM = 1234\nWhen The record is processed\nThen No target file is written; an error record '<current-date 21 chars>|Q|0001234|Unknown record type encountered' is written to ERROUT (132 bytes), WS-UNKNOWN-RECORD-TYPE-COUNT +1, WS-ERROR-RECORDS-WRITTEN +1, and processing continues with the next record", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBIMPORT.cbl:425-446", "plain": "A record whose type code is not C, A, X, T or D is not imported; instead an error line (timestamp / record type / sequence number / 'Unknown record type encountered') is written to the error file and both the unknown-type and error counters go up, and the run continues.", "defect": "Error counter is incremented even when the error-record write fails, and sequence numbers over 7 digits are silently truncated in the error report."}, {"key": "claude/RULE-075", "function": "claude/util/02", "id": "RULE-075", "name": "Post-import validation and checksum step is a no-op", "text": "Given An import run in which the export file was truncated or corrupted (e.g. accounts without matching cards)\nWhen Step 3000-VALIDATE-IMPORT runs after all records are processed\nThen It always reports 'No validation errors detected'; no checksum, record-count reconciliation or cross-file integrity check is performed", "program": "CBIMPORT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBIMPORT.cbl:449-452", "plain": "The program header promises checksum-based integrity validation, but the validation step only prints 'Import validation completed' and 'No validation errors detected' without checking anything.", "defect": "Documented checksum validation is not implemented; the hardcoded 'No validation errors detected' message is misleading to operators."}, {"key": "claude/RULE-076", "function": "claude/stmt/01", "id": "RULE-076", "name": "Customer and account master records must exist for every card or the run aborts", "text": "Given A cross-reference record pointing to customer 000000999 that does not exist in the customer file\nWhen That card's statement is being built\nThen 'ERROR READING CUSTFILE' and the return code are displayed and the program abends through CEE3ABD; no further statements are produced", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-026", "REQ-F-027", "REQ-F-028"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBSTM03A.CBL:368-414", "plain": "For each card, the owning customer (by XREF-CUST-ID) and account (by XREF-ACCT-ID) must be found by key; if either lookup returns anything other than success, the whole statement run abends.", "defect": ""}, {"key": "claude/RULE-077", "function": "claude/stmt/01", "id": "RULE-077", "name": "File open/read/close outcome acceptance policy", "text": "Given A transaction extract file that is empty\nWhen The run opens the transaction file and does its priming read\nThen The read returns '10', which is not '00' or '04', so 'ERROR READING TRNXFILE' is displayed and the program abends, and no statements are produced", "program": "CBSTM03A", "disposition": "captured", "reason": "", "requirements": ["REQ-F-029", "REQ-F-030", "REQ-F-031", "REQ-F-032"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBSTM03A.CBL:730-762", "plain": "Opens and closes are accepted on return code 00 or 04, sequential reads on 00 (with 10 meaning end of file), and any other code abends the run. The first read of the transaction file also accepts 04, but an empty transaction file (10) abends.", "defect": "An empty transaction file causes an abend rather than statements with zero activity."}, {"key": "claude/RULE-078", "function": "claude/stmt/02", "id": "RULE-078", "name": "Keyed customer/account lookup uses caller-supplied key length", "text": "Given A keyed-read request (K) for CUSTFILE with key '000000001' and key length 9, or for ACCTFILE with key '00000000001' and key length 11\nWhen The routine runs the lookup\nThen Key(1:length) is moved into the customer id (X(9)) or account id (9(11)) and the record is read randomly. A found record returns status '00' and the data. A missing key returns status '23' (record not found) in LK-M03B-RC.", "program": "CBSTM03B", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CBSTM03B.CBL:188-218", "plain": "Customer and account records are found using the first N characters of the key the caller passes, where N is the key length the caller also passes; no other check is made on the key before the read.", "defect": "The key length is not range-checked before Key(1:length) is used."}, {"key": "claude/RULE-079", "function": "claude/posting/02", "id": "RULE-079", "name": "Daily transaction card must exist in the card-to-account cross-reference", "text": "Given A daily transaction record with ID 'T000000000000001' and card number '4111111111111111'\nWhen The batch looks up the card number in the cross-reference (XREF) file by exact key\nThen If the card is found, the linked account ID (and customer ID) are taken from the cross-reference and the account lookup runs. If the card is not found (INVALID KEY), the internal read status is set to 4, the message 'CARD NUMBER 4111111111111111 COULD NOT BE VERIFIED. SKIPPING TRANSACTION ID-T000000000000001' is written, and no account lookup is done for that transaction.", "program": "CBTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CBTRN01C.cbl:170-184", "plain": "Each daily transaction is accepted for further processing only if its card number is found in the card cross-reference file. If it is not found, the transaction is logged as unverifiable and skipped.", "defect": ""}, {"key": "claude/RULE-080", "function": "claude/posting/02", "id": "RULE-080", "name": "Account linked to a verified card must exist on the account master", "text": "Given A verified card whose cross-reference points to account ID 00000000001\nWhen The batch reads the account master by that account ID\nThen If the account exists, 'SUCCESSFUL READ OF ACCOUNT FILE' is logged. If it does not exist (INVALID KEY), the read status is set to 4 and 'ACCOUNT 00000000001 NOT FOUND' is logged.", "program": "CBTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBTRN01C.cbl:173-179", "plain": "After a card is verified, the account it points to must exist in the account master file. If it does not, the batch writes 'ACCOUNT <id> NOT FOUND' to the log.", "defect": "The program header (line 5) says 'Post the records from daily transaction file', but the executable code only checks the card and the account. The transaction master (TRANFILE) is opened INPUT only and is never written. The customer and card files are opened but never read. Account balances are never updated. The rewrite should not assume this program does any posting."}, {"key": "claude/RULE-081", "function": "claude/posting/01", "id": "RULE-081", "name": "Card number must exist in the card cross-reference", "text": "Given A daily transaction for card number 4111000011112222 that is not present in the XREF file\nWhen The nightly posting batch validates the transaction\nThen The transaction is rejected with reason code 0100 'INVALID CARD NUMBER FOUND', the account lookup is skipped, and nothing is posted", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBTRN02C.cbl:370-392", "plain": "Each daily transaction is accepted only if its card number is found in the card-to-account cross-reference; otherwise it is rejected with reason 100 and no further checks run.", "defect": ""}, {"key": "claude/RULE-082", "function": "claude/posting/01", "id": "RULE-082", "name": "Linked account must exist", "text": "Given Card 4111000011112222 maps to account 00000000099 and account 00000000099 is not on the account master\nWhen The posting batch validates the transaction\nThen The transaction is rejected with reason code 0101 'ACCOUNT RECORD NOT FOUND'; the credit-limit and expiration checks are not evaluated", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBTRN02C.cbl:393-399", "plain": "After the card resolves to an account ID, that account must exist in the account master or the transaction is rejected with reason 101.", "defect": ""}, {"key": "claude/RULE-083", "function": "claude/posting/01", "id": "RULE-083", "name": "Reject transactions dated after account expiration", "text": "Given An account with expiration date 2025-06-30 and a transaction with origination timestamp 2025-07-01-10.15.00.000000\nWhen The posting batch validates the transaction\nThen '2025-06-30' >= '2025-07-01' is false, so the transaction is rejected with reason 0103 'TRANSACTION RECEIVED AFTER ACCT EXPIRATION'; a transaction originated on 2025-06-30 itself is accepted", "program": "CBTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBTRN02C.cbl:414-420", "plain": "A transaction whose origination date is later than the account's expiration date is rejected with reason 103.", "defect": "When both over-limit and expired conditions fail, the 102 reason is overwritten by 103, so reject reporting under-counts over-limit failures."}, {"key": "claude/RULE-084", "function": "claude/report/02", "id": "RULE-084", "name": "Report period filter on transaction processing date", "text": "Given Date parameters start 2022-01-01 and end 2022-07-06 (record layout: start date chars 1-10, one filler char, end date chars 12-21)\nWhen A transaction with processing timestamp 2022-03-15-10.22.33.000000 is read\nThen It is in range (2022-03-15 >= 2022-01-01 and <= 2022-07-06, compared as text) and is printed; a transaction dated 2022-07-07 is out of range", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-N-001", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CBTRN03C.cbl:168-178", "plain": "Only transactions whose processing date (first 10 characters of the processing timestamp, YYYY-MM-DD) falls inclusively between the start and end dates supplied in the date-parameter file belong on the transaction detail report.", "defect": "NEXT SENTENCE at line 177 does not skip the record; it jumps to after END-PERFORM (line 206), ending processing on the first out-of-range transaction without writing the final page/account/grand totals. Masked in practice because the JCL pre-filters by date."}, {"key": "claude/RULE-085", "function": "claude/report/02", "id": "RULE-085", "name": "Mandatory reference data for every reported transaction", "text": "Given A transaction with card number 4111111111119999 not in the card cross-reference file\nWhen The report reaches that transaction\nThen The job displays 'INVALID CARD NUMBER', status 23, and abends with code 999; no partial report is completed", "program": "CBTRN03C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CBTRN03C.cbl:484-512", "plain": "Every reported transaction must have a valid card cross-reference (to obtain its account ID), a known transaction type, and a known type+category combination; if any is missing the whole report job abends.", "defect": ""}, {"key": "claude/RULE-086", "function": "claude/account/02", "id": "RULE-086", "name": "Account and customer date validation (open, expiry, reissue, birth)", "text": "Given An account in edit\nWhen The operator enters open date 2023-02-29, expiry 2100-01-01, or reissue 2024-04-31\nThen 2023-02-29 -> 'Not a leap year.Cannot have 29 days in this month.'; 2100 -> 'Century is not valid.'; 04-31 -> 'Cannot have 31 days in this month.'; 2024-02-29 is accepted. Valid dates are finally checked with the CSUTLDTC date service", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-F-015", "REQ-F-016", "REQ-F-028"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1478-1543", "plain": "Open date, expiry date, reissue date and date of birth must each be complete real calendar dates (YYYY, MM, DD) in the 1900s or 2000s, with correct month lengths and leap years.", "defect": ""}, {"key": "claude/RULE-087", "function": "claude/account/02", "id": "RULE-087", "name": "Date of birth cannot be today or in the future", "text": "Given Today is 2026-11-23\nWhen The operator enters DOB 2026-11-23 or 2027-01-01\nThen Rejected with 'Date of Birth:cannot be in the future '; DOB 1980-05-14 is accepted", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-028", "REQ-F-029"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1533-1543", "plain": "A customer's date of birth, once it is a valid date, must be strictly earlier than today's date.", "defect": ""}, {"key": "claude/RULE-088", "function": "claude/account/02", "id": "RULE-088", "name": "FICO credit score range", "text": "Given A customer in edit\nWhen The operator enters FICO 299, 851, or blank\nThen 299 or 851 -> 'FICO Score: should be between 300 and 850'; blank -> 'FICO Score must be supplied.'; 300 and 850 are accepted", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-030", "REQ-F-031"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1545-1556", "plain": "The customer's FICO score is required, must be a 3-digit number, and must be between 300 and 850 inclusive.", "defect": ""}, {"key": "claude/RULE-089", "function": "claude/account/02", "id": "RULE-089", "name": "Customer name, address and EFT field rules", "text": "Given A customer in edit\nWhen The operator enters last name \"O'Brien\", city 'St. Louis', or a blank first name\nThen \"O'Brien\" -> 'Last Name can have alphabets only.'; 'St. Louis' -> 'City can have alphabets only.'; blank -> 'First Name must be supplied.'; EFT '0000000000' -> 'EFT Account Id must not be zero.'", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1560-1662", "plain": "First name, last name, city and country are required and may contain only letters and spaces. Middle name is optional, letters only. Address line 1 is required with any characters. Address line 2 and government ID are not validated. ZIP (first 5 chars) and EFT account ID (10 chars) must be numeric and not zero.", "defect": ""}, {"key": "claude/RULE-090", "function": "claude/account/02", "id": "RULE-090", "name": "Change detection between fetched and entered values", "text": "Given Account fetched with last name 'SMITH' and status 'Y'\nWhen The operator changes the last name to 'smith' and status to 'y' and presses Enter\nThen No change is detected, the message 'No change detected with respect to values fetched.' is shown, and nothing is validated or saved. Changing the last name to 'SMYTH' counts as a change and triggers full validation", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-033", "REQ-F-034", "REQ-F-035"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1681-1775", "plain": "Field edits run only if at least one account or customer value differs from what was fetched. Text comparisons ignore case and surrounding spaces, so a change that only alters case does not count.", "defect": ""}, {"key": "claude/RULE-091", "function": "claude/account/01", "id": "RULE-091", "name": "Account number search key validation", "text": "Given The update screen is shown with no account fetched yet\nWhen The operator presses Enter with account number '00000000000', 'ABC', or blank/'*'\nThen Blank -> 'Account number not provided' and search flagged blank; non-numeric or zero -> 'Account Number if supplied must be a 11 digit Non-Zero Number'; CDEMO-ACCT-ID reset to zeros; nothing is read. A value like '00000012345' is accepted and stored as the context account ID", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1783-1818", "plain": "Before an account can be fetched for update, the operator must enter an account number that is numeric and not all zeros.", "defect": ""}, {"key": "claude/RULE-092", "function": "claude/account/02", "id": "RULE-092", "name": "Yes/No flags: account active status and primary cardholder", "text": "Given An account in edit\nWhen The operator enters status 'X', blank, or '0'\nThen Blank, low-values or '0' -> 'Account Status must be supplied.'; 'X' -> 'Account Status must be Y or N.'; 'Y' or 'N' passes", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-032"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:1856-1893", "plain": "Account active status and the primary-cardholder indicator are both required and must be exactly 'Y' or 'N'.", "defect": ""}, {"key": "claude/RULE-093", "function": "claude/account/02", "id": "RULE-093", "name": "North American phone number validation", "text": "Given A customer in edit\nWhen The operator enters phone 1 as (999) 555-1234 or (212) 000-1234\nThen 999 -> 'Phone Number 1: Not valid North America general purpose area code'; prefix 000 -> 'Prefix code cannot be zero'; (212) 555-1234 is accepted; all parts blank is accepted", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-024", "REQ-F-025", "REQ-F-049"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:2225-2429", "plain": "Phone numbers 1 and 2 are optional. If one is entered, the area code (3 digits), prefix (3 digits) and line number (4 digits) must each be numeric and non-zero, and the area code must be a valid North American general-purpose area code.", "defect": "The blank-phone test at line 2238 checks WS-EDIT-US-PHONE-NUMA a second time where it should check NUMC. If the area code and prefix are blank but a line number is entered, the phone is treated as not supplied and passes validation, so a partial number like '()   -1234' can be saved."}, {"key": "claude/RULE-094", "function": "claude/account/02", "id": "RULE-094", "name": "US Social Security Number validation", "text": "Given A customer in edit\nWhen The operator enters SSN 666-12-3456, 123-00-4567, or 12A-45-6789\nThen 666 -> 'SSN: First 3 chars: should not be 000, 666, or between 900 and 999'; 00 -> 'SSN 4th & 5th chars must not be zero.'; 12A -> 'must be all numeric.'; 123-45-6789 is accepted", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-026", "REQ-F-027"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:2431-2491", "plain": "The SSN is entered in three parts (3-2-4 digits). Each part must be numeric and not zero, and the first part cannot be 000, 666, or 900-999.", "defect": ""}, {"key": "claude/RULE-095", "function": "claude/account/02", "id": "RULE-095", "name": "US state code and state/ZIP consistency", "text": "Given A customer in edit\nWhen The operator enters state 'NY' with ZIP '90210', or state 'XX'\nThen NY/90210 -> 'Invalid zip code for state' with both fields flagged; 'XX' -> 'State: is not a valid state code'; NY/10001 is accepted", "program": "COACTUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022", "REQ-F-023"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTUPC.cbl:2493-2560", "plain": "The state must be a valid US state or territory code, and the first two digits of the ZIP must match a known prefix for that state.", "defect": ""}, {"key": "claude/RULE-096", "function": "claude/account/01", "id": "RULE-096", "name": "Account ID search key must be a non-zero 11-digit number", "text": "Given The user is on the Account View screen (re-entry)\nWhen They submit account ID '00000000000', 'ABC12345678', blank, or '*'\nThen The request is rejected as an input error, the account field is highlighted red with the cursor on it, CDEMO-ACCT-ID is set to 0 and no file is read; blank/'*' shows 'Account number not provided' (and '*' re-displayed in red), non-numeric or zero shows 'Account Filter must  be a non-zero 11 digit number'. A valid value such as '00000012345' is accepted and copied to CDEMO-ACCT-ID.\nAnd Only the first error message raised in a request is kept (later errors do not overwrite WS-RETURN-MSG once set).", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTVWC.cbl:649-681", "plain": "An account can only be looked up when the user enters an account number made of exactly 11 digits that is not all zeros; blank or '*' counts as not entered.", "defect": "Line 641 unconditionally SETs NO-SEARCH-CRITERIA-RECEIVED, overwriting the 'Account number not provided' message set at line 658, so the prompt message is never actually shown. Also the edit message text at line 672 differs from the 88-level constants SEARCHED-ACCT-ZEROES / SEARCHED-ACCT-NOT-NUMERIC (lines 125-128), which are never used."}, {"key": "claude/RULE-097", "function": "claude/account/01", "id": "RULE-097", "name": "Account view lookup chain: card cross-reference, then account master, then customer master", "text": "Given A valid account ID 00000012345 has been entered\nWhen The account view lookup runs\nThen CXACAIX is read by account ID; if found, the xref customer ID and card number are stored in the session (CDEMO-CUST-ID, CDEMO-CARD-NUM); ACCTDAT is read by account ID; CUSTDAT is read by the xref customer ID; found flags drive what is displayed. If the account is not in the cross-reference, the lookup stops with 'Account:<id> not found in Cross ref file. Resp:.. Reas:..'.\nAnd Not-found in account master yields 'Account:<id> not found in Acct Master file.Resp:..'; not-found in customer master yields 'CustId:<id> not found in customer master.Resp: ..'; any other file response produces 'File Error: READ on <file> returned RESP .. ,RESP2 ..'. All set input-error.", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012", "REQ-F-013", "REQ-F-014", "REQ-F-015"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COACTVWC.cbl:687-722", "plain": "To show an account, the system first finds the account in the card cross-reference (by account ID alternate index) to obtain the customer ID and card number, then reads the account master record, then reads the owning customer's master record.", "defect": "The guards at lines 704 and 713 test DID-NOT-FIND-ACCT-IN-ACCTDAT / DID-NOT-FIND-CUST-IN-CUSTDAT, but the SETs that would raise them are commented out (lines 792, 842) and WS-RETURN-MSG holds a different built string, so the guards never fire: when the account is missing from ACCTDAT the customer read still proceeds. Combined with line 471-472, if the customer is found but the account is not, account fields are displayed from an uninitialized/stale ACCOUNT-RECORD."}, {"key": "claude/RULE-098", "function": "claude/txn/01", "id": "RULE-098", "name": "Account ID is required and must exist", "text": "Given The account ID field is blank, or holds 99999999999 and that account does not exist\nWhen The user presses Enter\nThen A blank ID gives 'Acct ID can NOT be empty...'. An unknown ID gives 'Account ID NOT found...'. Other read failures give 'Unable to lookup Account...' or 'Unable to lookup XREF AIX file...'. No payment is made.", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COBIL00C.cbl:158-191", "plain": "The user must enter an account ID. A blank ID is rejected, and an ID that is not found in the account master or the card cross-reference is rejected with 'Account ID NOT found...'.", "defect": ""}, {"key": "claude/RULE-099", "function": "claude/txn/01", "id": "RULE-099", "name": "Account must have a positive balance to be paid", "text": "Given Account 00000000022 has a current balance of $0.00 (or -$15.00)\nWhen The user enters the account ID, with or without confirming\nThen No transaction is created, the balance is unchanged, and the message 'You have nothing to pay...' is shown", "program": "COBIL00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COBIL00C.cbl:197-206", "plain": "If the account's current balance is zero or negative (a credit), the payment is refused with the message 'You have nothing to pay...'.", "defect": ""}, {"key": "claude/RULE-100", "function": "claude/card/01", "id": "RULE-100", "name": "Account filter must be numeric", "text": "Given The user is on the card list screen\nWhen They enter account filter '1234ABC'\nThen An input error is raised with message 'ACCOUNT FILTER,IF SUPPLIED MUST BE A 11 DIGIT NUMBER', the session account is set to 0, the field is shown in red with the cursor on it, and all selection fields are protected. A value of '00000000010' is accepted and stored as the session account.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:1003-1030", "plain": "If the user enters an account filter it must be all digits; otherwise the screen shows an error, the account field turns red, and row selection is disabled.", "defect": ""}, {"key": "claude/RULE-101", "function": "claude/card/01", "id": "RULE-101", "name": "Card number filter must be numeric", "text": "Given The user is on the card list screen with a valid or blank account filter\nWhen They enter card filter '4111-0000'\nThen An input error is raised with message 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER' (only if no account error message is already set), session card number is set to 0, the field is red, and selection rows are protected.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:1036-1071", "plain": "If the user enters a card number filter it must be all digits; otherwise the screen shows an error, the card field turns red, and row selection is disabled.", "defect": ""}, {"key": "claude/RULE-102", "function": "claude/card/01", "id": "RULE-102", "name": "Row selection: only S or U, and at most one row", "text": "Given A list page showing 7 cards and valid filters\nWhen The user types 'S' on row 2 and 'U' on row 5\nThen Input error 'PLEASE SELECT ONLY ONE RECORD TO VIEW OR UPDATE'; rows 2 and 5 are highlighted red; no navigation occurs. Typing 'X' on any row gives 'INVALID ACTION CODE' and that row is flagged red.", "program": "COCRDLIC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020", "REQ-F-021", "REQ-F-022"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDLIC.cbl:1073-1121", "plain": "On the list, the user may mark one row with 'S' (view) or 'U' (update); any other code or more than one marked row is rejected.", "defect": ""}, {"key": "claude/RULE-103", "function": "claude/card/02", "id": "RULE-103", "name": "Account number search criterion must be a non-zero 11-digit number", "text": "Given A user re-enters the card detail screen\nWhen The account field is blank, '*', spaces, or 00000000000; or contains a non-digit such as '1234567890A'\nThen Blank/zero: input error, account flagged blank, message 'Account number not provided', saved account reset to 0. Non-numeric: input error, account flagged invalid (red), message 'ACCOUNT FILTER,IF SUPPLIED MUST BE A 11 DIGIT NUMBER', saved account reset to 0. Valid (e.g. 00000000001): account saved into the shared context", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-007", "REQ-F-018"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDSLC.cbl:647-679", "plain": "The account number is required and must be all digits (11 positions) and not all zeros, or the search is rejected.", "defect": ""}, {"key": "claude/RULE-104", "function": "claude/card/02", "id": "RULE-104", "name": "Card number search criterion must be a non-zero 16-digit number", "text": "Given A user re-enters the card detail screen with a valid account number\nWhen The card field is blank, '*', spaces or all zeros; or contains a non-digit such as '41111111111X1111'\nThen Blank/zero: input error, card flagged blank, message 'Card number not provided' (if no earlier message), saved card number reset to 0. Non-numeric: input error, card flagged invalid (red), message 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER'. Valid: card number saved into the shared context", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-018"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDSLC.cbl:685-720", "plain": "The card number is required and must be 16 digits and not all zeros, or the search is rejected.", "defect": "Error messages say the filter is optional ('IF SUPPLIED') while the code makes both account and card mandatory."}, {"key": "claude/RULE-105", "function": "claude/card/03", "id": "RULE-105", "name": "Embossed card name must be letters and spaces only", "text": "Given Card details are shown and the user changes the name\nWhen The name is 'JOHN O'BRIEN' or 'JOHN SMITH 2' or blank\nThen Input error: apostrophe/digits -> 'Card name can only contain alphabets and spaces'; blank/'*'/zeros -> 'Card name not provided'; 'John Smith' passes", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:806-843", "plain": "The name embossed on the card is required and may contain only A-Z, a-z and spaces.", "defect": ""}, {"key": "claude/RULE-106", "function": "claude/card/03", "id": "RULE-106", "name": "Card active status must be Y or N", "text": "Given Card details are shown\nWhen The user enters status 'y', 'X', or leaves it blank\nThen Input error 'Card Active Status must be Y or N'; only uppercase 'Y' or 'N' pass", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:845-876", "plain": "The card active status is required and must be exactly 'Y' (active) or 'N' (inactive).", "defect": ""}, {"key": "claude/RULE-107", "function": "claude/card/03", "id": "RULE-107", "name": "Card expiry month and year ranges", "text": "Given Card details are shown\nWhen The user enters month 13 or year 2100 or year 1949\nThen Month error 'Card expiry month must be between 1 and 12'; year error 'Invalid card expiry year'; blank/zero values produce the same messages and the field is marked '*'", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COCRDUPC.cbl:877-947", "plain": "Expiry month must be 1-12 and expiry year must be between 1950 and 2099; the expiry day cannot be edited.", "defect": ""}, {"key": "claude/RULE-108", "function": "claude/signon/02", "id": "RULE-108", "name": "Menu option number must be a listed option between 1 and the option count", "text": "Given The Main Menu has 11 options and the user types '5 ' (trailing space)\nWhen The user presses Enter\nThen The input becomes '05', option 5 is accepted and selected. If the user types '0', '12', '99' or a non-numeric value, the message 'Please enter a valid option number...' is shown and nothing is selected", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:115-134", "plain": "The option the user types is trimmed, padded with leading zeros to two digits, and accepted only if it is numeric and between 1 and the number of options on that menu.", "defect": ""}, {"key": "claude/RULE-109", "function": "claude/signon/02", "id": "RULE-109", "name": "Menu key handling: Enter selects, PF3 exits to sign-on, other keys are rejected", "text": "Given A user on the Main Menu or Admin Menu in re-entry state\nWhen The user presses Enter, PF3, or any other attention key (for example PF5)\nThen Enter: the typed option number is processed. PF3: the user goes to sign-on program COSGN00C. Other keys: the error flag is set, the shared message CCDA-MSG-INVALID-KEY is shown and the menu is sent again", "program": "COMEN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COMEN01C.cbl:93-103", "plain": "On a menu, only Enter (choose an option) and PF3 (leave to the sign-on screen) are accepted. Any other key shows an 'invalid key' message and the menu again.", "defect": ""}, {"key": "claude/RULE-110", "function": "claude/report/01", "id": "RULE-110", "name": "Custom report date entry validation", "text": "Given Custom is selected with start date 02/30/2024 and end date 03/15/2024\nWhen The user presses Enter\nThen The month and day range checks pass. The date utility rejects 2024-02-30, so the message 'Start Date - Not a valid date...' is shown, the cursor goes to the start month field, and no job is submitted", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018", "REQ-F-019"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/CORPT00C.cbl:258-426", "plain": "For a Custom report, the user must enter a start date and an end date (month, day and year for each). Each part must be numeric and within range, and each whole date must be a real calendar date. Only the first error found is reported, and the job is not submitted.", "defect": "There is no check that the start date is on or before the end date, so an inverted range is submitted. CEEDAYS message 2513 (unsupported range) is ignored, so out-of-range dates pass. Non-numeric input is turned to zero by NUMVAL-C before the NUMERIC test, so that test is effectively dead code."}, {"key": "claude/RULE-111", "function": "claude/report/01", "id": "RULE-111", "name": "Explicit confirmation required before report job submission", "text": "Given Yearly is selected and the Confirm field is blank\nWhen The user presses Enter\nThen The message 'Please confirm to print the Yearly report...' is shown, the cursor goes to Confirm, and nothing is submitted. On the next Enter, 'Y' or 'y' submits the job; 'N' or 'n' clears all fields and shows the screen again with no message; a value such as 'X' shows '\"X\" is not a valid value to confirm...'", "program": "CORPT00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-020", "REQ-F-021", "REQ-F-022", "REQ-F-023"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CORPT00C.cbl:464-494", "plain": "A report job is submitted only after the user types Y in the confirm field. N cancels the request and clears the screen. A blank prompts the user to confirm. Any other value is rejected.", "defect": ""}, {"key": "claude/RULE-112", "function": "claude/signon/01", "id": "RULE-112", "name": "User ID and password are both required before sign-on is attempted", "text": "Given The sign-on screen is submitted with Enter\nWhen User ID is blank (spaces or low-values), or User ID is filled in but Password is blank\nThen Error flag is set, the screen is redisplayed with 'Please enter User ID ...' (cursor on User ID) or 'Please enter Password ...' (cursor on Password), and the user security file is not read", "program": "COSGN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COSGN00C.cbl:117-140", "plain": "A sign-on attempt is rejected without checking the user file if the User ID or the Password is blank, and the User ID is checked first.", "defect": ""}, {"key": "claude/RULE-113", "function": "claude/txn/02", "id": "RULE-113", "name": "Row selection for transaction detail view", "text": "Given The list shows 10 rows and the user types 'S' in the selection field of row 3, which holds transaction ID 0000000000000042\nWhen The user presses Enter\nThen The selected transaction ID is stored in the commarea and control transfers to COTRN01C (transaction detail) with context 0. If the selection code is anything other than 'S' or 's' (e.g. 'X'), the message 'Invalid selection. Valid value is S' is set and the list is redisplayed.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020", "REQ-F-021"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:148-204", "plain": "Users pick a transaction by typing 'S' next to one of the 10 listed rows. Only 'S' (either case) is accepted, and only the first marked row counts.", "defect": "An invalid selection does not set the error flag, so the list is reset to page 1 from the Tran ID filter (or the start of the file) rather than redisplaying the current page; an end-of-file browse message can replace the 'Invalid selection' message."}, {"key": "claude/RULE-114", "function": "claude/txn/02", "id": "RULE-114", "name": "Transaction ID search filter must be numeric", "text": "Given The user enters '0000000000001234' in the Tran ID search field\nWhen The user presses Enter\nThen The browse starts at transaction key 0000000000001234 (or the next higher key), the page number is reset to 0 and the first page is loaded and shown as page 1. If the user enters 'ABC123', the message 'Tran ID must be Numeric ...' is shown and no list is loaded.", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COTRN00C.cbl:206-229", "plain": "The optional 'search Tran ID' field must be numeric; if it is blank the list starts at the beginning of the transaction file, otherwise the list starts at the entered ID.", "defect": "After a non-numeric error, PROCESS-PAGE-FORWARD is still performed, which issues STARTBR with a stale/uninitialized TRAN-ID before the error flag stops further processing; the screen may be sent more than once in one task."}, {"key": "claude/RULE-115", "function": "claude/txn/02", "id": "RULE-115", "name": "Bottom-of-list guard for next page", "text": "Given The user is on the last page and the next-page flag is N\nWhen The user presses PF8\nThen No browse is performed; the message 'You are already at the bottom of the page...' is shown and the screen is redisplayed without erasing, so the current rows stay visible", "program": "COTRN00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN00C.cbl:257-274", "plain": "Paging forward is allowed only when the previous page load found more transactions; otherwise the user is told they are already at the bottom.", "defect": ""}, {"key": "claude/RULE-116", "function": "claude/txn/02", "id": "RULE-116", "name": "Transaction ID is required to view a transaction", "text": "Given A user is on the Transaction View screen (CT01)\nWhen They press Enter with the Transaction ID field blank (spaces or low-values)\nThen No lookup is performed, the message 'Tran ID can NOT be empty...' is shown, and the cursor is placed on the Transaction ID field; otherwise previously displayed detail fields are cleared and the lookup proceeds", "program": "COTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-025", "REQ-F-026"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN01C.cbl:144-156", "plain": "A user must enter a Transaction ID before the system will look up and display a transaction.", "defect": ""}, {"key": "claude/RULE-117", "function": "claude/txn/02", "id": "RULE-117", "name": "Transaction lookup by ID with not-found and failure outcomes", "text": "Given A user enters Transaction ID '0000000000000123'\nWhen Enter is pressed and the TRANSACT file is read by that key\nThen If found, the screen shows transaction ID, card number, type code, category code, source, amount, description, original and processed timestamps, merchant ID/name/city/zip; if not found the message 'Transaction ID NOT found...' is shown; any other file error shows 'Unable to lookup Transaction...'", "program": "COTRN01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-027", "REQ-F-029", "REQ-F-030"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COTRN01C.cbl:267-296", "plain": "The entered Transaction ID is looked up by exact key in the transaction master file; if found its full details are displayed, otherwise the user is told it was not found or that the lookup failed.", "defect": "The read is issued with the UPDATE option (exclusive record lock) although this program is view-only and never rewrites or unlocks the record; the lock is held until the CICS task ends, which can needlessly block concurrent updaters of the same transaction."}, {"key": "claude/RULE-118", "function": "claude/txn/03", "id": "RULE-118", "name": "Resolve the card and account for a new transaction (account ID takes precedence)", "text": "Given Operator enters Account ID 00000000001 (card number field may also hold any value)\nWhen Enter (or PF5) is pressed on the Add Transaction screen\nThen The Account ID is looked up in the card cross-reference by account (CXACAIX). If found, the card number field is overwritten with the linked card number (for example 4111111111111111). If not found, the message 'Account ID NOT found...' is shown and nothing is saved. With Account ID blank and card 4111111111111111 entered, the card is looked up in CCXREF and the account ID is filled in. With both blank: 'Account or Card Number must be entered...'", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-011"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:193-230", "plain": "An operator must enter either an Account ID or a Card Number. If an Account ID is given, it must be numeric and on file, and the card number is filled in from the card cross-reference. If only a Card Number is given, it must be numeric and on file, and the account ID is filled in from the same cross-reference.", "defect": "The program does not check account or card status: no active/closed flag, no expiry date, no credit limit. ACCTDAT is declared (line 40) but never read, so a transaction can be added to a closed or over-limit account."}, {"key": "claude/RULE-119", "function": "claude/txn/03", "id": "RULE-119", "name": "Mandatory transaction fields and numeric code checks", "text": "Given An Add Transaction screen with Type CD '01', Category CD blank and every other field filled in\nWhen Enter is pressed\nThen The message 'Category CD can NOT be empty...' is shown, the cursor goes to Category, and nothing is saved", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COTRN02C.cbl:251-337", "plain": "Every transaction detail field must be filled in. The fields are checked in a fixed order and only the first problem is reported. Type code, category code and merchant ID must be numeric.", "defect": "Type and category codes are not checked against reference data, so invalid type/category combinations can be posted."}, {"key": "claude/RULE-120", "function": "claude/txn/03", "id": "RULE-120", "name": "Origination and processing date validation", "text": "Given Orig Date '2024-02-30', Proc Date '2024-03-01'\nWhen Enter is pressed\nThen The format check passes, but CSUTLDTC returns a non-zero severity, so 'Orig Date - Not a valid date...' is shown and nothing is saved", "program": "COTRN02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COTRN02C.cbl:353-427", "plain": "The original date and the processing date must both be in the form YYYY-MM-DD and must be real calendar dates according to the shared date utility. Dates the utility reports as outside its supported range are still accepted.", "defect": "Dates outside the supported range are accepted without error. There is no cross-check between the processing date and the origination date."}, {"key": "claude/RULE-121", "function": "claude/useradmin/01", "id": "RULE-121", "name": "Row selection action routes to update or delete user", "text": "Given The user list shows 10 rows and the operator types 'd' in the selection field of row 3 (user ID USER0003)\nWhen The operator presses Enter\nThen The selected user ID USER0003 and the flag 'd' are saved in the commarea and control transfers to the Delete User program COUSR03C (U/u -> COUSR02C Update User), with from-transaction CU00, from-program COUSR00C and context 0", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-017", "REQ-F-018", "REQ-F-019", "REQ-F-020", "REQ-F-021"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COUSR00C.cbl:149-216", "plain": "An operator marks one listed user with 'U' to open the Update User screen or 'D' to open the Delete User screen; any other code is rejected with 'Invalid selection. Valid values are U and D'.", "defect": "If several rows are marked, only the first is acted on, with no warning; the program also does not check that the operator is an admin (it relies on being reached from the Admin menu)."}, {"key": "claude/RULE-122", "function": "claude/useradmin/02", "id": "RULE-122", "name": "New user requires all five profile fields", "text": "Given An administrator on the Add User screen (transaction CU01) enters First Name 'JOHN', Last Name blank, User ID 'JDOE0001', a password and User Type 'U'\nWhen they press Enter\nThen no record is written, the message 'Last Name can NOT be empty...' is shown and the cursor is placed on Last Name; once all five fields are non-blank the values are copied to the user security record (ID, first name, last name, password, type) and a write to USRSEC is attempted", "program": "COUSR01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR01C.cbl:115-160", "plain": "A new user can only be added when first name, last name, user ID, password and user type are all filled in; the first missing field (checked in that order) is reported and nothing is saved.", "defect": ""}, {"key": "claude/RULE-123", "function": "claude/useradmin/02", "id": "RULE-123", "name": "User type value is not restricted to Admin or Regular", "text": "Given An administrator enters User Type 'X' with all other fields filled\nWhen they press Enter on the Add User screen\nThen the user is saved with type 'X'; at sign-on such a user would not match the Admin indicator 'A' (COCOM01Y CDEMO-USRTYP-ADMIN)", "program": "COUSR01C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "app/cbl/COUSR01C.cbl:142-158", "plain": "The add-user program only checks that User Type is not blank; any single character is accepted and stored, even though the system elsewhere treats 'A' as Admin and anything else as a regular user.", "defect": "No domain check on user type; invalid codes can be persisted and silently produce non-admin users."}, {"key": "claude/RULE-124", "function": "claude/useradmin/03", "id": "RULE-124", "name": "Fetching a user requires the user ID to exist in the security file", "text": "Given An admin enters User ID 'NOUSER01' that is not in the USRSEC file\nWhen the admin presses Enter\nThen the message 'User ID NOT found...' is shown and the cursor returns to User ID. For an existing ID the fields are filled in and the message 'Press PF5 key to save your updates ...' is shown", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005", "REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR02C.cbl:143-172", "plain": "When the admin presses Enter with a User ID, the user is looked up in the user security file. If found, the user's first name, last name, password and type are loaded onto the screen for editing. If not found, an error is shown.", "defect": ""}, {"key": "claude/RULE-125", "function": "claude/useradmin/03", "id": "RULE-125", "name": "User update requires all profile fields to be non-blank", "text": "Given An admin on the Update User screen with User ID 'JSMITH01', First Name 'John', Last Name blank, Password 'pass1234', User Type 'U'\nWhen the admin presses PF5 (Save) or PF3 (Save & Exit)\nThen no update is written, the message 'Last Name can NOT be empty...' is shown and the cursor is put on Last Name", "program": "COUSR02C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-014"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR02C.cbl:179-213", "plain": "A user record can be saved only when User ID, First Name, Last Name, Password and User Type are all filled in; the first empty field found blocks the save and is reported.", "defect": "User Type is not restricted to 'A' or 'U', so an invalid role code can be written to the security file. Downstream sign-on and menu routing may treat unknown codes unpredictably."}, {"key": "claude/RULE-126", "function": "claude/util/05", "id": "RULE-126", "name": "Calendar date validity check against a date mask (CEEDAYS)", "text": "Given A caller (e.g. report date range in CORPT00C, transaction origin/process dates in COTRN02C) passes date '2023-02-30' with mask 'YYYY-MM-DD'\nWhen CSUTLDTC calls CEEDAYS with the full 10-byte date and 10-byte mask\nThen CEEDAYS returns a non-zero feedback token (bad date value), the result text is 'Datevalue error' and the date is treated as invalid; for '2023-02-28' the feedback token is all zeros and the result text is 'Date is valid'", "program": "CSUTLDTC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "app/cbl/CSUTLDTC.cbl:103-149", "plain": "A 10-character date is valid only if the Language Environment date service can convert it, under the caller's mask, to a day number counted from 15 Oct 1582 (Lilian date); otherwise it is rejected with a specific reason.", "defect": "88-level FC-INVALID-DATE is defined on the all-zero (success) token and maps to 'Date is valid'; the name inverts the meaning and invites errors in a rewrite."}, {"key": "claude/RULE-127", "function": "claude/util/05", "id": "RULE-127", "name": "Date conversion request compatibility check", "text": "Given Input type '1' and output type '2'\nWhen COBDATFT is called\nThen No conversion happens and the error message field is set to 'INVALID INPUT'; with input type '3' the same error results", "program": "COBDATFT", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004"], "priority": "P2", "category": "Validation", "confidence": "Medium", "source": "app/asm/COBDATFT.asm:29-56", "plain": "A date conversion request is rejected with 'INVALID INPUT' when the input type is neither '1' nor '2', when a type-1 date appears to contain a dash, or when the output type is the opposite code of the input type.", "defect": ""}, {"key": "claude/RULE-128", "function": "claude/account/01", "id": "RULE-128", "name": "Only Enter and PF3 are valid actions; other keys treated as Enter", "text": "Given The user is on the account view screen\nWhen They press PF7 (or Clear, PA1, etc.)\nThen The key is treated as Enter and the account lookup/edit is performed.", "program": "COACTVWC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008"], "priority": "P2", "category": "Validation", "confidence": "High", "source": "app/cbl/COACTVWC.cbl:299-314", "plain": "On the account view screen, only Enter (look up) and PF3 (exit) are recognized; any other key behaves as Enter.", "defect": ""}, {"key": "claude/RULE-129", "function": "claude/card/02", "id": "RULE-129", "name": "Both search criteria missing yields 'No input received'", "text": "Given Account field and card field are both blank or '*'\nWhen The user presses Enter\nThen The message is overwritten with 'No input received', both fields are marked with '*' in red, and no card lookup is done", "program": "COCRDSLC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008"], "priority": "P2", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDSLC.cbl:636-640", "plain": "If the user supplies neither an account nor a card number, the screen says no input was received rather than naming a single missing field.", "defect": ""}, {"key": "claude/RULE-130", "function": "claude/card/03", "id": "RULE-130", "name": "No-change detection before validation", "text": "Given Card fetched with name 'JOHN SMITH', status 'Y', expiry 2025-12\nWhen The user submits 'john smith', 'Y', 12, 2025\nThen Message 'No change detected with respect to values fetched.'; field edits are skipped and state does not advance to confirmation", "program": "COCRDUPC", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009"], "priority": "P2", "category": "Validation", "confidence": "High", "source": "app/cbl/COCRDUPC.cbl:679-693", "plain": "If the edited name, expiry and status are identical (ignoring case) to what was fetched, the change is not processed and the user is told no change was detected.", "defect": ""}, {"key": "claude/RULE-131", "function": "claude/useradmin/01", "id": "RULE-131", "name": "PF8 blocked at the bottom of the list", "text": "Given The last page displayed set next-page = N\nWhen The operator presses PF8\nThen No file read occurs; message 'You are already at the bottom of the page...' is shown without erasing the screen", "program": "COUSR00C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013"], "priority": "P2", "category": "Validation", "confidence": "High", "source": "app/cbl/COUSR00C.cbl:260-277", "plain": "Scrolling forward is only allowed when the previous page found that more users exist; otherwise the operator is told they are already at the bottom.", "defect": ""}, {"key": "claude/RULE-132", "function": "claude/auth/03", "id": "RULE-132", "name": "Fraud flag toggle on a pending authorization (report / remove fraud)", "text": "Given Pending authorization detail for account 00000012345 with selected auth key K1 whose fraud flag PA-AUTH-FRAUD is blank (never reported)\nWhen The user presses PF5 on the authorization detail screen\nThen The flag is set to 'F' (fraud confirmed) and action 'F' (report fraud) is sent with the full auth record, account id and customer id to COPAUS2C. If COPAUS2C succeeds, the detail segment is saved with flag 'F' and the fraud report date COPAUS2C stamped (today, MM/DD/YY), and the message 'AUTH MARKED FRAUD...' is shown. If the flag was 'F', pressing PF5 sets it to 'R' (removed), sends action 'R', and on success shows 'AUTH FRAUD REMOVED...'.", "program": "COPAUS1C", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-N-003"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "app/app-authorization-ims-db2-mq/cbl/COPAUS1C.cbl:230-266", "plain": "When the user presses PF5 on an authorization, its fraud flag flips: if it is already confirmed as fraud it is changed to 'fraud removed', otherwise it is marked as confirmed fraud. The change is sent to the fraud register program (COPAUS2C) first, and only then saved back to the authorization record.", "defect": "MARK-AUTH-FRAUD does not check the outcome of READ-AUTH-RECORD (error flag or not-found/EOF) before toggling and calling COPAUS2C. If the read fails or the record is not found, the leftover/stale PENDING-AUTH-DETAILS content could be sent to the fraud register and replaced in IMS. Also, there is no check that the account or selected key is valid on PF5, unlike the Enter path."}, {"key": "claude/RULE-133", "function": "claude/auth/03", "id": "RULE-133", "name": "Mark or unmark an authorization as fraud (
