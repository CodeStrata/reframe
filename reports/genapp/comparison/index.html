er RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/1/claude/RULE-001"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ebb7c9f9be", "claude": "claude/RULE-049", "confidence": "medium", "reason": "Both set return code '90' when the CUSTOMER insert fails; AWS also covers the counter-numbered insert itself.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ebb7c9f9be", "id": "id-ebb7c9f9be", "name": "Insert customer with counter-issued number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is `'ON'`, WHEN the customer insert is performed, THE Customer Record Creation SHALL insert the customer into the customer store (`CUSTOMER`) with the counter-issued number and the supplied name, date of birth, address, phone and email details, and on insert failure return `'90'` to the caller", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ebb7c9f9be"}, "claude_rule": {"key": "claude/RULE-049", "id": "RULE-049", "name": "Customer record creation and insert failure outcome", "text": "Given An add-customer request whose commarea passes the length check\nWhen The INSERT INTO CUSTOMER returns a non-zero SQLCODE (for example -803 duplicate key, or -180 for an invalid DOB value)\nThen CA-RETURN-CODE is set to '90', an error message with the SQLCODE is written to the queue through LGSTSQ, and the program returns. The VSAM copy and the security record are not created.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/2/claude/RULE-049"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868", "claude": "claude/RULE-001", "confidence": "high", "reason": "Both describe the fallback insert with a database-generated number that is returned to the caller.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868", "id": "id-65ef7a3868", "name": "Insert customer with generated number and return it", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is not `'ON'`, WHEN the customer insert is performed, THE Customer Record Creation SHALL insert the customer with a store-generated customer number and the supplied details, return `'90'` to the caller on insert failure, and otherwise capture the generated number; after any successful insert, return the customer number to the caller", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868"}, "claude_rule": {"key": "claude/RULE-001", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the counter RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/1/claude/RULE-001"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-7c308664cf", "claude": "claude/RULE-084", "confidence": "high", "reason": "Both link to LGACVS01 with the first 225 bytes of the commarea after a successful insert.", "relation": "same", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-7c308664cf", "id": "id-7c308664cf", "name": "Register customer and hand off to copy program", "text": "WHEN a validated new-customer request has been inserted successfully, THE Customer Registration SHALL delegate to the customer copy program (`LGACVS01`) with the full 225-byte request data, including the assigned customer number", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-7c308664cf"}, "claude_rule": {"key": "claude/RULE-084", "id": "RULE-084", "name": "New customer is mirrored to the VSAM customer file", "text": "Given Customer 1000042 was inserted into DB2\nWhen LGACDB01 continues after INSERT-CUSTOMER\nThen LGACVS01 is linked with the first 225 bytes of the commarea (header plus customer details)", "program": "LGACDB01", "priority": "P1", "link": "../claude/index.html#/c/4/claude/RULE-084"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d801f6a4a8", "claude": "claude/RULE-001", "confidence": "medium", "reason": "Both cover inserting the customer with the counter-assigned number; Claude also covers the fallback path.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d801f6a4a8", "id": "id-d801f6a4a8", "name": "Insert customer with counter-assigned number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is 'ON', WHEN the new customer is to be stored, THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) with the counter-assigned number and the request's personal, address and contact details; if the insert fails, return to the caller without further processing", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d801f6a4a8"}, "claude_rule": {"key": "claude/RULE-001", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the counter RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/1/claude/RULE-001"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f", "claude": "claude/RULE-001", "confidence": "high", "reason": "Both cover the store-assigned customer number that is retrieved and returned when the counter is unavailable.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f", "id": "id-721917222f", "name": "Insert customer with store-assigned number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is not 'ON', WHEN the new customer is to be stored, THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) letting the store assign the customer number, retrieve that generated number, and return the assigned customer number to the caller; if the insert fails, return to the caller without further processing", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f"}, "claude_rule": {"key": "claude/RULE-001", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the counter RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/1/claude/RULE-001"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d29d130688", "claude": "claude/RULE-049", "confidence": "medium", "reason": "Both write an error message and return when the CUSTOMER insert fails; AWS also covers the counter-numbered insert and does not give the '90' code.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d29d130688", "id": "id-d29d130688", "name": "Insert customer with counter-assigned number", "text": "WHEN the counter-availability indicator (`LGAC-NCS`) is 'ON', THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) using the counter-assigned customer number and the supplied name, date of birth, address, phones and email; on insert failure write an error message and return to the caller", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d29d130688"}, "claude_rule": {"key": "claude/RULE-049", "id": "RULE-049", "name": "Customer record creation and insert failure outcome", "text": "Given An add-customer request whose commarea passes the length check\nWhen The INSERT INTO CUSTOMER returns a non-zero SQLCODE (for example -803 duplicate key, or -180 for an invalid DOB value)\nThen CA-RETURN-CODE is set to '90', an error message with the SQLCODE is written to the queue through LGSTSQ, and the program returns. The VSAM copy and the security record are not created.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/2/claude/RULE-049"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-06ae3bdd5a", "claude": "claude/RULE-001", "confidence": "high", "reason": "Both describe inserting with CUSTOMERNUMBER DEFAULT when the counter flag is not 'ON'.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-06ae3bdd5a", "id": "id-06ae3bdd5a", "name": "Insert customer with database-default number", "text": "WHEN the counter-availability indicator (`LGAC-NCS`) is not 'ON', THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) letting the database assign the customer number by default; on insert failure write an error message and return to the caller", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-06ae3bdd5a"}, "claude_rule": {"key": "claude/RULE-001", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the counter RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/1/claude/RULE-001"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ee6f8cefcf", "claude": "claude/RULE-049", "confidence": "medium", "reason": "Both say that a failed insert returns without creating the security record; Claude also sets '90' and covers both number paths.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ee6f8cefcf", "id": "id-ee6f8cefcf", "name": "Stop when counter-numbered customer add fails", "text": "WHILE the counter-service indicator (`LGAC-NCS`) is `'ON'`, WHEN the customer database outcome (`SQLCODE`) is not 0, THE Customer Add SHALL return to the caller without creating the customer security record", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ee6f8cefcf"}, "claude_rule": {"key": "claude/RULE-049", "id": "RULE-049", "name": "Customer record creation and insert failure outcome", "text": "Given An add-customer request whose commarea passes the length check\nWhen The INSERT INTO CUSTOMER returns a non-zero SQLCODE (for example -803 duplicate key, or -180 for an invalid DOB value)\nThen CA-RETURN-CODE is set to '90', an error message with the SQLCODE is written to the queue through LGSTSQ, and the program returns. The VSAM copy and the security record are not created.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/2/claude/RULE-049"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-efec943615", "claude": "claude/RULE-001", "confidence": "high", "reason": "Both describe the store-assigned-number insert and capture of the generated number when the counter is unavailable.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-efec943615", "id": "id-efec943615", "name": "Add customer with database-assigned number", "text": "WHILE the counter-service indicator (`LGAC-NCS`) is not `'ON'`, WHEN a validated new customer is to be added, THE Customer Add SHALL add the customer to the customer store (`CUSTOMER`) with a store-assigned number and the supplied name, birth date, address, phone and email; return to the caller if the add fails, otherwise capture the assigned customer number", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-efec943615"}, "claude_rule": {"key": "claude/RULE-001", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the counter RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/1/claude/RULE-001"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8e98397165", "claude": "claude/RULE-048", "confidence": "high", "reason": "Both link to LGACDB02 for the new customer with the same default password hash, count '0000' and state 'N'.", "relation": "same", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8e98397165", "id": "id-8e98397165", "name": "Request customer security record creation", "text": "WHEN a new customer has been added and assigned a customer number, THE Customer Security Setup SHALL delegate to the customer security program (`LGACDB02`) with request type `'02ACUS'`, the new customer number, initial password `'5732fec825535eeafb8fac50fee3a8aa'`, attempt count `'0000'` and state `'N'`", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8e98397165"}, "claude_rule": {"key": "claude/RULE-048", "id": "RULE-048", "name": "Default security credentials created for every new customer", "text": "Given Customer 1000042 was just inserted\nWhen LGACDB01 links to LGACDB02\nThen A customer-security record is requested for customer 1000042 with password hash <credential \u2014 masked, see base/src/lgacdb01.cbl:181> (preview '5732****'), count '0000' and state 'N'", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/3/claude/RULE-048"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8ca65a04f0", "claude": "claude/RULE-018", "confidence": "high", "reason": "Both reject a commarea shorter than header plus customer length with return code '98'.", "relation": "same", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8ca65a04f0", "id": "id-8ca65a04f0", "name": "Reject request shorter than required length", "text": "IF the received data length (`EIBCALEN`) is less than the header length plus the customer record length, THEN THE Customer Request Validation SHALL set the return code (`CA-RETURN-CODE`) to `'98'` and return to the caller", "program": "lgacus01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8ca65a04f0"}, "claude_rule": {"key": "claude/RULE-018", "id": "RULE-018", "name": "Minimum request size for customer add and inquire", "text": "Given An add-customer request commarea of 80 bytes\nWhen LGACUS01 (or LGICUS01 or LGACDB01) checks the length\nThen CA-RETURN-CODE = '98' and the program returns without touching the database. With 0 bytes, an error message is logged and the task abends with code 'LGCA'.", "program": "LGACUS01", "priority": "P1", "link": "../claude/index.html#/c/0/claude/RULE-018"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-86b7805ffc", "claude": "claude/RULE-018", "confidence": "medium", "reason": "Both cover the short-request check, but AWS says the return code is left at '00' while Claude says '98'.", "relation": "conflicting", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-86b7805ffc", "id": "id-86b7805ffc", "name": "Validate request length for customer data", "text": "WHEN the received request length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN`) plus the customer record length (`WS-CUSTOMER-LEN`), THE Customer Registration Request Intake SHALL set the return code to success ('00') and the policy count to zero, then return to the caller without inserting the customer", "program": "lgacus01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-86b7805ffc"}, "claude_rule": {"key": "claude/RULE-018", "id": "RULE-018", "name": "Minimum request size for customer add and inquire", "text": "Given An add-customer request commarea of 80 bytes\nWhen LGACUS01 (or LGICUS01 or LGACDB01) checks the length\nThen CA-RETURN-CODE = '98' and the program returns without touching the database. With 0 bytes, an error message is logged and the task abends with code 'LGCA'.", "program": "LGACUS01", "priority": "P1", "link": "../claude/index.html#/c/0/claude/RULE-018"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-98ad855daf", "claude": "claude/RULE-050", "confidence": "high", "reason": "Both write the 225-byte record to KSDSCUST keyed by customer number and abend LGV0 on failure; only Claude mentions return code '80'.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-98ad855daf", "id": "id-98ad855daf", "name": "Write new customer record", "text": "WHEN a customer number (`CA-CUSTOMER-NUM`) is supplied for a new customer record, THE Customer Record Creation SHALL write the customer record to the customer file (`KSDSCUST`) keyed by the customer number with a 0225-byte length; if the write fails, capture the secondary response detail, log the failure, and abend with code `'LGV0'`", "program": "lgacvs01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-98ad855daf"}, "claude_rule": {"key": "claude/RULE-050", "id": "RULE-050", "name": "New customer is stored in the customer master file under its 10-digit customer number", "text": "Given A new-customer request with customer number 0001000042, first name 'Jane', last name 'Smith', DOB '1980-05-14', postcode 'SO21 2JN' and email '<email>'\nWhen the add-customer VSAM step (LGACVS01) runs\nThen a record of 225 bytes (customer number + name, DOB, house name/number, postcode, number of policies, mobile, home phone, email) is written to KSDSCUST with key 0001000042; if KSDSCUST already holds key 0001000042 (DUPREC) or any other non-NORMAL response occurs, CA-RETURN-CODE is set to '80', an error is logged, and the task abends with LGV0 (no dump)", "program": "LGACVS01", "priority": "P0", "link": "../claude/index.html#/c/4/claude/RULE-050"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-390dc7122b", "claude": "claude/RULE-019", "confidence": "high", "reason": "Both reject a request shorter than the type-specific required length; AWS does not mention return code '98'.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-390dc7122b", "id": "id-390dc7122b", "name": "Reject request shorter than required length", "text": "IF the received request length (`EIBCALEN`) is less than the required length (`WS-REQUIRED-CA-LEN`) for the policy type, THEN THE Policy Add Request Validation SHALL return to the caller without recording the policy", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-390dc7122b"}, "claude_rule": {"key": "claude/RULE-019", "id": "RULE-019", "name": "Minimum request length per policy type", "text": "Given A Motor add request ('01AMOT') that is 150 bytes long\nWhen The length check runs\nThen It is rejected with return code '98', because Motor needs 2 estamp in CA-LASTCHANGED and return code '00'.", "program": "LGAPDB01", "priority": "P0", "link": "../claude/index.html#/c/12/claude/RULE-051"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbac5019dd", "claude": "claude/RULE-051", "confidence": "high", "reason": "Both return the new policy number and LASTCHANGED after a successful master insert.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbac5019dd", "id": "id-cbac5019dd", "name": "Return assigned policy number and timestamp", "text": "WHEN the master policy row is created successfully, THE Policy Master Creation SHALL return the newly assigned policy number and the LASTCHANGED timestamp read back from the policy master table for that policy number", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbac5019dd"}, "claude_rule": {"key": "claude/RULE-051", "id": "RULE-051", "name": "Policy header creation with system-assigned number and timestamp", "text": "Given A valid House add request for customer 1000001 with issue date 2026-01-01, expiry date 2027-01-01, broker ID 55 and payment 300\nWhen The POLICY insert succeeds\nThen POLICY gets a new row with a database-assigned number (for example 2000123), type 'H' and LASTCHANGED = CURRENT TIMESTAMP. The caller gets that number in CA-POLICY-NUM, the stored timestamp in CA-LASTCHANGED and return code '00'.", "program": "LGAPDB01", "priority": "P0", "link": "../claude/index.html#/c/12/claude/RULE-051"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-29fba40dae", "claude": "claude/RULE-021", "confidence": "high", "reason": "Both log the error and return without product details when the POLICY insert fails with -530; Claude adds '70', and AWS also -length message before insert", "text": "Given An add-policy request of 20 bytes\nWhen The add-policy service receives it\nThen Return code '98' is set and the request is not processed; a request of 28 bytes or more is forwarded to LGAPDB01 with return code initialised to '00'.", "program": "LGAPOL01", "priority": "P1", "link": "../claude/index.html#/c/11/claude/RULE-022"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-67d318b149", "claude": "claude/RULE-022", "confidence": "medium", "reason": "Both initialise the return code to '00'; Claude also covers the length check.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-67d318b149", "id": "id-67d318b149", "name": "Default return code to success", "text": "WHEN request data has been received, THE Policy Request Validation SHALL set the return code (`CA-RETURN-CODE`) to success '00'", "program": "lgapol01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-67d318b149"}, "claude_rule": {"key": "claude/RULE-022", "id": "RULE-022", "name": "Policy add requires only header-length message before insert", "text": "Given An add-policy request of 20 bytes\nWhen The add-policy service receives it\nThen Return code '98' is set and the request is not processed; a request of 28 bytes or more is forwarded to LGAPDB01 with return code initialised to '00'.", "program": "LGAPOL01", "priority": "P1", "link": "../claude/index.html#/c/11/claude/RULE-022"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8c1805284d", "claude": "claude/RULE-085", "confidence": "high", "reason": "Both build the key from policy type, customer number and policy number.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8c1805284d", "id": "id-8c1805284d", "name": "Build policy record key", "text": "THE Policy Record Registration SHALL build the policy identification key from the 4th character of the request identifier (`CA-REQUEST-ID`) as the policy type, followed by the customer number (`CA-CUSTOMER-NUM`) and the policy number (`CA-POLICY-NUM`)", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8c1805284d"}, "claude_rule": {"key": "claude/RULE-085", "id": "RULE-085", "name": "Policy-file record is keyed by policy type, customer and policy number and holds type-specific details", "text": "Given An add request '01AHOU' for customer 0000000001, policy 0000000005, 3 bedrooms, value 00250000, postcode 'AB12 3CD'\nWhen The policy-file record is built\nThen Key = 'H'+'0000000001'+'0000000005'; data = property type(15), bedrooms(3), value(8), postcode(8), house name(9)", "program": "LGAPVS01", "priority": "P1", "link": "../claude/index.html#/c/14/claude/RULE-085"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2bc3830325", "claude": "claude/RULE-085", "confidence": "high", "reason": "Both record property type, bedrooms, value, postcode and house name for a house policy.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2bc3830325", "id": "id-2bc3830325", "name": "Populate house policy details", "text": "WHEN the policy type (`WF-Request-ID`) is house (`'H'`), THE Policy Record Registration SHALL record the property type, bedroom count, insured value, postcode and house name in the policy record", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2bc3830325"}, "cla  "link": "../claude/index.html#/c/14/claude/RULE-056"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1", "claude": "claude/RULE-079", "confidence": "high", "reason": "Both write the current date (DDMMYYYY) and time to GENASTRT only when the queue does not exist.", "relation": "same", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1", "id": "id-d5214150e1", "name": "Record first application start date and time", "text": "WHEN the startup record store (`GENASTRT`) does not exist yet when it is read, THE Application Startup Recording SHALL capture the current date (DDMMYYYY) and time and write them as the startup record to the startup record store (`GENASTRT`); leave the existing record untouched when the store already exists", "program": "lgastat1", "priority": "", "link": "../aws/index.html#/c/12/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1"}, "claude_rule": {"key": "claude/RULE-079", "id": "RULE-079", "name": "Statistics start-time stamp recorded once", "text": "Given Temporary storage queue GENASTRT does not exist (e.g. after a CICS restart or after an ops reset deletes it)\nWhen Any statistics event is processed\nThen The current date (DDMMYYYY, first 8 chars) and time (HHMMSS) are written to GENASTRT as a 16-byte record 'DDMMYYYY  HHMMSS'; if the queue already exists (READQ not QIDERR) nothing is written", "program": "LGASTAT1", "priority": "P2", "link": "../claude/index.html#/c/54/claude/RULE-079"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ee43899b6b", "claude": "claude/RULE-045", "confidence": "medium", "reason": "Both reject a delete request under 28 bytes, but AWS keeps return code '00' while Claude sets '98'.", "relation": "conflicting", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ee43899b6b", "id": "id-ee43899b6b", "name": "Reject undersized deletion request", "text": "IF the received request length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN` = 28), THEN THE Policy Deletion Request Intake SHALL end processing and return to the caller without deleting anything, with the return code preset to success ('00')", "program": "lgdpdb01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ee43899b6b"}, "claude_rule": {"key": "claude/RULE-045", "id": "RULE-045", "name": "Delete request must carry a usable request area", "text": "Given A delete request arrives\nWhen The request data length is 0, or is between 1 and 27 bytes\nThen Length 0: the transaction aborts with code LGCA after logging 'NO COMMAREA RECEIVED'. Length 1-27: return code 98 and no delete. Length 28 or more: processing continues with return code 00", "program": "LGDPDB01", "priority": "P2", "link": "../claude/index.html#/c/23/claude/RULE-045"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4a77cf174d", "claude": "claude/RULE-052", "confidence": "high", "reason": "Both delete the POLICY row by customer and policy number and log and return on failure; Claude adds return code 90 and the cascade.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4a77cf174d", "id": "id-4a77cf174d", "name": "Delete customer policy record", "text": "THE Policy Deletion SHALL delete the policy row from the policy store (`POLICY`) matching the customer number (`CUSTOMERNUMBER`) and policy number (`POLICYNUMBER`), and when the deletion is not successful record an error message and return to the caller", "program": "lgdpdb01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4a77cf174d"}, "claude_rule": {"key": "claude/RULE-052", "id": "RULE-052", "name": "Deleting a policy removes it and its type-specific details together", "text": "Given Customer 0000000001 owns house policy 0000000005\nWhen A '01DHOU' delete request for customer 0000000001 / policy 0000000005 is processed\nThen The POLICY row matching both numbers is deleted, the HOUSE details row goes with it by cascade, and the request returns 00. If the database reports anything other than success, return code 90 is set, the error is logged, and control returns without deleting the policy-file record", "program": "LGDPDB01", "priority": "P0", "link": "../claude/index.html#/c/24/claude/RULE-052"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-07a98fc9c3", "claude": "claude/RULE-052", "confidence": "medium", "reason": "Both delete the policy row for a recognised delete type; AWS also covers the hand-off to LGDPVS01.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-07a98fc9c3", "id": "id-07a98fc9c3", "name": "Delete recognised policy type and hand off", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is '01DEND', '01DHOU', '01DCOM' or '01DMOT', THE Policy Deletion Dispatcher SHALL delete the policy row and then delegate to the policy deletion program (`LGDPVS01`) with the request data, length 32500", "program": "lgdpdb01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-07a98fc9c3"}, "claude_rule": {"key": "claude/RULE-052", "id": "RULE-052", "name": "Deleting a policy removes it and its type-specific details together", "text": "Given Customer 0000000001 owns house policy 0000000005\nWhen A '01DHOU' delete request for customer 0000000001 / policy 0000000005 is processed\nThen The POLICY row matching both numbers is deleted, the HOUSE details row goes with it by cascade, and the request returns 00. If the database reports anything other than success, return code 90 is set, the error is logged, and control returns without deleting the policy-file record", "program": "LGDPDB01", "priority": "P0", "link": "../claude/index.html#/c/24/claude/RULE-052"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b0d0314ab3", "claude": "claude/RULE-024", "confidence": "high", "reason": "Both accept the upper-cased delete IDs 01DEND/01DMOT/01DHOU/01DCOM.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b0d0314ab3", "id": "id-b0d0314ab3", "name": "Recognise policy deletion request types", "text": "WHEN the upper-cased request identifier (`CA-REQUEST-ID`) is `'01DEND'`, `'01DMOT'`, `'01DHOU'` or `'01DCOM'`, THE Policy Deletion Request Validation SHALL accept the request and proceed to delete the policy row", "program": "lgdpol01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b0d0314ab3"}, "claude_rule": {"key": "claude/RULE-024", "id": "RULE-024", "name": "Policy delete allowed only for recognised policy types (case-insensitive)", "text": "Given A delete request of 28+ bytes with request id '01dmot'\nWhen The delete-policy service validates the request\nThen The id is upper-cased to '01DMOT', recognised, and the delete is forwarded to LGDPDB01; a request with id '01DXYZ' gets return code '99' and nothing is deleted; a request under 28 bytes gets return code '98'.", "program": "LGDPOL01", "priority": "P1", "link": "../claude/index.html#/c/23/claude/RULE-024"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-141fb43e9d", "claude": "claude/RULE-024", f the message, under the label 'Policy Key='", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a5ea883fc7"}, "claude_rule": {"key": "claude/RULE-007", "id": "RULE-007", "name": "Policy lookup by policy type and customer number (generic key)", "text": "Given Input type 'M' and customer number 0001000010, and the policy file holds M/0001000010/0000000003 as the first key at or above M0001000010\nWhen A policy inquiry simulation request runs\nThen KSDSPOLY is read generically (GTEQ, 11-byte partial key = type + customer number) and the key 'M00010000100000000003' is returned after 'Policy Key='", "program": "LGIPVS01", "priority": "P1", "link": "../claude/index.html#/c/68/claude/RULE-007"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5855243e9c", "claude": "claude/RULE-031", "confidence": "high", "reason": "Both set 'Policy Bad=' and set the customer and policy numbers to 13 when the returned type does not match or the lookup fails.", "relation": "same", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5855243e9c", "id": "id-5855243e9c", "name": "Report bad policy lookup", "text": "IF the retrieved policy type differs from the requested type or the policy lookup fails, THEN THE Policy Response Builder SHALL set the message label to 'Policy Bad=' and set the customer number and policy number in the message to 13", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5855243e9c"}, "claude_rule": {"key": "claude/RULE-031", "id": "RULE-031", "name": "Reject policy lookups whose returned type does not match the requested type", "text": "Given Requested type 'H' with customer number 0009999999, and the next key on the file at or above H0009999999 belongs to type 'M'\nWhen The program checks the result of the policy lookup\nThen The response text is 'Policy Bad=', the customer number is 0000000013 and the policy number is 0000000013. The type byte stays at its initial value 'X' (it is not overwritten).", "program": "LGIPVS01", "priority": "P1", "link": "../claude/index.html#/c/69/claude/RULE-031"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148", "claude": "claude/RULE-061", "confidence": "high", "reason": "Both write the GENACNTL header '**** GENAPP CNTL' (20), the LOW CUSTOMER entry (23) and the HIGH CUSTOMER entry (24); Claude adds the values and the delete.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148", "id": "id-bddf1cd148", "name": "Write control header and customer range entries", "text": "THE Application Control Queue Setup SHALL write to the application control queue (`GENACNTL`), in order, the 20-character control header `'**** GENAPP CNTL'`, then the 23-character entry starting `'LOW CUSTOMER='`, then the 24-character entry starting `'HIGH CUSTOMER='`, without waiting for space, and capture each outcome in the response code (`WS-RESP`)", "program": "lgsetup", "priority": "", "link": "../aws/index.html#/c/17/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148"}, "claude_rule": {"key": "claude/RULE-061", "id": "RULE-061", "name": "Customer number range reset to match restored database", "text": "Given An existing GENACNTL queue holding any previous low/high customer range, and the operator runs the setup transaction without extra input\nWhen LGSETUP runs\nThen GENACNTL is deleted and rewritten as three records: '**** GENAPP CNTL' (20 bytes), 'LOW CUSTOMER=0000000001' (23 bytes), 'HIGH CUSTOMER=0000000011' (24 bytes)", "program": "LGSETUP", "priority": "P1", "link": "../claude/index.html#/c/62/claude/RULE-061"}}, {"aws": "No domain/DiagnosticandErrorMessageLogging/id-f646f17c37", "claude": "claude/RULE-009", "confidence": "high", "reason": "Both take the program caller's commarea as the message with the system ID and EIBCALEN as the length.", "relation": "overlapping", "aws_rule": {"key": "No domain/DiagnosticandErrorMessageLogging/id-f646f17c37", "id": "id-f646f17c37", "name": "Use caller-supplied text as message", "text": "WHEN the program is invoked by another program (invoking program name `WS-INVOKEPROG` is not blank), THE Message Log Builder SHALL stamp the current system identifier into the message, take the caller's data (`COMMA-DATA`) as the message text, and set the message length to the caller's data length (`EIBCALEN`)", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/23/No domain/DiagnosticandErrorMessageLogging/id-f646f17c37"}, "claude_rule": {"key": "claude/RULE-009", "id": "RULE-009", "name": "Log record composition and length by invocation mode", "text": "Given Program LGAPOL01 links to LGSTSQ with a 60-byte commarea on system 'CICA'\nWhen The log record is built\nThen WS-FLAG='C', the record is 'CICA' + ' ' + commarea text, and the write length is 60 + 5 = 65. For a terminal-entered transaction of 80 bytes (5-byte tranid + 75 data), WS-FLAG='R', the message is the received data after the tranid, and the length is 80 - 5 + 5 = 80", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/48/claude/RULE-009"}}, {"aws": "No domain/DiagnosticandErrorMessageLogging/id-fb989ec573", "claude": "claude/RULE-009", "confidence": "high", "reason": "Both use the received terminal data with the received length minus 5.", "relation": "overlapping", "aws_rule": {"key": "No domain/DiagnosticandErrorMessageLogging/id-fb989ec573", "id": "id-fb989ec573", "name": "Use terminal input as message", "text": "WHEN the program is started directly and not by another program (invoking program name is blank), THE Message Log Builder SHALL receive the terminal input, use the received data (`WS-RECV-DATA`) as the message text, and set the message length to the received length minus 5", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/23/No domain/DiagnosticandErrorMessageLogging/id-fb989ec573"}, "claude_rule": {"key": "claude/RULE-009", "id": "RULE-009", "name": "Log record composition and length by invocation mode", "text": "Given Program LGAPOL01 links to LGSTSQ with a 60-byte commarea on system 'CICA'\nWhen The log record is built\nThen WS-FLAG='C', the record is 'CICA' + ' ' + commarea text, and the write length is 60 + 5 = 65. For a terminal-entered transaction of 80 bytes (5-byte tranid + 75 data), WS-FLAG='R', the message is the received data after the tranid, and the length is 80 - 5 + 5 = 80", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/48/claude/RULE-009"}}, {"aws": "No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6", "claude": "claude/RULE-009", "confidence": "high", "reason": "Both build the log message from the system ID plus the commarea (EIBCALEN) or the terminal data (length minus 5), depending on invocation mode.", "relation": "same", "aws_rule": {"key": "No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6", "id": "id-a3686cd7f6", "name": "Assemble message from caller or terminal", "text": "WHEN a message is submitted for logging, either by an invoking program (invoking program name `WS-INVOKEPROG` not blank) or from a terminal (invoking program name blank), THE Error Message Logging SHALL stamp the message with the originating system identifier (`WRITE-MSG-SYSID`). For a program invocation, take the message text from the passed data (`COMMA-DATA`) and its length from the passed data length (`EIBCALEN`). For a terminal start, take the text from the received terminal data (`WS-RECV-DATA`) and use the received length minus 5.", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/25/No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6"}, "claude_rule": {"key": "claude/RULE-009", "id": "RULE-009", "name": "Log record composition and length by invocation mode", "text": "Given Program LGAPOL01 links to LGSTSQ with a 60-byte commarea on system 'CICA'\nWhen The log record is built\nThen WS-FLAG='C', the record is 'CICA' + ' ' + commarea text, and the write length is 60 + 5 = 65. For a terminal-entered transaction of 80 bytes (5-byte tranid + 75 data), WS-FLAG='R', the message is the received data after the tranid, and the length is 80 - 5 + 5 = 80", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/48/claude/RULE-009"}}, {"aws": "No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718", "claude": "claude/RULE-009", "confidence": "medium", "reason": "Both set WS-FLAG to 'C' for a program caller and 'R' for a terminal start.", "relation": "overlapping", "aws_rule": {"key": "No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718", "id": "id-ea4fdf1718", "name": "Determine invocation mode", "text": "WHEN the program starts and the invoking program name (`WS-INVOKEPROG`) is retrieved, THE Invocation Mode Detection SHALL set the invocation-mode flag (`WS-FLAG`) to 'C' when an invoking program name is present, and to 'R' when the invoking program name is blank", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/24/No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718"}, "claude_rule": {"key": "claude/RULE-009", "id": "RULE-009", "name": "Log record composition and length by invocation mode", "text": "Given Program LGAPOL01 links to LGSTSQ with a 60-byte commarea on system 'CICA'\nWhen The log record is built\nThen WS-FLAG='C', the record is 'CICA' + ' ' + commarea text, and the write length is 60 + 5 = 65. For a terminal-entered transaction of 80 bytes (5-byte tranid + 75 data), WS-FLAG='R', the message is the received data after the tranid, and the length is 80 - 5 + 5 = 80", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/48/claude/RULE-009"}}, {"aws": "No domain/DiagnosticandErrorMessageLogging/id-f1fd6ad01d", "claude": "claude/RULE-088", "confidence": "high", "reason": "Both strip the 'Q=' prefix from the message and reduce its length by 7; Claude also covers the queue-name override.", "relation": "overlapping", "aws_rule": {"key": "No domain/DiagnosticandErrorMessageLogging/id-f1fd6ad01d", "id": "id-f1fd6ad01d", "name": "Strip queue directive prefix", "text": "WHEN the message text starts with 'Q=', THE Message Log Builder SHALL replace the message text with its remainder after the directive and reduce the message length by 7", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/23/No domain/DiagnosticandErrorMessageLogging/id-f1fd6ad01d"}, "claude_rule": {"key": "claude/RULE-088", "id": "RULE-088", "name": "Error log queue routing by optional Q= prefix", "text": "Given A caller passes the message 'Q=PROD Policy 123 add failed'\nWhen LGSTSQ logs the message\nThen The TS queue name becomes 'GENAPROD' (first 4 chars of GENAERRS kept, last 4 replaced by the 4 chars after 'Q='), the logged text becomes 'Policy 123 add failed', and the record length is reduced by 7; a message without a 'Q=' prefix goes to GENAERRS unchanged", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/49/claude/RULE-088"}}, {"aws": "No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff", "claude": "claude/RULE-088", "confidence": "high", "reason": "Both default to GENAERRS, replace the last 4 characters with the 4 after 'Q=', strip the prefix and reduce the length by 7.", "relation": "same", "aws_rule": {"key": "No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff", "id": "id-e9db9b70ff", "name": "Select target error queue name", "text": "WHEN a message is prepared for logging, and its text either starts with the prefix 'Q=' or does not, THE Error Message Logging SHALL target the default queue 'GENAERRS'. When the text starts with 'Q=', replace the queue name extension (`STSQ-EXT`) with the four characters that follow the prefix, strip the prefix and queue code from the message text, and reduce the message length by 7. Otherwise, keep the default queue.", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/25/No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff"}, "claude_rule": {"key": "claude/RULE-088", "id": "RULE-088", "name": "Error log queue routing by optional Q= prefix", "text": "Given A caller passes the message 'Q=PROD Policy 123 add failed'\nWhen LGSTSQ logs the message\nThen The TS queue name becomes 'GENAPROD' (first 4 chars of GENAERRS kept, last 4 replaced by the 4 chars after 'Q='), the logged text becomes 'Policy 123 add failed', and the record length is reduced by 7; a message without a 'Q=' prefix goes to GENAERRS unchanged", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/49/claude/RULE-088"}}, {"aws": "No domain/DiagnosticandErrorMessageLogging/id-26136fe9d9", "claude": "claude/RULE-089", "confidence": "medium", "reason": "Both write the record to TD queue CSMT; Claude also covers the NOSUSPEND TS write, and AWS covers adding 5 to the length.", "relation": "overlapping", "aws_rule": {"key": "No domain/DiagnosticandErrorMessageLogging/id-26136fe9d9", "id": "id-26136fe9d9", "name": "Write message to standard log queue", "text": "THE Message Log Writer SHALL add 5 to the message length and write the outbound message with that length to the standard destination queue (`CSMT`)", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/23/No domain/DiagnosticandErrorMessageLogging/id-26136fe9d9"}, "claude_rule": {"key": "claude/RULE-089", "id": "RULE-089", "name": "Dual-destination error logging with non-blocking TS write", "text": "Given An error message is ready and TS storage is exhausted\nWhen LGSTSQ writes the log\nThen The record is written to TD queue CSMT. The TS queue write (GENAERRS or its override) is attempted with NOSUSPEND, and if no space is available it is silently dropped. The response codes are not checked and the caller is not told about the failure", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/50/claude/RULE-089"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c0b6f6ea13", "claude": "claude/RULE-073", "confidence": "high", "reason": "Both update the CUSTOMER row's name, DOB, address, phone and email fields by customer number and log other failures; Claude adds rc '01' and '90'.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c0b6f6ea13", "id": "id-c0b6f6ea13", "name": "Update customer personal and contact details", "text": "WHEN a customer update request with data is received for a customer number (`CA-CUSTOMER-NUM`), THE Customer Details Maintenance SHALL update the matching customer row in the customer store (`CUSTOMER`) by customer number (`CUSTOMERNUMBER`) with the supplied name, date of birth, address, phone and email details; on success take no further action, on customer-not-found defer to handling outside this slice, and on any other failure log an error message identified as ' UPDATE CUST  ' with the customer number and return code", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c0b6f6ea13"}, "claude_rule": {"key": "claude/RULE-073", "id": "RULE-073", "name": "Customer details update overwrites all contact fields and classifies outcome", "text": "Given Customer 1000042 exists and request supplies first name, last name, DOB, house name, house number, postcode, mobile, home phone and email\nWhen The customer update is processed\nThen All nine columns are overwritten unconditionally (blank inputs blank the stored values) and rc '00' is returned; SQLCODE 100 (no such customer) gives rc '01'; any other SQL error gives rc '90' and an error log entry", "program": "LGUCDB01", "priority": "P1", "link": "../claude/index.html#/c/8/claude/RULE-073"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-689c1c148d", "claude": "claude/RULE-073", "confidence": "high", "reason": "Both overwrite the CUSTOMER row's contact and personal fields for the matching customer number.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-689c1c148d", "id": "id-689c1c148d", "name": "Update customer details row", "text": "WHEN the customer update step runs for a customer number, THE Customer Details Maintenance SHALL update the customer table (`CUSTOMER`) row whose `CUSTOMERNUMBER` matches the customer number with the supplied name, date of birth, address, phone numbers and email address", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-689c1c148d"}, "claude_rule": {"key": "claude/RULE-073", "id": "RULE-073", "name": "Customer details update overwrites all contact fields and classifies outcome", "text": "Given Customer 1000042 exists and request supplies first name, last name, DOB, house name, house number, postcode, mobile, home phone and email\nWhen The customer update is processed\nThen All nine columns are overwritten unconditionally (blank inputs blank the stored values) and rc '00' is returned; SQLCODE 100 (no such customer) gives rc '01'; any other SQL error gives rc '90' and an error log entry", "program": "LGUCDB01", "priority": "P1", "link": "../claude/index.html#/c/8/claude/RULE-073"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-69676c05ca", "claude": "claude/RULE-073", "confidence": "high", "reason": "Both return '01' when no customer matches the update.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-69676c05ca", "id": "id-69676c05ca", "name": "Report customer not found", "text": "IF the customer update finds no customer matching the supplied customer number, THEN THE Customer Details Maintenance SHALL set the return code to '01' to report that the customer was not found", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-69676c05ca"}, "claude_rule": {"key": "claude/RULE-073", "id": "RULE-073", "name": "Customer details update overwrites all contact fields and classifies outcome", "text": "Given Customer 1000042 exists and request supplies first name, last name, DOB, house name, house number, postcode, mobile, home phone and email\nWhen The customer update is processed\nThen All nine columns are overwritten unconditionally (blank inputs blank the stored values) and rc '00' is returned; SQLCODE 100 (no such customer) gives rc '01'; any other SQL error gives rc '90' and an error log entry", "program": "LGUCDB01", "priority": "P1", "link": "../claude/index.html#/c/8/claude/RULE-073"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b7263135cc", "claude": "claude/RULE-073", "confidence": "low", "reason": "Both cover the customer update with a default '00' outcome; AWS focuses on the orchestration steps.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b7263135cc", "id": "id-b7263135cc", "name": "Default outcome to success and update", "text": "WHEN a customer update request with data is received, THE Customer Update Orchestration SHALL set the return code to success '00', convert the customer number into the numeric customer key, and perform the customer details update", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b7263135cc"}, "claude_rule": {"key": "claude/RULE-073", "id": "RULE-073", "name": "Customer details update overwrites all contact fields and classifies outcome", "text": "Given Customer 1000042 exists and request supplies first name, last name, DOB, house name, house number, postcode, mobile, home phone and email\nWhen The customer update is processed\nThen All nine columns are overwritten unconditionally (blank inputs blank the stored values) and rc '00' is returned; SQLCODE 100 (no such customer) gives rc '01'; any other SQL error gives rc '90' and an error log entry", "program": "LGUCDB01", "priority": "P1", "link": "../claude/index.html#/c/8/claude/RULE-073"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04dcbd8b01", "claude": "claude/RULE-091", "confidence": "high", "reason": "Both pass the request to LGUCVS01 with length 225 after the DB2 update.", "relation": "same", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04dcbd8b01", "id": "id-04dcbd8b01", "name": "Pass request to follow-on program", "text": "WHEN the customer details update step has completed, THE Customer Update Orchestration SHALL delegate to the follow-on program (`LGUCVS01`), passing the customer request data and return code with a length of 225", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04dcbd8b01"}, "claude_rule": {"key": "claude/RULE-091", "id": "RULE-091", "name": "Customer update always propagates to secondary customer store", "text": "Given A customer update request for customer 1000042\nWhen The DB2 update completes with any result (00, 01 or 90)\nThen LGUCVS01 is invoked with the first 225 bytes of the request area", "program": "LGUCDB01", "priority": "P1", "link": "../claude/index.html#/c/9/claude/RULE-091"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04a4edcd51", "claude": "claude/RULE-042", "confidence": "high", "reason": "Both set '99' and skip the update when the request ID is not '01UCUS'; Claude also covers forwarding to LGUCDB01.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04a4edcd51", "id": "id-04a4edcd51", "name": "Reject unsupported request identifier", "text": "IF the request identifier (`CA-REQUEST-ID`) is not the update-customer request '01UCUS', THEN THE Customer Update Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '99' to signal an unsupported request and skip to the end-of-program step", "program": "lgucus01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04a4edcd51"}, "claude_rule": {"key": "claude/RULE-042", "id": "RULE-042", "name": "Customer update requires the update request type", "text": "Given A request to LGUCUS01 with CA-REQUEST-ID '01ICUS'\nWhen LGUCUS01 checks the request id\nThen CA-RETURN-CODE = '99' and the program returns without linking to LGUCDB01. With '01UCUS', the request is passed to LGUCDB01 to update the customer.", "program": "LGUCUS01", "priority": "P1", "link": "../claude/index.html#/c/7/claude/RULE-042"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c83ef37a6f", "claude": "claude/RULE-042", "confidence": "medium", "reason": "Both skip the customer update for any request ID other than '01UCUS'.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c83ef37a6f", "id": "id-c83ef37a6f", "name": "Bypass update for non-update requests", "text": "WHEN the requested operation (`CA-REQUEST-ID`) is anything other than '01UCUS', THE Customer Update Request Intake SHALL skip the customer update and proceed to the end-of-program step; for '01UCUS', continue to the customer update", "program": "lgucus01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c83ef37a6f"}, "claude_rule": {"key": "claude/RULE-042", "id": "RULE-042", "name": "Customer update requires the update request type", "text": "Given A request to LGUCUS01 with CA-REQUEST-ID '01ICUS'\nWhen LGUCUS01 checks the request id\nThen CA-RETURN-CODE = '99' and the program returns without linking to LGUCDB01. With '01UCUS', the request is passed to LGUCDB01 to update the customer.", "program": "LGUCUS01", "priority": "P1", "link": "../claude/index.html#/c/7/claude/RULE-042"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-f31689c9ac", "claude": "claude/RULE-042", "confidence": "medium", "reason": "Both pass an '01UCUS' request to LGUCDB01; AWS adds the defaults and the 32500 length.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-f31689c9ac", "id": "id-f31689c9ac", "name": "Delegate customer update to database module", "text": "WHEN an update-customer request ('01UCUS') with request data is received, THE Customer Update Request Intake SHALL preset the outcome code (`CA-RETURN-CODE`) and the policy count (`CA-NUM-POLICIES`) to '00', then delegate to the customer database update module (`LGUCDB01`), passing the full request of length 32500", "program": "lgucus01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-f31689c9ac"}, "claude_rule": {"key": "claude/RULE-042", "id": "RULE-042", "name": "Customer update requires the update request type", "text": "Given A request to LGUCUS01 with CA-REQUEST-ID '01ICUS'\nWhen LGUCUS01 checks the request id\nThen CA-RETURN-CODE = '99' and the program returns without linking to LGUCDB01. With '01UCUS', the request is passed to LGUCDB01 to update the customer.", "program": "LGUCUS01", "priority": "P1", "link": "../claude/index.html#/c/7/claude/RULE-042"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a", "claude": "claude/RULE-074", "confidence": "high", "reason": "Both rewrite the locked KSDSCUST record in full and abend with LGV2 if the rewrite fails; Claude adds the NOTFND/LGV1 path and the RC '82'.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a", "id": "id-dcd58d532a", "name": "Replace stored customer record", "text": "WHEN the existing customer record has been locked for update, THE Customer Record Update SHALL rewrite the customer record in the customer file (`KSDSCUST`) with the supplied customer data at the fixed record size (`CUSTOMER-RECORD-SIZE`); if the rewrite fails, record a diagnostic error message and terminate abnormally with code 'LGV2'", "program": "lgucvs01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a"}, "claude_rule": {"key": "claude/RULE-074", "id": "RULE-074", "name": "Customer update requires an existing record and fully replaces it", "text": "Given Customer 0001000042 exists in KSDSCUST with postcode 'SO21 2JN', and an update request carries postcode 'SO22 5HA' and all other customer fields\nWhen the update-customer VSAM step (LGUCVS01) runs\nThen the record is read for update (locked) by key 0001000042 and rewritten in full with the 225 bytes from the request, so the stored postcode becomes 'SO22 5HA'. If customer 0001000042 does not exist (NOTFND) or the read fails, RC '81' is set and the task abends with LGV1. If the rewrite fails, RC '82' is set and the task abends with LGV2.", "program": "LGUCVS01", "priority": "P1", "link": "../claude/index.html#/c/9/claude/RULE-074"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-604b574afd", "claude": "claude/RULE-075", "confidence": "high", "reason": "Both link to LGUPVS01 with length 225 after the DB2 policy update.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-604b574afd", "id": "id-604b574afd", "nam ext": "Given A motor policy 5 with premium 400 and accidents 0\nWhen An 01UMOT update arrives with premium 650 and accidents 2\nThen The MOTOR row for policy 5 is set to premium 650 and accidents 2, along with make, model, value, registration, colour, CC and year of manufacture, exactly as supplied", "program": "LGUPDB01", "priority": "P1", "link": "../claude/index.html#/c/21/claude/RULE-076"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a", "claude": "claude/RULE-053", "confidence": "high", "reason": "Both update issue date, expiry date, broker ID and broker reference, stamp a new timestamp and read it back, with '90' on error; Claude adds the rollback.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a", "id": "id-203ed7588a", "name": "Update common policy data and timestamp", "text": "WHEN the timestamps match and the policy-specific update succeeded, THE Policy Common Data Update SHALL update the policy's issue date, expiry date, broker id and broker's reference, stamp it with the current timestamp, and return the new timestamp to the caller; set the outcome code to '90' if the timestamp cannot be read back", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a"}, "claude_rule": {"key": "claude/RULE-053", "id": "RULE-053", "name": "Policy header update stamps a new last-changed timestamp", "text": "Given Policy 5 with matching timestamps and a successful product-table update\nWhen The POLICY row is updated\nThen ISSUEDATE, EXPIRYDATE, BROKERID and BROKERSREFERENCE take the request values. LASTCHANGED = CURRENT TIMESTAMP, which is read back into CA-LASTCHANGED. On error the unit of work is rolled back (SYNCPOINT ROLLBACK), the code is '90' and the error is logged", "program": "LGUPDB01", "priority": "P0", "link": "../claude/index.html#/c/21/claude/RULE-053"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa", "claude": "claude/RULE-053", "confidence": "high", "reason": "Both update the POLICY header fields with a new LASTCHANGED returned to the caller and log errors.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa", "id": "id-4229402eaa", "name": "Update common policy details and timestamp", "text": "WHEN the policy-type update succeeds, THE Policy Record Update SHALL update the issue date, expiry date, broker identifier and broker reference with a new last-changed timestamp, return the new timestamp to the caller, and write an error message if the timestamp cannot be read back (physical store: `POLICY`)", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa"}, "claude_rule": {"key": "claude/RULE-053", "id": "RULE-053", "name": "Policy header update stamps a new last-changed timestamp", "text": "Given Policy 5 with matching timestamps and a successful product-table update\nWhen The POLICY row is updated\nThen ISSUEDATE, EXPIRYDATE, BROKERID and BROKERSREFERENCE take the request values. LASTCHANGED = CURRENT TIMESTAMP, which is read back into CA-LASTCHANGED. On error the unit of work is rolled back (SYNCPOINT ROLLBACK), the code is '90' and the error is logged", "program": "LGUPDB01", "priority": "P0", "link": "../claude/index.html#/c/21/claude/RULE-053"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c794c28722", "claude": "claude/RULE-044", "confidence": "high", "reason": "Both require header length + full house length for '01UHOU' and return '98' when the data is shorter.", "relation": "same", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c794c28722", "id": "id-c794c28722", "name": "Validate house policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is a house request (`'01UHOU'`), THE Policy Update Request Validation SHALL compute the required length as header length plus full house policy length, and when the received data length is less than it set the return code to '98' and return to the caller", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c794c28722"}, "claude_rule": {"key": "claude/RULE-044", "id": "RULE-044", "name": "Policy update request type and minimum data-length check", "text": "Given An update request with request id '01UHOU' (House) and a message of 150 bytes\nWhen The update-policy service validates the request\nThen Required length is 28 + 130 = 158 bytes; 150 < 158 so return code '98' is set and control returns without updating. A 158-byte or longer House request passes and is forwarded to the database update routine LGUPDB01.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/19/claude/RULE-044"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9529a4c01e", "claude": "claude/RULE-044", "confidence": "high", "reason": "Both check the house update length as header + house length and return without updating when it is short; AWS does not state the '98' code.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9529a4c01e", "id": "id-9529a4c01e", "name": "Validate house update request length", "text": "WHEN the request type (`CA-REQUEST-ID`) is `'01UHOU'` (house update), THE Policy Update Request Validation SHALL compute the required length as header length (`WS-CA-HEADER-LEN`) plus house policy length (`WS-FULL-HOUSE-LEN`), and return to the caller without updating when the received length (`EIBCALEN`) is less than that requirement", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9529a4c01e"}, "claude_rule": {"key": "claude/RULE-044", "id": "RULE-044", "name": "Policy update request type and minimum data-length check", "text": "Given An update request with request id '01UHOU' (House) and a message of 150 bytes\nWhen The update-policy service validates the request\nThen Required length is 28 + 130 = 158 bytes; 150 < 158 so return code '98' is set and control returns without updating. A 158-byte or longer House request passes and is forwarded to the database update routine LGUPDB01.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/19/claude/RULE-044"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9fc0c7e894", "claude": "claude/RULE-044", "confidence": "medium", "reason": "Both cover the minimum-length check; AWS states it for endowment and Claude's example is house.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9fc0c7e894", "id": "id-9fc0c7e894", "name": "Validate endowment update request length", "text": "WHEN the request type (`CA-REQUEST-ID`) is `'01UEND'` (endowment update), THE Policy Update Request Validation SHALL compute the required length as header length (`WS-CA-HEADER-LEN`) plus endowment policy length (`WS-FULL-ENDOW-LEN`), and return to the caller without updating when the received length (`EIBCALEN`) is less than that requirement", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9 ng. A 158-byte or longer House request passes and is forwarded to the database update routine LGUPDB01.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/19/claude/RULE-044"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5042f9d52", "claude": "claude/RULE-044", "confidence": "medium", "reason": "Both return '98' when the data is shorter than header + policy length; AWS states it for endowment.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5042f9d52", "id": "id-d5042f9d52", "name": "Validate endowment policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is an endowment request (`'01UEND'`), THE Policy Update Request Validation SHALL initialise the return code to success ('00'), compute the required length as header length plus full endowment policy length, and when the received data length is less than the required length set the return code to '98' and return to the caller", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5042f9d52"}, "claude_rule": {"key": "claude/RULE-044", "id": "RULE-044", "name": "Policy update request type and minimum data-length check", "text": "Given An update request with request id '01UHOU' (House) and a message of 150 bytes\nWhen The update-policy service validates the request\nThen Required length is 28 + 130 = 158 bytes; 150 < 158 so return code '98' is set and control returns without updating. A 158-byte or longer House request passes and is forwarded to the database update routine LGUPDB01.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/19/claude/RULE-044"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e47bb194af", "claude": "claude/RULE-044", "confidence": "medium", "reason": "Both return '98' when the data is shorter than header + policy length; AWS states it for motor.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e47bb194af", "id": "id-e47bb194af", "name": "Validate motor policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is a motor request (`'01UMOT'`), THE Policy Update Request Validation SHALL compute the required length as header length plus full motor policy length, and when the received data length is less than it set the return code to '98' and return to the caller", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e47bb194af"}, "claude_rule": {"key": "claude/RULE-044", "id": "RULE-044", "name": "Policy update request type and minimum data-length check", "text": "Given An update request with request id '01UHOU' (House) and a message of 150 bytes\nWhen The update-policy service validates the request\nThen Required length is 28 + 130 = 158 bytes; 150 < 158 so return code '98' is set and control returns without updating. A 158-byte or longer House request passes and is forwarded to the database update routine LGUPDB01.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/19/claude/RULE-044"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f9293c7e00", "claude": "claude/RULE-093", "confidence": "low", "reason": "AWS sets '99' for an unrecognised update type; Claude only mentions that the return code may become 98/99.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f9293c7e00", "id": "id-f9293c7e00", "name": "Flag unrecognised policy update request", "text": "IF the request type (`CA-REQUEST-ID`) is not `'01UEND'`, `'01UHOU'` or `'01UMOT'`, THEN THE Policy Update Request Validation SHALL set the return code (`CA-RETURN-CODE`) to `'99'` to mark the request as unrecognised", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f9293c7e00"}, "claude_rule": {"key": "claude/RULE-093", "id": "RULE-093", "name": "Policy maintenance result codes and empty-request abend", "text": "Given A policy service is called with no request data\nWhen The service starts\nThen An error message with date, time and program name is written to the error queue via LGSTSQ and the transaction ends with abend code LGCA; with data present the return code starts as '00' and may be changed to 98/99 or by the database routine.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/11/claude/RULE-093"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55177c3cc7", "claude": "claude/RULE-093", "confidence": "medium", "reason": "Both start the return code at '00' before handing the update to the database routine.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55177c3cc7", "id": "id-55177c3cc7", "name": "Forward policy update to database program", "text": "THE Policy Update Request Routing SHALL initialize the return code (`CA-RETURN-CODE`) to `'00'` and delegate the policy update request to the database update program (`LGUPDB01`) with a request data length of 32500", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55177c3cc7"}, "claude_rule": {"key": "claude/RULE-093", "id": "RULE-093", "name": "Policy maintenance result codes and empty-request abend", "text": "Given A policy service is called with no request data\nWhen The service starts\nThen An error message with date, time and program name is written to the error queue via LGSTSQ and the transaction ends with abend code LGCA; with data present the return code starts as '00' and may be changed to 98/99 or by the database routine.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/11/claude/RULE-093"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aaba34304c", "claude": "claude/RULE-077", "confidence": "high", "reason": "Both rewrite the KSDSPOLY record read for update and abend with LGV4 if the rewrite fails; Claude adds the NOTFND/LGV3 path.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aaba34304c", "id": "id-aaba34304c", "name": "Rewrite updated policy record", "text": "WHEN the policy record has been read for update successfully, THE Policy Record Update SHALL rewrite the updated policy record to the policy store (`KSDSPOLY`); if the rewrite fails, log an error message and abend with `'LGV4'`", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aaba34304c"}, "claude_rule": {"key": "claude/RULE-077", "id": "RULE-077", "name": "Updating a policy replaces the whole policy-file record and requires it to already exist", "text": "Given House policy 0000000005 for customer 0000000001 exists in KSDSPOLY with value 00250000\nWhen An update request '01UHOU' with value 00275000 is processed\nThen The record is read for update and rewritten with all house fields from the request (value now 00275000). If the record is not found, return code 81 is set and the transaction aborts with LGV3. If the rewrite fails, return code 82 is set and the transaction aborts with LGV4", "program": "LGUPVS01", "pri
