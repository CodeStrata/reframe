ority": "P1", "link": "../claude/index.html#/c/22/claude/RULE-077"}}, {"aws": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f801f00b6e", "claude": "claude/RULE-077", "confidence": "medium", "reason": "Both copy the house fields (such as value) from the request into the policy-file record.", "relation": "overlapping", "aws_rule": {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f801f00b6e", "id": "id-f801f00b6e", "name": "Apply house policy details", "text": "WHEN the policy type (`WF-REQUEST-ID`) is house (`'H'`), THE Policy Detail Mapping SHALL copy the property type, bedrooms, value, postcode and house name from the request into the policy record", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f801f00b6e"}, "claude_rule": {"key": "claude/RULE-077", "id": "RULE-077", "name": "Updating a policy replaces the whole policy-file record and requires it to already exist", "text": "Given House policy 0000000005 for customer 0000000001 exists in KSDSPOLY with value 00250000\nWhen An update request '01UHOU' with value 00275000 is processed\nThen The record is read for update and rewritten with all house fields from the request (value now 00275000). If the record is not found, return code 81 is set and the transaction aborts with LGV3. If the rewrite fails, return code 82 is set and the transaction aborts with LGV4", "program": "LGUPVS01", "priority": "P1", "link": "../claude/index.html#/c/22/claude/RULE-077"}}, {"aws": "No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6", "claude": "claude/RULE-012", "confidence": "high", "reason": "Both add the inquiry, add, update and delete '00' counters into per-operation totals; AWS also covers the success total.", "relation": "overlapping", "aws_rule": {"key": "No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6", "id": "id-d7a5c605f6", "name": "Collect and categorize transaction counters", "text": "THE Transaction Statistics Collection SHALL read each named counter from pool `'GENA'` and publish it under its queue suffix ('100V' through 'H00V'). Accumulate all counters into the success total (`CountSuccess`). Accumulate the inquiry counters ('GENA01ICUS00', 'GENA01IMOT00', 'GENA01IEND00', 'GENA01IHOU00', 'GENA01ICOM00') into `CountInq`, the add counters ('GENA01ACUS00', 'GENA01AMOT00', 'GENA01AEND00', 'GENA01AHOU00', 'GENA01ACOM00') into `CountAdd`, the delete counters ('GENA01DMOT00', 'GENA01DEND00', 'GENA01DHOU00', 'GENA01DCOM00') into `CountDel`, and the update counters ('GENA01UMOT00', 'GENA01UEND00', 'GENA01UHOU00') into `CountUpd`", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6"}, "claude_rule": {"key": "claude/RULE-012", "id": "RULE-012", "name": "Transaction volume by operation type (inquire/add/update/delete)", "text": "Given Successful inquiries ICUS=50, IMOT=10, IEND=5, IHOU=3, ICOM=2\nWhen the collector aggregates the counters\nThen the inquire total is 70, written to GENAX01V. The add total goes to GENAX02V, update to GENAX03V and delete to GENAX04V, each as a new/old/delta triple.", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/59/claude/RULE-012"}}, {"aws": "No domain/TransactionStatisticsandMonitoring/id-1fba5c87ee", "claude": "claude/RULE-012", "confidence": "high", "reason": "Both write the inquiry, add, update and delete totals to X01V\u2013X04V as new/old/delta; AWS also covers the X00V success total.", "relation": "overlapping", "aws_rule": {"key": "No domain/TransactionStatisticsandMonitoring/id-1fba5c87ee", "id": "id-1fba5c87ee", "name": "Publish transaction type totals", "text": "THE Transaction Statistics Collection SHALL store the success total under 'X00V', the inquiry total under 'X01V', the add total under 'X02V', the update total under 'X03V' and the delete total under 'X04V', each with its new value, previous value and change", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-1fba5c87ee"}, "claude_rule": {"key": "claude/RULE-012", "id": "RULE-012", "name": "Transaction volume by operation type (inquire/add/update/delete)", "text": "Given Successful inquiries ICUS=50, IMOT=10, IEND=5, IHOU=3, ICOM=2\nWhen the collector aggregates the counters\nThen the inquire total is 70, written to GENAX01V. The add total goes to GENAX02V, update to GENAX03V and delete to GENAX04V, each as a new/old/delta triple.", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/59/claude/RULE-012"}}, {"aws": "No domain/TransactionStatisticsandMonitoring/id-38b99a6f52", "claude": "claude/RULE-013", "confidence": "high", "reason": "Both compute the elapsed seconds since the previous time in queue 000V (h\u00d73600 + m\u00d760 + s) and store the current time.", "relation": "same", "aws_rule": {"key": "No domain/TransactionStatisticsandMonitoring/id-38b99a6f52", "id": "id-38b99a6f52", "name": "Compute elapsed interval since last run", "text": "THE Statistics Interval Timing SHALL retrieve the previous run time from the '000V' statistics queue (`WS-TSQname`), defaulting it to '120000' if none is available. Replace the stored time with the current time, and store the elapsed seconds, calculated as (current hours\u00d73600 + minutes\u00d760 + seconds) minus the same for the previous time", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-38b99a6f52"}, "claude_rule": {"key": "claude/RULE-013", "id": "RULE-013", "name": "Elapsed seconds since the previous statistics snapshot", "text": "Given Queue GENA000V holds the previous run time 14:58:30 (HHMMSS), and the current CICS time is 14:59:30\nWhen the statistics collector runs\nThen the old time is 53910 s (14*3600+58*60+30), the new time is 53970 s, the interval is 60 s, and GENA000V is rewritten with item 1 = '145930' (current time) and item 2 = '000060' (the interval)", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/56/claude/RULE-013"}}, {"aws": "No domain/TransactionStatisticsandMonitoring/id-dc7efe58f6", "claude": "claude/RULE-014", "confidence": "high", "reason": "Both rewrite each statistic queue with the new value, the previous value and the delta (new \u2212 old).", "relation": "same", "aws_rule": {"key": "No domain/TransactionStatisticsandMonitoring/id-dc7efe58f6", "id": "id-dc7efe58f6", "name": "Store statistic with previous value and change", "text": "THE Statistic Value Store SHALL retrieve the previous value from the statistic's queue (`WS-TSQname`), then replace the queue contents with the new value, the previous value and the change (new minus previous)", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-dc7efe58f6"}, "claude_rule": {"key": "claude/RULE-014", "id": "RULE-014", "name": "Per-counter snapshot and change since last snapshot (rate delta)", "text": "Given Queue GENA100V (successful customer inquiries) has 1,250 as item 1 from the last run, and the counter now reads 1,310\nWhen the collector processes that counter\nThen the queue is deleted and rewritten as item 1 = 000001310 (new), item 2 = 000001250 (old), item 3 = 000000060 (delta = new - old)", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/57/claude/RULE-014"}}], "at": "2026-11-25T20:09:12Z"}, "only": {"aws_programs": ["CDEF121", "CDEF122", "CDEF123", "CDEF124", "CDEF125", "DB2BIND", "DB2DEL", "DEFDREP", "ITPENTR", "ITPLL", "ITPSTL", "MAC1", "SAMPNCS", "SAMPTSQ", "WSAAC01", "WSAAP01", "WSAIC01", "WSAIP01", "WSAUC01", "WSAUP01", "WSAVC01", "WSAVP01"], "claude_programs": ["IPPROGMB", "ITPENTR (WSIM)", "LGAPBR01", "LGTESTC1", "LGTESTP1", "LGTESTP2", "LGTESTP3", "LGTESTP4"], "aws_rules_unpaired": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6c1d358017", "id": "id-6c1d358017", "name": "Map front-end transaction codes to programs", "text": "THE Insurance Front-End Transaction Routing SHALL define the following transactions in group `GENATORT`: `SSC1` runs `LGTESTC1`, `SSP1` runs `LGTESTP1`, `SSP2` runs `LGTESTP2`, `SSP3` runs `LGTESTP3`, `SSP4` runs `LGTESTP4`, `LGSE` runs `LGSETUP`, `LGCF` runs `LGICVS01` and `LGPF` runs `LGIPVS01`", "program": "cdef123", "priority": "", "link": "../aws/index.html#/c/3/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6c1d358017"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4604039ebf", "id": "id-4604039ebf", "name": "Define customer file with deletion prohibited", "text": "THE Customer File Access Policy SHALL define the customer file (`KSDSCUST`) with 82-byte records and a 10-byte key, enabled and opened on first reference, permitting add, browse, read and update and prohibiting delete (`Delete(No)`)", "program": "cdef123", "priority": "", "link": "../aws/index.html#/c/3/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4604039ebf"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-36f59cf45b", "id": "id-36f59cf45b", "name": "Define policy file with full maintenance", "text": "THE Policy File Access Policy SHALL define the policy file (`KSDSPOLY`) with 64-byte records and a 21-byte key, enabled and opened on first reference, permitting add, browse, read, update and delete (`Delete(Yes)`)", "program": "cdef123", "priority": "", "link": "../aws/index.html#/c/3/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-36f59cf45b"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7a90285367", "id": "id-7a90285367", "name": "Map terminal transactions to insurance programs", "text": "THE Online Region Configuration SHALL define, in group `GENATORT`, transactions `SSC1`\u2192`LGTESTC1`, `SSP1`\u2192`LGTESTP1`, `SSP2`\u2192`LGTESTP2`, `SSP3`\u2192`LGTESTP3`, `SSP4`\u2192`LGTESTP4`, `LGSE`\u2192`LGSETUP`, `LGCF`\u2192`LGICVS01` and `LGPF`\u2192`LGIPVS01`, each with task data location `Any` and task data key `User`", "program": "cdef122", "priority": "", "link": "../aws/index.html#/c/2/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7a90285367"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b42e5009af", "id": "id-b42e5009af", "name": "Define customer file without online deletion", "text": "THE Online Region Configuration SHALL define the customer file (`KSDSCUST`) in group `GENA` with 82-byte records keyed on 10 bytes, enabled, opened on first reference, permitting add, browse, read and update and forbidding delete (`No`)", "program": "cdef122", "priority": "", "link": "../aws/index.html#/c/2/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b42e5009af"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c04db7406a", "id": "id-c04db7406a", "name": "Define policy file with full maintenance", "text": "THE Online Region Configuration SHALL define the policy file (`KSDSPOLY`) in group `GENA` with 64-byte records keyed on 21 bytes, enabled, opened on first reference, permitting add, browse, read, update and delete (`Yes`)", "program": "cdef122", "priority": "", "link": "../aws/index.html#/c/2/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c04db7406a"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-82805ba367", "id": "id-82805ba367", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the customer table (`customer`), keyed on an automatically generated customer number (`customerNumber`) that starts at `1000001` and increments by 1, and the customer security table (`customer_secure`) linked to it with cascading delete, each with a unique index on the customer number", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/4/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-82805ba367"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-580abc24e1", "id": "id-580abc24e1", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the policy table (`policy`), keyed on an automatically generated policy number (`policyNumber`) that starts at `1000001`, linked to its customer (`customerNumber`) with cascading delete, and indexed on both the policy number and the customer number", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/4/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-580abc24e1"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-028866d25d", "id": "id-028866d25d", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the endowment details table (`endowment`), keyed on and cascading-deleted with its parent policy (`policyNumber`), with a unique index on the policy number", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/4/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-028866d25d"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-918836eac5", "id": "id-918836eac5", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the house details table (`house`), keyed on and cascading-deleted with its parent policy (`policyNumber`), with a unique index on the policy number", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/4/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-918836eac5"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4f48994b90", "id": "id-4f48994b90", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the motor details table (`motor`), keyed on and cascading-deleted with its parent policy (`policyNumber`), with a unique index on the policy number", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/4/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4f48994b90"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-021d7c7320", "id": "id-021d7c7320", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the commercial details table (`Commercial`), keyed on and cascading-deleted with its parent policy (`PolicyNumber`), carrying a peril indicator and premium for each of fire, crime, flood and weather plus a status and rejection reason, with a unique index on the policy number", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/4/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-021d7c7320"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a1b38def3e", "id": "id-a1b38def3e", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the claim table (`Claim`), keyed on an automatically generated claim number (`ClaimNumber`) that starts at `1000001` and increments by 1, linked to its policy (`PolicyNumber`) with cascading delete, with a unique index on the claim number", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/4/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a1b38def3e"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e225eae034", "id": "id-e225eae034", "name": "Load the ten sample customer profiles", "text": "THE Insurance Sample Data Load SHALL insert customers 1 to 10 into the customer table (`<DB2DBID>.customer`) with their name, date of birth, address and contact details, using a blank (' ') for any absent house name, phone or email", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/5/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e225eae034"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b82442bdbd", "id": "id-b82442bdbd", "name": "Create initial customer credentials", "text": "THE Insurance Sample Data Load SHALL insert a credential for each customer 1 to 10 into the secure customer table (`<DB2DBID>.customer_secure`) with password value '5732fec825535eeafb8fac50fee3a8aa', initial state (`state_indicator`) 'N' and password-change count (`pass_changes`) 0", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/5/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b82442bdbd"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c04650508c", "id": "id-c04650508c", "name": "Register the ten sample policies", "text": "THE Insurance Sample Data Load SHALL insert policies 1 to 10 into the policy table (`<DB2DBID>.policy`) linked to their customers, with type (`policyType`) 'C', 'E', 'H' or 'M', the listed issue and expiry dates, and broker id 0, empty broker reference, payment 0 and commission 0", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/5/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c04650508c"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de9aa8bb49", "id": "id-de9aa8bb49", "name": "Add endowment details for policies 4 and 5", "text": "THE Insurance Sample Data Load SHALL insert endowment details for policy 5 (equities 'N', with-profits 'N', managed fund 'N', fund 'SHEPPA', term 10, sum assured 50000) and policy 4 (equities 'Y', with-profits 'Y', managed fund 'N', fund 'LIONTMR', term 5, sum assured 12500) into the endowment table (`<DB2DBID>.endowment`)", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/5/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de9aa8bb49"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d98e85e843", "id": "id-d98e85e843", "name": "Add house property details", "text": "THE Insurance Sample Data Load SHALL insert property details for policy 6 ('HOUSE', 5 bedrooms, value 1500000), policy 7 ('FARM', 8 bedrooms, value 3750000) and policy 8 ('FLAT', 1 bedroom, value 260000) into the house table (`<DB2DBID>.house`)", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/5/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d98e85e843"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1d505b5bde", "id": "id-1d505b5bde", "name": "Add motor vehicle details", "text": "THE Insurance Sample Data Load SHALL insert vehicle details for policies 1, 3 and 2 into the motor table (`<DB2DBID>.motor`) with the listed make, model, value, registration, colour, engine size, year of manufacture, premium (450, 2850, 700) and accidents (0, 12, 1)", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/5/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1d505b5bde"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3fcf0ce472", "id": "id-3fcf0ce472", "name": "Add commercial property cover details", "text": "THE Insurance Sample Data Load SHALL insert commercial cover for policy 10 ('OFFICES', 'IBM') and policy 9 ('STADIUM', 'Burnley Football Club') into the commercial table (`<DB2DBID>.COMMERCIAL`) with the listed peril ratings and premiums, status 1 and 'ACTIVE'", "program": "db2cre", "priority": "", "link": "../aws/index.html#/c/5/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3fcf0ce472"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a567ca7452", "id": "id-a567ca7452", "name": "Load first data store from input", "text": "WHEN the first preparation step (`DEFINE1`) ended with a return code of 7 or less, or did not run, THE Data Store Load SHALL copy every record from the input data (`DDIN`) into the target store (`DDOUT`); skip the load when `DEFINE1` ended with a return code above 7", "program": "adef121", "priority": "", "link": "../aws/index.html#/c/0/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a567ca7452"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b4b6c0c69", "id": "id-4b4b6c0c69", "name": "Load second data store from input", "text": "WHEN the second preparation step (`DEFINE2`) ended with a return code of 7 or less, or did not run, THE Data Store Load SHALL copy every record from the input data (`DDIN`) into the target store (`DDOUT`); skip the load when `DEFINE2` ended with a return code above 7", "program": "adef121", "priority": "", "link": "../aws/index.html#/c/0/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b4b6c0c69"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83", "id": "id-de5409bb83", "name": "Run workload simulation for GENAPP network", "text": "THE Network Workload Simulation Run SHALL run the simulation program (`ITPENTER`) with parameter `'NTWRK=GENAPP'` for the GENAPP network. Supply the initialization definitions (`INITDD`), the concatenated message definitions (`MSGDD`) and the simulation log data set (`LOGDD`), all in shared mode. Disable automatic logging, and route dumps and printed output to the job output.", "program": "itpentr", "priority": "", "link": "../aws/index.html#/c/7/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-518ac61ce7", "id": "id-518ac61ce7", "name": "Define insurance menu and service transactions", "text": "THE Online Resource Definition Maintenance SHALL define, in group `GENASAT`, transactions `SSC1`\u2192`LGTESTC1`, `SSP1`\u2192`LGTESTP1`, `SSP2`\u2192`LGTESTP2`, `SSP3`\u2192`LGTESTP3`, `SSP4`\u2192`LGTESTP4`, `LGSE`\u2192`LGSETUP`, `LGCF`\u2192`LGICVS01` and `LGPF`\u2192`LGIPVS01`, each with task data located anywhere in storage and in user key", "program": "cdef121", "priority": "", "link": "../aws/index.html#/c/1/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-518ac61ce7"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-53faf2a227", "id": "id-53faf2a227", "name": "Define customer file without online deletion", "text": "THE Online Resource Definition Maintenance SHALL define the customer file (`KSDSCUST`) with 82-byte records and a 10-byte key, enabled and opened on first reference, allowing add, browse, read and update and disallowing delete", "program": "cdef121", "priority": "", "link": "../aws/index.html#/c/1/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-53faf2a227"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9299fedc5c", "id": "id-9299fedc5c", "name": "Define policy file with full maintenance", "text": "THE Online Resource Definition Maintenance SHALL define the policy file (`KSDSPOLY`) with 64-byte records and a 21-byte key, enabled and opened on first reference, allowing add, browse, read, update and delete", "program": "cdef121", "priority": "", "link": "../aws/index.html#/c/1/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9299fedc5c"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5b11dafff", "id": "id-b5b11dafff", "name": "Initialize the WUI server repository", "text": "WHEN no earlier step of the job ended with a return code above 8, THE WUI Server Repository Initialization SHALL run the repository initialization program (`EYU9XDUT`) against the WUI data repository (`EYUDREP`) with parameters 'CMASNAME=<CMASAPPL>', 'DAYLIGHT=N', 'TIMEZONE=B', 'SYSID=<CMASYSID>' and 'ZONEOFFSET=0', supplying the WUI server identification WUIAPPLID=<WUIAPPL>, WUINAME=<WUIAPPL> and WUISYSID=<WUISYSID>, and print a report; skip the step when any earlier step ended with a return code above 8", "program": "defdrep", "priority": "", "link": "../aws/index.html#/c/6/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5b11dafff"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-e37fbdb751", "id": "id-e37fbdb751", "name": "Route new customer security add request", "text": "WHEN the request identifier (`D2-REQUEST-ID`) is `'02ACUS'`, THE Customer Security Registration SHALL convert the customer account number and attempt count to numeric form and insert the new customer's security record", "program": "lgacdb02", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-e37fbdb751"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-2627b01d7d", "id": "id-2627b01d7d", "name": "Insert customer security record", "text": "WHEN a new-customer security add is requested, THE Customer Security Registration SHALL insert the customer number, password, state indicator and password change count into the customer secure table (`CUSTOMER_SECURE`); if the insert fails, write a diagnostic message labelled `' INSERT SECURITY'` and return to the caller", "program": "lgacdb02", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-2627b01d7d"}, {"key": "Unassigned-Programs/id-ad270444d3", "id": "id-ad270444d3", "name": "Replace wui application placeholder", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder `'<WUIAPPL>'` in the edited member with the configured wui application identifier (`WUIAPPL`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-ad270444d3"}, {"key": "Unassigned-Programs/id-bfe61f8ba5", "id": "id-bfe61f8ba5", "name": "Substitute data-owning region application name", "text": "THE Region Placeholder Substitution SHALL replace every occurrence of the placeholder `'<DORAPPL>'` in the edited member with the configured dor region application name (`DORAPPL`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-bfe61f8ba5"}, {"key": "Unassigned-Programs/id-e185d94e4f", "id": "id-e185d94e4f", "name": "Substitute application region name placeholder", "text": "THE Region Placeholder Substitution SHALL replace every occurrence of the placeholder `'<AORAPPL>'` in the edited member with the application-owning region application name (`AORAPPL`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-e185d94e4f"}, {"key": "Unassigned-Programs/id-e8f716bb54", "id": "id-e8f716bb54", "name": "Reject undersized customer request", "text": "WHEN the received request length (`EIBCALEN`) is less than the customer record length (72) plus the header and trailer length (18), THE Customer Inquiry Request Validation SHALL return to the caller without performing the customer lookup", "program": "lgicus01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-e8f716bb54"}, {"key": "Unassigned-Programs/id-814bb285b1", "id": "id-814bb285b1", "name": "Delegate customer lookup to database service", "text": "WHEN a customer inquiry request of sufficient length is received, THE Customer Inquiry Processing SHALL preset the outcome code to success (`'00'`) and the policy count to zero (`'00'`), then delegate to the customer database service (`LGICDB01`) with the full customer request of length 32500", "program": "lgicus01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-814bb285b1"}, {"key": "Unassigned-Programs/id-56e2932a35", "id": "id-56e2932a35", "name": "Default success outcome and policy count", "text": "WHEN a customer inquiry request with non-empty data is received, THE Customer Inquiry Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '00' (success) and the number of policies (`CA-NUM-POLICIES`) to zero", "program": "lgicus01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-56e2932a35"}, {"key": "Unassigned-Programs/id-2f6bccf08c", "id": "id-2f6bccf08c", "name": "Reject request shorter than required length", "text": "IF the received request data length (`EIBCALEN`) is less than the customer record length (72) plus the header/trailer length (18), THEN THE Customer Inquiry Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '98' (request too short) and return to the caller", "program": "lgicus01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-2f6bccf08c"}, {"key": "Unassigned-Programs/id-583019733c", "id": "id-583019733c", "name": "Replace authorization identifier placeholders", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder '<SQLID>' in the edited member with the user's SQL authorization identifier (`SQLID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/28/Unassigned-Programs/id-583019733c"}, {"key": "Unassigned-Programs/id-60d34e16d1", "id": "id-60d34e16d1", "name": "Substitute character-set placeholder everywhere", "text": "THE Environment Placeholder Substitution SHALL replace every occurrence of the placeholder token (`'<DB2CCSID>'`) in the edited member with the configured character-set identifier (`DB2CCSID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/28/Unassigned-Programs/id-60d34e16d1"}, {"key": "Unassigned-Programs/id-4574bba65b", "id": "id-4574bba65b", "name": "Substitute subsystem placeholder in member", "text": "WHEN the member being edited contains the subsystem placeholder (`'<DB2SSID>'`), THE Environment Placeholder Substitution SHALL replace every occurrence of the subsystem placeholder (`'<DB2SSID>'`) in the member with the retrieved subsystem identifier (`DB2SSID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/28/Unassigned-Programs/id-4574bba65b"}, {"key": "Unassigned-Programs/id-6d8b454882", "id": "id-6d8b454882", "name": "Replace database id placeholders in member", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder `'<DB2DBID>'` in the edited member with the configured database id (`DB2DBID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/28/Unassigned-Programs/id-6d8b454882"}, {"key": "Unassigned-Programs/id-8a785521d4", "id": "id-8a785521d4", "name": "Substitute database qualifier placeholders in member", "text": "THE Template Qualifier Substitution SHALL replace every occurrence (`All`) of the placeholder `'<DB2HLQ>'` in the edited member with the installation's database qualifier (`DB2HLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/28/Unassigned-Programs/id-8a785521d4"}, {"key": "Unassigned-Programs/id-915f014b45", "id": "id-915f014b45", "name": "Derive prefixed backup member name", "text": "WHEN the edited member name (`memnme`) is 'ONCICS', or it is any other name, THE Edited Member Backup SHALL set the backup member name to '#' followed by the member name for 'ONCICS', and to '@' followed by the member name for every other member", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/32/Unassigned-Programs/id-915f014b45"}, {"key": "Unassigned-Programs/id-dca7892580", "id": "id-dca7892580", "name": "Save full member content as copy", "text": "THE Edited Member Backup SHALL save all edited lines, from the first line (`.zfirst`) through the last line (`.zlast`), under the prefixed member name (`memnme`), replacing any existing member with that name", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/32/Unassigned-Programs/id-dca7892580"}, {"key": "Unassigned-Programs/id-8f9aeaf815", "id": "id-8f9aeaf815", "name": "Replace run placeholder with configured value", "text": "WHEN the member being edited contains the run-value placeholder (`'<DB2RUN>'`), THE Environment Placeholder Substitution SHALL replace every occurrence of the run-value placeholder (`'<DB2RUN>'`) in the member with the configured run value (`DB2RUN`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/28/Unassigned-Programs/id-8f9aeaf815"}, {"key": "Unassigned-Programs/id-127f8727d6", "id": "id-127f8727d6", "name": "Replace plan placeholder throughout member", "text": "THE Member Environment Tailoring SHALL replace every occurrence of the placeholder (`'<DB2PLAN>'`) in the edited member with the configured plan name (`DB2PLAN`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/28/Unassigned-Programs/id-127f8727d6"}, {"key": "Unassigned-Programs/id-568c3f66e0", "id": "id-568c3f66e0", "name": "Replace customer dataset placeholder throughout member", "text": "THE Environment Placeholder Substitution SHALL replace every occurrence of the placeholder (`'<KSDSCUS>'`) in the edited member with the retrieved customer dataset name (`KSDSCUS`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/30/Unassigned-Programs/id-568c3f66e0"}, {"key": "Unassigned-Programs/id-350de661b9", "id": "id-350de661b9", "name": "Substitute policy dataset placeholder in member", "text": "THE Member Environment Customization SHALL replace every occurrence of the policy dataset placeholder (`'<KSDSPOL>'`) in the edited member with the configured policy dataset name (`KSDSPOL`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/30/Unassigned-Programs/id-350de661b9"}, {"key": "Unassigned-Programs/id-1345eee06e", "id": "id-1345eee06e", "name": "Substitute cmas system identifier placeholder", "text": "THE Member Customisation SHALL replace all occurrences of the placeholder (`'<CMASYSID>'`) in the edited member with the cmas system identifier (`CMASYSID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-1345eee06e"}, {"key": "Unassigned-Programs/id-a7d428dd0e", "id": "id-a7d428dd0e", "name": "Replace source placeholder with environment name", "text": "WHEN the member being edited contains the source placeholder token (`'<SOURCEX>'`), THE Environment Placeholder Substitution SHALL replace every occurrence of the source placeholder (`'<SOURCEX>'`) in the edited member with the environment's source name (`SOURCEX`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/30/Unassigned-Programs/id-a7d428dd0e"}, {"key": "Unassigned-Programs/id-747057b9ce", "id": "id-747057b9ce", "name": "Replace home directory placeholders", "text": "THE Edit Placeholder Substitution SHALL replace every occurrence of the placeholder `'<ZFSHOME>'` in the edited member with the retrieved home directory path (`ZFSHOME`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/29/Unassigned-Programs/id-747057b9ce"}, {"key": "Unassigned-Programs/id-a8ecb7d971", "id": "id-a8ecb7d971", "name": "Substitute message library qualifier placeholder", "text": "WHEN the edited member contains the message library placeholder (`'<PDSMSGS>'`), THE Installation Member Customization SHALL replace every occurrence of the placeholder `'<PDSMSGS>'` in the member with the installation's message dataset qualifier (`WSIMHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-a8ecb7d971"}, {"key": "Unassigned-Programs/id-474ef470cf", "id": "id-474ef470cf", "name": "Replace library placeholder with installation name", "text": "THE Member Installation Customization SHALL replace every occurrence of the placeholder '<DBRMLIX>' in the edited member with the installation library name (`DBRMLIX`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/30/Unassigned-Programs/id-474ef470cf"}, {"key": "Unassigned-Programs/id-282632bc53", "id": "id-282632bc53", "name": "Substitute transaction-server prefix placeholders", "text": "THE Installation Prefix Customization SHALL replace every occurrence of the placeholder (`'<CICSHLQ>'`) in the edited member with the configured transaction-server library prefix (`CICSHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/29/Unassigned-Programs/id-282632bc53"}, {"key": "Unassigned-Programs/id-01c935caf0", "id": "id-01c935caf0", "name": "Substitute management-component prefix placeholder", "text": "THE Installation Member Customization SHALL replace every occurrence of the placeholder (`'<CPSMHLQ>'`) in the edited member with the installation's management-component prefix (`CPSMHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/29/Unassigned-Programs/id-01c935caf0"}, {"key": "Unassigned-Programs/id-6373fd3a5c", "id": "id-6373fd3a5c", "name": "Substitute licence placeholder in member", "text": "THE Installation Member Tailoring SHALL replace every occurrence of the placeholder `'<CICSLIC>'` in the edited member with the installation licence value (`CICSLIC`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/29/Unassigned-Programs/id-6373fd3a5c"}, {"key": "Unassigned-Programs/id-cfbc2cd5e5", "id": "id-cfbc2cd5e5", "name": "Substitute COBOL library qualifier placeholders", "text": "THE Installation Profile Customization SHALL replace every occurrence of the placeholder token (`'<COBOLHLQ>'`) in the edited member with the installation's COBOL library qualifier (`COBOLHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/29/Unassigned-Programs/id-cfbc2cd5e5"}, {"key": "Unassigned-Programs/id-0d18fc6282", "id": "id-0d18fc6282", "name": "Replace map copybook placeholder throughout member", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder '<MAPCOPX>' in the edited member with the configured map copybook library value (`MAPCOPX`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/30/Unassigned-Programs/id-0d18fc6282"}, {"key": "Unassigned-Programs/id-a061dee088", "id": "id-a061dee088", "name": "Replace log placeholder with configured qualifier", "text": "THE Member Log Qualifier Customization SHALL replace every occurrence of the log placeholder (`'<WSIMLOG>'`) in the edited member with the configured qualifier (`WSIMHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-a061dee088"}, {"key": "Unassigned-Programs/id-35b2fbf764", "id": "id-35b2fbf764", "name": "Replace load library placeholder in member", "text": "WHEN the member being edited contains the load library placeholder `'<LOADX>'`, THE Environment Placeholder Tailoring SHALL replace every occurrence of the placeholder `'<LOADX>'` in the member with the environment's load library name (`LOADX`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/30/Unassigned-Programs/id-35b2fbf764"}, {"key": "Unassigned-Programs/id-a60a495b84", "id": "id-a60a495b84", "name": "Replace placeholder with installation qualifier", "text": "THE Member Placeholder Customization SHALL replace every occurrence of the placeholder `'<PDSDBRM>'` in the edited member with the installation dataset-name qualifier (`WSIMHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-a60a495b84"}, {"key": "Unassigned-Programs/id-28207abe49", "id": "id-28207abe49", "name": "Replace wui system identifier placeholder", "text": "THE Member Customization SHALL replace every occurrence of the placeholder token (`'<WUISYSID>'`) in the edited member with the configured wui system identifier (`WUISYSID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-28207abe49"}, {"key": "Unassigned-Programs/id-763e9efe57", "id": "id-763e9efe57", "name": "Substitute placeholder with simulator qualifier", "text": "THE Member Customization Edit SHALL replace every occurrence of the placeholder (`'<PDSMACP>'`) in the edited member with the wsim high-level qualifier (`WSIMHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-763e9efe57"}, {"key": "Unassigned-Programs/id-88d97fc72a", "id": "id-88d97fc72a", "name": "Replace user qualifier placeholders in member", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder `'<USRHLQ>'` in the edited member with the installation's user qualifier value (`USRHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/29/Unassigned-Programs/id-88d97fc72a"}, {"key": "Unassigned-Programs/id-40f2581ad1", "id": "id-40f2581ad1", "name": "Replace WSIM qualifier placeholder throughout member", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder '<WSIMHLQ>' in the edited member with the retrieved WSIM high-level qualifier (`WSIMHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-40f2581ad1"}, {"key": "Unassigned-Programs/id-bfbf399a94", "id": "id-bfbf399a94", "name": "Replace load-library placeholder with qualifier", "text": "THE Member Tailoring SHALL replace every occurrence of the placeholder '<PDSLOAD>' in the edited member with the installation's dataset-name qualifier (`WSIMHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-bfbf399a94"}, {"key": "Unassigned-Programs/id-311bbac9af", "id": "id-311bbac9af", "name": "Process the selected input member", "text": "THE Member Processing Run SHALL run the program (`ITPSTL`) for the input member (`WSC1A1`). The program reads the selected member (`SYSIN`) of the source library `<WSIMWSX>`, the source library (`SYSLIB`) and the message library (`MSGDD`, `<WSIMMSX>`), all in shared mode, and writes its report and sequential output to the job's printed output.", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-311bbac9af"}, {"key": "Unassigned-Programs/id-b0da322e79", "id": "id-b0da322e79", "name": "Reject invocation without request data", "text": "IF the program is invoked with a request data length (`EIBCALEN`) of zero, THEN THE Customer Inquiry Request Validation SHALL set the error text (`EM-VARIABLE`) to ' NO COMMAREA RECEIVED', record the error message, and terminate abnormally with abend code 'LGCA' without a dump", "program": "lgicus01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-b0da322e79"}, {"key": "Unassigned-Programs/id-bd70b90288", "id": "id-bd70b90288", "name": "Substitute cmas application name placeholder", "text": "THE Member Customisation SHALL replace every occurrence of the placeholder '<CMASAPPL>' in the edited member with the cmas application name (`CMASAPPL`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-bd70b90288"}, {"key": "Unassigned-Programs/id-4f40703a28", "id": "id-4f40703a28", "name": "Substitute tor system identifier placeholders", "text": "THE Region Identifier Substitution SHALL replace every occurrence of the placeholder `'<TORSYSID>'` in the edited member with the tor system identifier (`TORSYSID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-4f40703a28"}, {"key": "Unassigned-Programs/id-c141bb3a5e", "id": "id-c141bb3a5e", "name": "Substitute data region system identifier", "text": "THE Region Placeholder Substitution SHALL replace every occurrence of the placeholder (`'<DORSYSID>'`) in the edited member with the configured dor system identifier (`DORSYSID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-c141bb3a5e"}, {"key": "Unassigned-Programs/id-d9ab051015", "id": "id-d9ab051015", "name": "Replace tor application placeholder in member", "text": "THE Region Placeholder Substitution SHALL replace every occurrence of the placeholder `'<TORAPPL>'` in the edited member with the configured tor region application identifier (`TORAPPL`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-d9ab051015"}, {"key": "Unassigned-Programs/id-992f126c38", "id": "id-992f126c38", "name": "Substitute application-region system identifier placeholders", "text": "THE Member Region Configuration SHALL replace every occurrence of the placeholder '<AORSYSID>' in the edited member with the application-region system identifier (`AORSYSID`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/27/Unassigned-Programs/id-992f126c38"}, {"key": "Unassigned-Programs/id-37ba6f4bc5", "id": "id-37ba6f4bc5", "name": "Replace runtime qualifier placeholders", "text": "THE Member Qualifier Tailoring SHALL replace all occurrences of the placeholder '<CEEHLQ>' in the edited member with the runtime-library qualifier (`CEEHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/29/Unassigned-Programs/id-37ba6f4bc5"}, {"key": "Unassigned-Programs/id-71e8991ac6", "id": "id-71e8991ac6", "name": "Process script member SSP4I1", "text": "THE Script Member Processing Run SHALL run the program (`ITPSTL`) for member `SSP4I1`, reading that member from the script library (`<WSIMWSX>`), referencing the full script library (`SYSLIB`) and the message library (`<WSIMMSX>`) under shared read access, and routing the printed listing and sequential output to the job's printed output, using a temporary work area that is not kept (physical stores: `MSGDD`, `SYSIN`)", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-71e8991ac6"}, {"key": "Unassigned-Programs/id-fa6db79486", "id": "id-fa6db79486", "name": "Process script member SSP3D1", "text": "THE Script Member Processing Run SHALL run the program `ITPSTL` for the member `SSP3D1`, which it reads from the script library (`SYSIN`, `<WSIMWSX>`); give it shared read access to the script library (`SYSLIB`) and the message library (`MSGDD`, `<WSIMMSX>`); and send its listing and sequential output (`SEQOUT`) to the job's printed output", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-fa6db79486"}, {"key": "Unassigned-Programs/id-04bc2b95d6", "id": "id-04bc2b95d6", "name": "Process script member SSP3I1", "text": "THE Script Member Processing Run SHALL run the program `ITPSTL` for script member `SSP3I1`, reading that member of the script library (`<WSIMWSX>`) as control input (`SYSIN`), the full script library (`SYSLIB`) and the message library (`<WSIMMSX>`, via `MSGDD`), all in shared mode. Write the printed report and the sequential output (`SEQOUT`) to the job's printed output, using a temporary work file.", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-04bc2b95d6"}, {"key": "Unassigned-Programs/id-3f6d5bf7e2", "id": "id-3f6d5bf7e2", "name": "Run program for member SSP4A1", "text": "THE Script Member Processing Run SHALL run the program `ITPSTL` for the member `SSP4A1`, reading that member from the shared source library (`SYSIN`), with the same library as a shared reference library (`SYSLIB`) and the shared message library (`MSGDD`) also available, and routing its listing and sequential output to printed output, with a temporary work area that is not retained", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-3f6d5bf7e2"}, {"key": "Unassigned-Programs/id-7178b11155", "id": "id-7178b11155", "name": "Process script member SSP3A1", "text": "THE Script Member Processing Run SHALL run the program (`ITPSTL`) for member `SSP3A1`. Its inputs are that member of the source library (`SYSIN`), the source library itself (`SYSLIB`) and the message library (`MSGDD`), all shared for reading. It gets a temporary work area and sends its listing and sequential output to the job's output.", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-7178b11155"}, {"key": "Unassigned-Programs/id-42adec0b69", "id": "id-42adec0b69", "name": "Process source member SSP4D1", "text": "THE Source Member Processing Run SHALL run the program `ITPSTL` for the member (`MEM`) `SSP4D1`. It reads that member from the source library (`<WSIMWSX>`) through the input store (`SYSIN`), with shared access to the same library through the library store (`SYSLIB`) and to the message library (`<WSIMMSX>`) through the message store (`MSGDD`). It writes its listing and its sequential output to the job's print output, using a temporary work file during the step.", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-42adec0b69"}, {"key": "Unassigned-Programs/id-bdf3a1b769", "id": "id-bdf3a1b769", "name": "Process script member WSC1I1", "text": "THE Script Member Processing Run SHALL run the program `ITPSTL` for the member WSC1I1 (`WSC1I1`), reading it from the shared source library (`SYSIN`, `<WSIMWSX>`), with that library as the reference library (`SYSLIB`) and the shared message library (`MSGDD`, `<WSIMMSX>`) as further input, and write a printed listing and a sequential output report to the job's printed output", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-bdf3a1b769"}, {"key": "Unassigned-Programs/id-2e3d10e40b", "id": "id-2e3d10e40b", "name": "Process script member SSP1U1", "text": "THE Script Member Processing Run SHALL run `ITPSTL` for script member SSP1U1, reading that member from the script library (`SYSIN`), the script library as include library (`SYSLIB`) and the message library (`MSGDD`), all in shared read mode, and write the listing and sequential output (`SEQOUT`) to printed job output using a temporary work file", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-2e3d10e40b"}, {"key": "Unassigned-Programs/id-1d7aa2cf0f", "id": "id-1d7aa2cf0f", "name": "Process script member SSC1I1", "text": "THE Script Member Processing Run SHALL run the program (`ITPSTL`) for script member `SSC1I1`, read from the shared script library (`SYSIN`, `<WSIMWSX>`), with the full script library (`SYSLIB`) and the message library (`MSGDD`, `<WSIMMSX>`) available read-only, using a temporary work area and sending its listing and sequential output (`SEQOUT`) to printed job output", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-1d7aa2cf0f"}, {"key": "Unassigned-Programs/id-347a5f9ccd", "id": "id-347a5f9ccd", "name": "Run the script processor for member SSC1A1", "text": "THE Script Member Processing SHALL run the program `ITPSTL` for the input member SSC1A1 (`MEM`). Read the member from the script library (`<WSIMWSX>`), the script library as a reference source, and the message library (`<WSIMMSX>`), all shared for reading. Write its listing and sequential output (`SEQOUT`) to the job's printed output, and use a temporary work file that is not retained. (physical stores: `MSGDD`, `SYSIN`, `SYSLIB`)", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-347a5f9ccd"}, {"key": "Unassigned-Programs/id-8c03623fa1", "id": "id-8c03623fa1", "name": "Process the selected script member", "text": "THE Script Member Processing SHALL run the program `ITPSTL` for the script member `#SSVARS`, reading it from the script library (`SYSIN`, `<WSIMWSX>`), with shared access to the same library for other members (`SYSLIB`) and to the message library (`MSGDD`, `<WSIMMSX>`), and send its listing and sequential output to the job's print output", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-8c03623fa1"}, {"key": "Unassigned-Programs/id-72cc3177a5", "id": "id-72cc3177a5", "name": "Process the STOP script member", "text": "THE Simulation Script Processing SHALL run the program `ITPSTL` with the script member `'STOP'` from the shared script library (`SYSIN`, `<WSIMWSX>`), the same library as reference input (`SYSLIB`) and the shared message library (`MSGDD`, `<WSIMMSX>`), all read under shared access, writing the program's listing and sequential output to printed output.", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-72cc3177a5"}, {"key": "Unassigned-Programs/id-d5b6800145", "id": "id-d5b6800145", "name": "Run script processor for member SSP1I1", "text": "THE Simulation Script Processing SHALL run the program `ITPSTL` for script member SSP1I1, reading the selected member (`SYSIN`), the script library (`SYSLIB`) and the message definitions (`MSGDD`) in shared mode, using a temporary work file, and writing its listing and sequential output to the job's spooled output", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-d5b6800145"}, {"key": "Unassigned-Programs/id-154c4fc9a6", "id": "id-154c4fc9a6", "name": "Run the script processor for member SSP1A1", "text": "THE Simulation Script Processing SHALL run the program `ITPSTL` for script member `SSP1A1`, reading that member of the script library (`<WSIMWSX>`) as its control input, the script library as a reference library (`SYSLIB`) and the message library (`MSGDD`), all shared, and writing its listing and sequential output (`SEQOUT`) to the job's print output using a temporary work dataset (physical stores: `SYSIN`)", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-154c4fc9a6"}, {"key": "Unassigned-Programs/id-fc1b9b016e", "id": "id-fc1b9b016e", "name": "Process script member SSP2U1 with ITPSTL", "text": "THE Simulation Script Member Processing SHALL run the program (`ITPSTL`) for member `'SSP2U1'`: read its input statements (`SYSIN`) from member `SSP2U1` of the source library `<WSIMWSX>`, read the reference library (`SYSLIB`) `<WSIMWSX>` and the message library (`MSGDD`) `<WSIMMSX>` in shared mode, and send the run listing and sequential output report to printed output, using a temporary work file", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-fc1b9b016e"}, {"key": "Unassigned-Programs/id-6cd98fe8c3", "id": "id-6cd98fe8c3", "name": "Process script member SSP2A1", "text": "THE Simulation Script Translation Run SHALL run `ITPSTL` for the script member `SSP2A1` (`MEM`), with the following inputs and outputs:\n- reads the member from the script library (`SYSIN`, `<WSIMWSX>`) with shared read access;\n- reads the same library as the reference library (`SYSLIB`);\n- reads the message library (`MSGDD`, `<WSIMMSX>`);\n- uses a temporary work area that is not retained;\n- writes its listing and its sequential output to the job's printed output.", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-6cd98fe8c3"}, {"key": "Unassigned-Programs/id-e48e8f3bea", "id": "id-e48e8f3bea", "name": "Run script processor for member SSP2I1", "text": "THE Simulation Script Preparation SHALL run `ITPSTL` against the SSP2I1 member (`SSP2I1`) of the script source library (`SYSIN`), reading the full script library (`SYSLIB`) and the message library (`MSGDD`) in shared mode, and write its listing and sequential output (`SEQOUT`) to the printed job output", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-e48e8f3bea"}, {"key": "Unassigned-Programs/id-74616d0b36", "id": "id-74616d0b36", "name": "Run script processor for member SSP2D1", "text": "THE Simulation Script Preparation SHALL run `ITPSTL` for the script member `SSP2D1` (`MEM`), reading that member from the script library (`<WSIMWSX>`), the script library itself for referenced members, and the message library (`<WSIMMSX>`) under shared access, writing its print and sequential output (`SEQOUT`) to the job's output listing, and using a temporary work area (physical stores: `MSGDD`, `SYSIN`, `SYSLIB`)", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-74616d0b36"}, {"key": "Unassigned-Programs/id-dcc500dc69", "id": "id-dcc500dc69", "name": "Run the processor for member SSP1D1", "text": "THE Simulation Script Processing SHALL run the program `ITPSTL` for member `SSP1D1`, reading the selected source member (`SYSIN`), the source library (`SYSLIB`) and the message library (`MSGDD`) with shared access, writing its listing and sequential output to the job's default output class, and using a temporary work file", "program": "itpstl", "priority": "", "link": "../aws/index.html#/c/36/Unassigned-Programs/id-dcc500dc69"}, {"key": "Unassigned-Programs/id-218fbdb3cd", "id": "id-218fbdb3cd", "name": "Replace simulator placeholder throughout member", "text": "THE Member Customization Edit SHALL replace every occurrence of the placeholder token '<WSIMSTL>' in the edited member with the simulator high-level qualifier (`WSIMHLQ`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-218fbdb3cd"}, {"key": "Unassigned-Programs/id-d3608be146", "id": "id-d3608be146", "name": "Produce the simulator log listing", "text": "THE Simulator Log Listing SHALL run the log-list program (`ITPLL`) over the simulator log dataset (`<WSIMLGX>`) in shared read mode, passing the options console entries (`CNSL`), SNA formatting (`FMTSNA`), display entries (`DSPLY`), record data (`DATA`), run (`RUN`) and end of input (`END`), and send the resulting listing to the print output (physical store: `SYSUT1`)", "program": "itpll", "priority": "", "link": "../aws/index.html#/c/37/Unassigned-Programs/id-d3608be146"}, {"key": "Unassigned-Programs/id-db1e65fdd4", "id": "id-db1e65fdd4", "name": "Replace CSD name placeholder", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder `'<CSDNAME>'` in the edited member with the retrieved CSD name (`CSDNAME`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/28/Unassigned-Programs/id-db1e65fdd4"}, {"key": "Unassigned-Programs/id-c3be49b60b", "id": "id-c3be49b60b", "name": "Replace all placeholder tokens in member", "text": "THE Template Placeholder Substitution SHALL replace every occurrence of the placeholder '<WSIMLGX>' in the edited member with the substitution value (`WSIMLGX`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-c3be49b60b"}, {"key": "Unassigned-Programs/id-952415f9c3", "id": "id-952415f9c3", "name": "Replace placeholder with session value", "text": "THE Template Placeholder Substitution SHALL replace all occurrences of the placeholder '<WSIMMSX>' in the edited data with the session replacement value (`WSIMMSX`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-952415f9c3"}, {"key": "Unassigned-Programs/id-80dfc9c464", "id": "id-80dfc9c464", "name": "Replace placeholder throughout edited member", "text": "WHEN the member being edited contains the placeholder '<WSIMWSX>', THE Template Placeholder Substitution SHALL replace every occurrence of the placeholder `'<WSIMWSX>'` in the member with the retrieved substitution value (`WSIMWSX`)", "program": "mac1", "priority": "", "link": "../aws/index.html#/c/31/Unassigned-Programs/id-80dfc9c464"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-e3ca9c3d19", "id": "id-e3ca9c3d19", "name": "Generate the endowment policy web service", "text": "THE Commercial Policy Add Service Exposure SHALL run the web service generation procedure for the Commercial Policy add program (`PGMNAME` = `LGAPOL01`, language `COBOL`). Use the request and response structures from member `SOAIPB1` (`REQMEM`, `RESPMEM`) in the source library (`PDSLIB` = `<SOURCEX>`), the invocation address (`URI`) `GENAPP/LGAPOLB1` and the data-passing mechanism (`PGMINT`) `COMMAREA`. Direct the web service binding (`WSBIND`) and the service description (`WSDL`) to the genapp web service directory, and the log (`LOGFILE`) to `<ZFSHOME>/genapp/logs/LS2WS_LGAPOLB1.LOG`. Use the Java directory `'java601_bit64_ga/J6.0.1_64'`, the assistant directory `'cics660'`, an empty path prefix, the temporary directory `'/tmp'`, the temporary file prefix `'LS2WS'` and the proxy `PROXY.HURSLEY.IBM.COM:80`.", "program": "wsaap01", "priority": "", "link": "../aws/index.html#/c/39/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-e3ca9c3d19"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-82bf62367f", "id": "id-82bf62367f", "name": "Generate the endowment policy web service", "text": "THE Endowment Policy Web Service Publication SHALL run the web services assistant to expose the add-policy program (`PGMNAME`) `LGAPOL01` at the address (`URI`) `GENAPP/LGAPOLE1`. The request and response layouts come from member `SOAIPE1` (`REQMEM`, `RESPMEM`), written in `COBOL` (`LANG`), with a `COMMAREA` program interface (`PGMINT`). The binding file (`WSBIND`) and the service description (`WSDL`) are written under `<ZFSHOME>/genapp/wsdir/`, and the generation log (`LOGFILE`) is written to `<ZFSHOME>/genapp/logs/LS2WS_LGAPOLE1.LOG`.", "program": "wsaap01", "priority": "", "link": "../aws/index.html#/c/39/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-82bf62367f"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-3d3d6279c1", "id": "id-3d3d6279c1", "name": "Generate the endowment policy web service", "text": "THE House Policy Web Service Publication SHALL run the web service generation procedure for the House Policy add program (`LGAPOL01`). It uses the request and response structures (`SOAIPH1`) from the source library (`PDSLIB`) `<SOURCEX>`, in language `COBOL`, with a `COMMAREA` program interface (`PGMINT`), at the address (`URI`) `GENAPP/LGAPOLH1`, through proxy `PROXY.HURSLEY.IBM.COM:80`. It directs the binding (`WSBIND`) and service description (`WSDL`) outputs to `<ZFSHOME>/genapp/wsdir/` with prefix `LGAPOLH1`, and the generation log (`LOGFILE`) to `<ZFSHOME>/genapp/logs/LS2WS_LGAPOLH1.LOG`. It runs with Java runtime `'java601_bit64_ga/J6.0.1_64'`, CICS directory `'cics660'`, path prefix `''`, temporary directory `'/tmp'` and work-file prefix `'LS2WS'`.", "program": "wsaap01", "priority": "", "link": "../aws/index.html#/c/39/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-3d3d6279c1"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-85e21b6831", "id": "id-85e21b6831", "name": "Generate the Motor Policy add web service artifacts", "text": "THE Motor Policy Web Service Generation SHALL run the web service generation procedure for the Motor Policy add program (`PGMNAME`) `LGAPOL01` with language (`LANG`) `COBOL`. Supply the request (`REQMEM`) and response (`RESPMEM`) copybook member `SOAIPM1` from the source library (`PDSLIB`) `<SOURCEX>`, communication-area data passing (`PGMINT`) `COMMAREA`, the URI (`URI`) `GENAPP/LGAPOLM1` and the HTTP proxy (`HTTPPROXY`) `PROXY.HURSLEY.IBM.COM:80`. Direct the binding file (`WSBIND`) to `<ZFSHOME>/genapp/wsdir/LGAPOLM1.MotorPolicyWebServiceGeneration.ws_bind`, the WSDL description (`WSDL`) to `<ZFSHOME>/genapp/wsdir/LGAPOLM1.MotorPolicyWebServiceGeneration.wsdl` and the log (`LOGFILE`) to `<ZFSHOME>/genapp/logs/LS2WS_LGAPOLM1.LOG`.", "program": "wsaap01", "priority": "", "link": "../aws/index.html#/c/39/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-85e21b6831"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84", "id": "id-0721910d84", "name": "Generate customer add web service artifacts", "text": "THE Customer Web Service Generation SHALL Run the web services assistant with the following inputs:\n- Java runtime directory (`JAVADIR`) `'java601_bit64_ga/J6.0.1_64'`;\n- CICS installation directory (`USSDIR`) `'cics660'`;\n- empty path prefix (`PATHPREF`);\n- temporary directory (`TMPDIR`) `'/tmp'` and temporary file name (`TMPFILE`) `'LS2WS'`;\n- the request to expose the COBOL (`LANG`) program `LGACUS01` (`PGMNAME`), using request and response structures from member `SOAIC01` (`REQMEM`, `RESPMEM`) in library `<SOURCEX>` (`PDSLIB`);\n- the relative URI `GENAPP/LGACUS01` (`URI`) and data passed by `COMMAREA` (`PGMINT`);\n- the binding file (`WSBIND`) and service description (`WSDL`) written under `<ZFSHOME>/genapp/wsdir/LGACUS01`;\n- the log written to `<ZFSHOME>/genapp/logs/LS2WS_LGACUS01.LOG` (`LOGFILE`);\n- the proxy `PROXY.HURSLEY.IBM.COM:80` (`HTTPPROXY`).", "program": "wsaac01", "priority": "", "link": "../aws/index.html#/c/38/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0a2d9e9d61", "id": "id-0a2d9e9d61", "name": "Generate customer inquiry web service artifacts", "text": "THE Customer Inquiry Web Service Generation SHALL run the web service generation procedure. The runtime settings passed are: Java directory (`JAVADIR`) 'java601_bit64_ga/J6.0.1_64', installation directory (`USSDIR`) 'cics660', empty path prefix (`PATHPREF`) '', temporary directory (`TMPDIR`) '/tmp' and temporary file prefix (`TMPFILE`) 'LS2WS'. The control parameters passed expose the COBOL (`LANG`) program `LGICUS01` (`PGMNAME`) through a `COMMAREA` interface (`PGMINT`), with request and response structures `SOAIC01` (`REQMEM`, `RESPMEM`) from library (`PDSLIB`) <SOURCEX>. The service is placed at relative address `GENAPP/LGICUS01` (`URI`), using proxy (`HTTPPROXY`) PROXY.HURSLEY.IBM.COM:80. The binding file (`WSBIND`) and service description (`WSDL`) are named under <ZFSHOME>/genapp/wsdir/, and the generation log (`LOGFILE`) is <ZFSHOME>/genapp/logs/LS2WS_LGICUS01.LOG.", "program": "wsaic01", "priority": "", "link": "../aws/index.html#/c/40/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0a2d9e9d61"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-f5c3dbd5c6", "id": "id-f5c3dbd5c6", "name": "Generate web service binding and WSDL", "text": "THE Web Service Publication SHALL run the web service generation procedure for program `LGICVS01` (`PGMNAME`). The request gives the COBOL (`LANG`) request structure `SOAVCII` (`REQMEM`) and response structure `SOAVCIO` (`RESPMEM`) from the source library (`PDSLIB`) `<SOURCEX>`. It sets the program interface (`PGMINT`) to `COMMAREA`, the service address (`URI`) to `GENAPP/LGICVS01` and the proxy (`HTTPPROXY`) to `PROXY.HURSLEY.IBM.COM:80`. It uses Java runtime `'java601_bit64_ga/J6.0.1_64'` (`JAVADIR`), CICS directory `'cics660'` (`USSDIR`), an empty path prefix (`PATHPREF`), temporary directory `'/tmp'` (`TMPDIR`) and temporary file prefix `'LS2WS'` (`TMPFILE`). It requests a web service binding (`WSBIND`) and a WSDL document (`WSDL`) for `LGICVS01` under `<ZFSHOME>/genapp/wsdir/`, logged to `<ZFSHOME>/genapp/logs/LS2WS_LGICVS01.LOG` (`LOGFILE`).", "program": "wsavc01", "priority": "", "link": "../aws/index.html#/c/44/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-f5c3dbd5c6"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-93e63b34b7", "id": "id-93e63b34b7", "name": "Generate customer update web service artifacts", "text": "THE Customer Update Web Service Enablement SHALL run the web service generation procedure for the customer update program (`PGMNAME` = `'LGUCUS01'`) with these inputs: Java directory `'java601_bit64_ga/J6.0.1_64'` (`JAVADIR`), installation directory `'cics660'` (`USSDIR`), empty path prefix (`PATHPREF`), temporary directory `'/tmp'` (`TMPDIR`) and temporary file prefix `'LS2WS'` (`TMPFILE`); the `'COBOL'` (`LANG`) request and response copybook `'SOAIC01'` (`REQMEM`, `RESPMEM`) from the source library (`PDSLIB`); the service URI `'GENAPP/LGUCUS01'` (`URI`); communication-area data passing (`PGMINT` = `'COMMAREA'`); the proxy `'PROXY.HURSLEY.IBM.COM:80'` (`HTTPPROXY`). It requests the binding file (`WSBIND`) and the WSDL description (`WSDL`) under `<ZFSHOME>/genapp/wsdir/`, with a run log (`LOGFILE`) under `<ZFSHOME>/genapp/logs/`.", "program": "wsauc01", "priority": "", "link": "../aws/index.html#/c/42/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-93e63b34b7"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-4d40358c6a", "id": "id-4d40358c6a", "name": "Generate commercial policy inquiry web service", "text": "THE Commercial Policy Inquiry Web Service Generation SHALL run the web service generation procedure for the commercial policy inquiry program (`LGIPOL01`). It uses the COBOL (`LANG` = `COBOL`) request and response structures from member `SOAIPB1` in source library `<SOURCEX>`, the `COMMAREA` program interface (`PGMINT`) and publishing URI `GENAPP/LGIPOLB1`. It names as outputs the binding file (`WSBIND`) `<ZFSHOME>/genapp/wsdir/LGIPOLB1.WebServiceGenerationParameters.ws_bind`, the service description (`WSDL`) `<ZFSHOME>/genapp/wsdir/LGIPOLB1.WebServiceGenerationParameters.wsdl` and the log (`LOGFILE`) `<ZFSHOME>/genapp/logs/LS2WS_LGIPOLB1.LOG`. It runs with Java directory `'java601_bit64_ga/J6.0.1_64'`, CICS directory `'cics660'`, temporary directory `'/tmp'`, temporary file prefix `'LS2WS'` and proxy `PROXY.HURSLEY.IBM.COM:80`.", "program": "wsaip01", "priority": "", "link": "../aws/index.html#/c/41/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-4d40358c6a"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-3d3ef091b0", "id": "id-3d3ef091b0", "name": "Generate endowment policy inquiry web service artifacts", "text": "THE Policy Inquiry Web Service Publication SHALL run the web service generation procedure for the policy inquiry program (`PGMNAME` = `LGIPOL01`), using: the Java runtime (`JAVADIR`) `'java601_bit64_ga/J6.0.1_64'`; the installation directory (`USSDIR`) `'cics660'`; an empty path prefix (`PATHPREF`); the temporary directory (`TMPDIR`) `'/tmp'` and file (`TMPFILE`) `'LS2WS'`; the source library (`PDSLIB`) `<SOURCEX>`; the language (`LANG`) `COBOL`; the request and response structures (`REQMEM`, `RESPMEM`) `SOAIPE1`; the interface (`PGMINT`) `COMMAREA`; the URI (`URI`) `GENAPP/LGIPOLE1`; and the proxy (`HTTPPROXY`) `PROXY.HURSLEY.IBM.COM:80`. Direct the binding file (`WSBIND`), the WSDL description (`WSDL`) and the generation log (`LOGFILE`) to their genapp paths.", "program": "wsaip01", "priority": "", "link": "../aws/index.html#/c/41/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-3d3ef091b0"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0c53585966", "id": "id-0c53585966", "name": "Generate House Policy inquiry web service", "text": "THE House Policy Web Service Publication SHALL run the web service generation procedure (`DFHLS2WS`) for the House Policy inquiry program (`PGMNAME` = LGIPOL01), using the COBOL (`LANG`) request and response structures in member SOAIPH1 (`REQMEM`, `RESPMEM`) from library <SOURCEX> (`PDSLIB`). Configure the service to pass data via COMMAREA (`PGMINT`) at URI GENAPP/LGIPOLH1 (`URI`). Direct the binding file (`WSBIND`) and service description (`WSDL`) to <ZFSHOME>/genapp/wsdir/LGIPOLH1 paths, log to <ZFSHOME>/genapp/logs/LS2WS_LGIPOLH1.LOG (`LOGFILE`) and use proxy PROXY.HURSLEY.IBM.COM:80 (`HTTPPROXY`).", "program": "wsaip01", "priority": "", "link": "../aws/index.html#/c/41/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0c53585966"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-af156effe0", "id": "id-af156effe0", "name": "Generate the policy inquiry service binding and WSDL", "text": "THE Policy Inquiry Web Service Publication SHALL request generation of a web service for the policy inquiry program (`IPPROGMB`) with these settings: COBOL (`LANG` = 'COBOL') request structure member (`REQMEM`) 'POLLOOK' and response structure member (`RESPMEM`) 'POLLOO2' from the library (`PDSLIB`) '<SOURCEX>'; communication-area interface (`PGMINT` = 'COMMAREA'); endpoint path (`URI`) 'GENAPP/LGIPOL02'; outputs of a binding file (`WSBIND`) and a WSDL (`WSDL`) under '<ZFSHOME>/genapp/wsdir/LGIPOL02'; a log at '<ZFSHOME>/genapp/logs/LS2WS_LGIPOL02.LOG'; and the HTTP proxy (`HTTPPROXY`) 'PROXY.HURSLEY.IBM.COM:80'", "program": "wsaip01", "priority": "", "link": "../aws/index.html#/c/41/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-af156effe0"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-b604974fe0", "id": "id-b604974fe0", "name": "Generate the policy inquiry web service definition", "text": "THE Policy Inquiry Web Service Generation SHALL request generation of a web service for program `LGIPOL01` (`PGMNAME`) using COBOL (`LANG`) structures from member `SOAIPM1` (`REQMEM`, `RESPMEM`) of library `<SOURCEX>` (`PDSLIB`), with communication-area interface `COMMAREA` (`PGMINT`) and publication at `GENAPP/LGIPOLM1` (`URI`); the binding is to be written to `<ZFSHOME>/genapp/wsdir/LGIPOLM1.WebServiceGenerationParameters.ws_bind` (`WSBIND`), the service description to `<ZFSHOME>/genapp/wsdir/LGIPOLM1.WebServiceGenerationParameters.wsdl` (`WSDL`), and the log to `<ZFSHOME>/genapp/logs/LS2WS_LGIPOLM1.LOG` (`LOGFILE`), via proxy `PROXY.HURSLEY.IBM.COM:80` (`HTTPPROXY`)", "program": "wsaip01", "priority": "", "link": "../aws/index.html#/c/41/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-b604974fe0"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38", "id": "id-bc305a2e38", "name": "Generate web service binding and WSDL", "text": "THE Web Service Publication SHALL run the web service generation procedure for the program (`PGMNAME`) `LGIPVS01`. Supply the `COBOL` (`LANG`) request member `SOAVPII` (`REQMEM`) and response member `SOAVPIO` (`RESPMEM`) from library (`PDSLIB`) `<SOURCEX>`, the address (`URI`) `GENAPP/LGIPVS01` and the program interface (`PGMINT`) `COMMAREA`. Direct the binding file (`WSBIND`) to `<ZFSHOME>/genapp/wsdir/LGIPVS01.WebServiceGenerationInput.ws_bind`, the WSDL (`WSDL`) to `<ZFSHOME>/genapp/wsdir/LGIPVS01.WebServiceGenerationInput.wsdl` and the log (`LOGFILE`) to `<ZFSHOME>/genapp/logs/LS2WS_LGIPVS01.LOG`, using the proxy (`HTTPPROXY`) `PROXY.HURSLEY.IBM.COM:80`.", "program": "wsavp01", "priority": "", "link": "../aws/index.html#/c/45/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-f654fb99f7", "id": "id-f654fb99f7", "name": "Generate the policy update web service", "text": "THE Endowment Policy Web Service Generation SHALL run the web service generation procedure for the policy update program (`PGMNAME` = `LGUPOL01`), with:\n- Java directory (`JAVADIR`) `'java601_bit64_ga/J6.0.1_64'`, installation directory (`USSDIR`) `'cics660'`, empty path prefix (`PATHPREF`)\n- temporary directory (`TMPDIR`) `'/tmp'` and temporary file (`TMPFILE`) `'LS2WS'`\n- COBOL (`LANG`) request and response structures (`REQMEM`, `RESPMEM` = `SOAIPE1`) from the source library (`PDSLIB`) `<SOURCEX>`\n- communication-area interface (`PGMINT` = `COMMAREA`) and service URI (`URI`) `GENAPP/LGUPOLE1`\n- HTTP proxy (`HTTPPROXY`) `PROXY.HURSLEY.IBM.COM:80`\n\nThe run names the log (`LOGFILE`), the binding file (`WSBIND`) and the service description (`WSDL`) as outputs under the genapp directories.", "program": "wsaup01", "priority": "", "link": "../aws/index.html#/c/43/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-f654fb99f7"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-c3ea35c318", "id": "id-c3ea35c318", "name": "Define the house policy update service", "text": "THE House Policy Service Generation SHALL supply the web service assistant with the service definition for the house policy update program (`PGMNAME` = `LGUPOL01`): language `COBOL` (`LANG`); request and response member `SOAIPH1` (`REQMEM`, `RESPMEM`) from the source library `<SOURCEX>` (`PDSLIB`); data passed through `COMMAREA` (`PGMINT`); service address `GENAPP/LGUPOLH1` (`URI`). Also supply the binding file location (`WSBIND`), the service description location (`WSDL`), the log location (`LOGFILE`) and the HTTP proxy 'PROXY.HURSLEY.IBM.COM:80' (`HTTPPROXY`).", "program": "wsaup01", "priority": "", "link": "../aws/index.html#/c/43/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-c3ea35c318"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-945122851d", "id": "id-945122851d", "name": "Generate the policy update web service", "text": "THE Motor Policy Web Service Publication SHALL run the web service generation procedure (`DFHLS2WS`) with these inputs: Java directory `'java601_bit64_ga/J6.0.1_64'`, CICS directory `'cics660'`, empty path prefix, temporary directory `'/tmp'` and temporary file prefix `'LS2WS'`. Pass it a generation request that exposes the COBOL program `LGUPOL01` through a `COMMAREA` interface, uses request and response layouts `SOAIPM1` from library `<SOURCEX>`, and publishes at URI `GENAPP/LGUPOLM1` through proxy `PROXY.HURSLEY.IBM.COM:80`. Have it write the binding to `<ZFSHOME>/genapp/wsdir/LGUPOLM1.WebServiceGenerationRequest.ws_bind`, the service description to `<ZFSHOME>/genapp/wsdir/LGUPOLM1.WebServiceGenerationRequest.wsdl` and the log to `<ZFSHOME>/genapp/logs/LS2WS_LGUPOLM1.LOG`.", "program": "wsaup01", "priority": "", "link": "../aws/index.html#/c/43/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-945122851d"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-022d84425e", "id": "id-022d84425e", "name": "Generate the policy update web service", "text": "THE Policy Update Web Service Generation SHALL run the web service generation assistant for program `LGUPOL01` (`PGMNAME`) in `COBOL` (`LANG`), passing data via `COMMAREA` (`PGMINT`). The request and response structures (`REQMEM`, `RESPMEM`) are both member `SOAIPB1` from the copybook library `<SOURCEX>` (`PDSLIB`). The service is published at URI `GENAPP/LGUPOLB1` (`URI`) using proxy `PROXY.HURSLEY.IBM.COM:80` (`HTTPPROXY`). Write the binding file (`WSBIND`) and service description (`WSDL`) under `<ZFSHOME>/genapp/wsdir/LGUPOLB1` and the log (`LOGFILE`) to `<ZFSHOME>/genapp/logs/LS2WS_LGUPOLB1.LOG`. Use Java directory 'java601_bit64_ga/J6.0.1_64', installation directory 'cics660', an empty path prefix, and temporary files 'LS2WS'
