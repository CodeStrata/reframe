ith 'FINAL'", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-bf7790c453"}, {"key": "Unassigned-Programs/id-c5d31c3084", "id": "id-c5d31c3084", "name": "Report house lookup failure", "text": "IF the house policy lookup does not succeed, THEN THE House Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-c5d31c3084"}, {"key": "Unassigned-Programs/id-47613b8d34", "id": "id-47613b8d34", "name": "Retrieve motor policy and size reply", "text": "WHEN a motor policy inquiry is received for a customer and policy number, THE Motor Policy Inquiry SHALL read the matching policy and motor details from the policy master (`POLICY`) joined to the motor details (`MOTOR`) by customer number (`CUSTOMERNUMBER`) and policy number (`POLICYNUMBER`), and on success compute the required reply size as the header/trailer length (33) plus the full motor policy length (137)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-47613b8d34"}, {"key": "Unassigned-Programs/id-58a673c160", "id": "id-58a673c160", "name": "Reject motor inquiry with insufficient reply space", "text": "IF the caller's area length (`EIBCALEN`) is less than the required motor reply size (`WS-REQUIRED-CA-LEN`), THEN THE Motor Policy Inquiry SHALL set the return code (`CA-RETURN-CODE`) to '98' and return to the caller without returning policy data", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-58a673c160"}, {"key": "Unassigned-Programs/id-5d2631b693", "id": "id-5d2631b693", "name": "Return motor policy details to caller", "text": "WHEN a motor policy was found and the caller's area is at least the required reply size, THE Motor Policy Inquiry SHALL return the common policy data, the 65-byte motor details, the premium and the accident count, copying broker id and payment only when they are not null", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-5d2631b693"}, {"key": "Unassigned-Programs/id-34226ecf3e", "id": "id-34226ecf3e", "name": "Mark end of motor policy data", "text": "WHEN motor policy data has been returned to the caller, THE Motor Policy Inquiry SHALL write the end-of-data marker 'FINAL' into the free space after the motor data (`CA-M-FILLER`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-34226ecf3e"}, {"key": "Unassigned-Programs/id-8794b0be6b", "id": "id-8794b0be6b", "name": "Report motor lookup failure", "text": "IF the motor policy lookup does not succeed, THEN THE Motor Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-8794b0be6b"}, {"key": "Unassigned-Programs/id-7dfb8c9816", "id": "id-7dfb8c9816", "name": "Return commercial policy by customer and policy", "text": "WHEN a commercial policy is found for the requested customer and policy number, THE Commercial Policy Inquiry SHALL compute the required size (33 + 1174), return code `'98'` and stop when the caller's area is smaller, otherwise return the common and commercial details (request, start and renewal dates, address, location, perils, premiums, status, rejection reason) and mark the end of data with `'FINAL'` (physical stores: `POLICY`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-7dfb8c9816"}, {"key": "Unassigned-Programs/id-68a992d3c2", "id": "id-68a992d3c2", "name": "Report commercial customer-and-policy lookup failure", "text": "IF the commercial lookup by customer and policy number does not succeed, THEN THE Commercial Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-68a992d3c2"}, {"key": "Unassigned-Programs/id-377231795a", "id": "id-377231795a", "name": "Return commercial policy by policy number", "text": "WHEN a commercial policy is found for the requested policy number, THE Commercial Policy Inquiry SHALL compute the required size (33 + 1174), return code `'98'` and stop when the caller's area is smaller, otherwise return the owning customer number, common and commercial details and mark the end of data with `'FINAL'` (physical stores: `POLICY`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-377231795a"}, {"key": "Unassigned-Programs/id-9bf145d9c9", "id": "id-9bf145d9c9", "name": "Report commercial policy-number lookup failure", "text": "IF the commercial lookup by policy number does not succeed, THEN THE Commercial Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-9bf145d9c9"}, {"key": "Unassigned-Programs/id-66f6a7f6d0", "id": "id-66f6a7f6d0", "name": "Scan commercial policies for a customer", "text": "WHILE rows remain for the customer's commercial policies and fewer than 21 rows have been read, THE Commercial Policy Customer Scan SHALL read each matching commercial policy, return its customer number, policy number, common and commercial details, count it, and stop the scan once more than 20 rows have been read", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-66f6a7f6d0"}, {"key": "Unassigned-Programs/id-deda89344b", "id": "id-deda89344b", "name": "Scan commercial policies by postcode", "text": "WHILE rows remain for commercial policies at the requested postcode, THE Commercial Policy Postcode Scan SHALL read each matching commercial policy and return its customer number, policy number, common and commercial details", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-deda89344b"}, {"key": "Unassigned-Programs/id-40f6aa6710", "id": "id-40f6aa6710", "name": "Route inquiry by policy request type", "text": "WHEN a policy inquiry arrives with request identifier '01IEND', '01IHOU', '01IMOT', '01ICOM', '02ICOM', '03ICOM' or '05ICOM', THE Policy Inquiry Router SHALL set the return code (`CA-RETURN-CODE`) to '00' and prepare the customer and policy lookup keys. Route '01IEND' to endowment, '01IHOU' to house, '01IMOT' to motor, '01ICOM' to commercial by customer and policy, '02ICOM' to commercial by policy only, '03ICOM' to the customer commercial list and '05ICOM' to the postcode commercial list, clearing the commercial details first for the two lists", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-40f6aa6710"}, {"key": "Unassigned-Programs/id-feb729923d", "id": "id-feb729923d", "name": "Retrieve endowment policy details", "text": "WHEN an endowment policy inquiry is requested, THE Endowment Policy Inquiry SHALL retrieve the endowment policy for the customer and policy number. On an unexpected retrieval failure (neither found nor not found), set the return code to '90' and record an error message", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-feb729923d"}, {"key": "Unassigned-Programs/id-3f04c3def3", "id": "id-3f04c3def3", "name": "Retrieve house policy details", "text": "WHEN a house policy inquiry is requested, THE House Policy Inquiry SHALL retrieve the house policy for the customer and policy number. On an unexpected retrieval failure, set the return code to '90' and record an error message", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-3f04c3def3"}, {"key": "Unassigned-Programs/id-d5dc4ddc8b", "id": "id-d5dc4ddc8b", "name": "Retrieve motor policy details", "text": "WHEN a motor policy inquiry is requested, THE Motor Policy Inquiry SHALL retrieve the motor policy for the customer and policy number. On an unexpected retrieval failure, set the return code to '90' and record an error message", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-d5dc4ddc8b"}, {"key": "Unassigned-Programs/id-478532a447", "id": "id-478532a447", "name": "Retrieve commercial policy by customer and policy", "text": "WHEN a commercial policy inquiry by customer and policy number is requested, THE Commercial Policy Inquiry SHALL retrieve the commercial policy for the customer and policy number. On an unexpected retrieval failure, set the return code to '90' and record an error message", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-478532a447"}, {"key": "Unassigned-Programs/id-c7f19b81bd", "id": "id-c7f19b81bd", "name": "Retrieve commercial policy by policy only", "text": "WHEN a commercial policy inquiry by policy number only is requested, THE Commercial Policy Inquiry SHALL retrieve the commercial policy and its owning customer number for the policy number. On an unexpected retrieval failure, set the return code to '90' and record an error message", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-c7f19b81bd"}, {"key": "Unassigned-Programs/id-20774cce3f", "id": "id-20774cce3f", "name": "List customer commercial policies", "text": "WHEN a commercial policy list for a customer is requested, THE Commercial Policy List by Customer SHALL retrieve the customer's commercial policies row by row. If the retrieval cannot start, set the return code to '89', record an error and end. If it cannot finish, set the return code to '88', record an error and end (physical stores: `POLICY`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-20774cce3f"}, {"key": "Unassigned-Programs/id-b2ebe24f70", "id": "id-b2ebe24f70", "name": "Return each customer commercial row capped at 20", "text": "WHILE the customer commercial policy list is being retrieved, WHEN a commercial policy row is successfully fetched, THE Commercial Policy List by Customer SHALL convert the peril, premium and status amounts and return the customer number, policy number, common details and commercial details. Add 1 to the row count and stop the list once more than 20 rows are counted", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-b2ebe24f70"}, {"key": "Unassigned-Programs/id-bf4edd1655", "id": "id-bf4edd1655", "name": "List commercial policies by postcode", "text": "WHEN a commercial policy list for a property postcode is requested, THE Commercial Policy List by Postcode SHALL retrieve commercial policies for the postcode row by row. If the retrieval cannot start, set the return code to '89', record an error and end. If it cannot finish, set the return code to '88', record an error and end (physical stores: `POLICY`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-bf4edd1655"}, {"key": "Unassigned-Programs/id-8798eed1e7", "id": "id-8798eed1e7", "name": "Return each postcode commercial row", "text": "WHILE the postcode commercial policy list is being retrieved, WHEN a commercial policy row is successfully fetched, THE Commercial Policy List by Postcode SHALL convert the peril, premium and status amounts and return the customer number, policy number, common details and commercial details", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-8798eed1e7"}, {"key": "Unassigned-Programs/id-af52c3952d", "id": "id-af52c3952d", "name": "Route policy inquiry by request type", "text": "WHEN a policy inquiry arrives with request type '01IEND', '01IHOU', '01IMOT', '01ICOM', '02ICOM', '03ICOM' or '05ICOM' (case-insensitive), THE Policy Inquiry Router SHALL prepare the customer and policy lookup keys, save them for error reporting, and run the endowment, house, motor, commercial-by-customer-and-policy, commercial-by-policy, commercial-by-customer list, or commercial-by-postcode list lookup respectively", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-af52c3952d"}, {"key": "Unassigned-Programs/id-b664daf74a", "id": "id-b664daf74a", "name": "Retrieve endowment policy details", "text": "WHEN an endowment policy inquiry is processed, THE Endowment Policy Inquiry SHALL retrieve the endowment policy matching the customer and policy number, and write an error message labelled ' SELECT ENDOW ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-b664daf74a"}, {"key": "Unassigned-Programs/id-f2de0d9f56", "id": "id-f2de0d9f56", "name": "Retrieve house policy details", "text": "WHEN a house policy inquiry is processed, THE House Policy Inquiry SHALL retrieve the house policy matching the customer and policy number, and write an error message labelled ' SELECT HOUSE ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-f2de0d9f56"}, {"key": "Unassigned-Programs/id-79649ec3a5", "id": "id-79649ec3a5", "name": "Retrieve motor policy details", "text": "WHEN a motor policy inquiry is processed, THE Motor Policy Inquiry SHALL retrieve the motor policy matching the customer and policy number, and write an error message labelled ' SELECT MOTOR ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-79649ec3a5"}, {"key": "Unassigned-Programs/id-9cd8752416", "id": "id-9cd8752416", "name": "Retrieve commercial policy by customer and policy", "text": "WHEN a commercial policy inquiry by customer and policy number is processed, THE Commercial Policy Inquiry SHALL retrieve the commercial policy matching the customer and policy number, and write an error message labelled ' SELECT Commercial ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-9cd8752416"}, {"key": "Unassigned-Programs/id-a9c7f39e0d", "id": "id-a9c7f39e0d", "name": "Retrieve commercial policy by policy number", "text": "WHEN a commercial policy inquiry by policy number only is processed, THE Commercial Policy Inquiry SHALL retrieve the commercial policy and its owning customer number by policy number, and write an error message labelled ' SELECT Commercial ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-a9c7f39e0d"}, {"key": "Unassigned-Programs/id-7006084299", "id": "id-7006084299", "name": "List commercial policies for a customer", "text": "WHILE a commercial list by customer is active and each fetch has succeeded so far, THE Commercial Policy Customer List SHALL retrieve the customer's commercial policies one by one, and write an error message and end the program when the list cannot be started or finished cleanly (physical stores: `POLICY`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-7006084299"}, {"key": "Unassigned-Programs/id-1e770c6e54", "id": "id-1e770c6e54", "name": "Cap customer commercial list at twenty", "text": "WHILE the customer commercial list is being read, WHEN a commercial policy row is fetched successfully, THE Commercial Policy Customer List SHALL increase the commercial record count by 1, and force the artificial stop value 17 when the count exceeds 20 so the list stops (physical stores: `POLICY`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-1e770c6e54"}, {"key": "Unassigned-Programs/id-9e703616e2", "id": "id-9e703616e2", "name": "List commercial policies by postcode", "text": "WHILE a commercial list by postcode is active and each fetch has succeeded so far, THE Commercial Policy Postcode List SHALL retrieve the commercial policies matching the requested postcode row by row, and write an error message and end the program when the list cannot be started or finished cleanly (physical stores: `POLICY`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-9e703616e2"}], "claude": [{"key": "claude/RULE-006", "id": "RULE-006", "name": "Response area must be large enough for the full policy record", "text": "Given An endowment policy with PADDINGDATA of length 40 and a caller commarea of 150 bytes\nWhen 01IEND inquiry succeeds in the database\nThen Required length = 33 + 124 + 40 = 197; since 150 < 197 return code '98' and no policy data is returned. With a 200-byte commarea the data is returned and 'FINAL' is written at padding offset 41 (1 + 40).", "program": "LGIPDB01", "priority": "P1", "link": "../claude/index.html#/c/16/claude/RULE-006"}, {"key": "claude/RULE-016", "id": "RULE-016", "name": "Policy inquiry requires matching customer and policy number", "text": "Given Customer 0000000001 owns policy 0000000005 (a House policy) and policy 0000000009 belongs to another customer\nWhen A 01IHOU inquiry is made for customer 0000000001 and policy 0000000009\nThen No row matches the join POLICY.CUSTOMERNUMBER = customer AND POLICY.POLICYNUMBER = policy; return code '01' (not found). Any other DB error returns '90' and an error message (date, time, customer, policy, SQLCODE plus up to 90 bytes of commarea) is written via LGSTSQ.", "program": "LGIPDB01", "priority": "P0", "link": "../claude/index.html#/c/16/claude/RULE-016"}, {"key": "claude/RULE-028", "id": "RULE-028", "name": "Missing request area aborts the transaction", "text": "Given A call with commarea length 0\nWhen The program starts\nThen Error ' NO COMMAREA RECEIVED' is logged and the task abends with code LGCA (no dump); otherwise the return code starts at '00'.", "program": "LGIPDB01", "priority": "P1", "link": "../claude/index.html#/c/15/claude/RULE-028"}, {"key": "claude/RULE-029", "id": "RULE-029", "name": "Inquiry type routing by request ID", "text": "Given A commarea with request ID '01ihou'\nWhen The inquiry program runs\nThen The ID is upper-cased to '01IHOU' and a House policy lookup is performed; an ID such as '04ICOM' returns code '99' with no data.", "program": "LGIPDB01", "priority": "P1", "link": "../claude/index.html#/c/15/claude/RULE-029"}, {"key": "claude/RULE-047", "id": "RULE-047", "name": "Optional broker and payment values are left blank when absent", "text": "Given An endowment policy with no broker (BROKERID null) and payment 250\nWhen 01IEND inquiry succeeds\nThen Broker ID returned as initialised value (zero), payment returned as 250; term and sum assured converted to display numerics.", "program": "LGIPDB01", "priority": "P2", "link": "../claude/index.html#/c/16/claude/RULE-047"}, {"key": "claude/RULE-059", "id": "RULE-059", "name": "Commercial policy dates mapped from request/start/renewal dates", "text": "Given A commercial policy with RequestDate 2024-01-10, StartDate 2024-02-01, RenewalDate 2025-02-01\nWhen A 01ICOM/02ICOM/03ICOM/05ICOM inquiry returns it\nThen Last changed = 2024-01-10, issue date = 2024-02-01, expiry date = 2025-02-01 in the common policy section.", "program": "LGIPDB01", "priority": "P1", "link": "../claude/index.html#/c/17/claude/RULE-059"}, {"key": "claude/RULE-060", "id": "RULE-060", "name": "Commercial policy status, rejection reason and peril premiums are reported as stored", "text": "Given A commercial policy with Status 2, RejectionReason 'Flood risk', FirePremium 1200\nWhen A commercial inquiry succeeds\nThen Status 2, rejection reason 'Flood risk' and premium 1200 are converted to display numerics and returned unchanged.", "program": "LGIPDB01", "priority": "P1", "link": "../claude/index.html#/c/17/claude/RULE-060"}, {"key": "claude/RULE-086", "id": "RULE-086", "name": "Commercial inquiry by policy number alone (no ownership check)", "text": "Given Commercial policy 0000000012 owned by customer 0000000003\nWhen A 02ICOM inquiry is made with policy 0000000012 and any (or blank) customer number\nThen The policy is returned and the response customer number is overwritten with 0000000003.", "program": "LGIPDB01", "priority": "P1", "link": "../claude/index.html#/c/18/claude/RULE-086"}, {"key": "claude/RULE-087", "id": "RULE-087", "name": "List commercial policies by customer (capped) or by postcode", "text": "Given Customer 0000000004 with 25 commercial policies\nWhen A 03ICOM inquiry is made\nThen Rows are fetched until the count exceeds 20 (21 rows fetched), then the loop stops; the response holds only the last fetched row and return code stays '00'. Cursor open failure -> '89', close failure -> '88'.", "program": "LGIPDB01", "priority": "P1", "link": "../claude/index.html#/c/18/claude/RULE-087"}, {"key": "claude/RULE-096", "id": "RULE-096", "name": "End-of-policy-data marker", "text": "Given A successful House inquiry\nWhen Data is moved to the response\nThen 'FINAL' is placed in the first 5 bytes of the house filler area.", "program": "LGIPDB01", "priority": "P2", "link": "../claude/index.html#/c/16/claude/RULE-096"}]}, {"program": "LGIPOL01", "aws": [{"key": "Unassigned-Programs/id-ac644cb2ec", "id": "id-ac644cb2ec", "name": "Delegate policy inquiry to database module", "text": "WHEN a policy inquiry request with caller data is received, THE Policy Inquiry Entry SHALL set the return code (`CA-RETURN-CODE`) to '00' and delegate to the database module (`LGIPDB01`), passing the request data with length 32500", "program": "lgipol01", "priority": "", "link": "../aws/index.html#/c/34/Unassigned-Programs/id-ac644cb2ec"}], "claude": [{"key": "claude/RULE-030", "id": "RULE-030", "name": "Policy inquiry has no length or request-type validation at entry", "text": "Given An inquiry request of 10 bytes (shorter than the 28-byte header)\nWhen The inquire-policy service receives it\nThen Return code is set to '00' and the request is still forwarded to LGIPDB01; only an empty message (0 bytes) is rejected, with ABEND LGCA.", "program": "LGIPOL01", "priority": "P1", "link": "../claude/index.html#/c/15/claude/RULE-030"}]}, {"program": "LGIPVS01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-526c5fd3f6", "id": "id-526c5fd3f6", "name": "Accept policy request from calling program", "text": "WHEN the start code (`WS-STARTCODE`) begins with 'D' or an invoking program name (`WS-INVOKEPROG`) is present, THE Policy Request Intake SHALL mark the request as caller-supplied ('C'), take the request data from the caller, and set the policy-number length to 10 (11 minus 1)", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-526c5fd3f6"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-64058bc1b7", "id": "id-64058bc1b7", "name": "Accept policy request from terminal", "text": "WHEN the request was not started by a distributed link and has no invoking program, THE Policy Request Intake SHALL receive the request from the terminal, mark it as terminal-originated ('R'), use the received data as the request, and set the policy-number length to the received length minus 6", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-64058bc1b7"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fba6f55180", "id": "id-fba6f55180", "name": "Send policy reply to terminal", "text": "WHEN the request channel flag (`WS-FLAG`) is 'R', THE Policy Response Delivery SHALL clear the terminal screen and display the 80-character policy message, then unlock the keyboard", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fba6f55180"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3f867470cd", "id": "id-3f867470cd", "name": "Look up policy by type and number", "text": "THE Policy Lookup SHALL build the policy key from the policy type and policy number in the request, and retrieve the first policy record at or after that key from the policy file (`KSDSPOLY`) using an 11-character generic key and a 64-byte record", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3f867470cd"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5855243e9c", "id": "id-5855243e9c", "name": "Report bad policy lookup", "text": "IF the retrieved policy type differs from the requested type or the policy lookup fails, THEN THE Policy Response Builder SHALL set the message label to 'Policy Bad=' and set the customer number and policy number in the message to 13", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5855243e9c"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a5ea883fc7", "id": "id-a5ea883fc7", "name": "Return found policy key", "text": "WHEN the policy lookup succeeds and the retrieved policy type matches the requested type, THE Policy Response Builder SHALL place the retrieved policy record into the policy key of the message, under the label 'Policy Key='", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a5ea883fc7"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a9bf74f276", "id": "id-a9bf74f276", "name": "Return result to calling program", "text": "WHEN the input path (`WS-FLAG`) is not 'R', THE Policy Lookup Response SHALL Clear the caller's data and return the result label and policy key to the caller.", "program": "lgipvs01", "priority": "", "link": "../aws/index.html#/c/16/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a9bf74f276"}], "claude": [{"key": "claude/RULE-007", "id": "RULE-007", "name": "Policy lookup by policy type and customer number (generic key)", "text": "Given Input type 'M' and customer number 0001000010, and the policy file holds M/0001000010/0000000003 as the first key at or above M0001000010\nWhen A policy inquiry simulation request runs\nThen KSDSPOLY is read generically (GTEQ, 11-byte partial key = type + customer number) and the key 'M00010000100000000003' is returned after 'Policy Key='", "program": "LGIPVS01", "priority": "P1", "link": "../claude/index.html#/c/68/claude/RULE-007"}, {"key": "claude/RULE-031", "id": "RULE-031", "name": "Reject policy lookups whose returned type does not match the requested type", "text": "Given Requested type 'H' with customer number 0009999999, and the next key on the file at or above H0009999999 belongs to type 'M'\nWhen The program checks the result of the policy lookup\nThen The response text is 'Policy Bad=', the customer number is 0000000013 and the policy number is 0000000013. The type byte stays at its initial value 'X' (it is not overwritten).", "program": "LGIPVS01", "priority": "P1", "link": "../claude/index.html#/c/69/claude/RULE-031"}]}, {"program": "LGSETUP", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148", "id": "id-bddf1cd148", "name": "Write control header and customer range entries", "text": "THE Application Control Queue Setup SHALL write to the application control queue (`GENACNTL`), in order, the 20-character control header `'**** GENAPP CNTL'`, then the 23-character entry starting `'LOW CUSTOMER='`, then the 24-character entry starting `'HIGH CUSTOMER='`, without waiting for space, and capture each outcome in the response code (`WS-RESP`)", "program": "lgsetup", "priority": "", "link": "../aws/index.html#/c/17/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148"}], "claude": [{"key": "claude/RULE-008", "id": "RULE-008", "name": "Next-customer-number counter reseeded to last customer number", "text": "Given GENACUSTNUM currently stands at any value (for example 532) and the operator gives no override\nWhen LGSETUP runs\nThen GENACUSTNUM is deleted and redefined in pool GENA with value 11. The next GET COUNTER in customer add (lgacdb01.cbl:201-210) returns 11 as the new customer number", "program": "LGSETUP", "priority": "P1", "link": "../claude/index.html#/c/63/claude/RULE-008"}, {"key": "claude/RULE-032", "id": "RULE-032", "name": "Operator override of last customer number from terminal input", "text": "Given The operator enters the transaction ID followed by '250' (input length 8)\nWhen LGSETUP receives the terminal input\nThen Input length 8 > 5, so the 3 characters after the transaction ID ('250') become LastCustNum, HIGH CUSTOMER=0000000250, and GENACUSTNUM is defined with value 250", "program": "LGSETUP", "priority": "P1", "link": "../claude/index.html#/c/61/claude/RULE-032"}, {"key": "claude/RULE-061", "id": "RULE-061", "name": "Customer number range reset to match restored database", "text": "Given An existing GENACNTL queue holding any previous low/high customer range, and the operator runs the setup transaction without extra input\nWhen LGSETUP runs\nThen GENACNTL is deleted and rewritten as three records: '**** GENAPP CNTL' (20 bytes), 'LOW CUSTOMER=0000000001' (23 bytes), 'HIGH CUSTOMER=0000000011' (24 bytes)", "program": "LGSETUP", "priority": "P1", "link": "../claude/index.html#/c/62/claude/RULE-061"}, {"key": "claude/RULE-062", "id": "RULE-062", "name": "Transaction statistics counters reset to zero", "text": "Given Counter GENA01IMOT00 (successful motor policy inquiries) stands at 1,240 and GENA01IMOT99 (failed inquiries) stands at 7\nWhen LGSETUP runs\nThen Both counters are recreated with value 0, as are all 34 other GENA01 statistics counters", "program": "LGSETUP", "priority": "P1", "link": "../claude/index.html#/c/64/claude/RULE-062"}, {"key": "claude/RULE-097", "id": "RULE-097", "name": "Operational log and status queues purged on reset", "text": "Given GENAERRS holds 25 error records from earlier runs\nWhen LGSETUP runs\nThen GENAERRS, GENASTRT, GENASTAT and GENACNTL are deleted. None is recreated except GENACNTL; the others are rebuilt later when the application next writes to them", "program": "LGSETUP", "priority": "P2", "link": "../claude/index.html#/c/65/claude/RULE-097"}]}, {"program": "LGSTSQ", "aws": [{"key": "No domain/DiagnosticandErrorMessageLogging/id-f646f17c37", "id": "id-f646f17c37", "name": "Use caller-supplied text as message", "text": "WHEN the program is invoked by another program (invoking program name `WS-INVOKEPROG` is not blank), THE Message Log Builder SHALL stamp the current system identifier into the message, take the caller's data (`COMMA-DATA`) as the message text, and set the message length to the caller's data length (`EIBCALEN`)", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/23/No domain/DiagnosticandErrorMessageLogging/id-f646f17c37"}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-fb989ec573", "id": "id-fb989ec573", "name": "Use terminal input as message", "text": "WHEN the program is started directly and not by another program (invoking program name is blank), THE Message Log Builder SHALL receive the terminal input, use the received data (`WS-RECV-DATA`) as the message text, and set the message length to the received length minus 5", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/23/No domain/DiagnosticandErrorMessageLogging/id-fb989ec573"}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-f1fd6ad01d", "id": "id-f1fd6ad01d", "name": "Strip queue directive prefix", "text": "WHEN the message text starts with 'Q=', THE Message Log Builder SHALL replace the message text with its remainder after the directive and reduce the message length by 7", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/23/No domain/DiagnosticandErrorMessageLogging/id-f1fd6ad01d"}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-26136fe9d9", "id": "id-26136fe9d9", "name": "Write message to standard log queue", "text": "THE Message Log Writer SHALL add 5 to the message length and write the outbound message with that length to the standard destination queue (`CSMT`)", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/23/No domain/DiagnosticandErrorMessageLogging/id-26136fe9d9"}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6", "id": "id-a3686cd7f6", "name": "Assemble message from caller or terminal", "text": "WHEN a message is submitted for logging, either by an invoking program (invoking program name `WS-INVOKEPROG` not blank) or from a terminal (invoking program name blank), THE Error Message Logging SHALL stamp the message with the originating system identifier (`WRITE-MSG-SYSID`). For a program invocation, take the message text from the passed data (`COMMA-DATA`) and its length from the passed data length (`EIBCALEN`). For a terminal start, take the text from the received terminal data (`WS-RECV-DATA`) and use the received length minus 5.", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/25/No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6"}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff", "id": "id-e9db9b70ff", "name": "Select target error queue name", "text": "WHEN a message is prepared for logging, and its text either starts with the prefix 'Q=' or does not, THE Error Message Logging SHALL target the default queue 'GENAERRS'. When the text starts with 'Q=', replace the queue name extension (`STSQ-EXT`) with the four characters that follow the prefix, strip the prefix and queue code from the message text, and reduce the message length by 7. Otherwise, keep the default queue.", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/25/No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff"}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718", "id": "id-ea4fdf1718", "name": "Determine invocation mode", "text": "WHEN the program starts and the invoking program name (`WS-INVOKEPROG`) is retrieved, THE Invocation Mode Detection SHALL set the invocation-mode flag (`WS-FLAG`) to 'C' when an invoking program name is present, and to 'R' when the invoking program name is blank", "program": "lgstsq", "priority": "", "link": "../aws/index.html#/c/24/No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718"}], "claude": [{"key": "claude/RULE-009", "id": "RULE-009", "name": "Log record composition and length by invocation mode", "text": "Given Program LGAPOL01 links to LGSTSQ with a 60-byte commarea on system 'CICA'\nWhen The log record is built\nThen WS-FLAG='C', the record is 'CICA' + ' ' + commarea text, and the write length is 60 + 5 = 65. For a terminal-entered transaction of 80 bytes (5-byte tranid + 75 data), WS-FLAG='R', the message is the received data after the tranid, and the length is 80 - 5 + 5 = 80", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/48/claude/RULE-009"}, {"key": "claude/RULE-080", "id": "RULE-080", "name": "Terminal acknowledgement for directly entered log requests", "text": "Given A user enters the logging transaction at a terminal (WS-FLAG='R')\nWhen The message has been written to the queues\nThen A 1-character blank screen is sent with ERASE, WAIT and FREEKB, and the task returns. For program callers (WS-FLAG='C') it returns straight away with no screen output", "program": "LGSTSQ", "priority": "P2", "link": "../claude/index.html#/c/51/claude/RULE-080"}, {"key": "claude/RULE-088", "id": "RULE-088", "name": "Error log queue routing by optional Q= prefix", "text": "Given A caller passes the message 'Q=PROD Policy 123 add failed'\nWhen LGSTSQ logs the message\nThen The TS queue name becomes 'GENAPROD' (first 4 chars of GENAERRS kept, last 4 replaced by the 4 chars after 'Q='), the logged text becomes 'Policy 123 add failed', and the record length is reduced by 7; a message without a 'Q=' prefix goes to GENAERRS unchanged", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/49/claude/RULE-088"}, {"key": "claude/RULE-089", "id": "RULE-089", "name": "Dual-destination error logging with non-blocking TS write", "text": "Given An error message is ready and TS storage is exhausted\nWhen LGSTSQ writes the log\nThen The record is written to TD queue CSMT. The TS queue write (GENAERRS or its override) is attempted with NOSUSPEND, and if no space is available it is silently dropped. The response codes are not checked and the caller is not told about the failure", "program": "LGSTSQ", "priority": "P1", "link": "../claude/index.html#/c/50/claude/RULE-089"}]}, {"program": "LGUCDB01", "aws": [{"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c0b6f6ea13", "id": "id-c0b6f6ea13", "name": "Update customer personal and contact details", "text": "WHEN a customer update request with data is received for a customer number (`CA-CUSTOMER-NUM`), THE Customer Details Maintenance SHALL update the matching customer row in the customer store (`CUSTOMER`) by customer number (`CUSTOMERNUMBER`) with the supplied name, date of birth, address, phone and email details; on success take no further action, on customer-not-found defer to handling outside this slice, and on any other failure log an error message identified as ' UPDATE CUST  ' with the customer number and return code", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c0b6f6ea13"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b7263135cc", "id": "id-b7263135cc", "name": "Default outcome to success and update", "text": "WHEN a customer update request with data is received, THE Customer Update Orchestration SHALL set the return code to success '00', convert the customer number into the numeric customer key, and perform the customer details update", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b7263135cc"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04dcbd8b01", "id": "id-04dcbd8b01", "name": "Pass request to follow-on program", "text": "WHEN the customer details update step has completed, THE Customer Update Orchestration SHALL delegate to the follow-on program (`LGUCVS01`), passing the customer request data and return code with a length of 225", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04dcbd8b01"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-689c1c148d", "id": "id-689c1c148d", "name": "Update customer details row", "text": "WHEN the customer update step runs for a customer number, THE Customer Details Maintenance SHALL update the customer table (`CUSTOMER`) row whose `CUSTOMERNUMBER` matches the customer number with the supplied name, date of birth, address, phone numbers and email address", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-689c1c148d"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-69676c05ca", "id": "id-69676c05ca", "name": "Report customer not found", "text": "IF the customer update finds no customer matching the supplied customer number, THEN THE Customer Details Maintenance SHALL set the return code to '01' to report that the customer was not found", "program": "lgucdb01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-69676c05ca"}], "claude": [{"key": "claude/RULE-073", "id": "RULE-073", "name": "Customer details update overwrites all contact fields and classifies outcome", "text": "Given Customer 1000042 exists and request supplies first name, last name, DOB, house name, house number, postcode, mobile, home phone and email\nWhen The customer update is processed\nThen All nine columns are overwritten unconditionally (blank inputs blank the stored values) and rc '00' is returned; SQLCODE 100 (no such customer) gives rc '01'; any other SQL error gives rc '90' and an error log entry", "program": "LGUCDB01", "priority": "P1", "link": "../claude/index.html#/c/8/claude/RULE-073"}, {"key": "claude/RULE-091", "id": "RULE-091", "name": "Customer update always propagates to secondary customer store", "text": "Given A customer update request for customer 1000042\nWhen The DB2 update completes with any result (00, 01 or 90)\nThen LGUCVS01 is invoked with the first 225 bytes of the request area", "program": "LGUCDB01", "priority": "P1", "link": "../claude/index.html#/c/9/claude/RULE-091"}]}, {"program": "LGUCUS01", "aws": [{"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c83ef37a6f", "id": "id-c83ef37a6f", "name": "Bypass update for non-update requests", "text": "WHEN the requested operation (`CA-REQUEST-ID`) is anything other than '01UCUS', THE Customer Update Request Intake SHALL skip the customer update and proceed to the end-of-program step; for '01UCUS', continue to the customer update", "program": "lgucus01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c83ef37a6f"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-f31689c9ac", "id": "id-f31689c9ac", "name": "Delegate customer update to database module", "text": "WHEN an update-customer request ('01UCUS') with request data is received, THE Customer Update Request Intake SHALL preset the outcome code (`CA-RETURN-CODE`) and the policy count (`CA-NUM-POLICIES`) to '00', then delegate to the customer database update module (`LGUCDB01`), passing the full request of length 32500", "program": "lgucus01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-f31689c9ac"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65b72061bd", "id": "id-65b72061bd", "name": "Default success outcome and policy count", "text": "THE Customer Update Request Intake SHALL default the return code (`CA-RETURN-CODE`) to success '00' and the number of policies (`CA-NUM-POLICIES`) to zero ('00')", "program": "lgucus01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65b72061bd"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04a4edcd51", "id": "id-04a4edcd51", "name": "Reject unsupported request identifier", "text": "IF the request identifier (`CA-REQUEST-ID`) is not the update-customer request '01UCUS', THEN THE Customer Update Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '99' to signal an unsupported request and skip to the end-of-program step", "program": "lgucus01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04a4edcd51"}], "claude": [{"key": "claude/RULE-042", "id": "RULE-042", "name": "Customer update requires the update request type", "text": "Given A request to LGUCUS01 with CA-REQUEST-ID '01ICUS'\nWhen LGUCUS01 checks the request id\nThen CA-RETURN-CODE = '99' and the program returns without linking to LGUCDB01. With '01UCUS', the request is passed to LGUCDB01 to update the customer.", "program": "LGUCUS01", "priority": "P1", "link": "../claude/index.html#/c/7/claude/RULE-042"}]}, {"program": "LGUCVS01", "aws": [{"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a", "id": "id-dcd58d532a", "name": "Replace stored customer record", "text": "WHEN the existing customer record has been locked for update, THE Customer Record Update SHALL rewrite the customer record in the customer file (`KSDSCUST`) with the supplied customer data at the fixed record size (`CUSTOMER-RECORD-SIZE`); if the rewrite fails, record a diagnostic error message and terminate abnormally with code 'LGV2'", "program": "lgucvs01", "priority": "", "link": "../aws/index.html#/c/22/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a"}], "claude": [{"key": "claude/RULE-074", "id": "RULE-074", "name": "Customer update requires an existing record and fully replaces it", "text": "Given Customer 0001000042 exists in KSDSCUST with postcode 'SO21 2JN', and an update request carries postcode 'SO22 5HA' and all other customer fields\nWhen the update-customer VSAM step (LGUCVS01) runs\nThen the record is read for update (locked) by key 0001000042 and rewritten in full with the 225 bytes from the request, so the stored postcode becomes 'SO22 5HA'. If customer 0001000042 does not exist (NOTFND) or the read fails, RC '81' is set and the task abends with LGV1. If the rewrite fails, RC '82' is set and the task abends with LGV2.", "program": "LGUCVS01", "priority": "P1", "link": "../claude/index.html#/c/9/claude/RULE-074"}]}, {"program": "LGUPDB01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-604b574afd", "id": "id-604b574afd", "name": "Orchestrate policy update and forward request", "text": "WHEN a policy update request with request data is received, THE Policy Update Orchestration SHALL preset the outcome code to success ('00'), convert the customer and policy numbers for lookup, run the policy update, and then pass the request (length 225) to the program (`LGUPVS01`)", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-604b574afd"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c6c6533f38", "id": "id-c6c6533f38", "name": "Route update by policy type", "text": "WHILE the policy row was read successfully and the caller's timestamp (`CA-LASTCHANGED`) equals the stored timestamp (`DB2-LASTCHANGED`), WHEN the request type (`CA-REQUEST-ID`) is '01UEND', '01UHOU' or '01UMOT', THE Policy Type Update Router SHALL update the endowment details for '01UEND', the house details for '01UHOU', or the motor details for '01UMOT'", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c6c6533f38"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a", "id": "id-203ed7588a", "name": "Update common policy data and timestamp", "text": "WHEN the timestamps match and the policy-specific update succeeded, THE Policy Common Data Update SHALL update the policy's issue date, expiry date, broker id and broker's reference, stamp it with the current timestamp, and return the new timestamp to the caller; set the outcome code to '90' if the timestamp cannot be read back", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1019f7e991", "id": "id-1019f7e991", "name": "Reject update on timestamp mismatch", "text": "IF the caller's timestamp (`CA-LASTCHANGED`) differs from the stored policy timestamp (`DB2-LASTCHANGED`), THEN THE Policy Concurrency Check SHALL abandon the update and set the outcome code to '02'", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1019f7e991"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-abd195d446", "id": "id-abd195d446", "name": "Report policy not found", "text": "IF no policy row matches the requested customer and policy number, THEN THE Policy Record Lock and Retrieval SHALL set the outcome code to '01' and make no update", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-abd195d446"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbd4b366b9", "id": "id-cbd4b366b9", "name": "Update endowment policy details", "text": "WHEN an endowment policy update is requested, THE Endowment Policy Update SHALL update the endowment details for the policy number, set the outcome code to '01' when no endowment row exists, or set it to '90' on any other failure", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbd4b366b9"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b422878cb1", "id": "id-b422878cb1", "name": "Update house policy details", "text": "WHEN a house policy update is requested, THE House Policy Update SHALL update the house details for the policy number, set the outcome code to '01' when no house row exists, or set it to '90' on any other failure", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b422878cb1"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-220aed7dd5", "id": "id-220aed7dd5", "name": "Update motor policy details", "text": "WHEN a motor policy update is requested, THE Motor Policy Update SHALL update the motor details for the policy number, set the outcome code to '01' when no motor row exists, or set it to '90' on any other failure", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-220aed7dd5"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ad7e5b07f8", "id": "id-ad7e5b07f8", "name": "Abandon update after policy-type failure", "text": "IF the policy-specific update leaves the outcome code (`CA-RETURN-CODE`) other than '00', THEN THE Policy Update Control SHALL close the policy retrieval and return to the caller without updating the common policy data", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ad7e5b07f8"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bb76c10c25", "id": "id-bb76c10c25", "name": "Verify policy timestamp matches before update", "text": "WHEN the policy row is retrieved successfully and the caller's last-changed timestamp (`CA-LASTCHANGED`) equals the stored timestamp (`DB2-LASTCHANGED`), THE Policy Concurrency Check SHALL allow the policy-type update and common policy update to proceed", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bb76c10c25"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6b02136857", "id": "id-6b02136857", "name": "Route update by policy type", "text": "WHEN the request type (`CA-REQUEST-ID`) is '01UEND', '01UHOU' or '01UMOT', THE Policy Type Update Routing SHALL run the endowment update for '01UEND', the house update for '01UHOU', and the motor update for '01UMOT'", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6b02136857"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa", "id": "id-4229402eaa", "name": "Update common policy details and timestamp", "text": "WHEN the policy-type update succeeds, THE Policy Record Update SHALL update the issue date, expiry date, broker identifier and broker reference with a new last-changed timestamp, return the new timestamp to the caller, and write an error message if the timestamp cannot be read back (physical store: `POLICY`)", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fa4e4b1654", "id": "id-fa4e4b1654", "name": "Update endowment policy details", "text": "WHEN an endowment update request ('01UEND') passes the timestamp check, THE Endowment Policy Update SHALL update the endowment details for the policy; set return code '01' if the row is not found, or '90' with an error message on any other failure", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fa4e4b1654"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55bc548318", "id": "id-55bc548318", "name": "Update house policy details", "text": "WHEN a house update request ('01UHOU') passes the timestamp check, THE House Policy Update SHALL update the house details for the policy; set return code '01' if the row is not found, or '90' with an error message on any other failure", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55bc548318"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bc4744779d", "id": "id-bc4744779d", "name": "Update motor policy details", "text": "WHEN a motor update request ('01UMOT') passes the timestamp check, THE Motor Policy Update SHALL update the motor details for the policy; set return code '01' if the row is not found, or '90' with an error message on any other failure", "program": "lgupdb01", "priority": "", "link": "../aws/index.html#/c/19/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bc4744779d"}], "claude": [{"key": "claude/RULE-017", "id": "RULE-017", "name": "Optimistic concurrency check on policy last-changed timestamp", "text": "Given Customer 1 / policy 5 exists with LASTCHANGED '2021-03-01-10.00.00.000000'\nWhen An update arrives with CA-LASTCHANGED '2021-02-28-09.00.00.000000'\nThen No tables are changed and the intended return code is '02' (timestamp mismatch). If no policy row matches the customer and policy number, the intended code is '01' (not found). Any other fetch error gives '90' and is logged", "program": "LGUPDB01", "priority": "P0", "link": "../claude/index.html#/c/20/claude/RULE-017"}, {"key": "claude/RULE-043", "id": "RULE-043", "name": "Policy update requires a request payload", "text": "Given A call to the policy update database program\nWhen The communication area length (EIBCALEN) is 0\nThen An error message ' NO COMMAREA RECEIVED' is logged and the task abends with code LGCA (no dump); no database work is attempted", "program": "LGUPDB01", "priority": "P1", "link": "../claude/index.html#/c/19/claude/RULE-043"}, {"key": "claude/RULE-053", "id": "RULE-053", "name": "Policy header update stamps a new last-changed timestamp", "text": "Given Policy 5 with matching timestamps and a successful product-table update\nWhen The POLICY row is updated\nThen ISSUEDATE, EXPIRYDATE, BROKERID and BROKERSREFERENCE take the request values. LASTCHANGED = CURRENT TIMESTAMP, which is read back into CA-LASTCHANGED. On error the unit of work is rolled back (SYNCPOINT ROLLBACK), the code is '90' and the error is logged", "program": "LGUPDB01", "priority": "P0", "link": "../claude/index.html#/c/21/claude/RULE-053"}, {"key": "claude/RULE-075", "id": "RULE-075", "name": "Synchronise policy change to the VSAM policy store after the DB2 update", "text": "Given UPDATE-POLICY-DB2-INFO completed without an early CICS RETURN\nWhen Control returns to the mainline\nThen LGUPVS01 is linked with the commarea (length 225), then the program returns to the caller", "program": "LGUPDB01", "priority": "P1", "link": "../claude/index.html#/c/22/claude/RULE-075"}, {"key": "claude/RULE-076", "id": "RULE-076", "name": "Product detail fields are replaced wholesale from the request", "text": "Given A motor policy 5 with premium 400 and accidents 0\nWhen An 01UMOT update arrives with premium 650 and accidents 2\nThen The MOTOR row for policy 5 is set to premium 650 and accidents 2, along with make, model, value, registration, colour, CC and year of manufacture, exactly as supplied", "program": "LGUPDB01", "priority": "P1", "link": "../claude/index.html#/c/21/claude/RULE-076"}, {"key": "claude/RULE-092", "id": "RULE-092", "name": "Route type-specific detail update by request ID", "text": "Given The timestamps match\nWhen CA-REQUEST-ID is '01UEND', '01UHOU' or '01UMOT'\nThen The ENDOWMENT, HOUSE or MOTOR row for the policy number is updated. If that sets a non-'00' return code, the cursor is closed and the program returns without updating the POLICY table", "program": "LGUPDB01", "priority": "P1", "link": "../claude/index.html#/c/21/claude/RULE-092"}]}, {"program": "LGUPOL01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9fc0c7e894", "id": "id-9fc0c7e894", "name": "Validate endowment update request length", "text": "WHEN the request type (`CA-REQUEST-ID`) is `'01UEND'` (endowment update), THE Policy Update Request Validation SHALL compute the required length as header length (`WS-CA-HEADER-LEN`) plus endowment policy length (`WS-FULL-ENDOW-LEN`), and return to the caller without updating when the received length (`EIBCALEN`) is less than that requirement", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9fc0c7e894"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9529a4c01e", "id": "id-9529a4c01e", "name": "Validate house update request length", "text": "WHEN the request type (`CA-REQUEST-ID`) is `'01UHOU'` (house update), THE Policy Update Request Validation SHALL compute the required length as header length (`WS-CA-HEADER-LEN`) plus house policy length (`WS-FULL-HOUSE-LEN`), and return to the caller without updating when the received length (`EIBCALEN`) is less than that requirement", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9529a4c01e"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f5e87a9c13", "id": "id-f5e87a9c13", "name": "Validate motor update request length", "text": "WHEN the request type (`CA-REQUEST-ID`) is `'01UMOT'` (motor update), THE Policy Update Request Validation SHALL compute the required length as header length (`WS-CA-HEADER-LEN`) plus motor policy length (`WS-FULL-MOTOR-LEN`), and return to the caller without updating when the received length (`EIBCALEN`) is less than that requirement", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f5e87a9c13"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55177c3cc7", "id": "id-55177c3cc7", "name": "Forward policy update to database program", "text": "THE Policy Update Request Routing SHALL initialize the return code (`CA-RETURN-CODE`) to `'00'` and delegate the policy update request to the database update program (`LGUPDB01`) with a request data length of 32500", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55177c3cc7"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f9293c7e00", "id": "id-f9293c7e00", "name": "Flag unrecognised policy update request", "text": "IF the request type (`CA-REQUEST-ID`) is not `'01UEND'`, `'01UHOU'` or `'01UMOT'`, THEN THE Policy Update Request Validation SHALL set the return code (`CA-RETURN-CODE`) to `'99'` to mark the request as unrecognised", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f9293c7e00"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5042f9d52", "id": "id-d5042f9d52", "name": "Validate endowment policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is an endowment request (`'01UEND'`), THE Policy Update Request Validation SHALL initialise the return code to success ('00'), compute the required length as header length plus full endowment policy length, and when the received data length is less than the required length set the return code to '98' and return to the caller", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5042f9d52"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c794c28722", "id": "id-c794c28722", "name": "Validate house policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is a house request (`'01UHOU'`), THE Policy Update Request Validation SHALL compute the required length as header length plus full house policy length, and when the received data length is less than it set the return code to '98' and return to the caller", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c794c28722"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e47bb194af", "id": "id-e47bb194af", "name": "Validate motor policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is a motor request (`'01UMOT'`), THE Policy Update Request Validation SHALL compute the required length as header length plus full motor policy length, and when the received data length is less than it set the return code to '98' and return to the caller", "program": "lgupol01", "priority": "", "link": "../aws/index.html#/c/18/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e47bb194af"}], "claude": [{"key": "claude/RULE-044", "id": "RULE-044", "name": "Policy update request type and minimum data-length check", "text": "Given An update request with request id '01UHOU' (House) and a message of 150 bytes\nWhen The update-policy service validates the request\nThen Required length is 28 + 130 = 158 bytes; 150 < 158 so return code '98' is set and control returns without updating. A 158-byte or longer House request passes and is forwarded to the database update routine LGUPDB01.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/19/claude/RULE-044"}, {"key": "claude/RULE-093", "id": "RULE-093", "name": "Policy maintenance result codes and empty-request abend", "text": "Given A policy service is called with no request data\nWhen The service starts\nThen An error message with date, time and program name is written to the error queue via LGSTSQ and the transaction ends with abend code LGCA; with data present the return code starts as '00' and may be changed to 98/99 or by the database routine.", "program": "LGUPOL01", "priority": "P1", "link": "../claude/index.html#/c/11/claude/RULE-093"}]}, {"program": "LGUPVS01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0660a473a", "id": "id-a0660a473a", "name": "Derive policy type and customer key", "text": "THE Policy Update Request Preparation SHALL derive the policy type from the fourth character of the request identifier (`CA-REQUEST-ID`), place the customer number (`CA-CUSTOMER-NUM`) into the policy key, and set the read length from the incoming request length (`EIBCALEN`)", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0660a473a"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aaba34304c", "id": "id-aaba34304c", "name": "Rewrite updated policy record", "text": "WHEN the policy record has been read for update successfully, THE Policy Record Update SHALL rewrite the updated policy record to the policy store (`KSDSPOLY`); if the rewrite fails, log an error message and abend with `'LGV4'`", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aaba34304c"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b6c42da244", "id": "id-b6c42da244", "name": "Apply commercial policy details", "text": "WHEN the policy type (`WF-REQUEST-ID`) is commercial (`'C'`), THE Policy Detail Mapping SHALL copy the business postcode, business status and business customer from the request into the policy record", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b6c42da244"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-52e60bcb51", "id": "id-52e60bcb51", "name": "Apply endowment policy details", "text": "WHEN the policy type (`WF-REQUEST-ID`) is endowment (`'E'`), THE Policy Detail Mapping SHALL copy the with-profits, equities and managed-fund indicators, the fund name and the life assured from the request into the policy record", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-52e60bcb51"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f801f00b6e", "id": "id-f801f00b6e", "name": "Apply house policy details", "text": "WHEN the policy type (`WF-REQUEST-ID`) is house (`'H'`), THE Policy Detail Mapping SHALL copy the property type, bedrooms, value, postcode and house name from the request into the policy record", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f801f00b6e"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3ef200cc1", "id": "id-f3ef200cc1", "name": "Apply motor policy details", "text": "WHEN the policy type (`WF-REQUEST-ID`) is motor (`'M'`), THE Policy Detail Mapping SHALL copy the vehicle make, model, value and registration number from the request into the policy record", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3ef200cc1"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-59aa9ba7be", "id": "id-59aa9ba7be", "name": "Blank details for unrecognised policy type", "text": "WHEN the policy type (`WF-REQUEST-ID`) is not `'C'`, `'E'`, `'H'` or `'M'`, THE Policy Detail Mapping SHALL clear the policy details area of the record to spaces", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-59aa9ba7be"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-be5cf0364c", "id": "id-be5cf0364c", "name": "Build policy key from request", "text": "WHEN a policy update request is received from the caller, THE Policy Update Key Preparation SHALL derive the policy-type indicator (`WF-Request-ID`) from the fourth character of the request identifier (`CA-REQUEST-ID`), place the customer number (`CA-CUSTOMER-NUM`) and policy number (`CA-POLICY-NUM`) in the policy key, and take the read length from the length of the caller's data (`EIBCALEN`)", "program": "lgupvs01", "priority": "", "link": "../aws/index.html#/c/20/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-be5cf0364c"}], "claude": [{"key": "claude/RULE-077", "id": "RULE-077", "name": "Updating a policy replaces the whole policy-file record and requires it to already exist", "text": "Given House policy 0000000005 for customer 0000000001 exists in KSDSPOLY with value 00250000\nWhen An update request '01UHOU' with value 00275000 is processed\nThen The record is read for update and rewritten with all house fields from the request (value now 00275000). If the record is not found, return code 81 is set and the transaction aborts with LGV3. If the rewrite fails, return code 82 is set and the transaction aborts with LGV4", "program": "LGUPVS01", "priority": "P1", "link": "../claude/index.html#/c/22/claude/RULE-077"}]}, {"program": "LGWEBST5", "aws": [{"key": "No domain/TransactionStatisticsandMonitoring/id-2b20e5b0af", "id": "id-2b20e5b0af", "name": "Publish customer number counter statistic", "text": "THE Transaction Statistics Collection SHALL read the customer-number counter (`'GENACUSTNUM'`) from pool `'GENA'` and store it as the statistic for queue suffix `'X05V'`, recording its new value, previous value and change", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-2b20e5b0af"}, {"key": "No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6", "id": "id-d7a5c605f6", "name": "Collect and categorize transaction counters", "text": "THE Transaction Statistics Collection SHALL read each named counter from pool `'GENA'` and publish it under its queue suffix ('100V' through 'H00V'). Accumulate all counters into the success total (`CountSuccess`). Accumulate the inquiry counters ('GENA01ICUS00', 'GENA01IMOT00', 'GENA01IEND00', 'GENA01IHOU00', 'GENA01ICOM00') into `CountInq`, the add counters ('GENA01ACUS00', 'GENA01AMOT00', 'GENA01AEND00', 'GENA01AHOU00', 'GENA01ACOM00') into `CountAdd`, the delete counters ('GENA01DMOT00', 'GENA01DEND00', 'GENA01DHOU00', 'GENA01DCOM00') into `CountDel`, and the update counters ('GENA01UMOT00', 'GENA01UEND00', 'GENA01UHOU00') into `CountUpd`", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6"}, {"key": "No domain/TransactionStatisticsandMonitoring/id-1fba5c87ee", "id": "id-1fba5c87ee", "name": "Publish transaction type totals", "text": "THE Transaction Statistics Collection SHALL store the success total under 'X00V', the inquiry total under 'X01V', the add total under 'X02V', the update total under 'X03V' and the delete total under 'X04V', each with its new value, previous value and change", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-1fba5c87ee"}, {"key": "No domain/TransactionStatisticsandMonitoring/id-38b99a6f52", "id": "id-38b99a6f52", "name": "Compute elapsed interval since last run", "text": "THE Statistics Interval Timing SHALL retrieve the previous run time from the '000V' statistics queue (`WS-TSQname`), defaulting it to '120000' if none is available. Replace the stored time with the current time, and store the elapsed seconds, calculated as (current hours\u00d73600 + minutes\u00d760 + seconds) minus the same for the previous time", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-38b99a6f52"}, {"key": "No domain/TransactionStatisticsandMonitoring/id-dc7efe58f6", "id": "id-dc7efe58f6", "name": "Store statistic with previous value and change", "text": "THE Statistic Value Store SHALL retrieve the previous value from the statistic's queue (`WS-TSQname`), then replace the queue contents with the new value, the previous value and the change (new minus previous)", "program": "lgwebst5", "priority": "", "link": "../aws/index.html#/c/26/No domain/TransactionStatisticsandMonitoring/id-dc7efe58f6"}], "claude": [{"key": "claude/RULE-011", "id": "RULE-011", "name": "Total successful vs failed transaction counts", "text": "Given Success counters GENA01ICUS00=100, GENA01ACUS00=20, and every other '00' counter = 0. Error counters GENA01ICUS99=3, and every other '99' counter = 0.\nWhen the collector aggregates the counters\nThen CountSuccess = 120 and CountErrors = 3. CountSuccess is written to rate queue GENAX00V (new/old/delta). CountErrors goes only into the unused display field S39.", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/58/claude/RULE-011"}, {"key": "claude/RULE-012", "id": "RULE-012", "name": "Transaction volume by operation type (inquire/add/update/delete)", "text": "Given Successful inquiries ICUS=50, IMOT=10, IEND=5, IHOU=3, ICOM=2\nWhen the collector aggregates the counters\nThen the inquire total is 70, written to GENAX01V. The add total goes to GENAX02V, update to GENAX03V and delete to GENAX04V, each as a new/old/delta triple.", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/59/claude/RULE-012"}, {"key": "claude/RULE-013", "id": "RULE-013", "name": "Elapsed seconds since the previous statistics snapshot", "text": "Given Queue GENA000V holds the previous run time 14:58:30 (HHMMSS), and the current CICS time is 14:59:30\nWhen the statistics collector runs\nThen the old time is 53910 s (14*3600+58*60+30), the new time is 53970 s, the interval is 60 s, and GENA000V is rewritten with item 1 = '145930' (current time) and item 2 = '000060' (the interval)", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/56/claude/RULE-013"}, {"key": "claude/RULE-014", "id": "RULE-014", "name": "Per-counter snapshot and change since last snapshot (rate delta)", "text": "Given Queue GENA100V (successful customer inquiries) has 1,250 as item 1 from the last run, and the counter now reads 1,310\nWhen the collector processes that counter\nThen the queue is deleted and rewritten as item 1 = 000001310 (new), item 2 = 000001250 (old), item 3 = 000000060 (delta = new - old)", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/57/claude/RULE-014"}, {"key": "claude/RULE-078", "id": "RULE-078", "name": "Statistics collector re-schedules itself every minute", "text": "Given The statistics collector transaction is running\nWhen it finishes its interval calculation\nThen it issues START TRANSID('SSST') AFTER MINUTES(1), so the collector runs again 60 seconds later", "program": "LGWEBST5", "priority": "P1", "link": "../claude/index.html#/c/55/claude/RULE-078"}, {"key": "claude/RULE-098", "id": "RULE-098", "name": "Business-monitor symbol list is built but never delivered", "text": "Given All counters have been read and S1..S39 populated\nWhen the program reaches the end of MAINLINE (lines 703-709)\nThen it moves APPLID into S1 and returns without sending SymbList, the template or the start time S40 anywhere", "program": "LGWEBST5", "priority": "P2", "link": "../claude/index.html#/c/60/claude/RULE-098"}]}], "ai": {"ran": true, "note": "AI output: Claude read both tools' rules for each program both cover and proposed these pairs. Check each one.", "pairs": [{"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a14ec4ce5d", "claude": "claude/RULE-001", "confidence": "high", "reason": "Both describe taking the customer number from counter GENACUSTNUM and setting LGAC-NCS to 'NO' on failure; Claude also covers the identity fallback insert.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a14ec4ce5d", "id": "id-a14ec4ce5d", "name": "Obtain new customer number from counter", "text": "WHEN a new customer number is requested from the counter 'GENACUSTNUM' in pool 'GENA', THE Customer Number Assignment SHALL on success use the counter value as the customer number; on failure set the counter-availability indicator to 'NO' and clear the customer number", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a14ec4ce5d"}, "claude_rule": {"key": "claude/RULE-001", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the counter RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/1/claude/RULE-001"}}, {"aws": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-14c2f89566", "claude": "claude/RULE-001", "confidence": "high", "reason": "Same counter GENACUSTNUM allocation with the 'NO' flag on failure; Claude adds the DB-identity fallback.", "relation": "overlapping", "aws_rule": {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-14c2f89566", "id": "id-14c2f89566", "name": "Assign next customer number from counter", "text": "WHEN a validated customer registration request needs a customer number, THE Customer Number Assignment SHALL obtain the next value from counter 'GENACUSTNUM' in pool 'GENA' and use it as the customer number; if the counter fails, mark the counter unavailable ('NO') and clear the customer number", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-14c2f89566"}, "claude_rule": {"key": "claude/RULE-001", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the count
