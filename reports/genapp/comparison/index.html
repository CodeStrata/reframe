 in '/tmp'.", "program": "wsaup01", "priority": "", "link": "../aws/index.html#/c/43/WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-022d84425e"}], "claude_rules_unpaired": [{"key": "claude/RULE-010", "id": "RULE-010", "name": "Customer number low/high control record maintenance", "text": "Given Control queue GENACNTL contains '**** GENAPP CNTL', 'LOW CUSTOMER=0000000001', 'HIGH CUSTOMER=0000000010'\nWhen A new customer 0000000011 is successfully added\nThen The 'HIGH CUSTOMER=' entry is rewritten to 'HIGH CUSTOMER=0000000011'; LOW is unchanged. If the queue was empty, it is created with header, 'LOW CUSTOMER=0000000011' and 'HIGH CUSTOMER=0000000011'", "program": "LGTESTC1", "priority": "P1", "link": "../claude/index.html#/c/28/claude/RULE-010"}, {"key": "claude/RULE-033", "id": "RULE-033", "name": "New customer registration with system-assigned number and normalised postcode", "text": "Given A user enters first name 'Jane', last name 'Smith', DOB '1980-01-31', postcode 'so21 2jn' with option 2\nWhen The add-customer request (01ACUS) is sent to LGACUS01\nThen The request carries customer number 0 and postcode 'SO21 2JN'; on success the assigned customer number is displayed with 'New Customer Inserted' and the customer-number control record is updated; on any non-zero return code the transaction is rolled back and 'Error Adding Customer' is shown", "program": "LGTESTC1", "priority": "P1", "link": "../claude/index.html#/c/28/claude/RULE-033"}, {"key": "claude/RULE-034", "id": "RULE-034", "name": "Customer menu permits only Inquire, Add and Update actions", "text": "Given A user on the customer screen (transaction SSC1) with customer number 0000000123\nWhen The user enters option '3' (or blank, or any value other than 1, 2, 4) and presses Enter\nThen No back-end call is made, the message 'Please enter a valid option' is shown, the cursor is placed on the option field, and the conversation continues under SSC1", "program": "LGTESTC1", "priority": "P1", "link": "../claude/index.html#/c/27/claude/RULE-034"}, {"key": "claude/RULE-035", "id": "RULE-035", "name": "Motor policy menu permits Inquire, Add, Delete and Update", "text": "Given A user on the motor policy screen (transaction SSP1) with customer 0000000001 and policy 0000000005\nWhen The user enters option '1'\nThen Request 01IMOT is sent to LGIPOL01 and issue date, expiry date, make, model, value, registration, colour, CC, manufacture date, premium and accident count are displayed; if the return code > 0, 'No data was returned.' is shown", "program": "LGTESTP1", "priority": "P1", "link": "../claude/index.html#/c/30/claude/RULE-035"}, {"key": "claude/RULE-036", "id": "RULE-036", "name": "Motor policy add requires an existing customer and defaults payment/broker", "text": "Given A user enters customer 0000000999 (not on file), make 'FORD', value 15000, premium 450 with option 2\nWhen Request 01AMOT is sent to LGAPOL01 and it returns code 70\nThen The unit of work is rolled back and 'Customer does not exist' is shown; any other non-zero code shows 'Error Adding Motor Policy'; on success the assigned policy number is displayed with 'New Motor Policy Inserted'", "program": "LGTESTP1", "priority": "P1", "link": "../claude/index.html#/c/31/claude/RULE-036"}, {"key": "claude/RULE-037", "id": "RULE-037", "name": "Adding a policy requires an existing customer", "text": "Given Operator enters customer number 9999999999 which is not on file\nWhen Option 2 (add) is submitted and the back end returns CA-RETURN-CODE 70\nThen The unit of work is rolled back, message 'Customer does not exist' is set, the map is resent and the screen, map and commarea are reinitialized", "program": "LGTESTP2", "priority": "P1", "link": "../claude/index.html#/c/36/claude/RULE-037"}, {"key": "claude/RULE-038", "id": "RULE-038", "name": "Endowment (life) policy menu option dispatch and invalid-option guard", "text": "Given The endowment policy screen SSMAPP2 is displayed\nWhen The operator presses Enter with option field = '7' (or blank)\nThen No back-end program is called, the message 'Please enter a valid option' is shown and the cursor is positioned on the option field (length set to -1); the conversation continues under transaction SSP2", "program": "LGTESTP2", "priority": "P1", "link": "../claude/index.html#/c/34/claude/RULE-038"}, {"key": "claude/RULE-039", "id": "RULE-039", "name": "Inquire policy by customer number and policy number", "text": "Given Customer 0000000001 and policy 0000000001 entered on the endowment screen with option 1\nWhen LGIPOL01 is called with request id 01IEND\nThen If return code = 0 the issue date, expiry date, fund name, term, sum assured, life assured, with-profits, managed-fund and equities fields are displayed; if return code > 0 the message 'No data was returned.' is shown and the screen/commarea are reset", "program": "LGTESTP2", "priority": "P1", "link": "../claude/index.html#/c/34/claude/RULE-039"}, {"key": "claude/RULE-040", "id": "RULE-040", "name": "Commercial policy menu option validation", "text": "Given The Commercial Policy menu\nWhen The user enters option '4' or leaves the option blank and presses Enter\nThen 'Please enter a valid option' is shown, the cursor goes back to the option field and no back-end service is called", "program": "LGTESTP4", "priority": "P1", "link": "../claude/index.html#/c/44/claude/RULE-040"}, {"key": "claude/RULE-041", "id": "RULE-041", "name": "Commercial policy inquiry search-key precedence", "text": "Given The Commercial Policy menu with option '1' entered, customer number 0000000123 and policy number blank\nWhen The user presses Enter\nThen Request type '03ICOM' (search by customer) is sent to the inquiry service LGIPOL01 with customer 0000000123. If it returns a non-zero code the message 'No data was returned.' is shown. Otherwise the screen is filled with policy number, customer number, issue and expiry dates, address, postcode, latitude and longitude, customer name, property type, the fire, crime, flood and weather peril and premium values, status and reject reason", "program": "LGTESTP4", "priority": "P1", "link": "../claude/index.html#/c/45/claude/RULE-041"}, {"key": "claude/RULE-063", "id": "RULE-063", "name": "Customer update is a read-then-write two-step", "text": "Given Customer 0000000123 exists with postcode 'SO21 2JN'\nWhen The user selects option 4, the current details are displayed, the user changes the phone number and presses Enter\nThen An update (01UCUS) is sent to LGUCUS01 with all displayed fields (nulls converted to spaces, postcode upper-cased); on success 'Customer details updated' is shown; on failure 'Error Updating Customer' is shown", "program": "LGTESTC1", "priority": "P1", "link": "../claude/index.html#/c/29/claude/RULE-063"}, {"key": "claude/RULE-064", "id": "RULE-064", "name": "Motor policy delete with rollback on failure", "text": "Given Customer 0000000001 has motor policy 0000000005\nWhen The user selects option 3\nThen Request 01DMOT is sent; on success the screen shows 'Motor Policy Deleted' with dates and vehicle fields blanked; on return code > 0 a SYNCPOINT ROLLBACK is issued and 'Error Deleting Motor Policy' is shown", "program": "LGTESTP1", "priority": "P1", "link": "../claude/index.html#/c/32/claude/RULE-064"}, {"key": "claude/RULE-065", "id": "RULE-065", "name": "Motor policy update overwrites payment and broker details", "text": "Given Motor policy 0000000005 for customer 0000000001 has broker id 1234 and payment 200\nWhen The user selects option 4, changes the colour to 'RED' and submits\nThen Request 01UMOT is sent to LGUPOL01 with colour 'RED', payment 0, broker id 0, broker ref blank; on success 'Motor Policy Updated' is shown; on failure 'Error Updating Motor Policy' is shown", "program": "LGTESTP1", "priority": "P1", "link": "../claude/index.html#/c/33/claude/RULE-065"}, {"key": "claude/RULE-066", "id": "RULE-066", "name": "Update endowment policy via inquire-then-update", "text": "Given Policy 0000000001 for customer 0000000001 exists with term 20\nWhen Operator selects option 4, the policy is shown, operator changes term to 25 and presses Enter\nThen LGUPOL01 is called with request id 01UEND carrying issue/expiry dates, fund name, term 25, sum assured, life assured, with-profits, managed fund, equities; on return code 0 'Life Policy Updated' is shown and the option cleared; on return code > 0 'Error Updating Life Policy' is shown and the screen is reset", "program": "LGTESTP2", "priority": "P1", "link": "../claude/index.html#/c/37/claude/RULE-066"}, {"key": "claude/RULE-067", "id": "RULE-067", "name": "Add endowment policy from terminal", "text": "Given Customer 0000000001 exists; operator enters issue date 2025-01-01, expiry 2045-01-01, fund 'GROWTH', term 20, sum assured 100000, life assured name, with-profits 'Y', managed fund 'N', equities 'Y'\nWhen Option 2 is submitted and LGAPOL01 is called with request id 01AEND\nThen On return code 0 the screen shows the customer number, the newly assigned policy number and 'New Life Policy Inserted', and the option field is cleared; on return code > 0 a SYNCPOINT ROLLBACK is issued and the add-error path is taken", "program": "LGTESTP2", "priority": "P1", "link": "../claude/index.html#/c/36/claude/RULE-067"}, {"key": "claude/RULE-068", "id": "RULE-068", "name": "Delete policy with rollback on failure", "text": "Given House policy 0000000002 for customer 0000000001 exists\nWhen Operator selects option 3 and LGDPOL01 is called with request id 01DHOU\nThen Return code 0: detail fields blanked, option cleared, 'House Policy Deleted' shown; return code > 0: SYNCPOINT ROLLBACK, 'Error Deleting House Policy', screen and commarea reset", "program": "LGTESTP3", "priority": "P1", "link": "../claude/index.html#/c/38/claude/RULE-068"}, {"key": "claude/RULE-069", "id": "RULE-069", "name": "Update house policy via inquire-then-update", "text": "Given House policy 0000000002 for customer 0000000001 has value 00250000\nWhen Operator selects option 4, edits value to 00275000 and presses Enter\nThen LGUPOL01 is called with request id 01UHOU; return code 0 shows 'House Policy Updated'; return code > 0 shows 'Error Updating House Policy' and resets the screen", "program": "LGTESTP3", "priority": "P1", "link": "../claude/index.html#/c/42/claude/RULE-069"}, {"key": "claude/RULE-070", "id": "RULE-070", "name": "Add house policy from terminal", "text": "Given Customer 0000000001 exists; operator enters property type 'DETACHED', bedrooms 003, value 00250000, house name, house number, postcode\nWhen Option 2 is submitted and LGAPOL01 is called with request id 01AHOU\nThen On return code 0 the screen shows the customer number, the assigned policy number and 'New House Policy Inserted', option cleared; on return code > 0 SYNCPOINT ROLLBACK is issued and the add-error path is taken", "program": "LGTESTP3", "priority": "P1", "link": "../claude/index.html#/c/39/claude/RULE-070"}, {"key": "claude/RULE-071", "id": "RULE-071", "name": "Add commercial property policy with rollback on failure", "text": "Given Option '2' entered with customer 0000000123, issue and expiry dates, address, postcode, latitude and longitude, property type, the fire, crime, flood and weather peril and premium values, status and reject reason\nWhen The user presses Enter and LGAPOL01 returns code 0\nThen The new policy is created. The screen shows the customer number and the newly assigned policy number, clears the option field and shows 'New Commercial Policy Inserted'. If the return code is 70, the work is rolled back and 'Customer does not exist' is shown. Any other non-zero code rolls back and shows 'Error Adding Commercial Policy'", "program": "LGTESTP4", "priority": "P1", "link": "../claude/index.html#/c/44/claude/RULE-071"}, {"key": "claude/RULE-072", "id": "RULE-072", "name": "Delete commercial property policy with rollback on failure", "text": "Given Option '3' entered with customer 0000000123 and policy 0000000456\nWhen The user presses Enter and LGDPOL01 returns code 0\nThen The policy is deleted. The policy detail fields are blanked, the option field is cleared and 'Commercial Policy Deleted' is shown. If the return code is above 0, the work is rolled back and 'Error Deleting Commercial Policy' is shown", "program": "LGTESTP4", "priority": "P1", "link": "../claude/index.html#/c/47/claude/RULE-072"}, {"key": "claude/RULE-081", "id": "RULE-081", "name": "Error path resets screen and conversation context", "text": "Given An inquiry returned a non-zero return code\nWhen The NO-DATA/NO-UPD/NO-DELETE/NO-ADD path completes\nThen The map is resent with the message, SSMAPP2I/SSMAPP2O/COMM-AREA are initialized and control returns with next transaction SSP2", "program": "LGTESTP2", "priority": "P2", "link": "../claude/index.html#/c/34/claude/RULE-081"}, {"key": "claude/RULE-082", "id": "RULE-082", "name": "Commercial policy screen session flow and exit keys", "text": "Given A user starting the commercial policy transaction with no prior conversation data\nWhen The program is invoked\nThen A fresh form is shown with customer and policy numbers set to '0000000000' and peril, premium and status fields empty. Each later Enter returns control under transaction SSP4. PF3, or a receive with no data, shows 'Transaction ended' and ends the session. Clear redisplays an empty map and continues under SSP4", "program": "LGTESTP4", "priority": "P2", "link": "../claude/index.html#/c/44/claude/RULE-082"}, {"key": "claude/RULE-090", "id": "RULE-090", "name": "Terminal-entered policies carry no broker and no payment", "text": "Given Operator adds or updates a house or endowment policy from the terminal\nWhen The add (01AHOU/01AEND) or update (01UHOU/01UEND) request is built\nThen CA-PAYMENT = 0, CA-BROKERID = 0, CA-BROKERSREF = '        ' are sent regardless of any existing values", "program": "LGTESTP3", "priority": "P1", "link": "../claude/index.html#/c/36/claude/RULE-090"}]}, "links": {"aws": "../aws/index.html", "claude": "../claude/index.html", "reconciled": "../reconciled/index.html"}}</script>

const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prose = v => esc(v).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
const VIEWS = [['', 'Overview'], ['domains', 'Domains'], ['programs', 'Programs'], ['rules', 'Rules by program'], ['ai', 'AI-paired rules'], ['only', 'Only one tool']];
const STORE = 'reframe-compare:' + (D.project || '') + ':' + D.run + ':' + String(D.source.sha256 || '').slice(0, 16);
let marks = {}; try { marks = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch (e) {} }
const link = (href, label) => href ? '<a href="' + esc(href) + '">' + label + '</a>' : label;
if (D.links.reconciled) { const a = document.getElementById('reconciledLink'); a.href = D.links.reconciled; a.hidden = false; }
const awsSearch = q => D.links.aws + '#/search/' + encodeURIComponent(q), claudeSearch = q => D.links.claude + '#/search/' + encodeURIComponent(q);
const CAVEAT = '<p class="note">Both results are model output: AWS Transform\'s and Claude\'s. Two runs of either tool can find different domains, rules and wording, so read differences as things to check, not as errors. Claude\'s business functions, capabilities and requirements were generated by Reframe from the plugin\'s results.</p>';

function overview(){
  let h = '<h2>AWS Transform and Claude, side by side</h2>' + CAVEAT +
    '<p class="lead">Both tools assessed the same snapshot of ' + esc(D.source.name || 'the source') + ' (' + esc(D.source.files || '') + ' files, SHA-256 ' + esc(String(D.source.sha256 || '').slice(0, 16)) + '…). ' +
    'Start here, then go down to domains, programs and rules. Every number links to the items behind it in each review.</p>';
  h += '<div class="panel"><div class="scroll"><table class="cmp"><thead><tr><th></th><th>AWS Transform</th><th>Claude</th><th></th></tr></thead><tbody>' +
    D.numbers.map(([label, a, c, note]) => '<tr><td><b>' + esc(label) + '</b></td><td class="n">' + (a == null ? '<span class="muted small">not given</span>' : link(D.links.aws, a)) +
      '</td><td class="n">' + link(D.links.claude, c) + '</td><td class="small muted">' + esc(note) + '</td></tr>').join('') + '</tbody></table></div></div>';
  const both = D.programs.filter(p => p.in_aws && p.in_claude).length;
  h += '<div class="numbers">' + [[both, 'programs and jobs both tools covered'], [D.only.aws_programs.length, 'programs and jobs only AWS Transform covered'],
    [D.only.claude_programs.length, 'programs and jobs only Claude covered'], [D.pairs_by_program.length, 'programs where both wrote rules'],
    [D.ai.ran ? D.ai.pairs.length : '–', 'rule pairs proposed by AI']].map(([n, l]) => '<div><b>' + n + '</b><span>' + esc(l) + '</span></div>').join('') + '</div>';
  h += '<p class="small muted">AWS Transform results retrieved ' + esc(D.aws_at || '') + ' · Claude assessment finished ' + esc(D.claude_at || '') + ' · page built ' + esc(D.generated_at) + '</p>';
  return h;
}
function domains(){
  let h = '<h2>Domains, aligned by the programs they share</h2>' + CAVEAT + '<p class="lead">AWS Transform groups the system into business domains and functions; Claude\'s assessment into functional domains. ' +
    'For each AWS domain, the Claude domains holding the same programs are listed with how many programs they share.</p>';
  h += D.aws_domains.map(d => '<div class="panel"><h3 style="margin-top:0">' + link(d.link, esc(d.name)) + ' <span class="small muted">' + d.functions + ' functions · ' + d.programs.length + ' programs</span></h3>' +
    (d.matches.length ? '<table><tbody>' + d.matches.map(m => '<tr><td style="width:34%">' + esc(m.name) + '</td><td style="width:22%">' + m.shared.length + ' shared (' + Math.round(100 * m.share) + '% of AWS\'s)<div class="bar2"><i style="width:' + Math.round(100 * m.share) + '%"></i></div></td><td class="small">' +
      m.shared.map(p => '<code>' + esc(p) + '</code>').join(' ') + '</td></tr>').join('') + '</tbody></table>' : '<p class="muted">No Claude domain holds these programs.</p>') + '</div>').join('');
  h += '<h3>Claude\'s domains</h3><div class="scroll panel"><table><thead><tr><th>Claude domain</th><th>Programs</th><th>Also in AWS Transform</th><th>Only Claude</th></tr></thead><tbody>' +
    D.claude_domains.map(d => '<tr><td>' + link(d.link, esc(d.name)) + '</td><td>' + d.programs.length + '</td><td>' + d.shared.length + '</td><td class="small">' + d.only_claude.map(p => '<code>' + esc(p) + '</code>').join(' ') + '</td></tr>').join('') + '</tbody></table></div>';
  return h;
}
let filter = {q: '', side: ''};
function programs(){
  const q = filter.q.toLowerCase();
  const rows = D.programs.filter(p => (!q || (p.program + ' ' + p.claude_domains.join(' ') + ' ' + p.aws_functions.map(f => f.name).join(' ')).toLowerCase().includes(q)) &&
    (!filter.side || (filter.side === 'both' ? p.in_aws && p.in_claude : filter.side === 'aws' ? p.in_aws && !p.in_claude : !p.in_aws && p.in_claude)));
  let h = '<h2>Programs</h2><p class="lead">Each program, the AWS function and Claude domain it sits in, and how many business rules each tool wrote about it.</p>';
  h += '<div class="panel"><div class="tools"><input type="search" id="pq" value="' + esc(filter.q) + '" placeholder="Filter by program, function or domain"><select id="ps">' +
    [['', 'Every program'], ['both', 'Covered by both'], ['aws', 'Only AWS Transform'], ['claude', 'Only Claude']].map(([v, l]) => '<option value="' + v + '"' + (filter.side === v ? ' selected' : '') + '>' + l + '</option>').join('') +
    '</select><span class="muted small" style="align-self:center">' + rows.length + ' of ' + D.programs.length + '</span></div>' +
    '<div class="tablebox"><table class="datatable"><colgroup><col style="width:130px"><col><col><col style="width:90px"><col style="width:90px"></colgroup><thead><tr><th>Program</th><th>AWS Transform function</th><th>Claude domain</th><th>AWS rules</th><th>Claude rules</th></tr></thead><tbody>' +
    rows.map(p => '<tr><td class="id"><code>' + esc(p.program) + '</code></td><td>' + (p.aws_functions.map(f => link(f.link, esc(f.name))).join('<br>') || '<span class="muted">–</span>') + '</td><td>' +
      (esc(p.claude_domains.join(', ')) || '<span class="muted">–</span>') + '</td><td>' + (p.aws_rules ? link(awsSearch(p.program), p.aws_rules) : '0') + '</td><td>' + (p.claude_rules ? link(claudeSearch(p.program), p.claude_rules) : '0') + '</td></tr>').join('') +
    '</tbody></table></div></div>';
  return h;
}
function ruleBox(r, side){ return '<div class="item"><div class="head"><span class="tag grey">' + side + '</span>' + (r.id && side === 'Claude' ? '<code>' + esc(r.id) + '</code>' : '') + (r.priority ? '<span class="tag">' + esc(r.priority) + '</span>' : '') +
  (r.link ? '<a href="' + esc(r.link) + '">open in the review</a>' : '') + '</div><div class="text"><b>' + prose(r.name) + '</b><br>' + prose(r.text) + '</div></div>'; }
let ruleProgram = '';
function rules(){
  const list = D.pairs_by_program, chosen = list.find(g => g.program === ruleProgram) || list[0];
  let h = '<h2>Rules by program</h2>' + CAVEAT + '<p class="lead">For each program both tools wrote rules about, the two lists side by side. This pairing is by program only: it does not claim two rules are the same.</p>';
  if (!list.length) return h + '<p class="muted">No program has rules from both tools.</p>';
  h += '<div class="panel"><div class="tools"><select id="rp">' + list.map(g => '<option value="' + esc(g.program) + '"' + (g === chosen ? ' selected' : '') + '>' + esc(g.program) + ' (AWS ' + g.aws.length + ' · Claude ' + g.claude.length + ')</option>').join('') + '</select></div>';
  h += '<div class="two"><div class="side"><h4>AWS Transform: ' + chosen.aws.length + ' rules</h4>' + chosen.aws.map(r => ruleBox(r, 'AWS Transform')).join('') + '</div>' +
    '<div class="side"><h4>Claude: ' + chosen.claude.length + ' rule cards</h4>' + chosen.claude.map(r => ruleBox(r, 'Claude')).join('') + '</div></div></div>';
  return h;
}
const RELATION = {conflicting: 'Conflicting', same: 'Same rule', overlapping: 'Overlapping'};
let aiFilter = '';
function ai(){
  let h = '<h2>Rules paired by AI</h2><p class="note">' + esc(D.ai.note || 'AI output.') + '</p>';
  if (!D.ai.ran) return h + '<p class="muted">The AI pairing has not run for this comparison.</p>';
  const by = {}; D.ai.pairs.forEach(p => by[p.relation] = (by[p.relation] || 0) + 1);
  h += '<div class="numbers">' + Object.entries(RELATION).map(([k, l]) => '<div><b>' + (by[k] || 0) + '</b><span>' + l + '</span></div>').join('') + '</div>';
  const order = {conflicting: 0, same: 1, overlapping: 2}, conf = {high: 0, medium: 1, low: 2};
  const shown = D.ai.pairs.filter(p => !aiFilter || p.relation === aiFilter).sort((a, b) => (order[a.relation] - order[b.relation]) || (conf[a.confidence] - conf[b.confidence]));
  h += '<p class="lead">Conflicting pairs come first: the two tools describe the same behaviour differently. Mark each pair Right or Wrong. Your marks stay in this browser; download them below.</p>' +
    '<div class="tools"><select id="ar"><option value="">Every pair (' + D.ai.pairs.length + ')</option>' + Object.entries(RELATION).map(([k, l]) => '<option value="' + k + '"' + (aiFilter === k ? ' selected' : '') + '>' + l + ' (' + (by[k] || 0) + ')</option>').join('') +
    '</select><button class="btn" id="dl">Download my marks (CSV)</button></div>';
  h += shown.map((p, i) => { const k = p.aws + '|' + p.claude, m = marks[k] || '';
    return '<div class="panel"><div class="head small muted" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><span class="tag' + (p.relation === 'conflicting' ? ' warn' : '') + '">' + esc(RELATION[p.relation] || p.relation) + '</span><span class="tag grey">Confidence: ' + esc(p.confidence) + '</span><span class="tag grey">AI output</span></div>' +
      '<p>' + esc(p.reason) + '</p><div class="two">' + ruleBox(p.aws_rule, 'AWS Transform') + ruleBox(p.claude_rule, 'Claude') + '</div>' +
      '<div class="marks" data-pair="' + esc(k) + '"><button class="agree" aria-pressed="' + (m === 'right') + '" data-v="right">✓ Right</button><button class="change" aria-pressed="' + (m === 'wrong') + '" data-v="wrong">✗ Wrong</button></div></div>'; }).join('');
  return h;
}
function only(){
  let h = '<h2>What only one tool found</h2>' + CAVEAT;
  h += '<div class="two"><div class="panel"><h3 style="margin-top:0">Programs only AWS Transform covered (' + D.only.aws_programs.length + ')</h3><p>' + D.only.aws_programs.map(p => '<code>' + esc(p) + '</code>').join(' ') + '</p></div>' +
    '<div class="panel"><h3 style="margin-top:0">Programs only Claude covered (' + D.only.claude_programs.length + ')</h3><p>' + D.only.claude_programs.map(p => '<code>' + esc(p) + '</code>').join(' ') + '</p></div></div>';
  h += '<div class="two"><div class="side"><h4>AWS Transform rules in programs Claude wrote no rule about (' + D.only.aws_rules_unpaired.length + ')</h4>' + D.only.aws_rules_unpaired.slice(0, 200).map(r => ruleBox(r, 'AWS Transform')).join('') + '</div>' +
    '<div class="side"><h4>Claude rule cards in programs AWS Transform wrote no rule about (' + D.only.claude_rules_unpaired.length + ')</h4>' + D.only.claude_rules_unpaired.slice(0, 200).map(r => ruleBox(r, 'Claude')).join('') + '</div></div>';
  return h;
}
function route(){
  const view = (location.hash || '#/').slice(2).split('/')[0];
  $('views').innerHTML = VIEWS.map(([id, label]) => '<a href="#/' + id + '" class="' + (id === view ? 'on' : '') + '">' + label + '</a>').join('');
  $('main').innerHTML = ({'': overview, domains, programs, rules, ai, only}[view] || overview)();
}
document.addEventListener('input', e => { if (e.target.id === 'pq') { filter.q = e.target.value; const at = e.target.selectionStart; route(); const i = $('pq'); i.focus(); i.setSelectionRange(at, at); } });
document.addEventListener('change', e => { if (e.target.id === 'ps') { filter.side = e.target.value; route(); } if (e.target.id === 'rp') { ruleProgram = e.target.value; route(); } if (e.target.id === 'ar') { aiFilter = e.target.value; route(); } });
document.addEventListener('click', e => {
  const b = e.target.closest('.marks button'); if (b) { const k = b.closest('.marks').dataset.pair; marks[k] = marks[k] === b.dataset.v ? '' : b.dataset.v; save(); route(); return; }
  if (e.target.id === 'dl') { const rows = [['aws_rule', 'claude_rule', 'relation', 'confidence', 'reason', 'your_mark', 'project', 'run', 'source_sha256']].concat(
    D.ai.pairs.map(p => [p.aws, p.claude, p.relation, p.confidence, p.reason, marks[p.aws + '|' + p.claude] || '', D.project, D.run, D.source.sha256]));
    const body = rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + body], {type: 'text/csv'})); a.download = 'ai-pairs-' + (D.project || 'run') + '.csv'; document.body.appendChild(a); a.click(); a.remove(); }
});
window.addEventListener('hashchange', route);
$('title').textContent = 'AWS Transform and Claude compared' + (D.project ? ': ' + D.project : '');
$('subtitle').textContent = 'The same snapshot, assessed by both' + (D.source.commit ? ' · ' + String(D.source.commit).slice(0, 12) : '');
route();
</script>
</body>
</html>
