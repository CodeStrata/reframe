ions": [{"name": "Web Service Interface Generation", "link": "../aws/index.html#/f/5"}], "claude_domains": [], "aws_rules": 1, "claude_rules": 0, "in_aws": true, "in_claude": false}, {"program": "WSAUP01", "aws_functions": [{"name": "Web Service Interface Generation", "link": "../aws/index.html#/f/5"}], "claude_domains": [], "aws_rules": 4, "claude_rules": 0, "in_aws": true, "in_claude": false}, {"program": "WSAVC01", "aws_functions": [{"name": "Web Service Interface Generation", "link": "../aws/index.html#/f/5"}], "claude_domains": [], "aws_rules": 1, "claude_rules": 0, "in_aws": true, "in_claude": false}, {"program": "WSAVP01", "aws_functions": [{"name": "Web Service Interface Generation", "link": "../aws/index.html#/f/5"}], "claude_domains": [], "aws_rules": 1, "claude_rules": 0, "in_aws": true, "in_claude": false}], "pairs_by_program": [{"program": "LGACDB01", "aws": [{"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a14ec4ce5d", "id": "id-a14ec4ce5d", "name": "Obtain new customer number from counter", "text": "WHEN a new customer number is requested from the counter 'GENACUSTNUM' in pool 'GENA', THE Customer Number Assignment SHALL on success use the counter value as the customer number; on failure set the counter-availability indicator to 'NO' and clear the customer number", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a14ec4ce5d"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3697bf81df", "id": "id-3697bf81df", "name": "Validate request length and default success", "text": "WHEN an add-customer request with request data is received, THE Customer Registration Request Validation SHALL preset the return code to `'00'`, require the request length to be at least the header length (18) plus the customer record length (72), return `'98'` to the caller when it is shorter, and otherwise proceed to obtain a customer number and insert the customer", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3697bf81df"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ebb7c9f9be", "id": "id-ebb7c9f9be", "name": "Insert customer with counter-issued number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is `'ON'`, WHEN the customer insert is performed, THE Customer Record Creation SHALL insert the customer into the customer store (`CUSTOMER`) with the counter-issued number and the supplied name, date of birth, address, phone and email details, and on insert failure return `'90'` to the caller", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ebb7c9f9be"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868", "id": "id-65ef7a3868", "name": "Insert customer with generated number and return it", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is not `'ON'`, WHEN the customer insert is performed, THE Customer Record Creation SHALL insert the customer with a store-generated customer number and the supplied details, return `'90'` to the caller on insert failure, and otherwise capture the generated number; after any successful insert, return the customer number to the caller", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d51944a3ed", "id": "id-d51944a3ed", "name": "Validate minimum request length", "text": "IF the received request length (`EIBCALEN`) is less than the header length (18) plus the customer record length (72), THEN THE Customer Registration SHALL return to the caller without creating a customer, having initialized the return code to '00'", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d51944a3ed"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-7c308664cf", "id": "id-7c308664cf", "name": "Register customer and hand off to copy program", "text": "WHEN a validated new-customer request has been inserted successfully, THE Customer Registration SHALL delegate to the customer copy program (`LGACVS01`) with the full 225-byte request data, including the assigned customer number", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-7c308664cf"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d801f6a4a8", "id": "id-d801f6a4a8", "name": "Insert customer with counter-assigned number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is 'ON', WHEN the new customer is to be stored, THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) with the counter-assigned number and the request's personal, address and contact details; if the insert fails, return to the caller without further processing", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d801f6a4a8"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f", "id": "id-721917222f", "name": "Insert customer with store-assigned number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is not 'ON', WHEN the new customer is to be stored, THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) letting the store assign the customer number, retrieve that generated number, and return the assigned customer number to the caller; if the insert fails, return to the caller without further processing", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3a3fc86b3a", "id": "id-3a3fc86b3a", "name": "Reject customer data shorter than required", "text": "IF the received request length (`EIBCALEN`) is less than the header length (18) plus the customer record length (72), THEN THE Customer Add Request Intake SHALL return to the caller without obtaining a customer number or adding the customer", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3a3fc86b3a"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-14c2f89566", "id": "id-14c2f89566", "name": "Assign next customer number from counter", "text": "WHEN a validated customer registration request needs a customer number, THE Customer Number Assignment SHALL obtain the next value from counter 'GENACUSTNUM' in pool 'GENA' and use it as the customer number; if the counter fails, mark the counter unavailable ('NO') and clear the customer number", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-14c2f89566"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d29d130688", "id": "id-d29d130688", "name": "Insert customer with counter-assigned number", "text": "WHEN the counter-availability indicator (`LGAC-NCS`) is 'ON', THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) using the counter-assigned customer number and the supplied name, date of birth, address, phones and email; on insert failure write an error message and return to the caller", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d29d130688"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-06ae3bdd5a", "id": "id-06ae3bdd5a", "name": "Insert customer with database-default number", "text": "WHEN the counter-availability indicator (`LGAC-NCS`) is not 'ON', THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) letting the database assign the customer number by default; on insert failure write an error message and return to the caller", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-06ae3bdd5a"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ee6f8cefcf", "id": "id-ee6f8cefcf", "name": "Stop when counter-numbered customer add fails", "text": "WHILE the counter-service indicator (`LGAC-NCS`) is `'ON'`, WHEN the customer database outcome (`SQLCODE`) is not 0, THE Customer Add SHALL return to the caller without creating the customer security record", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ee6f8cefcf"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-efec943615", "id": "id-efec943615", "name": "Add customer with database-assigned number", "text": "WHILE the counter-service indicator (`LGAC-NCS`) is not `'ON'`, WHEN a validated new customer is to be added, THE Customer Add SHALL add the customer to the customer store (`CUSTOMER`) with a store-assigned number and the supplied name, birth date, address, phone and email; return to the caller if the add fails, otherwise capture the assigned customer number", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-efec943615"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8e98397165", "id": "id-8e98397165", "name": "Request customer security record creation", "text": "WHEN a new customer has been added and assigned a customer number, THE Customer Security Setup SHALL delegate to the customer security program (`LGACDB02`) with request type `'02ACUS'`, the new customer number, initial password `'5732fec825535eeafb8fac50fee3a8aa'`, attempt count `'0000'` and state `'N'`", "program": "lgacdb01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8e98397165"}], "claude": [{"key": "claude/RULE-001", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the counter RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/1/claude/RULE-001"}, {"key": "claude/RULE-048", "id": "RULE-048", "name": "Default security credentials created for every new customer", "text": "Given Customer 1000042 was just inserted\nWhen LGACDB01 links to LGACDB02\nThen A customer-security record is requested for customer 1000042 with password hash <credential \u2014 masked, see base/src/lgacdb01.cbl:181> (preview '5732****'), count '0000' and state 'N'", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/3/claude/RULE-048"}, {"key": "claude/RULE-049", "id": "RULE-049", "name": "Customer record creation and insert failure outcome", "text": "Given An add-customer request whose commarea passes the length check\nWhen The INSERT INTO CUSTOMER returns a non-zero SQLCODE (for example -803 duplicate key, or -180 for an invalid DOB value)\nThen CA-RETURN-CODE is set to '90', an error message with the SQLCODE is written to the queue through LGSTSQ, and the program returns. The VSAM copy and the security record are not created.", "program": "LGACDB01", "priority": "P0", "link": "../claude/index.html#/c/2/claude/RULE-049"}, {"key": "claude/RULE-084", "id": "RULE-084", "name": "New customer is mirrored to the VSAM customer file", "text": "Given Customer 1000042 was inserted into DB2\nWhen LGACDB01 continues after INSERT-CUSTOMER\nThen LGACVS01 is linked with the first 225 bytes of the commarea (header plus customer details)", "program": "LGACDB01", "priority": "P1", "link": "../claude/index.html#/c/4/claude/RULE-084"}]}, {"program": "LGACUS01", "aws": [{"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-991c375aa8", "id": "id-991c375aa8", "name": "Default return code and policy count", "text": "WHEN a request with non-zero data length is received, THE Customer Request Validation SHALL set the return code (`CA-RETURN-CODE`) to success `'00'` and the number of policies (`CA-NUM-POLICIES`) to `'00'`", "program": "lgacus01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-991c375aa8"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8ca65a04f0", "id": "id-8ca65a04f0", "name": "Reject request shorter than required length", "text": "IF the received data length (`EIBCALEN`) is less than the header length plus the customer record length, THEN THE Customer Request Validation SHALL set the return code (`CA-RETURN-CODE`) to `'98'` and return to the caller", "program": "lgacus01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8ca65a04f0"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-86b7805ffc", "id": "id-86b7805ffc", "name": "Validate request length for customer data", "text": "WHEN the received request length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN`) plus the customer record length (`WS-CUSTOMER-LEN`), THE Customer Registration Request Intake SHALL set the return code to success ('00') and the policy count to zero, then return to the caller without inserting the customer", "program": "lgacus01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-86b7805ffc"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-bfeb0b3e78", "id": "id-bfeb0b3e78", "name": "Delegate customer insertion to database module", "text": "WHEN a customer request has passed the presence and length validations, THE Customer Registration SHALL delegate to the customer database module (`LGACDB01`), passing the full customer request with length 32500, to insert the new customer", "program": "lgacus01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-bfeb0b3e78"}], "claude": [{"key": "claude/RULE-018", "id": "RULE-018", "name": "Minimum request size for customer add and inquire", "text": "Given An add-customer request commarea of 80 bytes\nWhen LGACUS01 (or LGICUS01 or LGACDB01) checks the length\nThen CA-RETURN-CODE = '98' and the program returns without touching the database. With 0 bytes, an error message is logged and the task abends with code 'LGCA'.", "program": "LGACUS01", "priority": "P1", "link": "../claude/index.html#/c/0/claude/RULE-018"}]}, {"program": "LGACVS01", "aws": [{"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-98ad855daf", "id": "id-98ad855daf", "name": "Write new customer record", "text": "WHEN a customer number (`CA-CUSTOMER-NUM`) is supplied for a new customer record, THE Customer Record Creation SHALL write the customer record to the customer file (`KSDSCUST`) keyed by the customer number with a 0225-byte length; if the write fails, capture the secondary response detail, log the failure, and abend with code `'LGV0'`", "program": "lgacvs01", "priority": "", "link": "../aws/index.html#/c/21/CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-98ad855daf"}], "claude": [{"key": "claude/RULE-050", "id": "RULE-050", "name": "New customer is stored in the customer master file under its 10-digit customer number", "text": "Given A new-customer request with customer number 0001000042, first name 'Jane', last name 'Smith', DOB '1980-05-14', postcode 'SO21 2JN' and email '<email>'\nWhen the add-customer VSAM step (LGACVS01) runs\nThen a record of 225 bytes (customer number + name, DOB, house name/number, postcode, number of policies, mobile, home phone, email) is written to KSDSCUST with key 0001000042; if KSDSCUST already holds key 0001000042 (DUPREC) or any other non-NORMAL response occurs, CA-RETURN-CODE is set to '80', an error is logged, and the task abends with LGV0 (no dump)", "program": "LGACVS01", "priority": "P0", "link": "../claude/index.html#/c/4/claude/RULE-050"}, {"key": "claude/RULE-094", "id": "RULE-094", "name": "VSAM customer-file failures are recorded in an audit log with a timestamp and the request data", "text": "Given An update for customer 0001000042 fails because the record is not found (RESP=13)\nWhen the error routine runs\nThen one message is sent to LGSTSQ in the form '<MMDDYYYY> <HHMMSS> LGUCVS01 CNUM=0001000042 Re-write  KSDSCUST  RESP=+00013 RESP2=+00000', and a second message 'COMMAREA=' followed by the first 90 bytes of the commarea", "program": "LGACVS01", "priority": "P2", "link": "../claude/index.html#/c/10/claude/RULE-094"}]}, {"program": "LGAPDB01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-390dc7122b", "id": "id-390dc7122b", "name": "Reject request shorter than required length", "text": "IF the received request length (`EIBCALEN`) is less than the required length (`WS-REQUIRED-CA-LEN`) for the policy type, THEN THE Policy Add Request Validation SHALL return to the caller without recording the policy", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-390dc7122b"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ba0408ad62", "id": "id-ba0408ad62", "name": "Route to type-specific policy detail insert", "text": "WHEN the policy has been recorded and the request identifier (`CA-REQUEST-ID`) is `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'`, THE Policy Registration SHALL record the policy in the main policy store, then run the endowment, house, motor or commercial detail insert matching the request identifier", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ba0408ad62"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-72ac5642e9", "id": "id-72ac5642e9", "name": "Determine policy type and required data length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is '01AEND', '01AHOU', '01AMOT' or '01ACOM', THE Policy Add Request Intake SHALL compute the required data length as the header length 28 plus the full record length for the type (124 for endowment, 130 for house, 137 for motor, 1174 for commercial), and set the policy type to 'E', 'H', 'M' or 'C' respectively", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-72ac5642e9"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c86469d39d", "id": "id-c86469d39d", "name": "End processing for unknown request type", "text": "IF the request identifier (`CA-REQUEST-ID`) is not '01AEND', '01AHOU', '01AMOT' or '01ACOM', THEN THE Policy Add Request Intake SHALL return to the caller without creating any policy", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c86469d39d"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5ef0661502", "id": "id-5ef0661502", "name": "Create common policy record", "text": "WHEN a validated add-policy request is processed, THE Policy Record Creation SHALL add a policy row to the policy store (`POLICY`) with a system-assigned policy number, the customer, issue and expiry dates, policy type, current timestamp, broker id, broker's reference and payment", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5ef0661502"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-29fba40dae", "id": "id-29fba40dae", "name": "Stop when policy record insert fails", "text": "IF the policy row cannot be written, either because the customer does not exist (`-530`) or because of any other failure, THEN THE Policy Record Creation SHALL log the error message and return to the caller without writing type-specific details", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-29fba40dae"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7d63ee3c38", "id": "id-7d63ee3c38", "name": "Return assigned policy number and timestamp", "text": "WHEN the policy row has been written successfully, THE Policy Record Creation SHALL return the assigned policy number to the caller, and read and return the last-changed timestamp from the policy store (`POLICY`) for that policy number", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7d63ee3c38"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c32efb4c34", "id": "id-c32efb4c34", "name": "Create endowment policy details", "text": "WHEN an endowment policy ('01AEND') has been created in the policy store, THE Endowment Policy Creation SHALL write the endowment details to the endowment store (`ENDOWMENT`), including the extra data when the received length exceeds the required length and omitting it otherwise; on write failure log the error and terminate abnormally with 'LGSQ'", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/10/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c32efb4c34"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-044e547baf", "id": "id-044e547baf", "name": "Create house policy details", "text": "WHEN a house policy ('01AHOU') has been created in the policy store, THE House Policy Creation SHALL write the house details to the house store (`HOUSE`); on failure log the error and terminate abnormally with 'LGSQ'", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/10/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-044e547baf"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-af6e61f1b8", "id": "id-af6e61f1b8", "name": "Create motor policy details", "text": "WHEN a motor policy ('01AMOT') has been created in the policy store, THE Motor Policy Creation SHALL write the motor details to the motor store (`MOTOR`); on failure log the error and terminate abnormally with 'LGSQ'", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/10/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-af6e61f1b8"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-671ad4e04a", "id": "id-671ad4e04a", "name": "Create commercial policy details", "text": "WHEN a commercial policy ('01ACOM') has been created in the policy store, THE Commercial Policy Creation SHALL write the commercial details to the commercial store (`COMMERCIAL`), using the last-changed timestamp as request date, the issue date as start date and the expiry date as renewal date; on failure log the error and terminate abnormally with 'LGSQ'", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/10/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-671ad4e04a"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0d9a8f3ef", "id": "id-a0d9a8f3ef", "name": "Reject unrecognised policy request", "text": "IF the request identifier (`CA-REQUEST-ID`) is not `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'`, THEN THE Policy Creation Request Intake SHALL return outcome code `'99'` to the caller without creating a policy", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0d9a8f3ef"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ff258ee466", "id": "id-ff258ee466", "name": "Reject request shorter than required length", "text": "IF the received request length (`EIBCALEN`) is less than the required length (`WS-REQUIRED-CA-LEN`), THEN THE Policy Creation Request Intake SHALL return outcome code `'98'` to the caller without creating a policy", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ff258ee466"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-99cfb6d993", "id": "id-99cfb6d993", "name": "Route policy creation by policy type", "text": "WHEN a validated policy creation request is processed, THE Policy Creation Orchestration SHALL create the master policy row, then add the detail row matching `'01AEND'` (endowment), `'01AHOU'` (house), `'01AMOT'` (motor) or `'01ACOM'` (commercial). Set outcome `'99'` for any other identifier.", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-99cfb6d993"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e2e938826d", "id": "id-e2e938826d", "name": "Create master policy record", "text": "WHEN a validated policy creation request is processed, THE Policy Master Creation SHALL insert a policy master row with an auto-assigned policy number, the customer, dates, policy type, current timestamp, broker, broker's reference and payment. Set outcome `'00'` on success.", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e2e938826d"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-73fccd0ddd", "id": "id-73fccd0ddd", "name": "Reject policy when customer reference invalid", "text": "IF the master policy insert is rejected because the referenced customer does not exist, THEN THE Policy Master Creation SHALL return outcome code `'70'` to the caller and stop policy creation", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-73fccd0ddd"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbac5019dd", "id": "id-cbac5019dd", "name": "Return assigned policy number and timestamp", "text": "WHEN the master policy row is created successfully, THE Policy Master Creation SHALL return the newly assigned policy number and the LASTCHANGED timestamp read back from the policy master table for that policy number", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbac5019dd"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3b2fa437b", "id": "id-f3b2fa437b", "name": "Add endowment policy details", "text": "WHEN an endowment request (`'01AEND'`) has its master policy created, THE Endowment Policy Creation SHALL insert the endowment details for the new policy number, including the padding data only when the request exceeds its required length. On failure set outcome `'90'` and abend with `'LGSQ'`.", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/10/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3b2fa437b"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-54a9a245fa", "id": "id-54a9a245fa", "name": "Add house policy details", "text": "WHEN a house request (`'01AHOU'`) has its master policy created, THE House Policy Creation SHALL insert the house details for the new policy number. On failure set outcome `'90'` and abend with `'LGSQ'`.", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/10/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-54a9a245fa"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e34469caea", "id": "id-e34469caea", "name": "Add motor policy details", "text": "WHEN a motor request (`'01AMOT'`) has its master policy created, THE Motor Policy Creation SHALL insert the motor details for the new policy number. On failure set outcome `'90'` and abend with `'LGSQ'`.", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/10/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e34469caea"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bd57cb0fcb", "id": "id-bd57cb0fcb", "name": "Add commercial policy details", "text": "WHEN a commercial request (`'01ACOM'`) has its master policy created, THE Commercial Policy Creation SHALL insert the commercial property, peril, premium, status and rejection details for the new policy number, using the policy timestamp as request date. On failure set outcome `'90'` and abend with `'LGSQ'`.", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/10/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bd57cb0fcb"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-00acb00307", "id": "id-00acb00307", "name": "End processing for unrecognised request type", "text": "IF the request identifier (`CA-REQUEST-ID`) is not `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'`, THEN THE Policy Add Request Validation SHALL return to the caller without recording any policy", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-00acb00307"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b57f2e52e", "id": "id-4b57f2e52e", "name": "Insert policy and return assigned identifiers", "text": "WHEN a validated add-policy request is processed, THE Policy Registration SHALL insert the policy into the policy store (`POLICY`) with a database-assigned number and the current timestamp. On success, set return code `'00'` and return the assigned policy number and last-changed timestamp. On a referential-constraint rejection or any other failure, return to the caller", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b57f2e52e"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8fe29ce40c", "id": "id-8fe29ce40c", "name": "Flag unsupported request at detail routing", "text": "IF the request identifier (`CA-REQUEST-ID`) is not `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'` at detail routing, THEN THE Policy Registration SHALL set the return code to `'99'` (request not recognised or supported)", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/9/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8fe29ce40c"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5378c55f95", "id": "id-5378c55f95", "name": "Pass request to follow-on program", "text": "WHEN policy registration processing completes without ending early, THE Policy Registration SHALL delegate to the follow-on program (`LGAPVS01`) with the full request data, length 32500", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5378c55f95"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb2d8cc23e", "id": "id-eb2d8cc23e", "name": "Determine policy type and required length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'`, THE Policy Add Request Validation SHALL default the return code to `'00'`, stage the customer number, and set the required request length to 28 plus the type length. Assign the policy type: 124 and `'E'` for endowment, 130 and `'H'` for house, 137 and `'M'` for motor, 1174 and `'C'` for commercial", "program": "lgapdb01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb2d8cc23e"}], "claude": [{"key": "claude/RULE-002", "id": "RULE-002", "name": "Motor and house details stored without rating", "text": "Given A Motor add request with value 15000, engine size 1600cc, premium 450 and 2 accidents\nWhen The MOTOR row is inserted\nThen PREMIUM is stored as 450 and ACCIDENTS as 2, exactly as supplied. The premium is not adjusted for accidents, CC or value.", "program": "LGAPDB01", "priority": "P1", "link": "../claude/index.html#/c/13/claude/RULE-002"}, {"key": "claude/RULE-015", "id": "RULE-015", "name": "Endowment free-form padding data stored only when supplied", "text": "Given An Endowment add request 252 bytes long\nWhen The endowment row is inserted\nThen The padding data length is 252 - 152 = 100. The 100 bytes are stored in PADDINGDATA together with with-profits, equities, managed fund, fund name, term, sum assured and life assured.", "program": "LGAPDB01", "priority": "P2", "link": "../claude/index.html#/c/13/claude/RULE-015"}, {"key": "claude/RULE-019", "id": "RULE-019", "name": "Minimum request length per policy type", "text": "Given A Motor add request ('01AMOT') that is 150 bytes long\nWhen The length check runs\nThen It is rejected with return code '98', because Motor needs 28 + 137 = 165 bytes. Nothing is inserted.", "program": "LGAPDB01", "priority": "P1", "link": "../claude/index.html#/c/11/claude/RULE-019"}, {"key": "claude/RULE-020", "id": "RULE-020", "name": "Add-policy request type determines policy type", "text": "Given A caller sends an add-policy request with request ID '01AMOT'\nWhen LGAPDB01 checks the request\nThen The policy type is set to 'M' (Motor) and processing continues. A request ID such as '01XYZ' would get return code '99' and nothing would be inserted.", "program": "LGAPDB01", "priority": "P1", "link": "../claude/index.html#/c/11/claude/RULE-020"}, {"key": "claude/RULE-021", "id": "RULE-021", "name": "Policy can only be added for an existing customer", "text": "Given An add request for customer number 9999999, which is not on the CUSTOMER table\nWhen The POLICY insert fails with SQLCODE -530 (foreign key violation)\nThen CA-RETURN-CODE is '70', an error message with the customer number is logged, and control returns to the caller without inserting any product details.", "program": "LGAPDB01", "priority": "P1", "link": "../claude/index.html#/c/12/claude/RULE-021"}, {"key": "claude/RULE-051", "id": "RULE-051", "name": "Policy header creation with system-assigned number and timestamp", "text": "Given A valid House add request for customer 1000001 with issue date 2026-01-01, expiry date 2027-01-01, broker ID 55 and payment 300\nWhen The POLICY insert succeeds\nThen POLICY gets a new row with a database-assigned number (for example 2000123), type 'H' and LASTCHANGED = CURRENT TIMESTAMP. The caller gets that number in CA-POLICY-NUM, the stored timestamp in CA-LASTCHANGED and return code '00'.", "program": "LGAPDB01", "priority": "P0", "link": "../claude/index.html#/c/12/claude/RULE-051"}, {"key": "claude/RULE-054", "id": "RULE-054", "name": "Newly added policy is passed to downstream processor LGAPVS01", "text": "Given A House add request that was saved successfully as policy 2000123\nWhen The product insert completes\nThen LGAPVS01 is linked with the request data (length 32500), including policy number 2000123 and return code '00'.", "program": "LGAPDB01", "priority": "P1", "link": "../claude/index.html#/c/14/claude/RULE-054"}, {"key": "claude/RULE-055", "id": "RULE-055", "name": "Commercial policy dates, perils and status recorded as supplied", "text": "Given A Commercial add request with issue date 2026-03-01, expiry date 2027-03-01, fire premium 500, status 0 and blank rejection reason\nWhen The COMMERCIAL row is inserted\nThen RequestDate = the new policy's LASTCHANGED timestamp, StartDate = 2026-03-01, RenewalDate = 2027-03-01, FirePremium = 500, Status = 0. No premium is calculated and no status is derived.", "program": "LGAPDB01", "priority": "P1", "link": "../claude/index.html#/c/13/claude/RULE-055"}, {"key": "claude/RULE-083", "id": "RULE-083", "name": "Policy header and product details are saved together or not at all", "text": "Given A Motor add request where the POLICY insert succeeded but the MOTOR insert fails (for example, a duplicate key)\nWhen The MOTOR insert returns a non-zero SQLCODE\nThen CA-RETURN-CODE is set to '90', the error is logged, and abend 'LGSQ' rolls back the POLICY row as well, so the customer has no half-created policy.", "program": "LGAPDB01", "priority": "P0", "link": "../claude/index.html#/c/13/claude/RULE-083"}]}, {"program": "LGAPOL01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-69990f88a1", "id": "id-69990f88a1", "name": "Reject requests shorter than required header", "text": "WHEN the received request data length (`EIBCALEN`) is less than the required length (`WS-REQUIRED-CA-LEN`), which is the header length (`WS-CA-HEADER-LEN`) of 28 added to 0, THE Policy Insert Request Intake SHALL set the return code (`CA-RETURN-CODE`) to success '00' at the start, then return to the caller without performing the insert", "program": "lgapol01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-69990f88a1"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7ada9054d2", "id": "id-7ada9054d2", "name": "Delegate policy data insert", "text": "WHEN a request passes the presence and minimum-length checks, THE Policy Insert Request Intake SHALL delegate to the database insert program (`LGAPDB01`), passing the full request data with a length of 32500 so it can perform the data inserts", "program": "lgapol01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7ada9054d2"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-67d318b149", "id": "id-67d318b149", "name": "Default return code to success", "text": "WHEN request data has been received, THE Policy Request Validation SHALL set the return code (`CA-RETURN-CODE`) to success '00'", "program": "lgapol01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-67d318b149"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-73efef8c09", "id": "id-73efef8c09", "name": "Reject request data shorter than required", "text": "IF the received request data length (`EIBCALEN`) is less than the required length (header length 28), THEN THE Policy Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '98' and return control to the caller", "program": "lgapol01", "priority": "", "link": "../aws/index.html#/c/8/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-73efef8c09"}], "claude": [{"key": "claude/RULE-022", "id": "RULE-022", "name": "Policy add requires only header-length message before insert", "text": "Given An add-policy request of 20 bytes\nWhen The add-policy service receives it\nThen Return code '98' is set and the request is not processed; a request of 28 bytes or more is forwarded to LGAPDB01 with return code initialised to '00'.", "program": "LGAPOL01", "priority": "P1", "link": "../claude/index.html#/c/11/claude/RULE-022"}]}, {"program": "LGAPVS01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8c1805284d", "id": "id-8c1805284d", "name": "Build policy record key", "text": "THE Policy Record Registration SHALL build the policy identification key from the 4th character of the request identifier (`CA-REQUEST-ID`) as the policy type, followed by the customer number (`CA-CUSTOMER-NUM`) and the policy number (`CA-POLICY-NUM`)", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8c1805284d"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8e307b48c7", "id": "id-8e307b48c7", "name": "Populate commercial policy details", "text": "WHEN the policy type (`WF-Request-ID`) is commercial (`'C'`), THE Policy Record Registration SHALL record the commercial premises postcode, the commercial status code and the commercial customer name in the policy record's billing postcode, billing status and billing customer name", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8e307b48c7"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-79ba6cc803", "id": "id-79ba6cc803", "name": "Populate endowment policy details", "text": "WHEN the policy type (`WF-Request-ID`) is endowment (`'E'`), THE Policy Record Registration SHALL record the with-profits, equities and managed-fund indicators, the fund name and the life assured name in the policy record", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-79ba6cc803"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2bc3830325", "id": "id-2bc3830325", "name": "Populate house policy details", "text": "WHEN the policy type (`WF-Request-ID`) is house (`'H'`), THE Policy Record Registration SHALL record the property type, bedroom count, insured value, postcode and house name in the policy record", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2bc3830325"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7cd4214024", "id": "id-7cd4214024", "name": "Populate motor policy details", "text": "WHEN the policy type (`WF-Request-ID`) is motor (`'M'`), THE Policy Record Registration SHALL record the vehicle make, model, insured value and registration number in the policy record", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7cd4214024"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5513247ee", "id": "id-d5513247ee", "name": "Blank details for unrecognised policy type", "text": "IF the policy type (`WF-Request-ID`) is not `'C'`, `'E'`, `'H'` or `'M'`, THEN THE Policy Record Registration SHALL clear the policy details area of the record to blanks", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5513247ee"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fc5c221c93", "id": "id-fc5c221c93", "name": "Add policy record to policy store", "text": "WHEN the policy record has been assembled, THE Policy Record Registration SHALL add the policy record to the policy store (`KSDSPOLY`) under its policy key; if the add fails, capture the failure responses, produce the failure diagnostic message and return to the caller", "program": "lgapvs01", "priority": "", "link": "../aws/index.html#/c/11/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fc5c221c93"}], "claude": [{"key": "claude/RULE-056", "id": "RULE-056", "name": "Adding a policy to the policy file fails if it cannot be written", "text": "Given A new motor policy 0000000007 for customer 0000000001 has been added\nWhen The policy-file write is attempted\nThen On success the record exists in KSDSPOLY with key 'M00000000010000000007'. If the key already exists or the write fails for another reason, return code 80 is returned", "program": "LGAPVS01", "priority": "P1", "link": "../claude/index.html#/c/14/claude/RULE-056"}, {"key": "claude/RULE-085", "id": "RULE-085", "name": "Policy-file record is keyed by policy type, customer and policy number and holds type-specific details", "text": "Given An add request '01AHOU' for customer 0000000001, policy 0000000005, 3 bedrooms, value 00250000, postcode 'AB12 3CD'\nWhen The policy-file record is built\nThen Key = 'H'+'0000000001'+'0000000005'; data = property type(15), bedrooms(3), value(8), postcode(8), house name(9)", "program": "LGAPVS01", "priority": "P1", "link": "../claude/index.html#/c/14/claude/RULE-085"}]}, {"program": "LGASTAT1", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1", "id": "id-d5214150e1", "name": "Record first application start date and time", "text": "WHEN the startup record store (`GENASTRT`) does not exist yet when it is read, THE Application Startup Recording SHALL capture the current date (DDMMYYYY) and time and write them as the startup record to the startup record store (`GENASTRT`); leave the existing record untouched when the store already exists", "program": "lgastat1", "priority": "", "link": "../aws/index.html#/c/12/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1"}], "claude": [{"key": "claude/RULE-003", "id": "RULE-003", "name": "Request type normalisation for statistics", "text": "Given A statistics event with request id '02ACUS' or '02ICOM'/'03ICOM'/'05ICOM'\nWhen The counter name is built\nThen '02ACUS' is counted as '01ACUS'; '02ICOM', '03ICOM' and '05ICOM' are counted as '01ICOM'; every other request id is counted under its own value", "program": "LGASTAT1", "priority": "P1", "link": "../claude/index.html#/c/53/claude/RULE-003"}, {"key": "claude/RULE-004", "id": "RULE-004", "name": "Outcome bucket and transaction counter increment", "text": "Given Request id '01ICOM' with return code '00', and another with return code '70'\nWhen The statistics counter is incremented\nThen The first increments CICS named counter 'GENA01ICOM00' and the second increments 'GENA01ICOM99' in pool GENA (any non-'00' return code is grouped as '99'); the counter's value is returned into Trancount but not otherwise used", "program": "LGASTAT1", "priority": "P1", "link": "../claude/index.html#/c/53/claude/RULE-004"}, {"key": "claude/RULE-023", "id": "RULE-023", "name": "Statistics event source selection and no-input exit", "text": "Given LGASTAT1 is invoked either as a CICS event-processing adapter (channel with containers DFHEP.DATA.00001 / DFHEP.DATA.00002) or by a LINK with the standard GENAPP commarea\nWhen The program starts and tries to read the request id (6 chars) and return code (2 chars) from the event containers\nThen If reading the return-code container DFHEP.DATA.00002 succeeds, request id = container 00001 value and return code = container 00002 value (e.g. '01ICUS','00'); else if commarea length is 0 the program returns immediately with no count; else request id = CA-REQUEST-ID and return code = CA-RETURN-CODE from the commarea", "program": "LGASTAT1", "priority": "P1", "link": "../claude/index.html#/c/52/claude/RULE-023"}, {"key": "claude/RULE-079", "id": "RULE-079", "name": "Statistics start-time stamp recorded once", "text": "Given Temporary storage queue GENASTRT does not exist (e.g. after a CICS restart or after an ops reset deletes it)\nWhen Any statistics event is processed\nThen The current date (DDMMYYYY, first 8 chars) and time (HHMMSS) are written to GENASTRT as a 16-byte record 'DDMMYYYY  HHMMSS'; if the queue already exists (READQ not QIDERR) nothing is written", "program": "LGASTAT1", "priority": "P2", "link": "../claude/index.html#/c/54/claude/RULE-079"}]}, {"program": "LGDPDB01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-07a98fc9c3", "id": "id-07a98fc9c3", "name": "Delete recognised policy type and hand off", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is '01DEND', '01DHOU', '01DCOM' or '01DMOT', THE Policy Deletion Dispatcher SHALL delete the policy row and then delegate to the policy deletion program (`LGDPVS01`) with the request data, length 32500", "program": "lgdpdb01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-07a98fc9c3"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-034285f1f4", "id": "id-034285f1f4", "name": "Route recognised delete request types", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is '01DEND', '01DHOU', '01DCOM' or '01DMOT', THE Policy Deletion Request Routing SHALL prepare the customer and policy number keys and perform the policy deletion", "program": "lgdpdb01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-034285f1f4"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4a77cf174d", "id": "id-4a77cf174d", "name": "Delete customer policy record", "text": "THE Policy Deletion SHALL delete the policy row from the policy store (`POLICY`) matching the customer number (`CUSTOMERNUMBER`) and policy number (`POLICYNUMBER`), and when the deletion is not successful record an error message and return to the caller", "program": "lgdpdb01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4a77cf174d"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ee43899b6b", "id": "id-ee43899b6b", "name": "Reject undersized deletion request", "text": "IF the received request length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN` = 28), THEN THE Policy Deletion Request Intake SHALL end processing and return to the caller without deleting anything, with the return code preset to success ('00')", "program": "lgdpdb01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ee43899b6b"}], "claude": [{"key": "claude/RULE-045", "id": "RULE-045", "name": "Delete request must carry a usable request area", "text": "Given A delete request arrives\nWhen The request data length is 0, or is between 1 and 27 bytes\nThen Length 0: the transaction aborts with code LGCA after logging 'NO COMMAREA RECEIVED'. Length 1-27: return code 98 and no delete. Length 28 or more: processing continues with return code 00", "program": "LGDPDB01", "priority": "P2", "link": "../claude/index.html#/c/23/claude/RULE-045"}, {"key": "claude/RULE-052", "id": "RULE-052", "name": "Deleting a policy removes it and its type-specific details together", "text": "Given Customer 0000000001 owns house policy 0000000005\nWhen A '01DHOU' delete request for customer 0000000001 / policy 0000000005 is processed\nThen The POLICY row matching both numbers is deleted, the HOUSE details row goes with it by cascade, and the request returns 00. If the database reports anything other than success, return code 90 is set, the error is logged, and control returns without deleting the policy-file record", "program": "LGDPDB01", "priority": "P0", "link": "../claude/index.html#/c/24/claude/RULE-052"}]}, {"program": "LGDPOL01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b0d0314ab3", "id": "id-b0d0314ab3", "name": "Recognise policy deletion request types", "text": "WHEN the upper-cased request identifier (`CA-REQUEST-ID`) is `'01DEND'`, `'01DMOT'`, `'01DHOU'` or `'01DCOM'`, THE Policy Deletion Request Validation SHALL accept the request and proceed to delete the policy row", "program": "lgdpol01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b0d0314ab3"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-141fb43e9d", "id": "id-141fb43e9d", "name": "Delegate policy row deletion", "text": "WHEN a recognised policy deletion request has been validated, THE Policy Deletion Delegation SHALL delegate to the database module (`LGDPDB01`) with the full 32500-byte request, including the request identifier (`CA-REQUEST-ID`), so it can delete the policy row", "program": "lgdpol01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-141fb43e9d"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4c67e3bb34", "id": "id-4c67e3bb34", "name": "Default request outcome to success", "text": "WHEN request data of non-zero length is received, THE Policy Deletion Request Validation SHALL set the return code (`CA-RETURN-CODE`) to the success value '00'", "program": "lgdpol01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4c67e3bb34"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9ec9d628eb", "id": "id-9ec9d628eb", "name": "Reject request shorter than header", "text": "IF the request data length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN`) of 28, THEN THE Policy Deletion Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '98' and return to the caller without further processing", "program": "lgdpol01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9ec9d628eb"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7263693cd7", "id": "id-7263693cd7", "name": "Normalize request identifier to upper case", "text": "WHEN a request of sufficient length is accepted for identifier validation, THE Policy Deletion Request Validation SHALL replace the request identifier (`CA-REQUEST-ID`) with its upper-case form", "program": "lgdpol01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7263693cd7"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-889524ac5d", "id": "id-889524ac5d", "name": "Reject unsupported policy deletion request", "text": "IF the upper-cased request identifier (`CA-REQUEST-ID`) is not '01DEND', '01DMOT', '01DHOU' or '01DCOM', THEN THE Policy Deletion Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '99' to mark the request as unsupported", "program": "lgdpol01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-889524ac5d"}], "claude": [{"key": "claude/RULE-024", "id": "RULE-024", "name": "Policy delete allowed only for recognised policy types (case-insensitive)", "text": "Given A delete request of 28+ bytes with request id '01dmot'\nWhen The delete-policy service validates the request\nThen The id is upper-cased to '01DMOT', recognised, and the delete is forwarded to LGDPDB01; a request with id '01DXYZ' gets return code '99' and nothing is deleted; a request under 28 bytes gets return code '98'.", "program": "LGDPOL01", "priority": "P1", "link": "../claude/index.html#/c/23/claude/RULE-024"}]}, {"program": "LGDPVS01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5e4cc35f7", "id": "id-b5e4cc35f7", "name": "Delete policy record by composite key", "text": "WHEN a policy delete request is received with a request identifier, customer number and policy number, THE Policy Record Deletion SHALL build the policy key from the request type (fourth character of `CA-REQUEST-ID`), the customer number (`CA-CUSTOMER-NUM`) and the policy number (`CA-POLICY-NUM`), then delete the matching record from the policy store (`KSDSPOLY`) using a 21-character key", "program": "lgdpvs01", "priority": "", "link": "../aws/index.html#/c/13/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5e4cc35f7"}], "claude": [{"key": "claude/RULE-025", "id": "RULE-025", "name": "Failure to delete the policy file record returns code 81", "text": "Given A delete request for customer 0000000001, policy 0000000099, where no matching KSDSPOLY record exists\nWhen The VSAM delete returns any response other than NORMAL\nThen CA-RETURN-CODE is set to '81'. An error message is written to the queue through LGSTSQ, and control returns to the caller.", "program": "LGDPVS01", "priority": "P1", "link": "../claude/index.html#/c/25/claude/RULE-025"}, {"key": "claude/RULE-057", "id": "RULE-057", "name": "Policy deletion removes the VSAM policy record identified by policy type, customer and policy number", "text": "Given A delete-policy request with request ID '01DHOU', customer number 0000000001 and policy number 0000000005, already removed from the DB2 POLICY table by LGDPDB01\nWhen LGDPVS01 runs\nThen The KSDSPOLY record with key 'H' + '0000000001' + '0000000005' (21 chars) is deleted. The return code is left as the caller set it.", "program": "LGDPVS01", "priority": "P1", "link": "../claude/index.html#/c/25/claude/RULE-057"}, {"key": "claude/RULE-095", "id": "RULE-095", "name": "Failed policy deletes are logged with policy, customer, time and response codes", "text": "Given A failed KSDSPOLY delete for policy 0000000005 / customer 0000000001 with RESP=13\nWhen The error routine runs\nThen Two messages go to LGSTSQ. The first is 'MMDDYYYY HHMMSS LGDPVS01 PNUM=0000000005 CNUM=0000000001 Delete file KSDSPOLY RESP=+00013 RESP2=...'. The second is 'COMMAREA=' followed by the first 90 bytes, or fewer if the commarea is shorter.", "program": "LGDPVS01", "priority": "P2", "link": "../claude/index.html#/c/25/claude/RULE-095"}]}, {"program": "LGICDB01", "aws": [{"key": "Unassigned-Programs/id-f2b8db5a70", "id": "id-f2b8db5a70", "name": "Reject request shorter than required length", "text": "WHEN the received request length (`EIBCALEN`) is less than the customer data length (`WS-CUSTOMER-LEN`) plus the header and trailer length (`WS-CA-HEADERTRAILER-LEN`), THE Customer Inquiry Request Validation SHALL set the outcome code (`CA-RETURN-CODE`) to `'98'` and return to the caller without looking up the customer; otherwise keep the default outcome `'00'` and continue", "program": "lgicdb01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-f2b8db5a70"}, {"key": "Unassigned-Programs/id-a064b27262", "id": "id-a064b27262", "name": "Retrieve customer details by customer number", "text": "WHEN a valid customer inquiry is received and the customer lookup succeeds, THE Customer Details Retrieval SHALL read the customer's name, date of birth, address, phone numbers and email from the customer table (`CUSTOMER`) by customer number (`CUSTOMERNUMBER`), return them to the caller and set the outcome code (`CA-RETURN-CODE`) to `'00'`", "program": "lgicdb01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-a064b27262"}, {"key": "Unassigned-Programs/id-20f2cdb30d", "id": "id-20f2cdb30d", "name": "Report customer not found or unavailable", "text": "IF the customer lookup finds no matching customer or the customer data is unavailable due to deadlock or timeout, THEN THE Customer Details Retrieval SHALL set the outcome code (`CA-RETURN-CODE`) to `'01'`", "program": "lgicdb01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-20f2cdb30d"}, {"key": "Unassigned-Programs/id-6f157d9929", "id": "id-6f157d9929", "name": "Reject request shorter than required length", "text": "WHEN the received request length (`EIBCALEN`) is less than the customer data length (`WS-CUSTOMER-LEN`) plus the header/trailer length (`WS-CA-HEADERTRAILER-LEN`), THE Customer Inquiry Request Validation SHALL return control to the caller without retrieving customer details; otherwise continue with the return code (`CA-RETURN-CODE`) set to `'00'`", "program": "lgicdb01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-6f157d9929"}, {"key": "Unassigned-Programs/id-eac8a90a4c", "id": "id-eac8a90a4c", "name": "Retrieve customer details by number", "text": "THE Customer Details Retrieval SHALL read the customer's name, date of birth, address, phone and email columns from the customer store (`CUSTOMER`) where `CUSTOMERNUMBER` equals the requested customer number (`CA-CUSTOMER-NUM`), and return them to the caller", "program": "lgicdb01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-eac8a90a4c"}, {"key": "Unassigned-Programs/id-d1a71d53ec", "id": "id-d1a71d53ec", "name": "Retrieve customer personal and contact details", "text": "WHEN a customer inquiry with valid request data is received, THE Customer Details Inquiry SHALL read the customer's name, date of birth, address, phone numbers and email from the customer store (`CUSTOMER`) by customer number (`CUSTOMERNUMBER`) and return them to the caller", "program": "lgicdb01", "priority": "", "link": "../aws/index.html#/c/33/Unassigned-Programs/id-d1a71d53ec"}], "claude": [{"key": "claude/RULE-026", "id": "RULE-026", "name": "Customer inquiry requires minimum request size", "text": "Given Customer data length 72 bytes and header/trailer length 18 bytes (required = 90)\nWhen An inquiry arrives with a commarea of 85 bytes\nThen Return code '98' is set and the program returns without reading the database; a 90-byte or larger commarea proceeds", "program": "LGICDB01", "priority": "P1", "link": "../claude/index.html#/c/5/claude/RULE-026"}, {"key": "claude/RULE-027", "id": "RULE-027", "name": "Customer inquiry outcome classification", "text": "Given Customer number 1000042\nWhen The inquiry runs against the CUSTOMER table\nThen If the customer exists, rc '00' and first name, last name, DOB, house name, house number, postcode, mobile, home phone and email are returned; if not found (SQLCODE 100) rc '01'; if deadlock/timeout (SQLCODE -913) rc '01'; any other error rc '90' with an error log entry", "program": "LGICDB01", "priority": "P1", "link": "../claude/index.html#/c/6/claude/RULE-027"}, {"key": "claude/RULE-046", "id": "RULE-046", "name": "Customer data requests must carry a request area", "text": "Given A call to LGACDB02, LGICDB01 or LGUCDB01 with commarea length 0\nWhen The program starts\nThen An error message ' NO COMMAREA RECEIVED' is logged and the transaction abends with code LGCA", "program": "LGICDB01", "priority": "P2", "link": "../claude/index.html#/c/0/claude/RULE-046"}]}, {"program": "LGICVS01", "aws": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb1d3c7b3f", "id": "id-eb1d3c7b3f", "name": "Detect existing control queue", "text": "WHEN the first item of the control queue (`GENACNTL`) is read successfully, THE Control Queue Inspection SHALL mark the header entry as present (`WS-FLAG-TSQE` cleared from 'Y' to space) and keep reading the subsequent queue (`GENACNTL`) items until no further item is returned; if the first item cannot be read, leave the header, low customer and high customer entries all marked missing ('Y')", "program": "lgicvs01", "priority": "", "link": "../aws/index.html#/c/14/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb1d3c7b3f"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-68ad32cc24", "id": "id-68ad32cc24", "name": "Recognise low customer entry", "text": "WHILE the control queue items are being scanned, WHEN an item is read successfully and its text (`READ-MSG-MSG`) starts with 'LOW CUSTOMER', THE Control Queue Inspection SHALL mark the low customer entry as present by clearing its missing-entry indicator (`WS-FLAG-TSQL`) to space", "program": "lgicvs01", "priority": "", "link": "../aws/index.html#/c/14/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-68ad32cc24"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb781ee106", "id": "id-eb781ee106", "name": "Recognise high customer entry", "text": "WHILE the control queue items are being scanned, WHEN an item is read successfully and its text (`READ-MSG-MSG`) starts with 'HIGH CUSTOMER', THE Control Queue Inspection SHALL mark the high customer entry as present by clearing its missing-entry indicator (`WS-FLAG-TSQH`) to space", "program": "lgicvs01", "priority": "", "link": "../aws/index.html#/c/14/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb781ee106"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ebfe3451e6", "id": "id-ebfe3451e6", "name": "Write missing header entry", "text": "WHEN the header entry indicator (`WS-FLAG-TSQE`) is 'Y', THE Control Queue Initialisation SHALL append the 20-character application header entry ('**** GENAPP CNTL') to the control queue (`GENACNTL`)", "program": "lgicvs01", "priority": "", "link": "../aws/index.html#/c/14/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ebfe3451e6"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a8b69f147a", "id": "id-a8b69f147a", "name": "Write missing low customer entry", "text": "WHEN the low customer entry indicator (`WS-FLAG-TSQL`) is 'Y', THE Control Queue Initialisation SHALL append a 23-character low customer entry, starting with 'LOW CUSTOMER=', to the control queue (`GENACNTL`)", "program": "lgicvs01", "priority": "", "link": "../aws/index.html#/c/14/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a8b69f147a"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6237953ef0", "id": "id-6237953ef0", "name": "Write missing high customer entry", "text": "WHEN the high customer entry indicator (`WS-FLAG-TSQH`) is 'Y', THE Control Queue Initialisation SHALL append a 24-character high customer entry, starting with 'HIGH CUSTOMER=', to the control queue (`GENACNTL`)", "program": "lgicvs01", "priority": "", "link": "../aws/index.html#/c/14/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6237953ef0"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de589f170b", "id": "id-de589f170b", "name": "Determine invocation mode of the run", "text": "WHEN the transaction starts and its starting code (`WS-STARTCODE`) and invoking program name (`WS-INVOKEPROG`) are obtained, THE Invocation Mode Determination SHALL mark the run as program-called (`'C'`) when the starting code begins with `'D'` or an invoking program name is present, and otherwise mark it as terminal-started (`'R'`)", "program": "lgicvs01", "priority": "", "link": "../aws/index.html#/c/15/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de589f170b"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3ed8819bee", "id": "id-3ed8819bee", "name": "Display high customer message on terminal", "text": "WHEN the invocation mode (`WS-FLAG`) is terminal-started (`'R'`), THE High Customer Message Display SHALL clear the screen and display the high-customer message (`'HIGH CUSTOMER='`) to the operator with the keyboard unlocked", "program": "lgicvs01", "priority": "", "link": "../aws/index.html#/c/15/ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3ed8819bee"}], "claude": [{"key": "claude/RULE-005", "id": "RULE-005", "name": "Random customer number selection within the control range", "text": "Given The range is low 1000001 and high 1000101, the random function seeded with the CICS task number returns 0.4567, and customer 1000046 does not exist but 1000047 does\nWhen The random customer number is calculated and looked up\nThen The candidate is INTEGER(0.4567 x (1000101 - 1000001) + 1000001) = 1000046. The greater-or-equal lookup on KSDSCUST finds 1000047, which is returned.", "program": "LGICVS01", "priority": "P1", "link": "../claude/index.html#/c/67/claude/RULE-005"}, {"key": "claude/RULE-058", "id": "RULE-058", "name": "Customer number range is held in a shared control queue and self-initialised", "text": "Given The control queue GENACNTL holds the entries '**** GENAPP CNTL', 'LOW CUSTOMER=0001000005' and 'HIGH CUSTOMER=0001000500'\nWhen A customer inquiry simulation request runs\nThen The working range is low 1000005 to high 1000500 and nothing is written to the queue. If the queue did not exist, the program would write the header, 'LOW CUSTOMER=0001000001' and 'HIGH CUSTOMER=0001000001', and use 1000001 for both ends of the range.", "program": "LGICVS01", "priority": "P1", "link": "../claude/index.html#/c/66/claude/RULE-058"}]}, {"program": "LGIPDB01", "aws": [{"key": "Unassigned-Programs/id-2edfcadeea", "id": "id-2edfcadeea", "name": "Prepare inquiry keys and default outcome", "text": "THE Policy Inquiry Routing SHALL set the return code (`CA-RETURN-CODE`) to successful (`'00'`), take the customer number (`CA-CUSTOMER-NUM`) and policy number (`CA-POLICY-NUM`) as the lookup keys, and convert the request identifier (`CA-REQUEST-ID`) to upper case for matching", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-2edfcadeea"}, {"key": "Unassigned-Programs/id-7c23c6b589", "id": "id-7c23c6b589", "name": "Route endowment policy inquiry", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '01IEND', THE Policy Inquiry Routing SHALL clear the endowment details (`DB2-ENDOWMENT`) and run the endowment policy retrieval for the requested customer and policy number", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-7c23c6b589"}, {"key": "Unassigned-Programs/id-c10b4ece9d", "id": "id-c10b4ece9d", "name": "Route house policy inquiry", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '01IHOU', THE Policy Inquiry Routing SHALL clear the house details (`DB2-HOUSE`) and run the house policy retrieval for the requested customer and policy number", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-c10b4ece9d"}, {"key": "Unassigned-Programs/id-94586119b4", "id": "id-94586119b4", "name": "Route motor policy inquiry", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '01IMOT', THE Policy Inquiry Routing SHALL clear the motor details (`DB2-MOTOR`) and run the motor policy retrieval for the requested customer and policy number", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-94586119b4"}, {"key": "Unassigned-Programs/id-5721816171", "id": "id-5721816171", "name": "Route commercial inquiry by customer and policy", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '01ICOM', THE Policy Inquiry Routing SHALL clear the commercial details (`DB2-COMMERCIAL`) and run the commercial policy retrieval keyed by both customer and policy number", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-5721816171"}, {"key": "Unassigned-Programs/id-cec9dfb0e5", "id": "id-cec9dfb0e5", "name": "Route commercial inquiry by policy only", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '02ICOM', THE Policy Inquiry Routing SHALL clear the commercial details (`DB2-COMMERCIAL`) and run the commercial policy retrieval keyed by policy number only", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-cec9dfb0e5"}, {"key": "Unassigned-Programs/id-ca0ce009fb", "id": "id-ca0ce009fb", "name": "Route commercial policies list for customer", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '03ICOM', THE Policy Inquiry Routing SHALL clear the commercial details (`DB2-COMMERCIAL`) and run the multi-record commercial policy retrieval for the requested customer", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-ca0ce009fb"}, {"key": "Unassigned-Programs/id-4bc8fb45ff", "id": "id-4bc8fb45ff", "name": "Route commercial policies search by postcode", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '05ICOM', THE Policy Inquiry Routing SHALL clear the commercial details (`DB2-COMMERCIAL`) and run the commercial policy postcode search using the supplied postcode (`CA-B-POSTCODE`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-4bc8fb45ff"}, {"key": "Unassigned-Programs/id-f71b6c2400", "id": "id-f71b6c2400", "name": "Reject unrecognised request type", "text": "IF the request identifier is not `'01IEND'`, `'01IHOU'`, `'01IMOT'`, `'01ICOM'`, `'02ICOM'`, `'03ICOM'` or `'05ICOM'`, THEN THE Policy Inquiry Router SHALL set the return code to `'99'` without performing any lookup", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-f71b6c2400"}, {"key": "Unassigned-Programs/id-c0623ab740", "id": "id-c0623ab740", "name": "Retrieve endowment policy and size response", "text": "WHEN an endowment policy inquiry finds the policy for the requested customer and policy number, THE Endowment Policy Inquiry SHALL retrieve the joined policy (`POLICY`) and endowment (`ENDOWMENT`) record by customer and policy number. Compute the required response size as 33 plus 124 plus the padding length when padding is present. Advance the end-of-policy position by the padding length.", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-c0623ab740"}, {"key": "Unassigned-Programs/id-8196757e72", "id": "id-8196757e72", "name": "Reject endowment inquiry for insufficient space", "text": "IF the caller's data area length is less than the required endowment response size, THEN THE Endowment Policy Inquiry SHALL set the return code (`CA-RETURN-CODE`) to '98' and return to the caller without the policy details", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-8196757e72"}, {"key": "Unassigned-Programs/id-492732d9fa", "id": "id-492732d9fa", "name": "Return endowment details to caller", "text": "WHEN the caller's data area is at least the required endowment response size, THE Endowment Policy Inquiry SHALL return the common policy data and the 52-character fixed endowment data. Include the broker id, payment and padding data only when each is present.", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-492732d9fa"}, {"key": "Unassigned-Programs/id-6250252dde", "id": "id-6250252dde", "name": "Mark end of endowment policy data", "text": "WHEN an endowment policy has been found and returned to the caller, THE Endowment Policy Inquiry SHALL write the end-of-data marker 'FINAL' at the end-of-policy position of the endowment padding output", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-6250252dde"}, {"key": "Unassigned-Programs/id-9115193d51", "id": "id-9115193d51", "name": "Report endowment lookup failure", "text": "IF the endowment policy lookup does not succeed, THEN THE Endowment Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-9115193d51"}, {"key": "Unassigned-Programs/id-00e4b3d42b", "id": "id-00e4b3d42b", "name": "Retrieve house policy and size reply", "text": "WHEN a house policy inquiry is submitted for a customer number and policy number, THE House Policy Inquiry SHALL retrieve the matching house policy from the policy (`POLICY`) and house (`HOUSE`) stores, filtered by customer number (`CUSTOMERNUMBER`) and policy number (`POLICYNUMBER`), and, when found, compute the required reply length as the header/trailer length (`WS-CA-HEADERTRAILER-LEN`) plus the full house policy length (`WS-FULL-HOUSE-LEN`)", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-00e4b3d42b"}, {"key": "Unassigned-Programs/id-60a831eb6f", "id": "id-60a831eb6f", "name": "Reject undersized house inquiry reply area", "text": "IF the caller's supplied area (`EIBCALEN`) is smaller than the required reply length (`WS-REQUIRED-CA-LEN`), THEN THE House Policy Inquiry SHALL set the return code (`CA-RETURN-CODE`) to '98' and return to the caller without returning policy data", "program": "lgipdb01", "priority": "", "link": "../aws/index.html#/c/35/Unassigned-Programs/id-60a831eb6f"}, {"key": "Unassigned-Programs/id-bf7790c453", "id": "id-bf7790c453", "name": "Return house policy details with end marker", "text": "WHEN the house policy is found and the caller's area is at least the required reply length, THE House Policy Inquiry SHALL return the common policy data and house details, including broker id and payment only when they are not null (`IND-BROKERID`, `IND-PAYMENT` not -1), and mark the end of the data w
