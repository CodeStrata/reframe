e request, and set the policy-number length to 10 (11 minus 1).", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-526c5fd3f6"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-116", "code": "REQ-F-116", "kind": "F", "pattern": "Event-driven", "text": "When a policy request arrives with a start code that does not begin with 'D' and with no invoking program name present, the system shall receive the request from the terminal with a maximum received length starting at 80, mark the request channel as terminal-originated ('R'), use the received data as the request, and set the policy-number length to the received length minus 6.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-64058bc1b7"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-117", "code": "REQ-F-117", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build the policy key by taking the first character of the request as the policy type and the following characters, for the derived policy-number length, as the policy number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3f867470cd"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-118", "code": "REQ-F-118", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall retrieve the first policy record at or after the policy key from the policy VSAM data store (KSDSPOLY), matching on an 11-character generic key and retrieving up to 64 bytes of the policy record.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3f867470cd"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-119", "code": "REQ-F-119", "kind": "F", "pattern": "Event-driven", "text": "When the policy lookup succeeds and the policy type on the retrieved policy record matches the requested policy type, the system shall place the retrieved policy record into the policy key portion of the 80-character policy message under the label 'Policy Key='.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a5ea883fc7"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-120", "code": "REQ-F-120", "kind": "F", "pattern": "Unwanted", "text": "If the policy type on the retrieved policy record differs from the requested policy type or the policy lookup does not complete successfully, then the system shall set the message label to 'Policy Bad=' and set both the customer number and the policy number in the message to 13.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5855243e9c"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-121", "code": "REQ-F-121", "kind": "F", "pattern": "Event-driven", "text": "When the request channel is 'R', the system shall clear the terminal screen, display the 80-character policy message, and unlock the keyboard.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fba6f55180"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-122", "code": "REQ-F-122", "kind": "F", "pattern": "Event-driven", "text": "When the request channel is not 'R', the system shall clear the caller's data to spaces, place the result label in the caller's text field, and place the result policy key in the caller's key field.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a9bf74f276"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-123", "code": "REQ-F-123", "kind": "F", "pattern": "Unwanted", "text": "If the request channel is 'C', then the system shall not send the policy message to the terminal.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fba6f55180"], "programs": ["lgipvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-124", "code": "REQ-F-124", "kind": "F", "pattern": "Event-driven", "text": "When the application control queue (GENACNTL) has been cleared, the system shall write three entries to the application control queue in this order: the control header; the low customer entry; the high customer entry.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148"], "programs": ["lgsetup"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-125", "code": "REQ-F-125", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the control header to the application control queue as a 20-character entry whose text is '**** GENAPP CNTL'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148"], "programs": ["lgsetup"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-126", "code": "REQ-F-126", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the low customer entry to the application control queue as a 23-character entry that starts with the label 'LOW CUSTOMER='.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148"], "programs": ["lgsetup"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-127", "code": "REQ-F-127", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the high customer entry to the application control queue as a 24-character entry that starts with the label 'HIGH CUSTOMER='.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148"], "programs": ["lgsetup"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-128", "code": "REQ-F-128", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall request each write to the application control queue without waiting if the queue store is short of space.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148"], "programs": ["lgsetup"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-129", "code": "REQ-F-129", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall capture the outcome of each write to the application control queue in a response code.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148"], "programs": ["lgsetup"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-130", "code": "REQ-F-130", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the return code to '00' (success) on receipt of a policy update request, before it examines the request type.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#19", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55177c3cc7"], "programs": ["lgupol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-131", "code": "REQ-F-131", "kind": "F", "pattern": "Event-driven", "text": "When the request type is '01UEND' (endowment update), the system shall compute the required length as the header length of 28 plus the full endowment policy length of 124; if the received request data length is less than this required length, the system shall set the return code to '98' and return to the caller without performing the update.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#19", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9fc0c7e894", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5042f9d52"], "programs": ["lgupol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-132", "code": "REQ-F-132", "kind": "F", "pattern": "Event-driven", "text": "When the request type is '01UHOU' (house update), the system shall compute the required length as the header length of 28 plus the full house policy length of 130; if the received request data length is less than this required length, the system shall set the return code to '98' and return to the caller without performing the update.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#19", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9529a4c01e", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c794c28722"], "programs": ["lgupol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-133", "code": "REQ-F-133", "kind": "F", "pattern": "Event-driven", "text": "When the request type is '01UMOT' (motor update), the system shall compute the required length as the header length of 28 plus the full motor policy length of 137; if the received request data length is less than this required length, the system shall set the return code to '98' and return to the caller without performing the update.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#19", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f5e87a9c13", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e47bb194af"], "programs": ["lgupol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-134", "code": "REQ-F-134", "kind": "F", "pattern": "Unwanted", "text": "If the request type is not '01UEND', '01UHOU' or '01UMOT', then the system shall set the return code to '99' to mark the request as unrecognised and shall apply no length check.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#19", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f9293c7e00"], "programs": ["lgupol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-135", "code": "REQ-F-135", "kind": "F", "pattern": "Event-driven", "text": "When a policy update request has not been terminated by the length validation, the system shall pass the request on to the policy database update with a request data length of 32500, including requests whose return code was set to '99'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#19", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55177c3cc7", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f9293c7e00"], "programs": ["lgupol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-136", "code": "REQ-F-136", "kind": "F", "pattern": "Event-driven", "text": "When a policy update request with request data is received for the database update, the system shall preset the outcome code to '00' (success) and convert the customer number and policy number into the numeric forms used for lookup.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-604b574afd"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-137", "code": "REQ-F-137", "kind": "F", "pattern": "Unwanted", "text": "If no policy row matches the requested customer number and policy number, then the system shall set the outcome code to '01' and make no update.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-abd195d446"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-138", "code": "REQ-F-138", "kind": "F", "pattern": "Event-driven", "text": "When the policy row is retrieved successfully and the caller's last-changed timestamp equals the stored last-changed timestamp, the system shall allow the policy-type update and the common policy update to proceed.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bb76c10c25", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c6c6533f38"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-139", "code": "REQ-F-139", "kind": "F", "pattern": "Unwanted", "text": "If the policy row was read but the caller's last-changed timestamp differs from the stored last-changed timestamp, then the system shall abandon the update and set the outcome code to '02'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1019f7e991"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-140", "code": "REQ-F-140", "kind": "F", "pattern": "Complex", "text": "While the policy row was read successfully and the caller's last-changed timestamp equals the stored timestamp, when the request type is '01UEND', '01UHOU' or '01UMOT', the system shall update the endowment details for '01UEND', the house details for '01UHOU', or the motor details for '01UMOT'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c6c6533f38", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6b02136857"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-141", "code": "REQ-F-141", "kind": "F", "pattern": "Complex", "text": "While the policy row was read successfully and the caller's last-changed timestamp equals the stored timestamp, when the request type is any value other than '01UEND', '01UHOU' or '01UMOT', the system shall update no policy-specific details and continue directly to the common policy update.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c6c6533f38"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-142", "code": "REQ-F-142", "kind": "F", "pattern": "Event-driven", "text": "When an endowment update request ('01UEND') passes the timestamp check, the system shall convert the term and sum assured to numeric form and update the endowment policy data store (ENDOWMENT) row for the policy number with with-profits, equities, managed fund, fund name, term, sum assured and life assured from the request.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbd4b366b9", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fa4e4b1654"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-143", "code": "REQ-F-143", "kind": "F", "pattern": "Event-driven", "text": "When a house update request ('01UHOU') passes the timestamp check, the system shall convert the bedrooms and value to numeric form and update the house policy data store (HOUSE) row for the policy number with property type, bedrooms, value, house name, house number and postcode from the request.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b422878cb1", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55bc548318"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-144", "code": "REQ-F-144", "kind": "F", "pattern": "Event-driven", "text": "When a motor update request ('01UMOT') passes the timestamp check, the system shall convert the cc, value, premium and accidents to numeric form and update the motor policy data store (MOTOR) row for the policy number with make, model, value, registration number, colour, cc, year of manufacture, premium and accidents from the request.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-220aed7dd5", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bc4744779d"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-145", "code": "REQ-F-145", "kind": "F", "pattern": "Unwanted", "text": "If no endowment, house or motor row matches the policy number during the policy-specific update, then the system shall set the outcome code to '01'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b422878cb1", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55bc548318"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-146", "code": "REQ-F-146", "kind": "F", "pattern": "Unwanted", "text": "If the endowment, house or motor policy-specific update fails for any reason other than no matching row, then the system shall set the outcome code to '90' and write an error message.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbd4b366b9", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b422878cb1", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-220aed7dd5", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fa4e4b1654", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55bc548318", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bc4744779d"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-147", "code": "REQ-F-147", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall record the operation name for error reporting before each update, using ' UPDATE ENDOW ' for the endowment update, ' UPDATE HOUSE ' for the house update, ' UPDATE MOTOR ' for the motor update and ' UPDATE POLICY  ' for the common policy update.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fa4e4b1654", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55bc548318", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bc4744779d", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-148", "code": "REQ-F-148", "kind": "F", "pattern": "Unwanted", "text": "If the policy-specific update leaves the outcome code other than '00', then the system shall close the locked policy retrieval and return to the caller without updating the common policy data.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ad7e5b07f8"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-149", "code": "REQ-F-149", "kind": "F", "pattern": "Event-driven", "text": "When the timestamps match and the policy-specific update succeeded, the system shall convert the broker id to numeric form and update the locked row in the policy data store (POLICY) with issue date, expiry date, broker id and broker's reference from the request and with the last-changed timestamp set to the current timestamp.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-150", "code": "REQ-F-150", "kind": "F", "pattern": "Event-driven", "text": "When the common policy update completes, the system shall read the newly assigned last-changed timestamp back from the policy data store by policy number and return it to the caller in the caller's last-changed timestamp.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-151", "code": "REQ-F-151", "kind": "F", "pattern": "Unwanted", "text": "If the newly assigned last-changed timestamp cannot be read back from the policy data store, then the system shall set the outcome code to '90' and write an error message.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-152", "code": "REQ-F-152", "kind": "F", "pattern": "Event-driven", "text": "When the policy database update returns without having ended the processing early, the system shall pass the full request, with a length of 225, on to the policy keyed-record update described in section 3.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-604b574afd"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-N-004", "code": "REQ-N-004", "kind": "N", "pattern": "State-driven", "text": "While the policy row in the policy data store is locked for update, its last-changed timestamp matches the caller's copy, and the policy-specific update has succeeded, the system shall update that same locked row with the issue date, expiry date, broker id (converted to numeric form) and broker's reference supplied by the caller, and set its last-changed timestamp to the current timestamp.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-203ed7588a"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-N-005", "code": "REQ-N-005", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall apply optimistic concurrency control by comparing the caller's last-changed timestamp with the stored timestamp before any update, so that changes made by others since the caller last read the policy are not overwritten.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bb76c10c25", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1019f7e991"], "programs": ["lgupdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-153", "code": "REQ-F-153", "kind": "F", "pattern": "Event-driven", "text": "When a policy update request is received for the keyed-record update, the system shall derive the policy type from the fourth character of the request identifier and take the read length from the length of the received request data.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0660a473a", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-be5cf0364c"], "programs": ["lgupvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-154", "code": "REQ-F-154", "kind": "F", "pattern": "Event-driven", "text": "When a policy update request is received for the keyed-record update, the system shall build the policy key from the customer number and the policy number in the request.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0660a473a", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-be5cf0364c"], "programs": ["lgupvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-155", "code": "REQ-F-155", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is 'C' (commercial), the system shall copy the business postcode, business status and business customer from the request into the policy record to be rewritten.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b6c42da244"], "programs": ["lgupvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-156", "code": "REQ-F-156", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is 'E' (endowment), the system shall copy the with-profits indicator, equities indicator, managed-fund indicator, fund name and life assured from the request into the policy record to be rewritten.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-52e60bcb51"], "programs": ["lgupvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-157", "code": "REQ-F-157", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is 'H' (house), the system shall copy the property type, bedroom count, property value, postcode and house name from the request into the policy record to be rewritten.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f801f00b6e"], "programs": ["lgupvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-158", "code": "REQ-F-158", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is 'M' (motor), the system shall copy the vehicle make, model, value and registration number from the request into the policy record to be rewritten.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3ef200cc1"], "programs": ["lgupvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-159", "code": "REQ-F-159", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is not 'C', 'E', 'H' or 'M', the system shall clear the whole policy details area of the record to spaces and copy no request detail values into the record.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-59aa9ba7be"], "programs": ["lgupvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-160", "code": "REQ-F-160", "kind": "F", "pattern": "Event-driven", "text": "When the policy record has been read for update successfully, the system shall rewrite the record containing the newly mapped details to the policy VSAM data store (KSDSPOLY).", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aaba34304c"], "programs": ["lgupvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-161", "code": "REQ-F-161", "kind": "F", "pattern": "Unwanted", "text": "If the rewrite to the policy VSAM data store fails, then the system shall capture the secondary response, log an error message and terminate abnormally with code 'LGV4'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aaba34304c"], "programs": ["lgupvs01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a new-customer request with non-zero data length is received, the system shall set the return code to '00' (success) and the number of policies to '00' (zero) as defaults that stand unless a later check overrides them.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-991c375aa8", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3697bf81df", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-86b7805ffc"], "programs": ["lgacdb01", "lgacus01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall compute the minimum acceptable request length as the request header length (18) plus the customer record length (72), giving a required length of 90.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3697bf81df", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d51944a3ed", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3a3fc86b3a", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8ca65a04f0"], "programs": ["lgacdb01", "lgacus01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the received request length is less than the required length of 90, then the system shall return to the caller without obtaining a customer number and without inserting the customer.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d51944a3ed", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3a3fc86b3a", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-86b7805ffc", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3697bf81df"], "programs": ["lgacdb01", "lgacus01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the received request length is less than the required length of 90, then the system shall set the return code to '98' before returning to the caller.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8ca65a04f0", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3697bf81df"], "programs": ["lgacdb01", "lgacus01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a new-customer request has passed the presence and length validations, the system shall obtain a customer number and then insert the new customer using the full customer request, passed with a length of 32500.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-bfeb0b3e78", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3697bf81df"], "programs": ["lgacdb01", "lgacus01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a validated new-customer request needs a customer number, the system shall request the next value from the counter 'GENACUSTNUM' in pool 'GENA' and, on success, use the returned value as the customer number while the counter-availability indicator keeps its default value 'ON'.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a14ec4ce5d", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-14c2f89566"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the request for the next value from the counter 'GENACUSTNUM' in pool 'GENA' fails, then the system shall set the counter-availability indicator to 'NO' and clear the customer number.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a14ec4ce5d", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-14c2f89566"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "State-driven", "text": "While the counter-availability indicator is 'ON', the system shall insert a new row into the customer data store (CUSTOMER) with the counter-issued customer number as the customer number and the request's first name, last name, date of birth, house name, house number, postcode, mobile phone, home phone and email address.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ebb7c9f9be", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d801f6a4a8", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d29d130688"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "State-driven", "text": "While the counter-availability indicator is not 'ON' (for example 'NO' after a counter failure), the system shall insert a new row into the customer data store with the customer number left to the store's default generated value and the request's first name, last name, date of birth, house name, house number, postcode, mobile phone, home phone and email address.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-06ae3bdd5a", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-efec943615"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Complex", "text": "While the counter-availability indicator is not 'ON', when the customer insert succeeds, the system shall retrieve the number the customer data store just generated and use it as the customer number.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If the customer insert into the customer data store fails on either numbering path, then the system shall set the return code to '90' and return to the caller without further processing.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the customer insert into the customer data store fails, then the system shall write an error message identifying the request as ' INSERT CUSTOMER'.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-06ae3bdd5a"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the counter-service indicator is 'ON' and the outcome of the customer database operation is not 0, then the system shall return to the caller without creating the customer security record.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ee6f8cefcf"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When the customer insert succeeds on either numbering path, the system shall return the assigned customer number to the caller in the request's customer number.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When a new customer has been inserted successfully, the system shall pass the full 225-byte request data, including the assigned customer number, and write the customer record with a customer record size of 0225 to the customer keyed data store (KSDSCUST) keyed by the 10-character customer number taken from the request.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-7c308664cf", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-98ad855daf"], "programs": ["lgacdb01", "lgacvs01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the write of the customer record to the customer VSAM data store fails, then the system shall capture the secondary response detail, log the failure, and terminate abnormally with abend code 'LGV0' without a dump, with no further processing.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-98ad855daf"], "programs": ["lgacvs01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When a new customer has been added and assigned a customer number, the system shall request creation of a customer security record with request type '02ACUS', the new customer number, initial password '5732fec825535eeafb8fac50fee3a8aa', attempt count '0000' and security state 'N', passing the request with a data length of 32500.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8e98397165"], "programs": ["lgacdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When a customer security request with request type '02ACUS' is received, the system shall convert the customer number to numeric form and convert the attempt count to a numeric password change count.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-e37fbdb751"], "programs": ["lgacdb02"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When a new-customer security add with request type '02ACUS' is processed, the system shall insert a row into the customer security data store (CUSTOMER_SECURE) holding the numeric customer number, the supplied password, the supplied state indicator and the numeric password change count.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-2627b01d7d", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-e37fbdb751"], "programs": ["lgacdb02"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If the insert into the customer security data store fails, then the system shall write a diagnostic message labelled ' INSERT SECURITY' and return to the caller with no further processing.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-2627b01d7d"], "programs": ["lgacdb02"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Ubiquitous", "text": "For every customer update request that arrives with request data, the system shall default the return code to the success value '00' and the number of policies to '00' (zero), and these defaults are returned to the caller unless a later step overrides them; the full request, including these preset values, is passed with a length of 32500 to the customer database update step.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65b72061bd", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-f31689c9ac", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b7263135cc"], "programs": ["lgucdb01", "lgucus01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Unwanted", "text": "If the request identifier is anything other than the update-customer request '01UCUS', then the system shall set the return code to '99' to signal an unsupported request and end processing without performing the customer update.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c83ef37a6f", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04a4edcd51"], "programs": ["lgucus01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Event-driven", "text": "When an update-customer request '01UCUS' with request data is received, the system shall convert the supplied customer number into the numeric customer key and update the row in the customer data store (CUSTOMER) whose customer number matches that key, replacing first name, last name, date of birth, house name, house number, postcode, mobile phone, home phone and email address with the supplied values.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c0b6f6ea13", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-689c1c148d", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b7263135cc"], "programs": ["lgucdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Event-driven", "text": "When the customer update step runs for a customer number and the update of the customer data store (CUSTOMER) row whose customer number matches the supplied customer number succeeds, replacing first name; last name; date of birth; house name; house number; postcode; mobile phone; home phone; and email address with the supplied values, the system shall leave the return code at its success value '00'.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-689c1c148d"], "programs": ["lgucdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Unwanted", "text": "If the customer update finds no customer matching the supplied customer number, then the system shall set the return code to '01' to report that the customer was not found and no customer was updated.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-69676c05ca"], "programs": ["lgucdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Unwanted", "text": "If the customer data store update fails for any reason other than customer-not-found, then the system shall log an error message identified as ' UPDATE CUST  ' carrying the customer number and the database return code.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c0b6f6ea13"], "programs": ["lgucdb01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When the customer data store update step has completed, the system shall replace the stored customer record in the customer VSAM data store (KSDSCUST) with the supplied customer data, starting at the customer number, at the fixed customer record size of 0225 bytes, and carry the return code with the request, which is passed with a length of 225.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04dcbd8b01", "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a"], "programs": ["lgucdb01", "lgucvs01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Unwanted", "text": "If the replacement of the customer record in the customer VSAM data store fails, then the system shall record a diagnostic error message including the secondary response code and terminate abnormally with code 'LGV2'.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a"], "programs": ["lgucvs01"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "State-driven", "text": "While the existing customer record in the customer VSAM data store is locked for update, the system shall perform the replacement of that record, so that no other update can intervene between locking and rewriting.", "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "rules": ["CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a"], "programs": ["lgucvs01"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "At the start of each run, the system shall begin with a blank outbound message and stamp the current system identifier into it.", "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-f646f17c37"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the message logging function is invoked by another program (the invoking program name is not blank), the system shall use the caller's data as the message text and set the message length to the length of the data the caller passed.", "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-f646f17c37"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the message logging function is started directly rather than by another program (the invoking program name is blank), the system shall receive the terminal input, use the received data as the message text, and set the message length to the received length minus 5.", "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-fb989ec573"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the message text begins with the queue-directive prefix 'Q=', the system shall replace the message text with the remainder of the message after the directive and reduce the message length by 7.", "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-f1fd6ad01d"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the message text does not begin with the queue-directive prefix 'Q=', the system shall leave the message text and message length unchanged.", "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-f1fd6ad01d"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall increase the message length by 5 and write the complete outbound message, which holds the system identifier followed by the message text, to the standard destination queue (CSMT) using the adjusted length.", "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-26136fe9d9"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall capture the outcome of the write to the standard destination queue as a response code.", "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-26136fe9d9"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When processing starts, the system shall clear the outbound message to blanks.", "capability": "No domain/DiagnosticandErrorMessageLogging#2", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When processing starts, the system shall retrieve the name of the program that invoked it.", "capability": "No domain/DiagnosticandErrorMessageLogging#2", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the retrieved invoking program name is present (not blank), the system shall set the invocation-mode flag to 'C' (called).", "capability": "No domain/DiagnosticandErrorMessageLogging#2", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the retrieved invoking program name is blank, the system shall set the invocation-mode flag to 'R' (run directly), meaning no program started this one.", "capability": "No domain/DiagnosticandErrorMessageLogging#2", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When a message is submitted for logging, the system shall clear the outbound message and stamp it with the identifier of the current originating system.", "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When a message is submitted for logging by an invoking program (the invoking program name is not blank), the system shall take the message text from the data passed by the invoking program and set the message length to the length of the passed data.", "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When a message is submitted for logging from a terminal (the invoking program name is blank), the system shall receive the terminal input, take the message text from the received data, and set the message length to the received length minus 5.", "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall default the target queue name for a prepared message to the application error queue 'GENAERRS'.", "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the prepared message text begins with the prefix 'Q=', the system shall replace the queue name extension portion of the target queue name with the four characters that follow the prefix.", "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the prepared message text begins with the prefix 'Q=', the system shall remove the prefix and the four-character queue code from the message text so that the remainder becomes the new message text, and shall reduce the message length by 7.", "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff"], "programs": ["lgstsq"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the prepared message text does not begin with the prefix 'Q=', the system shall keep the default target queue name 'GENAERRS' and leave the message text and length unchanged.", "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging", "rules": ["No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff"], "programs": ["lgstsq"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall retrieve the previously stored run time from the first entry of the interval statistics queue, named by the statistics queue prefix followed by '000V'.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-38b99a6f52"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the retrieval of the previous run time from the '000V' statistics queue does not succeed, then the system shall default the previous run time to '120000' (12:00:00).", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-38b99a6f52"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall clear the '000V' statistics queue and rewrite it with the current time, the first six characters of the current time in HHMMSS form, as its first entry.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-38b99a6f52"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate the elapsed interval as (current hours \u00d7 3600 + current minutes \u00d7 60 + current seconds) minus (previous hours \u00d7 3600 + previous minutes \u00d7 60 + previous seconds) and write it to the '000V' statistics queue as the second entry in six-character form.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-38b99a6f52"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read each of the seventeen named transaction counters from counter pool 'GENA' and publish each value as its own statistic under the statistics queue prefix plus its queue suffix: 'GENA01ICUS00'\u2192'100V'; 'GENA01ACUS00'\u2192'200V'; 'GENA01IMOT00'\u2192'300V'; 'GENA01AMOT00'\u2192'400V'; 'GENA01DMOT00'\u2192'500V'; 'GENA01UMOT00'\u2192'600V'; 'GENA01IEND00'\u2192'700V'; 'GENA01AEND00'\u2192'800V'; 'GENA01DEND00'\u2192'900V'; 'GENA01UEND00'\u2192'A00V'; 'GENA01IHOU00'\u2192'B00V'; 'GENA01AHOU00'\u2192'C00V'; 'GENA01DHOU00'\u2192'D00V'; 'GENA01UHOU00'\u2192'E00V'; 'GENA01ICOM00'\u2192'F00V'; 'GENA01ACOM00'\u2192'G00V'; 'GENA01DCOM00'\u2192'H00V'.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate the success total as the sum of all seventeen named transaction counters, initialized from 'GENA01ICUS00'.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate the inquiry total as the sum of counters 'GENA01ICUS00', 'GENA01IMOT00', 'GENA01IEND00', 'GENA01IHOU00' and 'GENA01ICOM00', initialized from 'GENA01ICUS00'.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate the add total as the sum of counters 'GENA01ACUS00', 'GENA01AMOT00', 'GENA01AEND00', 'GENA01AHOU00' and 'GENA01ACOM00', initialized from 'GENA01ACUS00'.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate the delete total as the sum of counters 'GENA01DMOT00', 'GENA01DEND00', 'GENA01DHOU00' and 'GENA01DCOM00', initialized from 'GENA01DMOT00'.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate the update total as the sum of counters 'GENA01UMOT00', 'GENA01UEND00' and 'GENA01UHOU00', initialized from 'GENA01UMOT00'.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall read the customer-number counter 'GENACUSTNUM' from counter pool 'GENA' and store its value as the statistic under the statistics queue prefix plus 'X05V', without adding it to any of the transaction totals.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-2b20e5b0af"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When all counters have been collected, the system shall store the success total under 'X00V', the inquiry total under 'X01V', the add total under 'X02V', the update total under 'X03V' and the delete total under 'X04V', each appended to the statistics queue prefix.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-1fba5c87ee"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "For every statistic stored (each counter and each total), the system shall read the previously stored value from the first entry of that statistic's queue, then clear the queue and rewrite it with three entries: the new value; the previous value; the change calculated as the new value minus the previous value.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-dc7efe58f6", "No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6", "No domain/TransactionStatisticsandMonitoring/id-1fba5c87ee", "No domain/TransactionStatisticsandMonitoring/id-2b20e5b0af"], "programs": ["lgwebst5"]}, {"key": "No domain/TransactionStatisticsandMonitoring/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use whatever value the read of a statistic's first queue entry returns as the previous value, without checking the outcome of that read.", "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring", "rules": ["No domain/TransactionStatisticsandMonitoring/id-dc7efe58f6"], "programs": ["lgwebst5"]}, {"key": "Unassigned-Programs/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<WUIAPPL>' in the edited member with the configured wui application identifier (WUIAPPL).", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-ad270444d3"],
