ServiceInterfaceGeneration/id-4d40358c6a", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-4d40358c6a", "name": "Generate commercial policy inquiry web service", "text": "THE Commercial Policy Inquiry Web Service Generation SHALL run the web service generation procedure for the commercial policy inquiry program (`LGIPOL01`). It uses the COBOL (`LANG` = `COBOL`) request and response structures from member `SOAIPB1` in source library `<SOURCEX>`, the `COMMAREA` program interface (`PGMINT`) and publishing URI `GENAPP/LGIPOLB1`. It names as outputs the binding file (`WSBIND`) `<ZFSHOME>/genapp/wsdir/LGIPOLB1.WebServiceGenerationParameters.ws_bind`, the service description (`WSDL`) `<ZFSHOME>/genapp/wsdir/LGIPOLB1.WebServiceGenerationParameters.wsdl` and the log (`LOGFILE`) `<ZFSHOME>/genapp/logs/LS2WS_LGIPOLB1.LOG`. It runs with Java directory `'java601_bit64_ga/J6.0.1_64'`, CICS directory `'cics660'`, temporary directory `'/tmp'`, temporary file prefix `'LS2WS'` and proxy `PROXY.HURSLEY.IBM.COM:80`.", "program": "wsaip01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-026", "REQ-F-028", "REQ-F-029"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-3d3ef091b0", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-3d3ef091b0", "name": "Generate endowment policy inquiry web service artifacts", "text": "THE Policy Inquiry Web Service Publication SHALL run the web service generation procedure for the policy inquiry program (`PGMNAME` = `LGIPOL01`), using: the Java runtime (`JAVADIR`) `'java601_bit64_ga/J6.0.1_64'`; the installation directory (`USSDIR`) `'cics660'`; an empty path prefix (`PATHPREF`); the temporary directory (`TMPDIR`) `'/tmp'` and file (`TMPFILE`) `'LS2WS'`; the source library (`PDSLIB`) `<SOURCEX>`; the language (`LANG`) `COBOL`; the request and response structures (`REQMEM`, `RESPMEM`) `SOAIPE1`; the interface (`PGMINT`) `COMMAREA`; the URI (`URI`) `GENAPP/LGIPOLE1`; and the proxy (`HTTPPROXY`) `PROXY.HURSLEY.IBM.COM:80`. Direct the binding file (`WSBIND`), the WSDL description (`WSDL`) and the generation log (`LOGFILE`) to their genapp paths.", "program": "wsaip01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-026", "REQ-F-030", "REQ-F-031"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0c53585966", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-0c53585966", "name": "Generate House Policy inquiry web service", "text": "THE House Policy Web Service Publication SHALL run the web service generation procedure (`DFHLS2WS`) for the House Policy inquiry program (`PGMNAME` = LGIPOL01), using the COBOL (`LANG`) request and response structures in member SOAIPH1 (`REQMEM`, `RESPMEM`) from library <SOURCEX> (`PDSLIB`). Configure the service to pass data via COMMAREA (`PGMINT`) at URI GENAPP/LGIPOLH1 (`URI`). Direct the binding file (`WSBIND`) and service description (`WSDL`) to <ZFSHOME>/genapp/wsdir/LGIPOLH1 paths, log to <ZFSHOME>/genapp/logs/LS2WS_LGIPOLH1.LOG (`LOGFILE`) and use proxy PROXY.HURSLEY.IBM.COM:80 (`HTTPPROXY`).", "program": "wsaip01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-026", "REQ-F-032", "REQ-F-033"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-af156effe0", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-af156effe0", "name": "Generate the policy inquiry service binding and WSDL", "text": "THE Policy Inquiry Web Service Publication SHALL request generation of a web service for the policy inquiry program (`IPPROGMB`) with these settings: COBOL (`LANG` = 'COBOL') request structure member (`REQMEM`) 'POLLOOK' and response structure member (`RESPMEM`) 'POLLOO2' from the library (`PDSLIB`) '<SOURCEX>'; communication-area interface (`PGMINT` = 'COMMAREA'); endpoint path (`URI`) 'GENAPP/LGIPOL02'; outputs of a binding file (`WSBIND`) and a WSDL (`WSDL`) under '<ZFSHOME>/genapp/wsdir/LGIPOL02'; a log at '<ZFSHOME>/genapp/logs/LS2WS_LGIPOL02.LOG'; and the HTTP proxy (`HTTPPROXY`) 'PROXY.HURSLEY.IBM.COM:80'", "program": "wsaip01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-034", "REQ-F-035"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-b604974fe0", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-b604974fe0", "name": "Generate the policy inquiry web service definition", "text": "THE Policy Inquiry Web Service Generation SHALL request generation of a web service for program `LGIPOL01` (`PGMNAME`) using COBOL (`LANG`) structures from member `SOAIPM1` (`REQMEM`, `RESPMEM`) of library `<SOURCEX>` (`PDSLIB`), with communication-area interface `COMMAREA` (`PGMINT`) and publication at `GENAPP/LGIPOLM1` (`URI`); the binding is to be written to `<ZFSHOME>/genapp/wsdir/LGIPOLM1.WebServiceGenerationParameters.ws_bind` (`WSBIND`), the service description to `<ZFSHOME>/genapp/wsdir/LGIPOLM1.WebServiceGenerationParameters.wsdl` (`WSDL`), and the log to `<ZFSHOME>/genapp/logs/LS2WS_LGIPOLM1.LOG` (`LOGFILE`), via proxy `PROXY.HURSLEY.IBM.COM:80` (`HTTPPROXY`)", "program": "wsaip01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-027", "REQ-F-036", "REQ-F-037"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-61ed489b0a", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-61ed489b0a", "name": "Configure the generator runtime environment", "text": "THE Web Service Publication SHALL provide the generation procedure with the Java directory (`JAVADIR`) `java601_bit64_ga/J6.0.1_64`, the installation directory (`USSDIR`) `cics660`, an empty path prefix (`PATHPREF`), the temporary directory (`TMPDIR`) `/tmp` and the temporary file name (`TMPFILE`) `LS2WS`.", "program": "wsavp01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-bc305a2e38", "name": "Generate web service binding and WSDL", "text": "THE Web Service Publication SHALL run the web service generation procedure for the program (`PGMNAME`) `LGIPVS01`. Supply the `COBOL` (`LANG`) request member `SOAVPII` (`REQMEM`) and response member `SOAVPIO` (`RESPMEM`) from library (`PDSLIB`) `<SOURCEX>`, the address (`URI`) `GENAPP/LGIPVS01` and the program interface (`PGMINT`) `COMMAREA`. Direct the binding file (`WSBIND`) to `<ZFSHOME>/genapp/wsdir/LGIPVS01.WebServiceGenerationInput.ws_bind`, the WSDL (`WSDL`) to `<ZFSHOME>/genapp/wsdir/LGIPVS01.WebServiceGenerationInput.wsdl` and the log (`LOGFILE`) to `<ZFSHOME>/genapp/logs/LS2WS_LGIPVS01.LOG`, using the proxy (`HTTPPROXY`) `PROXY.HURSLEY.IBM.COM:80`.", "program": "wsavp01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-063", "REQ-F-064", "REQ-F-065", "REQ-F-066", "REQ-F-067", "REQ-F-068"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-a84c6a0279", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-a84c6a0279", "name": "Generate the policy update web service", "text": "THE House Policy Service Generation SHALL run the web service assistant procedure with the Java runtime directory (`JAVADIR`) 'java601_bit64_ga/J6.0.1_64', the CICS installation directory (`USSDIR`) 'cics660', an empty path prefix (`PATHPREF`), the temporary directory (`TMPDIR`) '/tmp' and the temporary file name (`TMPFILE`) 'LS2WS'", "program": "wsaup01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-f654fb99f7", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-f654fb99f7", "name": "Generate the policy update web service", "text": "THE Endowment Policy Web Service Generation SHALL run the web service generation procedure for the policy update program (`PGMNAME` = `LGUPOL01`), with:\n- Java directory (`JAVADIR`) `'java601_bit64_ga/J6.0.1_64'`, installation directory (`USSDIR`) `'cics660'`, empty path prefix (`PATHPREF`)\n- temporary directory (`TMPDIR`) `'/tmp'` and temporary file (`TMPFILE`) `'LS2WS'`\n- COBOL (`LANG`) request and response structures (`REQMEM`, `RESPMEM` = `SOAIPE1`) from the source library (`PDSLIB`) `<SOURCEX>`\n- communication-area interface (`PGMINT` = `COMMAREA`) and service URI (`URI`) `GENAPP/LGUPOLE1`\n- HTTP proxy (`HTTPPROXY`) `PROXY.HURSLEY.IBM.COM:80`\n\nThe run names the log (`LOGFILE`), the binding file (`WSBIND`) and the service description (`WSDL`) as outputs under the genapp directories.", "program": "wsaup01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-045", "REQ-F-046", "REQ-F-047"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-c3ea35c318", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-c3ea35c318", "name": "Define the house policy update service", "text": "THE House Policy Service Generation SHALL supply the web service assistant with the service definition for the house policy update program (`PGMNAME` = `LGUPOL01`): language `COBOL` (`LANG`); request and response member `SOAIPH1` (`REQMEM`, `RESPMEM`) from the source library `<SOURCEX>` (`PDSLIB`); data passed through `COMMAREA` (`PGMINT`); service address `GENAPP/LGUPOLH1` (`URI`). Also supply the binding file location (`WSBIND`), the service description location (`WSDL`), the log location (`LOGFILE`) and the HTTP proxy 'PROXY.HURSLEY.IBM.COM:80' (`HTTPPROXY`).", "program": "wsaup01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-048", "REQ-F-049"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-945122851d", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-945122851d", "name": "Generate the policy update web service", "text": "THE Motor Policy Web Service Publication SHALL run the web service generation procedure (`DFHLS2WS`) with these inputs: Java directory `'java601_bit64_ga/J6.0.1_64'`, CICS directory `'cics660'`, empty path prefix, temporary directory `'/tmp'` and temporary file prefix `'LS2WS'`. Pass it a generation request that exposes the COBOL program `LGUPOL01` through a `COMMAREA` interface, uses request and response layouts `SOAIPM1` from library `<SOURCEX>`, and publishes at URI `GENAPP/LGUPOLM1` through proxy `PROXY.HURSLEY.IBM.COM:80`. Have it write the binding to `<ZFSHOME>/genapp/wsdir/LGUPOLM1.WebServiceGenerationRequest.ws_bind`, the service description to `<ZFSHOME>/genapp/wsdir/LGUPOLM1.WebServiceGenerationRequest.wsdl` and the log to `<ZFSHOME>/genapp/logs/LS2WS_LGUPOLM1.LOG`.", "program": "wsaup01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-050", "REQ-F-051", "REQ-F-052"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-022d84425e", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "id": "id-022d84425e", "name": "Generate the policy update web service", "text": "THE Policy Update Web Service Generation SHALL run the web service generation assistant for program `LGUPOL01` (`PGMNAME`) in `COBOL` (`LANG`), passing data via `COMMAREA` (`PGMINT`). The request and response structures (`REQMEM`, `RESPMEM`) are both member `SOAIPB1` from the copybook library `<SOURCEX>` (`PDSLIB`). The service is published at URI `GENAPP/LGUPOLB1` (`URI`) using proxy `PROXY.HURSLEY.IBM.COM:80` (`HTTPPROXY`). Write the binding file (`WSBIND`) and service description (`WSDL`) under `<ZFSHOME>/genapp/wsdir/LGUPOLB1` and the log (`LOGFILE`) to `<ZFSHOME>/genapp/logs/LS2WS_LGUPOLB1.LOG`. Use Java directory 'java601_bit64_ga/J6.0.1_64', installation directory 'cics660', an empty path prefix, and temporary files 'LS2WS' in '/tmp'.", "program": "wsaup01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-053", "REQ-F-054", "REQ-F-055"]}], "questions": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-001", "code": "OQ-001", "text": "The rules do not name the input data or the target store for either load. They identify the loads only by legacy labels. Which data stores from the data entity vocabulary are the inputs and targets of the first and second loads?", "owner": "application data owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#1", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-002", "code": "OQ-002", "text": "The rules say each load copies \"every record\" into its target store. They do not say whether the target store is empty before the load, or whether existing records are replaced, merged, or rejected as duplicates. What is the intended behavior?", "owner": "application data owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#1", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-003", "code": "OQ-003", "text": "The rules do not describe restart or recovery behavior if a load is interrupted partway through copying. Should a rerun reload from the start, and must the target store be reset first?", "owner": "batch operations team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#1", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-004", "code": "OQ-004", "text": "The rules list the functions users can start (customer menu; motor, life, house and commercial policy menus; setup; two inquiry functions), but they do not explicitly assign each function to a specific transaction code in Table 1. Confirm the exact mapping of each code to its function.", "owner": "application owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-005", "code": "OQ-005", "text": "The target platform is not yet known. The rules require \"task data located anywhere in storage\" and \"user key\" for every transaction. Confirm whether these attributes have a required equivalent on the target platform or can be dropped.", "owner": "platform architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-006", "code": "OQ-006", "text": "The rules state record sizes of 82 bytes for the customer file and 64 bytes for the policy file. Confirm whether these sizes are business constraints that the target data stores must keep, or storage layout details only.", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-007", "code": "OQ-007", "text": "The legacy definitions give fixed record lengths for the Customer VSAM data store (82 bytes) and the Policy VSAM data store (64 bytes). Are these lengths business constraints that the target customer and policy record structures must preserve, or are they storage layout only?", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#3", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-008", "code": "OQ-008", "text": "The configuration forbids deleting customer records through the online region. Does this reflect a business rule that customer records must never be deleted, or only that deletion must not happen online?", "owner": "insurance business owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#3", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-009", "code": "OQ-009", "text": "The legacy definitions specify 82-byte records with a 10-byte key for the Customer VSAM data store and 64-byte records with a 21-byte key for the Policy VSAM data store; should the 10-byte customer key and 21-byte policy key lengths be preserved as business identifier constraints in the modernized data stores, or are these purely storage layout details?", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-010", "code": "OQ-010", "text": "The front-end transaction setting \"task data in any storage location under the user key\" is a legacy runtime attribute; does it carry any requirement for the modernized platform, or can it be dropped?", "owner": "platform engineering team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-011", "code": "OQ-011", "text": "The claim table has no canonical data store name in the entity vocabulary; what name should the modernized system use for it?", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-012", "code": "OQ-012", "text": "The data type and length of the automatically generated customer, policy and claim numbers are not stated; what format constraints apply to these identifiers?", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-013", "code": "OQ-013", "text": "Seeded customers and policies use explicit numbers 1 to 10, while the schema generates customer and policy numbers starting at 1000001; should seeded rows keep explicit numbers below the generated range, or be assigned generated numbers?", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-014", "code": "OQ-014", "text": "Seeded commercial policies store 'ACTIVE' in the rejection reason field alongside status 1; is the rejection reason field intended to carry status text?", "owner": "business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-015", "code": "OQ-015", "text": "Seeded commercial renewal dates ('2011-08-24', '2011-07-30') precede their start dates ('2011-08-25', '2011-08-01'); is this intended sample data or a defect?", "owner": "business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-016", "code": "OQ-016", "text": "All ten seeded credentials share the same password value '5732fec825535eeafb8fac50fee3a8aa'; should the modernized seed data retain a shared credential value?", "owner": "security team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-017", "code": "OQ-017", "text": "The initialization is described as acting on the WUI data repository, yet its physical location is the CMAS data repository file (<USRHLQ>.<CMASAPPL>.EYUDREP) rather than the WUI data repository file (<USRHLQ>.<WUIAPPL>.EYUWREP). Which repository is the intended target in the modernized system?", "owner": "CICS/CPSM platform team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-018", "code": "OQ-018", "text": "The job is documented as first removing and then defining the repository before initialization, but no business rule describes those actions or their failure handling. Should repository removal and redefinition be specified as requirements of this flow?", "owner": "CICS/CPSM platform team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-019", "code": "OQ-019", "text": "The contents and recipients of the printed initialization report are not stated. What must the report contain and who consumes it?", "owner": "batch operations team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-020", "code": "OQ-020", "text": "The source of the workload simulation program is not available, so what it does with the initialization definitions, message definitions and simulation log data set, and what it produces, cannot be determined; the functional behavior of the simulation itself must be specified.", "owner": "application owner / performance testing team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-021", "code": "OQ-021", "text": "The rule does not state which named data stores supply the initialization definitions, the message set, the definitions set and the simulation log data set (candidates include the workload simulator message file, workload script library file and workload simulator log file); the mapping must be confirmed.", "owner": "batch operations team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-022", "code": "OQ-022", "text": "The rule does not state whether this simulation run is required in the modernized system or is a test/infrastructure activity that can be replaced by modern load-testing tooling.", "owner": "modernization lead", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-023", "code": "OQ-023", "text": "The handling of a request that arrives with no request data at all is not defined by any business rule in this flow; the expected outcome (rejection code or termination) must be confirmed.", "owner": "policy administration business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-024", "code": "OQ-024", "text": "The outcome code returned to the caller when the policy data store insert fails for a reason other than a non-existent customer is not stated.", "owner": "policy administration business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-025", "code": "OQ-025", "text": "The format (type and length) of the store-assigned policy number is not stated; it must be confirmed for the modernized policy data store.", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-026", "code": "OQ-026", "text": "When a type-specific detail write fails after the common policy row has been created, no rule states whether the common policy row is backed out; the required atomicity of the common row and its type-specific details must be confirmed.", "owner": "policy administration business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#11", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-027", "code": "OQ-027", "text": "The endowment life assured name is supplied as 31 characters but stored in a 30-character field; whether the 31st character is intentionally discarded must be confirmed.", "owner": "policy administration business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-028", "code": "OQ-028", "text": "The new policy is recorded both in the policy data store and in the policy VSAM data store; whether both stores must be retained in the modernized system, and which is authoritative, must be confirmed.", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-029", "code": "OQ-029", "text": "The format of the captured time is not stated. Only the date format (DDMMYYYY) is defined. What time format and precision must the startup record hold?", "owner": "application owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#13", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-030", "code": "OQ-030", "text": "The startup record store is not listed among the defined data entities. Should it be added to the data entity catalog, and under what canonical name?", "owner": "data architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#13", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-031", "code": "OQ-031", "text": "The group description says processing ends immediately when the startup event data cannot be retrieved and no input data was passed. No rule item defines this behavior. Must it be preserved as a requirement?", "owner": "application owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#13", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-032", "code": "OQ-032", "text": "The rules give conflicting return codes for a request shorter than the 28-character header: one states the return code remains preset to success '00', another states the return code is set to '98'. Which return code shall the caller receive?", "owner": "policy administration business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-033", "code": "OQ-033", "text": "No rule states the return code or error handling when deletion from the policy VSAM data store fails; what outcome shall the caller receive in that case?", "owner": "policy administration business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-034", "code": "OQ-034", "text": "Deletion occurs in both the policy data store and the policy VSAM data store with no rule describing a shared commit or rollback; if the second deletion fails after the first succeeds, shall the first deletion be reversed?", "owner": "application architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-035", "code": "OQ-035", "text": "No rule states the behaviour when no request data is received at all; what outcome shall the caller receive?", "owner": "policy administration business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-036", "code": "OQ-036", "text": "The rules state that the low customer entry starts with 'LOW CUSTOMER=' (23 characters) and the high customer entry starts with 'HIGH CUSTOMER=' (24 characters), but do not state what value follows the '=' label; what initial low and high customer values must be written?", "owner": "application business owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-037", "code": "OQ-037", "text": "The scan stops when a read no longer succeeds, which covers both end of queue and a read error without distinguishing them; should a read error during the scan be handled differently from reaching the end of the queue (for example, to avoid writing duplicate low or high customer entries)?", "owner": "application architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-038", "code": "OQ-038", "text": "The header entry is marked present solely because the first item of the control queue is read successfully, not because its text matches '**** GENAPP CNTL'; should the modernized system verify the header text?", "owner": "application architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-039", "code": "OQ-039", "text": "The rules do not describe what happens when a write without waiting fails because storage is unavailable; should the failure be reported, retried or ignored?", "owner": "operations team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-040", "code": "OQ-040", "text": "The control queue is shared, and the rules describe no protection against two concurrent executions both finding an entry missing and both appending it; is serialization required?", "owner": "application architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-041", "code": "OQ-041", "text": "The high-customer message is sent with a length of 24 while the label 'HIGH CUSTOMER=' is shorter; no rule states what value, if any, follows the label in the displayed message. What content should follow the label?", "owner": "business analyst for policy lifecycle management", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#16", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-042", "code": "OQ-042", "text": "No rule describes how output is delivered when the run is marked as program-called ('C'); that path is outside the provided rules. What output must the program-called path produce, and to whom?", "owner": "application architecture team", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#16", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-043", "code": "OQ-043", "text": "The data path is named 'Random Customer Number Retrieval', but no provided rule describes how a customer number is retrieved or which data store is read. What retrieval behavior must be specified for this flow?", "owner": "business analyst for policy lifecycle management", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#16", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-044", "code": "OQ-044", "text": "The bad-policy rule sets both the customer number and the policy number in the message to 13; it is not stated whether 13 is a literal value, an error code, or a field length, nor what downstream consumers expect in those fields.", "owner": "policy application business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-045", "code": "OQ-045", "text": "On the terminal path the policy-number length is the received length minus 6; the rules do not state what the 6 leading characters of the terminal input represent or whether this offset must be preserved.", "owner": "policy application business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-046", "code": "OQ-046", "text": "The rules do not state what the system returns or displays when the received terminal input is shorter than expected or empty, producing a policy-number length of zero or less.", "owner": "policy application business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-047", "code": "OQ-047", "text": "The outcome of each write is captured in a response code, but no test of that code is defined; should a failed write (including a write rejected for lack of space) halt the reinitialization, be reported, or be ignored?", "owner": "application owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-048", "code": "OQ-048", "text": "The values that follow the 'LOW CUSTOMER=' and 'HIGH CUSTOMER=' labels are not stated; what customer number values (and their source) must populate the low and high customer entries?", "owner": "application owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-049", "code": "OQ-049", "text": "The writes occur after the application control queue is cleared, but the clearing behavior itself is not specified as a requirement here; should clearing of existing entries be a stated requirement of this reinitialization, and what happens if clearing fails?", "owner": "application owner", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#18", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-050", "code": "OQ-050", "text": "A request with an unrecognised type receives return code '99' but is still passed to the database update, where the outcome code is preset to '00' and any other request type proceeds directly to the common policy update. Should an unrecognised request be allowed to update the common policy data and have its '99' code overwritten?", "owner": "policy business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-051", "code": "OQ-051", "text": "If a policy-specific update (endowment, house or motor) succeeds but the subsequent common policy update or timestamp read-back fails with '90', no rollback of the policy-specific change is described. Should the policy-specific and common updates be committed as a single unit?", "owner": "application architect", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#20", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-052", "code": "OQ-052", "text": "Behaviour when the read for update of the policy VSAM data store fails, and whether return codes '81' (read failure) and '82' (rewrite failure) are to be set before abnormal termination, is not defined by the business rules. What outcome should the caller receive in these cases?", "owner": "policy business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/OQ-053", "code": "OQ-053", "text": "The keyed-record mapping copies only a subset of type-specific details (house: no house number; motor: no colour, cc, year of manufacture, premium or accidents; endowment: no term or sum assured), unlike the database update. Is this partial mapping intended?", "owner": "policy business analyst", "unverified": false, "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-001", "code": "OQ-001", "text": "The rules conflict on the return code for a request shorter than the required length of 90: some state the return code is set to '98', while others state the request returns with the initialized return code '00' and note that an error-code assignment documented in a source comment is not present. Which return code must the modernized system return for a short request?", "owner": "business analyst", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-002", "code": "OQ-002", "text": "The rules describe two post-insert outcomes (writing the customer record to the customer VSAM data store, and creating the customer security record) without stating their relative order or whether both always occur in the same request. What is the required sequence, and are both mandatory for every new customer?", "owner": "solution architect", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-003", "code": "OQ-003", "text": "Every new customer receives the same fixed initial password '5732fec825535eeafb8fac50fee3a8aa'. Should the modernized system preserve a fixed initial credential or generate a per-customer credential?", "owner": "security team", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-004", "code": "OQ-004", "text": "No rule states rollback behavior when the customer data store insert succeeds but the customer VSAM data store write or the customer security data store insert subsequently fails. Must these writes be atomic, and if so, which store is authoritative on partial failure?", "owner": "solution architect", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-005", "code": "OQ-005", "text": "When the counter is unavailable, the customer data store generates the customer number; no rule states the format of that generated number or how collisions with counter-issued numbers are prevented, while the customer VSAM data store key is 10 characters. What format and uniqueness guarantee must the customer number satisfy across both numbering paths?", "owner": "data architect", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-006", "code": "OQ-006", "text": "Customer security requests with a request type other than '02ACUS' are routed to handling outside this flow. Should such requests be rejected, ignored, or handled elsewhere in the modernized system?", "owner": "business analyst", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#1", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-007", "code": "OQ-007", "text": "The replacement in the customer VSAM data store is triggered when the customer data store update step \"has completed\"; it is not stated whether this replacement must still occur when the customer data store update returned '01' (not found) or failed for another reason.", "owner": "business analyst, customer maintenance", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-008", "code": "OQ-008", "text": "The customer data store update and the customer VSAM data store replacement are two separate writes; no rule states rollback of the customer data store update when the replacement terminates abnormally with 'LGV2'. Should the modernized system make both updates atomic?", "owner": "solution architect", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-009", "code": "OQ-009", "text": "When the customer data store update fails for a reason other than not-found, the rules state only that an error is logged; it is not stated what return code the caller receives in that case.", "owner": "business analyst, customer maintenance", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/OQ-010", "code": "OQ-010", "text": "The number of policies is defaulted to '00' in a customer details update flow; its business purpose in the response to the caller is not stated.", "owner": "business analyst, customer maintenance", "unverified": false, "capability": "CustomerRecordManagement/CustomerRecordCreationandMaintenance#2", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance"}, {"key": "No domain/DiagnosticandErrorMessageLogging/OQ-001", "code": "OQ-001", "text": "The length adjustments of minus 5 for terminal input, minus 7 when the 'Q=' prefix is stripped, and plus 5 before the write are stated without their intent; the business meaning of these offsets (e.g., their relation to the system identifier, the 'Q=' prefix, and any directive content following it) needs confirmation before the modernized design reproduces them.", "owner": "application support team", "unverified": false, "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging"}, {"key": "No domain/DiagnosticandErrorMessageLogging/OQ-002", "code": "OQ-002", "text": "The response code from the write to the standard destination queue is captured, but no action on a failed write is stated; the required handling of a failed write is unknown.", "owner": "application support team", "unverified": false, "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging"}, {"key": "No domain/DiagnosticandErrorMessageLogging/OQ-003", "code": "OQ-003", "text": "When the message text begins with 'Q=', the remainder that replaces the message text is derived from a fixed view of the message; the exact number of characters treated as the directive (versus the 2-character prefix itself) is not stated and needs confirmation.", "owner": "application support team", "unverified": false, "capability": "No domain/DiagnosticandErrorMessageLogging#1", "function": "No domain/DiagnosticandErrorMessageLogging"}, {"key": "No domain/DiagnosticandErrorMessageLogging/OQ-004", "code": "OQ-004", "text": "The function-level description states that only in run-directly mode ('R') a one-character blank acknowledgement is sent to the terminal to clear the screen and unlock the keyboard, but the rule item itself only defines how the invocation-mode flag is set. Should the terminal acknowledgement in 'R' mode be carried forward as a requirement, and what is its expected equivalent in the modernized system?", "owner": "application owner / business analyst", "unverified": false, "capability": "No domain/DiagnosticandErrorMessageLogging#2", "function": "No domain/DiagnosticandErrorMessageLogging"}, {"key": "No domain/DiagnosticandErrorMessageLogging/OQ-005", "code": "OQ-005", "text": "For terminal-submitted messages the message length is the received length minus 5; the business meaning of the 5 excluded characters is not stated. Should the modernized system preserve this fixed offset or define an explicit terminal input format?", "owner": "application support team", "unverified": false, "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging"}, {"key": "No domain/DiagnosticandErrorMessageLogging/OQ-006", "code": "OQ-006", "text": "The 'Q=' override replaces the \"queue name extension portion\" of 'GENAERRS' with four characters, but the position of that extension within the queue name is not stated. Which characters of the default queue name are replaced?", "owner": "application support team", "unverified": false, "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging"}, {"key": "No domain/DiagnosticandErrorMessageLogging/OQ-007", "code": "OQ-007", "text": "Removing 'Q=' plus a four-character queue code accounts for 6 characters, yet the message length is reduced by 7. Is there an additional separator character after the queue code, or is this a legacy discrepancy?", "owner": "application support team", "unverified": false, "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging"}, {"key": "No domain/DiagnosticandErrorMessageLogging/OQ-008", "code": "OQ-008", "text": "The capability description indicates that the queue write does not wait for storage, but no rule states the write behavior or how a storage shortage is handled. Should the modernized system define this behavior?", "owner": "application support team", "unverified": false, "capability": "No domain/DiagnosticandErrorMessageLogging#3", "function": "No domain/DiagnosticandErrorMessageLogging"}, {"key": "No domain/TransactionStatisticsandMonitoring/OQ-001", "code": "OQ-001", "text": "The statistics queue prefix value is not stated in the rule text (the function description indicates queues are prefixed 'GENA'); confirm the exact prefix used for all statistic queue names.", "owner": "monitoring/operations team", "unverified": false, "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring"}, {"key": "No domain/TransactionStatisticsandMonitoring/OQ-002", "code": "OQ-002", "text": "When the read of a statistic's previous value fails (e.g., first run or empty queue), the legacy behavior uses whatever the read returns with no check; should the modernized system default the previous value (e.g., to zero) instead?", "owner": "business analyst", "unverified": false, "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring"}, {"key": "No domain/TransactionStatisticsandMonitoring/OQ-003", "code": "OQ-003", "text": "The elapsed interval is calculated from time-of-day only, so a refresh spanning midnight yields a negative or incorrect value, and the '120000' default produces an arbitrary interval on first run; should this behavior be preserved?", "owner": "business analyst", "unverified": false, "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring"}, {"key": "No domain/TransactionStatisticsandMonitoring/OQ-004", "code": "OQ-004", "text": "The trigger and scheduling of this statistics refresh are not identified; confirm how and how often the refresh is initiated.", "owner": "operations team", "unverified": false, "capability": "No domain/TransactionStatisticsandMonitoring#1", "function": "No domain/TransactionStatisticsandMonitoring"}, {"key": "Unassigned-Programs/OQ-001", "code": "OQ-001", "text": "The commercial list retrievals ('03ICOM', '05ICOM') place each fetched row in the same caller output area, each row overwriting the previous one; it is unclear whether the caller is intended to receive only the last row or all rows.", "owner": "policy inquiry business owner", "unverified": false, "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs"}, {"key": "Unassigned-Programs/OQ-002", "code": "OQ-002", "text": "The customer commercial list rules state both \"fewer than 21 rows\" / \"no more than 20 records returned\" and \"stop once the count exceeds 20\", which implies the 21st row is fetched and placed in the output before the stop; confirm the intended maximum number of rows returned.", "owner": "policy inquiry business owner", "unverified": false, "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs"}, {"key": "Unassigned-Programs/OQ-003", "code": "OQ-003", "text": "The internal processing that the script processing program performs on the member, library and message inputs, and the content of its listing and sequential output, are not determinable; confirm the expected outputs before modernization.", "owner": "workload simulation team", "unverified": false, "capability": "Unassigned-Programs#10", "function": "Unassigned-Programs"}, {"key": "Unassigned-Programs/OQ-004", "code": "OQ-004", "text": "How the log-list program uses the options 'CNSL', 'FMTSNA', 'DSPLY' and 'DATA' to select and format entries is not determinable; confirm the expected listing content.", "owner": "workload simulation team", "unverified": false, "capability": "Unassigned-Programs#11", "function": "Unassigned-Programs"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-001", "code": "OQ-001", "text": "No rule describes the outcome when the web service generation fails, for example when the structure member is missing or the output directory cannot be written. Should the job fail, retry, or leave partial artifacts?", "owner": "deployment team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-002", "code": "OQ-002", "text": "The Java runtime directory, the installation directory and the HTTP proxy are fixed values tied to the legacy environment. Should the modernized process preserve these values or make them configurable?", "owner": "platform engineering", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-003", "code": "OQ-003", "text": "The placeholder `<ZFSHOME>` in the output and log paths is not resolved by any rule. Which base directory should the modernized process use?", "owner": "deployment team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-004", "code": "OQ-004", "text": "No rule shows how the generated binding file and service description are deployed after the run. Is deployment part of this business function or a separate process?", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-005", "code": "OQ-005", "text": "All four policy-type services (Commercial, Endowment, House, Motor) target the same add-policy program and differ only in request/response member and address. Should the modernized system keep one shared add-policy operation with four type-specific interfaces, or define separate operations?", "owner": "integration architect", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-006", "code": "OQ-006", "text": "Each service definition is described as the only step of its job, yet all four belong to one data path with a single trigger. Should the four services be generated together or independently?", "owner": "batch operations team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-007", "code": "OQ-007", "text": "The Commercial Policy binding and service description file names are only partially stated (`<ZFSHOME>/genapp/wsdir/LGAPOLB1...`). The House Policy file names are given only as prefix `LGAPOLH1`, and the Endowment Policy file names are not stated. Only the Motor Policy file names are stated in full. What are the exact target file names?", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-008", "code": "OQ-008", "text": "The application source library and the `<ZFSHOME>` root are placeholders. What are the actual locations in the target environment?", "owner": "platform team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-009", "code": "OQ-009", "text": "Java runtime, assistant/CICS directory, path prefix and temporary settings are stated only for the Commercial and House Policy services. Do the Endowment and Motor Policy services use the same settings?", "owner": "platform team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-010", "code": "OQ-010", "text": "The HTTP proxy `PROXY.HURSLEY.IBM.COM:80` is fixed in the definitions. Is it still required in the modernized environment?", "owner": "network team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-011", "code": "OQ-011", "text": "The Commercial and House Policy service definitions are labelled \"Generate the endowment policy web service\" despite defining Commercial and House services. Is this labelling a legacy documentation error?", "owner": "application owner", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-012", "code": "OQ-012", "text": "The internal processing of the web service generation procedure is not visible. It is unknown how the procedure handles failure, such as missing request or response structures or an unreachable proxy, and whether any outputs are left in that case.", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#3", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-013", "code": "OQ-013", "text": "The placeholders `<ZFSHOME>` and `<SOURCEX>` are resolved outside this job. The modernized system needs a defined way to supply these locations.", "owner": "platform/infrastructure team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#3", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-014", "code": "OQ-014", "text": "The runtime settings are tied to the legacy installation (Java directory `java601_bit64_ga/J6.0.1_64`, installation directory `cics660`, proxy `PROXY.HURSLEY.IBM.COM:80`). It is unclear whether they must be preserved or replaced by equivalents in the modernized service-exposure mechanism.", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#3", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-015", "code": "OQ-015", "text": "The commercial, endowment, house and LGIPOLM1 service variants all expose the same program, but each uses different request and response structure members. Is a single program meant to serve all of these policy types, or is the program value a copy error in some variants?", "owner": "application architecture team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#4", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-016", "code": "OQ-016", "text": "The multiple-return policy inquiry definition, which uses members POLLOOK/POLLOO2 and URI GENAPP/LGIPOL02, is grouped under house policy publication but exposes a different program. Does it belong to this data path, and which policy type does it serve?", "owner": "application architecture team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#4", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-017", "code": "OQ-017", "text": "This data path is triggered by a single job, yet five distinct service definitions are described. Which definitions does that job actually generate, and in what order?", "owner": "batch operations team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#4", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-018", "code": "OQ-018", "text": "The house policy variant names its binding file and service description only as \"<ZFSHOME>/genapp/wsdir/LGIPOLH1 paths\", without exact file names. What are the exact target file names?", "owner": "batch operations team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#4", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-019", "code": "OQ-019", "text": "For the LGIPOLM1 and multiple-return variants, the runtime settings (Java directory, installation directory, temporary directory and temporary file prefix) are not stated. Do these variants use the same settings as the other variants?", "owner": "batch operations team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#4", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-020", "code": "OQ-020", "text": "No behavior is described for a failed generation, such as a missing source member or an unwritable output path. What failure handling and restart expectations apply?", "owner": "batch operations team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#4", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-021", "code": "OQ-021", "text": "The web service generation procedure itself is not available, so its internal processing, its validation behavior and its outcome when generation fails cannot be specified; what generation steps and failure handling must the modernized equivalent provide?", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#5", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-022", "code": "OQ-022", "text": "The exact file names of the binding file and the WSDL description are not stated; only the directory `<ZFSHOME>/genapp/wsdir/` is known. What names must the outputs carry for downstream consumers?", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#5", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-023", "code": "OQ-023", "text": "Is the HTTP proxy 'PROXY.HURSLEY.IBM.COM:80' a required part of the service contract, or an environment-specific setting to be replaced in the target platform?", "owner": "infrastructure team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#5", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-024", "code": "OQ-024", "text": "Restart and rerun behavior is not stated; it is unknown whether rerunning the job overwrites existing binding, WSDL and log outputs or fails when they already exist.", "owner": "batch operations team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#5", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-025", "code": "OQ-025", "text": "Is the empty path prefix deliberate, or a placeholder value to be configured per environment?", "owner": "infrastructure team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#5", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-026", "code": "OQ-026", "text": "The house policy output file names contain \"HousePolicyWebServiceGenerationParameters\" and the motor binding file name contains \"WebServiceGenerationRequest\" with a \".ws_bind\" extension; are these the actual required file names and extensions, or should they follow a uniform naming convention (for example LGUPOLH1.wsbind / LGUPOLM1.wsbind)?", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#6", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-027", "code": "OQ-027", "text": "The exact binding file and service description file names for the endowment (LGUPOLE1) and commercial (LGUPOLB1) services are not stated beyond their directory and service name; what file names are required?", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#6", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-028", "code": "OQ-028", "text": "No Java directory, installation directory, path prefix or temporary file settings are stated for the house policy generation; should it use the same settings stated for the endowment, motor and commercial generations?", "owner": "platform team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#6", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-029", "code": "OQ-029", "text": "All four services ructure team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#7", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-033", "code": "OQ-033", "text": "The network proxy `PROXY.HURSLEY.IBM.COM:80`, Java runtime directory and CICS install directory are fixed environment values. Should these remain fixed or become configurable in the modernized system?", "owner": "platform/infrastructure team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#7", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-034", "code": "OQ-034", "text": "The data path is titled \"Customer Number Web Service Generation\", but the rule does not state what business data the request structure `SOAVCII` and response structure `SOAVCIO` carry. What business content does the published service expose?", "owner": "business analyst", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#7", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-035", "code": "OQ-035", "text": "The internal processing of the web service generation procedure is not visible, including its validation of the request and response structures and its behavior on generation failure (for example, whether partial binding or WSDL output is left behind). These behaviors need to be defined for the modernized implementation.", "owner": "integration team", "unverified": false, "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#8", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration"}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/OQ-036", "code": "OQ-036
