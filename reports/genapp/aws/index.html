ansaction listed in Table 1 so that its task data may be located anywhere in storage and its task data runs in user key.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-518ac61ce7"], "programs": ["cdef121"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "Once the Table 1 transactions are defined, the system shall allow users to start the following functions by their transaction codes: the customer menu; the motor, life, house and commercial policy menus; the setup function; the two inquiry functions.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-518ac61ce7"], "programs": ["cdef121"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall define the customer VSAM data store (KSDSCUST) in file group GENASAF. The definition shall point to the customer KSDS file (<USRHLQ>.GENAPP.KSDSCUST), with records keyed on a 10-byte key, and the file enabled and opened on first reference.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDepl  {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-024", "code": "REQ-F-024", "kind": "F", "pattern": "Unwanted", "text": "If an online request attempts to delete a record from the Customer VSAM data store, the system shall prohibit the delete, so that customers cannot be removed through the online application.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4604039ebf"], "programs": ["cdef123"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-025", "code": "REQ-F-025", "kind": "F", "pattern": "Event-driven", "text": "When the resource definition configuration job executes, the system shall define in the shared definition group the Policy VSAM data store (KSDSPOLY), backed by the Policy KSDS file (<USRHLQ>.GENAPP.KSDSPOLY), as enabled and opened on first reference.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-36f59cf45b"], "programs": ["cdef123"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-026", "code": "REQ-F-026", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall permit add, browse, read, update and delete operations on the Policy VSAM data store, so that policies are fully maintainable online.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-36f59cf45b"], "programs": ["cdef123"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-027", "code": "REQ-F-027", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 4, the system shall create the customer data store (CUSTOMER) holding customer number, first name, last name, date of birth, house name, house number, postcode, home phone, mobile phone and email address, keyed on an automatically generated customer number that starts at 1000001 and increments by 1, with a unique clustering index on the customer number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-82805ba367"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-028", "code": "REQ-F-028", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 4, the system shall create the customer security data store (CUSTOMER_SECURE) holding customer number, password, state indicator and password-change count, where each row must belong to an existing customer in the customer data store and is deleted when that customer is deleted, with a unique clustering index on the customer number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-82805ba367"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-029", "code": "REQ-F-029", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 4, the system shall create the policy data store (POLICY) holding issue date, expiry date, policy type, last-changed timestamp, broker, broker's reference, payment and commission, keyed on an automatically generated policy number that starts at 1000001 and increments by 1, with a unique index on the policy number and a non-unique index on the customer number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-580abc24e1"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-030", "code": "REQ-F-030", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall require each policy in the policy data store to belong to a mandatory customer in the customer data store, delete policies when their customer is deleted, and default the policy last-changed timestamp to the current time.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-580abc24e1"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-031", "code": "REQ-F-031", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 4, the system shall create the endowment policy data store (ENDOWMENT) keyed by policy number and holding the equities, with-profits and managed-fund indicators, fund name, term, sum assured, life assured and padding data of up to 32606 characters, where each row must belong to an existing policy and is deleted when that policy is deleted, with a unique index on the policy number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-028866d25d"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-032", "code": "REQ-F-032", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 4, the system shall create the house policy data store (HOUSE) keyed by policy number and holding property type, bedrooms, value, house name, house number and postcode, where rows are deleted when their parent policy is deleted, with a unique index on the policy number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-918836eac5"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-033", "code": "REQ-F-033", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 4, the system shall create the motor policy data store (MOTOR) keyed by policy number and holding make, model, value, registration number, colour, engine size, year of manufacture, premium and accidents, where rows are deleted when their parent policy is deleted, with a unique index on the policy number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4f48994b90"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-034", "code": "REQ-F-034", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 4, the system shall create the commercial policy data store (COMMERCIAL) keyed by policy number and holding request date, start date, renewal date, address, zip code, latitude, longitude, customer, property type, a peril indicator and a premium for each of fire, crime, flood and weather, a status and a rejection reason, where rows are deleted when their parent policy is deleted, with a unique index on the policy number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-021d7c7320"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-035", "code": "REQ-F-035", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 4, the system shall create the claim table holding claim date, paid amount, value, cause and observations, keyed on an automatically generated claim number that starts at 1000001 and increments by 1, where each claim belongs to a mandatory policy and is deleted when that policy is deleted, with a unique index on the claim number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a1b38def3e"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-036", "code": "REQ-F-036", "kind": "F", "pattern": "Unwanted", "text": "If any earlier step of the job ended with a return code above 4, then the system shall not perform the remaining table and index creation steps.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a1b38def3e"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-037", "code": "REQ-F-037", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert customers 1 to 10 into the customer data store with customer number, first name, last name, date of birth, house name, house number and postcode as follows: 1 'Andrew' 'Pandy', born '1950-07-11', house '34', postcode 'PI101OO'; 2 'Scott' 'Tracey', born '1965-09-30', 'Tracey Island' '1', postcode 'TB14TV'; 3 'John' 'Noakes', born '1934-03-06', house '70', postcode 'HX116BP'; 4 'Louis' 'Pug', born '1969-09-06', 'Picnic Basket' '21', postcode 'PP159DD'; 5 'Graham' 'Cuthbert', born '1967-01-03', house '55', postcode 'TR68BK'; 6 'Brian' 'Cant', born '1933-07-12', house '58', postcode 'IP221PL'; 7 'Troy' 'Tempest', born '1964-10-04', 'The Ray' '48', postcode 'ST106RY'; 8 'Johnny' 'Morris', born '1961-06-20', house '72', postcode 'BS83HA'; 9 'Micky' 'Murphy', born '1966-01-03', house '51', postcode 'CA316RN'; 10 'Susan' 'Stranks', born '1938-12-02', house '68', postcode 'W1A4WW'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e225eae034"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-038", "code": "REQ-F-038", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall store a blank (' ') for any absent house name, home phone, mobile phone or email of a seeded customer.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e225eae034"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-039", "code": "REQ-F-039", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert a credential row for each customer 1 to 10 into the customer security data store with password value '5732fec825535eeafb8fac50fee3a8aa', state indicator 'N' and password-change count 0.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b82442bdbd"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-040", "code": "REQ-F-040", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert policies into the policy data store with policy type Commercial ('C'), Endowment ('E'), House ('H') or Motor ('M') as follows: policy 10, customer 1, 'C', '2011-08-22' to '2012-08-21'; policy 9, customer 5, 'C', '2011-09-23' to '2012-09-22'; policy 5, customer 3, 'E', '2011-10-01' to '2012-09-30'; policy 4, customer 8, 'E', '2011-08-05' to '2012-08-04'; policy 6, customer 4, 'H', '2011-09-01' to '2011-12-31'; policy 7, customer 6, 'C', '2011-10-05' to '2012-10-04', last changed '2011-10-09 16:50:00'; policy 8, customer 9, 'H', '2011-08-12' to '2012-08-11'; policy 1, customer 2, 'M', '2011-05-11' to '2012-05-10'; policy 3, customer 5, 'M', '2011-09-08' to '2012-09-07'; policy 2, customer 10, 'M', '2011-10-31' to '2012-10-30'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c04650508c"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-041", "code": "REQ-F-041", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall load every seeded policy with broker id 0, an empty broker reference (''), payment 0 and commission 0.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c04650508c"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-042", "code": "REQ-F-042", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert endowment details into the endowment policy data store as follows: policy 5 with equities 'N', with-profits 'N', managed fund 'N', fund 'SHEPPA', term 10, sum assured 50000, life assured 'Shep'; policy 4 with equities 'Y', with-profits 'Y', managed fund 'N', fund 'LIONTMR', term 5, sum assured 12500, life assured 'J. MORRIS'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de9aa8bb49"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-043", "code": "REQ-F-043", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert property details into the house policy data store as follows: policy 6, 'HOUSE', 5 bedrooms, value 1500000, number '   5', postcode 'SO211UP'; policy 7, 'FARM' named 'HOME FARM', 8 bedrooms, value 3750000, number '   4', postcode 'SO529ED'; policy 8, 'FLAT', 1 bedroom, value 260000, number ' 12b', postcode 'E15WW'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d98e85e843"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-044", "code": "REQ-F-044", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert vehicle details into the motor policy data store as follows: policy 1, 'FORD' 'KA', value 8500, registration 'LL60LOO', 'ORANGE', 1000 cc, manufactured '1999-07-19', premium 450, 0 accidents; policy 3, 'DENNIS' 'ENGINE', value 23500, registration 'FIRE1', 'RED', 5000 cc, manufactured '1973-05-13', premium 2850, 12 accidents; policy 2, 'VOLKSWAGEN' 'BEETLE', value 600, registration 'A567WWR', 'PURPLE', 1200 cc, manufactured '1968-10-31', premium 700, 1 accident.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1d505b5bde"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-045", "code": "REQ-F-045", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert commercial cover for policy 10 into the commercial policy data store with customer 'IBM', property type 'OFFICES', address 'HURSLEY PARK', zip code 'SO212JN', requested '2011-08-23 10:44:34', start '2011-08-25', renewal '2011-08-24', and peril/premium fire 3/8000, crime 3/25000, flood 5/2000, weather 4/5000.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3fcf0ce472"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-046", "code": "REQ-F-046", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall insert commercial cover for policy 9 into the commercial policy data store with customer 'Burnley Football Club', property type 'STADIUM', address 'TURF MOOR', zip code 'BB104BX', requested '2011-07-17 13:13:09', start '2011-08-01', renewal '2011-07-30', and peril/premium fire 1/44000, crime 2/25000, flood 3/15000, weather 4/6000.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3fcf0ce472"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-047", "code": "REQ-F-047", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall load both seeded commercial policies with status 1 and rejection reason text 'ACTIVE'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3fcf0ce472"], "programs": ["db2cre"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-048", "code": "REQ-F-048", "kind": "F", "pattern": "Event-driven", "text": "When no earlier step of the job ended with a return code above 8, the system shall run repository initialization against the existing WUI data repository, held in the CMAS data repository file (<USRHLQ>.<CMASAPPL>.EYUDREP), with the parameters 'CMASNAME=<CMASAPPL>'; 'DAYLIGHT=N' (daylight saving time not in effect); 'TIMEZONE=B' (time zone code B); 'SYSID=<CMASYSID>'; 'ZONEOFFSET=0'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5b11dafff"], "programs": ["defdrep"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-049", "code": "REQ-F-049", "kind": "F", "pattern": "Event-driven", "text": "When repository initialization runs, the system shall supply the WUI server identification values WUIAPPLID=<WUIAPPL>; WUINAME=<WUIAPPL>; WUISYSID=<WUISYSID>.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5b11dafff"], "programs": ["defdrep"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-050", "code": "REQ-F-050", "kind": "F", "pattern": "Event-driven", "text": "When repository initialization runs, the system shall print a report.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5b11dafff"], "programs": ["defdrep"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-051", "code": "REQ-F-051", "kind": "F", "pattern": "Unwanted", "text": "If any earlier step of the job ended with a return code above 8, then the system shall skip repository initialization.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5b11dafff"], "programs": ["defdrep"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall access the CMAS data repository file under shared access during repository initialization.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5b11dafff"], "programs": ["defdrep"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-052", "code": "REQ-F-052", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall run the workload simulation with the parameter 'NTWRK=GENAPP', selecting the network named GENAPP.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83"], "programs": ["itpentr"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-053", "code": "REQ-F-053", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall supply the simulation run with three data sets: the initialization definitions; the message definitions; the simulation log data set.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83"], "programs": ["itpentr"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-054", "code": "REQ-F-054", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build the message definitions input as a concatenation of the message set followed by the same definitions set that feeds the initialization definitions input.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83"], "programs": ["itpentr"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-055", "code": "REQ-F-055", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall run the workload simulation with automatic logging disabled.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83"], "programs": ["itpentr"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-056", "code": "REQ-F-056", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall route any dump and any printed output produced by the workload simulation run to the job's output.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83"], "programs": ["itpentr"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall access the initialization definitions, the message definitions and the simulation log data set in shared mode, with no change to the lifecycle of any of these data sets.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83"], "programs": ["itpentr"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-057", "code": "REQ-F-057", "kind": "F", "pattern": "Event-driven", "text": "When request data has been received for a policy creation request, the system shall set the outcome code to '00' (success), which is returned to the caller unless a later check replaces it with an error code.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-67d318b149", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-69990f88a1"], "programs": ["lgapol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-058", "code": "REQ-F-058", "kind": "F", "pattern": "Unwanted", "text": "If the received request data length is less than the required header length of 28, then the system shall set the outcome code to '98' and return to the caller without creating a policy.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-73efef8c09", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-69990f88a1"], "programs": ["lgapol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-059", "code": "REQ-F-059", "kind": "F", "pattern": "Event-driven", "text": "When a request passes the request-data presence and minimum header length checks, the system shall proceed to policy creation using the full request data, passed with a length of 32500.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7ada9054d2"], "programs": ["lgapol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-060", "code": "REQ-F-060", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '01AEND', '01AHOU', '01AMOT' or '01ACOM', the system shall compute the required request length as the header length 28 plus the type length and set the policy type as follows: '01AEND' adds 124 and sets type 'E' (endowment); '01AHOU' adds 130 and sets type 'H' (house); '01AMOT' adds 137 and sets type 'M' (motor); '01ACOM' adds 1174 and sets type 'C' (commercial).", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-72ac5642e9", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb2d8cc23e"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-061", "code": "REQ-F-061", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '01AEND', '01AHOU', '01AMOT' or '01ACOM', the system shall convert the customer number to integer form for recording the policy and retain the customer number in the error message in case an error must be reported.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-72ac5642e9"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-062", "code": "REQ-F-062", "kind": "F", "pattern": "Unwanted", "text": "If the request identifier is not '01AEND', '01AHOU', '01AMOT' or '01ACOM', then the system shall set the outcome code to '99' (request not recognised or supported) and return to the caller without creating any policy.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c86469d39d", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0d9a8f3ef", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-00acb00307"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-063", "code": "REQ-F-063", "kind": "F", "pattern": "Unwanted", "text": "If the received request data length is less than the required length computed for the policy type, then the system shall set the outcome code to '98' and return to the caller without recording the policy.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-390dc7122b", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ff258ee466"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-064", "code": "REQ-F-064", "kind": "F", "pattern": "Event-driven", "text": "When a validated policy creation request is processed, the system shall add a row to the policy data store (POLICY) with the policy number left for the store to assign, the customer number, issue date, expiry date, policy type, last-changed set to the current timestamp, broker identifier, broker's reference and payment, with the broker identifier and payment converted to integer form.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5ef0661502", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e2e938826d", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b57f2e52e"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-065", "code": "REQ-F-065", "kind": "F", "pattern": "Event-driven", "text": "When the policy data store row is written successfully, the system shall set the outcome code to '00'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b57f2e52e"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-066", "code": "REQ-F-066", "kind": "F", "pattern": "Event-driven", "text": "When the policy data store row is written successfully, the system shall return the assigned policy number to the caller, then read the last-changed timestamp from the policy data store for that policy number and return it to the caller.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7d63ee3c38", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbac5019dd", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b57f2e52e"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-067", "code": "REQ-F-067", "kind": "F", "pattern": "Event-driven", "text": "When the policy data store row is written successfully, the system shall retain the assigned policy number in the error message in case a later error must be reported.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7d63ee3c38"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-068", "code": "REQ-F-068", "kind": "F", "pattern": "Unwanted", "text": "If the policy data store insert is rejected because the referenced customer does not exist (database code -530), then the system shall log the error message, set the outcome code to '70' and return to the caller without writing any type-specific policy details.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-73fccd0ddd", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-29fba40dae"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-069", "code": "REQ-F-069", "kind": "F", "pattern": "Unwanted", "text": "If the policy data store insert fails for any reason other than a non-existent customer, then the system shall log the error message and return to the caller without writing any type-specific policy details.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-29fba40dae", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b57f2e52e"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-070", "code": "REQ-F-070", "kind": "F", "pattern": "Event-driven", "text": "When the common policy row has been created, the system shall write the type-specific details selected by the request identifier: '01AEND' endowment details; '01AHOU' house details; '01AMOT' motor details; '01ACOM' commercial details.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ba0408ad62", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-99cfb6d993"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-071", "code": "REQ-F-071", "kind": "F", "pattern": "Unwanted", "text": "If the request identifier is not '01AEND', '01AHOU', '01AMOT' or '01ACOM' when selecting the type-specific details, then the system shall set the outcome code to '99' (request not recognised or supported).", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#10", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8fe29ce40c"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-072", "code": "REQ-F-072", "kind": "F", "pattern": "Event-driven", "text": "When an endowment request ('01AEND') has its common policy row created, the system shall write a row to the endowment policy data store (ENDOWMENT) for the new policy number with with-profits, equities, managed fund, fund name, term, sum assured and life assured, with term and sum assured converted to integer form.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#11", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c32efb4c34", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3b2fa437b"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-073", "code": "REQ-F-073", "kind": "F", "pattern": "Event-driven", "text": "When writing endowment details, the system shall compute the extra-data length as the received request length minus the required length, include the padding data up to that length when it is greater than zero, and omit the padding data otherwise.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#11", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c32efb4c34", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3b2fa437b"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-074", "code": "REQ-F-074", "kind": "F", "pattern": "Event-driven", "text": "When a house request ('01AHOU') has its common policy row created, the system shall write a row to the house policy data store (HOUSE) for the new policy number with property type, bedrooms, value, house name, house number and postcode, with value and bedrooms converted to integer form.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#11", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-044e547baf", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-54a9a245fa"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-075", "code": "REQ-F-075", "kind": "F", "pattern": "Event-driven", "text": "When a motor request ('01AMOT') has its common policy row created, the system shall write a row to the motor policy data store (MOTOR) for the new policy number with make, model, value, registration number, colour, cc, year of manufacture, premium and accidents, with value, cc, premium and accidents converted to integer form.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#11", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-af6e61f1b8", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e34469caea"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-076", "code": "REQ-F-076", "kind": "F", "pattern": "Event-driven", "text": "When a commercial request ('01ACOM') has its common policy row created, the system shall write a row to the commercial policy data store (COMMERCIAL) for the new policy number with request date set to the policy's last-changed timestamp, start date set to the issue date, renewal date set to the expiry date, address, zipcode from the postcode, latitude, longitude, customer, property type, the fire, crime, flood and weather peril and premium pairs, status and rejection reason, with the perils, premiums and status converted to integer form.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#11", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-671ad4e04a", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bd57cb0fcb"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-077", "code": "REQ-F-077", "kind": "F", "pattern": "Unwanted", "text": "If writing the endowment, house, motor or commercial details fails, then the system shall log the error message, set the outcome code to '90' and terminate processing abnormally with code 'LGSQ'.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#11", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c32efb4c34", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-044e547baf", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-af6e61f1b8", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3b2fa437b", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-54a9a245fa", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e34469caea"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-078", "code": "REQ-F-078", "kind": "F", "pattern": "Event-driven", "text": "When policy registration processing completes without ending early, the system shall delegate to the follow-on program with the full request data, sent with a length of 32500, including the policy number, timestamp and return code set earlier.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5378c55f95"], "programs": ["lgapdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-079", "code": "REQ-F-079", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build a 21-character policy identification key from the 4th character of the request identifier as the policy type, followed by the customer number and the policy number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8c1805284d"], "programs": ["lgapvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-080", "code": "REQ-F-080", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is commercial ('C'), the system shall record the premises postcode as the billing postcode, the commercial status code as the billing status code and the first 31 characters of the commercial customer name, which is supplied as 255 characters, as the billing customer name.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8e307b48c7"], "programs": ["lgapvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-081", "code": "REQ-F-081", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is endowment ('E'), the system shall record the with-profits indicator, equities indicator, managed-fund indicator, fund name and life assured name, with the 31-character life assured name stored in a 30-character field.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-79ba6cc803"], "programs": ["lgapvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-082", "code": "REQ-F-082", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is house ('H'), the system shall record the property type, bedroom count, house value, postcode and the first 9 characters of the 20-character house name.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2bc3830325"], "programs": ["lgapvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-083", "code": "REQ-F-083", "kind": "F", "pattern": "Event-driven", "text": "When the policy type is motor ('M'), the system shall record the vehicle make, model, value and registration number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7cd4214024"], "programs": ["lgapvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-084", "code": "REQ-F-084", "kind": "F", "pattern": "Unwanted", "text": "If the policy type is not 'C', 'E', 'H' or 'M', then the system shall clear the policy details area of the record to blanks while still keying the record by policy type, customer number and policy number.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5513247ee"], "programs": ["lgapvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-085", "code": "REQ-F-085", "kind": "F", "pattern": "Event-driven", "text": "When the policy record has been assembled, the system shall add it to the policy VSAM data store (KSDSPOLY) under its policy identification key.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fc5c221c93"], "programs": ["lgapvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-086", "code": "REQ-F-086", "kind": "F", "pattern": "Unwanted", "text": "If adding the policy record to the policy VSAM data store fails, then the system shall capture the secondary failure response, produce a failure diagnostic message and return to the caller, ending processing for the request.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#12", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fc5c221c93"], "programs": ["lgapvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-087", "code": "REQ-F-087", "kind": "F", "pattern": "Event-driven", "text": "When the startup record store is read and does not exist yet, the system shall capture the current date in day-month-year format (DDMMYYYY) and the current time, and write them to the startup record store as the startup record.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#13", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1"], "programs": ["lgastat1"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-088", "code": "REQ-F-088", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build the startup record with the captured date in its date portion and the captured time in its time portion, separated by a blank filler.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#13", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1"], "programs": ["lgastat1"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-089", "code": "REQ-F-089", "kind": "F", "pattern": "State-driven", "text": "While the startup record store already exists, the system shall write no new startup record and shall leave the existing record untouched, so that the original start timestamp is kept.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#13", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1"], "programs": ["lgastat1"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-090", "code": "REQ-F-090", "kind": "F", "pattern": "Event-driven", "text": "When request data of non-zero length is received, the system shall set the return code to the success value '00' before any further checks, and this value is what the caller receives unless a later validation replaces it with an error code.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4c67e3bb34"], "programs": ["lgdpol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-091", "code": "REQ-F-091", "kind": "F", "pattern": "Unwanted", "text": "If the received request length is less than the header length of 28, then the system shall end processing and return to the caller without performing request-identifier validation and without deleting anything.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ee43899b6b", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9ec9d628eb"], "programs": ["lgdpdb01", "lgdpol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-092", "code": "REQ-F-092", "kind": "F", "pattern": "Event-driven", "text": "When a request of 28 or more in length is accepted for identifier validation, the system shall replace the request identifier with its upper-case form, so that a lower-case or mixed-case identifier is matched regardless of case and the caller sees the upper-cased identifier.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7263693cd7"], "programs": ["lgdpol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-093", "code": "REQ-F-093", "kind": "F", "pattern": "Event-driven", "text": "When the upper-cased request identifier is '01DEND' (endowment), '01DMOT' (motor), '01DHOU' (house) or '01DCOM' (commercial), the system shall accept the request and proceed to delete the policy.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b0d0314ab3", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-034285f1f4", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-07a98fc9c3"], "programs": ["lgdpdb01", "lgdpol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-094", "code": "REQ-F-094", "kind": "F", "pattern": "Unwanted", "text": "If the upper-cased request identifier is not '01DEND', '01DMOT', '01DHOU' or '01DCOM', then the system shall set the return code to '99' to mark the request as unsupported.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-889524ac5d"], "programs": ["lgdpol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-095", "code": "REQ-F-095", "kind": "F", "pattern": "Event-driven", "text": "When a recognised deletion request is processed, the system shall convert the supplied customer number and policy number into the integer keys used for the policy lookup and retain both values for use in any diagnostic message.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-034285f1f4"], "programs": ["lgdpdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-096", "code": "REQ-F-096", "kind": "F", "pattern": "Event-driven", "text": "When a recognised deletion request is processed, the system shall make the full request of length 32500, including the upper-cased request identifier and the return code, available to the policy row deletion.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-141fb43e9d"], "programs": ["lgdpol01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-097", "code": "REQ-F-097", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall delete the row from the policy data store (POLICY) whose customer number matches the customer number key and whose policy number matches the policy number key, with the deletion propagated to the matching policy type record.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4a77cf174d"], "programs": ["lgdpdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-098", "code": "REQ-F-098", "kind": "F", "pattern": "Unwanted", "text": "If the deletion from the policy data store is not reported as fully successful, then the system shall record an error message identifying the operation as ' DELETE POLICY  ' together with the customer number and policy number, and return to the caller.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4a77cf174d"], "programs": ["lgdpdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-099", "code": "REQ-F-099", "kind": "F", "pattern": "Event-driven", "text": "When the policy row has been deleted from the policy data store, the system shall then pass the request data, length 32500, to the subsequent policy deletion step.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-07a98fc9c3"], "programs": ["lgdpdb01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-100", "code": "REQ-F-100", "kind": "F", "pattern": "Event-driven", "text": "When a policy delete request is received with a request identifier, customer number and policy number, the system shall build a 21-character policy key from the fourth character of the request identifier (request type), the customer number and the policy number, delete the matching record from the policy VSAM data store (KSDSPOLY), and capture the outcome of the deletion.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#14", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5e4cc35f7"], "programs": ["lgdpvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-101", "code": "REQ-F-101", "kind": "F", "pattern": "Ubiquitous", "text": "At the start of processing, the system shall treat the header entry, the low customer entry and the high customer entry of the control queue (GENACNTL) as missing until each is found.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb1d3c7b3f"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-102", "code": "REQ-F-102", "kind": "F", "pattern": "Event-driven", "text": "When the first item of the control queue is read successfully, the system shall mark the header entry as present and keep reading the subsequent control queue items one by one until no further item is returned.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb1d3c7b3f"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-103", "code": "REQ-F-103", "kind": "F", "pattern": "Unwanted", "text": "If the first item of the control queue cannot be read, then the system shall leave the header entry, the low customer entry and the high customer entry all marked missing and shall read no further items.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb1d3c7b3f"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-104", "code": "REQ-F-104", "kind": "F", "pattern": "Complex", "text": "While the control queue items are being scanned, when an item is read successfully and the first 12 characters of its text are 'LOW CUSTOMER', the system shall mark the low customer entry as present; items that do not match shall leave the low customer entry's status unchanged.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-68ad32cc24"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-105", "code": "REQ-F-105", "kind": "F", "pattern": "Complex", "text": "While the control queue items are being scanned, when an item is read successfully and the first 13 characters of its text are 'HIGH CUSTOMER', the system shall mark the high customer entry as present; items that do not match shall leave the high customer entry's status unchanged.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb781ee106"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-106", "code": "REQ-F-106", "kind": "F", "pattern": "Event-driven", "text": "When the scan is complete and the header entry is still marked missing, the system shall append the application header entry '**** GENAPP CNTL' to the control queue as a 20-character entry.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ebfe3451e6"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-107", "code": "REQ-F-107", "kind": "F", "pattern": "State-driven", "text": "While the header entry is marked present after the scan, the system shall not write a header entry to the control queue.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ebfe3451e6"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-108", "code": "REQ-F-108", "kind": "F", "pattern": "Event-driven", "text": "When the scan is complete and the low customer entry is still marked missing, the system shall append a low customer entry starting with the label 'LOW CUSTOMER=' to the control queue, written with a length of 23 characters.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a8b69f147a"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-109", "code": "REQ-F-109", "kind": "F", "pattern": "State-driven", "text": "While the low customer entry is marked present after the scan, the system shall not write a low customer entry to the control queue.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a8b69f147a"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-110", "code": "REQ-F-110", "kind": "F", "pattern": "Event-driven", "text": "When the scan is complete and the high customer entry is still marked missing, the system shall append a high customer entry starting with the label 'HIGH CUSTOMER=' to the control queue, written with a length of 24 characters.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6237953ef0"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-111", "code": "REQ-F-111", "kind": "F", "pattern": "State-driven", "text": "While the high customer entry is marked present after the scan, the system shall not write a high customer entry to the control queue.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6237953ef0"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall write each missing header, low customer and high customer entry to the control queue without waiting if storage is unavailable.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ebfe3451e6", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a8b69f147a", "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6237953ef0"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-112", "code": "REQ-F-112", "kind": "F", "pattern": "Event-driven", "text": "When the transaction starts and its starting code and invoking program name are obtained, the system shall mark the run as program-called ('C') if the starting code begins with 'D' or an invoking program name is present (not spaces).", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#16", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de589f170b"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-113", "code": "REQ-F-113", "kind": "F", "pattern": "Event-driven", "text": "When the transaction starts and its starting code does not begin with 'D' and no invoking program name is present (spaces), the system shall mark the run as terminal-started ('R').", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#16", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de589f170b"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-114", "code": "REQ-F-114", "kind": "F", "pattern": "State-driven", "text": "While the run is marked as terminal-started ('R'), the system shall clear the screen and display the high-customer message 'HIGH CUSTOMER=' to the operator, with a message length of 24, leaving the terminal ready for operator input.", "capability": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement#16", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "rules": ["ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3ed8819bee"], "programs": ["lgicvs01"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/REQ-F-115", "code": "REQ-F-115", "kind": "F", "pattern": "Event-driven", "text": "When a policy request arrives with a start code that begins with 'D' or with an invoking program name present, the system shall mark the request channel as caller-supplied ('C'), take the request data supplied by the caller as th
