 the house policy for the customer and policy number. On an unexpected retrieval failure, set the return code to '90' and record an error message", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-075", "REQ-F-081"]}, {"key": "Unassigned-Programs/id-d5dc4ddc8b", "function": "Unassigned-Programs", "id": "id-d5dc4ddc8b", "name": "Retrieve motor policy details", "text": "WHEN a motor policy inquiry is requested, THE Motor Policy Inquiry SHALL retrieve the motor policy for the customer and policy number. On an unexpected retrieval failure, set the return code to '90' and record an error message", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-082", "REQ-F-088"]}, {"key": "Unassigned-Programs/id-478532a447", "function": "Unassigned-Programs", "id": "id-478532a447", "name": "Retrieve commercial policy by customer and policy", "text": "WHEN a commercial policy inquiry by customer and policy number is requested, THE Commercial Policy Inquiry SHALL retrieve the commercial policy for the customer and policy number. On an unexpected retrieval failure, set the return code to '90' and record an error message", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-089", "REQ-F-096"]}, {"key": "Unassigned-Programs/id-c7f19b81bd", "function": "Unassigned-Programs", "id": "id-c7f19b81bd", "name": "Retrieve commercial policy by policy only", "text": "WHEN a commercial policy inquiry by policy number only is requested, THE Commercial Policy Inquiry SHALL retrieve the commercial policy and its owning customer number for the policy number. On an unexpected retrieval failure, set the return code to '90' and record an error message", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-090", "REQ-F-096"]}, {"key": "Unassigned-Programs/id-20774cce3f", "function": "Unassigned-Programs", "id": "id-20774cce3f", "name": "List customer commercial policies", "text": "WHEN a commercial policy list for a customer is requested, THE Commercial Policy List by Customer SHALL retrieve the customer's commercial policies row by row. If the retrieval cannot start, set the return code to '89', record an error and end. If it cannot finish, set the return code to '88', record an error and end (physical stores: `POLICY`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-097", "REQ-F-104", "REQ-F-105"]}, {"key": "Unassigned-Programs/id-b2ebe24f70", "function": "Unassigned-Programs", "id": "id-b2ebe24f70", "name": "Return each customer commercial row capped at 20", "text": "WHILE the customer commercial policy list is being retrieved, WHEN a commercial policy row is successfully fetched, THE Commercial Policy List by Customer SHALL convert the peril, premium and status amounts and return the customer number, policy number, common details and commercial details. Add 1 to the row count and stop the list once more than 20 rows are counted", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-098", "REQ-F-099"]}, {"key": "Unassigned-Programs/id-bf4edd1655", "function": "Unassigned-Programs", "id": "id-bf4edd1655", "name": "List commercial policies by postcode", "text": "WHEN a commercial policy list for a property postcode is requested, THE Commercial Policy List by Postcode SHALL retrieve commercial policies for the postcode row by row. If the retrieval cannot start, set the return code to '89', record an error and end. If it cannot finish, set the return code to '88', record an error and end (physical stores: `POLICY`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-101", "REQ-F-104", "REQ-F-105"]}, {"key": "Unassigned-Programs/id-8798eed1e7", "function": "Unassigned-Programs", "id": "id-8798eed1e7", "name": "Return each postcode commercial row", "text": "WHILE the postcode commercial policy list is being retrieved, WHEN a commercial policy row is successfully fetched, THE Commercial Policy List by Postcode SHALL convert the peril, premium and status amounts and return the customer number, policy number, common details and commercial details", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-102", "REQ-F-103"]}, {"key": "Unassigned-Programs/id-af52c3952d", "function": "Unassigned-Programs", "id": "id-af52c3952d", "name": "Route policy inquiry by request type", "text": "WHEN a policy inquiry arrives with request type '01IEND', '01IHOU', '01IMOT', '01ICOM', '02ICOM', '03ICOM' or '05ICOM' (case-insensitive), THE Policy Inquiry Router SHALL prepare the customer and policy lookup keys, save them for error reporting, and run the endowment, house, motor, commercial-by-customer-and-policy, commercial-by-policy, commercial-by-customer list, or commercial-by-postcode list lookup respectively", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-058", "REQ-F-059", "REQ-F-060", "REQ-F-061", "REQ-F-062", "REQ-F-065", "REQ-F-066"]}, {"key": "Unassigned-Programs/id-b664daf74a", "function": "Unassigned-Programs", "id": "id-b664daf74a", "name": "Retrieve endowment policy details", "text": "WHEN an endowment policy inquiry is processed, THE Endowment Policy Inquiry SHALL retrieve the endowment policy matching the customer and policy number, and write an error message labelled ' SELECT ENDOW ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-068", "REQ-F-074"]}, {"key": "Unassigned-Programs/id-f2de0d9f56", "function": "Unassigned-Programs", "id": "id-f2de0d9f56", "name": "Retrieve house policy details", "text": "WHEN a house policy inquiry is processed, THE House Policy Inquiry SHALL retrieve the house policy matching the customer and policy number, and write an error message labelled ' SELECT HOUSE ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-075", "REQ-F-081"]}, {"key": "Unassigned-Programs/id-79649ec3a5", "function": "Unassigned-Programs", "id": "id-79649ec3a5", "name": "Retrieve motor policy details", "text": "WHEN a motor policy inquiry is processed, THE Motor Policy Inquiry SHALL retrieve the motor policy matching the customer and policy number, and write an error message labelled ' SELECT MOTOR ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-082", "REQ-F-088"]}, {"key": "Unassigned-Programs/id-9cd8752416", "function": "Unassigned-Programs", "id": "id-9cd8752416", "name": "Retrieve commercial policy by customer and policy", "text": "WHEN a commercial policy inquiry by customer and policy number is processed, THE Commercial Policy Inquiry SHALL retrieve the commercial policy matching the customer and policy number, and write an error message labelled ' SELECT Commercial ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-089", "REQ-F-096"]}, {"key": "Unassigned-Programs/id-a9c7f39e0d", "function": "Unassigned-Programs", "id": "id-a9c7f39e0d", "name": "Retrieve commercial policy by policy number", "text": "WHEN a commercial policy inquiry by policy number only is processed, THE Commercial Policy Inquiry SHALL retrieve the commercial policy and its owning customer number by policy number, and write an error message labelled ' SELECT Commercial ' when the retrieval fails for a reason other than not found", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-090", "REQ-F-096"]}, {"key": "Unassigned-Programs/id-7006084299", "function": "Unassigned-Programs", "id": "id-7006084299", "name": "List commercial policies for a customer", "text": "WHILE a commercial list by customer is active and each fetch has succeeded so far, THE Commercial Policy Customer List SHALL retrieve the customer's commercial policies one by one, and write an error message and end the program when the list cannot be started or finished cleanly (physical stores: `POLICY`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-097", "REQ-F-105"]}, {"key": "Unassigned-Programs/id-1e770c6e54", "function": "Unassigned-Programs", "id": "id-1e770c6e54", "name": "Cap customer commercial list at twenty", "text": "WHILE the customer commercial list is being read, WHEN a commercial policy row is fetched successfully, THE Commercial Policy Customer List SHALL increase the commercial record count by 1, and force the artificial stop value 17 when the count exceeds 20 so the list stops (physical stores: `POLICY`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-9e703616e2", "function": "Unassigned-Programs", "id": "id-9e703616e2", "name": "List commercial policies by postcode", "text": "WHILE a commercial list by postcode is active and each fetch has succeeded so far, THE Commercial Policy Postcode List SHALL retrieve the commercial policies matching the requested postcode row by row, and write an error message and end the program when the list cannot be started or finished cleanly (physical stores: `POLICY`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-101", "REQ-F-105"]}, {"key": "Unassigned-Programs/id-cfbc2cd5e5", "function": "Unassigned-Programs", "id": "id-cfbc2cd5e5", "name": "Substitute COBOL library qualifier placeholders", "text": "THE Installation Profile Customization SHALL replace every occurrence of the placeholder token (`'<COBOLHLQ>'`) in the edited member with the installation's COBOL library qualifier (`COBOLHLQ`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-0d18fc6282", "function": "Unassigned-Programs", "id": "id-0d18fc6282", "name": "Replace map copybook placeholder throughout member", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder '<MAPCOPX>' in the edited member with the configured map copybook library value (`MAPCOPX`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-a061dee088", "function": "Unassigned-Programs", "id": "id-a061dee088", "name": "Replace log placeholder with configured qualifier", "text": "THE Member Log Qualifier Customization SHALL replace every occurrence of the log placeholder (`'<WSIMLOG>'`) in the edited member with the configured qualifier (`WSIMHLQ`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-35b2fbf764", "function": "Unassigned-Programs", "id": "id-35b2fbf764", "name": "Replace load library placeholder in member", "text": "WHEN the member being edited contains the load library placeholder `'<LOADX>'`, THE Environment Placeholder Tailoring SHALL replace every occurrence of the placeholder `'<LOADX>'` in the member with the environment's load library name (`LOADX`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-a60a495b84", "function": "Unassigned-Programs", "id": "id-a60a495b84", "name": "Replace placeholder with installation qualifier", "text": "THE Member Placeholder Customization SHALL replace every occurrence of the placeholder `'<PDSDBRM>'` in the edited member with the installation dataset-name qualifier (`WSIMHLQ`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-28207abe49", "function": "Unassigned-Programs", "id": "id-28207abe49", "name": "Replace wui system identifier placeholder", "text": "THE Member Customization SHALL r ualifier (`CEEHLQ`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-71e8991ac6", "function": "Unassigned-Programs", "id": "id-71e8991ac6", "name": "Process script member SSP4I1", "text": "THE Script Member Processing Run SHALL run the program (`ITPSTL`) for member `SSP4I1`, reading that member from the script library (`<WSIMWSX>`), referencing the full script library (`SYSLIB`) and the message library (`<WSIMMSX>`) under shared read access, and routing the printed listing and sequential output to the job's printed output, using a temporary work area that is not kept (physical stores: `MSGDD`, `SYSIN`)", "program": "itpstl", "disposition": "captured", "reason": "", "requirements": ["REQ-F-106", "REQ-F-107", "REQ-F-108", "REQ-F-109", "REQ-N-001"]}, {"key": "Unassigned-Programs/id-fa6db79486", "function": "Unassigned-Programs", "id": "id-fa6db79486", "name": "Process script member SSP3D1", "text": "THE Script Member Processing Run SHALL run the program `ITPSTL` for the member `SSP3D1`, which it reads from the script library (`SYSIN`, `<WSIMWSX>`); give it shared read access to the script library (`SYSLIB`) and the message library (`MSGDD`, `<WSIMMSX>`); and send its listing and sequential output (`SEQOUT`) to the job's printed output", "program": "itpstl", "disposition": "captured", "reason": "", "requirements": ["REQ-F-106", "REQ-F-107", "REQ-F-108", "REQ-N-001"]}, {"key": "Unassigned-Programs/id-04bc2b95d6", "function": "Unassigned-Programs", "id": "id-04bc2b95d6", "name": "Process script member SSP3I1", "text": "THE Script Member Processing Run SHALL run the program `ITPSTL` for script member `SSP3I1`, reading that member of the script library (`<WSIMWSX>`) as control input (`SYSIN`), the full script library (`SYSLIB`) and the message library (`<WSIMMSX>`, via `MSGDD`), all in shared mode. Write the printed report and the sequential output (`SEQOUT`) to the job's printed output, using a temporary wor
