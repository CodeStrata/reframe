ymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f13222533f", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-f13222533f", "name": "Route data access programs to data region", "text": "THE Online Region Configuration SHALL define programs `LGACDB01`, `LGACDB02`, `LGAPDB01`, `LGDPDB01`, `LGICDB01`, `LGIPDB01`, `LGUCDB01`, `LGUPDB01`, `LGACVS01`, `LGAPVS01`, `LGDPVS01`, `LGICVS01`, `LGIPVS01`, `LGUCVS01` and `LGUPVS01` in group `GENAAORP`, each routed to remote system `DOR1`", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-be6bff0a74", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-be6bff0a74", "name": "Define local data access programs in data region", "text": "THE Online Region Configuration SHALL define the fifteen data access programs locally in group `GENADORP` as COBOL, user-key programs", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-58f5073eb6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-58f5073eb6", "name": "Attach data region to the database", "text": "THE Online Region Configuration SHALL define the database connection in group `GENADORD` with thread release `No`, resync member `No`, message and statistics queue `CSMT`, task limit `400`, thread error `Abend`, accounting `Txid`, authorization `Userid`, deadlock rollback `Yes` and thread limit `250`", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4e81417e15", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4e81417e15", "name": "Bind transaction families to database plan", "text": "THE Online Region Configuration SHALL define two database entries in group `GENADORD` binding transactions `DS*` and `SS*` to plan `GENAONE`, each with accounting `Txid` and thread limit `250`", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7a90285367", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-7a90285367", "name": "Map terminal transactions to insurance programs", "text": "THE Online Region Configuration SHALL define, in group `GENATORT`, transactions `SSC1`\u2192`LGTESTC1`, `SSP1`\u2192`LGTESTP1`, `SSP2`\u2192`LGTESTP2`, `SSP3`\u2192`LGTESTP3`, `SSP4`\u2192`LGTESTP4`, `LGSE`\u2192`LGSETUP`, `LGCF`\u2192`LGICVS01` and `LGPF`\u2192`LGIPVS01`, each with task data location `Any` and task data key `User`", "program": "cdef122", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b42e5009af", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b42e5009af", "name": "Define customer file without online deletion", "text": "THE Online Region Configuration SHALL define the customer file (`KSDSCUST`) in group `GENA` with 82-byte records keyed on 10 bytes, enabled, opened on first reference, permitting add, browse, read and update and forbidding delete (`No`)", "program": "cdef122", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c04db7406a", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c04db7406a", "name": "Define policy file with full maintenance", "text": "THE Online Region Configuration SHALL define the policy file (`KSDSPOLY`) in group `GENA` with 64-byte records keyed on 21 bytes, enabled, opened on first reference, permitting add, browse, read, update and delete (`Yes`)", "program": "cdef122", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b9f312334d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b9f312334d", "name": "Start the shared queue pool program", "text": "THE Shared Queue Pool Service SHALL run the program (`DFHXQMN`) with the pool name GENA (`'POOLNAME=GENA'`), a maximum of 500 queues (`'MAXQUEUES=500'`) and 750 buffers (`'BUFFERS=750'`), with no control input and its messages written to the printed job output", "program": "samptsq", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d2276f1909", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-d2276f1909", "name": "Display high customer label message", "text": "THE Customer Range Report Display SHALL clear the user's screen, display the high customer label (`WRITE-MSG-H`, 'HIGH CUSTOMER=') as a 24-character message, and unlock the keyboard", "program": "lgsetup", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb1d3c7b3f", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-eb1d3c7b3f", "name": "Detect existing control queue", "text": "WHEN the first item of the control queue (`GENACNTL`) is read successfully, THE Control Queue Inspection SHALL mark the header entry as present (`WS-FLAG-TSQE` cleared from 'Y' to space) and keep reading the subsequent queue (`GENACNTL`) items until no further item is returned; if the first item cannot be read, leave the header, low customer and high customer entries all marked missing ('Y')", "program": "lgicvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-101", "REQ-F-102", "REQ-F-103"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-68ad32cc24", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-68ad32cc24", "name": "Recognise low customer entry", "text": "WHILE the control queue items are being scanned, WHEN an item is read successfully and its text (`READ-MSG-MSG`) starts with 'LOW CUSTOMER', THE Control Queue Inspection SHALL mark the low customer entry as present by clearing its missing-entry indicator (`WS-FLAG-TSQL`) to space", "program": "lgicvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb781ee106", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-eb781ee106", "name": "Recognise high customer entry", "text": "WHILE the control queue items are being scanned, WHEN an item is read successfully and its text (`READ-MSG-MSG`) starts with 'HIGH CUSTOMER', THE Control Queue Inspection SHALL mark the high customer entry as present by clearing its missing-entry indicator (`WS-FLAG-TSQH`) to space", "program": "lgicvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ebfe3451e6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-ebfe3451e6", "name": "Write missing header entry", "text": "WHEN the header entry indicator (`WS-FLAG-TSQE`) is 'Y', THE Control Queue Initialisation SHALL append the 20-character application header entry ('**** GENAPP CNTL') to the control queue (`GENACNTL`)", "program": "lgicvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-106", "REQ-F-107", "REQ-N-003"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a8b69f147a", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a8b69f147a", "name": "Write missing low customer entry", "text": "WHEN the low customer entry indicator (`WS-FLAG-TSQL`) is 'Y', THE Control Queue Initialisation SHALL append a 23-character low customer entry, starting with 'LOW CUSTOMER=', to the control queue (`GENACNTL`)", "program": "lgicvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-108", "REQ-F-109", "REQ-N-003"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6237953ef0", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-6237953ef0", "name": "Write missing high customer entry", "text": "WHEN the high customer entry indicator (`WS-FLAG-TSQH`) is 'Y', THE Control Queue Initialisation SHALL append a 24-character high customer entry, starting with 'HIGH CUSTOMER=', to the control queue (`GENACNTL`)", "program": "lgicvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-110", "REQ-F-111", "REQ-N-003"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-37997edfd5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-37997edfd5", "name": "Clear existing application control queue", "text": "THE Application Control Queue Setup SHALL remove all existing entries of the application control queue (`GENACNTL`) and capture the outcome in the response code (`WS-RESP`)", "program": "lgsetup", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bddf1cd148", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-bddf1cd148", "name": "Write control header and customer range entries", "text": "THE Application Control Queue Setup SHALL write to the application control queue (`GENACNTL`), in order, the 20-character control header `'**** GENAPP CNTL'`, then the 23-character entry starting `'LOW CUSTOMER='`, then the 24-character entry starting `'HIGH CUSTOMER='`, without waiting for space, and capture each outcome in the response code (`WS-RESP`)", "program": "lgsetup", "disposition": "captured", "reason": "", "requirements": ["REQ-F-124", "REQ-F-125", "REQ-F-126", "REQ-F-127", "REQ-F-128", "REQ-F-129"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55b07577dd", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-55b07577dd", "name": "Prepare the database bind session", "text": "THE Application Database Access Setup SHALL connect to the database subsystem (`<DB2SSID>`) and make the database request-module library (`<DBRMLIX>`) available for the bind commands that follow", "program": "db2bind", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f6bca54903", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-f6bca54903", "name": "Replace the eight application module packages", "text": "THE Application Database Access Setup SHALL replace the packages in collection GENASA1 for modules `LGICDB01`, `LGIPDB01`, `LGDPDB01`, `LGAPDB01`, `LGACDB01`, `LGACDB02`, `LGUCDB01` and `LGUPDB01`, each with isolation `CS`, data currency `NO`, degree `1`, dynamic rules `BIND`, action `REPLACE`, explain `NO`, owner `<SQLID>`, qualifier `<DB2DBID>`, enabled for `BATCH` and `CICS`, release `DEALLOCATE` and validate `BIND`", "program": "db2bind", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8d7e8cae82", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-8d7e8cae82", "name": "Replace the application plan", "text": "WHEN the application module packages have been bound into collection GENASA1, THE Application Database Access Setup SHALL replace plan GENAONE with package list `NULLID.*` and `*.GENASA1.*`, with data currency `NO`, isolation `CS`, action `REP`, owner `<SQLID>`, qualifier `<DB2DBID>`, release `DEALLOCATE`, acquire `USE`, `RETAIN`, `NOREOPT(VARS)` and validate `BIND`", "program": "db2bind", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c89e1afc3f", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c89e1afc3f", "name": "Grant plan execution to all users", "text": "WHEN plan GENAONE has been bound, THE Application Database Access Setup SHALL run the dynamic SQL program (`DSNTIAD`) under plan `<DB2PLAN>` from library `<DB2RUN>.RUNLIB.LOAD`, supplying statements that set the current SQL ID to `<SQLID>` and grant execute on plan GENAONE to `PUBLIC`", "program": "db2bind", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a7bea1e040", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a7bea1e040", "name": "Run the database teardown session", "text": "THE Insurance Database Teardown SHALL connect to the database subsystem (`<DB2SSID>`) and run the dynamic SQL program (`DSNTIAD`) under plan (`<DB2PLAN>`) from library (`<DB2RUN>.RUNLIB.LOAD`), feeding it the drop statements and printing its messages and output", "program": "db2del", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-0914ce542c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-0914ce542c", "name": "Release application packages and plan", "text": "THE Insurance Database Teardown SHALL free all packages of the collection (`GENASA1.*`) and the application plan (`GENAONE`)", "program": "db2del", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-99a9be16ba", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-99a9be16ba", "name": "Drop the insurance application tables", "text": "THE Insurance Database Teardown SHALL drop the tables `customer`, `customer_secure`, `policy`, `house`, `endowment`, `motor`, `commercial` and `claim` under qualifier (`<DB2DBID>`)", "program": "db2del", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-943b5df567", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-943b5df567", "name": "Drop the application tablespaces", "text": "THE Insurance Database Teardown SHALL drop tablespaces `GENATS00` through `GENATS07` under qualifier (`<DB2DBID>`) and commit the removal", "program": "db2del", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-43affa8dde", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-43affa8dde", "name": "Drop the application database", "text": "THE Insurance Database Teardown SHALL drop the application database (`<DB2DBID>`) and commit", "program": "db2del", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cf7b6bd691", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-cf7b6bd691", "name": "Drop the application storage group", "text": "THE Insurance Database Teardown SHALL drop the storage group (`GENASG02`)", "program": "db2del", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c036234804", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c036234804", "name": "Create the claim table", "text": "THE Insurance Database Provisioning SHALL run the database statement processor (`DSNTIAD`) to create the storage group (`GENASG02`), the insurance database (`<DB2DBID>`) and the tablespaces `GENATS00`, `GENATS01`, `GENATS02`, `GENATS03`, `GENATS04`, `GENATS05`, `GENATS06` and `GENATS07`, all EBCDIC-encoded; `GENATS03` uses buffer pool `BP32K` and the others use `BP1`", "program": "db2cre", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6ee0b82d3a", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-6ee0b82d3a", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Access Provisioning SHALL grant everyone (`PUBLIC`) administration authority on the insurance database (`<DB2DBID>`), use of tablespaces `GENATS01` through `GENATS07`, and all privileges on the customer, policy, motor, house, endowment, commercial and claim tables", "program": "db2cre", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-0a5ea9ab97", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-0a5ea9ab97", "name": "Create the claim table", "text": "THE Insurance Sample Data Load SHALL run the database statement processor (`DSNTIAD`) against subsystem (`<DB2SSID>`) with plan (`<DB2PLAN>`), setting the current authorization identity to (`<SQLID>`) before applying the supplied insert statements", "program": "db2cre", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-82805ba367", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-82805ba367", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the customer table (`customer`), keyed on an automatically generated customer number (`customerNumber`) that starts at `1000001` and increments by 1, and the customer security table (`customer_secure`) linked to it with cascading delete, each with a unique index on the customer number", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": ["REQ-F-027", "REQ-F-028"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-580abc24e1", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-580abc24e1", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the policy table (`policy`), keyed on an automatically generated policy number (`policyNumber`) that starts at `1000001`, linked to its customer (`customerNumber`) with cascading delete, and indexed on both the policy number and the customer number", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": ["REQ-F-029", "REQ-F-030"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-028866d25d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-028866d25d", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the endowment details table (`endowment`), keyed on and cascading-deleted with its parent policy (`policyNumber`), with a unique index on the policy number", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-918836eac5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-918836eac5", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the house details table (`house`), keyed on and cascading-deleted with its parent policy (`policyNumber`), with a unique index on the policy number", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4f48994b90", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4f48994b90", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the motor details table (`motor`), keyed on and cascading-deleted with its parent policy (`policyNumber`), with a unique index on the policy number", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-021d7c7320", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-021d7c7320", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the commercial details table (`Commercial`), keyed on and cascading-deleted with its parent policy (`PolicyNumber`), carrying a peril indicator and premium for each of fire, crime, flood and weather plus a status and rejection reason, with a unique index on the policy number", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a1b38def3e", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a1b38def3e", "name": "Create the claim table", "text": "WHEN no earlier step of the job ended with a return code above 4, THE Insurance Database Provisioning SHALL create the claim table (`Claim`), keyed on an automatically generated claim number (`ClaimNumber`) that starts at `1000001` and increments by 1, linked to its policy (`PolicyNumber`) with cascading delete, with a unique index on the claim number", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": ["REQ-F-035", "REQ-F-036"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e225eae034", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-e225eae034", "name": "Load the ten sample customer profiles", "text": "THE Insurance Sample Data Load SHALL insert customers 1 to 10 into the customer table (`<DB2DBID>.customer`) with their name, date of birth, address and contact details, using a blank (' ') for any absent house name, phone or email", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": ["REQ-F-037", "REQ-F-038"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b82442bdbd", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b82442bdbd", "name": "Create initial customer credentials", "text": "THE Insurance Sample Data Load SHALL insert a credential for each customer 1 to 10 into the secure customer table (`<DB2DBID>.customer_secure`) with password value '5732fec825535eeafb8fac50fee3a8aa', initial state (`state_indicator`) 'N' and password-change count (`pass_changes`) 0", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c04650508c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c04650508c", "name": "Register the ten sample policies", "text": "THE Insurance Sample Data Load SHALL insert policies 1 to 10 into the policy table (`<DB2DBID>.policy`) linked to their customers, with type (`policyType`) 'C', 'E', 'H' or 'M', the listed issue and expiry dates, and broker id 0, empty broker reference, payment 0 and commission 0", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": ["REQ-F-040", "REQ-F-041"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de9aa8bb49", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-de9aa8bb49", "name": "Add endowment details for policies 4 and 5", "text": "THE Insurance Sample Data Load SHALL insert endowment details for policy 5 (equities 'N', with-profits 'N', managed fund 'N', fund 'SHEPPA', term 10, sum assured 50000) and policy 4 (equities 'Y', with-profits 'Y', managed fund 'N', fund 'LIONTMR', term 5, sum assured 12500) into the endowment table (`<DB2DBID>.endowment`)", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d98e85e843", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-d98e85e843", "name": "Add house property details", "text": "THE Insurance Sample Data Load SHALL insert property details for policy 6 ('HOUSE', 5 bedrooms, value 1500000), policy 7 ('FARM', 8 bedrooms, value 3750000) and policy 8 ('FLAT', 1 bedroom, value 260000) into the house table (`<DB2DBID>.house`)", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1d505b5bde", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-1d505b5bde", "name": "Add motor vehicle details", "text": "THE Insurance Sample Data Load SHALL insert vehicle details for policies 1, 3 and 2 into the motor table (`<DB2DBID>.motor`) with the listed make, model, value, registration, colour, engine size, year of manufacture, premium (450, 2850, 700) and accidents (0, 12, 1)", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3fcf0ce472", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-3fcf0ce472", "name": "Add commercial property cover details", "text": "THE Insurance Sample Data Load SHALL insert commercial cover for policy 10 ('OFFICES', 'IBM') and policy 9 ('STADIUM', 'Burnley Football Club') into the commercial table (`<DB2DBID>.COMMERCIAL`) with the listed peril ratings and premiums, status 1 and 'ACTIVE'", "program": "db2cre", "disposition": "captured", "reason": "", "requirements": ["REQ-F-045", "REQ-F-046", "REQ-F-047"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f2e19c2cb9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-f2e19c2cb9", "name": "Run first data store preparation", "text": "THE Data Store Load SHALL run the first preparation step (`DEFINE1`), whose return code decides whether the first data load runs", "program": "adef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-84e207c5df", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-84e207c5df", "name": "Run second data store preparation", "text": "THE Data Store Load SHALL run the second preparation step (`DEFINE2`), whose return code decides whether the second data load runs", "program": "adef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a567ca7452", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a567ca7452", "name": "Load first data store from input", "text": "WHEN the first preparation step (`DEFINE1`) ended with a return code of 7 or less, or did not run, THE Data Store Load SHALL copy every record from the input data (`DDIN`) into the target store (`DDOUT`); skip the load when `DEFINE1` ended with a return code above 7", "program": "adef121", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-005"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b4b6c0c69", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4b4b6c0c69", "name": "Load second data store from input", "text": "WHEN the second preparation step (`DEFINE2`) ended with a return code of 7 or less, or did not run, THE Data Store Load SHALL copy every record from the input data (`DDIN`) into the target store (`DDOUT`); skip the load when `DEFINE2` ended with a return code above 7", "program": "adef121", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004", "REQ-F-005"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-dd45e31929", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-dd45e31929", "name": "Clear the error tracking queue", "text": "THE Environment Setup SHALL delete the error-tracking temporary queue (`GENAERRS`) named by the error-tracking queue name (`STSQ-ERRS` = `'GENAERRS'`) and record the outcome in the response code (`WS-RESP`)", "program": "lgsetup", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a449df5fea", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a449df5fea", "name": "Add event processing group to region list", "text": "THE Online Region Resource Registration SHALL run the resource definition update program (`DFHCSDUP`) against the resource definition store (`DFHCSD`), held for shared access, and add the event processing group (`GENAEVNT`) to the Terminal Owning Region group list (`TORLIST`)", "program": "cdef125", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-213f78e1f2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-213f78e1f2", "name": "Define event processing programs", "text": "THE Online Region Resource Registration SHALL define the programs `LGASTAT1` and `LGWEBST5` in the event processing group (`GENAEVNT`)", "program": "cdef125", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e8e6339238", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-e8e6339238", "name": "Define throughput transactions and their programs", "text": "THE Online Region Resource Registration SHALL define transaction `LGST` running program `LGASTAT1` and transaction `SSST` running program `LGWEBST5` in the event processing group (`GENAEVNT`)", "program": "cdef125", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5e5a767901", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-5e5a767901", "name": "Define business event bundle", "text": "THE Online Region Resource Registration SHALL define the business event bundle `GENAEV01` in the event processing group (`GENAEVNT`), deployed from the directory `/u/s8smith/genapp/genapp`", "program": "cdef125", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a16f6abbb9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a16f6abbb9", "name": "Clear prior start status queue", "text": "THE Setup Start Status Housekeeping SHALL delete the start-status queue (`GENASTRT`) named by the start status queue name (`STSQ-STRT`) and record the outcome of the deletion in the response code (`WS-RESP`)", "program": "lgsetup", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de5409bb83", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-de5409bb83", "name": "Run workload simulation for GENAPP network", "text": "THE Network Workload Simulation Run SHALL run the simulation program (`ITPENTER`) with parameter `'NTWRK=GENAPP'` for the GENAPP network. Supply the initialization definitions (`INITDD`), the concatenated message definitions (`MSGDD`) and the simulation log data set (`LOGDD`), all in shared mode. Disable automatic logging, and route dumps and printed output to the job output.", "program": "itpentr", "disposition": "captured", "reason": "", "requirements": ["REQ-F-052", "REQ-F-053", "REQ-F-054", "REQ-F-055", "REQ-F-056", "REQ-N-002"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4cfe6a3627", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4cfe6a3627", "name": "Abort when no request data received", "text": "IF the deletion request arrives with no request data (length `EIBCALEN` equal to zero), THEN THE Policy Deletion Request Intake SHALL record the error message ' NO COMMAREA RECEIVED' and terminate abnormally with abend code 'LGCA'", "program": "lgdpdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9908ac5571", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-9908ac5571", "name": "Return when request data too short", "text": "IF the request data length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN`) of 28, THEN THE Policy Deletion Request Intake SHALL end processing and return to the caller without deleting any policy", "program": "lgdpdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-270b4a5357", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-270b4a5357", "name": "Record timestamped error message", "text": "WHEN an error condition must be reported, THE Error Message Logging SHALL stamp the error message with the database result code, current date and time, and delegate it to the message-logging program (`LGSTSQ`)", "program": "lgdpdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-90c9a67eee", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-90c9a67eee", "name": "Abend when no request data received", "text": "IF the received request length (`EIBCALEN`) is zero, THEN THE Policy Deletion Request Intake SHALL terminate abnormally with abend code 'LGCA' without a dump", "program": "lgdpdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-66a9b97773", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-66a9b97773", "name": "Stop when policy row deletion fails", "text": "IF the policy row deletion outcome (`SQLCODE`) is not success (0), THEN THE Policy Row Deletion SHALL end processing and return to the caller without handing off to the downstream policy deletion program", "program": "lgdpdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-67a7ad5186", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-67a7ad5186", "name": "Return early when request is too short", "text": "IF the received request length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN`, 28), THEN THE Policy Deletion Request Intake SHALL set the return code (`CA-RETURN-CODE`) to `'00'` and return to the caller without attempting any deletion", "program": "lgdpol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5034b78d9d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-5034b78d9d", "name": "Abend when no request data received", "text": "IF the received request data length (`EIBCALEN`) is zero, THEN THE Policy Deletion Request Intake SHALL terminate abnormally with abend code `'LGCA'` without a dump, so no deletion is attempted", "program": "lgdpol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1996308bf4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-1996308bf4", "name": "Report failed policy deletion and stop", "text": "IF the policy deletion does not complete normally, THEN THE Policy Record Deletion SHALL capture the secondary response detail into `WS-RESP2`, write a diagnostic error message, and return to the caller", "program": "lgdpvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b420257b26", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b420257b26", "name": "Write timestamped deletion error message", "text": "WHEN a policy deletion failure must be reported, THE Deletion Error Logging SHALL assemble an error message with the current date and time, policy number, customer number and both response codes, and delegate it to the message-logging program (`LGSTSQ`)", "program": "lgdpvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-07a98fc9c3", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-07a98fc9c3", "name": "Delete recognised policy type and hand off", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is '01DEND', '01DHOU', '01DCOM' or '01DMOT', THE Policy Deletion Dispatcher SHALL delete the policy row and then delegate to the policy deletion program (`LGDPVS01`) with the request data, length 32500", "program": "lgdpdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-093", "REQ-F-099"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-034285f1f4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-034285f1f4", "name": "Route recognised delete request types", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is '01DEND', '01DHOU', '01DCOM' or '01DMOT', THE Policy Deletion Request Routing SHALL prepare the customer and policy number keys and perform the policy deletion", "program": "lgdpdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-093", "REQ-F-095"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4a77cf174d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4a77cf174d", "name": "Delete customer policy record", "text": "THE Policy Deletion SHALL delete the policy row from the policy store (`POLICY`) matching the customer number (`CUSTOMERNUMBER`) and policy number (`POLICYNUMBER`), and when the deletion is not successful record an error message and return to the caller", "program": "lgdpdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-097", "REQ-F-098"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ee43899b6b", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-ee43899b6b", "name": "Reject undersized deletion request", "text": "IF the received request length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN` = 28), THEN THE Policy Deletion Request Intake SHALL end processing and return to the caller without deleting anything, with the return code preset to success ('00')", "program": "lgdpdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b0d0314ab3", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b0d0314ab3", "name": "Recognise policy deletion request types", "text": "WHEN the upper-cased request identifier (`CA-REQUEST-ID`) is `'01DEND'`, `'01DMOT'`, `'01DHOU'` or `'01DCOM'`, THE Policy Deletion Request Validation SHALL accept the request and proceed to delete the policy row", "program": "lgdpol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-141fb43e9d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-141fb43e9d", "name": "Delegate policy row deletion", "text": "WHEN a recognised policy deletion request has been validated, THE Policy Deletion Delegation SHALL delegate to the database module (`LGDPDB01`) with the full 32500-byte request, including the request identifier (`CA-REQUEST-ID`), so it can delete the policy row", "program": "lgdpol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4c67e3bb34", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4c67e3bb34", "name": "Default request outcome to success", "text": "WHEN request data of non-zero length is received, THE Policy Deletion Request Validation SHALL set the return code (`CA-RETURN-CODE`) to the success value '00'", "program": "lgdpol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9ec9d628eb", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-9ec9d628eb", "name": "Reject request shorter than header", "text": "IF the request data length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN`) of 28, THEN THE Policy Deletion Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '98' and return to the caller without further processing", "program": "lgdpol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7263693cd7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-7263693cd7", "name": "Normalize request identifier to upper case", "text": "WHEN a request of sufficient length is accepted for identifier validation, THE Policy Deletion Request Validation SHALL replace the request identifier (`CA-REQUEST-ID`) with its upper-case form", "program": "lgdpol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-889524ac5d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-889524ac5d", "name": "Reject unsupported policy deletion request", "text": "IF the upper-cased request identifier (`CA-REQUEST-ID`) is not '01DEND', '01DMOT', '01DHOU' or '01DCOM', THEN THE Policy Deletion Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '99' to mark the request as unsupported", "program": "lgdpol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5e4cc35f7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b5e4cc35f7", "name": "Delete policy record by composite key", "text": "WHEN a policy delete request is received with a request identifier, customer number and policy number, THE Policy Record Deletion SHALL build the policy key from the request type (fourth character of `CA-REQUEST-ID`), the customer number (`CA-CUSTOMER-NUM`) and the policy number (`CA-POLICY-NUM`), then delete the matching record from the policy store (`KSDSPOLY`) using a 21-character key", "program": "lgdpvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b938ac6fdf", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b938ac6fdf", "name": "Abort when no request data received", "text": "IF the policy update request arrives with no request data (length (`EIBCALEN`) is zero), THEN THE Policy Update Request Intake SHALL terminate abnormally with abend code `'LGCA'` without processing the update", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-60c867d19b", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-60c867d19b", "name": "Lock and retrieve policy for update", "text": "WHEN a policy update is started for a customer number and policy number, THE Policy Record Lock and Retrieval SHALL lock and read the matching policy row from the policy store (`POLICY`); set the outcome code to '00' when the lock succeeds, or set it to '90' and return to the caller when the lock fails through deadlock, timeout or any other error", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6dff796ae5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-6dff796ae5", "name": "Report policy read failure", "text": "IF reading the policy row fails with an error other than not found, THEN THE Policy Record Lock and Retrieval SHALL set the outcome code to '90' and make no update", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-0fa4dc8a7b", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-0fa4dc8a7b", "name": "Close policy retrieval and finalize outcome", "text": "WHEN the policy update processing finishes, THE Policy Retrieval Close SHALL close the policy retrieval and set the outcome code to '00' on success, set '00' and return to the caller when the retrieval was already closed, or set '90' and return to the caller on any other failure", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbafe16a23", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-cbafe16a23", "name": "Abend when no request data received", "text": "IF the received request length (`EIBCALEN`) is zero, THEN THE Policy Update Request Intake SHALL record the error ' NO COMMAREA RECEIVED', write the error message, and terminate abnormally with abend code 'LGCA'", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4366073399", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4366073399", "name": "Prepare policy keys and start update", "text": "THE Policy Update Request Intake SHALL convert the customer number and policy number into lookup keys, record them for error reporting, and start the policy update", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d6973ec505", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-d6973ec505", "name": "Retrieve current locked policy row", "text": "THE Policy Record Retrieval SHALL retrieve the next matching policy row, including issue date, expiry date, last-changed timestamp, broker identifier and broker reference", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-858040d0ed", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-858040d0ed", "name": "Lock policy row for update", "text": "WHEN the policy update begins, THE Policy Record Locking SHALL lock the policy row matching the customer and policy number; on success set the return code to '00'; on deadlock, timeout or any other failure write an error message and return to the caller", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-dcfc682cb7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-dcfc682cb7", "name": "Handle policy retrieval failure and finish", "text": "IF the policy row retrieval fails for a reason other than not found, THEN THE Policy Record Retrieval SHALL write an error message, then release the policy lock", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c426e0d099", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c426e0d099", "name": "Release policy lock", "text": "WHEN the policy update finishes or is abandoned, THE Policy Record Locking SHALL release the policy lock; return to the caller if the lock was not held, and write an error message and return on any other failure", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-0301486b29", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-0301486b29", "name": "Write timestamped error message", "text": "WHEN an error condition is reported during the policy update, THE Error Message Logging SHALL stamp the error message with the database result code and the current date and time, and delegate it to the error-queue writer (`LGSTSQ`)", "program": "lgupdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c14625a116", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c14625a116", "name": "Abend when no request data received", "text": "IF the received request data length (`EIBCALEN`) is zero, THEN THE Policy Update Request Intake SHALL terminate abnormally with abend code `'LGCA'` without a dump", "program": "lgupol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-60f196ec40", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-60f196ec40", "name": "Retrieve policy record for update", "text": "WHEN a policy update request has been prepared, THE Policy Record Update SHALL read the policy record for update from the policy store (`KSDSPOLY`) by the policy key; if the read fails, log an error message and abend with `'LGV3'`", "program": "lgupvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5cae02ba73", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-5cae02ba73", "name": "Log policy update failure message", "text": "IF a policy read or rewrite fails, THEN THE Policy Update Error Logging SHALL build an error message with the current date, time, customer number (`CA-CUSTOMER-NUM`) and response codes, and delegate it to the error queue program (`LGSTSQ`)", "program": "lgupvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2375ff2b90", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-2375ff2b90", "name": "Read policy for update", "text": "IF the read for update of the policy record fails, THEN THE Policy Record Update SHALL set the return code (`CA-RETURN-CODE`) to '81', log the error, and abend with code 'LGV3' (physical store: `KSDSPOLY`)", "program": "lgupvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-482e398156", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-482e398156", "name": "Rewrite updated policy record", "text": "IF the rewrite of the policy record fails, THEN THE Policy Record Update SHALL set the return code (`CA-RETURN-CODE`) to '82', log the error, and abend with code 'LGV4' (physical store: `KSDSPOLY`)", "program": "lgupvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-28587dc211", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-28587dc211", "name": "Log caller request data on error", "text": "WHEN an error is logged and the caller supplied request data (`EIBCALEN` > 0), THE Error Logging SHALL copy the caller's request data, up to 90 characters, into the error message and pass it to the error-logging program (`LGSTSQ`)", "program": "lgupvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0660a473a", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a0660a473a", "name": "Derive policy type and customer key", "text": "THE Policy Update Request Preparation SHALL derive the policy type from the fourth character of the request identifier (`CA-REQUEST-ID`), place the customer number (`CA-CUSTOMER-NUM`) into the policy key, and set the read length from the incoming request length (`EIBCALEN`)", "program": "lgupvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-153", "REQ-F-154"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aaba34304c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-aaba34304c", "name": "Rewrite updated policy record", "text": "WHEN the policy record has been read for update successfully, THE Policy Record Update SHALL rewrite the updated policy record to the policy store (`KSDSPOLY`); if the rewrite fails, log an error message and abend with `'LGV4'`", "program": "lgupvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-160", "REQ-F-161"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-604b574afd", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-604b574afd", "name": "Orchestrate policy update and forward request nt/ApplicationDeploymentandPolicyLifecycleManagement/id-1019f7e991", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-1019f7e991", "name": "Reject update on timestamp mismatch", "text": "IF the caller's timestamp (`CA-LASTCHANGED`) differs from the stored policy timestamp (`DB2-LASTCHANGED`), THEN THE Policy Concurrency Check SHALL abandon the update and set the outcome code to '02'", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-139", "REQ-N-005"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-abd195d446", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-abd195d446", "name": "Report policy not found", "text": "IF no policy row matches the requested customer and policy number, THEN THE Policy Record Lock and Retrieval SHALL set the outcome code to '01' and make no update", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbd4b366b9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-cbd4b366b9", "name": "Update endowment policy details", "text": "WHEN an endowment policy update is requested, THE Endowment Policy Update SHALL update the endowment details for the policy number, set the outcome code to '01' when no endowment row exists, or set it to '90' on any other failure", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-142", "REQ-F-146"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b422878cb1", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b422878cb1", "name": "Update house policy details", "text": "WHEN a house policy update is requested, THE House Policy Update SHALL update the house details for the policy number, set the outcome code to '01' when no house row exists, or set it to '90' on any other failure", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-143", "REQ-F-145", "REQ-F-146"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-220aed7dd5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-220aed7dd5", "name": "Update motor policy details", "text": "WHEN a motor policy update is requested, THE Motor Policy Update SHALL update the motor details for the policy number, set the outcome code to '01' when no motor row exists, or set it to '90' on any other failure", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-144", "REQ-F-146"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ad7e5b07f8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-ad7e5b07f8", "name": "Abandon update after policy-type failure", "text": "IF the policy-specific update leaves the outcome code (`CA-RETURN-CODE`) other than '00', THEN THE Policy Update Control SHALL close the policy retrieval and return to the caller without updating the common policy data", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bb76c10c25", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-bb76c10c25", "name": "Verify policy timestamp matches before update", "text": "WHEN the policy row is retrieved successfully and the caller's last-changed timestamp (`CA-LASTCHANGED`) equals the stored timestamp (`DB2-LASTCHANGED`), THE Policy Concurrency Check SHALL allow the policy-type update and common policy update to proceed", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-138", "REQ-N-005"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6b02136857", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-6b02136857", "name": "Route update by policy type", "text": "WHEN the request type (`CA-REQUEST-ID`) is '01UEND', '01UHOU' or '01UMOT', THE Policy Type Update Routing SHALL run the endowment update for '01UEND', the house update for '01UHOU', and the motor update for '01UMOT'", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4229402eaa", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4229402eaa", "name": "Update common policy details and timestamp", "text": "WHEN the policy-type update succeeds, THE Policy Record Update SHALL update the issue date, expiry date, broker identifier and broker reference with a new last-changed timestamp, return the new timestamp to the caller, and write an error message if the timestamp cannot be read back (physical store: `POLICY`)", "program": "lgupdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-147", "REQ-F-149", "REQ-F-150", "REQ-F-151"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fa4e4b1654", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-fa4e4b1654", "name": "Update endowment policy details", "text": "WHEN an endowment update request ('01UEND') passes the timestamp check, THE ApplicationDeploymentandPolicyLifecycleManagement/id-59aa9ba7be", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-59aa9ba7be", "name": "Blank details for unrecognised policy type", "text": "WHEN the policy type (`WF-REQUEST-ID`) is not `'C'`, `'E'`, `'H'` or `'M'`, THE Policy Detail Mapping SHALL clear the policy details area of the record to spaces", "program": "lgupvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-be5cf0364c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-be5cf0364c", "name": "Build policy key from request", "text": "WHEN a policy update request is received from the caller, THE Policy Update Key Preparation SHALL derive the policy-type indicator (`WF-Request-ID`) from the fourth character of the request identifier (`CA-REQUEST-ID`), place the customer number (`CA-CUSTOMER-NUM`) and policy number (`CA-POLICY-NUM`) in the policy key, and take the read length from the length of the caller's data (`EIBCALEN`)", "program": "lgupvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-153", "REQ-F-154"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9fc0c7e894", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-9fc0c7e894", "name": "Validate endowment update request length", "text": "WHEN the request type (`CA-REQUEST-ID`) is `'01UEND'` (endowment update), THE Policy Update Request Validation SHALL compute the required length as header length (`WS-CA-HEADER-LEN`) plus endowment policy length (`WS-FULL-ENDOW-LEN`), and return to the caller without updating when the received length (`EIBCALEN`) is less than that requirement", "program": "lgupol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9529a4c01e", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-9529a4c01e", "name": "Validate house update request length", "text": "WHEN the request type (`CA-REQUEST-ID`) is `'01UHOU'` (house update), THE Policy Update Request Validation SHALL compute the required length as header length (`WS-CA-HEADER-LEN`) plus house policy length (`WS-FULL-HOUSE-LEN`), and return to the caller without updating when the received length (`EIBCALEN`) is less than that requirement", "program": "lgupol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f5e87a9c13", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-f5e87a9c13", "name": "Validate motor update request length", "text": "WHEN the request type (`CA-REQUEST-ID`) is `'01UMOT'` (motor update), THE Policy Update Request Validation SHALL compute the required length as header length (`WS-CA-HEADER-LEN`) plus motor policy length (`WS-FULL-MOTOR-LEN`), and return to the caller without updating when the received length (`EIBCALEN`) is less than that requirement", "program": "lgupol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-55177c3cc7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-55177c3cc7", "name": "Forward policy update to database program", "text": "THE Policy Update Request Routing SHALL initialize the return code (`CA-RETURN-CODE`) to `'00'` and delegate the policy update request to the database update program (`LGUPDB01`) with a request data length of 32500", "program": "lgupol01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-130", "REQ-F-135"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f9293c7e00", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-f9293c7e00", "name": "Flag unrecognised policy update request", "text": "IF the request type (`CA-REQUEST-ID`) is not `'01UEND'`, `'01UHOU'` or `'01UMOT'`, THEN THE Policy Update Request Validation SHALL set the return code (`CA-RETURN-CODE`) to `'99'` to mark the request as unrecognised", "program": "lgupol01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-134", "REQ-F-135"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5042f9d52", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-d5042f9d52", "name": "Validate endowment policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is an endowment request (`'01UEND'`), THE Policy Update Request Validation SHALL initialise the return code to success ('00'), compute the required length as header length plus full endowment policy length, and when the received data length is less than the required length set the return code to '98' and return to the caller", "program": "lgupol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c794c28722", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c794c28722", "name": "Validate house policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is a house request (`'01UHOU'`), THE Policy Update Request Validation SHALL compute the required length as header length plus full house policy length, and when the received data length is less than it set the return code to '98' and return to the caller", "program": "lgupol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e47bb194af", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-e47bb194af", "name": "Validate motor policy request length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is a motor request (`'01UMOT'`), THE Policy Update Request Validation SHALL compute the required length as header length plus full motor policy length, and when the received data length is less than it set the return code to '98' and return to the caller", "program": "lgupol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-db63c67362", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-db63c67362", "name": "Log policy write failure message", "text": "IF adding the policy record fails, THEN THE Policy Failure Logging SHALL build a message with the current date and time, the customer and policy numbers and the failure responses, and delegate it to the message-logging program (`LGSTSQ`)", "program": "lgapvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8525ec2278", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-8525ec2278", "name": "Abend when no request data received", "text": "IF the add-policy request arrives with a received request length (`EIBCALEN`) of zero, THEN THE Policy Add Request Intake SHALL abend the request with abend code `'LGCA'` and stop all further processing", "program": "lgapdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-21418eacb4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-21418eacb4", "name": "Abend on failed policy detail insert", "text": "IF an endowment, house, motor or commercial detail insert does not complete successfully, THEN THE Policy Detail Registration SHALL abend with abend code `'LGSQ'`, ending processing", "program": "lgapdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-37011e0d21", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-37011e0d21", "name": "Abend when no request data received", "text": "IF the policy-add request arrives with no request data (received length (`EIBCALEN`) equal to zero), THEN THE Policy Add Request Intake SHALL record the diagnostic text ' NO COMMAREA RECEIVED', log the error message, and terminate abnormally with abend code 'LGCA'", "program": "lgapdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-625eaacbac", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-625eaacbac", "name": "Log timestamped error message", "text": "WHEN an error condition is reported during policy creation, THE Error Logging SHALL stamp the error message with the current date, time and database outcome code, and pass it to the error-message service (`LGSTSQ`)", "program": "lgapdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-960d77db32", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-960d77db32", "name": "Abort when no request data received", "text": "IF the request arrives with no request data (length (`EIBCALEN`) equal to zero), THEN THE Policy Creation Request Intake SHALL terminate abnormally with abend code `'LGCA'` without processing the request", "program": "lgapdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-43d62d3b9c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-43d62d3b9c", "name": "Fail policy on master insert error", "text": "IF the master policy insert fails with an error other than a missing customer reference, THEN THE Policy Master Creation SHALL return outcome code `'90'` to the caller and stop policy creation", "program": "lgapdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7a40b9f80f", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-7a40b9f80f", "name": "Abend when no request data received", "text": "IF the received request data length (`EIBCALEN`) is zero, THEN THE Policy Insert Request Intake SHALL terminate abnormally with abend code 'LGCA' without a dump, so no further processing takes place", "program": "lgapol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []},
