"programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<DORAPPL>' in the edited member with the configured dor region application name (DORAPPL).", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-bfe61f8ba5"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<AORAPPL>' in the edited member with the configured application-owning region application name (AORAPPL).", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-e185d94e4f"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<CMASAPPL>' in the edited member with the cmas application name (CMASAPPL) obtained from the user's profile values.", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-bd70b90288"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<CMASYSID>' in the edited member with the retrieved cmas system identifier (CMASYSID).", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-1345eee06e"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<WUISYSID>' in the edited member with the configured wui system identifier (WUISYSID).", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-28207abe49"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<TORSYSID>' in the edited member with the tor system identifier (TORSYSID).", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-4f40703a28"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<DORSYSID>' in the edited member with the configured dor system identifier (DORSYSID).", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-c141bb3a5e"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<TORAPPL>' in the edited member with the configured tor region application identifier (TORAPPL).", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-d9ab051015"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<AORSYSID>' in the edited member with the application-region system identifier (AORSYSID) retrieved from the region configuration.", "capability": "Unassigned-Programs#1", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-992f126c38"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<SQLID>' in the edited member with the user's retrieved SQL authorization identifier (SQLID).", "capability": "Unassigned-Programs#2", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-583019733c"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<DB2CCSID>' in the edited member with the configured character-set identifier (DB2CCSID).", "capability": "Unassigned-Programs#2", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-60d34e16d1"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the member being edited contains the placeholder '<DB2SSID>', the system shall replace every occurrence of it with the retrieved subsystem identifier (DB2SSID).", "capability": "Unassigned-Programs#2", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-4574bba65b"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<DB2DBID>' in the edited member with the configured database id (DB2DBID).", "capability": "Unassigned-Programs#2", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-6d8b454882"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<DB2HLQ>' in the edited member with the installation's database qualifier (DB2HLQ).", "capability": "Unassigned-Programs#2", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-8a785521d4"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the member being edited contains the placeholder '<DB2RUN>', the system shall replace every occurrence of it with the configured run value (DB2RUN).", "capability": "Unassigned-Programs#2", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-8f9aeaf815"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<DB2PLAN>' in the edited member with the configured plan name (DB2PLAN).", "capability": "Unassigned-Programs#2", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-127f8727d6"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<CSDNAME>' in the edited member with the retrieved CSD name (CSDNAME).", "capability": "Unassigned-Programs#2", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-db1e65fdd4"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<CICSHLQ>' in the edited member with the configured transaction-server library prefix (CICSHLQ).", "capability": "Unassigned-Programs#3", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-282632bc53"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<CPSMHLQ>' in the edited member with the installation's management-component prefix (CPSMHLQ).", "capability": "Unassigned-Programs#3", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-01c935caf0"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall replace every occurrence of the placeholder '<CICSLI t": "When the member being edited contains the placeholder '<WSIMWSX>', the system shall replace every occurrence of it with the retrieved substitution value (WSIMWSX).", "capability": "Unassigned-Programs#5", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-80dfc9c464"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-042", "code": "REQ-F-042", "kind": "F", "pattern": "Event-driven", "text": "When the edited member name is 'ONCICS', the system shall set the backup member name to '#' followed by the member name, giving '#ONCICS'.", "capability": "Unassigned-Programs#6", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-915f014b45"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-043", "code": "REQ-F-043", "kind": "F", "pattern": "Event-driven", "text": "When the edited member name is any name other than 'ONCICS', the system shall set the backup member name to '@' followed by the member name.", "capability": "Unassigned-Programs#6", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-915f014b45"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-044", "code": "REQ-F-044", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall save all edited lines, from the first line through the last line, under the prefixed backup member name, replacing any existing member with that name.", "capability": "Unassigned-Programs#6", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-dca7892580"], "programs": ["mac1"]}, {"key": "Unassigned-Programs/REQ-F-045", "code": "REQ-F-045", "kind": "F", "pattern": "Unwanted", "text": "If the inquiry is invoked with a request data length of zero, the system shall set the error text to ' NO COMMAREA RECEIVED', record the error message, and terminate abnormally with termination code 'LGCA' without a dump.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-b0da322e79"], "programs": ["lgicus01"]}, {"key": "Unassigned-Programs/REQ-F-046", "code": "REQ-F-046", "kind": "F", "pattern": "Event-driven", "text": "When a customer inquiry request with non-empty data is received, the system shall set the return code to '00' (success) before any further checks.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-56e2932a35"], "programs": ["lgicus01"]}, {"key": "Unassigned-Programs/REQ-F-047", "code": "REQ-F-047", "kind": "F", "pattern": "Event-driven", "text": "When a customer inquiry request with non-empty data is received, the system shall set the number of policies to '00' (zero).", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-56e2932a35"], "programs": ["lgicus01"]}, {"key": "Unassigned-Programs/REQ-F-048", "code": "REQ-F-048", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall calculate the required request length as the customer data length (72) plus the header and trailer length (18), giving 90.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-f2b8db5a70", "Unassigned-Programs/id-6f157d9929", "Unassigned-Programs/id-e8f716bb54", "Unassigned-Programs/id-2f6bccf08c"], "programs": ["lgicdb01", "lgicus01"]}, {"key": "Unassigned-Programs/REQ-F-049", "code": "REQ-F-049", "kind": "F", "pattern": "Unwanted", "text": "If the received request length is less than the required request length, the system shall return control to the caller without performing the customer lookup.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-6f157d9929", "Unassigned-Programs/id-e8f716bb54", "Unassigned-Programs/id-f2b8db5a70", "Unassigned-Programs/id-2f6bccf08c"], "programs": ["lgicdb01", "lgicus01"]}, {"key": "Unassigned-Programs/REQ-F-050", "code": "REQ-F-050", "kind": "F", "pattern": "Unwanted", "text": "If the received request length is less than the required request length, the system shall set the return code to '98' (request too short).", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-f2b8db5a70", "Unassigned-Programs/id-2f6bccf08c"], "programs": ["lgicdb01", "lgicus01"]}, {"key": "Unassigned-Programs/REQ-F-051", "code": "REQ-F-051", "kind": "F", "pattern": "Event-driven", "text": "When a customer inquiry request of sufficient length is received, the system shall delegate the customer details retrieval to the customer database service, passing the full customer request with a length of 32500, and return the service's outcome to the caller through the same request.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-814bb285b1"], "programs": ["lgicus01"]}, {"key": "Unassigned-Programs/REQ-F-052", "code": "REQ-F-052", "kind": "F", "pattern": "Event-driven", "text": "When a valid customer inquiry is received, the system shall convert the requested customer number to numeric form and save it as the customer number of the error message for diagnostics.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-d1a71d53ec"], "programs": ["lgicdb01"]}, {"key": "Unassigned-Programs/REQ-F-053", "code": "REQ-F-053", "kind": "F", "pattern": "Event-driven", "text": "When a valid customer inquiry is received, the system shall read the customer data store (CUSTOMER) where the customer number equals the requested customer number and return first name, last name, date of birth, house name, house number, postcode, mobile phone, home phone and email address to the caller.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-eac8a90a4c", "Unassigned-Programs/id-d1a71d53ec", "Unassigned-Programs/id-a064b27262"], "programs": ["lgicdb01"]}, {"key": "Unassigned-Programs/REQ-F-054", "code": "REQ-F-054", "kind": "F", "pattern": "Event-driven", "text": "When the customer lookup succeeds, the system shall set the return code to '00'.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-a064b27262"], "programs": ["lgicdb01"]}, {"key": "Unassigned-Programs/REQ-F-055", "code": "REQ-F-055", "kind": "F", "pattern": "Unwanted", "text": "If the customer lookup finds no matching customer or the customer data is unavailable due to deadlock or timeout, the system shall set the return code to '01', handling both situations identically.", "capability": "Unassigned-Programs#7", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-20f2cdb30d"], "programs": ["lgicdb01"]}, {"key": "Unassigned-Programs/REQ-F-056", "code": "REQ-F-056", "kind": "F", "pattern": "Event-driven", "text": "When a policy inquiry request with caller data is received, the system shall set the return code to '00' and delegate the inquiry to the policy database module, passing the full request data with a length of 32500.", "capability": "Unassigned-Programs#8", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-ac644cb2ec"], "programs": ["lgipol01"]}, {"key": "Unassigned-Programs/REQ-F-057", "code": "REQ-F-057", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the return code to '00' at the start of every policy inquiry that arrives with caller data, to be replaced by any later outcome.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-2edfcadeea", "Unassigned-Programs/id-40f6aa6710"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-058", "code": "REQ-F-058", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use the caller's customer number and policy number as the customer and policy lookup keys, and save them as the error message customer number and policy number for error reporting.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-2edfcadeea", "Unassigned-Programs/id-40f6aa6710", "Unassigned-Programs/id-af52c3952d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-059", "code": "REQ-F-059", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall convert the caller's request identifier to upper case before matching it, so that request-type matching ignores letter case.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-2edfcadeea", "Unassigned-Programs/id-40f6aa6710", "Unassigned-Programs/id-af52c3952d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-060", "code": "REQ-F-060", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '01IEND', the system shall clear the endowment details and run the endowment policy retrieval for the requested customer and policy number.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-7c23c6b589", "Unassigned-Programs/id-40f6aa6710", "Unassigned-Programs/id-af52c3952d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-061", "code": "REQ-F-061", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '01IHOU', the system shall clear the house details and run the house policy retrieval for the requested customer and policy number.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-c10b4ece9d", "Unassigned-Programs/id-40f6aa6710", "Unassigned-Programs/id-af52c3952d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-062", "code": "REQ-F-062", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '01IMOT', the system shall clear the motor details and run the motor policy retrieval for the requested customer and policy number.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-94586119b4", "Unassigned-Programs/id-40f6aa6710", "Unassigned-Programs/id-af52c3952d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-063", "code": "REQ-F-063", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '01ICOM', the system shall clear the commercial details and run the commercial policy retrieval keyed by both customer number and policy number.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-5721816171", "Unassigned-Programs/id-40f6aa6710"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-064", "code": "REQ-F-064", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '02ICOM', the system shall clear the commercial details and run the commercial policy retrieval keyed by policy number only.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-cec9dfb0e5", "Unassigned-Programs/id-40f6aa6710"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-065", "code": "REQ-F-065", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '03ICOM', the system shall clear the commercial details and run the multi-record commercial policy retrieval for the requested customer number.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-ca0ce009fb", "Unassigned-Programs/id-40f6aa6710", "Unassigned-Programs/id-af52c3952d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-066", "code": "REQ-F-066", "kind": "F", "pattern": "Event-driven", "text": "When the request identifier is '05ICOM', the system shall clear the commercial details and run the commercial policy postcode search using the caller-supplied postcode.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-4bc8fb45ff", "Unassigned-Programs/id-40f6aa6710", "Unassigned-Programs/id-af52c3952d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-067", "code": "REQ-F-067", "kind": "F", "pattern": "Unwanted", "text": "If the request identifier is not '01IEND', '01IHOU', '01IMOT', '01ICOM', '02ICOM', '03ICOM' or '05ICOM', the system shall set the return code to '99' without performing any lookup.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-f71b6c2400"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-068", "code": "REQ-F-068", "kind": "F", "pattern": "Event-driven", "text": "When an endowment policy inquiry is processed, the system shall set the request label to ' SELECT ENDOW ' and read the policy data store (POLICY) joined to the endowment policy data store (ENDOWMENT) on policy number, filtered by customer number and policy number, returning issue date; expiry date; last-changed timestamp; broker id; broker's reference; payment; with-profits, equities and managed-fund indicators; fund name; term; sum assured; life assured; padding data and its length.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-c0623ab740", "Unassigned-Programs/id-feb729923d", "Unassigned-Programs/id-b664daf74a"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-069", "code": "REQ-F-069", "kind": "F", "pattern": "Event-driven", "text": "When the endowment policy is found, the system shall compute the required response size as the header/trailer length (33) plus the full endowment length (124), plus the padding length when the padding length is present, and advance the end-of-policy position (starting at 1) by the padding length.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-c0623ab740"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-070", "code": "REQ-F-070", "kind": "F", "pattern": "Unwanted", "text": "If the caller's data area length is less than the required endowment response size, the system shall set the return code to '98' and return to the caller without the policy details.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-8196757e72"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-071", "code": "REQ-F-071", "kind": "F", "pattern": "Event-driven", "text": "When the caller's data area is at least the required endowment response size, the system shall return the common policy data and the 52-character fixed endowment data, always converting term and sum assured, and including broker id, payment and padding data (for its retrieved length) only when each is present.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-492732d9fa"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-072", "code": "REQ-F-072", "kind": "F", "pattern": "Event-driven", "text": "When an endowment policy has been found and returned to the caller, the system shall write the end-of-data marker 'FINAL' at the end-of-policy position of the endowment padding output.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-6250252dde"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-073", "code": "REQ-F-073", "kind": "F", "pattern": "Unwanted", "text": "If the endowment policy lookup finds no matching policy, the system shall set the return code to '01'.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-9115193d51"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-074", "code": "REQ-F-074", "kind": "F", "pattern": "Unwanted", "text": "If the endowment policy lookup fails for any reason other than found or not found, the system shall set the return code to '90' and write a diagnostic error message labelled ' SELECT ENDOW '.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-9115193d51", "Unassigned-Programs/id-feb729923d", "Unassigned-Programs/id-b664daf74a"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-075", "code": "REQ-F-075", "kind": "F", "pattern": "Event-driven", "text": "When a house policy inquiry is processed, the system shall set the request label to ' SELECT HOUSE ' and read the policy data store joined to the house policy data store (HOUSE) on policy number, filtered by customer number and policy number, returning issue date; expiry date; last-changed timestamp; broker id; broker's reference; payment; property type; bedrooms; value; house name; house number; postcode.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-00e4b3d42b", "Unassigned-Programs/id-3f04c3def3", "Unassigned-Programs/id-f2de0d9f56"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-076", "code": "REQ-F-076", "kind": "F", "pattern": "Event-driven", "text": "When the house policy is found, the system shall compute the required reply length as the header/trailer length (33) plus the full house policy length (130).", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-00e4b3d42b"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-077", "code": "REQ-F-077", "kind": "F", "pattern": "Unwanted", "text": "If the caller's supplied area is smaller than the required house reply length, the system shall set the return code to '98' and return to the caller without returning policy data.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-60a831eb6f"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-078", "code": "REQ-F-078", "kind": "F", "pattern": "Event-driven", "text": "When the house policy is found and the caller's area is at least the required reply length, the system shall return the common policy data and the house details for the house length (58), converting bedroom count and property value, and including broker id and payment only when they are not null.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-bf7790c453"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-079", "code": "REQ-F-079", "kind": "F", "pattern": "Event-driven", "text": "When house policy data has been returned to the caller, the system shall write the end-of-data marker 'FINAL' at the start of the free space after the house data.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-bf7790c453"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-080", "code": "REQ-F-080", "kind": "F", "pattern": "Unwanted", "text": "If the house policy lookup finds no matching policy, the system shall set the return code to '01'.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-c5d31c3084"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-081", "code": "REQ-F-081", "kind": "F", "pattern": "Unwanted", "text": "If the house policy lookup fails for any reason other than found or not found, the system shall set the return code to '90' and write a diagnostic error message labelled ' SELECT HOUSE '.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-c5d31c3084", "Unassigned-Programs/id-3f04c3def3", "Unassigned-Programs/id-f2de0d9f56"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-082", "code": "REQ-F-082", "kind": "F", "pattern": "Event-driven", "text": "When a motor policy inquiry is processed, the system shall set the request label to ' SELECT MOTOR ' and read the policy data store joined to the motor policy data store (MOTOR) on policy number, filtered by customer number and policy number, returning issue date; expiry date; last-changed timestamp; broker id; broker's reference; payment; make; model; value; registration number; colour; engine capacity; year of manufacture; premium; accidents.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-47613b8d34", "Unassigned-Programs/id-d5dc4ddc8b", "Unassigned-Programs/id-79649ec3a5"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-083", "code": "REQ-F-083", "kind": "F", "pattern": "Event-driven", "text": "When the motor policy is found, the system shall compute the required reply size as the header/trailer length (33) plus the full motor policy length (137).", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-47613b8d34"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-084", "code": "REQ-F-084", "kind": "F", "pattern": "Unwanted", "text": "If the caller's area length is less than the required motor reply size, the system shall set the return code to '98' and return to the caller without returning policy data.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-58a673c160"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-085", "code": "REQ-F-085", "kind": "F", "pattern": "Event-driven", "text": "When a motor policy was found and the caller's area is at least the required reply size, the system shall return the common policy data, the 65-byte motor details, the premium and the accident count, converting engine capacity, vehicle value, premium and accident count to fixed-length numbers, and copying broker id and payment only when they are not null.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-5d2631b693"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-086", "code": "REQ-F-086", "kind": "F", "pattern": "Event-driven", "text": "When motor policy data has been returned to the caller, the system shall write the end-of-data marker 'FINAL' into the first five positions of the free space after the motor data.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-34226ecf3e"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-087", "code": "REQ-F-087", "kind": "F", "pattern": "Unwanted", "text": "If the motor policy lookup finds no matching policy, the system shall set the return code to '01'.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-8794b0be6b"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-088", "code": "REQ-F-088", "kind": "F", "pattern": "Unwanted", "text": "If the motor policy lookup fails for any reason other than found or not found, the system shall set the return code to '90' and write a diagnostic error message labelled ' SELECT MOTOR '.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-8794b0be6b", "Unassigned-Programs/id-d5dc4ddc8b", "Unassigned-Programs/id-79649ec3a5"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-089", "code": "REQ-F-089", "kind": "F", "pattern": "Event-driven", "text": "When a commercial policy inquiry by customer and policy number ('01ICOM') is processed, the system shall set the request label to ' SELECT Commercial ' and read the policy data store joined to the commercial policy data store (COMMERCIAL) on policy number, filtered by customer number and policy number, returning request date as last-changed, start date as issue date, renewal date as expiry date, address, postcode, latitude, longitude, customer, property type, fire, crime, flood and weather peril and premium values, status and rejection reason.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-7dfb8c9816", "Unassigned-Programs/id-478532a447", "Unassigned-Programs/id-9cd8752416"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-090", "code": "REQ-F-090", "kind": "F", "pattern": "Event-driven", "text": "When a commercial policy inquiry by policy number only ('02ICOM') is processed, the system shall set the request label to ' SELECT Commercial ' and read the policy data store joined to the commercial policy data store filtered by policy number only, returning the owning customer number into the customer lookup key together with the same dates, address, location, peril, premium, status and rejection reason columns.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-377231795a", "Unassigned-Programs/id-c7f19b81bd", "Unassigned-Programs/id-a9c7f39e0d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-091", "code": "REQ-F-091", "kind": "F", "pattern": "Event-driven", "text": "When a commercial policy is found for request '01ICOM' or '02ICOM', the system shall compute the required size as the header/trailer length (33) plus the full commercial length (1174).", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-377231795a"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-092", "code": "REQ-F-092", "kind": "F", "pattern": "Unwanted", "text": "If the caller's area is smaller than the required commercial size, the system shall set the return code to '98' and return immediately to the caller.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-377231795a"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-093", "code": "REQ-F-093", "kind": "F", "pattern": "Event-driven", "text": "When a commercial policy is found for request '01ICOM' and the caller's area is large enough, the system shall convert peril, premium and status values, return the common policy data and the commercial details (1102 bytes), and write 'FINAL' in the space after the data.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-7dfb8c9816"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-094", "code": "REQ-F-094", "kind": "F", "pattern": "Event-driven", "text": "When a commercial policy is found for request '02ICOM' and the caller's area is large enough, the system shall return the found customer number to the caller, convert peril, premium and status values, return the common policy data and the commercial details, and write 'FINAL' in the space after the data.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-377231795a"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-095", "code": "REQ-F-095", "kind": "F", "pattern": "Unwanted", "text": "If the commercial lookup by customer and policy number or by policy number only finds no matching policy, the system shall set the return code to '01'.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-68a992d3c2", "Unassigned-Programs/id-9bf145d9c9"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-096", "code": "REQ-F-096", "kind": "F", "pattern": "Unwanted", "text": "If the commercial lookup by customer and policy number or by policy number only fails for any reason other than found or not found, the system shall set the return code to '90' and write a diagnostic error message labelled ' SELECT Commercial '.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-68a992d3c2", "Unassigned-Programs/id-9bf145d9c9", "Unassigned-Programs/id-478532a447", "Unassigned-Programs/id-c7f19b81bd", "Unassigned-Programs/id-9cd8752416", "Unassigned-Programs/id-a9c7f39e0d"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-097", "code": "REQ-F-097", "kind": "F", "pattern": "Event-driven", "text": "When a commercial policy list for a customer ('03ICOM') is requested, the system shall set the request label to ' SELECT Commercial ', reset the commercial record count to 0, and retrieve row by row the policies joined with commercial details filtered by customer number, returning customer number, policy number, dates, address, postcode, location, customer, property type, peril and premium values, status and rejection reason.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-20774cce3f", "Unassigned-Programs/id-7006084299", "Unassigned-Programs/id-66f6a7f6d0"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-098", "code": "REQ-F-098", "kind": "F", "pattern": "Complex", "text": "While the customer commercial policy list is being retrieved, when a commercial policy row is successfully fetched, the system shall convert the peril, premium and status amounts and return the customer number, policy number, common policy details and commercial details up to the commercial record length (1102), each row overwriting the previous one.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-b2ebe24f70"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-099", "code": "REQ-F-099", "kind": "F", "pattern": "Complex", "text": "While the customer commercial policy list is being retrieved, when a commercial policy row is successfully fetched, the system shall increase the commercial record count by 1 and, when the count exceeds 20, force the retrieval outcome to the stop value 17 so the list ends.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-b2ebe24f70", "Unassigned-Programs/id-1e770c6e54"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-100", "code": "REQ-F-100", "kind": "F", "pattern": "State-driven", "text": "While rows remain for the customer's commercial policies, the system shall continue fetching rows while each fetch succeeds, stopping at end of data, on an error, or when the 20-row cap is reached.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-66f6a7f6d0"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-101", "code": "REQ-F-101", "kind": "F", "pattern": "Event-driven", "text": "When a commercial policy list for a property postcode ('05ICOM') is requested, the system shall set the request label to ' SELECT Commercial ' and retrieve row by row the policies joined with commercial details filtered by postcode equal to the caller's search postcode, returning customer number, policy number, dates, address, postcode, location, customer, property type, peril and premium values, status and rejection reason.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-bf4edd1655", "Unassigned-Programs/id-9e703616e2", "Unassigned-Programs/id-deda89344b"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-102", "code": "REQ-F-102", "kind": "F", "pattern": "Complex", "text": "While the postcode commercial policy list is being retrieved, when a commercial policy row is successfully fetched, the system shall convert the peril, premium and status amounts and return the customer number, policy number, common policy details and commercial details up to the commercial record length, each row overwriting the previous one.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-8798eed1e7", "Unassigned-Programs/id-deda89344b"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-103", "code": "REQ-F-103", "kind": "F", "pattern": "State-driven", "text": "While rows remain for commercial policies at the requested postcode, the system shall continue fetching rows while each fetch succeeds, applying no row limit.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-8798eed1e7"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-104", "code": "REQ-F-104", "kind": "F", "pattern": "Unwanted", "text": "If the retrieval of a customer commercial list or a postcode commercial list cannot be started, the system shall set the return code to '89', write an error message and end the program.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-20774cce3f", "Unassigned-Programs/id-bf4edd1655"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-105", "code": "REQ-F-105", "kind": "F", "pattern": "Unwanted", "text": "If the retrieval of a customer commercial list or a postcode commercial list cannot be finished cleanly, the system shall set the return code to '88', write an error message and end the program.", "capability": "Unassigned-Programs#9", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-20774cce3f", "Unassigned-Programs/id-bf4edd1655", "Unassigned-Programs/id-7006084299", "Unassigned-Programs/id-9e703616e2"], "programs": ["lgipdb01"]}, {"key": "Unassigned-Programs/REQ-F-106", "code": "REQ-F-106", "kind": "F", "pattern": "Event-driven", "text": "When a script member processing job runs, the system shall run the script processing program once for the member named by that job (one of WSC1A1; WSC1I1; SSC1I1; SSC1A1; #SSVARS; STOP; SSP1I1; SSP1A1; SSP1D1; SSP1U1; SSP2I1; SSP2A1; SSP2D1; SSP2U1; SSP3I1; SSP3A1; SSP3D1; SSP4I1; SSP4A1; SSP4D1), with no condition gating the step.", "capability": "Unassigned-Programs#10", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-311bbac9af", "Unassigned-Programs/id-bdf3a1b769", "Unassigned-Programs/id-1d7aa2cf0f", "Unassigned-Programs/id-347a5f9ccd", "Unassigned-Programs/id-8c03623fa1", "Unassigned-Programs/id-d5b6800145", "Unassigned-Programs/id-154c4fc9a6", "Unassigned-Programs/id-dcc500dc69", "Unassigned-Programs/id-2e3d10e40b", "Unassigned-Programs/id-e48e8f3bea", "Unassigned-Programs/id-6cd98fe8c3", "Unassigned-Programs/id-74616d0b36", "Unassigned-Programs/id-fc1b9b016e", "Unassigned-Programs/id-04bc2b95d6", "Unassigned-Programs/id-7178b11155", "Unassigned-Programs/id-fa6db79486", "Unassigned-Programs/id-71e8991ac6", "Unassigned-Programs/id-3f6d5bf7e2", "Unassigned-Programs/id-42adec0b69"], "programs": ["itpstl"]}, {"key": "Unassigned-Programs/REQ-F-107", "code": "REQ-F-107", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall supply the named member of the workload script library file (<WSIMWSX>) as the control input file (SYSIN), the whole workload script library file as the reference library, and the workload simulator message file (<WSIMMSX>) as the message source.", "capability": "Unassigned-Programs#10", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-311bbac9af", "Unassigned-Programs/id-bdf3a1b769", "Unassigned-Programs/id-1d7aa2cf0f", "Unassigned-Programs/id-347a5f9ccd", "Unassigned-Programs/id-8c03623fa1", "Unassigned-Programs/id-72cc3177a5", "Unassigned-Programs/id-d5b6800145", "Unassigned-Programs/id-154c4fc9a6", "Unassigned-Programs/id-dcc500dc69", "Unassigned-Programs/id-2e3d10e40b", "Unassigned-Programs/id-e48e8f3bea", "Unassigned-Programs/id-6cd98fe8c3", "Unassigned-Programs/id-74616d0b36", "Unassigned-Programs/id-fc1b9b016e", "Unassigned-Programs/id-04bc2b95d6", "Unassigned-Programs/id-7178b11155", "Unassigned-Programs/id-fa6db79486", "Unassigned-Programs/id-71e8991ac6", "Unassigned-Programs/id-3f6d5bf7e2", "Unassigned-Programs/id-42adec0b69"], "programs": ["itpstl"]}, {"key": "Unassigned-Programs/REQ-F-108", "code": "REQ-F-108", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send the script processing program's printed listing and its sequential output to the job's printed output rather than to a kept dataset.", "capability": "Unassigned-Programs#10", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-bdf3a1b769", "Unassigned-Programs/id-1d7aa2cf0f", "Unassigned-Programs/id-347a5f9ccd", "Unassigned-Programs/id-8c03623fa1", "Unassigned-Programs/id-d5b6800145", "Unassigned-Programs/id-154c4fc9a6", "Unassigned-Programs/id-dcc500dc69", "Unassigned-Programs/id-2e3d10e40b", "Unassigned-Programs/id-e48e8f3bea", "Unassigned-Programs/id-6cd98fe8c3", "Unassigned-Programs/id-74616d0b36", "Unassigned-Programs/id-fc1b9b016e", "Unassigned-Programs/id-7178b11155", "Unassigned-Programs/id-fa6db79486", "Unassigned-Programs/id-71e8991ac6", "Unassigned-Programs/id-3f6d5bf7e2", "Unassigned-Programs/id-42adec0b69"], "programs": ["itpstl"]}, {"key": "Unassigned-Programs/REQ-F-109", "code": "REQ-F-109", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall provide a temporary work area for the duration of the run and shall not retain it after the step.", "capability": "Unassigned-Programs#10", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-311bbac9af", "Unassigned-Programs/id-1d7aa2cf0f", "Unassigned-Programs/id-6cd98fe8c3", "Unassigned-Programs/id-71e8991ac6", "Unassigned-Programs/id-3f6d5bf7e2", "Unassigned-Programs/id-42adec0b69"], "programs": ["itpstl"]}, {"key": "Unassigned-Programs/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall open the workload script member, the workload script library file and the workload simulator message file for shared read access so that other jobs can read them concurrently, and shall not change any of them.", "capability": "Unassigned-Programs#10", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-311bbac9af", "Unassigned-Programs/id-bdf3a1b769", "Unassigned-Programs/id-1d7aa2cf0f", "Unassigned-Programs/id-347a5f9ccd", "Unassigned-Programs/id-8c03623fa1", "Unassigned-Programs/id-72cc3177a5", "Unassigned-Programs/id-d5b6800145", "Unassigned-Programs/id-dcc500dc69", "Unassigned-Programs/id-2e3d10e40b", "Unassigned-Programs/id-e48e8f3bea", "Unassigned-Programs/id-6cd98fe8c3", "Unassigned-Programs/id-74616d0b36", "Unassigned-Programs/id-fc1b9b016e", "Unassigned-Programs/id-04bc2b95d6", "Unassigned-Programs/id-7178b11155", "Unassigned-Programs/id-fa6db79486", "Unassigned-Programs/id-71e8991ac6", "Unassigned-Programs/id-3f6d5bf7e2", "Unassigned-Programs/id-42adec0b69"], "programs": ["itpstl"]}, {"key": "Unassigned-Programs/REQ-F-110", "code": "REQ-F-110", "kind": "F", "pattern": "Event-driven", "text": "When the simulator log listing job runs, the system shall run the log-list program over the workload simulator log file (<WSIMLGX>) with the control options 'CNSL' (console entries), 'FMTSNA' (SNA formatting), 'DSPLY' (display entries), 'DATA' (record data), 'RUN' (start the run) and 'END' (end of input), and send the resulting listing to the print output.", "capability": "Unassigned-Programs#11", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-d3608be146"], "programs": ["itpll"]}, {"key": "Unassigned-Programs/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall read the workload simulator log file in shared read mode so that other users can still read it, leaving it unchanged.", "capability": "Unassigned-Programs#11", "function": "Unassigned-Programs", "rules": ["Unassigned-Programs/id-d3608be146"], "programs": ["itpll"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall generate a provider web service for the customer add program, using COBOL request and response structures read from member `SOAIC01` in the application source library file (`<SOURCEX>`).", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84"], "programs": ["wsaac01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use the member `SOAIC01` as both the request structure and the response structure for the generated web service.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84"], "programs": ["wsaac01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall expose the generated web service at the relative URI `GENAPP/LGACUS01`, with data passed to the provider program through its communication area.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84"], "programs": ["wsaac01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the web service binding file and the service description document under the directory `<ZFSHOME>/genapp/wsdir/LGACUS01`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84"], "programs": ["wsaac01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the generation log to `<ZFSHOME>/genapp/logs/LS2WS_LGACUS01.LOG`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84"], "programs": ["wsaac01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall run the web service generation with the Java runtime directory `java601_bit64_ga/J6.0.1_64`, the installation directory `cics660`, an empty path prefix, the temporary directory `/tmp` and the temporary file name `LS2WS`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84"], "programs": ["wsaac01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall run the web service generation using the HTTP proxy `PROXY.HURSLEY.IBM.COM:80`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#1", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-0721910d84"], "programs": ["wsaac01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall generate the Commercial Policy add web service for the add-policy program written in language `COBOL`, using member `SOAIPB1` from the application source library file as both the request structure and the response structure, with the invocation address `GENAPP/LGAPOLB1` and the data-passing mechanism `COMMAREA`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-e3ca9c3d19"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the Commercial Policy add web service binding and service description to the genapp web service directory under `<ZFSHOME>/genapp/wsdir/LGAPOLB1...`, and write its generation log to `<ZFSHOME>/genapp/logs/LS2WS_LGAPOLB1.LOG`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-e3ca9c3d19"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall run the Commercial Policy add web service generation with the Java directory `'java601_bit64_ga/J6.0.1_64'`, the assistant directory `'cics660'`, an empty path prefix, the temporary directory `'/tmp'`, the temporary file prefix `'LS2WS'` and the HTTP proxy `PROXY.HURSLEY.IBM.COM:80`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-e3ca9c3d19"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall generate the Endowment Policy add web service that exposes the add-policy program at the address `GENAPP/LGAPOLE1`, using member `SOAIPE1` from the application source library file as both the request layout and the response layout, written in `COBOL`, with a `COMMAREA` program interface.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-82bf62367f"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the Endowment Policy add web service binding file and service description under `<ZFSHOME>/genapp/wsdir/`, and write its generation log to `<ZFSHOME>/genapp/logs/LS2WS_LGAPOLE1.LOG`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-82bf62367f"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall reach the network through the HTTP proxy `PROXY.HURSLEY.IBM.COM:80` when generating the Endowment Policy add web service.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-82bf62367f"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall generate the House Policy add web service for the add-policy program, using member `SOAIPH1` from the application source library file as both the request structure and the response structure, in language `COBOL`, with a `COMMAREA` program interface, at the address `GENAPP/LGAPOLH1`, through the HTTP proxy `PROXY.HURSLEY.IBM.COM:80`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-3d3d6279c1"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write the House Policy add web service binding and service description under `<ZFSHOME>/genapp/wsdir/` with prefix `LGAPOLH1`, and write its generation log to `<ZFSHOME>/genapp/logs/LS2WS_LGAPOLH1.LOG`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-3d3d6279c1"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall run the House Policy add web service generation with the Java runtime `'java601_bit64_ga/J6.0.1_64'`, the CICS directory `'cics660'`, path prefix `''`, temporary directory `'/tmp'` and work-file prefix `'LS2WS'`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#2", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-3d3d6279c1"], "programs": ["wsaap01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall generate the Motor Policy add web service for the add-policy program with language `COBOL`, using copybook member `SOAIPM1` from the application source lib vice generation run to `<ZFSHOME>/genapp/logs/LS2WS_LGICVS01.LOG`.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#7", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-f5c3dbd5c6"], "programs": ["wsavc01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-063", "code": "REQ-F-063", "kind": "F", "pattern": "Event-driven", "text": "When the web service publication job executes, the system shall generate a web service definition exposing the program LGIPVS01, using the COBOL request structure member SOAVPII and the COBOL response structure member SOAVPIO, both read from the source library, publishing the service at the relative address GENAPP/LGIPVS01 with the program receiving its data through a communication area, and producing a service binding file, a WSDL document, and a generation log for LGIPVS01, using the HTTP proxy PROXY.HURSLEY.IBM.COM:80.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#8", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38"], "programs": ["wsavp01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-064", "code": "REQ-F-064", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall publish the generated web service at the relative address `GENAPP/LGIPVS01`, with the target service program receiving its data through the communication-area program interface.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#8", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38"], "programs": ["wsavp01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-065", "code": "REQ-F-065", "kind": "F", "pattern": "Event-driven", "text": "When the web service definition that exposes the program LGIPVS01 to service callers is generated, the system shall write the generated service binding file to <ZFSHOME>/genapp/wsdir/LGIPVS01.WebServiceGenerationInput.ws_bind.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#8", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38"], "programs": ["wsavp01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-066", "code": "REQ-F-066", "kind": "F", "pattern": "Event-driven", "text": "When the web service definition is generated, the system shall write the WSDL document to <ZFSHOME>/genapp/wsdir/LGIPVS01.WebServiceGenerationInput.wsdl.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#8", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38"], "programs": ["wsavp01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-067", "code": "REQ-F-067", "kind": "F", "pattern": "Event-driven", "text": "When the web service publication job executes, the system shall write a generation log to <ZFSHOME>/genapp/logs/LS2WS_LGIPVS01.LOG.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#8", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38"], "programs": ["wsavp01"]}, {"key": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/REQ-F-068", "code": "REQ-F-068", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall use the HTTP proxy `PROXY.HURSLEY.IBM.COM:80` during web service generation.", "capability": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration#8", "function": "WebServiceInterfaceGeneration/WebServiceInterfaceGeneration", "rules": ["WebServiceInterfaceGeneration/WebServiceInterfaceGeneration/id-bc305a2e38"], "programs": ["wsavp01"]}], "rules": [{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-77c1f27b3e", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-77c1f27b3e", "name": "End startup when no event data supplied", "text": "IF the startup event data cannot be retrieved and the input data length (`EIBCALEN`) is zero, THEN THE Application Startup Control SHALL end processing immediately and return to the caller without recording any startup information", "program": "lgastat1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5214150e1", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-d5214150e1", "name": "Record first application start date and time", "text": "WHEN the startup record store (`GENASTRT`) does not exist yet when it is read, THE Application Startup Recording SHALL capture the current date (DDMMYYYY) and time and write them as the startup record to the startup record store (`GENASTRT`); leave the existing record untouched when the store already exists", "program": "lgastat1", "disposition": "captured", "reason": "", "requirements": ["REQ-F-087", "REQ-F-088", "REQ-F-089"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bf664535f3", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-bf664535f3", "name": "Start the GENA counter pool server", "text": "THE Named Counter Pool Service SHALL run the named counter server (`DFHNCMN`) for the counter pool named by parameter `'POOLNAME=GENA'`, send its listing to the job's print output, and supply no control statements", "program": "sampncs", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1154495b25", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-1154495b25", "name": "Run region definition update against shared store", "text": "THE Online Region Definition Maintenance SHALL run the region-definition program (`DFHCSDUP`) against the shared system definition store (`DFHCSD`), supplying the inline definition commands and producing a printed listing", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-46bbe2fcd2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-46bbe2fcd2", "name": "Detach application groups from region startup lists", "text": "THE Online Region Definition Maintenance SHALL remove groups `GENATORT`, `GENATORP` and `GENA` from list `TORLIST`; remove `GENAAORP` and `GENA` from list `AORLIST`; remove `GENADORP`, `GENADORD` and `GENA` from list `DORLIST`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a26b57f079", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a26b57f079", "name": "Delete existing application definition groups", "text": "THE Online Region Definition Maintenance SHALL delete groups `GENATORT`, `GENATORP`, `GENAAORP`, `GENADORP`, `GENADORD` and `GENA` together with all of their definitions", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e76024bad2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-e76024bad2", "name": "Attach application groups to region startup lists", "text": "THE Online Region Definition Maintenance SHALL add groups `GENATORT`, `GENATORP` and `GENA` to list `TORLIST`; add `GENAAORP` and `GENA` to list `AORLIST`; add `GENADORP`, `GENADORT`, `GENADORD` and `GENA` to list `DORLIST`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-0893ee8aa3", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-0893ee8aa3", "name": "Define front-end menus and remote inquiry programs", "text": "THE Insurance Front-End Program Setup SHALL define the local menu programs `LGTESTC1`, `LGTESTP1`, `LGTESTP2`, `LGTESTP3`, `LGTESTP4` and `SSMAP`; define `LGICVS01` as dynamically routed under transaction `VSCI` and `LGIPVS01` as dynamically routed under transaction `VSPI`, all in group `GENATORP`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-aa0a8c2770", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-aa0a8c2770", "name": "Route customer and policy services to application region", "text": "THE Insurance Service Request Routing SHALL define `LGACUS01`, `LGAPOL01`, `LGAPBR01`, `LGDPOL01`, `LGICUS01`, `LGIPOL01`, `LGUCUS01` and `LGUPOL01` as dynamically routed COBOL programs in group `GENATORP`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c860cd1f17", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c860cd1f17", "name": "Define setup and message logging programs", "text": "THE Online Region Definition Maintenance SHALL define program `LGSETUP` in group `GENATORP` and program `LGSTSQ` in the shared group `GENA`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-13e387dadd", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-13e387dadd", "name": "Define local customer and policy services", "text": "THE Insurance Service Program Setup SHALL define `LGACUS01`, `LGAPOL01`, `LGAPBR01`, `LGDPOL01`, `LGICUS01`, `LGIPOL01`, `LGUCUS01` and `LGUPOL01` as local COBOL programs in group `GENAAORP`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-35ae1683ae", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-35ae1683ae", "name": "Route data access programs to data region", "text": "THE Insurance Data Access Routing SHALL define the data access programs as dynamically routed in group `GENAAORP` with these transactions: `LGACDB01`/`LGACDB02` `DSCA`, `LGAPDB01` `DSPA`, `LGDPDB01` `DSPD`, `LGICDB01` `DSCI`, `LGIPDB01` `DSPI`, `LGUCDB01` `DSCI`, `LGUPDB01` `DSPI`, `LGACVS01` `VSCA`, `LGAPVS01` `VSPA`, `LGDPVS01` `VSPD`, `LGICVS01` `VSCI`, `LGIPVS01` `VSPI`, `LGUCVS01` `VSC1`, `LGUPVS01` `VSP1`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d08075320c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-d08075320c", "name": "Define data region mirror transactions", "text": "THE Insurance Data Access Routing SHALL define transactions `DSCA`, `DSCI`, `DSC1`, `DSPA`, `DSPD`, `DSPI`, `DSPU`, `DSP1`, `VSCA`, `VSCI`, `VSC1`, `VSPA`, `VSPD`, `VSPI` and `VSP1` in group `GENADORT`, each running program `DFHMIRS` with profile `DFHCICSA`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3bf5968abb", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-3bf5968abb", "name": "Define data region access programs locally", "text": "THE Insurance Data Access Program Setup SHALL define the fifteen data access programs (`LGACDB01` through `LGUPVS01`) as local COBOL programs in group `GENADORP`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ff8511b573", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-ff8511b573", "name": "Configure database attachment for data region", "text": "THE Insurance Database Attachment Setup SHALL define the database connection (TCB limit `400`, thread limit `250`, abend on thread error, deadlock rollback, user-ID authorization, messages and statistics to `CSMT`) and two entries using plan `GENAONE` with thread limit `250` for transactions `DS*` and `SS*`, all in group `GENADORD`", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-db0b0e49fe", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-db0b0e49fe", "name": "Define application resource serialization model", "text": "THE Online Region Definition Maintenance SHALL define enqueue model `GENAMOD` with scope `GENA` for resource name `GENACNTL` in group `GENA`; the temporary storage model is left undefined", "program": "cdef123", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6c1d358017", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-6c1d358017", "name": "Map front-end transaction codes to programs", "text": "THE Insurance Front-End Transaction Routing SHALL define the following transactions in group `GENATORT`: `SSC1` runs `LGTESTC1`, `SSP1` runs `LGTESTP1`, `SSP2` runs `LGTESTP2`, `SSP3` runs `LGTESTP3`, `SSP4` runs `LGTESTP4`, `LGSE` runs `LGSETUP`, `LGCF` runs `LGICVS01` and `LGPF` runs `LGIPVS01`", "program": "cdef123", "disposition": "captured", "reason": "", "requirements": ["REQ-F-020", "REQ-F-021"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4604039ebf", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4604039ebf", "name": "Define customer file with deletion prohibited", "text": "THE Customer File Access Policy SHALL define the customer file (`KSDSCUST`) with 82-byte records and a 10-byte key, enabled and opened on first reference, permitting add, browse, read and update and prohibiting delete (`Delete(No)`)", "program": "cdef123", "disposition": "captured", "reason": "", "requirements": ["REQ-F-022", "REQ-F-023", "REQ-F-024"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-36f59cf45b", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-36f59cf45b", "name": "Define policy file with full maintenance", "text": "THE Policy File Access Policy SHALL define the policy file (`KSDSPOLY`) with 64-byte records and a 21-byte key, enabled and opened on first reference, permitting add, browse, read, update and delete (`Delete(Yes)`)", "program": "cdef123", "disposition": "captured", "reason": "", "requirements": ["REQ-F-025", "REQ-F-026"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f96b30329f", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-f96b30329f", "name": "Run the online definition repository update", "text": "THE Online Region Configuration SHALL run the definition update program (`DFHCSDUP`) against the shared online system definition repository (`DFHCSD`), applying the supplied definition commands and printing a listing of the results", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8ee8a97fc3", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-8ee8a97fc3", "name": "Keep prior group removal and deletion disabled", "text": "THE Online Region Configuration SHALL retain the removal of groups `GENATORT`, `GENATORP`, `GENAAORP`, `GENADORP`, `GENADORD` and `GENA` from lists `TORLIST`, `AORLIST` and `DORLIST`, and the deletion of those groups, only as inactive commented-out commands", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3e1d34ea42", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-3e1d34ea42", "name": "Register application groups in region startup lists", "text": "THE Online Region Configuration SHALL add groups `GENATORT`, `GENATORP` and `GENA` to `TORLIST`; add `GENAAORP` and `GENA` to `AORLIST`; and add `GENADORP`, `GENADORD` and `GENA` to `DORLIST`", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d06b9057d5", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-d06b9057d5", "name": "Route terminal-side lookups to data region", "text": "THE Online Region Configuration SHALL define programs `LGICVS01` and `LGIPVS01` in group `GENATORP` as COBOL, user-key programs routed to remote system `DOR1`", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7f9191af09", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-7f9191af09", "name": "Define local terminal menu programs", "text": "THE Online Region Configuration SHALL define programs `LGTESTC1`, `LGTESTP1`, `LGTESTP2`, `LGTESTP3`, `LGTESTP4` and `SSMAP` in group `GENATORP` as local COBOL, user-key programs", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-411c50e9ac", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-411c50e9ac", "name": "Route business services to application region", "text": "THE Online Region Configuration SHALL define programs `LGACUS01`, `LGAPOL01`, `LGAPBR01`, `LGDPOL01`, `LGICUS01`, `LGIPOL01`, `LGUCUS01` and `LGUPOL01` in group `GENATORP`, each routed to remote system `AOR1`", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ce0bb39c25", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-ce0bb39c25", "name": "Define setup and message output programs", "text": "THE Online Region Configuration SHALL define program `LGSETUP` in group `GENATORP`, and program `LGSTSQ` in shared group `GENA`, as COBOL, user-key programs", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-617feed06e", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-617feed06e", "name": "Define local business programs in application region", "text": "THE Online Region Configuration SHALL define programs `LGACUS01`, `LGAPOL01`, `LGAPBR01`, `LGDPOL01`, `LGICUS01`, `LGIPOL01`, `LGUCUS01` and `LGUPOL01` locally in group `GENAAORP`", "program": "cdef122", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeplo
