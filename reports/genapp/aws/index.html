rogram": "lgwebst5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-013"]}, {"key": "No domain/TransactionStatisticsandMonitoring/id-1fba5c87ee", "function": "No domain/TransactionStatisticsandMonitoring", "id": "id-1fba5c87ee", "name": "Publish transaction type totals", "text": "THE Transaction Statistics Collection SHALL store the success total under 'X00V', the inquiry total under 'X01V', the add total under 'X02V', the update total under 'X03V' and the delete total under 'X04V', each with its new value, previous value and change", "program": "lgwebst5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013"]}, {"key": "No domain/TransactionStatisticsandMonitoring/id-38b99a6f52", "function": "No domain/TransactionStatisticsandMonitoring", "id": "id-38b99a6f52", "name": "Compute elapsed interval since last run", "text": "THE Statistics Interval Timing SHALL retrieve the previous run time from the '000V' statistics queue (`WS-TSQname`), defaulting it to '120000' if none is available. Replace the stored time with the current time, and store the elapsed seconds, calculated as (current hours\u00d73600 + minutes\u00d760 + seconds) minus the same for the previous time", "program": "lgwebst5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004"]}, {"key": "No domain/TransactionStatisticsandMonitoring/id-dc7efe58f6", "function": "No domain/TransactionStatisticsandMonitoring", "id": "id-dc7efe58f6", "name": "Store statistic with previous value and change", "text": "THE Statistic Value Store SHALL retrieve the previous value from the statistic's queue (`WS-TSQname`), then replace the queue contents with the new value, the previous value and the change (new minus previous)", "program": "lgwebst5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014"]}, {"key": "Unassigned-Programs/id-114a9a53b9", "function": "Unassigned-Programs", "id": "id-114a9a53b9", "name": "Abend when no request data received", "text": "IF the inquiry is invoked with a received request length (`EIBCALEN`) of zero, THEN THE Customer Inquiry Request Intake SHALL terminate abnormally with abend code `'LGCA'` without a dump and perform no further processing", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-1d60483380", "function": "Unassigned-Programs", "id": "id-1d60483380", "name": "Report unexpected customer lookup error", "text": "IF the customer lookup ends with any error other than not found or deadlock/timeout, THEN THE Customer Details Retrieval SHALL set the outcome code (`CA-RETURN-CODE`) to `'90'` and return to the caller", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-41fe73e5b7", "function": "Unassigned-Programs", "id": "id-41fe73e5b7", "name": "Abend when no request data received", "text": "IF the received request length (`EIBCALEN`) is zero, THEN THE Customer Inquiry Request Validation SHALL record an error message and terminate abnormally with abend code `'LGCA'`", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-4e5e00343a", "function": "Unassigned-Programs", "id": "id-4e5e00343a", "name": "Flag unexpected customer retrieval failure", "text": "IF the customer read ends with an outcome other than success, not found, or deadlock/timeout, THEN THE Customer Details Retrieval SHALL set the return code (`CA-RETURN-CODE`) to `'90'`, record an error message, and return to the caller", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-ac3977ad95", "function": "Unassigned-Programs", "id": "id-ac3977ad95", "name": "Log request data to error queue", "text": "WHEN an error message is to be recorded and the received request length (`EIBCALEN`) is greater than zero and not less than 91, THE Error Message Logging SHALL copy the first 90 bytes of the request into the error message payload (`CA-DATA`) and delegate to the error-queue writer (`LGSTSQ`) with the error message", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-0b8a8d239c", "function": "Unassigned-Programs", "id": "id-0b8a8d239c", "name": "Record error message with request data", "text": "WHEN an error message is recorded and the received request length (`EIBCALEN`) is greater than 0 and less than 91, THE Error Message Logging SHALL copy the received request data into the error message payload (`CA-DATA`) and delegate to the error-queue writer (`LGSTSQ`) with the error message (`CA-ERROR-MSG`)", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-23c7378fb0", "function": "Unassigned-Programs", "id": "id-23c7378fb0", "name": "Abend when no request data received", "text": "IF the request data length (`EIBCALEN`) received is zero, THEN THE Customer Inquiry Request Validation SHALL record the error text ' NO COMMAREA RECEIVED' in the error message, write the error message, and terminate abnormally with abend code 'LGCA'", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-adb904d9b3", "function": "Unassigned-Programs", "id": "id-adb904d9b3", "name": "Reject request shorter than minimum length", "text": "IF the received request length (`EIBCALEN`) is less than the customer record length (`WS-CUSTOMER-LEN`) plus the header and trailer length (`WS-CA-HEADERTRAILER-LEN`), THEN THE Customer Inquiry Request Validation SHALL return to the caller without retrieving customer details", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-ef2f9793ee", "function": "Unassigned-Programs", "id": "id-ef2f9793ee", "name": "Log unexpected customer lookup failure", "text": "IF the customer lookup ends in an unexpected database outcome (not success, not found, or deadlock/timeout), THEN THE Customer Details Inquiry SHALL write an error message containing the database return code and return to the caller", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-4ccff1979a", "function": "Unassigned-Programs", "id": "id-4ccff1979a", "name": "Write timestamped diagnostic error message", "text": "WHEN an error condition in the customer inquiry must be reported, THE Customer Inquiry Error Logging SHALL stamp the error message with the current date, time and database return code, and delegate to the error queue writer (`LGSTSQ`) with the message", "program": "lgicdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-875c2f31d7", "function": "Unassigned-Programs", "id": "id-875c2f31d7", "name": "Define the web interface repository store", "text": "THE Web Interface Repository Provisioning SHALL create the keyed repository store (`<USRHLQ>.<WUIAPPL>.EYUWREP`) with a data component (`<USRHLQ>.<WUIAPPL>.EYUWREP.DATA`) and an index component (`<USRHLQ>.<WUIAPPL>.EYUWREP.INDEX`), keyed on a 20-byte key at offset 20 and holding spanned variable-length records averaging 8192 and up to 32000 bytes, shared under share option `2` (one updater, concurrent readers)", "program": "defwrep", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-bc53d7eb26", "function": "Unassigned-Programs", "id": "id-bc53d7eb26", "name": "Remove the existing interface repository", "text": "THE Web User Interface Repository Reset SHALL delete the web user interface repository (`<USRHLQ>.<WUIAPPL>.EYUWREP`), whose name is formed from the user high-level qualifier (`USRHLQ`) and the application name (`WUIAPPL`), so that no prior copy of the repository remains", "program": "defwrep", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-cfc5b24375", "function": "Unassigned-Programs", "id": "id-cfc5b24375", "name": "Retrieve shared substitution values", "text": "THE Template Substitution Setup SHALL retrieve the shared session values `WSIMLGX`, the substitution value (`WSIMWSX`), `WSIMMSX` and the home path (`ZFSHOME`) before any placeholder is replaced", "program": "mac1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-571e988abf", "function": "Unassigned-Programs", "id": "id-571e988abf", "name": "Capture edited member name", "text": "THE Edited Member Backup SHALL obtain the name of the member being edited and keep it as the member name (`memnme`) for deriving the backup copy name", "program": "mac1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-524ea83c73", "function": "Unassigned-Programs", "id": "id-524ea83c73", "name": "Retrieve region configuration values", "text": "THE Member Customisation Setup SHALL obtain the cmas application name (`CMASAPPL`), cmas system identifier (`CMASYSID`), wui application name (`WUIAPPL`), wui system identifier (`WUISYSID`) and wsim dataset qualifier (`WSIMHLQ`) from the user's shared profile values", "program": "mac1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-041517825d", "function": "Unassigned-Programs", "id": "id-041517825d", "name": "Retrieve installation prefix settings", "text": "THE Installation Prefix Customization SHALL retrieve the transaction-server prefix (`CICSHLQ`), management-component prefix (`CPSMHLQ`), licence setting (`CICSLIC`), user prefix (`USRHLQ`), compiler prefix (`COBOLHLQ`), database prefix (`DB2HLQ`) and runtime prefix (`CEEHLQ`) from the shared settings pool", "program": "mac1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-3b1414e91a", "function": "Unassigned-Programs", "id": "id-3b1414e91a", "name": "Retrieve region configuration identifiers", "text": "THE Region Configuration Retrieval SHALL retrieve the tor, aor and dor region application identifiers (`TORAPPL`, `AORAPPL`, `DORAPPL`) and the system identifiers (`TORSYSID`, `AORSYSID`, `DORSYSID`) from the shared configuration variables", "program": "mac1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-1313f75d90", "function": "Unassigned-Programs", "id": "id-1313f75d90", "name": "Retrieve environment dataset and library settings", "text": "THE Environment Settings Retrieval SHALL retrieve the stored environment settings: the customer dataset name (`KSDSCUS`), policy dataset name (`KSDSPOL`), source library (`SOURCEX`), load library (`LOADX`), map copybook library (`MAPCOPX`) and database request module library (`DBRMLIX`)", "program": "mac1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-133085660d", "function": "Unassigned-Programs", "id": "id-133085660d", "name": "Retrieve site environment settings", "text": "THE Member Placeholder Substitution SHALL retrieve the site settings CSD name (`CSDNAME`), DB2 run setting (`DB2RUN`), SQL identifier (`SQLID`), DB2 subsystem id (`DB2SSID`), DB2 database id (`DB2DBID`), DB2 CCSID (`DB2CCSID`) and DB2 plan (`DB2PLAN`) from the stored profile values", "program": "mac1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-28aaa367f0", "function": "Unassigned-Programs", "id": "id-28aaa367f0", "name": "Record caller data in error message", "text": "WHEN an error message is recorded and the caller data length (`EIBCALEN`) is 91 or more, THE Error Message Logging SHALL copy the first 90 characters of the caller's data into the error message data content (`CA-DATA`) after the 'COMMAREA=' prefix and pass the error message (`CA-ERROR-MSG`) to the message queue writer (`LGSTSQ`)", "program": "lgipol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-b89ddb1cf1", "function": "Unassigned-Programs", "id": "id-b89ddb1cf1", "name": "Reject inquiry with no request data", "text": "IF the policy inquiry is invoked with a request data length (`EIBCALEN`) of zero, THEN THE Policy Inquiry Request Guard SHALL record an error message and abnormally terminate the transaction with abend code 'LGCA' without a dump", "program": "lgipol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-097215f255", "function": "Unassigned-Programs", "id": "id-097215f255", "name": "Record error message with request data", "text": "WHEN an error message is recorded and the request data length (`EIBCALEN`) is greater than 0 and less than 91, THE Error Message Recording SHALL copy the full received request data into the data portion (`CA-DATA`) of the 'COMMAREA='-prefixed error message (`CA-ERROR-MSG`) and delegate to the message-queue writer (`LGSTSQ`) to record it", "program": "lgipol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-fcdeaa121c", "function": "Unassigned-Programs", "id": "id-fcdeaa121c", "name": "Reject request without caller data", "text": "IF a policy inquiry request arrives with a received data length (`EIBCALEN`) of zero, THEN THE Policy Inquiry Entry SHALL terminate the request abnormally with abend code 'LGCA' without a dump", "program": "lgipol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-5c61d332df", "function": "Unassigned-Programs", "id": "id-5c61d332df", "name": "Reject request lacking input data", "text": "IF the caller supplies no request data (received data length `EIBCALEN` is zero), THEN THE Policy Inquiry Request Validation SHALL record the error text ' NO COMMAREA RECEIVED' in the error message, write the error message to the error log, and abnormally end the transaction with abend code 'LGCA'", "program": "lgipol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-5a22f947e6", "function": "Unassigned-Programs", "id": "id-5a22f947e6", "name": "Log timestamped error message", "text": "WHEN an error condition requires an error message to be recorded, THE Error Message Logging SHALL stamp the error message with the current date and time and delegate it to the error-logging program (`LGSTSQ`) for writing to the queues", "program": "lgipol01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-3e35476f83", "function": "Unassigned-Programs", "id": "id-3e35476f83", "name": "Abort inquiry when no request data received", "text": "IF the caller passes no request data (length `EIBCALEN` is zero), THEN THE Policy Inquiry Entry Check SHALL abnormally terminate the inquiry with abend code `'LGCA'` without a dump", "program": "lgipdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-7e49ea233f", "function": "Unassigned-Programs", "id": "id-7e49ea233f", "name": "Handle customer scan start or finish failure", "text": "IF the customer commercial-policy scan fails to start or fails to finish, THEN THE Commercial Policy Customer Scan SHALL return code `'89'` on start failure or `'88'` on finish failure and end the inquiry (physical stores: `COMMERCIAL`, `POLICY`)", "program": "lgipdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-788e28bb3e", "function": "Unassigned-Programs", "id": "id-788e28bb3e", "name": "Handle postcode scan start or finish failure", "text": "IF the postcode commercial-policy scan fails to start or fails to finish, THEN THE Commercial Policy Postcode Scan SHALL return code `'89'` on start failure or `'88'` on finish failure and end the inquiry (physical stores: `COMMERCIAL`, `POLICY`)", "program": "lgipdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-0bc668b54d", "function": "Unassigned-Programs", "id": "id-0bc668b54d", "name": "Reject inquiry with no request data", "text": "IF the caller supplies no request data (received data length `EIBCALEN` is zero), THEN THE Policy Inquiry Request Intake SHALL record the error text ' NO COMMAREA RECEIVED' in the error message, write the error message, and abnormally terminate with abend code 'LGCA'", "program": "lgipdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-c0ab577a42", "function": "Unassigned-Programs", "id": "id-c0ab577a42", "name": "Write timestamped diagnostic error message", "text": "THE Inquiry Error Reporting SHALL stamp the error message with the database result and the current date and time, and delegate to the error-queue writer (`LGSTSQ`) with the full error message", "program": "lgipdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-6f26801b34", "function": "Unassigned-Programs", "id": "id-6f26801b34", "name": "Abend when no request data received", "text": "IF the inquiry is started with no request data (request data length `EIBCALEN` equals zero), THEN THE Policy Inquiry Entry SHALL run the error-message routine and abnormally end the transaction with abend code 'LGCA'", "program": "lgipdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-b5f8ec9858", "function": "Unassigned-Programs", "id": "id-b5f8ec9858", "name": "Record error message with request data", "text": "WHEN an inquiry error must be recorded, THE Inquiry Error Logging SHALL copy the request data (all of it if shorter than 91 bytes, otherwise the first 90 bytes) into the error message data and hand the message to the error-message service (`LGSTSQ`), provided request data was received", "program": "lgipdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-17f682555b", "function": "Unassigned-Programs", "id": "id-17f682555b", "name": "Register the input control data set", "text": "WHEN the control data set access process starts, THE Control Data Set Access SHALL register the input control data set (`PDSMEMIN`) 'userid.GENAPP.CNTL' under data identifier `IN`, and end the process returning the result value (`RC`) as the exit value when registration does not succeed (result not 0)", "program": "cust1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-255475d4d4", "function": "Unassigned-Programs", "id": "id-255475d4d4", "name": "Open the input control data set", "text": "WHEN the input control data set has been registered successfully, THE Control Data Set Access SHALL open the registered input control data set `IN`, and end the process returning the result value (`RC`) as the exit value when the open does not succeed (result not 0)", "program": "cust1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-6bdee67719", "function": "Unassigned-Programs", "id": "id-6bdee67719", "name": "Close the input control data set", "text": "WHEN the input control data set has been opened successfully, THE Control Data Set Access SHALL close the input control data set `IN`, and end the process returning the result value (`RC`) as the exit value when the close does not succeed (result not 0)", "program": "cust1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-6060753a76", "function": "Unassigned-Programs", "id": "id-6060753a76", "name": "Release the input control data set", "text": "WHEN the input control data set has been closed successfully, THE Control Data Set Access SHALL release the registration of the input control data set `IN`, and end the process returning the result value (`RC`) as the exit value when the release does not succeed (result not 0)", "program": "cust1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-513436df1f", "function": "Unassigned-Programs", "id": "id-513436df1f", "name": "Withdraw the application command library", "text": "WHEN the input control data set has been released successfully, THE Session Environment Cleanup SHALL deactivate the application-level command library for the session", "program": "cust1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-4c3e75738a", "function": "Unassigned-Programs", "id": "id-4c3e75738a", "name": "Derive shared data set naming prefix", "text": "THE Application Data Set Naming SHALL set the control library name (`PDSMEMIN`) to `'userid.GENAPP.CNTL'` and derive the shared naming prefix (`PDSHLQ`) as the part of that name before the suffix `'.CNTL'`", "program": "cust1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-b11cdf090f", "function": "Unassigned-Programs", "id": "id-b11cdf090f", "name": "Activate application script library", "text": "THE Application Script Library Activation SHALL build the script library name (`PDSEXEC`) as the shared naming prefix (`PDSHLQ`) followed by `'.EXEC'`, and activate that library as the application script library", "program": "cust1", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-93bb15e4d2", "function": "Unassigned-Programs", "id": "id-93bb15e4d2", "name": "Process the online CICS simulation script member", "text": "THE Simulation Script Preparation SHALL run the program (`ITPSTL`) against script member `#ONCICS` of the shared script library (`<WSIMWSX>`), also using that library as its source library and the shared message library (`<WSIMMSX>`), and write the step's listing and sequential output to printed output (physical stores: `MSGDD`, `SYSIN`, `SYSLIB`)", "program": "itpstl", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-4574057246", "function": "Unassigned-Programs", "id": "id-4574057246", "name": "Process the SSP3U1 script member", "text": "THE Script Member Processing Run SHALL run the program `ITPSTL` on member `SSP3U1` from the shared source library (`<WSIMWSX>`), resolving included members from the same library and messages from the message library (`<WSIMMSX>`), and write the listing and sequential output to the job's printed output, with all libraries opened for shared access (physical stores: `MSGDD`, `SYSIN`, `SYSLIB`)", "program": "itpstl", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-3078a41ac1", "function": "Unassigned-Programs", "id": "id-3078a41ac1", "name": "Assemble physical map deck", "text": "WHEN the temporary map source (`&&TEMPM`) has been staged, THE Screen Map Build SHALL run the assembler (`ASMA90`) with parameter 'SYSPARM(MAP),DECK,NOOBJECT' over the temporary map source (`&&TEMPM`), using macros from `<CICSHLQ>.SDFHMAC`, `<SOURCEX>`, `SYS1.MODGEN` and `SYS1.MACLIB`, writing a new temporary assembled map deck (`&&MAP`) that is passed to the link-edit step (physical stores: `SYSIN`, `SYSLIB`, `SYSPUNCH`)", "program": "asmmap", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-099519937c", "function": "Unassigned-Programs", "id": "id-099519937c", "name": "Install map into load library", "text": "WHEN the map assembly step (`ASMMAP`) ended with return code 7 or lower, THE Screen Map Build SHALL run the linkage editor (`IEWL`) with parameter 'LIST,LET,XREF' over the assembled map deck (`&&MAP`), storing member `SSMAP` in the load library (`<LOADX>`), and delete the temporary assembled deck; skip installation when the assembly ended above return code 7 (physical stores: `SYSLIN`, `SYSLMOD`)", "program": "asmmap", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-f8b8438141", "function": "Unassigned-Programs", "id": "id-f8b8438141", "name": "Stage map source for assembly", "text": "THE Screen Map Build SHALL copy the screen map source member (`SSMAP`) from the source library (`<SOURCEX>`) into a new temporary map source (`&&TEMPM`) of fixed-length 80-byte records, and pass it to the assembly step (physical stores: `SYSUT1`, `SYSUT2`)", "program": "asmmap", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-19a76aca21", "function": "Unassigned-Programs", "id": "id-19a76aca21", "name": "Generate symbolic map description", "text": "THE Screen Map Build SHALL run the assembler (`ASMA90`) with parameter 'SYSPARM(DSECT),DECK,NOOBJECT' against the temporary map copy (`&&TEMPM`), using the CICS macro library (`<CICSHLQ>.SDFHMAC`), the source library (`<SOURCEX>`), SYS1.MODGEN and SYS1.MACLIB; write the deck to the map copy member (`<MAPCOPX>(SSMAP)`), produce no object module, and delete the temporary map copy at step end (physical stores: `SYSIN`, `SYSLIB`, `SYSPUNCH`)", "program": "asmmap", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-1eb4da924a", "function": "Unassigned-Programs", "id": "id-1eb4da924a", "name": "Record timestamped error message", "text": "THE Error Message Logging SHALL stamp the error message with the current date (`EM-DATE`) and time (`EM-TIME`) and delegate it, with program identifier ' LGICUS01' and its variable text, to the message-logging program (`LGSTSQ`) for recording", "program": "lgicus01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-0334906aad", "function": "Unassigned-Programs", "id": "id-0334906aad", "name": "Send caller data to error queue", "text": "WHEN an error message is written and the caller data length (`EIBCALEN`) is greater than 0 and less than 91, THE Error Message Logging SHALL copy that many bytes of the caller's data into the error message data (`CA-DATA`) after the prefix (`'COMMAREA='`) and delegate to the message-queue writer (`LGSTSQ`) with the full error message", "program": "lgicus01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-06b9e98d1c", "function": "Unassigned-Programs", "id": "id-06b9e98d1c", "name": "Abend when no request received", "text": "IF the received request length (`EIBCALEN`) is zero, THEN THE Customer Inquiry Request Intake SHALL terminate abnormally with abend code `'LGCA'` and perform no further processing", "program": "lgicus01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-d24b6aa705", "function": "Unassigned-Programs", "id": "id-d24b6aa705", "name": "Abend when caller data is missing", "text": "IF the customer inquiry is invoked with a caller data length (`EIBCALEN`) of zero, THEN THE Customer Inquiry Entry Validation SHALL record an error message and then terminate abnormally with abend code (`'LGCA'`) and no dump", "program": "lgicus01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-fdcf2e45a4", "function": "Unassigned-Programs", "id": "id-fdcf2e45a4", "name": "Forward request data excerpt to error queue", "text": "WHEN the request data length (`EIBCALEN`) is greater than 0 and not less than 91, THE Error Message Logging SHALL copy the first 90 bytes of the request data into the error message data after the 'COMMAREA=' prefix, and delegate to the message-queue writer (`LGSTSQ`) to record the error message", "program": "lgicus01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-f6decae6e6", "function": "Unassigned-Programs", "id": "id-f6decae6e6", "name": "Build the remaining insurance program members", "text": "THE Insurance Application Program Build SHALL run the build procedure for each member `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01`, `LGDPVS01`, `LGICDB01`, `LGICUS01`, `LGICVS01`, `LGIPDB01`, `LGIPOL01`, `LGIPVS01` and `LGSETUP`, ending with the link-edit (`HEWL`) (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-ce4cda8ca8", "function": "Unassigned-Programs", "id": "id-ce4cda8ca8", "name": "Build every insurance application program", "text": "THE Application Program Build SHALL run the compile, stub-copy and link-edit build once for each program, in this order: `'LGACDB01'`, `'LGACDB02'`, `'LGACUS01'`, `'LGACVS01'`, `'LGAPDB01'`, `'LGAPOL01'`, `'LGAPVS01'`, `'LGASTAT1'`, `'LGDPDB01'`, `'LGDPOL01'`, `'LGDPVS01'`, `'LGICDB01'`, `'LGICUS01'`, `'LGICVS01'`, `'LGIPDB01'`, `'LGIPOL01'`, `'LGIPVS01'`, `'LGSETUP'`, `'LGSTSQ'`, `'LGTESTC1'` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-c82a9aaacd", "function": "Unassigned-Programs", "id": "id-c82a9aaacd", "name": "Build each insurance application program member", "text": "THE Insurance Application Program Build SHALL run the compile-and-link build procedure once for each member `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01`, `LGDPVS01`, `LGICDB01`, `LGICUS01`, `LGICVS01`, `LGIPDB01`, `LGIPOL01`, `LGIPVS01`, `LGSETUP`, `LGSTSQ`, `LGTESTC1`, `LGTESTP1`, `LGTESTP2`, `LGTESTP3`, `LGTESTP4`, `LGUCDB01`, `LGUCUS01`, `LGUCVS01`, `LGUPDB01`, `LGUPOL01`, `LGUPVS01` and `LGWEBST5`, passing each member name as the build parameter (`MEM`) (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-5d62799db0", "function": "Unassigned-Programs", "id": "id-5d62799db0", "name": "Build each insurance application program", "text": "THE Application Program Build SHALL run the shared build procedure for each source member in turn (LGACDB01, LGACDB02, LGACUS01, LGACVS01, LGAPDB01, LGAPOL01, LGAPVS01, LGASTAT1, LGDPDB01, LGDPOL01, LGDPVS01, LGICDB01, LGICUS01, LGICVS01, LGIPDB01, LGIPOL01, LGIPVS01, LGSETUP, LGSTSQ), producing an executable for each (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-6b25667b78", "function": "Unassigned-Programs", "id": "id-6b25667b78", "name": "Compile the program source with database bindings", "text": "THE Program Build Pipeline SHALL compile the program source member `LGACDB01` from the source library (`<SOURCEX>(&MEM)`) with parameter `'OPTFILE'`, resolving copy members from the CICS, DB2, map copy (`<MAPCOPX>`) and source libraries. Write the database request module to `<DBRMLIX>(&MEM)` and the object deck to a new temporary object module (`&&LOADSET`) that is passed to later steps. (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-610bee5e60", "function": "Unassigned-Programs", "id": "id-610bee5e60", "name": "Apply CICS reentrant static-call compile options", "text": "THE Program Build Pipeline SHALL compile the program with the options `NODYNAM` (static calls), `RENT` (reentrant code), `APOST` (apostrophe literal delimiter), `CICS` (integrated CICS translation) and `CODEPAGE(<DB2CCSID>)` (database code page).", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-dc8835f8e9", "function": "Unassigned-Programs", "id": "id-dc8835f8e9", "name": "Build the remaining insurance programs", "text": "THE Insurance Application Program Build SHALL build each of the members `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01`, `LGDPVS01`, `LGICDB01` and `LGICUS01` through the same compile, stub copy and link sequence, ending with the link editor (`HEWL`) for `LGICUS01` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-304dd99159", "function": "Unassigned-Programs", "id": "id-304dd99159", "name": "Build each insurance application program", "text": "THE Insurance Application Program Build SHALL run the CICS/DB2 build procedure (`DB2PROC`) for each program member (`MEM`): `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01` and `LGAPDB01`, contributing the compile, interface-stub copy and link-edit steps for each (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-b697f4a0f4", "function": "Unassigned-Programs", "id": "id-b697f4a0f4", "name": "Build the remaining application program members", "text": "THE Insurance Application Program Build SHALL run the build procedure for members `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1` and `LGDPDB01` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-e88f544a89", "function": "Unassigned-Programs", "id": "id-e88f544a89", "name": "Build each insurance application program", "text": "THE Application Program Build SHALL run the build procedure for each member `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01`, `LGDPVS01`, `LGICDB01`, `LGICUS01`, `LGICVS01`, `LGIPDB01` and `LGIPOL01`, passing the member name to each run (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-6c5b0c8e32", "function": "Unassigned-Programs", "id": "id-6c5b0c8e32", "name": "Build each insurance application program member", "text": "THE Application Program Build SHALL run the build procedure once for each program member `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01`, `LGDPVS01`, `LGICDB01`, `LGICUS01` and `LGICVS01`, passing the member name as the build parameter (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-2e5b3c2528", "function": "Unassigned-Programs", "id": "id-2e5b3c2528", "name": "Link-edit final program into load library", "text": "WHEN the compile step (`COBL`) ended with a return code of 7 or lower, THE Application Program Build SHALL run the linkage editor (`HEWL`) with parameter `'LIST,XREF,RENT,NAME=&MEM'` to combine the staged stub (`&&COPYLINK`), the object module (`&&LOADSET`) and the link control member (`LINKPARM`) into the executable module stored in the load library (`<LOADX>`) under the member name, then delete both temporary datasets; skip the link-edit when the compile return code is above 7 (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-e97d43a1bc", "function": "Unassigned-Programs", "id": "id-e97d43a1bc", "name": "Link-edit customer-add program into load library", "text": "WHEN the compile step (`COBL`) has ended with a return code of 7 or less, THE Customer-Add Program Build SHALL run the linkage editor (`HEWL`) with parameter `'LIST,XREF,RENT,NAME=&MEM'` for member `LGACDB02`. Combine the staged stub (`&&COPYLINK`), the object module (`&&LOADSET`) and the link parameters (`<SOURCEX>(LINKPARM)`), store the executable in the load library member `<LOADX>(&MEM)`, and delete both temporary work files. Skip the link-edit when the compile ended with a return code above 7. (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-8755874449", "function": "Unassigned-Programs", "id": "id-8755874449", "name": "Build each insurance application program", "text": "THE Insurance Application Build SHALL run the compile-and-link build once per program member, in order: `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01` and `LGASTAT1` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-15e4e474aa", "function": "Unassigned-Programs", "id": "id-15e4e474aa", "name": "Build each insurance application program", "text": "THE Insurance Application Program Build SHALL run the compile, interface-preparation and link-edit procedure once for each program member, in this order: `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01`, `LGDPVS01`, `LGICDB01`, `LGICUS01`, `LGICVS01`, `LGIPDB01`, `LGIPOL01`, `LGIPVS01` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-f6a2ba9ffa", "function": "Unassigned-Programs", "id": "id-f6a2ba9ffa", "name": "Build remaining insurance application programs", "text": "THE Application Program Build SHALL run the program build procedure for each member `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01` and `LGDPOL01` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-fc231a1878", "function": "Unassigned-Programs", "id": "id-fc231a1878", "name": "Build the remaining policy programs", "text": "THE Application Program Build SHALL run the shared build procedure for program members `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01` and `LGAPOL01` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-b6bce12fa1", "function": "Unassigned-Programs", "id": "id-b6bce12fa1", "name": "Build remaining customer-add programs", "text": "THE Customer-Add Program Build SHALL run the shared build procedure for program members `LGACDB02`, `LGACUS01` and `LGACVS01` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-9cff381508", "function": "Unassigned-Programs", "id": "id-9cff381508", "name": "Build each application program member", "text": "THE Application Program Build SHALL run the build procedure (`DB2PROC`) for each program member `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01` and `LGAPVS01` in that order, passing the member name (`MEM`), so that each member goes through the compile, interface stub copy and link-edit (`HEWL`) steps (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-ed4b4dbd04", "function": "Unassigned-Programs", "id": "id-ed4b4dbd04", "name": "Build the three customer-add modules", "text": "THE Customer-Add Module Build SHALL build each customer-add program member in turn through the shared build procedure: the add-customer DB2 module (`LGACDB01`), the second add-customer DB2 module (`LGACDB02`) and the add-customer front-end module (`LGACUS01`) (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-a15bf3caf1", "function": "Unassigned-Programs", "id": "id-a15bf3caf1", "name": "Compile the member source with CICS and DB2 support", "text": "THE Customer-Add Module Build SHALL compile the member source (`<SOURCEX>(&MEM)`) with parameter `'OPTFILE'` and options `NODYNAM`, `RENT`, `APOST`, `CICS` and `CODEPAGE(<DB2CCSID>)`, write the database request module to `<DBRMLIX>(&MEM)`, and pass the compiled object in a newly created temporary object file (`&&LOADSET`) to later steps", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-0d7b600b2d", "function": "Unassigned-Programs", "id": "id-0d7b600b2d", "name": "Build each general insurance program member", "text": "THE General Insurance Program Build SHALL run the DB2/CICS build procedure once for each member (`MEM`), in order: `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01`, `LGDPVS01`, `LGICDB01` (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-3c7200f06d", "function": "Unassigned-Programs", "id": "id-3c7200f06d", "name": "Build each insurance application program", "text": "THE Application Program Build SHALL run the program build once for each member (`MEM`): `LGACDB01`, `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01` and `LGDPVS01`, in that order (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-21059e9cf0", "function": "Unassigned-Programs", "id": "id-21059e9cf0", "name": "Copy the CICS interface stub for linking", "text": "WHEN the compile step (`COBL`) ended with a return code of 7 or less, THE Program Build Pipeline SHALL copy the CICS interface stub (`DFHEILIC`) from `<CICSHLQ>.SDFHCOB` into a new temporary stub dataset (`&&COPYLINK`) of fixed-length 80-byte records, passed to the link-edit. Skip the copy when the compile ended with a return code above 7.", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-929d6fcd2d", "function": "Unassigned-Programs", "id": "id-929d6fcd2d", "name": "Link-edit the executable load module", "text": "WHEN the compile step (`COBL`) ended with a return code of 7 or less, THE Program Build Pipeline SHALL run the linkage editor (`HEWL`) with parameter `'LIST,XREF,RENT,NAME=&MEM'`. Combine the stub copy (`&&COPYLINK`), the object deck (`&&LOADSET`) and the link control member (`<SOURCEX>(LINKPARM)`) against the CICS, DB2, language environment and application libraries. Store the load module `LGACDB01` in `<LOADX>(&MEM)` and then delete both temporary inputs. Skip the link-edit when the compile ended with a return code above 7.", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-3b84f693f9", "function": "Unassigned-Programs", "id": "id-3b84f693f9", "name": "Compile customer-add program source", "text": "THE Customer-Add Program Build SHALL compile the program source member (`<SOURCEX>(&MEM)`) for member `LGACDB01` with parameter `'OPTFILE'` and options `NODYNAM`, `RENT`, `APOST`, `CICS`, `CODEPAGE(<DB2CCSID>)`. Write the database request module to `<DBRMLIX>(&MEM)` and pass the object module on in a new temporary work file (`&&LOADSET`). (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-21998a5385", "function": "Unassigned-Programs", "id": "id-21998a5385", "name": "Build remaining insurance application programs", "text": "THE Application Program Build SHALL build each of the program members `LGACDB02`, `LGACUS01`, `LGACVS01`, `LGAPDB01`, `LGAPOL01`, `LGAPVS01`, `LGASTAT1`, `LGDPDB01`, `LGDPOL01`, `LGDPVS01`, `LGICDB01`, `LGICUS01`, `LGICVS01` through the shared build procedure, finishing with the linkage editor (`HEWL`) (physical stores: `DBRMLIB`, `SYSIN`, `SYSLIB`, `SYSLIN`, `SYSLMOD`, `SYSUT1`, `SYSUT2`)", "program": "cobol", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "Unassigned-Programs/id-ad270444d3", "function": "Unassigned-Programs", "id": "id-ad270444d3", "name": "Replace wui application placeholder", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder `'<WUIAPPL>'` in the edited member with the configured wui application identifier (`WUIAPPL`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-bfe61f8ba5", "function": "Unassigned-Programs", "id": "id-bfe61f8ba5", "name": "Substitute data-owning region application name", "text": "THE Region Placeholder Substitution SHALL replace every occurrence of the placeholder `'<DORAPPL>'` in the edited member with the configured dor region application name (`DORAPPL`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-e185d94e4f", "function": "Unassigned-Programs", "id": "id-e185d94e4f", "name": "Substitute application region name placeholder", "text": "THE Region Placeholder Substitution SHALL replace every occurrence of the placeholder `'<AORAPPL>'` in the edited member with the application-owning region application name (`AORAPPL`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-f2b8db5a70", "function": "Unassigned-Programs", "id": "id-f2b8db5a70", "name": "Reject request shorter than required length", "text": "WHEN the received request length (`EIBCALEN`) is less than the customer data length (`WS-CUSTOMER-LEN`) plus the header and trailer length (`WS-CA-HEADERTRAILER-LEN`), THE Customer Inquiry Request Validation SHALL set the outcome code (`CA-RETURN-CODE`) to `'98'` and return to the caller without looking up the customer; otherwise keep the default outcome `'00'` and continue", "program": "lgicdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-048", "REQ-F-049", "REQ-F-050"]}, {"key": "Unassigned-Programs/id-a064b27262", "function": "Unassigned-Programs", "id": "id-a064b27262", "name": "Retrieve customer details by customer number", "text": "WHEN a valid customer inquiry is received and the customer lookup succeeds, THE Customer Details Retrieval SHALL read the customer's name, date of birth, address, phone numbers and email from the customer table (`CUSTOMER`) by customer number (`CUSTOMERNUMBER`), return them to the caller and set the outcome code (`CA-RETURN-CODE`) to `'00'`", "program": "lgicdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-053", "REQ-F-054"]}, {"key": "Unassigned-Programs/id-20f2cdb30d", "function": "Unassigned-Programs", "id": "id-20f2cdb30d", "name": "Report customer not found or unavailable", "text": "IF the customer lookup finds no matching customer or the customer data is unavailable due to deadlock or timeout, THEN THE Customer Details Retrieval SHALL set the outcome code (`CA-RETURN-CODE`) to `'01'`", "program": "lgicdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-6f157d9929", "function": "Unassigned-Programs", "id": "id-6f157d9929", "name": "Reject request shorter than required length", "text": "WHEN the received request length (`EIBCALEN`) is less than the customer data length (`WS-CUSTOMER-LEN`) plus the header/trailer length (`WS-CA-HEADERTRAILER-LEN`), THE Customer Inquiry Request Validation SHALL return control to the caller without retrieving customer details; otherwise continue with the return code (`CA-RETURN-CODE`) set to `'00'`", "program": "lgicdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-048", "REQ-F-049"]}, {"key": "Unassigned-Programs/id-eac8a90a4c", "function": "Unassigned-Programs", "id": "id-eac8a90a4c", "name": "Retrieve customer details by number", "text": "THE Customer Details Retrieval SHALL read the customer's name, date of birth, address, phone and email columns from the customer store (`CUSTOMER`) where `CUSTOMERNUMBER` equals the requested customer number (`CA-CUSTOMER-NUM`), and return them to the caller", "program": "lgicdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-d1a71d53ec", "function": "Unassigned-Programs", "id": "id-d1a71d53ec", "name": "Retrieve customer personal and contact details", "text": "WHEN a customer inquiry with valid request data is received, THE Customer Details Inquiry SHALL read the customer's name, date of birth, address, phone numbers and email from the customer store (`CUSTOMER`) by customer number (`CUSTOMERNUMBER`) and return them to the caller", "program": "lgicdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-052", "REQ-F-053"]}, {"key": "Unassigned-Programs/id-e8f716bb54", "function": "Unassigned-Programs", "id": "id-e8f716bb54", "name": "Reject undersized customer request", "text": "WHEN the received request length (`EIBCALEN`) is less than the customer record length (72) plus the header and trailer length (18), THE Customer Inquiry Request Validation SHALL return to the caller without performing the customer lookup", "program": "lgicus01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-048", "REQ-F-049"]}, {"key": "Unassigned-Programs/id-814bb285b1", "function": "Unassigned-Programs", "id": "id-814bb285b1", "name": "Delegate customer lookup to database service", "text": "WHEN a customer inquiry request of sufficient length is received, THE Customer Inquiry Processing SHALL preset the outcome code to success (`'00'`) and the policy count to zero (`'00'`), then delegate to the customer database service (`LGICDB01`) with the full customer request of length 32500", "program": "lgicus01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-56e2932a35", "function": "Unassigned-Programs", "id": "id-56e2932a35", "name": "Default success outcome and policy count", "text": "WHEN a customer inquiry request with non-empty data is received, THE Customer Inquiry Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '00' (success) and the number of policies (`CA-NUM-POLICIES`) to zero", "program": "lgicus01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-046", "REQ-F-047"]}, {"key": "Unassigned-Programs/id-2f6bccf08c", "function": "Unassigned-Programs", "id": "id-2f6bccf08c", "name": "Reject request shorter than required length", "text": "IF the received request data length (`EIBCALEN`) is less than the customer record length (72) plus the header/trailer length (18), THEN THE Customer Inquiry Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '98' (request too short) and return to the caller", "program": "lgicus01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-048", "REQ-F-049", "REQ-F-050"]}, {"key": "Unassigned-Programs/id-583019733c", "function": "Unassigned-Programs", "id": "id-583019733c", "name": "Replace authorization identifier placeholders", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder '<SQLID>' in the edited member with the user's SQL authorization identifier (`SQLID`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-60d34e16d1", "function": "Unassigned-Programs", "id": "id-60d34e16d1", "name": "Substitute character-set placeholder everywhere", "text": "THE Environment Placeholder Substitution SHALL replace every occurrence of the placeholder token (`'<DB2CCSID>'`) in the edited member with the configured character-set identifier (`DB2CCSID`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-4574bba65b", "function": "Unassigned-Programs", "id": "id-4574bba65b", "name": "Substitute subsystem placeholder in member", "text": "WHEN the member being edited contains the subsystem placeholder (`'<DB2SSID>'`), THE Environment Placeholder Substitution SHALL replace every occurrence of the subsystem placeholder (`'<DB2SSID>'`) in the member with the retrieved subsystem identifier (`DB2SSID`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-6d8b454882", "function": "Unassigned-Programs", "id": "id-6d8b454882", "name": "Replace database id placeholders in member", "text": "THE Member Placeholder Substitution SHALL replace every occurrence of the placeholder `'<DB2DBID>'` in the edited member with the configured database id (`DB2DBID`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-8a785521d4", "function": "Unassigned-Programs", "id": "id-8a785521d4", "name": "Substitute database qualifier placeholders in member", "text": "THE Template Qualifier Substitution SHALL replace every occurrence (`All`) of the placeholder `'<DB2HLQ>'` in the edited member with the installation's database qualifier (`DB2HLQ`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-915f014b45", "function": "Unassigned-Programs", "id": "id-915f014b45", "name": "Derive prefixed backup member name", "text": "WHEN the edited member name (`memnme`) is 'ONCICS', or it is any other name, THE Edited Member Backup SHALL set the backup member name to '#' followed by the member name for 'ONCICS', and to '@' followed by the member name for every other member", "program": "mac1", "disposition": "captured", "reason": "", "requirements": ["REQ-F-042", "REQ-F-043"]}, {"key": "Unassigned-Programs/id-dca7892580", "function": "Unassigned-Programs", "id": "id-dca7892580", "name": "Save full member content as copy", "text": "THE Edited Member Backup SHALL save all edited lines, from the first line (`.zfirst`) through the last line (`.zlast`), under the prefixed member name (`memnme`), replacing any existing member with that name", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-8f9aeaf815", "function": "Unassigned-Programs", "id": "id-8f9aeaf815", "name": "Replace run placeholder with configured value", "text": "WHEN the member being edited contains the run-value placeholder (`'<DB2RUN>'`), THE Environment Placeholder Substitution SHALL replace every occurrence of the run-value placeholder (`'<DB2RUN>'`) in the member with the configured run value (`DB2RUN`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-127f8727d6", "function": "Unassigned-Programs", "id": "id-127f8727d6", "name": "Replace plan placeholder throughout member", "text": "THE Member Environment Tailoring SHALL replace every occurrence of the placeholder (`'<DB2PLAN>'`) in the edited member with the configured plan name (`DB2PLAN`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-568c3f66e0", "function": "Unassigned-Programs", "id": "id-568c3f66e0", "name": "Replace customer dataset placeholder throughout member", "text": "THE Environment Placeholder Substitution SHALL replace every occurrence of the placeholder (`'<KSDSCUS>'`) in the edited member with the retrieved customer dataset name (`KSDSCUS`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-350de661b9", "function": "Unassigned-Programs", "id": "id-350de661b9", "name": "Substitute policy dataset placeholder in member", "text": "THE Member Environment Customization SHALL replace every occurrence of the policy dataset placeholder (`'<KSDSPOL>'`) in the edited member with the configured policy dataset name (`KSDSPOL`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-1345eee06e", "function": "Unassigned-Programs", "id": "id-1345eee06e", "name": "Substitute cmas system identifier placeholder", "text": "THE Member Customisation SHALL replace all occurrences of the placeholder (`'<CMASYSID>'`) in the edited member with the cmas system identifier (`CMASYSID`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-a7d428dd0e", "function": "Unassigned-Programs", "id": "id-a7d428dd0e", "name": "Replace source placeholder with environment name", "text": "WHEN the member being edited contains the source placeholder token (`'<SOURCEX>'`), THE Environment Placeholder Substitution SHALL replace every occurrence of the source placeholder (`'<SOURCEX>'`) in the edited member with the environment's source name (`SOURCEX`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-747057b9ce", "function": "Unassigned-Programs", "id": "id-747057b9ce", "name": "Replace home directory placeholders", "text": "THE Edit Placeholder Substitution SHALL replace every occurrence of the placeholder `'<ZFSHOME>'` in the edited member with the retrieved home directory path (`ZFSHOME`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-a8ecb7d971", "function": "Unassigned-Programs", "id": "id-a8ecb7d971", "name": "Substitute message library qualifier placeholder", "text": "WHEN the edited member contains the message library placeholder (`'<PDSMSGS>'`), THE Installation Member Customization SHALL replace every occurrence of the placeholder `'<PDSMSGS>'` in the member with the installation's message dataset qualifier (`WSIMHLQ`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-474ef470cf", "function": "Unassigned-Programs", "id": "id-474ef470cf", "name": "Replace library placeholder with installation name", "text": "THE Member Installation Customization SHALL replace every occurrence of the placeholder '<DBRMLIX>' in the edited member with the installation library name (`DBRMLIX`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-282632bc53", "function": "Unassigned-Programs", "id": "id-282632bc53", "name": "Substitute transaction-server prefix placeholders", "text": "THE Installation Prefix Customization SHALL replace every occurrence of the placeholder (`'<CICSHLQ>'`) in the edited member with the configured transaction-server library prefix (`CICSHLQ`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-01c935caf0", "function": "Unassigned-Programs", "id": "id-01c935caf0", "name": "Substitute management-component prefix placeholder", "text": "THE Installation Member Customization SHALL replace every occurrence of the placeholder (`'<CPSMHLQ>'`) in the edited member with the installation's management-component prefix (`CPSMHLQ`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-6373fd3a5c", "function": "Unassigned-Programs", "id": "id-6373fd3a5c", "name": "Substitute licence placeholder in member", "text": "THE Installation Member Tailoring SHALL replace every occurrence of the placeholder `'<CICSLIC>'` in the edited member with the installation licence value (`CICSLIC`)", "program": "mac1", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-2edfcadeea", "function": "Unassigned-Programs", "id": "id-2edfcadeea", "name": "Prepare inquiry keys and default outcome", "text": "THE Policy Inquiry Routing SHALL set the return code (`CA-RETURN-CODE`) to successful (`'00'`), take the customer number (`CA-CUSTOMER-NUM`) and policy number (`CA-POLICY-NUM`) as the lookup keys, and convert the request identifier (`CA-REQUEST-ID`) to upper case for matching", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-057", "REQ-F-058", "REQ-F-059"]}, {"key": "Unassigned-Programs/id-7c23c6b589", "function": "Unassigned-Programs", "id": "id-7c23c6b589", "name": "Route endowment policy inquiry", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '01IEND', THE Policy Inquiry Routing SHALL clear the endowment details (`DB2-ENDOWMENT`) and run the endowment policy retrieval for the requested customer and policy number", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-c10b4ece9d", "function": "Unassigned-Programs", "id": "id-c10b4ece9d", "name": "Route house policy inquiry", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '01IHOU', THE Policy Inquiry Routing SHALL clear the house details (`DB2-HOUSE`) and run the house policy retrieval for the requested customer and policy number", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-94586119b4", "function": "Unassigned-Programs", "id": "id-94586119b4", "name": "Route motor policy inquiry", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '01IMOT', THE Policy Inquiry Routing SHALL clear the motor details (`DB2-MOTOR`) and run the motor policy retrieval for the requested customer and policy number", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-5721816171", "function": "Unassigned-Programs", "id": "id-5721816171", "name": "Route commercial inquiry by customer and policy", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '01ICOM', THE Policy Inquiry Routing SHALL clear the commercial details (`DB2-COMMERCIAL`) and run the commercial policy retrieval keyed by both customer and policy number", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-cec9dfb0e5", "function": "Unassigned-Programs", "id": "id-cec9dfb0e5", "name": "Route commercial inquiry by policy only", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '02ICOM', THE Policy Inquiry Routing SHALL clear the commercial details (`DB2-COMMERCIAL`) and run the commercial policy retrieval keyed by policy number only", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-ca0ce009fb", "function": "Unassigned-Programs", "id": "id-ca0ce009fb", "name": "Route commercial policies list for customer", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '03ICOM', THE Policy Inquiry Routing SHALL clear the commercial details (`DB2-COMMERCIAL`) and run the multi-record commercial policy retrieval for the requested customer", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-4bc8fb45ff", "function": "Unassigned-Programs", "id": "id-4bc8fb45ff", "name": "Route commercial policies search by postcode", "text": "WHEN the request identifier (`WS-REQUEST-ID`) is '05ICOM', THE Policy Inquiry Routing SHALL clear the commercial details (`DB2-COMMERCIAL`) and run the commercial policy postcode search using the supplied postcode (`CA-B-POSTCODE`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-f71b6c2400", "function": "Unassigned-Programs", "id": "id-f71b6c2400", "name": "Reject unrecognised request type", "text": "IF the request identifier is not `'01IEND'`, `'01IHOU'`, `'01IMOT'`, `'01ICOM'`, `'02ICOM'`, `'03ICOM'` or `'05ICOM'`, THEN THE Policy Inquiry Router SHALL set the return code to `'99'` without performing any lookup", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-c0623ab740", "function": "Unassigned-Programs", "id": "id-c0623ab740", "name": "Retrieve endowment policy and size response", "text": "WHEN an endowment policy inquiry finds the policy for the requested customer and policy number, THE Endowment Policy Inquiry SHALL retrieve the joined policy (`POLICY`) and endowment (`ENDOWMENT`) record by customer and policy number. Compute the required response size as 33 plus 124 plus the padding length when padding is present. Advance the end-of-policy position by the padding length.", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-068", "REQ-F-069"]}, {"key": "Unassigned-Programs/id-8196757e72", "function": "Unassigned-Programs", "id": "id-8196757e72", "name": "Reject endowment inquiry for insufficient space", "text": "IF the caller's data area length is less than the required endowment response size, THEN THE Endowment Policy Inquiry SHALL set the return code (`CA-RETURN-CODE`) to '98' and return to the caller without the policy details", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-492732d9fa", "function": "Unassigned-Programs", "id": "id-492732d9fa", "name": "Return endowment details to caller", "text": "WHEN the caller's data area is at least the required endowment response size, THE Endowment Policy Inquiry SHALL return the common policy data and the 52-character fixed endowment data. Include the broker id, payment and padding data only when each is present.", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-6250252dde", "function": "Unassigned-Programs", "id": "id-6250252dde", "name": "Mark end of endowment policy data", "text": "WHEN an endowment policy has been found and returned to the caller, THE Endowment Policy Inquiry SHALL write the end-of-data marker 'FINAL' at the end-of-policy position of the endowment padding output", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-9115193d51", "function": "Unassigned-Programs", "id": "id-9115193d51", "name": "Report endowment lookup failure", "text": "IF the endowment policy lookup does not succeed, THEN THE Endowment Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-073", "REQ-F-074"]}, {"key": "Unassigned-Programs/id-00e4b3d42b", "function": "Unassigned-Programs", "id": "id-00e4b3d42b", "name": "Retrieve house policy and size reply", "text": "WHEN a house policy inquiry is submitted for a customer number and policy number, THE House Policy Inquiry SHALL retrieve the matching house policy from the policy (`POLICY`) and house (`HOUSE`) stores, filtered by customer number (`CUSTOMERNUMBER`) and policy number (`POLICYNUMBER`), and, when found, compute the required reply length as the header/trailer length (`WS-CA-HEADERTRAILER-LEN`) plus the full house policy length (`WS-FULL-HOUSE-LEN`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-075", "REQ-F-076"]}, {"key": "Unassigned-Programs/id-60a831eb6f", "function": "Unassigned-Programs", "id": "id-60a831eb6f", "name": "Reject undersized house inquiry reply area", "text": "IF the caller's supplied area (`EIBCALEN`) is smaller than the required reply length (`WS-REQUIRED-CA-LEN`), THEN THE House Policy Inquiry SHALL set the return code (`CA-RETURN-CODE`) to '98' and return to the caller without returning policy data", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-bf7790c453", "function": "Unassigned-Programs", "id": "id-bf7790c453", "name": "Return house policy details with end marker", "text": "WHEN the house policy is found and the caller's area is at least the required reply length, THE House Policy Inquiry SHALL return the common policy data and house details, including broker id and payment only when they are not null (`IND-BROKERID`, `IND-PAYMENT` not -1), and mark the end of the data with 'FINAL'", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-078", "REQ-F-079"]}, {"key": "Unassigned-Programs/id-c5d31c3084", "function": "Unassigned-Programs", "id": "id-c5d31c3084", "name": "Report house lookup failure", "text": "IF the house policy lookup does not succeed, THEN THE House Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-080", "REQ-F-081"]}, {"key": "Unassigned-Programs/id-47613b8d34", "function": "Unassigned-Programs", "id": "id-47613b8d34", "name": "Retrieve motor policy and size reply", "text": "WHEN a motor policy inquiry is received for a customer and policy number, THE Motor Policy Inquiry SHALL read the matching policy and motor details from the policy master (`POLICY`) joined to the motor details (`MOTOR`) by customer number (`CUSTOMERNUMBER`) and policy number (`POLICYNUMBER`), and on success compute the required reply size as the header/trailer length (33) plus the full motor policy length (137)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-082", "REQ-F-083"]}, {"key": "Unassigned-Programs/id-58a673c160", "function": "Unassigned-Programs", "id": "id-58a673c160", "name": "Reject motor inquiry with insufficient reply space", "text": "IF the caller's area length (`EIBCALEN`) is less than the required motor reply size (`WS-REQUIRED-CA-LEN`), THEN THE Motor Policy Inquiry SHALL set the return code (`CA-RETURN-CODE`) to '98' and return to the caller without returning policy data", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-5d2631b693", "function": "Unassigned-Programs", "id": "id-5d2631b693", "name": "Return motor policy details to caller", "text": "WHEN a motor policy was found and the caller's area is at least the required reply size, THE Motor Policy Inquiry SHALL return the common policy data, the 65-byte motor details, the premium and the accident count, copying broker id and payment only when they are not null", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-34226ecf3e", "function": "Unassigned-Programs", "id": "id-34226ecf3e", "name": "Mark end of motor policy data", "text": "WHEN motor policy data has been returned to the caller, THE Motor Policy Inquiry SHALL write the end-of-data marker 'FINAL' into the free space after the motor data (`CA-M-FILLER`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "Unassigned-Programs/id-8794b0be6b", "function": "Unassigned-Programs", "id": "id-8794b0be6b", "name": "Report motor lookup failure", "text": "IF the motor policy lookup does not succeed, THEN THE Motor Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-087", "REQ-F-088"]}, {"key": "Unassigned-Programs/id-7dfb8c9816", "function": "Unassigned-Programs", "id": "id-7dfb8c9816", "name": "Return commercial policy by customer and policy", "text": "WHEN a commercial policy is found for the requested customer and policy number, THE Commercial Policy Inquiry SHALL compute the required size (33 + 1174), return code `'98'` and stop when the caller's area is smaller, otherwise return the common and commercial details (request, start and renewal dates, address, location, perils, premiums, status, rejection reason) and mark the end of data with `'FINAL'` (physical stores: `POLICY`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-089", "REQ-F-093"]}, {"key": "Unassigned-Programs/id-68a992d3c2", "function": "Unassigned-Programs", "id": "id-68a992d3c2", "name": "Report commercial customer-and-policy lookup failure", "text": "IF the commercial lookup by customer and policy number does not succeed, THEN THE Commercial Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-095", "REQ-F-096"]}, {"key": "Unassigned-Programs/id-377231795a", "function": "Unassigned-Programs", "id": "id-377231795a", "name": "Return commercial policy by policy number", "text": "WHEN a commercial policy is found for the requested policy number, THE Commercial Policy Inquiry SHALL compute the required size (33 + 1174), return code `'98'` and stop when the caller's area is smaller, otherwise return the owning customer number, common and commercial details and mark the end of data with `'FINAL'` (physical stores: `POLICY`)", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-090", "REQ-F-091", "REQ-F-092", "REQ-F-094"]}, {"key": "Unassigned-Programs/id-9bf145d9c9", "function": "Unassigned-Programs", "id": "id-9bf145d9c9", "name": "Report commercial policy-number lookup failure", "text": "IF the commercial lookup by policy number does not succeed, THEN THE Commercial Policy Inquiry SHALL return code `'01'` when no matching policy exists and `'90'` for any other failure", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-095", "REQ-F-096"]}, {"key": "Unassigned-Programs/id-66f6a7f6d0", "function": "Unassigned-Programs", "id": "id-66f6a7f6d0", "name": "Scan commercial policies for a customer", "text": "WHILE rows remain for the customer's commercial policies and fewer than 21 rows have been read, THE Commercial Policy Customer Scan SHALL read each matching commercial policy, return its customer number, policy number, common and commercial details, count it, and stop the scan once more than 20 rows have been read", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-097", "REQ-F-100"]}, {"key": "Unassigned-Programs/id-deda89344b", "function": "Unassigned-Programs", "id": "id-deda89344b", "name": "Scan commercial policies by postcode", "text": "WHILE rows remain for commercial policies at the requested postcode, THE Commercial Policy Postcode Scan SHALL read each matching commercial policy and return its customer number, policy number, common and commercial details", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-101", "REQ-F-102"]}, {"key": "Unassigned-Programs/id-40f6aa6710", "function": "Unassigned-Programs", "id": "id-40f6aa6710", "name": "Route inquiry by policy request type", "text": "WHEN a policy inquiry arrives with request identifier '01IEND', '01IHOU', '01IMOT', '01ICOM', '02ICOM', '03ICOM' or '05ICOM', THE Policy Inquiry Router SHALL set the return code (`CA-RETURN-CODE`) to '00' and prepare the customer and policy lookup keys. Route '01IEND' to endowment, '01IHOU' to house, '01IMOT' to motor, '01ICOM' to commercial by customer and policy, '02ICOM' to commercial by policy only, '03ICOM' to the customer commercial list and '05ICOM' to the postcode commercial list, clearing the commercial details first for the two lists", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-057", "REQ-F-058", "REQ-F-059", "REQ-F-060", "REQ-F-061", "REQ-F-062", "REQ-F-063", "REQ-F-064", "REQ-F-065", "REQ-F-066"]}, {"key": "Unassigned-Programs/id-feb729923d", "function": "Unassigned-Programs", "id": "id-feb729923d", "name": "Retrieve endowment policy details", "text": "WHEN an endowment policy inquiry is requested, THE Endowment Policy Inquiry SHALL retrieve the endowment policy for the customer and policy number. On an unexpected retrieval failure (neither found nor not found), set the return code to '90' and record an error message", "program": "lgipdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-068", "REQ-F-074"]}, {"key": "Unassigned-Programs/id-3f04c3def3", "function": "Unassigned-Programs", "id": "id-3f04c3def3", "name": "Retrieve house policy details", "text": "WHEN a house policy inquiry is requested, THE House Policy Inquiry SHALL retrieve
