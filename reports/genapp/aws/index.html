{"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-390dc7122b", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-390dc7122b", "name": "Reject request shorter than required length", "text": "IF the received request length (`EIBCALEN`) is less than the required length (`WS-REQUIRED-CA-LEN`) for the policy type, THEN THE Policy Add Request Validation SHALL return to the caller without recording the policy", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ba0408ad62", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-ba0408ad62", "name": "Route to type-specific policy detail insert", "text": "WHEN the policy has been recorded and the request identifier (`CA-REQUEST-ID`) is `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'`, THE Policy Registration SHALL record the policy in the main policy store, then run the endowment, house, motor or commercial detail insert matching the request identifier", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-72ac5642e9", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-72ac5642e9", "name": "Determine policy type and required data length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is '01AEND', '01AHOU', '01AMOT' or '01ACOM', THE Policy Add Request Intake SHALL compute the required data length as the header length 28 plus the full record length for the type (124 for endowment, 130 for house, 137 for motor, 1174 for commercial), and set the policy type to 'E', 'H', 'M' or 'C' respectively", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-060", "REQ-F-061"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c86469d39d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c86469d39d", "name": "End processing for unknown request type", "text": "IF the request identifier (`CA-REQUEST-ID`) is not '01AEND', '01AHOU', '01AMOT' or '01ACOM', THEN THE Policy Add Request Intake SHALL return to the caller without creating any policy", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5ef0661502", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-5ef0661502", "name": "Create common policy record", "text": "WHEN a validated add-policy request is processed, THE Policy Record Creation SHALL add a policy row to the policy store (`POLICY`) with a system-assigned policy number, the customer, issue and expiry dates, policy type, current timestamp, broker id, broker's reference and payment", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-29fba40dae", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-29fba40dae", "name": "Stop when policy record insert fails", "text": "IF the policy row cannot be written, either because the customer does not exist (`-530`) or because of any other failure, THEN THE Policy Record Creation SHALL log the error message and return to the caller without writing type-specific details", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-068", "REQ-F-069"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7d63ee3c38", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-7d63ee3c38", "name": "Return assigned policy number and timestamp", "text": "WHEN the policy row has been written successfully, THE Policy Record Creation SHALL return the assigned policy number to the caller, and read and return the last-changed timestamp from the policy store (`POLICY`) for that policy number", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-066", "REQ-F-067"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-c32efb4c34", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-c32efb4c34", "name": "Create endowment policy details", "text": "WHEN an endowment policy ('01AEND') has been created in the policy store, THE Endowment Policy Creation SHALL write the endowment details to the endowment store (`ENDOWMENT`), including the extra data when the received length exceeds the required length and omitting it otherwise; on write failure log the error and terminate abnormally with 'LGSQ'", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-072", "REQ-F-073", "REQ-F-077"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-044e547baf", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-044e547baf", "name": "Create house policy details", "text": "WHEN a house policy ('01AHOU') has been created in the policy store, THE House Policy Creation SHALL write the house details to the house store (`HOUSE`); on failure log the error and terminate abnormally with 'LGSQ'", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-074", "REQ-F-077"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-af6e61f1b8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-af6e61f1b8", "name": "Create motor policy details", "text": "WHEN a motor policy ('01AMOT') has been created in the policy store, THE Motor Policy Creation SHALL write the motor details to the motor store (`MOTOR`); on failure log the error and terminate abnormally with 'LGSQ'", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-075", "REQ-F-077"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-671ad4e04a", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-671ad4e04a", "name": "Create commercial policy details", "text": "WHEN a commercial policy ('01ACOM') has been created in the policy store, THE Commercial Policy Creation SHALL write the commercial details to the commercial store (`COMMERCIAL`), using the last-changed timestamp as request date, the issue date as start date and the expiry date as renewal date; on failure log the error and terminate abnormally with 'LGSQ'", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a0d9a8f3ef", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a0d9a8f3ef", "name": "Reject unrecognised policy request", "text": "IF the request identifier (`CA-REQUEST-ID`) is not `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'`, THEN THE Policy Creation Request Intake SHALL return outcome code `'99'` to the caller without creating a policy", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ff258ee466", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-ff258ee466", "name": "Reject request shorter than required length", "text": "IF the received request length (`EIBCALEN`) is less than the required length (`WS-REQUIRED-CA-LEN`), THEN THE Policy Creation Request Intake SHALL return outcome code `'98'` to the caller without creating a policy", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-99cfb6d993", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-99cfb6d993", "name": "Route policy creation by policy type", "text": "WHEN a validated policy creation request is processed, THE Policy Creation Orchestration SHALL create the master policy row, then add the detail row matching `'01AEND'` (endowment), `'01AHOU'` (house), `'01AMOT'` (motor) or `'01ACOM'` (commercial). Set outcome `'99'` for any other identifier.", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e2e938826d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-e2e938826d", "name": "Create master policy record", "text": "WHEN a validated policy creation request is processed, THE Policy Master Creation SHALL insert a policy master row with an auto-assigned policy number, the customer, dates, policy type, current timestamp, broker, broker's reference and payment. Set outcome `'00'` on success.", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-73fccd0ddd", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-73fccd0ddd", "name": "Reject policy when customer reference invalid", "text": "IF the master policy insert is rejected because the referenced customer does not exist, THEN THE Policy Master Creation SHALL return outcome code `'70'` to the caller and stop policy creation", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-cbac5019dd", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-cbac5019dd", "name": "Return assigned policy number and timestamp", "text": "WHEN the master policy row is created successfully, THE Policy Master Creation SHALL return the newly assigned policy number and the LASTCHANGED timestamp read back from the policy master table for that policy number", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f3b2fa437b", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-f3b2fa437b", "name": "Add endowment policy details", "text": "WHEN an endowment request (`'01AEND'`) has its master policy created, THE Endowment Policy Creation SHALL insert the endowment details for the new policy number, including the padding data only when the request exceeds its required length. On failure set outcome `'90'` and abend with `'LGSQ'`.", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-072", "REQ-F-073", "REQ-F-077"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-54a9a245fa", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-54a9a245fa", "name": "Add house policy details", "text": "WHEN a house request (`'01AHOU'`) has its master policy created, THE House Policy Creation SHALL insert the house details for the new policy number. On failure set outcome `'90'` and abend with `'LGSQ'`.", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-074", "REQ-F-077"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-e34469caea", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-e34469caea", "name": "Add motor policy details", "text": "WHEN a motor request (`'01AMOT'`) has its master policy created, THE Motor Policy Creation SHALL insert the motor details for the new policy number. On failure set outcome `'90'` and abend with `'LGSQ'`.", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-075", "REQ-F-077"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bd57cb0fcb", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-bd57cb0fcb", "name": "Add commercial policy details", "text": "WHEN a commercial request (`'01ACOM'`) has its master policy created, THE Commercial Policy Creation SHALL insert the commercial property, peril, premium, status and rejection details for the new policy number, using the policy timestamp as request date. On failure set outcome `'90'` and abend with `'LGSQ'`.", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-00acb00307", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-00acb00307", "name": "End processing for unrecognised request type", "text": "IF the request identifier (`CA-REQUEST-ID`) is not `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'`, THEN THE Policy Add Request Validation SHALL return to the caller without recording any policy", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-4b57f2e52e", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-4b57f2e52e", "name": "Insert policy and return assigned identifiers", "text": "WHEN a validated add-policy request is processed, THE Policy Registration SHALL insert the policy into the policy store (`POLICY`) with a database-assigned number and the current timestamp. On success, set return code `'00'` and return the assigned policy number and last-changed timestamp. On a referential-constraint rejection or any other failure, return to the caller", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-064", "REQ-F-065", "REQ-F-066", "REQ-F-069"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8fe29ce40c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-8fe29ce40c", "name": "Flag unsupported request at detail routing", "text": "IF the request identifier (`CA-REQUEST-ID`) is not `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'` at detail routing, THEN THE Policy Registration SHALL set the return code to `'99'` (request not recognised or supported)", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5378c55f95", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-5378c55f95", "name": "Pass request to follow-on program", "text": "WHEN policy registration processing completes without ending early, THE Policy Registration SHALL delegate to the follow-on program (`LGAPVS01`) with the full request data, length 32500", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-eb2d8cc23e", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-eb2d8cc23e", "name": "Determine policy type and required length", "text": "WHEN the request identifier (`CA-REQUEST-ID`) is `'01AEND'`, `'01AHOU'`, `'01AMOT'` or `'01ACOM'`, THE Policy Add Request Validation SHALL default the return code to `'00'`, stage the customer number, and set the required request length to 28 plus the type length. Assign the policy type: 124 and `'E'` for endowment, 130 and `'H'` for house, 137 and `'M'` for motor, 1174 and `'C'` for commercial", "program": "lgapdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-69990f88a1", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-69990f88a1", "name": "Reject requests shorter than required header", "text": "WHEN the received request data length (`EIBCALEN`) is less than the required length (`WS-REQUIRED-CA-LEN`), which is the header length (`WS-CA-HEADER-LEN`) of 28 added to 0, THE Policy Insert Request Intake SHALL set the return code (`CA-RETURN-CODE`) to success '00' at the start, then return to the caller without performing the insert", "program": "lgapol01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-057", "REQ-F-058"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7ada9054d2", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-7ada9054d2", "name": "Delegate policy data insert", "text": "WHEN a request passes the presence and minimum-length checks, THE Policy Insert Request Intake SHALL delegate to the database insert program (`LGAPDB01`), passing the full request data with a length of 32500 so it can perform the data inserts", "program": "lgapol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8c1805284d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-8c1805284d", "name": "Build policy record key", "text": "THE Policy Record Registration SHALL build the policy identification key from the 4th character of the request identifier (`CA-REQUEST-ID`) as the policy type, followed by the customer number (`CA-CUSTOMER-NUM`) and the policy number (`CA-POLICY-NUM`)", "program": "lgapvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-8e307b48c7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-8e307b48c7", "name": "Populate commercial policy details", "text": "WHEN the policy type (`WF-Request-ID`) is commercial (`'C'`), THE Policy Record Registration SHALL record the commercial premises postcode, the commercial status code and the commercial customer name in the policy record's billing postcode, billing status and billing customer name", "program": "lgapvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-79ba6cc803", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-79ba6cc803", "name": "Populate endowment policy details", "text": "WHEN the policy type (`WF-Request-ID`) is endowment (`'E'`), THE Policy Record Registration SHALL record the with-profits, equities and managed-fund indicators, the fund name and the life assured name in the policy record", "program": "lgapvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2bc3830325", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-2bc3830325", "name": "Populate house policy details", "text": "WHEN the policy type (`WF-Request-ID`) is house (`'H'`), THE Policy Record Registration SHALL record the property type, bedroom count, insured value, postcode and house name in the policy record", "program": "lgapvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-7cd4214024", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-7cd4214024", "name": "Populate motor policy details", "text": "WHEN the policy type (`WF-Request-ID`) is motor (`'M'`), THE Policy Record Registration SHALL record the vehicle make, model, insured value and registration number in the policy record", "program": "lgapvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-d5513247ee", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-d5513247ee", "name": "Blank details for unrecognised policy type", "text": "IF the policy type (`WF-Request-ID`) is not `'C'`, `'E'`, `'H'` or `'M'`, THEN THE Policy Record Registration SHALL clear the policy details area of the record to blanks", "program": "lgapvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fc5c221c93", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-fc5c221c93", "name": "Add policy record to policy store", "text": "WHEN the policy record has been assembled, THE Policy Record Registration SHALL add the policy record to the policy store (`KSDSPOLY`) under its policy key; if the add fails, capture the failure responses, produce the failure diagnostic message and return to the caller", "program": "lgapvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-085", "REQ-F-086"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-67d318b149", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-67d318b149", "name": "Default return code to success", "text": "WHEN request data has been received, THE Policy Request Validation SHALL set the return code (`CA-RETURN-CODE`) to success '00'", "program": "lgapol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-73efef8c09", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-73efef8c09", "name": "Reject request data shorter than required", "text": "IF the received request data length (`EIBCALEN`) is less than the required length (header length 28), THEN THE Policy Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '98' and return control to the caller", "program": "lgapol01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-03ab34582c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-03ab34582c", "name": "Determine request source and key length", "text": "WHEN a policy request arrives and the start code (`WS-STARTCODE`) begins with 'D' or an invoking program (`WS-INVOKEPROG`) is present, or neither holds, THE Policy Request Intake SHALL For a calling-program request, mark the input path 'C', take the request from the caller's data and set the policy-number length to 10. Otherwise, receive the request from the terminal, mark the input path 'R', take the received payload and reduce the policy-number length by 6.", "program": "lgipvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-526c5fd3f6", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-526c5fd3f6", "name": "Accept policy request from calling program", "text": "WHEN the start code (`WS-STARTCODE`) begins with 'D' or an invoking program name (`WS-INVOKEPROG`) is present, THE Policy Request Intake SHALL mark the request as caller-supplied ('C'), take the request data from the caller, and set the policy-number length to 10 (11 minus 1)", "program": "lgipvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-64058bc1b7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-64058bc1b7", "name": "Accept policy request from terminal", "text": "WHEN the request was not started by a distributed link and has no invoking program, THE Policy Request Intake SHALL receive the request from the terminal, mark it as terminal-originated ('R'), use the received data as the request, and set the policy-number length to the received length minus 6", "program": "lgipvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-fba6f55180", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-fba6f55180", "name": "Send policy reply to terminal", "text": "WHEN the request channel flag (`WS-FLAG`) is 'R', THE Policy Response Delivery SHALL clear the terminal screen and display the 80-character policy message, then unlock the keyboard", "program": "lgipvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-121", "REQ-F-123"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3f867470cd", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-3f867470cd", "name": "Look up policy by type and number", "text": "THE Policy Lookup SHALL build the policy key from the policy type and policy number in the request, and retrieve the first policy record at or after that key from the policy file (`KSDSPOLY`) using an 11-character generic key and a 64-byte record", "program": "lgipvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-117", "REQ-F-118"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-5855243e9c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-5855243e9c", "name": "Report bad policy lookup", "text": "IF the retrieved policy type differs from the requested type or the policy lookup fails, THEN THE Policy Response Builder SHALL set the message label to 'Policy Bad=' and set the customer number and policy number in the message to 13", "program": "lgipvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a5ea883fc7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a5ea883fc7", "name": "Return found policy key", "text": "WHEN the policy lookup succeeds and the retrieved policy type matches the requested type, THE Policy Response Builder SHALL place the retrieved policy record into the policy key of the message, under the label 'Policy Key='", "program": "lgipvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a9bf74f276", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a9bf74f276", "name": "Return result to calling program", "text": "WHEN the input path (`WS-FLAG`) is not 'R', THE Policy Lookup Response SHALL Clear the caller's data and return the result label and policy key to the caller.", "program": "lgipvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-de589f170b", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-de589f170b", "name": "Determine invocation mode of the run", "text": "WHEN the transaction starts and its starting code (`WS-STARTCODE`) and invoking program name (`WS-INVOKEPROG`) are obtained, THE Invocation Mode Determination SHALL mark the run as program-called (`'C'`) when the starting code begins with `'D'` or an invoking program name is present, and otherwise mark it as terminal-started (`'R'`)", "program": "lgicvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-112", "REQ-F-113"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-3ed8819bee", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-3ed8819bee", "name": "Display high customer message on terminal", "text": "WHEN the invocation mode (`WS-FLAG`) is terminal-started (`'R'`), THE High Customer Message Display SHALL clear the screen and display the high-customer message (`'HIGH CUSTOMER='`) to the operator with the keyboard unlocked", "program": "lgicvs01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9d5347b43f", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-9d5347b43f", "name": "Run the online resource definition update", "text": "THE Online Resource Definition Maintenance SHALL run the definition utility (`DFHCSDUP`) against the system definition store (`DFHCSD`), opened for shared access, with the inline definition statements as input and a printed run listing as output", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-f56f387528", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-f56f387528", "name": "Keep prior group teardown disabled", "text": "THE Online Resource Definition Maintenance SHALL leave the existing groups `GENASAT`, `GENASAP`, `GENASAD`, `GENASAF` and `GENA` in place, and leave their membership in the list `GENALIST` unchanged, because the removal and deletion statements are disabled", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-a9bc229c47", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-a9bc229c47", "name": "Register application groups in start-up list", "text": "THE Online Resource Definition Maintenance SHALL add the groups `GENASAT`, `GENASAP`, `GENASAD`, `GENASAF` and `GENA` to the start-up list `GENALIST`", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-504d14fc11", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-504d14fc11", "name": "Define customer and policy menu programs", "text": "THE Online Resource Definition Maintenance SHALL define, in group `GENASAP`, the COBOL programs `LGTESTC1`, `LGTESTP1`, `LGTESTP2`, `LGTESTP3`, `LGTESTP4` and `SSMAP` with their descriptions, each with storage located anywhere and in user key", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bab9ed746e", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-bab9ed746e", "name": "Define customer and policy service programs", "text": "THE Online Resource Definition Maintenance SHALL define the 23 listed service programs in group `GENASAP` as COBOL programs, each with storage located anywhere and in user key", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-ec990455da", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-ec990455da", "name": "Define queue setup and messaging programs", "text": "THE Online Resource Definition Maintenance SHALL define the programs `LGSETUP` and `LGSTSQ` in group `GENASAP` as COBOL programs, each with storage located anywhere and in user key", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-19557e47f8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-19557e47f8", "name": "Define the database connection", "text": "THE Online Resource Definition Maintenance SHALL define the database connection in group `GENASAD` with a task limit of 400, a thread limit of 250, messages and statistics to `CSMT`, abend on thread error, accounting by transaction id, authorisation by user id and rollback on deadlock", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-076620751f", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-076620751f", "name": "Bind service transactions to the database plan", "text": "THE Online Resource Definition Maintenance SHALL route the transactions matching `SS*` to the database plan `GENAONE`, with accounting by transaction id and a thread limit of 250", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-973d84589d", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-973d84589d", "name": "Define application serialization model", "text": "THE Online Resource Definition Maintenance SHALL define the enqueue model `GENAMOD` with scope `GENA` for the resource name `GENACNTL`", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-6bbdac3443", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-6bbdac3443", "name": "Leave temporary queue model disabled", "text": "THE Online Resource Definition Maintenance SHALL skip the definition of the temporary storage queue model `GENASTSQ`, which is disabled, and end the definition input", "program": "cdef121", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-518ac61ce7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-518ac61ce7", "name": "Define insurance menu and service transactions", "text": "THE Online Resource Definition Maintenance SHALL define, in group `GENASAT`, transactions `SSC1`\u2192`LGTESTC1`, `SSP1`\u2192`LGTESTP1`, `SSP2`\u2192`LGTESTP2`, `SSP3`\u2192`LGTESTP3`, `SSP4`\u2192`LGTESTP4`, `LGSE`\u2192`LGSETUP`, `LGCF`\u2192`LGICVS01` and `LGPF`\u2192`LGIPVS01`, each with task data located anywhere in storage and in user key", "program": "cdef121", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-53faf2a227", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-53faf2a227", "name": "Define customer file without online deletion", "text": "THE Online Resource Definition Maintenance SHALL define the customer file (`KSDSCUST`) with 82-byte records and a 10-byte key, enabled and opened on first reference, allowing add, browse, read and update and disallowing delete", "program": "cdef121", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-9299fedc5c", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-9299fedc5c", "name": "Define policy file with full maintenance", "text": "THE Online Resource Definition Maintenance SHALL define the policy file (`KSDSPOLY`) with 64-byte records and a 21-byte key, enabled and opened on first reference, allowing add, browse, read, update and delete", "program": "cdef121", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-2aef4fc524", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-2aef4fc524", "name": "Clear status queue during setup", "text": "THE Application Setup Status Reset SHALL delete the status information queue (`GENASTAT`), named by the status queue name (`STSQ-STAT`) = `'GENASTAT'`, and record the outcome in the response code (`WS-RESP`)", "program": "lgsetup", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-0430ab6c51", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-0430ab6c51", "name": "Remove the existing WUI server repository", "text": "THE WUI Server Repository Rebuild SHALL run the dataset-management step documented as deleting the existing WUI server data repository before a new one is defined", "program": "defdrep", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-803d432c83", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-803d432c83", "name": "Define a new WUI server repository", "text": "THE WUI Server Repository Rebuild SHALL run the dataset-management step documented as defining a new WUI server data repository, reading in-stream definition statements and printing a report", "program": "defdrep", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-b5b11dafff", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-b5b11dafff", "name": "Initialize the WUI server repository", "text": "WHEN no earlier step of the job ended with a return code above 8, THE WUI Server Repository Initialization SHALL run the repository initialization program (`EYU9XDUT`) against the WUI data repository (`EYUDREP`) with parameters 'CMASNAME=<CMASAPPL>', 'DAYLIGHT=N', 'TIMEZONE=B', 'SYSID=<CMASYSID>' and 'ZONEOFFSET=0', supplying the WUI server identification WUIAPPLID=<WUIAPPL>, WUINAME=<WUIAPPL> and WUISYSID=<WUISYSID>, and print a report; skip the step when any earlier step ended with a return code above 8", "program": "defdrep", "disposition": "captured", "reason": "", "requirements": ["REQ-F-048", "REQ-F-049", "REQ-F-050", "REQ-F-051", "REQ-N-001"]}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-bccb341db7", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-bccb341db7", "name": "Register web-services group in startup list", "text": "THE Web Services Online Definition Maintenance SHALL run the resource-definition program (`DFHCSDUP`) against the shared online resource definition dataset (`DFHCSD`) and add the web-services group (`GENAWSRV`) to the startup group list (`AORLIST`)", "program": "cdef124", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-943beefca8", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-943beefca8", "name": "Define HTTP listener service for web requests", "text": "THE Web Services Online Definition Maintenance SHALL define the TCP/IP service `GENATCP1` in group `GENAWSRV`, listening on port `4321` for protocol `HTTP`, starting transaction `CWXN` for each inbound request, with no user-replaceable module (`NONE`)", "program": "cdef124", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement/id-1be6cb34c4", "function": "ApplicationDeploymentLifecycleManagement/ApplicationDeploymentandPolicyLifecycleManagement", "id": "id-1be6cb34c4", "name": "Define SOAP provider pipeline for web services", "text": "THE Web Services Online Definition Maintenance SHALL define the pipeline `GENAPIP1` in group `GENAWSRV` with configuration file `/usr/lpp/cicsts/cics660/samples/pipelines/basicsoap11provider.xml`, shelf `/var/cicstsge/` and web-service directory `/u/s8smith/genapp/wsdir`", "program": "cdef124", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8e8a6b2908", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-8e8a6b2908", "name": "Abend when no request data supplied", "text": "IF the received request data length (`EIBCALEN`) is zero, THEN THE Customer Update Request Intake SHALL terminate processing abnormally with abend code 'LGCA' without producing a dump", "program": "lgucus01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8a97d5a300", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-8a97d5a300", "name": "Lock customer record for update", "text": "WHEN a customer update request is received for a customer number, THE Customer Record Update SHALL read and lock the customer record in the customer file (`KSDSCUST`) by customer number (`CA-CUSTOMER-NUM`); if the read fails, record a diagnostic error message and terminate abnormally with code 'LGV1'", "program": "lgucvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-870ba377fb", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-870ba377fb", "name": "Log customer update failure message", "text": "IF a customer record read or rewrite fails, THEN THE Customer Update Error Logging SHALL build a timestamped error message containing the customer number and the primary and secondary response codes, and pass it to the logging service (`LGSTSQ`)", "program": "lgucvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b9bb1e17c9", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-b9bb1e17c9", "name": "Reject request with no input data", "text": "IF the customer update request arrives with no request data (received data length `EIBCALEN` is zero), THEN THE Customer Update Request Intake SHALL record the error text ' NO COMMAREA RECEIVED', log the error message, and terminate abnormally with abend code 'LGCA' without updating any customer", "program": "lgucdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a635ea7e41", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-a635ea7e41", "name": "Log timestamped error message", "text": "WHEN an error condition is reported during customer update processing, THE Error Message Logging SHALL stamp the error message with the database return code and the current date and time, and pass it to the error message queue service (`LGSTSQ`)", "program": "lgucdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3ea677fe85", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-3ea677fe85", "name": "Reject request without customer data", "text": "IF the request arrives with no customer data (request length `EIBCALEN` equal to zero), THEN THE Customer Update Request Intake SHALL terminate the request abnormally with abend code 'LGCA' without a dump", "program": "lgucdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-81a7b88780", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-81a7b88780", "name": "Report customer update database error", "text": "IF the customer update fails for a reason other than customer not found, THEN THE Customer Details Maintenance SHALL set the return code to '90' to report a database error during the customer update", "program": "lgucdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c0b6f6ea13", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-c0b6f6ea13", "name": "Update customer personal and contact details", "text": "WHEN a customer update request with data is received for a customer number (`CA-CUSTOMER-NUM`), THE Customer Details Maintenance SHALL update the matching customer row in the customer store (`CUSTOMER`) by customer number (`CUSTOMERNUMBER`) with the supplied name, date of birth, address, phone and email details; on success take no further action, on customer-not-found defer to handling outside this slice, and on any other failure log an error message identified as ' UPDATE CUST  ' with the customer number and return code", "program": "lgucdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-023", "REQ-F-026"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-b7263135cc", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-b7263135cc", "name": "Default outcome to success and update", "text": "WHEN a customer update request with data is received, THE Customer Update Orchestration SHALL set the return code to success '00', convert the customer number into the numeric customer key, and perform the customer details update", "program": "lgucdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-021", "REQ-F-023"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04dcbd8b01", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-04dcbd8b01", "name": "Pass request to follow-on program", "text": "WHEN the customer details update step has completed, THE Customer Update Orchestration SHALL delegate to the follow-on program (`LGUCVS01`), passing the customer request data and return code with a length of 225", "program": "lgucdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-689c1c148d", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-689c1c148d", "name": "Update customer details row", "text": "WHEN the customer update step runs for a customer number, THE Customer Details Maintenance SHALL update the customer table (`CUSTOMER`) row whose `CUSTOMERNUMBER` matches the customer number with the supplied name, date of birth, address, phone numbers and email address", "program": "lgucdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-023", "REQ-F-024"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-69676c05ca", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-69676c05ca", "name": "Report customer not found", "text": "IF the customer update finds no customer matching the supplied customer number, THEN THE Customer Details Maintenance SHALL set the return code to '01' to report that the customer was not found", "program": "lgucdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-c83ef37a6f", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-c83ef37a6f", "name": "Bypass update for non-update requests", "text": "WHEN the requested operation (`CA-REQUEST-ID`) is anything other than '01UCUS', THE Customer Update Request Intake SHALL skip the customer update and proceed to the end-of-program step; for '01UCUS', continue to the customer update", "program": "lgucus01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-f31689c9ac", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-f31689c9ac", "name": "Delegate customer update to database module", "text": "WHEN an update-customer request ('01UCUS') with request data is received, THE Customer Update Request Intake SHALL preset the outcome code (`CA-RETURN-CODE`) and the policy count (`CA-NUM-POLICIES`) to '00', then delegate to the customer database update module (`LGUCDB01`), passing the full request of length 32500", "program": "lgucus01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dcd58d532a", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-dcd58d532a", "name": "Replace stored customer record", "text": "WHEN the existing customer record has been locked for update, THE Customer Record Update SHALL rewrite the customer record in the customer file (`KSDSCUST`) with the supplied customer data at the fixed record size (`CUSTOMER-RECORD-SIZE`); if the rewrite fails, record a diagnostic error message and terminate abnormally with code 'LGV2'", "program": "lgucvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-027", "REQ-F-028", "REQ-N-001"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65b72061bd", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-65b72061bd", "name": "Default success outcome and policy count", "text": "THE Customer Update Request Intake SHALL default the return code (`CA-RETURN-CODE`) to success '00' and the number of policies (`CA-NUM-POLICIES`) to zero ('00')", "program": "lgucus01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-04a4edcd51", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-04a4edcd51", "name": "Reject unsupported request identifier", "text": "IF the request identifier (`CA-REQUEST-ID`) is not the update-customer request '01UCUS', THEN THE Customer Update Request Validation SHALL set the return code (`CA-RETURN-CODE`) to '99' to signal an unsupported request and skip to the end-of-program step", "program": "lgucus01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-85b1f4db34", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-85b1f4db34", "name": "Log customer write failure diagnostics", "text": "IF the customer record write does not succeed, THEN THE Customer Write Error Logging SHALL build a time-stamped diagnostic message with the customer number and primary and secondary response codes, and pass it to the error-logging program (`LGSTSQ`)", "program": "lgacvs01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8cc7a7271a", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-8cc7a7271a", "name": "Abend when no request data received", "text": "IF the received request data length (`EIBCALEN`) is zero, THEN THE Customer Security Registration SHALL record the error detail `' NO COMMAREA RECEIVED'`, write the diagnostic message, and abend the transaction with code `'LGCA'` without a dump", "program": "lgacdb02", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-1f7a1f1986", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-1f7a1f1986", "name": "Write timestamped diagnostic error message", "text": "WHEN an error condition requires a diagnostic record, THE Error Message Logging SHALL stamp the error message with the database outcome code and the current date and time, and pass it to the error-queue writer (`LGSTSQ`)", "program": "lgacdb02", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-dea97db12c", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-dea97db12c", "name": "Abort when no request data supplied", "text": "IF the registration request arrives with a request length (`EIBCALEN`) of zero, THEN THE Customer Registration SHALL terminate abnormally with abend code 'LGCA' without a dump and process nothing further", "program": "lgacdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-fbcac6d803", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-fbcac6d803", "name": "Abort when no request data received", "text": "IF the request arrives with a request data length (`EIBCALEN`) of zero, THEN THE Customer Registration Request Intake SHALL record the diagnostic ' NO COMMAREA RECEIVED' in an error message and terminate abnormally with abend code 'LGCA'", "program": "lgacdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-09a5e0f53c", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-09a5e0f53c", "name": "Record time-stamped error diagnostic", "text": "WHEN an error condition is reported during customer registration, THE Error Diagnostic Logging SHALL stamp the error message with the database return code and the current date and time, and pass it to the error-queue writer (`LGSTSQ`)", "program": "lgacdb01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-27904970d9", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-27904970d9", "name": "Abort when no request data received", "text": "IF the received request length (`EIBCALEN`) is zero, THEN THE Customer Registration Request Intake SHALL terminate processing abnormally with abend code `'LGCA'` without inserting any customer", "program": "lgacus01", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-98ad855daf", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-98ad855daf", "name": "Write new customer record", "text": "WHEN a customer number (`CA-CUSTOMER-NUM`) is supplied for a new customer record, THE Customer Record Creation SHALL write the customer record to the customer file (`KSDSCUST`) keyed by the customer number with a 0225-byte length; if the write fails, capture the secondary response detail, log the failure, and abend with code `'LGV0'`", "program": "lgacvs01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-991c375aa8", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-991c375aa8", "name": "Default return code and policy count", "text": "WHEN a request with non-zero data length is received, THE Customer Request Validation SHALL set the return code (`CA-RETURN-CODE`) to success `'00'` and the number of policies (`CA-NUM-POLICIES`) to `'00'`", "program": "lgacus01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8ca65a04f0", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-8ca65a04f0", "name": "Reject request shorter than required length", "text": "IF the received data length (`EIBCALEN`) is less than the header length plus the customer record length, THEN THE Customer Request Validation SHALL set the return code (`CA-RETURN-CODE`) to `'98'` and return to the caller", "program": "lgacus01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-004"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-a14ec4ce5d", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-a14ec4ce5d", "name": "Obtain new customer number from counter", "text": "WHEN a new customer number is requested from the counter 'GENACUSTNUM' in pool 'GENA', THE Customer Number Assignment SHALL on success use the counter value as the customer number; on failure set the counter-availability indicator to 'NO' and clear the customer number", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3697bf81df", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-3697bf81df", "name": "Validate request length and default success", "text": "WHEN an add-customer request with request data is received, THE Customer Registration Request Validation SHALL preset the return code to `'00'`, require the request length to be at least the header length (18) plus the customer record length (72), return `'98'` to the caller when it is shorter, and otherwise proceed to obtain a customer number and insert the customer", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ebb7c9f9be", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-ebb7c9f9be", "name": "Insert customer with counter-issued number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is `'ON'`, WHEN the customer insert is performed, THE Customer Record Creation SHALL insert the customer into the customer store (`CUSTOMER`) with the counter-issued number and the supplied name, date of birth, address, phone and email details, and on insert failure return `'90'` to the caller", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-65ef7a3868", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-65ef7a3868", "name": "Insert customer with generated number and return it", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is not `'ON'`, WHEN the customer insert is performed, THE Customer Record Creation SHALL insert the customer with a store-generated customer number and the supplied details, return `'90'` to the caller on insert failure, and otherwise capture the generated number; after any successful insert, return the customer number to the caller", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-014"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d51944a3ed", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-d51944a3ed", "name": "Validate minimum request length", "text": "IF the received request length (`EIBCALEN`) is less than the header length (18) plus the customer record length (72), THEN THE Customer Registration SHALL return to the caller without creating a customer, having initialized the return code to '00'", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-003"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-7c308664cf", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-7c308664cf", "name": "Register customer and hand off to copy program", "text": "WHEN a validated new-customer request has been inserted successfully, THE Customer Registration SHALL delegate to the customer copy program (`LGACVS01`) with the full 225-byte request data, including the assigned customer number", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d801f6a4a8", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-d801f6a4a8", "name": "Insert customer with counter-assigned number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is 'ON', WHEN the new customer is to be stored, THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) with the counter-assigned number and the request's personal, address and contact details; if the insert fails, return to the caller without further processing", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-721917222f", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-721917222f", "name": "Insert customer with store-assigned number", "text": "WHILE the counter-availability indicator (`LGAC-NCS`) is not 'ON', WHEN the new customer is to be stored, THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) letting the store assign the customer number, retrieve that generated number, and return the assigned customer number to the caller; if the insert fails, return to the caller without further processing", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-010", "REQ-F-011", "REQ-F-014"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-3a3fc86b3a", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-3a3fc86b3a", "name": "Reject customer data shorter than required", "text": "IF the received request length (`EIBCALEN`) is less than the header length (18) plus the customer record length (72), THEN THE Customer Add Request Intake SHALL return to the caller without obtaining a customer number or adding the customer", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-003"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-14c2f89566", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-14c2f89566", "name": "Assign next customer number from counter", "text": "WHEN a validated customer registration request needs a customer number, THE Customer Number Assignment SHALL obtain the next value from counter 'GENACUSTNUM' in pool 'GENA' and use it as the customer number; if the counter fails, mark the counter unavailable ('NO') and clear the customer number", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-d29d130688", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-d29d130688", "name": "Insert customer with counter-assigned number", "text": "WHEN the counter-availability indicator (`LGAC-NCS`) is 'ON', THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) using the counter-assigned customer number and the supplied name, date of birth, address, phones and email; on insert failure write an error message and return to the caller", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-06ae3bdd5a", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-06ae3bdd5a", "name": "Insert customer with database-default number", "text": "WHEN the counter-availability indicator (`LGAC-NCS`) is not 'ON', THE Customer Registration SHALL insert the customer into the customer store (`CUSTOMER`) letting the database assign the customer number by default; on insert failure write an error message and return to the caller", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-012"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-ee6f8cefcf", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-ee6f8cefcf", "name": "Stop when counter-numbered customer add fails", "text": "WHILE the counter-service indicator (`LGAC-NCS`) is `'ON'`, WHEN the customer database outcome (`SQLCODE`) is not 0, THE Customer Add SHALL return to the caller without creating the customer security record", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-efec943615", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-efec943615", "name": "Add customer with database-assigned number", "text": "WHILE the counter-service indicator (`LGAC-NCS`) is not `'ON'`, WHEN a validated new customer is to be added, THE Customer Add SHALL add the customer to the customer store (`CUSTOMER`) with a store-assigned number and the supplied name, birth date, address, phone and email; return to the caller if the add fails, otherwise capture the assigned customer number", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-8e98397165", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-8e98397165", "name": "Request customer security record creation", "text": "WHEN a new customer has been added and assigned a customer number, THE Customer Security Setup SHALL delegate to the customer security program (`LGACDB02`) with request type `'02ACUS'`, the new customer number, initial password `'5732fec825535eeafb8fac50fee3a8aa'`, attempt count `'0000'` and state `'N'`", "program": "lgacdb01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-86b7805ffc", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-86b7805ffc", "name": "Validate request length for customer data", "text": "WHEN the received request length (`EIBCALEN`) is less than the header length (`WS-CA-HEADER-LEN`) plus the customer record length (`WS-CUSTOMER-LEN`), THE Customer Registration Request Intake SHALL set the return code to success ('00') and the policy count to zero, then return to the caller without inserting the customer", "program": "lgacus01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-003"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-bfeb0b3e78", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-bfeb0b3e78", "name": "Delegate customer insertion to database module", "text": "WHEN a customer request has passed the presence and length validations, THE Customer Registration SHALL delegate to the customer database module (`LGACDB01`), passing the full customer request with length 32500, to insert the new customer", "program": "lgacus01", "disposition": "captured", "reason": "", "requirements": []}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-e37fbdb751", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-e37fbdb751", "name": "Route new customer security add request", "text": "WHEN the request identifier (`D2-REQUEST-ID`) is `'02ACUS'`, THE Customer Security Registration SHALL convert the customer account number and attempt count to numeric form and insert the new customer's security record", "program": "lgacdb02", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018", "REQ-F-019"]}, {"key": "CustomerRecordManagement/CustomerRecordCreationandMaintenance/id-2627b01d7d", "function": "CustomerRecordManagement/CustomerRecordCreationandMaintenance", "id": "id-2627b01d7d", "name": "Insert customer security record", "text": "WHEN a new-customer security add is requested, THE Customer Security Registration SHALL insert the customer number, password, state indicator and password change count into the customer secure table (`CUSTOMER_SECURE`); if the insert fails, write a diagnostic message labelled `' INSERT SECURITY'` and return to the caller", "program": "lgacdb02", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-f646f17c37", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-f646f17c37", "name": "Use caller-supplied text as message", "text": "WHEN the program is invoked by another program (invoking program name `WS-INVOKEPROG` is not blank), THE Message Log Builder SHALL stamp the current system identifier into the message, take the caller's data (`COMMA-DATA`) as the message text, and set the message length to the caller's data length (`EIBCALEN`)", "program": "lgstsq", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-fb989ec573", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-fb989ec573", "name": "Use terminal input as message", "text": "WHEN the program is started directly and not by another program (invoking program name is blank), THE Message Log Builder SHALL receive the terminal input, use the received data (`WS-RECV-DATA`) as the message text, and set the message length to the received length minus 5", "program": "lgstsq", "disposition": "captured", "reason": "", "requirements": []}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-f1fd6ad01d", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-f1fd6ad01d", "name": "Strip queue directive prefix", "text": "WHEN the message text starts with 'Q=', THE Message Log Builder SHALL replace the message text with its remainder after the directive and reduce the message length by 7", "program": "lgstsq", "disposition": "captured", "reason": "", "requirements": ["REQ-F-004", "REQ-F-005"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-26136fe9d9", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-26136fe9d9", "name": "Write message to standard log queue", "text": "THE Message Log Writer SHALL add 5 to the message length and write the outbound message with that length to the standard destination queue (`CSMT`)", "program": "lgstsq", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-1728df5372", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-1728df5372", "name": "Write message to error queue", "text": "THE Error Message Logging SHALL add 5 to the message length and write the outbound message to the selected error message queue (`STSQ-NAME`) without waiting for storage, ignoring the request when no space is available", "program": "lgstsq", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-a3686cd7f6", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-a3686cd7f6", "name": "Assemble message from caller or terminal", "text": "WHEN a message is submitted for logging, either by an invoking program (invoking program name `WS-INVOKEPROG` not blank) or from a terminal (invoking program name blank), THE Error Message Logging SHALL stamp the message with the originating system identifier (`WRITE-MSG-SYSID`). For a program invocation, take the message text from the passed data (`COMMA-DATA`) and its length from the passed data length (`EIBCALEN`). For a terminal start, take the text from the received terminal data (`WS-RECV-DATA`) and use the received length minus 5.", "program": "lgstsq", "disposition": "captured", "reason": "", "requirements": ["REQ-F-012", "REQ-F-013", "REQ-F-014"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-e9db9b70ff", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-e9db9b70ff", "name": "Select target error queue name", "text": "WHEN a message is prepared for logging, and its text either starts with the prefix 'Q=' or does not, THE Error Message Logging SHALL target the default queue 'GENAERRS'. When the text starts with 'Q=', replace the queue name extension (`STSQ-EXT`) with the four characters that follow the prefix, strip the prefix and queue code from the message text, and reduce the message length by 7. Otherwise, keep the default queue.", "program": "lgstsq", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018"]}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-5eae54197f", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-5eae54197f", "name": "Acknowledge directly run request at terminal", "text": "WHEN the invocation-mode flag (`WS-FLAG`) is 'R', THE Terminal Acknowledgement SHALL send a one-character blank response (`FILLER-X`) to the terminal, clearing the screen and freeing the keyboard", "program": "lgstsq", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "No domain/DiagnosticandErrorMessageLogging/id-ea4fdf1718", "function": "No domain/DiagnosticandErrorMessageLogging", "id": "id-ea4fdf1718", "name": "Determine invocation mode", "text": "WHEN the program starts and the invoking program name (`WS-INVOKEPROG`) is retrieved, THE Invocation Mode Detection SHALL set the invocation-mode flag (`WS-FLAG`) to 'C' when an invoking program name is present, and to 'R' when the invoking program name is blank", "program": "lgstsq", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-011"]}, {"key": "No domain/TransactionStatisticsandMonitoring/id-f9249bfd7a", "function": "No domain/TransactionStatisticsandMonitoring", "id": "id-f9249bfd7a", "name": "Prepare statistics run timestamp", "text": "THE Transaction Statistics Collection SHALL set the statistics queue prefix (`TSQpre`) to `'GENA'`, capture the current date (`WS-DATE`) and time (`WS-TIME`), and then run the interval-timing step", "program": "lgwebst5", "disposition": "not_applicable", "reason": "[Pre-classified] Technical rule", "requirements": []}, {"key": "No domain/TransactionStatisticsandMonitoring/id-2b20e5b0af", "function": "No domain/TransactionStatisticsandMonitoring", "id": "id-2b20e5b0af", "name": "Publish customer number counter statistic", "text": "THE Transaction Statistics Collection SHALL read the customer-number counter (`'GENACUSTNUM'`) from pool `'GENA'` and store it as the statistic for queue suffix `'X05V'`, recording its new value, previous value and change", "program": "lgwebst5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-013"]}, {"key": "No domain/TransactionStatisticsandMonitoring/id-d7a5c605f6", "function": "No domain/TransactionStatisticsandMonitoring", "id": "id-d7a5c605f6", "name": "Collect and categorize transaction counters", "text": "THE Transaction Statistics Collection SHALL read each named counter from pool `'GENA'` and publish it under its queue suffix ('100V' through 'H00V'). Accumulate all counters into the success total (`CountSuccess`). Accumulate the inquiry counters ('GENA01ICUS00', 'GENA01IMOT00', 'GENA01IEND00', 'GENA01IHOU00', 'GENA01ICOM00') into `CountInq`, the add counters ('GENA01ACUS00', 'GENA01AMOT00', 'GENA01AEND00', 'GENA01AHOU00', 'GENA01ACOM00') into `CountAdd`, the delete counters ('GENA01DMOT00', 'GENA01DEND00', 'GENA01DHOU00', 'GENA01DCOM00') into `CountDel`, and the update counters ('GENA01UMOT00', 'GENA01UEND00', 'GENA01UHOU00') into `CountUpd`", "p
