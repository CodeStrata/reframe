<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

LENGTH(32500). Errors are timestamped and written through calls to LGSTSQ. LGTESTC1 calls it, and ws:WSAUC01 dispatches it. The packet lists no direct data store connection."}, {"id": "LGACDB01", "name": "LGACDB01", "kind": "module", "language": "cobol", "loc": 213, "file": "base/src/lgacdb01.cbl", "description": "LGACDB01 is a 213-line module that implements ADD Customer Details: it adds a customer's name, address and date of birth to the DB2 customer table, creating a new customer entry. It gets a customer number from the GENAcount counter, then inserts a row, and sets CA-RETURN-CODE '90' if the SQL insert fails. It writes ds:CUSTOMER, reads and writes ds:GENACUSTNUM, and calls LGACDB02, LGACVS01 and LGSTSQ. It is called by LGACUS01. It also moves a hardcoded literal into D2-CUSTSECR-PASS (value withheld)."}, {"id": "LGACDB02", "name": "LGACDB02", "kind": "module", "language": "cobol", "loc": 126, "file": "base/src/lgacdb02.cbl", "description": "LGACDB02 is the \"ADD Customer\" module that records a new customer's password and security details in the security table. When the request ID is '02ACUS', it inserts the customer number, password, state indicator and pass-change count into ds:CUSTOMER_SECURE. It returns '98' if the SQL insert fails and '99' for any other request ID. If no commarea is received, it abends with 'LGCA'. LGACDB01 calls it. To log errors, it calls LGSTSQ."}, {"id": "LGICDB01", "name": "LGICDB01", "kind": "module", "language": "cobol", "loc": 141, "file": "base/src/lgicdb01.cbl", "description": "LGICDB01 is the Inquire Customer module. It selects one customer's details from the DB2 CUSTOMER table by CUSTOMERNUMBER and returns FIRSTNAME, LASTNAME, DATEOFBIRTH, POSTCODE, the phone numbers and EMAILADDRESS in the commarea. If no commarea is received, it abends with code LGCA. It sets return code 98 when the commarea is too short, 01 for SQLCODE 100 or -913, and 90 for any other error. It reads ds:CUSTOMER, calls LGSTSQ to log error messages, and is called by LGICUS01."}, {"id": "LGUCDB01", "name": "LGUCDB01", "kind": "module", "language": "cobol", "loc": 141, "file": "base/src/lgucdb01.cbl", "description": "LGUCDB01 is a 141-line COBOL module (base/src/lgucdb01.cbl) that handles the \"UPDATE customer details\" function. It runs a Db2 UPDATE CUSTOMER that sets the name, date of birth, address, phone and email columns for the row whose CUSTOMERNUMBER matches the commarea customer number. It returns code '01' when no row is found and '90' on other SQL errors. LGUCUS01 calls it. It writes ds:CUSTOMER, links to LGUCVS01 and calls LGSTSQ to log errors. If no commarea is received, it abends with LGCA."}, {"id": "LGACVS01", "name": "LGACVS01", "kind": "module", "language": "cobol", "loc": 88, "file": "base/src/lgacvs01.cbl", "description": "LGACVS01 is an 88-line module for the ADD Customer function. It performs a VSAM KSDS Customer record ADD by issuing a CICS Write to file KSDSCUST, keyed on CA-Customer-Num with KeyLength(10). If the write does not return NORMAL, it moves '80' to CA-RETURN-CODE, builds an error message with date, time and response codes, and abends with code LGV0. In the dependency map it writes to data store KSDSCUST, calls LGSTSQ through CICS LINK to pass the error message, and is called by LGACDB01."}, {"id": "LGUCVS01", "name": "LGUCVS01", "kind": "module", "language": "cobol", "loc": 102, "file": "base/src/lgucvs01.cbl", "description": "LGUCVS01 is a 102-line module that performs the VSAM KSDS Customer record UPDATE. It reads the customer record from KSDSCUST with Update, keyed on CA-Customer-Num, and then rewrites it. If the read fails, it sets return code '81' and abends with LGV1. If the ReWrite fails, it sets '82' and abends with LGV2. LGUCDB01 calls it. It reads and writes ds:KSDSCUST, and its WRITE-ERROR-MESSAGE routine calls LGSTSQ to pass on the failure details."}]}, {"id": "dom:policy", "name": "Policy Management", "kind": "domain", "children": [{"id": "LGAPOL01", "name": "LGAPOL01", "kind": "module", "language": "cobol", "loc": 89, "file": "base/src/lgapol01.cbl", "description": "LGAPOL01 is the Add Policy business logic module, adding full details of an individual policy: Endowment, House, Motor, Commercial. It validates the incoming commarea, abending with LGCA when none is received and setting return code 98 when it is too short, then links to LGAPDB01 with a 32500-byte commarea. Errors are timestamped and passed to LGSTSQ. It is called by LGTESTP1, LGTESTP2, LGTESTP3 and LGTESTP4 and dispatched from WSAAP01. The packet lists no direct data-store reads or writes."}, {"id": "LGIPOL01", "name": "LGIPOL01", "kind": "module", "language": "cobol", "loc": 82, "file": "base/src/lgipol01.cbl", "description": "LGIPOL01 is the Inquire Policy business logic module (82 lines, base/src/lgipol01.cbl) that obtains full details of an individual policy: Endowment, House or Motor. It checks that a commarea was received and abends with code LGCA if not. It then sets CA-RETURN-CODE to '00' and links to LGIPDB01 with the commarea (length 32500), which does the retrieval. Errors are written through LGSTSQ. LGTESTP1, LGTESTP2, LGTESTP3 and LGTESTP4 call it, and ws:WSAIP01 dispatches to it."}, {"id": "LGUPOL01", "name": "LGUPOL01", "kind": "module", "language": "cobol", "loc": 117, "file": "base/src/lgupol01.cbl", "description": "LGUPOL01 is the business-logic module that handles UPDATE policy details requests. It checks that a commarea was received, abending with code LGCA if not, then validates commarea length for request IDs 01UEND, 01UHOU and 01UMOT, setting return code 98 when too short and 99 for any other request ID. It links to LGUPDB01 to update policy information and to LGSTSQ to record error messages. It is called by LGTESTP1, LGTESTP2 and LGTESTP3 and dispatched from ws:WSAUP01. No direct data store connections appear in the packet."}, {"id": "LGDPOL01", "name": "LGDPOL01", "kind": "module", "language": "cobol", "loc": 101, "file": "base/src/lgdpol01.cbl", "description": "LGDPOL01 is the DELETE Policy business logic module (101 lines, base/src/lgdpol01.cbl). It checks the incoming commarea. If no commarea is received it abends with LGCA. If the commarea is too short it sets return code 98, and if CA-REQUEST-ID is not 01DEND, 01DMOT, 01DHOU or 01DCOM it sets 99. Valid requests go by EXEC CICS LINK to LGDPDB01 with LENGTH(32500) for the DB2 delete. Error messages are sent by calling LGSTSQ. LGTESTP1, LGTESTP2, LGTESTP3 and LGTESTP4 call it."}, {"id": "LGAPDB01", "name": "LGAPDB01", "kind": "module", "language": "cobol", "loc": 408, "file": "base/src/lgapdb01.cbl", "description": "LGAPDB01 is the ADD Policy module (408 lines, base/src/lgapdb01.cbl) that adds full details of an individual policy: Endowment, House, Motor or Commercial. It selects the policy type from CA-REQUEST-ID values 01AEND, 01AHOU, 01AMOT and 01ACOM, inserts a POLICY row, then the type-specific detail, returning 99 for unknown requests and 98 for a short commarea. It is called by LGAPOL01, calls LGAPVS01 and LGSTSQ, reads ds:POLICY, and writes ds:POLICY, ds:ENDOWMENT, ds:HOUSE, ds:MOTOR and ds:COMMERCIAL."}, {"id": "LGIPDB01", "name": "LGIPDB01", "kind": "module", "language": "cobol", "loc": 739, "file": "base/src/lgipdb01.cbl", "description": "LGIPDB01 is the Inquire Policy module, which obtains full details of an individual policy (Endowment, House, Motor, Commercial) for a given customer and policy number. It picks a branch from the request ID, such as 01IEND, 01IHOU, 01IMOT or 01ICOM. It returns code 99 for any other request and abends with LGCA when no COMMAREA is received. It is called by LGIPOL01 and calls LGSTSQ. It reads the data stores POLICY, ENDOWMENT, HOUSE, MOTOR and COMMERCIAL, and the packet shows no writes."}, {"id": "LGUPDB01", "name": "LGUPDB01", "kind": "module", "language": "cobol", "loc": 324, "file": "base/src/lgupdb01.cbl", "description": "LGUPDB01 is a 324-line COBOL module (base/src/lgupdb01.cbl) whose header describes it as \"UPDATE policy details\". It opens POLICY_CURSOR, fetches the policy row and compares CA-LASTCHANGED with DB2-LASTCHANGED. It then uses CA-REQUEST-ID ('01UEND', '01UHOU', '01UMOT') to pick the ENDOWMENT, HOUSE or MOTOR update, and sets return code '90' on SQL errors. LGUPOL01 calls it. It calls LGSTSQ and LGUPVS01, reads ds:POLICY, and writes ds:POLICY, ds:ENDOWMENT, ds:HOUSE and ds:MOTOR."}, {"id": "LGDPDB01", "name": "LGDPDB01", "kind": "module", "language": "cobol", "loc": 131, "file": "base/src/lgdpdb01.cbl", "description": "LGDPDB01 is the DELETE Policy module. It removes the row for a given CA-CUSTOMER-NUM and CA-POLICY-NUM from the DB2 POLICY table. It only does this when CA-REQUEST-ID is 01DEND, 01DHOU, 01DCOM or 01DMOT. Otherwise it sets return code 99. It returns 90 on a failed delete and 98 when the commarea is too short. It is called by LGDPOL01. After deleting it calls LGDPVS01, it writes to ds:POLICY, and it calls LGSTSQ to log error messages."}, {"id": "LGAPVS01", "name": "LGAPVS01", "kind": "module", "language": "cobol", "loc": 146, "file": "base/src/lgapvs01.cbl", "description": "LGAPVS01 is a 146-line module whose header reads \"VSAM KSDS Policy record ADD\". It builds a policy record from the commarea, copying CA-Policy-Num, CA-Customer-Num and type-specific fields for request IDs 'C', 'E', 'H' and 'M', then writes it (Length 64, KeyLength 21) to ds:KSDSPOLY. If the write response is not NORMAL, it sets CA-RETURN-CODE to '80' and calls LGSTSQ to log an error message stamped with date and time. Its only caller in the map is LGAPDB01."}, {"id": "LGUPVS01", "name": "LGUPVS01", "kind": "module", "language": "cobol", "loc": 162, "file": "base/src/lgupvs01.cbl", "description": "LGUPVS01 is the \"Update Policy - VSAM\" module. It updates a policy record in the VSAM KSDS file KSDSPOLY. It copies policy details from the commarea according to the request type ('C', 'E', 'H' or 'M'). It then reads the record for update with a key length of 21 and rewrites it. If the read or rewrite fails, it sets return code '81' or '82', calls LGSTSQ to log an error message, and abends with LGV3 or LGV4. It reads from and writes to ds:KSDSPOLY, and is called by LGUPDB01."}, {"id": "LGDPVS01", "name": "LGDPVS01", "kind": "module", "language": "cobol", "loc": 97, "file": "base/src/lgdpvs01.cbl", "description": "LGDPVS01 is a 97-line module that handles the DELETE Policy function by removing a Policy record from the VSAM KSDS file KSDSPOLY, using the key WF-Policy-Key with KeyLength(21). If the CICS Delete File does not return NORMAL, it sets CA-RETURN-CODE to '81' and performs WRITE-ERROR-MESSAGE. That routine links to LGSTSQ with the error message and up to 90 bytes of the commarea. In the dependency map, it calls LGSTSQ, writes ds:KSDSPOLY and is called by LGDPDB01."}, {"id": "LGAPBR01", "name": "LGAPBR01", "kind": "module", "language": "cobol", "loc": 1, "missingSource": true}]}, {"id": "dom:ui", "name": "3270 Presentation", "kind": "domain", "children": [{"id": "LGTESTC1", "name": "LGTESTC1", "kind": "module", "language": "cobol", "loc": 282, "file": "base/src/lgtestc1.cbl", "description": "LGTESTC1 is the Customer menu entry point. It is a CICS module that sends and receives map SSMAPC1 in mapset SSMAP and acts on the option the user enters. Option 1 looks up a customer. Option 2 adds a new customer and rolls back if CA-RETURN-CODE is greater than zero. Option 4 fetches a customer's details and then updates them. It passes COMM-AREA to LGICUS01, LGACUS01 and LGUCUS01. It reads and writes ds:GENACNTL, using WRITE-GENACNTL after an add, and reads and writes scr:SSMAP."}, {"id": "LGTESTP1", "name": "LGTESTP1", "kind": "module", "language": "cobol", "loc": 259, "file": "base/src/lgtestp1.cbl", "description": "LGTESTP1 is the Motor Policy Menu, an ENTRY POINT module of 259 lines in base/src/lgtestp1.cbl that displays the SSMAPP1 screen and acts on the option entered: '1' inquires on a motor policy, '2' adds a new motor policy and '3' deletes one. Add and delete roll back when CA-RETURN-CODE is nonzero. It calls LGIPOL01, LGAPOL01, LGDPOL01 and LGUPOL01 through a COMM-AREA of length 32500, and it reads and writes scr:SSMAP. The excerpt stops at option '4', so it does not show what LGUPOL01 does."}, {"id": "LGTESTP2", "name": "LGTESTP2", "kind": "module", "language": "cobol", "loc": 244, "file": "base/src/lgtestp2.cbl", "description": "LGTESTP2 is the Endowment Policy Menu, an entry-point CICS module of 244 lines in base/src/lgtestp2.cbl that runs endowment policy transactions from a terminal screen. Depending on the menu option entered, it looks up, adds or deletes a policy for a customer and shows messages such as \"New Life Policy Inserted\" and \"Life Policy Deleted\". It links to LGIPOL01, LGAPOL01 and LGDPOL01 with a COMM-AREA of length 32500. The map also shows it calling LGUPOL01. It reads and writes screen mapset SSMAP (map SSMAPP2)."}, {"id": "LGTESTP3", "name": "LGTESTP3", "kind": "module", "language": "cobol", "loc": 241, "file": "base/src/lgtestp3.cbl", "description": "LGTESTP3 is a 241-line COBOL entry-point module (base/src/lgtestp3.cbl) that serves the House Policy Menu. A CICS user can use it to look up, add or delete house policies by customer and policy number, and it shows messages such as \"New House Policy Inserted\" and \"House Policy Deleted\". It reads and writes screen scr:SSMAP (map SSMAPP3). It calls LGIPOL01, LGAPOL01, LGDPOL01 and LGUPOL01 through COMMAREA, and it rolls back when an add or delete fails. The excerpt is cut off, so it does not show how LGUPOL01 is called."}, {"id": "LGTESTP4", "name": "LGTESTP4", "kind": "module", "language": "cobol", "loc": 264, "file": "base/src/lgtestp4.cbl", "description": "LGTESTP4 is the Commercial Policy Menu, a 264-line CICS COBOL entry-point module that presents the menu for Commercial Policy Transactions on map SSMAPP4 in mapset SSMAP. Option '1' builds an inquiry request (01ICOM, 02ICOM, 03ICOM or 05ICOM) from customer number, policy number or postcode, links to LGIPOL01, then displays property, peril, premium and status details. Option '2' prepares an add request (01ACOM). The dependency map shows it calls LGAPOL01, LGDPOL01 and LGIPOL01 and reads and writes screen scr:SSMAP. The excerpt ends before those other calls appear."}, {"id": "scr:SSMAP", "name": "SSMAP", "kind": "screen", "language": "bms", "loc": 688, "file": "base/src/ssmap.bms", "description": "SSMAP is a screen definition (base/src/ssmap.bms, loc=688) used by General Insurance terminal users. The excerpt shows map SSMAPC1, the General Insurance Customer Menu, which offers Cust Inquiry, Cust Add and Cust Update with name, DOB, house, postcode, phone and email fields. It also shows SSMAPP1, the General Insurance Motor Policy Menu, which offers Policy Inquiry, Add, Delete and Update. SSMAP calls nothing itself, and LGTESTC1, LGTESTP1, LGTESTP2, LGTESTP3 and LGTESTP4 each read and write it. The excerpt stops partway through SSMAPP1, so any later maps are not visible."}]}, {"id": "dom:logging", "name": "Error Logging", "kind": "domain", "children": [{"id": "LGSTSQ", "name": "LGSTSQ", "kind": "module", "language": "cobol", "loc": 85, "file": "base/src/lgstsq.cbl", "description": "LGSTSQ is an 85-line shared message-logging module. It takes a message from the calling program's commarea, or from the terminal through RECEIVE, and writes it to queues. By default it uses the GENAERRS temporary storage queue. If the message starts with Q=nnnn, it uses GENAnnnn instead. Its writes go to ds:CSMT and ds:GENAERRS. It is called by LGACDB01, LGACDB02, LGACUS01, LGACVS01, LGAPDB01, LGAPOL01, LGAPVS01, LGDPDB01, LGDPOL01, LGDPVS01, LGICDB01, LGICUS01, LGIPDB01, LGIPOL01, LGUCDB01, LGUCUS01, LGUCVS01, LGUPDB01, LGUPOL01 and LGUPVS01."}]}, {"id": "dom:ops", "name": "Ops Control and Monitoring", "kind": "domain", "children": [{"id": "LGSETUP", "name": "LGSETUP", "kind": "module", "language": "cobol", "loc": 482, "file": "base/src/lgsetup.cbl", "description": "LGSETUP is an ENTRY POINT module (482 lines, base/src/lgsetup.cbl) that resets control state to match a DB2 restored database. It deletes TSQ GENACNTL and puts new low/high customer values, recreates Named Counter GENACUSTNUM for the next available customer number, and redefines counters such as GENACNT100 in pool GENApool with Value(0). According to the dependency map, it writes to ds:GENA-STATS, ds:GENACNTL, ds:GENACUSTNUM, ds:GENAERRS, ds:GENASTAT and ds:GENASTRT. The packet lists no callers, called programs or reads."}, {"id": "LGASTAT1", "name": "LGASTAT1", "kind": "module", "language": "cobol", "loc": 106, "file": "base/src/lgastat1.cbl", "description": "LGASTAT1 is a CICS entry-point module (base/src/lgastat1.cbl, 106 lines) that records run-time statistics for each transaction invocation. It takes a request ID and return code from channel containers, or else from CA-REQUEST-ID and CA-RETURN-CODE. It folds variants such as '02ACUS' into '01ACUS' and turns any code other than '00' into '99', then updates a counter in GENApool. The dependency map shows it reading and writing ds:GENA-STATS and ds:GENASTRT, and it lists no callers or called programs."}, {"id": "LGWEBST5", "name": "LGWEBST5", "kind": "module", "language": "cobol", "loc": 752, "file": "base/src/lgwebst5.cbl", "description": "LGWEBST5 is an ENTRY POINT module (loc=752, base/src/lgwebst5.cbl) used as a repeating transaction for Business Monitor. It obtains values from counters such as GENAcount and GENACNT100 through GENACNT600 in pool GENApool, then places statistics data in a shared tsq, refreshing every 60 seconds. In the dependency map, it reads and writes ds:GENA*-RATES and reads ds:GENA-STATS and ds:GENACUSTNUM. The packet lists no programs that it calls or that call it."}]}, {"id": "dom:wsim", "name": "Workload Simulation", "kind": "domain", "children": [{"id": "LGICVS01", "name": "LGICVS01", "kind": "module", "language": "cobol", "loc": 180, "file": "base/src/lgicvs01.cbl", "description": "LGICVS01 is the Customer Inquire entry-point module. It returns a random customer number taken from the VSAM KSDS Customer dataset. It reads low and high customer bounds from a control TSQ and writes default bounds back when they are missing. It then works out a random key and reads KSDSCUST with GTEQ. It returns the result by commarea or screen display. In the dependency map, it reads and writes ds:GENACNTL, reads ds:KSDSCUST, and is dispatched from ws:WSAVC01."}, {"id": "LGIPVS01", "name": "LGIPVS01", "kind": "module", "language": "cobol", "loc": 111, "file": "base/src/lgipvs01.cbl", "description": "LGIPVS01 is the Inquire Policy module. Its header comment says it returns a random Policy/customer number from the VSAM KSDS Policy file, and the input policy type decides the key. It gets its input from the commarea or from a terminal RECEIVE. It then does a generic GTEQ read and checks that the policy type it finds matches the one requested. It sends the result as text or returns it in the commarea. In the dependency map, it reads data store KSDSPOLY and is dispatched by WSAVP01."}, {"id": "job:ITPENTR", "name": "ITPENTR (WSim)", "kind": "job", "language": "jcl", "loc": 12, "file": "base/cntl/itpentr.jcl"}]}, {"id": "dom:soap", "name": "Web Services / SOAP", "kind": "domain", "children": [{"id": "ws:WSAAC01", "name": "SOAP WSAAC01", "kind": "screen", "language": "jcl", "loc": 23, "file": "base/cntl/wsaac01.jcl", "uris": ["GENAPP/LGACUS01"], "description": "WSAAC01 (base/cntl/wsaac01.jcl) is an entry-point JCL job that publishes a customer function as a SOAP web service. Its header comment reads INQUIRE CUSTOMER DETAILS, but its PGMNAME is LGACUS01, so the comment appears to be a copy-paste slip. Its LS2WS step runs DFHLS2WS, converting member SOAIC01 (request and response) into LGACUS01.wsdl and LGACUS01.wsbind, published at URI GENAPP/LGACUS01 over COMMAREA. Its only connection is a dispatch to LGACUS01; no data stores are read or written."}, {"id": "ws:WSAAP01", "name": "SOAP WSAAP01", "kind": "screen", "language": "jcl", "loc": 80, "file": "base/cntl/wsaap01.jcl", "uris": ["GENAPP/LGAPOLM1", "GENAPP/LGAPOLH1", "GENAPP/LGAPOLE1", "GENAPP/LGAPOLB1"], "description": "WSAAP01 (base/cntl/wsaap01.jcl) is an entry-point job. It runs the DFHLS2WS \"LANGUAGE STRUCTURE TO WSDL CONVERSION ROUTINE\" for ADD POLICY Details and produces web service binding and WSDL files for Motor, House, Endowment and Commercial policies. It publishes four SOAP URIs: GENAPP/LGAPOLM1, GENAPP/LGAPOLH1, GENAPP/LGAPOLE1 and GENAPP/LGAPOLB1. Their request and response members are SOAIPM1, SOAIPH1, SOAIPE1 and SOAIPB1, each with a COMMAREA program interface. In the dependency map, its only connection is a dispatch to LGAPOL01, and no data stores are listed."}, {"id": "ws:WSAIC01", "name": "SOAP WSAIC01", "kind": "screen", "language": "jcl", "loc": 23, "file": "base/cntl/wsaic01.jcl", "uris": ["GENAPP/LGICUS01"], "description": "WSAIC01 (base/cntl/wsaic01.jcl) is a JCL job that publishes the INQUIRE CUSTOMER DETAILS function as a SOAP web service. Its LS2WS step runs DFHLS2WS, the LANGUAGE STRUCTURE TO WSDL CONVERSION ROUTINE, against the COBOL program LGICUS01. It uses SOAIC01 as both request and response member and calls the program through COMMAREA. The job produces LGICUS01.wsbind and LGICUS01.wsdl for the URI GENAPP/LGICUS01. In the dependency map, its only connection is a dispatch to LGICUS01, and the packet shows no data stores read or written."}, {"id": "ws:WSAIP01", "name": "SOAP WSAIP01", "kind": "screen", "language": "jcl", "loc": 99, "file": "base/cntl/wsaip01.jcl", "uris": ["GENAPP/LGIPOLM1", "GENAPP/LGIPOLH1", "GENAPP/LGIPOLE1", "GENAPP/LGIPOLB1", "GENAPP/LGIPOL02"], "description": "SOAP WSAIP01 (base/cntl/wsaip01.jcl, 99 lines) is an ENTRY POINT job. It runs the DFHLS2WS language structure to WSDL conversion routine, which makes INQUIRE POLICY DETAILS available as SOAP web services for Motor, House, Endowment and Commercial policies. It also does this for a Multiple return for Mobile Sample. It publishes the URIs GENAPP/LGIPOLM1, GENAPP/LGIPOLH1, GENAPP/LGIPOLE1, GENAPP/LGIPOLB1 and GENAPP/LGIPOL02 over a COMMAREA interface. In the dependency map, it dispatches to LGIPOL01 and IPPROGMB. The packet lists no data stores."}, {"id": "IPPROGMB", "name": "IPPROGMB", "kind": "module", "language": "cobol", "loc": 1, "missingSource": true}, {"id": "ws:WSAUC01", "name": "SOAP WSAUC01", "kind": "screen", "language": "jcl", "loc": 23, "file": "base/cntl/wsauc01.jcl", "uris": ["GENAPP/LGUCUS01"], "description": "SOAP WSAUC01 is an entry-point JCL job that runs the DFHLS2WS language-structure-to-WSDL conversion routine for the \"Update CUSTOMER DETAILS\" web service. It turns COBOL program LGUCUS01 into a SOAP service at URI GENAPP/LGUCUS01. It uses member SOAIC01 for both the request and the response, passes data through COMMAREA, and produces LGUCUS01.wsbind and LGUCUS01.wsdl. In the dependency map, its only connection is a dispatch to LGUCUS01. The packet lists no data stores that it reads or writes."}, {"id": "ws:WSAUP01", "name": "SOAP WSAUP01", "kind": "screen", "language": "jcl", "loc": 80, "file": "base/cntl/wsaup01.jcl", "uris": ["GENAPP/LGUPOLM1", "GENAPP/LGUPOLH1", "GENAPP/LGUPOLE1", "GENAPP/LGUPOLB1"], "description": "SOAP WSAUP01 is an ENTRY POINT job (base/cntl/wsaup01.jcl, 80 lines) that runs the LANGUAGE STRUCTURE TO WSDL CONVERSION ROUTINE to expose Update POLICY Details as SOAP web services for Motor Policy, House Policy, Endowment Policy and Commercial Policy. Each DFHLS2WS step generates a WSDL and wsbind for the URIs GENAPP/LGUPOLM1, GENAPP/LGUPOLH1, GENAPP/LGUPOLE1 and GENAPP/LGUPOLB1, using request/response members SOAIPM1, SOAIPH1, SOAIPE1 and SOAIPB1. Its only connection in the dependency map is a dispatch to LGUPOL01, invoked through a COMMAREA interface."}, {"id": "ws:WSAVC01", "name": "SOAP WSAVC01", "kind": "screen", "language": "jcl", "loc": 23, "file": "base/cntl/wsavc01.jcl", "uris": ["GENAPP/LGICVS01"]}, {"id": "ws:WSAVP01", "name": "SOAP WSAVP01", "kind": "screen", "language": "jcl", "loc": 23, "file": "base/cntl/wsavp01.jcl", "uris": ["GENAPP/LGIPVS01"]}]}, {"id": "dom:build", "name": "Build, Install and Topology", "kind": "domain", "children": [{"id": "job:DB2CRE", "name": "DB2CRE", "kind": "job", "language": "jcl", "loc": 1139, "file": "base/cntl/db2cre.jcl", "description": "DB2CRE (base/cntl/db2cre.jcl) is an entry-point setup job that builds the insurance Db2 foundation. Under IKJEFT01 it runs DSNTIAD to create storage group GENASG02, a database and tablespaces GENATS00 through GENATS07. It then creates tables and indexes such as customer, whose customerNumber starts at 1000001, and customer_secure. Its only mapped connections are writes to ds:CLAIM, ds:COMMERCIAL, ds:CUSTOMER, ds:CUSTOMER_SECURE, ds:ENDOWMENT, ds:HOUSE, ds:MOTOR and ds:POLICY. The excerpt stops at the policy step, so the remaining table definitions are not shown."}, {"id": "job:ADEF121", "name": "ADEF121", "kind": "job", "language": "jcl", "loc": 68, "file": "base/cntl/adef121.jcl", "description": "ADEF121 (job GENAVSAM, base/cntl/adef121.jcl) is a batch setup job that rebuilds what appear to be the GenApp customer and policy VSAM files. It runs IDCAMS in each step. DELETE1 and DELETE2 remove the existing clusters, DEFINE1 and DEFINE2 define new indexed clusters, and CUSTDATA and POLYDATA load them with REPRO from input datasets. The dependency map marks it as an entry point. Its only listed connections are writes to ds:KSDSCUST and ds:KSDSPOLY, with no reads or calls."}]}, {"id": "dom:data", "name": "Data stores", "kind": "domain", "children": [{"id": "ds:CLAIM", "name": "CLAIM", "kind": "datastore", "storeType": "Db2 table"}, {"id": "ds:COMMERCIAL", "name": "COMMERCIAL", "kind": "datastore", "storeType": "Db2 table"}, {"id": "ds:CSMT", "name": "CSMT", "kind": "datastore", "storeType": "CICS TDQ"}, {"id": "ds:CUSTOMER", "name": "CUSTOMER", "kind": "datastore", "storeType": "Db2 table"}, {"id": "ds:CUSTOMER_SECURE", "name": "CUSTOMER_SECURE", "kind": "datastore", "storeType": "Db2 table"}, {"id": "ds:ENDOWMENT", "name": "ENDOWMENT", "kind": "datastore", "storeType": "Db2 table"}, {"id": "ds:GENA*-RATES", "name": "GENAnnnV rate queues", "kind": "datastore", "storeType": "CICS TSQ (dynamic name)"}, {"id": "ds:GENA-STATS", "name": "GENA01* stats counters", "kind": "datastore", "storeType": "CICS named counter (pool GENA)"}, {"id": "ds:GENACNTL", "name": "GENACNTL", "kind": "datastore", "storeType": "CICS TSQ"}, {"id": "ds:GENACUSTNUM", "name": "GENACUSTNUM", "kind": "datastore", "storeType": "CICS named counter (pool GENA)"}, {"id": "ds:GENAERRS", "name": "GENAERRS", "kind": "datastore", "storeType": "CICS TSQ"}, {"id": "ds:GENASTAT", "name": "GENASTAT", "kind": "datastore", "storeType": "CICS TSQ"}, {"id": "ds:GENASTRT", "name": "GENASTRT", "kind": "datastore", "storeType": "CICS TSQ"}, {"id": "ds:HOUSE", "name": "HOUSE", "kind": "datastore", "storeType": "Db2 table"}, {"id": "ds:KSDSCUST", "name": "KSDSCUST", "kind": "datastore", "storeType": "VSAM KSDS"}, {"id": "ds:KSDSPOLY", "name": "KSDSPOLY", "kind": "datastore", "storeType": "VSAM KSDS"}, {"id": "ds:MOTOR", "name": "MOTOR", "kind": "datastore", "storeType": "Db2 table"}, {"id": "ds:POLICY", "name": "POLICY", "kind": "datastore", "storeType": "Db2 table"}]}]}, "edges": [{"source": "LGACDB01", "target": "LGACDB02", "kind": "call"}, {"source": "LGACDB01", "target": "LGACVS01", "kind": "call"}, {"source": "LGACDB01", "target": "LGSTSQ", "kind": "call"}, {"source": "LGACDB01", "target": "ds:CUSTOMER", "kind": "write"}, {"source": "LGACDB01", "target": "ds:GENACUSTNUM", "kind": "read"}, {"source": "LGACDB01", "target": "ds:GENACUSTNUM", "kind": "write"}, {"source": "LGACDB02", "target": "LGSTSQ", "kind": "call"}, {"source": "LGACDB02", "target": "ds:CUSTOMER_SECURE", "kind": "write"}, {"source": "LGACUS01", "target": "LGACDB01", "kind": "call"}, {"source": "LGACUS01", "t // ── Layout: circle-pack in a fixed world space ─────────────────────────
// d3.pack gives every node (x, y, r) once; zooming is purely a canvas
// transform, so the layout never recomputes and pan/zoom stays at 60fps.
const WORLD = 8000;
// Leaves without a meaningful LOC (data stores, screens, jobs) get a floor
// based on the median module size so they stay visible next to code.
// LLM-generated data is messy: coerce loc to a finite number everywhere
// (a single NaN propagates through pack() and blanks the whole canvas).
const numLoc = d => { const l = Number(d.loc); return Number.isFinite(l) && l > 0 ? l : 0; };
const locs = [];
(function walk(d) { if (d.children && d.children.length) d.children.forEach(walk);
  else if (numLoc(d) > 1) locs.push(numLoc(d)); })(DATA.root);
locs.sort((a, b) => a - b);
const FLOOR = Math.max(1, Math.round((locs[Math.floor(locs.length / 2)] || 100) * 0.4));
const root = d3.hierarchy(DATA.root, d => d.children)
  .sum(d => (d.children && d.children.length ? 0 : Math.max(numLoc(d), d.kind === "module" ? 1 : FLOOR)))
  .sort((a, b) => b.value - a.value);
d3.pack().size([WORLD, WORLD]).padding(d => Math.max(3, 24 / (d.depth + 1)))(root);

const nodes = [];

  // flows, and entry points bind to the first occurrence.
  for (let k = 2; byId.has(id); k++) id = `${id}~${k}`;
  const n = { id, name: String(d.data.name ?? d.data.id ?? "?"),
    kind: d.data.kind || "module",
    language: d.data.language || null, file: d.data.file || null,
    description: typeof d.data.description === "string" ? d.data.description : null,
    loc: numLoc(d.data), x: d.x, y: d.y, r: d.r, depth: d.depth,
    parentNode: d.parent ? d.parent.__viz : null,
    container: !!(d.children && d.children.length) };

  nodes.push(n); byId.set(n.id, n);

nodes.sort((a, b) => b.r - a.r); // painters: parents under children

const isRevealed = (n, k) => !n.parentNode || n.parentNode.r * k >= REVEAL_R;

const edges = (DATA.edges || [])
  .filter(e => e && byId.has(String(e.source)) && byId.has(String(e.target)))
  .map(e => ({ source: String(e.source), target: String(e.target), kind: e.kind }));

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const vw = innerWidth, vh = innerHeight;
  const bw = Math.round(vw * dpr), bh = Math.round(vh * dpr);
  if (canvas.width !== bw) { canvas.width = bw; canvas.style.width = vw + "px"; }
  if (canvas.height !== bh) { canvas.height = bh; canvas.style.height = vh + "px"; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#1e1e1e"; ctx.fillRect(0, 0, vw, vh);

  const { x: tx, y: ty, k } = transform;
  const flowSet = flowNodeSet();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // Nodes
  for (const n of nodes) {
    const sr = n.r * k;
    if (sr < MIN_R) continue;
    if (!isRevealed(n, k)) continue; // LOD: reveal children gradually
    if (!visible(n, k, tx, ty, vw, vh)) continue;
    const sx = n.x * k + tx, sy = n.y * k + ty;
    const inFlow = flowSet ? flowSet.has(n.id) : true;
    const isSel = selected === n.id, isHov = hovered === n.id;

    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.globalAlpha = (n.container ? 0.55 : 0.85) * (inFlow ? 1 : 0.18);
    ctx.fillStyle = isSel ? "rgba(204,120,92,0.25)" : fillFor(n);
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = isSel ? 2.5 : isHov ? 1.8 : n.container ? 1 : 0.8;
    ctx.strokeStyle = isSel || isHov ? "#cc785c"
      : entrySet.has(n.id) ? "rgba(204,120,92,0.9)"
      : n.container ? "#3a3a3a" : "rgba(212,212,212,0.18)";
    if (entrySet.has(n.id) && !isSel && !isHov) ctx.lineWidth = 1.6;
    if (deadSet.has(n.id)) ctx.setLineDash([5, 4]); // dead-end candidate
    ctx.globalAlpha = inFlow ? 1 : 0.25; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.setLineDash([]);

    if (sr > LABEL_R) {
      const fs = Math.min(17, Math.max(9, sr / 6));
      ctx.font = `${n.container ? "600" : "400"} ${fs}px system-ui, sans-serif`;
      ctx.fillStyle = n.container ? "#8a8a8a" : "#e8e8e8";
      ctx.globalAlpha = inFlow ? 1 : 0.3;
      const ly = n.container && sr > 55 ? sy - sr + fs + 5 : sy;
      const label = n.name.length > 28 ? [...n.name].slice(0, 26).join("") + "…" : n.name;
      ctx.fillText(label, sx, ly);
      ctx.globalAlpha = 1;
    }
  }

  // Edges: batched per kind, endpoints must both be on screen
  const vis = id => { const n = byId.get(id); return n && n.r * k > MIN_R * 2 && isRevealed(n, k) && visible(n, k, tx, ty, vw, vh); };
  const curve = (a, b) => {
    const ax = a.x * k + tx, ay = a.y * k + ty, bx = b.x * k + tx, by = b.y * k + ty;
    if ((ax - bx) ** 2 + (ay - by) ** 2 < 120) return;
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo((ax + bx) / 2 + (by - ay) * 0.12, (ay + by) / 2 + (ax - bx) * 0.12, bx, by);
  };
  if (!flowSet) {
    for (const [kind, style] of Object.entries(EDGE_STYLE)) {
      if (!kindOn[kind]) continue;
      const bucket = edgesByKind.get(kind);
      if (!bucket) continue;
      ctx.strokeStyle = style.color; ctx.lineWidth = 0.8; ctx.beginPath();
      let drawn = 0;
      for (const e of bucket) {
        if (!vis(e.source) || !vis(e.target)) continue;
        curve(byId.get(e.source), byId.get(e.target));
        if (++drawn > 1200) break;
      }
      ctx.stroke();
    }
  }

  // Focus edges (hover/selection) in accent, on top
  const focus = hovered || selected;
  if (focus && !flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const e of adjacency.get(focus) || []) {
      const a = byId.get(e.source), b = byId.get(e.target);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
  }

  // Active flow: numbered step path
  if (flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 2;
    const seq = activeFlow._seq;
    ctx.beginPath();
    for (let i = 0; i + 1 < seq.length; i++) {
      const a = byId.get(seq[i]), b = byId.get(seq[i + 1]);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
    seq.forEach((id, i) => {
      const n = byId.get(id); if (!n) return;
      const sx = n.x * k + tx, sy = n.y * k + ty - n.r * k - 10;
      ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#cc785c"; ctx.fill();
      ctx.fillStyle = "#1e1e1e"; ctx.font = "700 11px system-ui, sans-serif";
      ctx.fillText(String(i + 1), sx, sy + 0.5);
    });
  }
}

// ── Zoom / pan / hit-testing ────────────────────────────────────────────
// Max zoom scales with the smallest leaf so deep estates stay reachable.
const leafRs = nodes.filter(n => !n.container).map(n => n.r);
const MAX_K = Math.max(600, Math.ceil(140 / Math.max(1e-6, Math.min(...leafRs))));
const zoomB = d3.zoom().scaleExtent([0.05, MAX_K]).clickDistance(4)
  .on("zoom", ev => { transform = ev.transform; requestDraw(); })
  .on("start", () => canvas.classList.add("dragging"))
  .on("end", () => canvas.classList.remove("dragging"));
const sel = d3.select(canvas).call(zoomB).on("dblclick.zoom", null);

function hit(mx, my) {
  const wx = (mx - transform.x) / transform.k, wy = (my - transform.y) / transform.k;
  let best = null;
  for (const n of nodes) {
    if (n.r * transform.k < MIN_R) continue;
    // Mirror the draw-time LOD rule so hidden nodes can't be clicked.
    if (!isRevealed(n, transform.k)) continue;
    const dx = wx - n.x, dy = wy - n.y;
    if (dx * dx + dy * dy <= n.r * n.r && (!best || n.r < best.r)) best = n;
  }
  return best;
}
let flyGen = 0;
function flyTo(n) {
  const gen = ++flyGen; // a newer flyTo (or Escape) cancels this one
  const vw = innerWidth, vh = innerHeight, cur = transform;
  const from = [(vw / 2 - cur.x) / cur.k, (vh / 2 - cur.y) / cur.k, Math.min(vw, vh) / cur.k];
  const targetW = Math.max(n.r * 2.6, Math.min(vw, vh) / MAX_K); // respect scaleExtent
  const interp = d3.interpolateZoom(from, [n.x, n.y, targetW]);
  const dur = Math.max(400, interp.duration * 0.55), t0 = performance.now();
  (function step() {
    if (gen !== flyGen) return;
    const t = Math.min(1, (performance.now() - t0) / dur);
    const [cx, cy, w] = interp(d3.easeCubicInOut(t));
    const k = Math.min(vw, vh) / w;
    sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - cx * k, vh / 2 - cy * k).scale(k));
    if (t < 1) requestAnimationFrame(step);
  })();
}
canvas.addEventListener("mousemove", e => {
  const h = hit(e.offsetX, e.offsetY);
  const id = h ? h.id : null;
  if (id !== hovered) { hovered = id; canvas.style.cursor = h ? "pointer" : "grab"; requestDraw(); }
});
canvas.addEventListener("click", e => {
  const h = hit(e.offsetX, e.offsetY);
  if (activeFlow && h) setFlow(""); // leave the walkthrough to inspect a node
  selected = h ? h.id : null;
  resultsEl.innerHTML = "";
  renderSidebar(); requestDraw();
});
canvas.addEventListener("dblclick", e => { const h = hit(e.offsetX, e.offsetY); if (h) flyTo(h); });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Escape inside the search box or flow select should only affect that
  // control, not reset the whole viewport.
  if (e.target === searchEl || (e.target && e.target.tagName === "SELECT")) return;
  flyGen++; selected = null; resultsEl.innerHTML = "";
  setFlow(""); flyTo(nodes[0]); renderSidebar();
});
addEventListener("resize", requestDraw);

// ── Sidebar ─────────────────────────────────────────────────────────────
const sidebar = document.getElementById("sidebar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderSidebar() {
  if (activeFlow) return renderFlowSidebar();
  if (!selected) { sidebar.classList.remove("open"); return; }
  const n = byId.get(selected);
  const neighbors = [];
  for (const e of edges) {
    if (e.source === n.id) neighbors.push({ id: e.target, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "→" });
    else if (e.target === n.id) neighbors.push({ id: e.source, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "←" });
  }
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.kind)}${n.language ? " · " + esc(n.language) : ""}${n.loc ? " · " + n.loc.toLocaleString() + " LOC" : ""}</div>${n.description ? `<p class="desc">${esc(n.description)}<span class="cap">written by Claude from a source excerpt and the node's connections</span></p>` : ""}
    <div>${entrySet.has(n.id) ? '<span class="badge entry">entry point</span>' : ""}
      ${deadSet.has(n.id) ? '<span class="badge">dead-end candidate</span>' : ""}
      <span class="badge">fan-in ${fanIn.get(n.id) || 0}</span>
      <span class="badge">fan-out ${fanOut.get(n.id) || 0}</span></div>
    ${n.file ? `<h3>Source</h3><div class="meta">${esc(n.file)}</div>` : ""}
    ${neighbors.length ? `<h3>Connections (${neighbors.length})</h3>` +
      neighbors.slice(0, 40).map(x => `<span class="link" data-id="${esc(x.id)}">${x.dir} ${esc(byId.get(x.id)?.name || x.id)} <span class="kind">${esc(x.rel)}</span></span>`).join("") +
      (neighbors.length > 40 ? `<div class="meta">…and ${neighbors.length - 40} more</div>` : "") : ""}`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => { selected = null; renderSidebar(); requestDraw(); };
  sidebar.querySelectorAll(".link").forEach(el => el.onclick = () => {
    const t = byId.get(el.dataset.id);
    if (t) { selected = t.id; flyTo(t); renderSidebar(); requestDraw(); }
  });
}
function renderFlowSidebar() {
  const f = activeFlow;
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(f.name)}</h2>
    <div class="meta">${f.persona ? "Persona: " + esc(f.persona) : ""}</div>
    ${f.description ? `<p style="font-size:13px">${esc(f.description)}</p>` : ""}
    <h3>Steps</h3>
    <ol>${f.steps.map(s => `<li>${esc(s.label)}${(s.nodes || []).length ?
      `<div class="meta">${s.nodes.map(id => esc(byId.get(id)?.name || id)).join(" → ")}</div>` : ""}</li>`).join("")}</ol>`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => setFlow("");
}

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
</html>
