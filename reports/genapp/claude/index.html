last customer.", "fields": {}, "other": "", "requirements": ["claude/ops/03/REQ-F-007", "claude/ops/03/REQ-F-008"], "questions": ["claude/ops/03/OQ-003"]}, {"id": "claude/ops/03#4", "function": "claude/ops/03", "number": 4, "title": "Reset statistics counters", "story": "As an Operations supervisor, I want all business-volume counters set back to zero on reset, so that a new monitoring period starts.", "fields": {}, "other": "", "requirements": ["claude/ops/03/REQ-F-009", "claude/ops/03/REQ-F-010"], "questions": []}, {"id": "claude/ops/03#5", "function": "claude/ops/03", "number": 5, "title": "Clear operational logs", "story": "As an Operations supervisor, I want accumulated error, start-up and statistics history cleared on reset, so that the day starts from a clean state.", "fields": {}, "other": "", "requirements": ["claude/ops/03/REQ-F-011", "claude/ops/03/REQ-F-012", "claude/ops/03/REQ-F-013"], "questions": []}, {"id": "claude/wsim/01#1", "function": "claude/wsim/01", "number": 1, "title": "Maintain the simulation customer number range", "story": "As a workload simulation operator, I want the range of customer numbers for simulated traffic held in a shared control queue that sets itself up, so that customer inquiry simulations always have a working range.", "fields": {}, "other": "", "requirements": ["claude/wsim/01/REQ-F-001", "claude/wsim/01/REQ-F-002", "claude/wsim/01/REQ-F-003", "claude/wsim/01/REQ-F-004", "claude/wsim/01/REQ-F-005", "claude/wsim/01/REQ-N-001"], "questions": []}, {"id": "claude/wsim/01#2", "function": "claude/wsim/01", "number": 2, "title": "Pick a random existing customer", "story": "As a workload simulation operator, I want each simulated customer inquiry to pick a pseudo-random customer within the control range, so that simulated traffic is spread across existing customers.", "fields": {}, "other": "", "requirements": ["claude/wsim/01/REQ-F-006", "claude/wsim/01/REQ-F-007", "claude/wsim/01/REQ-F-008", "claude/wsim/01/REQ-F-009", "claude/wsim/01/REQ-F-010", "claude/wsim/01/REQ-N-002", "claude/wsim/01/REQ-N-003"], "questions": []}, {"id": "claude/wsim/02#1", "function": "claude/wsim/02", "number": 1, "title": "Look up a policy by type and customer number", "story": "As a workload simulation caller, I want to supply a policy type and customer number and get back the first matching policy key, so that simulated policy inquiries hit real policies.", "fields": {}, "other": "", "requirements": ["claude/wsim/02/REQ-F-001", "claude/wsim/02/REQ-F-002", "claude/wsim/02/REQ-F-003", "claude/wsim/02/REQ-F-004", "claude/wsim/02/REQ-F-005"], "questions": ["claude/wsim/02/OQ-001"]}, {"id": "claude/wsim/02#2", "function": "claude/wsim/02", "number": 2, "title": "Reject mismatched or failed policy lookups", "story": "As a workload simulation caller, I want a clear 'Policy Bad=' response when the lookup fails or finds a policy of the wrong type, so that I do not treat it as a real policy key.", "fields": {}, "other": "", "requirements": ["claude/wsim/02/REQ-F-006", "claude/wsim/02/REQ-F-007", "claude/wsim/02/REQ-F-008", "claude/wsim/02/REQ-F-009"], "questions": []}], "requirements": [{"key": "claude/customer/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If an add-customer request is shorter than 90 bytes (the 18-byte header plus 72 bytes of customer data), then the system shall set return code '98' and return without touching the database.", "capability": "claude/customer/01#1", "function": "claude/customer/01", "rules": ["claude/RULE-018"], "sources": ["base/src/lgacus01.cbl:94-115", "base/src/lgacdb01.cbl:149-168"], "programs": ["LGACUS01"]}, {"key": "claude/customer/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If an add-customer request arrives with no data at all, then the system shall log an error message and abend the task with code 'LGCA'.", "capability": "claude/customer/01#1", "function": "claude/customer/01", "rules": ["claude/RULE-018"], "sources": ["base/src/lgacus01.cbl:94-115"], "programs": ["LGACUS01"]}, {"key": "claude/customer/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If a call to add a customer's security record arrives with a request area length of 0, then the system shall log the error message ' NO COMMAREA RECEIVED' and abend the transaction with code LGCA.", "capability": "claude/customer/01#1", "function": "claude/customer/01", "rules": ["claude/RULE-046"], "sources": ["base/src/lgacdb02.cbl:130-135"], "programs": ["LGICDB01"]}, {"key": "claude/customer/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When an add-customer request passes the length check, the system shall reset the return code and the number of policies to 0 before processing.", "capability": "claude/customer/01#1", "function": "claude/customer/01", "rules": ["claude/RULE-018"], "sources": ["base/src/lgacus01.cbl:94-115"], "programs": ["LGACUS01"]}, {"key": "claude/customer/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a valid add-customer request is processed, the system shall obtain the new customer number from the shared CICS named counter 'GENACUSTNUM' in pool 'GENA'.", "capability": "claude/customer/01#2", "function": "claude/customer/01", "rules": ["claude/RULE-001"], "sources": ["base/src/lgacdb01.cbl:199-285"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the GENACUSTNUM counter response is not NORMAL, then the system shall insert the customer row with CUSTOMERNUMBER DEFAULT so that DB2 assigns the number with an identity column, and shall return the value from IDENTITY_VAL_LOCAL().", "capability": "claude/customer/01#2", "function": "claude/customer/01", "rules": ["claude/RULE-001"], "sources": ["base/src/lgacdb01.cbl:250-282"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the customer row has been inserted, the system shall return the allocated customer number to the caller as a 10-digit customer number (for example 0001000042).", "capability": "claude/customer/01#2", "function": "claude/customer/01", "rules": ["claude/RULE-001"], "sources": ["base/src/lgacdb01.cbl:199-285"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When an add-customer request passes the length check, the system shall insert one CUSTOMER row holding first name, last name, date of birth, house name, house number, postcode, mobile phone, home phone and email address.", "capability": "claude/customer/01#3", "function": "claude/customer/01", "rules": ["claude/RULE-049"], "sources": ["base/src/lgacdb01.cbl:215-287"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the insert into CUSTOMER returns a non-zero SQLCODE (for example -803 duplicate key, or -180 for an invalid DOB value), then the system shall set return code '90', write an error message with the SQLCODE to the queue through LGSTSQ, and return without creating the VSAM copy or the security record.", "capability": "claude/customer/01#3", "function": "claude/customer/01", "rules": ["claude/RULE-049"], "sources": ["base/src/lgacdb01.cbl:215-287"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the customer insert succeeds, the system shall leave the return code at '00'.", "capability": "claude/customer/01#3", "function": "claude/customer/01", "rules": ["claude/RULE-049"], "sources": ["base/src/lgacdb01.cbl:215-287"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the CUSTOMER insert has succeeded, the system shall request a customer-security record through LGACDB02 with request id '02ACUS' for the new customer number, holding the default password hash, count '0000' and state 'N'.", "capability": "claude/customer/01#4", "function": "claude/customer/01", "rules": ["claude/RULE-048"], "sources": ["base/src/lgacdb01.cbl:179-189"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the CUSTOMER insert fails, then the system shall not create the customer-security record.", "capability": "claude/customer/01#4", "function": "claude/customer/01", "rules": ["claude/RULE-048", "claude/RULE-049"], "sources": ["base/src/lgacdb01.cbl:179-189", "base/src/lgacdb01.cbl:215-287"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the DB2 customer insert succeeds, the system shall pass the first 225 bytes of the request (customer number plus customer details) to LGACVS01.", "capability": "claude/customer/01#5", "function": "claude/customer/01", "rules": ["claude/RULE-084"], "sources": ["base/src/lgacdb01.cbl:174-177"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the DB2 customer insert fails with return code '90', then the system shall skip the copy to the VSAM customer file.", "capability": "claude/customer/01#5", "function": "claude/customer/01", "rules": ["claude/RULE-084", "claude/RULE-049"], "sources": ["base/src/lgacdb01.cbl:174-177"], "programs": ["LGACDB01"]}, {"key": "claude/customer/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When a customer is registered, the system shall write a 225-byte customer record to KSDSCUST keyed by the 10-digit customer number, holding name, DOB, house name/number, postcode, number of policies, mobile, home phone and email exactly as received.", "capability": "claude/customer/01#5", "function": "claude/customer/01", "rules": ["claude/RULE-050"], "sources": ["base/src/lgacvs01.cbl:66-81"], "programs": ["LGACVS01"]}, {"key": "claude/customer/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the write to KSDSCUST fails for any reason, including a customer number that already exists (DUPREC), then the system shall set return code '80', log an error, and abend the task with code LGV0 without a dump.", "capability": "claude/customer/01#5", "function": "claude/customer/01", "rules": ["claude/RULE-050"], "sources": ["base/src/lgacvs01.cbl:66-81"], "programs": ["LGACVS01"]}, {"key": "claude/customer/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If a customer inquiry request is shorter than 90 bytes (72 bytes of customer data plus the 18-byte header/trailer), then the system shall set return code '98' and return without reading the database.", "capability": "claude/customer/02#1", "function": "claude/customer/02", "rules": ["claude/RULE-026", "claude/RULE-018"], "sources": ["base/src/lgicdb01.cbl:136-143", "base/src/lgicus01.cbl:87-107"], "programs": ["LGACUS01", "LGICDB01"]}, {"key": "claude/customer/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a customer inquiry request is 90 bytes or larger, the system shall proceed with the inquiry.", "capability": "claude/customer/02#1", "function": "claude/customer/02", "rules": ["claude/RULE-026"], "sources": ["base/src/lgicdb01.cbl:136-143"], "programs": ["LGICDB01"]}, {"key": "claude/customer/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If a customer inquiry arrives with a request area length of 0, then the system shall log the error message ' NO COMMAREA RECEIVED' and abend the transaction with code LGCA.", "capability": "claude/customer/02#1", "function": "claude/customer/02", "rules": ["claude/RULE-046", "claude/RULE-026", "claude/RULE-018"], "sources": ["base/src/lgicdb01.cbl:118-123"], "programs": ["LGACUS01", "LGICDB01"]}, {"key": "claude/customer/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When an inquiry finds the customer number in the CUSTOMER table, the system shall return return code '00' with first name, last name, DOB, house name, house number, postcode, mobile, home phone and email.", "capability": "claude/customer/02#2", "function": "claude/customer/02", "rules": ["claude/RULE-027"], "sources": ["base/src/lgicdb01.cbl:167-203"], "programs": ["LGICDB01"]}, {"key": "claude/customer/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the customer is not found (SQLCODE 100) or the lookup hits a deadlock/timeout (SQLCODE -913), then the system shall return return code '01'.", "capability": "claude/customer/02#2", "function": "claude/customer/02", "rules": ["claude/RULE-027"], "sources": ["base/src/lgicdb01.cbl:167-203"], "programs": ["LGICDB01"]}, {"key": "claude/customer/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the lookup fails with any other database error, then the system shall return return code '90' and write an error log entry.", "capability": "claude/customer/02#2", "function": "claude/customer/02", "rules": ["claude/RULE-027"], "sources": ["base/src/lgicdb01.cbl:167-203"], "programs": ["LGICDB01"]}, {"key": "claude/customer/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a customer update request carries request id '01UCUS', the system shall reset the number of policies to 0 and pass the request on to update the customer.", "capability": "claude/customer/03#1", "function": "claude/customer/03", "rules": ["claude/RULE-042"], "sources": ["base/src/lgucus01.cbl:98-116"], "programs": ["LGUCUS01"]}, {"key": "claude/customer/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If a customer update request carries any request id other than '01UCUS', then the system shall set return code '99' and return without updating anything.", "capability": "claude/customer/03#1", "function": "claude/customer/03", "rules": ["claude/RULE-042"], "sources": ["base/src/lgucus01.cbl:98-116"], "programs": ["LGUCUS01"]}, {"key": "claude/customer/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If a customer update arrives with a request area length of 0, then the system shall log the error message ' NO COMMAREA RECEIVED' and abend the transaction with code LGCA.", "capability": "claude/customer/03#1", "function": "claude/customer/03", "rules": ["claude/RULE-046", "claude/RULE-042"], "sources": ["base/src/lgucdb01.cbl:116-121"], "programs": ["LGICDB01", "LGUCUS01"]}, {"key": "claude/customer/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When a customer update is processed, the system shall overwrite all nine columns (first name, last name, DOB, house name, house number, postcode, mobile, home phone and email) with the supplied values, including blank values, and return return code '00'.", "capability": "claude/customer/03#2", "function": "claude/customer/03", "rules": ["claude/RULE-073"], "sources": ["base/src/lgucdb01.cbl:152-181"], "programs": ["LGUCDB01"]}, {"key": "claude/customer/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the customer to be updated does not exist (SQLCODE 100), then the system shall return return code '01'.", "capability": "claude/customer/03#2", "function": "claude/customer/03", "rules": ["claude/RULE-073"], "sources": ["base/src/lgucdb01.cbl:152-181"], "programs": ["LGUCDB01"]}, {"key": "claude/customer/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the customer update fails with any other SQL error, then the system shall return return code '90' and write an error log entry.", "capability": "claude/customer/03#2", "function": "claude/customer/03", "rules": ["claude/RULE-073"], "sources": ["base/src/lgucdb01.cbl:152-181"], "programs": ["LGUCDB01"]}, {"key": "claude/customer/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the DB2 customer update completes with any result ('00', '01' or '90'), the system shall invoke LGUCVS01 with the first 225 bytes of the request area.", "capability": "claude/customer/03#3", "function": "claude/customer/03", "rules": ["claude/RULE-091"], "sources": ["base/src/lgucdb01.cbl:133-143"], "programs": ["LGUCDB01"]}, {"key": "claude/customer/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the customer master file update runs, the system shall read the existing KSDSCUST record for update (locked) by the 10-digit customer number and rewrite it in full with the 225 bytes from the request.", "capability": "claude/customer/03#3", "function": "claude/customer/03", "rules": ["claude/RULE-074"], "sources": ["base/src/lgucvs01.cbl:67-96"], "programs": ["LGUCVS01"]}, {"key": "claude/customer/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the customer record is not found in KSDSCUST (NOTFND) or the read fails, then the system shall set return code '81' and abend the task with code LGV1.", "capability": "claude/customer/03#3", "function": "claude/customer/03", "rules": ["claude/RULE-074"], "sources": ["base/src/lgucvs01.cbl:67-96"], "programs": ["LGUCVS01"]}, {"key": "claude/customer/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the rewrite of the KSDSCUST record fails, then the system shall set return code '82' and abend the task with code LGV2.", "capability": "claude/customer/03#3", "function": "claude/customer/03", "rules": ["claude/RULE-074"], "sources": ["base/src/lgucvs01.cbl:67-96"], "programs": ["LGUCVS01"]}, {"key": "claude/customer/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a customer-file add or update fails, the system shall send a message to LGSTSQ holding the date (MMDDYYYY), time, program name, customer number and the CICS RESP and RESP2 codes.", "capability": "claude/customer/04#1", "function": "claude/customer/04", "rules": ["claude/RULE-094"], "sources": ["base/src/lgacvs01.cbl:89-120", "base/src/lgucvs01.cbl:104-135"], "programs": ["LGACVS01"]}, {"key": "claude/customer/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a customer-file failure is logged and the request area is not empty, the system shall send a second message 'COMMAREA=' followed by up to the first 90 bytes of the request.", "capability": "claude/customer/04#1", "function": "claude/customer/04", "rules": ["claude/RULE-094"], "sources": ["base/src/lgacvs01.cbl:89-120"], "programs": ["LGACVS01"]}, {"key": "claude/customer/04/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall limit the request excerpt written to the error log to the first 90 bytes of the request area.", "capability": "claude/customer/04#1", "function": "claude/customer/04", "rules": ["claude/RULE-094", "claude/RULE-046"], "sources": ["base/src/lgacvs01.cbl:89-120", "base/src/lgicdb01.cbl:118-123"], "programs": ["LGACVS01", "LGICDB01"]}, {"key": "claude/policy/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If an add-policy request arrives with no data at all, then the system shall log 'NO COMMAREA RECEIVED' and end the transaction with abend LGCA.", "capability": "claude/policy/01#1", "function": "claude/policy/01", "rules": ["claude/RULE-019", "claude/RULE-093"], "sources": ["base/src/lgapdb01.cbl:164-213", "base/src/lgupol01.cbl:98-141"], "programs": ["LGAPDB01", "LGUPOL01"]}, {"key": "claude/policy/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If an add-policy request is shorter than the 28-byte header, then the system shall set return code '98' and not process the request.", "capability": "claude/policy/01#1", "function": "claude/policy/01", "rules": ["claude/RULE-022", "claude/RULE-093"], "sources": ["base/src/lgapol01.cbl:104-124"], "programs": ["LGAPOL01", "LGUPOL01"]}, {"key": "claude/policy/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When an add-policy request of 28 bytes or more is received, the system shall forward it to LGAPDB01 with the return code initialised to '00'.", "capability": "claude/policy/01#1", "function": "claude/policy/01", "rules": ["claude/RULE-022"], "sources": ["base/src/lgapol01.cbl:104-124"], "programs": ["LGAPOL01"]}, {"key": "claude/policy/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When an add-policy request is checked, the system shall set the one-letter policy type from the request ID: '01AEND' -> 'E' Endowment, '01AHOU' -> 'H' House, '01AMOT' -> 'M' Motor, '01ACOM' -> 'C' Commercial.", "capability": "claude/policy/01#1", "function": "claude/policy/01", "rules": ["claude/RULE-020"], "sources": ["base/src/lgapdb01.cbl:184-207"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Unwanted", "text": "If the add-policy request ID is not one of '01AEND', '01AHOU', '01AMOT' or '01ACOM' (matched exactly and case-sensitively), then the system shall set return code '99' and insert nothing.", "capability": "claude/policy/01#1", "function": "claude/policy/01", "rules": ["claude/RULE-020", "claude/RULE-093"], "sources": ["base/src/lgapdb01.cbl:184-207"], "programs": ["LGAPDB01", "LGUPOL01"]}, {"key": "claude/policy/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If an add request is shorter than the 28-byte header plus the full detail block for its policy type (Endowment 152, House 158, Motor 165, Commercial 1202 bytes in total), then the system shall reject it with return code '98' and insert nothing.", "capability": "claude/policy/01#1", "function": "claude/policy/01", "rules": ["claude/RULE-019"], "sources": ["base/src/lgapdb01.cbl:164-213"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the POLICY insert succeeds, the system shall store the customer number, issue date, expiry date, broker ID, broker's reference and payment from the request, with a database-assigned policy number, the policy type and LASTCHANGED = CURRENT TIMESTAMP.", "capability": "claude/policy/01#2", "function": "claude/policy/01", "rules": ["claude/RULE-051"], "sources": ["base/src/lgapdb01.cbl:261-321"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the POLICY insert succeeds, the system shall return the new policy number in CA-POLICY-NUM, the stored timestamp in CA-LASTCHANGED and return code '00'.", "capability": "claude/policy/01#2", "function": "claude/policy/01", "rules": ["claude/RULE-051"], "sources": ["base/src/lgapdb01.cbl:261-321"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the POLICY insert fails with SQLCODE -530 because the customer number does not exist, then the system shall set return code '70', log an error message with the customer number, and return without inserting any product details.", "capability": "claude/policy/01#2", "function": "claude/policy/01", "rules": ["claude/RULE-021"], "sources": ["base/src/lgapdb01.cbl:290-305"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the POLICY insert fails with any other non-zero SQLCODE, then the system shall set return code '90', log the error and create no policy.", "capability": "claude/policy/01#2", "function": "claude/policy/01", "rules": ["claude/RULE-021"], "sources": ["base/src/lgapdb01.cbl:290-305"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When a Motor policy is added, the system shall store the caller's vehicle details, premium and accident count exactly as supplied, without adjusting the premium for accidents, CC or value.", "capability": "claude/policy/01#3", "function": "claude/policy/01", "rules": ["claude/RULE-002"], "sources": ["base/src/lgapdb01.cbl:440-471"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When a House policy is added, the system shall store property type, bedrooms, value and address as supplied.", "capability": "claude/policy/01#3", "function": "claude/policy/01", "rules": ["claude/RULE-002"], "sources": ["base/src/lgapdb01.cbl:440-471"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When an Endowment policy is added, the system shall store with-profits, equities, managed fund, fund name, term, sum assured and life assured.", "capability": "claude/policy/01#3", "function": "claude/policy/01", "rules": ["claude/RULE-015"], "sources": ["base/src/lgapdb01.cbl:339-387"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Optional", "text": "Where an Endowment add request is longer than 152 bytes, the system shall store the bytes beyond the required 152 as variable-length padding data (PADDINGDATA, length = request length - 152) on the endowment record.", "capability": "claude/policy/01#3", "function": "claude/policy/01", "rules": ["claude/RULE-015", "claude/RULE-019"], "sources": ["base/src/lgapdb01.cbl:339-387"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If an Endowment add request is exactly 152 bytes, then the system shall store the endowment record without padding data.", "capability": "claude/policy/01#3", "function": "claude/policy/01", "rules": ["claude/RULE-015"], "sources": ["base/src/lgapdb01.cbl:339-387"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When a Commercial policy is added, the system shall set its request date to the new policy's last-changed timestamp, its start date to the policy issue date and its renewal date to the policy expiry date.", "capability": "claude/policy/01#3", "function": "claude/policy/01", "rules": ["claude/RULE-055"], "sources": ["base/src/lgapdb01.cbl:486-545"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When a Commercial policy is added, the system shall store the Fire, Crime, Flood and Weather peril indicators and premiums, the status and the rejection reason exactly as the caller sent them, without calculating any premium or deriving any status.", "capability": "claude/policy/01#3", "function": "claude/policy/01", "rules": ["claude/RULE-055"], "sources": ["base/src/lgapdb01.cbl:486-545"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If the product detail insert (Endowment, House, Motor or Commercial) fails after the policy header was inserted, then the system shall set return code '90', log the error and abend with LGSQ so that the policy header is backed out and no partial policy is left.", "capability": "claude/policy/01#3", "function": "claude/policy/01", "rules": ["claude/RULE-083"], "sources": ["base/src/lgapdb01.cbl:389-395"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When all inserts for a new policy succeed, the system shall pass the full request, including the new policy number and timestamp, to LGAPVS01 before control returns to the caller.", "capability": "claude/policy/01#4", "function": "claude/policy/01", "rules": ["claude/RULE-054"], "sources": ["base/src/lgapdb01.cbl:243-246"], "programs": ["LGAPDB01"]}, {"key": "claude/policy/01/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When a policy is added, the system shall write a new 64-byte record to the KSDSPOLY policy file whose 21-byte key is the policy-type letter (the 4th character of the request ID) plus the customer number and policy number.", "capability": "claude/policy/01#4", "function": "claude/policy/01", "rules": ["claude/RULE-056", "claude/RULE-085"], "sources": ["base/src/lgapvs01.cbl:135-147", "base/src/lgapvs01.cbl:99-132"], "programs": ["LGAPVS01"]}, {"key": "claude/policy/01/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall hold in the 43 bytes after the policy-file key only the details for that policy type: Commercial (postcode 8, status 4, customer 31), Endowment (with-profits 1, equities 1, managed-fund 1, fund name 10, life assured 30), House (property type 15, bedrooms 3, value 8, postcode 8, house name 9), Motor (make 15, model 15, value 6, reg number 7).", "capability": "claude/policy/01#4", "function": "claude/policy/01", "rules": ["claude/RULE-085"], "sources": ["base/src/lgapvs01.cbl:99-132"], "programs": ["LGAPVS01"]}, {"key": "claude/policy/01/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Unwanted", "text": "If the policy-file write fails for any reason, including a duplicate key, then the system shall set return code '80', log the error and return control to the caller.", "capability": "claude/policy/01#4", "function": "claude/policy/01", "rules": ["claude/RULE-056"], "sources": ["base/src/lgapvs01.cbl:135-147"], "programs": ["LGAPVS01"]}, {"key": "claude/policy/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If a policy inquiry is invoked without any request data, then the system shall log ' NO COMMAREA RECEIVED' and abend the transaction with code LGCA.", "capability": "claude/policy/02#1", "function": "claude/policy/02", "rules": ["claude/RULE-028", "claude/RULE-030", "claude/RULE-093"], "sources": ["base/src/lgipdb01.cbl:251-258", "base/src/lgipol01.cbl:78-94"], "programs": ["LGIPDB01", "LGIPOL01", "LGUPOL01"]}, {"key": "claude/policy/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a policy inquiry with any data is received, the system shall set return code '00' and forward it to LGIPDB01 without a minimum-length or request-type check at that layer.", "capability": "claude/policy/02#1", "function": "claude/policy/02", "rules": ["claude/RULE-030", "claude/RULE-028"], "sources": ["base/src/lgipol01.cbl:78-94"], "programs": ["LGIPDB01", "LGIPOL01"]}, {"key": "claude/policy/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a policy inquiry runs, the system shall upper-case the request ID and perform the inquiry it names: 01IEND (endowment), 01IHOU (house), 01IMOT (motor), 01ICOM (commercial by customer+policy), 02ICOM (commercial by policy only), 03ICOM (all commercial policies for a customer) or 05ICOM (commercial policies by zip/postcode).", "capability": "claude/policy/02#1", "function": "claude/policy/02", "rules": ["claude/RULE-029"], "sources": ["base/src/lgipdb01.cbl:275-310"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the inquiry request ID is not recognised, then the system shall return code '99' with no data.", "capability": "claude/policy/02#1", "function": "claude/policy/02", "rules": ["claude/RULE-029", "claude/RULE-093"], "sources": ["base/src/lgipdb01.cbl:275-310"], "programs": ["LGIPDB01", "LGUPOL01"]}, {"key": "claude/policy/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a 01IEND, 01IHOU, 01IMOT or 01ICOM inquiry is made, the system shall return the policy's details only if a row matches POLICY.CUSTOMERNUMBER = customer AND POLICY.POLICYNUMBER = policy in that product's table, with return code '00'.", "capability": "claude/policy/02#2", "function": "claude/policy/02", "rules": ["claude/RULE-016"], "sources": ["base/src/lgipdb01.cbl:327-431"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If no row matches the customer and policy number for the requested product type, then the system shall return code '01' (not found).", "capability": "claude/policy/02#2", "function": "claude/policy/02", "rules": ["claude/RULE-016"], "sources": ["base/src/lgipdb01.cbl:327-431"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If any other database error occurs during a single-policy inquiry, then the system shall return code '90' and write an error message (date, time, customer, policy, SQLCODE plus up to 90 bytes of commarea) via LGSTSQ.", "capability": "claude/policy/02#2", "function": "claude/policy/02", "rules": ["claude/RULE-016"], "sources": ["base/src/lgipdb01.cbl:327-431"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the caller's area is smaller than the required response size (header/trailer 33 plus the full policy layout: Endowment 124, House 130, Motor 137, Commercial 1174, plus the endowment padding length when non-null), then the system shall return code '98' and no policy data.", "capability": "claude/policy/02#2", "function": "claude/policy/02", "rules": ["claude/RULE-006"], "sources": ["base/src/lgipdb01.cbl:370-417"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "State-driven", "text": "While broker ID or payment is null in the database, the system shall not copy it to the response, so that initialised (zero) values are returned.", "capability": "claude/policy/02#2", "function": "claude/policy/02", "rules": ["claude/RULE-047"], "sources": ["base/src/lgipdb01.cbl:394-405"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a single-policy inquiry succeeds, the system shall write the literal 'FINAL' immediately after the policy data so the caller knows where the record ends.", "capability": "claude/policy/02#2", "function": "claude/policy/02", "rules": ["claude/RULE-096", "claude/RULE-006"], "sources": ["base/src/lgipdb01.cbl:507-508", "base/src/lgipdb01.cbl:370-417"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When a 01ICOM, 02ICOM, 03ICOM or 05ICOM inquiry returns a commercial policy, the system shall report RequestDate as the last-changed date, StartDate as the issue date and RenewalDate as the expiry date in the common policy section.", "capability": "claude/policy/02#3", "function": "claude/policy/02", "rules": ["claude/RULE-059"], "sources": ["base/src/lgipdb01.cbl:631-678"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When a commercial inquiry succeeds, the system shall return the status, rejection reason and the fire, crime, flood and weather peril indicators and premiums exactly as stored, without recalculation or status interpretation.", "capability": "claude/policy/02#3", "function": "claude/policy/02", "rules": ["claude/RULE-060"], "sources": ["base/src/lgipdb01.cbl:692-704"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When a 02ICOM inquiry is made, the system shall look up the commercial policy by policy number only and return the owning customer number in the response.", "capability": "claude/policy/02#4", "function": "claude/policy/02", "rules": ["claude/RULE-086"], "sources": ["base/src/lgipdb01.cbl:730-829"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When a 03ICOM inquiry is made, the system shall retrieve the customer's commercial policies through a cursor that stops fetching once the row count exceeds 20.", "capability": "claude/policy/02#4", "function": "claude/policy/02", "rules": ["claude/RULE-087"], "sources": ["base/src/lgipdb01.cbl:835-913"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When a 05ICOM inquiry is made, the system shall retrieve commercial policies by postcode with no row cap.", "capability": "claude/policy/02#4", "function": "claude/policy/02", "rules": ["claude/RULE-087"], "sources": ["base/src/lgipdb01.cbl:835-913"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the commercial-list cursor fails to open, then the system shall return code '89', and if it fails to close, then the system shall return code '88'.", "capability": "claude/policy/02#4", "function": "claude/policy/02", "rules": ["claude/RULE-087"], "sources": ["base/src/lgipdb01.cbl:835-913"], "programs": ["LGIPDB01"]}, {"key": "claude/policy/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If a policy update request arrives with no data, then the system shall log ' NO COMMAREA RECEIVED' and abend the task with code LGCA without attempting any database work.", "capability": "claude/policy/03#1", "function": "claude/policy/03", "rules": ["claude/RULE-043", "claude/RULE-093"], "sources": ["base/src/lgupdb01.cbl:183-187", "base/src/lgupol01.cbl:98-141"], "programs": ["LGUPDB01", "LGUPOL01"]}, {"key": "claude/policy/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If an update request with request ID 01UEND, 01UHOU or 01UMOT is shorter than the 28-byte header plus that type's detail block (Endowment 152, House 158, Motor 165 bytes in total), then the system shall set return code '98' and return without updating.", "capability": "claude/policy/03#1", "function": "claude/policy/03", "rules": ["claude/RULE-044", "claude/RULE-093"], "sources": ["base/src/lgupol01.cbl:113-143"], "programs": ["LGUPOL01"]}, {"key": "claude/policy/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When an update request for 01UEND, 01UHOU or 01UMOT meets its minimum length, the system shall forward it to the database update routine LGUPDB01.", "capability": "claude/policy/03#1", "function": "claude/policy/03", "rules": ["claude/RULE-044"], "sources": ["base/src/lgupol01.cbl:113-143"], "programs": ["LGUPOL01"]}, {"key": "claude/policy/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the update request ID is not 01UEND, 01UHOU or 01UMOT (compared case-sensitively, so Commercial 01UCOM is included), then the system shall flag the request with return code '99' (unsupported request).", "capability": "claude/policy/03#1", "function": "claude/policy/03", "rules": ["claude/RULE-044", "claude/RULE-093"], "sources": ["base/src/lgupol01.cbl:113-143"], "programs": ["LGUPOL01"]}, {"key": "claude/policy/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a policy update is processed, the system shall lock the policy row keyed on CUSTOMERNUMBER and POLICYNUMBER before checking it.", "capability": "claude/policy/03#2", "function": "claude/policy/03", "rules": ["claude/RULE-017"], "sources": ["base/src/lgupdb01.cbl:272-358"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the caller's last-changed timestamp (CA-LASTCHANGED) differs from the policy's LASTCHANGED in the database, then the system shall change no tables and return code '02' (timestamp mismatch).", "capability": "claude/policy/03#2", "function": "claude/policy/03", "rules": ["claude/RULE-017"], "sources": ["base/src/lgupdb01.cbl:272-358"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If no policy row matches the customer and policy number, then the system shall return code '01' (not found).", "capability": "claude/policy/03#2", "function": "claude/policy/03", "rules": ["claude/RULE-017"], "sources": ["base/src/lgupdb01.cbl:272-358"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If any other error occurs when fetching the policy row, then the system shall return code '90' and log the error.", "capability": "claude/policy/03#2", "function": "claude/policy/03", "rules": ["claude/RULE-017"], "sources": ["base/src/lgupdb01.cbl:272-358"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the timestamps match, the system shall update the ENDOWMENT, HOUSE or MOTOR row for the policy number according to request ID '01UEND', '01UHOU' or '01UMOT'.", "capability": "claude/policy/03#3", "function": "claude/policy/03", "rules": ["claude/RULE-092"], "sources": ["base/src/lgupdb01.cbl:283-307"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When a product row is updated, the system shall overwrite every editable product attribute with the caller's values (Endowment: WITHPROFITS, EQUITIES, MANAGEDFUND, FUNDNAME, TERM, SUMASSURED, LIFEASSURED; House: PROPERTYTYPE, BEDROOMS, VALUE, HOUSENAME, HOUSENUMBER, POSTCODE; Motor: MAKE, MODEL, VALUE, REGNUMBER, COLOUR, CC, YEAROFMANUFACTURE, PREMIUM, ACCIDENTS) without recalculation or range checking, including the motor premium.", "capability": "claude/policy/03#3", "function": "claude/policy/03", "rules": ["claude/RULE-076"], "sources": ["base/src/lgupdb01.cbl:387-495"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Unwanted", "text": "If no product row exists for the policy number, then the system shall set return code '01', and if any other product update error occurs, then the system shall set return code '90' and log the error.", "capability": "claude/policy/03#3", "function": "claude/policy/03", "rules": ["claude/RULE-076"], "sources": ["base/src/lgupdb01.cbl:387-495"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the product-table update sets a non-'00' return code, then the system shall close the cursor and return without updating the POLICY table.", "capability": "claude/policy/03#3", "function": "claude/policy/03", "rules": ["claude/RULE-092"], "sources": ["base/src/lgupdb01.cbl:283-307"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the product-table update succeeds, the system shall set ISSUEDATE, EXPIRYDATE, BROKERID and BROKERSREFERENCE from the request, stamp LASTCHANGED = CURRENT TIMESTAMP and return that new timestamp in CA-LASTCHANGED.", "capability": "claude/policy/03#3", "function": "claude/policy/03", "rules": ["claude/RULE-053"], "sources": ["base/src/lgupdb01.cbl:312-342"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not update the policy payment through the policy update.", "capability": "claude/policy/03#3", "function": "claude/policy/03", "rules": ["claude/RULE-053"], "sources": ["base/src/lgupdb01.cbl:312-342"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If the POLICY header update fails, then the system shall roll back the unit of work (SYNCPOINT ROLLBACK), set return code '90' and log the error.", "capability": "claude/policy/03#3", "function": "claude/policy/03", "rules": ["claude/RULE-053"], "sources": ["base/src/lgupdb01.cbl:312-342"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the database update routine finishes normally, the system shall pass the same request to LGUPVS01 to mirror the change in the VSAM policy file.", "capability": "claude/policy/03#4", "function": "claude/policy/03", "rules": ["claude/RULE-075"], "sources": ["base/src/lgupdb01.cbl:207-216"], "programs": ["LGUPDB01"]}, {"key": "claude/policy/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the policy file is updated, the system shall read and lock the existing KSDSPOLY record by policy type + customer + policy number and fully overwrite it with the type-specific values from the request.", "capability": "claude/policy/03#4", "function": "claude/policy/03", "rules": ["claude/RULE-077", "claude/RULE-085"], "sources": ["base/src/lgupvs01.cbl:137-166"], "programs": ["LGAPVS01", "LGUPVS01"]}, {"key": "claude/policy/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the policy-file record is missing or cannot be read, then the system shall set return code 81 and abort the transaction with abend LGV3.", "capability": "claude/policy/03#4", "function": "claude/policy/03", "rules": ["claude/RULE-077"], "sources": ["base/src/lgupvs01.cbl:137-166"], "programs": ["LGUPVS01"]}, {"key": "claude/policy/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the policy-file rewrite fails, then the system shall set return code 82 and abort the transaction with abend LGV4.", "capability": "claude/policy/03#4", "function": "claude/policy/03", "rules": ["claude/RULE-077"], "sources": ["base/src/lgupvs01.cbl:137-166"], "programs": ["LGUPVS01"]}, {"key": "claude/policy/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If a delete request arrives with no data at all, then the system shall log 'NO COMMAREA RECEIVED' and abort the transaction with code LGCA.", "capability": "claude/policy/04#1", "function": "claude/policy/04", "rules": ["claude/RULE-045", "claude/RULE-024", "claude/RULE-093"], "sources": ["base/src/lgdpdb01.cbl:131-146", "base/src/lgdpol01.cbl:106-130"], "programs": ["LGDPDB01", "LGDPOL01", "LGUPOL01"]}, {"key": "claude/policy/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If a delete request is between 1 and 27 bytes, shorter than the 28-byte header, then the system shall set return code '98' and delete nothing.", "capability": "claude/policy/04#1", "function": "claude/policy/04", "rules": ["claude/RULE-045", "claude/RULE-024", "claude/RULE-093"], "sources": ["base/src/lgdpdb01.cbl:131-146", "base/src/lgdpol01.cbl:106-130"], "programs": ["LGDPDB01", "LGDPOL01", "LGUPOL01"]}, {"key": "claude/policy/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When a delete request of 28 bytes or more is received, the system shall upper-case the request ID and, if it is 01DEND, 01DMOT, 01DHOU or 01DCOM, forward the delete to LGDPDB01 with return code '00'.", "capability": "claude/policy/04#1", "function": "claude/policy/04", "rules": ["claude/RULE-024", "claude/RULE-045"], "sources": ["base/src/lgdpol01.cbl:106-130"], "programs": ["LGDPDB01", "LGDPOL01"]}, {"key": "claude/policy/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the upper-cased delete request ID is not 01DEND, 01DMOT, 01DHOU or 01DCOM, then the system shall return code '99' and delete nothing.", "capability": "claude/policy/04#1", "function": "claude/policy/04", "rules": ["claude/RULE-024", "claude/RULE-093"], "sources": ["base/src/lgdpol01.cbl:106-130"], "programs": ["LGDPOL01", "LGUPOL01"]}, {"key": "claude/policy/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When a valid delete request is processed, the system shall delete the POLICY row matching both CUSTOMERNUMBER and POLICYNUMBER, with the linked Endowment, House, Motor or Commercial details removed by the database's foreign-key cascade, and return '00'.", "capability": "claude/policy/04#2", "function": "claude/policy/04", "rules": ["claude/RULE-052"], "sources": ["base/src/lgdpdb01.cbl:186-202"], "programs": ["LGDPDB01"]}, {"key": "claude/policy/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the database reports anything other than a clean delete, then the system shall set return code '90', log the error and return without touching the policy-file record.", "capability": "claude/policy/04#2", "function": "claude/policy/04", "rules": ["claude/RULE-052"], "sources": ["base/src/lgdpdb01.cbl:186-202"], "programs": ["LGDPDB01"]}, {"key": "claude/policy/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When a policy has been deleted from the database, the system shall delete its KSDSPOLY record identified by the 21-character key of policy type letter (position 4 of the request ID), 10-digit customer number and 10-digit policy number.", "capability": "claude/policy/04#3", "function": "claude/policy/04", "rules": ["claude/RULE-057", "claude/RULE-085"], "sources": ["base/src/lgdpvs01.cbl:75-91"], "programs": ["LGAPVS01", "LGDPVS01"]}, {"key": "claude/policy/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the policy-file delete returns any response other than NORMAL, including when no record exists, then the system shall set return code '81', write an error message via LGSTSQ and return to the caller.", "capability": "claude/policy/04#3", "function": "claude/policy/04", "rules": ["claude/RULE-025"], "sources": ["base/src/lgdpvs01.cbl:86-91"], "programs": ["LGDPVS01"]}, {"key": "claude/policy/04/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Event-driven", "text": "When a policy-file delete fails, the system shall write to the error queue a message holding the date (MMDDYYYY) and time, policy number, customer number and CICS response codes, followed by a message with up to the first 90 bytes of the request data.", "capability": "claude/policy/04#3", "function": "claude/policy/04", "rules": ["claude/RULE-095"], "sources": ["base/src/lgdpvs01.cbl:99-131"], "programs": ["LGDPVS01"]}, {"key": "claude/ui/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the agent enters option '1' on the customer screen, the system shall look up the customer using request '01ICUS' to LGICUS01.", "capability": "claude/ui/01#1", "function": "claude/ui/01", "rules": ["claude/RULE-034"], "sources": ["base/src/lgtestc1.cbl:84-222"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the agent enters any option other than '1', '2' or '4' (including '3' or blank), then the system shall make no back-end call, show 'Please enter a valid option', place the cursor on the option field and continue the conversation under SSC1.", "capability": "claude/ui/01#1", "function": "claude/ui/01", "rules": ["claude/RULE-034"], "sources": ["base/src/lgtestc1.cbl:84-222"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If a customer inquire returns a return code > 0, then the system shall show 'No data was returned.' and reset the screen and commarea.", "capability": "claude/ui/01#1", "function": "claude/ui/01", "rules": ["claude/RULE-034"], "sources": ["base/src/lgtestc1.cbl:84-222"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the agent presses PF3 or nothing is entered (MAPFAIL), the system shall end the transaction with 'Transaction ended'.", "capability": "claude/ui/01#1", "function": "claude/ui/01", "rules": ["claude/RULE-034"], "sources": ["base/src/lgtestc1.cbl:84-222"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the agent presses CLEAR, the system shall redisplay an empty customer screen.", "capability": "claude/ui/01#1", "function": "claude/ui/01", "rules": ["claude/RULE-034"], "sources": ["base/src/lgtestc1.cbl:84-222"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the customer screen is first displayed, the system shall default the customer number to '0000000000'.", "capability": "claude/ui/01#1", "function": "claude/ui/01", "rules": ["claude/RULE-034"], "sources": ["base/src/lgtestc1.cbl:84-222"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the agent enters option '2', the system shall send add-customer request '01ACUS' to LGACUS01 with customer number 0 so that the back end assigns the customer number.", "capability": "claude/ui/01#2", "function": "claude/ui/01", "rules": ["claude/RULE-033", "claude/RULE-034"], "sources": ["base/src/lgtestc1.cbl:113-146"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When an add-customer request is built, the system shall replace null bytes x'00' with spaces x'40' across the whole commarea and upper-case the postcode (for example 'so21 2jn' becomes 'SO21 2JN').", "capability": "claude/ui/01#2", "function": "claude/ui/01", "rules": ["claude/RULE-033"], "sources": ["base/src/lgtestc1.cbl:113-146"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the customer add succeeds, the system shall display the assigned customer number with 'New Customer Inserted'.", "capability": "claude/ui/01#2", "function": "claude/ui/01", "rules": ["claude/RULE-033"], "sources": ["base/src/lgtestc1.cbl:113-146"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the add-customer request returns CA-RETURN-CODE > 0, then the system shall roll back the unit of work, show 'Error Adding Customer' and reset the screen and commarea.", "capability": "claude/ui/01#2", "function": "claude/ui/01", "rules": ["claude/RULE-033"], "sources": ["base/src/lgtestc1.cbl:113-146"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Complex", "text": "When a customer is successfully added and the control queue GENACNTL is empty, the system shall create it with the header '**** GENAPP CNTL', 'LOW CUSTOMER=' and 'HIGH CUSTOMER=' entries both set to the new customer number.", "capability": "claude/ui/01#2", "function": "claude/ui/01", "rules": ["claude/RULE-010", "claude/RULE-033"], "sources": ["base/src/lgtestc1.cbl:283-347"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Complex", "text": "When a customer is successfully added and GENACNTL already holds a 'HIGH CUSTOMER' entry, the system shall rewrite that entry as 'HIGH CUSTOMER=' followed by the new customer number and leave the LOW entry unchanged.", "capability": "claude/ui/01#2", "function": "claude/ui/01", "rules": ["claude/RULE-010"], "sources": ["base/src/lgtestc1.cbl:283-347"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall serialise every update of the GENACNTL control queue with an exclusive lock (ENQ/DEQ on the resource name 'GENACNTL').", "capability": "claude/ui/01#2", "function": "claude/ui/01", "rules": ["claude/RULE-010"], "sources": ["base/src/lgtestc1.cbl:283-347"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the agent enters option '4', the system shall first retrieve and display the customer's current details using request '01ICUS' and then send the edited screen as update request '01UCUS' to LGUCUS01.", "capability": "claude/ui/01#3", "function": "claude/ui/01", "rules": ["claude/RULE-063", "claude/RULE-034"], "sources": ["base/src/lgtestc1.cbl:148-207"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When an update-customer request is built, the system shall send all displayed fields with nulls converted to spaces and the postcode upper-cased.", "capability": "claude/ui/01#3", "function": "claude/ui/01", "rules": ["claude/RULE-063"], "sources": ["base/src/lgtestc1.cbl:148-207"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Unwanted", "text": "If the initial customer read fails, then the system shall show 'No data was returned.' and not attempt the update.", "capability": "claude/ui/01#3", "function": "claude/ui/01", "rules": ["claude/RULE-063"], "sources": ["base/src/lgtestc1.cbl:148-207"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the customer update succeeds, the system shall show 'Customer details updated'.", "capability": "claude/ui/01#3", "function": "claude/ui/01", "rules": ["claude/RULE-063"], "sources": ["base/src/lgtestc1.cbl:148-207"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/01/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the customer update fails, then the system shall show 'Error Updating Customer'.", "capability": "claude/ui/01#3", "function": "claude/ui/01", "rules": ["claude/RULE-063"], "sources": ["base/src/lgtestc1.cbl:148-207"], "programs": ["LGTESTC1"]}, {"key": "claude/ui/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter enters option '1' with a customer number and policy number, the system shall send request '01IMOT' to LGIPOL01 and display issue date, expiry date, make, model, value, registration, colour, CC, manufacture date, premium and accident count.", "capability": "claude/ui/02#1", "function": "claude/ui/02", "rules": ["claude/RULE-035"], "sources": ["base/src/lgtestp1.cbl:66-249"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the motor inquiry returns a return code > 0, then the system shall show 'No data was returned.'.", "capability": "claude/ui/02#1", "function": "claude/ui/02", "rules": ["claude/RULE-035"], "sources": ["base/src/lgtestp1.cbl:66-249"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the underwriter enters any option other than '1', '2', '3' or '4', then the system shall show 'Please enter a valid option' and place the cursor on the option field.", "capability": "claude/ui/02#1", "function": "claude/ui/02", "rules": ["claude/RULE-035"], "sources": ["base/src/lgtestp1.cbl:66-249"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter presses PF3 or nothing is entered (MAPFAIL), the system shall end the transaction, and when the underwriter presses CLEAR, the system shall redisplay an empty map.", "capability": "claude/ui/02#1", "function": "claude/ui/02", "rules": ["claude/RULE-035"], "sources": ["base/src/lgtestp1.cbl:66-249"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the motor policy screen is first displayed, the system shall default customer and policy to '0000000000', value to '000000', CC to '00000', accidents to '000000' and premium to '000000'.", "capability": "claude/ui/02#1", "function": "claude/ui/02", "rules": ["claude/RULE-035"], "sources": ["base/src/lgtestp1.cbl:66-249"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter enters option '2', the system shall send request '01AMOT' to LGAPOL01 linked to the entered customer, with the premium as entered, payment 0, broker id 0 and broker reference of 8 spaces.", "capability": "claude/ui/02#2", "function": "claude/ui/02", "rules": ["claude/RULE-036", "claude/RULE-035"], "sources": ["base/src/lgtestp1.cbl:97-133"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the motor policy add succeeds, the system shall display the assigned policy number with 'New Motor Policy Inserted'.", "capability": "claude/ui/02#2", "function": "claude/ui/02", "rules": ["claude/RULE-036"], "sources": ["base/src/lgtestp1.cbl:97-133"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the motor policy add returns code 70, then the system shall roll back the unit of work and show 'Customer does not exist'.", "capability": "claude/ui/02#2", "function": "claude/ui/02", "rules": ["claude/RULE-036"], "sources": ["base/src/lgtestp1.cbl:97-133"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the motor policy add returns any other non-zero code, then the system shall roll back the unit of work, show 'Error Adding Motor Policy' and reset the screen and commarea.", "capability": "claude/ui/02#2", "function": "claude/ui/02", "rules": ["claude/RULE-036"], "sources": ["base/src/lgtestp1.cbl:97-133"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter enters option '3', the system shall send request '01DMOT' to LGDPOL01 for the entered customer and policy number.", "capability": "claude/ui/02#3", "function": "claude/ui/02", "rules": ["claude/RULE-064", "claude/RULE-035"], "sources": ["base/src/lgtestp1.cbl:135-167"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the motor policy delete succeeds, the system shall show 'Motor Policy Deleted' with the dates and vehicle fields blanked.", "capability": "claude/ui/02#3", "function": "claude/ui/02", "rules": ["claude/RULE-064"], "sources": ["base/src/lgtestp1.cbl:135-167"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the motor policy delete returns a return code > 0, then the system shall issue a SYNCPOINT ROLLBACK and show 'Error Deleting Motor Policy'.", "capability": "claude/ui/02#3", "function": "claude/ui/02", "rules": ["claude/RULE-064"], "sources": ["base/src/lgtestp1.cbl:135-167"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter enters option '4', the system shall first retrieve and display the policy using request '01IMOT' and then send the edited fields as request '01UMOT' to LGUPOL01.", "capability": "claude/ui/02#4", "function": "claude/ui/02", "rules": ["claude/RULE-065", "claude/RULE-035"], "sources": ["base/src/lgtestp1.cbl:169-234"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set payment to 0, broker id to 0 and broker reference to blank on every motor policy update request.", "capability": "claude/ui/02#4", "function": "claude/ui/02", "rules": ["claude/RULE-065"], "sources": ["base/src/lgtestp1.cbl:169-234"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall take the policy number for a motor update from the commarea retained from the inquiry and the customer number from the screen.", "capability": "claude/ui/02#4", "function": "claude/ui/02", "rules": ["claude/RULE-065"], "sources": ["base/src/lgtestp1.cbl:169-234"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Unwanted", "text": "If the initial motor inquiry fails, then the system shall not attempt the update.", "capability": "claude/ui/02#4", "function": "claude/ui/02", "rules": ["claude/RULE-065"], "sources": ["base/src/lgtestp1.cbl:169-234"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the motor policy update succeeds, the system shall show 'Motor Policy Updated'.", "capability": "claude/ui/02#4", "function": "claude/ui/02", "rules": ["claude/RULE-065"], "sources": ["base/src/lgtestp1.cbl:169-234"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the motor policy update fails, then the system shall show 'Error Updating Motor Policy'.", "capability": "claude/ui/02#4", "function": "claude/ui/02", "rules": ["claude/RULE-065"], "sources": ["base/src/lgtestp1.cbl:169-234"], "programs": ["LGTESTP1"]}, {"key": "claude/ui/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept option '1' (inquire, 01IEND), '2' (add, 01AEND), '3' (delete, 01DEND) and '4' (update, 01IEND then 01UEND) on the endowment policy screen.", "capability": "claude/ui/03#1", "function": "claude/ui/03", "rules": ["claude/RULE-038"], "sources": ["base/src/lgtestp2.cbl:61-231"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the underwriter presses Enter with any other option value (for example '7' or blank), then the system shall call no back-end program, show 'Please enter a valid option', position the cursor on the option field and continue the conversation under transaction SSP2.", "capability": "claude/ui/03#1", "function": "claude/ui/03", "rules": ["claude/RULE-038"], "sources": ["base/src/lgtestp2.cbl:61-231"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter presses PF3 or nothing is entered (MAPFAIL), the system shall end the transaction with 'Transaction ended'.", "capability": "claude/ui/03#1", "function": "claude/ui/03", "rules": ["claude/RULE-038"], "sources": ["base/src/lgtestp2.cbl:245-253"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter presses CLEAR, the system shall redisplay a blank map and keep the conversation alive.", "capability": "claude/ui/03#1", "function": "claude/ui/03", "rules": ["claude/RULE-038"], "sources": ["base/src/lgtestp2.cbl:255-266"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the endowment policy screen is first entered, the system shall initialize the screen and commarea and default the customer and policy number to '0000000000'.", "capability": "claude/ui/03#1", "function": "claude/ui/03", "rules": ["claude/RULE-081", "claude/RULE-039"], "sources": ["base/src/lgtestp2.cbl:38-39"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When an inquiry, add, update or delete error path completes, the system shall resend the map with the error message, initialize the screen input, screen output and commarea, and return with next transaction SSP2.", "capability": "claude/ui/03#1", "function": "claude/ui/03", "rules": ["claude/RULE-081"], "sources": ["base/src/lgtestp2.cbl:286-300"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter enters option '1' with a customer number and policy number, the system shall call LGIPOL01 with request id '01IEND' and display the issue date, expiry date, fund name, term, sum assured, life assured, with-profits, managed-fund and equities fields.", "capability": "claude/ui/03#2", "function": "claude/ui/03", "rules": ["claude/RULE-039", "claude/RULE-038"], "sources": ["base/src/lgtestp2.cbl:63-88"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the endowment inquiry returns CA-RETURN-CODE > 0, then the system shall show 'No data was returned.' and reset the screen and commarea.", "capability": "claude/ui/03#2", "function": "claude/ui/03", "rules": ["claude/RULE-039", "claude/RULE-081"], "sources": ["base/src/lgtestp2.cbl:63-88"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter submits option '2', the system shall call LGAPOL01 with request id '01AEND' carrying the entered customer, the screen's dates and endowment attributes, payment 0, broker id 0 and broker reference of 8 spaces.", "capability": "claude/ui/03#3", "function": "claude/ui/03", "rules": ["claude/RULE-067", "claude/RULE-090"], "sources": ["base/src/lgtestp2.cbl:90-123", "base/src/lgtestp2.cbl:91-95"], "programs": ["LGTESTP2", "LGTESTP3"]}, {"key": "claude/ui/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall take the new endowment policy number from the back end (CA-POLICY-NUM) and not from the screen.", "capability": "claude/ui/03#3", "function": "claude/ui/03", "rules": ["claude/RULE-067"], "sources": ["base/src/lgtestp2.cbl:90-123"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the endowment add returns code 0, the system shall show the customer number, the newly assigned policy number and 'New Life Policy Inserted', and clear the option field.", "capability": "claude/ui/03#3", "function": "claude/ui/03", "rules": ["claude/RULE-067"], "sources": ["base/src/lgtestp2.cbl:90-123"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If the endowment add returns a return code > 0, then the system shall issue a SYNCPOINT ROLLBACK.", "capability": "claude/ui/03#3", "function": "claude/ui/03", "rules": ["claude/RULE-067", "claude/RULE-037"], "sources": ["base/src/lgtestp2.cbl:90-123"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the endowment add returns CA-RETURN-CODE 70 (customer not on file), then the system shall show 'Customer does not exist' and reinitialize the screen, map and commarea.", "capability": "claude/ui/03#3", "function": "claude/ui/03", "rules": ["claude/RULE-037"], "sources": ["base/src/lgtestp2.cbl:268-276"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the endowment add returns any other non-zero code, then the system shall show 'Error Adding Life Policy'.", "capability": "claude/ui/03#3", "function": "claude/ui/03", "rules": ["claude/RULE-037"], "sources": ["base/src/lgtestp2.cbl:268-276"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter selects option '4', the system shall first retrieve and display the policy with request '01IEND' and then call LGUPOL01 with request id '01UEND' carrying issue and expiry dates, fund name, term, sum assured, life assured, with-profits, managed fund and equities.", "capability": "claude/ui/03#4", "function": "claude/ui/03", "rules": ["claude/RULE-066", "claude/RULE-038"], "sources": ["base/src/lgtestp2.cbl:155-216"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send payment 0, broker id 0 and broker reference '        ' on every endowment update request, regardless of any existing values.", "capability": "claude/ui/03#4", "function": "claude/ui/03", "rules": ["claude/RULE-066", "claude/RULE-090"], "sources": ["base/src/lgtestp2.cbl:184-188"], "programs": ["LGTESTP2", "LGTESTP3"]}, {"key": "claude/ui/03/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall take the policy number for an endowment update from the inquiry commarea and not re-read it from the screen.", "capability": "claude/ui/03#4", "function": "claude/ui/03", "rules": ["claude/RULE-066"], "sources": ["base/src/lgtestp2.cbl:155-216"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Unwanted", "text": "If the endowment inquiry for an update fails, then the system shall show 'No data was returned.' and not attempt the update.", "capability": "claude/ui/03#4", "function": "claude/ui/03", "rules": ["claude/RULE-066"], "sources": ["base/src/lgtestp2.cbl:155-216"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Event-driven", "text": "When the endowment update returns code 0, the system shall show 'Life Policy Updated' and clear the option field.", "capability": "claude/ui/03#4", "function": "claude/ui/03", "rules": ["claude/RULE-066"], "sources": ["base/src/lgtestp2.cbl:155-216"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Unwanted", "text": "If the endowment update returns a return code > 0, then the system shall show 'Error Updating Life Policy' and reset the screen.", "capability": "claude/ui/03#4", "function": "claude/ui/03", "rules": ["claude/RULE-066"], "sources": ["base/src/lgtestp2.cbl:155-216"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/03/REQ-F-021", "code": "REQ-F-021", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter selects option '3', the system shall call LGDPOL01 with request id '01DEND' for the entered customer number and policy number.", "capability": "claude/ui/03#5", "function": "claude/ui/03", "rules": ["claude/RULE-068", "claude/RULE-038"], "sources": ["base/src/lgtestp2.cbl:125-153"], "programs": ["LGTESTP2", "LGTESTP3"]}, {"key": "claude/ui/03/REQ-F-022", "code": "REQ-F-022", "kind": "F", "pattern": "Event-driven", "text": "When the endowment delete succeeds, the system shall show 'Life Policy Deleted'.", "capability": "claude/ui/03#5", "function": "claude/ui/03", "rules": ["claude/RULE-068"], "sources": ["base/src/lgtestp2.cbl:125-153"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/03/REQ-F-023", "code": "REQ-F-023", "kind": "F", "pattern": "Unwanted", "text": "If the endowment delete returns a return code > 0, then the system shall roll back the unit of work and show 'Error Deleting Life Policy'.", "capability": "claude/ui/03#5", "function": "claude/ui/03", "rules": ["claude/RULE-068"], "sources": ["base/src/lgtestp2.cbl:125-153"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall accept option '1' (inquire, 01IHOU), '2' (add, 01AHOU), '3' (delete, 01DHOU) and '4' (update, 01IHOU then 01UHOU) on the house policy screen.", "capability": "claude/ui/04#1", "function": "claude/ui/04", "rules": ["claude/RULE-038"], "sources": ["base/src/lgtestp3.cbl:64-230"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/04/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the underwriter presses Enter with any other option value, then the system shall call no back-end program, show 'Please enter a valid option', position the cursor on the option field and continue the conversation under transaction SSP3.", "capability": "claude/ui/04#1", "function": "claude/ui/04", "rules": ["claude/RULE-038"], "sources": ["base/src/lgtestp3.cbl:217-228"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/04/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When an inquiry, add, update or delete error path completes, the system shall resend the map with the error message, initialize the screen input, screen output and commarea, and return with next transaction SSP3.", "capability": "claude/ui/04#1", "function": "claude/ui/04", "rules": ["claude/RULE-081"], "sources": ["base/src/lgtestp3.cbl:285-299"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/04/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the house policy screen is first displayed, the system shall default value to '00000000' and bedrooms to '000'.", "capability": "claude/ui/04#1", "function": "claude/ui/04", "rules": ["claude/RULE-070"], "sources": ["base/src/lgtestp3.cbl:40-41"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter enters option '1' with a customer number and policy number, the system shall call LGIPOL01 with request id '01IHOU' and display property type, bedrooms, value, house name, house number and postcode.", "capability": "claude/ui/04#2", "function": "claude/ui/04", "rules": ["claude/RULE-039", "claude/RULE-038"], "sources": ["base/src/lgtestp3.cbl:66-90"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/04/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the house inquiry returns CA-RETURN-CODE > 0, then the system shall show 'No data was returned.' and reset the screen and commarea.", "capability": "claude/ui/04#2", "function": "claude/ui/04", "rules": ["claude/RULE-039", "claude/RULE-081"], "sources": ["base/src/lgtestp3.cbl:66-90"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/04/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter submits option '2', the system shall call LGAPOL01 with request id '01AHOU' carrying the entered customer, property type, bedrooms, value, house name, house number and postcode, with payment 0, broker id 0 and broker reference of 8 spaces.", "capability": "claude/ui/04#3", "function": "claude/ui/04", "rules": ["claude/RULE-070", "claude/RULE-090"], "sources": ["base/src/lgtestp3.cbl:92-123", "base/src/lgtestp3.cbl:93-97"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the house add returns code 0, the system shall show the customer number, the assigned policy number and 'New House Policy Inserted', and clear the option field.", "capability": "claude/ui/04#3", "function": "claude/ui/04", "rules": ["claude/RULE-070"], "sources": ["base/src/lgtestp3.cbl:92-123"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the house add returns a return code > 0, then the system shall issue a SYNCPOINT ROLLBACK.", "capability": "claude/ui/04#3", "function": "claude/ui/04", "rules": ["claude/RULE-070", "claude/RULE-037"], "sources": ["base/src/lgtestp3.cbl:92-123"], "program
