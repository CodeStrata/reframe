s": ["LGTESTP2", "LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the house add returns CA-RETURN-CODE 70 (customer not on file), then the system shall show 'Customer does not exist'; for any other non-zero code it shall show 'Error Adding House Policy'.", "capability": "claude/ui/04#3", "function": "claude/ui/04", "rules": ["claude/RULE-037"], "sources": ["base/src/lgtestp3.cbl:267-275"], "programs": ["LGTESTP2"]}, {"key": "claude/ui/04/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter selects option '4', the system shall first retrieve and display the policy with request '01IHOU' and then call LGUPOL01 with request id '01UHOU' carrying property type, bedrooms, value, house name, house number, postcode and dates.", "capability": "claude/ui/04#4", "function": "claude/ui/04", "rules": ["claude/RULE-069", "claude/RULE-038"], "sources": ["base/src/lgtestp3.cbl:155-214"], "programs": ["LGTESTP2", "LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall send payment 0, broker id 0 and broker reference '        ' on every house update request, regardless of any existing values.", "capability": "claude/ui/04#4", "function": "claude/ui/04", "rules": ["claude/RULE-069", "claude/RULE-090"], "sources": ["base/src/lgtestp3.cbl:183-187"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When the house update returns code 0, the system shall show 'House Policy Updated'.", "capability": "claude/ui/04#4", "function": "claude/ui/04", "rules": ["claude/RULE-069"], "sources": ["base/src/lgtestp3.cbl:155-214"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the house update returns a return code > 0, then the system shall show 'Error Updating House Policy' and reset the screen.", "capability": "claude/ui/04#4", "function": "claude/ui/04", "rules": ["claude/RULE-069"], "sources": ["base/src/lgtestp3.cbl:155-214"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the underwriter selects option '3', the system shall call LGDPOL01 with request id '01DHOU' for the entered customer number and policy number.", "capability": "claude/ui/04#5", "function": "claude/ui/04", "rules": ["claude/RULE-068", "claude/RULE-038"], "sources": ["base/src/lgtestp3.cbl:125-153"], "programs": ["LGTESTP2", "LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the house delete returns code 0, the system shall blank the policy detail fields, clear the option field and show 'House Policy Deleted'.", "capability": "claude/ui/04#5", "function": "claude/ui/04", "rules": ["claude/RULE-068"], "sources": ["base/src/lgtestp3.cbl:125-153"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/04/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the house delete returns a return code > 0, then the system shall issue a SYNCPOINT ROLLBACK, show 'Error Deleting House Policy' and reset the screen and commarea.", "capability": "claude/ui/04#5", "function": "claude/ui/04", "rules": ["claude/RULE-068"], "sources": ["base/src/lgtestp3.cbl:125-153"], "programs": ["LGTESTP3"]}, {"key": "claude/ui/05/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Unwanted", "text": "If the user enters any option other than '1' (Inquire), '2' (Add) or '3' (Delete), or leaves the option blank, then the system shall show 'Please enter a valid option', put the cursor back on the option field and call no back-end service.", "capability": "claude/ui/05#1", "function": "claude/ui/05", "rules": ["claude/RULE-040"], "sources": ["base/src/lgtestp4.cbl:236-247"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the commercial policy transaction starts with no prior conversation data, the system shall show a fresh form with customer and policy numbers set to '0000000000' and the peril, premium and status fields empty.", "capability": "claude/ui/05#1", "function": "claude/ui/05", "rules": ["claude/RULE-082"], "sources": ["base/src/lgtestp4.cbl:32-64"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Enter, the system shall return control under transaction SSP4.", "capability": "claude/ui/05#1", "function": "claude/ui/05", "rules": ["claude/RULE-082"], "sources": ["base/src/lgtestp4.cbl:32-64"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When the user presses PF3, or a receive has no data, the system shall show 'Transaction ended' and end the session.", "capability": "claude/ui/05#1", "function": "claude/ui/05", "rules": ["claude/RULE-082"], "sources": ["base/src/lgtestp4.cbl:263-284"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the user presses Clear, the system shall redisplay an empty map and continue under SSP4.", "capability": "claude/ui/05#1", "function": "claude/ui/05", "rules": ["claude/RULE-082"], "sources": ["base/src/lgtestp4.cbl:263-284"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If a back-end call returns an error, then the system shall reset the screen and commarea before returning under SSP4.", "capability": "claude/ui/05#1", "function": "claude/ui/05", "rules": ["claude/RULE-082", "claude/RULE-071"], "sources": ["base/src/lgtestp4.cbl:308-318"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall treat a search key as present only if it is not spaces, not low-values, not zero and not all zeros (10 zeros for customer or policy, 8 zeros for postcode).", "capability": "claude/ui/05#2", "function": "claude/ui/05", "rules": ["claude/RULE-041"], "sources": ["base/src/lgtestp4.cbl:71-128"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the user enters option '1', the system shall send request '01ICOM' to LGIPOL01 if customer and policy number are both present, else '02ICOM' if only the policy number is present, else '03ICOM' if only the customer number is present, else '05ICOM' if only the 8-character postcode is present.", "capability": "claude/ui/05#2", "function": "claude/ui/05", "rules": ["claude/RULE-041"], "sources": ["base/src/lgtestp4.cbl:71-128"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If the commercial inquiry returns a return code above 0, then the system shall show 'No data was returned.'.", "capability": "claude/ui/05#2", "function": "claude/ui/05", "rules": ["claude/RULE-041"], "sources": ["base/src/lgtestp4.cbl:71-128"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Event-driven", "text": "When the commercial inquiry returns code 0, the system shall fill the screen with policy number, customer number, issue and expiry dates, address, postcode, latitude and longitude, customer name, property type, the fire, crime, flood and weather peril and premium values, status and reject reason.", "capability": "claude/ui/05#2", "function": "claude/ui/05", "rules": ["claude/RULE-041"], "sources": ["base/src/lgtestp4.cbl:71-128"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the user enters option '2' and presses Enter, the system shall send request '01ACOM' to LGAPOL01 with the customer number, issue and expiry dates, address, postcode, latitude and longitude, property type, the fire, crime, flood and weather peril and premium values, status and reject reason from the screen.", "capability": "claude/ui/05#3", "function": "claude/ui/05", "rules": ["claude/RULE-071", "claude/RULE-040"], "sources": ["base/src/lgtestp4.cbl:156-195"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Event-driven", "text": "When the commercial add returns code 0, the system shall show the customer number and the newly assigned policy number, clear the option field and show 'New Commercial Policy Inserted'.", "capability": "claude/ui/05#3", "function": "claude/ui/05", "rules": ["claude/RULE-071"], "sources": ["base/src/lgtestp4.cbl:156-195"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Unwanted", "text": "If the commercial add returns code 70, then the system shall roll back the work and show 'Customer does not exist'.", "capability": "claude/ui/05#3", "function": "claude/ui/05", "rules": ["claude/RULE-071"], "sources": ["base/src/lgtestp4.cbl:156-195"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If the commercial add returns any other code above 0, then the system shall issue a SYNCPOINT ROLLBACK and show 'Error Adding Commercial Policy'.", "capability": "claude/ui/05#3", "function": "claude/ui/05", "rules": ["claude/RULE-071"], "sources": ["base/src/lgtestp4.cbl:156-195"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the user enters option '3' and presses Enter, the system shall send request '01DCOM' to LGDPOL01 with the customer number and policy number.", "capability": "claude/ui/05#4", "function": "claude/ui/05", "rules": ["claude/RULE-072", "claude/RULE-040"], "sources": ["base/src/lgtestp4.cbl:197-234"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the commercial delete returns code 0, the system shall blank the policy detail fields, clear the option field and show 'Commercial Policy Deleted'.", "capability": "claude/ui/05#4", "function": "claude/ui/05", "rules": ["claude/RULE-072"], "sources": ["base/src/lgtestp4.cbl:197-234"], "programs": ["LGTESTP4"]}, {"key": "claude/ui/05/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Unwanted", "text": "If the commercial delete returns a return code above 0, then the system shall roll back the work and show 'Error Deleting Commercial Policy'.", "capability": "claude/ui/05#4", "function": "claude/ui/05", "rules": ["claude/RULE-072"], "sources": ["base/src/lgtestp4.cbl:197-234"], "programs": ["LGTESTP4"]}, {"key": "claude/logging/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When INVOKINGPROG is not blank, the system shall treat the request as program-invoked (WS-FLAG='C') and take the message from the calling program's commarea.", "capability": "claude/logging/01#1", "function": "claude/logging/01", "rules": ["claude/RULE-009"], "sources": ["base/src/lgstsq.cbl:57-90"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When INVOKINGPROG is blank, the system shall treat the request as terminal input (WS-FLAG='R') and take the message from the received terminal data with the 5-character transaction id removed.", "capability": "claude/logging/01#1", "function": "claude/logging/01", "rules": ["claude/RULE-009"], "sources": ["base/src/lgstsq.cbl:57-90"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall build each log record as the 4-character CICS system id, one space, and the message text.", "capability": "claude/logging/01#1", "function": "claude/logging/01", "rules": ["claude/RULE-009"], "sources": ["base/src/lgstsq.cbl:57-90"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall set the record write length to the message length plus 5 (for example a 60-byte commarea gives 65, and an 80-byte terminal entry gives 80 - 5 + 5 = 80).", "capability": "claude/logging/01#1", "function": "claude/logging/01", "rules": ["claude/RULE-009"], "sources": ["base/src/lgstsq.cbl:57-90"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write error messages to the temporary storage queue 'GENAERRS' unless the message starts with 'Q=' in positions 1-2.", "capability": "claude/logging/01#2", "function": "claude/logging/01", "rules": ["claude/RULE-088"], "sources": ["base/src/lgstsq.cbl:82-88"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a message starts with 'Q=' in positions 1-2, the system shall write it to the temporary storage queue named 'GENA' followed by message positions 3-6 (for example 'Q=PROD ...' goes to 'GENAPROD').", "capability": "claude/logging/01#2", "function": "claude/logging/01", "rules": ["claude/RULE-088"], "sources": ["base/src/lgstsq.cbl:82-88"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When a message starts with 'Q=', the system shall remove the 7-character prefix (Q= + 4 chars + 1 separator) from the logged text and take 7 off the record length before the 5-byte header is added.", "capability": "claude/logging/01#2", "function": "claude/logging/01", "rules": ["claude/RULE-088", "claude/RULE-009"], "sources": ["base/src/lgstsq.cbl:82-88", "base/src/lgstsq.cbl:57-90"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall recognise the 'Q=' marker only when it is in message positions 1-2 and in upper case, so 'q=' or ' Q=' is not recognised.", "capability": "claude/logging/01#2", "function": "claude/logging/01", "rules": ["claude/RULE-088"], "sources": ["base/src/lgstsq.cbl:82-88"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall keep the CSMT transient data queue name fixed, whatever the 'Q=' override.", "capability": "claude/logging/01#2", "function": "claude/logging/01", "rules": ["claude/RULE-088"], "sources": ["base/src/lgstsq.cbl:82-88"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write every error log record to the transient data queue 'CSMT'.", "capability": "claude/logging/01#3", "function": "claude/logging/01", "rules": ["claude/RULE-089"], "sources": ["base/src/lgstsq.cbl:92-111"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall write every error log record to the temporary storage queue (GENAERRS or its override).", "capability": "claude/logging/01#3", "function": "claude/logging/01", "rules": ["claude/RULE-089", "claude/RULE-088"], "sources": ["base/src/lgstsq.cbl:92-111"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Unwanted", "text": "If temporary storage is exhausted, then the system shall drop the temporary storage write without the task waiting (NOSUSPEND), while the CSMT copy is still kept.", "capability": "claude/logging/01#3", "function": "claude/logging/01", "rules": ["claude/RULE-089"], "sources": ["base/src/lgstsq.cbl:92-111"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If a write to either queue fails, then the system shall carry on without checking the response codes and without telling the caller.", "capability": "claude/logging/01#3", "function": "claude/logging/01", "rules": ["claude/RULE-089"], "sources": ["base/src/lgstsq.cbl:92-111"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Event-driven", "text": "When a message entered at a terminal (WS-FLAG='R') has been written to the queues, the system shall send a 1-character blank screen with ERASE, WAIT and FREEKB and return.", "capability": "claude/logging/01#4", "function": "claude/logging/01", "rules": ["claude/RULE-080"], "sources": ["base/src/lgstsq.cbl:113-122"], "programs": ["LGSTSQ"]}, {"key": "claude/logging/01/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Event-driven", "text": "When a message from a calling program (WS-FLAG='C') has been written to the queues, the system shall return control to the caller with no screen output.", "capability": "claude/logging/01#4", "function": "claude/logging/01", "rules": ["claude/RULE-080"], "sources": ["base/src/lgstsq.cbl:113-122"], "programs": ["LGSTSQ"]}, {"key": "claude/ops/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a statistics event is received and the return-code container DFHEP.DATA.00002 can be read, the system shall take the request id from container DFHEP.DATA.00001 and the return code from container DFHEP.DATA.00002.", "capability": "claude/ops/01#1", "function": "claude/ops/01", "rules": ["claude/RULE-023"], "sources": ["base/src/lgastat1.cbl:79-99"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When a statistics event is received without event containers but with a commarea, the system shall take the request id from CA-REQUEST-ID and the return code from CA-RETURN-CODE.", "capability": "claude/ops/01#1", "function": "claude/ops/01", "rules": ["claude/RULE-023"], "sources": ["base/src/lgastat1.cbl:79-99"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If neither the event containers nor a commarea are present (commarea length 0), then the system shall end without recording any count.", "capability": "claude/ops/01#1", "function": "claude/ops/01", "rules": ["claude/RULE-023"], "sources": ["base/src/lgastat1.cbl:79-99"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If the request-id container DFHEP.DATA.00001 is missing but the return-code container DFHEP.DATA.00002 is present, then the system shall (as the legacy does) use whatever request id was left in WS-Data-Req, because only the return-code read is checked.", "capability": "claude/ops/01#1", "function": "claude/ops/01", "rules": ["claude/RULE-023"], "sources": ["base/src/lgastat1.cbl:79-99"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the counter name is built, the system shall count request id '02ACUS' as '01ACUS', count '02ICOM', '03ICOM' and '05ICOM' as '01ICOM', and count every other request id (including '04ICOM') under its own value.", "capability": "claude/ops/01#2", "function": "claude/ops/01", "rules": ["claude/RULE-003"], "sources": ["base/src/lgastat1.cbl:122-126"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When a request is counted, the system shall increment by 1 the named counter 'GENA' + request id (6 characters) + outcome (2 characters) in pool GENA, where the outcome is '00' for return code '00' and '99' for any other return code.", "capability": "claude/ops/01#2", "function": "claude/ops/01", "rules": ["claude/RULE-004"], "sources": ["base/src/lgastat1.cbl:127-133"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the named counter for a request type has not been defined (NOTFND), then the system shall (as the legacy does) ignore the response and not count the event, so volumes can be under-reported.", "capability": "claude/ops/01#2", "function": "claude/ops/01", "rules": ["claude/RULE-004"], "sources": ["base/src/lgastat1.cbl:127-133"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When a statistics event is processed and queue GENASTRT does not exist (READQ returns QIDERR), the system shall write the current date (DDMMYYYY) and time (HHMMSS) to GENASTRT as a 16-byte record 'DDMMYYYY  HHMMSS'.", "capability": "claude/ops/01#3", "function": "claude/ops/01", "rules": ["claude/RULE-079"], "sources": ["base/src/lgastat1.cbl:101-120"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "State-driven", "text": "While queue GENASTRT already exists, the system shall leave the start-time stamp unchanged.", "capability": "claude/ops/01#3", "function": "claude/ops/01", "rules": ["claude/RULE-079"], "sources": ["base/src/lgastat1.cbl:101-120"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If reading GENASTRT fails with an error other than QIDERR (e.g. ITEMERR, LENGERR), then the system shall write no start-time stamp.", "capability": "claude/ops/01#3", "function": "claude/ops/01", "rules": ["claude/RULE-079"], "sources": ["base/src/lgastat1.cbl:101-120"], "programs": ["LGASTAT1"]}, {"key": "claude/ops/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the statistics collector finishes its interval calculation, the system shall schedule transaction 'SSST' to run again after 1 minute.", "capability": "claude/ops/02#1", "function": "claude/ops/02", "rules": ["claude/RULE-078"], "sources": ["base/src/lgwebst5.cbl:761-765"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If scheduling the next run fails, then the system shall (as the legacy does) not check the response, so the minute-by-minute chain stops without notice.", "capability": "claude/ops/02#1", "function": "claude/ops/02", "rules": ["claude/RULE-078"], "sources": ["base/src/lgwebst5.cbl:761-765"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the statistics collector runs, the system shall convert the previous run time from queue GENA000V and the current time to seconds since midnight (HH*3600 + MM*60 + SS) and take the difference as the interval.", "capability": "claude/ops/02#2", "function": "claude/ops/02", "rules": ["claude/RULE-013"], "sources": ["base/src/lgwebst5.cbl:715-760"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If queue GENA000V cannot be read, then the system shall use '120000' (12:00:00) as the previous run time.", "capability": "claude/ops/02#2", "function": "claude/ops/02", "rules": ["claude/RULE-013"], "sources": ["base/src/lgwebst5.cbl:715-760"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Event-driven", "text": "When the interval has been calculated, the system shall delete and rebuild GENA000V with item 1 = the current time (HHMMSS) and item 2 = the interval.", "capability": "claude/ops/02#2", "function": "claude/ops/02", "rules": ["claude/RULE-013"], "sources": ["base/src/lgwebst5.cbl:715-760"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the interval is negative (crossing midnight, or a run before the 12:00:00 default), then the system shall (as the legacy does) store it unsigned in a PIC 9(6) field, losing the sign.", "capability": "claude/ops/02#2", "function": "claude/ops/02", "rules": ["claude/RULE-013"], "sources": ["base/src/lgwebst5.cbl:715-760"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When the collector processes a tracked counter, the system shall delete and rewrite its queue 'GENA' + 3-character suffix + 'V' with item 1 = new value, item 2 = old value (item 1 of the existing queue) and item 3 = delta (new - old), each 9 digits.", "capability": "claude/ops/02#3", "function": "claude/ops/02", "rules": ["claude/RULE-014"], "sources": ["base/src/lgwebst5.cbl:769-802"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall keep rate queues for 100..900 and A00..H00 (the 17 successful-transaction counters), X05 (customer number), X00 (total success) and X01..X04 (inquire/add/update/delete totals).", "capability": "claude/ops/02#3", "function": "claude/ops/02", "rules": ["claude/RULE-014"], "sources": ["base/src/lgwebst5.cbl:769-802"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If a counter goes down (for example after a CICS restart), then the system shall (as the legacy does) store the delta unsigned, so 1,310 to 0 is stored as 1310.", "capability": "claude/ops/02#3", "function": "claude/ops/02", "rules": ["claude/RULE-014"], "sources": ["base/src/lgwebst5.cbl:769-802"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If the existing queue cannot be read, then the system shall (as the legacy does) use whatever value was left in the work field from the previous counter as the old value.", "capability": "claude/ops/02#3", "function": "claude/ops/02", "rules": ["claude/RULE-014"], "sources": ["base/src/lgwebst5.cbl:769-802"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When the collector aggregates the counters, the system shall compute total successes as the sum of the 17 success counters (suffix 00) and total errors as the sum of the 17 matching error counters (suffix 99).", "capability": "claude/ops/02#4", "function": "claude/ops/02", "rules": ["claude/RULE-011"], "sources": ["base/src/lgwebst5.cbl:281-678"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall publish total successes to rate queue GENAX00V as a new/old/delta triple.", "capability": "claude/ops/02#4", "function": "claude/ops/02", "rules": ["claude/RULE-011", "claude/RULE-014"], "sources": ["base/src/lgwebst5.cbl:281-678"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall exclude counter GENAOTHER from both total successes and total errors.", "capability": "claude/ops/02#4", "function": "claude/ops/02", "rules": ["claude/RULE-011"], "sources": ["base/src/lgwebst5.cbl:281-678"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-014", "code": "REQ-F-014", "kind": "F", "pattern": "Unwanted", "text": "If a counter query fails, then the system shall (as the legacy does) not check the response and add the previous counter's value again.", "capability": "claude/ops/02#4", "function": "claude/ops/02", "rules": ["claude/RULE-011"], "sources": ["base/src/lgwebst5.cbl:281-678"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-015", "code": "REQ-F-015", "kind": "F", "pattern": "Event-driven", "text": "When the collector aggregates the counters, the system shall compute the inquire total as ICUS+IMOT+IEND+IHOU+ICOM and publish it to GENAX01V.", "capability": "claude/ops/02#5", "function": "claude/ops/02", "rules": ["claude/RULE-012"], "sources": ["base/src/lgwebst5.cbl:286-699"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-016", "code": "REQ-F-016", "kind": "F", "pattern": "Event-driven", "text": "When the collector aggregates the counters, the system shall compute the add total as ACUS+AMOT+AEND+AHOU+ACOM and publish it to GENAX02V.", "capability": "claude/ops/02#5", "function": "claude/ops/02", "rules": ["claude/RULE-012"], "sources": ["base/src/lgwebst5.cbl:286-699"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-017", "code": "REQ-F-017", "kind": "F", "pattern": "Event-driven", "text": "When the collector aggregates the counters, the system shall compute the update total as UMOT+UEND+UHOU and publish it to GENAX03V.", "capability": "claude/ops/02#5", "function": "claude/ops/02", "rules": ["claude/RULE-012"], "sources": ["base/src/lgwebst5.cbl:286-699"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-018", "code": "REQ-F-018", "kind": "F", "pattern": "Event-driven", "text": "When the collector aggregates the counters, the system shall compute the delete total as DMOT+DEND+DHOU+DCOM and publish it to GENAX04V.", "capability": "claude/ops/02#5", "function": "claude/ops/02", "rules": ["claude/RULE-012"], "sources": ["base/src/lgwebst5.cbl:286-699"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-019", "code": "REQ-F-019", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall feed the operation-type totals from success counters (00) only.", "capability": "claude/ops/02#5", "function": "claude/ops/02", "rules": ["claude/RULE-012"], "sources": ["base/src/lgwebst5.cbl:286-699"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/02/REQ-F-020", "code": "REQ-F-020", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall deliver statistics to consumers only through the TS rate queues; the symbol list for template 'GENAST3TEMP' (APPLID, counter values, total successes, total errors, start time) is built but never sent or stored.", "capability": "claude/ops/02#6", "function": "claude/ops/02", "rules": ["claude/RULE-098"], "sources": ["base/src/lgwebst5.cbl:76-156"], "programs": ["LGWEBST5"]}, {"key": "claude/ops/03/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When the operator enters data after the 5-character transaction ID, the system shall use that data as the last customer number.", "capability": "claude/ops/03#1", "function": "claude/ops/03", "rules": ["claude/RULE-032"], "sources": ["base/src/lgsetup.cbl:128-135"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the operator input is 5 characters or shorter, the system shall use the default last customer number of 11.", "capability": "claude/ops/03#1", "function": "claude/ops/03", "rules": ["claude/RULE-032"], "sources": ["base/src/lgsetup.cbl:128-135"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the operator input is non-numeric or contains spaces, then the system shall (as the legacy does) move it into the numeric field without validation, giving an unpredictable result.", "capability": "claude/ops/03#1", "function": "claude/ops/03", "rules": ["claude/RULE-032"], "sources": ["base/src/lgsetup.cbl:128-135"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Event-driven", "text": "When setup runs, the system shall delete and rewrite queue GENACNTL as three records: '**** GENAPP CNTL', 'LOW CUSTOMER=0000000001' and 'HIGH CUSTOMER=' followed by the last customer number (default 0000000011).", "capability": "claude/ops/03#2", "function": "claude/ops/03", "rules": ["claude/RULE-061", "claude/RULE-032"], "sources": ["base/src/lgsetup.cbl:150-176"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall keep the low customer value fixed at 1, regardless of operator input.", "capability": "claude/ops/03#2", "function": "claude/ops/03", "rules": ["claude/RULE-061"], "sources": ["base/src/lgsetup.cbl:150-176"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When GENACNTL has been rewritten, the system shall show the HIGH CUSTOMER record on the terminal as confirmation, whether or not the writes succeeded.", "capability": "claude/ops/03#2", "function": "claude/ops/03", "rules": ["claude/RULE-061"], "sources": ["base/src/lgsetup.cbl:150-176"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Event-driven", "text": "When setup runs, the system shall delete and redefine named counter GENACUSTNUM in pool GENA with its value set to the last customer number (default 11 or the operator override).", "capability": "claude/ops/03#3", "function": "claude/ops/03", "rules": ["claude/RULE-008", "claude/RULE-032"], "sources": ["base/src/lgsetup.cbl:179-187"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Unwanted", "text": "If the counter define fails, then the system shall (as the legacy does) ignore the response, and customer add falls back to letting DB2 assign the number.", "capability": "claude/ops/03#3", "function": "claude/ops/03", "rules": ["claude/RULE-008"], "sources": ["base/src/lgsetup.cbl:179-187"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When setup runs, the system shall delete and recreate at value 0 every GENA01 statistics counter in pool GENA, success (00) and error (99), for ICUS, ACUS, UCUS, IMOT, AMOT, DMOT, UMOT, IEND, AEND, DEND, UEND, IHOU, AHOU, DHOU, UHOU, ICOM, ACOM and DCOM.", "capability": "claude/ops/03#4", "function": "claude/ops/03", "rules": ["claude/RULE-062"], "sources": ["base/src/lgsetup.cbl:189-516"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "Unwanted", "text": "If a counter fails to redefine, then the system shall (as the legacy does) ignore the response and not report it.", "capability": "claude/ops/03#4", "function": "claude/ops/03", "rules": ["claude/RULE-062"], "sources": ["base/src/lgsetup.cbl:189-516"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-011", "code": "REQ-F-011", "kind": "F", "pattern": "Event-driven", "text": "When setup runs, the system shall delete queues GENAERRS, GENASTRT, GENASTAT and GENACNTL, recreating only GENACNTL.", "capability": "claude/ops/03#5", "function": "claude/ops/03", "rules": ["claude/RULE-097"], "sources": ["base/src/lgsetup.cbl:137-152"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-012", "code": "REQ-F-012", "kind": "F", "pattern": "Unwanted", "text": "If a queue to be deleted is missing (QIDERR), then the system shall ignore it so the reset can be run repeatedly.", "capability": "claude/ops/03#5", "function": "claude/ops/03", "rules": ["claude/RULE-097"], "sources": ["base/src/lgsetup.cbl:137-152"], "programs": ["LGSETUP"]}, {"key": "claude/ops/03/REQ-F-013", "code": "REQ-F-013", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall not back up or archive the error history before deleting it.", "capability": "claude/ops/03#5", "function": "claude/ops/03", "rules": ["claude/RULE-097"], "sources": ["base/src/lgsetup.cbl:137-152"], "programs": ["LGSETUP"]}, {"key": "claude/wsim/01/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a customer inquiry simulation request runs, the system shall read the working customer number range from the LOW CUSTOMER= and HIGH CUSTOMER= entries of the shared control queue GENACNTL and write nothing to the queue if both entries exist.", "capability": "claude/wsim/01#1", "function": "claude/wsim/01", "rules": ["claude/RULE-058"], "sources": ["base/src/lgicvs01.cbl:123-191"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Unwanted", "text": "If the control queue GENACNTL does not exist (item 1 read fails), then the system shall write the header '**** GENAPP CNTL', 'LOW CUSTOMER=0001000001' and 'HIGH CUSTOMER=0001000001' and use 1000001 for both ends of the range.", "capability": "claude/wsim/01#1", "function": "claude/wsim/01", "rules": ["claude/RULE-058"], "sources": ["base/src/lgicvs01.cbl:123-124", "base/src/lgicvs01.cbl:167-185"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Unwanted", "text": "If the control queue exists but has no LOW entry or no HIGH entry, then the system shall append only the missing entry, with the default value 0001000001.", "capability": "claude/wsim/01#1", "function": "claude/wsim/01", "rules": ["claude/RULE-058"], "sources": ["base/src/lgicvs01.cbl:123-191"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "State-driven", "text": "While the control queue holds several LOW or HIGH entries, the system shall use the last one read.", "capability": "claude/wsim/01#1", "function": "claude/wsim/01", "rules": ["claude/RULE-058"], "sources": ["base/src/lgicvs01.cbl:123-191"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall never match item 1 of the control queue as a LOW or HIGH entry, so a LOW or HIGH value stored as item 1 is ignored.", "capability": "claude/wsim/01#1", "function": "claude/wsim/01", "rules": ["claude/RULE-058"], "sources": ["base/src/lgicvs01.cbl:123-191"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-N-001", "code": "REQ-N-001", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall serialise the read and write of the control queue by an exclusive lock (ENQ/DEQ) on GENACNTL.", "capability": "claude/wsim/01#1", "function": "claude/wsim/01", "rules": ["claude/RULE-058"], "sources": ["base/src/lgicvs01.cbl:129-131", "base/src/lgicvs01.cbl:189-191"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Event-driven", "text": "When the random customer number is calculated, the system shall compute the candidate as INTEGER(RANDOM(seed) x (high - low) + low), with the random function seeded with the CICS task number (EIBTASKN).", "capability": "claude/wsim/01#2", "function": "claude/wsim/01", "rules": ["claude/RULE-005"], "sources": ["base/src/lgicvs01.cbl:193-209"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall choose candidates in the range [low, high-1], because the high value itself can never be chosen (RANDOM < 1 and INTEGER rounds down).", "capability": "claude/wsim/01#2", "function": "claude/wsim/01", "rules": ["claude/RULE-005"], "sources": ["base/src/lgicvs01.cbl:193-209"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Event-driven", "text": "When the candidate customer number has been calculated, the system shall return the first customer that exists at or above that number using a greater-or-equal lookup on KSDSCUST.", "capability": "claude/wsim/01#2", "function": "claude/wsim/01", "rules": ["claude/RULE-005"], "sources": ["base/src/lgicvs01.cbl:193-209"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Unwanted", "text": "If no customer exists at or above the candidate (NOTFND/ENDFILE), then the system shall return the raw candidate number even though no such customer exists.", "capability": "claude/wsim/01#2", "function": "claude/wsim/01", "rules": ["claude/RULE-005"], "sources": ["base/src/lgicvs01.cbl:193-209"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-F-010", "code": "REQ-F-010", "kind": "F", "pattern": "State-driven", "text": "While low equals high, the system shall always return low (or the next existing customer).", "capability": "claude/wsim/01#2", "function": "claude/wsim/01", "rules": ["claude/RULE-005"], "sources": ["base/src/lgicvs01.cbl:193-209"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-N-002", "code": "REQ-N-002", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall reseed the random function with the task number on every call, which makes the choice deterministic for a given task number.", "capability": "claude/wsim/01#2", "function": "claude/wsim/01", "rules": ["claude/RULE-005"], "sources": ["base/src/lgicvs01.cbl:193-209"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/01/REQ-N-003", "code": "REQ-N-003", "kind": "N", "pattern": "Ubiquitous", "text": "The system shall hold the candidate in WS-RANDOM-Number (PIC 9(8) COMP), so candidates above 99,999,999 lose their high-order digits and a high < low range is stored without its sign.", "capability": "claude/wsim/01#2", "function": "claude/wsim/01", "rules": ["claude/RULE-005"], "sources": ["base/src/lgicvs01.cbl:193-209"], "programs": ["LGICVS01"]}, {"key": "claude/wsim/02/REQ-F-001", "code": "REQ-F-001", "kind": "F", "pattern": "Event-driven", "text": "When a policy inquiry simulation request runs, the system shall read KSDSPOLY generically (GTEQ, 11-byte partial key = type + customer number) and return the first 21-byte policy key (type + customer + policy number) after 'Policy Key='.", "capability": "claude/wsim/02#1", "function": "claude/wsim/02", "rules": ["claude/RULE-007"], "sources": ["base/src/lgipvs01.cbl:90-119"], "programs": ["LGIPVS01"]}, {"key": "claude/wsim/02/REQ-F-002", "code": "REQ-F-002", "kind": "F", "pattern": "Event-driven", "text": "When the request comes from a terminal, the system shall take the number length as received length - 6 (5-byte transaction id + 1-byte type) and right-justify a shorter number into the 10-digit key.", "capability": "claude/wsim/02#1", "function": "claude/wsim/02", "rules": ["claude/RULE-007"], "sources": ["base/src/lgipvs01.cbl:90-119"], "programs": ["LGIPVS01"]}, {"key": "claude/wsim/02/REQ-F-003", "code": "REQ-F-003", "kind": "F", "pattern": "Event-driven", "text": "When the request comes from a COMMAREA call, the system shall always take 10 characters after the type as the customer number and ignore the caller's actual length (EIBCALEN).", "capability": "claude/wsim/02#1", "function": "claude/wsim/02", "rules": ["claude/RULE-007"], "sources": ["base/src/lgipvs01.cbl:94-96"], "programs": ["LGIPVS01"]}, {"key": "claude/wsim/02/REQ-F-004", "code": "REQ-F-004", "kind": "F", "pattern": "Unwanted", "text": "If no policy exists for that customer, then the system shall return the next customer's policy of the same type (or a later type).", "capability": "claude/wsim/02#1", "function": "claude/wsim/02", "rules": ["claude/RULE-007"], "sources": ["base/src/lgipvs01.cbl:90-119"], "programs": ["LGIPVS01"]}, {"key": "claude/wsim/02/REQ-F-005", "code": "REQ-F-005", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall generate no random number for policy selection, so any randomness must come from the caller.", "capability": "claude/wsim/02#1", "function": "claude/wsim/02", "rules": ["claude/RULE-007"], "sources": ["base/src/lgipvs01.cbl:90-119"], "programs": ["LGIPVS01"]}, {"key": "claude/wsim/02/REQ-F-006", "code": "REQ-F-006", "kind": "F", "pattern": "Unwanted", "text": "If the first policy found is of a different type than the one requested, then the system shall return 'Policy Bad=' with the customer number 0000000013 and the policy number 0000000013, leaving the type byte at its initial value 'X'.", "capability": "claude/wsim/02#2", "function": "claude/wsim/02", "rules": ["claude/RULE-031"], "sources": ["base/src/lgipvs01.cbl:121-141", "base/src/lgipvs01.cbl:41"], "programs": ["LGIPVS01"]}, {"key": "claude/wsim/02/REQ-F-007", "code": "REQ-F-007", "kind": "F", "pattern": "Unwanted", "text": "If the policy file read gives any non-NORMAL response (NOTFND, ENDFILE, I/O error), then the system shall treat it the same as a type mismatch and return 'Policy Bad=' with customer and policy numbers both set to 13.", "capability": "claude/wsim/02#2", "function": "claude/wsim/02", "rules": ["claude/RULE-031"], "sources": ["base/src/lgipvs01.cbl:121-141"], "programs": ["LGIPVS01"]}, {"key": "claude/wsim/02/REQ-F-008", "code": "REQ-F-008", "kind": "F", "pattern": "Ubiquitous", "text": "The system shall check only the type of the returned policy, not the customer number, so a policy belonging to a different (higher) customer of the same type is accepted as valid.", "capability": "claude/wsim/02#2", "function": "claude/wsim/02", "rules": ["claude/RULE-031", "claude/RULE-007"], "sources": ["base/src/lgipvs01.cbl:121-141"], "programs": ["LGIPVS01"]}, {"key": "claude/wsim/02/REQ-F-009", "code": "REQ-F-009", "kind": "F", "pattern": "Event-driven", "text": "When the program was started from a terminal, the system shall send the response to the terminal as 80 bytes; when linked or started via DPL, the system shall put the response in the COMMAREA (text + 21-byte key).", "capability": "claude/wsim/02#2", "function": "claude/wsim/02", "rules": ["claude/RULE-031"], "sources": ["base/src/lgipvs01.cbl:121-141"], "programs": ["LGIPVS01"]}], "rules": [{"key": "claude/RULE-001", "function": "claude/customer/01", "id": "RULE-001", "name": "New customer number allocation (shared counter first, database identity as fallback)", "text": "Given A valid add-customer request (first name 'JOHN', last name 'SMITH', DOB '1980-05-01', postcode 'AB1 2CD')\nWhen LGACDB01 runs Obtain-CUSTOMER-Number and the GENACUSTNUM counter returns 1000042 with RESP NORMAL\nThen The CUSTOMER row is inserted with CUSTOMERNUMBER 1000042 and CA-CUSTOMER-NUM returns 0001000042. If the counter RESP is not NORMAL, flag LGAC-NCS is set to 'NO', the row is inserted with CUSTOMERNUMBER DEFAULT, and the value from IDENTITY_VAL_LOCAL() is returned.", "program": "LGACDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007"], "priority": "P0", "category": "Calculation", "confidence": "High", "source": "base/src/lgacdb01.cbl:199-285", "plain": "Each new customer gets its customer number from the shared CICS named counter GENACUSTNUM in pool GENA. If the counter can't be reached, DB2 assigns the number with an identity column, and that number is sent back to the caller.", "defect": "Customer numbers come from two independent sources, the named counter and the DB2 identity. If the counter fails intermittently, an identity value may collide with a number the counter hands out later, or the other way round. Separately, the error-message comment says it records the customer number, but EM-CUSNUM is never filled in."}, {"key": "claude/RULE-002", "function": "claude/policy/01", "id": "RULE-002", "name": "Motor and house details stored without rating", "text": "Given A Motor add request with value 15000, engine size 1600cc, premium 450 and 2 accidents\nWhen The MOTOR row is inserted\nThen PREMIUM is stored as 450 and ACCIDENTS as 2, exactly as supplied. The premium is not adjusted for accidents, CC or value.", "program": "LGAPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "base/src/lgapdb01.cbl:440-471", "plain": "Motor policies store the caller's vehicle details, premium and accident count without any premium calculation. House policies (lines 402-425) likewise store property type, bedrooms, value and address as supplied.", "defect": ""}, {"key": "claude/RULE-003", "function": "claude/ops/01", "id": "RULE-003", "name": "Request type normalisation for statistics", "text": "Given A statistics event with request id '02ACUS' or '02ICOM'/'03ICOM'/'05ICOM'\nWhen The counter name is built\nThen '02ACUS' is counted as '01ACUS'; '02ICOM', '03ICOM' and '05ICOM' are counted as '01ICOM'; every other request id is counted under its own value", "program": "LGASTAT1", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "base/src/lgastat1.cbl:122-126", "plain": "Certain request types are counted under a canonical request type so that variants of the same business transaction add up together.", "defect": ""}, {"key": "claude/RULE-004", "function": "claude/ops/01", "id": "RULE-004", "name": "Outcome bucket and transaction counter increment", "text": "Given Request id '01ICOM' with return code '00', and another with return code '70'\nWhen The statistics counter is incremented\nThen The first increments CICS named counter 'GENA01ICOM00' and the second increments 'GENA01ICOM99' in pool GENA (any non-'00' return code is grouped as '99'); the counter's value is returned into Trancount but not otherwise used", "program": "LGASTAT1", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "base/src/lgastat1.cbl:127-133", "plain": "Each processed request increments one named counter per request type and outcome, where outcome is either success ('00') or failure ('99').", "defect": "Errors from GET COUNTER (e.g. counter not defined for a new request type) are ignored, so volumes can be silently under-reported."}, {"key": "claude/RULE-005", "function": "claude/wsim/01", "id": "RULE-005", "name": "Random customer number selection within the control range", "text": "Given The range is low 1000001 and high 1000101, the random function seeded with the CICS task number returns 0.4567, and customer 1000046 does not exist but 1000047 does\nWhen The random customer number is calculated and looked up\nThen The candidate is INTEGER(0.4567 x (1000101 - 1000001) + 1000001) = 1000046. The greater-or-equal lookup on KSDSCUST finds 1000047, which is returned.", "program": "LGICVS01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-N-002", "REQ-N-003"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "base/src/lgicvs01.cbl:193-209", "plain": "The program picks a pseudo-random customer number between the control-queue low and high values, then returns the first customer that actually exists at or above that number.", "defect": "WS-RANDOM-Number is PIC 9(8), but customer numbers are 10 digits (PIC 9(10)). Candidates above 99,999,999 lose their high-order digits. Also, a failed file read silently returns a customer number that may not exist instead of an error."}, {"key": "claude/RULE-006", "function": "claude/policy/02", "id": "RULE-006", "name": "Response area must be large enough for the full policy record", "text": "Given An endowment policy with PADDINGDATA of length 40 and a caller commarea of 150 bytes\nWhen 01IEND inquiry succeeds in the database\nThen Required length = 33 + 124 + 40 = 197; since 150 < 197 return code '98' and no policy data is returned. With a 200-byte commarea the data is returned and 'FINAL' is written at padding offset 41 (1 + 40).", "program": "LGIPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-010"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "base/src/lgipdb01.cbl:370-417", "plain": "Before returning policy data the program computes the response size needed (header/trailer plus the full policy layout, plus variable-length padding for endowments) and rejects the request with code 98 if the caller's area is too small.", "defect": ""}, {"key": "claude/RULE-007", "function": "claude/wsim/02", "id": "RULE-007", "name": "Policy lookup by policy type and customer number (generic key)", "text": "Given Input type 'M' and customer number 0001000010, and the policy file holds M/0001000010/0000000003 as the first key at or above M0001000010\nWhen A policy inquiry simulation request runs\nThen KSDSPOLY is read generically (GTEQ, 11-byte partial key = type + customer number) and the key 'M00010000100000000003' is returned after 'Policy Key='", "program": "LGIPVS01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-008"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "base/src/lgipvs01.cbl:90-119", "plain": "The caller supplies a one-character policy type and a customer number. The program returns the first policy on the policy file whose type-plus-customer key is equal to or greater than that pair.", "defect": "The program header (lines 7-9) and the module description call this a 'random' policy, but the code generates no random number. Any randomness must come from the caller. The MOVE EIBCALEN on line 94 is immediately overwritten by the constant 11 on line 95, which looks like dead or leftover logic."}, {"key": "claude/RULE-008", "function": "claude/ops/03", "id": "RULE-008", "name": "Next-customer-number counter reseeded to last customer number", "text": "Given GENACUSTNUM currently stands at any value (for example 532) and the operator gives no override\nWhen LGSETUP runs\nThen GENACUSTNUM is deleted and redefined in pool GENA with value 11. The next GET COUNTER in customer add (lgacdb01.cbl:201-210) returns 11 as the new customer number", "program": "LGSETUP", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "base/src/lgsetup.cbl:179-187", "plain": "The named counter GENACUSTNUM in pool GENA, which issues new customer numbers, is deleted and recreated with its current value set to the last customer number (default 11).", "defect": "Possible off-by-one: the counter is seeded with the highest existing customer number rather than highest + 1, so the next allocated number may collide with an existing customer."}, {"key": "claude/RULE-009", "function": "claude/logging/01", "id": "RULE-009", "name": "Log record composition and length by invocation mode", "text": "Given Program LGAPOL01 links to LGSTSQ with a 60-byte commarea on system 'CICA'\nWhen The log record is built\nThen WS-FLAG='C', the record is 'CICA' + ' ' + commarea text, and the write length is 60 + 5 = 65. For a terminal-entered transaction of 80 bytes (5-byte tranid + 75 data), WS-FLAG='R', the message is the received data after the tranid, and the length is 80 - 5 + 5 = 80", "program": "LGSTSQ", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-007"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "base/src/lgstsq.cbl:57-90", "plain": "Each log record is the 4-character CICS system id, one space, and the message text. The message comes from the calling program's commarea, or from terminal input with the 5-character transaction id removed. The record length is the message length plus 5.", "defect": "The length comes from EIBCALEN without any upper or lower bound. A commarea over 90 bytes sets a write length above the 95-byte buffer, and a commarea under 90 bytes still copies 90 bytes from COMMA-DATA, so storage past the caller's area can be read. WS-RECV is 79 bytes but the receive length is 80."}, {"key": "claude/RULE-010", "function": "claude/ui/01", "id": "RULE-010", "name": "Customer number low/high control record maintenance", "text": "Given Control queue GENACNTL contains '**** GENAPP CNTL', 'LOW CUSTOMER=0000000001', 'HIGH CUSTOMER=0000000010'\nWhen A new customer 0000000011 is successfully added\nThen The 'HIGH CUSTOMER=' entry is rewritten to 'HIGH CUSTOMER=0000000011'; LOW is unchanged. If the queue was empty, it is created with header, 'LOW CUSTOMER=0000000011' and 'HIGH CUSTOMER=0000000011'", "program": "LGTESTC1", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-N-001"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "base/src/lgtestc1.cbl:283-347", "plain": "After each successful customer add, a shared control queue (GENACNTL) records the lowest and highest customer numbers issued: the first add creates LOW=HIGH=new number, later adds overwrite HIGH with the new number, all under an exclusive lock.", "defect": "No comparison of new customer number against existing HIGH; and if the queue exists without a HIGH entry, header and LOW records are re-appended, producing duplicate control entries."}, {"key": "claude/RULE-011", "function": "claude/ops/02", "id": "RULE-011", "name": "Total successful vs failed transaction counts", "text": "Given Success counters GENA01ICUS00=100, GENA01ACUS00=20, and every other '00' counter = 0. Error counters GENA01ICUS99=3, and every other '99' counter = 0.\nWhen the collector aggregates the counters\nThen CountSuccess = 120 and CountErrors = 3. CountSuccess is written to rate queue GENAX00V (new/old/delta). CountErrors goes only into the unused display field S39.", "program": "LGWEBST5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "base/src/lgwebst5.cbl:281-678", "plain": "Total successes is the sum of all seventeen per-transaction success counters (suffix 00), and total errors is the sum of the seventeen matching error counters (suffix 99). Only the total successes is published as a rate queue.", "defect": "Total errors is computed but never persisted to a queue. A failed counter query silently adds the previous counter's value again."}, {"key": "claude/RULE-012", "function": "claude/ops/02", "id": "RULE-012", "name": "Transaction volume by operation type (inquire/add/update/delete)", "text": "Given Successful inquiries ICUS=50, IMOT=10, IEND=5, IHOU=3, ICOM=2\nWhen the collector aggregates the counters\nThen the inquire total is 70, written to GENAX01V. The add total goes to GENAX02V, update to GENAX03V and delete to GENAX04V, each as a new/old/delta triple.", "program": "LGWEBST5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016", "REQ-F-017", "REQ-F-018", "REQ-F-019"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "base/src/lgwebst5.cbl:286-699", "plain": "Successful transactions are grouped by business operation across product lines (customer, motor, endowment, house, commercial), and each group total is published as its own rate queue.", "defect": ""}, {"key": "claude/RULE-013", "function": "claude/ops/02", "id": "RULE-013", "name": "Elapsed seconds since the previous statistics snapshot", "text": "Given Queue GENA000V holds the previous run time 14:58:30 (HHMMSS), and the current CICS time is 14:59:30\nWhen the statistics collector runs\nThen the old time is 53910 s (14*3600+58*60+30), the new time is 53970 s, the interval is 60 s, and GENA000V is rewritten with item 1 = '145930' (current time) and item 2 = '000060' (the interval)", "program": "LGWEBST5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-004", "REQ-F-005", "REQ-F-006"], "priority": "P1", "category": "Calculation", "confidence": "High", "source": "base/src/lgwebst5.cbl:715-760", "plain": "Each run works out how many seconds have passed since the last run by turning both times of day into seconds since midnight and subtracting. It uses 12:00:00 as the last-run time if no earlier run is on record.", "defect": "The interval goes into an unsigned PIC 9(6) field, so a negative result (crossing midnight, or a run before the 12:00:00 default) loses its sign and shows a large positive interval. On the first run the interval is made up, measured from noon."}, {"key": "claude/RULE-014", "function": "claude/ops/02", "id": "RULE-014", "name": "Per-counter snapshot and change since last snapshot (rate delta)", "text": "Given Queue GENA100V (successful customer inquiries) has 1,250 as item 1 from the last run, and the counter now reads 1,310\nWhen the collector processes that counter\nThen the queue is deleted and rewritten as item 1 = 000001310 (new), item 2 = 000001250 (old), item 3 = 000000060 (delta = new - old)", "program": "LGWEBST5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-012"], "priority": "P1", "category": "Calculation", "confidence": "Medium", "source": "base/src/lgwebst5.cbl:769-802", "plain": "For each tracked business counter, the collector keeps a small queue holding the current value, the previous value, and the change between them. Dashboards use this to show transaction volume per interval.", "defect": "An unsigned delta hides counter resets: it shows a positive spike instead of a negative or reset value. A failed read silently reuses the previous counter's value as the baseline."}, {"key": "claude/RULE-015", "function": "claude/policy/01", "id": "RULE-015", "name": "Endowment free-form padding data stored only when supplied", "text": "Given An Endowment add request 252 bytes long\nWhen The endowment row is inserted\nThen The padding data length is 252 - 152 = 100. The 100 bytes are stored in PADDINGDATA together with with-profits, equities, managed fund, fund name, term, sum assured and life assured.", "program": "LGAPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-F-015"], "priority": "P2", "category": "Calculation", "confidence": "High", "source": "base/src/lgapdb01.cbl:339-387", "plain": "For Endowment policies, any request bytes beyond the required 152 are stored as variable-length padding data on the endowment record. If there are no extra bytes, the record is stored without padding data.", "defect": ""}, {"key": "claude/RULE-016", "function": "claude/policy/02", "id": "RULE-016", "name": "Policy inquiry requires matching customer and policy number", "text": "Given Customer 0000000001 owns policy 0000000005 (a House policy) and policy 0000000009 belongs to another customer\nWhen A 01IHOU inquiry is made for customer 0000000001 and policy 0000000009\nThen No row matches the join POLICY.CUSTOMERNUMBER = customer AND POLICY.POLICYNUMBER = policy; return code '01' (not found). Any other DB error returns '90' and an error message (date, time, customer, policy, SQLCODE plus up to 90 bytes of commarea) is written via LGSTSQ.", "program": "LGIPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007"], "priority": "P0", "category": "Validation", "confidence": "High", "source": "base/src/lgipdb01.cbl:327-431", "plain": "A single policy's details (Endowment, House, Motor, Commercial 01ICOM) are returned only when the policy number belongs to the requesting customer; otherwise the caller is told the policy was not found.", "defect": ""}, {"key": "claude/RULE-017", "function": "claude/policy/03", "id": "RULE-017", "name": "Optimistic concurrency check on policy last-changed timestamp", "text": "Given Customer 1 / policy 5 exists with LASTCHANGED '2021-03-01-10.00.00.000000'\nWhen An update arrives with CA-LASTCHANGED '2021-02-28-09.00.00.000000'\nThen No tables are changed and the intended return code is '02' (timestamp mismatch). If no policy row matches the customer and policy number, the intended code is '01' (not found). Any other fetch error gives '90' and is logged", "program": "LGUPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008"], "priority": "P0", "category": "Validation", "confidence": "Medium", "source": "base/src/lgupdb01.cbl:272-358", "plain": "A policy can only be updated if the caller's copy carries the same last-changed timestamp as the database; otherwise the update is refused as stale.", "defect": "After the check, CLOSE-PCURSOR (line 360) always runs. A successful close sets CA-RETURN-CODE to '00' (line 371), which overwrites the '02' mismatch and '01' not-found codes, so the caller is told a stale or missing-policy update succeeded. A close that fails with -501 also forces '00' (line 373)."}, {"key": "claude/RULE-018", "function": "claude/customer/01", "id": "RULE-018", "name": "Minimum request size for customer add and inquire", "text": "Given An add-customer request commarea of 80 bytes\nWhen LGACUS01 (or LGICUS01 or LGACDB01) checks the length\nThen CA-RETURN-CODE = '98' and the program returns without touching the database. With 0 bytes, an error message is logged and the task abends with code 'LGCA'.", "program": "LGACUS01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-004", "REQ-F-001", "REQ-F-003"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "base/src/lgacus01.cbl:94-115", "plain": "Add-customer and inquire-customer requests must contain at least the 18-byte header plus 72 bytes of customer data (90 bytes). A shorter request is rejected with return code 98, and a request with no data at all ends abnormally with code LGCA.", "defect": "WS-CUSTOMER-LEN = 72 is smaller than the actual customer layout in lgcmarea.cpy (215 bytes: names, DOB, address, policy count, phones, and a 100-byte email). A 90-byte request passes the check, but the insert then reads data past the
