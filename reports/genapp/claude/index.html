ENACUSTNUM'<\/td><td>Pool GENA; also lgacdb01.cbl:38-39<\/td><\/tr><tr><td>GENACNTn00 / GENACNTn99<\/td><td>PIC X(16) e.g. 'GENA01ICUS00' / 'GENA01ICUS99'<\/td><td>Success (00) / error (99) counters per operation (lgsetup.cbl:59-94)<\/td><\/tr><tr><td>LGASTAT1 GENAcount<\/td><td>'GENA' + GENAcounter X(6) + GENAtype X(2) + 4 spaces<\/td><td>lgastat1.cbl:38<\/td><\/tr><tr><td>STSQ-STRT / STSQ-STAT / STSQ-ERRS<\/td><td>X(8) 'GENASTRT' / 'GENASTAT' / 'GENAERRS'<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: New customer number allocation (shared counter first, database identity as fall\u2026, Next-customer-number counter reseeded to last customer number, Transaction statistics counters reset to zero, Operational log and status queues purged on reset, Request type normalisation for statistics, Outcome bucket and transaction counter increment, Statistics start-time stamp recorded once, Statistics event source selection and no-input exit<\/p><h3>LGWEBST5 statistics snapshot working set and SymbList<\/h3><p>Source: <code>legacy/genapp/base/src/lgwebst5.cbl:18<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>CountVal / CountSuccess / CountErrors<\/td><td>S9(8) COMP / S9(9) COMP / S9(8) COMP<\/td><td><\/td><\/tr><tr><td>CountInq / CountAdd / CountUpd / CountDel<\/td><td>S9(8) COMP each<\/td><td><\/td><\/tr><tr><td>DRateVal / NRateVal / ORateVal<\/td><td>9(9) each<\/td><td>Rate delta vs previous snapshot (inferred from names)<\/td><\/tr><tr><td>HHval / MMval / SSval, WS-OLDV, WS-NEWV<\/td><td>9(6) / X(6) groups<\/td><td>Elapsed time since last snapshot (lgwebst5.cbl:31-33,63-67)<\/td><\/tr><tr><td>WS-TSQname / WS-TSQdata / WS-TSQstart<\/td><td>X(8) / X(9) / X(24)<\/td><td>Per-counter TSQ snapshot; StatQ 'GENASTAT'<\/td><\/tr><tr><td>SymbList<\/td><td>group: APPLID= S1 X(8), &amp;GENAcount-V= S2..Sn Z(8)9/X(9)<\/td><td>lgwebst5.cbl:76; built but not delivered per rule list<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Elapsed seconds since the previous statistics snapshot, Statistics collector re-schedules itself every minute, Per-counter snapshot and change since last snapshot (rate delta), Total successful vs failed transaction counts, Transaction volume by operation type (inquire/add/update/delete), Business-monitor symbol list is built but never delivered<\/p><h3>LGASTAT1 event inputs (WS-Data-Req / WS-Data-RC)<\/h3><p>Source: <code>legacy/genapp/base/src/lgastat1.cbl:23<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>WS-Qname<\/td><td>X(8) VALUE 'GENASTRT'<\/td><td><\/td><\/tr><tr><td>WS-CONTname / WS-CHANname / WS-CHANname1/2<\/td><td>X(16) 'DFHEP.CCECONTEXT' / 'DFHEP.EVENT' / 'DFHEP.DATA.0000\u2026<\/td><td>CICS event-processing channel/containers<\/td><\/tr><tr><td>WS-Data-Req<\/td><td>PIC X(6)<\/td><td>Request ID from event or commarea<\/td><\/tr><tr><td>WS-Data-RC<\/td><td>PIC X(2)<\/td><td>Return code from event or commarea<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Statistics event source selection and no-input exit, Statistics start-time stamp recorded once, Request type normalisation for statistics, Outcome bucket and transaction counter increment<\/p><h3>LGIPVS01 policy lookup key and response (PART-KEY / CA-AREA / WRITE-MSG; SOAVPII/SOAVPIO)<\/h3><p>Source: <code>legacy/genapp/base/src/lgipvs01.cbl:38<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>PART-KEY-Type / PART-KEY-Num<\/td><td>X / 9(10)<\/td><td>Generic 11-byte key, GTEQ read (lgipvs01.cbl:111-118)<\/td><\/tr><tr><td>CA-AREA: CA-POLICY-TYPE / CA-CUSTOMER-NUM / CA-POLICY-NUM / Filler<\/td><td>X / X(10) / X(10) / X(43)<\/td><td>64-byte KSDSPOLY image<\/td><\/tr><tr><td>WRITE-MSG-Text<\/td><td>X(11) 'Policy Key=' or 'Policy Bad='<\/td><td><\/td><\/tr><tr><td>WRITE-Msg-Type / CustNum / PolNum<\/td><td>X / 9(10) / 9(10)<\/td><td>13 placed in both on mismatch (lgipvs01.cbl:124-125)<\/td><\/tr><tr><td>SOA in: Type / Cust-Num<\/td><td>X / 9(10)<\/td><td>soavpii.cpy:13<\/td><\/tr><tr><td>SOA out: Comma-Data-Text / Comma-Data-Key<\/td><td>X(11) / X(21)<\/td><td>soavpio.cpy:13<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Policy lookup by policy type and customer number (generic key), Reject policy lookups whose returned type does not match the requested type<\/p><h3>LGICVS01 customer lookup commarea (SOAVCII/SOAVCIO)<\/h3><p>Source: <code>legacy/genapp/base/src/lgicvs01.cbl:82<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>Comma-Data-H<\/td><td>PIC X(14)<\/td><td><\/td><\/tr><tr><td>Comma-Data-High<\/td><td>PIC 9(10)<\/td><td>Returned customer number<\/td><\/tr><tr><td>SOA in Customer-Number<\/td><td>PIC X(10)<\/td><td>soavcii.cpy:6<\/td><\/tr><tr><td>SOA out Comma-Data-Text / Comma-Data-High<\/td><td>X(14) / X(10)<\/td><td>soavcio.cpy:6<\/td><\/tr><tr><td>WS-Cust-Low / WS-Cust-High<\/td><td>S9(10) each<\/td><td>Default 0001000001 (lgicvs01.cbl:121-122)<\/td><\/tr><tr><td>WS-RANDOM-Seed / WS-RANDOM-Number<\/td><td>S9(4) COMP / 9(8) COMP<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Customer number range is held in a shared control queue and self-initialised, Random customer number selection within the control range<\/p><h3>LGIPDB01 commercial list output (ICOM-Record) and host integers<\/h3><p>Source: <code>legacy/genapp/base/src/lgipdb01.cbl:166<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>DB2-CUSTOMERNUM-INT / DB2-POLICYNUM-INT / DB2-CLAIMNUM-INT<\/td><td>S9(9) COMP<\/td><td><\/td><\/tr><tr><td>DB2-OUT-INTEGERS (broker, payment, term, sum assured, padding len, bedrooms, va\u2026<\/td><td>S9(9) / S9(4) COMP<\/td><td>lgipdb01.cbl:170-192<\/td><\/tr><tr><td>ICOM-Record<\/td><td>PIC X(1202)<\/td><td>Per-row commercial result in linkage (lgipdb01.cbl:222)<\/td><\/tr><tr><td>ICOM-Record-Count<\/td><td>S9(4) COMP<\/td><td>lgipdb01.cbl:80<\/td><\/tr><tr><td>END-POLICY-POS / WS-CA-HEADERTRAILER-LEN<\/td><td>S9(4) COMP +1 / +33<\/td><td>lgipdb01.cbl:73,78<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Inquiry type routing by request ID, List commercial policies by customer (capped) or by postcode, Commercial inquiry by policy number alone (no ownership check), End-of-policy-data marker, Response area must be large enough for the full policy record, Optional broker and payment values are left blank when absent, Commercial policy dates mapped from request/start/renewal dates, Commercial policy status, rejection reason and peril premiums are reported as s\u2026<\/p><h3>SSMAP BMS mapset (3270 screens SSMAPC1, SSMAPP1-P5)<\/h3><p>Source: <code>legacy/genapp/base/src/ssmap.bms:13<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>SSMAPC1: ENT1CNO, ENT1FNA, ENT1LNA, ENT1DOB, ENT1HNM, ENT1HNO, ENT1HPC, ENT1HP1\u2026<\/td><td>BMS fields<\/td><td>Customer screen (ssmap.bms:13-105)<\/td><\/tr><tr><td>SSMAPP1: ENP1PNO, ENP1CNO, ENP1IDA, ENP1EDA, ENP1CMK, ENP1CMO, ENP1VAL, ENP1REG\u2026<\/td><td>BMS fields<\/td><td>Motor (ssmap.bms:112)<\/td><\/tr><tr><td>SSMAPP2: ENP2PNO, ENP2CNO, ENP2IDA, ENP2EDA, ENP2FNM, ENP2TER, ENP2SUM, ENP2LIF\u2026<\/td><td>BMS fields<\/td><td>Endowment (ssmap.bms:237)<\/td><\/tr><tr><td>SSMAPP3: ENP3PNO, ENP3CNO, ENP3IDA, ENP3EDA, ENP3TYP, ENP3BED, ENP3VAL, ENP3HNM\u2026<\/td><td>BMS fields<\/td><td>House (ssmap.bms:346)<\/td><\/tr><tr><td>SSMAPP4 / SSMAPP5<\/td><td>BMS maps<\/td><td>Commercial / other (ssmap.bms:449,606); fields not fully enumerated here<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Customer menu permits only Inquire, Add and Update actions, New customer registration with system-assigned number and normalised postcode, Customer update is a read-then-write two-step, Motor policy menu permits Inquire, Add, Delete and Update, Motor policy add requires an existing customer and defaults payment/broker, Motor policy delete with rollback on failure, Motor policy update overwrites payment and broker details, Endowment (life) policy menu option dispatch and invalid-option guard, Inquire policy by customer number and policy number, Add endowment policy from terminal, Add house policy from terminal, Terminal-entered policies carry no broker and no payment, Update endowment policy via inquire-then-update, Update house policy via inquire-then-update, Delete policy with rollback on failure, Error path resets screen and conversation context, Commercial policy inquiry search-key precedence, Add commercial property policy with rollback on failure, Delete commercial property policy with rollback on failure, Commercial policy menu option validation, Commercial policy screen session flow and exit keys<\/p><h3>SOAIC01 web-service customer commarea<\/h3><p>Source: <code>legacy/genapp/base/src/soaic01.cpy:6<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>CA-REQUEST-ID / CA-RETURN-CODE / CA-CUSTOMER-NUM<\/td><td>X(6) / 9(2) / 9(10)<\/td><td><\/td><\/tr><tr><td>CA-FIRST-NAME .. CA-EMAIL-ADDRESS<\/td><td>same as LGCMAREA customer request<\/td><td><\/td><\/tr><tr><td>CA-POLICY-DATA<\/td><td>PIC X(30000)<\/td><td>Shorter than LGCMAREA's X(32267); used by web-service JCL (wsaic01.jcl etc.)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Used by: Customer inquiry outcome classification, Customer inquiry requires minimum request size<\/p><h3>POLLOO2 / POLLOOK customer-policy list request<\/h3><p>Source: <code>legacy/genapp/base/src/polloo2.cpy:6<\/code><\/p>\n<div class='scroll'><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>CA-POLICIES OCCURS 5 TIMES: CA-POLICY-NUMBER / CA-POLICY-TYPE<\/td><td>9(10) / X(1)<\/td><td><\/td><\/tr><tr><td>CA-POLICY-DATA<\/td><td>PIC X(32427)<\/td><td><\/td><\/tr><tr><td>POLLOOK: CA-REQUEST-ID / CA-CUSTOMER-NUM / CA-REQUEST-SPECIFIC<\/td><td>X(6) / 9(10) / X(32482)<\/td><td>pollook.cpy:6; no COPY of either found in any .cbl - appears unused<\/td><\/tr><\/tbody><\/table><\/div>", "sections": [{"title": "Assessment: summary", "html": "<h2>Assessment: genapp<\/h2>\n<p>Written 2026-11-25 by <code>/code-modernization:modernize-assess<\/code>. Source: <code>legacy/genapp<\/code>, a read-only directory in this workspace (not a symlink), snapshot SHA-256 <code>1c228d21\u20269a0<\/code>. Nothing in the source was changed. Paths below are relative to <code>legacy/genapp/base/<\/code> unless they start with <code>legacy/<\/code>.<\/p>", "open": true}, {"title": "Assessment: Executive Summary", "html": "<p>GenApp is a small IBM z/OS insurance back office written in CICS + Enterprise COBOL. Customers and four policy products (motor, endowment, house, commercial) are stored in Db2 and copied to VSAM. Users reach it through 3270 test menus and unauthenticated SOAP web services. The code is small: about <strong>6.8 KSLOC of COBOL<\/strong>, or 10.7 KSLOC with JCL, BMS and REXX. The risk sits in a few places rather than in the size.<\/p>\n<ul><li><strong>Security:<\/strong> the SOAP endpoints are open on plain HTTP with no authentication (Critical). The CICSPlex SM web console and CMCI API also run with security off.<\/li><li><strong>Memory safety:<\/strong> a fixed 32,500-byte commarea causes reachable out-of-bounds reads and writes.<\/li><li><strong>Data integrity:<\/strong> Db2 and VSAM are dual-written with no shared commit, so the two copies drift.<\/li><li><strong>Hidden defects:<\/strong> the policy-update program reports conflicts and failures as success, and commercial-policy update is silently half-implemented.<\/li><\/ul>\n<p><strong>Headline recommendation:<\/strong> <strong>Rearchitect<\/strong> through <code>reimagine<\/code>. The business logic is thin CRUD and lives in about 10 <code>*DB01<\/code> programs. Rebuild it from extracted rules on a single system of record with authenticated APIs, and don't carry over the current code's defects. Fix SEC-001 (unauthenticated SOAP) in place now if this system is reachable from any network.<\/p>", "open": false}, {"title": "Assessment: System Inventory", "html": "<p><strong>Tool used:<\/strong> neither <code>scc<\/code> nor <code>cloc<\/code> is installed. Lines were counted with a Python line classifier (blank, comment, code; COBOL column-7 comments, <code>//*<\/code> JCL comments). Complexity is the count of the decision keywords <code>IF<\/code>/<code>EVALUATE<\/code>/<code>WHEN<\/code>/<code>PERFORM<\/code>/<code>UNTIL<\/code> in non-comment COBOL lines. The index was computed by hand as <code>2.94 \u00d7 KSLOC^1.10<\/code>.<\/p>\n<div class='scroll'><table><thead><tr><th>Type<\/th><th>Files<\/th><th>Code<\/th><th>Comment<\/th><th>Blank<\/th><\/tr><\/thead><tbody><tr><td>COBOL programs (<code>.cbl<\/code>)<\/td><td>31<\/td><td>6,500<\/td><td>1,583<\/td><td>899<\/td><\/tr><tr><td>Copybooks (<code>.cpy<\/code>)<\/td><td>13<\/td><td>294<\/td><td>116<\/td><td>7<\/td><\/tr><tr><td>BMS map (<code>.bms<\/code>)<\/td><td>1<\/td><td>674<\/td><td>14<\/td><td>0<\/td><\/tr><tr><td>JCL (<code>.jcl<\/code>, templates)<\/td><td>29<\/td><td>3,079<\/td><td>296<\/td><td>139<\/td><\/tr><tr><td>ISPF REXX (<code>.rexx<\/code>)<\/td><td>2<\/td><td>173<\/td><td>18<\/td><td>21<\/td><\/tr><tr><td>Docs/data (<code>.md<\/code>, <code>.txt<\/code>)<\/td><td>7<\/td><td>n/a<\/td><td>n/a<\/td><td>n/a<\/td><\/tr><tr><td><strong>Total<\/strong><\/td><td><strong>83<\/strong><\/td><td><strong>10,720<\/strong><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p>The code has 346 <code>EXEC CICS<\/code> statements and 57 <code>EXEC SQL<\/code> statements (static SQL in 8 programs). It has 609 decision points, which is <strong>94 per COBOL KSLOC<\/strong>.<\/p>\n<p><strong>Most complex programs<\/strong> (decision keywords / code lines):<\/p>\n<div class='scroll'><table><thead><tr><th>Program<\/th><th>Decisions<\/th><th>Code lines<\/th><th>Role<\/th><\/tr><\/thead><tbody><tr><td><code>src/lgipdb01.cbl<\/code><\/td><td>101<\/td><td>739<\/td><td>Policy inquiry, 7 request types (god program)<\/td><\/tr><tr><td><code>src/lgupdb01.cbl<\/code><\/td><td>59<\/td><td>324<\/td><td>Policy update with optimistic locking<\/td><\/tr><tr><td><code>src/lgapdb01.cbl<\/code><\/td><td>49<\/td><td>408<\/td><td>Policy add, 4 products<\/td><\/tr><tr><td><code>src/lgwebst5.cbl<\/code><\/td><td>25<\/td><td>752<\/td><td>Monitoring statistics (mostly repeated counter queries)<\/td><\/tr><tr><td><code>src/lgtestc1.cbl<\/code><\/td><td>25<\/td><td>282<\/td><td>3270 customer menu<\/td><\/tr><tr><td><code>src/lgtestp4.cbl<\/code> / <code>p1<\/code> / <code>p2<\/code> / <code>p3<\/code><\/td><td>22\u201325<\/td><td>241\u2013264<\/td><td>3270 policy menus (near-duplicates)<\/td><\/tr><tr><td><code>src/lgacdb01.cbl<\/code><\/td><td>21<\/td><td>213<\/td><td>Customer add<\/td><\/tr><tr><td><code>src/lgicvs01.cbl<\/code><\/td><td>21<\/td><td>180<\/td><td>Random-customer workload helper<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Technology fingerprint<\/h4>\n<div class='scroll'><table><thead><tr><th>Area<\/th><th>Evidence<\/th><\/tr><\/thead><tbody><tr><td>Language and compiler<\/td><td>Enterprise COBOL 6.1 (<code>exec/cust1.rexx:12<\/code>, <code>PP.COBOL390.V610<\/code>), integrated CICS and Db2 coprocessors. Options are <code>NODYNAM RENT APOST CICS<\/code>, without SSRANGE (<code>cntl/cobol.jcl:44-50<\/code>).<\/td><\/tr><tr><td>Runtime<\/td><td>CICS TS 5.4 (<code>exec/cust1.rexx:7-9<\/code>, <code>CTS540.CICS710<\/code>), CICSPlex SM 5.4. Three topology variants: standalone (<code>cntl/cdef121.jcl<\/code>), TOR/AOR/DOR with static routing (<code>cdef122.jcl<\/code>), and dynamic routing (<code>cdef123.jcl<\/code>).<\/td><\/tr><tr><td>Data stores<\/td><td><strong>Db2 12<\/strong> (<code>exec/cust1.rexx:14-15<\/code>): 8 tables (CUSTOMER, CUSTOMER_SECURE, POLICY, ENDOWMENT, HOUSE, MOTOR, COMMERCIAL, CLAIM) with FK cascades (<code>cntl/db2cre.jcl:110-373<\/code>), plan <code>GENAONE<\/code> and collection <code>GENASA1<\/code> (<code>cntl/db2bind.jcl<\/code>). <strong>VSAM KSDS<\/strong>: <code>KSDSCUST<\/code> (225-byte records) and <code>KSDSPOLY<\/code> (64 bytes) (<code>cntl/adef121.jcl<\/code>). Seed data is in <code>data/<\/code>. <strong>CICS named counters and TS queues<\/strong>: pool <code>GENA<\/code> (<code>cntl/sampncs.jcl<\/code>, <code>samptsq.jcl<\/code>).<\/td><\/tr><tr><td>Data contracts<\/td><td><code>src/lgcmarea.cpy<\/code> (32,500-byte COMMAREA with REDEFINES per entity) and <code>src/lgpolicy.cpy<\/code> (Db2 row layouts).<\/td><\/tr><tr><td>Integration points<\/td><td><strong>SOAP<\/strong>: DFHLS2WS-generated web services over TCPIPSERVICE <code>GENATCP1<\/code> on port 4321, pipeline <code>GENAPIP1<\/code> (<code>cntl/cdef124.jcl<\/code>, <code>cntl/wsa*.jcl<\/code>, <code>src/soa*.cpy<\/code>). <strong>3270<\/strong>: BMS mapset <code>SSMAP<\/code> (<code>src/ssmap.bms<\/code>). <strong>CICS Event Processing<\/strong>: bundle <code>GENAEV01<\/code> feeds LGASTAT1 (<code>cntl/cdef125.jcl<\/code>); the bundle is not in the repo. <strong>WSim<\/strong>: workload-simulator scripts (<code>cntl/itp*.jcl<\/code>); the scripts themselves are not in the repo.<\/td><\/tr><tr><td>Build<\/td><td>JCL only, with no CI: <code>cntl/cobol.jcl<\/code> (compile and link, 31 steps), <code>asmmap.jcl<\/code>, <code>db2bind.jcl<\/code>. The JCL members are templates whose <code>&lt;PLACEHOLDER&gt;<\/code> tokens are filled by the ISPF REXX customizer <code>exec/cust1.rexx<\/code> with <code>exec/mac1.rexx<\/code>.<\/td><\/tr><tr><td>Tests<\/td><td><strong>None automated.<\/strong> <code>lgtestc1<\/code> and <code>lgtestp1<\/code>\u2013<code>p4<\/code> are manual 3270 drivers, not tests. WSim scripts (missing) are the only load harness. No coverage signal.<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "Assessment: Architecture at a Glance", "html": "<p>The diagram is in <code>analysis/genapp/ARCHITECTURE.mmd<\/code>. Every business call runs **front end \u2192 <code>*DB01<\/code> (Db2) \u2192 <code>*VS01<\/code> (VSAM)** through <code>EXEC CICS LINK<\/code>. The source has no XCTL and no COBOL <code>CALL<\/code>.<\/p>\n<div class='scroll'><table><thead><tr><th>#<\/th><th>Domain<\/th><th>Key files<\/th><th>Responsibility<\/th><\/tr><\/thead><tbody><tr><td>D1<\/td><td>Customer Management<\/td><td><code>src/lg{a,i,u}cus01<\/code>, <code>lgacdb01/02<\/code>, <code>lgicdb01<\/code>, <code>lgucdb01<\/code>, <code>lgacvs01<\/code>, <code>lgucvs01<\/code><\/td><td>Add, inquire and update customers. Customer numbers come from named counter <code>GENACUSTNUM<\/code>, with Db2 IDENTITY as fallback. There is no customer delete.<\/td><\/tr><tr><td>D2<\/td><td>Policy Management<\/td><td><code>src/lg{a,i,u,d}pol01<\/code>, <code>lg{a,i,u,d}pdb01<\/code>, <code>lg{a,u,d}pvs01<\/code><\/td><td>Add, inquire, update and delete 4 products. Commercial has no working update.<\/td><\/tr><tr><td>D3<\/td><td>Data Model and Persistence<\/td><td><code>src/lgcmarea.cpy<\/code>, <code>lgpolicy.cpy<\/code>, <code>cntl/db2cre.jcl<\/code>, <code>db2bind.jcl<\/code>, <code>adef121.jcl<\/code>, <code>data/*<\/code><\/td><td>Shared COMMAREA, Db2 DDL, KSDS definitions and seed data.<\/td><\/tr><tr><td>D4<\/td><td>3270 Presentation<\/td><td><code>src/ssmap.bms<\/code>, <code>lgtestc1<\/code>, <code>lgtestp1<\/code>\u2013<code>p4<\/code><\/td><td>Menus SSC1 and SSP1\u20134.<\/td><\/tr><tr><td>D5<\/td><td>Error Logging<\/td><td><code>src/lgstsq.cbl<\/code><\/td><td>Writes to TDQ <code>CSMT<\/code> and TSQ <code>GENAERRS<\/code>; 20 programs call it.<\/td><\/tr><tr><td>D6<\/td><td>Ops Control and Monitoring<\/td><td><code>src/lgsetup.cbl<\/code>, <code>lgastat1.cbl<\/code>, <code>lgwebst5.cbl<\/code>, <code>cntl/cdef125.jcl<\/code><\/td><td>Reset of queues and counters; event-driven statistics (LGASTAT1); a self-restarting rate job that runs every minute (SSST).<\/td><\/tr><tr><td>D7<\/td><td>Workload Simulation<\/td><td><code>src/lgicvs01<\/code>, <code>lgipvs01<\/code>, <code>cntl/itp*.jcl<\/code><\/td><td>Random-key helpers for WSim.<\/td><\/tr><tr><td>D8<\/td><td>Web Services / SOAP<\/td><td><code>cntl/wsa*.jcl<\/code>, <code>cdef124.jcl<\/code>, <code>src/soa*.cpy<\/code>, <code>pollook<\/code>/<code>polloo2<\/code><\/td><td>SOAP wrappers for D1, D2 and D7. There is no delete service.<\/td><\/tr><tr><td>D9<\/td><td>Build, Install and Topology<\/td><td><code>cntl/cobol.jcl<\/code>, <code>cdef121<\/code>\u2013<code>123<\/code>, <code>cpsmde2<\/code>, <code>defdrep<\/code>, <code>defwrep<\/code>, <code>sampcma<\/code>, <code>sampwui<\/code>, <code>exec/*.rexx<\/code><\/td><td>Compile and link, CSD definitions, CPSM/WUI setup, site customizer.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Entry points:<\/strong><\/p>\n<div class='scroll'><table><thead><tr><th>Transaction<\/th><th>Program<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>SSC1<\/td><td>LGTESTC1<\/td><td>Customer menu<\/td><\/tr><tr><td>SSP1<\/td><td>LGTESTP1<\/td><td>Motor menu<\/td><\/tr><tr><td>SSP2<\/td><td>LGTESTP2<\/td><td>Endowment menu<\/td><\/tr><tr><td>SSP3<\/td><td>LGTESTP3<\/td><td>House menu<\/td><\/tr><tr><td>SSP4<\/td><td>LGTESTP4<\/td><td>Commercial menu<\/td><\/tr><tr><td>LGSE<\/td><td>LGSETUP<\/td><td>Reset queues and counters<\/td><\/tr><tr><td>LGCF<\/td><td>LGICVS01<\/td><td>Random customer key (WSim)<\/td><\/tr><tr><td>LGPF<\/td><td>LGIPVS01<\/td><td>Random policy key (WSim)<\/td><\/tr><tr><td>LGST<\/td><td>LGASTAT1<\/td><td>Event Processing target<\/td><\/tr><tr><td>SSST<\/td><td>LGWEBST5<\/td><td>Statistics; restarts itself every minute<\/td><\/tr><tr><td>CWXN<\/td><td>CICS web attach<\/td><td>Receives the SOAP services on port 4321<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Dangling references:<\/strong><\/p>\n<div class='scroll'><table><thead><tr><th>Reference<\/th><th>Location<\/th><th>What is missing<\/th><\/tr><\/thead><tbody><tr><td><code>LGAPBR01<\/code><\/td><td><code>cntl/cdef121.jcl:73<\/code> and 4 more CSD entries<\/td><td>Defined in the CSD, but no source and no caller<\/td><\/tr><tr><td><code>IPPROGMB<\/code><\/td><td><code>cntl/wsaip01.jcl:112<\/code><\/td><td>Program behind SOAP URI <code>GENAPP/LGIPOL02<\/code>; no source<\/td><\/tr><tr><td>Bundle <code>GENAEV01<\/code><\/td><td><code>cntl/cdef125.jcl<\/code><\/td><td>Not in the repo<\/td><\/tr><tr><td><code>SSMAP<\/code> copybook<\/td><td><code>cntl/asmmap.jcl<\/code><\/td><td>Generated by this job; not in source control<\/td><\/tr><tr><td>Map <code>SSMAPP5<\/code><\/td><td><code>src/ssmap.bms<\/code><\/td><td>Defined but unused<\/td><\/tr><tr><td>Db2 table <code>CLAIM<\/code><\/td><td><code>cntl/db2cre.jcl:361<\/code><\/td><td>Created but unused<\/td><\/tr><tr><td>Counter <code>GENAOTHER<\/code><\/td><td><code>src/lgwebst5.cbl:233<\/code><\/td><td>Queried but never defined<\/td><\/tr><tr><td>Counters <code>GENA01UCUS00/99<\/code><\/td><td><code>src/lgsetup.cbl<\/code><\/td><td>Defined but never queried<\/td><\/tr><tr><td>WSim STL members<\/td><td><code>cntl/itpstl.jcl<\/code><\/td><td>Not in the repo<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "Assessment: Production Runtime Profile", "html": "<p><strong>No telemetry available.<\/strong> There is no APM MCP server, no SMF or CICS statistics, no batch logs and no VCS history (preflight Check 5). The domain risk ranking therefore uses only the static evidence; it has no runtime or change-frequency signal. If CICS monitoring (SMF 110) or the <code>GENA*<\/code> named-counter statistics that LGWEBST5 collects can be exported, rerun this step to tag D1 and D2 with p50, p95 and p99 response times.<\/p>", "open": false}, {"title": "Assessment: Technical Debt (top 10 by remediation value)", "html": "<div class='scroll'><table><thead><tr><th>#<\/th><th>Debt<\/th><th>Evidence<\/th><th>Why it matters<\/th><th>Remediation<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>Db2 and VSAM are dual-written with no shared commit, and failures are handled inconsistently<\/strong><\/td><td>Db2 is written, then VSAM is LINKed without a RESP check: <code>src/lgapdb01.cbl:243-246<\/code>, <code>lgdpdb01.cbl:167-171<\/code>, <code>lgupdb01.cbl:209-212<\/code>, <code>lgucdb01.cbl:136-139<\/code>, <code>lgacdb01.cbl:174-177<\/code>. Add and delete policy return '80'/'81' and keep the Db2 change (<code>lgapvs01.cbl:142-147<\/code>, <code>lgdpvs01.cbl:86-91<\/code>). The others abend (<code>lgacvs01.cbl:79<\/code>, <code>lgupvs01.cbl:151,164<\/code>). The KSDS files have no RECOVERY attribute (<code>cntl/cdef121.jcl:137-147<\/code>).<\/td><td>Neither store is reliably the system of record, so migration needs a reconciliation step.<\/td><td>Make Db2 the only system of record. Retire VSAM, or rebuild it as a read model fed by change data capture or an outbox.<\/td><\/tr><tr><td>2<\/td><td><strong>LGUPDB01 reports failures and timestamp conflicts as success<\/strong><\/td><td><code>CLOSE-PCURSOR<\/code> forces '00' (<code>src/lgupdb01.cbl:369-373<\/code>) after the '02' conflict path (<code>:344-347,360<\/code>) and the type-table failure path (<code>:302-306<\/code>). The SQLCODE of the UPDATE is unchecked (<code>:318-326<\/code>). FETCH reads 5 columns into 6 host variables (<code>:129-137<\/code> vs <code>:232-237<\/code>).<\/td><td>Optimistic locking is defeated, and VSAM gets rejected data. The current behaviour must not become the spec.<\/td><td>Keep the earlier return code; check SQLCODE after every statement; LINK VSAM only on '00'.<\/td><\/tr><tr><td>3<\/td><td><strong>Commercial-policy update is half-implemented<\/strong><\/td><td><code>WHEN OTHER<\/code> sets '99' and still LINKs (<code>src/lgupol01.cbl:139-143<\/code>). LGUPDB01 has no <code>01UCOM<\/code> branch (<code>:283-300<\/code>). LGUPVS01 rewrites the VSAM record anyway (<code>lgupvs01.cbl:108-111<\/code>).<\/td><td>The functional gap is hidden; rules extracted from the code would wrongly say this is supported.<\/td><td>Reject it up front, or implement it. Record the gap.<\/td><\/tr><tr><td>4<\/td><td><strong>LGIPDB01 is a god program with cursor defects<\/strong><\/td><td>7 request types (<code>src/lgipdb01.cbl:277-310<\/code>). <code>Until SQLCODE &gt; 0<\/code> can loop forever on a negative SQLCODE (<code>:850,:933<\/code>). List queries overwrite one slot, so only the last row comes back (<code>:903-904,:985-986<\/code>). The row cap is a fake <code>Move 17 To SQLCODE<\/code> (<code>:906-909<\/code>).<\/td><td>This is the main read path, and its list semantics are broken.<\/td><td>Split into get-by-key reads per product plus paged list queries.<\/td><\/tr><tr><td>5<\/td><td><strong>Product dispatch duplicated across about 10 programs<\/strong><\/td><td><code>01xEND/HOU/MOT/COM<\/code> EVALUATEs in <code>src/lgapdb01.cbl:184-207,223-241<\/code>, <code>lgipdb01.cbl:277-310<\/code>, <code>lgupdb01.cbl:283-300<\/code>, <code>lgupol01.cbl:113-141<\/code>, <code>lgdpol01.cbl:119-122<\/code>, <code>lgdpdb01.cbl:160-163<\/code>. The VSAM layout is copied inline (<code>lgapvs01.cbl:99-132<\/code> and <code>lgupvs01.cbl:102-135<\/code>).<\/td><td>Adding a product touches about 10 programs; this duplication is the root cause of items 2 and 3.<\/td><td>In the target, a Policy aggregate with product subtypes.<\/td><\/tr><tr><td>6<\/td><td><strong>Error logger copied 20 times, and it logs PII<\/strong><\/td><td><code>WRITE-ERROR-MESSAGE<\/code> appears in 20 programs (e.g. <code>src/lgapdb01.cbl:562-595<\/code>). Each copy dumps 90 raw commarea bytes. LGSTSQ ignores RESP (<code>src/lgstsq.cbl:94-111<\/code>).<\/td><td>Compliance exposure; logs no tool can read.<\/td><td>One structured logger with redaction.<\/td><\/tr><tr><td>7<\/td><td><strong>Hardcoded default password digest and <code>GRANT ALL \u2026 TO PUBLIC<\/code><\/strong><\/td><td><code>src/lgacdb01.cbl:181<\/code> (<code>5732**<strong><\/code>) and 10 seeds in <code>cntl/db2cre.jcl:455\u2026761<\/code>. An unused plaintext literal at <code>src/lgacdb01.cbl:74<\/code> (<code>Ne<\/strong>**<\/code>). LGACDB02 failure is unchecked (<code>lgacdb01.cbl:186-192<\/code>). Grants: <code>cntl/db2cre.jcl:402-408<\/code>.<\/td><td>Shared credential, and the Db2 tables are effectively open.<\/td><td>Per-customer credentials with salted hashes; least-privilege grants.<\/td><\/tr><tr><td>8<\/td><td><strong>Hardcoded config<\/strong><\/td><td><code>LENGTH(32500)<\/code> in more than 30 LINKs. <code>LENGTH(225)<\/code> truncates the 1,174-byte commercial payload in split-region setups (<code>src/lgupdb01.cbl:211<\/code>, <code>lgucdb01.cbl:138<\/code>, <code>lgacdb01.cbl:176<\/code>). Literal names for files, pools, queues and transids. Customer range 1\u201311 in <code>src/lgsetup.cbl:52-53<\/code>. Site values in <code>exec/cust1.rexx:6-32<\/code>.<\/td><td>Silent truncation and memory faults; brittle deployment.<\/td><td>Use <code>LENGTH OF<\/code>/EIBCALEN; externalize config.<\/td><\/tr><tr><td>9<\/td><td><strong>Dead code<\/strong><\/td><td><code>LGAPBR01<\/code> (CSD only). The CLAIM table and layouts (<code>cntl/db2cre.jcl:361<\/code>, <code>src/lgcmarea.cpy:96-103<\/code>). Unused <code>SymbList<\/code> and 36 near-identical counter queries in <code>src/lgwebst5.cbl:76-156,268-668<\/code>. Unused constants in <code>src/lgastat1.cbl:49-54<\/code>. <code>RETURN<\/code> after <code>ABEND<\/code> (<code>src/lgapdb01.cbl:393-394<\/code>).<\/td><td>Inflates migration scope.<\/td><td>Delete; get an SME decision on CLAIM.<\/td><\/tr><tr><td>10<\/td><td><strong>3270 drivers use old CICS idioms<\/strong><\/td><td><code>HANDLE AID<\/code>/<code>HANDLE CONDITION<\/code> with GO TO (<code>src/lgtestp1.cbl:54-59<\/code>, <code>lgtestc1.cbl:72-75<\/code>). Conversational <code>RECEIVE MAP<\/code> (<code>lgtestp1.cbl:196-198<\/code>). <code>SYNCPOINT ROLLBACK<\/code> in the UI layer. P1\u2013P4 are near-clones.<\/td><td>Not worth porting.<\/td><td>Replace them with a UI over the new service API.<\/td><\/tr><\/tbody><\/table><\/div>", "open": false}, {"title": "Assessment: Security Findings", "html": "<p>Credential inventory in <code>SECRETS.local.md<\/code> (gitignored; not for sharing). The three credentials found are referenced below by masked preview only.<\/p>\n<div class='scroll'><table><thead><tr><th>#<\/th><th>CWE<\/th><th>Severity<\/th><th>file:line<\/th><th>Finding<\/th><\/tr><\/thead><tbody><tr><td>SEC-001<\/td><td>CWE-306, CWE-319<\/td><td><strong>Critical<\/strong><\/td><td><code>cntl/cdef124.jcl:21-28<\/code>; <code>cntl/wsa*.jcl<\/code><\/td><td>SOAP endpoints run on plain HTTP port 4321 with no authentication and no WS-Security. Anyone on the network can read and update customer PII and policies by walking sequential customer numbers.<\/td><\/tr><tr><td>SEC-002<\/td><td>CWE-639<\/td><td>High<\/td><td><code>src/lgicdb01.cbl:189<\/code>, <code>lgucdb01.cbl:154-165<\/code>, <code>lgdpdb01.cbl:190-193<\/code>, <code>lgipdb01.cbl:362-367<\/code><\/td><td>No ownership check: any caller can read, update or delete any customer or policy by its number. LGICVS01 (exposed through SOAP) hands out valid customer numbers.<\/td><\/tr><tr><td>SEC-003<\/td><td>CWE-787, CWE-125<\/td><td>High<\/td><td><code>src/lgacus01.cbl:134-136<\/code>, <code>lgicus01.cbl:122-124<\/code>, <code>lgapol01.cbl:121-123<\/code> (all front ends)<\/td><td><code>LINK \u2026 LENGTH(32500)<\/code> regardless of EIBCALEN. A SOAP commarea is about 30.2 KB, so storage beyond it is overread, and in split-region setups the reply overwrites storage.<\/td><\/tr><tr><td>SEC-004<\/td><td>CWE-787, CWE-200<\/td><td>High<\/td><td><code>src/lgapdb01.cbl:339-345,365<\/code>; <code>lgipdb01.cbl:410-412<\/code><\/td><td>Endowment add moves about 32 KB into a 3,900-byte field; there is no SSRANGE to catch it. Overread memory is stored, then returned by inquiry.<\/td><\/tr><tr><td>SEC-005<\/td><td>CWE-306, CWE-319<\/td><td>High<\/td><td><code>cntl/sampwui.jcl:21-24,78,84,90-99<\/code>; <code>cntl/sampcma.jcl<\/code><\/td><td>The CPSM WUI and CMCI REST API run on HTTP with <code>SEC=NO<\/code>, and the default user is the Db2 table owner.<\/td><\/tr><tr><td>SEC-006<\/td><td>CWE-532<\/td><td>Medium<\/td><td><code>src/lgacdb01.cbl:312-326<\/code> (\u00d720 programs); <code>src/lgstsq.cbl:94-111<\/code><\/td><td>90 bytes of the commarea (name, date of birth, address) go to <code>GENAERRS<\/code> and <code>CSMT<\/code> on any error.<\/td><\/tr><tr><td>SEC-007<\/td><td>CWE-532<\/td><td>Medium<\/td><td><code>src/lgacdb02.cbl:209-223<\/code><\/td><td>The customer password digest is written to the error log.<\/td><\/tr><tr><td>SEC-008<\/td><td>CWE-1392, CWE-759, CWE-798<\/td><td>Medium (High if anything authenticates against it)<\/td><td><code>src/lgacdb01.cbl:181-184<\/code>; <code>lgacdb02.cbl:166-176<\/code><\/td><td>Every new customer gets the same unsalted default digest (<code>5732****<\/code>).<\/td><\/tr><tr><td>SEC-009<\/td><td>CWE-862, CWE-20<\/td><td>Medium<\/td><td><code>cntl/cdef121.jcl:44-45<\/code>; <code>src/lgsetup.cbl:128-187<\/code><\/td><td>Any signed-on user can run LGSE. It wipes the logs and resets the customer-number counter, after which new customers can't be added (duplicate keys).<\/td><\/tr><tr><td>SEC-010<\/td><td>CWE-284<\/td><td>Medium<\/td><td><code>cntl/cdef121.jcl:34-49<\/code>, <code>cdef122.jcl<\/code>, <code>cdef123.jcl:186-215<\/code><\/td><td>No RESSEC or CMDSEC. The data-region mirror transactions are unprotected. The TSMODEL is commented out.<\/td><\/tr><tr><td>SEC-011<\/td><td>CWE-250, CWE-732<\/td><td>Medium<\/td><td><code>cntl/cdef122.jcl:224,227<\/code>; <code>cntl/db2bind.jcl:126,146<\/code><\/td><td>Db2 runs under the table owner's AUTHID; the plan is granted to PUBLIC; the package list uses a wildcard.<\/td><\/tr><tr><td>SEC-012<\/td><td>CWE-130, CWE-787<\/td><td>Medium<\/td><td><code>src/lgacvs01.cbl:66-74<\/code>, <code>lgucus01.cbl:99-113<\/code>, <code>lgicvs01.cbl:108-111<\/code><\/td><td>No EIBCALEN length checks at entry points.<\/td><\/tr><tr><td>SEC-013<\/td><td>CWE-639, CWE-787<\/td><td>Medium<\/td><td><code>src/lgipdb01.cbl:121-148,919-990<\/code><\/td><td>The postcode query returns every commercial policy at a postcode, with no length check and no row cap.<\/td><\/tr><tr><td>SEC-014<\/td><td>CWE-311, CWE-312<\/td><td>Medium<\/td><td><code>cntl/adef121.jcl:15-27<\/code>; <code>cntl/db2cre.jcl:110-125<\/code><\/td><td>PII is stored in clear in both Db2 and VSAM; <code>ERASE NO<\/code>.<\/td><\/tr><tr><td>SEC-015<\/td><td>CWE-20<\/td><td>Low<\/td><td><code>src/lgucdb01.cbl:129<\/code>, <code>lgipdb01.cbl:263-264<\/code>, <code>ssmap.bms:29<\/code><\/td><td>Customer and policy numbers aren't checked as numeric, so bad input causes S0C7 abends. Email and phone are not validated.<\/td><\/tr><tr><td>SEC-016<\/td><td>CWE-670<\/td><td>Low<\/td><td><code>src/lgupol01.cbl:139-143<\/code><\/td><td>An unknown request ID still runs the update.<\/td><\/tr><tr><td>SEC-017<\/td><td>CWE-125, CWE-117<\/td><td>Low<\/td><td><code>src/lgstsq.cbl:47-48,83-111<\/code><\/td><td>Small overreads into the log; a <code>Q=<\/code> prefix can redirect the log queue.<\/td><\/tr><tr><td>SEC-018<\/td><td>CWE-1104<\/td><td>Low<\/td><td><code>cntl/wsa*.jcl:14-15<\/code>; <code>cntl/cdef124.jcl:27<\/code><\/td><td>Web-service tooling points at an older CICS path (<code>cics660<\/code>) and Java 6.<\/td><\/tr><tr><td>SEC-019<\/td><td>CWE-200<\/td><td>Info<\/td><td><code>cntl/wsa*.jcl:1<\/code>; <code>cntl/cdef124.jcl:29<\/code>, <code>cdef125.jcl:32<\/code>; <code>cntl/wsaip01.jcl:112<\/code><\/td><td>A developer user ID and home paths are hardcoded; IPPROGMB has no source to review.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Negative results:<\/strong><\/p>\n<ul><li><strong>No SQL injection:<\/strong> all SQL is static with host variables; there is no <code>PREPARE<\/code> or <code>EXECUTE IMMEDIATE<\/code>.<\/li><li><strong>No other secrets:<\/strong> no RACF or Db2 passwords, keys or certificates in the JCL, REXX or CSD.<\/li><\/ul>\n<p><strong>Product support status:<\/strong> the source pins CICS TS 5.4, Enterprise COBOL 6.1 and Db2 12. Check their current support status on IBM's lifecycle pages. No CVEs are cited, because the repo pins no fix level.<\/p>\n<p><strong>Not in the repo, so not reviewed:<\/strong> SIT parameters, RACF profiles and IRC ATTACHSEC.<\/p>", "open": false}, {"title": "Assessment: Documentation Gaps", "html": "<p>The four READMEs (<code>src/<\/code>, <code>cntl/<\/code>, <code>exec/<\/code>, <code>data/README.md<\/code>) describe only dataset allocation and FTP transfer. Header comments in the COBOL are reasonable: 1,583 comment lines against 6,500 code lines. No document explains behaviour, architecture or operations. A new engineer would need these five explained:<\/p>\n<ol><li><strong>The dual Db2 and VSAM write model.<\/strong> Which store is authoritative, what happens when the VSAM leg fails (abend in some programs, a soft '80'/'81' in others), and who else reads <code>KSDSCUST<\/code>/<code>KSDSPOLY<\/code>. Nothing documents it, and the code is inconsistent.<\/li><li><strong>The COMMAREA contract and request-ID protocol.<\/strong> The <code>LGCMAREA<\/code> REDEFINES layout, the <code>01xEND/HOU/MOT/COM<\/code> and <code>01ICUS<\/code>-style request IDs, the return-code meanings ('00', '01', '02', '80', '81', '90', '98', '99'), and the effectively hard 32,500 and 225 lengths.<\/li><li><strong>Product-specific semantics.<\/strong> Commercial reuses LASTCHANGED, ISSUE and EXPIRY as request, start and renewal dates (<code>src/lgapdb01.cbl:525-527<\/code>). Commercial has list and postcode searches but no update. Delete relies on Db2 <code>ON DELETE CASCADE<\/code>. CLAIM is schema-only.<\/li><li><strong>Customer-number generation and operational reset.<\/strong> <code>GENACUSTNUM<\/code> with the Db2 IDENTITY fallback, and the fact that LGSE/LGSETUP resets it (with collision risk) and must run before use. Also what starts SSST.<\/li><li><strong>Monitoring via CICS Event Processing.<\/strong> How the missing <code>GENAEV01<\/code> bundle drives LGASTAT1's counters, and how LGWEBST5 turns them into per-minute rate TSQs. The bundle isn't in the repo, so the capture points are undocumented anywhere.<\/li><\/ol>", "open": false}, {"title": "Assessment: Relative Scale", "html": "<div class='scroll'><table><thead><tr><th>Measure<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>KSLOC (all code: COBOL, copybooks, BMS, JCL, REXX)<\/td><td><strong>10.72<\/strong><\/td><\/tr><tr><td>COCOMO-style index, <code>2.94 \u00d7 KSLOC^1.10<\/code> (all code)<\/td><td><strong>40.0<\/strong><\/td><\/tr><tr><td>KSLOC (COBOL application code only: <code>.cbl<\/code> and <code>.cpy<\/code>)<\/td><td>6.79<\/td><\/tr><tr><td>Index (COBOL application code only)<\/td><td>24.2<\/td><\/tr><tr><td>Complexity (decisions per COBOL KSLOC)<\/td><td>94<\/td><\/tr><tr><td>Most complex file<\/td><td><code>src/lgipdb01.cbl<\/code> (101 decisions)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>This index is <strong>a relative size measure for ranking this system against others, never a timeline or a cost.<\/strong> The formula assumes human-team productivity and does not apply to agentic modernization. On this scale GenApp is small. Its risk comes from the security and data-integrity defects above, not from its volume.<\/p>", "open": false}, {"title": "Assessment: Recommended Modernization Pattern", "html": "<p><strong>Rearchitect<\/strong> \u2192 <code>/code-modernization:modernize-reimagine genapp<\/code><\/p>\n<p>GenApp's value is in its business rules, not its code. The rules are a modest set of customer and policy CRUD operations, product validations and an optimistic-locking update. Its structure is the main problem:<\/p>\n<ul><li>two unsynchronized stores of record;<\/li><li>a 32,500-byte commarea protocol that is unsafe in memory;<\/li><li>product dispatch copied across about 10 programs;<\/li><li>3270 test menus and an unauthenticated SOAP layer as the only channels.<\/li><\/ul>\n<p>A same-stack <code>uplift<\/code> would keep all of those problems. A piece-by-piece <code>transform<\/code> would faithfully port defects that must not become the spec: the update conflicts reported as success, the half-implemented commercial update, the broken list queries. The better route is to rebuild on a new architecture from extracted, human-reviewed rules: one system of record, a Policy aggregate with product subtypes, and authenticated APIs with per-customer authorization.<\/p>\n<p>Two things make this practical at this size:<\/p>\n<ul><li>The front-end programs are pure pass-throughs, so the real logic sits in about ten <code>*DB01<\/code> programs.<\/li><li>The <code>*VS01<\/code> and workload-simulation layers can be dropped or replaced by a read model.<\/li><\/ul>\n<p>No target stack has been chosen yet (<code>INTENT.md<\/code>). Pick it at the reimagine architecture checkpoint.<\/p>\n<p><strong>Before any build:<\/strong><\/p>\n<ol><li>Run <code>map<\/code>, then <code>extract-rules<\/code>. Have a person review the P0 rules, especially defects 2\u20134 above: are they intended behaviour or bugs?<\/li><li>Run <code>harden<\/code> for SEC-001 and SEC-005 if the legacy system stays reachable during the transition.<\/li><\/ol>", "open": false}, {"title": "Business flows", "html": "<h3>Register a new customer<\/h3><p><b>Call-centre agent<\/b>: An agent keys a new customer&#x27;s details on the 3270 menu and gets back a customer number.<\/p><ol><li>Agent fills in the customer menu<\/li><li>Request is validated and routed<\/li><li>Customer number allocated and customer saved<\/li><li>Default security record stored<\/li><li>Customer copied to the VSAM file<\/li><li>Any failure is logged<\/li><\/ol><h3>Broker adds a motor policy over the web service<\/h3><p><b>Broker / partner system<\/b>: A partner system sends a new motor policy as a SOAP request and receives the new policy number.<\/p><ol><li>SOAP request arrives on GENAPP/LGAPOLM1<\/li><li>Add-policy front end checks the request<\/li><li>Policy and motor details inserted in Db2<\/li><li>Policy copied to the VSAM file<\/li><li>Any failure is logged<\/li><\/ol><h3>Update a house policy<\/h3><p><b>Underwriter<\/b>: An underwriter looks up a house policy, changes its details and saves them.<\/p><ol><li>Underwriter opens the house policy menu<\/li><li>Current policy is fetched<\/li><li>Change request is routed<\/li><li>Timestamp checked and Db2 rows updated<\/li><li>VSAM copy rewritten<\/li><\/ol><h3>Watch business volumes<\/h3><p><b>Operations supervisor<\/b>: Operations sees per-minute counts of customer and policy requests as they happen.<\/p><ol><li>Each business request raises an event that bumps a counter<\/li><li>Every minute the statistics job reads the counters<\/li><li>Rates are written to the rate queues<\/li><li>Supervisor resets counters and logs at start of day<\/li><\/ol>"}, {"title": "The map's observations", "html": "<ul><li>Every business operation is a three-layer LINK chain: front end (*01 pass-through) -&gt; *DB01 (Db2) -&gt; *VS01 (VSAM). The *DB01 programs are the only place business logic lives, and each one dual-writes Db2 then VSAM with no shared commit, so KSDSCUST and KSDSPOLY are a second copy of CUSTOMER/POLICY that can drift.<\/li><li>LGSTSQ is the single most-called module (20 callers) and a shared single point of failure for error logging; it writes TDQ CSMT and TSQ GENAERRS, and a &#x27;Q=&#x27; message prefix redirects it to a GENA+4-character queue name built at runtime, so that target cannot be resolved statically.<\/li><li>Policy is the coupling hub: POLICY is written by LGAPDB01, LGDPDB01, LGUPDB01 and read by LGAPDB01, LGIPDB01, LGUPDB01; the product tables (MOTOR, ENDOWMENT, HOUSE, COMMERCIAL) are joined to it, so product dispatch is repeated in each *DB01. A Policy service with product subtypes is the natural extraction boundary; Customer (CUSTOMER, CUSTOMER_SECURE, KSDSCUST) is a cleaner, smaller first candidate.<\/li><li>Entry points come from configuration, not code: 10 CSD transactions (cdef121/cdef125) and 8 SOAP binding jobs exposing 18 URIs. SOAP URI GENAPP/LGIPOL02 binds to IPPROGMB, which has no source in the repo; LGAPBR01 is defined in the CSD with neither source nor caller.<\/li><li>Customer-number allocation depends on named counter GENACUSTNUM, which LGSETUP (transaction LGSE) deletes and redefines; LGASTAT1 and LGWEBST5 share the GENA01* statistics counters and LGWEBST5 re-schedules itself every minute via START TRANSID SSST.<\/li><li>Unused data: Db2 table CLAIM is created by DB2CRE but no program reads or writes it; BMS map(s) SSMAPP5 are defined in SSMAP but never sent or received. The WSim scripts behind ITPENTR are not in the repo, so its targets are unknown and no edges are drawn from it.<\/li><\/ul>"}, {"title": "Preflight: summary", "html": "<h2>Preflight \u2014 genapp<\/h2>\n<p>Run 2026-11-25. <code>legacy/genapp<\/code> is <strong>a directory in this workspace<\/strong> (not a symlink), mode <code>r-x<\/code> (read-only on disk). Nothing under it was modified.<\/p>"}, {"title": "Preflight: Answers", "html": "<p>The answers were collected before this run; the question pop-up was not available. They are written verbatim, with who gave them.<\/p>\n<p><strong>1. Scope.<\/strong> Is this code the complete system, or one slice of a larger codebase? If a slice: what <em>outside<\/em> it depends on code <em>inside<\/em> it, and is breaking those consumers acceptable?<\/p>\n<p>&gt; The complete source as Reframe snapshotted it (SHA-256 1c228d219be10541ab4cd65e3b1f0ff41131b39894467bf63829a55a6706d9a0); nothing outside it is in scope for this assessment. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>\n<p><strong>2. Build &amp; test locally.<\/strong> Can this environment restore, build, and run the tests? Roughly how long does the full CI pipeline take?<\/p>\n<p>&gt; No. This pass is analysis only: nothing is built or run. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>\n<p><strong>3. Bespoke build infrastructure.<\/strong> Is there organization-specific build or dependency machinery a newcomer would not guess? Where is it documented?<\/p>\n<p>&gt; Don't know. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>\n<p><em>Open item for a person:<\/em> the source itself shows one bespoke step (see Check 3a): every JCL member holds <code>&lt;PLACEHOLDER&gt;<\/code> tokens that an ISPF REXX customizer (<code>exec/cust1.rexx<\/code> + <code>exec/mac1.rexx<\/code>) fills in with site values. Confirm whether the real installation used this customizer or something else.<\/p>\n<p><strong>4. Prior attempts.<\/strong> Has anyone tried to modernize this before? What went wrong?<\/p>\n<p>&gt; An AWS Transform assessment of the same snapshot was made; its results are kept apart and are not given to this assessment. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>\n<p><strong>5. Off limits.<\/strong> Is anything in this code not allowed to change in this pass?<\/p>\n<p>&gt; Everything: this pass is analysis only, and nothing in the source may change. &gt; &gt; \u2014 answered by Reframe (autonomous mode)<\/p>"}, {"title": "Preflight: Check 6 \u2014 Scope boundary", "html": "<p><strong>Standalone snapshot.<\/strong> <code>legacy/genapp<\/code> is a real directory, not a link; it holds one tree (<code>base/<\/code>) with source, JCL, REXX and data, and nothing in it points to sibling source (no <code>../<\/code> paths, no parent build file). The only git repository above it is the user's home-directory repo, which does not track these files (0 tracked), so it is not a parent codebase. Its outbound references all go to <strong>IBM product libraries<\/strong> and <strong>site datasets<\/strong>, not to other application source: CICS <code>SDFHCOB<\/code>/<code>SDFHMAC<\/code>/<code>SDFHLOAD<\/code>, Db2 <code>SDSNSAMP<\/code>/<code>SDSNLOAD<\/code>, LE <code>SCEELKED<\/code>, <code>SYS1.MACLIB<\/code>, and Workload Simulator <code>SITPLOAD<\/code>. No inbound consumers can be seen from the source, which matches Answer 1: the snapshot is the whole scope.<\/p>"}, {"title": "Preflight: Summary", "html": "<div class='scroll'><table><thead><tr><th>#<\/th><th>Check<\/th><th>Status<\/th><th>Found<\/th><th>Fix<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Human answers<\/td><td>\u26a0\ufe0f<\/td><td>All five recorded (autonomous mode); Q3 is \"Don't know\"<\/td><td>A person should confirm the bespoke build (Q3 open item)<\/td><\/tr><tr><td>1<\/td><td>Stack<\/td><td>\u2705<\/td><td>IBM z/OS <strong>CICS + COBOL + Db2 + VSAM<\/strong>, BMS 3270 map, CICS SOAP web services, JCL, ISPF REXX. 83 files / 14,199 lines: 31 <code>.cbl<\/code> (8,982), 13 <code>.cpy<\/code> (417), 29 <code>.jcl<\/code> (3,485), 1 <code>.bms<\/code>, 2 <code>.rexx<\/code>, 3 <code>.txt<\/code>, 4 <code>.md<\/code>. CICS in 31/31 programs; <code>EXEC SQL<\/code> in 8<\/td><td>\u2014<\/td><\/tr><tr><td>2<\/td><td>Analysis tooling<\/td><td>\u26a0\ufe0f<\/td><td><code>python3<\/code> 3.12.2 \u2705. <code>scc<\/code> \u274c, <code>cloc<\/code> \u274c, <code>lizard<\/code> \u274c (not on PATH, not importable)<\/td><td><code>brew install scc<\/code> (or <code>brew install cloc<\/code>); <code>pip3 install lizard<\/code>. Without them, LOC falls back to <code>find<\/code>+<code>wc<\/code> and complexity is estimated from keyword counts<\/td><\/tr><tr><td>3<\/td><td>Build toolchain<\/td><td>\u26a0\ufe0f (expected)<\/td><td>No <code>cobc<\/code> (GnuCOBOL); Level 1 syntax compile not possible. Level 2 impossible by nature: the build is z/OS JCL (Enterprise COBOL <code>IGYCRCTL<\/code> with the integrated CICS/Db2 coprocessor, <code>HEWL<\/code> link-edit, BMS assembly, <code>DFHLS2WS<\/code>, Db2 BIND) and needs a mainframe. Per Answer 2, nothing is built in this pass anyway<\/td><td>Optional: <code>brew install gnucobol<\/code> for Level 1 syntax checks only (it cannot resolve <code>EXEC CICS<\/code>/<code>EXEC SQL<\/code> without a preprocessor). Equivalence for any later move falls back to recorded traces<\/td><\/tr><tr><td>4<\/td><td>Source completeness<\/td><td>\u26a0\ufe0f (minor)<\/td><td>App copybooks all present (<code>LGCMAREA<\/code> \u00d726, <code>LGPOLICY<\/code> \u00d710, <code>soa*<\/code>, <code>pollook<\/code>/<code>polloo2<\/code>). Not in tree, by design: <code>SSMAP<\/code> symbolic map (\u00d75 COPY, generated from <code>ssmap.bms<\/code> by <code>asmmap.jcl<\/code>), <code>SQLCA<\/code> (Db2-supplied), <code>DFHEILIC<\/code> (CICS-supplied). CICS CSD defines <code>LGAPBR01<\/code> (no source and no caller in source) and bundle <code>GENAEV01<\/code> (event binding; bundle contents not in tree). Descriptors present: CSD (<code>cdef121\u2013125<\/code>, <code>adef121<\/code>), Db2 DDL (<code>db2cre<\/code>: 8 tables + index), bind (<code>db2bind<\/code>), VSAM <code>KSDSCUST<\/code>/<code>KSDSPOLY<\/code> + seed data, web-service JCL (<code>wsa*<\/code>), workload-simulator scripts (<code>itp*<\/code>). No binaries: all 83 files are text<\/td><td>Note <code>LGAPBR01<\/code> and <code>GENAEV01<\/code> as unresolved CSD entries in assess/map; the map should model <code>SSMAP<\/code> from <code>ssmap.bms<\/code><\/td><\/tr><tr><td>5<\/td><td>Optional context<\/td><td>\u26a0\ufe0f<\/td><td>No APM MCP server, no SMF/CICS statistics or batch logs. No real VCS history (only the user's unrelated home repo sits above it)<\/td><td>None required; risk ranking will be without change frequency and runtime overlay<\/td><\/tr><tr><td>6<\/td><td>Scope boundary<\/td><td>\u2705<\/td><td>Standalone; no outbound source deps, no inbound consumers (see above)<\/td><td>\u2014<\/td><\/tr><tr><td>7<\/td><td>Source edit protection<\/td><td>\u2705<\/td><td>Project <code>.claude/settings.json<\/code> <code>permissions.deny<\/code>: <code>Edit(/~/.reframe/projects/genapp/runs/8e5a08/claude/legacy/**)<\/code> (plus a matching <code>Write<\/code> rule). <code>legacy/genapp<\/code> is not a symlink, so no target rule is needed. The directory is also read-only on disk. User settings could not be read from this sandbox<\/td><td>\u2014<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Check 3a \u2014 the build definition.<\/strong> There is no CI pipeline; the build <em>is<\/em> the JCL in <code>cntl/<\/code>. <code>cobol.jcl<\/code> (proc <code>DB2PROC<\/code>, 31 invocations) runs Enterprise COBOL <code>IGYCRCTL<\/code> with <code>PARM='OPTFILE'<\/code> and options <code>NODYNAM RENT APOST CICS CODEPAGE(&lt;DB2CCSID&gt;)<\/code>. It reblocks <code>DFHEILIC<\/code>, then link-edits with <code>HEWL<\/code> and <code>linkparm.txt<\/code> (<code>INCLUDE SYSLIB(DSNCLI)<\/code>). The pinned toolchain comes from <code>exec/cust1.rexx<\/code>: CICS TS 5.4 / CICS 7.1 (<code>CTS540.CICS710<\/code>), CPSM 5.4, Enterprise COBOL <code>PP.COBOL390.V610<\/code> (6.1), Db2 12 (<code>SYS2.DB2.V12<\/code>, plan <code>DSNTIA12<\/code>, CCSID 285), and Workload Simulator 1.1. Dependencies come only from IBM product libraries; there is no package feed. <strong>Bespoke:<\/strong> every JCL member is a template with <code>&lt;HLQ&gt;<\/code>-style tokens that the ISPF REXX customizer substitutes (ISPF <code>VPUT<\/code> plus edit macro <code>mac1<\/code>). The topology is TOR/AOR/DOR with CPSM WUI/CMAS. Read the JCL as templates, not as runnable jobs.<\/p>\n<p><strong>Check 7 note.<\/strong> A permission rule covers Claude's file tools and the shell commands it recognizes (<code>sed<\/code>, <code>tee<\/code>, <code>&gt; file<\/code>), but not a script that opens files itself. The hard guarantee is the operating system: here the snapshot is already mounted read-only (<code>dr-xr-xr-x<\/code>), and the sandbox denies writes under <code>legacy/<\/code>.<\/p>"}, {"title": "Preflight: Verdict per command", "html": "<div class='scroll'><table><thead><tr><th>Command<\/th><th>Verdict<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>assess<\/code><\/td><td><strong>Ready-with-gaps<\/strong><\/td><td>Stack is clear, source is complete; LOC/complexity will be coarser until <code>scc<\/code>/<code>lizard<\/code> are installed<\/td><\/tr><tr><td><code>map<\/code><\/td><td><strong>Ready<\/strong><\/td><td><code>python3<\/code> present; the include set is complete apart from system/generated members<\/td><\/tr><tr><td><code>extract-rules<\/code><\/td><td><strong>Ready<\/strong><\/td><td>Same as map<\/td><\/tr><tr><td><code>brief<\/code><\/td><td><strong>Ready<\/strong> (once discovery artifacts exist)<\/td><td>Needs no tooling<\/td><\/tr><tr><td><code>transform<\/code>, <code>reimagine<\/code><\/td><td><strong>Ready-with-gaps<\/strong> (not applicable this pass)<\/td><td>No target stack chosen (INTENT.md); no local COBOL/CICS runtime, so equivalence would use recorded traces. Re-run preflight with a target before either<\/td><\/tr><tr><td><code>harden<\/code><\/td><td><strong>Ready-with-gaps<\/strong><\/td><td>Claude-led review only: no COBOL/CICS SAST tool found<\/td><\/tr><tr><td><code>uplift<\/code><\/td><td><strong>Not applicable<\/strong><\/td><td>No version bump requested; out of scope for an analysis-only pass<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Most important fix:<\/strong> nothing is red. Install the metrics tools: <code>brew install scc &amp;&amp; pip3 install lizard<\/code>.<\/p>\n<p><strong>Next step:<\/strong> <code>/code-modernization:modernize-assess genapp<\/code><\/p>"}, {"title": "How the requirements were generated", "html": "<p>The business functions, capabilities and requirements on this page were generated by Reframe from Claude&#x27;s results, outside the plugin. The rule cards and the open questions are as the plugin wrote them.<\/p><p>Reframe asked Claude once per domain, with only the plugin's results for that domain. Every requirement cites a rule card or a file and line that exist; 0 proposed requirements cited neither and were dropped. 98 of 98 rule cards are cited by a requirement.<\/p>"}], "classification": [], "unclassified": [], "issues": [], "decisions": [{"answer": "The complete source as Reframe snapshotted it (SHA-256 1c228d219be10541ab4cd65e3b1f0ff41131b39894467bf63829a55a6706d9a0); nothing outside it is in scope for this assessment.", "at": "2026-11-25T16:33:52Z", "question": "claude-preflight-1", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "No. This pass is analysis only: nothing is built or run.", "at": "2026-11-25T16:33:52Z", "question": "claude-preflight-2", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "Don't know.", "at": "2026-11-25T16:33:52Z", "question": "claude-preflight-3", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "An AWS Transform assessment of the same snapshot was made; its results are kept apart and are not given to this assessment.", "at": "2026-11-25T16:33:52Z", "question": "claude-preflight-4", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "Everything: this pass is analysis only, and nothing in the source may change.", "at": "2026-11-25T16:33:52Z", "question": "claude-preflight-5", "reason": "Reframe answers the plugin's preflight questions in autonomous mode from what it knows about the run; a person can change them in PREFLIGHT.md", "step": "claude preflight"}, {"answer": "run 17 shards", "at": "2026-11-25T16:54:28Z", "question": "claude-estimate", "reason": "the upper estimate (255 agents) is within the agent limit (600)", "step": "claude rule extraction"}, {"answer": "run 17 shards", "at": "2026-11-25T19:42:39Z", "question": "claude-estimate", "reason": "the upper estimate (255 agents) is within the agent limit (600)", "step": "claude rule extraction"}, {"answer": "load", "at": "2026-11-25T19:49:53Z", "question": "claude-graph-load", "reason": "the run created this graph", "step": "claude graph"}], "links": {"pages": [["The plugin's own report", "plugin/REPORT.html", "REPORT.html"], ["The plugin's interactive map", "plugin/TOPOLOGY.html", "TOPOLOGY.html"]]}, "nav": [["AWS Transform's review", "../aws/index.html"], ["AWS Transform and Claude compared", "../comparison/index.html"], ["Reconciled review", "../reconciled/index.html"]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
// AWS writes names in backticks (`TCATBAL-FILE`); show them as code, escaped like everything else.
const prose = v => esc(v).replace(/`([^`]+)`/g, '<code>$1</code>');
// Which assessment this page shows: AWS Transform's (pipeline 1) or Claude's (pipeline 2, with generated requirements).
const TOOL = D.tool || {key: 'aws', name: 'AWS Transform', short: 'AWS', generated: false};
const GEN = TOOL.generated ? '<span class="tag warn" title="' + esc(TOOL.generated_note || '') + '">Generated by Reframe</span>' : '';

// ---- indexes ----------------------------------------------------------------------------------------
const fnById = {}, capById = {}, reqByKey = {}, ruleByKey = {}, qByKey = {}, domByKey = {};
D.functions.forEach((f, i) => { f.index = i; fnById[f.id] = f; });
D.capabilities.forEach((c, i) => { c.index = i; capById[c.id] = c; });
D.requirements.forEach(r => reqByKey[r.key] = r);
D.rules.forEach(r => ruleByKey[r.key] = r);
D.questions.forEach(q => qByKey[q.key] = q);
D.domains.forEach((d, i) => { d.index = i; domByKey[d.key] = d; });
const business = D.rules.filter(r => r.disposition === 'captured');
const ruleCap = {}; D.requirements.forEach(r => (r.rules || []).forEach(k => { if (!ruleCap[k]) ruleCap[k] = r.capability; }));

function capItems(c){
  const keys = new Set();
  c.requirements.forEach(k => { keys.add(k); (reqByKey[k].rules || []).forEach(r => { if (ruleByKey[r] && ruleByKey[r].disposition === 'captured') keys.add(r); }); });
  c.questions.forEach(k => keys.add(k));
  return keys;
}
function fnItems(f){ const keys = new Set(); f.capabilities.forEach(id => capItems(capById[id]).forEach(k => keys.add(k))); f.other_rules.forEach(k => keys.add(k)); return keys; }
function domItems(d){ const keys = new Set(); d.functions.forEach(id => fnItems(fnById[id]).forEach(k => keys.add(k))); return keys; }
function countsOf(keys){ let req = 0, rule = 0, q = 0; keys.forEach(k => { if (reqByKey[k]) req++; else if (ruleByKey[k]) rule++; else if (qByKey[k]) q++; }); return {req, rule, q}; }

// ---- review marks, kept in this browser ---------------------------------------------------------------
const STORE = 'reframe-review:' + (D.project || '') + ':' + D.run + ':' + String(D.source.sha256 || '').slice(0, 16) + (TOOL.key === 'aws' ? '' : ':' + TOOL.key);
let marks = {}, stored = true;
try { marks = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { stored = false; }
let reviewer = ''; try { reviewer = localStorage.getItem('reframe-reviewer') || ''; } catch (e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch (e) { stored = false; } }
function reviewed(keys){ let n = 0; keys.forEach(k => { if (marks[k] && marks[k].status) n++; }); return n; }
function progress(keys){
  const total = keys.size, done = reviewed(keys), pct = total ? Math.round(100 * done / total) : 0;
  return '<div class="progress">' + done + ' of ' + total + ' reviewed<i><b style="width:' + pct + '%"></b></i></div>';
}
const STATUSES = [['agree', '✓ Agree'], ['change', '✎ Needs change'], ['question', '? Question']];
function markControls(key, hint){
  const m = marks[key] || {};
  return '<div class="marks" data-key="' + esc(key) + '">' + STATUSES.map(([s, label]) =>
    '<button class="' + s + '" aria-pressed="' + (m.status === s) + '" data-status="' + s + '">' + label + '</button>').join('') +
    (m.status ? '<textarea placeholder="' + esc(hint || 'Comment (optional): what should change, or what you want to ask') + '">' + esc(m.comment || '') + '</textarea>' : '') + '</div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('.marks button'); if (!b) return;
  const box = b.closest('.marks'), key = box.dataset.key, status = b.dataset.status;
  const m = marks[key] || {};
  if (m.status === status) delete marks[key]; else marks[key] = {status, comment: m.comment || '', at: new Date().toISOString()};
  save();
  const item = box.closest('.item'); if (item) item.className = 'item ' + ((marks[key] || {}).status || '');
  box.outerHTML = markControls(key);
});
document.addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const key = e.target.closest('.marks').dataset.key;
  if (marks[key]) { marks[key].comment = e.target.value; marks[key].at = new Date().toISOString(); save(); }
});

// ---- small pieces -----------------------------------------------------------------------------------
const PATTERN = {'Ubiquitous': 'Always', 'Event-driven': 'When something happens', 'State-driven': 'While a condition holds',
  'Unwanted': 'If something goes wrong', 'Optional': 'Where a feature applies', 'Complex': 'Combined conditions'};
function crumbs(parts){ return '<div class="crumbs">' + parts.map(([label, href]) => href ? '<a href="' + href + '">' + esc(label) + '</a>' : '<b>' + esc(label) + '</b>').join('<span>›</span>') + '</div>'; }
function numbers(list){ return '<div class="numbers">' + list.map(([n, l]) => '<div><b>' + n + '</b><span>' + esc(l) + '</span></div>').join('') + '</div>'; }
function countLine(c, extra){ return '<div class="counts">' + (extra || '') + '<span><b>' + c.req + '</b> requirements</span><span><b>' + c.rule + '</b> business rules</span><span><b>' + c.q + '</b> open questions</span></div>'; }
// Pipeline 3: what kind of rule (docs/pipeline-3.md, section 8.6); business, validation and compliance rules come first.
const KIND = {business: 'Business rule', validation: 'Validation', compliance: 'Compliance', error_handling: 'Error handling', display: 'Display',
  technical: 'Technical step', side_effect: 'Side effect', leftover: 'Leftover'};
const KIND_ORDER = Object.keys(KIND);
const kindRank = key => { const r = ruleByKey[key]; const i = r && r.kind ? KIND_ORDER.indexOf(r.kind) : -1; return i < 0 ? KIND_ORDER.length : i; };
const byKind = keys => keys.slice().sort((a, b) => kindRank(a) - kindRank(b));
// Agree keeps a rule (section 8.11): who agreed, from the review downloads the last round read.
function agreedTag(x){ return x && x.agreed_by && x.agreed_by.length ? '<span class="tag" title="Kept as agreed in later rounds">✓ Agreed by ' +
  esc(x.agreed_by.map(a => (a.reviewer || 'a reviewer') + (a.at ? ', ' + String(a.at).slice(0, 10) : '')).join('; ')) + '</span>' : ''; }
function ruleCard(key){
  const r = ruleByKey[key]; if (!r) return '';
  const extra = (r.priority ? '<span class="tag' + (r.priority === 'P0' ? ' warn' : '') + '">' + esc(r.priority) + '</span>' : '') + (r.category ? '<span class="tag grey">' + esc(r.category) + '</span>' : '') +
    (r.confidence ? '<span class="tag ' + (r.decision && r.confidence !== 'high' ? 'warn' : 'grey') + '"' + (r.confidence_why ? ' title="' + esc(r.confidence_why) + '"' : '') + '>Confidence: ' + esc(r.confidence) + '</span>' : '') + (r.source ? '<code>' + esc(r.source) + '</code>' : '');
  return '<div class="item ' + ((marks[key] || {}).status || '') + '" id="' + anchor(key) + '"><div class="head"><span class="tag grey">' + esc(r.kind ? KIND[r.kind] || r.kind : 'Business rule') + '</span>' + (r.id && TOOL.key !== 'aws' ? '<code>' + esc(r.id) + '</code>' : '') +
    '<span>' + esc(r.program) + '</span>' + extra + agreedTag(r) + '</div>' +
    '<div class="text"><b>' + prose(r.name) + '</b>' + (r.plain ? '<br>' + prose(r.plain) : '') + '<br>' + prose(r.text).replace(/\n/g, '<br>') + '</div>' +
    (r.examples && r.examples.length ? '<div class="small" style="margin:6px 0 0"><b>For example</b><ul style="margin:2px 0 0 18px;padding:0">' + r.examples.map(x =>
      '<li>' + (x.given.length ? x.given.map(g => esc(g.field) + ' ' + prose(g.value)).join(', ') + ' → ' : '') + prose(x.then) + '</li>').join('') + '</ul></div>' : '') +
    (r.decision ? decisionBlock(r) : '') +
    (r.defect && !(r.decision && r.n > 1) ? defectBlock(r) : '') + markControls(key) + '</div>';
}
// A possible defect belongs to the decision that found it: shown once, on its first rule (docs/pipeline-3.md, section 8.8).
function defectBlock(r){
  if (!r.decision) return '<p class="small" style="margin:6px 0 0"><span class="tag warn">Suspected defect</span> ' + prose(r.defect) + '</p>';
  return '<div class="small" style="margin:6px 0 0"><span class="tag warn">Possible defect</span>' +
    (r.defect_call ? '<span class="tag grey">' + (r.defect_call === 'deliberate' ? 'Looks deliberate' : 'Looks unintended') + '</span>' : '') +
    (r.unit_rules > 1 ? '<span class="muted">applies to the ' + r.unit_rules + ' rules of this decision</span>' : '') + '<br>' + prose(r.defect) +
    ((r.defect_evidence || []).length ? '<details><summary>The lines that show it</summary>' + r.defect_evidence.map(excerpt).join('') + '</details>' : '') + '</div>';
}
// Pipeline 3: how a recommended rule was decided, the rules it came from and the source lines behind it.
const DECISION = {agreed: 'Agreed by both tools', merged: 'Merged from both tools', aws: 'AWS Transform was right', claude: "Claude's plugin was right",
  rewritten: 'Rewritten from the code', kept: 'Kept: the code supports it', rejected: 'Rejected: the code does not support it', needs_sme: 'Waiting for an SME'};
function excerpt(cite){
  const e = (D.evidence || {})[cite];
  if (!e) return '<p><code>' + esc(cite) + '</code></p>';
  return '<p class="small" style="margin:8px 0 2px"><code>' + esc(cite) + '</code></p><pre class="code">' + e.lines.map((l, i) => '<span class="ln">' + (e.start + i) + '</span>' + esc(l)).join('\n') +
    (e.cut ? '\n<span class="muted">… ' + (e.end - e.start + 1 - e.lines.length) + ' more lines</span>' : '') + '</pre>';
}
function decisionBlock(r){
  const side = tool => r.originals.filter(o => o.tool === tool).map(o => '<div class="orig"><b>' + (o.link ? '<a href="' + esc(o.link) + '">' + prose(o.name || o.id) + '</a>' : prose(o.name || o.id)) +
    '</b> <span class="small muted">' + esc(o.program) + '</span><br>' + prose(o.text).replace(/\n/g, '<br>') + '</div>').join('') || '<p class="small muted">None</p>';
  return '<div class="decision"><span class="tag">' + esc(DECISION[r.decision] || r.decision) + '</span>' + (r.changed && r.decision === 'kept' ? '<span class="tag grey">Corrected</span>' : '') +
    '<span class="small muted">Round ' + esc(r.round || 0) + '</span><p class="small" style="margin:6px 0 0">' + prose(r.why) + '</p>' +
    (r.confidence_why ? '<p class="small muted" style="margin:4px 0 0">Confidence ' + esc(r.confidence) + ': ' + esc(r.confidence_why) + '</p>' : '') +

  ['sme', 'Waiting for a subject-matter expert', 'The code could not settle these.', null],

  ['kept', 'Kept from one tool', 'Only one tool found these; the agent checked them against the code.', r => r.decision === 'kept'],

  const order = (a, b) => riskRank(a) - riskRank(b) || kindRank(a.key) - kindRank(b.key) || (a.function > b.function ? 1 : -1);
  for (const [id, title, note, test] of FIRST) {
    let keys;
    if (!test) keys = (firstFilter.decision || firstFilter.kind || firstFilter.confidence) ? [] : D.questions.filter(q => !firstFilter.risk || itemRisk(q) === firstFilter.risk)
