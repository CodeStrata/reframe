function searchPage(q){
  const t = q.toLowerCase(), hits = [];
  for (const r of D.requirements) if ((r.code + ' ' + r.text).toLowerCase().includes(t)) hits.push(['Requirement', r.code, r.text, r.function, r.capability, r.key]);
  for (const r of business) if ((r.name + ' ' + r.text + ' ' + r.program).toLowerCase().includes(t)) hits.push(['Business rule', r.program, r.name + ': ' + r.text, r.function, null, r.key]);
  for (const x of D.questions) if ((x.code + ' ' + x.text + ' ' + x.owner).toLowerCase().includes(t)) hits.push(['Open question', x.code, x.text, x.function, x.capability, x.key]);
  for (const c of D.capabilities) if ((c.title + ' ' + c.story).toLowerCase().includes(t)) hits.push(['Capability', c.number + '.', c.title, c.function, c.id, null]);
  let h = crumbs([['Overview', '#/'], ['Search']]) + '<h2>' + plural(hits.length, 'match', 'matches') + ' for “' + esc(q) + '”</h2>';
  h += hits.slice(0, 300).map(([type, code, text, fid, cid, key]) => {
    const cap = cid || (key ? capOfRule(key) : null), c = capById[cap];
    const href = c ? '#/c/' + c.index + (key ? '/' + encodeURIComponent(key) : '') : '#/f/' + fnById[fid].index;
    return '<a class="card" style="margin-bottom:8px" href="' + href + '"><div class="head small muted"><span class="tag">' + type + '</span> ' + esc(code) + ' · ' + where(fid, cap) + '</div><div>' + esc(text.length > 300 ? text.slice(0, 297) + '…' : text) + '</div></a>';
  }).join('');
  if (hits.length > 300) h += '<p class="muted">Showing the first 300. Add words to narrow the search.</p>';
  return h;
}

// ---- technical detail -------------------------------------------------------------------------------
const TECH = [['requirements', 'All requirements'], ['rules', 'All rules'], ['questions', 'Open questions'], ['datamodel', 'Data model'], ['assessment', 'Assessment'],
  ['decisions', "Reframe's answers to " + TOOL.short], ['aws', TOOL.short + "'s own pages"]].filter(([id]) => !(D.sme && ['datamodel', 'decisions', 'aws'].includes(id)));
if (D.sme) TECH.splice(3, 0, ['sme', 'SME list']);
function techPage(tab){
  let h = '<h2>Technical detail</h2><div class="tabs">' + TECH.map(([id, label]) => '<a href="#/tech/' + id + '" class="' + (id === tab ? 'on' : '') + '">' + label + '</a>').join('') + '</div>';
  const fname = id => esc((fnById[id] || {}).name || id), cname = id => { const c = capById[id]; return c ? c.number + '. ' + esc(c.title) : ''; };
  const place = (fid, cid) => '<b>' + fname(fid) + '</b>' + (cid && capById[cid] ? '<br><span class="small muted">' + cname(cid) + '</span>' : '');
  const idLink = (code, cid, key) => { const c = capById[cid]; return c ? '<a href="#/c/' + c.index + '/' + encodeURIComponent(key) + '" title="Open it in the review"><code>' + esc(code) + '</code></a>' : '<code>' + esc(code) + '</code>'; };
  const byFunction = ['fn', 'All functions', r => r.function, rows => [...new Set(rows.map(r => r.function))].map(id => [id, (fnById[id] || {}).name || id]).sort((a, b) => a[1].localeCompare(b[1]))];
  const byCapability = (cap) => ['cap', 'All capabilities', cap, (rows, st) => st.fn ? (fnById[st.fn] || {capabilities: []}).capabilities.map(id => [id, capById[id].number + '. ' + capById[id].title]) : null];
  if (tab === 'requirements') h += filtered('requirements', D.requirements, {
    text: r => r.code + ' ' + r.text + ' ' + r.programs.join(' '),
    selects: [byFunction, byCapability(r => r.capability),
      ['when', 'Any time it applies', r => r.pattern, rows => [...new Set(rows.map(r => r.pattern).filter(Boolean))].sort().map(p => [p, PATTERN[p] || p])],
      ['kind', 'Functional and non-functional', r => r.kind, () => [['F', 'Functional'], ['N', 'Non-functional']]]],
    cols: [['ID', '112px'], ['Function and capability', '22%'], ['When', '112px'], ['Requirement', ''], ['Programs', '104px']],
    render: r => '<tr><td class="id">' + idLink(r.code, r.capability, r.key) + '</td><td>' + place(r.function, r.capability) + '</td><td>' + esc(PATTERN[r.pattern] || r.pattern) +
      (r.kind === 'N' ? '<br><span class="tag grey">Non-functional</span>' : '') + '</td><td>' + prose(r.text) + '</td><td>' + esc(r.programs.join(', ')) + '</td></tr>'});
  if (tab === 'rules') h += filtered('rules', D.rules, {
    text: r => r.name + ' ' + r.text + ' ' + r.program + ' ' + r.requirements.join(' '),
    selects: [byFunction, byCapability(r => capOfRule(r.key)),
      ['disp', 'Business rules and technical steps', r => r.disposition, rows => [...new Set(rows.map(r => r.disposition))].sort().map(d => [d, d === 'captured' ? 'Business rules' : 'Set aside: ' + d.replace(/_/g, ' ')])],
      ['program', 'All programs', r => r.program, rows => [...new Set(rows.map(r => r.program).filter(Boolean))].sort().map(p => [p, p])]]
      .concat(D.rules.some(r => r.kind) ? [['rkind', 'Every kind of rule', r => r.kind || '', () => KIND_ORDER.map(k => [k, KIND[k]])]] : []),
    cols: [['Function and capability', '22%'], ['Program', '100px'], ['Rule', ''], [TOOL.short + ' kept it as', '140px'], ['Backs', '112px']],
    render: r => '<tr><td>' + place(r.function, capOfRule(r.key)) + '</td><td>' + esc(r.program) + '</td><td>' + (r.id && TOOL.key !== 'aws' ? '<code>' + esc(r.id) + '</code> ' : '') + '<b>' + prose(r.name) + '</b><br>' + prose(r.text).replace(/\n/g, '<br>') + '</td><td>' +
      (r.decision ? esc(DECISION[r.decision] || r.decision) + '<br><span class="small muted">' + (r.kind ? esc(KIND[r.kind] || r.kind) + ' · ' : '') + 'Round ' + esc(r.round || 0) + (r.confidence ? ' · confidence ' + esc(r.confidence) : '') + '</span>' :
       r.disposition === 'captured' ? 'Business rule' + (r.priority ? ' · ' + esc(r.priority) : '') + (r.confidence ? '<br><span class="small muted">Confidence ' + esc(r.confidence) + '</span>' : '') : esc(r.disposition.replace(/_/g, ' ')) + (r.reason ? '<br><span class="small muted">' + esc(r.reason) + '</span>' : '')) + '</td><td>' +
      r.requirements.map(code => idLink(code, (reqByKey[r.function + '/' + code] || {}).capability, r.function + '/' + code)).join(' ') + '</td></tr>'});
  if (tab === 'questions') h += filtered('questions', D.questions, {
    text: x => x.code + ' ' + x.text + ' ' + x.owner,
    selects: [byFunction, byCapability(x => x.capability),
      ['owner', 'Every owner', x => x.owner, rows => [...new Set(rows.map(x => x.owner).filter(Boolean))].sort().map(o => [o, o])],
      ['unverified', 'Questions and unverified requirements', x => x.unverified ? 'yes' : 'no', () => [['no', 'Open questions only'], ['yes', 'Unverified requirements only']]]],
    cols: [['ID', '96px'], ['Function and capability', '22%'], ['Question', ''], ['For', '150px']],
    render: x => '<tr><td class="id">' + idLink(x.code, x.capability, x.key) + '</td><td>' + place(x.function, x.capability) + '</td><td>' +
      (x.unverified ? '<span class="tag warn">Unverified requirement</span> ' : '') + prose(x.text) + '</td><td>' + esc(x.owner) + '</td></tr>'});
  if (tab === 'sme' && D.sme) h += '<p class="lead">One list of open questions for subject-matter experts: both tools\' and Reframe\'s own, merged where they ask the same thing, ' +
    'with the possible defects found in the code. Download it, fill in the <b>answer</b> column, put the file in your context folder and run <code>reframe reconcile</code> again.</p>' +
    '<p><button class="btn" id="smeCsv">Download the SME list (CSV)</button></p>' + filtered('sme', D.sme, {
    text: x => x.id + ' ' + x.question + ' ' + x.owner + ' ' + (x.from || []).join(' '),
    selects: [['kind', 'Questions and possible defects', x => x.kind + (x.call ? ':' + x.call : ''), () => [['question', 'Questions'], ['defect:unintended', 'Possible defects that look unintended'], ['defect:deliberate', 'Possible defects that look deliberate']]],
      ['status', 'Any status', x => x.status, () => [['open', 'Open'], ['settled', 'Settled by your context'], ['answered', 'Answered']]]],
    cols: [['ID', '90px'], ['Question', ''], ['Holds up', '28%'], ['Status', '150px']],
    render: x => '<tr><td class="id"><code>' + esc(x.id) + '</code></td><td>' + prose(x.question) + '<br><span class="small muted">From: ' + esc((x.from || []).join('; ')) + ' · For: ' + esc(x.owner) + '</span>' +
      ((x.evidence || []).length ? '<details><summary class="small">Evidence</summary>' + x.evidence.map(excerpt).join('') + '</details>' : '') + '</td><td class="small">' +
      x.holds_up.map(o => (o.link ? '<a href="' + esc(o.link) + '">' + prose(o.name) + '</a>' : prose(o.name)) + ' <span class="muted">(' + esc(o.tool === 'aws' ? 'AWS' : 'Claude') + ', ' + esc(o.program) + ')</span>').join('<br>') +
      (x.rules.length > x.holds_up.length ? '<br><span class="muted">and ' + (x.rules.length - x.holds_up.length) + ' more</span>' : '') + '</td><td>' +
      esc({open: 'Open', settled: 'Settled', answered: 'Answered'}[x.status] || x.status) + (x.settled_by ? '<br><span class="small muted">By ' + esc(x.settled_by) + ': ' + prose(x.settled_answer) + '</span>' : '') +
      (x.answer ? '<br><span class="small muted">' + prose(x.answer) + '</span>' : '') + '</td></tr>'});
  if (tab === 'datamodel') h += '<div class="panel doc">' + (D.data_model || '<p class="muted">' + esc(TOOL.name) + ' wrote no data model.</p>') + '</div>';
  if (tab === 'assessment' && D.sections) h += D.sections.map(s => '<details class="panel doc"' + (s.open ? ' open' : '') + '><summary>' + esc(s.title) + '</summary>' + s.html + '</details>').join('');
  else if (tab === 'assessment') {
    h += '<div class="panel"><h3 style="margin-top:0">Source files by type</h3><table><tbody>' + D.classification.map(([t, n]) => '<tr><td>' + esc(t) + '</td><td>' + n + '</td></tr>').join('') + '</tbody></table></div>';
    h += '<div class="panel"><h3 style="margin-top:0">Codebase issues</h3><div class="scroll"><table><thead><tr><th>Severity</th><th>Issue</th><th>What to do</th></tr></thead><tbody>' +
      D.issues.map(i => '<tr><td>' + esc(i.severity) + '</td><td><b>' + esc(i.name) + '</b><br>' + esc(i.description) + '</td><td>' + esc(i.action) + '</td></tr>').join('') + '</tbody></table></div></div>';
    if (D.unclassified.length) h += '<div class="panel"><h3 style="margin-top:0">Files AWS could not classify</h3><div class="scroll"><table><tbody>' +
      D.unclassified.map(u => '<tr><td>' + esc(u.path) + '</td><td>' + esc(u.reason) + '</td></tr>').join('') + '</tbody></table></div></div>';
  }
  if (tab === 'decisions') h += '<div class="panel scroll"><table><thead><tr><th>When</th><th>' + (TOOL.key === 'aws' ? 'AWS asked' : 'Question') + '</th><th>Reframe answered</th><th>Why</th></tr></thead><tbody>' +
    D.decisions.map(d => '<tr><td>' + esc(d.at) + '</td><td>' + esc(d.question) + '</td><td>' + esc(typeof d.answer === 'string' ? d.answer : JSON.stringify(d.answer)) + '</td><td>' + esc(d.reason) + '</td></tr>').join('') +
    '</tbody></table>' + (D.decisions.length ? '' : '<p class="muted">Reframe gave no answers on anyone\'s behalf.</p>') + '</div>';
  if (tab === 'aws' && D.links.pages) h += '<div class="panel">' + D.links.pages.map(([label, href, note]) => '<p><a href="' + esc(href) + '">' + esc(label) + '</a>' + (note ? ' <span class="small muted">' + esc(note) + '</span>' : '') + '</p>').join('') + '</div>';
  else if (tab === 'aws') h += '<div class="panel">' + (D.links.coverage ? '<p><a href="' + esc(D.links.coverage) + '">AWS coverage report</a></p>' : '') +
    (D.links.catalog ? '<p><a href="' + esc(D.links.catalog) + '">AWS business function catalog</a> <span class="small muted">(if your browser blocks it, run app/serve.py in its folder)</span></p>' : '') +
    (D.links.coverage || D.links.catalog ? '' : '<p class="muted">AWS gave no pages of its own for this run.</p>') + '</div>';
  return h;
}
let filters = {};
// One table with a text filter and dropdowns. A dropdown whose options depend on another (capability on function)
// is disabled until that one is chosen.
function filtered(name, rows, spec){
  const st = filters[name] || (filters[name] = {q: ''});
  const q = st.q.toLowerCase();
  const hits = rows.filter(r => (!q || spec.text(r).toLowerCase().includes(q)) && spec.selects.every(([id, , value]) => !st[id] || String(value(r)) === st[id]));
  const selects = spec.selects.map(([id, label, , options]) => {
    const list = options(rows, st);
    return '<select data-table="' + name + '" data-select="' + id + '"' + (list ? '' : ' disabled') + ' aria-label="' + esc(label) + '"><option value="">' +
      esc(list ? label : 'Choose a function first') + '</option>' + (list || []).map(([v, l]) => '<option value="' + esc(v) + '"' + (st[id] === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
  }).join('');
  const any = st.q || spec.selects.some(([id]) => st[id]);
  return '<div class="panel"><div class="tools"><input type="search" data-table="' + name + '" data-select="q" value="' + esc(st.q) + '" placeholder="Filter by words or ID">' + selects +
    (any ? '<button class="btn" data-clear="' + name + '">Clear filters</button>' : '') + '<span class="muted small" style="align-self:center">' + hits.length + ' of ' + rows.length + '</span></div>' +
    '<div class="tablebox"><table class="datatable"><colgroup>' + spec.cols.map(([, w]) => '<col' + (w ? ' style="width:' + w + '"' : '') + '>').join('') + '</colgroup><thead><tr>' +
    spec.cols.map(([c]) => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + hits.map(spec.render).join('') + '</tbody></table>' +
    (hits.length ? '' : '<p class="muted" style="padding:12px">Nothing matches these filters.</p>') + '</div></div>';
}
function refilter(target){
  const name = target.dataset.table, id = target.dataset.select, st = filters[name] || (filters[name] = {q: ''});
  st[id] = target.value;
  if (id === 'fn') st.cap = '';
  const typing = id === 'q', at = target.selectionStart;
  route();
  if (typing) { const again = document.querySelector('input[data-table="' + name + '"]'); if (again) { again.focus(); again.setSelectionRange(at, at); } }
}
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.table && e.target.tagName === 'INPUT') refilter(e.target); });
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.table && e.target.tagName === 'SELECT') refilter(e.target); });
document.addEventListener('click', e => { const b = e.target.closest('[data-clear]'); if (b) { filters[b.dataset.clear] = {q: ''}; route(); } });

// ---- routing ----------------------------------------------------------------------------------------
function route(){
  const parts = (location.hash || '#/').slice(2).split('/'), [kind, a] = parts;
  let h, tech = kind === 'tech', focus = null;
  if (D.reconcile && (kind === 'first' || !location.hash)) h = firstPage();
  else if (kind === 'd' && D.domains[+a]) h = domainPage(D.domains[+a]);
  else if (kind === 'f' && D.functions[+a]) h = functionPage(D.functions[+a]);
  else if (kind === 'c' && D.capabilities[+a]) { focus = parts[2] ? decodeURIComponent(parts.slice(2).join('/')) : null; h = capabilityPage(D.capabilities[+a], focus); }
  else if (kind === 'search' && a) { const q = decodeURIComponent(parts.slice(1).join('/')); if (document.activeElement !== $('search')) $('search').value = q; h = searchPage(q); }
  else if (tech) h = techPage(a || 'requirements');
  else h = overview();
  $('main').innerHTML = h;
  const first = D.reconcile && (kind === 'first' || !location.hash);
  $('vFirst').hidden = !D.reconcile; $('vFirst').classList.toggle('on', first);
  $('vReview').classList.toggle('on', !tech && !first); $('vTech').classList.toggle('on', tech);
  if (focus) { const el = document.getElementById(anchor(focus)); if (el) { const det = el.closest('details'); if (det) det.open = true; el.scrollIntoView({block: 'center'}); el.style.outline = '2px solid var(--accent)'; } }
  else if (!(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.table)) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
let searchTimer;
$('search').addEventListener('input', e => { clearTimeout(searchTimer); const v = e.target.value.trim(); searchTimer = setTimeout(() => { location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/'; }, 250); });

// ---- the review dialog and downloads ---------------------------------------------------------------
function allKeys(){ const keys = new Set(); D.domains.forEach(d => domItems(d).forEach(k => keys.add(k))); return keys; }
function describe(key){
  const r = reqByKey[key], b = ruleByKey[key], q = qByKey[key], cap = !r && !b && !q ? capById[key] : null;
  if (cap) { const f = fnById[cap.function] || {}, d = domByKey[f.domain] || {};
    return {key, type: 'capability', domain: d.name || '', business_function: f.name || '', capability: cap.number + '. ' + cap.title, id: String(cap.number), text: cap.title + ': ' + cap.story}; }
  const fid = (r || b || q).function, f = fnById[fid] || {}, d = domByKey[f.domain] || {};
  const cid = r ? r.capability : q ? q.capability : capOfRule(key), c = capById[cid] || {};
  return {key, type: r ? 'requirement' : b ? 'business rule' : 'open question', domain: d.name || '', business_function: f.name || '',
    capability: c.title ? c.number + '. ' + c.title : '', id: r ? r.code : q ? q.code : b.program + ' ' + b.id, text: r ? r.text : q ? q.text : b.name + ': ' + b.text};
}
function rows(){ return Object.entries(marks).filter(([k, m]) => m && m.status && (reqByKey[k] || ruleByKey[k] || qByKey[k] || (D.reconcile && capById[k])))
  .map(([k, m]) => ({...describe(k), status: {agree: 'Agree', change: 'Needs change', question: 'Question'}[m.status], comment: m.comment || '', marked_at: m.at || ''})); }
function download(name, type, body){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function fileName(ext){ return 'review-' + (D.project || 'run') + (TOOL.key === 'aws' ? '' : '-' + TOOL.key) + '-' + (reviewer || 'reviewer').replace(/[^A-Za-z0-9_-]+/g, '-') + '-' + new Date().toISOString().slice(0, 10) + '.' + ext; }
function updateCounts(){
  const keys = allKeys(), c = countsOf(keys), done = reviewed(keys), by = {agree: 0, change: 0, question: 0};
  Object.values(marks).forEach(m => { if (m && by[m.status] != null) by[m.status]++; });
  $('reviewCounts').innerHTML = '<b>' + done + ' of ' + keys.size + '</b> items marked (' + c.req + ' requirements, ' + c.rule + ' business rules, ' + c.q + ' open questions in all).<br>' +
    'Agree ' + by.agree + ' · Needs change ' + by.change + ' · Question ' + by.question + ' · Functions signed off ' + signoffRows().length;
}
$('reviewButton').addEventListener('click', () => { $('reviewer').value = reviewer; updateCounts(); if (!stored) $('storageNote').className = 'note'; $('reviewDialog').showModal(); });
$('closeDialog').addEventListener('click', () => $('reviewDialog').close());
$('reviewer').addEventListener('input', e => { reviewer = e.target.value.trim(); try { localStorage.setItem('reframe-reviewer', reviewer); } catch (err) {} });
$('downloadCsv').addEventListener('click', () => {
  const cols = ['key', 'tool', 'domain', 'business_function', 'capability', 'type', 'id', 'text', 'status', 'comment', 'reviewer', 'marked_at', 'project', 'run', 'source_sha256'];
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const body = [cols.join(',')].concat(rows().concat(signoffRows()).map(r => cols.map(c => cell(c === 'tool' ? TOOL.name : c === 'reviewer' ? reviewer : c === 'project' ? D.project : c === 'run' ? D.run : c === 'source_sha256' ? D.source.sha256 : r[c])).join(','))).join('\r\n');
  download(fileName('csv'), 'text/csv;charset=utf-8', '﻿' + body);
});
$('downloadJson').addEventListener('click', () => {
  download(fileName('json'), 'application/json', JSON.stringify({format: 'reframe-review/1', tool: TOOL.name, project: D.project, run: D.run,
    source: {name: D.source.name, commit: D.source.commit, sha256: D.source.sha256}, reviewer, exported_at: new Date().toISOString(), marks: rows(),
    signoffs: signoffRows().map(r => ({function: r.function, name: r.business_function, domain: r.domain, comment: r.comment, at: r.marked_at}))}, null, 2));
});
$('clearMarks').addEventListener('click', () => { if (confirm('Clear every mark you made on this page? Download them first if you want to keep them.')) { marks = {}; save(); updateCounts(); route(); } });

$('title').textContent = (D.reconcile ? 'Reconciled review' : 'Business review') + (D.project ? ': ' + D.project : '');
$('subtitle').textContent = (D.reconcile ? 'AWS Transform and Claude reconciled against the source of ' : TOOL.name + ' assessment of ') + (D.source.name || 'the source') + (D.source.commit ? ' @ ' + String(D.source.commit).slice(0, 12) : '');
document.addEventListener('click', e => {
  if (!e.target.closest('#smeCsv')) return;
  const cols = ['id', 'kind', 'call', 'question', 'owner', 'status', 'rules', 'originals', 'from', 'evidence', 'settled_by', 'settled_answer', 'answer'];
  const cell = v => '"' + String(v == null ? '' : Array.isArray(v) ? v.join(' ') : v).replace(/"/g, '""') + '"';
  download('sme-list-' + (D.project || 'run') + '.csv', 'text/csv;charset=utf-8', '\ufeff' + [cols.join(',')].concat(D.sme.map(x => cols.map(c => cell(c === 'from' ? (x.from || []).join('; ') : x[c])).join(','))).join('\r\n'));
});
$('others').innerHTML = (D.nav || []).map(([label, href]) => '<a href="' + esc(href) + '">' + esc(label) + '</a>').join('');
route();
</script>
