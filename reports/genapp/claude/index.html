r id is rejected with return code 99 and nothing is updated.", "defect": ""}, {"key": "claude/RULE-043", "function": "claude/policy/03", "id": "RULE-043", "name": "Policy update requires a request payload", "text": "Given A call to the policy update database program\nWhen The communication area length (EIBCALEN) is 0\nThen An error message ' NO COMMAREA RECEIVED' is logged and the task abends with code LGCA (no dump); no database work is attempted", "program": "LGUPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001"], "priority": "P1", "category": "Validation", "confidence": "High", "source": "base/src/lgupdb01.cbl:183-187", "plain": "A policy update request that arrives with no data is rejected outright and the transaction is abnormally ended.", "defect": ""}, {"key": "claude/RULE-044", "function": "claude/policy/03", "id": "RULE-044", "name": "Policy update request type and minimum data-length check", "text": "Given An update request with request id '01UHOU' (House) and a message of 150 bytes\nWhen The update-policy service validates the request\nThen Required length is 28 + 130 = 158 bytes; 150 < 158 so return code '98' is set and control returns without updating. A 158-byte or longer House request passes and is forwarded to the database update routine LGUPDB01.", "program": "LGUPOL01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-002", "REQ-F-003", "REQ-F-004"], "priority": "P1", "category": "Validation", "confidence": "Medium", "source": "base/src/lgupol01.cbl:113-143", "plain": "A policy update must be for an Endowment, House or Motor policy, and the request must carry at least the 28-byte header plus the full detail block for that policy type; short requests are rejected with code 98, other request types are flagged with code 99.", "defect": "For an unrecognised request id the code sets return code '99' but does NOT return; it still performs UPDATE-POLICY-DB2-INFO (line 143). LGUPDB01 resets CA-RETURN-CODE to '00' on entry (lgupdb01.cbl:190), so the '99' rejection is overwritten and the caller may see the outcome of the DB routine instead of an 'unsupported request' error."}, {"key": "claude/RULE-045", "function": "claude/policy/04", "id": "RULE-045", "name": "Delete request must carry a usable request area", "text": "Given A delete request arrives\nWhen The request data length is 0, or is between 1 and 27 bytes\nThen Length 0: the transaction aborts with code LGCA after logging 'NO COMMAREA RECEIVED'. Length 1-27: return code 98 and no delete. Length 28 or more: processing continues with return code 00", "program": "LGDPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-003"], "priority": "P2", "category": "Validation", "confidence": "High", "source": "base/src/lgdpdb01.cbl:131-146", "plain": "A delete request with no data at all is aborted outright, and one shorter than the 28-byte header is rejected with return code 98; otherwise the return code starts at 00.", "defect": ""}, {"key": "claude/RULE-046", "function": "claude/customer/01", "id": "RULE-046", "name": "Customer data requests must carry a request area", "text": "Given A call to LGACDB02, LGICDB01 or LGUCDB01 with commarea length 0\nWhen The program starts\nThen An error message ' NO COMMAREA RECEIVED' is logged and the transaction abends with code LGCA", "program": "LGICDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-003", "REQ-F-003", "REQ-F-003", "REQ-N-001"], "priority": "P2", "category": "Validation", "confidence": "High", "source": "base/src/lgicdb01.cbl:118-123", "plain": "Any customer add-security, inquiry or update call that arrives without request data is rejected by abending the transaction and logging the error.", "defect": ""}, {"key": "claude/RULE-047", "function": "claude/policy/02", "id": "RULE-047", "name": "Optional broker and payment values are left blank when absent", "text": "Given An endowment policy with no broker (BROKERID null) and payment 250\nWhen 01IEND inquiry succeeds\nThen Broker ID returned as initialised value (zero), payment returned as 250; term and sum assured converted to display numerics.", "program": "LGIPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009"], "priority": "P2", "category": "Validation", "confidence": "Medium", "source": "base/src/lgipdb01.cbl:394-405", "plain": "Broker ID and payment are optional policy attributes; when they are null in the database they are not copied to the response, so initialised (zero) values are returned.", "defect": ""}, {"key": "claude/RULE-048", "function": "claude/customer/01", "id": "RULE-048", "name": "Default security credentials created for every new customer", "text": "Given Customer 1000042 was just inserted\nWhen LGACDB01 links to LGACDB02\nThen A customer-security record is requested for customer 1000042 with password hash <credential \u2014 masked, see base/src/lgacdb01.cbl:181> (preview '5732****'), count '0000' and state 'N'", "program": "LGACDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "base/src/lgacdb01.cbl:179-189", "plain": "After a customer is added, a security record is created through LGACDB02 with request '02ACUS'. It holds a fixed default password hash, an access/failure count of 0000 and state 'N'.", "defect": "There is a hardcoded shared default credential hash in source, and the security-record step does not check its result. | Every new customer receives the same hardcoded default password hash from the caller (shared default credential). Also, on insert failure the customer row already created by LGACDB01 is not rolled back by this program."}, {"key": "claude/RULE-049", "function": "claude/customer/01", "id": "RULE-049", "name": "Customer record creation and insert failure outcome", "text": "Given An add-customer request whose commarea passes the length check\nWhen The INSERT INTO CUSTOMER returns a non-zero SQLCODE (for example -803 duplicate key, or -180 for an invalid DOB value)\nThen CA-RETURN-CODE is set to '90', an error message with the SQLCODE is written to the queue through LGSTSQ, and the program returns. The VSAM copy and the security record are not created.", "program": "LGACDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-008", "REQ-F-009", "REQ-F-010", "REQ-F-012", "REQ-F-014"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "base/src/lgacdb01.cbl:215-287", "plain": "Adding a customer inserts one CUSTOMER row with name, date of birth, house name and number, postcode, mobile and home phone, and email. If the insert fails, the request is rejected with return code 90 and no later step runs.", "defect": ""}, {"key": "claude/RULE-050", "function": "claude/customer/01", "id": "RULE-050", "name": "New customer is stored in the customer master file under its 10-digit customer number", "text": "Given A new-customer request with customer number 0001000042, first name 'Jane', last name 'Smith', DOB '1980-05-14', postcode 'SO21 2JN' and email '<email>'\nWhen the add-customer VSAM step (LGACVS01) runs\nThen a record of 225 bytes (customer number + name, DOB, house name/number, postcode, number of policies, mobile, home phone, email) is written to KSDSCUST with key 0001000042; if KSDSCUST already holds key 0001000042 (DUPREC) or any other non-NORMAL response occurs, CA-RETURN-CODE is set to '80', an error is logged, and the task abends with LGV0 (no dump)", "program": "LGACVS01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-015", "REQ-F-016"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "base/src/lgacvs01.cbl:66-81", "plain": "When a customer is registered, a 225-byte customer record keyed by the 10-digit customer number is written to the VSAM customer file; if the write fails for any reason (including a customer number that already exists), the request fails with return code 80 and the transaction abends with code LGV0.", "defect": "The program abends right after it sets CA-RETURN-CODE '80', so the EXEC CICS RETURN on line 80 can never run and the caller probably never sees RC 80. Whether the DB2 insert done earlier in the flow is rolled back depends on the abend causing a syncpoint rollback."}, {"key": "claude/RULE-051", "function": "claude/policy/01", "id": "RULE-051", "name": "Policy header creation with system-assigned number and timestamp", "text": "Given A valid House add request for customer 1000001 with issue date 2026-01-01, expiry date 2027-01-01, broker ID 55 and payment 300\nWhen The POLICY insert succeeds\nThen POLICY gets a new row with a database-assigned number (for example 2000123), type 'H' and LASTCHANGED = CURRENT TIMESTAMP. The caller gets that number in CA-POLICY-NUM, the stored timestamp in CA-LASTCHANGED and return code '00'.", "program": "LGAPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007", "REQ-F-008"], "priority": "P0", "category": "Lifecycle", "confidence": "High", "source": "base/src/lgapdb01.cbl:261-321", "plain": "Every new policy first gets a header row in POLICY. The database assigns the policy number, and the last-changed timestamp is set to the current time. The new policy number and timestamp are returned to the caller.", "defect": "No business check that the expiry date is after the issue date, and no SQLCODE check on the timestamp read-back at lines 316-321."}, {"key": "claude/RULE-052", "function": "claude/policy/04", "id": "RULE-052", "name": "Deleting a policy removes it and its type-specific details together", "text": "Given Customer 0000000001 owns house policy 0000000005\nWhen A '01DHOU' delete request for customer 0000000001 / policy 0000000005 is processed\nThen The POLICY row matching both numbers is deleted, the HOUSE details row goes with it by cascade, and the request returns 00. If the database reports anything other than success, return code 90 is set, the error is logged, and control returns without deleting the policy-file record", "program": "LGDPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "base/src/lgdpdb01.cbl:186-202", "plain": "A policy is deleted by customer number plus policy number. Removing the main POLICY row also removes the linked Endowment/House/Motor/Commercial details through the database's foreign-key cascade. Any outcome other than a clean delete returns code 90 and stops before the policy-file copy is touched.", "defect": "The comment at lines 196-197 says SQLCODE 100 (not found) should count as success so that deletes are idempotent, but line 198 tests only SQLCODE NOT EQUAL 0. Deleting a policy that is already gone returns 90 (error) and skips the policy-file delete, so the database and the policy file can drift apart."}, {"key": "claude/RULE-053", "function": "claude/policy/03", "id": "RULE-053", "name": "Policy header update stamps a new last-changed timestamp", "text": "Given Policy 5 with matching timestamps and a successful product-table update\nWhen The POLICY row is updated\nThen ISSUEDATE, EXPIRYDATE, BROKERID and BROKERSREFERENCE take the request values. LASTCHANGED = CURRENT TIMESTAMP, which is read back into CA-LASTCHANGED. On error the unit of work is rolled back (SYNCPOINT ROLLBACK), the code is '90' and the error is logged", "program": "LGUPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014", "REQ-N-001"], "priority": "P0", "category": "Lifecycle", "confidence": "Medium", "source": "base/src/lgupdb01.cbl:312-342", "plain": "A successful update sets the policy's issue date, expiry date, broker ID and broker reference from the request, stamps the current timestamp as last-changed, and returns that new timestamp to the caller.", "defect": "The SQLCODE test at line 336 checks the SELECT read-back, not the UPDATE at 318-326, so an UPDATE failure followed by a successful SELECT goes undetected. After a rollback the WITH HOLD cursor is closed, so CLOSE-PCURSOR probably gets -501 and resets the code to '00' (line 373), hiding the failure."}, {"key": "claude/RULE-054", "function": "claude/policy/01", "id": "RULE-054", "name": "Newly added policy is passed to downstream processor LGAPVS01", "text": "Given A House add request that was saved successfully as policy 2000123\nWhen The product insert completes\nThen LGAPVS01 is linked with the request data (length 32500), including policy number 2000123 and return code '00'.", "program": "LGAPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-018"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "base/src/lgapdb01.cbl:243-246", "plain": "After all inserts succeed, the full request, including the new policy number and timestamp, is passed to program LGAPVS01 for further processing before control returns to the caller.", "defect": ""}, {"key": "claude/RULE-055", "function": "claude/policy/01", "id": "RULE-055", "name": "Commercial policy dates, perils and status recorded as supplied", "text": "Given A Commercial add request with issue date 2026-03-01, expiry date 2027-03-01, fire premium 500, status 0 and blank rejection reason\nWhen The COMMERCIAL row is inserted\nThen RequestDate = the new policy's LASTCHANGED timestamp, StartDate = 2026-03-01, RenewalDate = 2027-03-01, FirePremium = 500, Status = 0. No premium is calculated and no status is derived.", "program": "LGAPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-016", "REQ-F-017"], "priority": "P1", "category": "Lifecycle", "confidence": "Medium", "source": "base/src/lgapdb01.cbl:486-545", "plain": "A commercial policy's request date is set to the policy header's last-changed timestamp. Its start and renewal dates are the policy issue and expiry dates. The peril indicators, peril premiums, status and rejection reason are stored exactly as the caller sent them.", "defect": ""}, {"key": "claude/RULE-056", "function": "claude/policy/01", "id": "RULE-056", "name": "Adding a policy to the policy file fails if it cannot be written", "text": "Given A new motor policy 0000000007 for customer 0000000001 has been added\nWhen The policy-file write is attempted\nThen On success the record exists in KSDSPOLY with key 'M00000000010000000007'. If the key already exists or the write fails for another reason, return code 80 is returned", "program": "LGAPVS01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-021"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "base/src/lgapvs01.cbl:135-147", "plain": "When a policy is added, a new record is written to the KSDSPOLY policy file. If the write fails for any reason (including a duplicate key), return code 80 is set, the error is logged, and control goes back to the caller.", "defect": ""}, {"key": "claude/RULE-057", "function": "claude/policy/04", "id": "RULE-057", "name": "Policy deletion removes the VSAM policy record identified by policy type, customer and policy number", "text": "Given A delete-policy request with request ID '01DHOU', customer number 0000000001 and policy number 0000000005, already removed from the DB2 POLICY table by LGDPDB01\nWhen LGDPVS01 runs\nThen The KSDSPOLY record with key 'H' + '0000000001' + '0000000005' (21 chars) is deleted. The return code is left as the caller set it.", "program": "LGDPVS01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007"], "priority": "P1", "category": "Lifecycle", "confidence": "High", "source": "base/src/lgdpvs01.cbl:75-91", "plain": "When a policy is deleted, its record in the policy file is removed. The record is found by a 21-character key: the policy type letter, then the 10-digit customer number, then the 10-digit policy number.", "defect": ""}, {"key": "c position": "captured", "reason": "", "requirements": ["REQ-F-013", "REQ-F-014"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "base/src/lgacdb01.cbl:174-177", "plain": "Once the DB2 insert succeeds, the same customer data is passed to LGACVS01 so the customer also exists in the VSAM key file.", "defect": ""}, {"key": "claude/RULE-085", "function": "claude/policy/01", "id": "RULE-085", "name": "Policy-file record is keyed by policy type, customer and policy number and holds type-specific details", "text": "Given An add request '01AHOU' for customer 0000000001, policy 0000000005, 3 bedrooms, value 00250000, postcode 'AB12 3CD'\nWhen The policy-file record is built\nThen Key = 'H'+'0000000001'+'0000000005'; data = property type(15), bedrooms(3), value(8), postcode(8), house name(9)", "program": "LGAPVS01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-019", "REQ-F-020", "REQ-F-016", "REQ-F-007"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "base/src/lgapvs01.cbl:99-132", "plain": "Each policy in the KSDSPOLY policy file is a 64-byte record. Its 21-byte key is the policy-type letter (the 4th character of the request ID) plus the customer number and policy number. The 43 bytes after the key hold only the details that apply to that policy type.", "defect": ""}, {"key": "claude/RULE-086", "function": "claude/policy/02", "id": "RULE-086", "name": "Commercial inquiry by policy number alone (no ownership check)", "text": "Given Commercial policy 0000000012 owned by customer 0000000003\nWhen A 02ICOM inquiry is made with policy 0000000012 and any (or blank) customer number\nThen The policy is returned and the response customer number is overwritten with 0000000003.", "program": "LGIPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-013"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "base/src/lgipdb01.cbl:730-829", "plain": "Request 02ICOM looks up a commercial policy by policy number only and returns the owning customer number, so any caller can retrieve any commercial policy.", "defect": "Bypasses the customer/policy ownership check enforced by every other single-policy inquiry."}, {"key": "claude/RULE-087", "function": "claude/policy/02", "id": "RULE-087", "name": "List commercial policies by customer (capped) or by postcode", "text": "Given Customer 0000000004 with 25 commercial policies\nWhen A 03ICOM inquiry is made\nThen Rows are fetched until the count exceeds 20 (21 rows fetched), then the loop stops; the response holds only the last fetched row and return code stays '00'. Cursor open failure -> '89', close failure -> '88'.", "program": "LGIPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-014", "REQ-F-015", "REQ-F-016"], "priority": "P1", "category": "Policy", "confidence": "Low", "source": "base/src/lgipdb01.cbl:835-913", "plain": "03ICOM retrieves a customer's commercial policies through a cursor stopping after about 20 rows; 05ICOM retrieves commercial policies by postcode with no cap; each fetched row overwrites the same response slot.", "defect": "All rows overwrite the same commarea slot so only the last row is returned; cap is off-by-one (21 fetched); negative SQLCODE can loop indefinitely; empty result reports success."}, {"key": "claude/RULE-088", "function": "claude/logging/01", "id": "RULE-088", "name": "Error log queue routing by optional Q= prefix", "text": "Given A caller passes the message 'Q=PROD Policy 123 add failed'\nWhen LGSTSQ logs the message\nThen The TS queue name becomes 'GENAPROD' (first 4 chars of GENAERRS kept, last 4 replaced by the 4 chars after 'Q='), the logged text becomes 'Policy 123 add failed', and the record length is reduced by 7; a message without a 'Q=' prefix goes to GENAERRS unchanged", "program": "LGSTSQ", "disposition": "captured", "reason": "", "requirements": ["REQ-F-005", "REQ-F-006", "REQ-F-007", "REQ-F-008", "REQ-F-009", "REQ-F-011"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "base/src/lgstsq.cbl:82-88", "plain": "Error messages go to the temporary storage queue GENAERRS unless the message starts with 'Q=nnnn', in which case they go to queue GENAnnnn and the 7-character prefix is removed from the logged text.", "defect": "Short or malformed extensions are not validated, so the program can build an odd queue name made of spaces and text (e.g. 'GENAAB x') and errors get scattered across unintended queues."}, {"key": "claude/RULE-089", "function": "claude/logging/01", "id": "RULE-089", "name": "Dual-destination error logging with non-blocking TS write", "text": "Given An error message is ready and TS storage is exhausted\nWhen LGSTSQ writes the log\nThen The record is written to TD queue CSMT. The TS queue write (GENAERRS or its override) is attempted with NOSUSPEND, and if no space is available it is silently dropped. The response codes are not checked and the caller is not told about the failure", "program": "LGSTSQ", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010", "REQ-F-011", "REQ-N-001", "REQ-F-012"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "base/src/lgstsq.cbl:92-111", "plain": "Every error message is written both to the system message transient data queue CSMT and to the application's temporary storage queue. If storage is short, the TS write is skipped and the task does not wait.", "defect": "Write failures on both queues are ignored without any signal, so error records can be lost with no indication."}, {"key": "claude/RULE-090", "function": "claude/ui/03", "id": "RULE-090", "name": "Terminal-entered policies carry no broker and no payment", "text": "Given Operator adds or updates a house or endowment policy from the terminal\nWhen The add (01AHOU/01AEND) or update (01UHOU/01UEND) request is built\nThen CA-PAYMENT = 0, CA-BROKERID = 0, CA-BROKERSREF = '        ' are sent regardless of any existing values", "program": "LGTESTP3", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-016", "REQ-F-007", "REQ-F-012"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "base/src/lgtestp3.cbl:93-97", "plain": "Policies added or updated through the 3270 policy menus are always recorded with payment 0, broker id 0 and a blank broker reference, i.e. they are treated as direct (non-brokered) business with no payment captured.", "defect": "Update path blanks broker and payment data that the preceding inquiry may have returned, potentially wiping brokered-policy information."}, {"key": "claude/RULE-091", "function": "claude/customer/03", "id": "RULE-091", "name": "Customer update always propagates to secondary customer store", "text": "Given A customer update request for customer 1000042\nWhen The DB2 update completes with any result (00, 01 or 90)\nThen LGUCVS01 is invoked with the first 225 bytes of the request area", "program": "LGUCDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-007"], "priority": "P1", "category": "Policy", "confidence": "Medium", "source": "base/src/lgucdb01.cbl:133-143", "plain": "After the database update attempt, the update request is always forwarded to the secondary customer store program LGUCVS01, regardless of the database outcome.", "defect": "Secondary store is updated even when the primary DB2 update failed (rc 01/90), risking divergence between the two stores."}, {"key": "claude/RULE-092", "function": "claude/policy/03", "id": "RULE-092", "name": "Route type-specific detail update by request ID", "text": "Given The timestamps match\nWhen CA-REQUEST-ID is '01UEND', '01UHOU' or '01UMOT'\nThen The ENDOWMENT, HOUSE or MOTOR row for the policy number is updated. If that sets a non-'00' return code, the cursor is closed and the program returns without updating the POLICY table", "program": "LGUPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-009", "REQ-F-012"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "base/src/lgupdb01.cbl:283-307", "plain": "The request ID decides which product table gets updated: endowment, house or motor. If that update fails, the policy header is left unchanged.", "defect": "Unknown request IDs are not rejected and still change the policy header. Product-update failures are reported as '00' because the cursor close overwrites the code."}, {"key": "claude/RULE-093", "function": "claude/policy/01", "id": "RULE-093", "name": "Policy maintenance result codes and empty-request abend", "text": "Given A policy service is called with no request data\nWhen The service starts\nThen An error message with date, time and program name is written to the error queue via LGSTSQ and the transaction ends with abend code LGCA; with data present the return code starts as '00' and may be changed to 98/99 or by the database routine.", "program": "LGUPOL01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-F-005", "REQ-F-001", "REQ-F-004", "REQ-F-001", "REQ-F-002", "REQ-F-004", "REQ-F-001", "REQ-F-002", "REQ-F-004"], "priority": "P1", "category": "Policy", "confidence": "High", "source": "base/src/lgupol01.cbl:98-141", "plain": "All four policy services (add, inquire, update, delete) share one outcome convention: an empty request terminates abnormally with code LGCA and logs the event, otherwise the result starts as '00' (success), '98' means the request data is too short and '99' means the request type is not supported.", "defect": ""}, {"key": "claude/RULE-094", "function": "claude/customer/04", "id": "RULE-094", "name": "VSAM customer-file failures are recorded in an audit log with a timestamp and the request data", "text": "Given An update for customer 0001000042 fails because the record is not found (RESP=13)\nWhen the error routine runs\nThen one message is sent to LGSTSQ in the form '<MMDDYYYY> <HHMMSS> LGUCVS01 CNUM=0001000042 Re-write  KSDSCUST  RESP=+00013 RESP2=+00000', and a second message 'COMMAREA=' followed by the first 90 bytes of the commarea", "program": "LGACVS01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-001", "REQ-F-002", "REQ-N-001"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "base/src/lgacvs01.cbl:89-120", "plain": "Every failed customer-file add or update logs the date (MMDDYYYY), time, program name, customer number and the CICS response codes, followed by up to the first 90 bytes of the request, to the shared error queue program LGSTSQ.", "defect": ""}, {"key": "claude/RULE-095", "function": "claude/policy/04", "id": "RULE-095", "name": "Failed policy deletes are logged with policy, customer, time and response codes", "text": "Given A failed KSDSPOLY delete for policy 0000000005 / customer 0000000001 with RESP=13\nWhen The error routine runs\nThen Two messages go to LGSTSQ. The first is 'MMDDYYYY HHMMSS LGDPVS01 PNUM=0000000005 CNUM=0000000001 Delete file KSDSPOLY RESP=+00013 RESP2=...'. The second is 'COMMAREA=' followed by the first 90 bytes, or fewer if the commarea is shorter.", "program": "LGDPVS01", "disposition": "captured", "reason": "", "requirements": ["REQ-N-001"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "base/src/lgdpvs01.cbl:99-131", "plain": "Each failed delete writes an audit message to the error queue. The message holds the date and time, policy number, customer number and CICS response codes, followed by up to the first 90 bytes of the request data.", "defect": ""}, {"key": "claude/RULE-096", "function": "claude/policy/02", "id": "RULE-096", "name": "End-of-policy-data marker", "text": "Given A successful House inquiry\nWhen Data is moved to the response\nThen 'FINAL' is placed in the first 5 bytes of the house filler area.", "program": "LGIPDB01", "disposition": "captured", "reason": "", "requirements": ["REQ-F-010"], "priority": "P2", "category": "Policy", "confidence": "Medium", "source": "base/src/lgipdb01.cbl:507-508", "plain": "After a successful single-policy inquiry, the literal 'FINAL' is written immediately after the policy data so the caller knows where the record ends.", "defect": ""}, {"key": "claude/RULE-097", "function": "claude/ops/03", "id": "RULE-097", "name": "Operational log and status queues purged on reset", "text": "Given GENAERRS holds 25 error records from earlier runs\nWhen LGSETUP runs\nThen GENAERRS, GENASTRT, GENASTAT and GENACNTL are deleted. None is recreated except GENACNTL; the others are rebuilt later when the application next writes to them", "program": "LGSETUP", "disposition": "captured", "reason": "", "requirements": ["REQ-F-011", "REQ-F-012", "REQ-F-013"], "priority": "P2", "category": "Policy", "confidence": "High", "source": "base/src/lgsetup.cbl:137-152", "plain": "Setup discards all accumulated error, start-up and statistics history by deleting the GENAERRS, GENASTRT and GENASTAT temporary storage queues (as well as GENACNTL) before reinitialising the application.", "defect": ""}, {"key": "claude/RULE-098", "function": "claude/ops/02", "id": "RULE-098", "name": "Business-monitor symbol list is built but never delivered", "text": "Given All counters have been read and S1..S39 populated\nWhen the program reaches the end of MAINLINE (lines 703-709)\nThen it moves APPLID into S1 and returns without sending SymbList, the template or the start time S40 anywhere", "program": "LGWEBST5", "disposition": "captured", "reason": "", "requirements": ["REQ-F-020"], "priority": "P2", "category": "Policy", "confidence": "Low", "source": "base/src/lgwebst5.cbl:76-156", "plain": "The program fills a name=value symbol list (APPLID, each counter value, total successes, total errors, start time) for template GENAST3TEMP, but never sends or stores it, so only the TS queues reach consumers.", "defect": "This looks like a leftover from copying a web-statistics program: totals such as errors and GENAOTHER are computed into S-fields that nothing ever reads."}], "questions": [{"key": "claude/customer/01/OQ-001", "code": "OQ-001", "text": "What do security state 'N' and the count field mean (for example N = new or must-change-password, count = failed logins), what other states exist, and which process increments the count and moves the customer out of state 'N'?", "owner": "Security officer", "unverified": false, "capability": "claude/customer/01#4", "function": "claude/customer/01", "rule": "RULE-048"}, {"key": "claude/customer/01/OQ-002", "code": "OQ-002", "text": "Is the shared default password hash given to every new customer meant to be used in production?", "owner": "Security officer", "unverified": false, "capability": "claude/customer/01#4", "function": "claude/customer/01", "rule": "RULE-048"}, {"key": "claude/customer/01/OQ-003", "code": "OQ-003", "text": "Is the VSAM copy still the authoritative store for any process, and should a VSAM write failure roll back the DB2 insert?", "owner": "Data architect", "unverified": false, "capability": "claude/customer/01#5", "function": "claude/customer/01", "rule": "RULE-084"}, {"key": "claude/customer/03/OQ-001", "code": "OQ-001", "text": "Should the secondary customer store (LGUCVS01) be updated only when the DB2 update succeeds (rc '00')?", "owner": "Data architect", "unverified": false, "capability": "claude/customer/03#3", "function": "claude/customer/03", "rule": "RULE-091"}, {"key": "claude/policy/01/OQ-001", "code": "OQ-001", "text": "Is the -530 on POLICY insert always a missing customer, or can the BROKERID column also have a foreign key that returns 70 for an unknown broker?", "owner": "Data architect / DBA", "unverified": false, "capability": "claude/policy/01#2", "function": "claude/policy/01", "rule": "RULE-021"}, {"key": "claude/policy/01/OQ-002", "code": "OQ-002", "text": "Is the motor premium expected to be rated somewhere else before this program runs, or is a premium supplied by the caller the intended business behaviour?", "owner": "Underwriting / pricing lead", "unverified": false, "capability": "claude/policy/01#3", "function": "claude/policy/01", "rule": "RULE-002"}, {"key": "claude/policy/01/OQ-003", "code": "OQ-003", "text": "What do the commercial Status codes mean (for example, 0 = accepted, other = rejected?), and are the peril premiums calculated upstream (for example by the caller or LGAPOL01) instead of here?", "owner": "Commercial underwriting SME", "unverified": false, "capability": "claude/policy/01#3", "function": "claude/policy/01", "rule": "RULE-055"}, {"key": "claude/policy/01/OQ-004", "code": "OQ-004", "text": "What business step does LGAPVS01 perform (for example, writing the policy to a VSAM copy or audit file), and should the add fail if that step fails?", "owner": "Policy administration SME", "unverified": false, "capability": "claude/policy/01#4", "function": "claude/policy/01", "rule": "RULE-054"}, {"key": "claude/policy/02/OQ-001", "code": "OQ-001", "text": "Is it intended that policy inquiry skips the 28-byte header-length check that add, update and delete perform, or should a short inquiry be rejected with code 98?", "owner": "Policy administration lead", "unverified": false, "capability": "claude/policy/02#1", "function": "claude/policy/02", "rule": "RULE-030"}, {"key": "claude/policy/02/OQ-002", "code": "OQ-002", "text": "Should a missing broker / payment be returned as zero, or distinguished as 'not set' in the new system? And should a null broker's reference be handled the same way?", "owner": "Policy administration lead", "unverified": false, "capability": "claude/policy/02#2", "function": "claude/policy/02", "rule": "RULE-047"}, {"key": "claude/policy/02/OQ-003", "code": "OQ-003", "text": "Is it intended that the commercial RequestDate is exposed as the policy's last-changed timestamp (used elsewhere for optimistic locking), or should last-changed come from POLICY.LASTCHANGED?", "owner": "Data architect / DBA", "unverified": false, "capability": "claude/policy/02#3", "function": "claude/policy/02", "rule": "RULE-059"}, {"key": "claude/policy/02/OQ-004", "code": "OQ-004", "text": "What are the valid commercial Status values and their meanings (e.g. quoted/accepted/rejected), and which program assigns them?", "owner": "Commercial underwriting SME", "unverified": false, "capability": "claude/policy/02#3", "function": "claude/policy/02", "rule": "RULE-060"}, {"key": "claude/policy/02/OQ-005", "code": "OQ-005", "text": "Is 02ICOM an intentional privileged/back-office lookup? Should the new system enforce customer ownership or role-based access on it?", "owner": "Security / compliance officer", "unverified": false, "capability": "claude/policy/02#4", "function": "claude/policy/02", "rule": "RULE-086"}, {"key": "claude/policy/02/OQ-006", "code": "OQ-006", "text": "Is the caller expected to receive one policy or a list from 03ICOM/05ICOM? Is the intended cap 20 rows, and should postcode search be limited?", "owner": "Commercial underwriting SME", "unverified": false, "capability": "claude/policy/02#4", "function": "claude/policy/02", "rule": "RULE-087"}, {"key": "claude/policy/03/OQ-001", "code": "OQ-001", "text": "Should payment amount be updatable through this path (the value is captured but discarded)?", "owner": "Policy administration lead", "unverified": false, "capability": "claude/policy/03#3", "function": "claude/policy/03", "rule": "RULE-053"}, {"key": "claude/policy/03/OQ-002", "code": "OQ-002", "text": "Should LGUPVS01 only be invoked when the DB2 update succeeded, and does LGUPVS01 itself check CA-RETURN-CODE?", "owner": "Mainframe application SME", "unverified": false, "capability": "claude/policy/03#4", "function": "claude/policy/03", "rule": "RULE-075"}, {"key": "claude/policy/04/OQ-001", "code": "OQ-001", "text": "Should deleting a policy that is already absent succeed (idempotent, as the comment says) or fail with 90 (as the code does)? Do all four policy-type tables really have ON DELETE CASCADE foreign keys to POLICY?", "owner": "Data architect / DBA", "unverified": false, "capability": "claude/policy/04#2", "function": "claude/policy/04", "rule": "RULE-052"}, {"key": "claude/policy/other/SME-001", "code": "RULE-017", "text": "P0 panel doubts spec fidelity: P0 is justified. The timestamp check is what stops one user's edit from silently overwriting another's (a lost update) on the policy record. That is a data-integrity rule, and the code does have it: legacy/genapp/base/src/lgupdb01.cbl:278 compares CA-LASTCHANGED with DB2-LASTCHANGED. The cursor declared at lines 129-141 does use WITH HOLD and FOR UPDATE, keyed on CU\u2026", "owner": "Subject-matter expert", "unverified": false, "capability": "claude/policy/other#1", "function": "claude/policy/other", "rule": "RULE-017"}, {"key": "claude/policy/other/SME-002", "code": "RULE-024", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (The card matches the code. In lgdpol01.cbl:106-130, a request shorter than WS-CA-HEADER-LEN gets return code '98' and the program returns. CA-REQUEST-ID is upper-cased with FUNCTION UPPER-CASE. Only 01DEND, 01DMOT, 01DHOU and 01DCOM go on to DELETE-POLICY-DB2-INFO; any other id gets '99' and nothing\u2026", "owner": "Subject-matter expert", "unverified": false, "capability": "claude/policy/other#1", "function": "claude/policy/other", "rule": "RULE-024"}, {"key": "claude/policy/other/SME-003", "code": "RULE-044", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (Judged through the compliance lens: a regulator, auditor or finance controller would not care if this changed silently. The rule checks that the request is long enough and routes it by type (legacy/genapp/base/src/lgupol01.cbl:113-141). It does not move money, price anything, apply a regulatory requ\u2026", "owner": "Subject-matter expert", "unverified": false, "capability": "claude/policy/other#1", "function": "claude/policy/other", "rule": "RULE-044"}, {"key": "claude/policy/other/SME-004", "code": "RULE-096", "text": "Citation was corrected by referee (The marker behaviour is real executable code, but the cited lines are the wrong case for this spec. Lines 416-417 of base/src/lgipdb01.cbl are in the endowment inquiry path. They run MOVE 'FINAL' TO CA-E-PADDING-DATA(END-POLICY-POS:5), where END-POLICY-POS starts at +1 (line 78) and has DB2-E-PADDING-LEN added to it at line 385. That puts the marker after the va\u2026", "owner": "Subject-matter expert", "unverified": false, "capability": "claude/policy/other#1", "function": "claude/policy/other", "rule": "RULE-096"}, {"key": "claude/ui/01/OQ-001", "code": "OQ-001", "text": "Is GENACNTL meant to be an authoritative range of customer numbers used by other processes (e.g. workload generators), and should HIGH only increase?", "owner": "Application owner", "unverified": false, "capability": "claude/ui/01#2", "function": "claude/ui/01", "rule": "RULE-010"}, {"key": "claude/ui/01/OQ-002", "code": "OQ-002", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (I checked the card against legacy/genapp/base/src/lgtestc1.cbl lines 113-146, plus the NO-ADD paragraph (263-265) and the WRITE-GENACNTL paragraph (283-334). The card matches the code. What the code does: - Option '2' sets request id '01ACUS' and customer number 0, then copies the screen fields into\u2026", "owner": "Customer services business owner", "unverified": false, "capability": "claude/ui/01#2", "function": "claude/ui/01", "rule": "RULE-033"}, {"key": "claude/ui/02/OQ-001", "code": "OQ-001", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (The rule matches the code. In legacy/genapp/base/src/lgtestp1.cbl lines 97-133, option '2' sends request '01AMOT' with the customer number the user typed. It always sets CA-PAYMENT to 0, CA-BROKERID to 0 and CA-BROKERSREF to 8 spaces, then copies the motor fields from the screen and calls LGAPOL01.\u2026", "owner": "Underwriting business owner", "unverified": false, "capability": "claude/ui/02#2", "function": "claude/ui/02", "rule": "RULE-036"}, {"key": "claude/ui/02/OQ-002", "code": "OQ-002", "text": "Does LGUPOL01 persist CA-PAYMENT/CA-BROKERID/CA-BROKERSREF on update? If so, is resetting them to zero intentional, and should a failed update roll back?", "owner": "Underwriting business owner", "unverified": false, "capability": "claude/ui/02#4", "function": "claude/ui/02", "rule": "RULE-065"}, {"key": "claude/ui/03/OQ-001", "code": "OQ-001", "text": "Is it intended that a terminal update resets an existing policy's broker id, broker reference and payment to zero/blank, or should these be preserved from the stored policy?", "owner": "Underwriting business owner", "unverified": false, "capability": "claude/ui/03#4", "function": "claude/ui/03", "rule": "RULE-090"}, {"key": "claude/ui/04/OQ-001", "code": "OQ-001", "text": "Is it intended that a terminal update resets an existing policy's broker id, broker reference and payment to zero/blank, or should these be preserved from the stored policy?", "owner": "Underwriting business owner", "unverified": false, "capability": "claude/ui/04#4", "function": "claude/ui/04", "rule": "RULE-090"}, {"key": "claude/ui/05/OQ-001", "code": "OQ-001", "text": "P0 panel split on whether this is critical to the system's core purpose or a costly-if-wrong rule (The rule matches the code. In lgtestp4.cbl lines 156-195, option '2' sets request ID '01ACOM'. It copies the screen fields into the commarea (customer, dates, address, postcode, lat/long, CA-B-Customer, property type, the four peril and premium pairs, status, reject reason) and LINKs to LGAPOL01 wit\u2026", "owner": "Commercial underwriting business owner", "unverified": false, "capability": "claude/ui/05#3", "function": "claude/ui/05", "rule": "RULE-071"}, {"key": "claude/ui/05/OQ-002", "code": "OQ-00
