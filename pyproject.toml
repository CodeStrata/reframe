[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe"
version = "0.4.0.dev0"
description = "Run an AWS Transform mainframe assessment end to end from one command, and bring back its requirements"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2,<3", "PyYAML>=6,<7"]

[project.scripts]
reframe = "reframe.core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reframe.infrastructure" = ["terraform/*/*.tf", "terraform/modules/*/*.tf"]
"reframe.report" = ["template.html"]
