[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe-v2"
version = "2.0.0.dev0"
description = "Reframe v2: mainframe repository to AI-DLC-ready package (in development, see docs/v2)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.18,<5", "mcp>=2,<3"]

[project.scripts]
reframe-v2 = "reframe_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reframe_v2.schemas" = ["*.schema.json"]
"reframe_v2" = ["terraform/README.md", "terraform/*/*.tf", "terraform/modules/*/*.tf"]
