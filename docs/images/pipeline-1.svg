<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1160" width="960" height="1160" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How a Reframe pipeline 1 run works</title>
  <desc id="desc">Ten stages run in order: 0 preflight, 1 snapshot, 2 AWS resources with Terraform (state bucket, source bucket and IAM roles, Neptune graph new or existing), 3 upload, 4 AWS Transform setup, 5 and 6 the job (analyze code and data, discover business functions, reimagine, generate requirements), 7 retrieval, 8 report, and 9 teardown on request. You sign in before the run, answer AWS's questions in interactive mode (Reframe answers them in autonomous mode and records why), read the report, and give consent before teardown deletes anything. Next, pipeline 2 runs the same assessment with Claude's code-modernization plugin and adds its graph to the same Neptune cluster.</desc>

  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9a9a96"/>
    </marker>
    <marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d6457a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="1160" rx="16" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1f1f1f">Reframe runs the assessment to the report; you sign in and approve teardown</text>
  <g font-size="14" fill="#333333">
    <rect x="40" y="70" width="16" height="16" rx="4" fill="#ffffff" stroke="#c4c4c0" stroke-width="1.5"/>
    <text x="64" y="83">Reframe</text>
    <rect x="150" y="70" width="16" height="16" rx="4" fill="#fdeee6" stroke="#e8673a" stroke-width="1.5"/>
    <text x="174" y="83">AWS Transform</text>
    <rect x="300" y="70" width="16" height="16" rx="4" fill="#efe9fb" stroke="#7b4fd0" stroke-width="1.5"/>
    <text x="324" y="83">Terraform</text>
    <rect x="420" y="70" width="16" height="16" rx="4" fill="#fbeaf0" stroke="#d6457a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="444" y="83">You</text>
    <rect x="500" y="70" width="16" height="16" rx="4" fill="#e8f0fb" stroke="#2f6fd0" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="524" y="83">Claude: the next pipeline</text>
  </g>
  <text x="40" y="114" font-size="13" fill="#555555">Every change in AWS is recorded before it is sent and confirmed after, so reframe resume never repeats one.</text>

  <!-- Main flow arrows -->
  <g stroke="#9a9a96" stroke-width="2" fill="none" marker-end="url(#flow)">
    <line x1="340" y1="194" x2="340" y2="218"/>
    <line x1="340" y1="284" x2="340" y2="308"/>
    <line x1="340" y1="428" x2="340" y2="452"/>
    <line x1="340" y1="518" x2="340" y2="542"/>
    <line x1="340" y1="608" x2="340" y2="632"/>
    <line x1="340" y1="752" x2="340" y2="776"/>
    <line x1="340" y1="842" x2="340" y2="866"/>
  </g>
  <!-- Teardown only on request -->
  <line x1="340" y1="932" x2="340" y2="956" stroke="#9a9a96" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#flow)"/>

  <!-- Where you come in -->
  <g stroke="#d6457a" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#gate)">
    <line x1="700" y1="162" x2="642" y2="162"/>
    <line x1="640" y1="660" x2="698" y2="660"/>
    <line x1="700" y1="728" x2="642" y2="728"/>
    <line x1="640" y1="900" x2="698" y2="900"/>
    <line x1="700" y1="990" x2="642" y2="990"/>
  </g>

  <!-- 0 Preflight -->
  <rect x="40" y="130" width="600" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="158" font-size="16" font-weight="700" fill="#1f1f1f">0 Preflight</text>
  <text x="60" y="180" font-size="13.5" fill="#555555">Tools, the AWS sign-in, the source, and AWS Transform ready in the region</text>
  <text x="620" y="158" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- 1 Snapshot -->
  <rect x="40" y="220" width="600" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="248" font-size="16" font-weight="700" fill="#1f1f1f">1 Snapshot</text>
  <text x="60" y="270" font-size="13.5" fill="#555555">A folder, a ZIP file, or a GitHub URL at a commit, as one ZIP</text>
  <text x="620" y="248" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- 2 AWS resources -->
  <rect x="40" y="310" width="600" height="118" rx="12" fill="#efefed" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="338" font-size="16" font-weight="700" fill="#1f1f1f">2 AWS resources</text>
  <text x="620" y="338" font-size="13" text-anchor="end" fill="#6a3fc0">Terraform</text>
  <g stroke="#7b4fd0" stroke-width="2" fill="#e6def6">
    <rect x="60" y="356" width="176" height="56" rx="10"/>
    <rect x="252" y="356" width="176" height="56" rx="10"/>
    <rect x="444" y="356" width="176" height="56" rx="10"/>
  </g>
  <g stroke="#9a9a96" stroke-width="1.5" fill="none" marker-end="url(#flow)">
    <line x1="237" y1="384" x2="250" y2="384"/>
    <line x1="429" y1="384" x2="442" y2="384"/>
  </g>
  <g text-anchor="middle">
    <text x="148" y="380" font-size="14" fill="#1f1f1f">State bucket</text>
    <text x="148" y="400" font-size="12.5" fill="#6b6b6b">for Terraform</text>
    <text x="340" y="380" font-size="14" fill="#1f1f1f">Source bucket, roles</text>
    <text x="340" y="400" font-size="12.5" fill="#6b6b6b">S3 and IAM</text>
    <text x="532" y="380" font-size="14" fill="#1f1f1f">Neptune graph</text>
    <text x="532" y="400" font-size="12.5" fill="#6b6b6b">new, or existing as is</text>
  </g>

  <!-- 3 Upload -->
  <rect x="40" y="454" width="600" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="482" font-size="16" font-weight="700" fill="#1f1f1f">3 Upload</text>
  <text x="60" y="504" font-size="13.5" fill="#555555">The snapshot to the source bucket, with a SHA-256 checksum</text>
  <text x="620" y="482" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- 4 AWS Transform setup -->
  <rect x="40" y="544" width="600" height="64" rx="12" fill="#fdeee6" stroke="#e8673a" stroke-width="2"/>
  <text x="60" y="572" font-size="16" font-weight="700" fill="#1f1f1f">4 AWS Transform setup</text>
  <text x="60" y="594" font-size="13.5" fill="#555555">The workspace, and the reimagine connector to the Neptune graph</text>
  <text x="620" y="572" font-size="13" text-anchor="end" fill="#b4461d">AWS Transform</text>

  <!-- 5-6 The job -->
  <rect x="40" y="634" width="600" height="118" rx="12" fill="#efefed" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="662" font-size="16" font-weight="700" fill="#1f1f1f">5–6 The job, driven to the end</text>
  <text x="620" y="662" font-size="13" text-anchor="end" fill="#b4461d">AWS Transform</text>
  <g stroke="#e8673a" stroke-width="2" fill="#fbe2d6">
    <rect x="60" y="680" width="128" height="56" rx="10"/>
    <rect x="204" y="680" width="128" height="56" rx="10"/>
    <rect x="348" y="680" width="128" height="56" rx="10"/>
    <rect x="492" y="680" width="128" height="56" rx="10"/>
  </g>
  <g stroke="#9a9a96" stroke-width="1.5" fill="none" marker-end="url(#flow)">
    <line x1="189" y1="708" x2="202" y2="708"/>
    <line x1="333" y1="708" x2="346" y2="708"/>
    <line x1="477" y1="708" x2="490" y2="708"/>
  </g>
  <g text-anchor="middle">
    <text x="124" y="704" font-size="13.5" fill="#1f1f1f">Analyze</text>
    <text x="124" y="724" font-size="12.5" fill="#6b6b6b">code and data</text>
    <text x="268" y="704" font-size="13.5" fill="#1f1f1f">Discover</text>
    <text x="268" y="724" font-size="12.5" fill="#6b6b6b">business functions</text>
    <text x="412" y="704" font-size="13.5" fill="#1f1f1f">Reimagine</text>
    <text x="412" y="724" font-size="12.5" fill="#6b6b6b">what was selected</text>
    <text x="556" y="704" font-size="13.5" fill="#1f1f1f">Generate</text>
    <text x="556" y="724" font-size="12.5" fill="#6b6b6b">requirements</text>
  </g>

  <!-- 7 Retrieval -->
  <rect x="40" y="778" width="600" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="806" font-size="16" font-weight="700" fill="#1f1f1f">7 Retrieval</text>
  <text x="60" y="828" font-size="13.5" fill="#555555">Requirements, assessment and the business function catalog, from S3</text>
  <text x="620" y="806" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- 8 Report -->
  <rect x="40" y="868" width="600" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="896" font-size="16" font-weight="700" fill="#1f1f1f">8 Report</text>
  <text x="60" y="918" font-size="13.5" fill="#555555">One HTML page: domains, requirements, rules, questions, data model</text>
  <text x="620" y="896" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- 9 Teardown -->
  <rect x="40" y="958" width="600" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="986" font-size="16" font-weight="700" fill="#1f1f1f">9 Teardown, only when you ask</text>
  <text x="60" y="1008" font-size="13.5" fill="#555555">Job, workspace, connector, network, Neptune and buckets, in order</text>
  <text x="620" y="986" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- Next: pipeline 2 -->
  <rect x="40" y="1052" width="600" height="84" rx="12" fill="#e8f0fb" stroke="#2f6fd0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="60" y="1080" font-size="16" font-weight="700" fill="#1f1f1f">Next: pipeline 2, with Claude</text>
  <text x="60" y="1102" font-size="13.5" fill="#555555">The code-modernization plugin runs the same assessment and adds</text>
  <text x="60" y="1122" font-size="13.5" fill="#555555">its graph to the same Neptune cluster, to compare the two</text>
  <text x="620" y="1080" font-size="13" text-anchor="end" fill="#2f6fd0">Claude</text>

  <!-- You: sign in -->
  <rect x="700" y="130" width="220" height="160" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="718" y="160" font-size="16" font-weight="700" fill="#1f1f1f">Sign in</text>
  <text x="718" y="184" font-size="13.5" fill="#333333">aws sso login, the only</text>
  <text x="718" y="204" font-size="13.5" fill="#333333">input a run needs</text>
  <text x="718" y="230" font-size="12.5" fill="#6b6b6b">You</text>
  <text x="718" y="260" font-size="12" fill="#b03a64">Expired: sign in, reframe resume</text>

  <!-- You: questions -->
  <rect x="700" y="610" width="220" height="160" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="718" y="640" font-size="16" font-weight="700" fill="#1f1f1f">AWS's questions</text>
  <text x="718" y="664" font-size="13.5" fill="#333333">Autonomous: Reframe</text>
  <text x="718" y="684" font-size="13.5" fill="#333333">answers and records why</text>
  <text x="718" y="710" font-size="12.5" fill="#6b6b6b">Interactive: you answer</text>
  <text x="718" y="740" font-size="12" fill="#b03a64">with reframe answer</text>

  <!-- You: report -->
  <rect x="700" y="852" width="220" height="96" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="718" y="882" font-size="16" font-weight="700" fill="#1f1f1f">Read the report</text>
  <text x="718" y="906" font-size="13.5" fill="#333333">reframe report --open</text>
  <text x="718" y="930" font-size="12.5" fill="#6b6b6b">You</text>

  <!-- You: consent -->
  <rect x="700" y="958" width="220" height="160" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="718" y="988" font-size="16" font-weight="700" fill="#1f1f1f">Consent</text>
  <text x="718" y="1012" font-size="13.5" fill="#333333">Every resource listed;</text>
  <text x="718" y="1032" font-size="13.5" fill="#333333">you type yes</text>
  <text x="718" y="1058" font-size="12.5" fill="#6b6b6b">Recorded before deleting</text>
  <text x="718" y="1088" font-size="12" fill="#b03a64">Nothing is found by name</text>
</svg>
