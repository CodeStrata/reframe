<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1144" width="1200" height="1144" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How a Reframe run works</title>
  <desc id="desc">A run starts with the prerequisites, the AWS sign-in, the source and a snapshot, then Terraform creates the buckets, roles and a Neptune graph. Two pipelines then run side by side on the same snapshot: pipeline 1 uploads it and drives the AWS Transform job (analysis, business functions, reimagine, requirements) and retrieves the results; pipeline 2 starts as soon as the Neptune graph exists, runs Claude's code-modernization plugin (assess and map, rule cards), puts its results in AWS Transform's shape with requirements generated by Reframe, and loads Claude's graph into the same Neptune cluster. Reframe then builds AWS Transform's business review, Claude's business review and the comparison. Pipeline 3, reframe reconcile, then reconciles the two: rules both tools describe the same way are agreed without an agent, every other rule is decided by Claude against the source code with evidence Reframe checks, both tools' open questions become one SME list with the possible defects found in the code, and recommended requirements and the reconciliation page are written from the result; it needs no AWS resources. reframe publish makes a cleaned copy to share. Teardown runs only when you ask. You sign in, answer questions in interactive mode and set Claude's agent limit, review and compare, give pipeline 3 your context and answers, and consent before teardown deletes anything.</desc>

  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9a9a96"/>
    </marker>
    <marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d6457a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1144" rx="16" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1f1f1f">Reframe assesses one snapshot with AWS Transform and with Claude, then reconciles the two against the code</text>
  <g font-size="14" fill="#333333">
    <rect x="40" y="70" width="16" height="16" rx="4" fill="#ffffff" stroke="#c4c4c0" stroke-width="1.5"/>
    <text x="64" y="83">Reframe</text>
    <rect x="150" y="70" width="16" height="16" rx="4" fill="#fdeee6" stroke="#e8673a" stroke-width="1.5"/>
    <text x="174" y="83">AWS Transform</text>
    <rect x="300" y="70" width="16" height="16" rx="4" fill="#e8f0fb" stroke="#2f6fd0" stroke-width="1.5"/>
    <text x="324" y="83">Claude</text>
    <rect x="400" y="70" width="16" height="16" rx="4" fill="#efe9fb" stroke="#7b4fd0" stroke-width="1.5"/>
    <text x="424" y="83">Terraform and Neptune</text>
    <rect x="600" y="70" width="16" height="16" rx="4" fill="#fbeaf0" stroke="#d6457a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="624" y="83">You</text>
  </g>
  <text x="40" y="114" font-size="13" fill="#555555">Every change and step leaves a receipt, so reframe resume continues where a run stopped, after a sign-in or Claude's usage limit.</text>

  <!-- Flow arrows -->
  <g stroke="#9a9a96" stroke-width="2" fill="none" marker-end="url(#flow)">
    <line x1="470" y1="194" x2="470" y2="218"/>
    <path d="M470 284 V302 H245 V326"/>
    <path d="M470 302 H695 V326"/>
    <line x1="245" y1="392" x2="245" y2="416"/>
    <line x1="695" y1="392" x2="695" y2="416"/>
    <line x1="245" y1="536" x2="245" y2="560"/>
    <line x1="695" y1="536" x2="695" y2="560"/>
    <path d="M245 626 V650 H470 V674"/>
    <path d="M695 626 V650 H470"/>
    <line x1="470" y1="794" x2="470" y2="818"/>
    <line x1="470" y1="938" x2="470" y2="962"/>
  </g>
  <line x1="470" y1="1028" x2="470" y2="1052" stroke="#9a9a96" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#flow)"/>

  <!-- Where you come in -->
  <g stroke="#d6457a" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#gate)">
    <line x1="940" y1="162" x2="902" y2="162"/>
    <line x1="940" y1="476" x2="902" y2="476"/>
    <line x1="900" y1="734" x2="938" y2="734"/>
    <line x1="940" y1="880" x2="902" y2="880"/>
    <line x1="940" y1="1086" x2="902" y2="1086"/>
  </g>

  <!-- 1 Start -->
  <rect x="40" y="130" width="860" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="158" font-size="16" font-weight="700" fill="#1f1f1f">1 Start</text>
  <text x="60" y="180" font-size="13.5" fill="#555555">reframe run checks the prerequisites and the sign-in, takes the source, and makes one snapshot of it</text>
  <text x="880" y="158" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- 2 AWS resources -->
  <rect x="40" y="220" width="860" height="64" rx="12" fill="#efe9fb" stroke="#7b4fd0" stroke-width="2"/>
  <text x="60" y="248" font-size="16" font-weight="700" fill="#1f1f1f">2 AWS resources</text>
  <text x="60" y="270" font-size="13.5" fill="#555555">Buckets, roles and a Neptune graph, new or existing; both pipelines start from here</text>
  <text x="880" y="248" font-size="13" text-anchor="end" fill="#6a3fc0">Terraform</text>

  <!-- Pipeline 1: AWS Transform -->
  <rect x="40" y="328" width="410" height="64" rx="12" fill="#fdeee6" stroke="#e8673a" stroke-width="2"/>
  <text x="60" y="356" font-size="16" font-weight="700" fill="#1f1f1f">Pipeline 1: AWS Transform</text>
  <text x="60" y="378" font-size="13.5" fill="#555555">The snapshot to S3, the workspace and connector</text>

  <rect x="40" y="418" width="410" height="118" rx="12" fill="#efefed" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="446" font-size="16" font-weight="700" fill="#1f1f1f">The job, driven to the end</text>
  <text x="430" y="446" font-size="13" text-anchor="end" fill="#b4461d">AWS Transform</text>
  <g stroke="#e8673a" stroke-width="2" fill="#fbe2d6">
    <rect x="60" y="464" width="178" height="56" rx="10"/>
    <rect x="252" y="464" width="178" height="56" rx="10"/>
  </g>
  <line x1="239" y1="492" x2="250" y2="492" stroke="#9a9a96" stroke-width="1.5" marker-end="url(#flow)"/>
  <g text-anchor="middle">
    <text x="149" y="488" font-size="13.5" fill="#1f1f1f">Analyze, discover</text>
    <text x="149" y="508" font-size="12.5" fill="#6b6b6b">code, data, functions</text>
    <text x="341" y="488" font-size="13.5" fill="#1f1f1f">Reimagine</text>
    <text x="341" y="508" font-size="12.5" fill="#6b6b6b">requirements, rules</text>
  </g>

  <rect x="40" y="562" width="410" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="590" font-size="16" font-weight="700" fill="#1f1f1f">Retrieval</text>
  <text x="60" y="612" font-size="13.5" fill="#555555">Requirements, assessment and catalog, from S3</text>
  <text x="430" y="590" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- Pipeline 2: Claude -->
  <rect x="490" y="328" width="410" height="64" rx="12" fill="#e8f0fb" stroke="#2f6fd0" stroke-width="2"/>
  <text x="510" y="356" font-size="16" font-weight="700" fill="#1f1f1f">Pipeline 2: Claude, alongside</text>
  <text x="510" y="378" font-size="13.5" fill="#555555">The same snapshot, read-only; the pinned plugin</text>

  <rect x="490" y="418" width="410" height="118" rx="12" fill="#efefed" stroke="#c4c4c0" stroke-width="2"/>
  <text x="510" y="446" font-size="16" font-weight="700" fill="#1f1f1f">The plugin's assessment</text>
  <text x="880" y="446" font-size="13" text-anchor="end" fill="#2f6fd0">Claude</text>
  <g stroke="#2f6fd0" stroke-width="2" fill="#dce8fa">
    <rect x="510" y="464" width="178" height="56" rx="10"/>
    <rect x="702" y="464" width="178" height="56" rx="10"/>
  </g>
  <line x1="689" y1="492" x2="700" y2="492" stroke="#9a9a96" stroke-width="1.5" marker-end="url(#flow)"/>
  <g text-anchor="middle">
    <text x="599" y="488" font-size="13.5" fill="#1f1f1f">Assess and map</text>
    <text x="599" y="508" font-size="12.5" fill="#6b6b6b">domains, flows</text>
    <text x="791" y="488" font-size="13.5" fill="#1f1f1f">Extract rules</text>
    <text x="791" y="508" font-size="12.5" fill="#6b6b6b">rule cards</text>
  </g>

  <rect x="490" y="562" width="410" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="510" y="590" font-size="16" font-weight="700" fill="#1f1f1f">In AWS Transform's shape</text>
  <text x="510" y="612" font-size="13.5" fill="#555555">Requirements generated; graph into the same Neptune</text>
  <text x="880" y="590" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- 3 Reports -->
  <rect x="40" y="676" width="860" height="118" rx="12" fill="#efefed" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="704" font-size="16" font-weight="700" fill="#1f1f1f">3 Reports</text>
  <text x="880" y="704" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>
  <g stroke="#c4c4c0" stroke-width="2" fill="#ffffff">
    <rect x="60" y="722" width="260" height="56" rx="10"/>
    <rect x="340" y="722" width="260" height="56" rx="10"/>
    <rect x="620" y="722" width="260" height="56" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="190" y="746" font-size="13.5" fill="#1f1f1f">AWS Transform's review</text>
    <text x="190" y="766" font-size="12.5" fill="#6b6b6b">domains down to each requirement</text>
    <text x="470" y="746" font-size="13.5" fill="#1f1f1f">Claude's review</text>
    <text x="470" y="766" font-size="12.5" fill="#6b6b6b">the same layout</text>
    <text x="750" y="746" font-size="13.5" fill="#1f1f1f">The comparison</text>
    <text x="750" y="766" font-size="12.5" fill="#6b6b6b">where they agree and differ</text>
  </g>

  <!-- 4 Pipeline 3: reconcile -->
  <rect x="40" y="820" width="860" height="118" rx="12" fill="#efefed" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="848" font-size="16" font-weight="700" fill="#1f1f1f">4 Pipeline 3: reconcile against the source</text>
  <text x="880" y="848" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe and Claude · no AWS resources</text>
  <g stroke-width="2">
    <rect x="60" y="866" width="190" height="56" rx="10" fill="#ffffff" stroke="#c4c4c0"/>
    <rect x="264" y="866" width="190" height="56" rx="10" fill="#dce8fa" stroke="#2f6fd0"/>
    <rect x="468" y="866" width="190" height="56" rx="10" fill="#dce8fa" stroke="#2f6fd0"/>
    <rect x="672" y="866" width="208" height="56" rx="10" fill="#dce8fa" stroke="#2f6fd0"/>
  </g>
  <g stroke="#9a9a96" stroke-width="1.5" fill="none" marker-end="url(#flow)">
    <line x1="251" y1="894" x2="262" y2="894"/>
    <line x1="455" y1="894" x2="466" y2="894"/>
    <line x1="659" y1="894" x2="670" y2="894"/>
  </g>
  <g text-anchor="middle">
    <text x="155" y="890" font-size="13.5" fill="#1f1f1f">Agree</text>
    <text x="155" y="910" font-size="12.5" fill="#6b6b6b">the same rule: no agent</text>
    <text x="359" y="890" font-size="13.5" fill="#1f1f1f">Decide against the code</text>
    <text x="359" y="910" font-size="12.5" fill="#6b6b6b">evidence checked</text>
    <text x="563" y="890" font-size="13.5" fill="#1f1f1f">One SME list</text>
    <text x="563" y="910" font-size="12.5" fill="#6b6b6b">questions, possible defects</text>
    <text x="776" y="890" font-size="13.5" fill="#1f1f1f">Requirements, page</text>
    <text x="776" y="910" font-size="12.5" fill="#6b6b6b">the reconciled review</text>
  </g>

  <!-- 5 Share -->
  <rect x="40" y="964" width="860" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="992" font-size="16" font-weight="700" fill="#1f1f1f">5 Share</text>
  <text x="60" y="1014" font-size="13.5" fill="#555555">reframe publish: a copy of the reports, cleaned of the account's identifiers, that anyone can open</text>
  <text x="880" y="992" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- 6 Teardown -->
  <rect x="40" y="1054" width="860" height="64" rx="12" fill="#ffffff" stroke="#c4c4c0" stroke-width="2"/>
  <text x="60" y="1082" font-size="16" font-weight="700" fill="#1f1f1f">6 Teardown, only when you ask</text>
  <text x="60" y="1104" font-size="13.5" fill="#555555">Everything the run created, by its own records, in order</text>
  <text x="880" y="1082" font-size="13" text-anchor="end" fill="#6b6b6b">Reframe</text>

  <!-- You -->
  <rect x="940" y="130" width="220" height="96" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="958" y="160" font-size="16" font-weight="700" fill="#1f1f1f">Sign in</text>
  <text x="958" y="184" font-size="13.5" fill="#333333">aws sso login, and Claude:</text>
  <text x="958" y="204" font-size="13.5" fill="#333333">subscription or Bedrock</text>

  <rect x="940" y="410" width="220" height="132" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="958" y="440" font-size="16" font-weight="700" fill="#1f1f1f">Questions and limits</text>
  <text x="958" y="464" font-size="13.5" fill="#333333">Autonomous: Reframe</text>
  <text x="958" y="484" font-size="13.5" fill="#333333">answers and records why</text>
  <text x="958" y="508" font-size="13.5" fill="#333333">Claude's agent limit</text>
  <text x="958" y="530" font-size="12" fill="#b03a64">or reframe answer</text>

  <rect x="940" y="676" width="220" height="118" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="958" y="706" font-size="16" font-weight="700" fill="#1f1f1f">Review and compare</text>
  <text x="958" y="730" font-size="13.5" fill="#333333">reframe report --open</text>
  <text x="958" y="750" font-size="13.5" fill="#333333">reframe compare --open</text>
  <text x="958" y="776" font-size="12.5" fill="#6b6b6b">Mark, comment, download</text>

  <rect x="940" y="820" width="220" height="118" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="958" y="850" font-size="16" font-weight="700" fill="#1f1f1f">Context and answers</text>
  <text x="958" y="874" font-size="13.5" fill="#333333">Documents, review marks,</text>
  <text x="958" y="894" font-size="13.5" fill="#333333">the answered SME list</text>
  <text x="958" y="920" font-size="12" fill="#b03a64">run again: only what changed</text>

  <rect x="940" y="1054" width="220" height="64" rx="12" fill="#fbeaf0" stroke="#d6457a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="958" y="1084" font-size="16" font-weight="700" fill="#1f1f1f">Consent</text>
  <text x="958" y="1106" font-size="13.5" fill="#333333">Type yes to the full list</text>
</svg>
